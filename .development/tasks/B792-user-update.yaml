dod:
  - text: Every named description case proves its precise branch; postgres_pinned_rows and
      postgres_failure_effects cover encrypted callback variables, permission-first writes,
      email insertion and post-write failure effects.
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: The independently initialized Postgres data and failure write effects match the pinned contract.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^user_update::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_update::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/user_update::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::user_update::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/user-update-*")"
        && grep -rlq "max_internal_user_budget" crates/betterlite-config/fuzz/corpus/config_yaml/user-update-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
