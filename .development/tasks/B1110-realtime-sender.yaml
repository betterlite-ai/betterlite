id: B1110
title: Realtime send boundary
description: >-
  Implement the complete sender methods at realtime_streaming.py:427-547,655-706,723-735 in
  betterlite-core::api::realtime_sender. B1006 supplies state, B1004 frame decoding/provider interfaces,
  B1005 beta conversion and B2455 guardrail selection/setup patches. This includes
  _send_to_backend,_enforce_transcription_session_model,_should_drop_event_from_client,
  _normalize_event_for_ga_client,_event_to_client_json,_send_event_to_client,
  _cache_session_configuration_request and _maybe_send_guardrail_turn_detection_update.
  None of those callees may be implemented in B1007 or a relay that depends on this sender.

  Force authorized transcription models before provider transformation. A provider may return zero,
  one or many text/binary frames. Binary frames await pace_backend_send first. Setup after content
  is debug-logged and dropped. Cache/update content state after successful sends, preserving the
  source exception that guardrail setup injection sets its own flag before the send. Without a
  provider config, send the original/enforced text directly and do not invent provider state updates.

  Add B901 service driver realtime_sender with a real mock upstream WebSocket and a bounded scripted
  client sink. Compare ordered frames and state snapshots; pure HelperCall cannot prove sends.
  Use deterministic transport barriers for send failures and no timing assumptions. B1004's decoder
  already fuzzes these bytes. Count 158 nonblank/non-comment lines in whole methods; budget 155
  implementation,145 tests,115 transcripts,95 service adapters and 30 wiring =540 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/realtime_sender.rs
  - crates/betterlite-core/src/api/realtime_sender/**
  - tools/oracle/src/websocket_driver.rs
  - tools/oracle/src/websocket_driver/realtime_sender.rs
  - tools/oracle/src/helpers/core_ops/realtime_sender_websocket.rs
  - tools/oracle/src/helpers/core_ops/realtime_sender_websocket/**
  - tools/oracle/helpers/realtime_sender_websocket.py
  - tools/oracle/helpers/realtime_sender_websocket/**
  - tools/oracle/cases/websocket/realtime-sender/**
  - tools/oracle/fuzz/corpus/websocket_oracle/realtime-sender-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L427-L547
  why: Whole backend sender and authorized transcription-model enforcement, including send-before-state ordering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L655-L706
  why: Normalizer/drop/beta client forwarding and cache updates after setup sends.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L723-L735
  why: Standalone VAD disable retries when a provider transform drops the previous attempt.
dod:
- text: >-
    realtime_backend_send_order transforms one input into setup,text-content,binary. Capture that order,
    with pace_backend_send before binary delivery; return true and content_sent_after_setup=true. Empty
    transform returns false and leaves state unchanged. A later setup is dropped with "Dropping follow-up
    setup after content was already sent to backend". Malformed transformed JSON is still sent as text.
    A failed text/setup send leaves session_configuration_request and content flag unchanged; a binary
    pacing/send failure also leaves content unset. Without a provider, one raw text send returns true.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_authorized_transcription_model sets forced model=allowed and sends session.update and
    transcription_session.update carrying flat model=forbidden and GA audio.input.transcription.model=other.
    Both become allowed while language and sibling audio fields survive. Existing empty transcription
    objects gain model; missing/nonobject transcription objects are not created. session.type=transcription
    marks state. Forced model=None leaves both nested models untouched; unrelated events and invalid JSON
    retain original bytes. Top-level session.model is not rewritten by this method. A JSON nonobject that
    reaches .get fails as the source does, rather than passing through silently.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_client_send_translation drops a normalizer-rejected event and returns false. Otherwise normalize
    first, then beta-translate for a beta client. conversation.item.done drops; output_text becomes text.
    A nonobject event sends the supplied event_str unchanged. If beta translation or its send raises,
    log warning "Failed to translate %s to beta protocol, forwarding untranslated event to client: %s"
    and attempt the normalized untranslated event; if that send also fails, propagate. Native fault injection
    distinguishes this two-attempt fallback from a successful single send.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_setup_cache_and_guardrail_retry caches any successfully sent JSON object containing setup,
    including setup=null, replacing the earlier cached payload. Non-setup and invalid JSON do not alter it.
    With audio transcription guardrails, a dropped disable update leaves sent=false and a second invocation
    retries; a successful send sets true and suppresses later updates. No guardrail sends nothing. Setup
    injection's pre-send flag remains true after a failed setup send, while cached setup stays unchanged.
    Beta disable is flat turn_detection; GA uses session.type=realtime and audio.input.turn_detection.
  proof: [behavior-tests, oracle, service-python]
- text: New service transcripts and seeds exercise real WebSocket sends in both implementations.
  proof: [service-corpus, new-cases, oracle, service-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: State must change only at the source's precise send boundaries.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_sender::tests::/)'
  - id: service-python
    why: Sender parity uses B901's service driver rather than a helper pretending to deliver frames.
    run: test -f tools/oracle/helpers/realtime_sender_websocket.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: service-corpus
    why: The realtime_sender service tag needs a bounded transcript seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle/realtime-sender-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: new-cases
    why: Sender cases must capture upstream frames and client forwarding separately.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-sender)"
oracle_cases:
- tools/oracle/cases/websocket/realtime-sender/realtime-backend-send-order.yaml
- tools/oracle/cases/websocket/realtime-sender/realtime-authorized-transcription-model.yaml
- tools/oracle/cases/websocket/realtime-sender/realtime-client-send-translation.yaml
- tools/oracle/cases/websocket/realtime-sender/realtime-setup-cache-and-guardrail-retry.yaml
deviations: []
out_of_scope:
- B2455 owns _make_disable_auto_response_message,_maybe_inject_guardrail_auto_response_disable and guardrail predicates; B1007 owns the runner. _has_realtime_guardrails has no caller at the pin.
- Remaining realtime_streaming.py functions are B1004 contracts, B1005 beta transforms, B1006 state/logging, B1124 buffering, B1008 backend relay and B1009 client relay.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_sender_websocket in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/realtime_sender_websocket.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_sender_websocket.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A failed beta client send enters the same warning/fallback branch as a translation failure and can cause a second send attempt.
- Authorized transcription enforcement rewrites existing nested dictionaries but does not insert missing ones.
- Guardrail setup injection and successful-send cache mutation intentionally have different commit points.
review_level: security
budget:
  max_changed_lines: 550
  max_new_expects: 0
