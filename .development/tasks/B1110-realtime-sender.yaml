id: B1110
title: Realtime send boundary
description: >-
  Send prepared realtime frames through a configured backend, honoring setup readiness and provider pacing. Keep
  event normalization and logging independent of the two relay loops.


  The sender receives a typed GuardrailMode fact (whether realtime or audio-transcription hooks exist) from B1009
  construction. _maybe_inject_guardrail_auto_response_disable uses that fact; it never calls the upper guardrail
  executor.


  Reuse B1004 decode_realtime_contract for _decode_json_object call sites; calling a lower decoder does not define
  another fuzz target.


  Implement crates/betterlite-core/src/api/realtime_sender.rs. Use RealtimeSenderInput and RealtimeSenderResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions source_success, source_failure, source_defaults under api::realtime_sender::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  The production external-byte decoder is betterlite-core::api::realtime_sender::decode_realtime_sender(bytes: &[u8],
  limits: &ApiLimits), for json.loads input setup_message at litellm/litellm_core_utils/realtime_streaming.py:753.
  Place its implementation in crates/betterlite-core/src/api/realtime_sender.rs and call it from the actual boundary.
  The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/realtime_sender.rs passes arbitrary bounded bytes
  to that exact decoder; api::realtime_sender::tests::replays_corpus replays newly committed seeds through the same
  function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::RealtimeSender in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {realtime_sender: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._send_to_backend (L427-L479);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._enforce_transcription_session_model (L481-L547);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._should_drop_event_from_client (L655-L659);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._normalize_event_for_ga_client (L661-L665);
  litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._event_to_client_json (L667-L668); litellm/litellm_core_utils/realtime_streaming.py:
  RealTimeStreaming._send_event_to_client (L670-L690); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._cache_session_configuration_request
  (L692-L706); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._make_disable_auto_response_message
  (L708-L721); litellm/litellm_core_utils/realtime_streaming.py: RealTimeStreaming._maybe_inject_guardrail_auto_response_disable
  (L737-L765). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 152 owned nonblank/non-comment/non-docstring Python lines (191 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 172 implementation,
  58 behavior tests, 36 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 446 total within the 450-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B1004 (Realtime contracts), B1005 (Realtime beta protocol), B171 (Direct helper oracle
  and URL path encoding), B1087 (Api boundaries). These are callable/type/config owners, not provider-family umbrellas;
  the external B500-B859 ids retain ownership on the provider and keys/data branches.
