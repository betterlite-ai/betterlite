checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_sender::/) - test(/::replays_corpus$/)'
  - id: case-source-success
    why: the source-success behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_sender::tests::source_success($|::)/)'
  - id: case-source-failure
    why: the source-failure behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_sender::tests::source_failure($|::)/)'
  - id: case-source-defaults
    why: the source-defaults behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_sender::tests::source_defaults($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/realtime_sender)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/realtime_sender.rs && grep -qF "decode_realtime_sender"
      crates/betterlite-core/fuzz/fuzz_targets/realtime_sender.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::realtime_sender::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/realtime_sender.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/realtime_sender-*)"
      && grep -qE "^[[:space:]]+realtime_sender:" tools/oracle/fuzz/corpus/helper_case/realtime_sender-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/realtime-sender)"
