dod:
- text: 'assistant create tools: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-assistant-create-tools
  - oracle
- text: 'assistant provider error: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-assistant-provider-error
  - oracle
- text: Every enumerated config/environment setting loads, defaults and changes the typed settings; existing YAML
    fuzz corpus exercises the new keys.
  proof:
  - config-tests
  - config-corpus
- text: The independent Rust/Python helper adapter and the externally tagged case seed execute through B171.
  proof:
  - oracle
  - helper-python
  - helper-corpus
- text: Every listed case is a newly added parity fixture and compares independent native and pinned results.
  proof:
  - new-oracle-cases
  - oracle
  - helper-python
  - helper-corpus
checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::assistant_records::/)
      - test(/::replays_corpus$/)'
  - id: case-assistant-create-tools
    why: the assistant-create-tools behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_records::tests::assistant_create_tools($|::)/)'
  - id: case-assistant-provider-error
    why: the assistant-provider-error behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_records::tests::assistant_provider_error($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::assistant_records::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/assistant-records-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/assistant_records.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/assistant_records-*)"
      && grep -qE "^[[:space:]]+assistant_records:" tools/oracle/fuzz/corpus/helper_case/assistant_records-* &&
      cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/assistant-records)"
