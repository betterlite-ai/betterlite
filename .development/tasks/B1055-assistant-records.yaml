id: B1055
title: Assistant creation SDK wrappers
description: >-
  Build complete create_assistants/acreate_assistants in core::api::assistant_records. The name records
  is historical: this task executes provider I/O through B519 OpenAI and B686 Azure definition methods.
  Use B010 GenericLiteLLMParams, B176 get_litellm_params, B174 provider resolution, B011 async exception
  mapping and B2487 loaded resource settings/timeout capability. B2401 AssistantCreate cases make actual
  SDK calls to the mock. No dependency on get/delete SDK operations is needed.

  Provider/model are required; name,description,instructions,tools,tool_resources,metadata,temperature,
  top_p,response_format,client,api_key,api_base,api_version default null. Drop only null request fields.
  Async pops model from kwargs with null default, sets async_create_assistants=true, forwards client and
  preserves context. Source functions contain 155 nonblank/non-comment lines; allow 180 implementation,
  145 tests, 85 adapters, 125 fixtures and 40 wiring/corpus, 575 total. B519 owns typed wire records and
  response parsing; B2487 owns settings loader checks. This wrapper adds no parser.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/assistant_records.rs
  - crates/betterlite-core/src/api/assistant_records/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/assistant_create.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/assistant_create.py
  - tools/oracle/cases/sdk-http/assistant-create/**
  - tools/oracle/fuzz/corpus/sdk_http_case/assistant-create-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L193-L371
  why: Both complete creation functions filter null fields, reject nonboolean async flags and handle Azure clients/tokens specially.
dod:
- text: >-
    assistant_create_optional_values calls both modes with provider=openai,model=gpt-4o-mini and gets
    POST /v1/assistants body {model:gpt-4o-mini},OpenAI-Beta=assistants=v2. Then send name="",description="",
    instructions="",tools=[],tool_resources={},metadata={},temperature=0,top_p=0,response_format={type:json_object};
    every supplied falsey value survives. Null values are absent. Mock {id:asst_a,object:assistant,model:gpt-4o-mini,
    created_at:1,name:null,tools:[]} is returned. Unknown kwargs are not added to create_assistant_data.
  proof: [assistant-tests, oracle, python-adapter]
- text: >-
    assistant_create_credentials uses the B2487 OpenAI/Azure settings chains; test each request/global/env
    winner with distinct mock origins and header values, including OpenAI-Organization and Azure api-version.
    Missing base defaults https://api.openai.com/v1 for OpenAI, null for Azure. Timeout follows timeout or
    request_timeout or 600; 0 falls through, "7.5" converts and structured timeout survives these providers.
    max_retries and client pass to OpenAI. Native client capture shows Azure discards any isinstance(OpenAI)
    client, including AzureOpenAI subclasses, but does not discard AsyncOpenAI through that sync type test.
  proof: [assistant-tests, oracle, python-adapter]
- text: >-
    assistant_create_azure_token sets AZURE_AD_TOKEN=env-token. Omitted extra_body and explicit {} leave
    token null; extra_body=null selects env-token; {azure_ad_token:body-token,other:x} selects body-token,
    removes its key from the input extra_body map and does not forward other:x as assistant body. Azure
    receives B176 litellm_params separately. A top-level azure_ad_token is handled only by the provider's
    B176 controls, not mistaken for this extra_body branch. Compare provider Authorization/api-key against
    B686's selected authentication mode with a fixture omitting static api_key when testing bearer auth.
  proof: [assistant-tests, oracle, python-adapter]
- text: >-
    assistant_create_flag_and_failures tests native async_create_assistants=null,false,true as legal;
    1 and "true" raise ValueError "Invalid value passed in for async_create_assistants. Only bool or None allowed"
    before provider construction. Unsupported anthropic produces BadRequestError,400,type/param/code=null,
    source message="LiteLLM doesn't support anthropic for 'create_assistants'. Only 'openai' is supported.".
    Native null provider result produces InternalServerError,500,type=internal_server_error,param/code=null,
    message="No response returned from 'create_assistants'". Async provider failure is mapped with model
    equal to the popped model and completion_kwargs={}; copied context is retained. Mock provider 404
    returns NotFoundError,404; sync preserves supplied provider body type=invalid_request_error,param=assistant_id,
    code=missing while async uses B011's mapped null type/param/code. Add SDK seeds for both modes.
  proof: [assistant-tests, oracle, python-adapter, sdk-corpus]
checks:
  optional: []
  commands:
  - id: assistant-tests
    why: assistant creation drops falsey fields or changes Azure/client and failure branches
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::assistant_records::tests::/) - test(/::replays_corpus$/)'
  - id: python-adapter
    why: creation is not compared through independent SDK HTTP
    run: test -f tools/oracle/sdk_http/assistant_create.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: no new assistant-create seed reaches B2401's case decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/assistant-create-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/assistant-create/assistant-create-optional-values.yaml
- tools/oracle/cases/sdk-http/assistant-create/assistant-create-credentials.yaml
- tools/oracle/cases/sdk-http/assistant-create/assistant-create-azure-token.yaml
- tools/oracle/cases/sdk-http/assistant-create/assistant-create-flag-and-failures.yaml
deviations: []
out_of_scope:
- B1130 owns get/delete assistants, B1056 threads, B1057 messages and B089's SDK split runs. Provider methods and wire models stay B519/B686.
- B2487 owns all listed settings, defaults, loader tests and the non-finite-timeout deviation. B1085 registers create HTTP aliases.
pitfalls:
- Only null fields are omitted; temperature=0 and empty tools remain in the request.
- AZURE_AD_TOKEN is consulted only when extra_body is explicitly null, not when it is omitted.
- Azure's isinstance(OpenAI) test also matches AzureOpenAI and discards that supplied synchronous client.
review_level: security
budget:
  max_changed_lines: 650
  max_new_expects: 0
