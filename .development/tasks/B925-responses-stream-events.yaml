checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::responses_stream_events::/)
      - test(/::replays_corpus$/)'
  - id: case-response-created-id
    why: the response-created-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_events::tests::response_created_id($|::)/)'
  - id: case-output-item-encrypted-id
    why: the output-item-encrypted-id behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_events::tests::output_item_encrypted_id($|::)/)'
  - id: case-provider-error-status
    why: the provider-error-status behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_events::tests::provider_error_status($|::)/)'
  - id: case-stream-duration-expired
    why: the stream-duration-expired behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_events::tests::stream_duration_expired($|::)/)'
  - id: case-done-sentinel
    why: the done-sentinel behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_events::tests::done_sentinel($|::)/)'
  - id: case-invalid-json-payload
    why: the invalid-json-payload behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_events::tests::invalid_json_payload($|::)/)'
  - id: config-tests
    why: a listed setting is unrecognized, unused, incorrectly defaulted, or lacks a loader test
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::responses_stream_events::tests::loads_settings($|::)/)'
  - id: config-corpus
    why: no newly added key-bearing config seed reaches the production loader
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/responses-stream-events-*)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_stream_events)"
      && test -f crates/betterlite-core/fuzz/fuzz_targets/responses_stream_events.rs && grep -qF "decode_responses_stream_event"
      crates/betterlite-core/fuzz/fuzz_targets/responses_stream_events.rs && cargo nextest run --locked -p betterlite-core
      --no-tests=fail -E 'test(/^api::responses_stream_events::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/responses_stream_events.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/responses_stream_events-*)"
      && grep -qE "^[[:space:]]+responses_stream_events:" tools/oracle/fuzz/corpus/helper_case/responses_stream_events-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/responses-stream-events)"
