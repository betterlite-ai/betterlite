id: B925
title: Responses stream events
description: >-
  Implement Responses SSE parsing and per-event transformations over B005 framing. Introduce typed stream state,
  deadline and error fields; apply provider/deployment ID and usage projections without losing unknown provider
  payload outside the named passthrough field.


  decode_response_event reads a completed SSE data payload, recognizes [DONE], ignores invalid JSON with the source
  diagnostic and returns Event or TerminalEvent. B927 owns terminal processing at L466-L522; this decoder never
  invokes logging, billing or persistence hooks.


  B005 owns SSE framing; this task decodes complete data payloads. A [DONE] payload terminates and invalid JSON
  is ignored in the source branch. Keep terminal billing/logging above the decoder in B927.


  Implement crates/betterlite-core/src/api/responses_stream_events.rs. Use ResponsesStreamEventsInput and ResponsesStreamEventsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions response_created_id, output_item_encrypted_id, provider_error_status,
  stream_duration_expired, done_sentinel, invalid_json_payload under api::responses_stream_events::tests. Each named
  function drives production code and asserts its case result; use named rstest inputs for related values. Corpus
  replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.LITELLM_MAX_STREAMING_DURATION_SECONDS
  defaults to unset means no duration limit; numeric seconds otherwise; elapsed greater than limit raises Timeout.
  No environment reads occur outside betterlite-config. Test api::responses_stream_events::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-core::api::responses_stream_events::decode_responses_stream_event(bytes:
  &[u8], limits: &ApiLimits), for json.loads input payload at litellm/responses/streaming_iterator.py:150; json.loads
  input payload at litellm/responses/streaming_iterator.py:155. Place its implementation in crates/betterlite-core/src/api/responses_stream_events.rs
  and call it from the actual boundary. The cargo-fuzz target crates/betterlite-core/fuzz/fuzz_targets/responses_stream_events.rs
  passes arbitrary bounded bytes to that exact decoder; api::responses_stream_events::tests::replays_corpus replays
  newly committed seeds through the same function. Transform-only helpers reuse the already decoded records.


  Register HelperCall::ResponsesStreamEvents in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_stream_events: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/streaming_iterator.py: ProjectQuotaCallback.enforce_project_io_token_quota_for_frame
  (L64-L70); litellm/responses/streaming_iterator.py: _get_openai_response_types (L74-L77); litellm/responses/streaming_iterator.py:
  _is_json_object (L80-L81); litellm/responses/streaming_iterator.py: _is_json_array (L84-L85); litellm/responses/streaming_iterator.py:
  _optional_str (L88-L90); litellm/responses/streaming_iterator.py: _json_array_or_empty (L93-L95); litellm/responses/streaming_iterator.py:
  _is_str_mapping (L98-L99); litellm/responses/streaming_iterator.py: _MutableJsonObject.get (L104-L104); litellm/responses/streaming_iterator.py:
  _MutableJsonObject.get (L106-L106); litellm/responses/streaming_iterator.py: _MutableJsonObject.__getitem__ (L107-L107);
  litellm/responses/streaming_iterator.py: _MutableJsonObject.__setitem__ (L108-L108); litellm/responses/streaming_iterator.py:
  _MutableJsonObject.__contains__ (L109-L109); litellm/responses/streaming_iterator.py: _MutableJsonObject.items
  (L110-L110); litellm/responses/streaming_iterator.py: _GetsLitellmParams.__call__ (L114-L114); litellm/responses/streaming_iterator.py:
  _UnmasksPiiText.__call__ (L118-L118); litellm/responses/streaming_iterator.py: _ShouldStoreResultInCache.__call__
  (L122-L122); litellm/responses/streaming_iterator.py: _PostStreamingDeploymentHook.__call__ (L126-L132); litellm/responses/streaming_iterator.py:
  _typed_gets_litellm_params (L140-L141); litellm/responses/streaming_iterator.py: _load_json_object (L148-L150);
  litellm/responses/streaming_iterator.py: _load_json_value (L153-L155); litellm/responses/streaming_iterator.py:
  _model_id_from_metadata (L158-L161); litellm/responses/streaming_iterator.py: _log_background_task_failure (L164-L169);
  litellm/responses/streaming_iterator.py: _running_loop (L175-L179); litellm/responses/streaming_iterator.py: _spawn_logging_task
  (L182-L189); litellm/responses/streaming_iterator.py: _error_event_fields (L221-L237); litellm/responses/streaming_iterator.py:
  _status_code_for_error_field (L240-L243); litellm/responses/streaming_iterator.py: _status_code_for_error_fields
  (L246-L250); litellm/responses/streaming_iterator.py: stream_error_status_and_message (L253-L255); litellm/responses/streaming_iterator.py:
  _map_stream_error_to_exception (L258-L278); litellm/responses/streaming_iterator.py: _mid_stream_fallback_eligible
  (L281-L285); litellm/responses/streaming_iterator.py: BaseResponsesAPIStreamingIterator.__init__ (L300-L349);
  litellm/responses/streaming_iterator.py: BaseResponsesAPIStreamingIterator._check_max_streaming_duration (L351-L361);
  litellm/responses/streaming_iterator.py: BaseResponsesAPIStreamingIterator._process_chunk (L363-L465); litellm/responses/streaming_iterator.py:
  BaseResponsesAPIStreamingIterator._process_chunk (L523-L526). Abstract/protocol declarations map to native types
  and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 302 owned nonblank/non-comment/non-docstring Python lines (312 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 322 implementation,
  76 behavior tests, 72 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 30 wiring; 683 total within the 690-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B005 (Streaming chat completions), B171 (Direct helper oracle and URL path encoding),
  B198 (Injected call context and shared settings), B904 (Response id traversal), B906 (Responses usage), B1087
  (Api boundaries), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
