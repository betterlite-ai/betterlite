id: B925
title: Process complete provider Responses event payloads
description: >-
  Implement api::responses_stream_events around the entire _process_chunk function,
  L363-L532. The former split inside its encrypted-content/terminal branches is removed.
  B2413 owns state, JSON decoding and duration; B926 owns logging/failure effects; B928
  owns terminal usage/cost helpers; B904/B903 wrap IDs and encrypted content. This task is
  above those callees, and B927 is its live HTTP driver. Use B508's actual OpenAI event
  transform through the B1114 provider contract in parity cases. Keep the ProjectQuotaCallback
  declaration L63-L70 here as the typed async quota port used by B942-B945. Re-export B2413's
  primitives through this existing stream surface so those callers retain their dependency.

  Add B171 responses_stream_events for already-framed data payloads, recording transformed
  events and injected logging effects. No network pull occurs in this method. Feed bytes
  through B2413's bounded decoder and extend its corpus for malformed/scalar/terminal
  inputs; do not introduce a second JSON parser. The processing function and quota protocol
  contain 149 nonblank/non-comment lines. Budget 175 implementation, 155 tests, 110 cases, 75 adapters
  and 25 wiring/corpus lines, totaling 540.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_stream_events.rs
  - crates/betterlite-core/src/api/responses_stream_events/**
  - crates/betterlite-core/fuzz/corpus/responses_stream_value/responses-event-*
  - tools/oracle/src/helpers/core_ops/responses_stream_events.rs
  - tools/oracle/src/helpers/core_ops/responses_stream_events/**
  - tools/oracle/helpers/responses_stream_events.py
  - tools/oracle/helpers/responses_stream_events/**
  - tools/oracle/fuzz/corpus/helper_case/responses_stream_events-*
  - tools/oracle/cases/helpers/responses-stream-events/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L63-L70
  why: Quota port accepts an optional authenticated principal/model and input/output token estimates; enforcement is the caller's policy.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/streaming_iterator.py#L363-L532
  why: One function owns parsing, response/container/cipher rewriting and all terminal billing/logging branches.
dod:
- text: >-
    framed_payload_handling ignores "" without timing changes and recognizes only exact
    "[DONE]",setting finished=true and returning no event. Other payloads set completion
    start time once before parsing, including malformed JSON and scalar JSON. Malformed
    JSON or valid [],null,1 returns no event without failure hooks; no data: prefix is
    stripped because B005 already did framing. The string "data:{...}" is therefore
    malformed and dropped. A dict with no provider config raises ValueError
    "responses_api_provider_config is required to process live streaming chunks" and
    triggers B926 failure once; provider transform errors do the same and propagate.
    The shared stream surface exposes the quota protocol and B2413 primitives without
    invoking quota enforcement while processing an ordinary SSE event.
  proof: [event-tests, oracle, event-adapter, event-corpus]
- text: >-
    event_identity_wrapping invokes B508 with model,parsed dict and logging context.
    A response-bearing JSON key plus a nonnull transformed response invokes B904 wrapping;
    absent response key never rewrites a synthesized response attribute. output_item.added
    and output_item.done encode item container_id; output_text.annotation.added encodes
    annotation container_id; content_part.done rewrites containers in annotations for dict
    or typed parts. With provider=openai,model_info.id=deployment_a,decode each wrapped
    container to its original c and that provider/model. Other event types remain unchanged.
  proof: [event-tests, oracle, event-adapter]
- text: >-
    encrypted_item_affinity wraps nonempty string encrypted_content only on added/done
    items when litellm_metadata.encrypted_content_affinity_enabled is truthy and
    model_info.id is a nonempty string. Missing/false flag,empty/numeric model ID,
    empty/nonstring cipher or other event type leaves the cipher untouched. Decode a
    wrapped cipher to (deployment_a,cipher) through B903; preserve existing wrappers
    according to its idempotence rule. Response-body wrapping remains B904's separate path.
  proof: [event-tests, oracle, event-adapter]
- text: >-
    generated_usage_inputs concatenates only string output_text.delta into generated text
    and string function_call_arguments.delta,custom_tool_call_input.delta,mcp_call_arguments.delta
    into generated arguments. For text hi and argument {},terminal estimation receives
    "hi{}",not interleaved event order. Other deltas and nonstrings contribute nothing.
    Only completed/incomplete terminals estimate missing usage via B928 using request.input,
    the full request and model default ""; failed terminals do not estimate.
  proof: [event-tests, oracle, event-adapter]
- text: >-
    terminal_state_and_logging stores completed,incomplete and failed events as
    completed_response without setting finished. Existing usage survives unchanged;
    absent usage uses B928's billed copy when needed, leaving earlier object references
    untouched. Stamp usage cost before callbacks. Completed/incomplete call the success
    logging hook,failed calls the failure hook; failed existing usage still reaches billing.
    Return the stored terminal event. A terminal hook exception invokes failure and is
    re-raised; no synthetic success is returned. B927 decides when errors/EOF end iteration.
  proof: [event-tests, oracle, event-adapter]
checks:
  optional: []
  commands:
  - id: event-tests
    why: complete event processing omits identity, billing or terminal effects
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_events::/)'
  - id: event-corpus
    why: new event payloads bypass the shared production JSON decoder
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_stream_value/responses-event-*)" && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_stream_primitives::tests::replays_corpus$/)'
  - id: event-adapter
    why: transformed events and logging effects lack independent pinned execution
    run: test -f tools/oracle/helpers/responses_stream_events.py && grep -qE '^[[:space:]]+responses_stream_events:' tools/oracle/fuzz/corpus/helper_case/responses_stream_events-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-stream-events/framed-payload-handling.yaml
- tools/oracle/cases/helpers/responses-stream-events/event-identity-wrapping.yaml
- tools/oracle/cases/helpers/responses-stream-events/encrypted-item-affinity.yaml
- tools/oracle/cases/helpers/responses-stream-events/generated-usage-inputs.yaml
- tools/oracle/cases/helpers/responses-stream-events/terminal-state-and-logging.yaml
deviations: []
out_of_scope:
- B2413 owns all helpers/state/settings L73-L361; B926 hooks L534-L952; B927 fallback and live/synthetic iterators L954-L1326; B928 builders/billing L1329-L1732.
- Test-only hook facades L801-L807 and L995-L1006 have no production caller at the pin and are excluded.
- B942-B945 own websocket code after L1732 and quota invocation; B005 owns network SSE framing.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_stream_events in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_stream_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_stream_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- Re-stripping the data prefix here would corrupt payloads because the SSE decoder already removed it.
- Malformed JSON still establishes completion_start_time before it is silently skipped.
- A terminal event is stored and logged without setting finished; the driver still consumes the stream boundary.
review_level: standard
budget:
  max_changed_lines: 540
  max_new_expects: 1
