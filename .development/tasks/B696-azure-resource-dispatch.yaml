id: B696
title: Azure resource and realtime operation composition
description: >-
  Install Azure files, batches, fine tuning, assistants/threads/runs, Responses, search, realtime, resource overrides
  and passthrough through executable provider matches; use small shared delegate helpers for the OpenAI-shaped resource
  operations.


  This slice adds native composition or ports the SDK protocol called by the parent; it owns no additional LiteLLM
  function body. The references and concrete operations below bound that work.


  Add a separate Rust-only unsupported_operation case against the executable dispatcher; do not invent a Python
  oracle operation for it.


  Install these completed leaf operations: B694 Azure file lifecycle; B541 Azure batch lifecycle; B542 Azure fine-tuning
  jobs; B543 Azure assistants threads and runs; B686 Azure assistant definition operations; B687 Azure thread creation
  and retrieval; B697 Azure message creation and attachment policy; B544 Azure Responses native requests; B545 Azure
  realtime protocol and HTTP sessions; B546 Azure web search via Responses; B547 Azure container video and vector-store
  endpoints; B548 Azure native passthrough preparation and logging. Each dispatch fixture must reach its leaf with
  a fake transport and assert the resulting request or reply; accept already normalized settings and reuse leaf
  errors.


  Named case contracts: files_batches: Parameterize B694 file create/content/retrieve/list/delete and B541 batch
  create/retrieve/cancel/list, retaining their separate record types and empty-delete fallback. fine_tuning: Parameterize
  all B542 create/list/retrieve/cancel operations with Azure endpoint/version settings. assistant_thread_run: Parameterize
  B686 assistant definitions, B687 thread create/get, B697 message create/list and B543 buffered/streaming runs;
  verify exact leaf operation and error passthrough. responses_search: Dispatch B544 Responses and B546 web search
  separately, including their URL and result differences. realtime: Parameterize B545 websocket realtime and HTTP
  session creation. container_video_vector: Parameterize every B547 container/video/vector-store URL override and
  delegated operation without rebuilding OpenAI request transforms. passthrough: Dispatch B548 preparation and logging
  projection through its leaf collector, preserving response fields and stream output.


  Each named composition case uses separate fixture rows for its operations, invokes the existing native dispatcher
  and then the actual leaf prepare/send/project functions, and asserts captured upstream request and returned typed
  result. Include a leaf failure per family to detect accidental error rewriting. This composition reads no new
  config/env values and registers no HTTP route; defaults, headers, warnings and parsers remain with the named leaves.


  Implement crates/betterlite-provider/src/azure_resource_dispatch.rs with adjacent tests under azure_resource_dispatch/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation azure_resource_dispatch in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function azure_resource_dispatch_cases in betterlite-provider with these exact named cases (one per
  oracle file): files_batches, fine_tuning, assistant_thread_run, responses_search, realtime, container_video_vector,
  passthrough. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports.
  Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_resource_dispatch* using HelperCase: kind:
  helper and the externally tagged azure_resource_dispatch variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_azure_resource_dispatch that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Write standalone azure_resource_dispatch_unsupported_operation in betterlite-provider for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 0 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 155 production lines, 210 behavior/config-test lines, 130 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 40 module/dispatch/shared-seed
  wiring lines; 535 planned, 550 maximum changed lines. Composition has no new Python algorithm; its allowance is
  native operation wiring plus fixture calls.
