  commands:
  - id: case-files-batches
    why: Parameterize B694 file create/content/retrieve/list/delete and B541 batch create/retrieve/cancel/list,
      retaining their separate record types and empty-delete fallback.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_cases::case_[0-9]+_files_batches$/)'
  - id: case-fine-tuning
    why: Parameterize all B542 create/list/retrieve/cancel operations with Azure endpoint/version settings.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_cases::case_[0-9]+_fine_tuning$/)'
  - id: case-assistant-thread-run
    why: Parameterize B686 assistant definitions, B687 thread create/get, B697 message create/list and B543 buffered/streaming
      runs; verify exact leaf operation and error passthrough.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_cases::case_[0-9]+_assistant_thread_run$/)'
  - id: case-responses-search
    why: Dispatch B544 Responses and B546 web search separately, including their URL and result differences.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_cases::case_[0-9]+_responses_search$/)'
  - id: case-realtime
    why: Parameterize B545 websocket realtime and HTTP session creation.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_cases::case_[0-9]+_realtime$/)'
  - id: case-container-video-vector
    why: Parameterize every B547 container/video/vector-store URL override and delegated operation without rebuilding
      OpenAI request transforms.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_cases::case_[0-9]+_container_video_vector$/)'
  - id: case-passthrough
    why: Dispatch B548 preparation and logging projection through its leaf collector, preserving response fields
      and stream output.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_cases::case_[0-9]+_passthrough$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_resource_dispatch.py)" && uv
      run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_resource_dispatch*")"
      && grep -lq 'azure_resource_dispatch' tools/oracle/fuzz/corpus/helper_case/azure_resource_dispatch* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_resource_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::azure_resource_dispatch_unsupported_operation$/)'
