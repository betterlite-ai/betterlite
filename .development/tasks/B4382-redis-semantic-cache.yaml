dod:
  - text: A missing similarity_threshold, missing Redis settings and the env fallbacks behave as in LiteLLM, and the URL and distance threshold are built the same way.
    proof: [options-tests, oracle, helper-python]
  - text: The index is built once and lazily, with the dimension probe, the exact schema, and the isolated-then-overwrite fallback only on a schema mismatch.
    proof: [index-tests, oracle, helper-python]
  - text: Tag escaping, entry ids, key matching and ttl handling match RedisVL and LiteLLM.
    proof: [filter-tests, ttl-tests, oracle, helper-python]
  - text: Writes store JSON text under the right key with the right fields and ttl, and every write failure is swallowed.
    proof: [store-tests]
  - text: Reads send the scoped range query, treat wrong-scope and missing-key-field hits as misses, set semantic-similarity on every path, and turn decode and other errors into misses.
    proof: [lookup-tests, oracle, helper-python]
  - text: index_info returns the FT.INFO reply as ordered JSON and passes the Redis error text through.
    proof: [info-tests]

checks:
  optional: [mutants]
  commands:
    - id: options-tests
      why: constructor validation, env fallbacks, URL build or distance conversion is missing
      run: >-
        cargo nextest run --locked -p betterlite-prompts --no-tests=fail
        -E 'test(/^redis_semantic_cache::tests::options_/)'
    - id: ttl-tests
      why: ttl pass-through or zero-ttl handling is missing
      run: >-
        cargo nextest run --locked -p betterlite-prompts --no-tests=fail
        -E 'test(/^redis_semantic_cache::tests::ttl_/)'
    - id: filter-tests
      why: tag escaping, entry id hashing or the key match check is missing
      run: >-
        cargo nextest run --locked -p betterlite-prompts --no-tests=fail
        -E 'test(/^redis_semantic_cache::tests::filter_/)'
    - id: index-tests
      why: lazy index build, schema, probe or the isolation fallback chain is missing
      run: >-
        cargo nextest run --locked -p betterlite-prompts --no-tests=fail
        -E 'test(/^redis_semantic_cache::tests::index_/)'
    - id: store-tests
      why: hash layout, ttl on write, error swallowing or the pipeline is missing
      run: >-
        cargo nextest run --locked -p betterlite-prompts --no-tests=fail
        -E 'test(/^redis_semantic_cache::tests::store_/)'
    - id: lookup-tests
      why: the scoped search, hit validation, similarity metadata or error-to-miss policy is missing
      run: >-
        cargo nextest run --locked -p betterlite-prompts --no-tests=fail
        -E 'test(/^redis_semantic_cache::tests::lookup_/)'
    - id: info-tests
      why: index_info conversion or error passthrough is missing
      run: >-
        cargo nextest run --locked -p betterlite-prompts --no-tests=fail
        -E 'test(/^redis_semantic_cache::tests::info_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4382)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4382 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4382/pyrightconfig.json

