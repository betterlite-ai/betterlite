deviations:
  - what: Only the async cache operations are built. LiteLLM's sync `set_cache`, `get_cache` and `_get_embedding` are not.
    why: The gateway runs on async I/O and calls the async cache methods, so a blocking Redis path would only add a second copy of the logic.
  - what: The vector index is managed with direct RediSearch commands instead of the redisvl library.
    why: No Rust crate does this job. The index name, prefix, schema, entry id, hash fields and query follow redisvl 0.28 (LiteLLM allows >=0.4.1,<1.0).
  - what: A schema mismatch is a typed `SchemaMismatch` error, not a ValueError whose text contains "schema does not match" or "index schema".
    why: Message sniffing is fragile, and the only source of those messages is the schema compare this module owns.
  - what: Responses are stored as JSON text, not Python `str(value)`.
    why: B4380's decoder reads JSON only, and docs/compatibility.md excludes Python repr text.
  - what: The Redis URL, which holds the password, is never logged.
    why: LiteLLM prints it with print_verbose; betterlite does not log secrets.

out_of_scope:
  - Prompt extraction and cached-response decoding; B4380 owns `extract_semantic_prompt` and `decode_cached_response`, and this task calls them (the Redis `_get_prompt_from_kwargs`, `_collect_responses_input_text`, `_coerce_response_input_value` and `_get_cache_logic` bodies live there, with the miss-on-decode-error policy kept here).
  - Embedding calls, Router lookup, truncation and timeouts (`_embedding_input`, `_get_embedding`, `_get_async_embedding`); B4381 owns them and B4310 owns their helpers. This task only calls the `SemanticEmbedder` port.
  - Sync `set_cache` and `get_cache`; see deviations. No caller needs them in an async gateway.
  - Valkey's overrides of the read and write methods (valkey_semantic_cache.py); B128 owns them.
  - Choosing the cache type from settings and constructing this cache (caching.py:215-232); B4299 and the cache facade own that, and B4299 raises a not-supported error until this task is wired.
  - The health readiness details body and the route that call `index_info`; B4448 owns them.
  - Opening Redis connections (`LiveAsyncClient`, `RedisClient::Url`); B5220 and B4323 own them.

pitfalls:
  - LiteLLM calls `get_str_from_messages` only when `messages` is truthy, so an empty list falls through to Responses `input`; pass None to B4380's function for an empty list instead of Some(&[]).
  - The cache key lives only in the `litellm_cache_key` TAG field and in the entry id hash; a hit with that field missing must be a miss, not a hit, or old entries leak between scopes.
  - A decode failure still keeps the similarity already written to metadata, because `_get_cache_logic` returns None after `semantic-similarity` was set; only the other error paths reset it to 0.0.
  - RedisVL's `ttl or self._ttl` makes ttl 0 mean no expiry, so store `ttl` only when it is non-zero.
  - Tag values need the full `TAG_ESCAPED_CHARS` set including `|`, space and `?`; an unescaped `|` in a cache key turns an equality match into a union.
  - The `_isolated` index name is used for keys, search and info after a fallback, so keep the chosen name in the built index state, not in the options.
  - The dimension probe embeds the literal text `dimension test` once per build, and a failed build must not cache the failure.
  - The oracle project does not install redisvl, so the Python adapter must replace `_get_cache_key_filter_expression` and the `llmcache` property with stubs; the escaped tag text is checked by native tests against RedisVL's character list.
  - >-
    `async_set_cache_pipeline` passes the same kwargs to every pair and swallows all errors; never fail the batch.

  - "crates/betterlite-prompts/Cargo.toml and Cargo.lock are in scope because the worker adds betterlite-redis to the prompts dependencies."
review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
