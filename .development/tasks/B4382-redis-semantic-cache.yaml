id: B4382
title: Build isolated Redis semantic indexes and cache operations
description: >-
  Add the module `redis_semantic_cache` to betterlite-prompts, next to B4383's Qdrant cache. It is the Redis half of
  litellm/caching/redis_semantic_cache.py: `RedisSemanticCache`, which stores model responses in a RediSearch vector
  index and finds them again by prompt similarity. LiteLLM does this through the Python library redisvl
  (`SemanticCache`, `CustomTextVectorizer`, `VectorRangeQuery`). No Rust crate does that job, so this task sends the same
  RediSearch commands itself, through two ports defined in the module. Add `betterlite-redis` to
  crates/betterlite-prompts/Cargo.toml (betterlite-redis depends only on env and redact, so there is no cycle).

  Ports (traits defined in this module, injected at construction, so tests use fakes and no network):
  `SemanticEmbedder` has `async fn embed(&self, prompt: &str, metadata: Option<&Map<String, Json>>) -> Result<Vec<f32>,
  SemanticEmbedError>`. It stands for LiteLLM's `_get_async_embedding`; B4381 owns the real implementation (router or
  direct call, truncation, timeout, ValueError wrapping), and the architect wires it. `SemanticRedisIndex` has the five
  async index commands this module needs: `ft_info(index) -> Result<Option<Json>, _>` (None when the index does not exist),
  `ft_create(index, schema)`, `ft_dropindex(index)` (without deleting documents), `ft_search(index, query) -> Vec<Hit>` and
  `store_hash(key, fields, ttl: Option<i64>)` (HSET, then EXPIRE when a ttl is given). The production implementation,
  `LiveSemanticIndex`, wraps `betterlite_redis::redis_live_client::LiveAsyncClient` and sends `FT.INFO`, `FT.CREATE`,
  `FT.DROPINDEX`, `FT.SEARCH`, `HSET` and `EXPIRE` through its `query` method (B5220). `Json` is
  `arguments::json::Json`, the type B4380 uses. Types, files, config keys and env vars below use LiteLLM's names.

  Constructor `RedisSemanticCache::new(options: RedisSemanticOptions, env: RedisEnv, embedder: Arc<dyn
  SemanticEmbedder>, connector: Arc<dyn SemanticIndexConnector>) -> Result<Self, RedisSemanticError>`. The options hold
  host, port, password, redis_url, similarity_threshold (Option<f64>), embedding_model (default
  `text-embedding-ada-002`), index_name, embedding_max_input_tokens and embedding_timeout; the last two and
  embedding_model are kept as public fields because B4381 reads them. Order of work: index_name defaults to
  `litellm_semantic_cache_index` (the const `DEFAULT_REDIS_INDEX_NAME`). A missing similarity_threshold fails with the
  message `similarity_threshold must be provided, passed None`. distance_threshold is `1 - similarity_threshold` with no
  range check. `RedisEnv` is a plain struct with the three optional strings `redis_host`, `redis_port` and `redis_password`, filled by the caller from the process environment. Without redis_url, host, port and password each fall back to the env vars `REDIS_HOST`, `REDIS_PORT` and
  `REDIS_PASSWORD` (the `RedisEnv` fields) (an explicit non-empty value wins; an empty string counts as missing, like Python's `or`); the first
  missing one fails with `Missing required Redis configuration: <VAR>. Provide <VAR> or redis_url.` The built URL is
  `redis://:{password}@{host}:{port}`. The constructor opens nothing: the index is built lazily (see Index build).
  `embedding_timeout` is resolved by B4310's `resolve_embedding_timeout`, passed in as an already resolved f64 in the
  options (the caller owns that call). The `connector` turns the URL into a `SemanticRedisIndex` on first use
  (`LiveSemanticIndex` over `RedisClient::Url`).

  Index build (LiteLLM `llmcache` property, `_build_llmcache`, `_init_semantic_cache`, `_cache_key_filterable_field`).
  The first operation that needs the index builds it once and shares it (`tokio::sync::OnceCell::get_or_try_init`, so a
  failed build is retried by the next call, like Python's `_llmcache is None` check). The build first calls the embedder
  with the text `dimension test` and an empty metadata to learn the vector size (RedisVL's CustomTextVectorizer does
  this, and it is one extra embedding on the first request). The schema, in this order: `prompt` TEXT, `response` TEXT,
  `inserted_at` NUMERIC, `updated_at` NUMERIC, `prompt_vector` VECTOR (FLAT, FLOAT32, DIM from the probe,
  DISTANCE_METRIC COSINE), then the extra field `litellm_cache_key` TAG (`CACHE_KEY_FIELD_NAME`). The index is created
  `ON HASH` with `PREFIX 1 <index name>`. Try the base index name with overwrite off: if `ft_info` says it exists and its
  attributes (field names, types, vector DIM, algorithm, metric, datatype) or prefix differ from the expected schema, that
  is a `SchemaMismatch` error; if it does not exist, `ft_create`. On `SchemaMismatch`, try `<name>_isolated` the same
  way. On a second `SchemaMismatch`, `ft_dropindex` `<name>_isolated` and `ft_create` it again (overwrite on). Any other
  error is returned as is. A failed build logs at error level `Redis semantic-cache index build failed: <error>` and
  returns the error. Log the three info lines LiteLLM prints (`print_verbose`) at debug level: the isolated-index
  switch, the stale recreate and the initial index name. Never log the URL: LiteLLM logs `redis_url` with the password.

  Key and entry shape (RedisVL `store`). Entry id is the lowercase hex SHA-256 of the UTF-8 bytes of `prompt` followed by
  `litellm_cache_key` and the cache key (RedisVL joins `str(k)+str(v)` of the sorted filters; this cache has the one filter, so there is no separator). The hash key is `<index name>:<entry id>`, where the index name is the
  one actually in use (`_isolated` included). Hash fields: `entry_id`, `prompt`, `response`, `prompt_vector` (the f32
  little-endian bytes), `inserted_at` and `updated_at` (the same Unix time as a float with fractional seconds, from an
  injected clock) and `litellm_cache_key`. The same prompt and key therefore overwrite the same hash. A vector whose length
  differs from the index DIM is an error before any write or search (`DimensionMismatch`, RedisVL's `validate_vector_dims`).

  Writes: `async_set_cache(key, value: &Json, kwargs)` where kwargs carries messages, input, metadata and ttl as a typed
  struct `SemanticCacheKwargs`. Get the prompt from B4380's `extract_semantic_prompt`; pass `messages` as None when the
  list is empty, because LiteLLM tests `if messages:` and then falls through to Responses `input`. No prompt means log
  and return Ok without touching Redis. The response is stored as JSON text of `value` (not Python `str(value)`; B4380's
  decoder reads it back). Embed the prompt with the request metadata, then `store_hash` with the ttl from `get_ttl`.
  Every failure in this path (prompt, embed, build, store) is logged at debug level `Error in async_set_cache: <error>` and
  swallowed: the method returns Ok. `get_ttl(ttl: Option<i64>) -> Option<i64>` is LiteLLM's `_get_ttl` and returns the value as is. A ttl of 0 is stored as no expiry, because RedisVL does `ttl or self._ttl` and the cache-level ttl is
  always None; a negative ttl is sent through to EXPIRE unchanged. `async_set_cache_pipeline(cache_list, kwargs)` runs
  `async_set_cache` for every pair concurrently with the same kwargs (`futures::future::join_all`) and swallows errors.

  Reads: `async_get_cache(key, kwargs, metadata: Option<&mut Map<String, Json>>) -> Result<Option<Json>, _>`; it never
  returns Err for a cache problem. Every miss and every error writes `semantic-similarity` = 0.0 into the caller's
  metadata map when one is given (Python's `kwargs.setdefault("metadata", {})` only creates a local map when the caller
  passed none, so that case has nothing to write). Steps: no prompt gives a miss. Embed, then one `FT.SEARCH` with
  these parts: query `@prompt_vector:[VECTOR_RANGE $distance_threshold $vector]=>{$YIELD_DISTANCE_AS: vector_distance}
  (@litellm_cache_key:{<escaped key>})`, `PARAMS 4 vector <f32 bytes> distance_threshold <distance_threshold>`, `RETURN`
  of `entry_id prompt response inserted_at updated_at metadata litellm_cache_key vector_distance`, `SORTBY
  vector_distance ASC`, `LIMIT 0 1`, `DIALECT 2`. The tag value is escaped by putting a backslash before each of
  ``,.<>{}[]\"':;!@#$%^&*()-+=~|/`` , a space and `?`. No hit is a miss. The first hit is checked with
  `cache_hit_matches_key`: a hit whose `litellm_cache_key` is absent or differs from the key (as text, bytes decoded as
  UTF-8) is a miss, which keeps indexes from before the isolation fix from leaking across scopes. On a real hit,
  `similarity = 1 - vector_distance`, written to `semantic-similarity` in the caller's metadata, and the stored
  `response` text goes to B4380's `decode_cached_response`. A decode error returns None as a miss but keeps the real
  similarity already written, because LiteLLM's `_get_cache_logic` returns None after the similarity was set.
  RedisVL refreshes the ttl of found keys only when the cache has a default ttl, which this cache never has, so no EXPIRE is
  sent on a hit. Errors anywhere else log at debug `Error in async_get_cache: <error>`, set similarity 0.0 and return None.

  `index_info(&self) -> Result<Json, RedisSemanticError>` (LiteLLM `_index_info`, called by the health readiness details
  at _health_endpoints.py:1709-1723). It builds the index if needed and returns the `FT.INFO` reply as a `Json` object:
  the reply's flat key/value array becomes object keys in order, nested arrays of pairs become objects and lists stay
  lists, numbers stay numbers, bulk strings become strings. B4448's `ReadinessSources::cache_report` calls this and
  turns an Err into its `index does not exist - error: <error text>` string, so `RedisSemanticError`'s Display text is
  the Redis error text without a prefix. This is the method B4448 found without an owner; this task owns it under the
  public Rust name `index_info`.

  Sync variants. LiteLLM also has `set_cache`, `get_cache` and `_get_embedding`. betterlite's gateway is async, so this
  task builds only the async path (see deviations).

  Write independent native tests in `redis_semantic_cache::tests`, named with the prefixes the checks below filter on,
  using fake ports and a fixed clock: `options_` (threshold missing, env fallbacks, URL, distance), `ttl_`, `filter_`
  (tag escaping, entry id, key match), `index_` (create, mismatch to isolated, second mismatch to overwrite, other errors,
  dimension probe, build retried after failure), `store_` (hash fields, key, ttl, no prompt, errors swallowed, pipeline),
  `lookup_` (hit, miss, wrong key scope, missing key field, decode failure, metadata writes, embed failure, threshold
  parameter) and `info_` (reply conversion and error text). Add helper cases for the pure parts only (see oracle_cases).

