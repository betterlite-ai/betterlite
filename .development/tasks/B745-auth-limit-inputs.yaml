id: B745
title: Per-model and caller rate-limit inputs
description: >-
  Implement RateLimitInputs and OutputTokenEstimate validation for key/team/project/model/MCP/tag metadata.
  Preserve deployment-default inheritance and admin-only output-estimate/batch-limit fields; this task
  supplies typed inputs to B072 and does not introduce a rate limiter.


  Build the production auth_limit_inputs module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  _get_deployment_default_limit (L950-L975; 24 source lines), _get_deployment_default_rpm_limit (L978-L979;
  2 source lines), _get_deployment_default_tpm_limit (L982-L983; 2 source lines), get_key_own_model_rate_limit
  (L986-L1003; 17 source lines), get_key_model_rpm_limit (L1006-L1035; 24 source lines), get_key_model_tpm_limit
  (L1038-L1067; 24 source lines), _validated_output_token_estimate (L1080-L1092; 13 source lines), _validated_output_token_estimates_per_model
  (L1095-L1107; 13 source lines), _estimated_output_tokens_from_metadata (L1110-L1130; 18 source lines),
  get_estimated_output_tokens (L1133-L1151; 17 source lines), OutputTokenEstimateRequest.metadata (L1161-L1161;
  1 source lines), OutputTokenEstimateRequest.default_estimated_output_tokens (L1164-L1164; 1 source lines),
  OutputTokenEstimateRequest.default_estimated_output_tokens_per_model (L1167-L1167; 1 source lines),
  OutputTokenEstimateRequest.model_fields_set (L1170-L1170; 1 source lines), _requested_output_token_estimates
  (L1173-L1194; 21 source lines), enforce_output_token_estimates_are_admin_only (L1197-L1228; 31 source
  lines), BatchEnqueuedTokenLimitRequest.metadata (L1235-L1235; 1 source lines), BatchEnqueuedTokenLimitRequest.model_fields_set
  (L1238-L1238; 1 source lines), enforce_batch_enqueued_token_limit_is_admin_only (L1241-L1268; 27 source
  lines), get_model_rate_limit_from_metadata (L1271-L1278; 8 source lines), get_key_mcp_rpm_limit (L1297-L1320;
  20 source lines), get_team_mcp_rpm_limit (L1323-L1328; 6 source lines), get_key_tag_rpm_limit (L1331-L1342;
  11 source lines).


  Add the auth_limit_inputs operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-limit-inputs-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 284 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  284 production, 151 behavior/Postgres tests, 65 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 565 changed lines estimated within a 575-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::auth_limit_inputs::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
