dod:
  - text: 'Limit cases: key_metadata_truthy_first, empty_key_map_falls_through,
      budget_nested_dict_nonnull, team_empty_map_wins, deployment_minimum,
      absent_router_or_models, integer_string_bytes_bool, decimal_truncation,
      malformed_limit_skipped, overflow_propagates, zero_negative_kept,
      returned_map_not_model_filtered, tenant_accessor_fields, key_mcp_empty_wins,
      team_mcp_fallback and tag_key_only. Deployment cases use the native injected catalog;
      loaders accept both deployment default keys in deployment_limits_loaded.'
    proof:
      - behavior-tests
  - text: 'Estimate cases: positive_int_coercion, zero_negative_invalid_warn,
      malformed_scalar_warn, any_bad_map_entry_drops_map, map_before_global,
      no_model_skips_map_validation, malformed_fields_independent, key_global_before_team_map,
      missing_estimate_none, omitted_metadata_preserves, explicit_null_metadata_clears,
      top_level_nonnull_overlays, top_level_null_no_clear, admin_estimate_bypass,
      nonadmin_identical_allowed, estimate_changed_403, estimate_removed_403,
      batch_omitted_preserves, batch_identical_allowed, batch_changed_403,
      batch_removed_403 and batch_admin_bypass. Pure helper cases assert 403 detail.error;
      management route suites own public error-envelope comparison.'
    proof: [behavior-tests, helper-python, oracle]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Both deployment default keys reach the projection through the real config loader and new seeds.
    proof: [config-tests, config-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^auth_limit_inputs::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/auth_limit_inputs.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/auth-limit-inputs-*")"
        && grep -rlq "auth_limit_inputs" tools/oracle/fuzz/corpus/helper_case/auth-limit-inputs-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: Deployment default RPM/TPM fields are ignored by the loader.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^auth_limit_inputs::tests::/) - test(/replays_the_/)'
    - id: config-corpus
      why: No newly added deployment-limit config seed exists.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/auth-limit-inputs-*")" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
