id: B745
title: Per-model and caller rate-limit inputs
description: >-
  Build the pure rate-limit and management-policy projections consumed by B072 and key/team routes.
  Key model RPM/TPM precedence is truthy metadata.model_rpm_limit/model_tpm_limit, then dict-valued
  model_max_budget entries with nonnull rpm_limit/tpm_limit, then nonnull team metadata (including
  an empty map), then a deployment default when model_name is nonnull. Deployment defaults read
  model_list[].litellm_params.default_api_key_rpm_limit/default_api_key_tpm_limit through B302;
  choose the minimum converted int over all matching deployments. Missing router/deployments/values
  yields None. Accept integers, decimals truncated toward zero, integer strings and byte strings;
  bool behaves as int. Skip unsupported types and ValueError/TypeError silently, while overflow
  propagates. Preserve zero/negative limits. A selected map is returned whole, not filtered to model_name.

  Output estimates are default_estimated_output_tokens and default_estimated_output_tokens_per_model.
  Validate each with PositiveInt coercion: None means absent; malformed values WARN and become None.
  A bad element rejects the entire per-model map. A requested model checks that map first, then global;
  no model skips map validation. Key global wins over team per-model because key metadata is resolved
  before team metadata. Malformed map/global fields fail independently, allowing the other field or
  team default to survive. No configured estimate returns None to B072's heuristic; no new default is invented.

  Management admin checks compare resulting values, not presence. Explicit metadata replaces the
  stored blob, including None/{} clearing it; omitted metadata preserves it. Nonnull top-level estimate
  fields overlay that base, but top-level None does not clear it. proxy_admin bypasses the comparison;
  every other role may resend unchanged estimates but cannot add/change/remove either field. A denied
  key/team change is HTTPException 403 detail.error explaining reservation of requests without max_tokens.
  The batch_enqueued_token_limit metadata check uses the same replacement/omission rule, no top-level
  overlay, and rejects changed/removed values with 403 detail.error. Its message explains replacement
  of RPM/TPM checks. Route owners B773/B775/B801/B804 apply their own except-block translation.

  get_model_rate_limit_from_metadata reads the requested team_metadata/organization_metadata/project_metadata
  map for model_rpm_limit/model_tpm_limit/model_itpm_limit/model_otpm_limit without merging or validation.
  MCP RPM uses nonnull key mcp_rpm_limit before team mcp_rpm_limit; an empty map wins. Team-only MCP
  reads only team metadata. tag_rpm_limit comes from key metadata only. These are already parsed values,
  with no writes, secret conversion or rate-limit counter update in this task.


  Build the production auth_limit_inputs module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/auth_utils.py:
  _get_deployment_default_limit (L950-L975; 24 source lines), _get_deployment_default_rpm_limit (L978-L979;
  2 source lines), _get_deployment_default_tpm_limit (L982-L983; 2 source lines), get_key_own_model_rate_limit
  (L986-L1003; 17 source lines), get_key_model_rpm_limit (L1006-L1035; 24 source lines), get_key_model_tpm_limit
  (L1038-L1067; 24 source lines), _validated_output_token_estimate (L1080-L1092; 13 source lines), _validated_output_token_estimates_per_model
  (L1095-L1107; 13 source lines), _estimated_output_tokens_from_metadata (L1110-L1130; 18 source lines),
  get_estimated_output_tokens (L1133-L1151; 17 source lines), OutputTokenEstimateRequest.metadata (L1161-L1161;
  1 source lines), OutputTokenEstimateRequest.default_estimated_output_tokens (L1164-L1164; 1 source lines),
  OutputTokenEstimateRequest.default_estimated_output_tokens_per_model (L1167-L1167; 1 source lines),
  OutputTokenEstimateRequest.model_fields_set (L1170-L1170; 1 source lines), _requested_output_token_estimates
  (L1173-L1194; 21 source lines), enforce_output_token_estimates_are_admin_only (L1197-L1228; 31 source
  lines), BatchEnqueuedTokenLimitRequest.metadata (L1235-L1235; 1 source lines), BatchEnqueuedTokenLimitRequest.model_fields_set
  (L1238-L1238; 1 source lines), enforce_batch_enqueued_token_limit_is_admin_only (L1241-L1268; 27 source
  lines), get_model_rate_limit_from_metadata (L1271-L1278; 8 source lines), get_key_mcp_rpm_limit (L1297-L1320;
  20 source lines), get_team_mcp_rpm_limit (L1323-L1328; 6 source lines), get_key_tag_rpm_limit (L1331-L1342;
  11 source lines).


  Add the auth_limit_inputs operation under B856 Management::auth. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a auth-limit-inputs-*
  seed to B171 helper_case, which already owns this decoder.


  These are parsed-record projections, not an authentication stage. Helper cases call the owned
  functions directly and compare returned maps, warning/drop paths and 403 detail.error. Consuming
  management tasks register routes and test their own exception mapping. No Postgres fixture is needed.
  B002's deployment_limits_loaded loads both default_api_key_rpm_limit and default_api_key_tpm_limit
  under model_list[].litellm_params, proving absent None, explicit zero, integer strings and invalid
  per-deployment values reach the source skip/overflow policy. Add config_yaml seeds for both fields.


  Sizing: 284 nonblank, noncomment pinned source lines; allow 250 production, 300 cases/tests,
  80 adapters, 50 config tests and 50 wiring, 730 within 800. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Downstream composition stays with the calling limiter and management tasks; there is no route
  registration or middleware constructor in this part.
