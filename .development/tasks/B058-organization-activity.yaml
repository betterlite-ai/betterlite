    - crates/betterlite-server/src/organization_activity.rs
    - crates/betterlite-server/src/organization_activity/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/app.rs
    - tools/oracle/cases/management/organization-activity/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L565-L663
    why: Pinned implementation and exact ownership boundary for organization_activity.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L565-L613
    why: Own get_organization_daily_activity; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L621-L663
    why: Own resolve_organization_daily_activity_scope; preserve caller-visible values and failure ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8205-L8321
    why: Management exception HTTP status and public error translation.
dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: org_admin_activity,
      proxy_admin_activity, cross_org_denied, timezone_window, page_empty, grant_revoked_before_next_call.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
