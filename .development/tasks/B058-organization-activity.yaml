id: B058
title: Organization activity and management integration
description: >-
  Expose /organization/daily/activity using authorized organization entity scope and DailyActivityRepository.
  Register split organization/access-group/permission services and inject their validators/synchronizers
  into key and team writes; these hooks execute production transaction plans and never replace permission
  checks with success stubs. Projects use ProjectRepository here; project HTTP handlers are absent from
  the MIT checkout and are not inferred from enterprise code; the MIT project row/repository and auth
  checks are included.


  Build the production organization_activity module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/organization_endpoints.py:
  get_organization_daily_activity (L565-L613; 45 source lines), resolve_organization_daily_activity_scope
  (L621-L663; 42 source lines).


  Register these actual HTTP routes and aliases exactly once: GET /organization/daily/activity -> get_organization_daily_activity.
  For each route send a typed successful request, an invalid or missing target, and a caller lacking that
  route permission through B001 HttpCase against the running pinned MIT proxy and betterlite. Public login/session
  routes instead prove bad credentials or invalid/expired codes. Compare status, response model including
  null/absent fields, error type/param/code, content-type, redirect/cookie headers and litellm-changed-by
  where read. Do not reduce endpoint checks to direct helper invocations. handle_exception_on_proxy controls
  management error mapping; keep source partial writes visible in fixture inspection.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 87 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  87 production, 148 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 300 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
scope:
