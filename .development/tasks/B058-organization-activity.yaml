id: B058
title: Organization daily activity scope
description: >-
  Own get_organization_daily_activity and resolve_organization_daily_activity_scope at
  organization_endpoints.py L565-L663, including _OrganizationDailyActivityScope. Register GET
  /organization/daily/activity once with B052 authentication and SpendAnalyticsPaginatedResponse.
  Require a database first or raise HTTP500 with detail.error=CommonProxyErrors.db_not_connected_error.
  Defaults are organization_ids, exclude_organization_ids, start_date, end_date, model and api_key
  absent, page=1 and page_size=10. Truthy ID strings split on commas without trimming or deduplication;
  empty strings become None. Pass pagination/date validation to B074, without inventing route limits.

  B732's admin-view predicate lets proxy admin/view callers skip membership lookup. Others query B726
  OrganizationMembershipRepository for their user_id and retain only ORG_ADMIN.value memberships.
  Explicit requested IDs must all be in that tuple. The first forbidden ID raises HTTP403 detail.error
  User is not org_admin for Organization= <id>. Without explicit IDs use those admin memberships,
  including an empty tuple; never widen it to all organizations. Admin/view callers without IDs get
  an unrestricted None scope. Membership errors propagate; there is no stale permission fallback.

  B826's typed adapter over B723 OrganizationRepository loads metadata with B700 find_many_in for a
  concrete scope, otherwise find_many(where={}). Metadata maps ID to organization_alias, including
  null aliases. Missing rows do not change the requested IDs or produce404. Call B074 get_daily_activity
  with table litellm_dailyorganizationspend, entity_id_field organization_id, None or the original scope
  list, metadata, split exclusions and every date/model/key/page argument. This route has no except
  block and never calls handle_exception_on_proxy; preserve B003's global HTTP exception envelopes
  and propagate repository/activity errors. It performs no writes or synchronization.

  Implement organization_activity in betterlite-server with files below 300 lines and adjacent tests.
  B860 provisions independent Postgres fixtures for the real MIT server and betterlite, using
  POSTGRES_TEST_URL or testcontainers. Compare full status/body/error fields and inspect query scope.
  B001 HttpCase exercises the real route; no helper-only substitute or invented not-found case.
  Reuse B003 query decoding; no new parser/fuzz target. Allow 100 production, 220 table-driven tests
  and 70 wiring lines, 390 within a 450-line gate.
scope:
  paths:
    - crates/betterlite-server/src/organization_activity.rs
    - crates/betterlite-server/src/organization_activity/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - crates/betterlite-server/src/routes.rs
    - crates/betterlite-server/src/routes/**
    - crates/betterlite-server/src/state.rs
    - crates/betterlite-server/src/state/**
    - crates/betterlite-server/src/app.rs
    - crates/betterlite-server/src/app/**
    - tools/oracle/cases/management/organization-activity/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L560-L663
    why: Route defaults, scope queries, first unauthorized ID and direct activity delegation.
dod:
  - text: 'Named cases: database_required_before_scope, query_defaults_and_passthrough,
      comma_ids_preserve_spaces_empty_segments_duplicates, admin_view_skips_memberships,
      only_org_admin_memberships_count, first_foreign_id403_exact_detail,
      absent_ids_empty_memberships_never_all, explicit_empty_tuple_helper_scope,
      admin_absent_ids_all_rows, metadata_alias_null_and_missing_row,
      activity_table_entity_exclusions_and_pagination, repository_and_activity_errors_propagate,
      membership_revocation_effective_next_request, no_writes.'
    proof: [behavior-tests, oracle]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Scope or observable route behavior differs from the pinned implementation.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^organization_activity::tests::/) - test(/replays_the_/)'
oracle_cases:
  - tools/oracle/cases/management/organization-activity/admin-view-all.yaml
  - tools/oracle/cases/management/organization-activity/org-admin-explicit-and-default.yaml
  - tools/oracle/cases/management/organization-activity/empty-membership-scope.yaml
  - tools/oracle/cases/management/organization-activity/first-foreign-id-denied.yaml
  - tools/oracle/cases/management/organization-activity/query-defaults-and-comma-ids.yaml
  - tools/oracle/cases/management/organization-activity/missing-row-is-not404.yaml
  - tools/oracle/cases/management/organization-activity/no-database.yaml
deviations: []
out_of_scope:
  - B074 owns daily activity filtering, time windows, pagination and response aggregation.
  - B826 owns organization table adapters; B700 owns chunked membership reads.
  - Organization writes, access groups, permissions and projects remain their existing task owners.
pitfalls:
  - An empty organization-membership tuple is a restricted empty scope, unlike None for an admin.
budget:
  max_changed_lines: 450
  max_new_expects: 0
review_level: security
