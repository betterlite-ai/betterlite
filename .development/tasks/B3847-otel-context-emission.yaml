dod:
  - text: SpanEmitter deduplicates same (dedup_key, role) pairs in a bounded 10k-entry LRU cache, returning None on the second emit.
    proof: [emitter-dedup]
  - text: SpanEmitter.emit runs the configured mapper chain, reserves budget for error attributes, and fits indexed messages.
    proof: [emitter-attributes]
  - text: SpanEmitter.finish_span stamps error attributes, records an exception event, and records operation exceptions to the event recorder.
    proof: [emitter-errors]
  - text: Request root span is anchored once at auth resolution and explicit child parenting uses the anchor, never ambient span.
    proof: [context-anchor]
  - text: MCP message span links the W3C trace context (traceparent/tracestate) from params._meta as a link, never as parent.
    proof: [mcp-linking]
  - text: Post-response spans carry a span link to the parent when work started after the parent ended, using both span end time and phase marker.
    proof: [post-response-links]
  - text: W3C traceparent/tracestate extraction from headers preserves trace ID match detection and respects upstream override.
    proof: [context-propagation]
  - text: Tenant destination resolution reads ADDITIVE_DESTINATION_MODE and provides suppressed backend list for override mode.
    proof: [destination-mode]
  - text: Request Baggage is set through set_request_baggage and persists across context propagation.
    proof: [baggage-context]
  - text: set_mcp_message_transport_span re-anchors the request root span so subsequent spans point to that message's transport, not the session's initial request.
    proof: [mcp-transport-re-anchor]
