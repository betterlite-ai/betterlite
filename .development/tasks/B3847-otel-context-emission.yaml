id: B3847
title: OTel request context and span emission
description: >-
  Implement W3C context propagation and request/MCP anchors, plus the span emitter with attribute budgets, deduplication, error stamping and explicit span closure.

  The emitter is the low-level span start-and-stamp engine used by inference and service callbacks: it deduplicates on (call_id, role), maps attributes through the configured mapper chain, reserves budget for error attributes, fits indexed messages within span attribute limits, stamps error status and exception events, and closes spans. A bounded LRU cache (10k entries) tracks emitted span keys to coalesce sync+async firing in the same request window.

  Request context slots anchor the request's root SERVER span for explicit child parenting (avoiding nesting under `auth` phase spans or fire-and-forget detached tasks), store the MCP message's transport span and its W3C trace-context carrier for span linking, manage request Baggage through OpenTelemetry's baggage API, and record the request's resolved OTLP destinations and destination-mode override (additive or override).

  W3C context extraction and injection work on incoming HTTP headers and MCP params._meta, detecting trace parent via traceparent+tracestate, extracting remote client context as span links (never parents), and injecting outgoing context through the anchored request root. The post-response detection reads both a span's recorded end time and the injected clock's phase-marker to decide whether to emit a span with a parent link (work started after the parent ended) or as a nested child.

  The span emitter and context helpers are the boundary where V2 schema payloads become OTel SDK spans with explicit parenting, deduplication, attribute limits and budget management.
