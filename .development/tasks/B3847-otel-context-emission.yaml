oracle_cases: []
deviations:
  - what: On attribute count overflow, betterlite uses `fit_indexed_messages` to reduce indexed message payloads rather than dropping attributes wholesale.
    why: Fits more information in bounded attribute spaces while preserving the index ordering that consumers depend on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/emitter.py#L287
  - what: MCP message span links are always W3C trace context only; remote Baggage is never inherited from params._meta.
    why: Caller-controlled params could spoof identity baggage (team.id, metadata.*) if the remote carrier were honored as ambient context.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/plumbing/context.py#L309-L315
out_of_scope:
  - "get_baggage_attributes — no caller at the pin."
  - "Request/service/DB/guardrail payload construction (owned by B3843, B3844, B3845)."
  - "Mapper attribute mapping logic (owned by B3845, B3846)."
  - "Exporter transport and provider factories (owned by B3848, B3849)."
  - "HTTP instrumentation mount points (owned by B110)."
  - "Request task lifecycle and ContextVar initialization (the betterlite-context crate boundary)."
pitfalls:
  - The dedup cache key is (call_id, SpanRole), not just call_id; service spans without a call_id check dedup_key == None and never deduplicate.
  - MCP context resolution takes the _current_ message's transport span from the context slot, not the one from the session's initialize POST, so every tool call in a multi-message session parents to its own request, not to the first.
  - set_mcp_message_transport_span also re-anchors the request root span as a side effect, so every later span in a multi-message MCP session points identity/failure writes at the current message's transport, not the session's first request. The re-anchor only occurs when the transport is still recording (open for writes).
  - Post-response span links are built only when end_time_ns > parent.end_time or in_post_response_phase() is true, not unconditionally; work that runs after the parent can still nest under it if the phase marker says it is inline.
  - Inject and extract use TraceContextTextMapPropagator; standard OTel libs provide this, and header keys are case-insensitive on read but lowercase on write.
  - The request root span anchor is never reset (the ContextVar dies with the task), so it is safe to re-anchor the same request multiple times; do not add reset logic.
  - suppressed_backends returns the tenant destination callback names only in override mode; in additive mode the operator's copy is never suppressed.
