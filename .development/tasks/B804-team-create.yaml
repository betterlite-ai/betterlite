dod:
  - text: 'team_preflight cases cover no_database, each_negative_or_nonfinite_budget, zero_budget,
      soft_budget_equal_or_above, soft_budget_without_explicit_max, invalid_durations, model_budget_guard,
      output_estimates_admin_only, batch_limit_admin_only, generated_team_id, reserved_team_id,
      duplicate_team_id, duplicate_alias_allowed, missing_organization, org_ceiling, standalone_user_ceiling,
      org_skips_user_ceiling, creator_membership, creator_already_present, creator_without_user_id,
      metadata_guardrails, metadata_validation_rejection and invalid_router_weights.'
    proof:
      - behavior-tests
  - text: HTTP oracle cases prove the route or middleware success/failure contract, permissions and headers
      against the real MIT server.
    proof:
      - oracle
      - behavior-tests
  - text: 'postgres_pinned_rows covers alias_actor_and_json, object_permission, member_budget,
      premium_and_ordinary_metadata, budget_reset_and_windows, null_router_settings_empty_object,
      encrypted_callback_slots, callback_prefix_idempotence, callback_encryption_failure_passthrough,
      team_access_groups_same_transaction, empty_roster_then_members, audit_snapshot_and_actor,
      audit_snapshot_double_encoded, audit_disabled_skips_event and mit_audit_enabled_still_no_storage.
      postgres_failure_effects covers failure_after_alias, after_permission, after_member_budget,
      access_group_rollback, cache_failure_after_commit, member_failure_after_commit and audit_async_failure.'
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: native_team_creation_has_no_license_cap proves the only license behavior changed by this route.
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^team_create::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Actual Postgres row and failure-effect tests are absent or fail.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_create::tests::postgres_pinned_rows$/)'
        && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/team_create::tests::postgres_failure_effects$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^team_create::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/team-create-*")"
        && grep -rlq "default_team_settings" crates/betterlite-config/fuzz/corpus/config_yaml/team-create-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
