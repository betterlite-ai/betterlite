id: B804
title: Create teams with members and budgets
description: >-
  Implement the authenticated POST /team/new route, including B865's management wrapper, over the
  completed team, permission and budget services. new_team in team_endpoints.py L1337-L1791 is owned
  here; registration starts at L1330. Return the created TeamTable with its included model aliases and
  member changes. The source tries model_dump and falls back to dict. B800 owns request/response
  fields and defaults; keep its null/omitted distinctions rather than rebuilding that contract.


  Build the production team_create module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Before writing anything, reject a missing database with HTTP 500 detail {error: No db connected}.
  Each explicitly supplied max_budget, team_member_budget and soft_budget must be finite and
  nonnegative; otherwise 400 names the field and received value. B861 validates both budget durations
  and per-model budgets; B745 enforces the admin-only output-token estimates and batch token limit.
  soft_budget >= an explicit max_budget gives 400 with both values. This comparison runs before
  configured max_budget defaults, so do not add a second comparison after defaulting. The source
  counts teams and checks the license cap; omit that cap under the recorded product decision.

  A missing team_id becomes a UUID. An explicit litellm-dashboard gives 400 with the reserved-ID
  explanation; an existing ID gives 400 asking for a different team ID. There is no duplicate-alias
  guard. Through B803, inherit organization_id only when its default is a string, then fill null
  max_budget, budget_duration, tpm_limit, rpm_limit and team_member_permissions from
  litellm_settings.default_team_params (default None). Explicit null budget_duration deliberately
  suppresses its default. If max_budget is still None, use max_budget from the first dict in
  litellm_settings.default_team_settings (default None); an empty list or non-dict first item does
  nothing. Request values beat defaults, and default_team_params beats the legacy list.

  B879 loads an organization with its budget table; missing organizations become 400 with
  organization_id in the detail. B1204 checks organization ceilings, or for a standalone non-admin
  team the caller's user ceilings. Organization teams skip the user-ceiling branch. B803 adds a
  creator with a user_id as admin only when absent from members_with_roles; proxy admins can disable
  this with general_settings.disable_auto_add_proxy_admin_to_teams=true (default absent/false).
  Ordinary creators are still added. Use B861's passthrough/global-guardrail guards, strip B802's
  system-managed metadata, call B801's metadata validator with operation=create and no old metadata,
  then call B2301.validate_router_settings_weights with the new team ID before any insert.

  Preserve the partial-write order. A dictionary model_aliases, including {}, creates a model-alias
  row first, with created_by and updated_by equal to the caller user_id or proxy admin name. B818's
  all-proxy-MCP grant check follows, then B816 writes object permissions, then B802 creates a member
  budget when its predicate requires one. Construct TeamTable and set each non-null ordinary/premium
  metadata field through B861. B2317's get_budget_reset_time supplies budget_reset_at and each budget
  window's ISO reset_at. Extract members and persist an empty members_with_roles list initially;
  serialize router_settings as supplied or {}. Use B2304.encrypt_callback_vars on metadata BEFORE
  B124.jsonify_team_object and insertion. Both logging[].callback_vars and
  callback_settings.callback_vars must exercise actual encryption, prefix-idempotence and unchanged
  nonsensitive values. Its source catches encryption failure and returns the original value; the
  compatibility case must expose that plaintext fallback rather than claim every write is encrypted.

  Only the team insert and B819.reconcile_team_access_group_membership share a transaction. A failure
  there rolls back the team and access-group changes but leaves the earlier alias, permission and
  member-budget rows. After commit, B819.invalidate_access_group_caches runs, then B807 adds members
  and their user-table memberships. A cache or member failure does not undo the committed team. Only
  then enqueue B065's audit write: action=created, table=LiteLLM_TeamTable, object_id=team_id,
  before_value=None, fresh UUID/time and changed_by_api_key from the caller. updated_values is the
  pre-storage TeamTable snapshot with the final member roster: first .json(exclude_none=True),
  then json.dumps of that JSON STRING. Preserve this double encoding at the event boundary;
  it is not the encrypted metadata row. B065 owns audit redaction/storage and changed_by selection: trust a truthy
  litellm-changed-by only when caller/team metadata allow_litellm_changed_by_header is true, otherwise
  caller user_id or proxy admin name. Use the tracked background-task facility; audit completion is
  not a prerequisite for the response.


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Audit enablement consumes B065.is_audit_logging_enabled: explicit litellm_settings.store_audit_logs
  (default None) wins over LITELLM_STORE_AUDIT_LOGS, then the source premium flag supplies the fallback.
  Let B065 own the no-paid-tier fallback policy. Resolve these settings once through B002 and pass
  typed values; B803 owns default_team_params conversion and B2303 owns the cipher settings consumed by B2304.
  In the MIT oracle, B065.create_audit_log_for_update returns before callbacks/database writes when
  premium_user is not True even if store_audit_logs is explicitly true. Therefore the HTTP audit
  case checks route success/headers and source no-storage behavior; it must not demand a source audit
  row. Compare the constructed snapshot/actor in native route tests with a recording audit port.
  Native delivery enabled by B065's no-paid-tier policy is tested outside equality cases, under
  that owner's deviation, and cannot make the team insert and audit write atomic.


  This route really does catch Exception and raise B124.handle_exception_on_proxy: HTTPException keeps
  its status but becomes internal_server_error with its detail and openai_error_param; ProxyException
  keeps its type/status/param/code, and other exceptions use their status_code or 500 with
  internal_server_error. Compare those exact envelopes and application/json through B001 HttpCase,
  including no_database, reserved_team_id, duplicate_team_id, invalid_budget and missing_organization.
  B052 owns missing/invalid bearer rejection and caller permissions; fixture those HTTP failures without
  inventing an invalid-target route or assuming all non-admins are forbidden.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Config tests team_defaults_precedence, explicit_null_budget_duration, ignored_legacy_defaults,
  creator_admin_opt_out and audit_setting_precedence use the production B002 loader and exercise the
  resulting route. Load every listed default key and the audit env binding; use B065's bool conversion
  tests for invalid env values, with no invented numeric fallback. Add config_yaml seeds containing
  default_team_params, default_team_settings, disable_auto_add_proxy_admin_to_teams and store_audit_logs.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 384 nonblank, noncomment pinned source lines including the long route docstring; allow
  320 production, 300 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring, 0 decoder/fuzz
  and 70 config lines, 755 changed lines estimated within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  native_team_creation_has_no_license_cap proves another team can be created beyond the source license
  limit; keep this deliberate difference out of the MIT equality corpus.


  HTTP registration consumes the complete B052 authentication middleware, so the unrelated-user fixtures
  exercise real virtual-key lookup and permission policy. Apply B865 ManagementEffects to this source-decorated
  route; its concrete cache eviction is a direct dependency, not deferred logging infrastructure.
