id: B342
title: Auto-router savings baselines and cache observations
description: 'Compute the canonical counterfactual baseline through B068 cost calculation using the pinned
  reference request and B013 catalog facts. Add the baseline observation hook for B075''s native prompt-cache
  prediction, with bounded count cache, caller/session scope and invalidation on retry or incomplete responses.
  Carry typed evidence to B344 session rollups without retaining plaintext keys. Do not invent a substitute
  baseline when no candidate can be priced. Implement the owned native service in crates/betterlite-router/src/routing_baselines.rs.
  Add ProbeOperation::RoutingBaselines in tools/oracle/src/router_probes/mod.rs and the corresponding B342 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/proxy/hooks/autorouter_baseline_cache.py:
  _digest (L100-L101), AutoRouterBaselineCache.__init__ (L105-L117), AutoRouterBaselineCache.async_pre_call_deployment_hook
  (L119-L176), AutoRouterBaselineCache._count (L178-L194), AutoRouterBaselineCache.plan (L196-L223), AutoRouterBaselineCache.plan.count
  (L212-L213), invalidate_baseline_cache (L226-L243), finalize_baseline_cache (L246-L255), _capture (L258-L338).
  Implement these behaviors through the typed Rust services above; synchronous facades and structural
  accessors reuse the same primitive instead of separate ports. Function coverage in litellm/router_strategy/savings_baseline.py:
  canonical_model (L48-L70), _models_in (L73-L101), _models_in.candidate (L87-L99), _priced (L104-L134),
  _most_expensive (L137-L143), resolve_baseline (L146-L162). Implement these behaviors through the typed
  Rust services above; synchronous facades and structural accessors reuse the same primitive instead of
  separate ports.'
