id: B342
title: Auto-router savings baselines and cache observations
description: Compute the canonical counterfactual baseline through B068 cost calculation using the pinned
  reference request and B013 catalog facts. Add the baseline observation hook for B075's native prompt-cache
  prediction, with bounded count cache, caller/session scope and invalidation on retry or incomplete responses.
  Carry typed evidence to B344 session rollups without retaining plaintext keys. Do not invent a substitute
  baseline when no candidate can be priced. Use the existing Rust crate boundaries from B004 and B008;
  integrate through the server when the provider dispatcher or callbacks live in another core crate. This
  task's source slices are the linked ranges, not a port of their Python classes. Add the listed oracle
  cases and the matching adapters to B301's component runner where state is not observable over HTTP;
  adapters call production logic and never reproduce it. Use deterministic candidate sets or supplied
  random samples for comparisons, and separate seeded distribution tests for random choices. Extend the
  existing config_yaml fuzz target and committed corpus for every newly accepted config form; unsupported
  keys still fail by full path. Keep the implementation, adapters and tests within 800 changed lines;
  fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/routing-baselines/**
  - tools/oracle/src/router_probes/routing_baselines/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/routing_baselines.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/savings_baseline.py#L27-L162
  why: Canonical model and fixed-reference ranking.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/autorouter_baseline_cache.py#L56-L223
  why: Scoped captures and bounded count cache.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/autorouter_baseline_cache.py#L226-L338
  why: Invalidation and final observations.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests. Name these tests with the routing_baselines prefix so the required
    filter runs them.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(routing_baselines)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/routing-baselines/hardest-tier-priciest-reference.yaml
- tools/oracle/cases/routing/routing-baselines/custom-price-and-base-model.yaml
- tools/oracle/cases/routing/routing-baselines/unpriced-baseline-none.yaml
- tools/oracle/cases/routing/routing-baselines/provider-qualified-name.yaml
- tools/oracle/cases/routing/routing-baselines/caller-session-scope.yaml
- tools/oracle/cases/routing/routing-baselines/retry-invalidates-observation.yaml
- tools/oracle/cases/routing/routing-baselines/incomplete-stream-uncertain.yaml
- tools/oracle/cases/routing/routing-baselines/bounded-count-cache.yaml
deviations: []
out_of_scope:
- Rendering benchmark reports (B355).
- Licensing quota baselines, omitted by the accepted no-paid-tier decision.
pitfalls:
- Rank baseline candidates by the fixed reference request, not by each incoming request's price.
- An OAuth-backed declared provider must not start a device login just to derive a baseline name.
- Classifier costs and savings evidence must remain separate from served-model spend.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
