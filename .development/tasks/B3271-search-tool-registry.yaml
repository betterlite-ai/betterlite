id: B3271
title: Search tool database registry
description: >-
  Build `betterlite-db::search_tools` to manage search-tool CRUD over the existing typed Postgres repository.
  Preserve serialized parameter fields as JSON strings, ISO-8601 timestamps, descending creation order for list reads,
  and reconnect retry for find_many. Keep the separate lookup and delete operations, and create's reconstruction
  from caller input without inventing an encompassing transaction.

  Implement five methods in SearchToolRegistry: add_search_tool_to_db (persist a typed SearchTool, set timestamps
  and id), delete_search_tool_from_db (lookup first, raise on missing, delete and return name), update_search_tool_in_db
  (persist field updates, return result with ISO timestamps), get_all_search_tools_from_db (find_many with descending
  created_at order, reconnect retry, return SearchTool typed list), and get_search_tool_by_id_from_db (lookup one by id,
  return typed SearchTool or None).

  Serialize litellm_params and search_tool_info as JSON strings with safe_dumps, which passes credentials through
  unchanged for persistence; do not redact. Convert Prisma timestamps to ISO format in every returned dict.
scope:
