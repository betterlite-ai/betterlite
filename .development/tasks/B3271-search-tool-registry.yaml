    why: Package exports, including SearchToolRegistry from the registry module.
dod:
  - text: SearchToolRecord and SearchToolTableClient protocols define the Prisma table contracts with async CRUD methods and iterator support.
    proof: [protocols]
  - text: add_search_tool_to_db serializes litellm_params and search_tool_info to JSON strings using safe_dumps, sets created_at and updated_at to datetime.now(timezone.utc), persists the tool, and returns the input with search_tool_id, created_at and updated_at as ISO strings.
    proof: [create-tests]
  - text: >-
      delete_search_tool_from_db looks up the tool by id and raises "Error deleting search tool from DB: Search tool
      with ID {search_tool_id} not found" if the tool does not exist.
    proof: [delete-tests, delete-error-message]
  - text: delete_search_tool_from_db on success returns a dict with "message"="Search tool {search_tool_id} deleted successfully" and "search_tool_name" set to the deleted tool's name.
    proof: [delete-tests, delete-success-response]
  - text: update_search_tool_in_db serializes litellm_params and search_tool_info, sets updated_at to datetime.now(timezone.utc), updates the database row, and returns a dict with ISO-formatted created_at and updated_at.
    proof: [update-tests]
  - text: get_all_search_tools_from_db calls find_many with order={created_at:"desc"}, wraps the call with call_with_db_reconnect_retry, converts each Prisma result to dict, and returns a list of typed SearchTool objects.
    proof: [list-tests, list-order]
  - text: get_search_tool_by_id_from_db looks up one tool by id, converts its Prisma result to dict with ISO timestamps, returns a typed SearchTool or None if not found.
    proof: [byid-tests]
  - text: _convert_prisma_to_dict converts created_at and updated_at datetime objects to ISO-8601 format strings and returns a dict.
    proof: [convert-tests]
  - text: Every mutant in the registry is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: protocols
      why: SearchToolRecord or SearchToolTableClient protocol tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::(record|table_client)/)'
    - id: create-tests
      why: add_search_tool_to_db tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::(create|add)/)'
    - id: delete-tests
      why: delete_search_tool_from_db tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::delete/)'
    - id: delete-error-message
      why: delete_search_tool_from_db error message does not match the exact LiteLLM text
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::delete.*not_found/)'
    - id: delete-success-response
      why: delete_search_tool_from_db success response format or keys do not match LiteLLM
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::delete.*success/)'
    - id: update-tests
      why: update_search_tool_in_db tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::update/)'
    - id: list-tests
      why: get_all_search_tools_from_db tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::(list|get_all)/)'
    - id: list-order
      why: get_all_search_tools_from_db does not return results in descending created_at order
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::.*(order|desc)/)'
    - id: byid-tests
      why: get_search_tool_by_id_from_db tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::(get_by_id|byid)/)'
    - id: convert-tests
      why: _convert_prisma_to_dict timestamp conversion tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^search_tools::convert/)'
