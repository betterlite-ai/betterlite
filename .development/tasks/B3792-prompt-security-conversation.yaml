oracle_cases: []

deviations:
  - what: "When check_tool_results is false (default), tool/function messages are filtered out entirely before calling the protect API. When true, they are transformed to 'other' role and included, allowing indirect prompt injection detection via tool result content."
    why: "LiteLLM accepts tool results as a configuration choice; preserving that semantics requires the role-filtering/transformation to happen in request preparation, not apply_guardrail dispatch."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/prompt_security/prompt_security.py#L739-L788"
  - what: "Response-side protection scans each text independently and raises HTTPException(400) if any verdict action is 'block', collecting violations from all verdicts. Modified texts are returned with stream_holdback_chars carrying byte counts to support streaming safety."
    why: "Response texts come from different model choices and must be evaluated separately; a single streaming response can have multiple chunks from different choices that reach the client at different times. stream_holdback_chars informs the streaming layer when buffering is required."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/prompt_security/prompt_security.py#L350-L388"
  - what: "Structured message rewriting uses message_slot_texts and message_with_slot_texts from the guardrail framework (U1 framework dependency), which may return None if the message type does not support transformation. When None is returned, structured_messages_with_modifications returns None to signal no rewrite is available."
    why: "Not all message types (e.g., tool calls, raw binary content) have a meaningful way to rewrite their slot texts. Framework guardrail translation utilities determine which messages support transformation."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/prompt_security/prompt_security.py#L329-L348"
  - what: "request key-alias resolution checks litellm_metadata.user_api_key_alias before metadata.user_api_key_alias; litellm_metadata is set by the guardrail framework with higher precedence."
    why: "Litellm_metadata is framework-managed and may override user-supplied metadata for security reasons. The preference order matches LiteLLM's behavior in the guardrail framework."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/prompt_security/prompt_security.py#L446-L463"

out_of_scope:
  - "CustomGuardrail base class and @log_guardrail_information decorator: owned by B3664/B3665/B3666"
  - "message_slot_texts and message_with_slot_texts guardrail translation functions: owned by B888"
  - "HTTP client get_async_httpx_client and httpxSpecialProvider: owned by B173"
  - "Config model loading and parameter resolution: owned by B002"
  - "Callback registration via add_litellm_callback: owned by B189"
  - "File sanitization and standalone image processing: owned by B3791"

pitfalls:
  - "check_tool_results environment variable is case-insensitive (true/1/yes are all accepted); leading/trailing whitespace in .lower() must be stripped."
  - "_PROTECT_ROLES = {'system', 'user', 'assistant'}; any other role is non-protected and subject to filtering/transformation."
  - "When filter_messages_by_role transforms tool/function to 'other', the original role is lost and cannot be recovered downstream; this is intentional for indirect prompt injection detection."
  - "_modified_or_original checks verdict.get('action') == 'modify' (exact string equality); None, 'allow', 'block', or missing action all result in returning the original text."
  - "_inputs_with_modifications appends texts list to inputs; if texts is empty, it returns _inputs_with_structured_messages result without texts key."
  - "_structured_messages_with_modifications returns None (not an empty tuple) when indices don't match or rewrite fails; None signals no structured rewrite is available for this verdict."
  - "message_with_slot_texts is a guardrail framework function that may return None for message types that don't support text rewriting; the returned tuple must be checked before indexing."
  - "_extract_texts_from_messages calls message_slot_texts (plural) which returns a list of texts per message; the outer loop flattens all texts from all messages into one list."
  - "_resolve_key_alias_from_request_data returns None, not an empty string, when no alias is found; None indicates no override applies."
  - "filter_messages_by_role returns an empty list when all messages are filtered; the caller (_apply_guardrail_on_request) must check for empty result and return inputs unchanged."
  - "_build_headers always includes Content-Type=application/json; only adds X-LiteLLM-Key-Alias when user_api_key_alias is not None/empty."
  - "_protect_response_text calls async_handler.post with response (string) payload, not responses (list); one verdict is returned per call and they are gathered concurrently."
  - "stream_holdback_chars values are byte counts of modified_text, not original text; they inform the streaming layer how much buffer is needed."
  - "apply_guardrail is async; _apply_guardrail_on_request and _apply_guardrail_on_response are both async and must be awaited."

