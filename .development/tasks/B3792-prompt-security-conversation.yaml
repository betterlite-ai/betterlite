id: B3792
title: Prompt Security conversation protection
description: >-
  Implement request/response protection and structured-message rewrites for
  the Prompt Security guardrail in betterlite. Build the main apply_guardrail
  entry point handling both input and output sides, request/response protection
  via /api/protect endpoint with message filtering by role, key-alias resolution
  from request metadata, structured-message rewriting when protect verdicts
  return modified content, and per-choice response text scanning with streaming
  holdback. Preserve excluded-role filtering with tool-results check support
  and the request key-alias precedence order (litellm_metadata first, then
  metadata). Environment variables read by this task's __init__:
  PROMPT_SECURITY_API_KEY (required, no default),
  PROMPT_SECURITY_API_BASE (required, no default),
  PROMPT_SECURITY_USER (optional, env default None),
  PROMPT_SECURITY_SYSTEM_PROMPT (optional, env default None),
  PROMPT_SECURITY_CHECK_TOOL_RESULTS (default "false", case-insensitive true/1/yes).
  Protected roles are {"system", "user", "assistant"}; non-protected roles are
  filtered unless check_tool_results is true, when they are transformed to "other" role.
  Response-side scanning returns one verdict per text in texts list and applies
  modifications independently, with stream_holdback_chars carrying total
  modified byte counts to preserve streaming safety. apply_guardrail wraps both
  input and output paths with _apply_guardrail_on_request and
  _apply_guardrail_on_response. Build helper functions for guard base
  integration: _modified_or_original extracts modified_text when action is
  modify, _inputs_with_structured_messages patches inputs with rewritten
  messages, _inputs_with_modifications adds texts and rewritten messages to
  inputs, _is_sent_to_protect checks role/tool-results flag,
  _structured_messages_with_modifications maps protect verdicts back onto
  structured messages, _extract_texts_from_messages extracts scannable text
  from modified message dicts, _resolve_key_alias_from_request_data reads
  metadata priority, filter_messages_by_role filters by role with tool-results
  transform, _build_headers constructs API headers with APP-ID and X-LiteLLM-Key-Alias.
