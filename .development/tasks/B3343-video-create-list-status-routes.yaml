  - tools/oracle/cases/api/video-create-routes/video-create-upload.yaml
  - tools/oracle/cases/api/video-create-routes/video-list-query.yaml
  - tools/oracle/cases/api/video-create-routes/video-status-provider.yaml
  - tools/oracle/cases/api/video-create-routes/video-status-model.yaml
  - tools/oracle/cases/api/video-create-routes/video-route-errors.yaml
  - tools/oracle/cases/api/video-create-routes/video-route-auth.yaml
deviations: []
out_of_scope:
  - "video_content, video_remix (endpoints.py 308-514) and their HTTP cases, including the /videos/{video_id}/content cases B3339 left for later: B3344."
  - "video_create_character and video_get_character (endpoints.py 516-723) and encode_character_id_in_response: B3345."
  - "video_edit and video_extension (endpoints.py 725-923): B6360."
  - "get_custom_provider_from_data, extract_model_from_target_model_names and video_reference_to_id in video_endpoints/utils.py: B3330. No handler in this task calls them."
  - "batch_to_bytesio (image_endpoints/endpoints.py): B082. This task calls it."
  - "common_processing_pre_call_logic: B8801. The rest of ProxyBaseLLMRequestProcessing and its exception handler: B004. The provider hint getters and is_known_model: B2400. Body reading: B1100. Model-id lookup: B844."
  - "route_llm_request itself: B6460 owns the video route choice (plan_video_route) and the router wrappers. This task calls them from its three dispatch entries."
pitfalls:
  - "List builds data as {query_params: {...}} and never spreads it, so GET /v1/videos?limit=2 sends no limit upstream. Do not 'fix' this by unpacking the query."
  - "The list route's body getter reads the request body on a GET, and a body custom_llm_provider of an empty string is falsy and drops out of the or-chain."
  - "Status always sets custom_llm_provider, with 'openai' as the last choice. List sets it only when a hint is truthy. Create never sets it."
  - "Status looks up the router only when the decoded model_id is truthy and a router exists. A decoded id with model_id '' (an empty string B672 keeps) does no lookup."
  - "A status call with a model gets no SDK fallback: the router wrapper is an async_wrapper, so route_llm_request.py gets an unawaited coroutine and the router error surfaces at the caller's await, outside the try. Do not add a retry on the SDK function."
  - "The status 'video_id' in data is the raw path string, not the decoded original id; the decode happens again inside B3339's call."
  - "input_reference as a plain string in a form is not an upload and is stored by the body reader; only a real file part goes through batch_to_bytesio."
  - "create, list and status call B6460's plan_video_route before any SDK call. Generation with no model plans NotFound, and List with an unknown model plans NotFound, as in LiteLLM."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
