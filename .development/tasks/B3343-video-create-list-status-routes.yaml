id: B3343
title: Video creation listing and status routes
description: >-
  Register the three video routes that need no content or character logic, in betterlite-server::api::video_routes. Each route is registered at both prefixes and
  sits behind B756 authentication: POST /v1/videos and POST /videos (create), GET /v1/videos and GET /videos (list),
  GET /v1/videos/{video_id} and GET /videos/{video_id} (status). Mount them once, from the route stub video_create.
  The routes /videos/{video_id}/content and /videos/{video_id}/remix (B3344) and /videos/characters, /videos/edits and
  /videos/extensions (B3345 and B6360) are not registered here. axum matches the literal
  /videos/characters path before /videos/{video_id}, so the order of the merges does not matter.

  Every handler builds a data map, runs B8801's PreCall step on it (keep `Arc<dyn PreCall<UserAPIKeyAuth>>` in the route state, built with `PreCallStep::standalone` in routes(state), which B8804 swaps for the production step) and hands it to B004's common request processor with a fixed route_type and passes the
  server's user_model, user_temperature, user_request_timeout, user_max_tokens, user_api_base and version. Failures go
  through B004's handle-exception step, so the error envelope, status, x-litellm-call-id and the other x-litellm-*
  headers are B004's. model is always passed as None to the processor.

  Create (route_type "avideo_generation"). Read the body with B1100's body reader. If the request carried an
  input_reference file part, convert it with B082's upload-to-named-buffer helper (batch_to_bytesio, called with a
  one-item list) and, only when that returns a nonempty list, store its first buffer under data["input_reference"]. A
  string input_reference in a JSON or form body stays as the reader decoded it. Create looks for no custom_llm_provider
  hint itself: a body value reaches the call only because the body is the data map. B3338's call picks the provider.

  List (route_type "avideo_list"). data starts as {"query_params": <all query parameters as a map of strings>}. The
  query map is nested under that one key; it is not spread into data, so after, limit and order in the query string
  never reach the list call (LiteLLM reads no query_params key anywhere below the route). Then the provider hint:
  B2400's header getter (custom-llm-provider), else its query getter, else its body getter, each used only when
  truthy. A non-empty hint is stored as data["custom_llm_provider"]. The body getter reads the body even for a GET.
  No provider hint means no key, and B3340's async list call then infers the provider itself.

  Status (route_type "avideo_status"). data starts as {"video_id": <path value>}. Call B672's decode_video_id_with_provider
  on the path value. The provider is the first truthy of: B2400's header getter, query getter, body getter, the decoded
  custom_llm_provider, and the literal "openai". It is always stored as data["custom_llm_provider"], so a status call
  always has one. If the decoded model_id is truthy and a router exists, ask B844's resolve_model_name_from_model_id
  for a public name and, when that is truthy, store it as data["model"]; otherwise leave model unset. With no router
  the lookup is skipped. The processor then calls B3339's video_status_call with these values.

  Dispatch. Fill the three core entries B014 registers for these calls: operation/video_generation.rs with
  dispatch/video_generation.rs, operation/video_list.rs with dispatch/video_list.rs and operation/video_status.rs with
  dispatch/video_status.rs (VideoGeneration, VideoList and VideoStatus). Each execute replaces its NotBuilt stub and stub test. Leave operation.rs and
  dispatch.rs as they are. All three LiteLLM handlers go through route_request, so each entry first calls B6460's plan_video_route
  with its VideoCallKind (Generation, List or Status), the data map's model, the team id and the other VideoRouteInput fields. A Direct plan calls B3338 avideo_generation, B3340 avideo_list
  or B3339 avideo_status. A Router plan calls the matching method of B6460's VideoRouterCalls (avideo_generation, avideo_list or avideo_status) with the model and a VideoCallArgs built from
  data. A NotFound plan returns the model-not-found error. The entry gets VideoRouterCalls and VideoRouteView as injected trait objects, because betterlite-core cannot import betterlite-sdk or the
  router. At the pin a status call with a model gets no SDK fallback: Router.avideo_status comes from factory_function's async_wrapper, so route_llm_request.py L700-L706 gets an unawaited coroutine and
  a router error surfaces at the caller's await, outside the try. The router error therefore reaches the client, and the entry never retries the SDK function.

  Route tests are in api::video_routes::tests of betterlite-server and the router error test in
  dispatch::video_status::tests of betterlite-core, with HTTP cases through both proxies
  in tools/oracle/cases/api/video-create-routes. Fixtures boot both gateways with master_key=sk-test and the OpenAI
  mock provider for videos from B3333, B3334 and B3337. The owned source is about 230 non-blank, non-comment lines
  (three handlers, the status provider rule and the dispatch). Budget 300 implementation, 260 tests and 220 oracle
  fixtures, 780 in all. B1100 registers the route stub video_create. Fill only
  crates/betterlite-server/src/routes/video_create.rs and leave routes.rs and state.rs as they are.
