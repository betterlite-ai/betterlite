dod:
  - text: POST /v1/videos and /videos, GET /v1/videos and /videos, and GET /v1/videos/{video_id} and /videos/{video_id} each answer with the mock provider's result under a valid key; each path is registered once; POST on a GET-only path and GET on /videos with a different method give 405.
    proof: [route-aliases, oracle]
  - text: A create request with a multipart input_reference file reaches the provider as a named file, and an empty upload leaves input_reference unset; a JSON create body reaches the call unchanged.
    proof: [create-upload, oracle]
  - text: The list route nests all query parameters under query_params, so limit, after and order in the query string do not reach the provider request, and the provider hint comes from header, then query, then body.
    proof: [list-query-params, oracle]
  - text: The status provider is the first truthy of header, query, body, the id's embedded provider and "openai", and is always set; an empty header falls through to the next source.
    proof: [status-provider-order, oracle]
  - text: A status id with an embedded model_id sets model to the router's public name for it, and sets nothing when the id has no model_id or the lookup finds no name.
    proof: [status-model-lookup, oracle]
  - text: A status call with a model plans Router and calls VideoRouterCalls, and a router error reaches the client with no SDK retry; list and status with no model plan Direct and call the SDK function; create, list and status all go through plan_video_route.
    proof: [status-router-error]
  - text: Provider failures, malformed bodies and unsupported-provider errors reach the client as B004's error envelope with x-litellm-call-id.
    proof: [error-envelopes, oracle]
  - text: A missing or wrong key gives 401 auth_error from B756 with zero provider requests, on every alias.
    proof: [auth-failures, oracle]
  - text: The branch adds HTTP oracle cases for these routes.
    proof: [new-cases, oracle]
checks:
  optional: []
  commands:
    - id: route-aliases
      why: one of the six paths is missing, registered twice, or answers the wrong method
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_routes::tests::route_aliases($|::)/)'
    - id: create-upload
      why: the input_reference upload is not converted, or an empty upload sets the key
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_routes::tests::create_upload($|::)/)'
    - id: list-query-params
      why: query parameters are spread into data or the list provider hint order is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_routes::tests::list_query_params($|::)/)'
    - id: status-provider-order
      why: the status provider order differs from header, query, body, id, "openai" or an empty value stops the fall-through
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_routes::tests::status_provider_order($|::)/)'
    - id: status-model-lookup
      why: the model_id lookup is skipped, runs without a router, or sets model from an empty name
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_routes::tests::status_model_lookup($|::)/)'
    - id: status-router-error
      why: a router error on a status call is swallowed or retried on the SDK function, or a modelless call uses the router
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^dispatch::video_status::tests::status_router_error($|::)/)'
    - id: error-envelopes
      why: a failure skips B004's error handling or loses x-litellm-call-id
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_routes::tests::error_envelopes($|::)/)'
    - id: auth-failures
      why: a route is reachable without a valid key or reaches the provider first
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::video_routes::tests::auth_failures($|::)/)'
    - id: new-cases
      why: the branch adds no HTTP oracle cases for the video routes
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/video-create-routes)"
oracle_cases:
