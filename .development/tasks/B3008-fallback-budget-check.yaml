  - tools/oracle/cases/auth/fallback-team-key-inherits-budget-when-opted-in.yaml
  - tools/oracle/cases/auth/fallback-no-key-in-metadata-is-unrestricted.yaml
  - tools/oracle/cases/auth/fallback-enforcement-disabled-allows-all.yaml
  - tools/oracle/cases/auth/fallback-stale-counter-still-enforced.yaml
