  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L3356-L3391
    why: UserAPIKeyAuth class definition with user_spend and user_max_budget fields
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/models/verification_token.py#L17-L28
    why: LiteLLM_VerificationToken base class with inherited fields max_budget, spend, token and team_id
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L836-L919
    why: fallback_budget_check Router constructor parameter and its docstring describing the protocol
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L1049-L1059
    why: FallbackBudgetCheck Protocol definition with __call__ signature the predicate must match
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/tests/unit/proxy/auth/test_fallback_budget.py
    why: Test cases covering zero-cost bypass, team key opt-in, stale counter semantics, fail-closed behavior and metadata field parsing
dod:
  - text: The predicate is built in betterlite-auth and available as a module-level instance.
    proof:
      - instantiation
  - text: >-
      Zero-cost fallback targets are always allowed, even when the key or user is over budget. A paid target is denied
      only when the key's spend >= max_budget or the user's spend >= max_budget (if applicable).
    proof:
      - oracle
  - text: >-
      Enforcement is enabled by default (enforce_fallback_budget defaults to true). When disabled via settings,
      all fallback targets are allowed.
    proof:
      - oracle
  - text: >-
      Requests without user_api_key_auth in metadata or litellm_metadata are unrestricted.
    proof:
      - oracle
  - text: >-
      Team keys do not inherit the owner's personal user budget unless apply_user_budget_to_team_keys is explicitly true.
    proof:
      - oracle
  - text: >-
      A stale-low spend counter is detected and verified against the authoritative database spend by passing max_budget
      to get_current_spend, so the paid fallback is correctly refused.
    proof:
      - oracle
  - text: >-
      A spend lookup exception must deny the fallback (fail closed), and the exception is logged as a warning.
    proof:
      - oracle
  - text: >-
      The predicate receives settings through runtime calls to general_settings, not constructor injection, matching LiteLLM's design.
    proof:
      - oracle
checks:
  optional: []
  commands:
    - id: instantiation
      why: the fallback budget predicate is not built or not available as router_fallback_budget_check
      run: cargo build --locked -p betterlite-auth && cargo run --locked --quiet -p betterlite --example check_instantiation 2>&1 | grep -q fallback_budget_check
