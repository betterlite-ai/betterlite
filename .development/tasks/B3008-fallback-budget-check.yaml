id: B3008
title: Recheck key and user budgets before router fallbacks
description: >-
  Build `betterlite-auth::fallback_budget` as the router's injected read-only predicate for fallback target budget checking.
  A free target (zero-cost model) is always allowed, mirroring the auth-time bypass. A paid fallback is attempted only
  when the key and user (if applicable) are still within their max_budget limits. The predicate fails closed: a spend
  lookup exception must deny the fallback, while missing auth metadata, disabled enforcement and free models retain their
  pinned bypasses.

  Serve the budget check through a dataclass-frozen RouterFallbackBudgetCheck that holds an is_enforced callable and
  exposes an async __call__ method matching the Router's fallback_budget_check signature. Build the predicate with
  is_enforced=_enforced_by_general_settings so the runtime setting determines enforcement.

  This checks key and user budgets only, not team, team-member, end-user, org, global or per-model budgets, and does not
  reserve against the counter: it reads the current spend and compares it against max_budget. Preserve exact-ID/legacy-ID
  lookup order, metadata field order (metadata then litellm_metadata), team-key personal-budget opt-in and stale-counter
  verification (passing max_budget to get_current_spend).
scope:
  paths:
    - Cargo.toml
    - deny.toml
    - crates/betterlite-auth/**
    - tools/oracle/cases/auth/**
    - tools/oracle/helpers/b3008.py
    - tools/oracle/helpers/b3008/**
    - tools/oracle/src/helpers/oracle/b3008.rs
    - tools/oracle/src/helpers/oracle/b3008/**
  lint_tables: false
