deviations:
  - what: >-
      betterlite checks key and user budgets only. Team, team-member, end-user, org, global and per-model budget checks
      are not implemented; they belong to their respective tasks and would trigger threshold alerts and spend reservations
      if reused here.
    why: >-
      Fallback targets are skipped, not billed, so enforcing checks that carry side effects (alerts, reservations)
      would block a free fallback without billing the caller.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/fallback_budget.py#L14-L20
  - what: >-
      betterlite does not reserve against the spend counter on the fallback path. Multiple concurrent fallback attempts
      all see the same pre-billing spend figure, so the actual total can exceed the budget cap by roughly the number of
      concurrent fallbacks times their individual cost.
    why: >-
      Reservations are expensive (they increment counters and require cleanup on cancellation). The auth path pre-fills
      the counter through reserve_budget_for_request; fallbacks that bypass the primary do not pay that cost.
      This is a known soft-cap limitation shared with fallback_model_access.py in LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/fallback_budget.py#L23-L28
out_of_scope:
  - Team, team-member, end-user, org, global and per-model budgets; their implementations live in other tasks.
  - Rolling budget_limits windows (spend:key:{token}:window:{budget_duration}); those counters are model-specific and owned by the model-budget enforcement task.
  - Reservation of budget on the fallback path; that would require settlement cleanup when the fallback is skipped.
  - The admin UI, configuration loading and database access; those belong to their respective tasks.
  - _is_model_cost_zero implementation; that is owned by B750.
pitfalls:
  - Do not hardcode settings lookup or use global singletons. Call _enforced_by_general_settings() and _applies_user_budget_to_team_keys() at runtime to honor config changes without restart.
  - The predicate extracts metadata from both metadata and litellm_metadata fields in the request_kwargs. Try metadata first, then litellm_metadata, and return None if neither contains user_api_key_auth or parsing fails.
  - Pass max_budget to get_current_spend even when checking only to trigger verification against the authoritative database spend if the cached counter reads stale-low. Without it, a counter restored from an old Redis snapshot would pass even when the user is over budget.
  - Team keys do not carry the owner's personal budget by default. Only apply the user budget check when valid_token.team_id is None or apply_user_budget_to_team_keys() returns True.
  - A zero-cost model must bypass all budget checks, not just one. Check _is_model_cost_zero first and return True immediately.
  - Catch all exceptions in __call__, log them as a warning, and return False (deny the fallback). Never let an exception bubble up; the log includes the model name, the exception type and the message.
  - UserAPIKeyAuth.spend and user_spend are optional (may be None); use 0.0 as the fallback value when reading them. Do not compare None against a max_budget.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 1
