  optional: []
  commands:
    - id: workflow-events-tests
      why: Event/message append, list and transaction/collision logic fail or ownership is not enforced.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^workflow_events::/)'
