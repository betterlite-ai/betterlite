id: B3160
title: Append workflow events and conversation messages
description: >-
  Build POST/GET `/v1/workflows/runs/{run_id}/events` and POST/GET `/v1/workflows/runs/{run_id}/messages`
  in betterlite-server::workflow_events, using the existing typed table repositories. Implement
  four routes with optimistic sequence-number concurrency, atomic event+status transactions,
  and ascending sequence-ordered reads. Enforce run ownership via _require_run on both
  event and message routes, but preserve the GET/POST asymmetry: GET routes pass
  _read_scope_caller output to _require_run, which returns None for admin-view callers,
  causing ownership checks to be skipped; POST routes pass the raw auth dict, so ownership
  is enforced uniformly.

  On append_workflow_event, generate the next sequence number, attempt insertion up to five times
  on unique-constraint collisions (incrementing the sequence number each retry), and execute event
  creation and any status update in a single transaction. The event_type may map to a new run
  status via the _EVENT_STATUS_MAP constant (step.started→running, step.failed→failed, hook.waiting→paused,
  hook.received→running). After five failed attempts, return 409 with "Concurrent write conflict — please retry".
  Store event_data containing run_id, event_type, step_name, sequence_number and an optional JSON-encoded
  data field; event insertion and status update share one transaction.

  On list_workflow_events, fetch events filtered by run_id, ordered ascending by sequence_number,
  with a default limit of 100 and maximum 500. Return {events, count}.

  On append_workflow_message, follow the same retry pattern as events but independently insert
  messages with sequence numbers. Store role, content, run_id, sequence_number and optional session_id.

  On list_workflow_messages, fetch messages filtered by run_id, ordered ascending by sequence_number,
  with a default limit of 100 and maximum 500. Return {messages, count}.

  All four routes authenticate via the existing user_api_key_auth dependency and return 500
  with CommonProxyErrors.db_not_connected_error detail when the database is absent.
  Sequence collision, transaction, and HTTP error details are carried in cases below.
scope:
  paths:
    - crates/betterlite-server/src/workflow_events.rs
    - crates/betterlite-server/src/workflow_events/**
    - tools/oracle/cases/management/workflows/**
    - tools/oracle/helpers/b3160.py
    - tools/oracle/helpers/b3160/**
    - tools/oracle/src/helpers/server/b3160.rs
    - tools/oracle/src/helpers/server/b3160/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/workflow_management_endpoints.py#L353-L530
    why: Four workflow event/message routes with retry logic, transactions, and sequence ordering.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/workflow_management_endpoints.py#L44-L71
    why: _MAX_SEQUENCE_RETRIES constant (5) and _EVENT_STATUS_MAP transition table.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/workflow_management_endpoints.py#L94-L104
    why: WorkflowEventCreateRequest and WorkflowMessageCreateRequest models.
dod:
  - text: >-
      POST /v1/workflows/runs/{run_id}/events appends an event with optimistic concurrency,
      retries up to five times on sequence-number collision, and executes event creation and
      status update in a single transaction; the fifth failed attempt raises 409.
    proof: [workflow-events-tests, oracle]
  - text: >-
      GET /v1/workflows/runs/{run_id}/events returns events ordered ascending by sequence_number
      with configurable limit (default 100, max 500). GET routes skip ownership checks for
      admin-view callers but enforce them for non-admin keys.
    proof: [workflow-events-tests, oracle]
  - text: >-
      POST /v1/workflows/runs/{run_id}/messages appends a message with independent optimistic
      concurrency retries, storing full content and optional session_id; the fifth failed
      attempt raises 409.
    proof: [workflow-events-tests, oracle]
  - text: >-
      GET /v1/workflows/runs/{run_id}/messages returns messages ordered ascending by sequence_number
      with configurable limit (default 100, max 500). GET routes skip ownership checks for
      admin-view callers but enforce them for non-admin keys.
    proof: [workflow-events-tests, oracle]
  - text: >-
      All four routes return 500 with CommonProxyErrors.db_not_connected_error detail when
      the database is absent.
    proof: [workflow-events-tests, oracle]
