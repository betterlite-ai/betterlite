  - tools/oracle/cases/management/workflows/list-events-admin-view-skips-ownership.yaml
  - tools/oracle/cases/management/workflows/post-events-enforces-ownership.yaml
deviations: []
out_of_scope:
  - B003 owns user_api_key_auth integration, the HTTP error boundary and route registration with the axum application.
  - B700 owns the typed create/update/find-many operations and DbSession transaction/unique-violation handling.
  - B726 owns WorkflowEventRepository and WorkflowMessageRepository table handle construction via auxiliary_repository.
  - B732 owns user_api_key_has_admin_view authentication check and the middleware hook that provides the authenticated principal.
  - B3159 owns _require_run, _get_next_sequence_number, _read_scope_caller, _json, _is_admin, _caller_key, _EVENT_STATUS_MAP and the request/response models.
  - The database schema (WorkflowEvent, WorkflowMessage tables) is preregistered in schema.prisma at B000.
pitfalls:
  - >-
    GET routes call _read_scope_caller, which returns None for admin-view callers,
    causing _require_run to skip ownership enforcement; POST routes pass the raw auth
    dict, so ownership is enforced uniformly on all POST writes. This asymmetry allows
    admin and view-only callers to list or read another key's events and messages, but
    prevents them from modifying (appending to) another key's runs.
  - >-
    The fifth failed attempt raises 409 directly inside the retry loop — no sixth call
    is made. The loop iterates from 0 to 4 (five total), and when attempt 4 fails with
    a unique-constraint violation, 409 is raised immediately, not after a sixth retry.
  - >-
    Event insertion and status update must execute in a single transaction; if either
    fails, both are rolled back and the retry increments the sequence number.
  - >-
    Message insertion does not update run status and does not use a transaction; each
    message append is independent and uses the same retry pattern as events.
  - >-
    Sequence numbers are requested fresh on each retry attempt; reusing a cached value
    would collide again.
  - >-
    Event data may contain any JSON-serializable object, which must be passed through
    _json before storage. Message content is already a string and is stored directly,
    not JSON-encoded.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
