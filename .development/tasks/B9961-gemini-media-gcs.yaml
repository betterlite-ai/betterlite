id: B9961
title: Gemini media resolves GCS object content types
description: >-
  B1311's process_media resolves a gs:// reference from a format hint or the file extension, and
  gemini_media::process::inferred_gcs_mime answers MediaError::RemoteMediaRequired when neither exists.
  LiteLLM reads the object's content type from the GCS JSON API instead: the gs:// branch of
  _process_gemini_media calls _get_gcs_object_content_type(image_url, vertex_project, vertex_credentials)
  for an extensionless reference with no format (transformation.py L522-L527) and raises "Unable to
  determine mime type for gs URI" when it returns None (L528-L539), taking the two auth arguments from
  litellm_params.vertex_project or vertex_ai_project and litellm_params.vertex_credentials or
  vertex_ai_credentials (L711-L715). Row 1 of docs/deviations/B1311.yaml records the refusal. B9965
  rewrites that row to the extensionless gs:// case alone and adds prepare to
  gemini_request/media_prepare.rs, which inlines http(s) request media through B5083's fetcher; B183's
  seam treats only http:// and https:// as remote, so a gs:// reference passes prepare untouched. No
  route builds CallDeps on main, so nothing in production reaches GeminiCall yet.


  On main the conversion is already right for every other gs:// shape. body.rs::transform extracts the
  system instruction, appends the response-schema prompt, merges the litellm_param_ keys and then calls
  convert_messages_with_history for vertex_ai and vertex_ai_beta or studio_chat::transform_messages for
  gemini, and both walkers reach gemini_history::media_source::push_source and
  gemini_media::process::process_media. A reference with an accepted extension or an explicit format
  already builds file_data with the inferred or explicit MIME, the Files API, https passthrough and data
  URL branches already match LiteLLM, and assistant provider_specific_fields.images already convert
  through push_source. The missing branch is only the extensionless gs:// reference with no hint, on
  every entry and both providers.


  Add crates/betterlite-vertex/src/gemini_media/gcs_metadata.rs (the skeleton creates the file and
  declares `pub mod gcs_metadata;` in gemini_media.rs) with the lookup _get_gcs_object_content_type
  performs. GcsTransport is an object-safe Send + Sync trait whose get takes an OutboundRequest and
  returns a boxed MetadataFuture, implemented for ProxiedClient as
  send_following(request).await?.buffered(self.limits.body_bytes).await in the shape of
  google_count_tokens/transport.rs; the boxed future keeps the pass out of the generic parameters of
  CallRequest and transform. GcsDeps holds transport: &dyn GcsTransport and tokens: &dyn MintAccessToken,
  which CredentialCache already implements, so no auth code is added. auth_values(litellm_params) reads
  vertex_project then vertex_ai_project and vertex_credentials then vertex_ai_credentials with Python or
  truthiness (Json::is_truthy, docs/compatibility.md), so null, false, zero, an empty string, list or
  object is absent. bucket_is_valid repeats _is_valid_gcs_bucket_name's five checks (L224-L240): length 3
  to 63, or 3 to 222 when the name holds a dot, dot labels of 1 to 63, the [a-z0-9][a-z0-9._-]*[a-z0-9]
  pattern, no two dots in a row, and not a dotted quad. metadata_url(gs_uri) returns None unless the uri
  starts with gs://, splits once at the first slash with both parts non-empty and the bucket passes;
  otherwise it builds https://storage.googleapis.com/storage/v1/b/{bucket}/o/{object}?fields=contentType
  with both parts quoted like Python quote(safe=""), which keeps only A to Z, a to z, 0 to 9, dot,
  hyphen, underscore and tilde, so a slash becomes %2F and a literal percent becomes %25.
  betterlite_http::url_path::quote_segment is that quoting, split out of encode_segment so both callers
  share one set, because encode_segment rejects the dot and dot-dot segments that are legal object names.
  object_content_type(gs_uri, auth, deps) resolves the uri first, so a bad uri or bucket sends no request
  and mints nothing. The lookup is explicit when either auth value is present. An explicit lookup decodes
  credentials with ConfiguredCredentials::from_text (an inline object is serialized first), mints with
  MintAccessToken::mint(credentials, project) and sends the GET with an Authorization: Bearer header, no
  other header and no body; anything unusable there, a mint error, a transport error, a final status of
  400 or above, a body that is not JSON, a body that is not an object, or a contentType that is missing,
  empty or not a string answers Err. An anonymous lookup sends the same GET without the header, and every
  failure answers Ok(None). Both use METADATA_DEADLINE, Duration::from_secs(5), LiteLLM's shared handler
  timeout (L99-L103); a final status below 400 is parsed as JSON, matching LiteLLM's is_error check, and
  redirects go through the shared proxy client as LiteLLM's httpx handlers do.


  Add MediaError::UnknownGcsContentType(String) to gemini_media/error.rs with the message "Unable to
  determine mime type for gs URI: {0}", status 400, type None, param None and code Some("400"), the
  bodyless BadRequest shape both LiteLLM's explicit failures and its None case produce, and include it in
  the four methods there. Add pub async fn resolve_gcs_content_types(messages: Vec<Message>,
  litellm_params: &Object, deps: &GcsDeps<'_>) -> Result<Vec<Message>, HistoryError> to media_prepare.rs
  after prepare. It walks the messages in order. For the user and system roles it takes content parts
  that carry a media locator; extract append_user_part's image_url, file and input_audio dispatch into a
  pub(crate) media_locator in gemini_history/media_source.rs and call it from both. For the assistant role
  it reads provider_specific_fields.images entries through generated_image. A reference is resolved when
  its url contains gs://, MimeHints::explicit() is None, and
  gemini_media::process::splitext_extension (made pub(crate), os.path.splitext semantics at L500-L503) is
  empty; every other reference stays byte-identical. On Some(content_type) it calls
  gemini_media::mime::normalize_mime_type (L452-L475) and writes the canonical MIME as the format key
  into the image_url or file object, wrapping a bare-string image_url in {url, format}; on Ok(None) or
  Err it returns HistoryError::Media(MediaError::UnknownGcsContentType(url)). It probes every occurrence,
  in message order, with no dedupe, as LiteLLM's per-part call does. Assistant content parts other than
  text are never converted, so they are never walked, and tool results never probe.


  Wire it through the request. orchestration.rs's CallRequest gains pub gcs: GcsDeps<'request>, body_from
  passes &request.gcs into transform, and body.rs::transform gains the gcs parameter and calls the pass
  after extract_system_instruction, append_response_schema_prompt and the litellm_param_ merge and before
  the provider match, mirroring _transform_request_body's order (L1149-L1194). gemini_call.rs's CallDeps
  gains pub gcs: &'deps dyn GcsTransport and gemini_call/body.rs builds gcs: GcsDeps { transport:
  deps.gcs, tokens: deps.llm.cache.as_ref() } beside the fetcher. body_from's signature does not change,
  so orchestration/async_media.rs is untouched. gemini_call/tests/ordered_effects.rs stays in scope for
  one assertion B9965's fetch flips (ordered_effects_remote_tool_media_follows_the_branch_transform
  expects the async branch to refuse); update it only if B9965 lands without that change, because the
  new GCS field itself is built by support.rs::deps.


  Write the tests first. In gemini_request/tests.rs add gcs_ tests that drive transform_request_body and
  transform_request_body_async through the harness B9965 leaves: the harness owns a map-backed
  GcsTransport keyed by URL and a MintAccessToken recording each project, and its refusing GcsTransport
  answers TransportError::Closed; every gcs_ case also leaves the harness's request-media fetch count at
  zero, because a gs:// reference is never an http(s) fetch. gcs_request_resolves_metadata (an extensionless image_url builds
  file_data with the mapped MIME, one request and no mint), gcs_request_mints_with_explicit_project (one
  mint with the project and a Bearer header), gcs_request_uses_the_project_alias (an empty vertex_project
  falls through to vertex_ai_project), gcs_request_resolves_file_and_assistant_images (a file.file_data
  reference and an assistant images entry, two requests), gcs_request_normalizes_metadata_type
  (IMAGE/JPG; charset=utf-8 becomes image/jpeg), gcs_request_skips_explicit_references (an accepted
  extension, an explicit format, a Files API URI, an https URL and a data URL make no request),
  gcs_request_fails_without_metadata (a refusing transport answers the bodyless 400 with type None,
  param None and code "400", raised from HistoryError::Media(MediaError::UnknownGcsContentType)),
  gcs_request_invalid_bucket_makes_no_request and
  gcs_request_mint_failure_fails (no request, the same tuple). Every one fails on main because main never
  builds a metadata request. In gemini_media/gcs_metadata/tests.rs cover the unit tables:
  gcs_metadata_urls (the bucket and quoting cases), gcs_metadata_auth_aliases (Python or truthiness),
  gcs_metadata_responses (200 JSON, 200 with {}, 200 with a non-JSON body, 403, 500 and a transport
  error, anonymous and explicit) and gcs_metadata_request (GET, the fixed url and query, the 5-second
  deadline, the Bearer header only when explicit, no content-type header).


  Compare against LiteLLM through a new helper operation b9961, pre-registered in the vertex group by the
  skeleton (replace the stub in tools/oracle/src/helpers/vertex/b9961.rs, write ops.rs, tests.rs and
  tools/oracle/helpers/b9961.py; the registry files and dispatch.py are not this task's to edit). The
  input per case is messages, model, litellm_params, a metadata script of status plus json or body or
  error: connect, and mint_error. The Python adapter patches transformation._GCS_METADATA_VERTEX_BASE with
  a stub whose get_access_token records the project and raises on mint_error, patches
  transformation._GCS_METADATA_HTTP_HANDLER with a fake get(url, headers) that records the url and the
  Authorization header and returns httpx.Response(...) or raises httpx.ConnectError, then calls
  _gemini_convert_messages_with_history(messages, model=model, litellm_params=litellm_params). The Rust
  adapter builds GcsDeps from a scripted GcsTransport and a recording MintAccessToken, calls
  resolve_gcs_content_types and then convert_messages_with_history with a fetcher that refuses, and
  answers requests, mints, contents and the error tuple {status, type, param, code}. Cases:
  metadata-explicit-project (gs://my-bucket/folder/my photo and gs://my-bucket/100%, two mints and two
  requests with the quoted path and the Bearer header), metadata-project-aliases (an empty vertex_project
  with vertex_ai_project and vertex_ai_credentials), metadata-anonymous (no auth, no mint, no header),
  metadata-reflected-format (image/jpg; charset=utf-8 canonicalizes to image/jpeg),
  metadata-unsupported-type (application/octet-stream answers 400), skipped-references (extension,
  format, Files API, https and data URL, zero requests), invalid-bucket (an uppercase name and a
  two-letter name, zero requests), metadata-not-found (an anonymous 404 answers 400),
  metadata-auth-failure (an explicit 403 answers 400), metadata-mint-failure (a raising mint answers 400
  with zero requests), metadata-connect-error (an anonymous transport error answers 400) and
  assistant-images. All but skipped-references fail on main, where the reference answers the
  unsupported_remote_media shape. Add the seeds tools/oracle/fuzz/corpus/helper_case/b9961-gcs-metadata.yaml
  and b9961-gcs-failures.yaml.


  Delete row 1 of docs/deviations/B1311.yaml, which is only the extensionless gs:// refusal after B9965
  rewrote it, and keep rows 2 and 3. Add docs/deviations/B9961.yaml with the four rows listed below: the
  single 5-second total deadline, the eager probe before conversion, the cache-prefix conversion that
  still refuses because it has no litellm_params, and the token counter that still refuses for the same
  reason.


  B9965's prepare and this pass meet on the same outcome.messages: prepare runs first and rewrites only
  http(s) references through the fetcher, this pass reads only gs:// references and calls no fetcher, and
  both sit where LiteLLM puts its inline and transform steps. The production diff is about 380 lines, the
  helper adapter about 160 and the deviation rows about 40.
