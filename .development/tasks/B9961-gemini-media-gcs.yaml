deviations:
  - what: The GCS JSON API metadata request carries one 5-second total deadline, where LiteLLM's shared HTTPHandler sets a separate 5-second connect, read, write and pool timeout.
    why: betterlite's outbound request takes one total deadline and the shared proxy client enforces it; a metadata reply is a few hundred bytes, so the difference is only how a connect stall and a slow read share the 5 seconds.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/transformation.py#L99-L103
  - what: Every extensionless gs:// reference in the converted messages is resolved, and its token minted, before any part is converted, in message order; LiteLLM reads each object while converting its part and stops at the first conversion failure, so a request that fails on an earlier part can still have read GCS and minted a token here.
    why: The pass runs before the shared body build so conversion never performs I/O; the error the caller sees carries the same status, type, param and code in both orders.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/transformation.py#L523-L539
  - what: An implicitly cached request whose prefix holds an extensionless gs:// reference without a format still answers 400 with code unsupported_remote_media from the cache-prefix conversion, where LiteLLM's context caching transform converts those messages with no litellm_params and reads the object anonymously, so a public object caches and a private one answers 400.
    why: The metadata read needs the deployment's litellm_params, and B1317's cache-prefix conversion runs before this pass and has no credentials by design; feeding it the deployment's credentials would attach a token on a path LiteLLM keeps anonymous.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/context_caching/transformation.py#L161-L202
  - what: The Google token counter's history conversion still answers 400 with code unsupported_remote_media for an extensionless gs:// reference, where LiteLLM's Vertex token counter converts messages without litellm_params and reads the object anonymously, so a public object is counted.
    why: B197 owns the counter's history conversion; this fix does not thread the transport or the deployment's litellm_params into a path that only counts tokens.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/common_utils.py#L1289-L1297
out_of_scope:
  - B9965 owns the http(s) inline fetch, its fetcher, the prepare signature and the Studio input deletion; this task adds one pass after it and fetches nothing.
  - The cache-prefix conversion in crates/betterlite-vertex/src/cache_prefix/transform.rs (B1317) and the Google token counter in crates/betterlite-vertex/src/google_token_counter/vertex.rs (B197) do not get the pass; rows 3 and 4 of docs/deviations/B9961.yaml record the difference.
  - Tool-result media stays with betterlite_prompts::gemini_tool_results (B1128) and never reads GCS metadata in LiteLLM, so it is not walked.
  - B031 composes the route, builds the shared client and passes it as the GCS transport in CallDeps; no route reaches this code on main, so no end-to-end HTTP case exists here.
  - The GCS JSON API client used by bucket logging and FOCUS reports in betterlite-logging is a different feature; it is not reused or changed.
  - The extension classification, Files API passthrough, https passthrough and data URL decoding are B1311's and stay as they are.
  - The existing gemini_media oracle cases and helper stay as they are; process_media itself still refuses an unprepared extensionless reference as the last-resort guard.
pitfalls:
  - The oracle helper for this task is pre-registered as b9961 by the skeleton. Replace the stub and write the Python module; do not edit tools/oracle/src/helpers/vertex/lib.rs or tools/oracle/helpers/dispatch.py.
  - The probe is explicit only from litellm_params, never from GeminiCall.project or GeminiCall.credentials, and the route's resolved values must not be merged into litellm_params. A deployment whose project comes from litellm_settings or the environment therefore reads GCS anonymously, exactly as LiteLLM does.
  - The alias chain is Python or truthiness, not Option::is_some. An empty string, zero, false, an empty list or an empty object falls through to the next name or counts as absent (docs/compatibility.md).
  - Resolve the uri and validate the bucket before any auth. No mint and no request for gs://bucket, gs:///object, an empty object, a name shorter than three characters, an uppercase letter, two dots in a row or a dotted quad.
  - Quote with betterlite_http::url_path::quote_segment, never cloud_storage::encode_object_name, which percent-decodes first and would send a%20b where LiteLLM sends a%2520b.
  - Use the splitext semantics, not Path::extension. The extension comes from the whole url after its last slash, so gs://bucket/photo.png?x=1 counts as the extension png?x=1 and is not probed on either side.
  - Mint once per reference with no hoisting and no dedupe; two references to the same object mint and send twice, as LiteLLM's per-part call does.
  - The pass runs after extract_system_instruction, append_response_schema_prompt and the litellm_param_ merge and before the provider match in body.rs. Do not move it into prepare, because prepare stays free of gs:// logic and the oracle adapter calls the pass directly.
  - Normalize the metadata value with normalize_mime_type before writing it as the format hint. process_media's gcs_payload applies only apply_mime_alias to an explicit format, so writing the raw contentType would skip the registry and forward application/octet-stream where LiteLLM answers 400.
  - A bare-string image_url is rewritten as {url, format}; an object keeps its other keys, detail included, and the assistant entry keeps its shape.
  - The new error is a bodyless BadRequest with type None, param None and code Some("400"). Do not reuse RemoteMediaRequired, whose code is unsupported_remote_media, and do not route it through HistoryError::FileMedia.
  - System messages are extracted before the pass, so their media never probes; when the model does not support a system message the extraction leaves it in place and LiteLLM merges it into user content, so the system role is walked too.
  - Only provider_specific_fields.images and the user and system content parts are walked; assistant content parts other than text are never converted and tool results never probe.
  - Build the query into the url string (?fields=contentType) and leave OutboundRequest.query empty, so a scripted transport and the real client see one url string.
  - Keep the helper's refusing fetcher and mint doubles short. The vertex helper crate already has FixedMint impls in lyria_speech.rs and speech.rs, and the duplicate-function check pairs near copies.
