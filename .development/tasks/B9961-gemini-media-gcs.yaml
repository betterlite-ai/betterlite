dod:
  - text: An extensionless gs:// image_url and file reach the built body as file_data with the content type the metadata reply names, on vertex_ai, vertex_ai_beta and gemini.
    proof: [gcs-request-tests, oracle]
  - text: The metadata request carries ?fields=contentType, quotes bucket and object like Python quote(safe=""), and sends no Authorization header when litellm_params names no project or credentials.
    proof: [gcs-metadata-tests, oracle]
  - text: A project or credentials in litellm_params makes the lookup mint once through the injected minter and send the Bearer token, and an empty primary alias falls through to the secondary.
    proof: [gcs-request-tests, gcs-metadata-tests, oracle]
  - text: A failed explicit-auth lookup and an anonymous lookup failure both answer the bodyless 400 with type null, param null and code "400", and build no body.
    proof: [gcs-request-tests, oracle]
  - text: An invalid gs URI or bucket name sends no request and mints nothing.
    proof: [gcs-metadata-tests, oracle]
  - text: A reference with an accepted extension, an explicit format, a Files API URI, an https passthrough or a data URL is never probed.
    proof: [gcs-request-tests, oracle]
  - text: docs/deviations/B1311.yaml row 1 is gone and docs/deviations/B9961.yaml records the four remaining differences.
    proof: [deviation-rows]
  - text: The new helper seeds decode under call.b9961.
    proof: [gcs-seed]
  - text: The gemini_history conversion and the gemini_request and gemini_call suites still pass with the pass wired in.
    proof: [vertex-history-suite, vertex-request-suite, vertex-call-suite]
checks:
  optional: []
  commands:
    - id: gcs-metadata-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_media::gcs_metadata::tests::/)'
      why: The url, bucket, auth, response and request tables must match the pinned lookup.
    - id: gcs-request-tests
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_request::tests::gcs_/)'
      why: Both entries must resolve gs:// metadata through the injected transport and fail with the bodyless 400 when it refuses.
    - id: vertex-history-suite
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_history::/)'
      why: The conversion must keep its behavior with the shared media locator and the added error variant.
    - id: vertex-request-suite
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_request::/)'
      why: The shared body build must keep B9965's inline pass and every existing request test green.
    - id: vertex-call-suite
      run: cargo nextest run --locked -p betterlite-vertex --no-tests=fail -E 'test(/^gemini_call::/)'
      why: CallDeps and body_request must compile and keep their ordered effects with the new transport field.
    - id: gcs-python
      run: test -f tools/oracle/helpers/b9961.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
      why: The comparison must call the pinned converter with network and auth replaced by scripts.
    - id: gcs-seed
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/b9961*')" && cargo nextest run --locked -p betterlite-oracle-vertex --no-tests=fail -E 'test(/^b9961::/)'
      why: New helper seeds must parse the production operation tag and input type.
    - id: deviation-rows
      run: test -f docs/deviations/B9961.yaml && test -z "$(grep -F 'extensionless gs://' docs/deviations/B1311.yaml)" && test "$(grep -c '^  - what:' docs/deviations/B1311.yaml)" -eq 2 && test "$(grep -c '^  - what:' docs/deviations/B9961.yaml)" -eq 4 && grep -q -F 'context_caching/transformation.py#L161-L202' docs/deviations/B9961.yaml
      why: The fixed no-fetch row must be gone and the residual differences recorded with their pinned lines.
