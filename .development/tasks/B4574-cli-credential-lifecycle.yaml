id: B4574
title: CLI credential renewal and storage coordination
description: >-
  Add crates/betterlite-cli/src/credentials.rs with credential renewal, storage coordination and rotation.
  Build browser PKCE orchestration, token renewal/revocation coordination and the CLI storage-facing helpers.
  Implement CliTokenData (stored token record), CliContextObj (Click context for vault access), and auth outcome
  TypedDicts (CliTeam, CliPollData, CliSsoStartData, CliAuthResult) that polling and team-selection functions
  consume without reverse dependencies. Preserve same-credential sibling-rotation recovery, save-before-return
  ordering, previous-token revocation ordering and precise keychain fallback notices.
  Implement run_pkce_login orchestration: discover authorization endpoints, register client, build authorization URL,
  open in browser, wait for callback with code, redeem for credential. Implement token renewal: load from vault,
  check expiry against CLI_TOKEN_FRESHNESS_BUFFER_SECONDS (60 seconds before expiry), refresh when needed,
  handle failure by re-reading and checking if sibling refreshed the pair first (same identity fields, different token,
  not expired), return that key or still-valid original. Rotation saves new token before returning, so crash never strands
  CLI with burned refresh token. Revocation of old token is best-effort after save succeeds; transient failures warn but
  do not stop login. Coordinate with B4573's PkceFailure and RevocationUnavailable outcomes. Own auth context/team/poll/token
  contracts and constants so polling and command consumers do not depend back on login dispatch. Storage layer (load/save/clear token,
  vault access, keyring integration) is owned by unresolved cli_token_utils prerequisite; task wraps those calls and adds
  renewal and revocation orchestration.
scope:
