deviations: []
out_of_scope:
  - Token utility helpers (load_cli_token, save_cli_token, clear_cli_token, get_cli_token_file_path, is_cli_token_fresh) and the SecretVault trait; owned by the unresolved prerequisite task for cli_token_utils.py. This task wraps those calls and coordinates renewal around them.
  - Keyring backend selection, installation and availability probing; implemented in cli_token_utils and wrapped here in storage_notice and keychain_unreadable_notice.
  - Token field parsing and validation (CliTokenRecord); the storage helper validates the shape and delegates to save_cli_token.
  - Token expiry model beyond the stored expires_at field and the 360-second freshness buffer.
  - Browser opening, user prompts and terminal output for login flow; handled by run_pkce_login orchestration in pkce_login.py.
  - Team selection and SSO polling logic; owned by B4576 and B4575.
  - PKCE protocol details (registration, authorization, code redemption, revocation); owned by B4573.
pitfalls:
  - Base URL comparison must strip trailing slashes on both sides; get_stored_api_key checks this when expected_base_url is provided.
  - Freshness check uses now() < expires_at - CLI_TOKEN_FRESHNESS_BUFFER_SECONDS (360 seconds), so a token at exactly the buffer time is refreshed, not returned.
  - Sibling rotation detection must check every identity field (base_url, token_endpoint, resource, user_id, team_id) in _CREDENTIAL_IDENTITY_FIELDS so a concurrent login to a different proxy or user is not mistaken for a rotation.
  - Refresh failure must call reload() to get the latest record before checking for sibling rotation, because a concurrent process may have just written it after the initial failure.
  - _refresh_inputs returns None when any of the five fields is absent or not a non-empty string; callers must handle None and treat it as "no refresh available" (not an error).
  - Revocation on token rotation checks only whether refresh failed; a transient 503 (RevocationUnavailable) warns but does not stop the login, because the refresh succeeded and the old token expires on its own.
  - _renewal_saver warnings go to stderr; they inform the user about loss of credential persistence, not authentication failure, so the command continues with the (transient) key in hand.
