dod:
  - text: load_token reads the stored CliTokenData from vault using load_cli_token (from cli_token_utils) and returns it as a Mapping when present, or None.
    proof: [storage-coordination]
  - text: save_token writes a CliTokenData to vault using save_cli_token and returns a SecretSave outcome (SecretStored, KeyringNotInstalled, CredentialNotSaved, etc.).
    proof: [storage-coordination]
  - text: _renewal_saver returns a callback that persists a CliTokenData to vault and warns to stderr on CredentialNotSaved or CredentialNotRecorded.
    proof: [renewal-coordination]
  - text: _renewal_reader returns a callback that re-reads and returns the stored token from vault, or None.
    proof: [renewal-coordination]
  - text: get_stored_api_key returns the stored key when expected_base_url matches (or is None), refreshing first when near expiry using fresh_api_key; returns None when no token.
    proof: [freshness-check]
  - text: fresh_api_key returns the stored key when not near expiry, refreshes when within CLI_TOKEN_FRESHNESS_BUFFER_SECONDS of expires_at, saves refreshed token before returning new key.
    proof: [freshness-check]
  - text: fresh_api_key handles refresh failure by reloading the token and checking if a sibling process refreshed it (same identity, different refresh_token, not expired); returns sibling key or the still-valid original key.
    proof: [sibling-detection]
  - text: fresh_api_key warns (via the warn callback) when refresh fails and no sibling key is available.
    proof: [renewal-failure-handling]
  - text: _key_rotated_by_a_sibling returns a key when the reloaded record differs only in refresh_token, and that record is not yet expired and has the same token_endpoint, resource, user_id, team_id.
    proof: [sibling-detection]
  - text: _refresh_inputs validates and returns a 5-tuple of (token_endpoint, revocation_endpoint, resource, client_id, refresh_token) when all are present and non-empty strings, or None.
    proof: [renewal-inputs]
  - text: pkce_token_record maps a PkceCredential to a CliTokenData record with base_url (rstrip), key, expires_at, refresh_token, client_id, token_endpoint, revocation_endpoint, resource, user_id and team_id.
    proof: [token-record-mapping]
  - text: revoke_stored_credential extracts refresh inputs from token_data and calls revoke_credential, returning None when no refresh token is available.
    proof: [revocation-coordination]
  - text: _replace_stored_token loads the previous token, saves the new one, and if the save succeeded, revokes the old refresh token on the proxy (warning on transient failure).
    proof: [rotation-coordination]
