id: B4584
title: Local autoroute process lifecycle and recovery commands
description: >-
  Translate LiteLLM's ephemeral proxy launch, readiness polling, PID tracking, termination
  and settings restore into betterlite's native CLI. Build process-lifecycle helpers
  that detect missing proxy runtime modules (fastapi, uvicorn, backoff, orjson, websockets,
  apscheduler), probe port availability before launching, start a native betterlite gateway
  subprocess with config/port arguments, poll its /health/liveliness endpoint until healthy
  or timeout, and write/read/clear JSON PID records for recovery. Build process control:
  graceful SIGTERM escalating to SIGKILL with a five-second grace period, PID existence checks
  using signal(0), and log-file tailing to a stop event. Build command orchestration
  for autoroute configure/start/stop with temporary settings backup/restore, master-key
  reuse from the generated config, and setup ordering. Preserve fixed-port refusal (port
  4000 is silently rebound by the litellm proxy launcher), corrupt-PID recovery that clears
  the record without blocking cleanup, backup-exists refusal before start, and signal handler
  registration for clean teardown even after Ctrl-C. Deprecated up/down aliases stay hidden
  and hidden-command registered. The start command backs up Claude settings, merges
  them with gateway base_url and master_key, writes them, launches the proxy, polls readiness,
  then enters a foreground log stream with atexit/signal cleanup. The stop command handles
  corrupt PID JSON, restores backed-up Claude settings and logs outcome to stderr for
  visibility in atexit handlers. Build runtime checks that the betterlite gateway executable
  exists and is available (not the Python proxy path), and translate missing-module diagnostics
  into concrete native-runtime availability messaging. A child proxy must not outlive its
  CLI owner: process death signaling follows the native container rule.
scope:
