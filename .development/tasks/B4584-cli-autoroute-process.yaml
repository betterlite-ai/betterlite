id: B4584
title: Local autoroute process lifecycle and recovery commands
description: >-
  Build autoroute::process, the ephemeral proxy's process lifecycle, and autoroute::commands,
  the configure/start/stop command group, for betterlite-cli. process.rs owns the native gateway
  executable's availability check, a port-probe trait and a process-launcher trait so start never
  binds a real socket or spawns a real process under test, readiness polling against
  /health/liveliness, the JSON PID record (PidRecord: pid, port, config_path, log_path) at
  autoroute::paths' PID_RECORD_PATH (B4583), and process control: a PID existence check, graceful
  termination that escalates from SIGTERM to SIGKILL after a five-second grace period, and log-file
  tailing to a stop signal. The real launcher wraps the gateway executable in setpriv --pdeathsig
  KILL so the OS kills it if the CLI exits without running its own teardown, matching the rule that
  a started child dies with its owner; a test proves the child is gone once its owning handle drops.
  commands.rs owns the configure/start/stop clap commands, master-key provisioning that reuses the
  key persisted in autoroute::paths' CONFIG_PATH (via B4583's master_key_from_config) and mints one
  only when absent, and the start command's full ordered setup: config-present check, native
  executable check, already-running check by PID record, stale-backup refusal, port-4000 refusal,
  port-probe refusal, master-key provisioning, launch, readiness poll, Claude settings backup via
  B4575's write_backup and merge via B4562's merge_claude_settings, then a foreground wait with
  signal-triggered teardown. stop tolerates a corrupt PID record by logging it and continuing
  cleanup instead of failing, terminates any leftover process, clears the record and restores
  Claude settings through B4575's restore_claude_settings. Deprecated up and down stay as hidden
  clap aliases that print a deprecation line to stderr and call start/stop with the same options.
  Preserve the fixed-port refusal (port 4000 is silently rebound by the proxy launcher), the
  backup-exists refusal before start, the signal- and teardown-lock-guarded cleanup that runs once
  whether it fires from Ctrl-C or normal exit, and that a child proxy must not outlive its CLI
  owner.
scope:
  paths:
    - crates/betterlite-cli/src/autoroute/process.rs
    - crates/betterlite-cli/src/autoroute/process/**
    - crates/betterlite-cli/src/autoroute/commands.rs
    - crates/betterlite-cli/src/autoroute/commands/**
    - crates/betterlite-cli/Cargo.toml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/process.py#L45-L53
    why: missing_proxy_runtime_modules; the Rust port replaces the six-module check with one native gateway executable availability check.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/process.py#L59-L66
    why: is_port_available sets SO_REUSEADDR before bind on 127.0.0.1; std's plain TcpListener::bind does not set this, so the port-probe trait's real implementation must set it explicitly.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/process.py#L69-L86
    why: launch_proxy spawns the proxy with config/port/host arguments and redirects stdout and stderr to the log file; the Rust port launches the native gateway executable instead of litellm.proxy.proxy_cli (existing deviation).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/process.py#L95-L110
    why: poll_liveliness polls GET /health/liveliness until 200, the process exits, or 30 seconds elapse, tailing the log on failure.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/process.py#L113-L138
    why: PidRecord's fields and JSON round-trip; a corrupt record raises an UpError in LiteLLM, which this task ports as its own module's typed error, not a borrowed one.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/process.py#L141-L162
    why: is_running uses signal 0 to detect existence (ProcessLookupError means gone, PermissionError means running under another user); terminate sends SIGTERM, polls for up to the grace period, then escalates to SIGKILL.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/process.py#L165-L177
    why: stream_log tails the log file in a background thread until the stop signal, waiting for the file to appear first.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/commands.py#L49-L77
    why: _ensure_master_key reuses the config's persisted master key or mints one with secrets.token_urlsafe(32) when absent, then rewrites the config; raises on empty or corrupt config.yaml.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/commands.py#L103-L146
    why: "start's ordered checks before launch: config present, native runtime available, already running, stale backup, port 4000, port probe."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/commands.py#L148-L178
    why: start's launch, readiness poll with cleanup on failure, and the Claude settings backup-then-merge-then-write sequence.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/commands.py#L180-L217
    why: "start's foreground block: the teardown closure guarded by a non-blocking lock, the SIGINT/SIGTERM handlers that only set a stop flag, atexit registration, the log-tailing thread and the final wait."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/commands.py#L221-L245
    why: stop tolerates a corrupt PID record by logging and continuing, terminates a leftover process, clears the record, then restores settings and reports which of the three outcomes happened.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/commands.py#L248-L272
    why: up and down are hidden deprecated aliases that print a yellow deprecation line to stderr and invoke start/stop with the same options.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/config.py#L1-L10
    why: AUTOROUTER_MODEL_NAME, the literal "autorouter" model name commands.rs passes twice to merge_claude_settings; owned by B4583's autoroute::config.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L74-L96
    why: CLAUDE_SETTINGS_PATH, AUTOROUTE_BACKUP_PATH and StaticToken, owned by B4562's claude_settings, consumed here for the backup-exists check and the settings merge.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/up.py#L35-L68
    why: secure_create, which _ensure_master_key calls to rewrite config.yaml 0600; owned by B4575's settings_backup, not redefined here.
dod:
  - text: >-
      A gateway-runtime-available check reports whether the native betterlite gateway executable
      can be found and run, replacing missing_proxy_runtime_modules' six-module import probe; start
      returns an actionable error naming the install step when it is not.
    proof: [gateway-runtime-available]
  - text: >-
      is_port_available and the real port-probe implementation set SO_REUSEADDR before binding
      127.0.0.1:port, matching LiteLLM's explicit reuse-address behavior, and report false instead
      of propagating the bind failure; start's own port check uses an injected port-probe trait so
      its tests bind nothing real.
    proof: [port-probe-reuseaddr]
  - text: >-
      Port 4000 is rejected by start before the port probe runs, with an error explaining the
      proxy's own silent rebinding of that port; a different unavailable port is rejected by the
      port-probe check instead.
    proof: [port-4000-rejected, port-in-use-refusal]
  - text: >-
      start reads the PID record and, when one exists and is_running is true for its pid, returns an
      error naming `lite autoroute stop` instead of launching a second proxy.
    proof: [already-running-detection]
  - text: >-
      start returns an error when autoroute::claude settings' AUTOROUTE_BACKUP_PATH (B4562) already
      exists, naming it as a sign of a previous session still running or a crash that skipped
      cleanup.
    proof: [backup-exists-refusal]
  - text: >-
      Master-key provisioning parses CONFIG_PATH as the same loosely typed document B4583's wizard
      writes, returns the persisted general_settings.master_key through B4583's
      master_key_from_config when present, and otherwise mints one from 32 bytes of injected
      randomness encoded with the unpadded URL-safe base64 already used for the PKCE code verifier,
      then rewrites CONFIG_PATH through B4575's secure_create with every other key byte-for-byte
      unchanged.
    proof: [master-key-provisioning]
  - text: >-
      terminate sends SIGTERM, polls is_running for up to a five-second grace period, and escalates
      to SIGKILL only if the process is still alive after that period.
    proof: [sigterm-sigkill-escalation]
  - text: >-
      is_running reports false only when the signal-0 existence probe says the process does not
      exist, and true both when it exists and when the probe is denied because another user owns
      it.
    proof: [signal-0-semantics]
  - text: >-
      The real process-launcher wraps the gateway executable's argv in setpriv --pdeathsig KILL, so
      the OS terminates the child once the CLI process that started it is gone even without running
      its own teardown; a test spawns a real child through this wrapper, drops the owning handle,
      and confirms the child no longer exists afterward.
    proof: [gateway-dies-with-owner]
  - text: >-
      start writes the Claude settings backup through B4575's write_backup before writing the
      merged settings, and the teardown and stop paths both call B4575's restore_claude_settings
      before clearing the backup, so a restore never runs against a settings file not yet replaced.
    proof: [backup-restore-order]
  - text: >-
      start's teardown runs at most once whether it is triggered by the SIGINT/SIGTERM handler
      setting a stop signal or by normal control flow after it, guarded by a lock acquired without
      blocking; a handler that finds the lock held returns immediately instead of racing the first
      teardown.
    proof: [teardown-lock]
  - text: >-
      stop treats a corrupt PID record as absent: it prints the error to stderr, clears the record
      and still runs the terminate, clear and restore steps instead of returning early.
    proof: [stop-tolerates-corrupt-pid]
  - text: >-
      The hidden up and down clap aliases print the deprecation line to stderr naming the current
      command, then call start and stop with the caller's options unchanged.
    proof: [deprecated-alias-warnings]
deviations:
  - what: betterlite launches a native gateway executable instead of litellm.proxy.proxy_cli, behind a process-launcher trait that wraps the real argv in setpriv --pdeathsig KILL.
    why: Prerequisite 3 requires the native executable contract; the Python proxy module is not shipped with the CLI, and the setpriv wrapper satisfies the rule that a started child dies with its owner instead of outliving a CLI that exits without cleanup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/autoroute/commands.py#L69-L86
oracle_cases: []
checks:
  optional: []
  commands:
    - id: gateway-runtime-available
      why: the native gateway executable availability check does not detect a missing executable or does not return an actionable error naming the install step
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::process::.*gateway_runtime_available/)'
    - id: port-probe-reuseaddr
      why: the port probe does not set SO_REUSEADDR before bind or does not report false on a bind failure
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::process::.*port_probe/)'
    - id: port-4000-rejected
      why: port 4000 is not rejected before the port probe runs, or the error does not explain the proxy's silent rebinding
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*port_4000_rejected/)'
    - id: port-in-use-refusal
      why: start does not call the injected port-probe trait or does not return an error when the probe reports the port unavailable
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*port_in_use_refusal/)'
    - id: already-running-detection
      why: start does not read the PID record, does not check is_running, or launches a second proxy while one is already running
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*already_running/)'
    - id: backup-exists-refusal
      why: start does not check AUTOROUTE_BACKUP_PATH or does not refuse to start when it already exists
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*backup_exists_refusal/)'
    - id: master-key-provisioning
      why: master-key provisioning does not reuse a persisted key, does not mint a fresh 32-byte key when absent, mints one from the wrong number of bytes, or does not rewrite config.yaml with every other key unchanged
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*master_key/)'
    - id: sigterm-sigkill-escalation
      why: terminate does not send SIGTERM first, does not wait the five-second grace period, or does not escalate to SIGKILL when the process is still alive
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::process::.*sigterm_sigkill/)'
    - id: signal-0-semantics
      why: is_running does not treat a denied signal-0 probe as running, or does not treat a not-found probe as not running
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::process::.*is_running/)'
    - id: gateway-dies-with-owner
      why: the real launcher does not wrap the gateway argv in the setpriv pdeathsig wrapper, or the spawned child is still alive after its owning handle is dropped
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::process::.*dies_with_owner/)'
    - id: backup-restore-order
      why: the settings backup is not written before the merged settings, or teardown/stop restores before terminating and clearing the PID record
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*backup_restore_order/)'
    - id: teardown-lock
      why: teardown is not guarded by a non-blocking lock, or a concurrent signal and normal-exit path both run the restore
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*teardown_lock/)'
    - id: stop-tolerates-corrupt-pid
      why: stop propagates a corrupt-PID-record error instead of logging it and continuing cleanup
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*stop_tolerates_corrupt_pid/)'
    - id: deprecated-alias-warnings
      why: the up or down alias does not print the deprecation line to stderr, or does not call start/stop with the caller's options
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^autoroute::commands::.*deprecated_alias/)'
pitfalls:
  - >-
    Port 4000 is rejected by its literal value before the port probe ever runs, not by a probe
    failure; the real launcher silently rebinds that exact port, so refusing it early avoids a
    confusing success on the wrong port.
  - >-
    A corrupt PID record in stop is reported on stderr and treated as absent, never returned as an
    error that stops the rest of cleanup; the same corrupt-record case in start must still fail,
    since start has nothing to clean up yet.
  - >-
    Master-key provisioning reads only general_settings.master_key; a key placed under
    litellm_settings is invisible to the running proxy and must not be treated as persisted.
  - >-
    The backup-exists check runs before the port checks and before launch, so a crash that left
    AUTOROUTE_BACKUP_PATH behind is caught before anything else changes.
  - >-
    The teardown closure is the only path that terminates the process, clears the PID record and
    restores settings; both the signal handlers and the normal post-wait control flow must call the
    same guarded teardown rather than duplicating its steps.
  - >-
    A signal handler must not allocate, log, or call into the port-probe or launcher traits; it only
    sets the stop signal the foreground wait observes, the same constraint B4577's up command
    follows for its own teardown.
  - >-
    is_running must treat a signal-0 probe denied for permission reasons as the process existing
    (owned by another user), and only a not-found result as it having exited; collapsing those two
    outcomes into one would miss a still-running process owned elsewhere.
  - >-
    setpriv --pdeathsig only affects the process it directly execs; if the real gateway executable
    were to fork its own detached children, those would not inherit the flag. The gateway runs as a
    single process here, so this does not apply yet, but a future multi-process gateway would need
    its own propagation.
  - >-
    The generated config.yaml carries keys this task does not model (model_list, router_settings
    and whatever the wizard writes). Master-key provisioning reads it with serde-saphyr, the
    workspace YAML crate B4583 writes it with, as a passthrough value under the typed-wire rule,
    changes only general_settings.master_key and keeps every other key and value. LiteLLM dumps with
    sort_keys=False, so keep the top-level key order with indexmap::IndexMap (indexmap 2 is in
    Cargo.lock). Don't turn on serde_json's preserve_order: features unify across the workspace,
    and that changes key order in every crate's JSON output.
  - >-
    The log-tailing work started by start must be owned by a handle the teardown stops or awaits,
    never a detached, unjoined task left running after the CLI process exits its foreground wait.
out_of_scope:
  - B4562 owns claude_settings, including AUTOROUTE_BACKUP_PATH, CLAUDE_SETTINGS_PATH, StaticToken,
    ClaudeSettingsError, install_statusline_script, load_json_or_empty, merge_claude_settings and
    write_claude_settings.
  - B4575 owns settings_backup, including secure_create, write_backup, restore_claude_settings and
    their error type; this task calls them and never redefines them.
  - B4583 owns autoroute::paths (AUTOROUTE_DIR, CONFIG_PATH, LOG_PATH, PID_RECORD_PATH) and
    autoroute::config, including AUTOROUTER_MODEL_NAME and master_key_from_config; this task reads
    the paths and the model name from there and never redefines them.
  - B4573 owns pkce_login's randomness and base64 encoding pattern; this task follows the same
    fill-a-buffer-then-encode shape for its own injected randomness but keeps its own trait and
    error type, since pkce_login's error type is specific to the PKCE protocol.
  - Banner display and top-level command registration (B134's main.rs); this task exposes the
    autoroute clap group and its commands for main.rs to mount.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 1
