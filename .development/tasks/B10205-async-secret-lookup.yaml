id: B10205
title: The secret lookup and the secret manager dispatch read asynchronously, so os.environ/ references reach AWS Secrets Manager and KMS
description: >-
  The secret lookup is sync. `SecretLookup::get_secret`, `get_secret_str` and `get_secret_bool` (crates/betterlite-secret-managers/src/secret_lookup.rs L38-L91) call `get_secret_from_manager` (secret_read_dispatch.rs L69-L103) through the sync protocols in secret_read_dispatch/protocols.rs L21-L80. The AWS Secrets Manager and KMS clients B10195 installs are async, so an `os.environ/` reference read with key_management_system aws_secret_manager or aws_kms answers B10195's async-path error and falls back to the environment value (secret_lookup/manager.rs L41-L48). LiteLLM's get_secret reads AWS on that path (secret_manager_handler.py L135-L170). The same holds for config-boot reads, the DB overlay and every provider credential that names a reference. This task makes the lookup async end to end and moves every caller onto it. B10206 has already given the sync trait methods, the PTU port, PointFive's start, the Foundry token and the sandbox registry their async seams, so the chains below only gain `.await`.


  The lookup. get_secret, get_secret_str and get_secret_bool become `pub async fn`, and so do `manager::read` and `get_secret_from_manager`. The protocol methods return futures in the crate's own dyn-safe shape, `SecretFuture` (secret_contracts.rs L12-L13): AzureKeyVaultClient::get_secret, GoogleKmsClient::decrypt, AwsKmsClient::decrypt, GoogleSecretManagerClient::get_secret_from_google_secret_manager, InfisicalClient::get_secret, and AwsSecretsManagerClient's read (renamed from sync_read_secret to read_secret). SyncSecretReader becomes `ManagerSecretReader` with an async `read_secret` that answers `Option<SecretString>`, and its two impls in manager_readers.rs L12-L26 call `BaseSecretManager::async_read_secret` (vault_secret_operations.rs L33, cyberark.rs L161) instead of the blocking read. B10195's `impl AwsSecretsManagerClient for AwsSecretsManager` (aws_secret_reads.rs) and `KmsClient` (aws_kms.rs) call the async read and the SDK decrypt, so `AwsReadError::SyncRead`, `AwsKmsError::SyncDecrypt` and the tests `sync_reads_need_the_async_path` and `the_dispatch_kms_client_needs_the_async_path` go. The Custom arm (secret_read_dispatch/custom.rs L12-L25) keeps calling the manager's sync_read_secret, as LiteLLM's handler does (secret_manager_handler.py L206-L222), since that runs the user's own sync code: it runs on `JoinSet::spawn_blocking` over an Arc clone of the manager and awaits it at once, as coord_redis_boot/env_refs.rs L39-L46 does today.


  The OIDC branch. `oidc::read` and its providers (secret_lookup/oidc.rs) turn async. `OidcHttp::get` and `AzureOidcTokens::token` (secret_lookup/ports.rs L33-L35 and L43-L45) return futures in the same shape, and `read_oidc_file` (oidc.rs L85-L92) reads with `tokio::fs::read_to_string`. The token cache's std Mutex is locked, read and dropped before a fetch, and locked again to store. No production port does I/O (B10193's secret_lookup/no_oidc.rs stubs answer at once), so only the stubs and the test and oracle fakes change.


  The offloads go. Callers that moved the blocking read off the runtime now await it. coord_redis_boot/env_refs.rs L28-L48 awaits `SecretLookup::get_secret` without its spawn_blocking and the comment above it. In db_row_decrypt, `resolve_db_param` (deployments.rs L25-L48) and `decrypt_model_rows` (L50) turn async, and the spawn_blocking around them in credentials/rotation.rs L88-L95, model_team_scope/lookup.rs L108 and model_info_search/search/rows.rs L67 goes with its comment. In the binary's DB overlay, `initialize_secret_manager` and `prepare_reload` (db_config_overlay/reload.rs L78-L90) turn async, `resolve_reload` (L95-L115) awaits `Resolver::resolve_entries` instead of running it through off_runtime, and the lookup clone and `restore_oidc_tokens` (environ.rs) go; off_runtime stays for resolve_includes (source.rs L59). Bedrock's region worker (bedrock_embedding_io/credentials.rs L27-L80, `ManagedRegionWorker` and `RegionJob`) existed only to run the read off the runtime: it goes, `environment_region` (L140-L156) awaits `region_secrets` (L207-L214), and the `region_worker` field and parameters go from embedding_call.rs L74 and L106, embedding_call/plan.rs L44-L98 and embedding_jobs/status.rs.


  The chains. Each function from a direct read up to its first async caller turns async, and its callers await it:
  config's `load_ptu_cost_flag` (ptu_pricing.rs L13) and `cli_writer_url` (sections/database_urls/policy.rs L90-L106);
  db's `RdsSecrets::get_secret` (rds_credentials/secrets.rs L6-L19, through `#[async_trait]`), `selection::prepare`, `resolve_references` and `resolve_text_reference` (selection.rs L16-L150) under `RdsSigner::init` (signer.rs L23-L27);
  bedrock's `resolve_s3_setting` (s3_access/settings.rs L52), `owner_and_encryption_key` and `build_create_request` (batch_create/request/build.rs L67 and L175-L177) under `transform_create_batch_request` (sign.rs L93), batch_records/upload.rs L140, `resolve_token` (web_identity/auth.rs L60) and `environment_text` and `resolve_endpoint` (nova_chat/direct.rs L86-L106);
  foundry's `secret_text` and `provider_info` (agent_requests/request.rs L45-L74) and B10206's `AgentSecrets::resolve` (credentials/agent.rs);
  logging's PointFiveService `secret`, `resolved_secret`, `resolved_api_key` and `resolved_api_url` (finops/pointfive/logger/client.rs L64-L120) under B10206's async upload_client;
  server's `EnvironmentAttribution::enabled` (jobs/ptu/attribution.rs L24-L41), the pass-through header chain `resolved_secret`, `langfuse_key`, `set_env_variables_in_header`, `register_endpoint` and `initialize_pass_through_endpoints` (passthrough/route_registration.rs L153-L248) under `initialize_pass_through_endpoints_in_db` (endpoints/passthrough_config_writes/initialize.rs L42) and `resolve_headers` (passthrough_config_writes/routes.rs L148) under create.rs and update.rs, and `admin_key` (spend/capture_rate/credentials.rs L29) under `capture_rate_report`;
  the binary's `overlay_entry` and `env_overlay` (config_boot/environment.rs L50-L80) and `resolve_system` and `RawSecretManager::initialize` (config_boot/raw_secret_manager.rs L62-L113), none of them with a production caller yet;
  provider's `environment_secret` (agent_platform_dispatch/environment.rs L9) with complete_langgraph, api_base, complete_a2a and table::dispatch; the data_cloud `secret`, `text` and `oci` methods (data_cloud_dispatch/context.rs L33-L56) with databricks_call, complete_databricks, chat::dispatch, databricks_environment, databricks_endpoint and snowflake::request, and the enterprise_ml watsonx `environment`, `text_api_key`, `text_api_base`, `text_call` and chat::dispatch (enterprise_ml_dispatch/watsonx.rs L15-L153, chat.rs L32-L41); langflow's `secret_text` and `provider_info` (langflow_chat/config.rs L29-L59) with complete_langflow; the manus_files chain from `secret_text` (manus_files/credentials.rs L14) through resolve_api_key, validate_environment, plan_headers, upload_plan, files_url, litellm_files_url and file_url_from_params into B10206's async contract methods; the manus_responses chain from `secret_text` (manus_responses/credentials.rs L15) through resolve_api_key, validated_headers, base_url and responses_url; ragflow's `secret_text`, resolve_api_base, resolve_api_key, provider_info, complete_ragflow, dispatch, complete_url and validate_environment (ragflow_chat/env.rs L45-L105, url.rs L17, dispatch.rs L23-L63); and `resolve_value` under B10206's `resolve_tool_entries` (sandbox_dispatch/registry.rs L81-L96).
  A read inside a `map_or_else` or `and_then` closure (ragflow_chat/env.rs L82-L85, enterprise_ml_dispatch/chat.rs L41) becomes a match, since a closure cannot await.


  Two places stay outside async code on purpose. The server's CLI writer store (app/spend.rs L44-L67) is read by six route builders while the router is assembled, and route assembly is sync: B8610 puts the startup database store in `Shared.db` (B8610's task L16), so `cli_writer_store` returns `state.shared.db.clone()` and the server reads no URL itself. Python's sandbox registration is sync because `NativeDecisionSession::call` (crates/betterlite-python/src/decision_calls.rs L41-L45) is the sync pymethod behind LiteLLM's sync register_sandbox_tools (python/betterlite/sandbox/sandbox_tools.py L27): `register_tools` (decision_calls/core/sandbox.rs L14-L26) runs B10206's `resolve_tool_entries` through `get_runtime().block_on`, the crate's sync boundary (moderation/native.rs L33 does the same on the same detached thread), and installs the answer under the lock.


  The oracle. Helper `run` functions are sync, so a helper that calls a function this task turns async drives it with a current-thread runtime, as core_ops/copilot_chat.rs L57 does. b050's handler builds its own runtime and blocks on it inside `ChatCompletionHandler::complete` (helpers/provider/b050/handler.rs L39-L85), and that panics once dispatch runs inside a block_on: the handler answers from values the helper prepares before the dispatch. The OIDC fakes and SyncSecretReader fakes in helpers and tests follow the new port shapes.


  Tests. The lookup, dispatch and caller tests turn into `#[tokio::test]`. secret_lookup/tests gains `an_aws_secret_manager_reference_reads_the_manager` (a lookup over the AwsSecretsManagerClient fake answers the manager's value for `os.environ/NAME`, and a fake that errors still logs and answers the environment value), `an_aws_kms_reference_decrypts_through_the_client` (the AwsKms fake decrypts the environment's base64 value) and `an_oidc_file_token_reads_on_a_current_thread_runtime`. The binary's db_config_overlay/tests gains `a_reload_resolves_references_through_the_secret_manager`: a reload with a manager fake installed answers the manager's value for an `os.environ/` field.
