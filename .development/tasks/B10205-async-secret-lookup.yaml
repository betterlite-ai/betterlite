dod:
  - text: get_secret, get_secret_str, get_secret_bool, get_secret_from_manager, the dispatch protocols and the OIDC ports are async, and an aws_secret_manager or aws_kms reference reads through B10195's client.
    proof: [async-lookup, lookup-tests]
  - text: No spawn_blocking, off_runtime or region worker is left around a secret read, and B10195's SyncRead and SyncDecrypt answers are gone.
    proof: [async-lookup, server-tests, bedrock-tests]
  - text: Every caller awaits the lookup, the DB overlay resolves references through the manager, and the CLI writer store comes from Shared.db.
    proof: [binary-tests, server-tests, bedrock-tests, crate-tests, provider-tests]
  - text: The oracle helpers answer as before.
    proof: [oracle-cases]
checks:
  optional: [mutants]
  commands:
    - id: async-lookup
      why: the lookup, the dispatch or a protocol is still sync, a blocking offload is left, or B10195's async-path answers remain
      run: |-
        grep -q 'pub async fn get_secret(' crates/betterlite-secret-managers/src/secret_lookup.rs &&
        grep -q 'pub async fn get_secret_from_manager' crates/betterlite-secret-managers/src/secret_read_dispatch.rs &&
        test -z "$(grep -n 'SyncSecretReader\|fn sync_read_secret' crates/betterlite-secret-managers/src/secret_read_dispatch/protocols.rs)" &&
        test -z "$(grep -n 'use std::fs' crates/betterlite-secret-managers/src/secret_lookup/oidc.rs)" &&
        test -z "$(grep -rn 'SyncRead\b\|SyncDecrypt' crates/betterlite-secret-managers/src)" &&
        test -z "$(grep -n 'spawn_blocking' crates/betterlite-server/src/coord_redis_boot/env_refs.rs crates/betterlite-server/src/credentials/rotation.rs crates/betterlite-server/src/model_team_scope/lookup.rs crates/betterlite-server/src/model_info_search/search/rows.rs)" &&
        test -z "$(grep -rn 'ManagedRegionWorker' crates/betterlite-bedrock/src tools/oracle/src)" &&
        test -z "$(grep -n 'cli_writer_url' crates/betterlite-server/src/app/spend.rs)"
    - id: lookup-tests
      why: a reference no longer reads the manager, KMS or an OIDC file, or a dispatch arm answers differently
      run: grep -rq 'fn an_aws_secret_manager_reference_reads_the_manager' crates/betterlite-secret-managers/src/secret_lookup && grep -rq 'fn an_aws_kms_reference_decrypts_through_the_client' crates/betterlite-secret-managers/src/secret_lookup && grep -rq 'fn an_oidc_file_token_reads_on_a_current_thread_runtime' crates/betterlite-secret-managers/src/secret_lookup && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^secret_lookup::/) | test(/^secret_read_dispatch::/) | test(/^aws_secret_reads::/) | test(/^aws_kms::/)'
    - id: binary-tests
      why: the DB overlay or the config boot no longer resolves references, or a reload stopped reaching the manager
      run: grep -rq 'fn a_reload_resolves_references_through_the_secret_manager' crates/betterlite/src/db_config_overlay && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(/^db_config_overlay::/) | test(/^config_boot::/)'
    - id: server-tests
      why: a server caller lost a secret, a header or a decrypted row once the offload went
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^coord_redis_boot::/) | test(/^db_row_decrypt::/) | test(/^credentials::rotation::/) | test(/^model_team_scope::/) | test(/^model_info_search::/) | test(/^passthrough::route_registration::/) | test(/^endpoints::passthrough_config_writes::/) | test(/^spend::capture_rate::/) | test(/^jobs::ptu::/)'
    - id: bedrock-tests
      why: a Bedrock region, S3 setting, batch request or web identity token reads differently without the region worker
      run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/^bedrock_embedding_io::/) | test(/^embedding_call::/) | test(/^embedding_jobs::/) | test(/^nova_chat::/) | test(/^s3_access::/) | test(/^batch_create::/) | test(/^batch_records::/) | test(/^batch_call::/) | test(/^web_identity::/)'
    - id: crate-tests
      why: the config, database, Foundry, PointFive or Python callers answer differently once they await
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^ptu_pricing::/) | test(/^sections::database_urls::/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^rds_credentials::/)' && cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/^credentials::/) | test(/^agent_requests::/)' && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^finops::pointfive::/) | test(/^registry::catalog::pointfive::/)' && cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^decision_calls::/)'
    - id: provider-tests
      why: a provider credential, URL or header chain answers differently once it awaits the lookup
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^agent_platform_dispatch::/) | test(/^data_cloud_dispatch::/) | test(/^enterprise_ml_dispatch::/) | test(/^langflow_chat::/) | test(/^manus_files::/) | test(/^manus_responses::/) | test(/^ragflow_chat::/) | test(/^sandbox_dispatch::/)'
    - id: oracle-cases
      why: a helper that now drives the async lookup no longer answers as LiteLLM does
      run: cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-secret-store,betterlite-oracle-groups/betterlite-oracle-provider,betterlite-oracle-groups/betterlite-oracle-core-ops,betterlite-oracle-groups/betterlite-oracle-models -- tools/oracle/cases/helpers/secret-lookup tools/oracle/cases/secret-managers tools/oracle/cases/helpers/ragflow-chat tools/oracle/cases/agent-platforms tools/oracle/cases/helpers/langflow-chat tools/oracle/cases/helpers/manus-responses tools/oracle/cases/helpers/manus-files tools/oracle/cases/providers/data-cloud tools/oracle/cases/providers/enterprise-ml tools/oracle/cases/sandbox
oracle_cases: []
deviations: []
out_of_scope:
  - "The sync seams this task awaits (the Manus contracts, the PTU port, PointFive's startup check, the Foundry token split, the sandbox resolve and install split, SageMaker): B10206."
  - "Building the startup database store and Shared.db: B8610."
  - "Wiring a production SecretLookup with a manager and real OIDC transports into the server and the Python SDK: B8612 and B8613."
  - "Guardrails' own SecretLookup trait (crates/betterlite-guardrails/src/hook_initializers/secret_lookup.rs L3-L5) and Azure's SecretResolver: neither reaches this lookup, and both stay sync."
  - "BaseSecretManager's sync_read_secret on Vault, CyberArk and AWS: LiteLLM's manager contract keeps it, and the dispatch no longer calls it."
