id: B768
title: OAuth2 introspection and trusted proxy identity
description: >-
  Implement OAuthTokenValidator and TrustedOAuthProxy backend over configured OAUTH_TOKEN_INFO_ENDPOINT,
  OAUTH_CLIENT_ID/SECRET and field mappings (sub, role, team_id defaults). Preserve POST introspection
  versus GET token-info selection, missing-active behavior and user-role conversion. Trusted-proxy OAuth
  headers require NetworkContext trust and configured oauth2_config_mappings. Tokens and Basic credentials
  never reach logs.


  Build the production oauth_tokens module in betterlite-auth; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/oauth2_check.py:
  Oauth2Handler._is_introspection_endpoint (L21-L41; 19 source lines), Oauth2Handler._prepare_introspection_request
  (L44-L72; 22 source lines), Oauth2Handler._prepare_token_info_request (L75-L85; 9 source lines), Oauth2Handler._extract_user_info
  (L88-L110; 20 source lines), Oauth2Handler.check_oauth2_token (L113-L213; 70 source lines). litellm/proxy/auth/oauth2_proxy_hook.py:
  handle_oauth2_proxy_request (L40-L102; 55 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): OAUTH_TOKEN_INFO_ENDPOINT=None;
  OAUTH_USER_ID_FIELD_NAME='sub'; OAUTH_USER_ROLE_FIELD_NAME='role'; OAUTH_USER_TEAM_ID_FIELD_NAME='team_id';
  OAUTH_CLIENT_ID=None; OAUTH_CLIENT_SECRET=None; general_settings.oauth2_config_mappings=None.


  oauth2_config_mappings accepts identity fields user_id, user_email, team_id, team_alias, org_id and
  models only; user_role is rejected. OAUTH_TOKEN_INFO_ENDPOINT, OAUTH_CLIENT_ID and OAUTH_CLIENT_SECRET
  default absent; field mapping defaults are sub, role and team_id for ordinary introspection, separately
  from proxy-header identity.

  endpoint_mode requires case-insensitive 'introspect' in the URL AND both credentials non-null;
  an empty credential still selects POST, while an absent credential selects GET. introspection_basic_post
  sends form Content-Type application/x-www-form-urlencoded and token, using Authorization Basic of
  UTF-8 client_id:client_secret only when both are truthy. empty_secret_public_client sends client_id
  in the form; empty_client_sends_token omits it. token_info_bearer_get sends Authorization Bearer
  and Content-Type application/json, without form/query parameters. Use B173's pooled HTTP client
  and B208's Oauth2Check provider configuration. No OAuth response cache is added.
  endpoint_absent fails before network. inactive_token rejects false/null/zero/empty active only
  for POST; missing_active_default permits an absent active, and get_ignores_active permits false
  on GET. field_mappings uses direct dictionary keys, not dotted paths; missing_identity_fields
  stays None and invalid_role is the B2314 model-validation failure. upstream_status_error,
  upstream_network_error and invalid_response_json all become ValueError, retaining the distinct
  status-error versus generic-validation message category. B757 maps ValueError to 401 auth_error,
  param 'None', code '401'. Never reproduce the source debug log of token and full response.

  proxy_trust_before_mapping invokes B743 require_trusted_proxy_request with feature_name
  'OAuth2 proxy auth' before reading mapped headers; trusted_proxy_ranges defaults empty in B743.
  proxy_mapping_absent covers missing/empty mappings. proxy_disallowed_fields lists rejected
  fields sorted, before reading any header. Mapping direction is identity field -> header name.
  proxy_header_casefold accepts HTTP header case-insensitivity; proxy_empty_header skips empty
  values; proxy_models_split trims each comma-separated item but retains empty items. Absent
  user_role stays None. proxy_all_identity_fields covers the exact six-field allowlist and
  verifies debug diagnostics contain field names only, not identity values.


  Add the oauth_tokens operation under B856 Management::jwt for request preparation and extraction.
  Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a oauth-tokens-*
  seed to B171 helper_case, which already owns this decoder.


  The auth failure cases are B001 HttpCase requests to an existing protected route (use /v1/chat/completions
  with an invalid model after auth, or the named management route). Install this production stage through
  B732 server state; do not wait for the B052 umbrella or create test-only endpoints. Compare HTTP status
  and the complete error type/param/code. A successful auth branch must reach the downstream route response
  rather than manufacture a helper success. Pin the source exception translation from auth_exception_handler
  before choosing fixtures.


  B860 starts separate equivalent Postgres fixtures for the real MIT proxy and the actual betterlite binary.
  Seed hashed virtual keys and explicit owner/team/org roles; no enterprise package or import is present.
  Permission fixtures must distinguish a missing bearer, an unrelated ordinary user and an authorized
  scoped user; do not label every non-admin forbidden when the source permits team/org administrators.


  Write betterlite-config::oauth_tokens::tests::loads_settings, env_defaults, empty_env_preserved
  and mapping_direction. These settings are strings/dictionaries; there is no invalid-value fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary oauth_tokens::decode_oauth_response(&[u8]) -> Result<TypedValue,DecodeError>
  for introspection/token-info response JSON. Production calls this decoder before its typed policy functions;
  the cargo-fuzz target oauth_tokens calls that same function. Seed valid, truncated, malformed, duplicate-field
  and limit-boundary inputs and add oauth_tokens::tests::replays_the_oauth_tokens_corpus. Reuse B002 limits
  for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string decoder cap bytes
  at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or fetching URLs. B733
  owns crates/betterlite-auth/fuzz; depend on it and register this decoder target without recreating the
  workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 195 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  195 production, 270 behavior tests, 65 helper adapters, 65 route/manifests/wiring, 45 decoder/fuzz
  and 50 config lines, 690 changed lines estimated within a 725-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: oauth_without_license, oauth_body_limits
  and oauth_secrets_redacted. Exercise the precise
  changed setting/output branch and assert its configured status/error/side effects; do not add these
  differing results to oracle equality cases.

  The MIT booted server rejects ordinary OAuth validation at premium_user before network access.
  Consequently all POST/GET validation outcomes above are native HTTP tests with a mock identity
  provider. The equality corpus covers pure preparation helpers and trusted-proxy header auth only;
  do not fake premium state in a booted MIT route. oauth_without_license asserts that configured
  OAuth succeeds without entitlement where MIT returns 401 auth_error. This is an approved
  no-paid-tier deviation, not an unresolved product choice.


  Server wiring tests live under betterlite-server::auth::oauth_tokens::tests: stage_is_registered and
  failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
