deviations:
  - what: Configured OAuth introspection/token-info validation runs without premium_user; valid credentials
      reach the requested route instead of MIT's 401 auth_error license refusal.
    why: README Decisions specifies no paid tier and no user/team cap.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/oauth2_check.py#L1-L213
  - what: Debug logs omit the bearer token and full OAuth response.
    why: The secret-type rule forbids copying the raw credentials logged by check_oauth2_token.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/oauth2_check.py#L187-L191
  - what: New otherwise unbounded byte decoders reject over 1048576 bytes or JSON depth 64, respecting
      smaller inherited limits.
    why: Bound the specific outside-byte decoder named in this task; typed helpers inherit no artificial
      parser behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/oauth2_check.py#L21-L41
out_of_scope:
  - B743 owns trusted_proxy_ranges parsing and direct-peer trust; B2314 owns UserAPIKeyAuth validation.
pitfalls:
  - 'The oracle helper for this task is pre-registered as oauth_tokens in the auth group. Replace the stub Op in tools/oracle/src/helpers/auth/oauth_tokens.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/oauth_tokens.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Endpoint selection tests credential presence, but Basic authentication tests truthiness; empty secrets take different branches.
  - The config dictionary keys are identity fields despite the source docstring describing the opposite direction.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: security
