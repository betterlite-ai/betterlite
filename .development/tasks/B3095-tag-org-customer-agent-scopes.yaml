id: B3095
title: Resolve tag, organization, customer and agent analytics scopes
description: >-
  Port the four remaining resolvers of daily_activity_scopes.py (tag, organization, customer, agent) plus the
  dispatch that picks a resolver by entity, into betterlite-server as the module `daily_activity_entities`.
  B3094 (module `daily_activity_scopes`) already holds the shared types and the user and team halves; this task
  imports them (`EntityQuery`, `ResolvedScope`, `Entity`, `EntityScopeResolver`, `OperationNames`,
  `ApiKeyFilter`, `build_scope`, `split_ids`, `split_excluded_ids`, `USER_RESOLVER`, `TEAM_RESOLVER`,
  `ScopesError`, `UserQueryParams`, `TeamQueryParams`) and never edits that module. B3096 to B3098 call the
  dispatch below, so keep its names and signatures exactly as written here.

  Query shapes. Each is a plain params struct with every field optional, like B3094's `TeamQueryParams`, and a
  function that turns it into an `EntityQuery`. `TagQueryParams`: start_date, end_date, model, api_key, tags,
  timezone (Option<i64>). `OrganizationQueryParams`: organization_ids, start_date, end_date, model, api_key,
  exclude_organization_ids, timezone. `CustomerQueryParams`: end_user_ids, start_date, end_date, model, api_key,
  exclude_end_user_ids, timezone. `AgentQueryParams`: agent_ids, start_date, end_date, model, api_key,
  exclude_agent_ids, timezone. The functions are `tag_entity_query`, `organization_entity_query`,
  `customer_entity_query` and `agent_entity_query`. Each splits its id list with B3094's `split_ids` and its
  exclusion list with `split_excluded_ids`, copies the other fields, and always sets include_current_utc_day to
  false. The tag query has no exclusion parameter, so its exclude_entity_ids is always empty. The customer query
  is the only one whose id parameters are named end_user_ids and exclude_end_user_ids; the routes
  (B3096 to B3098) use those names for both /customer and /end_user.

  Dispatch, the surface other tasks call. `EntityQueryParams` is an enum with one variant per entity, each
  holding that entity's params struct: User(UserQueryParams), Team(TeamQueryParams), Tag, Organization,
  Customer, Agent. These are the exact public signatures:

  - `pub fn entity_resolver(entity: Entity) -> &'static EntityScopeResolver` is an exhaustive `match` on
    `Entity` (no wildcard arm) returning the six constants. The user and team constants are B3094's.
  - `pub fn parse_entity_query(params: EntityQueryParams) -> EntityQuery` is an exhaustive `match` on the
    variant that calls `user_entity_query` and `team_entity_query` (B3094) or the four functions above.
  - `pub async fn resolve_entity_scope(entity: Entity, context: &EntityScopeContext<'_>, query: &EntityQuery)
    -> Result<ResolvedScope, EntityScopeError>` is an exhaustive `match` on `Entity`. It does not check dates;
    B3096's `resolved_scope` does that first.

  `EntityScopeContext<'a>` is a struct with the caller's `UserAPIKeyAuth` (B2314), the database handle the tag, organization and customer
  owner functions below take, a reference to B4787's built `AgentActivityResolver` (its database sits behind the
  resolver's `AgentRows` port, so the agent branch gets no database handle), and whatever extra dependency value B815's `resolve_team_daily_activity_scope`
  needs through B3094's `resolve_team` (Python reads these from proxy_server inside `_resolve_team`; read
  nothing global here). Take the exact types from those functions' signatures; the context only bundles them.
  `EntityScopeError` is this module's error enum with these variants: `Denied(ScopeDenied)` (B3090, from
  betterlite-analytics), `Scopes(#[from] ScopesError)`, and one #[from] variant per owner error type for the
  tag, organization, customer and agent owner functions (HTTP-style errors pass through untranslated, as in
  B3094). When B3094's `resolve_user` reports a ScopeDenied, lift it into `Denied` instead of `Scopes`, so a
  route task matches one variant for every denial.

  Resolvers (all four are plain async functions; the Python `_resolve_*` names in snake case):

  Tag, `resolve_tag`. Calls B1604's `get_tag_daily_activity_api_key_filter` with the caller and
  `query.api_key` as the requested key. Its result is a string, a list of strings, or none; map it onto
  B3094's `ApiKeyFilter` (a list, even an empty one, becomes `Many`; a string becomes `Single`) wrapped in
  Option. Then `build_scope` with the TAG constant, entity_ids = query.entity_ids as is (tags are not checked
  for existence or ownership here), exclude_entity_ids from the query, that filter and no metadata
  (entity_metadata None).

  Organization, `resolve_organization`. Calls B058's `resolve_organization_daily_activity_scope` with the
  requested ids (query.entity_ids), the database and the caller. It may raise HTTP 403 "User is not org_admin
  for Organization= <id>."; pass that through. Then `build_scope` with the ORGANIZATION constant, the returned
  organization_ids as entity_ids (this can be None for an admin or an empty list for a non-admin with no
  memberships, and an empty list stays `Some(empty)`), exclude_entity_ids from the query, query.api_key as a
  Single filter and the returned organization_metadata as `Some(map)`.

  Customer, `resolve_customer`. First it calls B059's `customer_daily_activity_is_admin` on the caller. When
  that is false it returns `Denied(ScopeDenied)` with status 403 and the message
  `Admin-only endpoint. Your user role=<role>`, where <role> is the caller's user_role value as its plain
  string (for example `internal_user`) and `None` when the caller has no role, and it does not touch the
  database. Otherwise it calls B059's `resolve_customer_daily_activity_scope` with query.entity_ids and the
  database, then `build_scope` with the CUSTOMER constant, the returned end_user_ids, exclude_entity_ids from
  the query, query.api_key as Single and end_user_metadata as `Some(map)`.

  Agent, `resolve_agent`. Calls B4787's `AgentActivityResolver::resolve_scope(agent_ids, auth)` on the resolver in the context, with
  query.entity_ids and the caller (a `&UserApiKeyAuth`). It returns `AgentActivityScope { agent_ids, agent_metadata }`
  or `AgentActivityError`. That function checks the "agents" feature gate and the caller's grants; errors pass
  through. Then `build_scope` with the AGENT constant, the returned agent_ids as entity_ids, exclude_entity_ids
  from the query, query.api_key as Single and agent_metadata as `Some(map)`. B3095 maps each B4787 `AgentMetadata { agent_name }` into B3094's entity metadata
  value type, `serde_json::Map<String, Value>` (the value in `ResolvedScope.entity_metadata`), as `{"agent_name": ...}`.

  Constants. `TAG_RESOLVER`, `ORGANIZATION_RESOLVER`, `CUSTOMER_RESOLVER` and `AGENT_RESOLVER` are
  `pub const EntityScopeResolver` values with the exact strings from L304-L355 and L397-L472. All four have
  entity breakdown on and five operation names, none for cache_leakage_keys (`None`). Tag: table
  litellm_dailytagspend, entity_id_field tag, route prefix /tag, tag "tag management", operation names
  get_tag_daily_activity_aggregated, _aggregated_search, _aggregated_keys, get_tag_daily_activity_model_top_keys
  and get_tag_daily_activity_export. Organization: litellm_dailyorganizationspend, organization_id, /organization,
  "organization management", same pattern with get_organization_daily_activity_*. Customer:
  litellm_dailyenduserspend, entity_id_field end_user_id, two route prefixes /customer and /end_user (in that
  order), tag "Customer Management", get_customer_daily_activity_*. Agent: litellm_dailyagentspend, agent_id,
  /agent, "Agent Management", get_agent_daily_activity_*. The five names per entity are, in order, aggregated
  (`..._aggregated`), search (`..._aggregated_search`), key_page (`..._aggregated_keys`), model_top_keys
  (`..._model_top_keys`) and export (`..._export`); copy them from the pinned file rather than building them
  from a pattern, and use B2312's `DailyActivityTable` variants for the table.

  Order matters for B3096: the context, query and caller arrive from the route; nothing in this task reads a
  database for the tag, the user or the customer-denial paths before its check passes.
scope:
  paths:
    - crates/betterlite-server/src/daily_activity_entities.rs
    - crates/betterlite-server/src/daily_activity_entities/**
    - tools/oracle/cases/helpers/daily-activity-entities/**
    - "tools/oracle/fuzz/corpus/helper_case/daily-activity-entities-*"
    - tools/oracle/helpers/b3095.py
    - tools/oracle/helpers/b3095/**
    - tools/oracle/src/helpers/server/b3095.rs
    - tools/oracle/src/helpers/server/b3095/**
  lint_tables: false
