dod:
  - text: tag_entity_query, organization_entity_query, customer_entity_query and agent_entity_query split their id and exclusion lists on commas without trimming, give None for an empty id string and an empty Vec for an empty exclusion string, and always set include_current_utc_day to false; the tag query has no exclusions.
    proof: [query-tests, helper-case-corpus]
  - text: parse_entity_query and entity_resolver cover all six entities, and entity_resolver returns the resolver whose entity field equals the argument.
    proof: [dispatch-tests, helper-case-corpus]
  - text: resolve_tag passes the requested api key to B1604, maps a string, a list (even empty) and none onto the key filter, keeps entity ids as given and sets no metadata.
    proof: [tag-resolve-tests]
  - text: resolve_organization passes the requested ids to B058, builds the scope from the returned ids and metadata (an empty id list stays Some(empty), None stays None) and passes B058's error through.
    proof: [organization-resolve-tests]
  - text: resolve_customer denies a non-admin with ScopeDenied 403 "Admin-only endpoint. Your user role=<role>" (None for no role) before any database call, and otherwise builds the scope from B059's ids and metadata.
    proof: [customer-resolve-tests, helper-case-corpus]
  - text: resolve_agent passes the requested ids and the caller to B4787's resolver, builds the scope from the returned ids and the metadata mapped into B3094's entity metadata map and passes its error through.
    proof: [agent-resolve-tests]
  - text: resolve_entity_scope sends each Entity to its own resolver, lifts every ScopeDenied (user and customer) into EntityScopeError::Denied and keeps other errors in their own variants.
    proof: [dispatch-tests]
  - text: TAG_RESOLVER, ORGANIZATION_RESOLVER, CUSTOMER_RESOLVER and AGENT_RESOLVER carry the exact table, entity field, route prefixes (customer has /customer then /end_user), tags, breakdown flag and five operation names, with no cache leakage name.
    proof: [resolver-const-tests, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: query-tests
      why: one of the four query shapes splits ids wrongly, sets include_current_utc_day, or gives the tag query exclusions
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_entities::tests::query_/)'
    - id: dispatch-tests
      why: the dispatch misses an entity, parse_entity_query picks the wrong shape, or a denial is not lifted into the Denied variant
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_entities::tests::dispatch_/)'
    - id: tag-resolve-tests
      why: the tag resolver mishandles the key filter result, the entity ids or the metadata
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_entities::tests::tag_resolve_/)'
    - id: organization-resolve-tests
      why: the organization resolver mishandles the returned ids, the metadata or B058's error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_entities::tests::organization_resolve_/)'
    - id: customer-resolve-tests
      why: the customer resolver lets a non-admin through, words the denial wrongly or queries before the check
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_entities::tests::customer_resolve_/)'
    - id: agent-resolve-tests
      why: the agent resolver mishandles the returned ids, the metadata or B4787's error
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_entities::tests::agent_resolve_/)'
    - id: resolver-const-tests
      why: one of the four resolver constants differs from LiteLLM's
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^daily_activity_entities::tests::resolver_const_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3095)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3095 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3095/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added entity cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/daily-activity-entities-*")" &&
        grep -lE '^[[:space:]]+b3095:' tools/oracle/fuzz/corpus/helper_case/daily-activity-entities-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/daily-activity-entities/query-shapes.yaml
  - tools/oracle/cases/helpers/daily-activity-entities/dispatch.yaml
  - tools/oracle/cases/helpers/daily-activity-entities/customer-denial.yaml
  - tools/oracle/cases/helpers/daily-activity-entities/resolver-constants.yaml
deviations:
  - what: The four Python resolver constants, their query callables and their resolve callables become plain data plus functions chosen by an exhaustive match on `Entity`. FastAPI Query parsing and 422 answers for a malformed timezone are done by the route tasks.
    why: rules.yaml requires a build-time set to be an enum matched exhaustively, not a registry of callables, and HTTP parsing belongs to the routes.
  - what: The resolvers return `EntityScopeError` (a Rust enum with a `Denied` variant) where Python returns a ScopeDenied value or raises an HTTPException.
    why: One error type lets B3096 turn every failure into the same HTTP error through B3090's raise_public without catching exceptions.
out_of_scope:
  - "B3094 owns EntityQuery, ResolvedScope, Entity, EntityScopeResolver, OperationNames, _query_ids, _query_excluded_ids, _build_scope, _resolve_user, _resolve_team, _user_query, _team_query and the USER and TEAM resolver constants (L23-L143, L219-L272, L358-L396)."
  - "B1604 owns get_tag_daily_activity_api_key_filter, B058 owns resolve_organization_daily_activity_scope, B059 owns resolve_customer_daily_activity_scope and customer_daily_activity_is_admin, B4787 owns the agent scope resolver (AgentActivityResolver::resolve_scope); this task only calls them."
  - "B3096 to B3098 own the routes, the date range check and the HTTP oracle cases through the booted proxy; no route reaches this module yet, so the cases here are helper cases."
  - "Key filtering in SQL and the daily activity reads are B727 and B3091; this task only builds the scope."
pitfalls:
  - An empty list from the tag key filter means "this caller sees no keys" and must become Many(empty), which B3094's build_scope keeps as Some(empty); only none or an empty string means no filter.
  - The customer denial is a returned ScopeDenied with status 403, not B059's own route answer (that route answers 401 for the same text); the shared analytics routes report 403.
  - The customer denial message prints the role value ("internal_user", "customer") and the word None when the role is absent, because LitellmUserRoles.__str__ returns its value.
  - Customer ids are named end_user_ids and exclude_end_user_ids in the query, yet they land in the generic entity_ids and exclude_entity_ids of EntityQuery like every other entity.
  - The organization scope for a non-admin with no memberships is an empty id list, which means "no organizations", never None (all organizations); do not collapse the two.
  - Tag, organization, customer and agent queries all pass exclude_entity_ids through to the scope untouched; only the tag query has none, so its exclusions are always empty.
  - Metadata is Some(map) for organization, customer and agent even when the map is empty, and None for tags (and users).
  - 'The oracle helper for this task is b3095. Cases call it as `b3095:` under `call`; the Python adapter feeds real `_tag_query`-style inputs and `_resolve_customer` with a stub caller of a given role and no database, and prints plain JSON.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
