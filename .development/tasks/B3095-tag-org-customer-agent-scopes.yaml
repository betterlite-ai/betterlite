    why: The shared types and build_scope that every resolver here ends in, built by B3094.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/daily_activity_scopes.py#L146-L216
    why: _resolve_tag, _resolve_organization, _resolve_customer and _resolve_agent, including the customer admin denial before any lookup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/daily_activity_scopes.py#L275-L355
    why: _tag_query, _organization_query, _customer_query and _agent_query, the four query shapes.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/daily_activity_scopes.py#L397-L472
    why: TAG, ORGANIZATION, CUSTOMER and AGENT resolver constants with route prefixes, tags and operation names.
