id: B639
title: Bedrock rerank request and results
description: >-
  Add BedrockRerankRequest/Reply using the shared rerank wire records, native source document variants and model
  ARN. Preserve source document order and result indices/scores; return_documents, rank_fields and max_chunks_per_doc
  are ignored by this provider; invoke the agent-runtime service with the correct signing service/region.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/rerank/handler.py:
  BedrockRerankHandler.arerank L29-L58; BedrockRerankHandler.rerank L60-L141; BedrockRerankHandler._prepare_request
  L143-L182. litellm/llms/bedrock/rerank/transformation.py: BedrockRerankConfig._transform_sources L32-L55; BedrockRerankConfig._transform_request
  L57-L78; BedrockRerankConfig._transform_response L80-L110.


  Named case contracts: text_and_json_document_source: Build B1013 RerankRequest with model,query,documents,top_n,rank_fields,return_documents
  (handler default True); max_chunks_per_doc is not put in this record. Each string document becomes type=INLINE
  with inlineDocumentSource.type=TEXT and textDocument.text; each nonstring document becomes INLINE with inlineDocumentSource.type=JSON
  and jsonDocument holding the unchanged record. Preserve document order and use one query with type=TEXT,textQuery.text=query.
  rerank_model_arn: Emit rerankingConfiguration.type=BEDROCK_RERANKING_MODEL and bedrockRerankingConfiguration.modelConfiguration.modelArn
  equal to the supplied model verbatim; do not manufacture an ARN. B595 credential preparation receives original
  options/model without a bearer shortcut. B591 selects proxy endpoint, then replace every bedrock-runtime substring
  with bedrock-agent-runtime and append /rerank without trimming slashes. Sign service bedrock via B595 get_request_headers
  with supports_bearer_token=False, Content-Type=application/json overlaid by extra_headers and exact UTF-8 JSON
  body. Environment bearer tokens cannot bypass SigV4 here. top_n: numberOfResults is request.top_n or len(documents):
  absent,None and zero use document count; a negative nonzero count passes through. No local sorting, clipping,
  document truncation or rank_fields projection is performed. results_index_score: Decode with decode_rerank_reply.
  Missing usage defaults billed_units to search_units=1 and tokens to an empty record; an explicitly empty usage
  does not receive the search-unit default, and the same supplied usage record feeds both TypedDict constructors
  before shared B1013 response validation. A truthy results collection maps each item.get(index) and item.get(relevanceScore)
  to index,relevance_score in source order, retaining source validation/coercion failures for missing/invalid fields.
  Use a truthy response id or injected UUID4 string. Missing/None/empty results raises ValueError No results found
  in the response={response}. return_document_content: return_documents true,false,None and rank_fields have no
  effect on this request body or response; returned results never attach document content. Even though the handler
  default is True, it does not reconstruct source documents. max_chunks_per_doc likewise does not affect the payload.
  rerank_error: Both paths call raise_for_status. HTTPStatusError becomes B682 BedrockError preserving status,text,headers,response;
  timeout becomes status408 Timeout error occurred. Other transport errors and post-transport JSON or result-shape
  errors propagate unchanged. Explicit non-AWS Authorization behavior remains B595 even with supports_bearer_token=False;
  test that shared signing branch separately from environment bearer bypass. rerank_transport_logging: B249 pre_call
  receives input=data,empty api_key and complete_input_dict,stored endpoint_url,plain prepared headers. Truthy _is_async
  chooses a matching AsyncHTTPHandler or B173 BEDROCK client; sync uses a matching HTTPHandler or B173 default.
  POST stored endpoint_url, plain prepared headers and serialized body with the supplied timeout on both paths;
  async also passes logging_obj to the client. Sync post_call records response.text and empty api_key before JSON
  decoding; async has no explicit handler post_call. Return the same source projection on both paths.


  Write standalone Rust test rerank_credential_identity_isolation in betterlite-bedrock: Distinct configured identities
  cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle case.


  Write standalone Rust test rerank_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths do
  not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Implement crates/betterlite-bedrock/src/rerank.rs with adjacent tests under rerank/. Keep each Rust module at
  most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  Register helper operation bedrock_other_rerank in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function rerank_cases in betterlite-bedrock with these exact named cases (one per oracle file): text_and_json_document_source,
  rerank_model_arn, top_n, results_index_score, return_document_content, rerank_error, rerank_transport_logging.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_rerank* using HelperCase: kind:
  helper and the externally tagged bedrock_other_rerank variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_rerank that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_rerank_reply consumes rerank HTTP JSON response bytes in crates/betterlite-bedrock/src/rerank.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_rerank.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_other_rerank.
  The adjacent test replays_the_bedrock_other_rerank_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 210 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 235 production lines, 235 behavior/config-test lines,
  105 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 660 planned, 675 maximum changed lines.
