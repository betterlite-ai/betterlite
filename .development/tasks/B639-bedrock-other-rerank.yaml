  - oracle
  - helper-python
- text: New bedrock_other_rerank seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
- text: decode_rerank_reply has newly committed malformed and boundary inputs replayed through production parsing.
  proof:
  - parser-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-text-and-json-document-source
    why: The text-and-json-document-source behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_text_and_json_document_source$/)'
  - id: case-rerank-model-arn
    why: The rerank-model-arn behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_rerank_model_arn$/)'
  - id: case-top-n
    why: The top-n behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_top_n$/)'
  - id: case-results-index-score
    why: The results-index-score behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_results_index_score$/)'
  - id: case-return-document-content
    why: The return-document-content behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_return_document_content$/)'
  - id: case-rerank-error
    why: The rerank-error behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::rerank_cases::case_[0-9]+_rerank_error$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_other_rerank.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_other_rerank*")"
      && grep -lq 'bedrock_other_rerank' tools/oracle/fuzz/corpus/helper_case/bedrock_other_rerank* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_other_rerank$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_other_rerank)"
      && grep -q 'decode_rerank_reply' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_other_rerank.rs && cargo
      nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_other_rerank_corpus$/)'
