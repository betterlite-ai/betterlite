  why: >-
    Own BedrockRerankHandler.arerank, BedrockRerankHandler.rerank, BedrockRerankHandler._prepare_request. Other
    functions in this file remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/rerank/transformation.py#L32-L110
  why: >-
    Own BedrockRerankConfig._transform_sources, BedrockRerankConfig._transform_request, BedrockRerankConfig._transform_response.
    Other functions in this file remain with the owners listed below.
dod:
- text: >-
    text and json document source: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-rerank/text-and-json-document-source.yaml.
  proof:
  - case-text-and-json-document-source
  - oracle
  - helper-python
- text: 'rerank model arn: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-rerank/rerank-model-arn.yaml.'
  proof:
  - case-rerank-model-arn
  - oracle
  - helper-python
- text: 'top n: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-rerank/top-n.yaml.'
  proof:
  - case-top-n
  - oracle
  - helper-python
- text: 'results index score: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-rerank/results-index-score.yaml.'
  proof:
  - case-results-index-score
  - oracle
  - helper-python
- text: >-
    return document content: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-rerank/return-document-content.yaml.
  proof:
  - case-return-document-content
  - oracle
  - helper-python
- text: 'rerank error: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-other-rerank/rerank-error.yaml.'
  proof:
