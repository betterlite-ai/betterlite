dod:
  - text: is_restricted_virtual_key_request is true only for a key whose allowed_routes is a non-empty list.
    proof: [restricted-key-tests]
  - text: authorize_and_fetch_mcp_server resolves the server from the database and then the registry, gives any server to PROXY_ADMIN and PROXY_ADMIN_VIEW_ONLY with the 404 text for an unknown id, and gives everyone else the 403 text for an unknown or denied server, never 404.
    proof: [authorize-tests]
  - text: A lookup error and an access port error come back as Lookup and Access, not as a denial, and the access port is not asked for an admin view.
    proof: [authorize-tests]
  - text: resolve_accessible_mcp_servers returns every registry table in order for view_all and an unrestricted key without calling the sources, and otherwise the first-seen union of allowed tables over the effective auth contexts, passing port errors through.
    proof: [accessible-tests]
  - text: general_settings.user_mcp_management_mode loads as ViewAll only for exactly "view_all" and as Restricted for an absent key, null and every other string.
    proof: [config-tests]
  - text: The existing config YAML decoder replays the new mcp-management-mode seeds, including a non-string value.
    proof: [config-corpus]

checks:
  optional: [mutants]
  commands:
    - id: restricted-key-tests
      why: The restricted virtual key predicate is missing or treats an empty or absent list as restricted.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::management_server_access::tests::restricted_key_/)'
    - id: authorize-tests
      why: Server authorization is missing, leaks a 404 to a non-admin, uses the wrong text or turns a fault into a denial.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::management_server_access::tests::authorize_/)'
    - id: accessible-tests
      why: The accessible server set ignores the mode, loses the first-seen order or calls the sources for view_all.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::management_server_access::tests::accessible_/)'
    - id: config-tests
      why: user_mcp_management_mode does not load, or a value other than exactly view_all turns view_all on.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::mcp_management_mode::/)'
    - id: config-corpus
      why: The management mode key never reaches the YAML decoder's corpus.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/mcp-management-mode-*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'

oracle_cases: []

deviations: []

out_of_scope:
  - "_redact_mcp_credentials and _preserved_admin_config_credentials: B10134. _redact_mcp_credentials_list, _user_is_full_admin, _resolve_credential_target_user_id, the sanitizers and the credential inheritance: B4717. This module calls none of them."
  - "resolve_mcp_server, authorize_mcp_server, get_mcp_server_by_id and get_all_mcp_servers_unfiltered (resolve_server, authorize_server, server_by_id, all_server_tables): B4731. can_access_mcp_server and build_effective_auth_contexts: B4672. get_allowed_mcp_servers and get_all_allowed_mcp_servers (allowed_servers, allowed_tables): B6591. The production AccessibleServerSources and ServerAccessCheck over them: the MCP identity wiring."
  - "_user_has_admin_view (user_api_key_has_admin_view): B2314. The route allowed_routes reader (RouteCaller): B883. get_mcp_server, the production DbLookup: B4711."
  - "The routes that call this module and their HTTP bodies: B4720, B4723 and B4724. The other functions of mcp_management_endpoints.py: the tasks B139 lists."

pitfalls:
  - "is_admin_view is user_api_key_has_admin_view, so PROXY_ADMIN_VIEW_ONLY gets any server and the 404 here, while B4717's full-admin predicate (PROXY_ADMIN only) is a different question; do not swap them."
  - "The non-admin answer for an unknown server_id is the 403 forbidden text, so ids cannot be enumerated; only an admin view sees the 404."
  - "The view_all shortcut is skipped for a restricted virtual key even in view_all mode, so a route-restricted key always takes the context walk."
  - "De-duplicate on server_id keeping the first table seen; a later context's copy of the same server must not replace it, and the answer keeps first-seen order, not registry order."
  - "user_mcp_management_mode is compared as the exact string view_all; \"VIEW_ALL\", \"view-all\" and an empty string are all Restricted, and a missing key must not fail the config load."
  - "Rows are returned with their credentials and env_vars; never serialize a result of resolve_accessible_mcp_servers or authorize_and_fetch_mcp_server into a response without a redaction step."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
