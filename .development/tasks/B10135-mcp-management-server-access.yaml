    - crates/betterlite-server/src/mcp/management_server_access.rs
    - crates/betterlite-server/src/mcp/management_server_access/**
    - crates/betterlite-config/src/sections/mcp_management_mode.rs
    - crates/betterlite-config/src/sections/mcp_management_mode/**
    - crates/betterlite-config/fuzz/corpus/config_yaml/mcp-management-mode-*
  lint_tables: false

