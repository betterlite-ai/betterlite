id: B10135
title: MCP management server access and management mode
description: >-
  Two questions recur across the MCP management routes. May this caller manage their own per-user state on server X? That is LiteLLM's _authorize_and_fetch_mcp_server, asked by B4723's credential routes and B4724's env var routes. Which servers does the dashboard show this caller? That is _resolve_accessible_mcp_servers, asked by B4724's status list and B4720's server list. Both used to sit in B4717 next to the credential redaction, so B4724 waited for the sanitizers and the inheritance code it never calls. This task builds the two answers, the restricted-key predicate they share with B4720, and the general_settings key that switches the dashboard between restricted and view_all.


  Layout. The server code goes in betterlite-server, module mcp::management_server_access (crates/betterlite-server/src/mcp/management_server_access.rs, tests in management_server_access/tests.rs). The config key goes in betterlite-config, section mcp_management_mode (crates/betterlite-config/src/sections/mcp_management_mode.rs, tests in mcp_management_mode/tests.rs). Both files are empty stubs on main, declared in mcp.rs and sections.rs, and the section is already in the sections! list. mcp::management_access is a different module (B4711's database handle check); leave it alone. No Cargo.toml changes: betterlite-server already depends on betterlite-mcp, betterlite-auth, betterlite-db and betterlite-config.


  Config section. ManagementMode is a public enum in the section with the variants Restricted (the default) and ViewAll. general_settings.user_mcp_management_mode is read as an optional string: exactly "view_all" gives ViewAll, and an absent key, null, "restricted" or any other string gives Restricted (LiteLLM's _get_user_mcp_management_mode). Expose it as config.sections.mcp_management_mode.mode. Copy the shape of sections/mcp_required_fields.rs: a Raw holding general_settings, a Settings and the Section impl. The server module takes the mode as a parameter and never reads config; B4720's and B4724's route states carry it.


  Server module. Types come from other tasks: UserAPIKeyAuth and user_api_key_has_admin_view from B2314 (betterlite_auth::resolved_key::auth), McpServerTable (LiteLLM_MCPServerTable) from B858, ServerRegistry from B10020, and from B4731 (betterlite_mcp::registry) resolve_server with its DbLookup port and ResolveError, authorize_server with ServerAccessCheck, AuthorizeError and the not-found/forbidden choice, and all_server_tables. Read B4731's merged code for the exact paths and argument order. Every item below is pub; LiteLLM names in backticks.

  1. `is_restricted_virtual_key_request(auth: &UserAPIKeyAuth) -> bool` (`_is_restricted_virtual_key_request`): true only when the key's allowed_routes is a non-empty list. UserAPIKeyAuth keeps its fields pub(crate), so read them through B883's RouteCaller::of_key(auth).allowed_routes in betterlite_auth::virtual_key_routes::caller: AllowedRoutes::Listed with at least one entry is true, and Unset, NotAList and an empty Listed are false. Do not add a reader to betterlite-auth. B4720 calls this to pick the virtual-key sanitizer.

  2. `authorize_and_fetch_mcp_server(registry: &ServerRegistry, db: &impl DbLookup, access: &impl ServerAccessCheck, auth: &UserAPIKeyAuth, server_id: &str) -> Result<McpServerTable, ManagementAccessError<A::Error>>` (`_authorize_and_fetch_mcp_server`), A being the access port's type. First resolve_server(server_id) with no temp lookup, db as the DbLookup, no client ip on either side and match_name false; a lookup error is ManagementAccessError::Lookup. Then authorize_server(resolved, auth, access) with is_admin_view = user_api_key_has_admin_view(auth), not_found_detail {"error": "MCP Server <server_id> not found"}, forbidden_detail {"error": "User does not have permission to access mcp server with id <server_id>. You can only manage mcp servers that you have access to."}, non-admin-missing set to forbidden and allow_catalog_view false. AuthorizeError::NotFound and Forbidden become ManagementAccessError::NotFound and Forbidden with the same detail; AuthorizeError::Access becomes ManagementAccessError::Access with the port error as its source, never a denial. Return the table of the authorized resolution. The effect: PROXY_ADMIN and PROXY_ADMIN_VIEW_ONLY reach any server and get 404 for an unknown id; everyone else gets 403 for an unknown id or a server outside their allowed set, never 404. A server declared only in config.yaml has no database row and resolves through the registry.

  3. AccessibleServerSources, a port this module declares for the two calls _resolve_accessible_mcp_servers makes beyond the registry, shaped like B4731's ServerAccessCheck: `type Error: std::error::Error + Send + Sync + 'static;`, `fn effective_auth_contexts(&self, auth: &UserAPIKeyAuth) -> impl Future<Output = Result<Vec<UserAPIKeyAuth>, Self::Error>> + Send;` for B4672's build_effective_auth_contexts, and `fn allowed_server_tables(&self, auth: &UserAPIKeyAuth) -> impl Future<Output = Result<Vec<McpServerTable>, Self::Error>> + Send;` for B6591's allowed_tables (LiteLLM get_all_allowed_mcp_servers). This task names nothing from B4672 or B6591; the tests use a fake, and the production adapter goes with the MCP identity wiring, which already holds B4672's UiSession and B6591's ServerUnion.

  4. `resolve_accessible_mcp_servers(registry: &ServerRegistry, sources: &impl AccessibleServerSources, auth: &UserAPIKeyAuth, mode: ManagementMode) -> Result<Vec<McpServerTable>, S::Error>` (`_resolve_accessible_mcp_servers`), S being the sources' type. When mode is ViewAll and the key is not restricted (function 1), answer B4731's all_server_tables, every registry server in registry order, without calling the sources. Otherwise walk effective_auth_contexts(auth) in order, call allowed_server_tables for each context in order, and keep the first table seen for each server_id; answer them in first-seen order. An error from either call is returned as it is. The rows come back unredacted: B4724 reads their env_vars and reports only is_set, and a caller that shows rows applies B10134's or B4717's redaction itself.

  ManagementAccessError<E> is this module's thiserror enum: NotFound and Forbidden carry B4731's detail map, which the routes answer as 404 and 403 with {"detail": detail}; Lookup keeps B4731's ResolveError and Access keeps E, each as #[source], and the routes pass both on as server errors. Do not call it VisibilityError: spend::visibility already has one.


  Tests. management_server_access::tests uses synthetic records (server ids like test-srv-1), a fake DbLookup, a fake ServerAccessCheck and a fake AccessibleServerSources that record their calls and can fail on demand. Names starting with restricted_key_ cover function 1 (no list, an empty list, a non-empty list). Names starting with authorize_ cover function 2: an admin reaching a database server and a config-only server, an admin and a view-only admin getting the 404 text for an unknown id, a non-admin allowed through the port, a non-admin denied with the 403 text, a non-admin with an unknown id getting 403 and not 404, the access port never called for an admin view, a lookup error as Lookup and a port error as Access. Names starting with accessible_ cover function 4: view_all with an unrestricted key returning every registry table in order without calling the sources, view_all with a restricted key and restricted mode both taking the context walk, first-seen de-duplication across contexts, and an error from each port method coming back unchanged. sections::mcp_management_mode::tests loads YAML through the ConfigLoader the way sections/mcp_required_fields/tests.rs does: absent key, null, "restricted", "view_all", "VIEW_ALL" and an empty string. Add config_yaml corpus seeds named mcp-management-mode-* for B002's existing decoder, including a non-string value.

