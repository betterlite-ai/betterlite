id: B095
title: Skills pre-call hook, its adapters and the proxy hook
description: >-
  LiteLLM's SkillsInjectionHook has two halves. B3394 and B3395 built the post-call half in
  crates/betterlite-core/src/api/skills/ (the hook struct, tool-call extraction, execute_code, execute_skill_tool,
  attach_files_to_response, post_call_success and the Messages continuation loop). This task builds the pre-call half,
  the three adapters that connect the hook to the real store, sandbox and Messages call, and the betterlite-server type
  that makes the hook a proxy callback. Read hook.rs, hook/*.rs and continuation.rs with its folder first and reuse what
  they define (SkillsInjectionHook, HookSettings, SkillFiles, SkillsSandbox, HookResponse, SkillsRequestData,
  RequestMetadata, MessagesContinuation, ContinuationRequest, SkillsLoopError, LITELLM_SKILL_ID_PREFIX). Change none of
  their files.


  Where the code goes. In betterlite-core, the new module api::skills::wiring: crates/betterlite-core/src/api/skills/wiring.rs
  and its folder. The architect's skeleton creates the empty file and declares it in skills.rs, so do not touch skills.rs.
  Split it into wiring/pre_call.rs, wiring/lookup.rs, wiring/sandbox.rs, wiring/messages.rs and wiring/request.rs, with
  tests in wiring/tests.rs or wiring/tests/; open each file that holds serde_json::Value with the same
  `#![expect(clippy::disallowed_types, reason = "...")]` line hook.rs uses. In betterlite-server, the new module
  hooks::litellm_skills: crates/betterlite-server/src/hooks/litellm_skills.rs and its folder (the skeleton adds the
  `pub mod litellm_skills;` line to hooks.rs). Request maps are `betterlite_openai::openai_base_config::Object`
  (serde_json Map), the same type ProxyCallback::pre_call receives.


  Skill lookup (lookup.rs). Define

      pub trait SkillLookup {
          type Error: Display;
          fn fetch_skill(&self, skill_id: &str, principal: &UserAPIKeyAuth) -> impl Future<Output = Result<Option<SkillRow>, Self::Error>> + Send;
      }

  in the style of SkillsSandbox in hook/execution.rs (impl Future, no async-trait). SkillRow stands for B858's skills row
  (LiteLLM_SkillsTable), the type B1502's store returns and B1504's functions take. Implement it for B1502's
  HostedSkillStore by calling its fetch_skill_from_db with the principal converted the way B1502 takes it; that call already
  turns not-found, not-authorized and database errors into None, so its Error is std::convert::Infallible.
  `fetch_skill_from_db(&self, skill_id, principal, lookup)` on the hook mirrors _fetch_skill_from_db: Ok(row) gives the
  row, and Err(e) logs the warning "SkillsInjectionHook: Error fetching skill {skill_id}: {e}" and gives None.


  Pre-call (pre_call.rs). `pub async fn pre_call<Lookup: SkillLookup + Sync>(&self, principal: &UserAPIKeyAuth, data: &mut
  Object, call_type: CallType, lookup: &Lookup) -> Result<(), PreCallError>` in an `impl<PromptHandler: Sync, Sandbox: Sync>
  SkillsInjectionHook<PromptHandler, Sandbox>` block mirrors async_pre_call_hook. It edits data in place, in this order:

  1. Only CallType::Completion, CallType::Acompletion and CallType::AnthropicMessages go on; every other call type returns
  Ok(()) with data untouched.

  2. data["container"] must be a non-empty JSON object and its "skills" a non-empty array, otherwise return Ok(()). A
  string container (an Anthropic container id) is skipped the same way.

  3. Log "SkillsInjectionHook: Processing {n} skills" at debug, n being the array length including non-object entries.

  4. Walk the skills in order. A non-object entry is skipped. skill_id is the entry's "skill_id" string, "" when absent.
  An id starting with "litellm_skill_" is fetched through fetch_skill_from_db with the caller's principal; a row is kept
  in order, and None logs the warning "SkillsInjectionHook: Skill '{skill_id}' not found in LiteLLM DB". Any other id is
  a native Anthropic skill: LiteLLM collects it in a list it never reads, so it is left alone.

  5. No rows kept: return Ok(()). The container stays in data and goes to the provider as sent.

  6. Otherwise run `process_for_messages_api(&self, data, &rows, use_anthropic_format)` with use_anthropic_format true
  only for AnthropicMessages. It mirrors _process_for_messages_api. tools is data["tools"] (absent or null is an empty
  array; any other non-array is PreCallError::ToolsNotList). For each row in order: push B1504's
  convert_skill_to_anthropic_tool(row) to tools; push extract_skill_content(row) to the contents list when it is Some and
  non-empty; take extract_all_files(row) and, when non-empty, store it under the row's skill_id in an ordered map (a
  repeated id replaces the earlier files) and count its paths ending ".py". Write tools back to data["tools"]. When the
  contents list is non-empty, call B1504's inject_skill_content_to_messages(data, contents, use_anthropic_format). When the
  files map is non-empty, append B1504's get_litellm_code_execution_tool_anthropic() to data["tools"] once, then set
  the hook's own request-scoped state to code_execution_enabled true with the files map {skill_id: {path: SkillFiles}}.
  Neither is written into data["litellm_metadata"] or data["metadata"], and the post-call never reads them from there
  (a deviation below). Then remove data["container"] in every case,
  and log at debug "SkillsInjectionHook: Messages API - converted {rows} skills to Anthropic tools, injected {contents}
  skill contents, added litellm_code_execution tool with {py paths} modules". Call B1504's functions by these names in
  betterlite_core::skills::content; if B1504 put them on a handler struct, that struct is the hook's PromptHandler
  argument.

  PreCallError is a thiserror enum in wiring/error.rs with ToolsNotList ("tools must be a list").


  Request data for the post-call (request.rs). `pub fn skills_request_data(request: &Object, skills: RequestMetadata) -> SkillsRequestData` builds
  B3395's record from the deployment call's request map: model (string, "" when absent), messages and tools (arrays,
  empty when absent), max_tokens (u64, None when absent), and skills, the RequestMetadata that the pre-call stored in
  the hook's request-scoped state for this request (default when the pre-call stored none). The request map's own
  litellm_metadata and metadata are never read for the flag or the files.


  Sandbox adapter (sandbox.rs). Implement B3394's SkillsSandbox for B1506's SkillsSandboxExecutor: execute(code,
  skill_files) calls the executor with the code and the files and maps its result into SandboxOutcome (output, error,
  and each generated file's name, mime_type and content_base64). The executor's own error is the adapter's Error.
  `sandbox_executor(settings: &HookSettings, ...)` builds the executor the way SkillsInjectionHook builds it in LiteLLM,
  passing settings.sandbox_timeout where B1506 accepts a timeout; B1506 documents that the timeout is not forwarded to
  the session.


  Messages adapter (messages.rs). `MessagesDispatchContinuation<Dispatch>` holds B1134's Messages dispatch service and
  implements B3395's MessagesContinuation. create(request) mirrors `litellm.anthropic.acreate(model=, messages=, tools=,
  max_tokens=)`: it builds B1134's dispatch input with exactly those four fields, no stream, no system, no credentials and
  no api_base, awaits it, and returns Ok(Some(HookResponse::Dict(body))) with the Messages response body as a JSON map. A
  streamed result cannot happen without stream=true and is an error. B1134's error is the adapter's Error; the loop logs
  it and returns the first response, so it never reaches the client.


  Proxy hook (betterlite-server hooks::litellm_skills). `SkillsProxyHook<Lookup, PromptHandler, Sandbox, Messages>` holds
  the core SkillsInjectionHook, the lookup and the continuation. `new(lookup, prompt_handler, executor, messages,
  settings: HookSettings)` is the constructor the proxy composition calls; HookSettings comes from B3394's
  HookKwargs::default() (10 iterations, 120 seconds), since PROXY_HOOKS builds the hook with no kwargs. It implements
  ProxyCallback: class_name "SkillsInjectionHook", overrides() with only request.pre_call set (LiteLLM's class overrides
  async_pre_call_hook and the deployment hook, never the proxy-level success, failure, moderation, header or streaming
  hooks), is_base_logger, enforces_request_content and use_native_lifecycle_hooks false, guardrail None. pre_call runs the
  core pre_call and returns Ok(PreCallReturn::Unchanged) after editing data in place; a PreCallError becomes
  ProxyHookError::Http with status 400 and the error text. `pub async fn post_call_success_deployment(&self,
  request_data: &Object, response: HookResponse) -> Result<Option<HookResponse>, SkillsLoopError>` builds
  skills_request_data(request_data, state) with the request's stored skills state and returns the core post_call_success with the Messages adapter. ProxyCallback has
  no deployment-level method yet, so this inherent method is what the deployment hook loop calls once one exists.


  Oracle helper. The skeleton registers this task's helper operation b095 in the core_ops group and adds its files to
  the scope. Its input is call_type (a LiteLLM CallTypes string), data (the request map) and skills, a map from skill id
  to one of found (a skills row in B858's wire shape, file_content base64), missing or error. The Rust adapter runs the
  core pre_call with a scripted SkillLookup (error gives Err) and answers the edited map. The Python adapter builds
  SkillsInjectionHook(), replaces LiteLLMSkillsHandler.fetch_skill_from_db with an async stub that returns the row,
  returns None or raises RuntimeError for the case, awaits async_pre_call_hook(UserAPIKeyAuth(), DualCache(), data,
  call_type), restores the stub, and answers the returned dict with every bytes value in litellm_metadata._skill_files
  base64 encoded. The Rust adapter answers the stored skills state in that same shape, since the deviation below moves
  the data out of the request map. The rows use instructions, description and small ZIP archives built for the case.


  Size. The owned LiteLLM spans (main.py L118-L254 and L325-L348) are about 95 non-blank, non-comment lines, so this is
  one task. Estimated 420 lines of Rust across both crates, 380 of tests, plus the adapters the skeleton adds. The request
  body is already parsed JSON and the base64 decode is the base64 crate's, so there is no new byte decoder and no fuzz
  target.
