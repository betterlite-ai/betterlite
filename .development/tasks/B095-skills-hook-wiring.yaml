    - crates/betterlite-core/src/api/skills/wiring.rs
    - crates/betterlite-core/src/api/skills/wiring/**
    - crates/betterlite-server/src/hooks/litellm_skills.rs
    - crates/betterlite-server/src/hooks/litellm_skills/**
    - tools/oracle/cases/helpers/skills-pre-call/**
    - "tools/oracle/fuzz/corpus/helper_case/skills_pre_call-*"
    - tools/oracle/helpers/b095.py
    - tools/oracle/helpers/b095/**
    - tools/oracle/src/helpers/core_ops/b095.rs
    - tools/oracle/src/helpers/core_ops/b095/**
  lint_tables: false
