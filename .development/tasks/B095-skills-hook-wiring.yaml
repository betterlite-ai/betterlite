dod:
  - text: pre_call leaves data untouched for call types other than completion, acompletion and anthropic_messages, for a missing, empty or non-object container, and for missing, empty or non-array skills.
    proof: [pre-call-gate]
  - text: Only ids starting with "litellm_skill_" are fetched, in order, with the caller's principal; non-object entries are skipped, other ids are left alone, a missing row and a failed fetch are both skipped, and with no row kept the container stays in data.
    proof: [pre-call-gate]
  - text: With rows kept, tools get one Anthropic-style tool per row after the caller's tools, skill content goes to top-level system for anthropic_messages and to the messages system entry otherwise, and the container is removed even when it also held native skills.
    proof: [pre-call-transform]
  - text: When any row has files, the litellm_code_execution tool is appended once after the skill tools, and the request's skills state gets the files per skill id and code execution enabled; with no files neither the tool nor the state is added, and the request's metadata keys are never touched.
    proof: [pre-call-transform]
  - text: A non-array tools value comes back as PreCallError, and the proxy hook answers it as a 400 naming the field.
    proof: [pre-call-transform, proxy-hook]
  - text: skills_request_data reads model, messages, tools and max_tokens from the request map and takes the flag and files from the stored skills state, ignoring any _litellm_code_execution_enabled or _skill_files a client sent in litellm_metadata or metadata.
    proof: [request-data]
  - text: The Messages adapter sends exactly model, messages, tools and max_tokens to B1134's dispatch and returns the response body as a Dict, and the sandbox adapter maps B1506's result into SandboxOutcome.
    proof: [adapters]
  - text: SkillsProxyHook reports class_name SkillsInjectionHook with only request.pre_call overridden, edits data in place on pre_call, and post_call_success_deployment runs the code loop end to end with a scripted model and sandbox.
    proof: [proxy-hook]
  - text: The pre-call matches the pinned hook on scripted skill rows for every case.
    proof: [oracle, helper-python, helper-case-corpus, new-oracle-cases]
  - text: Every mutant in the wiring and proxy hook modules is caught by a test.
    proof: [mutants]
checks:
  optional: [mutants]
  commands:
    - id: pre-call-gate
      why: the call type gate, the container checks, the prefix split or the fetch handling is wrong or untested
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::wiring::tests::pre_call_gate/)'
    - id: pre-call-transform
      why: tool order, content injection, the code execution tool, the stored skills state or the container removal is wrong or untested
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::wiring::tests::pre_call_transform/)'
    - id: request-data
      why: the post-call request record is built wrong from the request map
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::wiring::tests::request_data/)'
    - id: adapters
      why: the Messages or sandbox adapter forwards the wrong fields or maps results wrong
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::skills::wiring::tests::adapters/)'
    - id: proxy-hook
      why: the ProxyCallback impl, the 400 mapping or the deployment post-call entry is wrong or untested
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^hooks::litellm_skills::/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b095)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b095 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b095/pyrightconfig.json
    - id: helper-case-corpus
      why: the added helper cases have no seed in the helper corpus or the shared parser rejects them
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/skills_pre_call-*")" &&
        grep -lE '^[[:space:]]+b095:' tools/oracle/fuzz/corpus/helper_case/skills_pre_call-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: new-oracle-cases
      why: no new oracle case exists on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/skills-pre-call)"
