  - tools/oracle/cases/helpers/skills-pre-call/skills-not-a-list.yaml
deviations:
  - what: The code execution flag and the skill files stay in the hook's request-scoped state. They are not written into litellm_metadata, and the post-call ignores any such keys a client sends.
    why: LiteLLM writes them into litellm_metadata and reads them back, also from client metadata (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/litellm_skills/main.py#L398-L405), and strips nothing (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L376-L384), so a client could start the sandbox loop with its own files.
  - what: A non-array tools value answers 400 naming the field.
    why: LiteLLM raises AttributeError or TypeError there and answers 500; docs/compatibility.md rejects a value of the wrong declared type with a 400.
  - what: The proxy hook edits the request map in place and returns PreCallReturn::Unchanged instead of returning the map.
    why: LiteLLM returns the same dict it mutated, so the request that goes on is identical.
out_of_scope:
  - "_extract_tool_calls, _execute_code, _execute_skill_tool, _attach_files_to_response and __init__ (main.py L106-L116, L440-L484, L606-L713, L878-L914) are B3394's."
  - "async_post_call_success_deployment_hook and _execute_code_loop_messages_api (main.py L371-L438, L486-L604) are B3395's; call post_call_success, do not copy it."
  - "_process_non_anthropic_model, _is_anthropic_model, _execute_code_loop, _execute_code_tool, _first_choice and the _Chat* protocols (main.py L47-L86, L256-L323, L350-L369, L715-L876) have no caller at the pin."
  - "SkillPromptInjectionHandler and the code execution tool definitions (prompt_injection.py, code_execution.py) are B1504's."
  - "LiteLLMSkillsHandler.fetch_skill_from_db and the skill cache are B1502's; SkillsSandboxExecutor is B1506's; acreate and the Messages dispatch are B1134's."
  - "Registering the hook as litellm_skills in the proxy's hook list (PROXY_HOOKS and _add_proxy_hooks) is B8399's; this task only provides SkillsProxyHook::new."
  - "litellm.utils.async_post_call_success_deployment_hook, the loop that calls the post-call half for each callback, belongs to the call wrapper tasks (B5367, B5368)."
  - "litellm/skills/__init__.py and litellm/proxy/hooks/litellm_skills/__init__.py only re-export names; the Python package re-exports are B7884's."
  - "HTTP oracle cases through /v1/messages and /v1/chat/completions come with the task that registers the hook, since no route reaches it before that."
pitfalls:
  - The container is removed only when at least one litellm_skill_ row was found, and then the native Anthropic skills in it are dropped too; with no row found the whole container reaches the provider.
  - Tools stay in Anthropic shape (name, description, input_schema) even for chat completions, since _process_for_messages_api runs for every accepted call type.
  - A skill_id that is absent counts as "", so it is a native skill and never fetched.
  - The code execution tool goes in once per request, after every skill tool, and only when some row had files; a skill with only instructions adds a tool and system text but no metadata.
  - A skill fetched twice adds two tools, but its files land once under the same skill_id key.
  - The debug count is the raw skills array length, non-object entries included, while the summary line counts only .py paths of the files map.
  - The continuation call sends only model, messages, tools and max_tokens, with no api_key or api_base from the deployment, so it resolves credentials like a plain SDK call.
  - LiteLLM reads _litellm_code_execution_enabled and _skill_files from the client-supplied metadata too; betterlite does not, so a test must send both keys in litellm_metadata and metadata and see the loop stay off.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 4
