deviations:
  - what: DiskCache uses a blocking sync library via a tokio blocking pool, not direct async file I/O.
    why: LiteLLM uses diskcache (synchronous Python library); betterlite binds it or uses a compatible Rust library, executing blocking calls in a blocking task to avoid freezing the async loop.
  - what: CacheCodec.deserialize logs warnings for schema drift (ValidationError) but returns None to treat as cache miss, not a fatal error.
    why: LiteLLM's codec catches ValidationError and returns None to let callers treat stale entries as cache misses without crashing the request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/cache_pydantic_utils.py#L82-L90
  - what: EventDrivenCacheCoordinator has no explicit timeout on asyncio.Event.wait(); unbounded waits are possible if the loader hangs.
    why: LiteLLM's coordinator does not timeout; betterlite must decide whether to add explicit timeouts or require the caller to bound the load_fn via context.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/cache_coordinator.py#L163-L196

out_of_scope:
  - B4290 owns AsyncCacheProtocol contract definition and cache type enums; they are reused as-is.
  - Redis backend, cluster/semantic/object-store cache factories and their error handling belong to later cache orchestration tasks (B4293-B4299, B126-B128).
  - The load_fn implementation and its error handling. EventDrivenCacheCoordinator passes exceptions to waiters unchanged; the caller supplies the load function and handles failures.
  - Configuration of disk cache directory or TTL defaults. B4299 settles backend construction and namespace assignment.
  - Network requests and remote cache backends; disk cache is local-only persistence.

pitfalls:
  - DiskCache.get_cache returns truthy values only; LiteLLM checks `if original_cached_response:` before json.loads, so any falsy payload (0, empty list, False, empty string) is treated as cache miss, not as cached falsy data.
  - diskcache.Cache.get returns None when a key is absent or the value itself is None/falsy; json.loads exception is caught and the value is returned unchanged, so distinguish between missing keys and falsy values.
  - CacheCodec.deserialize logs a warning but returns None on ValidationError; this is not a fatal failure, so callers must handle None as cache miss, not as a hard error stopping the request.
  - The coordinator's _event is None outside _claim_role-claimed/loading state; waiters check a temporary event captured before the lock is released, so read-after-signal races are prevented by the lock semantics.
  - EventDrivenCacheCoordinator has no explicit timeout on asyncio.Event.wait(); if the load_fn hangs, all waiting tasks block indefinitely. Callers must ensure load_fn is bounded (e.g., with asyncio.wait_for).
  - The coordinator's log_prefix is a string; when empty or None, verbose logging is skipped. Tests that verify logging behavior must pass a non-empty prefix and enable verbose logging.
  - diskcache.Cache.transact() is synchronous, so increment_cache cannot be truly async. LiteLLM's async_increment wraps the sync version; betterlite must run disk transacts in a blocking pool.

