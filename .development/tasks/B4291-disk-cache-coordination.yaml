id: B4291
title: Persistent disk cache and typed cache coordination
description: >-
  Build DiskCache to persist cache entries with `.litellm_cache` as the default directory, TTL support via
  diskcache library, truthy-only reads (returns None for any falsy value), and transaction-protected
  increments. Implement CacheCodec for Pydantic model serialization: serialize validates with model_type
  when provided, skips re-validation for pre-typed instances, and returns model_dump(mode="json") for
  JSON-safe Redis storage; deserialize handles None, pre-typed instances, dicts (validates on schema drift,
  logging warnings), and non-dict untyped values as cache misses. Build EventDrivenCacheCoordinator to
  prevent cache stampede: when many requests miss the same key, only the first performs the load while
  others wait for a signal, then read from cache. Preserve per-instance coordination state and always
  signal in finally blocks.

  DiskCache.set_cache stores values with optional TTL, get_cache reads and returns None for any falsy
  result or exception, batch_get_cache returns a list preserving input key order. Async variants delegate
  to sync operations with no retry or fallback. increment_cache uses diskcache.transact() for atomic
  read-modify-write. CacheCodec.serialize and deserialize are symmetric utilities; deserialize logs
  warnings for ValidationError but treats them as cache miss (returns None), not fatal. EventDrivenCacheCoordinator
  uses asyncio.Lock for brief claim/signal operations and asyncio.Event for waiter signaling; its get_or_load
  orchestrates the pattern through _claim_role, _load_and_cache, _wait_for_signal_and_get and _signal_done,
  with _signal_done guaranteed to run in finally even if load_fn raises.

  Blocking disk I/O must use an owned blocking facility; tokio::task::block_in_place or sync code in async
  context is not allowed. Library choice (diskcache or equivalent), bounded wait timeouts and latency
  assumptions are explicit compatibility decisions, not inherited LiteLLM guarantees.

