dod:
  - text: DiskCache implements the AsyncCacheProtocol with .litellm_cache as default directory, TTL on writes, truthy-only reads and transaction-protected increments.
    proof: [disk-cache-behavior, disk-cache-tests]
  - text: CacheCodec.serialize validates dicts/models with model_type, dumps to json mode, skips copy for pre-typed values, and passes through untyped values unchanged.
    proof: [codec-tests]
  - text: CacheCodec.deserialize returns None for None, pre-typed instances unchanged, validates dicts, logs warnings for schema mismatches, and returns None for non-dict untyped values.
    proof: [codec-tests]
  - text: EventDrivenCacheCoordinator prevents cache stampede by claiming a single loader role, waiting on a signal, or loading and signalling others in the same AsyncCacheProtocol.
    proof: [coordination-tests, coordinator-behavior]
  - text: The coordinator's _claim_role, _load_and_cache, _wait_for_signal_and_get and _signal_done all use asyncio primitives without blocking; finally blocks guarantee _signal_done runs.
    proof: [coordination-tests]
  - text: Every oracle case for disk cache and coordination matches LiteLLM behavior on reads, writes, increments and the coordinator load pattern.
    proof: [oracle]

