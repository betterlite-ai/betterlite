id: B602
title: Bedrock Converse parameter composition
description: >-
  Compose ConverseOptions into inferenceConfig, additionalModelRequestFields, toolConfig, cache points and service-tier/metadata
  inputs. Preserve top_k handling, minimum token guards, context-management translation and parallelToolUse compatibility;
  some unsupported values drop silently while reasoning branches emit the exact diagnostics below.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/chat/converse_transformation.py:
  AmazonConverseConfig.map_openai_params L1010-L1165; AmazonConverseConfig._map_request_metadata_param L1167-L1170;
  AmazonConverseConfig._map_context_management_param L1172-L1187; AmazonConverseConfig._map_service_tier_param L1189-L1199;
  AmazonConverseConfig.update_optional_params_with_thinking_tokens L1271-L1294; AmazonConverseConfig.get_cache_point_block
  L1297-L1306; AmazonConverseConfig.get_cache_point_block L1309-L1318; AmazonConverseConfig.get_cache_point_block
  L1320-L1338; AmazonConverseConfig._build_cache_point_block L1341-L1353; AmazonConverseConfig._transform_inference_params
  L1508-L1511; AmazonConverseConfig._handle_top_k_value L1513-L1537; AmazonConverseConfig._merge_parallel_tool_use_config
  L1540-L1553; AmazonConverseConfig._drop_tool_choice_type_conflicting_with_tool_config L1556-L1567.


  Reuse AnthropicConfig._map_reasoning_effort from B569 (litellm/llms/anthropic/chat/transformation.py); its implementation
  remains with that prerequisite.


  Reuse AnthropicConfig.cap_thinking_budget_to_max_tokens from B569 (litellm/llms/anthropic/chat/transformation.py);
  its implementation remains with that prerequisite.


  Reuse AnthropicConfig.map_openai_context_management_to_anthropic from B2201 (litellm/llms/anthropic/chat/transformation.py);
  its implementation remains with that prerequisite.


  Reuse AnthropicModelInfo.translate_legacy_thinking_for_adaptive_model from B688 (litellm/llms/anthropic/common_utils.py);
  its implementation remains with that prerequisite.


  Named case contracts: inference_config_options: Process input order; max_tokens/max_completion_tokens overwrite
  maxTokens last-wins. If Pythonint includingbool and B600 GPT/Grokmin predicate, clamp to16; all other values copiedunchanged.
  stream copied as-is. stop empty string skipped, otherstring singleton, any nonstring copiedto stopSequences includingNone/empty
  list. Responseformat onlydict usesB601; tools onlylist usesB601. temperature/top_p maptopP with B688 Anthropic
  sampling gate for anthropicbase. Nonsampling othermodel ->UnsupportedParamsError400 <model> does not support <param>=<value>.
  To drop unsupported params, set `litellm.drop_params = True`. unless truthyglobal/percalldrop; dropthen silent.
  Unrecognizedparams ignored. additional_model_fields: parallel_tool_calls stores _parallel_tool_use_config.tool_choice={type:auto,disable_parallel_tool_use:not
  value} usingtruthiness. DeepSeek thinking always debug Dropping unsupported `thinking` param for Bedrock model=<model>;
  it reasons natively. anddoesnotassign (preexisting thinkingnotremoved). GPT thinking silentlynotassigned. DeepSeekR1
  stringeffort debug Dropping unsupported `reasoning_effort` param for Bedrock model=<model>; it always reasons
  and rejects it. Otherstringeffort delegatesB600; nonstringignored. Dictoutput_config copiedthen B690normalized;
  processingorderdeterminesoverride. Emptydict web_search_options enablesB600 groundingsystemtool throughB2202 append.
  service_tier: Stringauto mapsdefault; default/flex/priority ->serviceTier{type:<value>}. Unknown/casevariation/empty/nonstring
  silentlyignored, leavingexistingserviceTier. No newlyinventedvalidationerror. request_metadata: Only non-None
  dictrequestMetadata invokesB596 validator andassigns aftervalidation; non-dictvalues silentlyignored atthismappinglayer.
  ReplaysameB596 size/type/character400 cases fordictinputs (not unreachable notdictvalidatorcase). cache_point_ttl:
  Absent/cache_controlNone orB690 rejectsmodel ->None. Any othercache_control value includingfalse/empty/nondict
  yields cachePoint{type:default}; ignoretypefield. Honor ttl onlydictvalue5m/1h, modelnon-None andB690 is_claude_4_5_on_bedrock;
  otherwiseomit silently. system/content_block wrappershavesamewirecachePoint. Overloadpass declarations are notindependentemptyimplementations.
  top_k: _transform_inference_params pops top_k andoverwrites topK evenifexisting, thenpreserves typed InferenceConfig
  fields. _handle_top_k_value pops topK ifpresent else top_k; bothpresent leaves top_k behind. ChosenNone produces{}.
  Anthropic delegatesB688 sampling gate withoutputkeytop_k; Novabase returns{inferenceConfig:{topK:value}}; allotherfamilies
  drop silently afterpop. parallel_tool_config: Merge eachparallelconfig key: ifbothvalueandexistingadditionalvalue
  aredict, combine generated thenexisting then generatedkeys excepttype. Thus existingtype wins butgenerateddisable_parallel_tool_use
  wins. Othergeneratedvalues replaceexisting. Preserveunrelatedadditionalfields. _drop_tool_choice_type_conflicting_with_tool_config
  removesonly type fromdictadditional.tool_choice, keepingempty dictandsiblingkeys. thinking_budget_with_max_tokens:
  Unless modelcontainsgpt-oss orB600 Nova2, runupdate: B600 minimumclampfirst evenwithoutenabledthinking; B2202
  thinkingdetection plus neithermaxtokenkey inoriginal (presenceincludingNone) allowsdictbudgetnon-None ->maxTokens=budget+DEFAULT_MAX_TOKENS
  envdefault4096 ownedB2202. ExistingoptionalmaxTokens overwritten. ExplicitNone max-tokenkey blocksautoaddition;
  preservefloatbudget arithmetic if supplied. adaptive_thinking_fallback: adaptive thinking onnonadaptive nonGPT/nonDeepSeek
  ->B569 medium budget then capagainst truthymax_completion_tokens-or-max_tokens. Successfulcapassigned; failure
  warns Dropping adaptive `thinking` for model=<model>: max_tokens is too small to fit the minimum thinking budget.
  butdoesnotdelete existingoptional thinking. Otherthinking copiedthen B688 legacytranslation. Keep siblingB577/B576
  samecap/errorliteral wherecalled, with thisdistinctpreexisting-stateoutcome. final_forced_tool_downgrade: After
  allparams, B2202 is_thinking_enabled(optional_params) plus dictool_choice containing any or tool ->info <model>
  does not support forced tool use (tool_choice='required' or specific tool) when reasoning is enabled. Changing
  tool_choice to 'auto'. Replacewholechoice with{auto:{}}. Detectionusesfinaloptions, notoriginal; adaptivealone
  notenabled unlessreasoning_effort exists perB2202. context_management: Listcontextmanagement goesB2201 mapper
  andassignsonlynon-None; dictpassesunchanged includingempty/noedits. Invalidtypes ignored. Do notremove anexistingcontext_managementwhenmapperreturns
  None; B683 filtersitlater.


  Implement crates/betterlite-bedrock/src/converse_params.rs with adjacent tests under converse_params/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_converse_params in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function converse_params_cases in betterlite-bedrock with these exact named cases (one per oracle
  file): inference_config_options, additional_model_fields, service_tier, request_metadata, cache_point_ttl, top_k,
  parallel_tool_config, thinking_budget_with_max_tokens, adaptive_thinking_fallback, final_forced_tool_downgrade,
  context_management. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. Existing API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_converse_params* using HelperCase: kind:
  helper and the externally tagged bedrock_converse_params variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_converse_params that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 287 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 275 production lines, 285 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 700 planned, 700 maximum changed lines.
