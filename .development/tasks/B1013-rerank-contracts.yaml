id: B1013
title: Rerank contracts
description: >-
  Define typed rerank request/result and provider preparation contracts with string/structured documents, original
  indexes and exact decimal scores. Preserve top_n, rank_fields, return_documents and max_chunks_per_doc projection
  through B175, using closed provider capability data.


  Implement crates/betterlite-core/src/api/rerank_contracts.rs, crates/betterlite-openai/src/api/rerank_contracts.rs,
  crates/betterlite-provider/src/api/rerank_contracts.rs. Use RerankContractsInput and RerankContractsResult with
  typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions structured_documents, return_documents, top_n_projection, score_exact_decimal,
  unsupported_rank_fields under api::rerank_contracts::tests. Each named function drives production code and asserts
  its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  The production external-byte decoder is betterlite-openai::api::rerank_contracts::decode_rerank_contracts(bytes:
  &[u8], limits: &WireDecodeLimits), for bounded external JSON bytes into the domain wire records. Place its implementation
  in crates/betterlite-openai/src/api/rerank_contracts.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-openai/fuzz/fuzz_targets/rerank_contracts.rs passes arbitrary bounded bytes to that exact decoder;
  api::rerank_contracts::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  Register HelperCall::RerankContracts in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {rerank_contracts: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/base_llm/rerank/transformation.py: BaseRerankConfig.validate_environment (L22-L30);
  litellm/llms/base_llm/rerank/transformation.py: BaseRerankConfig.transform_rerank_request (L33-L40); litellm/llms/base_llm/rerank/transformation.py:
  BaseRerankConfig.transform_rerank_response (L43-L54); litellm/llms/base_llm/rerank/transformation.py: BaseRerankConfig.get_complete_url
  (L57-L70); litellm/llms/base_llm/rerank/transformation.py: BaseRerankConfig.get_supported_cohere_rerank_params
  (L73-L74); litellm/llms/base_llm/rerank/transformation.py: BaseRerankConfig.map_cohere_rerank_params (L77-L92);
  litellm/llms/base_llm/rerank/transformation.py: BaseRerankConfig.get_error_class (L94-L99); litellm/llms/base_llm/rerank/transformation.py:
  BaseRerankConfig.calculate_rerank_cost (L101-L136); litellm/rerank_api/rerank_utils.py: get_optional_rerank_params
  (L6-L52); litellm/types/rerank.py: RerankResponse.__getitem__ (L88-L89); litellm/types/rerank.py: RerankResponse.get
  (L91-L92); litellm/types/rerank.py: RerankResponse.__contains__ (L94-L95). Abstract/protocol declarations map
  to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 205 owned nonblank/non-comment/non-docstring Python lines (224 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 225 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 60 decoder fuzz/replay, 0 config tests/seeds and
  46 wiring; 551 total within the 560-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B175 (Provider parameter capabilities and mapping), B204 (Typed model price fields
  and exact decimal parsing), B1087 (Api boundaries). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.


  Place wire DTOs and their decoder in the named wire leaf crate; provider contracts depend only on leaf records,
  and core composes them above betterlite-provider. Do not add a wire/provider dependency on betterlite-core to
  share an Input/Result type. Wire decoders accept a local limits value converted by the core boundary from ApiLimits.


  WireDecodeLimits is the leaf record { max_json_bytes: usize, max_event_bytes: usize, max_items: usize }; callers
  convert B1087 limits into it. This record has no dependency on the core crate.
