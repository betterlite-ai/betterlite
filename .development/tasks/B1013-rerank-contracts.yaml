checks:
  optional:
  - mutants
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core -p betterlite-openai -p betterlite-provider --no-tests=fail
      -E 'test(/^api::rerank_contracts::/) - test(/::replays_corpus$/)'
  - id: case-structured-documents
    why: the structured-documents behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_contracts::tests::structured_documents($|::)/)'
  - id: case-return-documents
    why: the return-documents behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_contracts::tests::return_documents($|::)/)'
  - id: case-top-n-projection
    why: the top-n-projection behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_contracts::tests::top_n_projection($|::)/)'
  - id: case-score-exact-decimal
    why: the score-exact-decimal behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_contracts::tests::score_exact_decimal($|::)/)'
  - id: case-unsupported-rank-fields
    why: the unsupported-rank-fields behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_contracts::tests::unsupported_rank_fields($|::)/)'
  - id: deviation-tests
    why: the documented compatibility difference lacks a native assertion
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::rerank_contracts::tests::compatibility_deviations($|::)/)'
  - id: parser-corpus
    why: the named production decoder has no fuzz target/new seed, or its replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/rerank_contracts)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/rerank_contracts.rs && grep -qF "decode_rerank_contracts"
      crates/betterlite-openai/fuzz/fuzz_targets/rerank_contracts.rs && cargo nextest run --locked -p betterlite-openai
      --no-tests=fail -E 'test(/^api::rerank_contracts::tests::replays_corpus$/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/rerank_contracts.py && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/rerank_contracts-*)"
      && grep -qE "^[[:space:]]+rerank_contracts:" tools/oracle/fuzz/corpus/helper_case/rerank_contracts-* && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/rerank-contracts)"
