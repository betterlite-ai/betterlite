id: B1013
title: Rerank records, parameter mapping and query cost
description: >-
  Own BaseRerankConfig, get_optional_rerank_params and all types/rerank.py records/accessors. Put records and
  decode_rerank_contracts(bytes,kind,limits) in betterlite-openai::api::rerank_contracts; provider interfaces,
  option projection and query cost live in betterlite-provider. No provider depends on core for these types.
  Request requires model,query,documents (string or structured objects); top_n,rank_fields,return_documents,
  max_chunks_per_doc,max_tokens_per_doc,instruction,truncate_prompt_tokens,truncation_side,max_tokens_per_query
  default None. truncation_side accepts left/right only. Unknown fields follow Pydantic's ignore behavior.
  RerankResponse defaults id/results/meta=None and private hidden_params={}; results require index and
  relevance_score, document.text when a document is present. Metadata exposes api_version,billed_units
  (search_units,total_tokens) and tokens(input_tokens,output_tokens), with optional/null distinctions.

  get_optional_rerank_params reuses a truthy non_default_params map or a new empty map. Non-None query,top_n,
  documents,return_documents,max_chunks_per_doc,max_tokens_per_doc,instruction overwrite entries in that map.
  rank_fields is only passed separately to map_cohere_rerank_params, not inserted. The helper's return_documents
  default is true even though the request record default is None. Provider capability enforcement belongs to
  concrete configs; no generic unsupported-rank-fields error exists here. Base URL returns api_base or "";
  inherited request transform returns {}, response transform returns the supplied response, and error conversion
  raises B2202 BaseLLMException. Required abstract methods remain mandatory provider dispatch members.

  Query cost is input_cost_per_query*search_units with completion cost zero; missing/null model info price,
  billed_units or search_units gives (0,0). total_tokens is not a substitute. Use B204 Decimal parsing with the
  existing score-range deviation below. Helper rerank_contracts compares finite ordinary values and records
  map-call arguments/mutations, not HTTP. Fuzz request/response JSON with first input byte selecting kind and
  the remainder entering the production decoder; replay malformed records and decimal boundaries. Count 203
  nonblank/non-comment source lines; budget 210 implementation,130 tests,95 cases,90 adapters,65 fuzz and 30
  wiring, 620 lines. Cost computation makes this a security review.
