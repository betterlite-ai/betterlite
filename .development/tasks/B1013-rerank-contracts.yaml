references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/rerank/transformation.py#L20-L136
  why: Own base transform defaults and search-unit cost multiplication.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rerank_api/rerank_utils.py#L6-L52
  why: Parameter projection mutates a nonempty supplied map and forwards rank_fields separately.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/rerank.py#L13-L95
  why: Request/result defaults, required result fields and private hidden metadata/accessors.
dod:
- text: >-
    rerank_wire_records decodes {model:m,query:q,documents:[text,{title:t,body:b}],extra:ignored}: preserve the
    document forms, drop extra and default all nine optional fields to None. Missing model/query/documents
    or truncation_side=middle fails validation. Empty documents and top_n=0 are accepted here. Reply {} becomes
    id/results/meta=None; {results:[{index:2,relevance_score:0.125,document:{text:t}}]} retains order/index/score.
    Missing index or relevance_score fails. Unknown fields are ignored; hidden_params never appears in JSON.
    Item access on an unknown key raises KeyError; get returns its supplied default; contains tests actual
    response fields, so id is present even when None.
  proof: [behavior-tests, oracle, helper-python, parser-corpus]
- text: >-
    rerank_option_projection supplies nondefault={query:old,top_n:9,extension:yes},query=q,documents=[a,b],
    top_n=0,return_documents=false,max_chunks_per_doc=0,max_tokens_per_doc=3,instruction="",rank_fields=[body].
    Mapper sees the overwritten named values and extension=yes; the original nonempty map is mutated identically.
    rank_fields is a separate argument and absent from that map unless it was already there. Empty original
    map is not mutated because the helper allocates another. Omitted return_documents supplies true; explicit
    None is passed but not inserted. Non-None zero/false/empty values are never dropped.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    rerank_base_defaults checks URL None/""/https://mock as ""/""/https://mock, request transform={} and response
    transform identity. Error message="slow",status=429,headers={retry-after:2} raises BaseLLMException with
    those values and no fabricated proxy tuple. Mapper signatures default drop_params=false where supplied
    by callers and return_documents=true; actual unsupported parameter behavior belongs to each provider.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    rerank_query_cost uses price=0.125,search_units=3 and expects prompt=0.375,completion=0. Missing model_info,
    price key,null price,billed_units or search_units each gives (0,0),even with total_tokens=99. Zero units
    gives zero; -1 units gives -0.125 without clamping. Native decimal computation preserves exact values.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    compatibility_deviations parses relevance_score=1e100 and expects native 502,bad_gateway,param=score,
    code=decimal_out_of_range rather than rounding a finite float. Non-finite NaN/Infinity cannot enter the
    native Decimal score and use the same explicit range error; the source float record can hold them.
    Ordinary 0.125 and -0.5 are retained exactly. The parser corpus includes these boundaries.
  proof: [deviation-tests, parser-corpus]
- text: New rerank_contracts helper/parser seeds compare the base records and transforms independently.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Wire defaults, map mutations and query-cost fallbacks each require production assertions.
    run: cargo nextest run --locked -p betterlite-openai -p betterlite-provider --no-tests=fail -E 'test(/^api::rerank_contracts::/) - test(/::replays_corpus$/)'
  - id: deviation-tests
    why: Decimal range rejection must not masquerade as float parity.
    run: cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::rerank_contracts::tests::compatibility_deviations($|::)/)'
  - id: helper-python
    why: The base contract adapter must use pinned records and methods.
    run: test -f tools/oracle/helpers/rerank_contracts.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: parser-corpus
    why: Untrusted rerank JSON must reach its bounded production decoder under fuzz/replay.
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/rerank_contracts.rs && grep -qF decode_rerank_contracts crates/betterlite-openai/fuzz/fuzz_targets/rerank_contracts.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/rerank_contracts)" && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^api::rerank_contracts::tests::replays_corpus$/)'
  - id: helper-corpus
    why: The helper operation needs a newly added rerank_contracts seed.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/rerank_contracts-*)" && grep -qE '^[[:space:]]+rerank_contracts:' tools/oracle/fuzz/corpus/helper_case/rerank_contracts-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: Base rerank behavior cannot be inferred from a provider success fixture.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/rerank-contracts)"
oracle_cases:
- tools/oracle/cases/helpers/rerank-contracts/rerank-wire-records.yaml
- tools/oracle/cases/helpers/rerank-contracts/rerank-option-projection.yaml
- tools/oracle/cases/helpers/rerank-contracts/rerank-base-defaults.yaml
- tools/oracle/cases/helpers/rerank-contracts/rerank-query-cost.yaml
deviations:
- what: Scores outside exact rust_decimal representation, including non-finite values, fail with native HTTP 502,type=bad_gateway,param=score,code=decimal_out_of_range; LiteLLM's float model can represent finite 1e100 and non-finite scores.
  why: Preserve the current exact-number boundary and no-floats rule instead of rounding provider scores.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/rerank.py#L77-L95
out_of_scope:
- B2202 owns BaseLLMException; B204 exact decimal parsing; B1079/B1014 SDK dispatch; B085 route registration. Every function in the three covered files is assigned here.
pitfalls:
- 'The oracle helper for this task is pre-registered as rerank_contracts in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/rerank_contracts.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/rerank_contracts.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A nonempty non_default_params mapping is mutated, but an empty one is replaced; tests must observe the caller's map too.
- rank_fields is not added to non_default_params by this helper.
- Query cost ignores total_tokens and charges only search_units, including zero or negative supplied counts.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 1
