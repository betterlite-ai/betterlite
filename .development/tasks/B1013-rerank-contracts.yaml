deviations:
- what: Finite scores outside exact rust_decimal representation fail with HTTP 502, type bad_gateway, param score,
    code decimal_out_of_range rather than rounding.
  why: Reuse B204's exact-number boundary and the no-floats rule.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/rerank/transformation.py#L1-L136
out_of_scope:
- Provider-specific execution belongs to the provider part ids in the dependencies; this slice consumes their prepared
  operations. Python package export/event-loop facades remain B158-B161.
- Actual HTTP auth/route registration is owned by the route callers listed in this API family; pure helper cases
  never stand in for those HTTP comparisons.
pitfalls:
- Within BaseRerankConfig.calculate_rerank_cost\'s search_units is None branch, preserve return (0.0, 0.0) and its
  nested guards.
- BaseRerankConfig.calculate_rerank_cost uses billed_units.get('search_units'); retain its missing-value behavior
  and field spelling in the typed projection.
