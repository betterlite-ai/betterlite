    - id: pdf-behavior
      why: PDF extraction does not match the fallback and error handling
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::pdf_/)'
    - id: chunk-validation-tests
      why: Chunk configuration validation errors are missing or incomplete
      run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^rag::document::tests::chunk_config_/)'
