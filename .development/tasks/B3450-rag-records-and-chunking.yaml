deviations:
  - what: >-
      betterlite hardcodes the three chunk configuration defaults (chunk_size=1000, chunk_overlap=200,
      max_recurse_depth=100). LiteLLM reads these from environment variables at module load time
      (DEFAULT_CHUNK_SIZE, DEFAULT_CHUNK_OVERLAP, DEFAULT_MAX_RECURSE_DEPTH), making them runtime-overridable.
      betterlite treats them as build-time constants.
    why: >-
      Environment variable reads in the gateway are restricted to the config crate boundary,
      so chunk defaults come from the config file or built-in constants, never from the process environment.

  - what: >-
      When chunk_size<=0, chunk_overlap<0, or chunk_overlap>=chunk_size, the splitter raises a typed
      chunk-configuration error before splitting. LiteLLM's _force_split can hang or fail to progress
      when overlap is at least size, or when size is zero. betterlite rejects nonprogressing input upfront.
    why: >-
      The native splitter prevents a customer request from hanging the gateway thread. Invalid configurations
      fail at request validation time with a typed error, not inside the pipeline as a fallback.

  - what: >-
      PDF extraction returns None on library ImportError or extraction failure. LiteLLM logs at debug level
      and continues with None; betterlite calls the same fallback and None return without logging at this level.
    why: >-
      The ingestion pipeline decides whether a missing PDF library is recoverable (OCR can fill in) or a
      pipeline failure. Betterlite surfaces None and lets the caller's logging layer report it.

out_of_scope:
  - RAGIngestRequest, RAGRetrievalConfig, RAGRerankConfig, RAGQueryRequest, RAGQueryResponse wire models.
    Routes parse request dictionaries directly. The outline excludes these unused type model validators.
  - Chunking configuration defaults loaded from a config file (B1385 declares separate chunk defaults for
    Vertex GCS import; those are independent).
  - Provider constructor calls and their initialization state. B3460 and the provider subtasks own those.
  - The helper functions aingest, aquery, ingest, query, _execute_ingest_pipeline, _execute_query_pipeline,
    and _suppressed_sub_call_billing from litellm/rag/main.py are owned by B3460.

pitfalls:
  - The architect adds `pub mod rag;` to crates/betterlite-core/src/lib.rs and crates/betterlite-config/src/lib.rs before this task runs, since module tasks never edit lib.rs themselves.
  - Register helper operation `document_parsing` in the `document_parsing` group before this task runs by adding it to tools/oracle/src/helpers/mod.rs GROUPS and tools/oracle/helpers/b3450.py OPERATIONS.
  - "Character counting is per Unicode character (len() in Python), not byte length or grapheme clusters."
  - "The _merge_splits overlap window includes separator length in current_length, which is unusual: separator
    length is added when a chunk is assembled, then subtracted when popping from the window during overlap."
  - "Overlap at chunk_size or greater means _force_split makes no progress and produces an infinite loop in
    the pin; betterlite validates input before splitting."
  - "RAG types list SecretString fields for all credentials: api_key, aws_secret_access_key, aws_session_token,
    aws_web_identity_token, aws_sts_endpoint, aws_external_id. These must not appear in logs or Debug output."
  - "The PDF extraction fallback order is pypdf first, then PyPDF2, then None. Both may be missing; the code
    tries each and logs only at debug level on ImportError."
  - "Add a cargo-fuzz target for extract_text_from_pdf's byte input in crates/betterlite-core/fuzz/fuzz_targets/pdf_extraction.rs,
    seeding the corpus with malformed and valid PDFs, and a test named replays_the_pdf_extraction_corpus replays
    it on stable."

