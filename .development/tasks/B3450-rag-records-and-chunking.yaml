id: B3450
title: RAG records, provider selection and document chunking
description: >-
  Build live RAG ingestion type definitions and provider selection logic in a lower document module,
  plus recursive character splitting and PDF extraction. Preserve Unicode character counting,
  separator selection, overlap/whitespace behavior, and the PDF extraction fallback behavior
  (returns None on missing libraries or error, logging at debug level on ImportError).

  Wire types for the ingestion pipeline: RAGChunkingStrategy (chunk_size, chunk_overlap, separators),
  RAGIngestOCROptions, RAGIngestEmbeddingOptions, provider-specific options for OpenAI
  (custom_llm_provider=openai, vector_store_id, ttl_days, litellm_credential_name, api_key: SecretString,
  api_base), Bedrock (custom_llm_provider=bedrock, vector_store_id, s3_bucket, s3_prefix, embedding_model,
  data_source_id, wait_for_ingestion, ingestion_timeout, litellm_credential_name, aws_access_key_id: SecretString,
  aws_secret_access_key: SecretString, aws_session_token: SecretString, aws_region_name, aws_role_name,
  aws_session_name, aws_profile_name, aws_web_identity_token: SecretString, aws_sts_endpoint: SecretString,
  aws_external_id: SecretString), Vertex AI (custom_llm_provider=vertex_ai, vector_store_id, vertex_project, vertex_location,
  vertex_credentials, gcs_bucket, wait_for_import, import_timeout), and S3 Vectors
  (custom_llm_provider=s3_vectors, vector_bucket_name, index_name, dimension, distance_metric,
  non_filterable_metadata_keys, litellm_credential_name, aws_access_key_id: SecretString,
  aws_secret_access_key: SecretString, aws_session_token: SecretString, aws_region_name, aws_role_name,
  aws_session_name, aws_profile_name, aws_web_identity_token: SecretString, aws_sts_endpoint: SecretString, aws_external_id: SecretString).
  Union them into RAGIngestVectorStoreOptions and bundle with OCR/embedding/chunking into RAGIngestOptions.
  Include result types: RAGIngestResponse with id, status (completed/in_progress/failed), vector_store_id,
  file_id, error.

  Provider selection through INGESTION_REGISTRY dict mapping provider names to ingestion classes and
  get_ingestion_class(provider) which raises ValueError with supported-provider list on mismatch.
  Five providers: openai, bedrock, gemini, s3_vectors, vertex_ai. Selection returns the provider identity;
  construction stays in B3460.

  Recursive character splitting: RecursiveCharacterTextSplitter with chunk_size (default 1000),
  chunk_overlap (default 200), separators list (default ["\n\n", "\n", " ", ""]). The split_text method
  and _split_text recursion with depth-bounded fallback at max_recurse_depth=100. Preserve exact
  overlap/merge behavior including separator length in current_length accounting. Character-by-character
  Unicode counting, no encoding assumptions. The _merge_splits method reassembles with overlap window sliding.
  _force_split handles characters when no separator matches, respecting overlap in the stride calculation.

  PDF extraction: extract_text_from_pdf(file_content: bytes) returns text or None. Tries pypdf first, falls
  back to PyPDF2. Preserves page-by-page extraction joined with "\n\n", exact logging with character count,
  and logs at debug level on ImportError or extraction failure. Returns None when libraries are missing or
  extraction fails, no exception escape.

  All imports and declarations in litellm/types/rag.py:14-225, litellm/rag/main.py imports, the
  INGESTION_REGISTRY and get_ingestion_class functions, and complete file declarations in the splitter and
  PDF modules including __init__.py exports.

  These three defaults (chunk_size=1000, chunk_overlap=200, max_recurse_depth=100) are hardcoded as
  constants in betterlite; environment variables (DEFAULT_CHUNK_SIZE, DEFAULT_CHUNK_OVERLAP,
  DEFAULT_MAX_RECURSE_DEPTH) are not read at runtime.

