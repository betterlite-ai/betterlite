dod:
  - text: LoopbackServer listens on 127.0.0.1 with OS-assigned port and exposes redirect_uri property returning http://127.0.0.1:<port>/callback.
    proof: [loopback-server]
  - text: Callback GET handler validates state before checking error or code, rejects 404 (non-callback paths) and 400 (state mismatch), settles CallbackCode or CallbackDenied only on state match.
    proof: [callback-validation]
  - text: discover_cli_auth fetches /.well-known/litellm-cli-auth, validates CliAuthContract Pydantic model, checks S256 in code_challenge_methods_supported, validates issuer and origin equivalence, and rejects endpoints outside the origin.
    proof: [discovery-validation]
  - text: Client registration sends JSON POST with client_name, redirect_uris tuple, grant_types, response_types and token_endpoint_auth_method="none", rejects redirects (307/308).
    proof: [client-registration]
  - text: PKCE pair generates 64-byte URL-safe verifier and S256 challenge (sha256 digest, base64url-encoded without padding).
    proof: [pkce-generation]
  - text: Code redemption and refresh send form-encoded POST with code/code_verifier or refresh_token, enforce 15-second timeout and reject redirects before checking status 200.
    proof: [token-requests]
  - text: Revocation responses distinguish permanent failure (status !=200 except 503) as PkceFailure, transient server error (status 503) as RevocationUnavailable.
    proof: [revocation-503]
  - text: Token responses parse as _TokenResponse with expires_in field; PkceCredential captures expires_at=now()+expires_in.
    proof: [token-expiry]
  - text: Error detail extraction tries error_description, then error, then detail, then full response body (200 char limit) from JSON response.
    proof: [error-detail]
  - text: All HTTP operations (discovery, registration, token, revocation) timeout at 15 seconds and propagate requests.RequestException to PkceFailure.
    proof: [http-timeout]
  - text: Origin normalization (scheme, hostname, explicit port) makes https://example.com and https://example.com:443 compare equal.
    proof: [origin-normalization]
checks:
  optional: []
  commands:
    - id: loopback-server
      why: LoopbackServer is not correctly implemented or does not expose redirect_uri property
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::loopback/)'
    - id: callback-validation
      why: callback handler does not validate state before error/code or does not settle outcome correctly
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::callback/)'
    - id: discovery-validation
      why: discovery does not validate contract format, S256 support or origin/issuer equivalence
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::discover/)'
    - id: client-registration
      why: client registration does not send correct JSON or does not reject redirects
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::register/)'
    - id: pkce-generation
      why: PKCE pair does not generate verifier and S256 challenge correctly
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::pkce_pair/)'
    - id: token-requests
      why: token request does not use form encoding, timeout or rejects redirects
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::token/)'
    - id: revocation-503
      why: revocation response 503 is not distinguished as RevocationUnavailable
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::revoke/)'
    - id: token-expiry
      why: token response does not capture expires_at correctly or expires_in is not validated positive
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::expires/)'
    - id: error-detail
      why: error detail does not extract from error_description, error or detail fields
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::error/)'
    - id: http-timeout
      why: HTTP operations do not timeout at 15 seconds or do not propagate RequestException
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::http/)'
    - id: origin-normalization
      why: origin normalization does not make scheme://host:port explicit or compare ports correctly
      run: cargo nextest run --locked -p betterlite-cli --no-tests=fail -E 'test(/^pkce_login::tests::origin/)'
oracle_cases: []
deviations: []
out_of_scope:
  - CliTokenData TypedDict definition (auth.py); imported under TYPE_CHECKING only as a forward reference.
  - Browser opening via webbrowser.open; accepted as an injected callable.
  - Terminal output via print; accepted as an injected callable.
  - Management client HTTP implementation; Http is a Protocol and the real requests client is injected.
  - Token storage, keyring and local credential retrieval; handled by B4574 and B4575.
  - CLI installation and invocation from the root command tree; B4585 handles registration and dispatch.
pitfalls:
  - LoopbackServer sets self.timeout=1 in __init__ so handle_request does not block forever; connection_timeout_seconds sets per-connection socket timeout separately.
  - _origin normalizes explicit ports (port or 443/80 default) so https://example.com and https://example.com:443 compare equal via _canonical_url.
  - _refused_redirect must be checked before status code on every POST, because 307/308 would otherwise bypass the check and be treated as success.
  - State validation must come before error or code checks in callback handler, so a stray callback with an error parameter does not settle the wrong outcome.
  - Revocation endpoint returns 200 on success even for already-revoked tokens; 503 is a transient server error (revocation unavailable right now), not permanent failure.
  - _TOKEN_RESPONSE and _ERROR_BODY TypeAdapters validate Pydantic schemas on response.json(), so KeyError or ValidationError become PkceFailure.
