id: B4573
title: CLI PKCE discovery, loopback callback and token exchange
description: >-
  Build PKCE protocol primitives and the bounded loopback callback server for betterlite-management-cli.
  Implement OAuth 2.1 authorization code flow with PKCE S256 against the proxy's own authorization server
  (discovered at /.well-known/litellm-cli-auth), using a public client on a loopback redirect and registering
  the CLI with the proxy's registration endpoint. Validate issuer and origin against the base URL (RFC 8414
  section 3.3), reject endpoints outside the origin, verify S256 support and verify the contract structure.
  Client registration sends JSON with client_name, redirect_uris, grant_types, response_types and
  token_endpoint_auth_method=none; POST requests reject redirects (307/308). The module provides PKCE pair
  generation (64-byte verifier, S256 challenge), authorization URL construction, code-to-token redemption,
  token refresh and revocation. Loopback callback server listens on 127.0.0.1:0, validates state (rejecting
  stray requests and path mismatches with 400), settles only on state match with code or error, and times out
  connections after 5 seconds. All HTTP operations timeout at 15 seconds. Token responses parse as Pydantic
  models with access_token, expires_in, refresh_token, user_id and team_id fields; PkceCredential captures
  expires_at=now()+expires_in. Revocation failures distinguish permanent (PkceFailure on status !=200 except
  503) from transient (RevocationUnavailable on 503). Error details extract from response JSON: first
  error_description, then error, then detail, or full body (200 char limit) as fallback. Transport, entropy,
  clock, browser opener and loopback infrastructure are injected for testability. The module owns shared
  outcome and credential records (PkceFailure, RevocationUnavailable, PkceCredential, CallbackCode,
  CallbackDenied); B4574 uses them for renewal/revocation coordination and B4575 matches PkceFailure and
  RevocationUnavailable on logout.
