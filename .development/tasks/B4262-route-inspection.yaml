deviations: []
out_of_scope:
- >-
  verbose_logger is LiteLLM's module-level logger instance; betterlite accepts
  a logger injected through the function interface or uses the default tracing infrastructure,
  following the dependency injection pattern, so logging behavior is testable.
- >-
  The eventual proxy_server.get_routes route (litellm/proxy/proxy_server.py:19900-19921) that
  calls these helpers remains unassigned and must be registered only by its eventual route owner.
  These helpers do not call route handlers.
pitfalls:
- 'The oracle helper for this task is pre-registered as b4262 in the server group. Replace the stub Op in tools/oracle/src/helpers/server/b4262.rs with an impl Helper, and write run in tools/oracle/helpers/b4262.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- 'Mount prefix joining: mount_path.rstrip("/") + sub_route_path produces the correct result. An empty mount_path gives just sub_route_path. A mount_path like /v1/ with sub_route_path /models produces /v1/models, not /v1//models.'
- 'Missing-method fallback to ["GET", "POST"] applies only to sub-routes; regular routes inherit their methods from the BaseRoute as-is (may be None).'
- 'The endpoint attribute check in get_routes_for_mounted_app: if route.endpoint is None but route.app (a nested app) exists, that route still counts and passes through _mounted_sub_route_info.'
- '_safe_get_endpoint_name returns None on exception, not a fallback like "unknown". The verbose_logger.exception call provides the context for debugging.'
- 'The RouteInfo dict retains None values; all fields are present except the optional mounted_app, which is only added for mounted routes.'
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
