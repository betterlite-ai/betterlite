id: B8992
title: Native Google A2A and MCP guardrail HTTP parity
description: >-
  Add the native-protocol HTTP evidence B1391, B6163 and B3818 deferred to B3680,
  whose own case list omits it. This is approximately 750 lines of oracle fixtures,
  not another translation implementation. The proxy must select the existing
  concrete translation and live generic_guardrail_api class through normal config.
  Use a master key and mock upstream credentials, with api_base on the configured
  guardrail and the native endpoint's existing model/agent/MCP server setup. The
  scanner is the real B3771 HTTP integration; mock only its remote replies and the
  remote provider. Compare its captured inputs and the final provider request or
  client response so merely obtaining a 200 cannot satisfy these cases.

  Google calls POST /v1beta/models/{model_name}:generateContent and
  /models/{model_name}:generateContent, plus the corresponding
  /v1beta/models/{model_name}:streamGenerateContent and
  /models/{model_name}:streamGenerateContent. A request case mixes systemInstruction
  and contents text with an inline image; assert that system text precedes content
  text and only text locations change. A post-call case returns multiple candidates
  and rewrites each candidate in order. A second response returns the wrong number
  of replacement texts and must remain unchanged. A streaming case returns a
  replacement for combined text but the original native frames must reach the
  client: this handler detects and blocks streams but intentionally ignores rewrites.
  A distinct streaming block case proves raw frames actually reached the scanner.
  Keep native SSE framing and its lack of an OpenAI [DONE] marker; inspect the final
  in-stream failure rather than assuming that a late block changes HTTP 200 to 400.

  A2A uses POST /a2a/{agent_id}, /a2a/{agent_id}/message/send and
  /v1/a2a/{agent_id}/message/send. Reuse B8648's configured-agent fixture and JSON-RPC
  message/send body. One request case scans only nonempty kind:text parts, preserving
  file/data parts, message ids and context ids. A result case returns a valid task
  with status.message and multiple artifacts, then rewrites every collected text
  while keeping the JSON-RPC envelope. A wrong-length scanner reply leaves those
  parts unchanged. Exercise all three route aliases across these cases. For a
  message/stream request return valid agent task updates split across text chunks;
  the guardrail receives their concatenation without a separator, places a rewrite
  in the first text chunk and clears subsequent text parts, with original ids and
  nontext fields intact. Use the existing A2A transport framing rather than a chat
  completion envelope. Add a pre-call block and verify no message reached the agent.

  Google and A2A use mode pre_call for input and post_call for output cases; use
  default_on true on each fixture's guardrail so endpoint-specific request metadata
  cannot accidentally omit it. MCP uses pre_mcp_call for discovery and post_mcp_call
  for tool output. MCP calls GET /mcp-rest/tools/list and POST /mcp-rest/tools/call; these routes have
  no /v1 alias. Use B8626's HTTP MCP fixture and the declared remote tool's name,
  description and schema; scripted initialize/list/call replies must be real MCP
  protocol replies. A discovery case rewrites tool and nested schema descriptions
  and leaves schema names/types intact. A call result case rewrites both content
  text blocks and string leaves of structuredContent in one scan. A result-label
  case asks the scanner to change a structuredContent object key or numeric label
  and must fail closed with 400 rather than changing the contract. A wrong-length
  reply also fails with 400. Do not duplicate B105's MCP argument-masking case:
  these cases cover discovery and output projection, which that case does not.

  List and compare content-type, status, error type/param/code, and complete JSON
  or SSE payloads, plus upstream method/path/body and auth. Normalize only the
  endpoint's documented generated ids and timing fields. Multi-step alias cases
  may share one config; each step keeps its own expected upstream sequence. The
  ordinary oracle gate runs all cases against betterlite and the pinned proxy;
  --self-check may diagnose a fixture but cannot prove this task. No test imports
  FastAPI route functions or replaces ProxyLogging with a fake. The existing
  route owners retain all mounts, and existing decoders retain fuzz ownership.
