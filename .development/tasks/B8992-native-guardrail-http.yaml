dod:
  - text: Native Google requests and candidates are rewritten positionally, mismatched counts are ignored, and streamed rewrites are ignored while blocks propagate.
    proof: [oracle]
  - text: Every A2A invocation alias reaches the guardrail, task-result locations are preserved, and a stream rewrite is delivered without duplicate text.
    proof: [oracle]
  - text: MCP discovery and output scans run through the mounted REST surface, with both structured and textual output covered and invalid writebacks rejected.
    proof: [oracle]
