id: B1064
title: Vector-store SDK create and search
description: >-
  Build the complete create/acreate and search/asearch functions and their three local helpers from
  vector_stores/main.py:46-491 in core::api::vector_store_search. Resolve provider names with B174 and configs with B010,
  optional fields with B1058, embedding execution with B1059 and search registry credentials with B1062.
  Call B2484 search or B2485 create transport; B011 maps exceptions and B012 owns client logging.
  SDK calls run through B2401 VectorStoreSearchCreate against a mock provider, including both execution
  modes and request-context preservation. Pure mock constructors and executor validation use native tests.
  REQUEST_TIMEOUT is B002's float seconds setting, default 6000. Timeout null or 0 uses that value.
  All optional arguments default null, including provider; only null provider becomes openai. Search's
  max_num_results is null despite the docstring saying 10; no local 1-50 validation occurs.

  Keep executor validation before the search try block and before mock selection. The private
  _direct_vector_store_embedding_executor argument is removed from kwargs and log locals. A supplied
  executor wins; otherwise B1059 receives router and B1058 request metadata. SDK wrappers share preparation
  but preserve create's missing registry lookup and search's lookup order. The owned 368 physical
  nonblank/non-comment lines reduce to 280 Rust lines, 190 tests, 95 adapters, 130 cases and 70 config/wiring,
  765 total. This task adds no decoder; extend the existing config and SDK case corpora.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/vector_store_search.rs
  - crates/betterlite-core/src/api/vector_store_search/**
  - crates/betterlite-config/src/api.rs
  - crates/betterlite-config/src/api/vector_store_search.rs
  - crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-search-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/vector_store_search_create.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/vector_store_search_create.py
  - tools/oracle/cases/sdk-http/vector-store-search-create/**
  - tools/oracle/fuzz/corpus/sdk_http_case/vector-store-search-create-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/vector_stores/main.py#L46-L491
  why: Complete SDK functions establish mock truthiness, registry overlay and executor error ordering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L576-L576
  why: REQUEST_TIMEOUT is parsed as float and defaults to 6000 seconds.
dod:
- text: >-
    create_optional_fields sends name=notes,file_ids=[file_a],expires_after={anchor:last_active_at,days:7},
    chunking_strategy={type:auto},metadata={tag:x},extra_query={ignored:yes},extra_body={name:other}.
    Both modes POST /v1/vector_stores with the five declared fields and no ignored query or body override.
    Empty input emits all five null fields through B527. Mock {id:vs_a,object:vector_store} is returned.
    Logging model=null, optional name plus selected fields and litellm_call_id=null precedes transport.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    search_optional_fields sends id=vs_a,query=[one,two],filters={type:eq,key:tag,value:x},max_num_results=0,
    ranking_options={ranker:auto},rewrite_query=false. Expect those fields unchanged at POST
    /v1/vector_stores/vs_a/search. Absent optionals are omitted, including max_num_results; 51 is also
    forwarded. extra_query={ignored:yes} is dropped; extra_body={query:override} wins at the OpenAI
    transform. Log model=api_type (null for openai), id/query/selected fields and non-null GenericLiteLLMParams.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    registry_overlays_search_credentials gives caller key sk-client and registry {api_key:sk-registry};
    upstream gets Bearer sk-registry. Registry exception is silently ignored and caller key remains;
    registry=null skips lookup. Create never looks up credentials. An invalid executor object fails with
    TypeError, message "Invalid direct vector store embedding executor", before registry, mocks or HTTP.
    A valid injected executor receives metadata and is not serialized into logs or provider data.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    vector_mock_truthiness supplies search mock_response="yes" and expects object=vector_store.search_results.page,
    search_query="sample query",data=[{score:0.95,content:[{text:"This is a sample search result from the vector store.",type:text}]}]
    with no HTTP. A nonempty list replaces data exactly. Empty list/string and dict do not activate search
    mocking. Create mocks only a nonempty dict, returned unchanged; empty dict proceeds to HTTP. Native
    constructor defaults produce vs_mock123,vector_store,1699061776,"Mock Vector Store",bytes=0,status=completed,
    five zero file_counts and null expires_after/expires_at/last_active_at/metadata; direct search helper [] stays [].
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    vector_provider_resolution tests null->openai, empty string and unknown provider enum failures, and
    vertex_ai/rag_api resolving api_type=rag_api via B010. For a known provider with no vector config,
    create/search fail before HTTP with source ValueError "Vector store create is not supported for anthropic"
    or "Vector store search is not supported for anthropic", mapped by B011 to APIConnectionError status=500,
    type/param/code=null. Mock provider 404 becomes NotFoundError status=404,type/param/code=null. Record
    source messages; betterlite wording is ignored under the README error decision. Async flags only activate
    for true, never 1 or a truthy string; supplied clients and context reach the selected transport.
  proof: [behavior-tests, oracle, python-adapter]
- text: >-
    loads_search_timeout loads REQUEST_TIMEOUT unset->6000,"7.5"->7.5 and invalid "bad"->config error.
    Calls with timeout null/0 use loaded value, explicit 3 uses 3. New config and SDK seeds replay successfully.
  proof: [config-tests, config-corpus, sdk-corpus, behavior-tests]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: SDK create/search fails to preserve the distinct option, credential or mock branches
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::vector_store_search::tests::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: the timeout is not loaded with the source default and numeric validation
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::vector_store_search::tests::loads_search_timeout($|::)/)'
  - id: python-adapter
    why: SDK create/search does not execute the independent pinned implementation
    run: test -f tools/oracle/sdk_http/vector_store_search_create.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: config-corpus
    why: the timeout setting lacks newly committed loader input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/vector-store-search-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: sdk-corpus
    why: the new SDK operation has no parser regression input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/vector-store-search-create-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/sdk-http/vector-store-search-create/create-optional-fields.yaml
- tools/oracle/cases/sdk-http/vector-store-search-create/search-optional-fields.yaml
- tools/oracle/cases/sdk-http/vector-store-search-create/registry-overlays-search-credentials.yaml
- tools/oracle/cases/sdk-http/vector-store-search-create/vector-mock-truthiness.yaml
- tools/oracle/cases/sdk-http/vector-store-search-create/vector-provider-resolution.yaml
deviations: []
out_of_scope:
- B1065 owns retrieve/list; B1066 update/delete. B1058 filters options, B1059 prepares embeddings and B1062 owns registry lookup.
- B2484 owns search execution and B2485 create transport; provider transformations stay B527 or the selected provider config supplied through B010.
- B158-B161 own Python package facades. No routes are registered here.
pitfalls:
- An empty mock list sends a real search request, whereas the pure mock constructor accepts an empty result list.
- Search reads registry credentials after executor preparation, so registry metadata cannot retroactively alter that executor.
- The slash in vertex_ai/rag_api selects api_type; it is not part of the LlmProviders enum value.
review_level: security
budget:
  max_changed_lines: 790
  max_new_expects: 0
