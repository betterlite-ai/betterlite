id: B2221
title: Shared model capability predicates
description: >-
  Lower shared boolean/string capability resolution below provider parameter gates. The helper deliberately calls
  B2219 model metadata rather than the full get_model_info parameter-query wrapper, avoiding recursion. Use exact
  boolean identity where the source does, not truthiness.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/utils.py: _supports_provider_info_factory
  L2781-L2790; _supports_factory L2793-L2852; declared_value_factory L2855-L2892; is_explicitly_disabled_factory
  L2895-L2938; supports_system_messages L2601-L2619; supports_native_streaming L2664-L2695; supports_response_schema
  L2698-L2739; supports_parallel_function_calling L2742-L2750; supports_function_calling L2753-L2771; supports_tool_choice
  L2774-L2778; supports_prompt_caching L2956-L2974; supports_reasoning L3041-L3045; supports_none_reasoning_effort
  L3054-L3058; supports_mid_conversation_system L3061-L3067; supports_native_structured_output L3070-L3078.


  Named case contracts: supports_resolution: First use B209 declared_authenticating_provider; when declared, remove
  exactly that provider prefix and retain that provider without an authentication flow. Otherwise call B174 get_llm_provider.
  Resolve B2219 metadata: key is True returns True; any non-None other value (including False/0/string) returns
  False and blocks fallback. Only None checks the bare B2217 cost key for exact True, then B2220 provider info for
  exact True. The provider helper returns True or None, never False. supports_error_fallback: Any exception inside
  resolution/debugged lookup logs Model not found or error in checking {key} support. You passed model={model},
  custom_llm_provider={provider}. Error: {error}, then tries provider-info fallback once more. Exceptions from this
  fallback outside the catch propagate; do not swallow them recursively. declared_string_value: Always call B174
  resolution, without the declared-auth fast path. Return an actual string metadata value including empty string.
  Otherwise try the resolved bare cost key only when its entry is a dict, accepting actual string including empty.
  Any exception logs Model not found or error in reading {key}. You passed model={model}, custom_llm_provider={provider}.
  Error: {error} and returns None; no provider-info fallback. explicit_disabled: Use the declared-auth fast path
  or B174 resolution then B2219. Return True only when value is False. Only a None value consults the bare entry
  for value is False; other values return False. Any exception logs Model not found or error in checking {key} disabled
  state. You passed model={model}, custom_llm_provider={provider}. Error: {error} and returns False. Unknown models
  are not implicitly disabled. named_capability_wrappers: supports_system_messages, supports_parallel_function_calling,
  supports_function_calling, supports_tool_choice, supports_prompt_caching, supports_reasoning, supports_none_reasoning_effort,
  supports_mid_conversation_system and supports_native_structured_output delegate the shared factory with their
  identical literal key. Preserve the same explicit-False, bare-entry and provider-fallback behavior for each named
  row. native_streaming_default: supports_native_streaming resolves B174 then B2219; missing or None supports_native_streaming
  becomes True, while any other value is returned unchanged rather than coerced to bool. An exception logs Model
  not found or error in checking supports_native_streaming support. You passed model={model}, custom_llm_provider={provider}.
  Error: {error} and returns False; it has no bare-entry/provider-info fallback. response_schema_provider_override:
  Resolve B174 first, catching resolution failures with the response schema support debug message and returning
  False. Providers predibase, fireworks_ai, lm_studio, nebius and databricks return True without a catalog flag.
  Other providers call the shared factory using literal supports_response_schema, including its own provider-resolution
  path; later exceptions follow that factory contract.


  Implement crates/betterlite-models/src/model_capability_predicates.rs with adjacent tests under model_capability_predicates/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function model_capability_predicates_cases in betterlite-models with these exact named cases (one
  per oracle file): supports_resolution, supports_error_fallback, declared_string_value, explicit_disabled, named_capability_wrappers,
  native_streaming_default, response_schema_provider_override. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/model_capability_predicates* using HelperCase:
  kind: helper and the externally tagged model_capability_predicates variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_model_capability_predicates that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 282 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 285 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 690 planned, 700 maximum changed lines.
