id: B4838
title: Confine Deep Agents filesystem and shell operations to its sandbox
description: >-
  Implement SandboxBackend and related helpers in Rust to serve the deepagents
  SandboxBackendProtocol. The agent sees virtual paths rooted at the sandbox workdir;
  file bytes move through Sandbox.read/write, and ls/glob/grep/delete/execute run plain
  POSIX commands through Sandbox.run so the same code serves local and Docker sandboxes.

  Build the protocol types (LsResult, ReadResult, WriteResult, EditResult, DeleteResult,
  GlobResult, GrepResult, GrepMatch, ExecuteResponse, FileInfo, FileData, FileUploadResponse,
  FileDownloadResponse) and utility functions (compile_grep_include_glob for glob matching,
  perform_string_replacement with occurrence counting, slice_read_response for offset/limit,
  InvalidGlobPatternError exception type) in Rust, replacing the deepagents imports.

  Preserve symlink confinement so links to ~/.aws/credentials do not leak host secrets even
  in read-only mode (resolve realpath and reject anything outside workdir). Binary files
  are read as base64 with UTF-8fallback for text. CRLF normalizes to LF on write and edit.
  Read-only sessions refuse write/edit/delete with error. Execute-disabled sessions return
  error without running. Sync bridge rejects calls from the same event loop thread.
  Filesystem operations timeout at 60s; execute at 120s. Output truncates at 100,000 bytes.
  Exit codes: 3 for missing path, 4 for non-directory, 124 for timeout.
scope:
  paths:
    - crates/betterlite-deepagents-harness/**
    - Cargo.toml
  lint_tables: false
