id: B2214
title: Shared provider message and iterator primitives
description: >-
  Provide the small shared message/response-format and iterator initialization primitives below provider leaves.
  Provider composition depends on this task, never the reverse; these functions work on parsed records and stream
  handles without transport or response decoding.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/types/utils.py: _generate_id
  L122-L123; is_custom_tool_call_dict L1329-L1330; chat_completion_tool_call_from_dict L1333-L1341. litellm/llms/base_llm/chat/transformation.py:
  BaseConfig._add_response_format_to_tools L189-L233. litellm/llms/base_llm/base_utils.py: map_developer_role_to_system_role
  L215-L230. litellm/llms/base_llm/base_model_iterator.py: BaseModelResponseIterator.__init__ L67-L71. litellm/llms/base_llm/batches/transformation.py:
  BaseBatchesConfig.__init__ L34-L35.


  Named case contracts: response_format_native: When is_response_format_supported, assign response_format unchanged
  even when schema is absent/empty; response_schema key takes precedence over nested json_schema.schema by key presence.
  A malformed json_schema lacks schema and fails before the support branch; preserve the existing optional map.
  response_format_tool: Unsupported format plus truthy schema appends type=function/function{name:json_tool_call,parameters:schema}
  to existing tools (or []), sets json_mode=True, and by default overwrites tool_choice with function/json_tool_call.
  enforce_tool_choice=False leaves existing choice unchanged; do not remove a preexisting response_format. A falsey
  schema on an unsupported model leaves the map unchanged without warning. developer_role_projection: For each developer
  message emit exactly role=system and original content, discarding all other fields; require content and role keys.
  Non-developer messages pass unchanged. Preserve order and emit Translating developer role to system role for non-OpenAI
  providers. once per translated message. iterator_initial_state: streaming_response and response_iterator start
  as the same supplied handle, json_mode defaults False but preserves explicit None, http_response starts None.
  sync_stream is accepted but unused. Do not parse or drain the stream during initialization. batch_initializer:
  BaseBatchesConfig initialization is a no-op: no defaults, logging, environment reads or transport. Concrete provider
  constructors can call it without depending on API batch orchestration. chat_id_prefix: Generate chatcmpl- followed
  by a hyphenated UUID4 string from the injected ID source, preserving the exact prefix. Other response IDs retain
  their own existing constructors. tool_call_record_projection: A parsed tool record is custom when type equals
  custom or custom is non-None (including {}). For custom records remove only function/type entries whose value
  is None, preserving every other field. Otherwise forward the original record to the function-tool constructor.
  Invoke the supplied B004 ToolCallProjection with the selected kind/fields; it owns wire DTO validation. The lower
  helper never imports Python SDK object constructors.


  Implement crates/betterlite-context/src/provider_message_primitives.rs with adjacent tests under provider_message_primitives/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  Register helper operation provider_message_primitives in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function provider_message_primitives_cases in betterlite-context with these exact named cases (one
  per oracle file): response_format_native, response_format_tool, developer_role_projection, iterator_initial_state,
  batch_initializer, chat_id_prefix, tool_call_record_projection. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/provider_message_primitives* using HelperCase:
  kind: helper and the externally tagged provider_message_primitives variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_provider_message_primitives that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 73 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 170 production lines, 235 behavior/config-test lines, 110 combined
  Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 550 planned, 550 maximum changed lines.
