id: B909
title: Responses input messages and reasoning replay
description: >-
  Assemble chat messages from Responses input in betterlite-core::api::responses_input_messages.
  Own complete input-list/item dispatch, reasoning text extraction, signed-block decoding and
  the two item-type predicates in the linked ranges. B2411 owns content/file/image/instruction
  conversion; B912 owns function/result messages, B911 appends tool calls, B910 merges assistants
  and B907 supplies falsy-role defaults. Keep replay_reasoning=false by default for inspection;
  provider-bound B908 explicitly opts into reasoning replay.

  decode_thinking_blocks(bytes, ApiLimits) parses encrypted_content JSON, preserving the pinned
  fallback to no blocks on invalid JSON/non-list input. Despite its name this is serialized
  provider thinking, not cryptographic decryption. A block of type thinking needs only truthy
  signature; redacted_thinking needs truthy data. No other shape validation is added here.
  Fuzz that exact production decoder and replay committed malformed/signed-block inputs.
  Register responses_input_messages in B171 with request, replay flag and injected tool cache.
  Count 333 nonblank/non-comment source lines after moving the content helpers; budget 300
  implementation, 185 tests, 110 fixtures, 85 adapters, 65 fuzz/replay and 25 wiring: 770 lines.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/error.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/responses_input_messages.rs
  - crates/betterlite-core/src/api/responses_input_messages/**
  - crates/betterlite-core/fuzz/Cargo.toml
  - crates/betterlite-core/fuzz/fuzz_targets/responses_input_messages.rs
  - crates/betterlite-core/fuzz/corpus/responses_input_messages/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_input_messages.rs
  - tools/oracle/src/helpers/core_ops/responses_input_messages/**
  - tools/oracle/helpers/responses_input_messages.py
  - tools/oracle/helpers/responses_input_messages/**
  - tools/oracle/fuzz/corpus/helper_case/responses_input_messages-*
  - tools/oracle/cases/helpers/responses-input-messages/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L486-L532
  why: Complete public input converter prepends only truthy instructions and forwards replay_reasoning.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L602-L729
  why: Ordered message assembly, adjacent call merging and cached-wrapper deduplication belong together.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L1325-L1550
  why: Whole item dispatcher and reasoning text/block helpers, including swallowed JSON failures.
dod:
- text: >-
    message_inputs maps input="hi",instructions="follow" to system follow then user hi;
    absent/empty instructions adds no system message. An ordinary item without content or
    content=null is skipped, empty content stays, missing/falsy role becomes user. Unknown
    item types with content use ordinary content conversion. web_search_call validates the
    search model and becomes assistant content="Hosted web search: " plus its compact
    exclude_none JSON; malformed search input raises validation failure.
  proof: [input-tests, oracle, input-adapter]
- text: >-
    ordered_calls supplies function_call c1,custom_tool_call c2 then their results; expect
    one assistant containing both calls followed by tool results in input order. Consecutive
    calls also merge into an existing trailing assistant even if it has text. A result whose
    cached assistant wrapper repeats an already seen call_id drops only that wrapper, not
    its tool result. The first cached call ID controls deduplication. Empty-ID results yielding
    [] are skipped. Tool-output types are function_call_output,custom_tool_call_output,
    computer_call_output,tool_result; call types are function_call and custom_tool_call.
  proof: [input-tests, oracle, input-adapter]
- text: >-
    reasoning_inspection uses replay=false. reasoning content=" x " is visible message
    content unchanged; nonempty text blocks make content win over summary. If content has
    only opaque blocks, summary=[{text:" s "},{text:t}] becomes visible "s\nt". With no
    inspectable content or summary, return []. Default role=user is retained in inspection.
    No opaque signed blocks are substituted for visible summary in this branch.
  proof: [input-tests, oracle, input-adapter]
- text: >-
    reasoning_replay uses replay=true and converts content=" x " to an assistant with
    content=null,reasoning_content=" x ". List content strips each nonempty text, joins by
    newline and excludes type=encrypted_content/redacted_thinking; it does not require
    output_text/summary_text type labels. Summary is a list-only fallback and strips/joins
    all nonempty string text fields. Empty reasoning without signed blocks yields [].
    Pending reasoning then merges through B910 into the following assistant; text never
    becomes visible assistant content in this path.
  proof: [input-tests, oracle, input-adapter]
- text: >-
    signed_thinking decodes encrypted_content='[{"type":"thinking","signature":"sig","thinking":"x"},
    {"type":"redacted_thinking","data":"opaque"},{"type":"thinking","signature":""}]'
    to the first two blocks in order, preserving their extras. Numeric truthy signature/data
    also passes the pinned predicate. Blank/non-string input, invalid JSON, a JSON object,
    empty list and lists with no replayable blocks return null silently. Provider-bound
    messages retain blocks even with no plaintext reasoning.
  proof: [input-tests, oracle, input-adapter, thinking-corpus]
checks:
  optional: []
  commands:
  - id: input-tests
    why: input ordering, reasoning visibility or tool-call correlation changes
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_input_messages::/) - test(/::replays_corpus$/)'
  - id: input-adapter
    why: input cases bypass the pinned converter or fail strict adapter checking
    run: test -f tools/oracle/helpers/responses_input_messages.py && grep -qE '^[[:space:]]+responses_input_messages:' tools/oracle/fuzz/corpus/helper_case/responses_input_messages-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: thinking-corpus
    why: serialized thinking JSON has no production-decoder fuzz/replay coverage
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-core/fuzz/corpus/responses_input_messages)" && grep -qF decode_thinking_blocks crates/betterlite-core/fuzz/fuzz_targets/responses_input_messages.rs && cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_input_messages::tests::replays_corpus$/)'
