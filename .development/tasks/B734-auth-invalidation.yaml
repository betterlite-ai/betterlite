id: B734
title: Auth-object refresh and spend-reset invalidation
description: >-
  Implement auth_invalidation in betterlite-auth for the eleven auth_checks.py refresh/eviction
  helpers listed below. B733 supplies cache partitions, serialization, key formats and management TTL;
  B878 supplies publish_auth_cache_invalidation and evict_and_broadcast, including their no-Redis,
  queue-full and failed-publication behavior. This task does not own pubsub messages, decoding or
  subscriber lifecycle. Inject B125/B126 auth, usage and spend caches and a clock instead of importing
  proxy_server globals. B859 supplies team rows, B721 access-group rows and B2314 resolved keys.

  _cache_management_object writes the supplied model with its explicit model_type and B733 management
  TTL through async_set_cache; proxy_logging_obj is unused. _cache_team_object first mutates the
  input last_refreshed_at to the current Unix time, then invalidates the usage-cache team_id:{id}
  entry, then writes the typed team by ID. Sharing Redis means object identity of the Redis handle,
  including both handles being None: in that case only usage memory is cleared. Different handles
  use usage async_delete_cache. A usage failure logs a warning and permits the write; no usage cache
  is a silent no-op. The warning strips CR and LF from its key and says the stale object can remain
  until TTL. A failed main cache write propagates and prevents alias processing; the refreshed
  timestamp and any earlier eviction remain.

  For a truthy team_alias, delete team_alias:{alias}; never write an alias mapping during refresh
  because aliases are not unique in Postgres. Try async_delete_cache_pre_call, fall back to direct
  async delete only when it returns None, otherwise await its result. An ordinary alias-delete error
  warns that a stale team may remain until TTL, then usage alias invalidation still runs. Empty/None
  aliases skip both operations. Usage alias invalidation follows the same shared-Redis identity rule.
  No publication occurs on this refresh path. _cache_key_object mutates the original key timestamp,
  calls B733's copy clearing four request fields, and writes it under the supplied hashed_token
  without hashing it again. It neither clears usage cache nor broadcasts.

  Team deletion processes team_id:{id}, then the alias key only if truthy. For each, synchronously
  delete the auth cache then asynchronously delete the usage cache when present, inside one try.
  An auth-delete failure skips usage deletion for that key; an ordinary failure at either step logs
  the deleted-team stale-until-TTL warning. Publish that key afterward regardless, then continue.
  _delete_cache_key_object has the same local-auth then usage then publication order and warning
  policy for one supplied hash. delete_cache_key_objects invokes one such operation per input
  concurrently, preserving duplicate inputs, collects all outcomes and warns in input order for
  every BaseException result, including a child cancellation. An empty batch does nothing. Caller
  cancellation of the whole operation still propagates. Do not turn these best-effort evictions
  into a transaction rollback or a management-route failure.

  _cache_access_object writes access_group_id:{id} with model_type=LiteLLM_AccessGroupTable and the
  DEFAULT_ACCESS_GROUP_CACHE_TTL env value, int-parsed at import with default 600. Invalid/empty env
  fails startup; zero/negative values are passed through without a source clamp. This TTL is
  independent of general_settings.user_api_key_cache_ttl. _delete_cache_access_object deletes auth
  synchronously, then usage asynchronously if provided: it has NO catch and NO broadcast. Its
  first failure propagates and skips later work. delete_cached_project_object delegates one
  project_id:{id} key to B878 evict_and_broadcast, which handles local failure/publication itself.

  Move the two-line _team_membership_inflight registry declaration (auth_checks.py L398-L399) here
  so both invalidation and B2318 lookup use the same request-owned registry without an upward call.
  Keep the 10000-entry insertion-order bound of B125 LimitedSizeOrderedDict; removing an entry does
  not cancel its task, and task lifetime remains B2318's server-owned tracker. A reset first pops
  team_membership:{user_id}:{team_id}; if it held another task, wait for completion without consuming
  or propagating that task's result. Skip waiting for the current task or a non-task/missing value.
  This happens before ANY reset writes or membership eviction, including when new_spend is None.

  With new_spend=None, leave the spend counter and DB-floor marker untouched and evict/broadcast
  the two membership keys in auth-then-reservation order. With a value, including zero, first SET
  spend:team_member:{user_id}:{team_id} in spend-cache memory with TTL 60. If Redis exists, directly
  SET it there with TTL 60; an ordinary SET failure warns and attempts DELETE of that same Redis
  counter. DELETE success continues, leaving the new memory value. If both fail, log another warning
  and raise HTTPException 503 with detail.error explaining that the DB reset committed but Redis
  still has the old counter and retry requires Redis recovery. Preserve the SET error as cause;
  do not claim a route-specific auth_error/type/param here. At this point memory was updated, but
  no floor marker, publication or membership eviction has happened.

  On the continuing path, SET spend_db_floor:spend:team_member:{user_id}:{team_id} only in local
  spend memory, TTL 5 (SPEND_DB_FLOOR_CACHE_TTL_SECONDS). Move this shared constant below B124 here;
  B124's authoritative-floor reader consumes it. Publish counter SET(value,60), then floor SET(value,5),
  then evict/broadcast both membership keys through B878. Redis absence skips only its direct write.
  Do not delete the new floor/counter when the worker receives its own message: B878 applies SETs
  to its additional memory caches. There is no database write or compensation in this helper; its
  caller has already committed the reset. Ordinary cache failures only have the catches stated
  above; cancellation is not swallowed by those Exception handlers.

  Store monetary reset values in the already checked Decimal representation. The auth_invalidation
  oracle projections invoke the management/team/key/access cache helpers with deterministic memory
  stores and an injected clock, comparing their key/TTL/copy/timestamp effects. They never invoke
  invalidate_team_member_spend_state, which imports proxy_server globals. Native recording ports
  verify its asynchronous order, warnings, partial progress and failure causes.
  B878 tests transport/publication, and management owners test each route's translation of the reset
  503 against real Postgres through POSTGRES_TEST_URL or testcontainers. This task adds no parser.
  The selected helpers plus registry contain 241 nonblank noncomment lines excluding docstrings;
  add the one-line floor constant. Allow 250 implementation, 350 tests, 80 oracle adapters, 40 config
  and 35 wiring, 755 within 800; divide refresh, eviction and member-reset files below 300 lines.
