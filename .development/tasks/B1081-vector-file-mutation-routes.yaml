id: B1081
title: Attached-file create, update and delete HTTP routes
description: >-
  Implement server::api::vector_file_mutation_routes for POST /v1/vector_stores/{vector_store_id}/files
  and /vector_stores/{vector_store_id}/files, POST both prefixes with /{file_id}, and DELETE both
  prefixes with /{file_id}. Own each complete handler; B1075 resolves ids/credentials/provider and B1061
  checks original-store access. B1100 supplies request-body decoding for POST; DELETE does not read a body.
  B004 runs avector_store_file_create/update/delete with model=null and the injected proxy/user defaults,
  B1072/B1074 execute SDK calls, B003/B732 authenticate. No route-specific settings or helper adapter.

  Replace body ids with path ids before access, resolve managed file first then managed store, disallow
  a second registry lookup, resolve provider and check allowed indexes against the original store id.
  Only insert resolved custom_llm_provider when the data key is absent, not when present null. Restore
  original managed file ids after a successful processor result. The 282 nonblank/non-comment source
  lines yield 230 code, 190 tests, 170 HTTP fixtures and 50 body-corpus/wiring lines, 640 total.
scope:
  paths:
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/api/vector_file_mutation_routes.rs
  - crates/betterlite-server/src/api/vector_file_mutation_routes/**
  - crates/betterlite-server/fuzz/corpus/request_body/vector-file-mutation-*
  - tools/oracle/cases/api/vector-file-mutation-routes/**
  - tools/oracle/helpers/b1081.py
  - tools/oracle/helpers/b1081/**
  - tools/oracle/src/helpers/server/b1081.rs
  - tools/oracle/src/helpers/server/b1081/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_files_endpoints/endpoints.py#L455-L559
  why: Create reads a body and only invokes managed-file resolution when file_id is a present key.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/vector_store_files_endpoints/endpoints.py#L875-L1086
  why: Update and delete override ids from the path, then share ordered resolution and response restoration.
dod:
- text: >-
    attach_file_aliases sends {vector_store_id:wrong,file_id:file_a,attributes:{tag:x},chunking_strategy:{type:auto}}
    on both create paths for vs_a. Provider gets vs_a/file_a and the selected attributes/chunking strategy;
    mock 200 {id:file_a,object:vector_store.file,vector_store_id:vs_a,status:in_progress} returns unchanged.
    Absent file_id skips the managed-file helper and fails later through SDK validation; present null enters
    the helper and retains B1021's falsey-id no-op. Native trace proves access runs first and store overlay
    follows file routing; no duplicate registry read occurs.
  proof: [mutation-tests, oracle, new-cases]
- text: >-
    update_and_delete_path_ids sends POST body {file_id:wrong,vector_store_id:wrong,attributes:{tag:x}}
    to both update aliases for vs_a/file_a and expects provider ids vs_a/file_a. Missing/null attributes
    reaches B1074 unchanged; metadata cleaning remains the provider's. Both DELETE aliases ignore body and
    unrelated query id fields, send the path ids and return 200 {id:file_a,object:vector_store.file.deleted,
    deleted:true}. These DELETE requests have no body. No handler adds download headers.
  proof: [mutation-tests, oracle]
- text: >-
    mutation_provider_precedence gives registry provider=openai with caller custom-llm-provider=azure
    and query custom_llm_provider=bedrock; registry data wins. Without registry, truthy body provider wins
    header, header wins query, and absent values fall back to openai. Present null provider may resolve
    openai for permissions yet remains null in data because the key exists. Unknown provider skips enum
    permission checks but is preserved for SDK error handling. An allowed-index denial returns B1061 403
    before processing. A managed file id resolving to file_a is restored in the returned id/file_id fields.
  proof: [mutation-tests, oracle]
- text: >-
    mutation_managed_requirement compares require_managed_files=false with true. False permits native
    ids and MIT decoding; true produces 400 detail="Raw provider file ids cannot be used when require_managed_files is enabled in litellm_settings. Use the LiteLLM managed file id returned when the file was created."
    for raw file ids, and 500 detail="Managed resource ownership validation is unavailable." for unified
    ids without the enterprise hook. Create with absent file_id does not trigger this check. Access denial
    on the store precedes these errors. All preprocessor HTTPException detail envelopes omit type/param/code.
  proof: [mutation-tests, oracle]
- text: >-
    mutation_auth_body_and_provider_errors covers all six aliases: missing/invalid proxy key yields
    401,authentication_error,param=null,code="401" without upstream work; valid key sends configured provider
    Authorization, never the proxy key. Malformed POST JSON is B1100 400,invalid_request_error,
    param=request_body,code="400". Provider 404 maps to not_found_error,404,param=null,code="404";
    429 maps to rate_limit_error,429,param=null,code="429" with Retry-After. Compare application/json and
    B004's x-litellm-* headers. Commit parsed-body seeds for path/body id collisions and null attributes.
  proof: [mutation-tests, oracle, body-corpus]
checks:
  optional: []
  commands:
  - id: mutation-tests
    why: mutation aliases lose path precedence, managed-id ordering or authentication
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::vector_file_mutation_routes::tests::/) - test(/::replays_corpus$/)'
  - id: new-cases
    why: attached-file mutations lack new booted-proxy comparisons
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/vector-file-mutation-routes)"
  - id: body-corpus
    why: id replacement and nullable attributes lack new request decoder input
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/request_body/vector-file-mutation-*)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::request_body::tests::replays_corpus$/)'
oracle_cases:
- tools/oracle/cases/api/vector-file-mutation-routes/attach-file-aliases.yaml
- tools/oracle/cases/api/vector-file-mutation-routes/update-and-delete-path-ids.yaml
- tools/oracle/cases/api/vector-file-mutation-routes/mutation-provider-precedence.yaml
- tools/oracle/cases/api/vector-file-mutation-routes/mutation-managed-requirement.yaml
- tools/oracle/cases/api/vector-file-mutation-routes/mutation-auth-body-and-provider-errors.yaml
deviations:
- what: Pending the managed-files/batches choice, this task retains MIT raw-id use by default and the explicit 400/500 managed-id failures when require_managed_files=true.
  why: The absent enterprise ownership hook is not silently substituted with weaker authorization.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/common_utils.py#L1062-L1118
out_of_scope:
- B1075 owns the seven resolution/projection helpers and B1076 owns all GET handlers. B1021's requirement checks are consumed through B1075.
- B004 owns common processing and errors, B1100 decode_request_body; this task only adds seeds to that decoder's corpus.
pitfalls:
- Unlike ordinary vector-store update, attached-file update always overwrites both body ids from the path.
- A present-null provider key blocks insertion of the resolved provider string.
- Create distinguishes a missing file_id key from an explicitly null file_id.
review_level: security
budget:
  max_changed_lines: 740
  max_new_expects: 0
