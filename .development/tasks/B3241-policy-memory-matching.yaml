dod:
  - text: Policy registry loads from config, tracks provenance per policy, and restores config policies when database policies are removed.
    proof: [behavior-tests]
  - text: Policy parsing handles legacy single-list guardrails as add, extracts inherit/condition/pipeline, and defaults pipeline mode to pre_call.
    proof: [behavior-tests]
  - text: Attachment registry loads from config, sorts by priority/specificity, deduplicates by broadest match, and filters defaults when non-defaults exist.
    proof: [behavior-tests]
  - text: Policy matcher uses route_matches_wildcard_pattern for trailing-star and exact patterns; scope matching checks all four dimensions with tags requiring presence.
    proof: [behavior-tests]
  - text: Policy condition evaluation walks inheritance chains, logs INFO when ancestor applies despite child condition failure, and filters policy lists accordingly.
    proof: [behavior-tests]
  - text: Request resolution returns union of guardrails across matching policies and pipelines with inherited steps.
    proof: [behavior-tests]
  - text: The independent helper operations policy_memory_matching_registry, policy_memory_matching_attachment, policy_memory_matching_matcher, policy_memory_matching_resolver match the production implementation in every case.
    proof: [oracle, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: Policy load/match/resolve missing behavior or incorrect specificity/inheritance logic.
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^registry::tests::/) + test(/^attachment::tests::/) + test(/^matcher::tests::/) + test(/^resolver::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Helper adapters missing or Python checks fail.
      run: test -f tools/oracle/helpers/b3241.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No seed corpus or HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/policy-registry-*")" && grep -rlq '"b3241' tools/oracle/fuzz/corpus/helper_case/policy-{registry,attachment,matcher,resolver}-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
