deviations: []
out_of_scope:
  - "B3240 owns policy value types, condition evaluation, scope matching helpers, resolve_inheritance_chain and resolve_policy_guardrails; this task reuses them via public API."
  - "B882 owns route_matches_wildcard_pattern in betterlite-auth::route_match; this task reuses it for pattern matching."
  - "B3242 owns database row types and single-version lookup; this task does not use database interfaces."
  - "PolicyRegistry.get_policy_names (L286-293): no caller at the pin; not used by active code."
  - "PolicyRegistry.clear() (L316-323): no caller at the pin; test/reset convenience only."
  - "PolicyMatcher.get_matching_policies_from_registry (L120-133): no caller at the pin; wraps get_matching_policies without additional behavior."
  - "AttachmentRegistry.is_policy_attached (L211-223): no caller at the pin; not used by active attachment code."
  - "AttachmentRegistry.get_attachments_for_policy (L243-253): no caller at the pin; not used by active code."
  - "AttachmentRegistry.clear() (L264-270): no caller at the pin; test/reset convenience only."
  - "AttachmentRegistry.remove_attachments_for_policy (L283-298): no caller at the pin; active deletion uses sync instead."
  - "AttachmentRegistry.remove_attachment_by_id (L300-312): no caller at the pin; active deletion uses sync instead."
  - "PolicyResolver.get_all_resolved_policies (L262-296): owned by B3250, provides singular inspection over all policies."
  - "attachment_registry.py DB CRUD methods (add_attachment_to_db, delete_attachment_from_db, get_attachment_by_id_from_db, get_all_attachments_from_db, sync_attachments_from_db, L318-545): owned by B3243, implements database persistence and refresh."
pitfalls:
  - >-
    PolicyRegistry tracks source per policy (config vs db); when a db policy is removed
    but a config policy exists with the same name, remove_policy restores the config
    version instead of leaving the slot empty.
  - >-
    Legacy guardrail parsing converts a single-item guardrails list or dict with only
    an add key to a PolicyGuardrails.add; _parse_policy does not validate list/dict
    type, so empty guardrails (None or {}) produces empty add/remove.
  - >-
    Attachment deduplication returns only the broadest (highest-specificity) instance
    of each policy when multiple attachments match it; multiple attachments for the same
    policy with lower specificity are dropped.
  - >-
    Scope.get_teams(), get_keys(), get_models() return empty list as "match all";
    scope.get_tags() returns empty list as "do not check tags". PolicyMatcher.scope_matches
    treats these differently: missing dimensions match all, but tags present requires
    context.tags present and at least one matching tag.
  - >-
    policy_applies returns a callable predicate; its applies function logs INFO once
    per attachment scan when a policy's own condition failed but an ancestor's applies,
    naming the first applying ancestor.
  - >-
    resolve_pipelines_for_context skips policies whose condition fails the context,
    while resolve_guardrails_for_context uses get_policies_with_matching_conditions which
    includes policies where ancestors apply despite child condition failure.
budget:
