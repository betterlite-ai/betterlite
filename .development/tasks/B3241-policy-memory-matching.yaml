id: B3241
title: Policy memory, attachment matching and request resolution
description: >-
  Build in-memory policy registry, attachment registry, and matching logic to
  resolve guardrails and pipelines for a request. Policies define what guardrails
  to apply; attachments define where they apply. Load policies and attachments
  from config, track provenance (config vs database), restore config policies when
  database overrides are removed, and match requests against attached policies with
  inheritance-condition filtering.

  PolicyRegistry loads policies from config.yaml and tracks per-policy source (config
  or db). add_policy and remove_policy maintain in-memory state; remove_policy falls
  back to config-stored policies when a database policy is deleted. Policies are indexed
  by name and by uuid for per-version lookups. load_policies reads a dict mapping policy
  names to raw dicts, parses each as a Policy via _parse_policy, and stores results with
  source=config. _parse_policy extracts inherit, guardrails dict (add/remove lists),
  condition dict (model field only), and optional pipeline dict, preserving legacy
  guardrail-list parsing where an old single-list is treated as add. _parse_pipeline
  reads steps list and mode (defaulting to pre_call), and validates via GuardrailPipeline;
  raw _RawPipelineStep records with guardrail field alone are converted to full PipelineStep.
  POLICY_VERSION_ID_PREFIX ("policy_") prefixes version IDs in request bodies.

  AttachmentRegistry loads attachments from config and stores them in memory. Each
  attachment couples a policy name to a scope (teams, keys, models, tags, or global "*")
  with optional priority and default marker. load_attachments reads a list of dicts
  and parses each via _parse_attachment. get_attached_policies returns a list of
  matching policy names; get_attached_policies_with_reasons returns PolicyAttachmentMatch
  dicts with policy_name and matched_via reason. Matching filters by scope_matches,
  policy_applies predicate (when provided), then drops defaults unless all non-default
  matches are filtered. Attachments are sorted by _attachment_sort_key: explicit priority
  first (0, priority, specificity), then by specificity alone (1, 0, specificity).
  Specificity ranks 1..4 per dimension (teams=1, keys=2, tags=3, models=4), with
  global scope (0, 0). When multiple attachments match the same policy, only the
  broadest is returned to avoid duplicate execution.

  PolicyMatcher.matches_pattern tests a value against a list of trailing-star and
  exact patterns using B882's route_matches_wildcard_pattern; a None value matches
  only "*". scope_matches checks that context.team_alias, key_alias, and model each
  match their respective scope fields; tags differ: scope.tags present requires
  context.tags to be present and at least one context tag to match a scope pattern.
  get_matching_policies calls the global attachment registry with policy_applies
  predicate. policy_applies returns a callable testing whether a policy exists and
  any member of its inheritance chain applies to the context; when a policy's own
  condition fails but ancestors apply, log an INFO message once per attachment scan.
  _applying_chain_members walks the inheritance chain, evaluates each policy's
  condition (if present), and returns tuple of chain members whose condition is absent
  or true. get_policies_with_matching_conditions filters a list of policy names to
  those that apply via their inheritance chains.

  PolicyResolver.resolve_guardrails_for_context finds all policies matching the
  context (via attachment matching or an explicit policy_names list), resolves each
  via resolve_policy_guardrails from B3240, and returns the union of guardrails.
  resolve_pipelines_for_context returns a list of (policy_name, GuardrailPipeline)
  tuples from policies that match the context and have pipelines; skip policies
  whose condition fails. get_pipeline_managed_guardrails returns a set of guardrail
  names that appear in any pipeline step, for exclusion from independent execution.

  Build the memory and matching layer in betterlite-policy; implement get_policy_registry
  and get_attachment_registry as injected global singletons returned by the Rust side.
  Every observable behavior listed in LiteLLM source (config/db source tracking, policy
  fallback on removal, attachment sorting and specificity rules, condition evaluation
  in chains, inheritance walk order, pipeline default mode, legacy list parsing) is
  tested. Every accessor, parser and matcher function for registries and matching is
  an oracle case, preserving exact specificity/priority precedence, config restoration
  logic, and scope matching dimension semantics.
