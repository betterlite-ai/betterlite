deviations:
  - what: Oldest-key iteration from hanging cache uses InMemoryCache.async_get_oldest_n_keys (MAX_OLDEST_HANGING_REQUESTS_TO_CHECK = 20) to detect stale hanging requests.
    why: B4027 iterates the oldest 20 cached request entries to detect those exceeding the alerting threshold; this operation is owned by B2226's cache implementation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/hanging_request_check.py#L99-L101
  - what: Request completion status is checked via proxy_logging_obj.internal_usage_cache lookup of "request_status:<request_id>" key (a DualCache instance), with completion-status removal regardless of message content.
    why: B4027 queries a shared completion-status cache (not the hanging cache) to determine if a request has completed; this DualCache operation is owned by B4293.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/hanging_request_check.py#L114-L126
  - what: API-base formatting uses litellm.get_api_base(model, optional_params) to resolve provider-specific API endpoints for hanging and slow request alerts.
    why: B4027 includes api_base in hanging and slow response alerts; the get_api_base implementation is owned by B004.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/hanging_request_check.py#L65-L68
  - what: Slow response alert includes key name and team information via _add_key_name_and_team_to_alert(request_info, metadata); this function is owned by B236.
    why: B4027 formats key and team context into slow alerts when available; the implementation is owned by B236.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L292
out_of_scope:
  - Alert type enum and HangingRequestData record definition are owned by B4020.
  - Alert destination selection, Slack/Teams/webhook dispatch and send_alert entry point are owned by B4024.
  - InMemoryCache implementation and synchronous cache operations (_remove_key) are owned by B2226.
  - DualCache completion-status reads are owned by B4293.
  - Background task coordination, task admission and shutdown drain are owned by B191.
  - Async HTTP handler and webhook transport are owned by B173.
  - AsyncHTTPHandler itself is owned by B173; this task uses its provided async HTTP client.
  - get_api_base implementation and provider-specific endpoint resolution are owned by B004.
  - _add_key_name_and_team_to_alert implementation for context enrichment is owned by B236.
pitfalls:
  - "AlertingHangingRequestCheck TTL is int(threshold * 1.5 + 60) in seconds, not milliseconds; ensure unit consistency."
  - "Cache oldest-key iteration returns at most 20 request IDs; the check must handle cases where fewer than 20 are cached."
  - "Hanging request alerted flag must be preserved across check iterations after sending one alert; toggling it prevents duplicate alerts."
  - "Request completion is detected by non-null completion-status value in internal_usage_cache, not by absence in hanging_request_cache."
  - "Message projection uses first 100 characters of messages or input field (fallback if messages absent); truncation must happen before redaction checks."
  - "Slow response callback filters messages before building request_info string to respect turn_off_message_logging and redact_messages_in_exceptions."
  - "Deployment latencies format as sorted (api_base, latency) pairs in backtick code blocks; empty latency maps return None without sending that context."
  - "Background check loop calls sleep(alerting_threshold / 2) between iterations; ensure the duration is a float for division."
  - "Hanging request alerts include model, api_base, key_alias and team_alias from HangingRequestData; missing values remain as empty strings in the formatted message."
  - "response_taking_too_long_callback calls send_alert only when time_difference > alerting_threshold; alerts at the threshold boundary are not sent."
  - "The hanging check does not call response_taking_too_long_callback; the detector depends on the lower sender (B4024), not the other way around."
