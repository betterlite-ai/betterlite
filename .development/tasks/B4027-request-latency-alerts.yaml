id: B4027
title: Slow response and hanging request alerts
description: >-
  Build slow-response formatting and a small hanging-request index driven by an owned timer.
  Create AlertingHangingRequestCheck to manage in-flight request tracking with cached timestamps
  and metadata. Implement request addition to a TTL-based cache with TTL = threshold * 1.5 + 60 seconds.
  Implement the hanging request check loop that runs every threshold/2 seconds, iterating over oldest
  20 cached requests to detect hangs beyond the alerting threshold. Track alerted status to send
  one alert per hanging request. Implement slow-response callback helpers: extract timing as seconds,
  model, api_base and first-100-character message projection. Format deployment latencies from
  metadata into an alert attachment. Preserve privacy substitution for message logging and redaction
  settings. Build response_taking_too_long_callback to validate alerting is enabled, compute
  time_difference/model/api_base/messages and send the slow-response alert only when time_difference
  exceeds alerting_threshold. Implement response_taking_too_long to check alerting is enabled,
  check if llm_requests_hanging is in alert_types, and add the request to the hanging check on entry.
  Keep the threshold-comparison logic for alerting and cache cleanup on request completion via non-null
  completion-status lookup. Build all callback registrations and task startup coordination through B191.
  Implement async context throughout with proper context manager integration for the background hang-check loop.
