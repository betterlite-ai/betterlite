  - text: response_taking_too_long wrapper checks alerting is enabled and llm_requests_hanging is in alert_types before delegating.
    proof: [latency-wrapper-tests]
  - text: Background hang check and alert loop are registered and owned through B191 task admission.
    proof: [hanging-request-loop-tests]
