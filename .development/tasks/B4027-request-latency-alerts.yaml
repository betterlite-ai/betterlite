    proof: [hanging-request-init-tests]
  - text: HangingRequestData records store request_id, model, api_base, key_alias, team_alias, created_at timestamp and alerted flag.
    proof: [hanging-request-init-tests]
  - text: Requests are added to hanging cache with get_litellm_metadata_from_kwargs extraction and api_base lookup.
    proof: [hanging-request-add-tests]
  - text: Hanging request check iterates oldest 20 cached requests and detects those exceeding alerting_threshold seconds.
    proof: [hanging-request-detect-tests]
  - text: Hanging requests are alerted once per hang and marked with alerted flag for subsequent checks.
    proof: [hanging-request-detect-tests]
  - text: Request completion is detected by non-null completion-status cache value and removes the request from hanging cache.
    proof: [hanging-request-detect-tests]
  - text: Background check loop runs every alerting_threshold / 2 seconds and continues until shutdown.
    proof: [hanging-request-loop-tests]
  - text: Hanging request alert includes request model, api_base, key_alias and team_alias in formatted message.
    proof: [hanging-request-send-tests]
  - text: Slow response callback helper extracts time_difference in seconds, model, api_base and first-100-character messages.
    proof: [latency-helper-tests]
  - text: Message logging respects turn_off_message_logging and redact_messages_in_exceptions settings.
    proof: [latency-helper-tests]
  - text: Deployment latencies are formatted from _latency_per_deployment metadata with api_base as key.
    proof: [latency-deployment-tests]
  - text: Slow response alert is sent only when time_difference > alerting_threshold.
    proof: [latency-callback-tests]
  - text: Slow response alert includes key name and team from metadata via _add_key_name_and_team_to_alert when available.
