dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: nested_claim_path, team_array,
      team_alias, user_email_domain, untrusted_normalization_marker.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The production decode_unverified_claims decoder is used by the service and its fuzz target and
      rejects malformed/oversize input without panic.
    proof:
      - behavior-tests
      - parser-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_claims::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/jwt_claims.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/jwt-claims-*")"
        && grep -rlq "jwt_claims" tools/oracle/fuzz/corpus/helper_case/jwt-claims-* && cargo nextest run
        --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^jwt_claims::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/jwt-claims-*")"
        && grep -rlq "team_id_jwt_field" crates/betterlite-config/fuzz/corpus/config_yaml/jwt-claims-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: parser-corpus
      why: The named production decoder target, added corpus or replay is missing or fails.
      run: test -f crates/betterlite-auth/fuzz/fuzz_targets/jwt_claims.rs && grep -q "jwt_claims" crates/betterlite-auth/fuzz/Cargo.toml
        && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-auth/fuzz/corpus/jwt_claims)"
        && cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(replays_the_jwt_claims_corpus)'
