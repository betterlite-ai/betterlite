id: B760
title: JWT identity, role and scope claim projection
description: >-
  Implement JwtClaims projection using B213 dot-path lookup and typed LiteLLM_JWTAuth settings from proxy/_types.py.
  Keep issuer-normalized trust markers separate from raw claims; expose admin, team(s), user/email, end-user,
  org and agent claim values and role mappings. Unverified claim parsing is selector-only and does not
  construct AuthContext.


  Build the production jwt_claims module in betterlite-auth; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTHandler.__init__ (L251-L258; 7 source lines), JWTHandler.bind_agent_lookup (L260-L261; 2 source lines),
  JWTHandler.update_environment (L263-L273; 11 source lines),
  JWTHandler.get_unverified_claims (L283-L302; 19 source lines), JWTHandler._is_trusted_issuer_normalized_token
  (L376-L383; 7 source lines), JWTHandler._has_trusted_issuer_normalized_claim (L385-L386; 2 source lines),
  JWTHandler.get_team_ids_from_jwt (L388-L409; 16 source lines), JWTHandler.get_all_jwt_team_ids (L411-L448;
  36 source lines), JWTHandler.get_end_user_id (L450-L466; 15 source lines), JWTHandler.is_required_team_id
  (L468-L476; 9 source lines), JWTHandler.is_enforced_email_domain (L478-L489; 11 source lines), JWTHandler.get_team_id
  (L491-L533; 37 source lines), JWTHandler.get_team_alias (L535-L558; 22 source lines), JWTHandler.is_upsert_user_id
  (L560-L568; 9 source lines), JWTHandler.get_user_id (L570-L585; 15 source lines), JWTHandler.get_user_email
  (L656-L671; 15 source lines), JWTHandler.get_object_id (L673-L685; 13 source lines), JWTHandler.get_agent_claim
  (L687-L691; 5 source lines), JWTHandler.get_org_id (L693-L708; 15 source lines), JWTHandler.get_org_alias
  (L710-L733; 22 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.team_id_jwt_field=None;
  litellm_jwtauth.team_ids_jwt_field=None; litellm_jwtauth.team_id_default=None; litellm_jwtauth.team_alias_jwt_field=None;
  litellm_jwtauth.org_id_jwt_field=None; litellm_jwtauth.org_alias_jwt_field=None; litellm_jwtauth.user_id_jwt_field=None;
  litellm_jwtauth.user_email_jwt_field=None; litellm_jwtauth.user_allowed_email_domain=None; litellm_jwtauth.user_id_upsert=False;
  litellm_jwtauth.end_user_id_jwt_field=None; litellm_jwtauth.agent_id_jwt_field=None; litellm_jwtauth.object_id_jwt_field=None.


  Add the jwt_claims operation under B856 Management::jwt. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-claims-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::jwt_claims::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This task owns the outside-byte boundary jwt_claims::decode_unverified_claims(&[u8]) -> Result<TypedValue,DecodeError>
  for compact JWT payload used only to select a verification policy. Production calls this decoder before
  its typed policy functions; the cargo-fuzz target jwt_claims calls that same function. Seed valid, truncated,
  malformed, duplicate-field and limit-boundary inputs and add jwt_claims::tests::replays_the_jwt_claims_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B733 owns crates/betterlite-auth/fuzz; depend on it and register this decoder target
  without recreating the workspace.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 293 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  293 production, 145 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 45 decoder/fuzz
  and 50 config lines, 628 changed lines estimated within a 650-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_new_otherwise_unbounded_byte_decoders_reject_over_1048576_bytes_or_jso.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.
