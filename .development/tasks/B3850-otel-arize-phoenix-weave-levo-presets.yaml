pitfalls:
  - PHOENIX_COLLECTOR_HTTP_ENDPOINT is read first and, when empty, PHOENIX_COLLECTOR_ENDPOINT is used; LiteLLM's inner re-read of the HTTP variable changes nothing.
  - The `:4317` test also requires that `/v1/traces` is absent, so `http://host:4317/v1/traces` stays HTTP.
  - The Phoenix Cloud check runs on the final endpoint after the scheme and port decision, so `grpc://app.phoenix.arize.com:4317` without a key also fails.
  - A Phoenix endpoint containing `app.phoenix.arize.com` is never given `/v1/traces`, even when it has no path.
  - The Arize header key is `space_id`, not `arize-space-id`. The dynamic-header builder uses `arize-space-id`. The two are different on purpose.
  - Arize prefers `space_id` over `space_key` in the preset headers but `arize_space_key` over `arize_space_id` in dynamic headers.
  - The Arize preset never drops the placeholder console spec in `base.exporters`; it only appends.
  - The Phoenix preset reads PHOENIX_COLLECTOR_PROJECT_NAME and the Phoenix config does not, so the preset project and `PhoenixConfig.project_name` can differ.
  - Levo adds no mapper. Do not copy the Arize preset's `openinference`.
  - The Weave endpoint is the host plus `/otel/v1/traces` only; the comment in LiteLLM about `/traces/otel/v1/traces` for dedicated cloud is not what the code does.
  - A Weave host starting with `http` (even `httpbin.example`) is not given `https://`.
  - "Weave header values are joined raw, for example Authorization=Basic xxx,project_id=entity/project, with no percent-encoding. Encoding happens later in the destination header string."
  - The gated Weave spec keeps the owner so later per-request header stamping finds this backend; dropping the owner makes the tenant credentials land nowhere.
