dod:
  - text: >-
      ArizeConfig::from_env reads the six ARIZE_* variables. ARIZE_ENDPOINT wins and gives gRPC with that exact value. Without it ARIZE_HTTP_ENDPOINT gives HTTP with that exact value. With neither, the result is gRPC at `https://otlp.arize.com/v1`.
    proof: [arize-settings-tests, helper-python]
  - text: >-
      PhoenixConfig::from_env picks the HTTP collector variable before the plain one, defaults to `http://localhost:6006/v1/traces`, and normalizes the path by the rules in the description: grpc:// and :4317 stay gRPC and unchanged, app.phoenix.arize.com stays unchanged, an endpoint ending in /v1 gets /traces, ending in / gets v1/traces, anything else without /v1/traces gets /v1/traces.
    proof: [phoenix-settings-tests, helper-python]
  - text: >-
      PhoenixConfig::from_env builds `authorization=Bearer <key>` for gRPC and `Authorization=Bearer <key>` for HTTP, fails with the Phoenix Cloud message when there is no key and the endpoint contains app.phoenix.arize.com (gRPC form included), and leaves the headers empty without a key elsewhere.
    proof: [phoenix-settings-tests, helper-python]
  - text: >-
      LevoConfig::from_env checks LEVOAI_API_KEY, LEVOAI_ORG_ID, LEVOAI_WORKSPACE_ID, LEVOAI_COLLECTOR_URL in that order, fails with the exact message of the first missing one, and otherwise returns the collector URL unchanged, HTTP and the three-part header string.
    proof: [levo-settings-tests, helper-python]
  - text: >-
      WeaveOtelConfig::from_env checks WANDB_API_KEY before WANDB_PROJECT_ID with their exact messages. weave_otel_endpoint uses the cloud URL without a host, adds https:// unless the host starts with http, trims trailing slashes and appends /otel/v1/traces. The auth header is `Basic ` plus base64 of `api:<key>`.
    proof: [weave-settings-tests, helper-python]
  - text: >-
      The Arize preset appends one exporter with the config protocol, endpoint and owner ArizeAx, appends mapper openinference once, builds `space_id=...,api_key=...` headers with space_id preferred over space_key, falls back to OTEL_EXPORTER_OTLP_TRACES_HEADERS when neither exists, and sets resource attribute model_id only when ARIZE_PROJECT_NAME is set.
    proof: [arize-preset-tests, helper-python]
  - text: >-
      The Phoenix preset appends one exporter with owner ArizePhoenix, appends mapper openinference once, sets openinference.project.name from PHOENIX_PROJECT_NAME, then PHOENIX_COLLECTOR_PROJECT_NAME, then `default`, and returns the Phoenix Cloud error unchanged whatever allow_missing_credentials says.
    proof: [phoenix-preset-tests, helper-python]
  - text: >-
      The Levo preset appends one HTTP exporter with owner Levo, leaves mapper_names exactly as given, and returns the missing-variable error whatever allow_missing_credentials says.
    proof: [levo-preset-tests, helper-python]
  - text: >-
      The Weave preset appends one exporter with owner WeaveOtel and mappers openinference then weave. When the settings fail, allow_missing_credentials false returns the error, and true returns the base with those mappers and a gated spec (owner WeaveOtel, requires_headers true) in place of the placeholder.
    proof: [weave-preset-tests, helper-python]
  - text: >-
      The Langtrace preset only appends mapper langtrace and leaves exporters and resource attributes untouched. ensure_mappers keeps order and adds no duplicates, and is_unconfigured_placeholder is true only for a spec equal to the default one.
    proof: [langtrace-utils-tests, helper-python]
  - text: >-
      arize_dynamic_headers, weave_dynamic_headers and phoenix_project_headers build exactly the headers listed in the description, with arize_space_key beating arize_space_id, project override beating project name, and blank values adding nothing.
    proof: [dynamic-headers-tests, helper-python]
checks:
  optional: [mutants]
  commands:
    - id: arize-settings-tests
      why: ArizeConfig::from_env tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::arize_settings::/)'
    - id: phoenix-settings-tests
      why: PhoenixConfig::from_env tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::phoenix_settings::/)'
    - id: levo-settings-tests
      why: LevoConfig::from_env tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::levo_settings::/)'
    - id: weave-settings-tests
      why: WeaveOtelConfig::from_env and weave_otel_endpoint tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::weave_settings::/)'
    - id: arize-preset-tests
      why: Arize preset tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::arize::/) - test(/dynamic_headers/)'
    - id: phoenix-preset-tests
      why: Phoenix preset tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::phoenix::/) - test(/project_headers/)'
    - id: levo-preset-tests
      why: Levo preset tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::levo::/)'
    - id: weave-preset-tests
      why: Weave preset tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::weave::/) - test(/dynamic_headers/)'
    - id: langtrace-utils-tests
      why: Langtrace preset and utils tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::(langtrace|utils|base)::/)'
    - id: dynamic-headers-tests
      why: Dynamic header builder tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::presets::(arize|weave)::.*dynamic_headers/) + test(/^otel::presets::phoenix::.*project_headers/)'
    - id: helper-python
      why: The preset and settings results must match LiteLLM run on the same environment
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/otel-presets)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3850::/)'
