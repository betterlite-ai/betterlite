id: B3850
title: OTel Arize Phoenix Weave and Levo presets
description: >-
  Build the vendor presets that turn a vendor's environment variables into an OpenTelemetry V2 destination, in betterlite-logging.
  A preset takes the base `Settings` (the type B3842 builds in `otel/config.rs`) and returns a copy with one more exporter, the mapper names that vendor needs and some resource attributes.
  A preset appends to `base.exporters`; it never removes or reorders what is already there. It never touches `base.mapper_names` except to append names that are missing (see `ensure_mappers`).
  Five presets exist, one per file under `otel/presets/`: arize, phoenix, levo, weave and langtrace. The registry that maps a callback name to a preset, the dynamic-header tables and the other vendors (agentops, newrelic, signoz, langfuse) are B3851's, not this task's.

  The vendor settings come first because the presets call them. Each one lives in its own file under `otel/integrations/` and reads the environment through the `EnvironmentLookup` trait of betterlite-config (crates/betterlite-config/src/loader.rs), passed in as `&dyn EnvironmentLookup`. Nothing here reads `std::env`.
  `arize_settings.rs`: `OtlpProtocol` (`Grpc` or `Http`, with a method returning the exporter kind string `otlp_grpc` or `otlp_http`) and `ArizeConfig { space_id, space_key, api_key, protocol, endpoint, project_name }` with `ArizeConfig::from_env`. It reads ARIZE_SPACE_ID, ARIZE_SPACE_KEY, ARIZE_API_KEY, ARIZE_PROJECT_NAME, ARIZE_ENDPOINT and ARIZE_HTTP_ENDPOINT. ARIZE_ENDPOINT wins and means gRPC. Else ARIZE_HTTP_ENDPOINT means HTTP. Else the endpoint is `https://otlp.arize.com/v1` over gRPC. It cannot fail.
  `phoenix_settings.rs`: `PhoenixConfig { otlp_auth_headers, protocol, endpoint, project_name }` with `PhoenixConfig::from_env`, which returns `Result<_, PhoenixSettingsError>`. It reads PHOENIX_API_KEY, PHOENIX_COLLECTOR_HTTP_ENDPOINT, PHOENIX_COLLECTOR_ENDPOINT and PHOENIX_PROJECT_NAME. The collector endpoint is the HTTP variable when set, else the plain one. With no collector endpoint the result is `http://localhost:6006/v1/traces` over HTTP. An endpoint that starts with `grpc://`, or contains `:4317` and does not contain `/v1/traces`, is used as given over gRPC. Any other endpoint is HTTP: one containing `app.phoenix.arize.com` is used as given; one already containing `/v1/traces` is used as given; otherwise `/traces` is appended when it ends with `/v1`, `v1/traces` when it ends with `/`, and `/v1/traces` in every other case. When the key is set, `otlp_auth_headers` is `authorization=Bearer <key>` for gRPC (lowercase name) and `Authorization=Bearer <key>` for HTTP. With no key and an endpoint containing `app.phoenix.arize.com` it fails with `PHOENIX_API_KEY must be set when using Phoenix Cloud (app.phoenix.arize.com).`, even if the endpoint is a gRPC one. With no key and any other endpoint, `otlp_auth_headers` is empty. `project_name` is PHOENIX_PROJECT_NAME or `default`.
  `levo_settings.rs`: `LevoConfig { otlp_auth_headers, protocol, endpoint }` with `LevoConfig::from_env`, which returns `Result<_, LevoSettingsError>`. It reads LEVOAI_API_KEY, LEVOAI_ORG_ID, LEVOAI_WORKSPACE_ID and LEVOAI_COLLECTOR_URL and checks them in that order. The first missing one fails with the exact LiteLLM message (`LEVOAI_API_KEY environment variable is required for Levo integration.`, the same for ORG_ID and WORKSPACE_ID, and for the collector URL `LEVOAI_COLLECTOR_URL environment variable is required for Levo integration. Please contact Levo support to get your collector URL.`). The endpoint is the collector URL unchanged, the protocol is always HTTP, and the headers are `Authorization=Bearer <key>,x-levo-organization-id=<org>,x-levo-workspace-id=<workspace>`.
  `weave_settings.rs`: `WeaveOtelConfig { otlp_auth_headers, endpoint, project_id, protocol }` with `WeaveOtelConfig::from_env` returning `Result<_, WeaveSettingsError>`, plus `weave_authorization_header(api_key)` (`Basic ` followed by base64 of `api:<key>`) and `weave_otel_endpoint(host: Option<&str>)`. It reads WANDB_API_KEY, WANDB_PROJECT_ID and WANDB_HOST. A missing WANDB_API_KEY fails first with `WANDB_API_KEY must be set for Weave OpenTelemetry integration.`, then a missing WANDB_PROJECT_ID with `WANDB_PROJECT_ID must be set for Weave OpenTelemetry integration. Format: <entity>/<project_name>`. The endpoint is `https://trace.wandb.ai/otel/v1/traces` without a host. With a host, it gets `https://` in front unless it starts with `http`, loses trailing slashes, and gets `/otel/v1/traces` added. The headers are `Authorization=<Basic header>,project_id=<id>` and the protocol is HTTP. Add `base64 = "0.23.1"` to crates/betterlite-logging/Cargo.toml, the version other crates in this workspace use.

  The presets, each in `otel/presets/<name>.rs`, implement the `Preset` trait from `presets/base.rs`: `fn build(&self, env: &dyn EnvironmentLookup, base: Settings, allow_missing_credentials: bool) -> Result<Settings, PresetError>`. `PresetError` is in base.rs and wraps the three vendor errors with `#[from]`. Unit structs `ArizePreset`, `PhoenixPreset`, `LevoPreset`, `WeavePreset` and `LangtracePreset` implement it.
  Arize adds an exporter of kind `ArizeConfig.protocol`, the config endpoint, owner `ExporterOwner::ArizeAx`, and mapper `openinference`. Headers are the pieces that exist, joined by commas: `space_id=<space_id, else space_key>` when either is set, then `api_key=<key>` when set. When neither piece exists the headers are the value of OTEL_EXPORTER_OTLP_TRACES_HEADERS, or empty. When ARIZE_PROJECT_NAME is set it adds resource attribute `model_id`, merged over the base attributes.
  Phoenix adds an exporter with the config protocol, endpoint and `otlp_auth_headers`, owner `ExporterOwner::ArizePhoenix`, mapper `openinference`, and resource attribute `openinference.project.name`. That project name is read by the preset itself: PHOENIX_PROJECT_NAME, else PHOENIX_COLLECTOR_PROJECT_NAME, else `default`. This differs from `PhoenixConfig.project_name`, which ignores the second variable. Keep both.
  Levo adds one HTTP exporter with the config endpoint and headers, owner `ExporterOwner::Levo`, and changes no mapper names.
  Weave adds an exporter with the config protocol, endpoint and headers, owner `ExporterOwner::WeaveOtel`, and appends mappers `openinference` then `weave`. When the settings fail and `allow_missing_credentials` is true, it returns the base with mappers added and with `credential_gated_exporters` applied instead of an error. When the settings fail and it is false, the error is returned. Arize, Phoenix and Levo ignore `allow_missing_credentials`, and their credential errors always propagate.
  Langtrace adds no exporter and no resource attribute; it only appends mapper `langtrace`.
  `presets/utils.rs` holds `ensure_mappers(names, extra)` (append each missing name, keep order, no duplicates), `credential_gated_exporters(exporters, owner)` (drop the placeholder specs, then append `ExporterSpec { owner: Some(owner), requires_headers: true, ..default }`) and `is_unconfigured_placeholder(spec)`.
  Unset or empty environment variables count as not set everywhere above, except PHOENIX_API_KEY, where an empty value still counts as a key (header `Authorization=Bearer `).
  The three header builders for per-request credentials live in the same files as their presets and are plain functions over a `&BTreeMap<String, String>` of the dynamic parameters: `arize_dynamic_headers` (header `arize-space-id` from `arize_space_key`, else `arize_space_id`; header `api_key` from `arize_api_key`), `weave_dynamic_headers` (`Authorization` from `wandb_api_key` through `weave_authorization_header`; `project_id` from `weave_project_id`) and `phoenix_project_headers` (given the key/team auth metadata, header `x-project-name` from `phoenix_project_name_override`, else `phoenix_project_name`, trimmed, and an empty result when both are blank or the metadata is absent). An unset or empty parameter adds no header.
