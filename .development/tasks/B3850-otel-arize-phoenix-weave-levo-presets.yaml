deviations:
  - what: >-
      The Weave settings do not write OTEL_EXPORTER_OTLP_ENDPOINT or OTEL_EXPORTER_OTLP_HEADERS into the process environment. LiteLLM's get_weave_otel_config does, as a side effect of building the preset.
    why: Rule `no reading the environment outside the config crate` leaves no place to set process variables, and the preset already returns the same endpoint and headers in the exporter spec. Any other exporter in the same process that relied on those two variables no longer sees Weave's values.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/weave/weave_otel.py#L158-L160
  - what: >-
      is_unconfigured_placeholder is true for any spec equal to the default spec (kind console, nothing else set). LiteLLM looks at which fields were set, so a spec the operator wrote as plain `console` survives there and is dropped here when a Weave preset has to gate its exporters.
    why: B3842's `ExporterSpec` does not record which fields were set. The case only happens when a Weave preset runs without credentials and the operator also configured a bare console exporter.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/presets/utils.py#L38-L48
  - what: >-
      OTEL_EXPORTER_OTLP_TRACES_HEADERS, PHOENIX_PROJECT_NAME and PHOENIX_COLLECTOR_PROJECT_NAME are read under their upper-case names only. LiteLLM reads them through pydantic-settings with case_sensitive=False, so a lower-case spelling also works there.
    why: Environment names on Linux are case-sensitive and every documented spelling is upper case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/presets/phoenix.py#L21-L30
out_of_scope:
  - "PRESET_BY_CALLBACK, DYNAMIC_HEADERS_BY_CALLBACK, PROJECT_HEADERS_BY_CALLBACK, dynamic_otlp_headers, project_routing_headers and the other presets (agentops, newrelic, signoz, langfuse) are B3851's."
  - "ArizeLogger, ArizePhoenixLogger, their sampling, per-project tracer cache, request context and health checks are B3862's. The two config getters it also lists, get_arize_config and get_arize_phoenix_config, are built here and B3862 calls them."
