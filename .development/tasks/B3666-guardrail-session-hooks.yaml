id: B3666
title: Guardrail session deduplication and deployment hooks
description: >-
  Add the modules `guardrail_scan_cache` and `guardrail_deployment` to betterlite-guardrails, and the config section `guardrail_scan_cache`. They hold the rest of LiteLLM's `CustomGuardrail` that no other task owns: the cache that lets a session scan each text only once, the marker that stops a guardrail from running twice, the two hooks that run a guardrail right around the provider call, and the `logging_only` scan. Request bodies are `BTreeMap<String, GuardrailValue>`, called `data` below. `GuardrailValue` is from `betterlite_config::sections::guardrail_identity::item`, and `GuardrailBase`, `GuardrailFailure`, `GuardrailContract` and `session_id_from_request` are from `guardrail_base` (B5471). Flags are plain `bool`. Python gets the guardrail from `self`, and Rust has no inheritance, so every function here is a method in an `impl GuardrailBase` block, and anything that must reach the provider's own code goes through a trait the caller implements.


  Section `guardrail_scan_cache`. It reads the env var `GUARDRAIL_SCANNED_MESSAGES_CACHE_TTL_SECONDS` through `lookup.lookup` and gives `Settings { ttl_seconds: i64 }`, default 86400. Follow `sections/mcp_tool_helpers.rs` for the shape. Trim the text and parse it as a decimal integer. LiteLLM runs `int()` on it at import, so text that is not an integer is a `ConfigError` that names the variable, and a negative value is kept as given. A caller passes `config.sections.guardrail_scan_cache.ttl_seconds` into `mark_texts_scanned`.


  Module `guardrail_scan_cache`. `ScanCacheStore: Sync` is the trait for LiteLLM's `DualCache`, with `type Error: std::error::Error + Send + Sync + 'static`. Its methods are `get(&self, key: &str) -> impl Future<Output = Result<Option<Vec<String>>, Self::Error>> + Send` and `set(&self, key: &str, hashes: Vec<String>, ttl_seconds: i64) -> impl Future<Output = Result<(), Self::Error>> + Send`. Startup connects it to the shared cache, and B3727's Bedrock code passes one in. Nothing here names a cache crate. `scanned_text_hash(text: &str) -> String` is the lowercase hex SHA-256 of the UTF-8 bytes, built with the `sha2` and `hex` crates already in the manifest. `scan_cache_key(guardrail_name: Option<&str>, session_id: &str) -> String` is `guardrail_scanned_texts:{name}:{session_id}`, and a missing name prints `None`, as Python's f-string does.


  `filter_new_texts_for_session<S: ScanCacheStore>(&self, texts: Option<&[String]>, request_data: &BTreeMap<String, GuardrailValue>, cache: &S) -> Option<Vec<String>>` returns `None` to say "scan everything" and a list (possibly empty) to say "scan only these". The steps run in this order and the first that answers ends the call. `None` when `only_scan_new_messages` is off or `texts` is missing or empty. Then, when `mask_request_content` or `mask_response_content` is on, a `tracing::warn!` with the text `Guardrail {name}: only_scan_new_messages is not supported with masking; scanning full context.` and `None`. Then `session_id_from_request(request_data)`, and with no id a `tracing::debug!` and `None`. Then the cache read, and a read error gives a `warn!` that names the guardrail and the error, and `None`. At the end the result holds the texts whose hash is not in the stored list, in their original order and with duplicates kept.


  `mark_texts_scanned<S: ScanCacheStore>(&self, texts: Option<&[String]>, request_data: &BTreeMap<String, GuardrailValue>, cache: &S, ttl_seconds: i64)` records the hashes of every text after a scan that let the request through. It returns quietly, with no log, when the feature is off, `texts` is missing or empty, masking is on, or there is no session id. Otherwise it reads the stored list (a missing one counts as empty), appends the hashes of `texts`, removes repeats and keeps the first occurrence of each hash, and writes the list back with `ttl_seconds`. A read or write error is one `warn!` and nothing more, because the cache is best effort and a failure only makes the next call scan again. The function never returns an error.


  Module `guardrail_deployment`, file `markers.rs`. `PRE_CALL_EXECUTED_GUARDRAILS_KEY` is the public constant `_pre_call_executed_guardrails`. `PreCallToken` wraps a string. `PreCallToken::new(String)` takes a fixed one for tests and `PreCallToken::generate()` returns 32 lowercase hex characters from `uuid::Uuid::new_v4().simple()`, the same size as LiteLLM's `secrets.token_hex(16)`. Startup makes one per process and passes it to every call, because no module-level state is allowed. `pre_call_marker(&self, token: &PreCallToken) -> Option<String>` is `{token}:{guardrail_name}`, and `None` only when the guardrail has no name. An empty name is used as given. `mark_pre_call_hook_ran(&self, token: &PreCallToken, data: &mut BTreeMap<String, GuardrailValue>)` does nothing without a marker. Otherwise it looks at `metadata`, then `litellm_metadata`, and takes the first of them that is an object. In that object, a list under the key gets the marker appended unless it is already there, and any other value (missing, null or not a list) is replaced by a one-entry list. When neither is an object, `data["metadata"]` is set to a new object holding that one-entry list, replacing whatever `metadata` held. `pre_call_hook_already_ran(&self, token: &PreCallToken, data: &BTreeMap<String, GuardrailValue>) -> bool` is true when the marker is in the list of either object, and false without a marker. The token is why a caller cannot forge the field: the proxy strips the key from client metadata, and a client that tried through the direct SDK path would have to guess a token it never sees.


  File `hook_target.rs`. `HookTarget` is `Own` or `Unified`. `hook_target(&self) -> HookTarget` is `Own` when `switches.uses_apply_guardrail_interface` is off or `switches.use_native_lifecycle_hooks` is on, and `Unified` otherwise (`_deployment_hook_target`). LiteLLM raises `ImportError` here when the proxy extras are missing, and betterlite always has them, so there is no error. `StampedKeyFields { user_id, team_id, end_user_id, api_key, request_route }`, each `Option<String>`, stands for the `UserAPIKeyAuth` the hooks receive, because the full auth type lives in a crate this one can't depend on. `stamped_key_fields(data) -> StampedKeyFields` is `_user_api_key_auth_from_request`. It reads the metadata bucket named by `litellm_metadata` when that key exists in `data` and `metadata` otherwise, and takes the text values of `user_api_key_user_id`, `user_api_key_team_id`, `user_api_key_end_user_id`, `user_api_key_hash` (into `api_key`) and `user_api_key_request_route`. A bucket that is not an object, or a value that is not text, gives `None`.


  `PreCallOutcome` is `Unchanged`, `Data(BTreeMap<String, GuardrailValue>)`, `Text(String)` or `Failure(GuardrailFailure)`, for the four kinds of value `async_pre_call_hook` returns (None, a dict, a string, a returned exception). `DeploymentHookTarget: Sync` is the trait the caller implements for one guardrail. `pre_call(&self, target: HookTarget, key: &StampedKeyFields, data: &mut BTreeMap<String, GuardrailValue>, call_type: CallType) -> impl Future<Output = Result<PreCallOutcome, GuardrailFailure>> + Send` is `target.async_pre_call_hook`. `post_call_success(&self, target: HookTarget, key: &StampedKeyFields, data: &mut BTreeMap<String, GuardrailValue>, response: GuardrailValue) -> impl Future<Output = Result<Option<GuardrailValue>, GuardrailFailure>> + Send` is `target.async_post_call_success_hook`. `Own` means the guardrail's own hook. `Unified` means the unified guardrail runs this guardrail, which replaces LiteLLM's `guardrail_to_apply` key in the request, so nothing writes that key. B3680 builds the `Unified` side, and this task must not depend on it. `CallType` is `betterlite_core::routes::CallType` (B207).


  File `hooks.rs`. `pre_call_deployment_hook<H: DeploymentHookTarget>(&self, hooks: &H, token: &PreCallToken, suppressed: &BTreeSet<String>, kwargs: BTreeMap<String, GuardrailValue>, call_type: Option<CallType>) -> Result<BTreeMap<String, GuardrailValue>, DeploymentHookError>` is `async_pre_call_deployment_hook`. It returns `kwargs` untouched unless every step passes, in this order. The `guardrails` key must be a list. `pre_call_hook_already_ran` must be false. `should_run_guardrail(&kwargs, GuardrailEventHooks::PreCall, suppressed)` from B3665 must be true, and its error is returned, never turned into false. The call type must be `Completion` or `Acompletion`. Then it calls `hooks.pre_call` with `hook_target()`, `stamped_key_fields(&kwargs)`, `&mut kwargs` and that call type. Only a `Data` outcome matters: when its `messages` key exists and is not null, `kwargs["messages"]` is replaced by it. The other outcomes change nothing, which is what LiteLLM's `isinstance(result, dict)` does.


  `post_call_success_deployment_hook<H: DeploymentHookTarget>(&self, hooks: &H, suppressed: &BTreeSet<String>, request_data: &mut BTreeMap<String, GuardrailValue>, response: GuardrailValue) -> Result<Option<GuardrailValue>, DeploymentHookError>` is `async_post_call_success_deployment_hook`. `None` unless `guardrails` is a list and the gate with `GuardrailEventHooks::PostCall` is true. Then it calls `hooks.post_call_success` and returns what comes back. LiteLLM's `call_type` argument is never read, so it is dropped, and `_is_valid_response_type` has no Rust form, because the trait already returns a response and a `None` is the only invalid value. `DeploymentHookError` is the module's thiserror enum with `Selection(#[from] GuardrailSelectionError)` and `Hook(#[from] GuardrailFailure)`.


  `pre_call_hook_on_messages<H: DeploymentHookTarget>(&self, hooks: &H, request_data: &BTreeMap<String, GuardrailValue>, messages: &[GuardrailValue]) -> Result<Vec<GuardrailValue>, MessagesHookError>` is `async_pre_call_hook_on_messages`, which the vector store hook calls to scan retrieved content. It builds `scan_request` from every entry of `request_data` except the nine content keys `messages`, `input`, `prompt`, `system`, `instructions`, `tools`, `functions`, `function_call` and `tool_choice`, then sets `messages` to the given list. For `HookTarget::Unified` it also sets `litellm_metadata` to the metadata bucket (the one `stamped_key_fields` picks) when that bucket is an object. Build the key fields from `scan_request` after that, not from `request_data`. Call `hooks.pre_call` with `CallType::Acompletion`. `Unchanged` returns the given messages. `Data` returns its `messages` when that is a list, and the given messages otherwise. `Text(message)` is `MessagesHookError::Rejected`. `Failure(failure)` is `Failed`. An `Err` from the hook is `Failed`, except `GuardrailFailure::SensitiveDataRoute`, which becomes `Rejected` with the message `{name} asked to reroute the request to {route_to_model} over retrieved content; a request cannot be rerouted after retrieval, so it was blocked`, where `name` is the failure's guardrail name or else this guardrail's name (`None` prints as `None`). Both variants carry `guardrail_name: Option<String>` and `event_hook: Option<LitellmParamsMode>` copied from the settings, because the caller turns `Rejected` into a 400 with detail `{"error": message}` and adds both values to the detail when set (B3663's `pre_call_rejection` and `enrich_http_exception_with_guardrail_context` live in betterlite-server, which this crate can't call).


  File `logging_hook.rs`. `logging_hook<T, G>(&self, guardrail: &G, registry: &TranslationRegistry<T>, kwargs: BTreeMap<String, GuardrailValue>, result: &GuardrailValue, result_kind: LoggedResultKind, call_type: &str) -> Result<BTreeMap<String, GuardrailValue>, LoggingHookError>` is `async_logging_hook` and returns the new `kwargs`, since the result is never changed. `T: BaseTranslation` and `TranslationRegistry` come from B3679 and B3661, and `G` is the guardrail value the translation takes, as B3661's trait declares. `LoggedResultKind` is `ModelResponse` or `Other`, because Rust can't test `isinstance(result, ModelResponse)` on a `GuardrailValue`. The caller has already asked the gate with `logging_only`, so this method doesn't. It returns `kwargs` untouched, in this order, when `switches.uses_apply_guardrail_interface` is off, when `event_hook_is_event_type(logging_only)` (B3665) is false, when `call_type` does not parse as a `CallType`, and when the registry has no entry for it (a `debug!` for the last two, with the text `Guardrail {name}: no guardrail translation for call_type={call_type}, skipping logging_only scan`).


  Then `response` is `async_complete_streaming_response` from `kwargs`, else `complete_streaming_response`, else `result`, where a missing or null key moves to the next. The output translation is the registry entry for `Acompletion` when the response is a model response (`result_kind` is `ModelResponse`, and a streaming key counts as one), otherwise the same entry as the input; a missing `Acompletion` entry is `LoggingHookError::NoOutputTranslation`. `scratch_metadata` is `kwargs["litellm_params"]["metadata"]` without the key `standard_logging_guardrail_information`, and a missing or null level reads as an empty object. `scratch_request` holds, with null for anything absent: `model` and `litellm_call_id` from `kwargs`, `messages` and `input` both set to a copy of `kwargs["messages"]` else `kwargs["input"]`, `tools` from `kwargs["optional_params"]["tools"]`, and `metadata` set to `scratch_metadata`. The scan calls the input translation's `process_input_messages` on `scratch_request`, and then, when `response` exists, the output translation's `process_output_response` with a copy of the response and `scratch_request` as `request_data`, passing nothing for the logging object and the key. A scan error is one `warn!` with `Guardrail {name}: logging_only scan raised: {error}` and the hook goes on with whatever was recorded. Python shares one dict between `scratch_metadata` and `scratch_request`, so read the record back from `scratch_request["metadata"]["standard_logging_guardrail_information"]` after the scan.


  The record is the value under that key, and a missing, null or empty one returns `kwargs` untouched, as does a `standard_logging_object` that is not an object. Otherwise the entries are the record when it is a list and a one-entry list of it otherwise. The result is `kwargs` with `standard_logging_object` replaced by a copy whose `guardrail_information` is the old list (missing or null counts as empty) followed by the entries. An old value that is neither a list nor null is `LoggingHookError::ExistingNotList`. `LoggingHookError` also has `NotObject { field }` for a `litellm_params`, `metadata` or `optional_params` value that is neither an object nor null. Use `to_value` and `from_value` for conversions and never bytes, because the workspace turns on serde_json's `arbitrary_precision` and bytes into `GuardrailValue` mangle floats.


  Oracle helper. The task's operation takes `function`, `guardrail_name`, `event_hook`, `default_on`, `only_scan_new_messages`, `mask_request_content`, `mask_response_content` and `data`, and the functions are `scan_filter` (with `texts` and `cached`), `scan_mark` (with `texts` and `existing`, answering the stored list), `mark_pre_call`, `already_ran`, `stamped_key_fields`, `deployment_pre` (with `kwargs`, `call_type` and `suppressed`) and `deployment_post` (with `request_data` and `suppressed`). Both sides answer `{result: <value>}`. The Python side builds `CustomGuardrail` (a subclass whose `async_pre_call_hook` returns `{"messages": [{"role": "user", "content": "hooked"}]}` and whose `async_post_call_success_hook` returns a `ModelResponse`), sets `custom_guardrail._PRE_CALL_EXECUTED_TOKEN` to `fixed-token` for the call, uses an in-memory `DualCache` seeded from `cached` or `existing`, and sets `_suppressed_compression_guardrails` from `litellm.proxy.guardrails.auto_router_compression` the way B3665's helper does. `deployment_post` answers true when the hook returned a response. The Rust adapter implements `ScanCacheStore` with a map and `DeploymentHookTarget` with a fixed `Data` outcome. Copy each helper case into `tools/oracle/fuzz/corpus/helper_case/` with the prefix `guardrail_session_hooks-`. Native tests live in `guardrail_scan_cache::tests` and `guardrail_deployment::tests` with the name prefixes in the check filters below.
