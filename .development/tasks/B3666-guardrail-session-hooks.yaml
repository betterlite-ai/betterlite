deviations:
  - what: The pre-call deployment hook does not leave a `guardrail_to_apply` key in the request kwargs, where LiteLLM leaves its guardrail object there for the unified path.
    why: The guardrail object can't live in a `GuardrailValue` map, so `DeploymentHookTarget` receives which guardrail runs through its own receiver.
  - what: The on-messages scan returns a typed `Rejected` or `Failed` error with the guardrail name and event hook, where LiteLLM raises an `HTTPException` it has already filled in.
    why: The HTTP error types live in betterlite-server, which this crate can't depend on, so the caller builds the 400 from the error.
out_of_scope:
  - "`_is_valid_response_type` and the module-level `dc` DualCache have no Rust form. The hook trait returns a response type, and each target holds its own cache."
  - B3665 owns should_run_guardrail and the other request gates. This task calls the gate and passes `suppressed` through from the caller, and B3546 supplies the names.
  - B3664 owns the invocation records that the `logging_only` scan writes into the scratch request, and B5471 owns the base settings, GuardrailFailure and session_id_from_request.
  - B3680 builds the unified guardrail that implements `HookTarget::Unified`, and this task must not depend on it.
  - B5470 owns every function of litellm/proxy/guardrails/_content_utils.py, and walk_user_text there has no caller at the pin.
  - The loops that call these hooks for every callback (async_pre_call_deployment_hook and async_post_call_success_deployment_hook in litellm/utils.py, the logging loop in litellm_logging.py, ProxyLogging in litellm/proxy/utils.py and the policy pipeline executor) belong to their own tasks. They own the calls to mark_pre_call_hook_ran and the gate for `logging_only`.
  - B3727 owns the Bedrock code that calls the scan cache, and the vector store hook that calls the on-messages scan is its own task's.
  - B3663 owns enrich_http_exception_with_guardrail_context and pre_call_rejection in betterlite-server.
pitfalls:
  - A masking guardrail must never use the scan cache, because scanning only new texts skips the old ones and a rewrite would then miss them.
  - mark_texts_scanned runs only after the guardrail let the request through, so a blocked text is never stored and a retry scans it again.
  - The key says `None` for an unnamed guardrail, so two unnamed guardrails share one list in a session, and that is LiteLLM's behavior to keep.
  - A cache read failure in filter means "scan everything", and the same failure in mark loses nothing but a skipped future scan, so neither may raise.
  - The marker holds a per-process secret token, so a marker from a client body or another process must never count, and tests use `PreCallToken::new` with a fixed string.
  - mark_pre_call_hook_ran stops at the first object bucket, but pre_call_hook_already_ran checks both, so a marker written to `metadata` is still found when `litellm_metadata` also exists.
  - The deployment hook reads `guardrails` from the top level of kwargs, because the router spreads a deployment's model-level list there, and a missing `guardrails` list means the proxy hook already handled it.
  - should_run_guardrail can return the tag-mode error, which must reach the caller. Treating it as false would let a configured guardrail go silent.
  - The on-messages scan builds the key fields after the `litellm_metadata` copy, so for `Unified` a request that used `metadata` now reads its fields from the copy.
  - The reroute rejection applies only to an `Err` from the hook. A `SensitiveDataRoute` returned inside `PreCallOutcome::Failure` is raised as it is.
  - The logging hook must scan copies, since the guardrail edits its inputs in place and the real logged request must not change.
  - The record from the `logging_only` scan is read from the scratch request, because Rust has no dict shared with `scratch_metadata`.
  - The output translation is the `Acompletion` one for any model response, even when the call type is an embedding or a speech call.
  - "`logging_only` runs after the response, so a scan error must only warn. Raising would fail a request that already finished."
