dod:
  - text: A missing env var gives a TTL of 86400, a trimmed integer is used as given, and text that is not an integer is a config error naming the variable.
    proof: [scan-section-tests]
  - text: The cache key and hash match LiteLLM, including `None` for a guardrail without a name.
    proof: [filter-tests, oracle, helper-python]
  - text: filter gives `None` for a feature that is off, no texts, masking on, no session id and a failed read, and the masking case warns.
    proof: [filter-tests, oracle, helper-python]
  - text: filter returns only the texts whose hash is not stored, in order, and an empty list when all were seen.
    proof: [filter-tests, oracle, helper-python]
  - text: mark does nothing for the same four early exits, merges new hashes after the stored ones without repeats, writes with the given TTL, and a failing store never fails the call.
    proof: [mark-tests, oracle, helper-python]
  - text: The marker is `{token}:{name}`, absent without a name, and appended to the list in `metadata` first, then `litellm_metadata`, replacing a non-list value.
    proof: [marker-tests, oracle, helper-python]
  - text: With no object bucket the marker creates `metadata`, and already_ran sees a marker in either bucket and ignores one with another token.
    proof: [marker-tests, oracle, helper-python]
  - text: Key fields come from `litellm_metadata` when that key exists and from `metadata` otherwise, and a non-text value gives `None`.
    proof: [stamped-tests, oracle, helper-python]
  - text: hook_target gives `Own` unless the guardrail uses the apply interface without native lifecycle hooks.
    proof: [stamped-tests]
  - text: The pre-call deployment hook returns kwargs untouched without a `guardrails` list, after a marker, when the gate says false and for call types other than the two completions, and replaces `messages` when the hook returns them.
    proof: [pre-hook-tests, oracle, helper-python]
  - text: A suppressed name and a tag-based hook stop the pre-call hook before the provider hook runs, the first by skipping and the second with the gate's error.
    proof: [pre-hook-tests, oracle, helper-python]
  - text: The post-call deployment hook gives `None` without a `guardrails` list or when the gate says false, and returns the hook's response otherwise.
    proof: [post-hook-tests, oracle, helper-python]
  - text: The on-messages scan drops the nine content keys, adds `litellm_metadata` only for `Unified`, and builds the key fields after that.
    proof: [messages-hook-tests]
  - text: The on-messages scan maps each outcome as described, turns `SensitiveDataRoute` into a rejection with the reroute message, and carries the guardrail name and event hook.
    proof: [messages-hook-tests]
  - text: The logging hook skips for a guardrail without the apply interface, without `logging_only`, with an unknown call type and with no registry entry.
    proof: [logging-hook-tests]
  - text: The logging hook scans copies, drops the old record from the scratch metadata, reads the record back from the scratch request, and appends it to `guardrail_information` after the old entries.
    proof: [logging-hook-tests]
  - text: A scan error is logged and the hook still returns kwargs, and a missing record or `standard_logging_object` returns kwargs untouched.
    proof: [logging-hook-tests]
  - text: Newly added helper corpus cases replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: scan-section-tests
      why: the TTL env var is missing or accepts text LiteLLM rejects
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_scan_cache::/)'
    - id: filter-tests
      why: a text is scanned twice, skipped by mistake, or the early exits differ
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_scan_cache::tests::filter_/)'
    - id: mark-tests
      why: scanned hashes are lost, repeated or written with the wrong TTL
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_scan_cache::tests::mark_/)'
    - id: marker-tests
      why: a guardrail runs twice or a forged marker suppresses it
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_deployment::tests::marker_/)'
    - id: stamped-tests
      why: key fields come from the wrong bucket or the hook target is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_deployment::tests::stamped_/)'
    - id: pre-hook-tests
      why: the pre-call deployment hook runs in the wrong order or at the wrong time
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_deployment::tests::pre_hook_/)'
    - id: post-hook-tests
      why: the post-call deployment hook skips the gate or drops the response
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_deployment::tests::post_hook_/)'
    - id: messages-hook-tests
      why: the retrieval scan keeps content keys or maps an outcome to the wrong error
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_deployment::tests::messages_hook_/)'
    - id: logging-hook-tests
      why: the logging_only scan changes the logged call or loses its record
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_deployment::tests::logging_hook_/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3666)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3666 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3666/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added session and hook cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/guardrail_session_hooks-*")" &&
        grep -lE '^[[:space:]]+b3666:' tools/oracle/fuzz/corpus/helper_case/guardrail_session_hooks-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
