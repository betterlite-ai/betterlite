id: B1230
title: Remove unbacked team model aliases
description: >-
  Remove obsolete team model grants only after checking configured and stored sibling deployments. Preserve
  public-name backing checks and exact alias deletion; return affected teams for cache invalidation. This
  helper is used by delete_model and team assignment updates, and never calls either HTTP handler.


  Build the production team_model_cleanup module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_management_endpoints.py:
  delete_team_model_alias (L2313-L2347; 31 source lines), _get_team_deployments (L1734-L1766; 28 source
  lines), _get_team_public_model_names (L1812-L1831; 19 source lines), _remove_unbacked_team_models (L1834-L1907;
  67 source lines).


  Add the team_model_cleanup operation under B856 Management::teams. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a team-model-cleanup-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 145 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  145 production, 142 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 382 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
