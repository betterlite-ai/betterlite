    why: Full initialization and loader logic, including optional-parameter mutation and settings extraction.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L631-L699
    why: _prepare_request implementation including endpoint construction, request signing with SigV4, and header setup.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L415-L440
    why: _async_post_action sending signed requests and error handling.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L1-L100
    why: BaseAWSLLM base class and _get_boto_credentials_from_optional_params ownership (B595).
  - url: https://docs.rs/httpx/latest/httpx/
    why: HTTP client for signing and sending Secrets Manager requests.
  - url: https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
