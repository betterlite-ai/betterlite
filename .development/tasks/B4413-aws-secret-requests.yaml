id: B4413
title: Prepare and send AWS Secrets Manager actions
description: >-
  Build the AWS Secrets Manager client initialization, environment validation, and request signing.
  Implement `AWSSecretsManagerV2.__init__` to store instance authentication settings (region, role, profile,
  web identity token, STS endpoint, replica regions, KMS key). Store bootstrap inputs from key_management_settings
  and validate region availability through environment variables or constructor parameters, warning only when none exist.
  Implement `load_aws_secret_manager` as a module-level loader that instantiates the client and registers it
  with litellm.secret_manager_client and litellm._key_management_system, accepting the use_aws_secret_manager flag
  and key_management_settings from config. Preserve optional-parameter mutation and consumption patterns:
  _prepare_request builds optional_params from instance settings if not provided, then must call
  BaseAWSLLM._get_boto_credentials_from_optional_params to obtain Boto3CredentialsInfo (region and credentials).
  Build _prepare_request to construct the Secrets Manager endpoint URL with partition-aware domain suffix,
  replace bedrock-runtime with secretsmanager if using a custom endpoint, select request data by truthiness
  of request_data parameter, and sign the POST JSON request with SigV4 using service `secretsmanager`,
  Content-Type `application/x-amz-json-1.1`, and X-Amz-Target header `secretsmanager.<action>`.
  Implement _async_post_action to call _prepare_request, obtain an async httpx client, POST the signed request,
  and handle HTTP status errors and timeouts. This task owns the class declaration, imports, module documentation
  and type-checking imports, and must not import B129 or call get_secret directly to avoid a credential cycle.
scope:
