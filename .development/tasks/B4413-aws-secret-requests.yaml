dod:
  - text: >-
      AWSSecretsManagerV2.__init__ stores all AWS authentication settings from parameters without validation,
      and load_aws_secret_manager instantiates the client with settings from key_management_settings.
    proof: [aws-init-tests]
  - text: >-
      validate_environment warns when AWS_REGION_NAME, AWS_REGION, and AWS_DEFAULT_REGION are all absent,
      but does not fail initialization.
    proof: [aws-init-tests]
  - text: >-
      _prepare_request calls self._get_boto_credentials_from_optional_params (injected through caller),
      and when using a custom endpoint, replaces literal bedrock-runtime with secretsmanager.
    proof: [aws-request-signing-tests]
  - text: >-
      _prepare_request selects endpoint URL from explicit_runtime_endpoint (with bedrock-runtime replacement)
      or constructs https://secretsmanager.<region>.<dns_suffix> with get_aws_dns_suffix from B198.
    proof: [aws-request-signing-tests]
  - text: >-
      Request body is JSON-serialized, request_data is selected by truthiness, and POST JSON is signed
      with SigV4 using service secretsmanager, Content-Type application/x-amz-json-1.1,
      and X-Amz-Target secretsmanager.<action>.
    proof: [aws-request-signing-tests]
  - text: >-
      _async_post_action calls _prepare_request, posts to the endpoint with httpx async client from B173,
      and raises ValueError on HTTP status error or timeout.
    proof: [aws-request-signing-tests]
  - text: >-
      optional_params in _prepare_request accumulates instance settings if not already provided (using truthiness),
      preserving the source pattern of mutation and consumption.
    proof: [aws-request-signing-tests]
checks:
  optional: [mutants]
  commands:
    - id: aws-init-tests
      why: initialization and loader tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_client_init::aws_secrets_manager_tests_behavior($|::)/) - test(/replays_the_/)'
    - id: aws-request-signing-tests
      why: request signing and post-action tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws_request_signing::(prepare_request|async_post_action)_tests_behavior($|::)/) - test(/replays_the_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - >-
    BaseAWSLLM._get_boto_credentials_from_optional_params is owned by B595 (bedrock-signing).
    LiteLLM's _prepare_request calls it directly, but betterlite must avoid a credential cycle:
    get_secret → AWS dispatch → _prepare_request → B595 → get_secret.
    B4413's caller (B4414 or B4415, once it depends on B595) supplies resolved credentials to _prepare_request
    as an injected parameter (Boto3CredentialsInfo with region and credentials), so _prepare_request receives
    them without importing B595 or calling get_secret directly. This resolves architect question 1.
  - >-
    B4413 imports get_secret_str only for AWS_BEDROCK_RUNTIME_ENDPOINT (bootstrap lookup outside the cycle).
    Full secret resolution for live secrets belongs to B4421 (dispatch).
  - >-
    Virtual-key hooks, primary-secret lookup and rotation are owned by B4414 and B4415.
  - >-
    Python native dispatch through rust_bridge is not built; oracle cases run without the native path.
pitfalls:
  - >-
    optional_params is mutated in place in _prepare_request: each instance setting overwrites
    optional_params[key] only if optional_params does not already have that key. A caller must not
    reuse optional_params across multiple _prepare_request calls expecting instance settings to apply.
  - >-
    The five bootstrap names (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION_NAME, AWS_REGION,
    AWS_BEDROCK_RUNTIME_ENDPOINT) are used only by sync readers to avoid a cycle; do not extend this list
    to other AWS environment variables.
  - >-
    Endpoint URL bedrock-runtime replacement is a literal string match on a custom endpoint value;
    if explicit_runtime_endpoint is None or empty, the partition-aware default URL is constructed instead.
  - >-
    X-Amz-Target header format is secretsmanager.<action> (e.g., secretsmanager.GetSecretValue),
    not bedrock service names; ensure SigV4 signs with service secretsmanager.
  - >-
    request_data is selected by truthiness: if request_data is provided and non-empty, it is used;
    otherwise a minimal dict with SecretId is built and secret_value is added only for PutSecretValue.
review_level: security
