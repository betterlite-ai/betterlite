id: B972
title: Messages compaction
description: >-
  Execute compact_20260112 through B014 using summary-model-access, summary-model-limits and summary-history. Preserve
  source iteration/abort behavior, applied_edits and usage accounting, including failed summary requests and source
  warning/fallback outcomes; expose the editor seam consumed by messages-context-clear. Keep default trigger 150000
  tokens, minimum trigger 50000, max summary tokens 4096 and summary timeout 60 seconds; summary failure follows
  the source warning/fallback path, preserving the uncompacted request.


  Implement crates/betterlite-core/src/api/messages_compaction.rs. Use MessagesCompactionInput and MessagesCompactionResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions compact_trigger_not_met, compact_summary_call, summary_error_fallback,
  abort_after_compaction, summary_usage_attribution under api::messages_compaction::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.DEFAULT_MAX_TOKENS
  defaults to 4096. No environment reads occur outside betterlite-config. Test api::messages_compaction::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesCompaction in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_compaction: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _call_summary_model
  (L1019-L1081); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _extract_response_text
  (L1084-L1102); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _extract_usage (L1105-L1111);
  litellm/llms/anthropic/pass_through/context_management/editors/compact.py: apply_compact_20260112 (L1160-L1380).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 217 owned nonblank/non-comment/non-docstring Python lines (228 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 237 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 520 total within the 520-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B968 (Messages context clear), B969 (Summary model access), B970
  (Summary model limits), B971 (Summary history), B1087 (Api boundaries), B002 (Load LiteLLM config.yaml into typed
  config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain
  ownership on the provider and keys/data branches.
