id: B972
title: Dispatch context edits in request order
description: >-
  Own dispatcher.py as a whole, moved out of B968 to remove its reverse dependency on compaction execution.
  The editor registry has exactly clear_tool_uses_20250919 (B968) and compact_20260112 (B2432). Normalize native
  dict specs or OpenAI list specs through B2201, run edits serially, carry messages/system forward and concatenate
  applied edits. Keep the last non-null compaction block and iterations_usage separately; iterations are replaced,
  not accumulated. B2432 owns all former compact.py execution functions and remains a prerequisite of this id.

  Implement api::messages_compaction with a closed typed editor dispatch. Clear token counting stays off the
  async executor and summary execution is awaited. HelperCall::ContextEditDispatch covers normalization and
  deterministic orchestration with typed injected editor results, including the legacy tuple wrapper. It cannot
  supply arbitrary functions. SdkHttpCall::ContextEditDispatch runs the real registered editors with B2401 so
  summary-provider traffic is captured. This dispatcher adds no settings, environment reads or byte parser.
  Own 108 nonblank/non-comment dispatcher implementation lines; estimate 140 implementation, 110 tests, 110 fixtures,
  120 adapters and 30 wiring, 510 total.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/messages_compaction.rs
  - crates/betterlite-core/src/api/messages_compaction/**
  - tools/oracle/src/helpers/core_ops/context_edit_dispatch.rs
  - tools/oracle/src/helpers/core_ops/context_edit_dispatch/**
  - tools/oracle/helpers/context_edit_dispatch.py
  - tools/oracle/helpers/context_edit_dispatch/**
  - tools/oracle/cases/helpers/context-edit-dispatch/**
  - tools/oracle/fuzz/corpus/helper_case/context_edit_dispatch-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/context_edit_dispatch.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/context_edit_dispatch.py
  - tools/oracle/cases/sdk-http/context-edit-dispatch/**
  - tools/oracle/fuzz/corpus/sdk_http_case/context-edit-dispatch-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/dispatcher.py#L19-L151
  why: Own normalization, tuple conversion and the entire serial editor dispatcher without splitting its argument list.
dod:
- text: >-
    normalize_context_edit_shapes gives null,{},edits=null,edits=[],edits="bad" and gets no edits; edits=[7,{},
    {type:clear_tool_uses_20250919}] retains only the two dicts. OpenAI [{type:compaction,compact_threshold:60000.9}]
    becomes compact_20260112 with trigger={type:input_tokens,value:60000}; explicit trigger overrides the generated
    one through B2201. Unknown OpenAI list types are discarded by B2201, whereas native unknown dict edits reach dispatch.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    unknown_edits_preserve_state sends native edits with type=future,type=7 and missing type. Skip each with debug
    "context_management polyfill: unknown edit type 'future' — skipping", substituting '7' and 'None'. Return
    original messages/system, applied_edits=[],compaction_block=null,iterations_usage=null without invoking an editor.
    No-edits input returns the same result without unknown-type diagnostics.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    serial_editor_result_flow scripts clear returning tuple(messages=M1,applied=null), compact returning
    messages=M2,system=S2,applied=[C],block=A,iterations=[I], then clear returning (M3,D). Each sees the previous
    messages/system and the same model/tools. Sync clear receives no litellm_metadata,llm_router,user_api_key_auth;
    async compact receives all three. Final result is M3,S2,[C,D],A,[I]. A legacy tuple with applied={} keeps [{}]
    and uses the incoming system, while an existing PolyfillResult preserves its own null system.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    latest_nonnull_compaction_fields scripts three results with (block=A,iterations=[I]),(null,null),(block=B,
    iterations=[]). Final fields are B,[]; applied edits concatenate all three in order. A later block may replace
    the block without replacing earlier usage if its iterations_usage is null. Editor errors propagate and stop
    later edits; the dispatcher does not translate status/message or perform best-effort recovery.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    registered_summary_editor_http sends native edits=[{type:compact_20260112,trigger:{type:input_tokens,value:50000}}]
    with count=50001, summary model=gpt-4o-mini and a mock <summary>S</summary> completion. Expect one POST
    /v1/chat/completions with B2432's 4096-token summary request and returned block={type:compaction,content:S},
    one compaction applied edit and one usage iteration. A clear-then-compact case verifies the summary request
    contains "[Cleared by context management]" for a cleared old tool result. No helper case sends that HTTP.
  proof: [behavior-tests, oracle, python-adapters]
- text: New pure-dispatch and HTTP fixtures have operation-tag seeds for both existing decoders.
  proof: [new-cases, corpus, oracle, python-adapters]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: edit order or result replacement is not tested through the dispatcher
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_compaction::/)'
  - id: python-adapters
    why: dispatch or real-editor parity lacks a checked Python adapter
    run: test -f tools/oracle/helpers/context_edit_dispatch.py && test -f tools/oracle/sdk_http/context_edit_dispatch.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpus
    why: a dispatch operation is absent from its shared decoder
    run: grep -qE '^[[:space:]]+context_edit_dispatch:' tools/oracle/fuzz/corpus/helper_case/context_edit_dispatch-* && grep -qE '^[[:space:]]+context_edit_dispatch:' tools/oracle/fuzz/corpus/sdk_http_case/context-edit-dispatch-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus) | test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: one of the two independent dispatch fixture families is missing
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/context-edit-dispatch)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/context-edit-dispatch)"
