deviations: []
out_of_scope:
- B2432 owns _call_summary_model,_extract_response_text,_extract_usage,apply_compact_20260112 in compact.py L1019-L1111,L1160-L1380.
- B969 owns compact.py L97-L392; B970 L395-L627; B971 L73-L92,L630-L1016,L1114-L1157. No compact.py function is duplicated here.
- B968 owns clear_tool_uses.py,constants.py,errors.py,placeholders.py,result.py and B2201 owns OpenAI-to-Anthropic context spec mapping.
- B973 owns the best-effort boundary around this dispatcher and B081 the client error envelope.
pitfalls:
- 'The oracle helper for this task is pre-registered as context_edit_dispatch in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/context_edit_dispatch.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/context_edit_dispatch.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The most recent non-null usage list wins even when it is empty; adding usage across editors changes the response.
- Native unknown edits log and skip, while OpenAI unknown list entries disappear during normalization.
- The legacy clear tuple preserves system from the preceding editor, not from the original request.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
