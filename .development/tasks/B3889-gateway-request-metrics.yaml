oracle_cases: []

deviations:
  - what: Betterlite uses a Sync trait bound for factories instead of Python's callable. Both defer initialization to the first request.
    why: Rust requires explicit thread-safety bounds; a factory function that returns an optional sink/recorder preserves the lazy-resolution pattern with explicit types.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/billable_request_metrics_middleware.py#L201-L222
  - what: Betterlite logs sink and recorder failures with structured JSON tracing, not Python's verbose_proxy_logger.
    why: All betterlite errors use the tracing crate for consistent JSON output to stderr.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/billable_request_metrics_middleware.py#L277-L285
  - what: Enterprise billing recorder is not built; only the open-source gateway request sink is wired.
    why: Betterlite has no paid tier and does not include LiteLLM's enterprise package.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/middleware/billable_request_metrics_middleware.py#L281-L285

out_of_scope:
  - BillingRecorder implementation for enterprise metering; only the protocol contract is defined.
  - GatewayRequestSink implementation; this task defines the protocol and the middleware that calls it.
  - HTTP server setup and ASGI installation; that is in B003.
  - Configuration loading for sink and recorder factories; the server initializes them.
  - Persistence of gateway request records; the sink owns storage.

pitfalls:
  - The LLM route suffixes must be checked in order (longest first) to avoid matching /completions before /chat/completions.
  - Provider passthrough prefixes come from LiteLLMRoutes.mapped_pass_through_routes and include /bedrock/, /vertex-ai/, /vllm/, /cohere/ etc. but exclude /langfuse explicitly.
  - MCP dynamic transport is a regex pattern /(?:toolset/)?[^/]+/mcp that matches /agent-name/mcp and /toolset/agent-name/mcp.
  - The /v1/mcp/ management prefix is excluded from MCP classification; only deep /v1/mcp/ paths with a resource are classified.
  - A2A message/send is path-based only; the JSON-RPC method in the body is not inspected, so bare POST /a2a/{agent_id} without /message/send is not billable.
  - Status code 2xx is the range 200–299 inclusive; 300 and 400 are not billable for the recorder.
  - The x-litellm-model-id header name is lowercase in the middleware search; header names are compared case-insensitively.
  - Recorder and sink factory resolution use a lock to prevent concurrent first requests from building duplicate instances.
  - The method==POST gate applies to LLM classification only (lines 174-175 in the source); MCP (/v1/mcp, /mcp) and A2A (/v1/a2a, /a2a + /message/send) classification run before that gate at lines 163-169 and accept any method. A GET request to /mcp/foo classifies as MCP while a GET to /chat/completions returns None.
  - When no classification matches, classify_billable_request returns None and the request passes through without metering.
  - Stripping trailing slashes from the path (path.rstrip("/") or "/") normalizes /route/ to /route before classification.

