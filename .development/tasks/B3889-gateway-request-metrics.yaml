dod:
  - text: LLM routes are classified exactly for /v1/messages and /interactions, by suffix for /chat/completions and 14 others, and by passthrough prefix for provider routes, all excluding /langfuse.
    proof: [llm-classification-tests]
  - text: MCP routes are classified as /mcp for /mcp, /mcp/, /mcp-rest/tools/call and the dynamic transport pattern, and excluded for /v1/mcp management.
    proof: [mcp-classification-tests]
  - text: A2A routes are classified as /a2a for paths ending in /message/send under /v1/a2a/ or /a2a/ prefixes.
    proof: [a2a-classification-tests]
  - text: MCP and A2A classification runs before the method gate and ignores HTTP method; GET /mcp/foo classifies as MCP and GET /a2a/{id}/message/send classifies as A2A.
    proof: [method-gate-tests]
  - text: LLM classification is gated on method=="POST"; GET /chat/completions and GET /bedrock/... return None from classify_billable_request.
    proof: [method-gate-tests]
  - text: Requests that do not match any classification return None from classify_billable_request.
    proof: [classification-integration-tests]
  - text: The x-litellm-model-id header is extracted from response headers and passed to the recorder, or None if absent.
    proof: [header-extraction-tests]
  - text: The recorder factory is called exactly once on the first classified request and cached; concurrent first requests do not double-build the recorder.
    proof: [lazy-resolution-tests]
  - text: The sink factory is called exactly once on the first classified request and cached; concurrent first requests do not double-build the sink.
    proof: [lazy-resolution-tests]
  - text: When both recorder and sink are None, the middleware passes through the request without classification overhead.
    proof: [pass-through-tests]
  - text: Sink failures log a warning and do not block the response or raise an exception.
    proof: [failure-handling-tests]
  - text: Recorder failures log a warning and do not block the response or raise an exception.
    proof: [failure-handling-tests]
  - text: The recorder is called only when status code is 2xx; sink is called for all classified status codes.
    proof: [status-code-filtering-tests]

