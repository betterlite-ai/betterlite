id: B3889
title: Gateway request classification and metrics middleware
description: >-
  Port the gateway request classifier and metrics middleware from litellm/proxy/middleware/billable_request_metrics_middleware.py
  into crates/betterlite-server so the proxy can track successful gateway requests (SGR) by category, route and status code,
  and feed 2xx inference requests to an optional billing exporter. The middleware classifies every HTTP request into one of
  three billable categories (LLM, MCP, A2A) or marks it unclassified, then delivers the classification and response status
  to an injected sink after the response completes.

  The LLM route classifier matches inference endpoints by exact route (/v1/messages, /interactions), suffix (/chat/completions,
  /completions, /embeddings and 14 others), or provider passthrough prefix (/bedrock/, /vertex-ai/ and others excluding /langfuse).
  The MCP classifier recognizes /mcp/, /mcp-rest/tools/call and the dynamic transport pattern, excluding /v1/mcp management.
  The A2A classifier matches paths ending in /message/send under /v1/a2a/ or /a2a/ prefixes. A request that matches none of
  these routes is not billable and passes through unclassified. The response status code and x-litellm-model-id header are
  captured after the response body starts so the metric reflects what the caller saw.

  Sinks are injected and resolved lazily: a GatewayRequestSink records every classified request with its category, normalized
  route and status code for the SGR dashboard. An optional BillingRecorder is called only for 2xx responses to feed the billing
  exporter; the enterprise recorder is not built. Both resolve on the first classified request, after the server's startup
  event has loaded the config and database, deferring expensive initialization. Sink or recorder failures log a warning and
  never block the request's response. No sink or recorder is a transparent pass-through. The middleware is installed as part
  of B003's server setup and runs before response lifecycle completion.

