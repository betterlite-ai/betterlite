  - crates/betterlite-python/python/betterlite/_native_vector_manage.pyi
  - crates/betterlite-python/python/betterlite/vector_stores/_manage.py
  - crates/betterlite-python/python/betterlite/vector_stores/main.py
  - crates/betterlite-python/python/betterlite/vector_stores/__init__.py
  - crates/betterlite-python/tests/test_vector_manage.py
  lint_tables: false
