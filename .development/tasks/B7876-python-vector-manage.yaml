id: B7876
title: Python vector_stores retrieve, list, update, delete and the package
description: >-
  This is the last part of the vector stores entry. It adds `retrieve`, `list`, `update`, `delete` and their `a` twins
  (`aretrieve`, `alist`, `aupdate`, `adelete`), and it writes `vector_stores/main.py` and `__init__.py`. The Rust work is
  B1065 (read) and B1066 (write).


  Native side, the family `vector_manage`: `src/vector_manage.rs` with `register` that adds `NativeVectorManageSession` and
  `NativeVectorManageError`, with methods `retrieve`, `list`, `update`, `delete` and their `a` twins. Conversion is in
  `src/vector_manage/convert.rs`, tests `request_*` and `error_*`. The architect writes the `lib.rs` lines.


  Python side, `python/betterlite/vector_stores/_manage.py`. Parameters: `retrieve(vector_store_id, extra_headers, extra_query,
  extra_body, timeout, custom_llm_provider, **kwargs)`, `list(after, before, limit, order, ...)`, `update(vector_store_id, name,
  expires_after, metadata, ...)` and `delete(vector_store_id, ...)`. The sync names shadow builtins inside the module, so
  annotations use `builtins.list`. Sync functions accept `aretrieve=True`, `alist=True`, `aupdate=True` and `adelete=True` and
  return a coroutine then. The results are `VectorStore`, `VectorStoreListResponse` and `VectorStoreDeleteResponse` (B167).
  `main.py` re-exports the twelve names of this part and B7875 with an explicit `__all__`, and `__init__.py` re-exports
  the same twelve names, as at the pin. The registry (`vector_store_registry.py`) is Rust
  (B1062), and nothing in Python needs it here.
