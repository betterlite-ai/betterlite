dod:
- text: All eight functions keep LiteLLM's signatures.
  proof: [vm-signature]
- text: Retrieve, list, update and delete give the same objects as LiteLLM against one server, and each sync function returns a coroutine under its flag.
  proof: [vm-calls]
- text: A provider error keeps its class and cause, and `client` raises `UnsupportedCallArgument`.
  proof: [vm-error]
- text: "`betterlite.vector_stores.main` exports the twelve names of both parts."
  proof: [vm-package]
- text: The native register function and conversion have tests without an interpreter.
  proof: [vm-native]
- text: The new Python files pass ruff and strict basedpyright.
  proof: [python-lint]
checks:
  optional: []
  commands:
  - id: vm-signature
    why: A caller's keyword is refused.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_manage.py -k signature
  - id: vm-calls
    why: An object reads back different.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_manage.py -k calls
  - id: vm-error
    why: Error class or client check is wrong.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_manage.py -k error
  - id: vm-package
    why: A name is missing.
    run: uv build --wheel --out-dir target/python-wheel crates/betterlite-python && LITELLM_LOCAL_MODEL_COST_MAP=True uv run --locked --project tools/oracle/litellm --with "$(ls target/python-wheel/betterlite-*.whl)" pytest crates/betterlite-python/tests/test_vector_manage.py -k package
  - id: vm-native
    why: A field changes on the way.
    run: cargo nextest run --locked -p betterlite-python --no-tests=fail -E 'test(/^vector_manage::convert::tests::(request_|error_)/)'
  - id: python-lint
    why: Strict typing has to hold for the vector management calls.
    run: uv run --locked --project tools/oracle/litellm ruff check crates/betterlite-python/python crates/betterlite-python/tests && uv run --locked --project tools/oracle/litellm basedpyright --project crates/betterlite-python/pyrightconfig.json
oracle_cases: []
deviations:
- what: "`client` is refused with `UnsupportedCallArgument`."
  why: A Python HTTP client can't drive the Rust one (B158).
- what: This task has no helper oracle cases.
  why: pytest compares both packages against one local server.
out_of_scope:
- "`create`, `search` and the mock helpers are B7875."
- "litellm/vector_stores/vector_store_registry.py belongs to B1062."
pitfalls:
- "`list` takes `after`, `before`, `limit` and `order`, and `retrieve` and `delete` take no body fields, so keep each signature as it is."
- "A function named `list` in a module that also uses the `list` type is a trap, so use `builtins.list` for every annotation."
- "`update` sends only fields that are not None, so an explicit empty `metadata` dict must still be sent."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
