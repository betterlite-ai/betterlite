id: B3673
title: Native guardrail stream observation and Responses block events
description: >-
  Build the pieces that tell a client "this stream was blocked" and the pieces that
  read a stream already sent to the client. The Responses and Anthropic handler tasks
  (B3671, B3672, B3674 to B3676) call them. Nothing here talks to a guardrail, a provider
  or the network, and every function is pure: ids and the clock come in as arguments.

  Responses block events go in
  crates/betterlite-server/src/guardrails/responses_translation/block_events.rs.
  `BlockStamp { response_id: String, message_id: String, created_at: i64 }` carries the
  values LiteLLM takes from `uuid.uuid4()` and `time.time()` (ids already carry their
  `resp_` and `msg_` prefix), so the caller makes them and tests can fix them. Every
  function below takes `message: &str`, `model: &str` and `original_response:
  Option<&serde_json::Value>` where LiteLLM reads them off the ModifyResponseException,
  because the exception type belongs to another task. `blocked_output_item(message,
  stamp)` is an assistant `message` item: `type` "message", `id` the stamp's message_id,
  `status` "completed", `role` "assistant", `content` one `output_text` part with the
  message and `annotations: []`. `build_blocked_response(message, model,
  original_response, stamp)` is a Responses object with `id` the stamp's response_id,
  `object` "response", `created_at`, `model`, `output` that one item, `status`
  "completed" and `usage` from B3663's `blocked_responses_stream_usage(original_response)`.
  A private `blocked_response` does the same for a given response id, model and item;
  the continuation path reuses it. `build_block_sse_chunks(message, model,
  original_response, stream_started: bool, responses_so_far: Option<&[Value]>, stamp) ->
  Result<Vec<Vec<u8>>, BlockEventError>` returns one chunk per event, each exactly
  `data: <compact json>\n\n`. The JSON leaves out null and unset fields the way
  `model_dump_json(exclude_none=True, exclude_unset=True)` does, and keeps non-ASCII text
  as is. With `stream_started` false the events are B928's synthetic event list for
  `build_blocked_response`, with chunk size `max(character count of message, 1)` (count
  characters, not bytes), no logging object. With `stream_started` true the client has
  already received events, so the list continues the same response (`block_continuation_events`):
  first `open_item_closing_events(responses_so_far)`, then for the new item at
  `output_index` (see `continuation_identity`) and `content_index` 0 these events in
  order: `response.output_item.added` (item), `response.content_part.added` (part
  `output_text`, text, `annotations: []`), `response.output_text.delta` (delta = message),
  `response.output_text.done` (text = message), `response.content_part.done` (part adds
  `logprobs: null`), `response.output_item.done`, and `response.completed` whose response
  is `blocked_response` with the continuation's response id and model and only the new
  item in `output`. `continuation_identity(message, model, responses_so_far)` returns
  (response id, model, output index): the id and model come from the first streamed event
  whose `response` has a non-empty string `id` and `model`, else the stamp's response_id
  and the given model, and the index is the highest integer `output_index` seen plus one
  (0 when none). Items are read with B3663's `stream_item_field`. The module's error
  enum `BlockEventError` (thiserror) covers a JSON serialization failure of an event.
  `build_stream_error_items(status_code: u16, message: &str, responses_so_far:
  Option<&[Value]>) -> Vec<ErrorEvent>` returns one B508 `ErrorEvent` with `error.type`
  "guardrail_error", `error.code` the status as text, `error.message`, `error.param`
  null, and `sequence_number` from `next_stream_sequence_number`. The caller turns the
  HTTP exception into status and message first. `next_stream_sequence_number(
  responses_so_far: Option<&[Value]>) -> i64` scans from the last event backwards and
  returns the first integer `sequence_number` plus one, else 0.

  Open item state goes in
  crates/betterlite-server/src/guardrails/responses_translation/open_item.rs. It finds
  the output item the client saw start but not finish, so the block can close it.
  `OpenItemState { item_id, item_type, role, output_index, content_index, text, part_open,
  payload }` and `open_item_state(responses_so_far: &[Value]) -> Option<OpenItemState>`.
  Take every `response.output_item.added` event whose `output_index` is an integer, and
  drop each one whose index also appears on a `response.output_item.done` event. Use the
  last that remains; none gives None. A None `item`, or an item `id` that is not a
  non-empty string, gives None. `item_type` is the item's `type` when it is a non-empty
  string, else "message"; `role` likewise defaults to "assistant". `content_index` is the
  last `content_index` of a `response.content_part.added` event for that item_id with no
  `response.content_part.done` for the same index, else 0, and `part_open` says whether
  there was one. `text` joins, in order, every string `delta` of the
  `response.output_text.delta` events with that item_id. `incomplete_item_fields(payload)
  -> Map<String, Value>` is the payload as an object, or an empty map when it is not an
  object. `open_item_closing_events(responses_so_far)` returns nothing without an open
  item. For an item whose type is not "message" (a function call the guardrail rejected)
  it returns one `response.output_item.done` at the item's output_index whose item is the
  payload's fields with `status` set to "incomplete", so no client acts on it. For a
  message item it returns, in order and only when `part_open`: `response.output_text.done`
  (text = streamed text, at the item's output_index and content_index), `response.content_part.done`
  (the `output_text` part with the streamed text, `annotations: []`, `logprobs: null`); then
  always `response.output_item.done` carrying the message with `status` "completed", its
  own id and role, and one `output_text` part holding the streamed text (the part is there
  even when the text is empty).

  Stream shape types go in
  crates/betterlite-server/src/guardrails/responses_translation/stream_shapes.rs.
  `ResponseOutputEnvelope { output: Option<Vec<serde_json::Value>>, model: Option<String> }`
  and `ResponsesStreamChunk { r#type: Option<String>, text: Option<String>, delta:
  Option<String>, item_id: Option<String>, output_index: Option<i64>, content_index:
  Option<i64> }` are the two partial views LiteLLM's TypedDicts give the handler: every
  field is optional and unknown keys are ignored. Both derive Clone, Debug, Default,
  PartialEq and Deserialize. B3671 and B3672 read their input through them.

  Anthropic stream events go in
  crates/betterlite-server/src/guardrails/anthropic_translation/sse_events.rs.
  `SseChunk` is the Anthropic stream item: `Bytes(Vec<u8>)`, `Event(Map<String, Value>)`
  (an already parsed event) or `Other` (anything else, which every function ignores).
  `parse_sse_data_line(raw_line: &str) -> Option<Map<String, Value>>` trims the line,
  needs the `data:` prefix, parses the rest (trimmed) as JSON and returns it only when it
  is an object; bad JSON gives None, no log. `iter_sse_events(item: &SseChunk) ->
  Vec<Map<String, Value>>` returns an `Event` as is. For `Bytes` it decodes UTF-8 with
  replacement characters, splits on "\n\n" and each block on "\n", and keeps what
  `parse_sse_data_line` accepts. This is the one reader of the `data:` lines, and it
  uses the JSON `type` field, not the `event:` line. It parses bytes from the upstream
  provider, so it gets a cargo-fuzz target (see checks).
  `content_block_state(responses_so_far: &[SseChunk]) -> (Option<i64>, Option<i64>)` walks
  all events: `content_block_start` with an integer `index` opens it and raises the maximum
  index, `content_block_stop` closes it. It returns the highest still-open index and the
  highest index seen.

  The same file holds the four readers of the stream so far. They use the `event:` line
  of each block, not the JSON `type`, which is why they do not call `iter_sse_events`.
  `extract_text_from_sse(bytes: &[u8]) -> String`: strict UTF-8 decode (a decode failure
  logs at error level "Error extracting text from SSE" and returns what was gathered, an
  empty string); split on "\n\n"; skip blank blocks; per block the last `event:` line
  gives the event type and the last `data:` line the payload, each with the prefix cut
  and trimmed; for a `content_block_delta` event with a payload, parse it, and when
  `delta.type` is "text_delta" append `delta.text` (empty when missing). Bad JSON logs a
  warning "Failed to parse JSON from SSE data" and moves on.
  `streaming_string_so_far(responses_so_far: &[SseChunk]) -> String` joins
  `extract_text_from_sse` over the `Bytes` items and, for an `Event` item, its
  `delta.text` when `delta.type` is "text_delta" and the text is non-empty (this branch
  does not look at the event's own `type`). `streaming_has_ended(responses_so_far) ->
  bool` is true as soon as a `message_delta` event, found by its `event:` line in bytes or
  by its `type` in an `Event`, has a non-null `delta.stop_reason`. A decode failure logs
  at error level and the item is skipped, bad JSON warns and the scan goes on.
  `streamed_tool_use_fingerprints(responses_so_far) -> Vec<String>` runs
  `iter_sse_events` over every item and, for each `content_block_start` event whose
  `content_block` is an object with `type` "tool_use", returns B3663's
  `stream_item_fingerprint(content_block)`. `streaming_scan_key(responses_so_far) ->
  StreamingScanKey` (B3661's type) is: `texts` one entry, the string so far; `tool_calls`
  the fingerprints only once the stream has ended, else empty; `stream_ended`; and
  `tool_calls_in_flight` true when there are fingerprints and the stream has not ended.

  Anthropic block chunks go in
  crates/betterlite-server/src/guardrails/anthropic_translation/block_continuation.rs.
  `build_block_sse_chunks(message, model, original_response, stream_started,
  responses_so_far, message_id) -> Result<Vec<Vec<u8>>, AnthropicBlockError>`.
  With `stream_started` false it builds an Anthropic message (`id` message_id, `type`
  "message", `role` "assistant", `content` `[{"type":"text","text":message}]`, `model`,
  `stop_reason` "end_turn", `usage` from B3663's `blocked_response_usage(original_response)`)
  and returns the frames B2435's `MessagesFakeStream` renders for it. With `stream_started`
  true it continues the open message and never sends a second `message_start`. It reads
  `content_block_state`, takes `new_index` as the highest index seen plus one (0 when none),
  and emits in order: a `content_block_stop` for the open index (only when one is open),
  `content_block_start` (new_index, `content_block` text with empty text),
  `content_block_delta` (`text_delta` carrying the message), `content_block_stop` (new_index),
  `message_delta` (`delta` with `stop_reason` "end_turn" and `stop_sequence` null, `usage`
  with `output_tokens` from `blocked_response_usage`, 0 when absent) and `message_stop`.
  Each frame is `event: <type>\ndata: <json>\n\n` where the JSON is Python `json.dumps`
  output: ", " and ": " separators and every non-ASCII character escaped as \uXXXX (a
  surrogate pair above U+FFFF). `build_stream_error_items(message: &str) ->
  Vec<Vec<u8>>` returns B3669's `anthropic_sse_error_frames(message)` frames unchanged.
  The module's error enum is `AnthropicBlockError` (thiserror), covering a failure from
  the fake stream renderer and a JSON failure.

  Raw JSON from the wire is untyped here, so `serde_json::Value` is allowed at these
  boundaries only, one `#[expect]` per module with its reason (the budget below allows
  four). Tests live in the `tests.rs` of each module, named so the filters below match:
  `blocked_response_*`, `standalone_*`, `continuation_*`, `stream_error_*`,
  `sequence_number_*` in block_events; `open_item_state_*` and `closing_events_*` in
  open_item; `envelope_*` and `stream_chunk_*` in stream_shapes; `iter_events_*`,
  `block_state_*`, `text_*`, `has_ended_*`, `fingerprints_*`, `scan_key_*` in sse_events;
  `standalone_*`, `continuation_*`, `error_frames_*` in block_continuation.
