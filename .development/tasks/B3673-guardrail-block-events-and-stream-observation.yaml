dod:
  - text: >-
      build_block_sse_chunks with stream_started false returns the B928 synthetic event
      sequence for the blocked response as `data: <json>\n\n` chunks, with usage from the
      original response, chunk size the message's character count (at least 1), and no
      null or unset fields.
    proof: [block-events-tests, oracle]
  - text: >-
      With stream_started true the Responses block continues the same response: it closes
      the open item first, adds the block message as a new item at the next output index,
      and ends with a response.completed that holds only the new item and reuses the
      streamed response id and model (the stamp id and given model when none was streamed).
    proof: [block-events-tests, oracle]
  - text: >-
      open_item_state returns the last output item added and not done, and None when every
      item is done, the item is missing or its id is empty. Type and role default to
      message and assistant, the content index is the last part not yet done, and the text
      is the joined deltas.
    proof: [open-item-tests, oracle]
  - text: >-
      open_item_closing_events closes a message item as completed with the streamed text
      (with the text and content-part done events only when a part is open) and a
      non-message item as incomplete with its original fields, and returns nothing without
      an open item.
    proof: [open-item-tests, oracle]
  - text: >-
      next_stream_sequence_number returns the last integer sequence_number plus one, skipping
      events without one, and 0 for none; the Responses stream error item carries the
      guardrail_error type, the status as code and that sequence number.
    proof: [block-events-tests, oracle]
  - text: >-
      ResponseOutputEnvelope and ResponsesStreamChunk read their partial fields, accept a
      missing field as None and ignore unknown keys.
    proof: [stream-shapes-tests]
  - text: >-
      iter_sse_events returns an already parsed event as is and, for bytes, every
      data line that is a JSON object, ignoring bad JSON and non-objects, with invalid UTF-8
      replaced rather than failing; content_block_state returns the highest open and the
      highest seen index.
    proof: [sse-events-tests, oracle, sse-corpus-replay]
  - text: >-
      The Anthropic readers pick text, stream end and tool_use fingerprints the way
      LiteLLM does: the first two by the event line in bytes, the fingerprints by the
      JSON type, and the scan key only lists tool calls once the stream has ended.
    proof: [sse-events-tests, oracle]
  - text: >-
      The Anthropic standalone block is the fake-stream rendering of an end_turn message
      with the blocked usage, and the continuation closes the open block, adds one text
      block at the next index, and ends with message_delta and message_stop, with no
      second message_start and json.dumps encoding.
    proof: [anthropic-block-tests, oracle]
  - text: >-
      Anthropic build_stream_error_items returns the shared error frames for the message.
    proof: [anthropic-block-tests]
checks:
  optional: []
  commands:
    - id: block-events-tests
      why: the Responses block events, sequence number or stream error item tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::block_events::tests::/)'
    - id: open-item-tests
      why: the open item search or the closing events tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::open_item::tests::/)'
    - id: stream-shapes-tests
      why: the partial stream view tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::responses_translation::stream_shapes::tests::/)'
    - id: sse-events-tests
      why: the Anthropic SSE reader, block state or stream observation tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::anthropic_translation::sse_events::tests::/) - test(replays_the_anthropic_sse_events_corpus)'
    - id: anthropic-block-tests
      why: the Anthropic standalone, continuation or error frame tests are missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::anthropic_translation::block_continuation::tests::/)'
    - id: sse-corpus-replay
      why: the corpus files for the Anthropic SSE reader were not added or are not replayed
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/anthropic_sse_events)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_anthropic_sse_events_corpus)'
    - id: helper-cases-added
      why: the helper cases for this task were not added on this branch
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/guardrail-block-events)"
