deviations:
  - what: The block builders take the message, model and original response as arguments, and the response id, message id and creation time as a BlockStamp (the Anthropic one takes a message id), instead of reading a ModifyResponseException and calling uuid4 and time.time.
    why: The exception type is owned by another task, and the project forbids ambient randomness and clocks in pure code; the oracle helper feeds the same values to LiteLLM by patching uuid.uuid4 and time.time.
  - what: The two error-item builders take the status code and the already serialized message, not the HTTPException.
    why: serialize_http_exception_detail has no owner yet, and the dispatcher that holds the exception can turn it into text once for both endpoints.
  - what: The Anthropic stream item is the closed enum SseChunk (bytes, parsed event, other), and a Python str item is not read.
    why: LiteLLM's readers only look at bytes and dicts, so a str item yields nothing there either; the enum makes that explicit.
out_of_scope:
  - "B3670 owns the shared tool call shapes, the Responses input provenance helpers and the Anthropic scan target types. This task does not use them."
  - "B3671 owns the Responses request and completed-output processing, and B3672 owns the Responses process_output_streaming_response, get_streaming_scan_key, _check_streaming_has_ended, get_streaming_string_so_far, _has_streamed_tool_call_events, _completed_response_scan_key and the event type constants (_TERMINAL_ENVELOPE_EVENT_TYPES, _OUTPUT_ITEM_EVENT_TYPES, _OUTPUT_TEXT_EVENT_TYPES). They read this task's ResponseOutputEnvelope, ResponsesStreamChunk and open item helpers."
  - "B3674 owns the Anthropic request write-back, B3675 the Anthropic input and completed-output scans, and B3676 the Anthropic process_output_streaming_response, the ended-stream rewrite helpers, _SSEFieldRewrite and its rewriters, the SSE line rewriters and _build_streaming_usage_response. They call this task's sse_events readers and block chunks."
  - "The Anthropic handler's post_call_hook_response, its constructor's LiteLLMAnthropicMessagesAdapter and _translate_to_openai are request and response translation, not block or stream code, and are not built here."
  - "B928 owns build_synthetic_response_events and B2435 owns FakeAnthropicMessagesStreamIterator; this task only calls them."
