pitfalls:
  - "The Responses frames are `data: <json>\\n\\n` with no `event:` line, and the JSON is pydantic `model_dump_json(exclude_none=True, exclude_unset=True)`: a field LiteLLM never set must not appear, so the continuation events carry no `sequence_number` and the oracle compares each frame as parsed JSON."
  - "The standalone chunk size is the message length in characters, floored at 1, so an empty message still gives a delta event; counting bytes changes the number of text deltas for non-ASCII text."
  - "A continuation after a half-sent function call closes that call as `incomplete`, never `completed`, so a client that waits for output_item.done cannot run a tool the guardrail refused."
  - "open_item_state ignores an index that has a done event even if the same index was added again later, and it keeps only the last remaining added item, so two open items close only the newest one."
  - "The message closing event is built even when the streamed text is empty, with one output_text part holding the empty string."
  - "The Anthropic continuation uses `json.dumps` defaults (`, ` and `: ` separators, ensure_ascii), the Responses frames use compact JSON that keeps non-ASCII; do not share one encoder."
  - "Anthropic `streaming_has_ended` and `extract_text_from_sse` find the event kind from the `event:` line, so a bytes chunk with only a `data:` line never ends the stream, while `iter_sse_events` and the fingerprints use the JSON `type`. Keep both readers."
  - "The Event branch of `streaming_string_so_far` accepts any parsed event that has a `text_delta` delta, whatever its own `type` is."
  - "`iter_sse_events` splits blocks on a literal blank line and lines on \\n only, so a \\r\\n stream parses only because each line is trimmed."
  - "`tool_calls` in the Anthropic scan key stay empty until a non-null stop_reason arrives, and `tool_calls_in_flight` is the flag that tells the dispatcher to wait."
