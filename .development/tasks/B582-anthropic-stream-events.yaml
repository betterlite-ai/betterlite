id: B582
title: Anthropic event-to-chat chunk conversion
description: >-
  Implement event dispatch for message_start/content_block_start/delta/stop/message_delta/message_stop, ping/unknown
  empty chunks and error events, producing existing typed chat chunks. Preserve tool indices, signed thinking, JSON-mode
  tool content and reverse names; distinguish native stream completion from a gateway error so downstream fallback
  code can classify it.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  ModelResponseIterator.chunk_parser L811-L1048; ModelResponseIterator._handle_json_mode_chunk L1050-L1094; ModelResponseIterator._handle_accumulated_json_chunk
  L1118-L1149.


  Every native stream error event raises AnthropicError status 500, independent of error.type; message comes from
  error.message or str(chunk).


  Named case contracts: message_start_role: message_start copies model only when its key exists and merges usage
  by key presence; does not copy provider message id or role. All returned chunks use one state response id, served_model,
  choice index=0, content defaultempty, finish_reason defaultempty and omitted optional provider/thinking fields
  when empty. tool_use_and_argument_delta: Delegate deltas B581. At stop only tool/server_tool checks empty arguments;
  B581 no recorded deltas returns false so it does not emit {} for an entirely delta-free block, while recorded
  empty input_json deltas do. Server stop concatenates string partial_json, JSON-decodes truthy text into stored
  input; JSONDecodeError/TypeError keeps initial input. Clear current server id, response-format tracking and current
  block type at stop. json_mode_chunks: Truthy json_mode converts only current tool named json_tool_call after reversal;
  a new non-None id resets recognition by full name. Pass each argument fragment independently through B578 conversion,
  replacing text and suppressing tool when message exists, setting converted flag. This includes empty initial argument
  string. Reset recognition at block stop before final JSON-mode handling; converted flag remains and forces later
  finish_reason=stop even with real tools. ping_no_content: ping, tool_result, message_stop and any unknown/missing/falsey
  type return an empty-content chunk with finish_reason empty; they neither stop iteration nor synthesize stop.
  There is no unknown-event500 branch. error_event: Only type=error raises AnthropicError500 independent of nested
  error.type. Use truthy error.message else str(chunk); absent/falsey error becomes{}. Include rate_limit_error/authentication_error/unknown-type
  rows in the same case outcome, with source headers absent. content_start_reset: Every content_block_start resets
  current content_blocks and current block type. text emits required initial text; tool/server_tool increments dense
  tool_index, reverse-maps name and emits id/type=function/arguments empty regardless of initial input. caller emitted
  only when truthy (unlike B578 nonstream presence rule). web_search_stream_lifecycle: Server start stores id/input
  and, after name reversal, exact web_search creates B902 in_progress call plus snapshot. web_search_tool_result
  start appends raw cumulative results, completes tracked call and emits both; web_fetch_tool_result appends results
  only. Other *_tool_result starts append cumulative tool_results and B581 interpreter calls except tool_search_tool_result,
  which is ignored. compaction_and_container_events: Compaction start appends raw block and emits cumulative compaction_blocks
  plus compaction_start {type:compaction,content:<defaultempty>}. Message delta emits truthy container; only truthy
  dict container.id plus existing tool_results stores _container_id and re-emits interpreter calls. A container
  arriving before results does not update _container_id. accumulated_json_values: Append via B005 JSONFragmentAccumulator;
  before final drain parse only when last nonwhitespace byte could close }/]. Repeatedly pop complete values, skip
  nondict JSON values and return first dict chunk, retaining tail for later invocation. Final drain ignores the
  close-byte heuristic; incomplete tail returns None, never an invented truncated error.


  Implement crates/betterlite-anthropic/src/stream_events.rs with adjacent tests under stream_events/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_events_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): message_start_role, text_delta, tool_use_and_argument_delta, thinking_and_signature_events, citation_event,
  json_mode_chunks, ping_no_content, error_event, content_start_reset, web_search_stream_lifecycle, compaction_and_container_events,
  accumulated_json_values. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_stream_events* using HelperCase: kind:
  helper and the externally tagged anthropic_stream_events variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_stream_events that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_stream_tool_arguments consumes buffered JSON tool-argument bytes at content block
  completion in crates/betterlite-anthropic/src/stream_events.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_stream_events.rs calling that exact production function,
  with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_stream_events.
  The adjacent test replays_the_anthropic_stream_events_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 250 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 305 production lines, 245 behavior/config-test lines,
  115 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 745 planned, 750 maximum changed lines.
