pitfalls:
- 'The oracle helper for this task is pre-registered as anthropic_stream_events in the anthropic group. Replace the stub Op in tools/oracle/src/helpers/anthropic/stream_events.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/anthropic_stream_events.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A tool block with no deltas emits no {} stop fragment because the empty-args predicate returns false for an empty
  buffer.
- message_stop is an empty chunk; message_delta supplies finish_reason and EOF ends iteration.
- Container id is stored only when tool results already exist.
