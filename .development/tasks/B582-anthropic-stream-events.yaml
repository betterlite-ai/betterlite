id: B582
title: Anthropic event-to-chat chunk conversion
description: >-
  Implement event dispatch for message_start/content_block_start/delta/stop/message_delta/message_stop, ping and
  error events, producing existing typed chat chunks. Preserve tool indices, signed thinking, JSON-mode tool content
  and reverse names; distinguish native stream completion from a gateway error so downstream fallback code can classify
  it.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/anthropic/chat/handler.py:
  ModelResponseIterator.chunk_parser L811-L1048; ModelResponseIterator._handle_json_mode_chunk L1050-L1094; ModelResponseIterator._handle_accumulated_json_chunk
  L1118-L1149.


  Every native stream error event raises AnthropicError status 500, independent of error.type; message comes from
  error.message or str(chunk).


  Implement crates/betterlite-anthropic/src/stream_events.rs with adjacent tests under stream_events/. Keep each
  Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider
  leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation anthropic_stream_events in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function stream_events_cases in betterlite-anthropic with these exact named cases (one per oracle
  file): message_start_role, text_delta, tool_use_and_argument_delta, thinking_and_signature_events, citation_event,
  json_mode_chunks, ping_no_content, error_event, message_stop_finish, rate_limit_event_still_500, unknown_event_error_500.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/anthropic_stream_events* using HelperCase: kind:
  helper and the externally tagged anthropic_stream_events variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_anthropic_stream_events that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Outside-byte boundary: decode_stream_tool_arguments consumes buffered JSON tool-argument bytes at content block
  completion in crates/betterlite-anthropic/src/stream_events.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-anthropic/fuzz/fuzz_targets/anthropic_stream_events.rs calling that exact production function,
  with new valid, malformed, truncated and boundary seeds under crates/betterlite-anthropic/fuzz/corpus/anthropic_stream_events.
  The adjacent test replays_the_anthropic_stream_events_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 250 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 144 behavior/config-test lines,
  99 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 593 planned, 600 maximum changed lines.
