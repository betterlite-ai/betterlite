id: B973
title: Prepare context-managed Messages history with explicit recovery
description: >-
  Own adapters/handler.py L51-L312 context helpers in api::messages_chat_prepare. B2433 now owns the three
  reasoning methods and B974 owns kwargs/execution. Detect client compaction blocks, separate proxy
  litellm_metadata from Anthropic metadata, decide whether compact will run, then combine B971's client-history
  slicing with B972's editor dispatcher. Only additional_drop_params containing context_management disables
  the polyfill; global or per-call drop_params does not. Preserve the fallback after compact-only failure without
  silently discarding requested clear edits.

  HelperCall::MessagesContextInspection covers only the pure block/metadata/router-fallback/prediction functions.
  B2401 SdkHttpCall::MessagesContextPreparation exercises the async prepare/run functions, with real summary
  HTTP when enabled and zero-request assertions on skipped/failed gates. Inject typed dispatcher errors for the
  wrapper's recovery cases, never substitute a response for a provider call. Model/user metadata uses B732's
  principal; router fallback is an injected optional proxy handle. No decoder or new setting is introduced.
  Count 204 nonblank/non-comment lines in L51-L312. Allow 210 implementation, 150 tests, 150 fixtures,
  125 adapters and 30 wiring, 665 total. Tests use api::messages_chat_prepare.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_chat_prepare.rs
  - crates/betterlite-core/src/api/messages_chat_prepare/**
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/messages_context_inspection.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/messages_context_inspection.py
  - tools/oracle/cases/helpers/messages-context-inspection/**
  - tools/oracle/fuzz/corpus/helper_case/messages_context_inspection-*
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/messages_context_preparation.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/messages_context_preparation.py
  - tools/oracle/cases/sdk-http/messages-context-preparation/**
  - tools/oracle/fuzz/corpus/sdk_http_case/messages-context-preparation-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/handler.py#L51-L160
  why: Compaction detection, proxy metadata extraction and the whole pre/post-polyfill history safety net.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/handler.py#L162-L312
  why: Spec prediction and the exact boundary between ignored compact-only failures and surfaced non-compact failures.
dod:
- text: >-
    inspect_compaction_and_proxy_context returns true only for a dict content block with type=compaction inside
    a list on any message role; scalar text containing "compaction" is false. litellm_metadata dict yields that
    exact map plus its user_api_key_auth entry or null, including ({},null); missing/null/non-dict yields
    (null,null) even if metadata has user_id. Proxy router availability returns its handle; unavailable proxy
    import/context returns null without error.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    predict_context_edit_execution treats absent/empty spec or additional_drop_params=[context_management] as
    disabled. A non-list drop parameter does not disable. Native compact_20260112 or normalized OpenAI compaction
    predicts compact=true; native clear_tool_uses_20250919 predicts compact=false,non_compact=true; unknown string
    type also sets non_compact=true, but missing/numeric type does not. Mixed specs set both. Normalizer exception
    is swallowed to null edits, causing both predictions false. drop_params=true alone changes none of these decisions.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    client_history_before_noncompact_edit sends a client compaction S, recent tool history and a clear edit.
    B971 slices/prefixes first; B972 sees only that history and augmented system. With null/empty or explicitly
    dropped spec, return that history result without provider calls; no client block and disabled spec returns
    null. A dispatcher result, even with empty applied_edits, wins over the earlier history result.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    compact_editor_receives_full_input sends a compact spec with old history, client compaction S and two recent
    turns. Skip client-history preprocessing and pass the original messages/system/tools/metadata/router/principal
    to B972, so its own count sees the complete post-block tail. With a mock summary <summary>N</summary> and
    count above threshold, expect one actual /v1/chat/completions summary request and B2432's N result.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    compact_failure_uses_history_safety_net scripts dispatcher exception "broken" for a compact-only spec.
    Emit exception-level "context_management polyfill: skipping edits due to error: broken", then return B971's
    slice-only S/tail with applied_edits=[] and zero summary calls. If no client block exists, return null.
    A dispatcher null result takes the same post-run history safety net when compact was predicted.
  proof: [behavior-tests, oracle, python-adapters]
- text: >-
    noncompact_failure_surfaces sends a clear-only or mixed compact/clear spec and dispatcher exception "broken".
    After the same diagnostic raise AnthropicContextManagementError(status_code=500,message="context_management polyfill failed: broken")
    with no type/param/code fields; no slice-only result hides the clear edit. A compact spec with an unknown
    string edit also qualifies. AnthropicContextManagementError(400,"context_management.compact_20260112.trigger.value must be at least 50000 tokens")
    propagates unchanged without the skipping-edits diagnostic and without a summary request.
  proof: [behavior-tests, oracle, python-adapters]
- text: Pure inspection and async preparation each have new fixtures and valid externally tagged oracle inputs.
  proof: [new-cases, corpus, oracle, python-adapters]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the context gate or either recovery branch is missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_prepare::/)'
  - id: python-adapters
    why: inspection or preparation lacks a pinned independently checked implementation
    run: test -f tools/oracle/helpers/messages_context_inspection.py && test -f tools/oracle/sdk_http/messages_context_preparation.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: corpus
    why: one context-preparation operation tag is unwired
    run: grep -qE '^[[:space:]]+messages_context_inspection:' tools/oracle/fuzz/corpus/helper_case/messages_context_inspection-* && grep -qE '^[[:space:]]+messages_context_preparation:' tools/oracle/fuzz/corpus/sdk_http_case/messages-context-preparation-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus) | test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: context inspection or HTTP preparation fixtures were not added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-context-inspection)" && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/messages-context-preparation)"
oracle_cases:
- tools/oracle/cases/helpers/messages-context-inspection/inspect-compaction-and-proxy-context.yaml
- tools/oracle/cases/helpers/messages-context-inspection/predict-context-edit-execution.yaml
- tools/oracle/cases/sdk-http/messages-context-preparation/client-history-before-noncompact-edit.yaml
- tools/oracle/cases/sdk-http/messages-context-preparation/compact-editor-receives-full-input.yaml
- tools/oracle/cases/sdk-http/messages-context-preparation/compact-failure-uses-history-safety-net.yaml
- tools/oracle/cases/sdk-http/messages-context-preparation/noncompact-failure-surfaces.yaml
deviations: []
out_of_scope:
- B2433 owns all three reasoning methods in adapters/handler.py L322-L464; B974 owns L466-L824 completion arguments and execution.
- B972 owns normalization/editor dispatch; B971 owns history slicing; B968 owns result/error types. B081 wraps context errors for HTTP.
- The module-level ANTHROPIC_ADAPTER at L317 is B974's composition of B967 and contains no separate behavior here.
pitfalls:
- drop_params does not disable context_management, because this parameter is supported through the polyfill.
- A failed compact-only request can recover through client history; a failed clear request cannot.
- Prediction must use the dispatcher's normalizer or OpenAI list specs can lose recent history before compaction.
review_level: security
budget:
  max_changed_lines: 700
  max_new_expects: 0
