checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_prepare::/)
      - test(/::replays_corpus$/)'
  - id: case-context-polyfill-enabled
    why: the context-polyfill-enabled behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_prepare::tests::context_polyfill_enabled($|::)/)'
  - id: case-explicit-context-drop
    why: the explicit-context-drop behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_prepare::tests::explicit_context_drop($|::)/)'
  - id: case-openai-thinking-responses-route
    why: the openai-thinking-responses-route behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_prepare::tests::openai_thinking_responses_b917($|::)/)'
  - id: case-effort-normalization
    why: the effort-normalization behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_prepare::tests::effort_normalization($|::)/)'
  - id: case-noncompact-edits-only
    why: the noncompact-edits-only behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_prepare::tests::noncompact_edits_only($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_chat_prepare.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_chat_prepare-*)"
      && grep -qE "^[[:space:]]+messages_chat_prepare:" tools/oracle/fuzz/corpus/helper_case/messages_chat_prepare-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-chat-prepare)"
