id: B973
title: Messages chat prepare
description: >-
  Prepare context-managed Messages-to-chat calls, normalize context edits and reasoning effort, and choose native
  Responses routing for compatible OpenAI thinking targets. Consume the split editor outputs and resolved deployment
  facts; request metadata cannot mark a call as an internal summary request.


  Implement crates/betterlite-core/src/api/messages_chat_prepare.rs. Use MessagesChatPrepareInput and MessagesChatPrepareResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions context_polyfill_enabled, explicit_context_drop, openai_thinking_responses_b917,
  effort_normalization, noncompact_edits_only under api::messages_chat_prepare::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesChatPrepare in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_chat_prepare: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/handler.py: _messages_have_compaction_block (L51-L60);
  litellm/llms/anthropic/pass_through/adapters/handler.py: _proxy_router_fallback (L63-L68); litellm/llms/anthropic/pass_through/adapters/handler.py:
  _extract_proxy_litellm_metadata (L71-L89); litellm/llms/anthropic/pass_through/adapters/handler.py: _prepare_context_managed_request
  (L92-L159); litellm/llms/anthropic/pass_through/adapters/handler.py: _polyfill_will_run (L162-L186); litellm/llms/anthropic/pass_through/adapters/handler.py:
  _spec_has_non_compact_edits (L189-L212); litellm/llms/anthropic/pass_through/adapters/handler.py: _context_management_explicitly_dropped
  (L215-L224); litellm/llms/anthropic/pass_through/adapters/handler.py: _normalize_spec_edits (L227-L250); litellm/llms/anthropic/pass_through/adapters/handler.py:
  _run_polyfill_if_enabled (L253-L312); litellm/llms/anthropic/pass_through/adapters/handler.py: LiteLLMMessagesToCompletionTransformationHandler._route_openai_thinking_to_responses_api_if_needed
  (L323-L385); litellm/llms/anthropic/pass_through/adapters/handler.py: LiteLLMMessagesToCompletionTransformationHandler._plain_effort_for_chat_target
  (L388-L428); litellm/llms/anthropic/pass_through/adapters/handler.py: LiteLLMMessagesToCompletionTransformationHandler._normalize_reasoning_effort
  (L431-L464). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 277 owned nonblank/non-comment/non-docstring Python lines (334 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 297 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 547 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B198 (Injected call context and shared
  settings), B931 (Responses provider selection), B967 (Messages chat transform), B972 (Messages compaction), B1087
  (Api boundaries), B971 (Summary history), B968 (Messages context clear), B962 (Messages thinking). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
