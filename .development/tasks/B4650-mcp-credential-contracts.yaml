id: B4650
title: "MCP credential contracts, header carriers and BYOK cache"
description: >-
  Build the outbound-credential vocabulary — a set of immutable, discriminated-union types that represent
  how the gateway authenticates upstream. These are the contract between the server's declared auth mode and the resolver
  (a later task) that mints credentials.

  AuthResolution (L50-L65) and ResolvedCredential (L67-L71) track what credential source was picked (oauth2, api_key, aws, etc) and the httpx2.Auth object the resolver built.

  Result separates success from failure as type-checked values. Ok and Error are frozen variants of a union; testing
  which holds is a prerequisite to accessing its payload — the type checker enforces this with isinstance or match.
  Both variants are covariant so a plain Ok(value) or Error(err) infers its full type. Every function returns Result
  instead of raising, so the caller must explicitly handle every failure case.

  AuthSpecKind is a str enum listing the eight upstream-auth modes: authorization_code, client_credentials, token_exchange, id_jag, api_key, passthrough, none, aws_sigv4. It is derived from the config variant, never a second field; the server declares exactly one config per mode.

  CredError is a tagged union discriminated on a Literal tag: unauthorized (401 + optional challenge), misconfigured (missing required field, operator error), url_credentials_not_allowed (credentials in URL with auth_type=none), upstream_unavailable (IdP/token endpoint unreachable), unsupported_mode (unknown mode string at the boundary), precondition_required (missing per-user value), not_implemented (mode not built yet). Each arm carries its data; the summary property builds a human message. Construct via factory methods: of_unauthorized, of_misconfigured, etc.

  Unauthorized is the 401 challenge: detail (message), www_authenticate (scheme-specific challenge), body (optional form fields), claims (IdP step-up).

  HeaderCarrier is a frozen Pydantic model that says where a credential is written upstream and how its value is formatted. Every config whose credential the gateway mints inherits it: header_name (default Authorization), value_prefix (default Bearer). The header() method returns (name, formatted_value).

  AuthConfig is a discriminated union of eight frozen Pydantic models, discriminated on kind:
  - AuthorizationCodeConfig: per-user 3LO, inherits HeaderCarrier, holds optional scopes, client_id, secret, endpoints.
  - ClientCredentialsConfig: M2M service account, optional client_id/secret/token_url/scopes/audience/upstream_resource/token_endpoint_auth_method.
  - TokenExchangeConfig: OBO swap caller's token for upstream token, optional profile (rfc8693 or entra_obo), subject_token_type, token_exchange_endpoint, audience, client_id/secret, token_endpoint_auth_method, scopes.
  - IdJagConfig: draft-ietf-oauth-identity-assertion-authz-grant, required org_token_endpoint, resource_token_endpoint, client_id, client_auth (PrivateKeyJwtAuth | ClientSecretAuth), optional subject_token_type, audience, resource, scopes.
  - ApiKeyConfig: fixed credential, inherits HeaderCarrier, discriminated on key_source: SharedKey (literal value) or Byok (per-user sourced).
  - PassthroughConfig: client-driven OAuth, no extra fields.
  - NoneConfig: no credential, no extra fields.
  - AwsSigV4Config: AWS SigV4 signing, required region, optional service (default bedrock-agentcore), optional credentials (StaticKeys, AssumeRole, Ambient).

  Subject is the validated inbound principal: tenant_id, subject_id, inbound_token (SecretStr | None).

  ServerSpec is the declared upstream: server_id, resource (RFC 8707 audience URI), config (AuthConfig). The auth_spec_kind property derives the mode from config.kind.

  NoOpAuth is an httpx2.Auth that attaches nothing — yields request unchanged. Used for the none mode.

  StaticHeaderAuth is an httpx2.Auth that sets one fixed header on every request. Header value is held as SecretStr so it stays masked in reprs and logs. Takes header_value and optional header_name (default Authorization).

  TokenEndpointClientAuth is a frozen dataclass holding headers dict and body dict. Built by build_token_client_auth, which accepts auth_method (client_secret_basic or client_secret_post, default None meaning post), client_id, client_secret. client_secret_basic is a confidential-client method and raises TokenEndpointAuthConfigError if either credential is missing. Any other method places present credentials in the body. Normalizes credentials via quote_plus before Basic encoding.

  normalize_token_auth_method narrows an untyped value to the literal or None.

  CachedByokCredential is a frozen dataclass holding credential (str | None). byok_credential_cache is an InMemoryCache instance with the configured max_size and ttl (from MCP_BYOK_CREDENTIAL_CACHE_MAX_SIZE and MCP_BYOK_CREDENTIAL_CACHE_TTL_SECONDS). byok_credential_cache_key returns a cache key for (user_id, server_id). get_cached_byok_credential retrieves and type-checks the entry (isinstance guard against cache corruption). cache_byok_credential stores it, handling None values.

  parse_auth_spec_kind is the *only* boundary parser; it is fail-closed: a raw mode string enters only here and returns Result[AuthSpecKind, CredError]. Unknown values yield CredError.of_unsupported_mode.

  validate_header_name wraps normalize_upstream_header_name (in litellm.types.mcp) and returns Result[str, CredError].
