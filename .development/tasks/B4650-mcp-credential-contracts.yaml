dod:
  - text: 'credential_contract cases cover result_ok_error, header_carrier_conveyance, auth_resolution_enum,
      each_auth_config_kind, illegal_state_unrepresentable, parse_auth_spec_kind_success,
      parse_auth_spec_kind_unknown_mode_fail_closed and unauthorized_challenge_fields.'
    proof: [behavior-tests, helper-python]
  - text: 'token_auth cases cover normalize_token_auth_method_basic, normalize_token_auth_method_post,
      normalize_token_auth_method_unknown, build_token_client_auth_basic_quote_plus_encoding,
      build_token_client_auth_post_body, build_token_client_auth_post_partial_credentials,
      build_token_client_auth_post_empty, and build_token_client_auth_missing_secret_raises.'
    proof: [behavior-tests, helper-python]
  - text: byok_cache cases cover cache_key_format, get_cached_type_check and get_missing_returns_none.
    proof: [behavior-tests, helper-python]
  - text: The helper operation and shared helper corpus reach the parser without credential leaks.
    proof: [helper-case-corpus, helper-python]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: The credential contract types, parsers or cache functions are absent or changed.
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^credential_contracts::/)' && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::mcp::b4650::/) - test(/replays_the_/)'
    - id: helper-python
      why: The helper adapters fail strict Python checks or are missing.
      run: test -f tools/oracle/helpers/b4650.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No newly added credential-contracts operation reaches the shared parser.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/credential-contracts-*')" && grep -rlq credential_contracts tools/oracle/fuzz/corpus/helper_case/credential-contracts-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
