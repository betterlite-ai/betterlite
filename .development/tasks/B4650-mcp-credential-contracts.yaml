deviations:
  - what: "betterlite's Result[T, E] type uses Rust's generic type system with covariance, rather than Python's expression library. The narrowing semantics are preserved through match expressions and type guards."
    why: "Rust's type system provides compile-time exhaustiveness checking that Python cannot match. The contract is identical: Ok and Error are separate variants, narrowable via pattern matching."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/result.py
  - what: "betterlite's CredError is a Rust enum, not a Python tagged union. The tag property is replaced with Rust's exhaustive pattern matching on enum variants."
    why: "Rust's type system proves exhaustiveness at compile time, catching missing arms before deployment. The observable behavior (which arm is constructed, which error is returned) is identical."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L111-L202
  - what: "AuthConfig and its variants use Rust's enum discriminant (kind field) rather than Pydantic's Field(discriminator=...). The wire format and serialization stay identical."
    why: "Rust traits require exhaustive matching; Pydantic discriminators are runtime-only. The config still contains exactly one mode per server, and deserialization enforces it."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/types.py#L452-L462
  - what: "NoOpAuth and StaticHeaderAuth are Rust structs implementing a local Auth trait (compatible with httpx2's interface), not httpx2.Auth subclasses."
    why: "Rust requires explicit trait implementation. The auth_flow contract is preserved: mutate the request in-place and yield it."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/httpx_auth.py
out_of_scope:
  - "ResolvedCredential (types.py L67-L71): this dataclass is defined here but built and tested by the resolver task that owns the dispatch logic on AuthSpecKind."
  - "The resolver that dispatches on AuthSpecKind and mints credentials. That lands in a later task."
  - "HTTP request signing (AWS SigV4). The types are modeled here; signing logic is deferred."
  - "Token endpoint requests and refresh flows. Those are built by the token endpoint client task."
  - "The v1 -> v2 adapter that maps MCPAuth onto these types. That is owned by an integration task."
  - "Config loading and deserialization. betterlite-config reads AuthConfig and stores it."
pitfalls:
  - "AuthSpecKind is derived from config.kind, never a second field. A server with both authorization_code config and a different auth_spec_kind field is invalid and should be caught at construction, not at resolve time."
  - "HeaderCarrier's header_name is validated at construction time via validate_header_name. Invalid names cause a Pydantic validation error, not a runtime failure."
  - "SecretStr fields (client_secret, inbound_token, credentials) are masked in debug output and error messages. Do not call .expose_secret() except when writing the credential to a request or storing it in the cache."
  - "ApiKeySource (SharedKey | Byok) models whether the key comes from config or from the per-user store. A SharedKey server and a Byok server are two different configs; do not switch them at runtime."
  - "TokenEndpointClientAuth holds the formatted headers and body. The caller builds the actual HTTP request using these fields; do not add the client_id/secret to the request body if they are already in headers (Basic auth)."
  - "byok_credential_cache_key includes user_id and server_id. Two users on the same server, or one user on two servers, have different cache entries. Do not cache a credential across (user, server) boundaries."
  - "get_cached_byok_credential type-checks the entry to defend against cache corruption. If the cache holds a non-CachedByokCredential value, it returns None, not an error."
  - "CachedByokCredential holds an optional credential (str | None). None means the user has no credential; it is cached just like a present one, to avoid repeated lookups that fail."
  - "parse_auth_spec_kind is fail-closed and is the *only* boundary where an unknown mode is handled. Inside the core, AuthSpecKind is always valid; a wildcard match arm is a code smell."
  - "TokenEndpointAuthConfigError is a ValueError subclass for backward compatibility with existing error handling. It signals a misconfigured client credential for Basic auth."
  - 'The oracle helper for this task is pre-registered as b4650 in the mcp group. Replace the stub Op
    in tools/oracle/src/helpers/mcp/b4650.rs with an impl Helper, and write run in
    tools/oracle/helpers/b4650.py. Registry files (helpers/mod.rs, group files, dispatch.py) are not
    this task''s to edit.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
