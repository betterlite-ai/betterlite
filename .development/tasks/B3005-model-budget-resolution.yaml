    why: Core B3005 ownership, covering cache key generation, model resolution, spend reporting and legacy carry.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/model_max_budget_limiter.py#L51-L63
    why: ResolvedModelBudget dataclass and its invariant that budget_model keys all counters.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/model_max_budget_limiter.py#L65-L106
    why: Cache key functions and legacy counter carry, including the one-window cutoff.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/model_max_budget_limiter.py#L135-L157
    why: Model budget resolution chain and warning-backed fallthrough for malformed entries.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/model_max_budget_limiter.py#L160-L181
    why: Team override and budget model candidates (prefix stripping, bedrock handling).
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/model_max_budget_limiter.py#L184-L240
    why: Bedrock model lookup, usage projection and current-window spend reads.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/model_max_budget_limiter.py#L243-L274
    why: Silent spend read fallback and config validation helpers.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py
    why: BudgetConfig validation schema and expected fields (max_budget, budget_duration).
dod:
  - text: Cache key functions model_budget_spend_cache_key, model_budget_start_time_cache_key and batch_charged_once_marker_key build keys from entity type, id, budget model and duration with the exact LiteLLM prefix and format.
    proof: [cache-keys]
  - text: resolve_model_budget finds the first candidate that exists in model_max_budget and returns a ResolvedModelBudget, or None if no candidate applies.
    proof: [resolution-cases]
  - text: Candidates are the request model, the model without {provider}/ prefix, bedrock base and bedrock family name when the cost map marks it a bedrock model, in that order.
    proof: [candidate-cases]
  - text: A malformed model_max_budget entry in resolve_model_budget (unparseable BudgetConfig, missing budget_duration, invalid duration_in_seconds) is logged as warning and skipped, not fatal.
    proof: [malformed-warn-skip-cases]
  - text: A malformed model_max_budget entry in build_model_max_budget_usage is silently dropped from the usage report without logging a warning.
    proof: [malformed-silent-cases]
  - text: team_model_budget_applies returns false only when the key has a spend-gated budget (max_budget not None and >= 0) for the model.
    proof: [team-override-cases]
  - text: Legacy counter carry reads the old budget key (model name not configured name) for key and end-user scopes only, if within one budget window of startup and the key differs from the current key.
    proof: [legacy-carry-cases]
  - text: build_model_max_budget_usage returns a dict keyed on configured budget model names, with "current_spend" (float, 4 decimals), "budget_limit" and "time_period" per model.
    proof: [usage-report-cases]
  - text: _current_window_spends reads from Redis if available, returns in-memory cache as fallback, and treats an unusable batch result (None, wrong length, non-list) as all zeros.
    proof: [spend-read-cases]
  - text: batch_id_to_charge_once returns the batch id only for positive-cost batch retrieve calls, None otherwise.
    proof: [batch-dedup-cases]
