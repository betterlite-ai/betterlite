oracle_cases: []
deviations:
  - what: Invalid BudgetConfig entries in resolve_model_budget log a warning and are skipped during resolution; validation failures are not fatal errors.
    why: LiteLLM allows config entries that do not validate and falls back to lower-precedence ones, treating invalid entries as if they were absent. betterlite preserves this behavior.
  - what: Invalid BudgetConfig entries in build_model_max_budget_usage are silently dropped from the usage report without logging.
    why: This code path is used for reporting to users; a silently missing model avoids confusing operators with warnings about entries that already failed validation.
  - what: Legacy counter carry stops after one budget window from startup; requests that land after that window use only the new counter spelling.
    why: A legacy counter belongs to a window that was already open when this process replaced the prior one; past that window the old key could only miss.
out_of_scope:
  - "litellm/proxy/hooks/model_max_budget_limiter.py:277-288 (_resolve_entity_model_budgets): owned by B3006 since its only caller is async_log_success_event (B3006)."
  - The class _PROXY_VirtualKeyModelMaxBudgetLimiter (lines 291-620) is enforcement and charging logic, owned by B3006.
  - Redis transport operations (async_batch_get_cache, async_increment) are owned by B360; this task uses them as they are.
  - The RouterBudgetLimiting interface and its relationship to the provider dispatch is owned by the router layer.
  - Budget config parsing and field defaults are owned by the config loading task.
pitfalls:
  - "Cache keys join entity type, id, model name and duration with colons: the entity type is the prefix constant, not the enum value."
  - "Legacy counter key uses request model name, not configured model name; identical keys skip the legacy read."
  - "Team override checks max_budget sign (not None, >= 0) only, not actual charge; budget_limit: 0 blocks the team regardless of prior spend."
  - "Malformed entries diverge: resolve_model_budget logs a warning, while build_model_max_budget_usage silently omits them from the report."
  - "Bedrock model candidate generation uses litellm.model_cost; tests verifying bedrock fallback need a seeded cost map."
  - "Legacy carry cutoff uses time.monotonic() uptime, not wall-clock time; process restart sees different windows."
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 2
