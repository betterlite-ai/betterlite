id: B3005
title: Resolve per-model budget names and report window usage
description: >-
  Implement `betterlite-auth::model_budget_values` to resolve which budget configuration
  entry applies to a request, build exact cache keys for per-model spend counters, and
  report current-window spend per configured budget model for /key/info and /user/info
  endpoints. Preserve the candidate resolution chain (model name, name without provider
  prefix, bedrock base model, bedrock family name), legacy-counter carry from the prior
  version for one budget window, and Redis-authoritative spend reads with in-memory fallback.
  Keep team override semantics (key budget can disable team budget for a model) and batch
  response deduplication markers (batches report full cost on every poll, so charge once per
  counter). Config keys: `model_max_budget` on user keys, teams, users and end-users. Budget
  durations parse as duration_in_seconds allows. Cache prefixes (virtual_key_spend, team_model_spend,
  user_model_spend, end_user_model_spend) form the Redis/memory keys alongside entity id,
  configured model name and budget duration. Batch dedup needs `batch:<batch_id>` appended to
  the spend key.
scope:
  paths:
    - Cargo.toml
    - crates/betterlite-auth/**
    - tools/oracle/cases/model-budget/**
  lint_tables: false
