dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: tls_valid_chain, tls_hostname_mismatch,
      tls_unknown_root, native_writer_pool_cap, pooler_options_warn, reader_migration_direct, explicit_cert_precedence.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: A real TLS connection accepts the configured CA chain and rejects a wrong hostname or unknown
      root.
    proof:
      - postgres-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: 'The recorded deviations are covered by native behavior tests: native_litellm_pgbouncer_enabled_true_caps_only_the_native_writer_pool_at_lit.'
    proof:
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/database_tls.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-tls-*")"
        && grep -rlq "database_tls" tools/oracle/fuzz/corpus/helper_case/database-tls-* && cargo nextest
        run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: postgres-tests
      why: The real TLS fixture accepts the wrong certificate/hostname or rejects the configured valid
        chain.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::tls_valid_chain$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::tls_hostname_mismatch$/)'
        && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::tls_unknown_root$/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_tls::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-tls-*")"
        && grep -rlq "DATABASE_SSLMODE" crates/betterlite-config/fuzz/corpus/config_yaml/database-tls-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
