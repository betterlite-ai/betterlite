id: B711
title: Database TLS and external pooler configuration
description: >-
  Translate Prisma/libpq TLS settings into native SQLx/rustls Postgres options, with real local TLS fixture
  tests. Accept LITELLM_PGBOUNCER_ENABLED=false by default; true caps the writer pool at LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS=20
  instead of spawning a pooler. Reader and migration connections remain direct. Warn that LITELLM_PGBOUNCER_PORT,
  LITELLM_PGBOUNCER_MAX_CLIENT_CONN and LITELLM_PGBOUNCER_BINARY have no native effect. Preserve explicit
  certificate precedence and source require-versus-strict verification behavior.


  Build the production database_tls module in betterlite-db; reuse the typed dependencies listed in the
  backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/db_url_settings.py:
  translate_libpq_ssl_params (L221-L254; 33 source lines). litellm/proxy/db/pgbouncer.py: native_pool_policy
  (L99-L119; 17 source lines). litellm-proxy-extras/litellm_proxy_extras/utils.py: ProxyExtrasDBManager._libpq_tls_params
  (L733-L753; 21 source lines), ProxyExtrasDBManager._strip_prisma_query_params (L716-L730; 14 source
  lines).


  DATABASE_SSLMODE=None and DATABASE_SSLROOTCERT=None; a root certificate alone selects verify-full. Prisma
  sslcert is a CA certificate, unlike libpq sslcert (client certificate). Prisma require without sslaccept=strict
  does not verify certificates; sslidentity client certificates are unsupported by the PgBouncer path.
  LITELLM_PGBOUNCER_ENABLED=false and LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS=20 are accepted, with the ignored
  _PORT=6432, _MAX_CLIENT_CONN=1000 and _BINARY=pgbouncer warning-only settings.


  Add the database_tls operation under B856 Management::database. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a database-tls-*
  seed to B171 helper_case, which already owns this decoder.


  Write betterlite-config::database_tls::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 85 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  85 production, 157 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 387 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: native_litellm_pgbouncer_enabled_true_caps_only_the_native_writer_pool_at_lit.
  Exercise the precise changed setting/output branch and assert its configured status/error/side effects;
  do not add these differing results to oracle equality cases.


  Real TLS connection tests use B860 with POSTGRES_TEST_URL when set and testcontainers otherwise, with
  test-owned CA/server certificates. tests::tls_valid_chain establishes a verified SQLx connection using
  the configured CA bundle; tls_hostname_mismatch and tls_unknown_root require connection rejection. Do
  not substitute row/rollback tests for certificate verification. The fixture must fail when its selected
  Postgres/TLS server is unavailable.
