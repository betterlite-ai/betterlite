id: B711
title: Database TLS and external pooler configuration
description: >-
  Implement betterlite-db::database_tls as the native mapping from LiteLLM's Prisma/libpq URL dialects
  to SQLx/rustls connection options. Own translate_libpq_ssl_params and extras/utils.py's
  _strip_prisma_query_params/_libpq_tls_params, plus the existing native replacement of embedded
  PgBouncer configuration. There is no native_pool_policy function in the pinned Python file:
  pgbouncer.py L99-L119 contains settings/plan declarations, and the Rust writer-pool policy is the
  explicit deviation below. Consume B710's resolved DATABASE_SSLMODE/DATABASE_SSLROOTCERT values and
  B2307's URL decoder and query helpers; do not duplicate password or token assembly.

  Preserve translate_libpq_ssl_params exactly as a pure compatibility projection. Parse query pairs
  retaining blanks and duplicates. If there is no verify-ca/verify-full sslmode and no sslrootcert
  key, return the original URL unchanged. Otherwise rewrite every verifying sslmode to require,
  remove all sslrootcert pairs, add one sslcert per original sslrootcert only if no sslcert key was
  already present, and append sslaccept=strict only if that key was absent. Blank explicit sslcert or
  sslaccept still wins; do not strengthen an explicitly pinned accept_invalid_certs value. A root
  parameter alone adds strict but does not add sslmode=require. The reference resolver receives the
  path, parsed hostname or empty string, and parsed port or 5432; malformed ports remain errors.

  The migration-side strip helper returns an unqueried URL unchanged. Otherwise it drops blank pairs
  and keeps only sslmode, sslcert, sslkey, sslrootcert, sslpassword, application_name, connect_timeout,
  client_encoding, options, service, gssencmode, krbsrvname and target_session_attrs. Extract the first
  nonblank sslaccept separately. Prisma-only connection_limit, pool_timeout, socket_timeout,
  max_idle_connection_lifetime, schema, pgbouncer and sslaccept itself do not reach libpq. Encode
  spaces as %20, not '+', preserving retained duplicate order. Migration namespace selection happens
  before stripping in B716, so losing the schema query here must not migrate the public schema instead.

  _libpq_tls_params returns pairs unchanged when there is no sslcert or when sslkey is also present
  (the libpq client-certificate form). Otherwise take the first sslmode and remove every sslcert and
  sslmode pair. For sslaccept absent/accept_invalid_certs, or sslmode=disable, drop the Prisma CA and
  reappend only the original first sslmode if present. Any other nonblank sslaccept means strict:
  add each sslcert as sslrootcert only if no root key already exists, then append sslmode=verify-full,
  even if the original mode was prefer. Existing sslrootcert values remain. Test this asymmetry rather
  than treating Prisma sslcert as a libpq client certificate.

  Native TLS must retain these effective verification choices: disable remains plaintext;
  require without strict permits an unverified TLS connection; the translated strict verifying modes
  check both certificate chain and hostname, including source verify-ca. Explicit certificate
  precedence survives. Use native CA-bundle loading instead of the Prisma first-certificate probe
  and temporary-file workaround, as recorded below. For a mode that verifies certificates,
  unreadable/malformed roots and failed chain or
  hostname checks must fail connection, never silently switch to an unverified TLS mode. Retain
  caller-selected prefer behavior; do not invent a compulsory TLS mode when the source projection
  did not set one. Certificate/client-identity parsing uses the TLS library, not a new PEM parser.

  Load PgBouncer settings case-insensitively through B002: LITELLM_PGBOUNCER_ENABLED=false,
  LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS=20 (integer >=1), LITELLM_PGBOUNCER_PORT=6432 (1..65535),
  LITELLM_PGBOUNCER_MAX_CLIENT_CONN=1000 (integer >=1), LITELLM_PGBOUNCER_BINARY='pgbouncer'. Preserve
  settings validation failures for invalid booleans, nonintegers and range errors rather than falling
  back. Enabled caps the shared native writer pool at min(configured writer limit,max_db_connections);
  disabled leaves it unchanged. Reader and migration sessions are unaffected. The ignored port,
  client-count and binary settings produce one startup warning when explicitly supplied; no process,
  loopback endpoint, userlist credential file or private random PgBouncer password is created. Keep
  the original writer URL/credential and B854's native refresh. An operator-provided external pooler
  URL still honors pgbouncer=true by disabling persistent prepared statements, independent of the
  embedded-pooler toggle. Do not claim a cross-process or cross-pod limit from one SQLx pool.

  Pure helper oracle cases invoke the actual translate/strip/TLS projection functions; inject an
  identity root resolver only to avoid the reference helper's preflight network/file work, and assert
  its resolver arguments in the case. Native pool behavior and full-bundle loading are deviation
  tests outside equality cases. B860 supplies a real locally controlled Postgres TLS endpoint through
  POSTGRES_TEST_URL when set, otherwise testcontainers; accepted/rejected connections must use the
  actual SQLx connector. A valid root chain, wrong hostname, unknown root, multiple-root bundle whose
  first root is unrelated, unreadable root and plaintext-server cases are separate tests. Fixture
  setup failure fails the tests, not an ignored result. Config tests load every named env setting and
  consume its resolved value. Extend the existing config_yaml and HelperCase corpora only.

  The compatibility implementation owns 33 translate lines, 14 strip lines and 21 reverse-TLS lines;
  settings declarations add 11 nonblank lines. The removed probe/file path is not counted as native
  implementation. Allow 210 TLS/options code, 300 real TLS and policy tests, 100 config/tests,
  70 adapters and 35 wiring, 715 within 800. Split source by translation, options and pool policy.
scope:
