    - crates/betterlite-db/src/database_tls.rs
    - crates/betterlite-db/src/database_tls/**
    - crates/betterlite-db/src/lib.rs
    - crates/betterlite-db/Cargo.toml
    - Cargo.toml
    - deny.toml
    - tools/oracle/src/helpers/db/database_tls.rs
    - tools/oracle/src/helpers/db/database_tls/**
    - tools/oracle/helpers/database_tls.py
    - tools/oracle/helpers/database_tls/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/database-tls/**
    - tools/oracle/fuzz/corpus/helper_case/database-tls-*
    - crates/betterlite-config/Cargo.toml
    - crates/betterlite-config/src/lib.rs
    - crates/betterlite-config/src/loader.rs
