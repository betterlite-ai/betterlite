    why: Exact projection and the Prisma-only CA probe/file path replaced by native bundle loading.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L81-L96
    why: Complete libpq query allowlist.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm-proxy-extras/litellm_proxy_extras/utils.py#L715-L753
    why: Strip behavior and reverse Prisma CA/sslaccept conversion, including sslkey bypass.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/pgbouncer.py#L99-L110
    why: Real PgBouncer env defaults, case policy and numeric bounds.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/pgbouncer.py#L175-L280
    why: Upstream pool/TLS config and loopback URL behavior being replaced, not a native Python policy helper.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/pgbouncer.py#L686-L743
    why: Embedded process lifecycle intentionally absent from the native gateway.
dod:
  - text: 'Compatibility projections have named cases: untouched_tls_url, verify_modes_rewritten,
      blank_pinned_tls_values, duplicate_root_pairs, root_without_mode, explicit_cert_precedence,
      resolver_host_port_arguments, malformed_port_error, strip_exact_libpq_allowlist,
      strip_blank_pairs_and_percent_spaces, sslkey_client_cert_bypass, absent_sslaccept_drops_ca,
      accept_invalid_certs_drops_ca, disable_drops_prisma_ca, strict_forces_verify_full,
      existing_root_wins, first_sslmode_and_sslaccept. Each case calls the actual MIT helper.'
    proof: [behavior-tests, helper-python, helper-case-corpus, oracle]
  - text: 'Real connector tests prove tls_valid_chain, tls_hostname_mismatch, tls_unknown_root,
      tls_unreadable_root, tls_malformed_root, tls_verify_ca_checks_hostname,
      tls_require_without_strict, tls_prefer_plaintext_fallback and native_full_ca_bundle_no_probe_file.'
    proof: [behavior-tests, tls-tests]
  - text: 'Loader tests prove pool_env_defaults, pool_enabled_boolean_values,
      invalid_pool_settings_stop_loading, invalid_pool_ranges_stop_loading,
      native_writer_pool_cap, native_disabled_pool_unchanged, native_ignored_options_warn_once,
      native_reader_and_migration_uncapped and external_pooler_disables_prepared_statements.'
    proof: [config-tests, config-corpus, behavior-tests]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: TLS projection and native connection/pool behavior must pass beyond corpus replay.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::/) - test(/replays_the_/)'
    - id: tls-tests
      why: An actual SQLx connection must enforce root and hostname verification.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::tls_valid_chain$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::tls_hostname_mismatch$/)' && cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^database_tls::tests::tls_unknown_root$/)'
    - id: config-tests
      why: Invalid env settings must fail the real loader and valid ones must drive the native pool policy.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^database_tls::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: Projection adapters must import pinned code and pass strict checks.
      run: test -f tools/oracle/helpers/database_tls.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: New TLS projection operations must have accepted typed corpus inputs.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/database-tls-*")" && grep -rlq database_tls tools/oracle/fuzz/corpus/helper_case/database-tls-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-corpus
      why: Pool settings must be present in new loader seeds, rather than silently ignored.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/database-tls-*")" && grep -rlq LITELLM_PGBOUNCER_ENABLED crates/betterlite-config/fuzz/corpus/config_yaml/database-tls-* && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/database-tls/libpq-to-prisma.yaml
  - tools/oracle/cases/helpers/database-tls/blank-and-duplicate-tls-params.yaml
  - tools/oracle/cases/helpers/database-tls/prisma-to-libpq.yaml
  - tools/oracle/cases/helpers/database-tls/client-cert-and-root-precedence.yaml
  - tools/oracle/cases/helpers/database-tls/libpq-allowlist.yaml
deviations:
  - what: LITELLM_PGBOUNCER_ENABLED=true caps the native writer pool and leaves the original endpoint in use;
      explicit port, client-count and binary settings warn once and do not launch a process or create credential files.
    why: Preserve the existing native-pool plan; the Rust gateway cannot spawn the embedded PgBouncer supervisor.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/pgbouncer.py#L686-L743
  - what: Native TLS loads every root in the configured CA bundle without a preliminary Postgres probe or
      litellm-sslcert temporary file; certificate verification occurs on the real database connection.
    why: The pin's reduction to one PEM root works around Prisma's certificate loader, which rustls does not need.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_url_settings.py#L154-L218
out_of_scope:
  - B710 owns settings and password assembly, B712 token_auth and token URL branches, B2307 query/flag
    helpers and URL byte decoding. B051 composes apply_to_env, with typed results instead of global writes.
  - _VerifiedChainSource.get_verified_chain, _verified_chain_der, _server_trust_anchor, pin_bundle_root
    and _replace_file are replaced by the recorded native bundle-loading deviation, not reimplemented.
  - The embedded-pooler deviation replaces PgBouncerPlan.userlist, _single_quoted, _userlist_quote,
    _option_settings, _connect_query, _server_tls_settings, plan_pgbouncer, pooled_database_url,
    _write_private, write_pgbouncer_ini, write_userlist, export_pooled_database_url,
    PgBouncerTokenSource.mint/expires_at, _utcnow,
    PgBouncerTokenRefresher.__init__/refresh/start/_run/_refresh_and_report/stop,
    _port_open, _unix_socket_open, unix_socket_path, pgbouncer_version, _end,
    PgBouncerProcess.__init__/pid/_spawn/_wait_ready/start/_watch/_supervise/_restart_after_delay/
    _retry_restart/reload/stop, install_pgbouncer_token, _install_upstream_password,
    _only_in_this_process and start_in_container_pgbouncer. B854 owns native token refresh.
  - B712 owns database_url_is_pooled as a retained compatibility predicate for the exact
    LITELLM_PGBOUNCER_POOLED_DATABASE_URL=true marker; native pool setup does not create that marker.
  - Extras utils.py ledger helpers and _prisma_schema_param belong to B716, v2 recovery and excluded
    v1 fallback to B717, drift/index repair to B857 and startup entry points to B051; str_to_bool is B2307.
pitfalls:
  - 'The oracle helper for this task is pre-registered as database_tls in the db group. Replace the stub Op in tools/oracle/src/helpers/db/database_tls.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/database_tls.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A blank sslcert key suppresses sslrootcert conversion even though it cannot identify a useful certificate.
  - sslkey changes the meaning of sslcert in the reverse translation and bypasses Prisma CA handling.
  - Source verify-ca becomes strict hostname verification through the Prisma dialect.
budget:
  max_changed_lines: 800
  max_new_expects: 0
review_level: security
