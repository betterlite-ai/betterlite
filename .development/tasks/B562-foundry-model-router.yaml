id: B562
title: Foundry model-router metadata and selection
description: >-
  Add FoundryRoute and SelectedModel metadata over model-router prefixes and the returned underlying model. Preserve
  route-family selection, prefix stripping and get_models projections. calculate_additional_costs delegates the
  opaque selected-model accounting input to B068; no floating point pricing runs here.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure_ai/common_utils.py:
  AzureFoundryModelInfo.get_model_router_selected_model L194-L205; AzureFoundryModelInfo.is_model_router_call L208-L226;
  AzureFoundryModelInfo.get_api_version L237-L238; AzureFoundryModelInfo.api_version L241-L242; AzureFoundryModelInfo.get_token_counter
  L244-L258; AzureFoundryModelInfo.get_models L260-L267; AzureFoundryModelInfo.strip_model_router_prefix L274-L293;
  AzureFoundryModelInfo.get_base_model L296-L308; AzureFoundryModelInfo.validate_environment L345-L356. litellm/llms/azure_ai/azure_model_router/transformation.py:
  AzureModelRouterConfig.transform_request L31-L50; AzureModelRouterConfig.transform_response L52-L109.


  Named case contracts: strip_model_router_prefix: Strip through first model_router/ anywhere in the name; only
  if absent try model-router/. Matching is case-sensitive and underscore spelling wins if both occur. get_base_model
  performs no other stripping and passes that result to the B550 parent request and response transforms. response_selected_model:
  After parent projection, a truthy response.model is stamped unchanged under hidden azure_model_router_selected_model
  by rebuilding the hidden mapping. Preserve unrelated metadata and isolate two responses; do not add a second azure_ai/
  prefix here. unknown_selected_model_fallback: Reader accepts only nonempty string stamp. is_model_router_call
  accepts such a stamp first, then checks both deployment litellm_model_name-or-model and caller model through B2230;
  a nonrouter deployment name does not suppress a router caller name. No truthy selected model leaves the existing
  hidden map untouched. catalog_model_list: get_models always returns [] regardless of api_key/api_base and makes
  no network request. native_token_counter_selection: Only a truthy model containing claude case-insensitively constructs
  B565 native token counter; all others return None. api_version_and_unsupported_validation: Version precedence
  is truthy explicit api_version, litellm.api_version, AZURE_API_VERSION, then None; property uses no explicit override.
  validate_environment always raises NotImplementedError: Azure Foundry does not support environment validation.


  Reuse B2202 get_hidden_params_dict; no dependency on router dispatch. Configuration api_version and AZURE_API_VERSION
  are loaded by B2200/B549; this task consumes their resolved inputs.


  Shared provider base helper implementations are B2202: use its owned primitives directly when called by these
  ranges. Do not reintroduce a dependency on B010/B016 for these small helpers.


  AzureFoundryModelInfo.__init__ belong to B2220; delegate those calls directly and retain only the remaining owned
  bodies.


  AzureFoundryModelInfo.get_azure_ai_config_for_model belong to B2230; delegate those calls directly and retain
  only the remaining owned bodies.


  Implement crates/betterlite-foundry/src/model_router.rs with adjacent tests under model_router/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function model_router_cases in betterlite-foundry with these exact named cases (one per oracle file):
  strip_model_router_prefix, response_selected_model, unknown_selected_model_fallback, catalog_model_list, native_token_counter_selection,
  api_version_and_unsupported_validation. Each case exercises its named outcome independently; use stable supplied
  clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register a
  duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/foundry_model_router* using HelperCase: kind:
  helper and the externally tagged foundry_model_router variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_foundry_model_router that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 156 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 200 production lines, 190 behavior/config-test lines,
  90 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 505 planned, 525 maximum changed lines.
