checks:
  optional:
  - mutants
  commands:
  - id: case-strip-model-router-prefix
    why: Strip through first model_router/ anywhere in the name; only if absent try model-router/. Matching is case-sensitive
      and underscore spelling wins if both occur. get_base_model performs no other stripping and passes that result
      to the B550 parent request and response transforms.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_strip_model_router_prefix$/)'
  - id: case-response-selected-model
    why: After parent projection, a truthy response.model is stamped unchanged under hidden azure_model_router_selected_model
      by rebuilding the hidden mapping. Preserve unrelated metadata and isolate two responses; do not add a second
      azure_ai/ prefix here.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_response_selected_model$/)'
  - id: case-unknown-selected-model-fallback
    why: Reader accepts only nonempty string stamp. is_model_router_call accepts such a stamp first, then checks
      both deployment litellm_model_name-or-model and caller model through B2230; a nonrouter deployment name does
      not suppress a router caller name. No truthy selected model leaves the existing hidden map untouched.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_unknown_selected_model_fallback$/)'
  - id: case-catalog-model-list
    why: get_models always returns [] regardless of api_key/api_base and makes no network request.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_catalog_model_list$/)'
  - id: case-native-token-counter-selection
    why: Only a truthy model containing claude case-insensitively constructs B565 native token counter; all others
      return None.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_native_token_counter_selection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_model_router.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_model_router*")"
      && grep -lq 'foundry_model_router' tools/oracle/fuzz/corpus/helper_case/foundry_model_router* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_model_router$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-api-version-and-unsupported-validation
    why: 'Version precedence is truthy explicit api_version, litellm.api_version, AZURE_API_VERSION, then None;
      property uses no explicit override. validate_environment always raises NotImplementedError: Azure Foundry
      does not support environment validation.'
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_api_version_and_unsupported_validation$/)'
