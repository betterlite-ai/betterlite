pitfalls:
- 'The oracle helper for this task is pre-registered as foundry_model_router in the foundry group. Replace the stub Op in tools/oracle/src/helpers/foundry/model_router.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/foundry_model_router.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
