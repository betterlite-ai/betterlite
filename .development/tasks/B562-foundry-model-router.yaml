checks:
  optional:
  - mutants
  commands:
  - id: case-route-selection
    why: The route-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_route_selection$/)'
  - id: case-strip-model-router-prefix
    why: The strip-model-router-prefix behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_strip_model_router_prefix$/)'
  - id: case-response-selected-model
    why: The response-selected-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_response_selected_model$/)'
  - id: case-unknown-selected-model-fallback
    why: The unknown-selected-model-fallback behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_unknown_selected_model_fallback$/)'
  - id: case-catalog-model-list
    why: The catalog-model-list behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_catalog_model_list$/)'
  - id: case-native-token-counter-selection
    why: The native-token-counter-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-foundry --no-tests=fail -E 'test(/::model_router_cases::case_[0-9]+_native_token_counter_selection$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/foundry_model_router.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/foundry_model_router*")"
      && grep -lq 'foundry_model_router' tools/oracle/fuzz/corpus/helper_case/foundry_model_router* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_foundry_model_router$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
