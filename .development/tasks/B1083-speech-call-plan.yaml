id: B1083
title: Speech call plan
description: >-
  Prepare the native speech operation from main.py: resolve model/provider, optional voice/input/format/speed, extra
  body and configured credentials into a typed SpeechPlan. Select native speech versus the speech-chat-bridge without
  executing either branch, retaining source parameter support/errors.


  Implement crates/betterlite-core/src/api/speech_call_plan.rs. Use SpeechCallPlanInput and SpeechCallPlanResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions speech_voice_input, speech_native_plan, speech_chat_plan, speech_format_speed,
  speech_unsupported_parameter under api::speech_call_plan::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.num_retries
  defaults to None; litellm_settings.api_base defaults to None; env.OPENAI_BASE_URL defaults to unset (None); env.OPENAI_API_BASE
  defaults to unset (None); litellm_settings.api_key defaults to None; litellm_settings.openai_key defaults to None;
  env.OPENAI_API_KEY defaults to unset (None); litellm_settings.organization defaults to None; env.OPENAI_ORGANIZATION
  defaults to unset (None); litellm_settings.project defaults to None; env.OPENAI_PROJECT defaults to unset (None);
  litellm_settings.headers defaults to None; env.AZURE_API_BASE defaults to unset (None); litellm_settings.api_version
  defaults to None; env.AZURE_API_VERSION defaults to unset (None); litellm_settings.azure_key defaults to None;
  env.AZURE_OPENAI_API_KEY defaults to unset (None); env.AZURE_API_KEY defaults to unset (None); env.AZURE_AD_TOKEN
  defaults to unset (None). No environment reads occur outside betterlite-config. Test api::speech_call_plan::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::SpeechCallPlan in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {speech_call_plan: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/main.py: aspeech (L8199-L8234); litellm/main.py: speech (L8238-L8452). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 216 owned nonblank/non-comment/non-docstring Python lines (219 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 236 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 87 config tests/seeds and
  30 wiring; 573 total within the 580-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B010 (Provider framework, provider resolution and parameter mapping), B171 (Direct helper
  oracle and URL path encoding), B174 (Provider identity and model resolution), B1003 (Speech chat bridge), B1087
  (Api boundaries), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not
  provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
