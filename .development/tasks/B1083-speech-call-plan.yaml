id: B1083
title: Async speech invocation
description: >-
  Own the complete aspeech wrapper at main.py:8198-8234 in betterlite-core::api::speech_call_plan. B1084 owns
  speech, including all Azure/OpenAI preparation and dispatch. This wrapper takes args[0] or required keyword
  model before its try, forces aspeech=true, copies request context and calls speech. It awaits a coroutine
  result. For every noncoroutine result it calls speech a second time and returns that second result, rather
  than returning the first. This matters for chat-bridged speech, which returns synchronously even when the
  wrapper is async. Preserve both provider calls and their order; do not add a deduplication optimization.

  Provider attribution is initialized from custom_llm_provider but then overwritten by get_llm_provider(model,
  api_base), without passing the explicit provider argument to that resolver. Failures inside the try use B011
  with the resolved provider or openai fallback; missing keyword model escapes as KeyError before mapping.
  The Rust service awaits its injected executor without blocking the runtime; B159 owns the Python event-loop
  surface. Use B2401 SDK HTTP calls to compare real call counts, plus native fault injection for invalid result
  shapes. No new parser or config key belongs here. Count 29 nonblank/non-comment lines; allow 60 integration,
  120 tests,110 fixtures,80 adapters and 30 wiring, 400 lines.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/speech_call_plan.rs
  - crates/betterlite-core/src/api/speech_call_plan/**
  - tools/oracle/src/sdk_http.rs
  - tools/oracle/src/sdk_http/speech_call_plan.rs
  - tools/oracle/sdk_http/dispatch.py
  - tools/oracle/sdk_http/speech_call_plan.py
  - tools/oracle/cases/sdk-http/speech-call-plan/**
  - tools/oracle/fuzz/corpus/sdk_http_case/speech-call-plan-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8198-L8234
  why: Own model lookup, forced async flag, context propagation and the noncoroutine second-call branch.
dod:
- text: >-
    async_native_speech calls aspeech(model=openai/tts-1,input=hello,voice=alloy,aspeech=false). The inner
    flag is true, the returned coroutine is awaited once, one /v1/audio/speech request is captured and mock
    bytes 000102 are returned. A request-context marker survives preparation and provider logging.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    async_bridged_speech_calls_twice uses Gemini TTS through B1003 and mock audio payloads AAA= then AQE=.
    The wrapper issues two completion HTTP requests in sequence and returns the second payload wrapped as
    WAV, not the first. A native immediate binary response also causes a second invocation; a second result
    of an unexpected type is returned unchecked by this wrapper. Keep provider retries disabled so call
    count measures this branch alone.
  proof: [behavior-tests, oracle, sdk-python]
- text: >-
    async_speech_error_attribution omits positional and keyword model: expect KeyError("model"), zero
    provider requests and no wrapper exception mapping. An inner resolver failure with provider unset maps
    with provider=openai; one after provider resolution uses that provider. An explicitly supplied provider
    is replaced when the wrapper resolver returns another. A mock OpenAI 429 retains B011's SDK class/status/
    optional fields and triggers no second invocation because the coroutine raised rather than returned.
  proof: [behavior-tests, oracle, sdk-python]
- text: Async speech adds a typed SDK operation seed and independent HTTP count fixtures.
  proof: [sdk-corpus, new-cases, oracle, sdk-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: One-versus-two invocation behavior and pre-try failure attribution must not regress.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::speech_call_plan::tests::/)'
  - id: sdk-python
    why: The async SDK entry point needs a typed HTTP adapter, not a prepared-plan helper.
    run: test -f tools/oracle/sdk_http/speech_call_plan.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: Async speech invocation must parse through the SDK case decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/speech-call-plan-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
  - id: new-cases
    why: The wrapper's duplicated completion call needs a newly captured provider transcript.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/sdk-http/speech-call-plan)"
oracle_cases:
- tools/oracle/cases/sdk-http/speech-call-plan/async-native-speech.yaml
- tools/oracle/cases/sdk-http/speech-call-plan/async-bridged-speech-calls-twice.yaml
- tools/oracle/cases/sdk-http/speech-call-plan/async-speech-error-attribution.yaml
deviations: []
out_of_scope:
- B1084 owns all speech preparation and dispatch; B1082 owns transcription/atranscription. B158 retains general main.py facade functions and provider umbrellas their _complete_* dispatch functions.
- B174 owns get_llm_provider, B011 exception_type and B159 public Python exports; no provider credential setting is owned by this wrapper.
pitfalls:
- An immediate successful speech response is discarded and the operation is invoked again.
- Missing model is outside try, unlike provider resolution and execution failures.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 0
