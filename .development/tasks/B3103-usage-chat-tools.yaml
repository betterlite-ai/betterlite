dod:
  - text: An admin gets get_usage_data, get_team_usage_data and get_tag_usage_data with LiteLLM's schemas and descriptions; any other caller gets get_usage_data only.
    proof: [tools-prompt-tests, oracle, helper-python]
  - text: The system prompt equals LiteLLM's base text plus the role's tool block and the clock's date line, for admin and non-admin.
    proof: [tools-prompt-tests, oracle, helper-python]
  - text: parse_csv_ids returns none for none or empty text and otherwise trims and drops empty parts, so a text of only commas and spaces gives an empty list.
    proof: [parse-ids-tests, oracle, helper-python]
  - text: A non-admin get_usage_data call always uses the caller's own id and ignores a user_id the model sent; a non-admin with no caller id is refused instead of querying globally.
    proof: [fetch-args-tests, oracle, helper-python]
  - text: An admin forwards user_id, team_ids and tags only when non-empty, and missing or empty start_date or end_date is an error for every tool.
    proof: [fetch-args-tests, oracle, helper-python]
  - text: The usage summary prints the metadata header, models cut to 15 and providers cut to 10 by descending spend, truncated counts, and "(no data)" for an empty list.
    proof: [summary-usage-tests, oracle, helper-python]
  - text: The entity summary returns the no-data sentence for an empty page, sums entities across days, keeps the first-seen alias, ranks by spend and prints the count with the lowercase plural label.
    proof: [summary-entity-tests, oracle, helper-python]
  - text: Frames are the text `data:`, a space, then Python-style JSON plus a blank line, with the key order type, tool_name, tool_label, arguments, status for tool events.
    proof: [sse-tests, oracle, helper-python]
  - text: The global fetcher uses the aggregated path and the missing-database error, and the team and tag fetchers use page 1 with page size 200 and the right table and id field.
    proof: [source-tests]
  - text: A plain answer streams status, one chunk and done; a tool answer streams status, tool_call running, tool_call complete, status, chunks and done, in that order.
    proof: [flow-tests]
  - text: A failing tool or an unknown tool name becomes a tool message and the stream continues; a failure outside the tool handler ends with one generic error event and no done.
    proof: [flow-tests]
  - text: Only the last 20 messages reach the model and an empty or blank model name falls back to gpt-4o-mini.
    proof: [flow-tests]
  - text: Tool-argument text that is not a JSON object of strings is rejected without a panic, and the fuzz corpus replays.
    proof: [fetch-args-tests, arguments-corpus]
  - text: Newly added helper corpus cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: tools-prompt-tests
      why: the role tool lists or the system prompt text are missing or differ from LiteLLM
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::(tools|prompt)_/)'
    - id: parse-ids-tests
      why: comma-list parsing is missing or treats blank parts differently from LiteLLM
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::parse_ids_/)'
    - id: fetch-args-tests
      why: the argument gate or the tool-argument decoder is missing or lets a non-admin widen the query
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::fetch_args_/) - test(replays_the_usage_tool_arguments_corpus)'
    - id: summary-usage-tests
      why: the usage summary text, ranking, limits or number formatting is missing or wrong
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::summary_usage_/)'
    - id: summary-entity-tests
      why: the team and tag summary text, aggregation or alias rule is missing or wrong
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::summary_entity_/)'
    - id: sse-tests
      why: SSE framing or event key order is missing or wrong
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::sse_/)'
    - id: source-tests
      why: the real data source builds the wrong scope, path or page size for a tool
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::source_/)'
    - id: flow-tests
      why: the event order, tool error handling, truncation or model fallback is missing or wrong
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^usage_ai_chat::tests::flow_/)'
    - id: arguments-corpus
      why: the tool-argument fuzz target or its fresh replay corpus is missing or fails
      run: >-
        test -f crates/betterlite-server/fuzz/fuzz_targets/usage_tool_arguments.rs &&
        grep -q 'name = "usage_tool_arguments"' crates/betterlite-server/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/usage_tool_arguments)" &&
        cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_usage_tool_arguments_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3103)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3103 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3103/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added usage chat helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/usage_ai_chat-*")" &&
        grep -lE '^[[:space:]]+b3103:' tools/oracle/fuzz/corpus/helper_case/usage_ai_chat-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
