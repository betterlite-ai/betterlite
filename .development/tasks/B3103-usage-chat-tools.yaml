id: B3103
title: Fetch and summarize role-specific usage chat tools
description: >-
  Build the engine behind LiteLLM's `/usage/ai/chat` in a new module of betterlite-server,
  `crates/betterlite-server/src/usage_ai_chat.rs` and its folder. The route itself is not in this task. This task
  is `ai_usage_chat.py`: the tool list for each role, the system prompt, the three data fetchers, the two text
  summarisers, the tool dispatch, and the event stream that talks to a language model. A later task registers the
  route and hands this module its collaborators.


  The module has no globals. Everything outside it comes in through a parts struct, `UsageChatParts`, built by the
  caller: a model client, a data source, and a clock that returns the server's local calendar date. Use native
  `async fn` in traits and generics, not `dyn`, and add no dependency (futures-util, tokio, serde_json and indexmap
  are already in betterlite-server).
  `UsageChatModel` has two methods. `complete(&self, request: &ModelRequest) -> Result<ModelReply, ModelError>` is
  one non-streaming call with `model`, `messages`, optional `tools` and `temperature`. `ModelReply` holds
  `content: Option<String>` and `tool_calls: Vec<ModelToolCall>`, where `ModelToolCall` is `id`, `name` and the raw
  `arguments` string. `stream(&self, request: &ModelRequest) -> Result<impl Stream<Item = Result<String, ModelError>>, ModelError>`
  yields only the non-empty content deltas of a streaming call. `UsageDataSource` has three async methods,
  `global(start_date, end_date, user_id: Option<&str>)`, `teams(start_date, end_date, team_ids: Option<&[String]>)`
  and `tags(start_date, end_date, tags: Option<&[String]>)`, each returning B3090's paginated response type
  (the alias for `SpendAnalyticsPaginatedResponse`). Messages are a small typed enum, not a JSON map: system, user,
  assistant text, assistant with tool calls, and tool result (`tool_call_id`, `content`).


  The real data source is `DailyActivityUsageData`, built from a B729 `DailyActivityRepository` handle that may be
  absent. Read the exact signatures from B3091, B3092 and B3093 in `crates/betterlite-server/src/daily_activity/`.
  Constants (all from LiteLLM): `USAGE_AI_TEMPERATURE` 0.2, `PAGINATED_PAGE_SIZE` 200, `MAX_CHAT_MESSAGES` 20,
  `TOP_N_MODELS` 15, `TOP_N_PROVIDERS` 10, table names `litellm_dailyuserspend`, `litellm_dailyteamspend`,
  `litellm_dailytagspend`, id fields `user_id`, `team_id`, `tag`. The default chat model is `gpt-4o-mini`
  (`DEFAULT_COMPETITOR_DISCOVERY_MODEL` in litellm/constants.py L2055); no task owns that constant, so define it here.
  `TOP_N_KEYS` (10) has no caller at the pin and is not built.


  The fetchers differ and the difference must stay. `global` (tool `get_usage_data`) goes through the aggregated path:
  with no repository it fails with the database-not-connected error (HTTP 500 shape, text from
  `CommonProxyErrors.db_not_connected_error`), otherwise it builds a scope with B3092's `daily_activity_scope`
  (table `litellm_dailyuserspend`, field `user_id`, the user id or none, no exclusions, no api key, the two date strings
  as given, no model, no timezone) and calls B3093's `get_daily_activity_aggregated` with defaults. It does not
  parse the dates itself. `teams` and `tags` go through B3091's paginated `get_daily_activity` with page 1, page size
  200, no model, no api key and no entity metadata, so they see at most the first 200 daily rows and B3091 parses
  and rejects bad dates. A comma list goes through `parse_csv_ids`: none or empty text gives none, otherwise split on
  commas, trim each part, drop empty parts. So `" , "` gives an empty list, not none.


  Tools are the three OpenAI function definitions, `get_usage_data` (properties `start_date`, `end_date`, `user_id`),
  `get_team_usage_data` (`start_date`, `end_date`, `team_ids`) and `get_tag_usage_data` (`start_date`, `end_date`,
  `tags`). All three require only the two dates. `tools_for_role(is_admin)` gives all three for an admin and only
  `get_usage_data` for anyone else. Copy every description string, the system prompt base and both tool-description
  blocks character for character from the LiteLLM lines in the references. The system prompt is the base text, a blank
  line, the role's tool block, then `Today's date: ` and the clock's date as YYYY-MM-DD.


  `resolve_fetch_kwargs(fn_name, args, user_id, is_admin)` is the security gate and returns the typed fetch arguments.
  Missing or empty `start_date` or `end_date` is an error. For `get_usage_data` a non-admin always gets the caller's own
  `user_id` and whatever `user_id` the model sent is ignored; a non-admin with no caller id is an error ("refusing to
  issue an unscoped query"), never a global query. An admin passes the model's `user_id` only when it is non-empty.
  `get_team_usage_data` passes `team_ids` and `get_tag_usage_data` passes `tags` only when non-empty. Decode the
  model's tool arguments with `decode_tool_arguments(&str) -> Result<IndexMap<String, String>, UsageChatError>`: a JSON
  object of string values, key order kept. Anything else is an error.


  `summarise_usage_data` builds the text for the global tool and `summarise_entity_data(page, label)` the text for
  teams (`Team`) and tags (`Tag`). Both read the typed page, not JSON. The usage summary prints a four-line header from
  the page metadata (`Total Spend: $x.xxxx`, `Total Requests: n`, `Successful: n | Failed: n`, `Total Tokens: n`),
  then models and providers summed over all days, ranked by spend descending (stable on ties, first-seen order), cut
  to 15 and 10 lines, with `  (no data)` when a list is empty. Request and token counts are cut toward zero with
  `int()` semantics. The entity summary returns `No {label} usage data found for the given date range.` when the page
  has no days. Otherwise it sums `entities` across days, ranked by spend descending, and prints
  `{label} Usage ({n} {label lowercased}s):`, a blank line, and `- {alias} (ID: {id}): $x.xxxx | n reqs | n tokens`.
  The alias is the one from the first day the entity appears, falling back to the id.


  `stream_usage_ai_chat(parts, messages, model, user_id, is_admin, sink)` writes SSE frames in order to a
  `tokio::sync::mpsc::Sender<String>`; a failed send means the client left, so return quietly. The order is: status
  `Thinking...`, one non-streaming model call with the role's tools, then either the plain answer (a `chunk` event if the
  content is non-empty, then `done`) or the tool path. The model is the trimmed `model` or the default when empty or
  absent. Only the last 20 messages are kept. On the tool path append the assistant message with its tool calls once,
  then run each call in order. A call whose name is not in the role's tool list gets the tool message
  `Tool not available: {name}` and no events. Otherwise send `tool_call` `running`, run resolve, fetch and summarise, and
  send `complete`; on any failure log "Tool {name} failed: {error}" at error level, answer the tool message
  `Error fetching {label}. Please try again.` and send `error` status. Labels: `global usage data`, `team usage data`,
  `tag usage data`. Then status `Analyzing results...`, a second call with `stream` on, temperature 0.2 and no tools,
  one `chunk` per delta, and `done`. Any failure outside the per-tool handler (bad tool-argument JSON, a model error,
  a mid-stream error) logs "AI usage chat failed: {error}" and sends one `error` event with the message
  `An internal error occurred. Please try again.`, with no `done`.


  A frame is `data: ` plus the event as JSON plus a blank line, with Python's `json.dumps` default separators and key
  order (docs/compatibility.md covers the formatting rules). `tool_call` events carry `type`, `tool_name`, `tool_label`,
  `arguments` (the model's map as sent), `status`; `error` status events do not carry the optional `error` field.


  Tests live under `usage_ai_chat::tests`, with names starting `tools_`, `prompt_`, `fetch_args_`, `parse_ids_`,
  `summary_usage_`, `summary_entity_`, `sse_`, `source_` and `flow_`. `flow_` tests drive `stream_usage_ai_chat` with a fake
  model and a fake data source and assert the exact frames. `source_` tests drive `DailyActivityUsageData` against a
  recording repository and assert the scope each tool builds.
