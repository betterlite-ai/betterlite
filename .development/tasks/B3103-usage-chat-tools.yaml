deviations:
  - what: The module does not call a language model itself. It takes a model client and a data source from its caller, and the caller owns the route, auth and keep-alive pings.
    why: B3103 covers ai_usage_chat.py only, and litellm.acompletion belongs to the router tasks, so the module gets them through traits.
  - what: The assistant message that carries the tool calls is sent back to the model with role, content and tool_calls only.
    why: LiteLLM sends `Message.model_dump()` with its null extras (function_call, audio, provider_specific_fields); they carry no meaning for the follow-up call.
  - what: Tool-argument text that is not a JSON object of string values ends the stream with the generic error event.
    why: LiteLLM declares the arguments as a string map and a wrong shape is outside docs/compatibility.md; the result is the same error event LiteLLM sends for unparseable JSON.
  - what: Summaries read the typed paginated response, with no JSON dump in between.
    why: Same numbers and text, one less conversion; the oracle cases feed the dump shape and compare the text.
out_of_scope:
  - "The `/usage/ai/chat` route, its request body (ChatMessage, UsageAIChatRequest), admin detection, `require_caller_user_id_for_non_admin` and the SSE keep-alive wrapper are in endpoints.py and sse_keepalive.py. No entry covers endpoints.py at the pin of this planning pass; see the notes."
  - "The default model name `gpt-4o-mini` is defined here only because no task owns litellm/constants.py's constant."
  - "`litellm.acompletion` and the router are B158 and B6020; the model client trait is wired to them by the route task."
  - "`get_daily_activity`, `get_daily_activity_aggregated`, `daily_activity_scope` and `daily_activity_repository` are B3091, B3093 and B3092. This task calls them."
  - "`TOP_N_KEYS` and the `_UsageDump` overload protocol have no caller at the pin and no Rust meaning."
pitfalls:
  - A non-admin model call can send any `user_id` to get_usage_data; the gate replaces it with the caller's id, and the tool list alone is not the defense, so dispatch also refuses team and tag tools for a non-admin by name.
  - The global fetcher passes the model's date strings to the scope untouched, while the team and tag fetchers go through the canonical date parser in B3091, so a bad date fails in different places for the two.
  - The team and tag fetchers read only page 1 with 200 rows, so a long range silently truncates; do not page.
  - "`_parse_csv_ids(\" , \")` is an empty list and not none, and an empty list is a different scope from no filter."
  - The entity alias comes from the first day that has the entity, and ties in spend keep first-seen order, so use an order-preserving map and a stable sort.
  - "`int()` on the request and token sums cuts toward zero, and money is always `{:.4f}` with a leading `$`, including `$0.0000` for missing totals."
  - The usage summary has no "no data" shortcut for an empty page; it prints the zero header and two "(no data)" lists.
  - When the model answers with tool calls, any text in that same reply is dropped and never sent as a chunk.
  - After tools run, the second model call is streaming and carries no `tools` argument, so the model cannot chain tool rounds.
  - The error event after a tool or model failure is followed by no `done` event, and the tool-level `error` status is not the same event type.
  - A tool argument key order is part of the `tool_call` event, so decode into an ordered map.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
