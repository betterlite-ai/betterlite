id: B3761
title: Cisco MCP envelopes and output replacement
description: >-
  Build JSON-RPC request/response projection helpers, MCP tool-context hydration, synthesized
  blocked response generation, and in-place MCP response text rewriting. These pure helpers
  normalize diverse MCP response shapes (MCP SDK models, dicts, Pydantic-coerced field lists)
  into JSON-RPC envelopes for /inspect/mcp, hydrate inspection context from nested metadata,
  and replace tool-call output without reading or writing the verdict. The blocking response
  synthesizes a JSON error payload as TextContent, preserving response_cost from HiddenParams
  if present.


  Request payloads preserve literal jsonrpc/id/method/params from the original call or build
  them from mcp_tool_name, mcp_arguments and litellm_call_id. Response payloads combine the
  request envelope with result/error from the normalized response shape. Text content
  rewriting searches mcp_tool_call_response, content lists, structured_content/structuredContent
  and dict result fields, then updates each text item and its structured_content mirror.

