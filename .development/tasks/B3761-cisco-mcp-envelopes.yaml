    why: _build_mcp_request_payload and _build_mcp_response_payload envelope builders for /inspect/mcp.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L429-L525
    why: _hydrate_mcp_tool_context, _normalize_mcp_response and _build_mcp_result for request-context and response-shape handling.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L531-L602
    why: _set_mcp_tool_response_text in-place rewriting and _coerce_to_content_list shape discovery.
dod:
  - text: JSON-RPC request envelopes preserve or construct jsonrpc (2.0), id, method and params from call data.
    proof: [oracle]
  - text: Response envelopes combine the request payload with result or error from normalized shapes.
    proof: [oracle]
  - text: Tool-context hydration reads mcp_tool_call_metadata from nested metadata and populates mcp_tool_name,
      tool_name, name, mcp_arguments, arguments and mcp_server_name, server_name.
    proof: [mcp-context-tests]
  - text: Response normalization handles dicts, lists, Pydantic models, and Pydantic-coerced field tuples, extracting
      content, id, result and error.
    proof: [oracle, mcp-normalization-tests]
  - text: Blocking response synthesizes MCPPostCallResponseObject with JSON error payload as TextContent and preserves
      response_cost from HiddenParams.
    proof: [mcp-blocking-tests]
  - text: In-place text rewriting finds and updates text content in mcp_tool_call_response, content lists and structured_content/structuredContent fields.
    proof: [mcp-redaction-tests]
checks:
  optional: []
  commands:
    - id: mcp-context-tests
      why: Tool-context hydration does not populate request_data from nested metadata
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/cisco_mcp::.*context/)'
    - id: mcp-normalization-tests
      why: Response shape normalization omits dict, model, list or field-tuple handling
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/cisco_mcp::.*normaliz/)'
    - id: mcp-blocking-tests
      why: Blocking response does not synthesize valid MCPPostCallResponseObject or loses response_cost
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/cisco_mcp::.*block/)'
    - id: mcp-redaction-tests
      why: Text content rewriting does not find or update all response shapes
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/cisco_mcp::.*redact/)'
