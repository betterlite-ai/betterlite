deviations:
  - what: Blocking response synthesizes JSON-serialized error payload, not returning raw detail string.
    why: Cisco inspection returns structured verdicts; MCP tool output is JSON text content.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cisco_ai_defense/cisco_ai_defense_mcp.py#L188-L199
out_of_scope:
  - Sanitized MCP argument extraction from verdicts; B3758 owns _extract_sanitized_mcp_arguments.
  - MCP post-tool hook orchestration; B3762 drives inspection and verdict dispatch.
  - Inspection request/response posting; B3762 calls _post_inspection.
  - Verdict finalization and redaction dispatch; B3760 calls _finalize_inspection.
  - Extraction of request inspection messages; B3756 builds _extract_inspect_messages_from_request.
pitfalls:
  - Response normalization must handle Pydantic model_dump(exclude_none=True, by_alias=True) fallback to model_dump()
    when exclude_none is not supported.
  - Hydration must set mcp_tool_name, tool_name and name to the same value; inspection lookups check all three.
  - Text content rewriting must update both content list text and its structured_content mirror, or text changes
    are invisible to downstream code reading structuredContent.
  - Sanitized payload keys vary between providers (sanitized_payload vs sanitizedPayload, modified_payload vs modifiedPayload);
    check both camelCase and snake_case.
  - In-place list replacement (content[:] = replacement) must not assume setattr works on read-only Pydantic models;
    catch AttributeError and continue to dict-based fallback.
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
