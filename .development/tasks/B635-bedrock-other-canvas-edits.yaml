id: B635
title: Bedrock Nova Canvas edit request policy
description: >-
  Add CanvasEditOptions and typed task bodies for inpainting/outpainting/background removal/image variation and
  conditioning. Preserve catalog-based edit eligibility, input byte/base64 handling, size parsing fallback and response_format
  diagnostic. SDK PathLike reading remains B159; this provider receives resolved uploads, never a request filesystem
  path.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_edit/amazon_nova_canvas_image_edit_transformation.py:
  _nova_canvas_task_body L41-L129; _file_types_to_b64 L132-L153; _supports_nova_canvas_image_edit_from_model_cost
  L156-L215; BedrockAmazonNovaCanvasImageEditConfig._is_nova_canvas_image_edit_model L224-L230; BedrockAmazonNovaCanvasImageEditConfig.get_error_class
  L232-L238; BedrockAmazonNovaCanvasImageEditConfig.get_supported_openai_params L240-L255; BedrockAmazonNovaCanvasImageEditConfig.map_openai_params
  L257-L305; BedrockAmazonNovaCanvasImageEditConfig.transform_image_edit_request L307-L385; BedrockAmazonNovaCanvasImageEditConfig.use_multipart_form_data
  L468-L469; BedrockAmazonNovaCanvasImageEditConfig.get_complete_url L471-L481; BedrockAmazonNovaCanvasImageEditConfig.validate_environment
  L483-L495; get_bedrock_image_edit_config_for_model L498-L519.


  Reuse BedrockModelInfo.get_base_model from B591 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse BedrockStabilityImageEditConfig._is_stability_edit_model from B637 (litellm/llms/bedrock/image_edit/stability_transformation.py);
  its implementation remains with that prerequisite.


  Implement crates/betterlite-bedrock/src/canvas_edits.rs with adjacent tests under canvas_edits/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_other_canvas_edits in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function canvas_edits_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  canvas_task_types, canvas_catalog_eligibility, image_bytes_base64, tuple_file_rejection, size_parse_fallback,
  quality_map, response_format_warning, mask_versus_mask_prompt. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client
  response and captured upstream request. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_edits* using HelperCase:
  kind: helper and the externally tagged bedrock_other_canvas_edits variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_canvas_edits that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 347 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 365 production lines, 117 behavior/config-test lines,
  87 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 594 planned, 600 maximum changed lines.
