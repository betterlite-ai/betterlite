id: B635
title: Bedrock Nova Canvas edit request policy
description: >-
  Add CanvasEditOptions and typed task bodies for inpainting/outpainting/background removal/image variation and
  conditioning. Preserve catalog-based edit eligibility, input byte/base64 handling, size parsing fallback and response_format
  diagnostic. SDK PathLike reading remains B159; this provider receives resolved uploads, never a request filesystem
  path.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/image_edit/amazon_nova_canvas_image_edit_transformation.py:
  _nova_canvas_task_body L41-L129; _file_types_to_b64 L132-L153; _supports_nova_canvas_image_edit_from_model_cost
  L156-L215; BedrockAmazonNovaCanvasImageEditConfig._is_nova_canvas_image_edit_model L224-L230; BedrockAmazonNovaCanvasImageEditConfig.get_error_class
  L232-L238; BedrockAmazonNovaCanvasImageEditConfig.get_supported_openai_params L240-L255; BedrockAmazonNovaCanvasImageEditConfig.map_openai_params
  L257-L305; BedrockAmazonNovaCanvasImageEditConfig.transform_image_edit_request L307-L385; BedrockAmazonNovaCanvasImageEditConfig.use_multipart_form_data
  L468-L469; BedrockAmazonNovaCanvasImageEditConfig.get_complete_url L471-L481; BedrockAmazonNovaCanvasImageEditConfig.validate_environment
  L483-L495; get_bedrock_image_edit_config_for_model L498-L519.


  Reuse BedrockModelInfo.get_base_model from B2203 (litellm/llms/bedrock/common_utils.py); its implementation remains
  with that prerequisite.


  Reuse BedrockError.__init__ from B682 (litellm/llms/bedrock/common_utils.py); its implementation remains with
  that prerequisite.


  Reuse BedrockStabilityImageEditConfig._is_stability_edit_model from B637 (litellm/llms/bedrock/image_edit/stability_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: canvas_task_types: BACKGROUND_REMOVAL emits only taskType and backgroundRemovalParams.image,
  ignoring text/mask/options. Explicit IMAGE_VARIATION emits imageVariationParams with images=[image],text and non-None
  negativeText/similarityStrength even with a mask. OUTPAINTING emits outPaintingParams.image,text plus maskPrompt
  when not None, otherwise maskImage, and non-None negativeText/outPaintingMode. INPAINTING or automatic routing
  with either mask emits inPaintingParams.image,text plus maskPrompt before maskImage and non-None negativeText.
  Otherwise automatic routing emits IMAGE_VARIATION. None, empty and whitespace-only taskType select automatic routing;
  other nonempty values must equal INPAINTING after the earlier exact branches, with no trimming for equality. canvas_catalog_eligibility:
  Falsey model is ineligible. Build ordered unique truthy candidate names: original model; for slash-containing
  names its last segment and bedrock/{segment}; B2203 base model and bedrock/{base} when different; then _get_potential_model_names
  fields combined_model_name,combined_stripped_model_name,stripped_model_name,split_model when strings. Swallow
  exceptions independently from base-model and potential-name generation. Resolve each candidate through the shared
  case-insensitive _get_model_cost_key and inspect raw B193 model_cost entry or empty mapping. Only supports_nova_canvas_image_edit
  literally True qualifies; do not use get_model_info because it drops arbitrary catalog fields. A model spelling
  alone does not grant eligibility. image_bytes_base64: _file_types_to_b64 rejects None with ValueError Nova Canvas
  image edit requires an image input; base64-encode supplied bytes, retain strings unchanged without validation
  or URL fetching, and adapt supplied file-like objects through B159 with seek(0) when available before reading.
  B159 owns PathLike opening and other SDK byte conversions; HTTP uploads arrive as resolved bytes. image is converted
  before mask and before task/prompt validation. tuple_file_rejection: A tuple FileTypes value raises ValueError
  Nova Canvas image edit does not support tuple FileTypes. Pass a file-like object, bytes, or a base64-encoded string.
  Apply the same conversion to non-None mask. A string path or URL is passed as a literal base64-string value, never
  opened or downloaded by this provider. size_parse_fallback: Mapper copies options and always removes size. Only
  a string containing x is split at the first x and converted to two integers; ValueError silently leaves existing
  width/height unchanged, without a warning. Remove n and copy non-None value to numberOfImages. Request transform
  copies options, removes size/width/height, and attempts the same fallback only when both dimensions are None.
  One supplied dimension suppresses size fallback for both. Nested imageGenerationConfig is copied only if a dict;
  non-None top-level width,height,numberOfImages,quality,cfgScale,seed override nested values. Include that config
  only when nonempty and task is not BACKGROUND_REMOVAL. quality_map: Supported params in order are n,size,response_format,mask,negativeText,similarityStrength,cfgScale,seed,quality,taskType,maskPrompt,outPaintingMode,imageGenerationConfig.
  Map hd/premium to premium, standard to standard, preserve every other non-None quality including auto. With truthy
  drop_params remove unknown mapped keys except underscore-prefixed keys and width,height,numberOfImages,mask; without
  it retain extras. Request building ultimately ignores unused options; it does not forward arbitrary unknown fields
  into the final task body. response_format_warning: Remove response_format in the mapper. None and b64_json are
  silent; every other value emits debug message Nova Canvas image edit ignores response_format=%s and returns base64
  images, with the value. This is debug logging, not a warning. Do not add URL response mode. mask_versus_mask_prompt:
  Convert a non-None mask even if maskPrompt or explicit IMAGE_VARIATION later makes it unused, preserving conversion
  failure order. An explicit INPAINTING/OUTPAINTING with None or empty prompt raises ValueError Amazon Nova Canvas
  {task_type} requires a text prompt. Pass a non-empty `prompt` in your request. Otherwise replace None/empty prompt
  with one literal space; whitespace text is retained. Automatic mask-triggered INPAINTING accepts that substituted
  space. Return body and an empty second mapping without mutating caller options. canvas_task_errors: OUTPAINTING
  with neither mask raises ValueError OUTPAINTING requires either a mask image or a mask prompt. Pass mask=<file>
  or maskPrompt=<str> in the request. Unsupported nonempty task type raises ValueError Unsupported Amazon Nova Canvas
  taskType: {task_type!r}. Use BACKGROUND_REMOVAL, OUTPAINTING, IMAGE_VARIATION, INPAINTING, or omit taskType for
  automatic routing (mask → INPAINTING, else IMAGE_VARIATION). INPAINTING without a mask raises ValueError Amazon
  Nova Canvas INPAINTING requires either maskPrompt or maskImage (use OpenAI mask= for maskImage, or pass maskPrompt
  in optional params). See https://docs.aws.amazon.com/nova/latest/userguide/image-gen-req-resp-structure.html.
  Empty maskPrompt counts as present. canvas_edit_contract: use_multipart_form_data returns False. validate_environment
  replaces None headers by an empty mapping and adds exact Content-Type=application/json only when that exact key
  is absent, retaining differently cased keys and existing values. get_error_class delegates B682 preserving status/message/headers.
  get_complete_url raises NotImplementedError Nova Canvas image edit URLs are built in BedrockImageEdit._prepare_request
  (AWS runtime endpoint + model invoke path). Do not use get_complete_url for this config. Native execution uses
  B638 instead. canvas_edit_selector: get_bedrock_image_edit_config_for_model tries B637 Stability detection first,
  then Canvas raw-catalog eligibility, constructs the selected class using B2202 empty base initialization, otherwise
  ValueError Unsupported Bedrock image-edit model: {model!r}. Use a stability.* image-edit model id or add supports_nova_canvas_image_edit
  in model_prices for this id. Exercise the same selection/error cases through B638.


  Reuse B2217 _get_model_cost_key and B2219 _get_potential_model_names where called; shared metadata resolution
  is below this provider, never B157.


  Implement crates/betterlite-bedrock/src/canvas_edits.rs with adjacent tests under canvas_edits/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function canvas_edits_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  canvas_task_types, canvas_catalog_eligibility, image_bytes_base64, tuple_file_rejection, size_parse_fallback,
  quality_map, response_format_warning, mask_versus_mask_prompt, canvas_task_errors, canvas_edit_contract, canvas_edit_selector.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_edits* using HelperCase:
  kind: helper and the externally tagged bedrock_other_canvas_edits variant inside call. Do not put the Python stdin
  operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_other_canvas_edits that parses every
  prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then
  replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 347 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 315 production lines, 310 behavior/config-test lines,
  125 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 780 planned, 800 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/canvas_edits.rs
  - crates/betterlite-bedrock/src/canvas_edits/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/other_canvas_edits.rs
  - tools/oracle/src/helpers/bedrock/other_canvas_edits/**
  - tools/oracle/helpers/bedrock_other_canvas_edits.py
  - tools/oracle/helpers/bedrock_other_canvas_edits/**
  - tools/oracle/cases/helpers/providers/bedrock-other-canvas-edits/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_other_canvas_edits*
  lint_tables: false
