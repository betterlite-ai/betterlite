    why: sign_aws_json_post, SigV4Auth over the session headers, the step sign_json_post shares.
dod:
  - text: No crate outside betterlite-sigv4 and betterlite-bedrock builds aws-sigv4 signing parameters for these five signers; the SQS and DynamoDB signing modules, MCP's own header loops and Strands' AwsCredentials are gone, and the three crates that no longer sign drop aws-sigv4.
    proof: [no-signing-copies]
  - text: betterlite-sigv4's sign_in_place and insert_signed sign SQS's request like botocore, replace stale signing headers, join repeated values, mark every header but X-Amz-Date sensitive and refuse a value that is not text.
    proof: [header-map-tests]
  - text: Secret-managers still signs and maps its errors as before, with Authorization and the token sensitive.
    proof: [no-signing-copies, secret-managers-tests]
  - text: SQS and DynamoDB still sign their requests for their own service and region.
    proof: [no-signing-copies, sqs-tests, dynamodb-tests]
  - text: MCP's signed requests still match the AWS vectors and LiteLLM's helper cases, and a header that is not text fails as SigV4Error::HeaderText.
    proof: [no-signing-copies, mcp-tests, mcp-cases]
  - text: Strands signs with betterlite_sigv4's Credentials, and its tests and helper cases still match LiteLLM's signed headers.
    proof: [no-signing-copies, strands-tests, strands-cases]
checks:
  optional: [mutants]
  commands:
    - id: no-signing-copies
      why: a crate still builds its own aws-sigv4 signing parameters, a forwarding signing module or AwsCredentials is left, or a crate that no longer signs keeps aws-sigv4
      run: test ! -e crates/betterlite-logging/src/sqs_logging/signing.rs && test ! -e crates/betterlite-logging/src/legacy_dynamodb/signing.rs && test -z "$(grep -rlE 'v4::SigningParams|SigningSettings|SignableRequest' crates/betterlite-secret-managers/src crates/betterlite-logging/src/sqs_logging crates/betterlite-logging/src/legacy_dynamodb crates/betterlite-http/src crates/betterlite-openai/src)" && test -z "$(grep -rn 'pub struct AwsCredentials' crates/betterlite-openai/src)" && test -z "$(grep -nE '^aws-sigv4 ' crates/betterlite-secret-managers/Cargo.toml crates/betterlite-http/Cargo.toml crates/betterlite-openai/Cargo.toml)"
    - id: header-map-tests
      why: sign_in_place or insert_signed is missing, signs differently from botocore, keeps a stale header, or marks the wrong headers sensitive
      run: cargo nextest run --locked -p betterlite-sigv4 --no-tests=fail -E 'test(/^sign::header_map::/)'
    - id: secret-managers-tests
      why: the Secrets Manager request lost a signed header, its sensitivity or its error mapping
      run: grep -rq betterlite_sigv4 crates/betterlite-secret-managers/src/aws && cargo nextest run --locked -p betterlite-secret-managers --no-tests=fail -E 'test(/^aws::request_signing::aws_request_signing::/) | test(/^aws_secret_reads::/)'
    - id: sqs-tests
      why: the SQS sender no longer signs its POST or maps the signing error
      run: grep -q sign_in_place crates/betterlite-logging/src/sqs_logging/sender.rs && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^sqs_logging::/)'
    - id: dynamodb-tests
      why: the PutItem request is not signed for the dynamodb service and region, or the DynamoDB logger changed
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^legacy_dynamodb::client::tests::signs_the_put_item_for_the_dynamodb_service_and_region$/)' && cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^(legacy_dynamodb|registry::catalog::dynamodb)::/) - test(/replays_the_/)'
    - id: mcp-tests
      why: an MCP signed request changed against the AWS vectors, or the header-text error no longer reaches the caller
      run: grep -q sign_in_place crates/betterlite-http/src/mcp_sigv4/signing.rs && cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/^mcp_sigv4::/) - test(/replays_the_/)'
    - id: mcp-cases
      why: the MCP helper cases no longer match LiteLLM's signed headers
      run: grep -q sign_in_place crates/betterlite-http/src/mcp_sigv4/signing.rs && cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-http -- tools/oracle/cases/helpers/mcp-sigv4
    - id: strands-tests
      why: the Strands decider lost a signed header, its casing or Content-Length
      run: grep -q betterlite_sigv4 crates/betterlite-openai/src/providers/strands_decider/signing.rs && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(/^providers::strands_decider::/)'
    - id: strands-cases
      why: the Strands helper cases no longer match LiteLLM's signed AgentCore request
      run: grep -q betterlite_sigv4 crates/betterlite-openai/src/providers/strands_decider/signing.rs && cargo run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-openai -- tools/oracle/cases/decisions
oracle_cases: []
deviations: []
out_of_scope:
  - "The S3 signer in betterlite-logging s3_transport/signing.rs with its five callers, and the ElastiCache and RDS query presigners: B10190."
  - "The credential side of each signer: secret-managers' CredentialResolver and AwsCredentialsInfo, SQS's and DynamoDB's CredentialSource, MCP's credential cache and STS flows, and Strands' credentials_from_params keep their types and their logic. B10174 and B10175 own the AWS credential chain."
  - "Strands' JSON POST wrapper is a smaller twin of betterlite-bedrock's sign_aws_json_post (signing/json_post.rs), whose header preparation lives in betterlite-bedrock's signing/headers.rs and cannot be reached from betterlite-openai. Moving that layer down is a separate change."
  - "betterlite-bedrock's own signers already call betterlite_sigv4 after B10173."
pitfalls:
  - "sign_request returns Authorization, X-Amz-Date and X-Amz-Security-Token in botocore's spelling; `HeaderName::from_static` panics on capitals, so insert_signed goes through `HeaderName::from_bytes`, and the X-Amz-Date test compares names with eq_ignore_ascii_case."
  - "sign_in_place keeps X-Amz-Security-Token when the credentials carry no token, as botocore and MCP do; drop it only when it is about to be replaced."
  - "MCP's Date check stays in mcp_sigv4/signing.rs and runs before sign_in_place: the shared function never sees a Date header from MCP, and SQS never sends one."
  - "Secret-managers' test expects Authorization sensitive (prepare_request/tests/signing.rs L256), so insert_signed marks every header but X-Amz-Date, not aws-sigv4's own flags."
  - "Strands' Headers is a BTreeMap, so the returned botocore names land as new keys exactly as litellm_casing put them; don't lowercase them."
  - "Deleting sqs_logging/signing.rs and legacy_dynamodb/signing.rs needs their `pub mod signing;` lines gone too, or the crate stops compiling."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
