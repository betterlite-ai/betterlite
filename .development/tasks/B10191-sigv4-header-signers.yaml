references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/aws_secret_manager_v2.py#L641-L699
    why: _prepare_request, the SigV4Auth POST with Content-Type and X-Amz-Target that secret-managers ports.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/sqs.py#L247-L300
    why: async_send_message, the SigV4Auth form POST the SQS sender ports.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/dynamodb.py#L24-L28
    why: the boto3 DynamoDB resource whose put_item botocore signs with SigV4Auth.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/experimental_mcp_client/client.py#L353-L372
    why: MCPSigV4Auth.auth_flow, SigV4Auth.add_auth over every httpx header, which sign_in_place now does for MCP and SQS.
