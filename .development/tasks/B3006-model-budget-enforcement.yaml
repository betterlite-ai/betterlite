dod:
- text: Pre-call enforcement checks all four entity scopes (key, user, end-user, team), raises BudgetExceededError for over-budget, and respects zero-cap block, negative/unset cap bypass, and key-over-team precedence.
  proof:
  - model-budget-enforcement-enforcement
- text: Post-call charging increments spend counters for all applicable scopes through B3016 integration, marks batch responses once per window, and adds legacy spend reads for key and end-user in the first upgrade window.
  proof:
  - model-budget-enforcement-charging
- text: Fallback model lookup finds the first model in the key's budget_fallbacks that passes enforcement, or returns None.
  proof:
  - model-budget-enforcement-fallbacks
- text: Cache read precedence uses Redis if available, falls back to in-memory DualCache, and treats non-float spend values as zero.
  proof:
  - model-budget-enforcement-cache-reads
- text: Every oracle case exercises pre-call enforcement across scopes, fallback selection, post-call charging, batch dedup and legacy carry through the booted proxy without invoking separate admission or settlement.
  proof:
  - oracle
