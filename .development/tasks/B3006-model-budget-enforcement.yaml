id: B3006
title: Enforce and charge entity model budgets
description: Build the enforcement and charging engine in betterlite-auth::model_budget_limiter for the _PROXY_VirtualKeyModelMaxBudgetLimiter class, checking four entity scopes and charging the same configured counter names on successful responses. Preserve zero-cap denial (requests blocked when max_budget is 0), negative and unset cap bypass (max_budget < 0 or None allows unlimited), key-over-team precedence (a key's budget entry disables the team's for that model), first-affordable fallback selection, and batch-once markers preventing charge duplication across multiple poll attempts. Implement pre-call enforcement across key, user, end-user and team budgets with inheritance (team cap applies unless key overrides), and post-call charging that increments Redis-backed counters with in-memory dual-cache fallback and legacy counter aggregation for one window after upgrade. Implement the owned native service in crates/betterlite-auth/src/model_budget_limiter.rs.
