deviations: []
out_of_scope:
- "Model budget name resolution and cache key generation (B3005)."
- "Spend counter window increment and Redis flushing (B3016)."
- "BudgetExceededError definition and HTTP status (B184)."
- "DualCache implementation and Redis transport (B360, B390)."
- "UserAPIKeyAuth and request metadata decoding (B732)."
pitfalls:
- "Zero max_budget (0) blocks the request; negative max_budget (< 0) and unset (None) both bypass the cap entirely."
- "Key-over-team precedence checks whether the key has a spend-gated budget (max_budget is not None and >= 0) for the model; if so, team budget is skipped."
- "Legacy spend carry applies only to key and end-user scopes; user scope is introduced by this change and has no legacy counter."
- "Legacy carry stops after one budget window has passed since process startup (using time.monotonic()); wall-clock time does not apply."
- "Batch markers use a separate cache key (spend_key:batch:batch_id) with TTL matching the budget duration; every poll of a batch retrieval extends the marker's expiry via refresh_ttl=True, and increment returns 1 on first charge, > 1 on subsequent polls."
- "Cache read tries Redis first if redis_cache is not None, not based on whether Redis is configured; both reads treat non-float values as zero."
- "async_log_success_event returns early if model is None or no entity budgets apply; multiple entities may be charged in one call."
- "Fallback models are tried in order; each candidate's internal BudgetExceededError is caught and treated as a skip, and the function returns the first passing model or None, never raising."
