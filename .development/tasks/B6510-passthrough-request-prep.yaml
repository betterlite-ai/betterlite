dod:
  - text: ProxyHooks declares pre_call_hook and the three post-call hooks with the signatures in the description, and the recording fake implements all four.
    proof: [prep-tests]
  - text: prepare() runs the 20 steps in order, and a hook sees the logging object, the body with guardrails in metadata and the endpoint type, never the signed raw body.
    proof: [prep-tests]
  - text: The requested query falls through from the route's map to the request's map to None, the merge replaces the URL query and clears the requested query, and logging_url joins with ? or & as LiteLLM does.
    proof: [query-tests]
  - text: A non-empty custom_body wins, a multipart request gets an empty body without reading it, and any other request reads the JSON body; the model is "unknown" when missing or empty.
    proof: [body-tests]
  - text: The logging object is built with function_id "1245", the safe_dumps message and the team callbacks, gets custom_llm_provider and litellm_call_id, and has its pre_call logged with logging_url and the upstream headers.
    proof: [logobj-tests]
  - text: The stream flag follows the body's stream key first, and the four send branches pick the right helper with the right body and stream setting.
    proof: [stream-tests, send-tests]
  - text: Every step failure returns the PassThroughError variant for that step, a hook error is passed on unchanged, and the FailureContext holds exactly what the earlier steps had set (no logging object when the failure is at step 9, no kwargs when it is at step 13).
    proof: [error-tests]
checks:
  optional: []
  commands:
    - id: prep-tests
      why: a prepare step is missing, out of order or leaks the logging object or raw body into the upstream body
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::request_prep::tests::prep_/)'
    - id: query-tests
      why: the query fall-through, the merge or logging_url is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::request_prep::tests::query_/)'
    - id: body-tests
      why: the custom body, multipart or JSON body choice or the model default is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::request_prep::tests::body_/)'
    - id: logobj-tests
      why: the logging object set-up, provider fields or pre_call log is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::request_prep::tests::logobj_/)'
    - id: stream-tests
      why: the stream flag does not follow the body first
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::request_prep::tests::stream_/)'
    - id: send-tests
      why: one of the four upstream send branches picks the wrong helper, body or stream setting
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::request_prep::tests::send_/)'
    - id: error-tests
      why: a step failure maps to the wrong PassThroughError variant or a hook error is changed
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_lifecycle::request_prep::tests::error_/)'
oracle_cases: []
deviations:
  - what: The logging object is a separate field of PreCallInput, not a "litellm_logging_obj" key inside the body map.
    why: A Rust body is plain JSON and must stay serializable. The guardrails and hooks still reach the object, and it never gets near the upstream request.
  - what: When a default or merged query holds a repeated value, it is written as repeated key=value pairs.
    why: Python's urlencode without doseq writes the list's repr text (for example a=%5B%27x%27%5D), which no upstream can read, and nobody relies on it.
  - what: The enterprise-only managed-id input rewrite and the database list shortcut are not built.
    why: At the pin they only run when an enterprise hook is registered, and open-source LiteLLM never registers one.
out_of_scope:
  - "The forward-headers rule, the query merge function and the timeout resolution belong to B3571; this task calls them."
  - "collect_guardrails belongs to B3601, the endpoint type rules and PassthroughStandardLoggingPayload to B3600, and PassThroughCallState to B3605."
  - "init_kwargs_for_pass_through_endpoint, resolve_team_callback_wiring and with_trace_context belong to B3610."
  - "make_multipart_http_request, non_streaming_http_request_handler and is_multipart belong to B3611."
  - "The logging object, its update_environment_variables and its pre_call belong to B247 and B249; the JSON body reader to B1100; the pooled client to B173; safe_dumps to B192."
  - "Everything after the response is in hand (apply_upstream_reported_usage, streaming and buffered replies, post-call hooks, headers, the failure path) belongs to B3613."
  - "ProxyLogging.pre_call_hook itself has no owner in the merged code that was found. This task only declares the trait and an adapter if the code exists."
pitfalls:
  - "url_route for later logging is the URL text after the query merge. logging_url only goes into pre_call. Mixing them changes every logged route."
  - "Truthiness decides three things: an empty custom_body is ignored, an empty query_params map falls through to the request's query, and an empty model string becomes \"unknown\". Follow docs/compatibility.md for these."
  - "The pre-call hook can replace the whole body. Build the payload record, kwargs and pre_call log from the returned map, never from the map before the hook."
  - "Guardrails are written to body.metadata.guardrails before the hook, so the hook and the guardrails can see them. Later code strips metadata from the body before it goes upstream (B3610's kwargs step does that). Do not strip it here."
  - "The stream flag is Some(false) when the body says stream false, even if the route says true. Only a missing key falls back to the route."
  - "A signed raw body must go upstream byte for byte. Never re-encode the JSON body when signed_raw_body is Some, and never log it."
  - "The client handle is requested with the resolved timeout, so two routes with different timeouts must not share one client unless B173's pool keys on the timeout. Read B173 before you assume."
review_level: security
budget:
  max_changed_lines: 1400
  max_new_expects: 0
