id: B1047
title: Batch precall
description: >-
  Compose batch quota reservation and retrieval-cache hooks with B014, including cached managed-batch lookup and
  terminal reservation refund. Ensure a create failure rolls back reserved counters, and a retrieve does not re-reserve
  input tokens.


  The oracle has no litellm-enterprise. get_proxy_hook(managed_files) is absent: preserve each MIT caller's own
  early return or exception, not a replacement enterprise hook. Retain MIT id codecs, model-embedded file routing,
  storage-only operations and pre-existing-row readers. Enterprise-only creation/ownership/output-ID methods are
  out of scope.


  Implement crates/betterlite-core/src/api/batch_precall.rs. Use BatchPrecallInput and BatchPrecallResult with typed
  nested records; inject only the clock, repositories, transports and resolved settings this slice uses through
  constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential resolution.


  Write adjacent tests.rs behavior functions create_precall_reserve, create_failure_refund, retrieve_cache_hit,
  terminal_retrieve_refund, redis_cache_error_policy under api::batch_precall::tests. Each named function drives
  production code and asserts its case result; use named rstest inputs for related values. Corpus replay has the
  separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::BatchPrecall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_precall: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/hooks/batch_rate_limiter.py: _PROXY_BatchRateLimiter.async_pre_call_hook (L1180-L1279);
  litellm/proxy/hooks/batch_redis_get.py: _PROXY_BatchRedisRequests.__init__ (L22-L26); litellm/proxy/hooks/batch_redis_get.py:
  _PROXY_BatchRedisRequests.print_verbose (L28-L32); litellm/proxy/hooks/batch_redis_get.py: _PROXY_BatchRedisRequests.async_pre_call_hook
  (L34-L89); litellm/proxy/hooks/batch_redis_get.py: _PROXY_BatchRedisRequests.async_get_cache (L91-L119). Abstract/protocol
  declarations map to native types and synchronous/async wrappers share one implementation; a partial function span
  is the explicit preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 143 owned nonblank/non-comment/non-docstring Python lines (166 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 163 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 413 total within the 420-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B126
  (Redis, Redis Cluster and Valkey), B171 (Direct helper oracle and URL path encoding), B1043 (Batch enqueued refund),
  B1045 (Batch limit counters), B1046 (Batch input accounting), B1087 (Api boundaries), B1042 (Batch enqueued reserve),
  B1044 (Batch limit descriptors), B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
