    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_precall::/) - test(/::replays_corpus$/)'
  - id: case-create-precall-reserve
    why: the create-precall-reserve behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::batch_precall::tests::create_precall_reserve($|::)/)'
  - id: case-create-failure-refund
    why: the create-failure-refund behavior or its assertions are absent
