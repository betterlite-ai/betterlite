deviations:
- what: A selector returns a tag where LiteLLM returns a config object or class.
  why: >-
    Provider crates sit above betterlite-context, so importing them here would make a cycle. B2230 keeps the same
    boundary for chat.
out_of_scope:
- >-
  Building or calling any provider config. The per-model image factories, `get_bedrock_provider_config_for_messages_api`,
  `BedrockOpenAIResponsesConfig.for_model`, `azure_ai_supports_native_responses`, `mantle_supports_responses`,
  `github_copilot_supports_responses_api` and `is_lyria_model` stay with whoever matches on the tag.
- >-
  The other selectors in the same class: embedding and rerank L8767-L8908 belong to B037, decisions L8910-L8928 to
  B3513, the non-Python responses path L9112-L9148 and messages L8979-L9010 to B1440, files L9410-L9445 to B2464,
  video L9690-L9725 to B3332, container L9727-L9743 to B3361, sandbox L9918-L9934 to B3519 and Google GenAI
  L10035-L10067 to B3483. B2230 owns the rest of the chat side.
- >-
  The full owner list for litellm/utils.py is the Function ownership inventory in the B157 task file. Parameter
  mapping that uses these selectors is B5362.
pitfalls:
- >-
  Some selectors compare with `==` on the enum and some check a substring of the model. Keep each check as written and
  note where the lowered model is used: only messages, responses and the Azure o-series test lower it.
- A tag that carries the model must carry it unchanged, with any provider prefix the caller passed.
- >-
  The tests need the words from the checks in their names, such as `search` or `vector_store`, because the check
  filters match on them.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
