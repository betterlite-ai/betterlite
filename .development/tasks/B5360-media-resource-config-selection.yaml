id: B5360
title: Config selection for media and resource APIs
description: >-
  LiteLLM's `ProviderConfigManager` picks a provider config object for each API family. B2230 does this for chat.
  This task does it for audio, images, speech and the resource APIs, in two modules of betterlite-context:
  `media_config_selection` and `resource_config_selection`.


  Each selector is a plain function from provider and model to a closed tag enum, or `None` when LiteLLM returns
  `None`. A tag names the config class and carries the constructor arguments. No provider object is built and no
  provider crate is imported: a provider task matches on the tag and builds its own adapter. Use `ProviderId` from
  betterlite-models as the provider type.


  `media_config_selection` holds four selectors. Transcription (L9012-L9110): AZURE gives the speech tag only when the model's cost entry has
  `audio_transcription_config` equal to "azure_speech", and any other Azure model gives `None`. DEEPGRAM, ELEVENLABS, XAI,
  HOSTED_VLLM, WATSONX, OVHCLOUD, SCALEWAY, MISTRAL, NVIDIA_RIVA, SONIOX, GEMINI and EDENAI map straight to a tag.
  OPENAI gives the GPT audio tag when "gpt-4o" is in the model and the Whisper tag otherwise. VERTEX_AI gives the
  Gemini tag when the bare model starts with "gemini" and contains "transcribe", and the Vertex tag otherwise. Image
  generation (L9575-L9688): OPENAI, AZURE, AZURE_AI, XINFERENCE, RECRAFT, AIML, COMETAPI, GEMINI, FAL_AI, STABILITY,
  RUNWAYML, BLACK_FOREST_LABS, VERTEX_AI, OPENROUTER and MODELSCOPE give a per-model tag holding the model.
  LITELLM_PROXY and EDENAI are direct tags. DASHSCOPE, QWENCLOUD and QWEN_AI_PLATFORM give one family tag holding
  the provider's name. Image edit (L9784-L9857): OPENAI, HOSTED_VLLM, FAL_AI, AZURE_AI, GEMINI, VERTEX_AI, STABILITY,
  BEDROCK and OPENROUTER are per-model; AZURE, RECRAFT, BLACK_FOREST_LABS and LITELLM_PROXY are direct. Text to
  speech (L9967-L10033): AZURE only when the model starts with "speech/"; ELEVENLABS, RUNWAYML, MINIMAX, MISTRAL,
  AWS_POLLY and EDENAI direct; VERTEX_AI gives `None` when "gemini" is in the model, the Lyria tag when the caller's
  `is_lyria` is true, and the Vertex tag otherwise.


  `resource_config_selection` holds the rest. Anthropic messages (L8937-L8978) lowers the model first: ANTHROPIC and
  MINIMAX are direct, BEDROCK gives a tag holding the model for the Bedrock messages lookup, and BEDROCK_MANTLE,
  VERTEX_AI and AZURE_AI need "claude" in the lowered model. Responses (L9150-L9243): no provider gives `None`;
  OPENAI, XAI, SAIL, CHATGPT, LITELLM_PROXY, VOLCENGINE, MANUS, PERPLEXITY, OPENROUTER, HOSTED_VLLM, FIREWORKS_AI and
  EDENAI are direct; AZURE gives the o-series tag when "o_series" is in the lowered model or `supports_reasoning` is
  true and the plain Azure tag otherwise; AZURE_AI needs `azure_ai_native_responses`; GITHUB_COPILOT applies when the
  model is `None` or `github_copilot_responses` is true; DATABRICKS needs "gpt" in the lowered model; BEDROCK gives a
  tag holding the model; BEDROCK_MANTLE needs `mantle_responses`. Those booleans come from code above this crate, so
  the caller passes them in a `ResponsesModelFacts` struct. Skills is ANTHROPIC only and evals is OPENAI only.
  Passthrough (L9344-L9397): BEDROCK, BEDROCK_MANTLE, AZURE, AZURE_AI, GIGACHAT, WATSONX and NVIDIA_NIM, with VLLM and
  HOSTED_VLLM sharing one tag. Batches: BEDROCK, MISTRAL. Vector store: BEDROCK. Vector stores (L9474-L9561): OPENAI,
  AZURE, BEDROCK, PG_VECTOR, AZURE_AI, MILVUS, GEMINI, RAGFLOW, S3_VECTORS, VALKEY, MONGODB, and VERTEX_AI where
  `api_type` "rag_api" or no value gives the RAG tag, "search_api" gives the search tag and any other value gives
  `None`. Vector store files: OPENAI. Realtime: GEMINI, META. Realtime HTTP: OPENAI, AZURE. Search (L9859-L9916) is the
  20-row `PROVIDER_TO_CONFIG_MAP` over a closed `SearchProvider` enum. Harness (L9936-L9965): CLAUDE_CODE, CODEX,
  OPENCODE, DEEPAGENTS.


  `_get_model_cost_entry_for_provider_config` (L8427-L8442) goes in `media_config_selection`, since the Azure transcription
  check is its only caller. It takes the live and the bundled `ModelCatalog`, tries the model and then "provider/model" in
  the live catalog, then both in the bundled one, and returns `Option<&CatalogEntry>` through the public `lookup` and
  `entries` maps. It gives `None` where LiteLLM gives an empty dict. The field is
  `entry.fields.metadata.audio_transcription_config`.


  The oracle operation is `b5360`. Its Python adapter calls the real `ProviderConfigManager` method with fixture
  inputs and reports the class name of the result or null. The Rust side reports the tag's class name and arguments.
