dod:
- text: >-
    The four media selectors return the tag LiteLLM's method class maps to, or `None`, for every provider listed and
    for a provider outside each list.
  proof: [media-selection, oracle, helper-python]
- text: >-
    Anthropic messages and responses selection follow the lowered-model checks and the `ResponsesModelFacts` booleans,
    and a `None` provider gives `None`.
  proof: [messages-responses-selection, oracle, helper-python]
- text: >-
    Skills, evals, passthrough, batches, the vector store selectors and the realtime selectors match LiteLLM, with the
    VLLM and HOSTED_VLLM rows sharing a tag and an unknown Vertex `api_type` giving `None`.
  proof: [resource-tables, oracle, helper-python]
- text: All 20 search rows and the four harness rows match LiteLLM.
  proof: [search-harness-selection, oracle, helper-python]
- text: Azure transcription depends on the cost entry, and the lookup checks the live catalog before the bundled one and the bare model before "provider/model".
  proof: [cost-entry-lookup]
- text: New helper corpus seeds call `b5360` and replay through the shared parser.
  proof: [helper-case-corpus]
checks:
  optional:
  - mutants
  commands:
  - id: media-selection
    why: A media selector is missing, or a branch gives the wrong tag.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^media_config_selection::/)'
  - id: messages-responses-selection
    why: The lowered-model checks or the caller's facts are not honored.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^resource_config_selection::.*(messages|responses)/)'
  - id: resource-tables
    why: A row of the smaller selectors is wrong or absent.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^resource_config_selection::.*(skills|evals|passthrough|batches|vector_store|realtime)/)'
  - id: search-harness-selection
    why: The search or harness tables differ from the source rows.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^resource_config_selection::.*(search|harness)/)'
  - id: cost-entry-lookup
    why: The lookup order is wrong.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/^media_config_selection::.*cost_entry/)'
  - id: helper-python
    why: The b5360 adapter is missing, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5360)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers/b5360 && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5360/pyrightconfig.json
  - id: helper-case-corpus
    why: Seeds for b5360 are missing or do not replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/media_config_selection-*")"
      && grep -lE '^[[:space:]]+b5360:' tools/oracle/fuzz/corpus/helper_case/media_config_selection-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
