id: B322
title: Team-scoped deployment access and reserved windows
description: 'Add typed team candidate filtering and model_info.access_windows, using B052''s authenticated
  principal and an injected clock/time-zone database. Keep catalog lookup and reservation filtering distinct
  so direct deployment IDs cannot skip authorization. Surface the blocking window through typed no-deployment
  errors. Add config corpus cases for IANA zones, overnight windows, overlapping windows and invalid bounds.
  Configuration boundary keys introduced or consumed here: access_windows. Pinned declaration defaults:
  access_windows=None. Resolve env values once in betterlite-config, never in router code. Implement the
  owned native service in crates/betterlite-router/src/access_windows.rs. Add ProbeOperation::B322 in
  tools/oracle/src/router_probes/mod.rs and the corresponding B322 entry in tools/oracle/litellm/probes/registry.py;
  the adapters only call production services. Shared exports and dispatch files are explicitly in scope.
  Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140 Rust/Python adapter
  lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use only the existing checks.yaml
  exclusions. Reuse predecessor services instead of copying their algorithms. Function coverage in litellm/router_utils/access_windows.py:
  parse_access_windows (L16-L20), access_windows_config_error (L23-L32), is_window_active (L35-L40), _reservation_blocking_window
  (L49-L60), filter_reserved_deployments (L63-L75). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Function coverage in litellm/router_utils/common_utils.py: _is_proxy_admin_request (L20-L28), get_request_team_id
  (L31-L40), filter_team_based_models (L143-L207). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.'
