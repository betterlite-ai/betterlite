id: B322
title: Team-scoped deployment access and reserved windows
description: Add typed team candidate filtering and model_info.access_windows, using B052's authenticated
  principal and an injected clock/time-zone database. Keep catalog lookup and reservation filtering distinct
  so direct deployment IDs cannot skip authorization. Surface the blocking window through typed no-deployment
  errors. Add config corpus cases for IANA zones, overnight windows, overlapping windows and invalid bounds.
  Use the existing Rust crate boundaries from B004 and B008; integrate through the server when the provider
  dispatcher or callbacks live in another core crate. This task's source slices are the linked ranges,
  not a port of their Python classes. Add the listed oracle cases and the matching adapters to B301's
  component runner where state is not observable over HTTP; adapters call production logic and never reproduce
  it. Use deterministic candidate sets or supplied random samples for comparisons, and separate seeded
  distribution tests for random choices. Extend the existing config_yaml fuzz target and committed corpus
  for every newly accepted config form; unsupported keys still fail by full path. Keep the implementation,
  adapters and tests within 800 changed lines; fixtures and oracle cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/access-windows/**
  - tools/oracle/src/router_probes/access-windows/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/access_windows.py
  - tools/oracle/litellm/probes/registry.py
  - Cargo.toml
  - deny.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/access_windows.py#L16-L75
  why: Window validation and active reservation filtering.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L175-L219
  why: Time-zone and wall-clock types.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/common_utils.py#L20-L61
  why: Trusted team and alias lookup.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/common_utils.py#L143-L207
  why: Team-only pools and admin ambiguity.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(access_windows)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/access-windows/same-team-only.yaml
- tools/oracle/cases/routing/access-windows/forged-team-metadata.yaml
- tools/oracle/cases/routing/access-windows/admin-ambiguous-public-name.yaml
- tools/oracle/cases/routing/access-windows/start-inclusive-end-exclusive.yaml
- tools/oracle/cases/routing/access-windows/overnight-window.yaml
- tools/oracle/cases/routing/access-windows/dst-transition.yaml
- tools/oracle/cases/routing/access-windows/overlapping-allowed-team.yaml
- tools/oracle/cases/routing/access-windows/no-team-active-reservation.yaml
deviations: []
out_of_scope:
- Team CRUD or role implementation (B052/B057).
pitfalls:
- Window times are local wall-clock times in the named zone, not UTC offsets.
- An admin without a team must not silently pick between identically named team models.
- Do not turn absent authenticated team context into a caller-provided metadata lookup.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
