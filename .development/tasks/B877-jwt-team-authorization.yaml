id: B877
title: Authorize JWT team selection and database fallback
description: >-
  Authorize team selection from verified JWTs after identity/admin policy. A provisional x-litellm-team-id
  outside JWT teams is never upserted; validate DB membership and team route access before accepting it.
  Distinguish claimless DB fallback, alias-only and RBAC team claims, re-run pass-through authorization
  after DB fallback, and validate_object_id when enforce_rbac has no user or team. Own the
  ManagedAgentTeam::resolve port with user/agent IDs, selected team, explicit-selection flag and optional
  allowed-team set; B141 installs it without a dependency from this lower stage to its installer.

  B760 extracts claim teams, specific team and alias; B764 supplies aggregate teams, header resolution,
  specific-team/model selection, passthrough checks and object-ID validation. DB fallback requires its
  flag, no JWT team claims, no alias and no RBAC-selected team. A configured team_id_default does not
  count as a claim. Add the specific team to candidates only outside DB fallback. Header DB fallback
  separately requires the flag and no RBAC team. For an outside-claim header, call B737 with upsert
  disabled; translate only HTTPException to B764's header-membership denial, propagating other errors.
  If no header/team and no DB fallback, try the specific/alias team; if still no ID or object, try
  model-access selection. For an RBAC team with no loaded row, fetch it before an auth-enforced
  passthrough check, uppercasing a string method and preserving None otherwise.

  Managed-agent delegation receives JWT claim teams or an alias-derived singleton; fallback_to_db_teams
  deliberately passes no restriction. Only an actual header counts as explicit selection. A different
  granting team must pass B891's team-route check (403 auth_error/param "None" on failure), then load
  that team with check_db_only=true. Check passthrough permission before identity loading. B765 loads
  user/org/end-user/membership and effective user_id; user upsert and role/team synchronization run only
  when provisioning exists and this is not a managed agent. An alias-resolved org supplies organization_id.

  No selected team plus DB fallback calls B891's database resolver and repeats passthrough authorization;
  no selected team without that flag calls its single-team fallback. A still-selected provisional header
  must occur in the loaded user's DB memberships and pass team-route policy before it can be used.
  Header/route denials preserve B764's 403 auth_error and header param; the inline route denial at
  L2880 has param "None". Map the user to the authorized team only with provisioning and no managed
  agent. Then validate object IDs using bool(general_settings.enforce_rbac), default False, before
  deriving proxy-admin from the final user row (never for a managed agent). Return the selected/fallback
  team and object, effective user ID, nonempty DB email before claim email, resolved org, end user,
  original token, membership, claims, agent ID and managed context. Keep every preceding write if a
  later authorization step fails; there is no encompassing transaction.


  Build the production jwt_team_authorization module in betterlite-auth; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTAuthManager.authorize_jwt.team_stage (L2630-L2929; 250 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): general_settings.enforce_rbac=False;
  litellm_jwtauth.team_id_upsert=False; litellm_jwtauth.team_allowed_routes=['openai_routes',
  'info_routes', 'mcp_routes', '/v1/messages', '/v1/messages/count_tokens']; litellm_jwtauth.user_id_upsert=False;
  litellm_jwtauth.enforce_team_based_model_access=False; litellm_jwtauth.fallback_to_db_teams=False.


  B875's outer premium_user guard prevents the unmodified MIT HTTP proxy from reaching JWT team
  selection. Exercise these branches through native HTTP tests of the actual B732 server stage with
  verified JWT fixtures, comparing the documented status/type/param/code and database effects. Do not
  call a fragment as a Python handler or label a premium_user rejection a team-membership oracle result.
  This task adds no route and has no independently callable Python segment. B875 owns the license deviation.


  Native JWT team-authorization cases use B860 Postgres selected through POSTGRES_TEST_URL or
  testcontainers. Inspect provisioning writes even when a later team check fails; these authenticated
  JWT successes cannot be equality cases against the MIT proxy's earlier license rejection.


  Write betterlite-config::jwt_team_authorization::tests::team_policy_defaults, team_policy_overrides,
  team_routes_default_list and enforce_rbac_truthiness. Each must call the production B002 config loader, set every listed key/env binding,
  assert the resulting typed value is consumed by this component, and exercise the specified warning/ignore/error
  branch. A grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml
  with the actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  Sizing: 250 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  270 production, 320 behavior/Postgres tests, 65 wiring and 60 config lines, 715 within a 750-line gate.
  Use POSTGRES_TEST_URL, falling back to testcontainers only when absent. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Server wiring tests live under betterlite-server::auth::jwt_team_authorization::tests: stage_is_registered
  and failure_stops_downstream. The registration test invokes the actual B732 constructor with this production
  stage; the failure test asserts its public error translation and that the downstream handler was not
  called. These tests are part of the behavior-test allowance already budgeted above.
