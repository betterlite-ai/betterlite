dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: header_outside_claims_403,
      provisional_team_no_upsert, db_member_header, fallback_passthrough_recheck, rbac_no_object,
      managed_grant_team_403, default_is_not_claim, alias_blocks_db_fallback, rbac_blocks_header_fallback,
      provisional_http_error_translation, header_nonhttp_error_propagates, specific_then_model_team,
      rbac_passthrough_loads_team, managed_claim_scope, managed_alias_scope, managed_fallback_unscoped,
      changed_grant_db_only, passthrough_before_get_objects, managed_skips_provisioning,
      sync_before_fallback, alias_org_and_effective_user, single_team_fallback,
      provisional_route_denial, mapping_after_membership_check, final_user_admin_nonmanaged,
      database_email_precedence and late_denial_preserves_prior_writes.'
    proof:
      - behavior-tests
  - text: Native HTTP cases header_membership_envelope, granting_team_route_envelope and fallback_route_envelope
      exercise the server and prove a rejected selection never reaches the downstream inference handler.
    proof:
      - stage-wiring-tests
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
  - text: The real server constructor invokes the production auth stage and its failures stop downstream
      execution.
    proof:
      - stage-wiring-tests
      - behavior-tests
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_team_authorization::tests::/)
        - test(/replays_the_/)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^jwt_team_authorization::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/jwt-team-authorization-*")"
        && grep -rlq "enforce_rbac" crates/betterlite-config/fuzz/corpus/config_yaml/jwt-team-authorization-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: stage-wiring-tests
      why: The server does not register this production auth stage or discards its failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^auth::jwt_team_authorization::tests::/)
        - test(/replays_the_/)'
