oracle_cases: []
deviations:
  - what: POST requests use timeout if supplied, else fallback to litellm.request_timeout (default 6000 seconds).
    why: The LiteLLM source code at lines 179 and 193 uses `timeout or request_timeout` to select the deadline, preserving the sentinel default for long-running surfaces.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/http_handler.py#L179
  - what: Response transformation (transform_response) happens outside the HTTP error catch, so a transformation error does not trigger error mapping.
    why: The LiteLLM source code at lines 198-202 and 293-297 calls transform_response after the exception handler closes, preserving provider-specific transformation semantics outside error conversion.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/http_handler.py#L198-L202
  - what: Streaming iterators are returned immediately when stream=True without awaiting the response body or testing it for errors until iteration begins.
    why: The LiteLLM source code at lines 174-187 (sync) and 269-282 (async) construct and return the iterator while the response is still open, delegating validation to the first iteration step.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/http_handler.py#L174-L187
out_of_scope:
  - Provider contract methods (validate_environment, get_complete_url, transform_request, transform_response, get_error_class). These are owned by B3490 (contract definition) and B1369/B1370 (provider implementations).
  - Streaming iterator construction and iteration logic. B3491 owns the streaming iterator classes and their SSE parsing.
  - HTTP client factories and error handling infrastructure. B3492 owns _BaseHTTPHandler and its methods.
  - Deletion and cancellation operations. B3494 owns DELETE and cancel POST transports.
pitfalls:
  - "The timeout parameter is always resolved at the create_interaction call site; when it is None, the fallback to litellm.request_timeout (default 6000 seconds) happens at call time, not in the HTTP module."
  - "Response transformation is outside the HTTP error catch block, so a transformation error propagates as-is and does not go through _BaseHTTPHandler._handle_error."
  - "When stream=True, create_interaction returns the iterator without consuming the response body; the iterator's first iteration step will fail if the response is an HTTP error."
  - "The pre_call logging uses input as the main logged input and passes complete_input_dict (after extra_body overlay is applied) in additional_args, not in the request parameter."
  - "The create_sync_iterator and create_async_iterator factories are thin wrappers that pass arguments directly to the streaming iterator constructors without transformation."
