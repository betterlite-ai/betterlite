id: B3493
title: Send interaction creation requests and open streams
description: >-
  Build the interaction creation HTTP handlers in crates/betterlite-http with two modules: betterlite_http::interactions::create for POST requests and betterlite_http::interactions::streaming for streaming iterator factories.
  The create module implements sync and async creation methods that validate environment headers, construct the POST URL via get_complete_url, build request bodies via transform_request, apply extra_body overlays, log pre-call with input as the logged input, POST the request with timeout or the fallback from litellm.request_timeout (default 6000 seconds), handle errors via _BaseHTTPHandler._handle_error, and transform responses via transform_response. Stream requests return a streaming iterator immediately after the POST succeeds; non-streaming requests await and return the full response.
  The streaming module exports two factory functions that construct streaming iterators: create_sync_iterator accepts response, model, logging_obj and interactions_api_config, returning SyncInteractionsAPIStreamingIterator; create_async_iterator accepts the same arguments and returns AsyncInteractionsAPIStreamingIterator. These factories pass constructor arguments directly without transformation.
  This task completes the interaction HTTP foundation (B3492 owns retrieval, B3494 owns deletion/cancellation) and supplies the POST transport for public creation (B3495 retrieves, B3499 creates).
