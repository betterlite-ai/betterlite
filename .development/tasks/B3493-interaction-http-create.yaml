    proof: [create-interaction-tests]
  - text: The create_interaction method returns a streaming iterator immediately when stream=true, or a transformed response when stream=false.
    proof: [create-interaction-tests]
  - text: The async_create_interaction method implements the same flow asynchronously without requiring a _is_async dispatcher argument.
    proof: [async-create-interaction-tests]
  - text: Both create and async_create methods preserve default timeout fallback using request_timeout (default 6000 seconds) when timeout is not supplied.
    proof: [create-interaction-tests, async-create-interaction-tests]
  - text: Both methods overlay extra_body onto the transformed request, allowing caller-supplied fields to override defaults.
    proof: [extra-body-tests]
  - text: Both methods log pre-call with input and additional_args containing complete_input_dict, api_base and headers.
    proof: [create-interaction-tests, async-create-interaction-tests]
  - text: The create_sync_iterator factory constructs SyncInteractionsAPIStreamingIterator by passing response, model, logging_obj and interactions_api_config directly.
    proof: [streaming-iterator-tests]
  - text: The create_async_iterator factory constructs InteractionsAPIStreamingIterator by passing response, model, logging_obj and interactions_api_config directly.
    proof: [streaming-iterator-tests]
  - text: HTTP errors from POST are converted via _handle_error and propagated; response transformation happens outside the error handler for non-streaming responses.
    proof: [create-interaction-tests]
