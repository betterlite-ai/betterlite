dod:
  - text: A callback type with its own iterator hook is Override, one with only apply_guardrail and no native lifecycle flag is ApplyGuardrail, a type with both is Override, and any other is left out.
    proof: [kind-tests]
  - text: Override becomes ApplyGuardrail only on an Anthropic messages route for a guardrail that uses apply_guardrail, has no native lifecycle flag and does not mask response content.
    proof: [kind-tests]
  - text: With no iterator override and no pipeline the stream passes through unchanged, and the deferred logging is fired after the last item or after an error that is not discarded.
    proof: [passthrough-tests, serve-log-tests]
  - text: Callbacks wrap in list order, a gated or not-applicable guardrail is skipped, a plain logger always runs, and the unified hook gets buffer_until_moderated_default true only for an Override kind.
    proof: [chain-tests, oracle]
  - text: A provider error passes through the enrichment untouched, and a guardrail error gets the guardrail context and the applied-guardrails header entry.
    proof: [enrichment-tests]
  - text: The pipeline gate buffers the stream, sends nothing for an empty stream, sends the block chunks or error items after a modify_response or HTTP result, and otherwise releases the buffered items.
    proof: [pipeline-gate-tests]
  - text: Served chunks are recorded on a clean end, an error and a cancel, and a discarded failure bills the assembled response on the failure row.
    proof: [serve-log-tests]
  - text: Streamed requests with two post_call guardrails through the booted proxy match LiteLLM for a clean stream and for a block by the second guardrail.
    proof: [oracle, http-case-corpus]

checks:
  optional: []
  commands:
    - id: kind-tests
      why: the kind choice, effective kind or route test is wrong or missing
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::proxy_stream_wrapper::tests::kind_/)'
    - id: passthrough-tests
      why: the fast path wraps, drops items or skips the deferred logging
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::proxy_stream_wrapper::tests::passthrough_/)'
    - id: chain-tests
      why: the wrap order, a skip rule or the buffering default is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::proxy_stream_wrapper::tests::chain_/)'
    - id: enrichment-tests
      why: an upstream error is blamed on a guardrail, or a guardrail error loses its context
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::proxy_stream_wrapper::tests::enrichment_/)'
    - id: pipeline-gate-tests
      why: the pipeline gate releases, blocks or buffers the wrong items
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::proxy_stream_wrapper::tests::pipeline_gate_/)'
    - id: serve-log-tests
      why: served output is not recorded, the deferred callback fires twice or a failure is not discarded
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^guardrails::proxy_stream_wrapper::tests::serve_log_/)'
    - id: http-case-corpus
      why: the HTTP cases are not added in this change
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/guardrails/proxy-stream-wrapper)"

oracle_cases:
  - tools/oracle/cases/guardrails/proxy-stream-wrapper/two-guardrails-clean.yaml
  - tools/oracle/cases/guardrails/proxy-stream-wrapper/second-guardrail-blocks.yaml

deviations:
  - what: The wrapper takes its callbacks, pipelines and logging object through traits and a typed `ProxyStreamWrapper`, not from `litellm.callbacks` and `request_data["litellm_logging_obj"]` globals.
    why: Rust has no module-level callback list (rules.yaml); the order and the skip rules are unchanged.
  - what: The cache that keys callback capabilities on the list's ids is not part of this task.
    why: The caller builds the callback set once per change of the list; B124 owns it.

out_of_scope:
  - "B6260 owns the unified hook that runs one guardrail's scan; this task only calls it."
  - "B3246 owns the stream rewrite observation inside a pipeline step, and B3247 owns PipelineExecutor.execute_steps and `_run_step`, including the `use_unified and streaming_chunks is None` choice near pipeline_executor.py line 522."
  - "B3679 owns handle_streaming_block, emit_streaming_http_error and resolve_endpoint_translation."
  - "B124 owns _callback_capabilities and _CallbackCapabilities, _streamable_post_call_pipelines, _pipeline_step_guardrail_names, _handle_pipeline_result, _check_and_merge_model_level_guardrails, needs_iterator_wrap and the other ProxyLogging helpers listed in B786's out_of_scope."
  - "async_post_call_streaming_hook (the per-chunk hook, lines 3816-3903) is not this task and has no task file at this commit."
  - "The proxy_server.py generator that calls this wrapper belongs to the streaming route tasks."

pitfalls:
  - The kind test is an elif on the type's own `__dict__`, so a guardrail class that defines both `async_post_call_streaming_iterator_hook` and `apply_guardrail` is Override, never ApplyGuardrail.
  - Callbacks wrap one after another, so the first in the list is the innermost and sees the raw upstream; do not reverse the list.
  - "`should_run_guardrail` returning anything but true skips the guardrail, but a plain logger skips no check and always wraps."
  - A guardrail named by a pipeline step is skipped here, because the pipeline gate scans it on the buffered stream instead.
  - Only the Override kind passes `buffer_until_moderated_default = true`; an ApplyGuardrail kind that came from an Override by `effective_kind` still counts as Override for this flag.
  - The upstream boundary stores only the first error, and enrichment compares that error by identity, so an error a guardrail re-raises from the provider's failure must not be enriched.
  - "`fire` clears the parked callback before it spawns it, so a second call (after a discard-false failure path) does nothing."
  - On a cancel or drop the served chunks are recorded but the deferred logging is not fired.
  - The pipeline gate sends `stream_started = false` and an empty `responses_so_far` to `handle_streaming_block`, since nothing has reached the client yet, unlike B6260's mid-stream block.
  - When `resolve_endpoint_translation` gives None, pipelines are silently skipped for the stream and the fast path decision has already counted them.

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 0
