    - crates/betterlite-server/src/guardrails/proxy_stream_wrapper.rs
    - crates/betterlite-server/src/guardrails/proxy_stream_wrapper/**
    - tools/oracle/cases/guardrails/proxy-stream-wrapper/**
    - tools/oracle/helpers/b6370.py
    - tools/oracle/helpers/b6370/**
    - tools/oracle/src/helpers/server/b6370.rs
    - tools/oracle/src/helpers/server/b6370/**
  lint_tables: false

