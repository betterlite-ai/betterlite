id: B3688
title: Guardrail compliance redaction and retryable usage rollups
description: >-
  Implement compliance redaction for matched spans and derive guardrail usage and index
  rows from committed spend payloads. Track daily metrics (requests evaluated, passed/blocked/flagged
  counts) by guardrail and date, upsert usage units (cost and untracked units) keyed by
  guardrail/date/team/api_key/unit_name, and insert spend-log index rows for guardrail
  invocations. Preserve bounded pending queues (at most 10,000 rows) for retryable connection
  failures, distinguish zero-cost units from unpriced units, and handle index uniqueness
  conflicts without aborting the entire batch.

  Build the redaction utility and the guardrail-aware usage-log processor in betterlite-db
  as standalone modules. The first walks nested dicts/lists to replace "match" and "regex"
  field values with "[REDACTED]" for safe compliance logging. The second aggregates daily
  metrics and usage units from spend-log payloads with guardrail metadata, merges them with
  pending rows queued from prior retries, retries failed upserts with exponential backoff
  (up to 3 attempts), and requeus only connection-safe failures for the next flush window.
  Both modules use lowercase domain names (compliance_redaction, guardrail_usage_rollups),
  never task id B3688 or task names.

