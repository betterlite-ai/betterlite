deviations:
- what: With Hugging Face downloads disabled, cohere, llama2 and llama3 fall back to the OpenAI tokenizer. Successful
    counts keep HTTP 200 and their usual count schema; input validation retains the source 400 code/param fields.
  why: Current offline tokenizer policy; the download decision remains open.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L2404-L2467
