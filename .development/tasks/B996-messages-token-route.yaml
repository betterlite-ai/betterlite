id: B996
title: Messages token route
description: >-
  Install native Messages count_tokens and Claude event_logging/batch compatibility routes. Select B027 provider-native
  token counting where available and the existing B013 local tokenizer path where the source falls back; preserve
  source beta/header and error envelopes, with no remote tokenizer downloads.


  POST /v1/messages/count_tokens is authenticated, as is /claude_code_gateway/v1/messages/count_tokens with its
  enable guard. POST /api/event_logging/batch has no auth, does not read its body and always returns {status: ok}.
  Missing model or absent/empty messages return 400 FastAPI detail; unexpected counting failure returns 500 detail.


  Open, waiting for Max: permit Hugging Face tokenizer downloads or retain the current offline OpenAI-tokenizer
  fallback documented below; current successful requests still return 200, and validation retains its existing 400
  codes.


  Implement crates/betterlite-server/src/api/messages_token_route.rs, crates/betterlite-core/src/api/messages_token_route.rs.
  Use MessagesTokenRouteInput and MessagesTokenRouteResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/messages/count_tokens; POST /api/event_logging/batch; POST
  /claude_code_gateway/v1/messages/count_tokens. Each alias is exercised through the booted proxy. Every route factory
  is mounted once; a family composer mounts its child factories without re-registering their methods/paths.


  Route input projections: request.headers.x-litellm-call-id (absent None); data.model (absent None); data.messages
  (absent []); data.tools (absent None); data.system (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:330 status_code=400, exception_detail=FastAPI detail object; endpoints.py:333
  status_code=400, exception_detail=FastAPI detail object; endpoints.py:367 status_code=status_code, exception_detail=FastAPI
  detail string; endpoints.py:373 status_code=500, exception_detail=FastAPI detail object. Compare the actual source
  status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions native_count_tokens, local_count_fallback, count_tools_and_system,
  count_provider_error, event_logging_batch, count_missing_model, count_empty_messages, count_internal_error, event_logging_no_auth,
  event_logging_invalid_body, gateway_count_disabled, route_aliases, auth_missing, auth_invalid, unauthenticated_route_contract
  under api::messages_token_route::tests. Each named function drives production code and asserts its case result;
  use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/anthropic_endpoints/endpoints.py: count_tokens (L294-L373); litellm/proxy/anthropic_endpoints/endpoints.py:
  event_logging_batch (L380-L389). Abstract/protocol declarations map to native types and synchronous/async wrappers
  share one implementation; a partial function span is the explicit preparation/transition stage described above,
  with typed values passed to the following stage.


  Sizing: 67 owned nonblank/non-comment/non-docstring Python lines (89 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 87 implementation,
  130 behavior tests, 180 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 435 total within the 440-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B013 (Model cost map, provider capability data and token counting), B171 (Direct helper
  oracle and URL path encoding), B958 (Messages errors), B1087 (Api boundaries), B1132 (Claude gateway enable and
  settings policy), B1100 (Shared request body decoding), B585 (Anthropic native token counting), B732 (Typed authentication
  principals and grant resolution), B855 (Authenticated request admission and budget handoff), B756 (Authentication
  header selection and mode dispatch), B003 (HTTP server, health routes and master key auth), B1139 (Stateful HTTP
  oracle scenarios). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
