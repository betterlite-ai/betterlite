    why: Own legacy request-root creation, route attributes and response-status attributes, omitted by the earlier legacy parts.
dod:
  - text: The factory forwards its inputs, chooses the three callback forms and implements every credential-carrier reuse, trim and fallback branch.
    proof: [factory-tests, oracle, helper-python]
  - text: Publication selects one canonical provider, collects all operator configs and applies explicit exclusion overrides before the setter; auth reads the retained provider even when the SDK global differs.
    proof: [publication-tests]
  - text: Optional hooks are inert when absent and preserve phase-body errors when present.
    proof: [runtime-tests]
  - text: Legacy auth creates the correctly named SERVER span with the supplied start and remote parent, and route/status setters preserve missing values and integer zero without closing it.
    proof: [legacy-span-tests]
checks:
  optional: []
  commands:
    - id: factory-tests
      why: Langfuse dispatch, constructor forwarding or credential-carrier composition is missing.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger_runtime::tests::factory::/)'
    - id: publication-tests
      why: Selection, exclusion precedence, publication order or the remembered fan-out provider is wrong.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger_runtime::tests::publication::/)'
    - id: runtime-tests
      why: The optional hook adapter is absent or swallows a request exception.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger_runtime::tests::hooks::/)'
    - id: helper-python
      why: The pure factory decision comparison has no independently checked Python adapter.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b8910::/)'
    - id: legacy-span-tests
      why: Legacy parent creation, route attributes or the response-status setter is missing.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::logger_runtime::tests::legacy::/)'
oracle_cases:
  - tools/oracle/cases/helpers/otel-logger-runtime/generic-and-langfuse-class.yaml
  - tools/oracle/cases/helpers/otel-logger-runtime/langfuse-content-class.yaml
  - tools/oracle/cases/helpers/otel-logger-runtime/gated-and-credentialed-exporters.yaml
  - tools/oracle/cases/helpers/otel-logger-runtime/console-placeholder-not-operator.yaml
  - tools/oracle/cases/helpers/otel-logger-runtime/empty-exporters-export-nowhere.yaml
  - tools/oracle/cases/helpers/otel-logger-runtime/retain-only-gated-exporters.yaml
deviations: []
out_of_scope:
  - 'opentelemetry.py: config/capture/dedupe, time/name, identity/team/service-tier and exception annotations are B3854; dynamic exporter caches are B3855; inference/raw attributes are B3856; metric/event recording is B3857; service/management/proxy failure hooks are B3858; inference/guardrail lifecycle and request tracer selection are B3859; constructor/provider setup is B3868. Primitive setters are B3844, transforms/tool attributes B3845, header context B3847. Only L3508-L3558 is newly owned here; cast_as_primitive_value_type has no caller at the pin.'
  - 'logger.py: _span_error_from_exception, OpenTelemetryV2 construction and registration, tracer_provider, _init_metrics, _init_events, service hooks, _emit_service, identity seeding, phase spans, pre/post-call proxy hooks, error stamping, emit_guardrail_span, request-root capture and module _registered_v2_logger/emit_guardrail_span/seed_request_identity/phase_span are B3853.'
  - 'logger.py: _request_trace_links, _LLMCallSpan, log_pre_api_call, async success/failure, metric recording, _seed_identity_baggage, MCP emission, _close_llm_call, _store_open_call, _release_carrier and _finish_carrier are B3852.'
  - 'litellm_logging.py: _init_custom_logger_compatible_class OTel arms and _maybe_auto_initialize_arize_phoenix are B8746; get_custom_logger_compatible_class and catalog infrastructure are B8741. Logging state, dynamic selection, pre/post, success, failure, streams and metadata functions remain B247-B253 and B190; other vendor factories remain their B111-B118 parts. Only L5191-L5269 is owned here.'
  - B3842 owns settings and exclusion normalization, B3850/B3851 own presets, B3849 owns attach_tenant_fan_out, and B8250 owns both Langfuse wrappers and the HTTP span policy.
  - B8680 installs the server-span layer; B110 connects the runtime to the server and adds HTTP cases. B8870 implements auth destination seeding and calls this runtime's provider accessor.
pitfalls:
  - A registered legacy logger and an already occupied SDK global do not identify the published V2 fan-out provider.
  - callback_settings.otel.excluded_services set to an empty list must clear env exclusions even when the canonical logger is a preset.
  - _maybe_construct_otel_v2 catches preset failures but does not catch build_otel_v2_logger failures.
  - B3853's old out-of-scope text says its callback calls fan_out_provider, but no callback method does so at the pin; adding that dependency would create a cycle.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
