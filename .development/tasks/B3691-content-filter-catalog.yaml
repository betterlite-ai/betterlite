id: B3691
title: Built-in pattern catalog and content category discovery
description: >-
  Load and expose the 82 named patterns from patterns.json in source order, and
  discover content categories across multiple data roots. Preserve YAML-first
  file lookup and JSON category descriptions. Implement bundled-first metadata
  deduplication: when a category name appears in multiple roots, the entry from
  the first (bundled) root wins. Expose category metadata for UI display,
  including name, display_name and description. Root constants and module-level
  lookup construction belong to this task; consumers in B3692 and later tasks
  call the discovery functions but do not build the catalogs themselves.

  Owned functions from litellm/proxy/guardrails/content_filter_data/__init__.py:
  category_dirs (L23-25) returns every categories/ folder that exists under the
  roots, bundled first. find_category_file (L28-39) returns the first
  <name>.yaml or <name>.json across category folders, checking bundled roots
  before legacy, or None if not found. Paths that would escape the folder
  (../x) never match; symlinks stored in the folder are returned as-is.

  Owned functions from litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/patterns.py:
  _load_patterns_from_json (L19-23) loads pattern definitions from patterns.json.
  get_compiled_pattern (L61-78) compiles a regex pattern by name with
  re.IGNORECASE; unknown names raise ValueError naming available patterns.
  get_all_pattern_names (L81-88) returns a list of all pattern names.
  get_pattern_metadata (L112-127) returns pattern metadata (name, display_name,
  category, description) for UI display, in source order from patterns.json.
  _category_entry (L130-168) parses a category YAML or JSON file from a
  categories_dir and returns a dict with name, display_name, description and
  default_action, or None on parse error or missing category_name.
  get_available_content_categories (L171-184) returns category metadata from
  every root, bundled first, with each name appearing once. _category_files
  (L187-190) yields (categories_dir, filename) tuples in alphabetical order.

  Owns both modules' imports, root constants (DATA_DIR, CATEGORIES_DIR,
  POLICY_TEMPLATES_DIR, LEGACY_DATA_DIR, DATA_ROOTS) and the module-level
  PREBUILT_PATTERNS, PATTERN_CATEGORIES, PATTERN_DISPLAY_NAMES,
  PATTERN_DESCRIPTIONS, PATTERN_EXTRA_CONFIG lookup dicts built from JSON.
  get_all_pattern_names has test callers at test_patterns.py:71; it is not
  dead code.

  Data assets: patterns.json (629 nonblank lines), 32 content_filter_data/categories/*
  files (11,681 nonblank/non-comment lines), and 28 content_filter_data/policy_templates/*
  files (2,584 lines). These are immutable category and policy-template definitions
  loaded by category_file, not executable functions. They are included for
  reference and inventory; the 14,894 asset lines require explicit resource
  budgeting outside the normal 400-line logic threshold.
scope:
  paths:
    - "crates/betterlite-config/assets/content_filter/patterns.json"
    - "crates/betterlite-config/assets/content_filter/categories/**"
    - "crates/betterlite-config/assets/content_filter/policy_templates/**"
    - "tools/oracle/cases/helpers/pattern-discovery/**"
    - "tools/oracle/fuzz/corpus/helper_case/pattern-discovery-*"
    - crates/betterlite-config/src/sections/content_filter_catalog.rs
    - crates/betterlite-config/src/sections/content_filter_catalog/**
    - tools/oracle/helpers/b3691.py
    - tools/oracle/helpers/b3691/**
    - tools/oracle/src/helpers/config/b3691.rs
    - tools/oracle/src/helpers/config/b3691/**
  lint_tables: false
