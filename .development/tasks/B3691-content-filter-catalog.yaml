dod:
  - text: Every pattern loads from patterns.json and can be compiled to a regex,
      preserving case-insensitive matching and raising ValueError on unknown
      names.
    proof: [pattern-discovery-tests, pattern-discovery-helper, pattern-discovery-corpus]
  - text: Pattern metadata returns all 82 patterns in source order with correct
      name, display_name, category and description fields.
    proof: [pattern-discovery-tests, pattern-discovery-helper, pattern-discovery-corpus]
  - text: >-
      Category discovery lists each category once per name, with bundled root
      preferred over legacy when the same name appears in both. A category YAML
      that parses successfully but lacks a category_name is skipped silently.
      A YAML that fails to parse is skipped with a warning naming the filename
      and exception. JSON categories have auto-generated display_name from
      filename, while YAML categories use declared display_name.
    proof: [pattern-discovery-tests, pattern-discovery-helper, bundled-first-dedup-test, pattern-discovery-corpus]
  - text: Symlinks in category folders load by name and return the link target,
      preserving pre-move behavior.
    proof: [pattern-discovery-tests]
  - text: Path traversal attempts in category names (../x, /abs/path) are
      rejected by find_category_file; symlinks stored inside the folder are
      returned.
    proof: [pattern-discovery-tests]
checks:
  optional: []
  commands:
    - id: pattern-discovery-tests
      why: Pattern loading, compilation, metadata and category discovery
        functions are absent or behavior is incorrect.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E
        'test(/^helpers::config::b3691::tests::/) - test(/replays_the_/)'
    - id: bundled-first-dedup-test
      why: Bundled-first dedup is vacuous; two roots with same-named categories
        must exist for the test to prove the behavior.
      run: "grep -q 'tmp_bundled\\|tmp_legacy' tools/oracle/src/helpers/config/b3691/tests.rs
        && grep -q 'same-named category' tools/oracle/src/helpers/config/b3691/tests.rs"
    - id: pattern-discovery-helper
      why: The oracle helper is missing or the booted proxy does not load
        patterns and categories correctly.
      run: test -f tools/oracle/helpers/b3691.py && uv run --locked
        --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run
        --locked --project tools/oracle/litellm basedpyright --project
        tools/oracle/helpers/pyrightconfig.json
    - id: pattern-discovery-corpus
      why: The new typed operation has no seed or the existing HelperCase
        decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" --
        'tools/oracle/fuzz/corpus/helper_case/pattern-discovery-*')" && grep
        -rlq "pattern_discovery\|PatternDiscovery" tools/oracle/fuzz/corpus/helper_case/pattern-discovery-*
        && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E
        'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/pattern-discovery/pattern-compilation-by-name.yaml
  - tools/oracle/cases/helpers/pattern-discovery/unknown-pattern-raises-error.yaml
  - tools/oracle/cases/helpers/pattern-discovery/all-pattern-names-and-metadata.yaml
  - tools/oracle/cases/helpers/pattern-discovery/category-yaml-parse-missing-name.yaml
  - tools/oracle/cases/helpers/pattern-discovery/category-json-auto-display-name.yaml
  - tools/oracle/cases/helpers/pattern-discovery/bundled-root-shadows-legacy.yaml
  - tools/oracle/cases/helpers/pattern-discovery/category-warning-on-parse-error.yaml
deviations: []
out_of_scope:
  - B4260 owns join_within and related path utilities in litellm/proxy/common_utils/path_utils.py;
    find_category_file calls this resolved dependency.
  - The guardrail_hooks/litellm_content_filter examples, benchmarks and guardrail_benchmarks
    tests are out of scope; B105's outline notes they are evaluation infrastructure,
    not production behavior.
  - llamaguard_prompt.txt has no caller at the pinned commit; B105 owns this file
    for inventory accounting only and does not implement any loader.
  - PrebuiltPatternName enum (patterns.py:30-36) has no caller at the pinned commit
    and is not built.
pitfalls:
  - "`reversed()` in get_available_content_categories (L183) deduplicates by building
    a dict from later entries first, so the first root wins when a name appears in
    multiple roots. If roots are (bundled, legacy), entries from legacy come first,
    then reversed() processes them backward, and dict assignment overwrites legacy
    with bundled."
  - A JSON category filename without .json extension (e.g., broken symlink) does
    not become a category entry, and harm_toxic_abuse.json has a hard-coded
    display_name override on line 154-159.
  - find_category_file checks both .yaml and .json extensions in order for each
    root (lines 36-38); YAML is preferred when both exist in the same folder.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
