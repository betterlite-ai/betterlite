id: B10161
title: JWT-to-OAuth routing override selection
description: >-
  LiteLLM can send a JWT-shaped bearer token to OAuth2 introspection instead of JWT validation when the token's unverified claims match one of litellm_jwtauth.routing_overrides. Three small functions in user_api_key_auth.py decide that match: _routing_selector_matches_claim, _matches_routing_override and _should_route_jwt_to_oauth2_override. B875's backend dispatch calls the last one before it picks OAuth, and B756's mode selection calls it to record the chosen validator. This task builds the three, so B875 waits on them instead of on all of B756's header work. The answer only picks a validator; it never grants an identity, a role or a model, and the chosen validator still authenticates the token.


  Layout. Module jwt_oauth_routing in betterlite-auth, crates/betterlite-auth/src/jwt_oauth_routing.rs, with its tests in jwt_oauth_routing/tests.rs. The file is an empty stub lib.rs already declares. It reads no config, no header and no request: callers pass the token text and B869's typed overrides, `config.sections.jwt_settings.routing.routing_overrides.as_deref()`. betterlite-auth already depends on betterlite-config, so no Cargo.toml change.


  Inputs. The overrides are B869's `betterlite_config::sections::jwt_settings::records::RoutingOverride`: iss is a `Selector`, client_id, scope and aud are `Option<Selector>`, and path is `OverridePath`, whose only variant is Oauth2. `Selector` is `One(String)` or `Many(Vec<String>)`; B869 already rejects extra keys and any other path, so nothing is validated again here. The claims come from B760's `jwt_claims::decode::unverified_claims(token) -> Option<TypedValue>`, LiteLLM's get_unverified_claims. TypedValue is betterlite_paths' Document; read a top-level member through its json field, and keep serde_json::Value out of every signature, since clippy.toml disallows the type.


  The selector. `routing_selector_matches_claim(selector: Option<&Selector>, claims: &TypedValue, claim: &str, split_space_delimited: bool) -> bool`. A None selector matches, before the claim is read. Otherwise the selector's strings are one item or the list as written; an empty list matches nothing. An absent claim or a JSON null fails. A JSON array claim gives its elements, never split, even for scope. A string claim is one value, except when split_space_delimited is on and the string, after Python's strip(), still holds an ASCII space: then the stripped string splits on single ASCII spaces and empty pieces drop out. When it holds no such space, the original unstripped string is the one value. Tabs and other whitespace never split. LiteLLM compares str() of any other claim type, which is repr text that docs/compatibility.md leaves outside the contract; JWT declares these four claims as strings or string lists, so a number, bool or object claim and a non-string array element match nothing here, while the array's string elements still count. The selector matches when any selector string matches any claim value. A selector string holding * or ? is a case-sensitive fnmatch pattern: call B890's `jwt_role_claims::fnmatch::RolePattern::new(selector).matches(claim)`, and write no second fnmatch. Before that, when split_space_delimited is off, a claim value holding any Python whitespace never matches a pattern. Every other selector string compares by exact equality, so brackets alone are literal and an exact selector may match a value with spaces.


  The override. `matches_routing_override(claims: &TypedValue, rule: &RoutingOverride) -> bool` is true only when iss, client_id, scope and aud all match, reading the top-level claims of those exact names, with split_space_delimited on for scope only.


  The decision. `should_route_jwt_to_oauth2_override(token: &str, overrides: Option<&[RoutingOverride]>) -> bool`. None or an empty list answers false before the token is touched. unverified_claims returning None answers false. Otherwise the first override whose path is Oauth2 and that matches logs DEBUG "JWT routing override matched. Routing token to OAuth2 introspection." and answers true; no claim value and no part of the token goes into a log line. No match answers false. The enable_jwt_auth check, the JWT shape test before the call and the LLM and info route limit stay with B875, which calls this only for a JWT with JWT auth on.


  Oracle. Helper cases on the b10161 operation in the auth group, with a tagged input of three variants. `selector` carries selector (null, a string or a list), claim (absent, null, a string or a list of strings) and split_space_delimited; Python calls `_routing_selector_matches_claim(selector_value, claim_value, split_space_delimited=...)`. `override` carries the override object and the claims object; Python builds JWTRoutingOverride from it and calls `_matches_routing_override(token_claims=..., override=...)`. `route` carries the token and routing_overrides (null or a list); Python builds a JWTHandler and calls update_environment with `LiteLLM_JWTAuth(routing_overrides=...)`, as jwt_claims.py's build_handler does, then `_should_route_jwt_to_oauth2_override(token=..., jwt_handler=...)`. Each answers {"matched": bool}. The Rust side decodes the override and selector values through B869's serde types, puts the claim into a one-member claims document, and calls the production functions. Route tokens are three base64url segments with an RS256 header that B760 accepts and any signature segment; nothing is verified. Add helper_case corpus seeds named jwt-oauth-routing-*. No route reaches this code yet: B875's dispatch stage carries the HTTP behavior.


  Tests. jwt_oauth_routing/tests.rs, rstest tables over every rule above and every pitfall below: selector_null_absent_and_empty_lists, scope_splits_on_ascii_space_only, wildcard_case_whitespace_and_brackets, selector_and_claim_cross_product, non_string_claims_never_match, override_requires_every_selector, route_takes_first_oauth2_match and route_false_without_overrides_or_claims. match_log_holds_no_claim_or_token captures the DEBUG line through a tracing_subscriber registry layer, as rejection_provider/tests.rs does, and asserts it holds neither the token nor a claim value.
