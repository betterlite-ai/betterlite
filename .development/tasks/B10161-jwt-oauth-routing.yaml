dod:
  - text: A null selector matches, an absent or null claim and an empty selector or claim list never match, and any selector string matching any claim value matches, equal to LiteLLM's answers.
    proof: [behavior-tests, oracle, helper-python]
  - text: Only scope splits, only on an ASCII space left after Python's strip(), and an unsplit scope keeps its original text.
    proof: [behavior-tests, oracle]
  - text: Selectors with * or ? match through B890's case-sensitive RolePattern, refuse a non-scope claim holding Python whitespace (U+001C to U+001F included), and every other selector, brackets included, compares exactly.
    proof: [behavior-tests, oracle]
  - text: An override needs iss, client_id, scope and aud all to match, and the decision answers true for the first matching oauth2 override, false for no or empty overrides and for a token without decodable claims.
    proof: [behavior-tests, oracle]
  - text: The match logs one DEBUG line with no token and no claim value.
    proof: [behavior-tests]
  - text: New jwt-oauth-routing seeds for b10161 replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: A selector, override or decision rule differs from LiteLLM, or the match log leaks the token or a claim.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_oauth_routing::/)'
    - id: helper-python
      why: The b10161 adapter is missing or fails the strict Python checks.
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b10161.py tools/oracle/helpers/b10161)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: No new b10161 seed reaches the shared helper case parser.
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/jwt-oauth-routing-*")" &&
        grep -lE '^[[:space:]]+b10161:' tools/oracle/fuzz/corpus/helper_case/jwt-oauth-routing-* &&
        cargo nextest run --locked -p betterlite-oracle-groups --features betterlite-oracle-groups/betterlite-oracle-auth --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
