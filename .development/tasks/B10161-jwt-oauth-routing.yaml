out_of_scope:
  - "litellm/proxy/auth/user_api_key_auth.py: _user_api_key_auth_builder.backend_dispatch (L1603-L1856), with the enable_jwt_auth and enable_oauth2_auth flags, the LLM and info route limit and the OAuth call: B875, which calls should_route_jwt_to_oauth2_override. OAuth introspection itself: B768."
  - "litellm/proxy/auth/user_api_key_auth.py: get_api_key, get_api_key_from_custom_header, check_api_key_for_custom_headers_or_pass_through_endpoints, the public-route checks and get_rbac_role: B756, whose mode selection also calls this module. Every other function: the owners B756's out_of_scope lists."
  - "Decoding the unverified token: B760's unverified_claims. Loading and validating routing_overrides: B869's jwt_settings section. The fnmatch port: B890's jwt_role_claims::fnmatch."
pitfalls:
  - Python's strip() and isspace() count U+001C to U+001F as whitespace and Rust's trim() and char::is_whitespace() don't; add that range, as jwt_role_claims/scopes.rs does, or the iss "trusted.example.com\u{1c}evil.com" matches "trusted.*" where LiteLLM refuses it.
  - A scope with no internal ASCII space after strip() is compared as the original text, so " openid " never equals the selector "openid"; strip only on the split branch.
  - A selector with brackets but no * or ? is literal, so "[ab]c" matches only the claim "[ab]c"; build a RolePattern only when the selector holds * or ?.
  - The whitespace guard covers wildcard selectors on iss, client_id and aud only; the exact selector "a b" matches the claim "a b", and the scope token "App:\tLiteLLM" still matches "App:*".
  - An empty routing_overrides list is falsy in LiteLLM and answers false before the token is decoded, the same as None.
  - The helper stub tools/oracle/src/helpers/auth/b10161.rs and its registry lines are on main; replace the stub Op with a typed impl Helper and leave the auth group's lib.rs and operations.txt alone.
review_level: security
