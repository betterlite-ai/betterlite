id: B8648
title: Mount the A2A agent routes
description: >-
  A route module waits for a mount. B8589's `agent_endpoints::a2a_routes::routes()` serves the agent card (GET `/a2a/{agent_id}/.well-known/agent-card.json` and GET `/a2a/{agent_id}/.well-known/agent.json`) and the invoke handler (POST `/a2a/{agent_id}`, POST `/a2a/{agent_id}/message/send`, POST `/v1/a2a/{agent_id}/message/send`), all behind the key check. LiteLLM loads the a2a module as a lazy feature (prefix /a2a and suffix /message/send). This task builds the state the module takes and mounts it. B10027 mounts B8274's agent skills discovery routes in app/agents/skills.rs.

  Where. Module `app::agents::a2a` (crates/betterlite-server/src/app/agents/a2a.rs and a2a/**: state.rs, tests.rs); the skeleton declares it in app/agents.rs. Then add one merge line to `mount` in crates/betterlite-server/src/app/agents.rs (the contract functions B8647 filled; touch nothing else there). Read crates/betterlite-server/src/agent_endpoints/a2a_routes.rs first and use its state type and constructor names. No statics, no trait objects, native async fn.

  1. A2A state (a2a/state.rs). Build B8589's `A2aRouteState` once at mount with these collaborators. The agent lookup is B8231's get_agent_with_read_through over the registry and the one agents read-through that B8645's AgentServices clones from shared.agents. The access check is AgentServices' B4780 resolver, is_agent_allowed. The request preparation (common_processing_pre_call_logic) is B8802's `app::inference::pre_call_step(state)`, the same production step the chat route runs. The send entry point is B4814's asend_message. The forwarding client is `shared.http`. The stream relay ports are B4789's, over `shared.http`, and the state holds `SharedStreamGenerator::standalone(redactor)` from B9720, which B7980 swaps for the production one. The backend auth ports are `NoBackendAuth`, a struct in a2a/state.rs whose AppAuth and HopAuth both answer Ok(None); B141 replaces it with the real adapters. The custom URL value is B7323's custom route URL, built from config the way B7323 reads it. The success hook is B8394's post-call success hook and the failure hook B8395's, both on `shared.proxy_logging`. When a collaborator's owner already exposes a production constructor, call it; write an adapter here only where the owner left a trait for the server. The A2A provider ports (AgentTransport, RunTransport, TokenTransport, TokenClock, B4809's completion port, B4804's transport) are B142's; where the state needs one before B142 lands, pass a placeholder that fails by name.

  2. Mount. In app/agents.rs, mount merges `a2a_routes::routes(...)` with the state from item 1.

  Tests in app::agents::a2a::tests: the state is built once and its lookup finds a config agent by id and by name and asks the read-through only after both miss.

  HTTP oracle cases through the booted proxy, with a master key and no database. B8589 tests its handlers with tower's oneshot only, and its HTTP cases moved here; write each from B8589's text. From B8589: card-no-credentials and invoke-no-credentials (401 without a key), card-unknown-agent (404 "Agent 'missing' not found"), invoke-bad-jsonrpc-version (400 and the -32600 error) and invoke-unknown-agent (404 and -32000). Plus three of this task's own in tools/oracle/cases/agents/a2a-wiring/: the card of a config agent with agent_card_params (url rewritten to the proxy URL), the same card through /.well-known/agent.json, and POST /v1/a2a/{name}/message/send without a key (401).

  Production stream generator. B7980 swaps the production shared stream generator into the /v1/messages route only. Build this task's A2A state (app/agents/a2a/state.rs) with B7980's shared_stream_generator builder instead of SharedStreamGenerator::standalone, and add the cases resubscribe-events and resubscribe-upstream-404 under tools/oracle/cases/agents/a2a-stream (an agent oracle-agent whose card url is the mock upstream; tasks/resubscribe relays two status-update results in order, and an upstream 404 without an error key is one data frame with -32603 and message "Not Found"), plus a test that a message/stream body dropped before its first event releases the reservation once.

  Playground A2A calls. The playground's agent chat posts JSON-RPC {jsonrpc:"2.0", id, method:"message/send", params:{message:{role: "user", parts:[{kind:"text", text}], messageId}, metadata:{guardrails}?}} to POST /a2a/<agent_id>/message/send; Compare streams with method "message/stream" to POST /a2a/<agent_id> and reads the SSE frames. The agent picker reads GET /v1/agents (B4784, mounted by B8647). Add tools/oracle/cases/ui/playground/a2a-send-and-stream.yaml with one send and one stream against a mock A2A server, using B860's Postgres fixture with B9942's bootstrap and one stored agent.
scope:
  paths:
    - crates/betterlite-server/src/app/agents/a2a.rs
    - crates/betterlite-server/src/app/agents/a2a/**
    - crates/betterlite-server/src/app/agents.rs
    - tools/oracle/cases/agents/a2a-wiring/**
    - tools/oracle/cases/agents/a2a-routes/**
    - tools/oracle/cases/agents/a2a-stream/resubscribe-events.yaml
    - tools/oracle/cases/agents/a2a-stream/resubscribe-upstream-404.yaml
    - tools/oracle/cases/ui/playground/a2a-send-and-stream.yaml
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/a2a_endpoints.py#L566-L650
    why: The two card paths and the three invoke paths, each with user_api_key_auth and the "[beta] A2A Agents" tag.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/registry_read_through.py#L198-L213
    why: _agent_from_registry and get_agent_with_read_through, the lookup the A2A state uses.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/app/(dashboard)/playground/llm_calls/a2a_send_message.tsx#L117-L300
    why: JSON-RPC message/send and message/stream bodies and their two URLs.
dod:
  - text: The A2A route state is built once with the read-through lookup, the B4780 access check and the shared router, logging and HTTP client.
    proof: [a2a-tests]
  - text: The five A2A paths answer through the booted proxy as LiteLLM does, with 401 for a missing key.
    proof: [oracle]
  - text: "A2A tasks/resubscribe streams relay the agent's events through the production hooks, and a non-2xx agent answer is one -32603 frame."
    proof: [oracle]
  - text: "The playground's A2A message/send and message/stream calls match LiteLLM through the booted proxy, SSE frame order included."
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: a2a-tests
      why: the A2A route state is missing or built from the wrong collaborators
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::agents::a2a::/)'
oracle_cases:
  - tools/oracle/cases/agents/a2a-routes/card-no-credentials.yaml
  - tools/oracle/cases/agents/a2a-routes/card-unknown-agent.yaml
  - tools/oracle/cases/agents/a2a-routes/invoke-no-credentials.yaml
  - tools/oracle/cases/agents/a2a-routes/invoke-bad-jsonrpc-version.yaml
  - tools/oracle/cases/agents/a2a-routes/invoke-unknown-agent.yaml
  - tools/oracle/cases/agents/a2a-wiring/card-config-agent.yaml
  - tools/oracle/cases/agents/a2a-wiring/card-legacy-path.yaml
  - tools/oracle/cases/agents/a2a-wiring/message-send-no-key.yaml
  - tools/oracle/cases/agents/a2a-stream/resubscribe-events.yaml
  - tools/oracle/cases/agents/a2a-stream/resubscribe-upstream-404.yaml
  - tools/oracle/cases/ui/playground/a2a-send-and-stream.yaml
deviations:
  - what: The A2A routes are registered at startup, not on the first request under /a2a or a /message/send suffix.
    why: betterlite has no lazy import cost; requests get the same answers.
out_of_scope:
  - "The handler: B8589. The JSON-RPC forwarding and stream relay: B4788 and B4789."
  - "The agent skills discovery state, its mount and its three HTTP cases: B10027."
  - "The agents API routes: B8647."
pitfalls:
  - The A2A agent lookup asks the read-through only when both the id and the name lookups miss, and looks up again only when it returned true.
  - /v1/a2a/{agent_id}/message/send must not shadow /v1/a2a/discover, which another area mounts; register only the exact paths B8589 lists.
  - The proxy URL in the card comes from B7323's custom route URL for route a2a/<agent_id>, so a configured base path changes the card url.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
