deviations:
  - what: >-
      Span attribute redaction for operator-visible error text only redacts keys on database
      and service spans that describe proxy infrastructure (database host, port, namespace)
      when the span is not tenant-owned.
    why: >-
      Tenants see their own call errors. Operator-owned infrastructure spans (database,
      service, guardrail endpoint) contain operator endpoints/credentials that tenants
      must not see.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/plumbing/providers.py#L363-L387
  - what: >-
      The whole query string is dropped from http.url, http.target, and url.full attributes,
      and the url.query attribute is dropped outright from spans delivered to tenant destinations.
    why: >-
      Span attributes may carry HTTP request URLs with embedded credentials. LiteLLM accepts
      virtual keys as query parameters, and query strings can hold credentials the operator
      used that tenants must not see.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/plumbing/providers.py#L379-L482
  - what: >-
      Captured HTTP header attributes from FastAPI instrumentation include request headers
      the operator's own OTel configuration asked to capture, regardless of tenant scope,
      and response headers the destination receives.
    why: >-
      Operator header capture is operator configuration (OTEL_INSTRUMENTATION_HTTP_CAPTURE_HEADERS_*).
      Tenant destinations see the request and response the tenant/operator exchanged, which
      the captured headers describe.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/plumbing/providers.py#L378-L381
out_of_scope:
  - _SpanView is a ReadableSpan view wrapper. The description lists its purpose; building it
    requires only the inherited OTel SDK ReadableSpan construction.
  - Operator exporter suppression via _OverriddenBackendFilter is a span processor wrapper; it
    does not compute cost, redact messages or log metadata.
  - Named destination span scopes (full vs llm_only) are read from OtelDestination records supplied
    by B3842; the fan-out only uses them.
  - Span redaction of operator-visible URLs and error text reads attribute keys from B3840 definitions
    and request context from B3847; the redaction itself edits attributes before forwarding.
pitfalls:
  - "_CREDENTIAL_ALIASES maps provider-vendor pairs like {'arize_space_id': 'space_id'} so one exporter's output headers stay equal to the tenant destination's input headers under that name."
  - "is_llm_call_span checks for gen_ai.operation.name to distinguish model calls from MCP tool calls, and it is called on both to separate them; neither check is an error."
  - "Captured HTTP header attributes start with 'http.request.header.' and 'http.response.header.' prefixes set by FastAPI instrumentation, not tenant request parameters."
  - "_SinkKey normalizes on (endpoint, sorted credential tuples), so header-name casing and different credential alias spellings map to the same account; _otlp_traces_endpoint strips the signal path."
  - "Drain saturation is checked when buildable, not when acquire releases, so destinations anchored before saturation stay cacheable even while the drain overflows."
  - "on_end runs on whatever thread ended the span and reaches shutdown while the SDK tears down; the drain submits all closing to workers so no tenant's network delay blocks the proxy."
  - "Every destination processor build failure is logged but does not fail the span or break other destinations; deliverable filters out unbuildable ones before the request anchors them."
  - "additive mode means nothing is suppressed; _OverriddenBackendFilter passes spans through and the operator's exporter still gets its copy, so destinations with the same account get the span twice."
  - "llm_only scope delivers model calls as trace roots and holds back the rest unless wider siblings share the sink, so a request with one full destination and one llm_only to the same account widens the llm_only delivery to the full tree."
