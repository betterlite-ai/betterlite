dod:
  - text: >-
      _DrainPool closes shed destination processors asynchronously with bounded workers,
      queues saturated destinations away from new builds, and shutdown waits only for
      the configured deadline before abandoning any still-flushing processor.
    proof: [fanout-drain-behavior]
  - text: >-
      TenantFanOutSpanProcessor delivers each span to its destinations' processors after
      filtering by scope, redacting operator-suppressed attributes, and deduplicating
      already-exported spans, preserving the exact filtering rules and constants LiteLLM uses.
    proof: [fanout-processor-behavior]
  - text: >-
      Destination processors cache by normalized endpoint/credential account (header casing,
      credential aliases, no signal path), evict LRU when cache overflows, and shed evicted
      processors to the drain rather than closing inline.
    proof: [fanout-cache-behavior]
  - text: >-
      _OverriddenBackendFilter holds spans back from the operator's exporter when the request
      routed that account to a tenant destination, honoring additive mode, scope narrowing
      and per-destination sink widening.
    proof: [fanout-filter-behavior]
  - text: >-
      attach_tenant_fan_out is idempotent and assembles operator-sink-scope map from v2
      configs, skipping exporters with no fixed endpoint and consulting every config's own
      provider scope.
    proof: [fanout-attach-behavior]
  - text: >-
      deliverable_destinations returns only destinations whose exporters will build, blocking
      new requests from anchoring to what cannot export.
    proof: [fanout-deliverable-behavior]
  - text: >-
      Named destination scopes are full or llm_only; unnamed operations (cache tokens, database
      spans) read the semantic definitions from B3840, excluded-database filter from B3842,
      and request context from B3847.
    proof: [fanout-semantics-behavior]
  - text: >-
      Every added oracle case names its input (span attributes, destination config, request
      context) and matches the literal LiteLLM output at the pinned commit.
    proof: [oracle]
