id: B3849
title: OTel tenant fanout and scoped span delivery
description: >-
  Deliver a request's spans to its authorized tenant destinations with credential-aware
  deduplication, scope filtering and bounded processor retention. Preserve projection of
  tenant-visible attributes, operator suppression and asynchronous drain behavior.

  _DrainPool manages background closure of shed destination processors so network timeouts
  do not stall span export or process teardown. _SpanView lets one exporter see custom
  attributes and resource while others see the unmodified span. Destination processors cache
  by endpoint/credential account (normalized for header casing and credential aliases like
  arize_space_id/space_id), evict LRU when past capacity once the drain has room, and shed
  to the drain instead of running inline so one unreachable collector never blocks others.

  TenantFanOutSpanProcessor reads request-scoped destinations and operator-account scopes
  from context, applies scope filtering (full trace or llm_only), redacts operator-suppressed
  backends and tenant-visible attributes (query strings from URLs, error text the
  operator wrote), and hands each filtered span to its destination's processor. _OverriddenBackendFilter
  wraps the operator's own exporter to hold back spans when the request overrode that account
  to a tenant destination, preserving additive mode (where both export) and honoring per-destination
  scope narrowing (llm_only destinations export model calls only unless wider siblings share the
  same account).

  attach_tenant_fan_out adds the fan-out to a provider idempotently on first call, consulting
  the operator's v2 logger configs to build a map of operator exporter accounts by endpoint
  and credential name. deliverable_destinations returns what the fan-out can actually export
  to (buildable exporters, plugged-in protocols). operator_sink_scopes assembles that map for
  operator exporter filtering. Named destination scopes are full or llm_only; unnamed operations
  write the semantics of span filtering for cache/reasoning tokens, guardrail errors and
  database systems (excluded by config, not by destination). Budget includes span attribute
  redaction and request-specific deduplication state.
