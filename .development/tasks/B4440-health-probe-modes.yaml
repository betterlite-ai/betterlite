id: B4440
title: Health probe payloads, mode handlers and tracking metadata
description: >-
  Build `health_probe_modes` in betterlite-server. It is the Rust form of LiteLLM's HealthCheckHelpers class
  and the two small functions in health_check_utils.py. It turns the model parameters of one deployment plus a
  health mode into the exact call a probe makes, runs that call through an injected backend, and shapes the
  result. B4449 later wires the backend to the real call operations and owns `ahealth_check` itself (mode
  lookup, the `no-cache` flag, the try/except that turns failures into the error dict). B4443 calls the
  entry point B4449 builds. Nothing here talks to a provider.

  Types. `HealthProbeParams` is the model_params dict: typed fields for the keys this module reads (`model`,
  `api_base`, `api_key`, `api_version`, `max_tokens`, `voice`, `messages`, `fallbacks`, `litellm_metadata`,
  `cache`) and one passthrough map of `serde_json::Value` for every other key, behind an `#[expect]` that says
  these are provider parameters betterlite does not model. Key order of the passthrough map is kept. `api_key`
  is a secret type, never logged or put into an error text. `HealthProbeBackend` is an async trait with one
  method per call below. `HealthProbeError` is this module's error enum and holds a source error from the
  backend without losing it.

  Modes. `plan_health_probe(mode, model, custom_llm_provider, params, prompt, input) -> Option<HealthProbePlan>`
  is get_mode_handlers. It returns None for a mode outside the 14 names: chat, completion, embedding,
  audio_speech, audio_transcription, image_generation, image_edit, video_generation, rerank, realtime, batch,
  responses, ocr, evaluation. B4449 turns None into "Mode {mode} not supported. See modes here:
  https://docs.litellm.ai/docs/proxy/health". The plan only records inputs. Like the Python lambdas, nothing
  is built or validated until `run_health_probe(plan, backend, ...)` runs it, so failures from a bad evaluation
  payload or a missing OCR document surface at run time, inside the caller's error handling.

  Call arguments per mode, with `filtered` meaning the params without the `messages` key (health_check_utils
  `_filter_model_params`). chat: the full params, `messages` included. completion: filtered plus
  prompt = `prompt` or "test". embedding: filtered plus input = `input` or ["test"]. audio_speech: filtered, with
  voice "alloy" added only when filtered has no `voice` key, plus input = `prompt` or "test". audio_transcription:
  filtered plus the bundled health wav from B1001. image_generation: filtered plus prompt = `prompt` as given
  (None stays None). image_edit: filtered plus image = the decoded health PNG and prompt = IMAGE_EDIT_HEALTH_CHECK_PROMPT.
  video_generation: filtered plus prompt = `prompt` or "test video generation". rerank: filtered plus
  query = `prompt` or "" and documents = ["my sample text"]. realtime: `model`, `custom_llm_provider`,
  `api_base`, `api_key`, `api_version` read from params (None when absent) and the whole params as model_params.
  batch: see below. responses: filtered plus input = `prompt` or "test". ocr: filtered plus document from an
  injected `OcrHealthDocuments` trait (model, custom_llm_provider). evaluation: see below. Empty strings and empty
  lists count as missing for every `or` above, as in Python. When filtered already holds a key the mode adds
  (`prompt`, `input`, `file`, `image`, `query`, `documents`, `document`), Python raises TypeError for a repeated
  keyword, so `run_health_probe` returns a `HealthProbeError` naming the key and sends nothing. The audio_speech
  `input` and the chat mode (no added keys) follow the same rule.

  Evaluation mode. Questions come from `evaluation_questions(custom_llm_provider)`: provider "hosted_vllm" gets
  one question `reachable` of type choice, instructions "Is the service reachable?", criteria {"yes": null,
  "no": null}. Every other provider, including unknown ones and providers with their own decisions config,
  gets one question `reachable` of type noul with instructions "Is the service reachable?". The payload is
  {state: `prompt` or "health check", questions, then every filtered key}; a filtered `state` or `questions`
  key therefore overrides the built value. It is then validated as DecisionsCallParams: `model` a string,
  `state` a string, mapping or list, `questions` a valid DecisionQuestionMap (1 to 128 questions, rules from
  B3510's betterlite-models records), `api_key`, `api_base`, `custom_llm_provider` strings or null, `timeout`
  a number or null, `extra_headers` a string-to-string map or null, any other key allowed. Validation failure is
  a `HealthProbeError`.

  Wildcard models. `probe_wildcard_model` is ahealth_check_wildcard_models. It asks an injected
  `CheapestChatModels` trait for the 3 cheapest chat models of the provider. B176 owns the function behind that trait (pick_cheapest_chat_models_from_llm_provider). With none, it fails with exactly
  "Unable to health check wildcard model for provider {provider}. Add a model on your config.yaml or contribute here - https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json".
  Otherwise it sets `model` to the first, `fallbacks` to the rest (None when only one), and `max_tokens` to
  the existing value or 16 (a key present with null stays null). It then sends the chat call with the full params
  and the logging object and returns an empty `HealthCheckResponse`, whatever the provider returned.

  Tracking metadata. `add_tracking_information(params)` is
  _update_model_params_with_health_check_tracking_information. It replaces `litellm_metadata` with
  {"tags": ["litellm-internal-health-check"]}, discarding any earlier value, then applies B1106's
  add_user_api_key_auth_to_request_metadata to it with the internal health principal. The principal is B770's
  get_litellm_internal_health_check_user_api_key_auth: api_key, team_id, key_alias and team_alias all equal to
  "litellm-internal-health-check". The metadata variable name is "litellm_metadata". Return the updated params.

  Batch probe. `probe_batch_mode` is _batch_health_check. When the filtered params hold a logging object, call
  B247's update_from_kwargs on it with kwargs = filtered, model = filtered `model`, user = None,
  optional_params = {} and litellm_params = {"api_base": value} when `api_base` is truthy, else None. Then, if
  the provider is not one of openai, azure, hosted_vllm, litellm_proxy, vertex_ai, xai (this module owns that
  list, from LIST_BATCHES_SUPPORTED_PROVIDERS), send the chat call with the full params. Otherwise send
  list_batches with filtered plus custom_llm_provider = the provider, replacing any value filtered had.

  Image edit probe. `probe_image_edit` runs the edit call. If it fails with an error B184 classifies as bad
  request (or any subtype, content policy violation included) and either the class is content policy violation or
  the message contains "moderation_blocked", it returns an empty image response instead. Every other error is
  returned unchanged. The health PNG is LiteLLM's TEST_IMAGE_BASE64 string, copied exactly and decoded with the
  base64 crate when asked for (512 by 512, blue circle on white). IMAGE_EDIT_HEALTH_CHECK_PROMPT is "Add a small yellow star in the top right corner of this simple drawing of a blue circle on a white background".

  Response shape. `health_check_response(headers)` is _create_health_check_response: copy only
  `x-ratelimit-remaining-requests`, `x-ratelimit-remaining-tokens` and `x-ms-region`, each only when the key is
  present with a non-null value (an empty string is kept). Lookups are exact lowercase keys. Insertion order is
  those three. The result serializes as a JSON object and is `{}` when none are present.

  Tests live in `health_probe_modes::tests` with these name prefixes so the checks below can filter them:
  `mode_` (one case per mode, defaults, falsy fallbacks, duplicate keys, unknown mode, lazy failure), `tracking_`,
  `wildcard_`, `batch_`, `image_edit_`, `evaluation_`, `response_` (header filter, image bytes, filtered params).
  Native tests use a recording fake backend, and the oracle helper cases below drive the real Python functions
  with recording stubs in place of the litellm a* calls.

