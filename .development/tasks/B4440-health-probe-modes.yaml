dod:
  - text: plan_health_probe returns the exact call arguments for each of the 14 modes, with the messages key removed for every mode except chat.
    proof: [mode-tests, oracle, helper-python]
  - text: The prompt and input fallbacks use the Python defaults and treat empty strings and empty lists as missing; image_generation passes a missing prompt as null.
    proof: [mode-tests, oracle, helper-python]
  - text: audio_speech adds voice "alloy" only when the params have no voice key, and a mode that would repeat a key already in the params fails without sending a call.
    proof: [mode-tests, oracle, helper-python]
  - text: A mode outside the 14 names gives None, and failures from evaluation validation or the OCR document appear only when the plan runs.
    proof: [mode-tests]
  - text: Evaluation questions are the choice question for hosted_vllm and the noul question for every other provider, and filtered state or questions keys override the built ones.
    proof: [evaluation-tests, oracle, helper-python]
  - text: The evaluation payload is rejected when model, state, questions or the typed optional fields have the wrong type or the question map has 0 or more than 128 questions.
    proof: [evaluation-tests]
  - text: The wildcard probe uses the cheapest model, passes the remaining ones as fallbacks, defaults max_tokens to 16, returns an empty response and fails with the exact message when no model is found.
    proof: [wildcard-tests, oracle, helper-python]
  - text: Tracking metadata replaces litellm_metadata with the single health tag and then applies the internal health principal through the metadata step.
    proof: [tracking-tests, oracle, helper-python]
  - text: The batch probe updates the logging object, then calls list_batches for the six supported providers with the provider name forced, and the chat call for all others.
    proof: [batch-tests, oracle, helper-python]
  - text: The image edit probe returns an empty image response for content policy errors and "moderation_blocked" messages and returns every other error unchanged.
    proof: [image-edit-tests, oracle, helper-python]
  - text: The health response keeps only the three rate limit and region headers when they hold a value, and the health PNG decodes to a 512 by 512 PNG.
    proof: [response-tests, oracle, helper-python]
  - text: Helper corpus cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]

checks:
  optional: [mutants]
  commands:
    - id: mode-tests
      why: a mode's call arguments, defaults, duplicate-key failure, unknown-mode result or lazy failure is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_probe_modes::tests::mode_/)'
    - id: evaluation-tests
      why: evaluation questions, key override or payload validation is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_probe_modes::tests::evaluation_/)'
    - id: wildcard-tests
      why: wildcard model choice, fallbacks, max_tokens default or the no-model error is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_probe_modes::tests::wildcard_/)'
    - id: tracking-tests
      why: health tag, metadata replacement or the internal principal is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_probe_modes::tests::tracking_/)'
    - id: batch-tests
      why: batch logging update, supported-provider list_batches or the chat fallback is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_probe_modes::tests::batch_/)'
    - id: image-edit-tests
      why: the moderation swallow or the pass-through of other errors is missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_probe_modes::tests::image_edit_/)'
    - id: response-tests
      why: header filtering, filtered params or the health image bytes are missing
      run: >-
        cargo nextest run --locked -p betterlite-server --no-tests=fail
        -E 'test(/^health_probe_modes::tests::response_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4440)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4440 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4440/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added health probe cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/health_probe_modes-*")" &&
        grep -lE '^[[:space:]]+b4440:' tools/oracle/fuzz/corpus/helper_case/health_probe_modes-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

oracle_cases:
  - tools/oracle/cases/helpers/health-probe-modes/mode-arguments.yaml
  - tools/oracle/cases/helpers/health-probe-modes/mode-fallbacks.yaml
  - tools/oracle/cases/helpers/health-probe-modes/duplicate-keys.yaml
  - tools/oracle/cases/helpers/health-probe-modes/evaluation-payload.yaml
  - tools/oracle/cases/helpers/health-probe-modes/wildcard-probe.yaml
  - tools/oracle/cases/helpers/health-probe-modes/tracking-metadata.yaml
  - tools/oracle/cases/helpers/health-probe-modes/batch-probe.yaml
  - tools/oracle/cases/helpers/health-probe-modes/image-edit-moderation.yaml
  - tools/oracle/cases/helpers/health-probe-modes/response-headers.yaml

deviations:
  - what: The OCR document comes from an injected OcrHealthDocuments trait that betterlite-ocr implements, not from a native extension binding. A provider without a document gives a HealthProbeError.
    why: Rust has no Python bridge to ask. LiteLLM at the pin raises NoPythonImplementationError only when the extension is missing, so a shipped build behaves the same.
  - what: Evaluation payload validation reports betterlite's typed error text, not pydantic's.
    why: pydantic error text is Python library output; the accepted and rejected inputs are the same.
  - what: Header values in the health response are strings.
    why: The headers come from HTTP responses, where Python also sees strings; the declared type is dict.

out_of_scope:
  - "ahealth_check in litellm/main.py L8725-L8831 (mode lookup, `no-cache`, the logging object, error dict, stack trace trimming): B4449 owns it and calls this module."
  - "The call operations the backend trait stands for (acompletion, atext_completion, aembedding, aspeech, atranscription, aimage_generation, aimage_edit, avideo_generation, arerank, aresponses, aocr, asystemone, alist_batches): their own tasks own them; B4449 implements the trait with them."
  - "_realtime_health_check in litellm/realtime_api/main.py L631: B1127 owns it; this module only passes the arguments."
  - "pick_cheapest_chat_models_from_llm_provider: llm_request_utils.py is in B176's covers; this module only defines the CheapestChatModels trait for it."
  - "UserAPIKeyAuth.get_litellm_internal_health_check_user_api_key_auth: B770 owns the principal; add_user_api_key_auth_to_request_metadata: B1106 owns it."
  - "Logging.update_from_kwargs: B247 owns it; this module calls it through a narrow trait."
  - "Audio file access for audio_transcription: B1001 owns it. Decisions record types: B3510 owns them."
  - "_run_model_health_check in litellm/proxy/health_check.py L514-L536: not in this entry's covers. B4442 names B4440 as owner and B4443 builds it; see notes."
  - "OCR provider health documents (get_health_check_document in litellm-rust): no task owns them yet; see notes."

pitfalls:
  - "`**model_params` plus an added keyword raises TypeError in Python when model_params already has that key; health_check_params from config can carry `input` or `prompt`, so check each added key against the filtered params."
  - "Only chat keeps `messages`; every other mode strips it, including batch's list_batches call but not the batch acompletion fallback, which gets the unfiltered params."
  - "The batch fallback to acompletion applies to every provider outside the six, bedrock among them; list_batches for the six gets `custom_llm_provider` forced over any value in the params."
  - "In evaluation mode the filtered keys come last in the dict, so `state` or `questions` in model_params wins over the built values."
  - "`prompt or \"test\"` replaces an empty string, but image_generation uses `prompt=prompt` with no fallback, so an empty string stays an empty string and None stays null."
  - "The wildcard probe returns {} and ignores the provider response headers, unlike every other mode."
  - "`fallbacks` is null, not an empty list, when the provider has exactly one cheap model."
  - "Setting `litellm_metadata` overwrites an earlier value; tags from health_check_params do not survive."
  - "The moderation check is a substring test on the error text (`moderation_blocked`) and applies to any bad request subtype, not only content policy errors."
  - "No oracle case for the ocr mode: the pinned Python needs the native extension, which the oracle environment may not load. Cover it in native tests with a fake OcrHealthDocuments."
  - "The health PNG string is about 4 KB on one line; copy it with a script-free copy of the file text and verify the decoded size and PNG signature in a test."

review_level: standard

budget:
  max_changed_lines: 1500
  max_new_expects: 1
