id: B3273
title: Search tool selection and fallback execution
description: >-
  Build `search_tool_routing` in betterlite-router: the part of LiteLLM's SearchAPIRouter that holds the router's
  search tool list, picks one tool for each attempt and runs a search call through the shared retry and fallback engine.
  It is a port of litellm/router_utils/search_api_router.py (about 150 lines of logic). The module is generic over the
  search function: it never imports betterlite-openai or betterlite-core, because betterlite-router has no internal
  dependencies and must stay that way. The caller passes the search function in as a trait object or generic parameter.

  Types. `SearchToolEntry` has `search_tool_id: Option<String>`, `search_tool_name: Option<String>`,
  `litellm_params: SearchToolParams` and `search_tool_info: Option<serde_json::Value>`. `SearchToolParams` has
  `search_provider: Option<String>`, `api_key: Option<secrecy::SecretString>`, `api_base: Option<String>` and
  `extra: IndexMap<String, serde_json::Value>` for every other key (`timeout`, `max_retries` and anything a database
  row carries). Debug output of an entry never shows the key. `SearchToolList` owns the entries behind a
  `std::sync::RwLock` holding an `Arc<Vec<SearchToolEntry>>`, so an attempt that is already reading sees the old list
  or the new one, never a mix; no lock is held across an await. `SearchToolRoutingError` is a thiserror enum with
  `NotFound { name }` (Display: `Search tool '<name>' not found in router.search_tools`), `NameRequired` (Display:
  `search_tool_name or model parameter is required for search`) and `ProviderMissing { name }` (Display:
  `search_provider not found in litellm_params for search tool '<name>'`). These texts are LiteLLM's ValueError messages.

  `SearchToolList::replace(entries)` is update_router_search_tools: it swaps the whole list in one step and keeps only
  the four fields above, logging at debug "Adding N search tools to router" and at info "Successfully updated router
  with N search tool(s)". The proxy startup and the periodic database sync call it; those callers are not in this task.
  `SearchToolList::matching(name)` is get_matching_search_tools: every entry whose `search_tool_name` equals the name
  exactly, in list order, or `NotFound` when there are none.

  `select_attempt(list, name, call_params, rng)` is async_search_with_fallbacks_helper without the call: take the
  matching entries, pick one with a uniform random choice (no weights, no rpm or tpm, no cooldown; use the rand crate
  already in Cargo.toml and an injected `Rng` so tests are deterministic), fail with `ProviderMissing` when the
  picked entry has no non-empty `search_provider`, and return `SearchAttempt { search_provider, api_key, api_base,
  params }`. The key and base come from the picked tool only (`_resolve_search_provider_credentials`). `params` is
  built by walking the tool's `extra` map and then `call_params`, skipping the keys `search_provider`, `api_key` and
  `api_base` and any JSON null value; a later map wins over an earlier one for the same key, and the first position of
  a key is kept (insert into an IndexMap). So a caller's `timeout` replaces the tool's `timeout`, and a caller's
  `api_key` or `api_base` is dropped and never reaches the provider. The picked tool is logged at debug as
  "Selected search tool with provider: <provider>"; on any error the helper logs at error level
  "Error in SearchAPIRouter.async_search_with_fallbacks_helper for <name>: <error>" and returns the error unchanged.

  `run_search_with_fallbacks(...)` is async_search_with_fallbacks. Steps in order: read the name from the call
  parameters key `search_tool_name`, and only when that key is absent read `model` (a present key with a null value
  does not fall back to `model`); an empty or null name fails with `NameRequired`. Set `model` to the name. Call B310's
  Router._update_kwargs_before_fallbacks port with model = name and metadata key `litellm_metadata`, so the trace id
  and `model_group` metadata are set exactly as for other calls. Debug-log the name and the list of available tool
  names. Hand the attempt closure (which calls `select_attempt` and then the injected search function with
  `search_provider`, `api_key`, `api_base` and `params`) to the B310 fallback engine, and return what it returns.
  When anything in these steps fails, start a background task through the injected `SearchFailureAlert` trait with the
  call parameters, the error text and the error, then return the original error. The alert fires for `NameRequired`
  too, because LiteLLM's try block covers the whole function. Do not implement the alert: B114 owns
  send_llm_exception_alert, including its skip when the call carries `proxy_server_request`.

  Read B310's `fallback_attempts.rs` and B017's retry executor on main before coding, and call their public
  functions. Do not copy the traversal. If the engine needs a function no task owns, stop and say so in the report.

