dod:
  - text: matching returns every entry with an equal search_tool_name in list order and fails with NotFound carrying LiteLLM's text when none match.
    proof: [search-routing-selection, oracle, helper-python]
  - text: replace swaps the whole list, keeps only id, name, litellm_params and info, and a reader holding the old snapshot is not changed.
    proof: [search-routing-selection, oracle, helper-python]
  - text: select_attempt takes api_key and api_base from the picked tool only and drops a caller's api_key, api_base and search_provider.
    proof: [search-routing-params, oracle, helper-python]
  - text: Params merge tool extras then call parameters, skip JSON null, let the call parameter win and keep first-seen key order.
    proof: [search-routing-params, oracle, helper-python]
  - text: A picked tool without a search_provider (missing or empty) fails with ProviderMissing naming the tool.
    proof: [search-routing-params, oracle, helper-python]
  - text: The random pick is uniform over matching entries and uses the injected Rng.
    proof: [search-routing-selection]
  - text: run_search_with_fallbacks reads search_tool_name before model, fails with NameRequired on an empty or null name, and sets model to the name before the engine runs.
    proof: [search-routing-fallbacks]
  - text: Each engine attempt calls select_attempt again, so a retry can land on another tool with the same name, and the engine's result or error is returned unchanged.
    proof: [search-routing-fallbacks]
  - text: Any failure inside run_search_with_fallbacks starts one SearchFailureAlert call and still returns the original error.
    proof: [search-routing-fallbacks]
  - text: An entry's Debug output and every log line of this module never contain the api_key value.
    proof: [search-routing-secrets]
  - text: Helper adapters pass strict ruff and basedpyright and the helper cases replay.
    proof: [helper-python, oracle]
  - text: Mutants in the new router code are caught.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: search-routing-selection
      why: list replace, name matching or the random pick is missing or wrong
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^search_tool_routing::.*selection_/)'
    - id: search-routing-params
      why: credential source, protected keys, null filtering or merge order is missing or wrong
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^search_tool_routing::.*params_/)'
    - id: search-routing-fallbacks
      why: name lookup, engine hand-off, per-attempt reselection or the failure alert is missing or wrong
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^search_tool_routing::.*fallbacks_/)'
    - id: search-routing-secrets
      why: the api_key shows up in Debug output or logs
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^search_tool_routing::.*secrets_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3273)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3273 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3273/pyrightconfig.json

oracle_cases:
  - tools/oracle/cases/helpers/search-tool-routing/matching-tools.yaml
  - tools/oracle/cases/helpers/search-tool-routing/tool-not-found.yaml
  - tools/oracle/cases/helpers/search-tool-routing/replace-copies-four-fields.yaml
  - tools/oracle/cases/helpers/search-tool-routing/call-params-override-tool-params.yaml
  - tools/oracle/cases/helpers/search-tool-routing/caller-credentials-dropped.yaml
  - tools/oracle/cases/helpers/search-tool-routing/null-values-dropped.yaml
  - tools/oracle/cases/helpers/search-tool-routing/provider-missing.yaml

deviations:
  - what: The failure alert goes through an injected SearchFailureAlert trait and carries the error text, not a Python traceback string.
    why: Rust has no traceback string, and B114 owns the alert body and its proxy_server_request skip.
  - what: An empty search_provider string is treated as missing, like a null one.
    why: LiteLLM tests truthiness; the declared type is a provider name, and an empty name can never match a provider.
  - what: A tool whose litellm_params is null in the database row is read as an empty params map and then fails with ProviderMissing.
    why: LiteLLM raises an AttributeError (a 500) on None.get; no working setup relies on that.
  - what: Params are typed entries and an IndexMap, not Python dicts and a MappingProxyType.
    why: Typed records are the project rule; the observable key order and override rule are kept.

out_of_scope:
  - "The generic search function (asearch and search in litellm/search/main.py) that receives search_provider, api_key and api_base: B3272."
  - "The server-credential and api_base trust check that runs when api_key is None: B3270."
  - "Router._asearch_with_fallbacks and its helper, and the call_type dispatch around them: B016 and the router core tasks list them; here they are only the two forwards into this module."
  - "Router._update_kwargs_before_fallbacks, the retry executor and fallback traversal: B310 and B017."
  - "Per-target access and budget checks for fallback targets (_is_fallback_target_authorized and _is_fallback_target_within_budget): B310."
  - "send_llm_exception_alert: B114."
  - "Loading search tools from config and the database at startup and the periodic reload (_init_search_tools_in_db, reload_search_tools_from_db): proxy startup tasks and B3271."
  - "The router constructor argument search_tools and the Router.search_tools field: B016 owns Router state; the umbrella B091 wires SearchToolList into it."
  - "HTTP routes and their error mapping for ValueError from this module: B3274, B3275 and B091."

pitfalls:
  - "`kwargs.get('search_tool_name', kwargs.get('model'))` falls back to `model` only when the key is missing; `search_tool_name=None` is an error, not a fallback."
  - "`search_tool_name` stays in the forwarded kwargs and reaches the search function as a parameter unless its value is null."
  - "The tool's `api_key` can be None. It is passed on as None and the search function then reads the server key; a caller's `api_key` or `api_base` must never replace it."
  - "A caller's `timeout` or `max_retries` replaces the tool's value because call parameters are walked last."
  - "The list is replaced as a whole. Selection never sees a half-built list, and an attempt in flight keeps its snapshot."
  - "Every retry and every fallback hop calls the helper again, so the random pick is repeated and two attempts can use different tools with the same name."
  - "Search tools have no cooldown, rpm or tpm state; do not route them through the deployment health code."
  - "The alert is fire and forget. It must not delay or replace the original error."
  - "`litellm_metadata`, not `metadata`, is the metadata key for this call type."
  - "Log lines print the provider and tool name, never `api_key`; the key is a SecretString from the moment it is read."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
