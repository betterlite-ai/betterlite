  - tools/oracle/fuzz/corpus/route_probe/routing-component-oracle-*
  - tools/oracle/helpers/b301.py
  - tools/oracle/helpers/b301/**
  - tools/oracle/src/helpers/oracle/b301.rs
  - tools/oracle/src/helpers/oracle/b301/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/simple_shuffle.py#L17-L67
  why: A one-candidate seed avoids cross-language RNG differences.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/get_retry_from_policy.py#L32-L70
  why: An example of internal decisions future tasks need to observe.
dod:
- text: Write tests named routing_component_oracle_behaviors and routing_component_oracle_boundaries under routing_component_oracle::tests. The
    first asserts the listed successful and warning/fallback outcomes; the second asserts error fields,
    bounds, cancellation and the exact selection at boundaries. Use rstest cases for tables; corpus replay
    cannot satisfy either check.
  proof:
  - routing-component-oracle-behaviors
  - routing-component-oracle-boundaries
- text: Every listed oracle case exercises the production operation and asserts exact selected model/tier,
    provider requests, status, code and state changes; only /error/message may be ignored for betterlite
    wording. Every declared deviation asserts independent exact reference/Rust values through B361.
  proof:
  - oracle
- text: The task adapter invokes production logic and passes strict ruff/basedpyright without Any or broad
    suppressions.
  proof:
  - probe-python
  - oracle
- text: Add tools/oracle/fuzz/corpus/route_probe/routing-component-oracle-valid.json and tools/oracle/fuzz/corpus/route_probe/routing-component-oracle-invalid.json;
    the valid seed contains the new operation data. The cargo-fuzz target route_probe and normal replays_the_route_probe_corpus
    test call the production bounded parser. Both new files must be added relative to GATE_BASE.
  proof:
  - parser-corpus
  - routing-component-oracle-boundaries
- text: Every operation in the probe-stubs list has its ProbeOperation variant, a Rust stub module and a Python stub adapter, and routing_component_oracle_boundaries asserts that a stub answers not built on both sides.
  proof:
  - probe-stubs
  - routing-component-oracle-boundaries
- text: The oracle is the only new tool consumer of router and server; existing product consumer restrictions
    remain.
  proof:
  - probe-layering
  - deny
checks:
  optional: []
  commands:
  - id: routing-component-oracle-behaviors
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::routing_component_oracle_behaviors(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: routing-component-oracle-boundaries
    why: the task-specific behavior test is absent or fails
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::routing_component_oracle_boundaries(::|$)/)
      - test(/replays_the_.*_corpus/)'
  - id: probe-python
    why: the new adapter is missing, unchanged, untyped or fails lint
    run: test -f tools/oracle/litellm/probes/registry.py && test -n "$(git diff --name-only "$GATE_BASE"
      -- tools/oracle/litellm/probes/registry.py)" && uv run --locked --project tools/oracle/litellm ruff
      check tools/oracle/litellm/probes && uv run --locked --project tools/oracle/litellm basedpyright
      tools/oracle/litellm/probes
  - id: parser-corpus
    why: new task-specific parser seeds, operation/key or replay are missing
    run: test -f tools/oracle/fuzz/corpus/route_probe/routing-component-oracle-valid.json && test -f tools/oracle/fuzz/corpus/route_probe/routing-component-oracle-invalid.json
      && git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/route_probe | grep
      -Fq "/routing-component-oracle-" && test -f tools/oracle/fuzz/fuzz_targets/route_probe.rs && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(replays_the_route_probe_corpus)'
  - id: probe-layering
    why: the router tool exception is missing from dependency policy
    run: grep -qE 'crate = "betterlite-router", wrappers = \["betterlite-server", "betterlite-oracle"\]'
      deny.toml && grep -qE 'crate = "betterlite-server", wrappers = \["betterlite", "betterlite-oracle"\]'
      deny.toml
  - id: probe-stubs
    why: a planned probe operation has no variant, Rust stub or Python stub, so its task would have to edit mod.rs or registry.py
    run: |-
      while read -r variant module; do
        test -f "tools/oracle/src/router_probes/$module.rs" && test -f "tools/oracle/litellm/probes/$module.py" && grep -qw "$variant" tools/oracle/src/router_probes/mod.rs && grep -qw "$module" tools/oracle/litellm/probes/registry.py || { echo "probe $variant ($module) is not registered"; exit 1; }
