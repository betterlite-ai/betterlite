id: B301
title: Component probes for deterministic routing oracle cases
description: Add a tagged component case to B300's harness so internal routing decisions can be compared
  without a production debug endpoint. A case identifies a closed probe operation, bounded typed input,
  and the existing comparison rules. Run a Python adapter in tools/oracle/litellm/probes with uv run --locked
  against litellm 1.105.1 and a Rust adapter in tools/oracle/src/router_probes against the public betterlite-router
  library. The adapters receive the same JSON input and return typed observations through stdout; logs
  go to stderr. The Rust adapter runs as a tools/oracle binary named betterlite-router-probe, built by
  the oracle on demand with a bounded build timeout. Keep the gate's existing CLI, so component YAML files
  can be listed in oracle_cases. Start with a single-candidate simple-shuffle probe; later tasks add only
  their named operation, adapter and cases. Provide injected clocks and scripted random decisions at the
  adapter boundary, without reimplementing either algorithm. Add strict ruff and basedpyright dependencies/configuration
  to the oracle uv project, validate boundary values with typed models, and fuzz the new case/IPC parser.
  Permit betterlite-oracle as a test-tool consumer of betterlite-router in deny.toml, retaining the server
  as its only product consumer. Budget 800 lines for this protocol and seed adapter, not all future routing
  operations.
scope:
  paths:
  - tools/oracle/**
  - Cargo.toml
  - deny.toml
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/simple_shuffle.py#L17-L67
  why: A one-candidate seed avoids cross-language RNG differences.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/get_retry_from_policy.py#L32-L70
  why: An example of internal decisions future tasks need to observe.
dod:
- text: The seed component case passes and a corrupted Rust result fails with the first differing pointer;
    unknown operations, malformed replies and child timeouts fail closed.
  proof:
  - probe-tests
  - oracle
- text: Python adapters pass strict lint and type checks without Any or blanket suppressions.
  proof:
  - probe-python
- text: The new case and IPC parser have a cargo-fuzz target and corpus replay.
  proof:
  - probe-corpus
- text: Only betterlite-server and the oracle tooling consume betterlite-router.
  proof:
  - deny
  - probe-layering
checks:
  optional:
  - mutants
  commands:
  - id: probe-tests
    why: component comparison or child lifecycle tests fail or are absent
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(probe)'
  - id: probe-python
    why: the oracle probe adapters fail strict Python checks
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
  - id: probe-corpus
    why: probe parser fuzzing or corpus replay is missing or fails
    run: test -f tools/oracle/fuzz/fuzz_targets/router_probe.rs && test -n "$(ls -A tools/oracle/fuzz/corpus/router_probe)"
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_router_probe_corpus)'
  - id: probe-layering
    why: the router tool exception is missing from dependency policy
    run: grep -qE 'crate = "betterlite-router", wrappers = \["betterlite-server", "betterlite-oracle"\]'
      deny.toml
oracle_cases:
- tools/oracle/cases/routing/probes/single-candidate.yaml
deviations: []
out_of_scope:
- A general eval language, dynamic import paths supplied by case files, or arbitrary commands in cases.
- Copying Python algorithms into adapters or installing the enterprise package.
pitfalls:
- Python imports the pinned installed package; the read-only checkout supplies references, never modified
  source.
- Fail on an empty selected case set rather than passing silently.
- Later task adapters must call production functions, not independently calculate expected outcomes.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 1
