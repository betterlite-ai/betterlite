  - tools/oracle/src/runner/**
  - tools/oracle/src/compare.rs
  - tools/oracle/src/compare/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/bin/betterlite-router-probe.rs
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/src/router_probes/*.rs
  - tools/oracle/litellm/pyproject.toml
  - tools/oracle/litellm/uv.lock
  - tools/oracle/litellm/probes/registry.py
  - tools/oracle/litellm/probes/protocol.py
  - tools/oracle/litellm/probes/*.py
  - tools/oracle/litellm/probes/tests/**
  - tools/oracle/cases/routing/probes/**
  - Cargo.toml
