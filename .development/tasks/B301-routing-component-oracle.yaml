id: B301
title: Component probes for deterministic routing oracle cases
description: 'Register tagged component cases in the existing B001 oracle CLI using B392 IPC and child
  lifecycle. Define a closed ProbeOperation enum in tools/oracle/src/router_probes/mod.rs and Python operation
  dispatch in tools/oracle/litellm/probes/registry.py, and register every operation that the probe-stubs check lists up front, each with its variant, a stub tools/oracle/src/router_probes/<module>.rs and a stub tools/oracle/litellm/probes/<module>.py that answer not built on both sides, so a later task replaces only its own two files and never edits mod.rs or registry.py. The stubs and their registry lines sit outside the line budget below.
  Start with SingleCandidate invoking production simple-shuffle on both sides. Build betterlite-router-probe
  with a 300-second deadline and run probes with a 30-second deadline. Permit betterlite-oracle as the
  test-tool consumer of betterlite-router and betterlite-server in deny.toml, preserving their existing
  product consumers. Component adapters call production functions; management adapters call server services
  with injected repositories. Implement the owned native service in tools/oracle/src/routing_component_oracle.rs
  (oracle tooling). Budget allocation: at most 360 implementation lines, 220 behavior-test lines, 140
  Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total); fixture/corpus files use
  only the existing checks.yaml exclusions. Reuse predecessor services instead of copying their algorithms.'
