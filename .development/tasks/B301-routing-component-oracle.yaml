oracle_cases:
- tools/oracle/cases/routing/probes/single-candidate.yaml
deviations: []
out_of_scope:
- A general eval language, dynamic import paths supplied by case files, or arbitrary commands in cases.
- Copying Python algorithms into adapters or installing the enterprise package.
- B392 owns typed routing probe ipc and child lifecycle; consume its tested public interface.
pitfalls:
- Python imports the pinned installed package; the read-only checkout supplies references, never modified
  source.
- Fail on an empty selected case set rather than passing silently.
- Later task adapters must call production functions, not independently calculate expected outcomes.
- Warnings preserve the pinned fallback path; an unavailable optional observation must not silently become
  a hard request error.
- The 800-line budget includes Rust/Python adapters, behavior tests and fuzz targets, but not the probe stubs and their registry lines; split source modules
  at the repository 300-line limit.
review_level: standard
budget:
  max_changed_lines: 2600
  max_new_expects: 1
