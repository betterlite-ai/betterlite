id: B4572
title: Configure, reconfigure and disconnect agent commands
description: >-
  Build the configure, reconfigure and unconfigure command groups and their subcommands for each agent target.
  Merge explicit flags with saved profiles using this precedence: explicit flags override group flags, which override saved connection settings, which override the stored gateway URL from login.
  Group invocation without a subcommand applies saved setup to both agents, opens the setup wizard for first-time configuration, opens an edit dialog for reconfiguration, and prompts for a gateway URL if none was explicitly supplied.
  Subcommands apply settings to one agent; configure accepts --model to skip the wizard, reconfigure uses current choices as defaults, and both commands honor saved profiles so reruns are idempotent.
  Reconfigure without --model or --default-model always opens the interactive edit dialog; only configure with an existing saved profile reapplies it non-interactively without prompting.
  Unconfigure removes each agent's settings. The --forget flag belongs only to unconfigure_group and the unconfigure_claude and unconfigure_codex subcommands; configure and reconfigure commands have no --forget option.
  Interactive flows require a terminal; non-interactive paths accept explicit --model and credentials.
  Missing-receipt messaging distinguishes cases where unconfigure has nothing to undo from cases where settings were modified after configuration.
  On unconfigure, withheld credentials are reported per-item with their captured endpoint if the gateway URL changed since issuance; other settings are kept or restored depending on ownership.
