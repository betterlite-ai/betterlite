dod:
  - text: "Group commands without subcommand apply saved setup or open the wizard for first-time setup."
    proof: [group-invocation-test]
  - text: "Reconfigure without --model or --default-model opens the interactive edit dialog using current choices as defaults."
    proof: [reconfigure-edit-test]
  - text: "Option resolution merges explicit flags, group flags and saved settings in the correct order."
    proof: [option-precedence-test]
  - text: "Terminal is required for interactive mode; non-interactive paths accept explicit --model and flags."
    proof: [terminal-requirement-test]
  - text: "Unconfigure with no receipt reports the correct message and offers manual cleanup guidance."
    proof: [missing-receipt-test]
  - text: "--forget flag belongs only to unconfigure commands and deletes saved profiles only when requested."
    proof: [forget-behavior-test]
  - text: "Withheld credentials are reported with their captured endpoint and guidance for recovery."
    proof: [withheld-credentials-test]
checks:
  optional: []
  commands:
    - id: group-invocation-test
      why: "group-command invocation tests missing or failing"
      run: >-
        cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E
        'test(/^configure::(apply_saved_setup|group_invocation).*($|::)/)'
    - id: reconfigure-edit-test
      why: "reconfigure edit-mode behavior tests missing or failing"
      run: >-
        cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E
        'test(/^configure::(reconfigure|edit_mode|edit_dialog).*($|::)/)'
    - id: option-precedence-test
      why: "option-precedence merging tests missing or failing"
      run: >-
        cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E
        'test(/^configure::(option_precedence|option_merge|flag_precedence).*($|::)/)'
    - id: terminal-requirement-test
      why: "terminal-requirement validation tests missing or failing"
      run: >-
        cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E
        'test(/^configure::(terminal_requirement|require_terminal|interactive).*($|::)/)'
    - id: missing-receipt-test
      why: "missing-receipt messaging tests missing or failing"
      run: >-
        cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E
        'test(/^configure::(missing_receipt|unconfigure_no_receipt).*($|::)/)'
    - id: forget-behavior-test
      why: "--forget behavior and unconfigure-only availability tests missing or failing"
      run: >-
        cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E
        'test(/^configure::(forget|forget_flag|forget_behavior).*($|::)/)'
    - id: withheld-credentials-test
      why: "withheld-credential reporting tests missing or failing"
      run: >-
        cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E
        'test(/^configure::(withheld|withheld_credentials|endpoint_mismatch).*($|::)/)'
oracle_cases: []
deviations:
  - what: "Non-interactive error message text differs to reflect betterlite CLI conventions."
    why: "The source message references `lite` as a command and includes example flags specific to LiteLLM's Python CLI."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/configure.py#L73-L76"
  - what: "Saved profiles are stored in native config paths specific to betterlite, not LiteLLM's directory structure."
    why: "betterlite uses its own credential and settings management (B4570, B4562, B4569)."
out_of_scope:
  - "The re-exported `interactive_configure` function, which belongs to B4571."
pitfalls:
  - "Group command invocation without a subcommand requires checking ctx.invoked_subcommand; the same flags apply to both the group and subcommands, so option merging must handle both paths."
  - "Reconfigure's edit_mode flag changes wizard behavior and error messages; edit_connection must also be True for full setting replacement."
  - "Disconnect logic checks three different receipt/state sources (state_path exists, settings_path exists, profile exists); the messaging order matters for clarity."
  - "Withheld credentials are reported per-item with their captured endpoint; the recovery guidance must instruct the user to restore the exact same endpoint for rotation."
  - "The `forget` flag propagates from parent context (unconfigure group) to subcommands; nested option merging prevents duplication."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
