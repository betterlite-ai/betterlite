id: B532
title: Azure chat parameters and message conversion
description: >-
  Compose Azure GPT-5 and o-series parameter extensions over B684 base chat policy and B502 OpenAI reasoning capability
  helpers. Preserve catalog-normalized aliases, reasoning parameter translation, and o-series native/fake-stream
  selection; base Azure message/parameter sanitation remains B684.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/chat/gpt_5_transformation.py:
  AzureOpenAIGPT5Config._model_map_lookup_name L23-L35; AzureOpenAIGPT5Config.get_supported_openai_params L41-L68;
  AzureOpenAIGPT5Config.map_openai_params L70-L122; AzureOpenAIGPT5Config.transform_request L124-L139. litellm/llms/azure/chat/o_series_transformation.py:
  AzureOpenAIO1Config.get_supported_openai_params L27-L43; AzureOpenAIO1Config._get_o_series_only_params L45-L68;
  AzureOpenAIO1Config.should_fake_stream L70-L98; AzureOpenAIO1Config.transform_request L103-L116.


  Reuse OpenAIGPT5Config.get_supported_openai_params from B502 (litellm/llms/openai/chat/gpt_5_transformation.py);
  its implementation remains with that prerequisite.


  Reuse OpenAIGPT5Config.map_openai_params from B502 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation
  remains with that prerequisite.


  Reuse _get_effort_level from B502 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation remains
  with that prerequisite.


  Reuse is_gpt_reasoning_series_name from B668 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation
  remains with that prerequisite.


  Named case contracts: gpt5_alias_catalog: Normalize a leading gpt5_series/ to azure/, retain a leading azure/,
  otherwise prepend azure/; apply this one resolver to supports/default/disabled-effort catalog checks. GPT family
  detection also accepts any gpt5_series substring and B668 gpt-5/gpt-6 markers. o3_native_stream: Fake streaming
  is false unless stream is the literal True; any model containing o3 is native before catalog lookup. Otherwise
  B205 supports_native_streaming=True disables fake streaming; missing model, false capability or lookup failure
  yields fake streaming, logging lookup failures at debug level. o_series_base_policy_composition: Start with B668
  OpenAIGPTConfig supported params, add reasoning_effort for unknown catalog models or known supports_reasoning
  models, then remove logprobs, top_p, presence_penalty, frequency_penalty and top_logprobs. Detect o1/o3/o4/o_series/
  by substring. azure_gpt5_allowlist: Start with B502 GPT allowlist, always add tool_choice if absent. Remove logprobs/top_logprobs
  for none-capable models that fail the gpt-5.2+ predicate; gpt-5.2+ appends both even if already present. azure_effort_none_drop:
  Get effective reasoning_effort from truthy non_default_params then optional_params via B502 _get_effort_level.
  When none is unsupported, literal-True litellm.drop_params or per-call drop_params copies both maps and removes
  none entries; otherwise raise UnsupportedParamsError 400 with the Azure unsupported-none diagnostic, supported
  low/medium/high, litellm.drop_params=True advice and issue 16704. After B502 mapping remove any unsupported none
  result again. azure_reasoning_route_strip: Both transforms remove every occurrence of their routing marker (gpt5_series/
  or o_series/), not only a prefix. O-series overlays B206 sanitized_tools_update on options before B684 transform;
  GPT delegates to B684 with the stripped model. Keep the tools plus reasoning_effort combination for the external
  Responses bridge.


  Public supports_* capability predicates called by this slice are owned by B2221, including native-streaming/schema
  special defaults; reuse the named lower implementation rather than B157 or a copied catalog heuristic.


  The direct get_model_info call is owned by B2225; its full lookup/failure behavior is part of this dependency,
  not the SDK facade.


  Use B668 Azure GPT-5 route predicate; only the Azure metadata-name normalization and parameter/request overrides
  remain here.


  Implement crates/betterlite-azure/src/chat_params.rs with adjacent tests under chat_params/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_chat_params in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_params_cases in betterlite-azure with these exact named cases (one per oracle file):
  gpt5_alias_catalog, o3_native_stream, unknown_o1_fake_stream, gpt5_base_policy_composition, o_series_base_policy_composition,
  azure_gpt5_allowlist, azure_effort_none_drop, azure_reasoning_route_strip. Each case exercises its named outcome
  independently; use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_chat_params* using HelperCase: kind: helper
  and the externally tagged azure_chat_params variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_chat_params that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 153 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 215 production lines, 225 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 575 planned, 575 maximum changed lines.
