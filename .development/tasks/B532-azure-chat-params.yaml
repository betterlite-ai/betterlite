    why: Normalize a leading gpt5_series/ to azure/, retain a leading azure/, otherwise prepend azure/; apply this
      one resolver to supports/default/disabled-effort catalog checks. GPT family detection also accepts any gpt5_series
      substring and B668 gpt-5/gpt-6 markers.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_params_cases::case_[0-9]+_gpt5_alias_catalog$/)'
  - id: case-o3-native-stream
    why: Fake streaming is false unless stream is the literal True; any model containing o3 is native before catalog
