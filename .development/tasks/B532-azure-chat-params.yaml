- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
- >-
  litellm/llms/azure/chat/gpt_transformation.py: sanitized_tools_update L43-L53; AzureOpenAIConfig.__init__ L83-L99;
  AzureOpenAIConfig.get_config L102-L103; AzureOpenAIConfig.get_supported_openai_params L105-L137; AzureOpenAIConfig.requires_max_completion_tokens
  L140-L147; AzureOpenAIConfig._is_response_format_supported_model L149-L166; AzureOpenAIConfig._is_response_format_supported_api_version
  L168-L186; AzureOpenAIConfig.map_openai_params L188-L269; AzureOpenAIConfig.transform_request L271-L294; AzureOpenAIConfig.transform_response
  L296-L312; AzureOpenAIConfig.get_mapped_special_auth_params L314-L315; AzureOpenAIConfig.map_special_auth_params
  L317-L321; AzureOpenAIConfig.get_eu_regions L323-L327; AzureOpenAIConfig.get_us_regions L329-L344; AzureOpenAIConfig.get_error_class
  L346-L347; AzureOpenAIConfig.validate_environment L349-L361 belong to B684; reuse that implementation or its injected
  typed boundary.
pitfalls:
- Azure aliases gpt5_series and o_series need catalog lookup names before applying the family policy.
