id: B532
title: Azure chat parameters and message conversion
description: >-
  Compose Azure GPT-5 and o-series parameter extensions over B684 base chat policy and B502 OpenAI reasoning capability
  helpers. Preserve catalog-normalized aliases, reasoning parameter translation, and o-series native/fake-stream
  selection; base Azure message/parameter sanitation remains B684.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/chat/gpt_5_transformation.py:
  AzureOpenAIGPT5Config._model_map_lookup_name L23-L35; AzureOpenAIGPT5Config.is_model_gpt_5_model L38-L39; AzureOpenAIGPT5Config.get_supported_openai_params
  L41-L68; AzureOpenAIGPT5Config.map_openai_params L70-L122; AzureOpenAIGPT5Config.transform_request L124-L139.
  litellm/llms/azure/chat/o_series_transformation.py: AzureOpenAIO1Config.get_supported_openai_params L27-L43; AzureOpenAIO1Config._get_o_series_only_params
  L45-L68; AzureOpenAIO1Config.should_fake_stream L70-L98; AzureOpenAIO1Config.is_o_series_model L100-L101; AzureOpenAIO1Config.transform_request
  L103-L116.


  Reuse OpenAIGPT5Config.get_supported_openai_params from B502 (litellm/llms/openai/chat/gpt_5_transformation.py);
  its implementation remains with that prerequisite.


  Reuse OpenAIGPT5Config.map_openai_params from B502 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation
  remains with that prerequisite.


  Reuse _get_effort_level from B502 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation remains
  with that prerequisite.


  Reuse is_gpt_reasoning_series_name from B502 (litellm/llms/openai/chat/gpt_5_transformation.py); its implementation
  remains with that prerequisite.


  Implement crates/betterlite-azure/src/chat_params.rs with adjacent tests under chat_params/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_chat_params in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_params_cases in betterlite-azure with these exact named cases (one per oracle file):
  gpt5_alias_catalog, o3_native_stream, unknown_o1_fake_stream, gpt5_base_policy_composition, o_series_base_policy_composition.
  Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP
  cases use the booted proxy and assert both client response and captured upstream request. Existing API tasks retain
  route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_chat_params* using HelperCase: kind: helper
  and the externally tagged azure_chat_params variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_chat_params that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 157 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 185 production lines, 90 behavior/config-test lines,
  75 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 375 planned, 400 maximum changed lines.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/lib.rs
  - crates/betterlite-azure/src/error.rs
  - crates/betterlite-azure/src/chat_params.rs
  - crates/betterlite-azure/src/chat_params/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/azure_chat_params.rs
  - tools/oracle/src/helpers/azure_chat_params/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/azure_chat_params.py
  - tools/oracle/cases/helpers/providers/azure-chat-params/**
  - tools/oracle/fuzz/corpus/helper_case/azure_chat_params*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/chat/gpt_5_transformation.py#L23-L139
  why: >-
    Own AzureOpenAIGPT5Config._model_map_lookup_name, AzureOpenAIGPT5Config.is_model_gpt_5_model, AzureOpenAIGPT5Config.get_supported_openai_params,
    AzureOpenAIGPT5Config.map_openai_params, AzureOpenAIGPT5Config.transform_request. Other functions in this file
    remain with the owners listed below.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/chat/o_series_transformation.py#L27-L116
  why: >-
    Own AzureOpenAIO1Config.get_supported_openai_params, AzureOpenAIO1Config._get_o_series_only_params, AzureOpenAIO1Config.should_fake_stream,
    AzureOpenAIO1Config.is_o_series_model, AzureOpenAIO1Config.transform_request. Other functions in this file remain
    with the owners listed below.
dod:
- text: 'gpt5 alias catalog: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-params/gpt5-alias-catalog.yaml.'
  proof:
  - case-gpt5-alias-catalog
  - oracle
  - helper-python
- text: 'o3 native stream: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-params/o3-native-stream.yaml.'
  proof:
  - case-o3-native-stream
  - oracle
  - helper-python
- text: 'unknown o1 fake stream: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-params/unknown-o1-fake-stream.yaml.'
  proof:
  - case-unknown-o1-fake-stream
  - oracle
  - helper-python
- text: >-
    gpt5 base policy composition: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-params/gpt5-base-policy-composition.yaml.
  proof:
  - case-gpt5-base-policy-composition
  - oracle
  - helper-python
- text: >-
    o series base policy composition: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-params/o-series-base-policy-composition.yaml.
  proof:
  - case-o-series-base-policy-composition
  - oracle
  - helper-python
- text: New azure_chat_params seeds parse as the intended call variant and replay through the shared production
    parser.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: case-gpt5-alias-catalog
    why: The gpt5-alias-catalog behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_params_cases::case_[0-9]+_gpt5_alias_catalog$/)'
  - id: case-o3-native-stream
    why: The o3-native-stream behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_params_cases::case_[0-9]+_o3_native_stream$/)'
  - id: case-unknown-o1-fake-stream
    why: The unknown-o1-fake-stream behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_params_cases::case_[0-9]+_unknown_o1_fake_stream$/)'
  - id: case-gpt5-base-policy-composition
    why: The gpt5-base-policy-composition behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_params_cases::case_[0-9]+_gpt5_base_policy_composition$/)'
  - id: case-o-series-base-policy-composition
    why: The o-series-base-policy-composition behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_params_cases::case_[0-9]+_o_series_base_policy_composition$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_chat_params.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_chat_params*")"
      && grep -lq 'azure_chat_params' tools/oracle/fuzz/corpus/helper_case/azure_chat_params* && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_chat_params$/)' && cargo
      nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
