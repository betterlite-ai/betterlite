id: B253
title: Standard logging metadata and payload privacy inputs
description: >-
  Implement StandardLoggingPayloadSetup merge_litellm_metadata/get_standard_logging_metadata, get_additional_headers/get_hidden_params/strip_trailing_slash,
  get_error_information/get_error_information_for_logging_payload, get_response_time/trace_id/session_id and request-tag
  helpers. Own public get_standard_logging_metadata/scrub_sensitive_keys_in_metadata and logging_utils bounded base64
  truncation. Inject synthetic auth/deployment metadata rather than looking up storage. Pricing and cold-storage
  key construction remain B068/B115. B190 owns standard payload redaction after assembly. Budget 280 logic/types,
  120 Rust/Python adapters, 300 tests and 60 wiring (760 total). Write the behavior rstest functions logging_metadata_behavior_tests_behavior
  in adjacent tests.rs files, with a named case for each behavior and failure in the DoD; corpus replay tests have
  separate names. The helper operation logging_metadata is already registered;
  each operation has its own Rust and Python adapter file and corpus seed. Also own provider request-ID extraction
  297-317, router model-ID projection 871-886/903-908, response header/hidden-metadata projection 2361-2393, trace-ID
  extraction 3965-3981 and hash-shape check 5599-5601.
