    why: should_use_mock reads the env var with str_to_bool and logs the enabled line.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/initialize_dynamic_callback_params.py#L64-L77
    why: The environment pattern B188 already implements; this task calls it, it does not copy it.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/secret_managers/main.py#L115-L136
    why: str_to_bool accepts only "true" and "false" after strip and lower.
dod:
  - text: >-
      The langfuse_settings config section loads LANGFUSE_SECRET_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_HOST,
      LANGFUSE_BASE_URL, LANGFUSE_DEBUG, LANGFUSE_FLUSH_INTERVAL, LANGFUSE_FLUSH_AT, LANGFUSE_TIMEOUT,
      LANGFUSE_MAX_RETRIES, LANGFUSE_RELEASE, the ten CI commit variables, LANGFUSE_SAMPLE_RATE,
      LANGFUSE_PROMPT_CACHE_DEFAULT_TTL_SECONDS, LANGFUSE_TRACING_ENVIRONMENT, LANGFUSE_MOCK and
      UPSTREAM_LANGFUSE_SECRET_KEY from the lookup, never fails the load on a bad value, and hides the secret key in Debug output.
    proof: [settings-section-tests]
  - text: >-
      Credentials use the argument first and the env var second, skip the env var when allow_env_credentials is
      false and a host was given, and treat an empty argument as absent while keeping an empty env value.
    proof: [settings-resolution-tests, oracle, helper-python]
  - text: >-
      The host is the first non-empty of the argument, LANGFUSE_HOST, LANGFUSE_BASE_URL and the cloud default,
      with "http://" put in front when no scheme is there.
    proof: [settings-resolution-tests, oracle, helper-python]
  - text: >-
      The deployment environment trims an explicit value and rejects an invalid one with B188's error, falls to
      LANGFUSE_TRACING_ENVIRONMENT when the explicit value is empty, and answers "default" with a warning when
      that variable is invalid.
    proof: [settings-resolution-tests, oracle, helper-python]
  - text: >-
      The flush interval, flush-at, sample rate and max retries readers return LiteLLM's defaults (the caller's
      value, 512, 1.0, 3), apply the stated ranges and the 1000 retry cap, and warn with LiteLLM's wording.
    proof: [settings-resolution-tests, oracle, helper-python]
  - text: >-
      The timeout reader returns 20.0 when unset, parses a float, and fails on a value that is not a number
      instead of falling back.
    proof: [settings-resolution-tests, oracle, helper-python]
  - text: >-
      The prompt-cache TTL check fails on a non-integer naming the variable, and the TTL reader gives 60.0 when
      unset or below 0 and the whole number of seconds otherwise.
    proof: [settings-resolution-tests, oracle, helper-python]
  - text: >-
      The release reader prefers a non-empty LANGFUSE_RELEASE, then walks the ten CI variables in LiteLLM's
      order and takes the first one that is set, even when empty.
    proof: [settings-resolution-tests, oracle, helper-python]
  - text: >-
      The debug flag is true only for "true" or "1" after trim and lowercase, the mock flag follows str_to_bool
      with the info line when enabled, and the upstream warning fires only when UPSTREAM_LANGFUSE_SECRET_KEY is set.
    proof: [settings-resolution-tests, oracle, helper-python]
checks:
  optional: [mutants]
  commands:
    - id: settings-section-tests
      why: the config section tests fail or the filter selects no tests
      run: INSTA_UPDATE=no cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::langfuse_settings::/)'
    - id: settings-resolution-tests
      why: the resolution tests in betterlite-logging fail or the filter selects no tests
      run: INSTA_UPDATE=no cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/::langfuse_settings_tests_behavior($|::)/)'
    - id: helper-python
      why: the oracle adapter fails strict Python checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3900)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3900 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3900/pyrightconfig.json
oracle_cases:
  - tools/oracle/cases/helpers/langfuse-settings/credentials-precedence.yaml
  - tools/oracle/cases/helpers/langfuse-settings/credentials-env-blocked.yaml
  - tools/oracle/cases/helpers/langfuse-settings/host-fallbacks.yaml
  - tools/oracle/cases/helpers/langfuse-settings/host-scheme.yaml
