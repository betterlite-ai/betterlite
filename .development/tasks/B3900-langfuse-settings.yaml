  - tools/oracle/cases/helpers/langfuse-settings/release-resolution.yaml
  - tools/oracle/cases/helpers/langfuse-settings/debug-and-mock.yaml
deviations:
  - what: >-
      The installed-SDK version check (installed_langfuse_version, raise_if_unsupported_langfuse_version, the
      "langfuse>=4.7,<5" ImportError) is not built. betterlite links no Langfuse package.
    why: The check guards a Python import that does not exist here. The OTLP traces route still needs a Langfuse server on 3.63.0 or newer, which is B3902's error hint.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse.py#L175-L206
  - what: >-
      The messages for an unusable LANGFUSE_PROMPT_CACHE_DEFAULT_TTL_SECONDS and a non-numeric LANGFUSE_TIMEOUT
      carry no ANSI red escape codes, and the value is quoted with single quotes the way Python's repr does for a plain string.
    why: The escape codes only colour a terminal and corrupt structured logs; the variable name and the value stay.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse.py#L216-L222
  - what: >-
      An invalid LANGFUSE_TRACING_ENVIRONMENT warns on every resolution. LiteLLM warns once per distinct
      (value, error) pair through an lru_cache of 8.
    why: The cache is module-level state, which rules.yaml forbids. A logger is built once per credential set and at most MAX_LANGFUSE_INITIALIZED_CLIENTS (50) are allowed, so the repeats are bounded.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse.py#L276-L283
  - what: >-
      LANGFUSE_MOCK only sets a flag the logger reads. The httpx monkey-patching mock client
      (create_mock_langfuse_client, url matchers ".langfuse.com", 100 ms latency, {"status": "success"} body)
      is not built.
    why: B191 replaces the Python mock factories with injected transport fixtures in each exporter's tests, and the mock-mode exporter that drops spans is B3902's.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/langfuse/langfuse_mock_client.py#L22-L45
out_of_scope:
  - "Version and TTL checks are called, credentials are resolved and the project id is exported by the LangFuseLogger constructor and safe_init_langfuse_client; B3907 owns them, and B3908 owns the same calls in the prompt-management logger."
  - "validate_langfuse_environment_value and the langfuse_environment callback param check; B188 owns them, this task calls validate_environment."
  - "LangfuseLoggingConfig and LangfuseLoggedEvent from types/integrations/langfuse.py belong to B3907, LangfuseUsageDetails to B3906."
  - "MAX_LANGFUSE_INITIALIZED_CLIENTS and the litellm.initialized_langfuse_clients counter; B3907."
  - "resolve_langfuse_host is also called by the Slack alert trace link (integrations/SlackAlerting/utils.py); the alerting task owns that caller and uses this task's resolve_host."
  - "Observation ids, attributes and the sampler are B3901; the OTLP exporter, LANGFUSE_OTEL_TRACES_EXPORT_PATH, the auth and SDK headers, DiscardingSpanExporter and the 413 splitting are B3902; channel keys, leases, flush, OTEL_SDK_DISABLED and enable_langfuse_debug_logging are B3903; LangfuseApiClient, auth_check and prompt fetching are B3904."
  - "Everything else in langfuse.py (content projections, generation assembly, masking, tags, guardrail spans, header metadata) is owned by B3905, B3906, B3907 and B3912."
  - "LANGFUSE_OTEL_* and the langfuse_otel callback settings; B3909 and B3910."
pitfalls:
  - "Do not parse the numeric variables in the config section. A bad LANGFUSE_TIMEOUT must fail only when a logger asks for it, so the section keeps the raw text and betterlite-logging parses it."
  - "resolve_credentials skips the env only when allow_env_credentials is false AND a host was passed. With allow_env_credentials false and no host, the env is still read."
  - "The secret and public key chains use `or`, so an explicit empty string falls through to the env var, but an empty LANGFUSE_SECRET_KEY then comes back as the empty string and not None."
  - "A host without a scheme gets http:// in front, so LANGFUSE_HOST=langfuse.internal:3000 becomes http://langfuse.internal:3000; do not default to https."
  - "LANGFUSE_HOST wins over LANGFUSE_BASE_URL, and an empty LANGFUSE_HOST falls through to LANGFUSE_BASE_URL."
  - "LANGFUSE_TRACING_ENVIRONMENT that is only spaces is not empty, so it is trimmed to nothing, fails the pattern and gives \"default\" with a warning. Only a truly empty variable gives None."
  - "LANGFUSE_FLUSH_INTERVAL and LANGFUSE_FLUSH_AT accept digits only after trim, so \"-5\", \"1.5\" and \"0\" all fall back; flush-at also falls back above 100000."
  - "A missing LANGFUSE_MAX_RETRIES is silent, an empty one is not a number and warns; 1001 warns and is capped, not reset to 3."
  - "release() checks `name in os.environ` for the CI variables, so an empty GITHUB_SHA is returned as the empty string and stops the search; LANGFUSE_RELEASE itself needs to be non-empty."
  - "LANGFUSE_SAMPLE_RATE of 0.0 and 1.0 are both valid; \"nan\", \"inf\" and \"1.5\" warn and give 1.0."
  - "LANGFUSE_PROMPT_CACHE_DEFAULT_TTL_SECONDS of 0 is valid and disables caching; -1 warns and gives 60.0 even though it is a whole number."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
