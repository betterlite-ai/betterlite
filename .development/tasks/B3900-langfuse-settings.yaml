id: B3900
title: Langfuse settings and credential resolution
description: >-
  Build everything the Langfuse callback reads from its environment before it builds a logger: the
  LANGFUSE_* settings, the credential, host and environment fallbacks, and the checks LiteLLM runs on them.
  Two parts. First, a config section `langfuse_settings` in betterlite-config
  (crates/betterlite-config/src/sections/langfuse_settings.rs) that reads the environment through
  B002's EnvironmentLookup and keeps every value as the raw text it found, so a bad value fails where
  LiteLLM fails it (at logger construction) and not when the gateway starts. The secret key is a SecretString.
  Second, the module `langfuse_settings` in betterlite-logging that turns those raw values into typed answers.
  It takes the section's settings by reference and never reads the environment itself (rules.yaml forbids it).

  The functions in betterlite-logging, each with LiteLLM's rule. `resolve_credentials(public_key, secret,
  secret_key, host, allow_env_credentials)`: when allow_env_credentials is false AND host is not None, the
  secret is `secret or secret_key` and the public key is the argument, with no env lookup. In every other case
  the secret is `secret or secret_key or LANGFUSE_SECRET_KEY` and the public key is `public_key or
  LANGFUSE_PUBLIC_KEY`. An empty string counts as absent in the `or` chains, but an env value that is an empty
  string is still returned as the empty string. `resolve_host(host)`: the first non-empty of the argument,
  LANGFUSE_HOST, LANGFUSE_BASE_URL, else "https://cloud.langfuse.com"; a result that does not start with
  "http://" or "https://" gets "http://" put in front of it (http, not https). `resolve_environment(explicit)`:
  an explicit value is trimmed and, if not empty, checked with B188's `validate_environment`
  (logging_privacy::callbacks), which fails with its error; an empty or missing explicit value falls to
  LANGFUSE_TRACING_ENVIRONMENT, where an empty variable gives None, a valid trimmed value is returned, and an
  invalid one logs a warning ("Ignoring invalid LANGFUSE_TRACING_ENVIRONMENT=... for the langfuse callback: ...
  Traces will be sent to Langfuse's default environment.") and returns "default". `flush_interval(default)`:
  LANGFUSE_FLUSH_INTERVAL when it is a trimmed all-digit number above 0, else the default (a missing or empty
  variable silently, anything else with a warning). `debug()`: LANGFUSE_DEBUG trimmed and lowercased is "true" or
  "1". `mock_mode()`: LANGFUSE_MOCK (default "false") parsed the way str_to_bool does, only "true" or "false"
  after trim and lowercase, anything else is false; log the info line "LANGFUSE Mock Mode: ENABLED - API calls
  will be mocked" when it is true. `warn_if_upstream_configured()`: when UPSTREAM_LANGFUSE_SECRET_KEY is set,
  warn that UPSTREAM_LANGFUSE_* is no longer supported and its values are ignored.

  The export knobs that LiteLLM reads in langfuse_sdk.py. `sample_rate()`: LANGFUSE_SAMPLE_RATE as a number
  from 0.0 to 1.0, else 1.0 (a bad value warns). `timeout_seconds()`: LANGFUSE_TIMEOUT as a float, 20.0 when unset;
  a value that is not a number is an error, never a fallback. `max_retries()`: LANGFUSE_MAX_RETRIES as digits,
  default 3, a non-number warns and gives 3, a value above 1000 warns and is capped at 1000. `flush_at()`:
  LANGFUSE_FLUSH_AT as digits from 1 to 100000, default 512, anything else warns and gives 512. `release()`:
  LANGFUSE_RELEASE when non-empty, else the first of RENDER_GIT_COMMIT, CI_COMMIT_SHA, CIRCLE_SHA1,
  SOURCE_VERSION, TRAVIS_COMMIT, GIT_COMMIT, GITHUB_SHA, BITBUCKET_COMMIT, BUILD_SOURCEVERSION,
  DRONE_COMMIT_SHA that is set at all (an empty value counts as set), else None. `check_prompt_cache_ttl()`:
  LANGFUSE_PROMPT_CACHE_DEFAULT_TTL_SECONDS, when present, must parse as a whole number or the call fails
  naming the variable and the value. `prompt_cache_ttl_seconds()`: that number as seconds, 60.0 when unset,
  and a value below 0 warns and gives 60.0.

  Read the warning texts from the linked LiteLLM lines and keep their words, since operators grep logs for them.
  Write the behavior tests as rstest functions in a module named langfuse_settings_tests_behavior inside the module, one named case per rule and failure above. They capture the warnings with the tracing subscriber setup the other betterlite-logging tests use.
  Other tasks consume these through function arguments: B3907 and B3908 build loggers from them, B3903 takes
  sample_rate, flush_at and flush_interval for the channel key, B3902 and B3904 take timeout, retries and TTL.
scope:
  paths:
    - crates/betterlite-config/src/sections/langfuse_settings.rs
    - crates/betterlite-config/src/sections/langfuse_settings/**
    - crates/betterlite-logging/src/langfuse_settings.rs
    - crates/betterlite-logging/src/langfuse_settings/**
    - tools/oracle/cases/helpers/langfuse-settings/**
    - tools/oracle/helpers/b3900.py
    - tools/oracle/helpers/b3900/**
    - tools/oracle/src/helpers/config/b3900.rs
    - tools/oracle/src/helpers/config/b3900/**
  lint_tables: false
