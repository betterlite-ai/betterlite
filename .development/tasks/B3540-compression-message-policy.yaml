id: B3540
title: Compression message normalization and protected history
description: >-
  Build the compression module's foundation: message-to-text conversion, protected
  cache-prefix tracking, atomic Anthropic tool-exchange validation, content
  classification, stable retrieval keys, and line-based message truncation.

  This is a pure normalization layer available to Headroom and TypeSafe guardrails
  without making those depend on the compression orchestration. betterlite-compression
  (a new lower crate, not depending on betterlite-core) owns the message policy
  and numerical scoring primitives; configuration, interception state and proxy
  re-entry belong in higher crates.

  Functions to port:
  - _normalize_call_type: canonicalize CallTypes to string
  - _is_anthropic_call_type: check for structured message shape (anthropic_messages)
  - _content_to_text: extract text from OpenAI/Anthropic content blocks, iteratively
    unrolling tool_result nested content, ignoring images/documents/thinking
  - _normalize_messages_for_compression: shallow copy messages with content replaced
    by extracted text for scoring
  - _extract_last_user_message: find the most recent user message's text
  - _extract_tool_use_ids, _extract_tool_result_ids: scan for Anthropic tool ids
  - _extract_anthropic_tool_exchange_spans: validate atomic 2-message pairs
    (assistant tool_use immediately followed by user tool_result for all ids)
  - _message_has_cache_control: detect prompt-cache breakpoints at message or block level
  - _cached_prefix_indices: find all messages up to and including the last cache control
  - get_protected_indices: combine system, last-user, last-assistant and cached-prefix
    indices so they are never compressed
  - detect_content_type: classify text as code, JSON or plain text
  - extract_key: extract file path patterns from content, fall back to message_N
  - stub_message: replace content with a brief reference to the retrieval tool
  - truncate_message: keep first 70%/last 30% of lines with a separator

  Also port the constants and regexes:
  - _ANTHROPIC_CALL_TYPES and _SUPPORTED_CALL_TYPES constants
  - _CODE_KEYWORDS regex for code detection
  - _FILE_PATH_PATTERNS list for stable key extraction

  Messages below compression_trigger pass through unchanged. When
  compression_trigger * 7 // 10 is used as the default compression_target,
  the 70% factor is rounded inline, not factored to a separate function.
  Anthropic tool exchanges drop atomically, not as stubs. An invalid Anthropic
  sequence (tool_use without matching tool_result) is detected before scoring.
