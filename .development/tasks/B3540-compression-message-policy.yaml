      run: cargo nextest run --locked -p betterlite-compression --no-tests=fail -E 'test(/^anthropic_tool_exchange::/)'
    - id: detection-tests
      why: the content detection tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-compression --no-tests=fail -E 'test(/^content_detection::/)'
    - id: stub-tests
