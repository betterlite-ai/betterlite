oracle_cases: []
deviations:
  - what: >-
      Content detection regex matches code if 3+ code keywords are found or
      >30% of lines are indented, sampled from the first 5000 characters.
    why: >-
      LiteLLM uses the same heuristic for code vs. text classification; the
      exact numbers and sampling limit are preserved from the pinned commit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/compression/content_detection.py#L32-L41
  - what: >-
      Message key extraction searches for file paths in the first 2000 chars:
      patterns are "# filename", "// filename", "File: path", "--- filename",
      and backtick-quoted filenames.
    why: >-
      LiteLLM limits the search to avoid expensive regex on very large content;
      this preserves that optimization.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/compression/message_stubbing.py#L32-L37
  - what: >-
      Anthropic tool exchange validation detects an invalid_anthropic_tool_sequence
      error only; it returns empty spans and the error string, never panicking on
      malformed content blocks.
    why: >-
      Malformed input is classified as invalid, allowing the caller to decide
      whether to fail the request or pass through. LiteLLM does the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/compression/compress.py#L187-L200
  - what: >-
      Message stub content hardcodes the retrieval tool name 'litellm_content_retrieve'
      in the stub text: "[Compressed: {key} — {line_count} lines, {content_type}.
      Use litellm_content_retrieve tool to get full content.]"
    why: >-
      This is a model-visible reference that must match the tool definition
      in B3542. Betterlite preserves the 'litellm_content_retrieve' name verbatim
      from LiteLLM to maintain compatibility with trained behaviors.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/compression/message_stubbing.py#L68-L71
out_of_scope:
  - Compression orchestration, scoring and relevance ranking, owned by B3541.
  - Token counting, budget selection and the compress() orchestrator function,
    owned by B3542.
  - Retrieval tool injection and cache building, owned by B3542.
  - Integration with the proxy and callback hooks, owned by B3543.
pitfalls:
  - Content detection uses a keyword regex that is compiled on every call. Use a
    lazy_static or OnceCell to cache it, matching how LiteLLM defines the regex
    at module scope.
  - Anthropic tool exchanges require all tool_use ids to have matching tool_result
    ids in the immediate next message. A single missing result invalidates the pair.
  - Truncation uses line-based splitting (keep first 70%, last 30%) to preserve code
    structure. Word-based truncation mangles function boundaries and indentation.
  - Protected message indices must deduplicate and preserve order when returned.
    The same index can be protected by multiple criteria (e.g., system role and
    cache control).
  - Text extraction from content blocks must handle both lists (OpenAI style) and
    nested structures (tool_result with content field). Iterate, don't recurse.
review_level: standard
budget:
  max_changed_lines: 600
  max_new_expects: 2
