dod:
  - text: Message normalization extracts text from OpenAI/Anthropic content blocks,
      iteratively unrolling tool_result nested content and ignoring non-text blocks.
    proof: [normalize-tests]
  - text: Message normalization rejects unsupported call types with a ValueError
      listing the accepted types (completion, acompletion, anthropic_messages).
    proof: [normalize-tests]
  - text: Protected indices (system, last-user, last-assistant, cache-prefix) are
      returned in order and deduplicated.
    proof: [protected-tests]
  - text: Anthropic tool exchanges validate atomic 2-message pairs; an assistant
      tool_use must be immediately followed by a user tool_result with all ids matched.
    proof: [anthropic-tests]
  - text: Content detection classifies text as code, JSON or plain text based on
      keyword density and indentation patterns.
    proof: [detection-tests]
  - text: Message stubs reference the retrieval tool and preserve line count and
      content type.
    proof: [stub-tests]
  - text: Message truncation keeps the first 70% and last 30% of lines with a separator.
    proof: [truncate-tests]
  - text: Stable retrieval keys extract file paths from content or fall back to
      message_N, with duplicates suffixed _2, _3.
    proof: [key-tests]
  - text: Every mutant in the message policy functions is caught by a test.
    proof: [mutants]
