      run: cargo nextest run --locked -p betterlite-compression --no-tests=fail -E 'test(/^message_normalization::/)'
    - id: protected-tests
      why: the protected indices tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-compression --no-tests=fail -E 'test(/^protected_indices::/)'
    - id: anthropic-tests
