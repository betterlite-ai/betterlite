id: B5136
title: Close the B4573 CLI PKCE audit gaps
description: >-
  An Opus-model review of merged task B4573 found ten gaps in betterlite-cli's pkce_login
  module. The callback reader caps a request far below LiteLLM's limits, one slow connection can
  hold the callback wait past its deadline, and eight branches have no test that fails when they
  break. This task closes all ten. The code stays in crates/betterlite-cli/src/pkce_login.rs,
  crates/betterlite-cli/src/pkce_login/ and the crate's callback_request fuzz corpus.


  LiteLLM's LoopbackServer is a Python http.server HTTPServer bound to 127.0.0.1 (pkce_login.py
  L118-L131). http.server reads the request line with readline(65537) and answers 414 when it is
  longer than 65536 bytes, its line ending included (server.py L419-L425 in CPython 3.13.16, the
  version the oracle pins). Headers go through http.client._read_headers: a header line over 65536
  bytes, or more than 99 header lines, gets 431 (client.py L225-L241, server.py L361-L375). Today
  parse_request in request.rs gives up once the whole buffer passes MAX_REQUEST_BYTES (8192) or
  holds more than 32 headers, and read_callback_request answers 400 "Invalid callback." for both. A
  browser sends every cookie it holds for 127.0.0.1 on the redirect back, so a 16 KiB Cookie header
  left by another local app makes the betterlite sign-in time out where LiteLLM settles it. The fix
  drops the 8192-byte total and the 32-slot header array. Each line may be 65536 bytes with its line
  ending, and up to 99 header lines pass. RequestRead::TooLarge splits into RequestRead::UriTooLong,
  answered 414, and RequestRead::HeadersTooLarge, answered 431. Both keep the wait going, as the 400
  does today. One request still tops out near 6.5 MB (a request line and 99 header lines of 64 KiB
  each), so the input stays bounded.


  LiteLLM sets connection_timeout_seconds (5 by default) on each accepted socket in get_request
  (pkce_login.py L136-L139). That times every recv but not the whole request, and wait checks its
  deadline only between requests (L141-L150). betterlite copies this: loopback.rs sets a fixed 5 s
  read timeout at accept, and read_callback_request keeps reading 1024-byte chunks until the request
  is complete. A local process that sends one byte every 4 s keeps the single-threaded wait busy
  long past its deadline: up to 8192 reads of nearly 5 s each on main, over 11 hours, and months with
  the higher limits above. Max decided betterlite gives each connection a total deadline instead, as
  a deviation. The deadline is the connection timeout counted from accept, or the wait's own
  deadline if that comes first. Before every read the reader sets the socket's read timeout to the
  time left. When no time is left, it drops the connection without a response, the way http.server
  drops a connection whose read timed out (server.py L441-L445), and the wait goes on to the next
  connection. A browser sends its callback in one go, so a real sign-in never meets this deadline.
  What a user sees when it is hit: the slow sender's connection closes with no answer, the sign-in
  keeps waiting for the real callback, and if none comes, wait returns PkceFailure::CallbackTimeout
  ("timed out waiting for the browser sign-in to finish") at its own deadline instead of hours
  later. The new entry goes in docs/deviations/B4573.yaml next to the existing one.


  To build that, LoopbackServer takes the connection timeout the way LiteLLM's __init__ takes
  connection_timeout_seconds (L125). bind(expected_state, connection_timeout) and
  with_listener(listener, expected_state, connection_timeout) store it, and a pub CONNECTION_TIMEOUT
  of 5 s in callback.rs is the value callers pass by default. It replaces the private constant in
  loopback.rs, and TcpLoopbackListener::accept stops setting a fixed read timeout. LoopbackConnection
  gains set_read_timeout(&mut self, timeout: Duration), and TcpLoopbackConnection forwards it to
  TcpStream::set_read_timeout. wait passes its clock and its deadline down to read_callback_request,
  and the reader reads the time left from that clock before each read. RecordedConnection in
  tests/fixtures.rs implements the new method. Nothing outside pkce_login calls LoopbackServer on
  main, so the signature change touches no other crate.


  callback_idle_connection_then_valid_callback_settles can't fail today: its _idle stream drops when
  the spawned closure ends, so the server reads EOF and moves on with or without any timeout. It is
  replaced by loopback_drops_an_idle_connection_after_its_timeout, after LiteLLM's
  test_loopback_drops_an_idle_connection_instead_of_waiting_on_it (test_pkce_login.py L172-L186).
  The server gets a 200 ms connection timeout, the idle stream stays open until wait returns, and a
  valid callback must settle inside a 2 s wait on SystemClock. loopback_server_exposes_callback_redirect
  checks only the http://127.0.0.1: prefix and the /callback suffix, so binding 0.0.0.0 or building
  the URI from another port still passes. It is replaced by
  loopback_server_binds_127_0_0_1_and_redirects_to_its_port. That test asserts address.ip() is
  127.0.0.1, the port is not 0, and redirect_uri() equals http://127.0.0.1:<address.port()>/callback,
  as LiteLLM's own test asserts (L136-L156).


  LiteLLM's _CallbackHandler answers 404 off the /callback path and 400 for a wrong state. With the
  right state it settles CallbackDenied when error is set, answers 400 when there is no code, and
  only then settles CallbackCode (pkce_login.py L155-L174). No betterlite test sends another path, a
  missing code or an error. callback_validation_waits_for_matching_state also only matches
  CallbackOutcome::Code { .. }, so a server that settled on the wrong state's code "bad" would still
  pass it. It is replaced by callback_settles_only_on_a_code_for_the_expected_state, after LiteLLM's
  test of the same name (test_pkce_login.py L136-L156). GET /nope gets 404,
  state=wrong&code=stolen gets 400, state=state with no code gets 400, and only then
  state=state&code=the-code settles, with the exposed code compared to "the-code". A new
  callback_denied_settles_only_for_the_expected_state, after LiteLLM's test at L159-L169, sends
  state=wrong&error=access_denied and gets 400 while the wait goes on. It then sends
  state=state&error=access_denied&error_description=nope and gets 200, and the wait settles on
  CallbackDenied { error: "access_denied", description: Some("nope") }.


  discover_cli_auth compares the issuer through _canonical_url, and _canonical_url keeps the path
  (pkce_login.py L194-L217 and L246-L250). So issuer https://example.test/other is refused for base
  https://example.test, and a proxy mounted at /litellm is accepted only at that path. The only
  issuer test, discover_rejects_issuer_mismatch, changes the host, so a check that compared origins
  only would pass it. A new discover_rejects_an_issuer_on_another_path covers the first case. A new
  discover_accepts_a_proxy_mounted_under_a_path_only_at_that_path follows LiteLLM's test at
  test_pkce_login.py L247-L265: base https://example.test/litellm/ fetches
  https://example.test/litellm/.well-known/litellm-cli-auth and accepts the contract, and base
  https://example.test refuses the same document.


  _token_request copies access_token, refresh_token, user_id and team_id from the token response and
  client_id, token_endpoint, revocation_endpoint and resource from its arguments into PkceCredential,
  after posting to token_endpoint (pkce_login.py L369-L401). token_requests_capture_expiry reads
  only expires_at and the form, so swapping the two tokens, dropping user_id or team_id, or posting
  to another contract endpoint passes every test. New token_redeem_binds_the_credential_to_the_contract
  and token_refresh_binds_the_credential_to_the_contract answer a body with access_token
  "sk-cli-new", refresh_token "llm_srefresh_new", user_id "u1" and team_id "team-b", after LiteLLM's
  test at test_pkce_login.py L328-L351. Each asserts every PkceCredential field and that the request
  went to contract.token_endpoint.


  revoke_credential posts token, token_type_hint=refresh_token and client_id to
  revocation_endpoint. It returns RevocationUnavailable on 503, PkceFailure on any other status but
  200, and nothing on 200 (pkce_login.py L404-L423). revoke_503_is_unavailable and
  revoke_rejects_redirect cover only 503 and 3xx, so turning the status != 200 branch into Ok(()),
  rejecting 200 or dropping token_type_hint passes both. A new
  revoke_posts_an_rfc7009_request_for_the_refresh_token answers 200 and expects Ok(()). It asserts the
  URL is contract.revocation_endpoint and the form is exactly token, token_type_hint=refresh_token
  and client_id in that order (test_pkce_login.py L386-L396). A new revoke_non_503_errors_are_failures
  runs 401 {"error":"invalid_client"} and 500 and expects RevocationUnavailableOrFailure::Failure for
  both, with the 401 text naming invalid_client (L399-L409).
scope:
  paths:
    - crates/betterlite-cli/src/pkce_login.rs
    - crates/betterlite-cli/src/pkce_login/**
    - crates/betterlite-cli/fuzz/corpus/callback_request/**
    - docs/deviations/B4573.yaml
  lint_tables: false
