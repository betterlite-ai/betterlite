deviations:
  - what: "HTTP error handling distinguishes caller-fixable upstream errors (e.g., 429 rate limit) from proxy-side credential problems (401/403). 401/403 map to 502 Bad Gateway; others preserve upstream status. Retry-After header is forwarded when present."
    why: "Transparent error propagation allows callers to implement retry-after logic for transient errors while treating credential/consent issues as permanent proxy failures. Matches LiteLLM's status-code preservation logic."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L141-L165"
  - what: "_assemble_responses_api_from_chunks accepts the latest event carrying a ResponsesAPIResponse body, not only terminal events. Fallback order is response.completed, then response.failed, then response.incomplete."
    why: "LiteLLM's behavior: the function preserves non-terminal responses to allow response content scans on partial data. The docstring describes terminal events but the code path includes non-terminal events."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L270-L290"
  - what: "_resolve_user_id_for_blocking uses _resolve_trusted_user_id only (key/JWT-bound identity), not caller-supplied hints. Raises HTTPException 400 with different messages for untrusted-identity-available vs no-identity cases to guide caller remediation."
    why: "Identity spoofing risk: caller-supplied metadata (user, end_user_id, safety_identifier) can impersonate Entra users. Blocking DLP must fail closed with guidance on the specific remediation needed (bind user_id to key or provide bound identity)."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L340-L380"

out_of_scope:
  - "PurviewGuardrailBase constructor, _compute_protection_scopes, _process_content, _should_block, _extract_tool_call_args_from_message, get_prompt_text_for_dlp, _resolve_trusted_user_id, _resolve_user_id: owned by B3738"
  - "async_pre_call_hook, async_post_call_success_hook, async_post_call_streaming_iterator_hook, logging_hook and async_logging_hook: owned by B3740"
  - "CustomGuardrail base class and standard guardrail logging: belongs to B104"
  - "LiteLLMCompletionResponsesConfig: defined in betterlite-core (B909)"
  - "Model-response and streaming-response types: owned by wire format (B005, B2400)"
  - "HTTPException construction: framework utility"

pitfalls:
  - "HTTP status code handling: upstream 401/403 indicate proxy-side credential/consent problems (map to 502), while 429/503 are caller-retryable (preserve status). Retry-After header must be forwarded when present on httpx.HTTPStatusError."
  - "_check_content logs warnings in logging-only mode (block_on_violation=False) and raises HTTPException only when block_on_violation=True. The finally block always calls add_standard_logging_guardrail_information_to_request_data (delegated to framework, U1)."
  - "_extract_responses_api_function_call_args filters output items for type=='function_call' and extracts arguments field, skipping non-string or whitespace-only arguments. Returns empty list when output is None/empty."
  - "_completion_response_text_parts handles three response types: TextCompletionResponse (iterate choices, extract text), ResponsesAPIResponse (use output_text plus function_call arguments), and ModelResponse (iterate choices, extract message.content plus tool call arguments). Tool call arguments are always included via _extract_tool_call_args_from_message."
  - "_assemble_responses_api_from_chunks returns a tuple (is_responses_api_stream, final_response). is_responses_api is true if any event_type starts with 'response.'. final_response is whichever chunk's response field carries a ResponsesAPIResponse, with the latest one retained by iteration order (final is overwritten on each matching chunk, not via OrderedDict eviction). Fallback is implicit in iteration: response.completed is returned if it exists, else response.failed/incomplete. Returns (False, None) for non-Responses-API streams."
  - "_responses_api_input_to_str transforms input field (string or list of messages) via LiteLLMCompletionResponsesConfig.transform_responses_api_input_to_messages, converting to messages where instructions become a system message. When raise_on_failure=True (blocking mode), raises HTTPException 400 on transformation error; when False (logging mode), logs warning and returns None so audit can still run on response side."
  - "_resolve_user_id_for_blocking first tries _resolve_trusted_user_id (owned by B3738, returns only UserAPIKeyAuth.user_id). If None, checks whether any other _resolve_user_id source returns a value (untrusted available). If untrusted identity exists, raise HTTPException 400 'No proxy-authenticated user identity' with guidance to bind to API key. If no identity at all, raise HTTPException 400 'No proxy-authenticated user identity' with guidance to bind for blocking DLP. Both messages must guide caller remediation."

review_level: standard

