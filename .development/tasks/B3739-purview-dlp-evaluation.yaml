id: B3739
title: Purview DLP evaluation and text projection
description: >-
  Build Purview DLP policy evaluation and text extraction for DLP blocking.
  In betterlite-guardrails, implement `MicrosoftPurviewDLPGuardrail` with:
  - Class initialization and supported event hooks (pre_call, post_call, logging_only)
  - Configuration model getter returning None for UI integration later
  - DLP content evaluation via `_check_content`: Calls Graph API with activity
    type ("uploadText" or "downloadText"), handles HTTP errors (401/403 map to 502,
    preserve Retry-After header), propagates upstream status codes (429, 503) on
    rate limits, logs warnings in logging-only mode and raises HTTPException
    when block_on_violation is true
  - Policy block detection: Raises HTTPException 400 when _should_block detects
    policy blocks (owned by B3738)
  - Responses API function call arguments extraction alongside output_text to
    catch sensitive data in model-generated tool calls
  - Completion and chat response text collection from TextCompletionResponse
    (text_choice.text), ModelResponse (message content), and ResponsesAPIResponse
    (output_text plus tool call arguments)
  - Responses API stream reassembly from buffered chunks: Extract the latest
    ResponsesAPIResponse from event stream with fallback order (response.completed,
    response.failed, response.incomplete)
  - Responses API input transformation: Convert input field (string or list) to
    messages via LiteLLMCompletionResponsesConfig, include instructions as system
    message, handle transformation errors with HTTPException in blocking mode or
    log and return None in audit mode
  - User ID resolution for blocking with fail-closed behavior: Call
    _resolve_trusted_user_id (owned by B3738) and reject caller-supplied hints;
    distinguish "untrusted identity available" (HTTPException) from "no identity"
    (different HTTPException)

