dod:
  - text: >-
      Configuration is parsed from init parameters and environment, with API URLs
      constructed correctly for both detector server and orchestrator modes,
      and SSL verification and extra headers applied to requests.
    proof: [config-tests, oracle]
  - text: >-
      Initialization raises ValueError when auth_token (no parameter and no IBM_GUARDRAILS_AUTH_TOKEN env var),
      base_url, or detector_id are missing.
    proof: [missing-required-field-tests, oracle]
  - text: >-
      Detector server client batches multiple texts in one request and returns
      nested lists; orchestrator client calls once per text and returns flat lists;
      both use bearer token authorization and apply extra header overwrites.
    proof: [client-tests, oracle, ibm-detector-corpus]
  - text: >-
      Score thresholds filter detections correctly, with absent threshold accepting
      all detections and explicit zero treating all detections as violations.
    proof: [threshold-tests, oracle, ibm-detector-corpus]
  - text: >-
      Status projection classifies responses as success, guardrail_intervened or
      guardrail_failed_to_respond based on detection results and malformed responses.
    proof: [status-tests, oracle, ibm-detector-corpus]
  - text: >-
      Violation messages construct from detection dicts with detection type, score,
      matched text and optional detector ID, formatted differently for detector
      server (per-message grouping) and orchestrator (flat list).
    proof: [message-tests, oracle, ibm-detector-corpus]

checks:
  optional: []
  commands:
    - id: config-tests
      why: Configuration parsing, URL construction, SSL/header application or environment resolution absent or wrong.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_detector_client::config::tests::/) - test(/replays_the_/)'
    - id: missing-required-field-tests
      why: ValueError for missing auth_token, base_url or detector_id absent or wrong error type/message.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_detector_client::initialization::tests::missing_required_field/)'
    - id: client-tests
      why: Detector server or orchestrator HTTP client, request payload, authorization header, or response parsing absent or wrong.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_detector_client::client::tests::/) - test(/replays_the_/)'
    - id: threshold-tests
      why: Score threshold filtering logic, absent threshold behavior, or zero threshold handling absent or wrong.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_detector_client::threshold::tests::/) - test(/replays_the_/)'
    - id: status-tests
      why: Status projection for detector server, orchestrator, HTTP errors or malformed responses absent or wrong.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_detector_client::status::tests::/) - test(/replays_the_/)'
    - id: message-tests
      why: Violation message construction from detector server or orchestrator detections absent or wrong.
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^ibm_detector_client::message::tests::/) - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/b3736.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: ibm-detector-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/ibm-detector-client-*")" && grep -rlq "ibm_detector_client" tools/oracle/fuzz/corpus/helper_case/ibm-detector-client-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

