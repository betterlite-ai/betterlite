out_of_scope:
  - "Request/during-call/response hooks and streaming iterator: owned by B3737 (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook, async_post_call_streaming_iterator_hook)."
  - "CustomGuardrail base class and decorator contract: not built here, owned by framework (U1)."
  - "Standard guardrail logging helpers and intervention classification: owned by framework (U1)."
  - "Configuration environment resolution and secret retrieval: owned by configuration crate and U4."
  - "Message text extraction from different content formats: inherited from framework utility iter_message_text (U1)."

pitfalls:
  - "The orchestrator client calls once per input text, while detector server batches all texts in one request and returns nested lists; status and message constructors must handle both response shapes correctly."
  - "Score threshold behavior requires special attention: an absent/None threshold accepts all detections, while an explicit 0.0 threshold still filters (detections with score < 0.0 excluded), but 0 in Python truthiness evaluates false so use is None check."
  - "Extra headers dict overwrites default headers (Authorization, content-type) when keys match, and the order of merge matters: extra_headers values override defaults."
  - "Bearer token comes from auth_token parameter or IBM_GUARDRAILS_AUTH_TOKEN environment variable (in that precedence); missing auth token raises ValueError at initialization, not deferred to API call."
  - "The orchestrator client detector params are passed as values in a detectors dict keyed by detector_id, while detector server detector params are passed directly; URL construction depends on is_detector_server flag and must not be confused between the two modes."

