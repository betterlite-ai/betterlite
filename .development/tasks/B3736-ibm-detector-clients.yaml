id: B3736
title: IBM detector clients and detection decisions
description: >-
  Build IBM configuration, detector-server/orchestrator HTTP clients, score filtering,
  status projection and violation-message construction. Preserve extra-header overwrite
  semantics, the SSL verification option, environment fallback and different response
  shapes for the two APIs.

  Configuration combines base URL, detector ID, authentication token (from IBM_GUARDRAILS_AUTH_TOKEN
  environment variable when unset), SSL verification flag, score threshold, and detector
  parameters as a dict. Construct API URLs: /api/v1/text/contents for detector server,
  /api/v2/text/detection/content for FMS Guardrails Orchestrator.

  Detector-server client batches multiple texts in one request, returning nested lists
  (one list per input text with its detections). Orchestrator client scans individual
  texts one at a time, each returning a flat list of detections. Both apply score
  thresholds (absent threshold accepts all detections) to filter violations.

  Status projection classifies responses: "success" (no violations after filtering),
  "guardrail_intervened" (violations found), or "guardrail_failed_to_respond" (HTTP
  error or malformed response). Construct violation messages from detection dicts,
  including detection type/score/text and optionally detector ID (orchestrator only),
  with message format depending on whether calling detector server (per-message grouping)
  or orchestrator (flat list).

  Direct dependency: B173 for pooled client acquisition with ssl_verify and AsyncHTTPHandler.post.
  Unresolved calls: CustomGuardrail.__init__ and standard guardrail logging (U1);
  configuration environment resolution for IBM_GUARDRAILS_AUTH_TOKEN (U4). A nonblocking
  configured detector can still log guardrail_intervened; enforcement is the caller's
  decision in B3737.

