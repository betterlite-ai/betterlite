id: B842
title: Discoverable and healthy model visibility
description: >-
  Implement ModelVisibility using typed configured deployment metadata, public team names, aliases, wildcard
  provider resolution and B304 health snapshots. Preserve source defaults for healthy_only and undiscoverable
  metadata; visibility filtering is separate from model access authorization. general_settings.model_list_healthy_only
  defaults false; only a literal true enables the proxy-wide filter.


  Build the production model_visibility module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/discoverable_model_filter.py:
  is_undiscoverable_deployment (L19-L23; 5 source lines), is_undiscoverable_model_name (L26-L32; 7 source
  lines), _team_public_model_name (L35-L37; 3 source lines), _alias_target (L40-L41; 2 source lines),
  _undiscoverable_served_names (L44-L55; 12 source lines), _undiscoverable_patterns (L58-L70; 13 source
  lines), _resolved_provider (L73-L77; 5 source lines), _matches_undiscoverable_pattern (L80-L86; 7 source
  lines), undiscoverable_model_names (L89-L109; 21 source lines), discoverable_rows (L112-L118; 7 source
  lines). litellm/proxy/common_utils/healthy_model_filter.py: is_healthy_only_listing_default (L34-L41;
  7 source lines), is_healthy_only_enabled (L44-L57; 13 source lines), get_hidden_unhealthy_model_names
  (L60-L79; 19 source lines).


  Add the model_visibility operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a model-visibility-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 121 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  121 production, 148 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 364 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
