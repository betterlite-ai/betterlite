id: B842
title: Discoverable and healthy model visibility
description: >-
  Implement ModelVisibility over B844 get_model_list, B302 alias/pattern snapshots, B307
  async_get_fully_unhealthy_model_names, B209 declared_authenticating_provider, B174 get_llm_provider
  and B732 user_api_key_has_admin_view. A deployment is hidden only when model_info is a mapping
  containing discoverable whose value is literally false; absent, null, 0 and "false" remain visible.
  A model name is hidden only when lookup returns at least one deployment and every backing row is
  hidden. Missing router, missing models and a single visible sibling keep the name discoverable.


  For non-admin listings, collect hidden rows' string model_name and team_public_model_name values,
  then aliases whose direct target is in that set. Both string and {model: ...} alias forms work;
  do not recursively resolve alias chains here. Compile global patterns plus the requested team's
  patterns, keeping patterns with any hidden deployment. Match the original name first using prefix
  match, then declared provider or inferred provider plus slash/name. Inference exceptions are
  swallowed without warning and the source still tests the literal None/<name> candidate. A candidate
  matched by served name or pattern is hidden only after B844 confirms all its resolved deployments
  are hidden. Admin-view and absent routers return an empty hidden set without looking up patterns.
  No hidden rows also short-circuits pattern work. discoverable_rows instead filters each row directly,
  preserving order/duplicates; admins retain all rows. Invalid internal pattern records/regexes propagate,
  with no newly invented fail-open fallback.


  Read general_settings.model_list_healthy_only (default false) at healthy_model_filter.py L41.
  Only boolean true enables it; strings, numbers, null, lists and mappings normalize false, not a
  startup parse failure. There is no dedicated environment variable. Request healthy_only defaults
  None at the call boundary; true OR the setting enables filtering, so request false cannot disable
  the global opt-in. Without a router or with both opt-ins false, do not read health at all. Otherwise
  return B307's hidden-name set unchanged. Empty results log the source debug diagnostic about
  background_health_checks and return unfiltered; exceptions from the router are not caught here.
  Unknown/stale health, allowed_fails_policy and literal wildcard treatment remain B307's policy.
  This is listing presentation, not admission control.


  Config tests loads_health_filter and health_filter_nonbool call B002's real loader with every value
  above, including os.environ/ resolution, and pass the normalized setting into the production filter.
  Seed B002's existing config_yaml corpus; do not add another config decoder. The helper adapter
  supplies immutable router snapshots and ready health outcomes, invokes the pinned functions and
  compares hidden sets, row sequences, lookup counts, debug events and propagated error categories.


  Build the production model_visibility module in betterlite-server; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/common_utils/discoverable_model_filter.py:
  is_undiscoverable_deployment (L19-L23; 5 source lines), is_undiscoverable_model_name (L26-L32; 7 source
  lines), _team_public_model_name (L35-L37; 3 source lines), _alias_target (L40-L41; 2 source lines),
  _undiscoverable_served_names (L44-L55; 12 source lines), _undiscoverable_patterns (L58-L70; 13 source
  lines), _resolved_provider (L73-L77; 5 source lines), _matches_undiscoverable_pattern (L80-L86; 7 source
  lines), undiscoverable_model_names (L89-L109; 21 source lines), discoverable_rows (L112-L118; 7 source
  lines). litellm/proxy/common_utils/healthy_model_filter.py: is_healthy_only_listing_default (L34-L41;
  7 source lines), is_healthy_only_enabled (L44-L57; 13 source lines), get_hidden_unhealthy_model_names
  (L60-L79; 19 source lines).


  Add the model_visibility operation under B856 Management::models. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a model-visibility-*
  seed to B171 helper_case, which already owns this decoder.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  The owned ranges total 121 nonblank noncomment lines including 29 docstring lines; allow 125 production,
  245 tests, 85 adapters, 60 config and 30 wiring lines, 545 within 600. Compiled router patterns and
  decoded config records are consumed here; their byte parsers stay with B302 and B002.
