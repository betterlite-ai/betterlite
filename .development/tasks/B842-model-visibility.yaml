dod:
  - text: 'Implement the owned behavior and ordered failure effects; named tests: undiscoverable_model,
      team_public_alias, wildcard_hidden, healthy_only_default, explicit_healthy_only, unknown_health.'
    proof:
      - behavior-tests
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^model_visibility::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/model_visibility.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/model-visibility-*")"
        && grep -rlq "model_visibility" tools/oracle/fuzz/corpus/helper_case/model-visibility-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/model-visibility/undiscoverable-model.yaml
  - tools/oracle/cases/helpers/model-visibility/team-public-alias.yaml
  - tools/oracle/cases/helpers/model-visibility/wildcard-hidden.yaml
  - tools/oracle/cases/helpers/model-visibility/healthy-only-default.yaml
  - tools/oracle/cases/helpers/model-visibility/explicit-healthy-only.yaml
  - tools/oracle/cases/helpers/model-visibility/unknown-health.yaml
deviations: []
out_of_scope:
  - B061 owns the cryptographic storage format; injected StoredCipher test doubles are not a plaintext
    production fallback.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - Only literal true enables model_list_healthy_only; truthy strings are not equivalent.
budget:
  max_changed_lines: 400
  max_new_expects: 0
review_level: security
