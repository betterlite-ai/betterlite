id: B964
title: Messages conversation translation to Chat Completions
description: >-
  Implement the whole translate_anthropic_messages_to_openai method and the stateless adapter construction in
  betterlite-core::api::messages_chat_content. Reuse B1117 for content primitives, B965 for in-sequence system
  translation, B961 for system-turn ordering, B571 for encrypted-reasoning stripping and B220 for readable thinking
  text. The function transforms decoded records without fetching image URLs or invoking a provider.

  Preserve ordering within each source message according to the implementation: all tool_result messages come
  first, then any scalar user message, then the collected user content. Assistant text blocks concatenate without
  separators unless at least one retained text cache_control requires list form. Unknown roles and unsupported
  content blocks disappear; do not create placeholder user turns for them. The native result retains a null
  thinking_blocks field on an assistant without thinking, matching the constructed dictionary.

  Add the messages_chat_content B171 helper variant. Cases compare complete ordered message lists and the original
  input after the call, with typed image and thinking inputs. No new fuzz target is needed for already parsed
  records; source JSON parsing stays in the wire owner. Own 164 nonblank/non-comment lines; budget 185 production,
  145 tests, 135 fixtures, 85 adapters and 30 wiring, 580 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/lib.rs
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/messages_chat_content.rs
  - crates/betterlite-core/src/api/messages_chat_content/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/messages_chat_content.rs
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/messages_chat_content.py
  - tools/oracle/fuzz/corpus/helper_case/messages_chat_content-*
  - tools/oracle/cases/helpers/messages-chat-content/**
  - Cargo.lock
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L351-L353
  why: The adapter constructor has no mutable shared state.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/adapters/transformation.py#L456-L639
  why: Own one complete conversion, including user/tool ordering and assistant content representation.
dod:
- text: >-
    user_and_tool_order translates user content [{type:text,text:before},{type:tool_result,tool_use_id:t,content:ok},
    {type:text,text:after}] to a tool message id=t/content=ok followed by one user message with text parts before,after.
    A tool_result with absent tool_use_id/content becomes id=""/content="". User string hello survives; empty string,
    empty list, null content, unknown role=other and unknown block type produce no message. Missing text in a text
    block becomes empty text, and tool_result.is_error is not forwarded.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    user_media_markers converts image base64 data=YWJj into image_url.url=data:image/jpeg;base64,YWJj and document
    source media_type=application/pdf into image_url.url=data:application/pdf;base64,YWJj. A URL source stays a URL;
    no download occurs. Text/image blocks retain prompt_cache_breakpoint=false, but a document block does not
    copy that marker. Cache_control={type:ephemeral} survives for claude/gemini targets and drops for gpt-4o.
    Invalid image/document sources disappear without a warning.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    assistant_text_representation translates text blocks a,b to content=ab with thinking_blocks=null. With a
    retained cache_control on either text block, both stay in an ordered content list. A cached source targeting
    gpt-4o becomes ab because its cache field is stripped. Assistant list strings [a,b] retain only b; text dicts
    take precedence over a simultaneous string. An empty assistant string still emits content=""; empty list does not.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    assistant_tool_signatures maps tool_use id=t,name=lookup,input={x:1} to tool_calls=[{id:t,type:function,
    function:{name:lookup,arguments:"{\"x\": 1}"}}]. Absent name/id/input default to empty strings and {}.
    provider_specific_fields.signature=sig becomes function.provider_specific_fields.thought_signature=sig;
    empty signature is omitted. B1117's 65-character name truncation applies to history as well as declarations.
    Tool-level cache_control follows the target model policy, and content is null on a tool-only assistant.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    assistant_thinking_history carries thinking={thinking:one,signature:sig} and redacted_thinking={data:hidden}
    as thinking_blocks without any cache_control. Missing/null thinking/signature/data become empty strings.
    Readable nonempty thinking blocks one,two produce reasoning_content="one\ntwo"; redacted data contributes no text.
    B571 removes blocks carrying litellm_encrypted_reasoning: before this conversion, including their readable text.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    midturn_system_capability keeps leading system turns as system messages. A later system reminder between
    assistant tool_use and user tool_result moves after the result and becomes a user operator-note turn on
    gpt-4o. preserve_midturn_system=true or a model declaring supports_mid_conversation_system keeps its original
    position and role. B965 removes empty/non-text system content. No middle system turn means no capability probe.
  proof: [behavior-tests, oracle, helper-python]
- text: The new content helper seed and conversation fixtures run the production converter and independent pinned method.
  proof: [helper-corpus, new-cases, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: ordered user/tool/assistant conversion has no behavior regression tests
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_chat_content::/)'
  - id: helper-python
    why: conversation comparison has no strictly checked pinned adapter
    run: test -f tools/oracle/helpers/messages_chat_content.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: message content translation cannot be dispatched by the oracle
    run: grep -qE '^[[:space:]]+messages_chat_content:' tools/oracle/fuzz/corpus/helper_case/messages_chat_content-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no ordered conversation fixtures are new to this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-chat-content)"
oracle_cases:
- tools/oracle/cases/helpers/messages-chat-content/user-and-tool-order.yaml
- tools/oracle/cases/helpers/messages-chat-content/user-media-markers.yaml
- tools/oracle/cases/helpers/messages-chat-content/assistant-text-representation.yaml
- tools/oracle/cases/helpers/messages-chat-content/assistant-tool-signatures.yaml
- tools/oracle/cases/helpers/messages-chat-content/assistant-thinking-history.yaml
- tools/oracle/cases/helpers/messages-chat-content/midturn-system-capability.yaml
deviations: []
out_of_scope:
- B1117 owns primitives L25-L93,L213-L225,L357-L454,L672-L700,L1290-L1343 in adapters/transformation.py.
- B965 owns system/metadata/thinking options and B2431 tool/schema methods in L642-L1212; B966 owns output L1345-L1766 and B967 adapter/request composition L229-L345,L1214-L1288.
- create_tool_name_mapping L94-L114 and translate_thinking_for_model L703-L737 have no caller at the pin.
pitfalls:
- A user tool_result is emitted before text that preceded it in the same Anthropic content list.
- Documents use image_url but do not inherit prompt_cache_breakpoint in this method.
- Assistant cache-control retention changes the entire text content from a string to a list.
review_level: standard
budget:
  max_changed_lines: 600
  max_new_expects: 0
