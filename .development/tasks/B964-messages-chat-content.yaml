id: B964
title: Messages chat content
description: >-
  Translate Anthropic message content and tool-result media to chat records, preserving cache breakpoints, thought
  signatures, tool-name truncation/mappings and mid-conversation system capabilities. Reuse B180 prompt/content
  primitives and B183 inline media; request URLs stay opaque to URL-capable providers.


  Implement crates/betterlite-core/src/api/messages_chat_content.rs. Use MessagesChatContentInput and MessagesChatContentResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions cache_control_block, mid_turn_system under api::messages_chat_content::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesChatContent in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_chat_content: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.__init__
  (L352-L353); litellm/llms/anthropic/pass_through/adapters/transformation.py: LiteLLMAnthropicMessagesAdapter.translate_anthropic_messages_to_openai
  (L456-L639). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 164 owned nonblank/non-comment/non-docstring Python lines (164 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 184 implementation,
  52 behavior tests, 24 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 380 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B004 (OpenAI chat completions without streaming), B171 (Direct helper oracle and URL path
  encoding), B180 (Anthropic prompt and tool conversion helpers), B183 (Bounded inline media conversion), B1087
  (Api boundaries), B1117 (Messages content primitives), B965 (Messages chat options), B961 (Messages native prepare).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
