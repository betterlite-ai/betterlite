dod:
  - text: "_get_process_rss_mb returns process RSS in MB (using resource.getrusage), dividing by 1024 on Linux and by 1024*1024 on macOS, or None if the operation fails."
    proof: [process-rss-tests]
  - text: "_rss_mb_for_log formats RSS as a two-decimal string or 'unknown' when unavailable."
    proof: [rss-formatting-tests]
  - text: "_run_model_health_check returns an empty dict for strategy router deployments, otherwise calls the health check operation with resolved mode, timeout and default prompt."
    proof: [model-probe-tests]
  - text: "_run_health_checks_with_bounded_concurrency executes health checks with at most concurrency_limit active tasks, preserves result order matching the input list, and returns results tuple and peak in-flight count."
    proof: [bounded-concurrency-tests]
  - text: "_perform_health_check separates healthy and unhealthy endpoints, stores exceptions by model_id outside the unhealthy dict, adds exception_status integer for shared-cache readers, strips exception objects from response JSON, and instruments dispatch summary."
    proof: [perform-health-tests]
  - text: "build_deployment_health_states maps deployment IDs to timestamped dicts with is_healthy boolean and reason field, returning healthy rows first, then unhealthy rows with background_health_check_failed."
    proof: [health-state-tests]
  - text: "perform_health_check orchestrates cycle execution with targeting, eligibility filtering, dependency expansion, bounded/unbounded dispatch selection, strategy router verdict finalization, and cycle instrumentation."
    proof: [orchestration-tests]
  - text: "Targeting by model_id wins over model name; an unknown model_id keeps the full list (no 404). Targeting by model name routes deployments the way a request from team_id would, else routes by litellm_params.model."
    proof: [targeting-tests]
  - text: "Eligibility filtering with skip_disabled skips deployments with model_info.disable_background_health_check set; it applies to both requested and dependency-pool lookups so opted-out deployments cannot re-enter through router dependencies."
    proof: [eligibility-tests]
  - text: "health_check_timeout uses a truthy deployment override or defaults to 60 seconds; timeout results include error dict and exception without raising."
    proof: [timeout-tests]
  - text: "CLI fallback creates a synthetic deployment when model_list is empty and cli_model is provided; no ID is invented to make deduplication succeed."
    proof: [cli-fallback-tests]
  - text: "Instrumentation records cycle/source, requested/post-filter/deduped counts, max_concurrency, dispatch mode, peak in-flight, duration, thread count and RSS when enabled, without logging secrets."
    proof: [instrumentation-tests]

checks:
