  commands:
    - id: process-rss-tests
      why: "RSS measurement accuracy on different platforms must not fail silently"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::process_rss(::|$)/)'
    - id: rss-formatting-tests
      why: "RSS formatting must match log requirements"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::rss_formatting(::|$)/)'
    - id: model-probe-tests
      why: "single model probe must skip strategy routers and invoke health check with correct parameters"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::model_probe(::|$)/)'
    - id: bounded-concurrency-tests
      why: "bounded scheduler must preserve order and track peak concurrency"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::bounded_concurrency(::|$)/)'
    - id: perform-health-tests
      why: "health check must separate healthy/unhealthy, track exceptions, and clean JSON output"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::perform_health(::|$)/)'
    - id: health-state-tests
      why: "health state projection must order healthy first and map IDs correctly"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::health_state(::|$)/)'
    - id: orchestration-tests
      why: "cycle orchestration must handle targeting, filtering, dependencies and instrumentation"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::orchestration(::|$)/)'
    - id: targeting-tests
      why: "targeting logic must prioritize model_id, then route by name, then by litellm_params.model"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::targeting(::|$)/)'
    - id: eligibility-tests
      why: "eligibility filtering must apply consistently across requested and dependency pools"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::eligibility(::|$)/)'
    - id: timeout-tests
      why: "timeout handling must return result dict with error, not raise"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::timeout(::|$)/)'
    - id: cli-fallback-tests
      why: "CLI fallback must not invent deployment IDs"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::cli_fallback(::|$)/)'
    - id: instrumentation-tests
      why: "instrumentation must log without exposing secrets and track all required metrics"
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^health_cycle::instrumentation(::|$)/)'

oracle_cases: []

deviations: []

out_of_scope:
  - "B4441 owns _resolve_health_check_mode, _update_litellm_params_for_health_check, run_with_timeout, _clean_endpoint_data, _narrow_to_target, _health_check_eligible and filter_deployments_by_id function bodies."
  - "B4442 owns _is_strategy_router_deployment, _dependency_deployments_to_probe and _finalize_strategy_router_endpoints function bodies."
  - "Native health entry point dispatch (ahealth_check). B4449 owns that."

pitfalls:
  - "Result order must match input list order despite completion order: track each future's original index and slot results back correctly, never return them in completion order."
  - "_run_health_checks_with_bounded_concurrency must not cancel sibling probes when one times out; asyncio.wait_for cancels only its awaited task, so bounded scheduling's queue scheduling must preserve that isolation."
  - "exception_status integer must be stored for shared-cache readers only when model_id exists; absence of model_id means the source has no identity for the cache key."
  - "Exception objects must not appear in JSON response dicts; exception_status integer and omitted exception field satisfy both cache readers and HTTP responses."
  - "CLI fallback uses request-supplied cli_model to create a synthetic deployment only when model_list is empty; no ID is invented so deduplication will skip it (preserve that outcome)."
  - "health_check_timeout must check for a truthy override before defaulting to 60; a zero value means 'use default', not 'disable timeout'."
  - "Instrumentation context is optional and must not crash if missing; cycle/source/enabled defaults prevent key errors."
  - "RSS and thread count are captured without secrets and must not log API keys, host names or deployment IDs that could appear in a full deployment dict."

review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
