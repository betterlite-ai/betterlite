id: B4443
title: Execute model health cycles and project routing health state
description: >-
  Build ordered health-cycle execution in betterlite-server with injected clock, randomness
  and provider-health operation. Execute concurrent health probes with optional bounded
  concurrency, preserving result order despite completion order. Separate and track
  per-deployment exceptions outside JSON responses for shared-cache readers and cooldown
  integration. Project timestamped health state (healthy/unhealthy) per deployment ID,
  feeding it into the background routing loop's cache. Instrument cycles with cycle/source,
  peak concurrency, dispatch mode, duration, thread count and RSS (without secrets) when
  enabled. Preserve process RSS measurement on Linux (KB) and macOS (bytes) or return None
  when unavailable. Unbounded execution for non-positive or missing concurrency, matching
  LiteLLM's asyncio.gather behavior. Healthy rows are returned first, unhealthy rows overwrite
  duplicates with background_health_check_failed status. CLI fallback adds a synthetic
  deployment when model_list is empty and cli_model is provided; a no-ID target is not invented
  and deduplication skips rows without IDs.

scope:
  paths:
    - Cargo.toml
    - crates/betterlite-server/src/health_cycle.rs
    - crates/betterlite-server/src/health_cycle/**
  lint_tables: false

