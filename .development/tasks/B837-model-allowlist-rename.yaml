id: B837
title: Rename model allowlists without widening grants
description: >-
  Implement ModelAllowlistRename using parameterized SQL for key/team/org/project/user allowlists and
  source cache-key generation. Preserve order/deduplication and update only exact served names; combine
  with AccessGroupModelSync for atomic last-sibling behavior.


  Build the production model_allowlist_rename module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/model_allowlist_rename_sync.py:
  _AllowlistTable.update_cte (L36-L41; 6 source lines), _team_cache_keys (L44-L45; 2 source lines), _key_cache_keys
  (L48-L49; 2 source lines), _org_cache_keys (L52-L53; 2 source lines), _project_cache_keys (L56-L57;
  2 source lines), _user_cache_keys (L60-L61; 2 source lines), _rewrite_sql (L75-L81; 7 source lines),
  sync_model_allowlists_for_renamed_model (L89-L109; 21 source lines).


  Add the model_allowlist_rename operation under B856 Management::models. Python calls only the owned
  MIT helper with injected clock/cache/DB/network collaborators; it never calls a route or copies the
  expected algorithm. Rust invokes the production module. Compare typed values, exception status/type/param/code,
  ordered warnings and effects; exclude only random IDs and message text with a reason per pointer. Add
  a model-allowlist-rename-* seed to B171 helper_case, which already owns this decoder.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 44 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  65 production, 154 behavior/Postgres tests, 65 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 0 config lines, 314 changed lines estimated within a 400-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
