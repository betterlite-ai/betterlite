id: B837
title: Rename model allowlists without widening grants
description: >-
  Implement ModelAllowlistRename for the five models arrays in LiteLLM_TeamTable (team_id and team_alias),
  LiteLLM_VerificationToken (token), LiteLLM_OrganizationTable (organization_id), LiteLLM_ProjectTable
  (project_id) and LiteLLM_UserTable (user_id). Use B820 raw_executor/still_backed, B733 UserApiKeyCache
  and B734 evict_and_broadcast. The callers in model_management_endpoints.py invoke access-group sync
  and this operation separately; no transaction combines them with the deployment rename.


  Equal old_name/new_name returns before acquiring an executor or querying siblings. Otherwise ask
  B820 whether a different database or config deployment still serves old_name, excluding model_id.
  If backed, append new_name only to rows containing old_name and lacking new_name. If unbacked,
  remove every existing new_name, then replace every old_name with new_name, only in rows containing
  old_name. Preserve other entries and order. Multiple old_name entries remain multiple new_name
  entries; this is not general deduplication. Matching is exact, including case and wildcard literals.
  NULL and empty arrays do not match. Bind both names as parameters; table/column/kind identifiers
  come only from this closed five-table set. All five UPDATE CTEs and UNION ALL returns belong to one
  statement, so a statement failure rolls back all five, but not an earlier model/access-group write.


  Decode touched kind/object_id/team_alias records, with team_alias default None, before invalidation.
  Teams evict team_id:<id> and team_alias:<alias> only for a nonempty alias. Keys evict the raw token
  hash, organizations both org_id:<id> and org_id:<id>:with_budget, projects project_id:<id>, users
  their bare user_id. Forward duplicates and the returned row order; SQL does not promise a sorted
  return. Even no touched rows calls evict_and_broadcast with an empty tuple. SQL, row-decoding or
  cache errors propagate without a local warning or retry; a decode/cache failure occurs after the
  statement has committed and cannot restore the arrays. There are no settings or stored secrets.


  Build the production model_allowlist_rename module in betterlite-server; reuse the typed dependencies
  listed in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules
  with adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/model_allowlist_rename_sync.py:
  _AllowlistTable.update_cte (L36-L41; 6 source lines), _team_cache_keys (L44-L45; 2 source lines), _key_cache_keys
  (L48-L49; 2 source lines), _org_cache_keys (L52-L53; 2 source lines), _project_cache_keys (L56-L57;
  2 source lines), _user_cache_keys (L60-L61; 2 source lines), _rewrite_sql (L75-L81; 7 source lines),
  sync_model_allowlists_for_renamed_model (L89-L109; 21 source lines).


  Add model_allowlist_rename under B856 Management::models for the five pure cache-key functions only;
  its Python adapter calls those pinned functions and Rust calls the production projection. Compare
  exact key tuples for empty/nonempty team alias, key hash, organization, project and user, including
  empty ids. Add a B171 helper_case seed. Stateful rename tests run against Postgres, using independently
  initialized pinned fixtures, not a helper adapter calling a route or replacing SQL with a fake.


  Execute the five-table CTE in B860 Postgres fixtures, selecting POSTGRES_TEST_URL first and
  testcontainers only when it is unset. Failed connection/startup is a test failure. Give each test
  its own cleaned schema and assert persisted arrays before inspecting ordered cache evictions.


  Also own _TouchedRow, _AllowlistTable fields and both SQL constants/table maps L22-L86, not just the
  callable ranges. The full file has 64 nonblank noncomment non-import lines including declarations and
  SQL construction. Estimate 100 implementation/SQL, 245 Postgres/behavior tests, 70 pure adapters and
  35 wiring lines, 450 within 500. postgres_pinned_rows has named cases equal_names, database_sibling,
  config_sibling, last_sibling, duplicate_old, existing_new, no_old, null_array, empty_array,
  literal_wildcard and quoted_name. postgres_failure_effects covers one_table_failure,
  bad_returned_row and eviction_failure; record SQL completion before cache calls.
