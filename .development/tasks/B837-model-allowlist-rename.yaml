  - tools/oracle/cases/helpers/model-allowlist-rename/empty-ids.yaml
deviations: []
out_of_scope:
  - B820 owns sibling detection and access-group changes; B835 and B840 own the calling rename routes and their write ordering.
  - No new untyped byte boundary; shared config/HTTP/row decoders remain with their named owners.
pitfalls:
  - 'The oracle helper for this task is pre-registered as model_allowlist_rename in the server group. Replace the stub Op in tools/oracle/src/helpers/server/model_allowlist_rename.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/model_allowlist_rename.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - Removing new_name before replacing old_name retains duplicate old-name positions as duplicate new-name grants.
  - A cache decoding or eviction error follows a committed CTE statement; rolling back the deployment rename here would invent atomicity.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
