dod:
  - text: Each regional chat policy is reached through a real proxy request, with all four aliases represented and provider-specific request rewrites compared.
    proof: [regional-chat-fixtures, oracle]
  - text: GigaChat token override, OAuth success and denial, structured output, native streaming and image failure agree with the pinned proxy.
    proof: [regional-chat-fixtures, oracle]
  - text: Missing and invalid proxy credentials are refused before provider I/O, with the source status and error fields.
    proof: [regional-chat-fixtures, oracle]
checks:
  optional: []
  commands:
    - id: regional-chat-fixtures
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/providers/regional-chat)"
        && for case in dashscope-cache-control qwencloud-brand-key qwen-platform-fallback ai21-options
        tencent-adaptive modelscope-text volcengine-thinking minimax-cache-control gigachat-tools-token
        gigachat-structured-output gigachat-stream gigachat-oauth gigachat-oauth-denied gigachat-image-failure
        proxy-no-key proxy-invalid-key; do test -f "tools/oracle/cases/providers/regional-chat/$case.yaml" || exit 1; done
      why: New files for every policy and failure path are required before the oracle can prove the integration.
