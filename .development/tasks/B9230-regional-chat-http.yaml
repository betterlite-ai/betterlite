id: B9230
title: Regional chat policies through the booted proxy
description: >-
  Add HTTP oracle coverage for the regional chat configurations that B8170, B8172,
  B8173, B8175 and B8177 currently prove through helpers. B8312 builds their executable
  bindings and already tests ordinary MiniMax and NLP Cloud chat. This task verifies
  the remaining transformations through that binding and B024's compatible-chat arm.
  Write only fixtures; an implementation failure belongs to the component named below.
  No provider, selector, configuration section or route is registered here. The source
  functions are already assigned, so this task owns zero additional LiteLLM logic
  lines; allow about 650 lines for the HTTP fixtures.

  Configure public model aliases in model_list, general_settings.master_key=sk-test,
  explicit model_info.id values and router_settings.num_retries=0. Send a fixed
  x-litellm-call-id. Put mock addresses in env values containing {{upstream}}, then
  reference them from deployment api_base with os.environ/NAME. Use the existing HTTP
  case format, including steps when useful, rather than a helper invoking a handler.
  The current oracle identifies an ordinary HTTP case by the absence of kind; do not
  put kind: http into a decoder that only accepts helper/websocket tags. The parity
  proof boots betterlite and LiteLLM, without --self-check. Compare upstream method,
  path, body and authorization/content-type/accept, response status and body, content-type,
  and stable x-litellm-* headers. Only generated ids, times and duration headers may
  receive narrow ignores; supplied usage remains significant. Error cases ignore
  /error/message because betterlite supplies its own text, retaining type, param and code.

  Distribute the successful calls across POST /v1/chat/completions, /chat/completions,
  /engines/{model:path}/chat/completions and
  /openai/deployments/{model:path}/chat/completions. Path models name configured aliases.
  dashscope-cache-control uses dashscope/qwen-plus with message and tool cache_control
  and reasoning_effort; qwencloud-brand-key uses qwencloud/qwen-plus with distinct
  QWENCLOUD_API_KEY and DASHSCOPE_API_KEY values; qwen-platform-fallback uses
  qwen_ai_platform/qwen-plus with only DASHSCOPE_API_KEY. Their bases come from
  DASHSCOPE_API_BASE, QWENCLOUD_API_BASE and QWEN_AI_PLATFORM_API_BASE respectively.
  These absent optional settings have no value; the policies' defaults remain
  https://dashscope.aliyuncs.com/compatible-mode/v1 for DashScope/Qianwen and
  https://dashscope-intl.aliyuncs.com/compatible-mode/v1 for QwenCloud. All fixture
  destinations are overridden to the local server.

  ai21-options uses ai21_chat/jamba-1.5-large, tools and max_completion_tokens, with
  an explicit base ending /studio/v1 and a configured key. modelscope-text uses
  modelscope/Qwen/Qwen3.5-35B-A3B, a text-only content list and an explicit /v1 base;
  the upstream text is concatenated without separators. tencent-adaptive uses
  tencent/minimax-m3, thinking={type: enabled, budget_tokens: 128} together with
  reasoning_effort=none, and an explicit base ending /v1/. The native body contains
  adaptive thinking with the integer budget, with no nested extra_body or separate
  reasoning_effort. volcengine-thinking uses volcengine/deepseek-v3-2-251201,
  max_completion_tokens and thinking={type: auto}, proving max_tokens and thinking
  reach the final JSON. minimax-cache-control uses minimax/MiniMax-M2.1 with
  reasoning_split and cache_control to extend B8312's simple chat checks.

  GigaChat fixtures use gigachat/GigaChat-2 and the configured GIGACHAT_API_BASE,
  whose production default remains https://gigachat.devices.sberbank.ru/api/v1.
  gigachat-tools-token sets GIGACHAT_ACCESS_TOKEN, supplies temperature=0, stop,
  tools and tool_choice=required, and receives a native function_call plus nonzero
  precached_prompt_tokens. The recorded request has top_p=0, no stop, functions and
  function_call=auto; the reply has tool_calls and adds cached tokens to prompt and
  total usage. Only the generated call id is ignored. gigachat-structured-output
  sends json_schema and checks that returned function arguments become content with
  finish_reason=stop. gigachat-stream supplies native SSE text and terminal function
  chunks, followed by [DONE], and compares the resulting OpenAI stream and usage.

  gigachat-oauth has no access token and sets GIGACHAT_AUTH_URL={{upstream}}/oauth,
  GIGACHAT_API_KEY and GIGACHAT_CREDENTIALS to distinguishable dummy credentials.
  Queue an OAuth response with access_token and a far-future expires_at, then the
  chat response: the harness supports multiple upstream answers. The first request
  is form-encoded scope=GIGACHAT_API_PERS with Basic authentication; the second uses
  Bearer authentication. Do not compare the random RqUID value. A companion
  gigachat-oauth-denied returns 401 from OAuth and queues no model answer.
  gigachat-image-failure supplies image URL data:image/png;base64,a and a valid
  text part; the one-character base64 payload fails decoding and must leave a successful
  text-only chat, with no files request. This checks the failure boundary without weakening the multipart
  comparator's treatment of generated filenames. A no-key case and an invalid-key
  case send no upstream traffic and exercise existing proxy authentication.
