checks:
  optional:
  - mutants
  commands:
  - id: case-chat-deployment-request
    why: The chat-deployment-request behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_call_cases::case_[0-9]+_chat_deployment_request$/)'
  - id: case-azure-v1-body-model
    why: The azure-v1-body-model behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_call_cases::case_[0-9]+_azure_v1_body_model$/)'
  - id: case-o-series-fake-stream
    why: The o-series-fake-stream behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_call_cases::case_[0-9]+_o_series_fake_stream$/)'
  - id: case-cross-deployment-auth
    why: The cross-deployment-auth behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::chat_call_cases::case_[0-9]+_cross_deployment_auth$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_chat_call.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_chat_call*")"
      && grep -lq 'azure_chat_call' tools/oracle/fuzz/corpus/helper_case/azure_chat_call* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_chat_call$/)' && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-azure/fuzz/corpus/azure_chat_call)"
      && grep -q 'decode_azure_chat_error' crates/betterlite-azure/fuzz/fuzz_targets/azure_chat_call.rs && cargo
      nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::replays_the_azure_chat_call_corpus$/)'
