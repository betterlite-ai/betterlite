id: B533
title: Azure chat execution and SDK error propagation
description: >-
  Implement Azure chat execution by composing B531 client construction, B532 model policy, B684 base request transforms,
  B004 response projection and B685 streams. The o-series handler only constructs the client and delegates to OpenAIChatCompletion.completion;
  B532 owns fake-stream selection and B685 owns content-filter exception mapping.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.__init__
  L137-L138; AzureChatCompletion.completion L196-L389; AzureChatCompletion.acompletion L391-L498. litellm/llms/azure/chat/o_series_handler.py:
  AzureOpenAIO1ChatCompletion.completion L23-L79.


  B685 owns streaming and content-filter error conversion; this slice delegates those branches instead of duplicating
  them.


  Named case contracts: missing_model_messages_422: A None model or messages raises AzureOpenAIError 422 (Missing
  model or messages); empty values do not trigger this guard. max_retries_default_two: Pop max_retries; missing
  or None uses DEFAULT_MAX_RETRIES from env DEFAULT_MAX_RETRIES, default 2; consume the count before constructing
  the request body. invalid_retries_422: Only the synchronous nonstream path validates max_retries as int and raises
  AzureOpenAIError 422 (max retries must be an int); preserve the source boolean-is-int edge. cloudflare_model_null:
  gateway.ai.cloudflare.com in api_base selects B531 Cloudflare client construction and sends model=None with messages
  and optional parameters. gpt5_base_model_selection: Use litellm_params.base_model or model to choose B532 GPT-5
  transformation, otherwise B684 Azure base transformation; Cloudflare takes precedence. json_mode_projection: Pop
  json_mode (default false), pass it as convert_tool_call_to_json_mode to B004 response projection, and inject nonempty
  caller headers into extra_headers. output_limit_recovery: Both raw-response send wrappers pass output-token-limit
  BadRequestError to B505 build_output_token_limit_response with the correct is_async flag; other BadRequestError
  values propagate. async_timeout_diagnostic: The async send wrapper appends timeout value and elapsed seconds rounded
  to two decimals to APITimeoutError; keep the exception class/status/type/param/code while ignoring message wording
  in the oracle. string_reply_500: A string SDK reply raises AzureOpenAIError 500 in sync and async buffered paths,
  with only its first 500 characters included in the diagnostic. client_type_validation: Sync requires AzureOpenAI
  or OpenAI and raises AzureOpenAIError 500 for a wrong client; async requires AsyncAzureOpenAI or AsyncOpenAI and
  its ValueError becomes AzureOpenAIError 500. error_status_passthrough: Sync wraps unknown failures as AzureOpenAIError
  with status_code default 500, body and headers (falling back to response.headers); async rethrows an error already
  carrying status_code and otherwise wraps status 500 with message/body. async_cancellation_passthrough: CancelledError
  is logged and re-raised, without being wrapped as AzureOpenAIError. o_series_client_delegate: Build the async/sync
  Azure client then forward every supplied option, organization, drop_params and shared_session to B004 completion;
  do not reimplement fake streaming in this handler. raw_headers_projection: Both sends use with_raw_response.create
  regardless of the stale docstring; preserve raw headers, and async also stores response_headers for logging and
  hidden_params.headers for conversion.


  Call B505 for both raw-send wrappers, including timeout diagnostics and output-limit recovery; no raw-send implementation
  remains in this task.


  Reuse B531 for the DEFAULT_MAX_RETRIES loader and its configured value; this consumer adds no second config field
  or loader test. The named behavior cases still test the configured value at this call boundary.


  Reuse B249 pre_call/post_call for the logging hooks invoked in the owned range; pass the source input, original
  response and additional_args in source order. This task owns the call site, not the logging implementation.


  Direct constructor/helper prerequisites used by this slice: B673. Reuse the named implementations; do not copy
  them at this call boundary.


  Implement crates/betterlite-azure/src/chat_call.rs with adjacent tests under chat_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_chat_call in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_call_cases in betterlite-azure with these exact named cases (one per oracle file):
  chat_deployment_request, azure_v1_body_model, cross_deployment_auth, missing_model_messages_422, max_retries_default_two,
  invalid_retries_422, cloudflare_model_null, gpt5_base_model_selection, json_mode_projection, output_limit_recovery,
  async_timeout_diagnostic, string_reply_500, client_type_validation, error_status_passthrough, async_cancellation_passthrough,
  o_series_client_delegate, raw_headers_projection. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_chat_call* using HelperCase: kind: helper
  and the externally tagged azure_chat_call variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_chat_call that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  SDK responses are parsed by B004 response projection and streams by B005/B685; pass their typed records and add
  no duplicate Azure byte decoder. B171 owns HelperCase parsing.


  Budget from 343 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 315 production lines, 220 behavior/config-test lines,
  120 combined Rust/Python adapter lines, 0 parser target/replay lines, 35 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 715 planned, 725 maximum changed lines.
