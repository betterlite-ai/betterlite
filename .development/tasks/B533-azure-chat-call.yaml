- text: 'chat deployment request: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-call/chat-deployment-request.yaml.'
  proof:
  - case-chat-deployment-request
  - oracle
  - helper-python
- text: 'azure v1 body model: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-call/azure-v1-body-model.yaml.'
