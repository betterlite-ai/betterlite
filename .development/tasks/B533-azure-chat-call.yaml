pitfalls:
- The send-wrapper docstrings mention return_response_headers, but both bodies unconditionally call with_raw_response.create.
- The sync exception wrapper and async status-bearing rethrow preserve different exception identities; collapsing
  them loses observable error metadata.
- None max_retries uses the environment-backed fallback here, whereas Azure text completion uses pop(max_retries,
  2) and rejects an explicit None.
