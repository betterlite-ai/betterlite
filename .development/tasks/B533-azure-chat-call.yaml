  - case-azure-v1-body-model
  - oracle
  - helper-python
- text: 'o series fake stream: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-call/o-series-fake-stream.yaml.'
  proof:
  - case-o-series-fake-stream
  - oracle
  - helper-python
- text: 'cross deployment auth: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-chat-call/cross-deployment-auth.yaml.'
