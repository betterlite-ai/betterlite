id: B533
title: Azure chat transport and content-filter errors
description: >-
  Implement Azure chat execution and response extraction by composing typed request preparation, shared OpenAI choice/stream
  decoding and Azure content-filter exception projection. Retain o-series fake streaming, content_filter_results
  metadata and safe response headers. SDK send wrappers share one async transport path; B017 owns retries and B018
  fallback.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/azure.py: AzureChatCompletion.__init__
  L137-L138; AzureChatCompletion.make_sync_azure_openai_chat_completion_request L140-L162; AzureChatCompletion.make_azure_openai_chat_completion_request
  L165-L194; AzureChatCompletion.completion L196-L389; AzureChatCompletion.acompletion L391-L498. litellm/llms/azure/chat/o_series_handler.py:
  AzureOpenAIO1ChatCompletion.completion L23-L79.


  B685 owns streaming and content-filter error conversion; this slice delegates those branches instead of duplicating
  them.


  Implement crates/betterlite-azure/src/chat_call.rs with adjacent tests under chat_call/. Keep each Rust module
  at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never
  imports betterlite-provider or betterlite-core. The production function is the only Rust implementation used by
  tests and oracle adapters.


  Register helper operation azure_chat_call in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_call_cases in betterlite-azure with these exact named cases (one per oracle file):
  chat_deployment_request, azure_v1_body_model, o_series_fake_stream, cross_deployment_auth. Each case exercises
  its named outcome independently; use stable supplied clocks/IDs and fixture transports. HTTP cases use the booted
  proxy and assert both client response and captured upstream request. Existing API tasks retain route registration;
  this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_chat_call* using HelperCase: kind: helper
  and the externally tagged azure_chat_call variant inside call. Do not put the Python stdin operation field in
  a HelperCase. Add oracle test helper_seeds_select_azure_chat_call that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  Outside-byte boundary: decode_azure_chat_error consumes buffered Azure chat error-body bytes in crates/betterlite-azure/src/chat_call.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-azure/fuzz/fuzz_targets/azure_chat_call.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-azure/fuzz/corpus/azure_chat_call.
  The adjacent test replays_the_azure_chat_call_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  Budget from 394 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 410 production lines, 81 behavior/config-test lines,
  71 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 642 planned, 650 maximum changed lines.
