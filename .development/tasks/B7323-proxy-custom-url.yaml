id: B7323
title: Build the proxy's public URL from PROXY_BASE_URL and the root path
description: >-
  Build LiteLLM's `get_custom_url` (proxy/utils.py L8310-L8339) and the two helpers only it uses, `join_paths` (L8287-L8307) and `get_proxy_base_url` (L8342-L8346). The proxy uses the result for the public URLs it hands out: SSO callbacks, login redirects, and the agent card url B4785 builds. Everything is a pure function over values passed in. Nothing here reads the environment outside the config crate, and nothing keeps global or per-request state.

  Config section, in crates/betterlite-config/src/sections/proxy_base_url.rs. `Settings { proxy_base_url: Option<String> }`. The value is the environment variable PROXY_BASE_URL, read through the same `EnvironmentLookup` the neighbouring section `request_root_paths` uses. Unset gives None. A variable that is set but empty gives Some("") and is not turned into None, because LiteLLM tests `is not None` and an empty value then replaces the request base URL with an empty string. The text is kept exactly as written: no trimming, no validation, no trailing slash change. (B4654's `normalize_proxy_base_url` is a different, stricter reader used for MCP URLs; do not call it here.) The key has no general_settings spelling in LiteLLM, so this section reads the environment only. Register the section the way `request_root_paths` is registered; the skeleton creates the stub and the sections.rs lines.

  Module `custom_url` in betterlite-server (crates/betterlite-server/src/custom_url.rs). Public functions:

  1. `join_paths(base_path: &str, route: &str) -> String`. Trim every trailing "/" from base_path and every leading "/" from route. Empty base_path: return "/" followed by route, or just "/" when route is empty too. Empty route: return the trimmed base_path. When the trimmed base_path already ends with "/" followed by the trimmed route, return base_path unchanged (the tail is not appended twice). Otherwise return base_path, "/", route.

  2. `get_custom_url(proxy_base_url: Option<&str>, request_base_url: &str, request_root_path: &str, route: Option<&str>) -> String`. base_url is proxy_base_url when it is Some (an empty string included), else request_base_url. When route is Some: if request_root_path is not empty, join_paths(join_paths(base_url, request_root_path), route); if it is empty, join_paths(base_url, route). When route is None: join_paths(base_url, request_root_path). `request_root_path` is the request's effective root path: the matched SERVER_ROOT_PATHS prefix, or the SERVER_ROOT_PATH scalar when no prefix matched. The server obtains it from B4200's `get_request_root_path(extensions, scalar_root)` (crates/betterlite-server/src/middleware/request_root_paths.rs); this task does not call that function, so it takes no dependency on the middleware.

  3. `CustomUrls`, a small value built once from the config section: `CustomUrls::new(proxy_base_url: Option<String>)` and `CustomUrls::custom_url(&self, request_base_url: &str, request_root_path: &str) -> String`, which is get_custom_url with route None, and `CustomUrls::custom_route_url(&self, request_base_url: &str, request_root_path: &str, route: &str) -> String` for the route form. They only forward to get_custom_url. This is the public name that B4785's `ProxyUrls` port (`custom_url(&self, request_base_url: &str) -> String`) is wired to. The port has no root path argument, so the server wiring (B074) implements `ProxyUrls` for a small per-request value that holds a `CustomUrls` reference and the request's root path, and calls `CustomUrls::custom_url`. That wiring is not built here.

  The functions cannot fail, so the module has no error enum. Python's runtime accident of raising AttributeError on a None argument is not copied: request_base_url is a str.

  Tests under `custom_url::tests` cover join_paths (empty base, empty route, both empty, slashes on both sides, tail already present, nested route), get_custom_url (PROXY_BASE_URL wins over the request base, empty PROXY_BASE_URL still wins, request base used when None, root path then route, root path only, no root path, request base already ending in the root path so nothing is doubled, root path "/" adds nothing) and CustomUrls forwarding. Config tests under `sections::proxy_base_url::` cover unset, set, and set but empty.

