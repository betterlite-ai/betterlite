dod:
  - text: join_paths trims slashes, handles an empty base or route, and does not append a route the base already ends with.
    proof: [url-tests, oracle]
  - text: get_custom_url prefers PROXY_BASE_URL (an empty value too) over the request base URL, then joins the request root path and the optional route.
    proof: [url-tests, oracle]
  - text: A request base URL that already ends in the request root path is not doubled, and a root path of "/" adds nothing.
    proof: [url-tests, oracle]
  - text: The proxy_base_url section reads PROXY_BASE_URL, with None when unset and Some("") when set but empty.
    proof: [config-tests]
  - text: CustomUrls is built from the section value and forwards to get_custom_url with and without a route.
    proof: [url-tests]

checks:
  optional: []
  commands:
    - id: url-tests
      why: join_paths, get_custom_url or CustomUrls behavior is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^custom_url::/)'
    - id: config-tests
      why: the PROXY_BASE_URL section is missing or does not keep an empty value
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::proxy_base_url::/)'

oracle_cases:
  - tools/oracle/cases/helpers/custom-url/join-paths.yaml
  - tools/oracle/cases/helpers/custom-url/proxy-base-with-root-and-route.yaml
  - tools/oracle/cases/helpers/custom-url/request-base-no-env.yaml
  - tools/oracle/cases/helpers/custom-url/root-path-without-route.yaml
  - tools/oracle/cases/helpers/custom-url/per-request-prefix-not-doubled.yaml

deviations:
  - what: get_custom_url takes the proxy base URL and the request root path as arguments instead of reading PROXY_BASE_URL and a ContextVar.
    why: betterlite keeps no globals and reads the environment only in the config crate. LiteLLM reads os.getenv and the per-request ContextVar inside the function.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/utils.py#L8310-L8339

out_of_scope:
  - "get_server_root_path, normalize_route_for_root_path and the middleware with get_request_root_path: B4200 (get_server_root_path is the scalar fallback it already owns)."
  - "Every other function in proxy/utils.py: B124 and the tasks split from it."
  - "The ProxyUrls port, the agent card url and the request base URL taken from the Host header: B4785."
  - "normalize_proxy_base_url and get_request_base_url, the stricter PROXY_BASE_URL reader for MCP and forwarded headers: B4654."
  - "Implementing ProxyUrls for a request and composing it into the app: the wave 17 proxy URL wiring part."

pitfalls:
  - join_paths only skips the append when the base ends with a slash plus the whole route, so a route "v1" is not appended to a base ending in "/v1" but is appended to one ending in "/xv1".
  - An empty PROXY_BASE_URL still counts as set, so the result is built from "" and starts with "/", not from the request base URL.
  - The root path is joined before the route, and a request base URL that already ends in the root path stays single because of the tail check in join_paths, so do not strip the root path from the base yourself.
  - With route None and an empty root path the result is the base URL with its trailing slashes removed, so "https://host/" becomes "https://host".
  - The scalar SERVER_ROOT_PATH is not read here; a caller that ran no SERVER_ROOT_PATHS middleware passes the scalar as request_root_path.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
