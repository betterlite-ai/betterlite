id: B4730
title: MCP temporary client execution and connection diagnostics
description: >-
  Build temporary-client execution with a deadline and user-friendly connection-error classification.
  Implement `_execute_with_mcp_client`, which creates a temporary MCP client from a request, runs an
  async operation within a timeout, and returns the result or a structured error response. Classify
  connection failures into specific categories (unreachable server, malformed headers, protocol errors,
  timeout, HTTP failures, network interruptions) with plain-language messages, returning an opaque
  reference ID (UUID) for unknown failures. Extract OAuth credentials from request payloads and condition
  static-preview-ID behavior on auth type: blank the server_id for auth types where credentials are
  supplied in the request (api_key, bearer_token, basic, authorization, token) and also for auth types
  None or MCPAuth.none; keep it for M2M and delegation modes so that saved server resolution does not
  override the submitted config. Suppress M2M OAuth caller-authorization headers (do not forward the
  incoming Authorization header when the server has client_id and client_secret). Preserve the one-shot
  presented-token store for interactive authorization_code preview: a just-authorized token is held in
  a temporary store, not persisted, so the preview uses it without touching the database. Never catch
  KeyboardInterrupt, SystemExit or asyncio.CancelledError. The timeout bounds OAuth discovery, connect,
  handshake and the operation combined; default timeout_seconds is 30.0 seconds (MCP_TOOL_LISTING_TIMEOUT,
  env LITELLM_MCP_TOOL_LISTING_TIMEOUT) and request.timeout-is-None fallback is 60.0 seconds
  (MCP_CLIENT_TIMEOUT, env LITELLM_MCP_CLIENT_TIMEOUT). When MCP protocol timeouts are involved,
  report the effective timeout (the minimum of request.timeout and timeout_seconds) instead of the
  timeout_seconds argument.
scope:
