    - crates/betterlite-server/src/pass_through_logging/anthropic_batch.rs
    - crates/betterlite-server/src/pass_through_logging/anthropic_batch/**
    - tools/oracle/cases/helpers/anthropic-batch-logging/**
    - "tools/oracle/fuzz/corpus/helper_case/anthropic_batch_logging-*"
    - tools/oracle/helpers/b3633.py
    - tools/oracle/helpers/b3633/**
    - tools/oracle/src/helpers/server/b3633.rs
    - tools/oracle/src/helpers/server/b3633/**
  lint_tables: false
