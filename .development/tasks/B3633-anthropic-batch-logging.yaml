dod:
  - text: A 200 response with an "id" on any route builds the in_progress record with cost 0.0, the "validating" batch, the unified object id and the call log updates, and the model name comes from request_body.model, then requests[0].params.model, then "unknown".
    proof: [batch-tests, batch-oracle]
  - text: The unified object id is URL-safe base64 without padding of "litellm_proxy;model_id:{id};llm_batch_id:{batch_id}", and an id equal to the model name gets the "anthropic/" prefix once.
    proof: [batch-tests, batch-oracle]
  - text: A non-200 status or a body without "id" gives the failed record "anthropic_batch" with the status text, and a body that does not parse or a transform error gives the error record; neither touches the call log.
    proof: [batch-tests, batch-oracle]
  - text: The managed object is registered only on the collection route, with the registrant defaults, B3630's tags and the done-callback log, and a missing registry or runtime only logs.
    proof: [batch-tests]
  - text: get_actual_model_id_from_router returns the first router id, or the name with the matching warning when the router is absent or has no id.
    proof: [batch-tests]
  - text: The helper adapter's Python passes the strict lint and type check.
    proof: [helper-python]
checks:
  optional: []
  commands:
    - id: batch-tests
      why: the batch creation handler, the registration or the router lookup are wrong, or have no tests
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^pass_through_logging::anthropic_batch::tests::batch_/)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b3633)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b3633 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b3633/pyrightconfig.json
    - id: helper-case-corpus
      why: new helper seeds are absent or do not replay through the shared helper-case parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/anthropic_batch_logging-*')" &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: batch-oracle
      why: newly added helper cases are absent, do not use the b3633 operation or disagree with LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/anthropic-batch-logging)" &&
        grep -rlE '^[[:space:]]+b3633:' tools/oracle/cases/helpers/anthropic-batch-logging &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/anthropic-batch-logging
oracle_cases:
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-top-level-model-id-scoped.yaml
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-nested-params-model.yaml
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-no-model-unknown-prefixed.yaml
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-model-already-prefixed.yaml
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-collection-route-no-hook.yaml
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-non-200-failed.yaml
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-200-without-id-failed.yaml
  - tools/oracle/cases/helpers/anthropic-batch-logging/create-empty-model-string.yaml
deviations:
  - what: The managed-object write goes through an injected ManagedBatchRegistry that is None in every betterlite deployment for now, so a create on the collection route logs the "Managed files hook not available" warning and registers nothing.
    why: LiteLLM's managed_files hook lives in the enterprise package and the oracle has none; the trait keeps the registration code and its tests ready for a later MIT store.
  - what: The text after "Error in batch_creation_handler:" and in the failed record's content and error field is the Rust error text (a serde_json or B587 transform error), not Python's exception text.
    why: Exception strings are runtime wording (docs/compatibility.md); the record shape and the failed state are the same.
  - what: A task panic or a missing Tokio runtime is reported through the same error log lines as a Python exception or a missing event loop.
    why: Rust has no asyncio task, and the join result carries the same facts.
out_of_scope:
  - "anthropic_passthrough_handler: B3634 owns it. It calls batch_creation_handler from here when the route contains /v1/messages/batches and the status is 200, and reads request_body from the argument or from kwargs first."
  - "optional_str, is_collection_route, request_tags_from_metadata and log_batch_registration_result: B3630 owns them in batch_attribution; this task only calls them."
  - "AnthropicBatchesConfig.transform_retrieve_batch_response and the batch record type: B587. Router.get_model_ids: B844. The per-call log: B247. The uuid helper and ANTHROPIC_BATCHES_ROUTE: B198."
  - "The managed_files hook and its store_unified_object_id implementation: enterprise only, not built."
  - "The Vertex copies of batch_creation_handler, _store_batch_managed_object and get_actual_model_id_from_router in vertex_passthrough_logging_handler.py: the Vertex logging tasks own them."
  - "Every other function in anthropic_passthrough_logging_handler.py: B3630, B3631, B3632 and B3634 own them."
pitfalls:
  - The success test is status 200 and the key "id" in the parsed body; a 201 or a body without "id" is the failed record even though the batch may exist upstream.
  - model_name starts as request_body["model"] or "unknown", so an empty string also becomes "unknown" and then the requests[0].params.model search runs.
  - The "anthropic/" prefix is added only when the router answer equals the model name, so a router id that differs from the name, even one without the prefix, is used as is.
  - The unified id string uses model_id first and llm_batch_id second, and the base64 is urlsafe with the trailing "=" removed.
  - store_batch_managed_object runs before the response record is built, so a failure there is logged and the record still reports in_progress.
  - The registrant user_id defaults to "default-user" only when the metadata key is absent, the role is "customer", and the tags come from request_tags_from_metadata, which may return none or an empty list.
  - The call log is written only on the success branch (model, "model" entry, "response_cost", "batch_id"); the failed and error branches leave it alone.
  - The batch stored in the registry has status "validating", while the result record says batch_job_state "in_progress".
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
