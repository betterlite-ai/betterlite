references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12510-L12803
  why: Own chunk generation and both complete handlers, beginning before all four route decorators.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L557-L559
  why: Audio response chunk size comes from this integer environment setting with default 8192.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L4325-L4373
  why: ProxyException stores code rather than status_code, explaining transcription's second wrapping to 500.
dod:
- text: >-
    audio_route_aliases sends {model:tts,input:hello,voice:alloy} to both speech aliases and multipart
    file=a.wav,model=whisper to both transcription aliases with Bearer sk-test. Expect 200 and one provider
    call per request: speech bytes 000102,transcription {text:Hello}. There are no /openai/v1 or deployment
    aliases. Omitted/invalid Bearer credentials with the master key configured give 401,auth_error,param="None",
    code="401" and zero upstream calls on every alias. Missing required transcription file gives FastAPI 422
    detail validation entries, not a provider call or an OpenAI error envelope.
  proof: [behavior-tests, oracle]
- text: >-
    audio_user_model_and_form fills user=u from the key for absent/null user but preserves user="". user_model=cli
    wins over speech body model. Transcription prefers cli,then moderation_model=moderator,then body=whisper,
    ignoring image_generation_model/completion_model for this choice. Repeated plain model=first then last
    keeps last silently; timestamp_granularities[]=word then segment preserves [word,segment]. Header call id
    call_audio beats body/form forged id. A hook/provider failure closes the named in-memory upload once.
  proof: [behavior-tests, oracle]
- text: >-
    speech_media_and_chunks returns upstream "audio/wav; charset=x" with requested mp3: client content-type
    is audio/wav and binary bytes are unchanged. application/octet-stream plus pcm uses audio/pcm; unknown
    requested format falls back to audio/mpeg. Callback content-type=audio/custom overrides that result.
    AUDIO_SPEECH_CHUNK_SIZE=3 passes 3 to the iterator; native observer sees chunks abc,def,g for bytes abcdefg.
    Default passes 8192. Disconnect after the first delivered chunk sends no later client bytes and releases
    the owned body; compare total bytes, not TCP packet boundaries or scheduler timing. Both routes overwrite
    a custom x-test header with callback x-test=callback and skip post_call_success_hook.
  proof: [behavior-tests, config-tests, oracle]
- text: >-
    transcription_response_formats requests json,verbose_json,text,srt,vtt in separate HTTP steps. Preserve
    the provider owner's returned text/words/segments shape and B004 response serialization, without adding
    public duration or converting SRT/VTT to an SSE stream. A mock text="Hello" and supplied subtitle documents
    retain their content byte-for-byte after the shared serialization. Additional hidden headers feed custom
    headers before callback overrides. Provider format decoding itself remains B515/B2453.
  proof: [behavior-tests, oracle]
- text: >-
    audio_error_shapes injects hook HTTPException(418,detail="blocked",headers={x:kept}): speech returns
    418,{detail:blocked},x=kept and x-litellm-call-id; transcription returns 418,{error:{type:"None",param:"None",
    code:"418",message:source detail}}. A generic ValueError gives 500,type="None",param="None",code="500".
    Speech ProxyException(code=403,type=permission_error,param=null) remains 403; transcription rewraps it to
    500 with permission_error,null,"500". Ignore only error.message wording. Native UploadFile filename=None
    produces source message "File name is None. Please check your file name",type=bad_request,param=file,
    final code="500"; ordinary multipart without filename is a FastAPI 422 before this unreachable HTTP branch.
    filename="" is not None. Do not require an impossible filename=None HTTP fixture.
  proof: [behavior-tests, oracle]
- text: >-
    compatibility_deviations sets model max_file_size_mb=1: native 1048576-byte uploads proceed and 1048577
    returns 400,bad_request,file,"400"; MIT LiteLLM rejects both through the premium helper and this route
    rewraps to 500,bad_request,file,"500". With no model limit, native 16777217 bytes returns 413,
    invalid_request_error,file,request_too_large before provider I/O; 16777216 is allowed. Nonpositive chunk
    settings fail native startup naming AUDIO_SPEECH_CHUNK_SIZE; the source merely accepts int(0)/int(-1).
  proof: [deviation-tests, config-tests]
- text: Public speech JSON and new chunk-size configurations have production parser seeds, and all unchanged route behavior has HTTP cases.
  proof: [parser-corpus, config-corpus, new-cases, oracle]
checks:
  optional: [mutants]
  commands:
  - id: behavior-tests
    why: Speech/transcription deliberately differ in error bodies, model precedence and binary delivery.
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core -p betterlite-config --no-tests=fail -E 'test(/^api::audio_routes::/) - test(/::replays_corpus$/)'
  - id: config-tests
    why: Chunk size must load through config and reach the speech iterator.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^api::audio_routes::tests::loads_settings($|::)/)'
  - id: deviation-tests
    why: Premium removal and finite limits require explicit native results, not false differential parity.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::audio_routes::tests::compatibility_deviations($|::)/)'
  - id: parser-corpus
    why: Speech JSON must be fuzzed through its production bounded decoder.
    run: test -f crates/betterlite-server/fuzz/fuzz_targets/audio_routes.rs && grep -qF decode_speech_request crates/betterlite-server/fuzz/fuzz_targets/audio_routes.rs && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/audio_routes)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::audio_routes::tests::replays_corpus$/)'
  - id: config-corpus
    why: New AUDIO_SPEECH_CHUNK_SIZE configurations must replay through the existing loader.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-config/fuzz/corpus/config_yaml/audio-routes-*)" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: new-cases
    why: All four authenticated routes require new gateway HTTP scenarios.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/audio-routes)"
oracle_cases:
- tools/oracle/cases/api/audio-routes/audio-route-aliases.yaml
- tools/oracle/cases/api/audio-routes/audio-user-model-and-form.yaml
- tools/oracle/cases/api/audio-routes/speech-media-and-chunks.yaml
- tools/oracle/cases/api/audio-routes/transcription-response-formats.yaml
- tools/oracle/cases/api/audio-routes/audio-error-shapes.yaml
deviations:
- what: Native model upload limits apply without premium; an oversized model upload returns 400 bad_request/file/code="400" while MIT LiteLLM's premium helper is rewrapped by this route to 500 bad_request/file/code="500". The unset-limit native 16 MiB cap returns 413 invalid_request_error/file/request_too_large.
  why: Preserve the current B1101 native upload policy and the architect's removal of paid-tier restrictions; bounded-inputs supplies the finite default.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12699-L12803
- what: AUDIO_SPEECH_CHUNK_SIZE=0 or a negative integer stops native startup with a configuration error naming the setting; LiteLLM accepts the integer and leaves iteration behavior to its binary response class.
  why: A positive finite chunk size is required by bounded-inputs and avoids an unbounded or invalid chunk iterator.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L557-L559
out_of_scope:
- B1101 owns get_form_data/check_file_size_under_limit; B1102 owns resolve_inference_model; B1103 request enrichment/error header helpers; B004 common processing/logging headers and B124 proxy hooks.
- B1083/B1084 own SDK speech, B1082 SDK transcription, B1003 MIME and B004 binary response iteration; other proxy_server.py functions stay with their route/service owners under B124's coverage.
- B1122 owns every base transcription contract function; none is part of route registration here.
pitfalls:
- Transcription uses moderation_model precedence, not completion_model, despite being an audio route.
- Transcription's missing-filename ProxyException becomes 500 because the outer catch reads status_code, which that exception lacks.
- Duplicate plain form fields overwrite silently; the previous warning expectation was not in get_form_data.
review_level: security
budget:
  max_changed_lines: 780
  max_new_expects: 0
