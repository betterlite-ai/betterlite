id: B083
title: Audio routes
description: >-
  Finish /audio/speech and /audio/transcriptions plus v1 aliases over B024 provider operations and B014. Bind source
  main.py speech/transcription call semantics and proxy_server.py route extraction to audio-file-input, subtitles
  and speech-chat-bridge; preserve JSON/text/SRT/VTT and binary streaming content types and cancellation.


  Register only /v1/audio/speech, /audio/speech, /v1/audio/transcriptions and /audio/transcriptions. Speech uses
  user_model over body model, user_id fills missing user, and resolve_speech_media_type selects media type. Transcription
  model resolution uses kind=moderation; missing filename is 400 bad_request param file. Speech re-raises HTTPException
  detail, while transcription wraps it in ProxyException. B1101 form extraction keeps the last repeated plain value
  and emits a warning. A speech-stream-disconnect case closes the downstream body after the first provider chunk
  and asserts upstream closure/no later body delivery.


  Provider behavior comes through B010 prepared operation/capability values; no provider umbrella is a scheduling
  dependency.


  Implement crates/betterlite-server/src/api/audio_routes.rs, crates/betterlite-core/src/api/audio_routes.rs. Use
  AudioRoutesInput and AudioRoutesResult with typed nested records; inject only the clock, repositories, transports
  and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce ambient
  environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/audio/speech; POST /audio/speech; POST /v1/audio/transcriptions;
  POST /audio/transcriptions. Each alias is exercised through the booted proxy. Every route factory is mounted once;
  a family composer mounts its child factories without re-registering their methods/paths.


  Route input projections: request.headers.x-litellm-call-id (absent None); data.response_format (absent None);
  data.model (absent None); data.user (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): proxy_server.py:12645 type=getattr(e, 'type', 'None'), param=getattr(e, 'param', 'None'),
  openai_code=getattr(e, 'code', None), code=getattr(e, 'status_code', 500); proxy_server.py:12702 code=status.HTTP_400_BAD_REQUEST,
  type='bad_request', param='file'; proxy_server.py:12640 status_code=e.status_code, exception_detail=FastAPI detail
  string; proxy_server.py:12787 type=getattr(e, 'type', 'None'), param=getattr(e, 'param', 'None'), code=getattr(e,
  'status_code', status.HTTP_400_BAD_REQUEST); proxy_server.py:12796 type=getattr(e, 'type', 'None'), param=getattr(e,
  'param', 'None'), openai_code=getattr(e, 'code', None), code=getattr(e, 'status_code', 500). Compare the actual
  source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions speech_binary_route, transcription_multipart, verbose_json_transcription,
  srt_transcription, vtt_transcription, speech_stream_disconnect, missing_filename_400, speech_user_model, transcription_moderation_model,
  duplicate_form_last_wins, speech_http_detail, transcription_proxy_error, route_aliases, auth_missing, auth_invalid
  under api::audio_routes::tests. Each named function drives production code and asserts its case result; use named
  rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.AUDIO_SPEECH_CHUNK_SIZE
  defaults to 8192 bytes. No environment reads occur outside betterlite-config. Test api::audio_routes::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  The production external-byte decoder is betterlite-server::api::audio_routes::decode_audio_routes(bytes: &[u8],
  limits: &ApiLimits), for orjson.loads input body at litellm/proxy/proxy_server.py:12548. Place its implementation
  in crates/betterlite-server/src/api/audio_routes.rs and call it from the actual boundary. The cargo-fuzz target
  crates/betterlite-server/fuzz/fuzz_targets/audio_routes.rs passes arbitrary bounded bytes to that exact decoder;
  api::audio_routes::tests::replays_corpus replays newly committed seeds through the same function. Transform-only
  helpers reuse the already decoded records.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/proxy_server.py: audio_speech (L12532-L12652); litellm/proxy/proxy_server.py:
  audio_transcriptions (L12665-L12803). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 229 owned nonblank/non-comment/non-docstring Python lines (237 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 249 implementation,
  130 behavior tests, 180 oracle fixtures, 0 Rust/Python adapters, 60 decoder fuzz/replay, 33 config tests/seeds
  and 38 wiring; 690 total within the 690-line cap. The estimate includes tests and adapters, not just production
  code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B900 (Multipart oracle), B1001 (Audio file input), B1002 (Audio
  subtitles), B1003 (Speech chat bridge), B1082 (Transcription call), B1084 (Speech call), B1087 (Api boundaries),
  B1101 (Shared multipart and form extraction), B1102 (Request model and destination policy), B1103 (Authenticated
  request preparation), B732 (Typed authentication principals and grant resolution), B1137 (Request intake and safe
  snapshots), B003 (HTTP server, health routes and master key auth), B756 (Authentication header selection and mode
  dispatch), B002 (Load LiteLLM config.yaml into typed config), B1139 (Stateful HTTP oracle scenarios). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
