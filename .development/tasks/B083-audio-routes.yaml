id: B083
title: Speech and transcription HTTP routes
description: >-
  Register POST /v1/audio/speech,/audio/speech,/v1/audio/transcriptions,/audio/transcriptions once in
  betterlite-server::api::audio_routes. Own audio_speech,audio_transcriptions and the complete
  _audio_speech_chunk_generator immediately before their decorators. B014 dispatches aspeech/atranscription
  to B1083/B1082. B756 authenticates, B1103 enriches request data and supplies shared error helpers, B004
  resolves/logs call ids and custom response headers, B124 executes hooks and schedules status updates.

  Speech parses JSON and merges the trusted x-litellm-call-id over any body id. Transcription gets B1101's
  ordered form data, removes file, then merges the trusted id. Both fill user from authenticated user_id only
  for absent/null user; empty string is preserved. Speech truthy user_model overrides body model. Transcription
  intentionally uses kind=moderation: user_model, general_settings.moderation_model,body model. It checks file
  size before reading, wraps bytes in a buffer named from UploadFile.filename, and closes that buffer in finally
  around the pre-call hook and provider call, before scheduling success and building response headers.

  Speech pre-call type is aspeech; transcription is transcription, with route_type=atranscription. Neither
  handler invokes post_call_success_hook. Both run response-header hooks after custom headers and permit callback
  overwrites. Speech MIME comes from B1003 using upstream content-type when the response is binary, otherwise
  requested string response_format or audio/mpeg; an explicit callback content-type still wins in StreamingResponse.
  Chunk iteration passes AUDIO_SPEECH_CHUNK_SIZE, integer default 8192. The source may already have buffered the
  provider response: test downstream delivery/cancellation, not an invented live upstream streaming contract.

  Speech preserves ProxyException, preserves HTTPException detail/status/headers, and otherwise wraps with
  absent type/param literal "None" and code default 500. Transcription wraps HTTPException into ProxyException
  and also re-wraps ProxyException through its generic branch: since ProxyException has code but no status_code,
  a helper's 400 becomes HTTP 500 with retained type/param. Keep this source distinction except the explicit
  upload-limit deviation below. Error.code is the final stringified status; openai_code is not serialized.

  decode_speech_request(bytes,limits) is the bounded JSON-object boundary; fuzz/replay malformed,nonobject and
  UTF-8 inputs there. Multipart decoding/numeric policy remains B1101. Config tests load AUDIO_SPEECH_CHUNK_SIZE
  unset=8192 and positive override=3; invalid int text follows config error policy. Native zero/negative values
  are rejected at startup under bounded-inputs as recorded below. Count 243 nonblank/non-comment lines for
  the three methods/decorators; budget 230 implementation,180 tests,210 HTTP fixtures,65 fuzz/config and 45 wiring,
  730 total. Cases boot both gateways with master_key=sk-test and isolated B1139/B856 virtual-key fixtures.
