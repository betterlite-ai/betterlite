id: B940
title: Cursor responses compat
description: >-
  Implement Cursor model variant parsing, tool envelope normalization and Cursor chat/models compatibility routes
  around B014 and Responses services. Resolve model variants before auth without authorizing a new model, and keep
  the explicit tool dialect decision in a typed enum.


  Implement crates/betterlite-server/src/api/cursor_responses_compat.rs, crates/betterlite-core/src/api/cursor_responses_compat.rs.
  Use CursorResponsesCompatInput and CursorResponsesCompatResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: GET /cursor/models; GET /cursor/v1/models; POST /cursor/chat/completions.
  Each alias is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts
  its child factories without re-registering their methods/paths.


  Route input projections: data.tools (absent None); data.tool_choice (absent None); data.messages (absent None);
  data.model (absent None); data.reasoning (absent None).


  Write adjacent tests.rs behavior functions cursor_thinking_model, cursor_model_not_served, nested_tool_dialect,
  chat_body_detection, cursor_stream_response, route_aliases, auth_missing, auth_invalid under api::cursor_responses_compat::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/response_api_endpoints/endpoints.py: _convert_tool_payload_value (L77-L86);
  litellm/proxy/response_api_endpoints/endpoints.py: _convert_tool_envelope (L89-L105); litellm/proxy/response_api_endpoints/endpoints.py:
  _normalize_tool_dialect (L108-L120); litellm/proxy/response_api_endpoints/endpoints.py: _is_chat_completions_body
  (L123-L127); litellm/proxy/response_api_endpoints/endpoints.py: _parse_cursor_model_variant (L140-L145); litellm/proxy/response_api_endpoints/endpoints.py:
  _router_can_serve (L148-L155); litellm/proxy/response_api_endpoints/endpoints.py: _resolve_cursor_model_variant
  (L158-L179); litellm/proxy/response_api_endpoints/endpoints.py: _resolve_cursor_model_variant_before_auth (L182-L191);
  litellm/proxy/response_api_endpoints/endpoints.py: cursor_model_list (L471-L485); litellm/proxy/response_api_endpoints/endpoints.py:
  cursor_chat_completions (L496-L674). Abstract/protocol declarations map to native types and synchronous/async
  wrappers share one implementation; a partial function span is the explicit preparation/transition stage described
  above, with typed values passed to the following stage.


  Sizing: 226 owned nonblank/non-comment/non-docstring Python lines (271 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 246 implementation,
  88 behavior tests, 96 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 468 total within the 470-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B302 (Deployment catalog, aliases and wildcard routes), B368 (Transactional
  deployment catalog updates), B919 (Response chat result), B932 (Responses create call), B1087 (Api boundaries),
  B1100 (Shared request body decoding), B732 (Typed authentication principals and grant resolution), B855 (Authenticated
  request admission and budget handoff), B756 (Authentication header selection and mode dispatch), B003 (HTTP server,
  health routes and master key auth), B1139 (Stateful HTTP oracle scenarios), B856 (Management oracle namespaces
  and Postgres test fixture). These are callable/type/config owners, not provider-family umbrellas; the external
  B500-B859 ids retain ownership on the provider and keys/data branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
