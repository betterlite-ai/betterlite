id: B940
title: Cursor responses compat
description: >-
  Implement the Cursor compatibility helpers and the three routes in
  litellm/proxy/response_api_endpoints/endpoints.py. GET /cursor/models and GET
  /cursor/v1/models require the normal user_api_key_auth dependency and delegate
  to B007's model_list, preserving its {"object": "list", "data": [...]} body.
  Query strings such as ?scope=expand&healthy_only=true are not parameters of
  cursor_model_list and are ignored rather than forwarded to model_list.
  POST /cursor/chat/completions has the dependencies
  _resolve_cursor_model_variant_before_auth followed by user_api_key_auth and
  accepts either a chat body or a Responses body. The route has no query
  parameters and adds no configuration keys, environment variables, database
  writes, or warning-and-drop behavior.

  Preserve the exact pure-helper contract. _TOOL_PAYLOAD_KEYS recognizes only
  "custom" with name, description, format and "function" with name, description,
  parameters, strict; _EMPTY_TOOL_PAYLOAD is {}. Convert only dict values under
  the key "format". For to_chat=true, a flat grammar format
  {"type": "grammar", "definition": D, "syntax": S} becomes
  {"type": "grammar", "grammar": {"definition": D, "syntax": S}}; for
  to_chat=false the nested grammar becomes flat. Text formats and unknown format
  values pass through. A recognized envelope takes its payload from the nested
  "custom" or "function" dict when it is a dict, otherwise from top-level
  fields; nested fields win, and an envelope without "name" is returned
  unchanged. to_chat=true emits {"type": T, T: payload}; to_chat=false emits
  {"type": T, **payload}. Non-dicts, unknown types, malformed sentinels such
  as "auto", "required", "none", None and 42, and entries without a name pass
  through unchanged. Normalize both the "tools" list and "tool_choice" when
  present, but never invent either key; return the original body when neither
  field changes.

  _is_chat_completions_body is true when messages is a non-empty list, or when
  the body contains the "messages" key and does not contain "input". Thus
  messages=[] or messages=None without input is chat, while messages=[] or
  messages=None with input is Responses. _parse_cursor_model_variant removes
  one trailing "-fast", then recognizes the final "-thinking-" suffix only for
  REASONING_EFFORT values "none", "minimal", "low", "medium", "high",
  "xhigh" and "max"; it returns the stripped base and an optional effort.
  _router_can_serve returns false for a missing router and true only for an
  is_recognized_model result, a team_public_model_names member, or a matching
  pattern_router.get_pattern result. Resolve a variant only when the requested
  model is a string not already served and its base is served. For chat bodies,
  add reasoning_effort only when the key is absent; for Responses bodies merge
  effort into reasoning unless reasoning is a dict with a truthy existing
  effort. A bare -fast variant adds no effort. The pre-auth dependency reads the
  body, silently returns on json.JSONDecodeError or ProxyException, and writes
  the resolved body into the request parsed-body cache before auth sees it.

  In cursor_chat_completions, a chat body is normalized with to_chat=true and
  delegated to B004's chat_completion with model=None. A Responses body is
  copied with every "stream_options" key removed, normalized with to_chat=false,
  and sent through ProxyBaseLLMRequestProcessing.base_process_llm_request with
  route_type="aresponses". Its cursor_data_generator transforms any response
  having __anext__ through B919's Responses-to-chat iterator with
  sync_stream=False and json_mode=False, CustomStreamWrapper's
  custom_llm_provider=None, model=request_data.get("model", ""), and
  logging_obj=request_data.get("litellm_logging_obj"); non-async responses use
  async_data_generator directly. A non-streaming ResponsesAPIResponse is
  transformed with messages=processor.data.get("input", []),
  optional_params={}, litellm_params={}, encoding=None, api_key=None and
  json_mode=None; an already transformed result is returned unchanged. All
  exceptions from processing go to B014's _handle_llm_api_exception.

  Implement crates/betterlite-server/src/api/cursor_responses_compat.rs and
  crates/betterlite-core/src/api/cursor_responses_compat.rs with typed
  CursorResponsesCompatInput and CursorResponsesCompatResult records. Inject
  clock, repositories, transports and resolved settings through constructors;
  reuse ApiLimits from B1087 and do not add ambient environment or duplicate
  auth/config resolution. Register exactly GET /cursor/models, GET
  /cursor/v1/models and POST /cursor/chat/completions once each. Test pure
  transformations in native behavior tests, and test every route and provider
  call through the booted HTTP oracle with a mock provider.
scope:
  paths:
  - crates/betterlite-server/Cargo.toml
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/error.rs
  - crates/betterlite-server/src/api/cursor_responses_compat.rs
  - crates/betterlite-server/src/api/cursor_responses_compat/**
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api/cursor_responses_compat.rs
  - crates/betterlite-core/src/api/cursor_responses_compat/**
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - Cargo.toml
  - Cargo.lock
  - tools/oracle/cases/api/cursor-responses-compat/**
  - tools/oracle/fixtures/cursor-responses-compat/**
  lint_tables: false
