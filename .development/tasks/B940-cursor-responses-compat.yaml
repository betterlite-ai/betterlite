dod:
- text: 'tool envelope conversion: custom {type:"custom",name:"ApplyPatch",format:{type:"text"}} and function {type:"function",name:"read_file",parameters:{type:"object"}} become nested under custom/function for to_chat=true; nested inputs flatten for to_chat=false, nested fields win, missing name and unknown/scalar entries remain byte-for-byte unchanged, and flat grammar {type:"grammar",definition:"start: patch",syntax:"lark"} becomes the nested grammar object.'
  proof: [case-tool-envelope]
- text: 'body detection: messages=[{role:"user"}] is chat even with input, messages=[] or null without input is chat, messages=[] or null with input is Responses, input-only and empty bodies are Responses, and absent tools/tool_choice are not invented.'
  proof: [case-body-detection]
- text: 'variant parsing and resolution: claude-opus-5-thinking-xhigh-fast resolves to model claude-opus-5 and xhigh, claude-opus-5-fast resolves only to claude-opus-5, existing reasoning_effort:"low" or reasoning.effort:"low" wins, and recognized, team-public, pattern, unserved-base, no-router, missing and non-string models remain unchanged.'
  proof: [case-variant-resolution]
- text: 'pre-auth resolution: a served claude-opus-5-thinking-high request is cached as model claude-opus-5 with its inferred effort before auth reads it, while malformed JSON and ProxyException from the body reader are swallowed by the dependency and leave auth processing to its owner.'
  proof: [case-pre-auth]
- text: 'GET /cursor/models and GET /cursor/v1/models: with a valid key and one configured gpt-4o model, each returns HTTP 200 with object "list" and the same ordered data as B007; ?scope=expand&healthy_only=true is ignored; missing or invalid credentials return HTTP 401 with auth_error, param="None" and code="401" without provider traffic.'
  proof: [case-model-routes, oracle]
- text: 'POST /cursor/chat/completions chat arm: a valid messages body reaches B004 with the exact messages, converts flat custom/function tools and tool_choice to nested chat shapes, and a mock completion returns HTTP 200 chat.completion JSON with no Responses output field.'
  proof: [case-chat-arm, oracle]
- text: 'POST /cursor/chat/completions Responses arm: input=[{role:"user",content:"hello"}] with stream_options:{include_usage:true} removes only stream_options before the aresponses provider call, flattens nested custom/function tools, and converts a successful ResponsesAPIResponse to HTTP 200 chat.completion JSON.'
  proof: [case-responses-arm, oracle]
- text: 'POST /cursor/chat/completions streaming: an async Responses event iterator is converted with sync_stream=false and json_mode=false and returns HTTP 200 text/event-stream chat chunks, never raw response.* events; a non-async response uses the default async_data_generator.'
  proof: [case-stream-arm, oracle]
- text: 'POST /cursor/chat/completions auth: absent Authorization and Bearer sk-invalid each return HTTP 401 auth_error, param="None", code="401" before model routing or mock-provider traffic; all three registered paths use the same auth result.'
  proof: [case-auth, oracle]
- text: 'POST /cursor/chat/completions budget ordering: an exhausted model_max_budget for claude-opus-5 rejects claude-opus-5-thinking-high as HTTP 422 budget_exceeded with the message containing "exceeded budget for model=claude-opus-5", code="422", and no provider request because auth receives the base model.'
  proof: [case-budget, oracle]
- text: Every listed HTTP fixture sends one request through each named alias where applicable and compares status, error type/param/code, selected headers, exact mock-provider requests, response body and ordered stream output against independent LiteLLM and betterlite processes.
  proof: [oracle, new-oracle-cases]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The cursor compatibility production tests or one of the two scoped crates is missing its required behavior.
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::cursor_responses_compat::/) - test(/::replays_corpus$/)'
  - id: case-tool-envelope
    why: The exact custom/function/grammar conversion matrix or pass-through behavior is absent.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::tool_envelope($|::)/)'
  - id: case-body-detection
    why: A messages/input combination selects the wrong provider pipeline or invents tool fields.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::body_detection($|::)/)'
  - id: case-variant-resolution
    why: A Cursor suffix, reasoning precedence branch, or router-served guard is wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::variant_resolution($|::)/)'
  - id: case-pre-auth
    why: Auth sees the original model or malformed-body handling changes before the route runs.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::pre_auth($|::)/)'
  - id: case-model-routes
    why: One Cursor model-list alias fails to delegate the authenticated B007 response.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::model_routes($|::)/)'
  - id: case-chat-arm
    why: A messages body reaches the wrong pipeline or its upstream tool request is not normalized.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::chat_arm($|::)/)'
  - id: case-responses-arm
    why: The Responses body retains stream_options, sends the wrong tool dialect, or returns Responses JSON to Cursor.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::responses_arm($|::)/)'
  - id: case-stream-arm
    why: An async Responses stream leaks raw events or loses the chat SSE framing.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::stream_arm($|::)/)'
  - id: case-auth
    why: A protected Cursor route admits missing or invalid credentials or calls a provider before rejecting them.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::auth($|::)/)'
  - id: case-budget
    why: A suffixed model bypasses the base model budget check or reaches the provider after rejection.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::cursor_responses_compat::tests::budget($|::)/)'
  - id: new-oracle-cases
    why: The branch has no newly added Cursor HTTP parity fixtures.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/cursor-responses-compat)"
