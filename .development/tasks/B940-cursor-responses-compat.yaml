deviations: []
out_of_scope:
- 'litellm/proxy/response_api_endpoints/endpoints.py: B080 owns responses_api and its decorators/body processing L194-L458; B938 owns get_response L695-L790, delete_response L811-L899, get_response_input_items L920-L970 and cancel_response L1216-L1313; B939 owns compact_response, token counting and responses_input_tokens L988-L1198; B941 owns the WebSocket helpers and responses_websocket_endpoint L1316-L1620.'
- 'litellm/proxy/proxy_server.py: B007 owns model_list L11545-L11784; this task only owns cursor_model_list L471-L485 and its two aliases, so model-list filtering, query defaults and model entry construction are not copied.'
- 'litellm/proxy/proxy_server.py: B004 owns chat_completion L11952-L12102; B014 owns ProxyBaseLLMRequestProcessing.base_process_llm_request and _handle_llm_api_exception; B932 owns the aresponses call reached through responses_api_bridge; B919 owns the ResponsesAPIResponse transform and handler get_model_response_iterator.'
- 'litellm/proxy/common_utils/http_parsing_utils.py: B1100 owns _read_request_body and _safe_set_request_parsed_body; malformed JSON/form status and request cache storage stay with that decoder.'
- 'litellm/proxy/auth/user_api_key_auth.py: B732, B756 and B855 own user_api_key_auth, credential extraction, authorization, model grants, budgets and their public error mapping; B940 owns only the dependency ordering and model-body rewrite before that call.'
- 'litellm/router.py: B302 owns is_recognized_model, team_public_model_names and pattern_router catalog lookup; B940 only applies those booleans to Cursor suffix resolution. B368 owns catalog mutation and is not called by this range.'
- 'litellm/litellm_core_utils/prompt_templates/common_utils.py: B216 owns convert_custom_tool_format_to_chat_shape and convert_custom_tool_format_to_responses_shape; B940 owns invoking them for Cursor envelopes, not the shared converter implementation.'
- 'Provider execution, response object definitions, stream event decoding, database repositories and Python package/event-loop facades belong to their existing provider, response, storage and B158-B161 tasks; the oracle never installs litellm-enterprise.'
pitfalls:
- 'The predicate treats messages=[] or messages=None as chat only when input is absent; adding a truthiness check without the key/input test routes Cursor agent bodies to the wrong pipeline.'
- 'Nested custom/function payload fields override stray top-level fields, but an empty nested dict falls back to top-level name/format; dropping either rule changes the upstream tool body.'
- 'A pre-nested envelope with a flat grammar format still needs grammar conversion; checking only the outer envelope shape leaves {type:"grammar",definition:"start: patch",syntax:"lark"} in the wrong dialect.'
- 'The Responses arm rebuilds body_without_stream_options because mutating the request-scope parsed-body dict deletes keys for later readers; the chat arm must retain stream_options.'
- 'The resolver must run before user_api_key_auth: otherwise claude-opus-5-thinking-high is authorized as a different model and can bypass the base model budget or grant check.'
- 'The stream branch checks __anext__ rather than a concrete iterator class because router wrappers are async iterables; class-only detection leaks response events instead of chat chunks.'
review_level: security
budget:
  max_changed_lines: 560
  max_new_expects: 0
