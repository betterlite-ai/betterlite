pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_invoke_primitives in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/invoke_primitives.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_invoke_primitives.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The computed proxy_endpoint_url is not the return value of get_complete_url.
- The Bedrock template branch is outside the later factory fallback catch.
