id: B9753
title: Exercise template selection, competitor enrichment and installation from the policy page
description: >-
  Test the requests made by PolicyTemplates, TemplateParameterModal, AiSuggestionModal and
  GuardrailSelectionModal through the booted proxy. Their source and networking functions
  arrive unchanged in B9090's archive; write only HTTP cases here. B3253 owns catalog and
  suggestion handlers, B3252 the two enrichment handlers, B3249 preview, B3685 guardrail
  creation and B3248 policy creation. B8790 mounts catalog/suggestion/preview; B9321 mounts
  B3252's existing router and supplies its production CompetitorModelClient. Do not
  build another enrich route or substitute a fake client for the production router wiring.

  GET /policy/templates has no body or query and returns an array, not templates[]. Cards
  read id,title,description,icon,iconColor,iconBg,guardrails,complexity,tags and inherits;
  selection also consumes guardrailDefinitions,templateData,parameters,llm_enrichment,
  example_sentences and estimated_latency_ms. Set LITELLM_LOCAL_POLICY_TEMPLATES=true in
  deterministic cases and reuse B8790's catalog case. The product's default remains the
  empty env value, remote catalog fetch and local fallback owned by B3253. Model pickers
  GET /model_group/info without query and read data[].model_group; reuse B9735's case.

  Suggestion POST /policy/templates/suggest sends attack_examples with blank entries
  filtered out, description and the selected model. Nonblank examples retain surrounding
  whitespace. Read selected_templates[].template_id/reason and explanation, then join the
  selected IDs to the catalog locally. B8790's valid-and-unknown-id case already plans this
  request shape and its unknown-ID filtering; reuse it. No suggestion case currently exists
  on disk. The SDK suggestion model takes an accepted openai/<model> name with OPENAI_API_KEY
  and OPENAI_API_BASE pointed at the local oracle provider, as the owner specifies; never use
  a real external model or assume this SDK path resolves an arbitrary router-only alias.

  Template confirmation POST /policy/templates/enrich sends template_id, parameters as a
  string map, model only when nonempty and competitors whenever supplied, including [].
  The page reads guardrailDefinitions and competitors, substitutes the form parameters in
  the template and opens the guardrail chooser. Add a competitor-mention-detection case
  with parameters:{brand_name:"Acme"}, explicit competitors, and a selected local model,
  then use its actual definitions in preview and installation requests. B9324 owns the
  given-competitors, discovery, auth and validation HTTP cases; reuse those paths below
  rather than copying their single-request variants. A second case sends the explicit empty
  competitors list from the form and proves that discovery still occurs, with model omitted
  only in the variant where the page has no selected model. The omitted model is
  gpt-4o-mini; configure that exact deployment against the mock when it is needed.

  Discovery/refinement POST /policy/templates/enrich/stream sends template_id,parameters,
  model, plus instruction only when nonempty and competitors when existingCompetitors was
  supplied. TemplateParameterModal trims the refinement instruction. The response is SSE:
  data events type=competitor supply name, type=status supplies message, type=done supplies
  competitors,competitor_variations,guardrailDefinitions, and type=error supplies message.
  The page consumes no OpenAI choices delta or [DONE] sentinel. Reuse the stream-discovery,
  stream-given-competitors, stream-refinement and stream-no-router-error cases B9324 owns
  (moved there from B3252), comparing
  event order, Cache-Control, X-Accel-Buffering and content-type. Add the missing generic
  competitor-template transcript that streams names, refines the current selection and
  previews the resulting definitions. Keep local provider deltas deterministic and exercise
  actual route SSE, not the helper that parses name fragments. The browser consumer is
  exercised by B148; no decoder or fuzz target is introduced in this case-only task.

  Preview POST /policy/templates/test sends {guardrail_definitions:<selected definitions>,
  text:<test input>}. Read results[].guardrail_name,action,output_text,details and
  overall_action. Existing B8790 preview cases cover empty definitions and unsupported
  providers, not a supported content-filter template. Add passed/blocked preview cases for
  enriched names and a local supported redaction definition, comparing the transformed text
  as well as the action. Preserve definition order. This does not invoke a completion route.

  Installation first GETs /v2/guardrails/list (fallback /guardrails/list) to collect existing
  guardrail_name values, then independently POSTs /guardrails with {guardrail:<each selected
  definition>}, refreshes that list and opens the prefilled policy form. The final POST
  /policies has templateData.policy_name, description, guardrails_add and guardrails_remove
  after the user's edits, followed by GET /policies/list. Writes ignore their response bodies
  except fixture captures; lists prove persisted fields. Cover one existing guardrail that
  is not selected again and one failed selected creation followed by a successful creation,
  retaining the partial-success result rather than inventing rollback. B8667/B8669 own these
  mounted APIs; database.seed.dashboard: {} selects B9740's independent schema. These
  cross-route requests, the explicit empty
  competitor list and supported previews are the missing HTTP coverage, about 550 authored
  lines. Compare status, headers, stable fields and error metadata using per-gateway captures
  for generated values only. Bearer auth uses discovery's header name, default Authorization.
scope:
