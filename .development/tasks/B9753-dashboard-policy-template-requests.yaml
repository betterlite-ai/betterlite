  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_endpoints.py#L335-L437
    why: B3685's wrapped guardrail create, used once per chosen template definition.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/policy_engine/policy_endpoints.py#L153-L214
    why: B3248's final policy save; this task never installs a template atomically.
dod:
  - text: Catalog and model picks feed the actual suggestion and enrichment bodies, including explicit empty competitors and stream refinement.
    proof: [template-transcripts, oracle]
  - text: Supported template previews expose action and transformed text and selected definitions can be saved through the real guardrail and policy routes.
    proof: [template-transcripts, oracle]
checks:
  optional: []
  commands:
    - id: template-transcripts
      why: Reused catalogs and error cases alone cannot prove selected templates reach preview and persistence.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/policy-templates)"
oracle_cases:
  - tools/oracle/cases/ui/policy-templates/generic-enrich-preview-and-install.yaml
  - tools/oracle/cases/ui/policy-templates/explicit-empty-competitors.yaml
  - tools/oracle/cases/ui/policy-templates/generic-stream-refine-and-preview.yaml
  - tools/oracle/cases/ui/policy-templates/supported-preview-actions.yaml
  - tools/oracle/cases/ui/policy-templates/existing-and-partially-created-selection.yaml
  - tools/oracle/cases/policies/templates-catalog/local-true.yaml
  - tools/oracle/cases/policies/templates-suggest/valid-and-unknown-id.yaml
  - tools/oracle/cases/policies/templates-enrich/given-competitors-with-variations.yaml
  - tools/oracle/cases/policies/templates-enrich/discovery-from-model.yaml
  - tools/oracle/cases/policies/templates-enrich/stream-discovery.yaml
  - tools/oracle/cases/policies/templates-enrich/stream-given-competitors.yaml
  - tools/oracle/cases/policies/templates-enrich/stream-refinement.yaml
  - tools/oracle/cases/policies/templates-enrich/stream-no-router-error.yaml
  - tools/oracle/cases/ui/management-selectors/model-groups-for-router-fallbacks.yaml
deviations: []
out_of_scope:
  - All functions and tests in these UI files are retained by B9090; template orchestration in index.tsx is retained under B9752's covers and its template HTTP contracts are assigned here.
  - B3252 owns competitor parsing, generation and both enrich routes; B3253 owns catalog and AI suggestion; B3249 owns preview; B8790/B9321 own production composition.
  - B3685/B8667 and B3248/B8669 own installation writes. B9752 covers ordinary policy editing and B148 runs the retained template controls in Chromium.
pitfalls:
  - An empty competitors array is truthy in the client and is sent, but the enrichment handler treats it as a discovery request.
  - The chooser creates selected guardrails before saving a policy and retains successes after a later guardrail fails.
  - The browser reads competitor and status SSE events; replacing them with completion-style chunks would pass an unrelated streaming test.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
