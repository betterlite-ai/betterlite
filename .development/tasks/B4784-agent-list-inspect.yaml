id: B4784
title: List and inspect agents with spend, keys and model visibility
description: >-
  Build the read side of the agents API in betterlite-server, under agent_endpoints: the routes GET `/v1/agents` and GET `/v1/agents/{agent_id}`, and the two helpers that add agents to the model lists. Both routes are tagged "[beta] A2A Agents", are authenticated by B052 and answer with agent records that have spend, virtual keys and the public flag filled in and secrets redacted. The pure pieces are other tasks and this task wires them in the order LiteLLM runs them: B4780 decides which agents a caller sees, B4783 filters unhealthy agents and ranks by query, B4775 redacts the survivors, B4776 is the in-memory registry. Expose one function, `agent_read_routes`, that returns the axum routes for both paths; B074 composes it and this task registers nothing else. `/v1/agents/identity/providers` and `/v1/agents/{agent_id}/identity` are B4781's, and axum picks the static path over `{agent_id}` by itself.

  Ports, in agent_endpoints/agent_reads.rs. Native async fn, no statics, tests use in-memory fakes. `AgentReads` has `has_database(&self) -> bool`, `spend_rows(&self, agent_ids: &[String]) -> Result<Vec<AgentSpendRow>, AgentReadError>` (rows of the agents table whose agent_id is in the list, `AgentSpendRow { agent_id: String, spend: f64 }`), `key_rows(&self, agent_ids: &[String]) -> Result<Vec<AgentKeyRow>, AgentReadError>` (rows of the key table `litellm_verificationtoken` whose agent_id is in the list, `AgentKeyRow { agent_id: String, token: String, key_alias: Option<String>, key_name: Option<String> }`, and no other column is selected) and `agent_row(&self, agent_id: &str) -> Result<Option<AgentResponse>, AgentReadError>` (exact `find_unique` by agent_id on the agents table, with the object permission and the identity rows joined, decoded into AgentResponse from B4770). Each method returns an empty result and runs no SQL for an empty id list. The production implementation `PgAgentReads` is in the same module and uses B700's store and `find_many_in` (one `= ANY($1)` read), B726's agents table binding and B720's verification token row type. `AgentReadError` is this module's error enum, with one variant that carries the database error text. `AgentListSettings` is a second port, read once per request: `public_agent_groups(&self) -> Option<Vec<String>>` (`litellm_settings.public_agent_groups`, default absent), `jwt_agent_settings(&self) -> JwtAgentSettings` (B4775's record: `enabled` is general_settings.enable_jwt_auth, `agent_id_field_set` is a non-empty `litellm_jwtauth.agent_id_jwt_field`) and `search_settings(&self) -> AgentSearchSettings` (B4783's section). The server implements it; wiring is not in this task (see the report notes).

  1. GET `/v1/agents`, in agent_endpoints/agent_listing.rs. Query parameters: `health_check` (boolean, default false), `query` (string, at least 1 character, default absent) and `top_k` (integer 1 to 100, default `DEFAULT_AGENT_SEARCH_TOP_K`, which is 5, from B4783). A value that fails these bounds or is not a boolean or an integer answers 422 in the envelope B003 uses for other query errors, but only after authentication passed, so a bad key with `?query=` answers 401. Then, in this order, and any failure stops the request:
  a. `check_feature_access_for_user(caller, "agents")` from B864. Its error goes out unchanged.
  b. `accessible_agents(caller, None)` from B4780: the registry list for a proxy admin, otherwise the granted agents. Its `AgentAccessError` goes out with `status()` and its message as detail.
  c. Only when `has_database()` is true and the list is not empty. For each agent take the alias ids `registry.ids_for_agent(agent.agent_id)` (the id plus its legacy config ids), read `spend_rows` for all alias ids of all agents in one call, and for each agent sum the spend of its alias ids that have a row. An agent with at least one matching row gets that sum as `spend` (a Decimal built from each f64's shortest round-trip text, summed as Decimals). An agent with no matching row keeps the spend it already has. Then read `key_rows` for the same alias ids in one call and give each agent `keys`: the rows of its alias ids as `AgentKeySummary { token, key_alias, key_name }`, in the order of the alias ids sorted by string order and then the order the database returned, and `None` when there are none. If the combined alias id list is empty, neither read runs.
  d. For every agent set `litellm_params["is_public"]` (an empty map is created first when litellm_params is absent) to true when `public_agent_groups` is present and shares at least one id with the agent's alias ids, else false. An empty group list is present and gives false for every agent. This flag is added before redaction and is not a secret key, so it stays in the response.
  e. When `health_check` is true: call `filter_healthy_agents(agents, transport, &settings)` from B4783 on the AgentResponse values (it probes only agents with a card url and puts agents without a url after the healthy ones) and keep the agents in the order it returned. When `health_check` is false the list is used as it is. LiteLLM redacts before this step, but the probe reads only `agent_id` and `agent_card_params.url`, and redaction touches neither.
  f. When `query` is present: call `rank_agents_by_query(query, agents, top_k, embedding_model, embedders, index, caller)` from B4783 on the agents of step e. The ranked AgentResponse values replace the list, in rank order, each with its `search_score` already set. The ranker reads only the card name, description and skills (`agent_card_params`), which redaction leaves alone. `AgentSearchRouteError::Http` answers its status with the body `{"detail":{"error":..,"message":..}}`, and `AgentSearchRouteError::Embedding` answers its status and detail unchanged. `caller` is B732's AuthContext. No conversion from UserApiKeyAuth to AuthContext exists in the merged code, so the route takes the AuthContext that B052's authentication built for the request (the value `dispatch` in crates/betterlite-server/src/auth/auth_identity.rs returns, a Principal wrapper) and passes it next to the UserApiKeyAuth it gives B4780 and B864.
  g. `redact_sensitive_agent_fields(agents, is_admin, jwt, masker)` from B4775 on the final list, with `is_admin` true only for the exact role proxy_admin (a proxy_admin_viewer is not an admin here) and `jwt` from `jwt_agent_settings`. It returns `Result<Vec<AgentJson>, AgentCredentialsError>`, the JSON that is the response body, in the order of the list. A B4775 error answers 500. Build the masker once in the constructor of the listing and pass it in. B4775 serializes each AgentResponse, so `search_score` is written the way B4770 writes it.
  h. Return 200 with the JSON array. Without a query `search_score` is whatever the agent already holds (null).
  An error that is not one of the typed ones above answers 500 with detail `{"error": "Internal server error: <text>"}` and logs the error with the line `litellm.proxy.agent_endpoints.get_agents(): Exception occurred - <text>` at error level.

  2. GET `/v1/agents/{agent_id}`, in agent_endpoints/agent_lookup.rs. Order: a. `check_feature_access_for_user(caller, "agents")`. b. When the caller does not have admin view (B2314's `user_api_key_has_admin_view`: proxy_admin and proxy_admin_viewer only), `is_agent_allowed(agent_id, caller)` from B4780; false answers 403 with the plain string detail `Agent '<agent_id>' is not allowed for your key/team. Contact proxy admin for access.` (a string, not an object). An `AgentAccessError` goes out with its status. c. No database answers 500 with the string detail `Prisma client not initialized`. d. `registry.get_agent_by_id(agent_id)` (it also resolves a legacy config id). When the registry has no such agent, call `agent_row(agent_id)` and use that agent. When the registry has it, call `agent_row(agent_id)` with the id exactly as given (not the registry's stable id) and, when a row comes back, set the agent's spend from the row. e. No agent answers 404 with the string detail `Agent with ID <agent_id> not found`. f. Attach keys with the same code as step 1c (one agent), redact with B4775 (same `is_admin` rule) and return the one JSON value. This route does not add `is_public` and does not read the public group list. Non-typed errors answer 500 with the plain string detail of the error text.

  3. Shared join code, in agent_endpoints/agent_listing/joins.rs: `refresh_spend` and `attach_agent_keys` take `&mut [AgentResponse]`, the registry and an AgentReads, and are called by both routes (the lookup module imports `attach_agent_keys`). LiteLLM's `_attach_keys_to_agents` returns early when the alias id list is empty and does not query. Only these key fields are ever exposed: `token` (the hashed token), `key_alias`, `key_name`.

  4. Model list helpers, in agent_endpoints/agent_models.rs. `agent_model_groups(access: &AgentAccessResolver<..>, registry, caller) -> Vec<AgentModelGroup>` and `agent_model_infos(..) -> Vec<AgentModelInfo>` are LiteLLM's append_agents_to_model_group and append_agents_to_model_info, except that they return only the rows to add; B060 and B850 own the lists and append the rows after their own filters and sorting (their text says the agents are appended last). Both call `resolve_agent_access(Some(caller), false)` (non-strict). Unrestricted adds nothing, which means an unrestricted key or a proxy admin sees no agent rows in the model lists. Restricted(ids) walks the ids in string order; for each id `registry.get_agent_by_id(id)` (legacy ids resolve too) and an id with no agent is skipped. `AgentModelGroup { model_group: "a2a/<agent_name>", mode: "chat", providers: ["a2a"] }`. `AgentModelInfo { model_name: "a2a/<agent_name>", litellm_params: { model: "a2a/<agent_name>", custom_llm_provider: "a2a" }, model_info: { id: agent_id, mode: "chat", db_model: true, created_by, created_at, updated_at } }`, with created_at and updated_at written the way B4770 writes AgentResponse timestamps. If a legacy id and its stable id are both granted, the agent appears twice, as in LiteLLM. Any `AgentAccessError` is logged at debug as `Error appending agents to model_group/info: <error>` (the text says model_group/info for the group helper and `v2/model/info` for the info helper; copy both exactly from the references) and the helper returns an empty list, so the caller's rows stay as they were. Nothing here fails the request.
