  - tools/oracle/cases/agents/listing/list-top-k-over-max-422.yaml
  - tools/oracle/cases/agents/listing/list-bad-health-check-422.yaml
  - tools/oracle/cases/agents/listing/list-query-not-configured-400.yaml
  - tools/oracle/cases/agents/listing/list-bad-key-401.yaml
  - tools/oracle/cases/agents/listing/get-agent-no-database-500.yaml
deviations:
  - what: LiteLLM changes the registry's own agent objects while it lists (spend, keys and litellm_params.is_public stay on them), so a later GET /v1/agents/{agent_id} for a registry agent can show a stale is_public in litellm_params. betterlite works on copies, so by-id never shows is_public.
    why: B4776's registry hands out clones, and a request must not write into shared state. The oracle cases read by-id before any list call.
  - what: Spend is summed as Decimal from each f64's shortest text, so 0.1 and 0.2 give 0.3, where Python's float sum gives 0.30000000000000004.
    why: B4770 stores spend as Decimal.
  - what: The model list rows for agents are walked in string order of the granted ids, and the keys of one agent in the string order of its alias ids. LiteLLM walks a frozenset, whose order changes from process to process.
    why: A stable order; the oracle cases use one id and one alias.
  - what: "The text after the prefix Internal server error (list route) and the whole detail of the by-id 500 for a failed read is betterlite's own error text, not Python's exception text."
    why: The wording of a Python exception cannot be matched; the status and the prefix are the same.
out_of_scope:
  - "redact_sensitive_agent_fields, the marker and the masker belong to B4775. rank_agents_by_query, filter_healthy_agents, the health transport, AgentEmbedders and the agent_search config section belong to B4783."
  - "accessible_agents, is_agent_allowed and resolve_agent_access belong to B4780. AgentRegistry and its alias id methods belong to B4776."
  - "POST, PUT, PATCH and DELETE on /v1/agents belong to B4785, and so do _proxy_base_url, _validate_protocol_version and _build_merged_agent_card (L96-L137), which only the write routes call. The kill switch and make_public routes belong to B4786."
  - "/v1/agents/identity/providers and /v1/agents/{agent_id}/identity belong to B4781. GET /agent/daily/activity and resolve_agent_daily_activity_scope (L311-L375, L1333-L1403) belong to B4787."
  - "The /model_group/info and /v2/model/info handlers belong to B060 and B850. They call agent_model_groups and agent_model_infos and append the rows."
  - "Feeding the registry from the database and config, and the shared holder of public_agent_groups that B4786 writes, are not built here; AgentListSettings is the seam."
pitfalls:
  - The health filter and the ranker run on AgentResponse values and redaction runs last, and the redacted JSON, not the AgentResponse values, is what the client gets. Rebuilding the body from AgentResponse would drop the kill switch auth marker that B4775 writes.
  - is_admin for redaction is the exact role proxy_admin. A proxy_admin_viewer has admin view for the by-id allowed check but is still stripped of keys, static_headers, extra_headers, kill_switch and identity.
  - The by-id route sets no is_public and reads no group list, and its 403 and 404 details are plain strings, while the list route's 500 detail is an object with the key `error`.
  - The by-id 403 check runs before the database check, so a non-admin caller with no database and no grant gets 403, not 500.
  - Spend is read for the alias ids (stable id plus legacy ids), but the by-id refresh reads the agents table by the id exactly as given, so a legacy id given in the URL finds the agent in memory and finds no row.
  - An agent with no matching spend row keeps its old spend instead of getting 0, and a database that is up but holds no rows leaves every agent unchanged.
  - Keys are matched by `agent_id` on the key table through alias ids, and only `token`, `key_alias` and `key_name` are copied; never serialize the whole key row, which holds the secret-bearing columns.
  - top_k and query are validated even when health_check is false, and `?query=` with an empty string is a 422, not "no query".
  - Authentication is checked before the 422 for bad query values, so a bad key with `?top_k=0` answers 401.
  - An Unrestricted result from resolve_agent_access adds no model rows, so the model helpers return nothing for a proxy admin; do not return all agents for admins here, that is only accessible_agents.
  - "Redaction runs after the health filter and the ranker, and the order still matches LiteLLM because neither step reads a redacted field: the probe reads agent_id and agent_card_params.url, the ranker reads the card name, description and skills."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
