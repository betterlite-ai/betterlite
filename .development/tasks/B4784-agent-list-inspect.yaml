dod:
  - text: GET /v1/agents and GET /v1/agents/{agent_id} are served by agent_read_routes with the tag "[beta] A2A Agents", and a missing or bad key answers 401 before any query-parameter 422.
    proof: [route-tests, oracle]
  - text: query, top_k and health_check are validated with LiteLLM's bounds (query at least 1 character, top_k 1 to 100 with default 5, boolean health_check) and answer 422 when they fail.
    proof: [route-tests, oracle]
  - text: The list route runs feature check, accessible agents, spend and keys, is_public, health filter, ranking and redaction in that order, and each later step sees the output of the earlier one.
    proof: [flow-tests]
  - text: Spend is the sum over an agent's alias ids that have a row, an agent with no row keeps its spend, and no query runs without a database or without agents.
    proof: [join-tests]
  - text: Keys carry only token, key_alias and key_name, come from the agent's alias ids, and are None when none match.
    proof: [join-tests, reads-tests]
  - text: is_public is true only when the group list is present and shares an alias id with the agent, is false for an empty list, and is set before redaction so it survives it.
    proof: [join-tests, oracle]
  - text: Redaction uses is_admin true only for proxy_admin, litellm_params secrets show REDACTED_BY_LITELM, and the response body is B4775's JSON.
    proof: [flow-tests, oracle]
  - text: With a query the response holds the ranked agents with search_score in rank order, NotConfigured answers 400 agent_search_not_configured, and an embedding HTTP error is passed through unchanged.
    proof: [flow-tests, oracle]
  - text: "The list route's unexpected failure answers 500 with the prefix Internal server error in detail.error, and typed HTTP errors are not rewrapped."
    proof: [flow-tests]
  - text: The by-id route skips the allowed check for admin-view roles, answers 403, 500 and 404 with LiteLLM's plain string details in that order, finds legacy ids through the registry, refreshes spend by the exact id given, and attaches keys.
    proof: [lookup-tests, oracle]
  - text: The model helpers return rows only for Restricted access, named a2a/<agent_name>, resolve legacy ids, and return an empty list when access resolution fails.
    proof: [models-tests]
  - text: The production reads select only spend, token, key_alias and key_name columns, run no SQL for an empty id list, and read the agent row with its object permission and identity.
    proof: [reads-tests]
checks:
  optional: []
  commands:
    - id: route-tests
      why: the two routes are missing, carry the wrong tag or auth, or the query parameter bounds are wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_listing::tests::route_/)'
    - id: flow-tests
      why: the list route runs its steps in another order, loses an error status or builds the body from another source than the redaction JSON
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_listing::tests::flow_/)'
    - id: join-tests
      why: the spend sum, the keys attach or the is_public flag differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_listing::joins::tests::/)'
    - id: lookup-tests
      why: the by-id route differs in its check order, its error details, its registry-or-database lookup or its spend refresh
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_lookup::/)'
    - id: models-tests
      why: the model group and model info rows for agents are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_models::/)'
    - id: reads-tests
      why: the agent reads select other columns, run SQL for empty input or miss the object permission and identity joins
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_endpoints::agent_reads::/)'
