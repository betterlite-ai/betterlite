    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/summary_model_limits.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/summary_model_limits-*)"
      && grep -qE "^[[:space:]]+summary_model_limits:" tools/oracle/fuzz/corpus/helper_case/summary_model_limits-*
