    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_model_limits::/)
      - test(/::replays_corpus$/)'
  - id: case-summary-budget-exceeded
    why: the summary-budget-exceeded behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_model_limits::tests::summary_budget_exceeded($|::)/)'
  - id: case-summary-rate-limit
