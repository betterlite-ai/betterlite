id: B970
title: Check compaction budgets and rate limits without reserving counters
description: >-
  Build summary_model_limits for compact.py L395-L627, owning all four complete budget/rate helper functions.
  B732 provides parent principals and B969 the typed limiter interfaces. B071 owns model_max_budget_limiter and
  B072 owns parallel_request_limiter_v3; both currently lack task files, so expose explicit injected read-only
  methods matching these calls rather than inventing their storage or charging implementations. A worker can
  complete this task with those seams; the architect must fill the owners before end-to-end policy execution.
  Budget checks return false on every checker error, whereas rate checks deny only OVER_LIMIT and the limiter's
  RateLimitUnverifiableError. Preserve the distinction and diagnostics. This task neither calls a provider nor
  changes spend and rate counters.

  Register HelperCall::SummaryModelLimits with budget, descriptors and rate actions. Python calls the pinned
  functions with scripted limiter objects; compare boolean outcomes, calls, arguments, unchanged input descriptors
  and logs. Missing methods are explicit capability flags, not arbitrary dynamic dispatch in Rust. No settings
  or byte decoder is introduced: fail_closed_rate_limit_enforcement remains B072's limiter behavior. Own 216
  nonblank/non-comment physical lines. Allocate 220 implementation, 155 tests, 150 fixtures, 95 adapters and 30
  wiring, 650 total; tests use api::summary_model_limits.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/summary_model_limits.rs
  - crates/betterlite-core/src/api/summary_model_limits/**
  - tools/oracle/src/helpers/core_ops/summary_model_limits.rs
  - tools/oracle/src/helpers/core_ops/summary_model_limits/**
  - tools/oracle/helpers/summary_model_limits.py
  - tools/oracle/helpers/summary_model_limits/**
  - tools/oracle/fuzz/corpus/helper_case/summary_model_limits-*
  - tools/oracle/cases/helpers/summary-model-limits/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L395-L500
  why: Budget scope order is key, user, team, end-user with a nonempty dict and non-null identifier required for each.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/pass_through/context_management/editors/compact.py#L503-L627
  why: Read-only limiter capabilities, descriptor augmentation, parallel-gauge removal and asymmetric failure handling.
dod:
- text: >-
    budget_scope_arguments supplies nonempty model_max_budget,user_model_max_budget,team_model_max_budget,
    end_user_model_max_budget and token,user_id,team_id,end_user_id and checks model=sum in key,user,team,end-user
    order. Empty/non-dict budgets or null identifiers skip their scope, while empty-string identifiers do not.
    Team receives key_model_max_budget unchanged when a dict, including {}, otherwise null. Missing principal or
    unavailable proxy limiter returns true without calls. All allowed scopes return true.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    budget_errors_stop_later_scopes scripts BudgetExceededError at each scope and expects false without unexpected
    warning; exception "offline" also returns false, stops later scopes and warns
    "compact_20260112: unexpected error during key model-budget check for summary_model=sum; denying: offline".
    User,team,end-user cases substitute their exact scope text. No status/type/param/code is emitted by this boolean gate.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    parallel_gauge_filter leaves missing/null rate_limit and missing/null max_parallel_requests records unchanged.
    max_parallel_requests=0 or 1 triggers a copied rate_limit containing exactly requests_per_unit,tokens_per_unit,
    window_size, with null for missing keys; max_parallel_requests and any other rate-limit fields are dropped,
    descriptor-level fields stay. Input records remain unchanged and descriptor order remains stable.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    rate_descriptor_order requests hook parallel_request_limiter, passes data={model:sum}, metadata rpm_limit_type
    and tpm_limit_type (null if absent), model_has_failures=false to the base builder, then appends team and project
    model descriptors in that order and organization descriptors last. All pass summary_model=sum and the original
    principal. Empty final descriptors allow without should_rate_limit; otherwise it receives stripped gauges,
    parent_otel_span and read_only=true. Assert no reservation/increment/post-call hook occurs.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    unavailable_rate_capabilities supplies no principal, unavailable proxy, no hook, no limiter and each missing
    should_rate_limit/_create_rate_limit_descriptors/_add_team_model_rate_limit_descriptor_from_metadata/
    _add_project_model_rate_limit_descriptor_from_metadata/create_organization_rate_limit_descriptor capability
    and expects true with no descriptor check. A missing metadata map becomes {}. Exceptions from get_proxy_hook
    occur outside the source try block and propagate, rather than receiving the allow-with-warning fallback.
  proof: [behavior-tests, oracle, helper-python]
- text: >-
    rate_denial_and_failures returns false for overall_code=OVER_LIMIT; missing,OK and other values allow.
    RateLimitUnverifiableError(detail="unverified") from descriptor building or checking returns false and warning
    "compact_20260112: rate-limit counters for summary_model=sum could not be verified; denying: unverified".
    Exception "offline" in the protected descriptor/check block allows with warning
    "compact_20260112: unexpected error during rate-limit check for summary_model=sum; allowing: offline".
  proof: [behavior-tests, oracle, helper-python]
- text: New limiter fixtures exercise each scope and the operation tag is accepted by the shared helper parser.
  proof: [new-cases, helper-corpus, oracle, helper-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: a budget/rate decision or read-only descriptor argument is missing
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::summary_model_limits::/)'
  - id: helper-python
    why: the limiter comparison is not independently executable
    run: test -f tools/oracle/helpers/summary_model_limits.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: summary limit inputs cannot enter the shared helper protocol
    run: grep -qE '^[[:space:]]+summary_model_limits:' tools/oracle/fuzz/corpus/helper_case/summary_model_limits-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-cases
    why: no independent read-only limit scenarios were added
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/summary-model-limits)"
oracle_cases:
- tools/oracle/cases/helpers/summary-model-limits/budget-scope-arguments.yaml
- tools/oracle/cases/helpers/summary-model-limits/budget-errors-stop-later-scopes.yaml
- tools/oracle/cases/helpers/summary-model-limits/parallel-gauge-filter.yaml
- tools/oracle/cases/helpers/summary-model-limits/rate-descriptor-order.yaml
- tools/oracle/cases/helpers/summary-model-limits/unavailable-rate-capabilities.yaml
- tools/oracle/cases/helpers/summary-model-limits/rate-denial-and-failures.yaml
deviations: []
out_of_scope:
- B969 owns compact.py L97-L392 settings/access/interfaces; B971 owns history helpers L630-L1016 and L1114-L1157.
- B2432 owns compact.py L1019-L1111 and L1160-L1380 execution; B972 owns dispatcher.py.
- B071 owns actual model-budget lookups, B072 limiter counters and its post-call charging. This task only invokes their explicit seams.
pitfalls:
- 'The oracle helper for this task is pre-registered as summary_model_limits in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/summary_model_limits.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/summary_model_limits.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The team checker receives the key budget even when the key's token is null and its own budget check was skipped.
- A zero parallel-request gauge still needs removal; checking its truthiness leaks a concurrency constraint into the summary.
- Unexpected rate-check errors allow, but get_proxy_hook errors precede the protected block and propagate.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
