id: B970
title: Summary model limits
description: >-
  Check summary-model budgets through B071's per-model budget checker and rate descriptors through B072's read-only
  limiter API. Budget exhaustion or checker failure returns false (with the source warning on unexpected failure).
  Rate OVER_LIMIT and RateLimitUnverifiableError return false; absent limiter capabilities or other rate-check errors
  allow with the source diagnostics. Drop max_parallel_requests gauges and use read_only=true: do not reserve or
  increment any counter here; propagate key/team/user/end-user/project/organization attribution and charge actual
  summary usage exactly once through the existing post-call hooks.


  Pure policy/helper parity stays here; the consuming route tasks own HTTP auth/status/header integration. Do not
  call a FastAPI handler from a helper adapter or add a dependency on the later family composer.


  Implement crates/betterlite-core/src/api/summary_model_limits.rs. Use SummaryModelLimitsInput and SummaryModelLimitsResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions summary_budget_exceeded, summary_rate_limit, parallel_gauge_not_double_0b12,
  summary_budget_allowed, unexpected_budget_error_denies, rate_counters_unverifiabl_5ab4, unexpected_rate_error_all_e427,
  legacy_limiter_allows_wit_531c under api::summary_model_limits::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::SummaryModelLimits in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {summary_model_limits: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _check_summary_model_budget
  (L395-L500); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _without_parallel_request_gauges
  (L503-L506); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _without_parallel_request_gauge
  (L509-L518); litellm/llms/anthropic/pass_through/context_management/editors/compact.py: _check_summary_model_rate_limit
  (L521-L627). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 181 owned nonblank/non-comment/non-docstring Python lines (216 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 201 implementation,
  88 behavior tests, 96 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 505 total within the 510-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B072 (Rate limits, parallel request limits and dynamic limits), B071 (Budgets, budget
  resets and reservations), B171 (Direct helper oracle and URL path encoding), B969 (Summary model access), B1087
  (Api boundaries). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
