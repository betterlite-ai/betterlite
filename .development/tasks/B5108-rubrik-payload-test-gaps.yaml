    proof: [rubrik-request-data-tests]
checks:
  optional: []
  commands:
    - id: rubrik-block-decision-tests
      why: a block decision test for the swapped duplicate id, the ID-less tool calls or the tool-only response is missing, a weak test it replaces is still there, or a block decision test fails
      run: >-
        grep -q 'fn response_block_catches_a_duplicate_id_swapped_for_another' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        grep -q 'fn response_block_catches_a_missing_tool_call_without_an_id' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        grep -q 'case::both_returned' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        grep -q 'fn response_block_reads_a_tool_only_response' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        grep -q 'case::leading_separator_stays_in_the_explanation' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        grep -q 'case::every_call_returned_with_a_note' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        ! grep -q 'fn response_block_uses_counter_semantics_so_a_missing_duplicate_id_is_still_caught' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        ! grep -q 'fn response_block_detects_a_missing_tool_call_by_cardinality' crates/betterlite-logging/src/rubrik/tests/block_decision.rs &&
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^rubrik_payloads::block_decision::/)'
    - id: rubrik-response-payload-tests
      why: the serialized after_completion envelope or the uuid4 fallback id has no test, a field-reading or prefix-only test it replaces is still there, or a response payload test fails
      run: >-
        grep -q 'fn response_payload_serializes_to_the_after_completion_json' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        grep -q 'case::one_tool_call' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        grep -q 'fn response_payload_generates_a_chatcmpl_uuid4_id' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        grep -q 'case::empty_request_id' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        grep -q 'Uuid::parse_str' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        grep -q 'get_version_num' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        ! grep -q 'fn response_payload_uses_null_content_and_stop_when_there_is_no_text_or_tool_calls' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        ! grep -q 'fn response_payload_carries_content_and_tool_calls_with_finish_reason_tool_calls' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        ! grep -q 'fn response_payload_falls_back_to_a_generated_chatcmpl_id_when_request_id_is_absent' crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs &&
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^rubrik_payloads::moderation_payload::/)'
    - id: rubrik-prompt-payload-tests
      why: the function_call or search_results segment, the serialized before_prompt payload or the model and correlation_key precedence has no test, an Option-only test it replaces is still there, or a prompt payload test fails
      run: >-
        grep -q 'fn flatten_joins_content_tool_call_and_function_call_arguments' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        grep -q '"function_call"' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        grep -q 'fn flatten_appends_search_results_text_to_the_message_content' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        grep -q '"search_results"' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        grep -q 'fn prompt_payload_serializes_only_the_optional_keys_it_has' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        grep -q 'case::empty_strings' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        grep -q 'case::all_set' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        grep -q 'fn prompt_payload_prefers_the_inputs_model_and_an_explicit_correlation_key' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        ! grep -q 'fn flatten_includes_tool_call_and_function_call_arguments_as_extra_segments' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        ! grep -q 'fn prompt_payload_includes_tools_only_when_present' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        ! grep -q 'fn prompt_payload_omits_correlation_key_when_both_sources_are_empty' crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs &&
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^rubrik_payloads::prompt_payload::/)'
    - id: rubrik-request-data-tests
      why: no test asserts that messages and model come from call_details only, or a request data test fails
      run: >-
        grep -q 'fn extract_request_data_forwards_messages_and_model_from_call_details_only' crates/betterlite-logging/src/rubrik/tests/request_data.rs &&
        grep -q 'case::never_from_request_data' crates/betterlite-logging/src/rubrik/tests/request_data.rs &&
        cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^rubrik_payloads::request_data::/)'
oracle_cases: []
deviations: []
out_of_scope:
  - >-
    The product files under crates/betterlite-logging/src/rubrik/ (block_decision.rs, moderation_payload.rs,
    prompt_payload.rs, request_data.rs, tool_calls.rs, system_prompt.rs). All nine findings were checked against
    LiteLLM and the code already matches, so only the tests change.
  - >-
    Padded one-line functions such as the non_empty helpers, and the impl Trait argument of count_ids in
    block_decision.rs. They belong to B5094, and it is clearing those legacy lists now. This task does not touch
    .ast-grep/rules/.
  - >-
    tests/tool_calls.rs and tests/system_prompt.rs. No finding names them.
  - >-
    Oracle cases. No route reaches the Rubrik payload code yet, since rubrik_moderation.rs, rubrik_delivery.rs and
    rubrik_event_logging.rs are still empty stubs for B3978, B3976 and B3977, and B3975 has no helper operation.
    B3978 wires the moderation hooks and adds the HTTP cases.
pitfalls:
  - clippy's disallowed-types bans naming serde_json::Value and serde_json::Map in tests too, so a serialized comparison parses both sides into betterlite_models::decisions::Json instead of writing a Value type or an rstest parameter of that type.
  - A returned entry with no "id" key is a ReturnedToolCall whose id is None, and the response() helper in tests/block_decision.rs always builds Some(id), so the ID-less cases build ModerationServiceResponse by hand; LiteLLM's tc.get("id") drops such an entry from the Counter while len() still counts it.
  - With sent_content "" the separator prefix is just "\n\n", so the leading_separator_stays_in_the_explanation case is the only test that tells LiteLLM's bool(sent_content) guard on appended from a plain startswith.
  - The search_results text joins the content with no separator (texts += on common_utils.py line 181), while tool call and function_call arguments are separate segments joined by "\n", so the two tests expect different glue.
  - LiteLLM writes citations with json.dumps(separators=(",", ":")) and betterlite with serde_json::to_string; keep the citations value ASCII with no floats, as in the test's {"enabled":true}, so both write the same text.
  - The fallback id is random, so the uuid4 test never compares it with a fixed string; it checks the parsed version, the hyphenated form and that two builds differ.
  - Each rewritten test takes a new name and the old name goes, because the checks grep for both; keep the other existing tests in these files unchanged.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
