id: B5108
title: Close the B3975 Rubrik payload test gaps
description: >-
  B3975 built Rubrik's moderation payloads and block decisions in crates/betterlite-logging/src/rubrik/. An Opus
  review after merge found nine places where a test stays green whatever the code does, or where a built branch has
  no test at all. Each one was checked against LiteLLM at the pin. In all nine the code already does what LiteLLM
  does, so no product file changes: only the four test files under crates/betterlite-logging/src/rubrik/tests/ do.
  They compile into the rubrik_payloads integration test target (the [[test]] entry in
  crates/betterlite-logging/Cargo.toml points at src/rubrik/tests.rs), so they import from
  betterlite_logging::rubrik::... and their names start with rubrik_payloads::. For every new or rewritten test,
  apply the mutation its DoD item names to the product file, watch the test fail for that reason, then revert the
  mutation before you commit.


  Serialized payloads are compared the same way everywhere below: serialize the payload with serde_json::to_string,
  parse that text and the expected JSON text into betterlite_models::decisions::Json, and assert the two are equal.
  Json objects are IndexMaps, and IndexMap equality ignores key order, so the test pins keys and values but not
  Python's key order. docs/compatibility.md leaves key order out of the contract.


  Gap one, in tests/block_decision.rs. LiteLLM counts sent and returned tool call ids with Counter, so when two sent
  calls share an id and the webhook swaps one of them for another id, that is a tool block
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L1210-L1221).
  response_block_uses_counter_semantics_so_a_missing_duplicate_id_is_still_caught sends [call_1, call_1] and gets one
  call back, so the length check on block_decision.rs line 105 returns true before the counts run. A set in place of
  count_ids keeps it green, and it only asserts is_some. It is replaced by
  response_block_catches_a_duplicate_id_swapped_for_another: sent [call_1, call_1], returned ids ["call_1",
  "call_2"], content "" and sent_content "", expecting the explanation "Tool call blocked by policy.".


  Gap two. LiteLLM's cardinality check, len(returned_tool_calls) < len(all_tool_calls), is the only thing that
  blocks tool calls without an id, because `if tc.id` keeps them out of the Counter (same link, L1216-L1221). A dict
  tool call with no "id" key normalizes to id ""
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L510-L532).
  response_block_detects_a_missing_tool_call_by_cardinality drops call_2. The id count catches that too, so
  deleting the length check keeps it green. It is replaced by the rstest
  response_block_catches_a_missing_tool_call_without_an_id. Two calls with id "" are sent, sent_content is "" and the
  returned message has no content. Case one_of_two_returned returns one entry with id None and case none_returned returns none; both expect "Tool call
  blocked by policy.". Case both_returned returns two entries with id None and expects Ok(None).


  Gap three. When the response had no text, LiteLLM sees neither an append nor a text block, because both need
  bool(sent_content), and a tool block then returns the webhook's content exactly as it came
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L1232-L1245).
  No test sends a tool-only response with returned content. So replacing returned_content with "" on
  block_decision.rs line 90, or dropping the !sent_content.is_empty() guard on line 74, keeps every test green. A new
  rstest response_block_reads_a_tool_only_response, with sent_content "", has three cases.
  blocked_call_keeps_the_webhook_text sends [call_1, call_2], returns [call_1] with content "tool X not allowed" and
  expects that explanation. leading_separator_stays_in_the_explanation sends the same calls with content "\n\ntool X
  not allowed" and expects the explanation unchanged, leading "\n\n" included. every_call_returned_with_a_note sends
  [call_1], returns [call_1] with content "note" and expects Ok(None). The review did not name the second case; it
  pins the same guard on line 73, where appended would otherwise strip the leading newlines.


  Gap four, in tests/prompt_payload.rs. LiteLLM's _moderation_text_parts adds the deprecated function_call arguments
  as their own segment (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L600-L614,
  line 613). convert_content_list_to_str appends a tool message's search_results text (source, title, each
  content[].text and the compact JSON of citations) straight onto the content
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L128-L182).
  flatten_includes_tool_call_and_function_call_arguments_as_extra_segments names function_call but its message has
  none, so removing prompt_payload.rs line 98 keeps it green, and nothing tests the search_results text on line 140.
  The test is renamed flatten_joins_content_tool_call_and_function_call_arguments. Its message gains "function_call":
  {"arguments": "{\"q\":\"x\"}"}, and it expects the content "thinking\n{\"city\":\"NY\"}\n{\"q\":\"x\"}". A new
  flatten_appends_search_results_text_to_the_message_content sends a "tool" message with content "result" and
  search_results [{"source": "src", "title": "Doc", "content": [{"type": "text", "text": "body"}], "citations":
  {"enabled": true}}], and expects the content "resultsrcDocbody{\"enabled\":true}".


  Gap five, in tests/moderation_payload.rs. LiteLLM's after_completion envelope has a tool_calls key only when there
  are tool calls, sends content null for a tool-only response, and dumps each tool call with a "type" key
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L554-L575,
  https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1288-L1310).
  response_payload_uses_null_content_and_stop_when_there_is_no_text_or_tool_calls and
  response_payload_carries_content_and_tool_calls_with_finish_reason_tool_calls read Rust fields and never serialize.
  Dropping skip_serializing_if on moderation_payload.rs line 26 (the webhook gets "tool_calls": []) or rename =
  "type" on tool_calls.rs line 15 (the webhook gets "kind") keeps both green. Both are replaced by the rstest
  response_payload_serializes_to_the_after_completion_json, building with request id Some("chatcmpl-known") and
  created 1_700_000_000. Case no_tool_calls passes no tool calls and content "" and expects
  {"id":"chatcmpl-known","object":"chat.completion","created":1700000000,"model":"","choices":[{"index":0,"message":{"role":"assistant","content":null},"finish_reason":"stop"}]}.
  Case one_tool_call passes [call("call_1")] and content "hello" and expects the same envelope with message
  {"role":"assistant","content":"hello","tool_calls":[{"id":"call_1","type":"function","function":{"name":"lookup","arguments":"{}"}}]}
  and finish_reason "tool_calls".


  Gap six. LiteLLM's before_prompt payload leaves out tools when it is None, and user and correlation_key when they
  are empty
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L616-L644,
  lines 641 to 643). prompt_payload_includes_tools_only_when_present and
  prompt_payload_omits_correlation_key_when_both_sources_are_empty assert that an Option is None. That still holds if
  skip_serializing_if goes from prompt_payload.rs lines 15 to 20 and the webhook gets "tools": null, "user": null and
  "correlation_key": null. Both are replaced by the rstest prompt_payload_serializes_only_the_optional_keys_it_has,
  with inputs model Some("gpt-4") and no structured messages. Case all_unset leaves tools, user, correlation_key and
  litellm_call_id None and expects {"model":"gpt-4","messages":[]}. Case empty_strings sets user, correlation_key and
  litellm_call_id to Some("") and expects the same. Case all_set sets tools Some(Json::List(vec![])), user
  Some("user-1") and correlation_key Some("ck") and expects
  {"model":"gpt-4","messages":[],"tools":[],"user":"user-1","correlation_key":"ck"}.


  Gap seven. In the same function an explicit correlation_key beats litellm_call_id (line 637) and the inputs model
  beats the request model (line 639). No test sets both sources, so swapping either or_else order in
  build_prompt_moderation keeps every test green. A new prompt_payload_prefers_the_inputs_model_and_an_explicit_correlation_key
  sets inputs model "a", request model "b", correlation_key "ck" and litellm_call_id "call-1", and expects model "a"
  and correlation_key Some("ck").


  Gap eight, in tests/moderation_payload.rs. Without a request id LiteLLM builds the id as "chatcmpl-" plus a fresh
  uuid4 (rubrik.py line 564, link in gap five), and `request_id or ...` treats an empty id the same way.
  response_payload_falls_back_to_a_generated_chatcmpl_id_when_request_id_is_absent only checks the prefix, so a
  constant id passes, and no test sends an empty request id. It is replaced by the rstest
  response_payload_generates_a_chatcmpl_uuid4_id with cases absent_request_id (None) and empty_request_id (Some("")).
  Each case strips "chatcmpl-", parses the rest with uuid::Uuid::parse_str, asserts get_version_num() is 4 and that
  the hyphenated form equals the suffix, asserts that two builds give different ids, and keeps the created
  assertion.


  Gap nine, in tests/request_data.rs. LiteLLM's _extract_request_data takes messages and model from call_details
  only, never from request_data
  (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/rubrik.py#L646-L682,
  lines 678 to 682). extract_request_data_falls_back_to_optional_params_tools_when_request_data_lacks_the_key sets
  messages but never asserts them, and no other test does, so returning None for messages, or reading request_data's
  messages, keeps every test green. A new rstest extract_request_data_forwards_messages_and_model_from_call_details_only
  asserts the whole RequestDataPayload. Case from_call_details passes call_details with messages Json::Text("hi") and
  model "gpt-4" and no request_data, and expects messages Some(Json::Text("hi")), model Some("gpt-4") and tools None.
  Case never_from_request_data passes no call_details and request_data with messages Json::Text("other") and model
  "other-model", and expects messages None, model None and tools None.
scope:
