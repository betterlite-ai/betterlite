dod:
  - text: >-
      response_block_catches_a_duplicate_id_swapped_for_another replaces
      response_block_uses_counter_semantics_so_a_missing_duplicate_id_is_still_caught. It sends [call_1, call_1], gets
      ids ["call_1", "call_2"] back and asserts the explanation "Tool call blocked by policy.". It fails when
      count_ids is swapped for a set of ids.
    proof: [rubrik-block-decision-tests]
  - text: >-
      The rstest response_block_catches_a_missing_tool_call_without_an_id replaces
      response_block_detects_a_missing_tool_call_by_cardinality. It sends two calls with id "", and its cases
      one_of_two_returned and none_returned expect "Tool call blocked by policy." while both_returned expects
      Ok(None). It fails when the length check on block_decision.rs line 105 is deleted.
    proof: [rubrik-block-decision-tests]
  - text: >-
      The rstest response_block_reads_a_tool_only_response, with sent_content "", has the cases
      blocked_call_keeps_the_webhook_text ("tool X not allowed"), leading_separator_stays_in_the_explanation ("\n\ntool
      X not allowed" kept whole) and every_call_returned_with_a_note (Ok(None)). It fails when returned_content on
      block_decision.rs line 90 becomes "", or when the !sent_content.is_empty() guard on line 73 or line 74 is
      dropped.
    proof: [rubrik-block-decision-tests]
  - text: >-
      flatten_joins_content_tool_call_and_function_call_arguments replaces
      flatten_includes_tool_call_and_function_call_arguments_as_extra_segments and expects
      "thinking\n{\"city\":\"NY\"}\n{\"q\":\"x\"}". A new flatten_appends_search_results_text_to_the_message_content
      expects "resultsrcDocbody{\"enabled\":true}". They fail when prompt_payload.rs line 98 or line 140 is removed.
    proof: [rubrik-prompt-payload-tests]
  - text: >-
      The rstest response_payload_serializes_to_the_after_completion_json, with cases no_tool_calls and one_tool_call,
      replaces the two response payload tests that read Rust fields. It compares the serialized envelope with the
      JSON in the description and fails when skip_serializing_if on moderation_payload.rs line 26 or rename = "type"
      on tool_calls.rs line 15 is removed.
    proof: [rubrik-response-payload-tests]
  - text: >-
      The rstest prompt_payload_serializes_only_the_optional_keys_it_has, with cases all_unset, empty_strings and
      all_set, replaces prompt_payload_includes_tools_only_when_present and
      prompt_payload_omits_correlation_key_when_both_sources_are_empty. It fails when any skip_serializing_if on
      prompt_payload.rs lines 15 to 20 is removed.
    proof: [rubrik-prompt-payload-tests]
  - text: >-
      prompt_payload_prefers_the_inputs_model_and_an_explicit_correlation_key expects model "a" and correlation_key
      Some("ck") when both sources of each are set. It fails when either or_else order in build_prompt_moderation is
      swapped.
    proof: [rubrik-prompt-payload-tests]
  - text: >-
      The rstest response_payload_generates_a_chatcmpl_uuid4_id, with cases absent_request_id and empty_request_id,
