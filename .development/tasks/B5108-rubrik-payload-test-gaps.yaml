    - crates/betterlite-logging/src/rubrik/tests/block_decision.rs
    - crates/betterlite-logging/src/rubrik/tests/moderation_payload.rs
    - crates/betterlite-logging/src/rubrik/tests/prompt_payload.rs
    - crates/betterlite-logging/src/rubrik/tests/request_data.rs
  lint_tables: false
