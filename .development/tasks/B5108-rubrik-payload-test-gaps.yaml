      as a hyphenated version 4 uuid and asserts two builds differ. It fails when the fallback id becomes a constant,
      and its empty_request_id case fails when the non_empty filter on the request id is dropped.
    proof: [rubrik-response-payload-tests]
  - text: >-
      The rstest extract_request_data_forwards_messages_and_model_from_call_details_only, with cases from_call_details
      and never_from_request_data, asserts the whole RequestDataPayload. It fails when extract_request_data returns
