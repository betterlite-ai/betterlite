deviations:
  - what: betterlite returns its own error messages (not copied from LiteLLM) for HTTPException detail fields like "Not allowed to ingest agent traces".
    why: Error messages are treated the same as in B003 (auth) and other management routes; oracle cases filter /error/detail/message in compare.ignore.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/tracing_endpoints.py#L45-L74

out_of_scope:
  - 'litellm/proxy/common_utils/http_parsing_utils.py: is_otlp_trace_request (imported at line 24, called in otlp_error_response at line 79) is covered by B1100.'
  - 'Storage/schema/ClickHouse initialization and query methods (TraceStore, ClickHouseStorage, ensure_schema). These are owned by later tasks in the native codec/storage/schema assignments (G2).'
  - 'Master key resolution and Proxy initialization (proxy_server.master_key comes from proxy initialization). Route reads it through provide_trace_query_secret; that function itself is in scope, but the source config is not.'

pitfalls:
  - 'require_receiver is called from context.reader() and context.writer(); every route through provide_trace_access implicitly depends on it. Test both 501 cases (POST /v1/traces and GET /v1/traces) and verify the exact message.'
  - 'otlp_error_response returns None when the request is not OTLP (is_otlp_trace_request returns false); non-OTLP requests fall through to different error handling. Keep the dependency on B1100.'
  - 'trace_query_scope has five branches: admin roles, project_id with token, project_id without token (403), team_id, key-only. Project_id branches are easy to miss; test all paths.'
  - 'POST /v1/traces/query and GET /v1/traces/query/help both depend on provide_trace_query_access, which stacks provide_trace_query_secret; test both routes.'
  - 'HTTP oracle cases go through the booted proxy, unlike helper-only cases; they exercise real auth, status, headers and OTLP encoding, not just pure functions.'

budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: security
