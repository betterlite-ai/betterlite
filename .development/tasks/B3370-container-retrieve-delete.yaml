    why: The retrieve and delete handlers that these operations call (B3365 owns them); read for the argument list only.
dod:
  - text: A mock_response (object or JSON string) returns the decoded record with no provider lookup, no logging update, no handler call and no id encoding, for both retrieve and delete, and a bad mock body is an error.
    proof: [mock-tests]
  - text: The container id is decoded first and the handler receives the decoded original id and the resolved provider's config; an unknown provider name and a provider without a config each fail with their own message.
    proof: [provider-tests]
  - text: The logging object is updated with model "", empty optional params, only litellm_call_id in litellm_params and the resolved provider, and gets call type retrieve_container or delete_container before the handler runs.
    proof: [logging-tests]
  - text: The handler receives extra_headers, extra_query, the async flag and the timeout, where 0 or missing becomes the default request timeout, and extra_body is never forwarded.
    proof: [handler-args-tests]
  - text: The sync operations re-encode the result id with the resolved provider and the metadata, copy a decoded model_id into litellm_metadata.model_info.id only when the input id was managed, and return the raw id when no routing metadata exists.
    proof: [encode-tests]
  - text: The async operations return the provider's raw id without re-encoding, and map errors through the dispatch using the caller's provider name.
    proof: [async-tests]
  - text: Every error from decoding, lookup, logging or the handler leaves through B185's exception dispatch with model "".
    proof: [error-tests]
checks:
  optional: []
  commands:
    - id: mock-tests
      why: the mock short circuit or its bad-body error is missing
      run: >-
        cargo nextest run --locked -p betterlite-core --no-tests=fail
        -E 'test(/^api::container_resource_ops::(.*::)?mock_/)'
    - id: provider-tests
      why: id decoding, provider lookup or the two provider errors are missing
      run: >-
        cargo nextest run --locked -p betterlite-core --no-tests=fail
        -E 'test(/^api::container_resource_ops::(.*::)?provider_/)'
    - id: logging-tests
      why: the logging update or the call type is missing
      run: >-
        cargo nextest run --locked -p betterlite-core --no-tests=fail
        -E 'test(/^api::container_resource_ops::(.*::)?logging_/)'
    - id: handler-args-tests
      why: the handler arguments, the timeout default or the dropped extra_body differ
      run: >-
        cargo nextest run --locked -p betterlite-core --no-tests=fail
        -E 'test(/^api::container_resource_ops::(.*::)?handler_args_/)'
    - id: encode-tests
      why: sync id re-encoding or the model_info.id write is missing
      run: >-
        cargo nextest run --locked -p betterlite-core --no-tests=fail
        -E 'test(/^api::container_resource_ops::(.*::)?encode_/)'
    - id: async-tests
      why: the async operations or their no-encoding rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-core --no-tests=fail
        -E 'test(/^api::container_resource_ops::(.*::)?async_/)'
    - id: error-tests
      why: errors are not routed through the exception dispatch
      run: >-
        cargo nextest run --locked -p betterlite-core --no-tests=fail
        -E 'test(/^api::container_resource_ops::(.*::)?error_/)'
oracle_cases: []
deviations:
  - what: The async operations are plain async functions and do not run the sync function on an executor thread with a copied context.
    why: Rust has no contextvars and no event loop to hop off; the observable result is the same.
  - what: The mock_response and request inputs are typed structs and a mock body that does not decode is ContainerOpError, not a pydantic error.
    why: Rust has no pydantic; accept and reject outcomes match B3360's record decoding.
out_of_scope:
  - "litellm/containers/main.py create, list, list files and upload operations: B3369, B3366 and B3367."
  - "The @client decorator (retry, caching, call id and litellm_logging_obj creation) in litellm/utils.py: the task that owns that file builds the logging object and call id; this task takes them as inputs."
  - "Container record types, the provider trait and endpoints.json: B3360."
  - "decode_managed_container_id_for_request, encode_container_id_in_response and ProviderConfigManager.get_provider_container_config: B3361."
  - "The retrieve and delete HTTP handlers, client choice and transport errors: B3365."
  - "Provider request and response transforms: B522 and B547."
  - "Logging update_from_kwargs: B247. Exception dispatch exception_type: B185."
  - "Generated file operations and the package exports in litellm/containers/__init__.py and endpoint_factory.py: B3368."
pitfalls:
  - The mock path returns before the id is decoded, so a managed id with a mock_response is returned as the mock holds it, never re-encoded.
  - The handler gets the decoded original id; passing the input id to it breaks every managed id.
  - Only the sync path re-encodes, because LiteLLM checks isinstance on a result that is a coroutine when the async flag is set; an async call returns the raw provider id even for a managed input.
  - was_encoded is original id not equal to input id, so a managed id that decodes to the same text counts as plain; copy model_id into model_info.id only when was_encoded is true and the decoded params have a model_id.
  - litellm_metadata is changed in place (model_info is created if missing), so the caller's map shows the new model_info.id after the call.
  - extra_body is read by the signature and passed to the encoder as None, never to the handler; target_model_names in it therefore never triggers encoding here.
  - timeout 0 is falsy in Python and becomes the default request timeout, the same as None.
  - The async wrapper's error path names the provider the caller gave; the sync body names the decoded one, so an encoded azure id on an openai default call reports azure from sync and openai from async.
review_level: standard
