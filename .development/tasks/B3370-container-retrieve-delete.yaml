id: B3370
title: Container retrieve and delete operations
description: >-
  Build the four top-level container operations retrieve_container, aretrieve_container, delete_container and
  adelete_container in betterlite-core, as module api::container_resource_ops (files crates/betterlite-core/src/api/container_resource_ops.rs
  and a folder of the same name for the tests). They are the entry points a caller uses; the HTTP work is B3365's container_retrieve_handler, acontainer_retrieve_handler, container_delete_handler and
  acontainer_delete_handler, and this task calls them. Nothing here sends a request itself. The module owns its error enum, ContainerOpError, with
  variants for a mock body that is not valid JSON or does not decode, an unknown provider name, a provider with no container config
  (message "Container provider config not found for provider: <name>"), and a wrapped handler error. Every failure leaves the
  operation through the exception dispatch of B185, called with model "" and the resolved provider name, as LiteLLM does.

  Inputs for retrieve and delete are the same: container_id, timeout (default 600 seconds), api_key, api_base, api_version,
  custom_llm_provider (default "openai"; "openai", "azure" and "azure_text" are the ones that have a container config),
  extra_headers, extra_query, extra_body, the logging object, the call id, the async flag, an optional mock_response and the
  optional litellm_metadata. Put them in one request struct per operation and let the logging object come in through the
  constructor of the operations struct with the other collaborators (handler, decoder, config lookup), not through module state.
  extra_body is accepted and then ignored: it is never sent to the handler and it is passed to the response encoder as None.

  Steps, in LiteLLM's order for both operations. (1) Mock: when mock_response is set, parse it (a string is JSON-decoded first)
  into ContainerObject for retrieve or DeleteContainerResult for delete and return it at once. No provider lookup, no decoding of
  the id, no logging update and no id encoding happen on this path. (2) Build the litellm params from api_key, api_base and
  api_version plus the other request fields, using whatever params type B3361 and the router types give. (3) Call B3361's
  decode_managed_container_id_for_request with the container_id, the provider and the params; it returns the original id, the
  resolved provider and updated params. was_encoded is true when the original id differs from the input id. (4) Look up the
  container config for the resolved provider with B3361's provider config manager. An unparsable provider name is an error
  (LiteLLM's litellm.LlmProviders(...) raises ValueError) and a provider without a config is the "not found" error above.
  (5) Update the logging object from the request with model "", empty optional params, litellm_params holding only
  litellm_call_id, and the resolved provider, using B247's update. (6) Set the logging call type to "retrieve_container" or
  "delete_container". (7) Call B3365's container_retrieve_handler or container_delete_handler (the acontainer_ forms when async) with the decoded original id (never the input id), the config,
  the params, the logging object, extra_headers, extra_query, the timeout (0 or missing becomes the default request timeout, REQUEST_TIMEOUT, 6000 seconds by default: the route passes betterlite_config::env_integer::timeout::RequestTimeout, field seconds, owned by B198, and the operations take it as a parameter, with no second copy of the value) and the
  async flag. (8) Re-encode the id of the result, see the next paragraph.

  Id re-encoding (retrieve and delete only, step 8). It happens only when the handler's result is the already finished record
  (ContainerObject or DeleteContainerResult). In LiteLLM the isinstance test is false when the handler returned a coroutine, so
  an async call is never re-encoded and returns the provider's raw id. In Rust the sync operation re-encodes and the async
  operation does not; keep that split and say so in a test. When it runs: take litellm_metadata (empty map when absent); when
  was_encoded is true and the decoded params carry a model_id, write that model_id to litellm_metadata.model_info.id (creating
  model_info when absent) and keep the map for the caller, as LiteLLM mutates the kwargs dict in place; then call B3361's
  encode_container_id_in_response with the resolved provider, the metadata and extra_body None. So a caller with no
  model_info.id in its metadata and a plain id gets the raw id back; a managed id in gets a managed id out.

  Async variants. aretrieve_container and adelete_container take the same inputs minus api_key, api_base and api_version as
  named arguments (they travel in the extra fields, as in LiteLLM), force the async flag on, run the same steps, and await the
  async handler. LiteLLM runs the sync function on an executor thread with a copied contextvars context; the Rust version is a
  plain async fn and needs neither. If the mock path is taken the finished record is returned directly. On any error the async
  wrapper also goes through the exception dispatch, using the provider name as the caller gave it (not the decoded one), because
  the wrapper has no decoded value; the sync body uses the decoded one.

  Out of the box, nothing registers a route: the HTTP routes belong to the umbrella B094 and its parts. Tests therefore drive the
  operations with a fake handler, a fake config lookup and a recording logging object, all injected by the constructor.

  Budget from the owned LiteLLM lines (about 260 non-blank lines of containers/main.py L490-L918 minus overloads and docstrings):
  about 300 production lines, 350 test lines.
scope:
  paths:
    - crates/betterlite-core/src/api/container_resource_ops.rs
    - crates/betterlite-core/src/api/container_resource_ops/**
  lint_tables: false
