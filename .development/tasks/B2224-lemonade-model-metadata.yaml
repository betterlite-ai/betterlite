id: B2224
title: Lemonade runtime model metadata
description: >-
  Provide the configured Lemonade model-info protocol and shared auth/input primitives below provider composition.
  Metadata calls use the injected configured origin and B173 transport.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/lemonade/chat/transformation.py:
  _get_positive_int L110-L123; _get_provider_specific_entry L125-L137; _get_context_window L139-L154; _get_default_model_info
  L156-L166; get_model_info L168-L206; _get_openai_compatible_provider_info L208-L217; _get_auth_headers L219-L222.


  Named case contracts: configured_origin_auth: Base chooses truthy explicit, LEMONADE_API_BASE, http://localhost:8000/api/v1
  without trimming slashes. The key defaults to literal lemonade; only when the original base is None or the explicit
  key is truthy choose explicit, litellm.lemonade_key, LEMONADE_API_KEY, lemonade. None or lemonade sends no Authorization;
  any other key sends Bearer {key}. An explicit empty base suppresses ambient keys while still falling back to the
  default/environment base. positive_token_limits: Accept positive integers except bool, and strings parsed by Python
  int (whitespace/sign allowed) when positive; floats, bool, zero, negative and malformed strings yield None. Context
  precedence is provider recipe_options.ctx_size, max_input_tokens, provider context_window, provider max_context_window,
  selecting the first valid positive integer. provider_metadata_overlay: Copy a dict provider_specific_entry or
  start empty; overlay top-level recipe_options/context_window/max_context_window by key presence, including None.
  For recipe options only a dict participates in context lookup. Do not mutate the input map; include provider_specific_entry
  in the result only when the merged map is truthy. model_query_and_defaults: Remove one lemonade/ prefix; URL-encode
  the remaining model with quote(safe=empty), then GET {base}/models/{encoded}. Transport, status and JSON failures
  are caught together, log LemonadeError: Could not get model info. and return key=lemonade/model, provider=lemonade,
  mode=chat, zero input/output token prices, and all three token limits None. Successful but structurally malformed
  parsed records fail later outside this catch. model_limit_projection: On success max_input_tokens uses context
  precedence; max_output_tokens uses its positive-int parser; max_tokens uses positive max_tokens or max_output_tokens,
  never max_input_tokens. Keep provider-specific merged fields and the default zero prices/mode/provider. Do not
  attach supported_openai_params here.


  Load LEMONADE_API_BASE, LEMONADE_API_KEY, lemonade_key through betterlite-config, with injected environment lookup
  and the defaults/precedence stated here. Deployment inputs use litellm_params and global inputs use litellm_settings.
  Add config rstest lemonade_model_metadata_config_cases; each named loads_<key> case invokes the real B002 loader,
  checks explicit values and defaults, and adds config_yaml parser seeds. Reject unrelated keys.


  All three newly loaded settings default None; lemonade_key is litellm_settings.lemonade_key, the other two are
  environment inputs. The nonsecret fallback API key literal is lemonade, not an environment default.


  Write standalone Rust test lemonade_model_metadata_credential_identity_isolation in betterlite-models: Distinct
  configured identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python
  oracle case.


  Write standalone Rust test lemonade_model_metadata_secret_safe_failure in betterlite-models: Debug and owned failure
  paths do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Outside-byte boundary: decode_lemonade_model_reply consumes bounded upstream JSON bytes inside the /models/{encoded_model}
  catch in crates/betterlite-models/src/lemonade_model_metadata.rs or its scoped child module. Use that production
  decoder from the request path, Rust oracle adapter and cargo-fuzz target crates/betterlite-models/fuzz/fuzz_targets/lemonade_model_reply.rs.
  Add valid, malformed, truncated and boundary corpus inputs and adjacent test replays_the_lemonade_model_reply_corpus
  that checks outcome categories through this decoder. The B171 HelperCase parser is a separate boundary.


  Implement crates/betterlite-models/src/lemonade_model_metadata.rs with adjacent tests under lemonade_model_metadata/.
  Keep each Rust module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml;
  a provider leaf never imports betterlite-provider or betterlite-core. The production function is the only Rust
  implementation used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function lemonade_model_metadata_cases in betterlite-models with these exact named cases (one per
  oracle file): configured_origin_auth, positive_token_limits, provider_metadata_overlay, model_query_and_defaults,
  model_limit_projection. Each case exercises its named outcome independently; use stable supplied clocks/IDs and
  fixture transports. Existing API tasks retain route registration; this task must not register a duplicate axum
  route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/lemonade_model_metadata* using HelperCase: kind:
  helper and the externally tagged lemonade_model_metadata variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_lemonade_model_metadata that parses every prefixed
  seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the
  shared corpus.


  Use the production outside-byte decoder named below; B171 still owns HelperCase decoding and B002 owns configuration
  decoding.


  Budget from 99 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and docstrings;
  SDK overloads share an async implementation): 185 production lines, 225 behavior/config-test lines, 110 combined
  Rust/Python adapter lines, 65 parser target/replay lines, 45 config/loader lines and 35 module/dispatch/shared-seed
  wiring lines; 665 planned, 675 maximum changed lines.
