pitfalls:
- 'The oracle helper for this task is pre-registered as lemonade_model_metadata in the models group. Replace the stub Op in tools/oracle/src/helpers/models/lemonade_model_metadata.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/lemonade_model_metadata.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
