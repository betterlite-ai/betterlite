deviations: []

out_of_scope:
  - Mapper protocol and base attribute utility tables; those are in B3845.
  - Message payload construction and span data projection; those are in B3843 (payloads) and B3844 (inference spans).
  - Generic message serialization and multimodal content extraction; those belong to B3845's utils.
  - Arize response attribute projection, message normalization, multimodal content, and cost/session/MCP handling; those are B3860 and B3861.

pitfalls:
  - Tool attribute budget is split among DISTINCT mappers only (not all configured mappers); if ["genai", "genai"] is given, the budget is not split and the second entry overwrites the first since they write the same keys.
  - OpenInference message shedding must preserve the first and last prompt messages and the first choice response, shedding middle prompts and extra choices first; the algorithm groups by (family, index) and uses itertools.accumulate to track running totals.
  - Langfuse usage fields match LiteLLM's token breakdown names exactly (uncached_input_tokens, cache_read_input_tokens, cache_creation_input_tokens, non_reasoning_output_tokens, reasoning_tokens, total_tokens); missing fields are None.
  - Langtrace integration uses span.add_event for prompts and completions with JSON-serialized message lists, not direct attributes on the span itself for those blobs.
  - Weave display_name is built as f"{operation} {model}", falling to None if model is None; it layers on OpenInference attributes, so compose order matters.
  - _infer_open_inference_span_kind handles both "passthrough" (no underscore) and "pass_through" keywords in call_type; either must map to llm span kind.
  - _infer_open_inference_span_kind is case-insensitive and lowercases the call_type before checking substrings; unknown and null call_types return unknown span kind.
  - _set_tool_attributes skips non-dict tool entries silently; checks function.get() independently for each tool dict before reading name/description/parameters.
  - The Oracle helper for this task is pre-registered as b3846 in the logging group. Replace the stub Op in tools/oracle/src/helpers/logging/b3846.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/b3846.py. The registry files are not this task's to edit.

