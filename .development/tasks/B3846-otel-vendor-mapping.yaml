id: B3846
title: OTel vendor attribute mapping and tool roles
description: >-
  Implement four vendor-specific attribute mappers and the mapper registry to compose them into spans simultaneously.

  Langfuse mapper emits observation and trace attributes keyed to Langfuse's vendor namespace (langfuse.observation.*, langfuse.trace.*),
  including usage fields broken down by token type (input, cached, output, reasoning) and cost details. Compose alongside GenAI
  to send both canonical and Langfuse-flavored spans at once. Every LLMCallSpanData attribute is declared as a key → extractor lambda
  in _LLM_CALL_ATTRS; JSON-payload attributes are in _BLOB_ATTRS; trace attributes are static per trace controls.

  Langtrace mapper emits operation, model, response and token count attributes keyed to Langtrace's vocabulary (gen_ai.operation.name,
  langtrace.service.name, llm.model, gen_ai.response.model, gen_ai.response_id, llm.stream, llm.token.counts.*), plus scalar
  request parameters and message blobs in Langtrace shape. No trace controls.

  OpenInference mapper (Arize + Phoenix shared vocabulary) emits LLM family attributes (openinference.span.kind, llm.model_name,
  llm.provider, llm.token_count.*), per-index message keys (llm.input_messages.{i}.message.role/content, llm.output_messages.{i}.message.role/content),
  tool definitions bundled per index (llm.tools.{idx}.tool.*), and JSON blobs for invocation parameters and serialized messages (input.value, output.value).
  Fit indexed messages into the span attribute budget, shedding least-valuable turns first (middle prompts, extra choices) while keeping
  opener/newest prompts and first choice. Takes a tool_attr_budget in __init__.

  Weave mapper layers on top of OpenInference, adding display_name (operation model), call_id and output (JSON choices) keys
  for Weave's display. Compose as ["genai", "openinference", "weave"] to feed Weave backends.

  Mapper registry: _TOOL_DEFINITION_MAPPERS is keyed by mapper name and holds callables taking a budget; _PLAIN_MAPPERS holds
  parameterless callables. resolve_mappers takes an iterable of names, validates against known mappers, splits the tool attribute budget
  across active tool-definition mappers (one distinct vocabulary per index), and returns mapper instances in order.

  Langtrace integration (litellm/integrations/langtrace.py): a LangtraceAttributes class that saves request/response/usage attributes
  to an OpenTelemetry span, reading from kwargs dict and response_obj dict. set_langtrace_attributes is the entry point; set_request_attributes,
  set_response_attributes, set_usage_attributes are helpers that map kwargs and response fields to span attributes using SpanAttributes enum keys.

  OpenInference span kind inference (_infer_open_inference_span_kind in Arize _utils.py) maps call_type strings to OpenInference
  span kinds: "embed" → embedding, "rerank" → reranker, "search" → retriever, "moderation"/"guardrail" → guardrail, "mcp"/"tool" → tool,
  "asend_message"/"assistant"/"a2a" → agent, "completion"/"chat"/"image"/"audio"/"speech" and passthrough variants → llm, "batch"/"file"/"fine_tuning" → chain,
  else unknown. Handles null/empty call_type safely.

  Tool attribute setter (_set_tool_attributes) emits tool name/description/parameters from optional_tools (optional_params.tools)
  and metadata_tools list, iterating each tool dict to extract function.{name,description,parameters} and writing indexed
  llm.tools.{idx}.* and llm.invocation_parameters.tools.{idx}.* keys.

