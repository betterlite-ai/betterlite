dod:
  - text: >-
      Four vendor-specific mapper classes (Langfuse, Langtrace, OpenInference, Weave) each implement the AttributeMapper trait.
      Langfuse and Langtrace are plain mappers; OpenInference and Weave take tool_attr_budget in __init__. Each mapper's map method
      dispatches on span type and applies extractor tables; unknown span types return empty attributes.
    proof: [vendor-mappers]

  - text: >-
      Mapper registry is registered with two frozen dicts (tool-definition and plain), resolved by name, validated against known names,
      and tool budget is split across active tool-definition mappers (distinct vocabularies only). resolve_mappers returns mapper instances
      in order or raises ValueError for unknown mapper names.
    proof: [mapper-registry]

  - text: >-
      Langfuse mapper emits observation/trace attributes from LLMCallSpanData and trace controls, with usage fields decomposed by token type
      (uncached_input, cache_read_input, cache_creation_input, non_reasoning_output, reasoning, total), cost_details as a single amount,
      and invocation parameters as a JSON blob.
    proof: [langfuse-mapper]

  - text: >-
      Langtrace mapper emits operation name, service name, model, response model/id, system fingerprint, streaming flag, scalar parameters,
      and message lists; serialization matches Langtrace's wire format exactly.
    proof: [langtrace-mapper]

  - text: >-
      OpenInference mapper emits span kind, model, provider, token counts, indexed message attributes with role/content keys per message,
      indexed tool attributes with per-definition keys (name, description, json_schema), and fits message keys into the budget by shedding
      least-valuable turns first: middle prompts, extra choices, then opener/newest.
    proof: [openinference-mapper, message-shedding]

  - text: >-
      Weave mapper layers display_name (operation model), call_id and output (JSON choices) on top of OpenInference's message/token attributes.
    proof: [weave-mapper]

  - text: >-
      Langfuse integration class sets request/response/usage attributes on an OTel span from kwargs and response dicts, using SpanAttributes enum keys,
      adding events for prompts and completions with structured message/choice lists.
    proof: [langtrace-integration]

  - text: >-
      _infer_open_inference_span_kind maps LiteLLM call_type strings to OpenInference span kinds: embed → embedding, rerank → reranker,
      search → retriever, moderation/guardrail → guardrail, mcp/tool → tool, asend_message/assistant/a2a → agent, completion/chat/image/audio/speech/passthrough variants → llm,
      batch/file/fine_tuning → chain, else unknown. Null and empty call_type return unknown.
    proof: [span-kind-mapping]

  - text: >-
      _set_tool_attributes emits indexed llm.tools.{idx}.name/description/parameters from optional_tools and llm.invocation_parameters.tools.{idx}.name/description
      from metadata_tools, reading tool dicts and extracting function.{name,description,parameters} fields with None-skipped entries.
    proof: [tool-attributes]

checks:
  optional: []
  commands:
    - id: vendor-mappers
      why: Vendor mappers do not implement AttributeMapper or dispatch correctly
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::vendors::(::|$)/) - test(/replays_the_/)'

    - id: mapper-registry
      why: Mapper registry is missing, not frozen, or resolve_mappers does not validate/budget correctly
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::registry::(::|$)/)'

    - id: langfuse-mapper
      why: Langfuse mapper attributes, trace controls or cost/usage fields are incorrect
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::langfuse::(::|$)/)'

    - id: langtrace-mapper
      why: Langtrace mapper attributes, operation name or serialization format do not match
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::langtrace::(::|$)/)'

    - id: openinference-mapper
      why: OpenInference mapper span kind, model, message/tool indexing or invocation parameters are incorrect
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::openinference::(::|$)/)'

    - id: message-shedding
      why: Message shedding does not preserve first/last prompts and first choice while removing least valuable
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::openinference::message_shedding(::|$)/)'

    - id: weave-mapper
      why: Weave mapper display_name, call_id or output attributes are incorrect
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_mappers::weave::(::|$)/)'

    - id: langtrace-integration
      why: Langtrace integration does not set request/response/usage attributes correctly
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel_integrations::langtrace::(::|$)/)'

    - id: span-kind-mapping
      why: _infer_open_inference_span_kind does not map call_type to correct OpenInference span kinds
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::arize_span_kind::infer_kind(::|$)/)'

    - id: tool-attributes
      why: _set_tool_attributes does not emit correct indexed tool name/description/parameters
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^otel::integrations::arize_span_kind::tool_attrs(::|$)/)'

    - id: helper-python
      why: The independently invoked MIT helper semantics must match the production functions.
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::logging::b3846::/)'

