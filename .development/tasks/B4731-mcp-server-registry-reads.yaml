dod:
  - text: The registry lists config servers first and database servers after, a shared id keeps the config position with the database record, and the id, allow-all, config-declared and by-ids reads follow that order.
    proof: [registry-tests]
  - text: IP accessibility is true without an ip, for a public-internet server and for an id in the public list, and otherwise follows B743's internal range check; lookup by id returns None when blocked, and lookup by name tries alias, then server_name, then name, and a blocked first match gives None without trying further.
    proof: [lookup-tests]
  - text: Public servers use the strict allow-list by default, include public-internet servers only when the hub is not strict, and look a server up in the database map before the config map.
    proof: [lookup-tests]
  - text: Permission list expansion passes through ids, expands aliases, server names and names to every match, keeps unknown entries, drops duplicates, and expand_tool_permissions groups and unions tool lists by expanded id sorted by id.
    proof: [expand-tests]
  - text: The table view fills is_config, credentials scopes, URL precedence, empty-list defaults and env vars as described, with no health fields.
    proof: [table-tests]
  - text: The tool owner lookups find a server through the owner map, then through a known prefix that the server exposes or a blocked stdio server, and a shared prefix stays with the server registered first.
    proof: [tool-owner-tests]
  - text: resolve_server tries temp, database, registry (with the id ip check) and then the name match in that order, and authorize_server maps missing, temp and no-access cases to the NotFound and Forbidden results as described.
    proof: [resolution-tests]

checks:
  optional: []
  commands:
    - id: registry-tests
      why: the registry order or one of the id reads is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry::tests::registry_/)'
    - id: lookup-tests
      why: ip access, lookup by id or name, or the public server rules are missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry::tests::lookup_/)'
    - id: expand-tests
      why: permission or tool permission expansion is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry::tests::expand_/)'
    - id: table-tests
      why: the table view of a server has a wrong or missing field
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry::tests::table_/)'
    - id: tool-owner-tests
      why: the tool name to server lookup is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry::tool_owner::tests::/)'
    - id: resolution-tests
      why: server resolution order or the authorization result is missing or wrong
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^registry::resolution::tests::/)'

oracle_cases: []

deviations:
  - what: Settings (public ids, strict flag, internal ranges) are read from a RegistrySettings struct, not from litellm globals and the live general_settings dict on every call.
    why: betterlite has no module-level state and its config is immutable after load.
  - what: authorize_server returns a ResolutionDenied value, not an HTTPException.
    why: this crate has no HTTP framework; the route layer renders the same 404 and 403 bodies.
  - what: Lists LiteLLM builds from a Python set (expand_permission_list) come back de-duplicated in first-seen order.
    why: Python set order is not stable, so no client can rely on it.

out_of_scope:
  - "get_allowed_mcp_servers, operator_open_server_ids, the BYOM submitted-server cache, resolve_toolset_tool_permissions and get_all_allowed_mcp_servers: B6591."
  - "The MCPServer record: B6590."
  - "can_access_mcp_server and the ContextServers port: B4672."
  - "Registry mutation and reload (load_servers_from_config, reload_servers_from_database, add_server, update_server, remove_server, build_mcp_server_from_table), OAuth discovery, health_check_server, _run_health_checks and get_all_mcp_servers_with_health_and_teams: B6592 owns them."
  - "Filling ToolOwners (initialize_tool_name_to_mcp_server_name_mapping) and the catalog guards: B4682 and the tool listing task."
  - "admitted_user_context, build_effective_auth_contexts and _user_has_admin_view: B4672 and B2314, not this task."

pitfalls:
  - "get_registry is a dict union: a database record replaces a config record of the same id but the key keeps the config position, so do not append it at the end."
  - "get_mcp_server_by_name stops at the first matching pass; a blocked alias match returns None and does not try server_name or name."
  - "is_server_public looks in the database map first and then the config map, and the strict flag defaults to true: a public-internet server is not on the hub unless its id is in the list."
  - "get_mcp_servers_from_ids returns records in registry order, not in the order of the ids given."
  - "expand_permission_list keeps an unknown identifier on purpose, because the later access check denies it by comparing with the real server id."
  - "known_prefix_to_server walks the registry in reverse so the first registered server wins a shared prefix."
  - "A Temp resolution is never authorized for a non-admin, even when the user could reach the same id in the registry."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
