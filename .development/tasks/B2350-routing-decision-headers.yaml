id: B2350
title: Routing decision response headers
description: >-
  Extract the pure routing-decision header projections into betterlite-router routing_decision_headers.
  Own _routing_header_mapping, _header_string, complexity_router_decision_headers and
  replace_complexity_router_headers (L26-L80), and apply_quality_router_decision_headers (L147-L164)
  in router_utils/add_retry_fallback_headers.py. These move below B847 and the B338/B366 routing
  pipelines; importing a classifier to serialize its already computed decision creates a cycle.

  Complexity projection accepts a strict mapping or an empty mapping on validation failure. Prefer
  litellm_metadata whenever that key exists, even if null, otherwise metadata. Each nested mapping
  failure becomes empty silently. Only router_type exactly 'complexity' produces headers. Map tier,
  cause, score and tier_litellm_params.reasoning_effort to x-litellm-complexity-router-tier, -cause,
  -score and -reasoning-effort. Score must be a finite int/float, excluding bool; preserve its string
  rendering. Header strings are stripped then accepted only when nonempty and every character is
  ASCII space through tilde. Drop each invalid value independently, without warning or error.

  Replacement removes every old x-litellm-complexity-router-* key absent from the new map, keeps
  unrelated old headers, and lets new values win, including new unrelated keys. Matching is case
  sensitive. Quality projection reads only dict metadata.quality_router_decision, ignoring
  litellm_metadata. A non-dict request/metadata/decision adds nothing. For non-null routed_model,
  quality_tier, routed_via, matched_keyword and complexity_tier, stringify and overwrite respectively
  x-litellm-quality-router-model, -tier, -via, -keyword and -complexity. Unlike complexity values,
  quality values are neither trimmed nor ASCII-filtered here; HTTP serialization remains B016's
  responsibility. Empty strings, zero and false are retained.

  Expose decode_routing_header_value(&str) for _header_string, fuzz it with whitespace,
  Unicode, CR/LF, controls and ASCII boundary seeds, and keep the existing bounded HelperCase decoder
  in B171. Add Management::models.routing_decision_headers under B856. Python calls the pinned pure
  functions directly; Rust uses the production module. Compare exact maps, including overwritten
  and omitted fields. No settings, database, enterprise hook or route are introduced.

  The owned functions contain 67 nonblank noncomment lines plus three constants. Budget 100 production, 170 tests,
  85 adapters, 65 fuzz and 30 wiring lines, 450 within 500. Keep source files below 300 lines.
scope:
  paths:
    - crates/betterlite-router/src/routing_decision_headers.rs
    - crates/betterlite-router/src/routing_decision_headers/**
    - crates/betterlite-router/Cargo.toml
    - crates/betterlite-router/fuzz/Cargo.toml
    - crates/betterlite-router/fuzz/fuzz_targets/routing_header_value.rs
    - crates/betterlite-router/fuzz/corpus/routing_header_value/**
    - tools/oracle/src/helpers/router/routing_decision_headers.rs
    - tools/oracle/src/helpers/router/routing_decision_headers/**
    - tools/oracle/helpers/routing_decision_headers.py
    - tools/oracle/helpers/routing_decision_headers/**
    - tools/oracle/cases/helpers/routing-decision-headers/**
    - tools/oracle/fuzz/corpus/helper_case/routing-decision-headers-*
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/add_retry_fallback_headers.py#L21-L80
    why: Strict mapping, header value validation, complexity projection and replacement.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/add_retry_fallback_headers.py#L147-L164
    why: Quality projection has different metadata precedence and value acceptance.
dod:
  - text: Mapping fallbacks, metadata precedence, exact header names and overwrite/drop rules match every listed helper case.
    proof: [behavior-tests, oracle, helper-python]
  - text: routing_header_value_boundaries and replays_the_routing_header_value_corpus call the production string decoder.
    proof: [behavior-tests, header-corpus]
  - text: The new Management operation is represented by an added bounded helper-case seed.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: behavior-tests
      why: Missing header projection tests or incompatible values must fail.
      run: cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(/^routing_decision_headers::/) - test(/replays_the_/)'
    - id: helper-python
      why: The oracle must execute the actual pinned helper with a checked adapter.
      run: test -f tools/oracle/helpers/routing_decision_headers.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: header-corpus
      why: The production string decoder needs an added corpus and replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-router/fuzz/corpus/routing_header_value)" && cargo nextest run --locked -p betterlite-router --no-tests=fail -E 'test(replays_the_routing_header_value_corpus)'
    - id: helper-case-corpus
      why: A new operation must pass the shared bounded decoder.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/routing-decision-headers-*')" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/routing-decision-headers/non-mapping-nesting.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/litellm-metadata-null-wins.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/wrong-router-type.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/exact-complexity-fields.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/score-finite-not-bool.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/trim-ascii-drop-controls.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/replace-prefix-case-sensitive.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/quality-metadata-only.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/quality-zero-false-empty.yaml
  - tools/oracle/cases/helpers/routing-decision-headers/quality-overwrite-stringify.yaml
deviations: []
out_of_scope:
  - B016 owns response preparation, hidden-param access/normalization/writes, model-id attachment, response token counts and the supporting response/FallbackErrorInfo declarations.
  - B017 owns add_retry_headers_to_response; B019 owns apply_remaining_usage_headers.
  - B311 owns HiddenParamsAsyncIteratorWrapper and its four methods.
  - B398 owns get_fallback_error_info, _coerce_error_dicts, get_fallback_errors_from_headers, _add_headers_to_response and add_fallback_headers_to_response.
  - B338/B366 own decision generation; their header functions are reassigned here, with no classifier dependency.
pitfalls:
  - 'The oracle helper for this task is pre-registered as routing_decision_headers in the router group. Replace the stub Op in tools/oracle/src/helpers/router/routing_decision_headers.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/routing_decision_headers.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - A present null litellm_metadata suppresses valid metadata for complexity, while quality ignores litellm_metadata entirely.
  - Filtering quality values through the complexity ASCII sanitizer changes the pure helper result.
budget:
  max_changed_lines: 1500
  max_new_expects: 0
review_level: standard
