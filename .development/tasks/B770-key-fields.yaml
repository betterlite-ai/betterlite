id: B770
title: Key request fields and policy projections
description: >-
  Define typed key management request/response and patch fields from the pinned endpoint types plus _types
  declarations. Preserve absent/null/reset semantics, audit settings_updated_at and temporary budget
  validation. Alias policy and rotation calculation belong to B1224, not these request records.


  Build the production key_fields module in betterlite-server; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_helpers/key_settings_audit.py:
  with_settings_updated_at (L7-L14; 7 source lines). litellm/proxy/management_endpoints/key_management_endpoints.py:
  _UserRowLike.user_id (L182-L182; 1 source lines), _UserRowLike.user_email (L185-L185; 1 source lines),
  _UserRowLike.user_alias (L188-L188; 1 source lines), _UserRowLike.model_dump (L190-L190; 1 source lines),
  _UserRowLike.dict (L192-L192; 1 source lines), _KeyUpdateTx.litellm_verificationtoken (L237-L237; 1
  source lines), _KeyUpdateTx.litellm_budgettable (L240-L240; 1 source lines), _ConfigTableActions.find_many
  (L246-L246; 1 source lines), _ConfigTableActions.update (L248-L253; 6 source lines), _prisma_table (L256-L261;
  6 source lines), _deleted_verification_token_table (L264-L267; 4 source lines), _deprecated_verification_token_table
  (L270-L273; 4 source lines), _user_table (L276-L277; 2 source lines), _credentials_table (L280-L283;
  4 source lines), _config_table (L286-L289; 4 source lines), _LegacyDumpable.dict (L466-L466; 1 source
  lines), _legacy_model_dict (L469-L470; 2 source lines), _as_object_dict (L473-L474; 2 source lines),
  _model_items (L477-L478; 2 source lines), _EnvVarsParam.param_value (L483-L483; 1 source lines), _env_vars_param_value
  (L486-L487; 2 source lines). litellm/types/proxy/management_endpoints/key_management_endpoints.py: key_request_contracts
  (L1-L155; 104 source lines). litellm/proxy/_types.py: KeyRequestBase (L1340-L1362; 23 source lines),
  GenerateKeyRequest (L1376-L1396; 20 source lines), GenerateKeyResponse (L1399-L1438; 38 source lines),
  UpdateKeyRequest (L1441-L1484; 37 source lines).

  Move the inherited GenerateRequestBase (L1289-L1332), AllowedVectorStoreIndexItem (L1335-L1337),
  LiteLLMKeyType (L1365-L1373), RegenerateKeyRequest (L1487-L1495) and
  LiteLLM_ObjectPermissionBase (L1268-L1280) here from the B124 catch-all so their key callers
  never depend on an umbrella above auth. Also own InsensitiveContains (internal_user_endpoints.py
  L20-L22) below both key and user search, and utils.py _hash_token_if_needed L7188-L7197 below
  all key mutations. Its prefix_hash case hashes only case-sensitive sk- via B2314 hash_token;
  bare_hash_passthrough preserves every other string, including Bearer/JWT text and empty strings.
  B720 supplies verification rows, B859 BudgetLimitEntry, B016 UpdateRouterConfig and B2314 roles.
  The table-access adapters use B714's typed table surface and the B723/B726/B730 repositories;
  implement native fields/access instead of Python cast and one-line wrappers. No query is made
  by obtaining a table handle. B790 consumes the shared search predicate rather than owning it.

  base_field_defaults checks each field separately: models and allowed_cache_controls=[];
  spend=0; metadata/config/permissions/model_max_budget/aliases={}; key_alias,duration,max_budget,
  user_id,team_id,agent_id,max_parallel_requests,tpm_limit,rpm_limit,budget_duration,budget_limits,
  budget_fallbacks,model_rpm_limit,model_tpm_limit,mcp_rpm_limit,tag_rpm_limit,guardrails,policies,
  prompts,blocked,object_permission=None. Explicit null is preserved. blank_max_budget turns ''
  into None. object_permission_defaults makes all twelve permission fields None (not B2310's
  stored-row empty-list defaults); fields are mcp_servers,mcp_access_groups,mcp_tool_permissions,
  mcp_toolsets,blocked_tools,vector_stores,agents,agent_access_groups,models,search_tools,
  mcp_tool_search_enabled,skills. Permission maps and lists retain supplied empty values.

  key_field_defaults covers key,tpd_limit,default_estimated_output_tokens,
  default_estimated_output_tokens_per_model,budget_id,end_user_budget_id,tags,
  disable_global_guardrails,enable_prompt_caching,throttle_on_budget_exceeded,enforced_params,
  allowed_passthrough_routes,allowed_vector_store_indexes,rpm_limit_type,tpm_limit_type,
  router_settings,access_group_ids=None and allowed_routes=[]. positive_output_tokens rejects
  zero/negative estimates, including per-model values. throughput_literals accepts only
  guaranteed_throughput,best_effort_throughput,dynamic. vector_permissions requires index_name
  and index_permissions containing only read/write. generate_defaults adds soft_budget,
  send_invite_email,rotation_interval,organization_id,project_id=None, key_type='default',
  auto_rotate=false; key_type_literals also accepts llm_api,management,read_only.
  generate_cleared_ids maps empty team/org/project IDs to None. No model validator requires a
  rotation_interval here; B1224 performs that check later.

  update_defaults overrides duration,spend,soft_budget,metadata,temp_budget_increase,
  temp_budget_expiry,auto_rotate,rotation_interval,organization_id,project_id to None.
  update_blank_team removes the field from fields_set entirely; update_blank_org retains the
  supplied field as None. update_project_null retains an explicit null for later detachment.
  update_identifier permits either key or key_alias (including empty strings), rejects only both
  None. temporary_budget_pair rejects one non-null member but accepts both null or both supplied;
  it does not reject negative increases or past expiry itself. regenerate_defaults inherits
  GenerateKeyRequest but sets key,new_key,duration,spend,metadata,new_master_key,grace_period=None.

  response_token_wins overwrites key whenever token is non-null, including ''. response_json_fields
  decodes string metadata,aliases,config,permissions,model_max_budget,budget_fallbacks,
  router_settings,budget_limits before validation; malformed strings fail with the field-specific
  valid-dictionary diagnostic, even for budget_limits. Native decode_key_response covers these
  stored strings in the same fuzz target as request decoding. Response extra fields key_name,
  key_type,expires,user_id,token_id,organization_id,project_id,litellm_budget_table,token,
  created_by,updated_by,created_at,updated_at default None; key is required after normalization.

  bulk_item_fields requires key and permits only budget_id,max_budget,team_id,tags,object_permission
  as nullable declared fields; unknown extras follow BaseModel ignore. bulk_result_fields covers
  total_requested, successful_updates[{key,key_info}], failed_updates[{key,key_info=None,failed_reason}].
  broadcast_field_allowlist is exactly max_budget,budget_id,budget_duration,budget_limits,
  model_max_budget,tpm_limit,rpm_limit,model_tpm_limit,model_rpm_limit,max_parallel_requests,
  rpm_limit_type,tpm_limit_type,temp_budget_increase,temp_budget_expiry,duration,tags,metadata;
  reject extras including spend,team_id,user_id,models and permissions. empty_patch_rejected
  rejects no fields but explicit_null_patch is nonempty. selection_exclusive accepts nonempty
  key_ids XOR all_keys_in_team=true; [] with true is valid. Team ID is required and all_keys defaults
  false. custom_policy_record is frozen and requires operation generate/update/regenerate,
  existing_key (nullable but required), effective_key and the corresponding typed request.
  settings_stamp_overwrites writes a fresh aware UTC settings_updated_at while preserving all
  other fields and leaving the input untouched; updated_at is unrelated spend-write bookkeeping.

  Own the shared _budget_limit_windows decoder at key_management_endpoints.py L6090-L6104,
  used by key info and spend reset. Falsey stored values yield an empty tuple; strings are JSON
  decoded, dict entries are retained and typed entries use model_dump. Do not silently discard
  malformed JSON or invalid entries. Named cases stored_windows_empty, stored_windows_json,
  stored_windows_typed and stored_windows_invalid cover this boundary in the existing decoder
  fuzz corpus as well as the helper oracle. Route callers retain their own exception mapping.


  Represent monetary amounts with rust_decimal::Decimal and checked conversion to the pinned Postgres
  column type; retain source storage types.


  Add the key_fields operation under B856 Management::keys. Python calls only the owned MIT helper with
  injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a key-fields-*
  seed to B171 helper_case, which already owns this decoder.


  This task owns the outside-byte boundary key_fields::decode_key_request(&[u8]) -> Result<TypedValue,DecodeError>
  for key management request JSON including absent/null patch fields. Production calls this decoder before
  its typed policy functions; the cargo-fuzz target key_fields calls that same function. Seed valid, truncated,
  malformed, duplicate-field and limit-boundary inputs and add key_fields::tests::replays_the_key_fields_corpus.
  Reuse B002 limits for config and B009/B003 limits for HTTP; for a new otherwise unbounded JSON/string
  decoder cap bytes at 1048576 and JSON depth at 64. Record a typed limit failure without panicking or
  fetching URLs. B770 owns crates/betterlite-server/fuzz; create its manifest with this real decoder target
  here.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 277 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  350 production including the moved base records, 300 field/validation tests, 65 helper adapters,
  30 wiring and 45 decoder/fuzz lines: 790 changed lines within an 800-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Native-only deviation tests in this production module: key_body_limits. Exercise the precise
  changed setting/output branch and assert its configured status/error/side effects; do not add these
  differing results to oracle equality cases.


  Create crates/betterlite-server/fuzz/Cargo.toml and .gitignore exactly once here, with this task’s actual
  decoder as its first target; no empty untargeted manifest is created earlier. Later betterlite-server
  parser tasks depend directly on B770 and only register targets.
scope:
  paths:
    - crates/betterlite-server/src/key_fields.rs
    - crates/betterlite-server/src/key_fields/**
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/Cargo.toml
    - tools/oracle/src/helpers/server/key_fields.rs
    - tools/oracle/src/helpers/server/key_fields/**
    - tools/oracle/helpers/key_fields.py
    - tools/oracle/helpers/key_fields/**
    - tools/oracle/Cargo.toml
    - tools/oracle/cases/helpers/key-fields/**
    - tools/oracle/fuzz/corpus/helper_case/key-fields-*
    - crates/betterlite-server/fuzz/Cargo.toml
    - crates/betterlite-server/fuzz/fuzz_targets/key_fields.rs
    - crates/betterlite-server/fuzz/corpus/key_fields/**
    - crates/betterlite-server/fuzz/.gitignore
  lint_tables: false
