id: B3624
title: Pass-through Azure and Milvus routes
description: >-
  Build the Azure, Azure AI and Milvus pass-through routes of llm_passthrough_endpoints.py as the module passthrough_azure_milvus in crates/betterlite-server.
  This task registers its own routes (the registration task B3616 only handles configured endpoints), and B8608 mounts them and owns their HTTP oracle cases, so test the handlers here with tower oneshot over the router and fakes.
  The Azure routes finish by calling openai_pass_through from B3628, the Milvus route calls B3615's create_pass_through_route. Call them; do not copy them.
  Every name below is at most 30 characters; LiteLLM's longer names are renamed on purpose.

  Registration. `azure_milvus_router(deps: AzureMilvusDeps)` returns the axum router with these paths, each for GET, POST, PUT, DELETE and PATCH, where `endpoint` is the rest of the path without a leading slash: `/azure/{endpoint}`, `/azure_ai/{endpoint}` and `/milvus/{endpoint}`.
  `/azure` and `/azure_ai` run the same function, `azure_proxy_route`. Authentication is the normal proxy key dependency (B052), applied the way the other route tasks do it. B8608 adds the router to the app once.
  `AzureMilvusDeps` holds the handler dependencies that B3613 declares as HandlerDeps (pass them on to B3628's function and B3615's factory; read B3628's merged signature for how it takes them), the optional router (the type B3618's uses_router_model takes) and the ports below. Each port is a small trait declared in this module so tests use recording fakes and no global is read:
  - `VectorRegistryPort`: `has_index_registry()` and `has_store_registry()` (false when LiteLLM's `litellm.vector_store_index_registry` or `litellm.vector_store_registry` is None), `is_index(name)`, `index_by_name(name)` returning an `Option` of a record with `vector_store_name` and `vector_store_index`, and `store_by_name(vector_store_name)` returning an `Option` of B1131's managed vector store record. Backed by B1062 (is-index, index by name) and B1063 (store by name from the registry).
  - `VectorAccessPort`: `assert_store_access(store, key)` (B1061's assert_user_can_access_vector_store, a denied caller is its 403), `check_index_endpoint(provider, index_name, request, key)` (B1061's is_allowed_to_call_vector_store_endpoint, its result is not used, only its error) and `assert_admin_for_index_create(key)` (B1060's assert_proxy_admin_for_vector_store_index_management with operation `create`, 403 "Only proxy admins can create vector store indexes. Contact your LiteLLM administrator." for a non-admin).
  - `VectorProviderPort`: `auth_headers(provider, litellm_params)` and `complete_url(provider, litellm_params)` over the `VectorProvider` enum `{ Milvus, AzureAi }`, plus `has_config(provider)`. See the notes: B558 owns the Azure AI side, and B7892 (milvus_vector_config, MilvusProviderPorts) implements the Milvus side with MilvusVectorStoreConfig get_auth_credentials and get_complete_url. B8641 wires MilvusProviderPorts into this port, so this task adds no dependency on B7892.
  B8641 builds the real adapters.

  Azure and Azure AI route. `azure_proxy_route(endpoint, request, response, key)` runs these steps in order:
  1. `is_azure_index_create(method, endpoint)` replaces is_azure_ai_search_service_level_index_create. It is true only for POST when the endpoint, cut at the first `?` and stripped of `/` on both ends, equals `indexes` or ends with `/indexes`. When true, call VectorAccessPort.assert_admin_for_index_create(key) first; a non-admin gets that 403 and nothing else runs.
  2. `parts` is the endpoint split on `/`. `azure_index_from_endpoint(endpoint)` replaces get_azure_ai_search_index_from_endpoint: cut the endpoint at the first `?`, strip `/` from both ends, split on `/`, and return the segment right after the first segment equal to `indexes` (None when it is empty or absent). Only that segment counts as the index; `.../docs/index` has no index.
  3. When parts has more than one entry and a router exists, walk the parts in order. For each part: it is a router model when B3618's uses_router_model is true for the body `{"model": part}`; it is a managed index when the part equals the index from step 2, the index registry exists and `is_index(part)` is true. The first part that is either wins, and the router model test is checked first for that part.
  4. Router model part: read the body with B1101's get_request_body, `streaming = is_streaming_body(body)` (B3618), then call B7324's open_sse_before_first_byte around `relay_azure_router_model(router, part, endpoint, request, body, streaming, key)`, with ping_interval_seconds the setting `sse_keepalive_ping_interval_seconds` (B002) for a streaming call and none otherwise. Return its result.
  5. Managed index part: no provider config for AzureAi gives an internal error `Provider config not found for Azure AI`. No store registry gives `Vector store registry not found`. Then check_index_endpoint(AzureAi, part, request, key). Take the index record with index_by_name(part); none gives `Vector store index not found for <part>`. Take the store by the record's vector_store_name; none gives `Vector store not found for <name>`. Then assert_store_access. The extra headers are auth_headers(AzureAi, store.litellm_params). The base URL is the store's litellm_params `api_base` when it is a string, else the internal error `API base not found for <part>`. Return openai_pass_through with endpoint, request, response, key, that base, api_key none, provider AzureAi and those extra headers. Every internal error here is a plain error that becomes HTTP 500, as in B3628.
  6. No part matched: `relay_azure_body_group` (replaces _relay_azure_body_model_group). It returns none (so the route goes on) when there is no router, when B548's is_azure_body_model_inference_endpoint(endpoint) is false, when the request content type is not JSON (B1100's is_json_content_type), when the body `model` is not a string, or when uses_router_model is false for the body. Otherwise it streams like step 4 and returns the relay of that model with the same open_sse_before_first_byte wrapper.
  7. `relay_azure_router_model` first asks B548's foreign_azure_deployment(endpoint, model, served) where served is B3618's models_served_by_group(router, model), read only when the function needs it. A foreign deployment gives HTTP 400 with B3618's RelayRejection as detail: `{"error": "deployment '<name>' in the path is not served by model group '<model>'; put the model group name in the deployments segment"}`, so the body is `{"detail": {"error": ...}}`. Otherwise call B3618's relay_router_model with the endpoint unchanged.
  8. Fallthrough. Base URL is B8500's get_secret_str("AZURE_API_BASE"); none gives the internal error `Required 'AZURE_API_BASE' in environment to make pass-through calls to Azure.` Key is B3602's get_credentials("azure", None); none gives `Required 'AZURE_API_KEY' in environment to make pass-through calls to Azure.` The base is checked before the key. Then return openai_pass_through with provider Azure, that base and key, and no extra headers. The `/azure_ai` prefix uses this same Azure base, key and provider; it is only a second path.

  Milvus route. `milvus_proxy_route(endpoint, request, response, key)` runs these steps in order:
  1. No provider config (VectorProviderPort.has_config(Milvus) false) gives HTTP 500 `Unable to find Milvus vector store config.`
  2. Body = B1101's get_request_body (POST with a JSON or form content type is parsed, any other method gives an empty object, another POST content type is an error that becomes HTTP 500).
  3. `collectionName` set but not a string gives HTTP 400 `collectionName must be a string. Got <type>`, where type is `int` or `float` for a number, `bool`, `list` or `dict`. A missing, null or empty collection name gives HTTP 400 `Collection name is required. Got <body>` with the body as compact JSON.
  4. Either registry missing (has_index_registry or has_store_registry false) gives HTTP 500 `Unable to find Milvus vector store index registry or vector store registry.`
  5. `is_index(collection)` false gives HTTP 400 `Collection <name> is not a litellm managed vector store index. Only litellm managed vector store indexes are supported.`
  6. check_index_endpoint(Milvus, collection, request, key).
  7. index_by_name; none gives the internal error `Vector store index not found for <name>`. Set the body's `collectionName` to the record's vector_store_index and store the body again with B1100's set-parsed-body function (_safe_set_request_parsed_body), so the relay sends the rewritten name.
  8. store_by_name(record.vector_store_name); none gives the internal error `Vector store not found for <vector_store_name>`. Then assert_store_access.
  9. Headers = auth_headers(Milvus, store.litellm_params). Base = complete_url(Milvus, store.litellm_params). Target = B3618's provider_target_url(base, endpoint).
  10. Call B3615's create_pass_through_route with endpoint, the target as a string and those custom headers only: no custom_llm_provider, not streaming. Call the handler it returns with the request, response and key and return the result.
