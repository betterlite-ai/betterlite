dod:
  - text: The handlers are tested with tower's oneshot over this module's own Router and fake ports. B8608 mounts the routes and proves them over HTTP with the oracle cases that were listed here.
    proof: [router-tests]
  - text: azure_milvus_router serves /azure, /azure_ai and /milvus for GET, POST, PUT, DELETE and PATCH, and /azure and /azure_ai reach the same function.
    proof: [router-tests]
  - text: is_azure_index_create is true only for POST on `indexes` or a path ending in `/indexes`, azure_index_from_endpoint returns only the segment after `indexes`, and a non-admin POST to an indexes path gets the 403 before any other step.
    proof: [azure-index-tests]
  - text: azure_proxy_route sends the first part that is a router model or a managed index, checks the router model before the index for the same part, and calls open_sse_before_first_byte with the keepalive interval only for streaming bodies.
    proof: [azure-part-tests]
  - text: relay_azure_router_model answers 400 with the exact `detail.error` text for a deployment the model group does not serve, and otherwise relays with the unchanged endpoint.
    proof: [azure-foreign-tests]
  - text: relay_azure_body_group relays by the body model only for a JSON body on a body-model endpoint with a known router model, and gives none in every other case so the route goes on.
    proof: [azure-body-tests]
  - text: A managed Azure AI index runs the endpoint check, the store access check and the api-key headers, and calls openai_pass_through with provider AzureAi, no api key and the store's api_base.
    proof: [azure-store-tests]
  - text: The Azure fallthrough checks AZURE_API_BASE before the key, fails with the exact two messages, and calls openai_pass_through with provider Azure for both the /azure and /azure_ai paths.
    proof: [azure-env-tests]
  - text: milvus_proxy_route answers the exact 400 and 500 texts in order for a missing config, a non-string collectionName, a missing name, missing registries and a collection that is not a managed index.
    proof: [milvus-error-tests]
  - text: milvus_proxy_route rewrites collectionName to the index's vector_store_index, stores the changed body, sends the provider auth headers to the provider base joined with the endpoint, and passes no provider name and no streaming flag.
    proof: [milvus-forward-tests]
checks:
  optional: []
  commands:
    - id: router-tests
      why: a path or method is missing from the router, or the two Azure paths do not share one function
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::router(::|$)/)'
    - id: azure-index-tests
      why: the index create test, the index name lookup or the admin check order is wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::azure_index(::|$)/)'
    - id: azure-part-tests
      why: the part walk picks the wrong part, checks the index before the model, or sets the wrong keepalive interval
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::azure_part(::|$)/)'
    - id: azure-foreign-tests
      why: the foreign deployment rejection is missing, has other text or changes the endpoint
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::azure_foreign(::|$)/)'
    - id: azure-body-tests
      why: the body-model relay fires for a form body, a deployment path or an unknown model
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::azure_body(::|$)/)'
    - id: azure-store-tests
      why: the managed Azure AI index branch skips a check, sends a key or uses the wrong base
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::azure_store(::|$)/)'
    - id: azure-env-tests
      why: the Azure fallthrough reads the wrong variable, checks in the wrong order or uses the wrong provider
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::azure_env(::|$)/)'
    - id: milvus-error-tests
      why: a Milvus rejection has the wrong status, text or position in the order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::milvus_error(::|$)/)'
    - id: milvus-forward-tests
      why: the Milvus forward keeps the client collection name, drops the headers or sets a provider name
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^passthrough_azure_milvus::tests::milvus_forward(::|$)/)'
oracle_cases: []
deviations:
  - what: The Milvus `Collection name is required. Got <body>` message prints the body as compact JSON, where LiteLLM prints the Python dict repr.
    why: Python repr text is not ported (docs/compatibility.md). For an empty object both give `{}`, and the oracle case sends that.
  - what: The Milvus and Azure missing-config errors, the missing AZURE_API_BASE and AZURE_API_KEY errors and the vector-store lookup errors are HTTP 500 with the message in the proxy's error envelope.
    why: LiteLLM raises a bare Exception and the unhandled-error path renders it. Status and message text match; the oracle cases ignore the body shape, as B3628's missing-key case does. Open question in the notes.
  - what: The registries, the access checks and the vector store provider configs are reached through the ports VectorRegistryPort, VectorAccessPort and VectorProviderPort, and the router through B3618's trait.
    why: Python reads litellm module globals and proxy_server globals. Rust needs seams for tests, and the real adapters come later. What a client sees is the same.
  - what: The dead branch `api_base not found in vector store configuration` after Milvus get_complete_url is not built.
    why: Milvus get_complete_url raises ValueError or returns a string, never None, so the branch cannot run.
out_of_scope:
  - "The Azure AI Speech route azure_speech_proxy_route and its helpers (L1481-L1600): B3625."
  - "openai_pass_through, join_url_paths, assemble_openai_headers and the OpenAI-Beta header: B3628 owns them and this task calls openai_pass_through."
  - "create_pass_through_route and its handler: B3615. get_credentials: B3602. provider_target_url, uses_router_model, is_streaming_body, models_served_by_group, RelayRejection and relay_router_model: B3618."
  - "open_sse_before_first_byte: B7324. get_request_body: B1101. is_json_content_type and the parsed-body setter: B1100. get_secret_str: B8500."
  - "is_azure_body_model_inference_endpoint, azure_router_model_in_endpoint (no caller in these routes), foreign_azure_deployment and the Azure native pass-through config: B548."
  - "assert_proxy_admin_for_vector_store_index_management: B1060. assert_user_can_access_vector_store and is_allowed_to_call_vector_store_endpoint: B1061. The index and store registries: B1062 and B1063."
  - "AzureAIVectorStoreConfig: B558. MilvusVectorStoreConfig and ProviderConfigManager.get_provider_vector_stores_config for Milvus: B7892 implements them and B8641 wires them into VectorProviderPort; see the notes."
  - "The vector store index and store management routes: B1068 and B1076 and the other vector store route tasks."
  - "The production adapters for the three ports: B8641. The router trait: see B8640."
pitfalls:
  - "The `/azure_ai/` prefix reads AZURE_API_BASE and AZURE_API_KEY and uses provider Azure, not Azure AI; only the managed index branch uses provider AzureAi."
  - "The part walk needs more than one part and a router. A one-segment endpoint such as `models` skips the walk and goes to the body-model relay or the fallthrough."
  - "get_request_body runs only inside a matching branch, so a POST with an odd content type on an endpoint with no router model fails only in the body-model relay, and there only after the JSON content type test passes."
  - "The index test is `part == index_from_endpoint` and not 'any part is an index', so a model named like an index elsewhere in the path is not mistaken for one."
  - "The service-level `POST /indexes` check runs before everything, including the router walk; the endpoint `docs/index` or `myidx/indexes/x` is not an index create."
  - "foreign_azure_deployment matches the deployment against the group name exactly, but against the served model names ignoring case, so `GRP` is served when the group serves `grp`."
  - "The managed index branch passes api_key none, so openai_pass_through sends no authorization or api-key header from a key; only the store's own `api-key` header goes out."
  - "The body-model relay only runs for endpoints with no `openai/deployments/<name>` segment; `openai/deployments/x/chat/completions` never reaches it."
  - "Milvus reads the body even for GET, which gives an empty object, so a GET always ends in the `Collection name is required` 400."
  - "The Milvus registry check is before the managed-index check, so a deployment with no database never reaches the 400 about an unmanaged collection; it answers 500."
  - "collectionName is replaced in the stored body only after the access check on the original name; a client cannot reach another index by sending its backing name."
  - "The Milvus forward sets no custom_llm_provider, so logging types the call as a generic endpoint."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
