dod:
  - text: "_convert_to_cached_embedding handles dict, Pydantic model, and object responses and returns CachedEmbedding with format_version."
    proof: [embedding-cache-behavior]

  - text: "Per-item token detail distribution returns None when usage or prompt_tokens_details is absent, distributes details evenly across items with remainder to earliest indices, and returns None for empty details."
    proof: [embedding-cache-behavior]

  - text: "_get_per_item_prompt_tokens returns None when usage or prompt_tokens is absent, returns full total for single-item responses, and distributes evenly across multi-item responses with remainder to earliest."
    proof: [embedding-cache-behavior]

  - text: "Single embedding cache entry extracts per-item tokens and details, converts to CachedEmbedding, calls _add_cache_logic, and returns cache_key, cached_data, and kwargs."
    proof: [embedding-cache-behavior]

  - text: "async_add_cache_pipeline returns early if should_use_cache is false, returns without writing if input count differs from response count, sets TTL from self.ttl."
    proof: [embedding-cache-behavior]

  - text: "async_add_cache_pipeline delegates to native backend when _native_cache is set, uses dynamic_cache_object when injected, falls back to self.cache.async_set_cache_pipeline."
    proof: [embedding-cache-behavior]

  - text: "Mismatched input/output counts are logged with verbose output; write is skipped entirely without error."
    proof: [embedding-cache-behavior]

  - text: "All exceptions in async_add_cache_pipeline are caught and logged through _log_add_cache_failure; request is not blocked."
    proof: [embedding-cache-behavior]

  - text: "Native batch storage is only attempted when _native_cache is set and requests are successfully created; native failures are caught and logged."
    proof: [embedding-cache-behavior]

