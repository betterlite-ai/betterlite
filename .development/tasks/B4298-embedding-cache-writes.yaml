  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L843-L864
    why: "_get_per_item_prompt_tokens divides total tokens across items with quotient and remainder logic."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L866-L900
    why: "add_embedding_response_to_cache handles one embedding entry, derives cache_key, and wraps result."
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L902-L954
