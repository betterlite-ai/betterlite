id: B4298
title: Store versioned embedding entries with per-item usage
description: >-
  Build embedding format-version 2 cache records with per-item token usage distribution. Convert
  embedding responses (dict, Pydantic model, or object) into typed CachedEmbedding with format_version=2.
  Divide per-item prompt token counts across response items using integer division with remainder
  assigned to earliest indices, so summing all per-item values reconstructs the original total.
  Single-item responses use full counts directly. Divide per-item prompt token details dict across
  items, distributing integer fields with divmod and float fields with simple division. Prepare
  embedding response for cache write, computing preset cache key and extracting per-item token
  usage from the response. Perform bulk cache writes for embeddings by checking should_use_cache,
  verifying input count matches response count (skip write if mismatched), setting TTL from self.ttl,
  processing each input, then delegating to native batch storage (if configured), dynamic cache
  object (if injected), or default cache backend. When input/output counts differ, skip write and
  log debug message without error. Extract request/response pairs through _native_request for native
  batch storage. Preserve dynamic cache injection and log any failure through _log_add_cache_failure,
  continuing without blocking (best-effort semantics).
