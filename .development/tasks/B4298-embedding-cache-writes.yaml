deviations:
  - what: >-
      Native ResponseCacheRuntime integration for batch storage is not implemented. The embedding
      cache pipeline attempts _native_cache.async_store_batch only when _native_cache is configured
      and native requests are successfully created; in betterlite, _native_cache is never set per
      B4299, so this code path has no runtime execution.
    why: >-
      The rust_bridge package is outside the repository inventory per repository policy. Native
      ResponseCacheRuntime and native async_store_batch dispatch are not built. The pipeline
      falls back to dynamic cache object or self.cache for all storage operations in betterlite
      deployments.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L938-L948

  - what: >-
      When input count does not match response count, the write is skipped with verbose logging
      rather than attempting a partial write.
    why: >-
      Partial writes would lose track of which inputs were cached and which were not, making
      retrieval unreliable. Skipping the entire write preserves correctness and allows the
      calling code to handle the mismatch if needed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L912-L919

  - what: >-
      Cache write exceptions are caught and logged through _log_add_cache_failure; the request
      continues without blocking on cache errors (best-effort semantics).
    why: >-
      LiteLLM treats cache as best-effort; a storage failure should not fail the user's request.
      All errors are logged for observability, but execution continues.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L953-L954

out_of_scope:
  - B4290 owns CachedEmbedding TypedDict and EMBEDDING_CACHE_FORMAT_VERSION; embedding writes reference them.

  - B4296 owns should_use_cache and get_cache_key; embedding writes call them.

  - B4297 owns _add_cache_logic, _native_request, _log_add_cache_failure and cache envelope semantics; embedding writes call them.

  - Verbose logging infrastructure (verbose_logger.debug) is plain logging, not an owned function; the mismatch warning uses it directly.

  - The rust_bridge package is excluded by the repository inventory; native ResponseCacheRuntime
    and native async_store_batch are not built per repository policy.

  - Cache configuration and initialization (_native_cache setting) are owned by B4299.

  - Embedding retrieval and merge (cache hits, partial embeddings) are owned by B4303.

pitfalls:
  - >-
    The _get_per_item_prompt_tokens_details distributes token details by field: integer fields use quotient/remainder,
    floats divide evenly, other fields pass through unchanged. The remainder always goes to the earliest items (idx_in_result_data < remainder).

  - >-
    For multi-item responses, divmod(total, num_items) gives quotient and remainder; an item at index idx gets quotient + 1
    only if idx < remainder. A single-item response (num_items == 1) returns the full total without distribution.

  - >-
    The async_add_cache_pipeline function checks input count once at the start: isinstance(kwargs["input"], list) versus str.
    If mismatched, it returns early without attempting any writes. This is an all-or-nothing approach, not partial caching.

  - >-
    Native batch storage is only attempted if _native_cache is not None. When it is set, requests are extracted through
    _native_request; any request that returns None is filtered out, and both request and response tuples must be non-empty.

  - >-
    The cache_list is built by iterating over inputs (either a list or wrapped as a list for the str case). Each entry
    is (cache_key, cached_data), and cached_data is the envelope-wrapped result from _add_cache_logic.

