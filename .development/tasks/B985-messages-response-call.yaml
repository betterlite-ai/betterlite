id: B985
title: Messages response call
description: >-
  Build and execute the Messages-to-Responses call through responses-create-call using explicit forwarding of params
  and encrypted-reasoning capability. Return native Anthropic response or translated stream, keeping call context
  and normalized errors from B014.


  Implement crates/betterlite-core/src/api/messages_response_call.rs. Use MessagesResponseCallInput and MessagesResponseCallResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions messages_responses_request, encrypted_task_required, native_responses_error,
  stream_responses_adapter under api::messages_response_call::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): env.DEFAULT_MAX_TOKENS
  defaults to 4096. No environment reads occur outside betterlite-config. Test api::messages_response_call::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesResponseCall in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_response_call: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/llms/anthropic/pass_through/responses_adapters/handler.py: _forwarded_kwargs (L33-L35);
  litellm/llms/anthropic/pass_through/responses_adapters/handler.py: _provider_returns_encrypted_reasoning (L38-L44);
  litellm/llms/anthropic/pass_through/responses_adapters/handler.py: _build_responses_kwargs (L47-L158); litellm/llms/anthropic/pass_through/responses_adapters/handler.py:
  LiteLLMMessagesToResponsesAPIHandler.async_anthropic_messages_handler (L169-L221); litellm/llms/anthropic/pass_through/responses_adapters/handler.py:
  LiteLLMMessagesToResponsesAPIHandler.anthropic_messages_handler (L224-L303). Abstract/protocol declarations map
  to native types and synchronous/async wrappers share one implementation; a partial function span is the explicit
  preparation/transition stage described above, with typed values passed to the following stage.


  Sizing: 248 owned nonblank/non-comment/non-docstring Python lines (261 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 268 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 533 total within the 540-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B014 (Call dispatch across providers and call types, shared settings and helpers), B171
  (Direct helper oracle and URL path encoding), B932 (Responses create call), B983 (Messages responses input), B984
  (Messages responses output), B986 (Messages response stream), B1087 (Api boundaries), B962 (Messages thinking),
  B002 (Load LiteLLM config.yaml into typed config). These are callable/type/config owners, not provider-family
  umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data branches.
