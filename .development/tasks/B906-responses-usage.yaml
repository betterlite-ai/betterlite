id: B906
title: Responses usage
description: >-
  Convert Responses usage into B004 chat usage, retaining cached, reasoning, audio and output token detail with
  checked arithmetic and exact optional-field semantics. Expose a typed conversion used by logging and bridge tasks,
  without adding prices or spend writes.


  Implement crates/betterlite-core/src/api/responses_usage.rs. Use ResponsesUsageInput and ResponsesUsageResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions cached_input_token_details, reasoning_output_token_details, audio_details,
  missing_usage_detail, zero_tokens under api::responses_usage::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ResponsesUsage in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {responses_usage: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/responses/utils.py: ResponseAPILoggingUtils._is_response_api_usage (L1142-L1148);
  litellm/responses/utils.py: ResponseAPILoggingUtils._transform_response_api_usage_to_chat_usage (L1151-L1263).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 104 owned nonblank/non-comment/non-docstring Python lines (114 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 124 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 374 total within the 400-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B171 (Direct helper oracle and URL path encoding), B902 (Responses shapes), B1087 (Api
  boundaries), B004 (OpenAI chat completions without streaming), B905 (Responses parameters). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
