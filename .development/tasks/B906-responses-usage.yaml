id: B906
title: Responses usage normalization
description: >-
  Convert Responses and image/realtime usage into chat Usage in betterlite-core::api::responses_usage.
  Own _is_response_api_usage, _transform_response_api_usage_to_chat_usage and its sole-use
  _output_token_detail helper, moved whole from B905. Use B1138's ResponseAPIUsage and B004's
  Usage/detail wrappers and text_tokens_without_nested_reasoning. This transformation performs
  no pricing or persistence. Preserve provider extension fields and Decimal cost; never mutate
  the caller's mapping. An existing Usage object is returned without conversion.

  Register responses_usage as a pure B171 operation. The Python projection must expose detail
  fields, extension keys and cost, not just total_tokens. Tests use absent, null, object and
  mapping inputs; no decoder/fuzz target is needed because B1138 parses wire records.
  The three methods contain 117 nonblank, non-comment source lines. Reserve 145 production,
  125 tests, 75 fixtures, 75 adapters and 20 wiring lines: 440 total.
scope:
  paths:
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - crates/betterlite-core/src/api/responses_usage.rs
  - crates/betterlite-core/src/api/responses_usage/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/core_ops/responses_usage.rs
  - tools/oracle/src/helpers/core_ops/responses_usage/**
  - tools/oracle/helpers/responses_usage.py
  - tools/oracle/helpers/responses_usage/**
  - tools/oracle/fuzz/corpus/helper_case/responses_usage-*
  - tools/oracle/cases/helpers/responses-usage/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L39-L41
  why: Attribute token counts are accepted only when Python considers them integers.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/utils.py#L1141-L1263
  why: Own usage classification, realtime alias fallback, detail projection and extension/cost preservation.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1721-L1729
  why: B004's text-token adjustment removes only reasoning counted inside reported text.
dod:
- text: >-
    usage_kinds maps null to prompt_tokens=0,completion_tokens=0,total_tokens=0. A Usage
    {prompt_tokens:2,completion_tokens:3,total_tokens:99,custom:7} stays unchanged. A mapping
    without both input_tokens and output_tokens follows ordinary Usage construction; a
    ResponseAPIUsage or mapping with both is recognized as Responses usage.
  proof: [usage-tests, oracle, usage-adapter]
- text: >-
    totals_and_aliases sends input_tokens=2,output_tokens=3,total_tokens=99; expect
    prompt_tokens=2,completion_tokens=3,total_tokens=5. Missing/null total is filled before
    validation. input_token_details={audio_tokens:2} and output_token_details={audio_tokens:3}
    populate plural fields only when those are null/absent; plural values win otherwise.
    Singular alias keys are not leaked as extension fields and the input map stays unchanged.
  proof: [usage-tests, oracle, usage-adapter]
- text: >-
    input_details preserves cached_tokens=2,audio_tokens=3,text_tokens=4,image_tokens=5,
    video_tokens=6,cache_write_tokens=7,web_search_requests=8,google_maps_grounding_requests=9
    and cached_tokens_details={text_tokens:1}. Absent details remain null; a constructed empty
    detail object retains its cached_tokens=0. Mapping and typed-object detail paths agree
    on the named fields without inventing unsupported token counts.
  proof: [usage-tests, oracle, usage-adapter]
- text: >-
    output_details sends completion_tokens=10 and details={text_tokens:10,reasoning_tokens:4,
    audio_tokens:0,image_tokens:0}; expect text_tokens=6,reasoning_tokens=4. With text_tokens=6
    expect 6, with completion=12,text=10,reasoning=4,audio=2 expect text=6,audio=2. Missing
    text stays null. The private detail extractor accepts integer 0 and true (Python bool
    is int) but returns null for string "2",decimal 2.5 or a mapping instead of an attribute object.
  proof: [usage-tests, oracle, usage-adapter]
- text: >-
    usage_extensions preserves server_side_tool_usage_details={web_search:2},custom=7 and
    cost=0.125. Extra prompt_tokens,completion_tokens,total_tokens,prompt_tokens_details and
    completion_tokens_details cannot overwrite normalized values; input_token_details and
    output_token_details aliases are excluded too. Cost null remains absent from the
    explicit post-conversion cost assignment; converting the resulting Usage again loses no fields.
  proof: [usage-tests, oracle, usage-adapter]
checks:
  optional: []
  commands:
  - id: usage-tests
    why: usage conversion loses a modality, aliases a field incorrectly or trusts an inconsistent total
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_usage::/)'
  - id: usage-adapter
    why: the usage comparison cannot observe provider extras and cost independently
    run: test -f tools/oracle/helpers/responses_usage.py && grep -qE '^[[:space:]]+responses_usage:' tools/oracle/fuzz/corpus/helper_case/responses_usage-* && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
oracle_cases:
- tools/oracle/cases/helpers/responses-usage/usage-kinds.yaml
- tools/oracle/cases/helpers/responses-usage/totals-and-aliases.yaml
- tools/oracle/cases/helpers/responses-usage/input-details.yaml
- tools/oracle/cases/helpers/responses-usage/output-details.yaml
- tools/oracle/cases/helpers/responses-usage/usage-extensions.yaml
deviations: []
out_of_scope:
- In responses/utils.py B905 owns parameter/prompt/header methods and shape predicates, B903 owns codecs, and B904 owns traversal; decode_container_id_to_original has no caller at the pin.
- B004 owns chat Usage construction and text_tokens_without_nested_reasoning; B1138 owns Responses usage validation.
pitfalls:
- 'The oracle helper for this task is pre-registered as responses_usage in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/responses_usage.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/responses_usage.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A supplied total_tokens=99 is recomputed to 5 for Responses usage but remains 99 for an existing Usage object.
- Realtime singular detail names are fallback inputs, not additional serialized chat usage fields.
- text_tokens may include reasoning; subtracting all reasoning unconditionally undercounts providers that already separated it.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 1
