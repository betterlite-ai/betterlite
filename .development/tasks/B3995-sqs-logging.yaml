id: B3995
title: Publish signed and optionally encrypted SQS log messages
description: >-
  Implement SQS event ingestion and signed form-encoded SendMessage, with optional
  AppCrypto encryption and the existing health-check result behavior. Preserve
  that this is one message per event, not AWS SendMessageBatch.

  Build SQSLogger as a CustomBatchLogger subclass that enqueues StandardLoggingPayload
  entries and sends each one individually through SigV4-signed HTTP POST. On success
  and failure events, append payloads to the queue; async_send_batch launches
  individual send tasks and returns; the queue clearing is owned by B256's flush_queue,
  which calls async_send_batch and then clears the queue, so arrivals during a flush
  are queued separately.

  Initialize with resolved SQS connection parameters (queue URL, region, endpoint,
  credentials) from litellm.aws_sqs_callback_params with environment-variable resolution
  (os.environ/ prefix) and parameter precedence. Defaults are batch size 512 and
  flush interval 10 seconds. Load encryption settings (sqs_aws_use_application_level_encryption,
  sqs_app_encryption_key_b64, sqs_app_encryption_aad) and construct AppCrypto on
  demand when enabled, raising if a key is required but missing.

  Send each message as a form-encoded POST body (Action=SendMessage&Version=<SQS_API_VERSION>&MessageBody=...)
  with Content-Type application/x-www-form-urlencoded. Encrypt plaintext payloads
  when configured: decode the supplied base64 key, encrypt the JSON-stringified payload
  with optional UTF-8-encoded AAD, and wrap the result in `{"__encrypted__": true, "payload": <encrypted>}`.
  Sign requests using SigV4 (credentials, "sqs" service, resolved region) and send via
  httpx. Errors are logged and swallowed, so async_send_message never raises to the caller.

  The async_health_check method sends a single test message and returns healthy/unhealthy
  status with error detail. Because async_send_message swallows errors, health checks may
  report healthy even after send failures if test-message construction succeeds.

