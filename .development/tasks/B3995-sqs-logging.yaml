  - text: _init_sqs_params constructs AppCrypto when sqs_aws_use_application_level_encryption is true, raising if sqs_app_encryption_key_b64 is missing.
    proof: [sqs-tests]
  - text: async_log_success_event and async_log_failure_event extract standard_logging_object, optionally strip base64 inline patterns, and append to the queue.
    proof: [sqs-tests]
  - text: async_send_batch launches asyncio tasks for each queued payload via async_send_message and returns without clearing the queue.
    proof: [sqs-tests]
  - text: async_send_message encodes the message body as form-urlencoded (Action=SendMessage&Version=...) with URL-quoted MessageBody.
    proof: [sqs-tests]
  - text: async_send_message encrypts the JSON payload when sqs_aws_use_application_level_encryption is true, wrapping encrypted bytes in __encrypted__ and payload fields.
    proof: [sqs-tests]
  - text: async_send_message decodes the base64 encryption key, encodes optional AAD as UTF-8 before encryption, and respects None AAD.
    proof: [sqs-tests]
  - text: async_send_message fetches credentials with all supplied AWS parameter combinations, constructs SigV4-signed request for sqs service, and POSTs via httpx.
    proof: [sqs-tests]
