checks:
  optional: []
  commands:
    - id: sqs-tests
      why: SQS logging tests fail or do not exist.
      run: cargo nextest run --locked -p betterlite-logging --no-tests=fail -E 'test(/^sqs_logging::/)'

oracle_cases: []

deviations:
  - what: async_send_message swallows all exceptions from credential fetch, signing and HTTP delivery, logging them without propagating to the caller.
    why: Matches LiteLLM behavior where callback failures do not block the request; health checks may report healthy despite prior send errors if test-message construction succeeds.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/sqs.py#L308-L309

out_of_scope:
  - litellm.get_secret and get_secret_str for dynamic environment resolution; owned by a lower utility task.
  - Base64 inline-pattern stripping (_strip_base64_from_messages); owned by a lower shared utility task.
  - create_dummy_standard_logging_payload for health-check test payloads; owned by a lower payload factory task.

pitfalls:
  - One message per event; async_send_batch launches individual POST tasks, not AWS SendMessageBatch.
  - 'Encryption wraps the encrypted bytes in a JSON object with __encrypted__: true and payload fields.'
  - Form-encoded body uses URL quoting (urllib.parse.quote with safe="") on the JSON message body.
  - SigV4 signature is computed on the prepared httpx request body before sending.
  - BaseAWSLLM.get_credentials must be awaited through asyncify since it is a synchronous method.
  - async_send_message errors are caught and logged at exception level but not re-raised, so callers never see failures.
  - Queue is cleared by CustomBatchLogger.flush_queue (B256) after async_send_batch returns, not by async_send_batch itself; because async_send_batch does not await the tasks it launches, the clear happens before delivery finishes.
  - Health check reports unhealthy with error message text, never with a stack trace.
  - The config key `"sqs_aws_use_application_level_encryption"` is 40 characters, exceeding the 30-character identifier limit; use a shorter Rust field or variant name (e.g. `use_app_encryption`) while keeping the string literal unchanged for config-key and environment lookup.

review_level: security
