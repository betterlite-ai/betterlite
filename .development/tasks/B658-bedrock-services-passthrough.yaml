id: B658
title: Bedrock passthrough and typed logging collectors
description: >-
  Add BedrockPassthroughPlan with endpoint-aware model-id encoding, configured native path and signing policy. Provide
  bounded stream collectors that project decoded events into safe normalized logging metadata, preserving text-run
  order. B101/B103 own HTTP route permissions and raw forwarding.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/passthrough/transformation.py:
  _plain_text_delta L28-L39; _CoalescedChunks.__init__ L46-L48; _CoalescedChunks.add L50-L58; _CoalescedChunks._seal_text_run
  L60-L63; _CoalescedChunks.chunks L65-L67; _translate_message L70-L82; _build_logged_response L85-L92; BedrockEventStreamCollector.__init__
  L98-L108; BedrockEventStreamCollector.add L110-L115; BedrockEventStreamCollector._add_event L117-L121; BedrockEventStreamCollector.build_logged_response
  L123-L124; BedrockPassthroughConfig.get_error_class L128-L134; BedrockPassthroughConfig.is_streaming_request L136-L137;
  BedrockPassthroughConfig._encode_model_id_for_endpoint L139-L169; BedrockPassthroughConfig.get_complete_url L171-L210;
  BedrockPassthroughConfig.get_bedrock_bearer_token L212-L213; BedrockPassthroughConfig.sign_request L215-L232;
  BedrockPassthroughConfig.logging_non_streaming_response L234-L275; BedrockPassthroughConfig.create_stream_collector
  L277-L283; BedrockPassthroughConfig._get_event_stream_decoder L285-L305.


  Reuse AmazonInvokeConfig.get_bedrock_invoke_provider from B611 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Implement crates/betterlite-bedrock/src/passthrough.rs with adjacent tests under passthrough/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation bedrock_services_passthrough in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function passthrough_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  invoke_id_encoding, converse_id_encoding, bearer_selection, native_reply_log, text_run_sealing, event_stream_collector,
  passthrough_url. Each case exercises its named outcome independently; use stable supplied clocks/IDs and fixture
  transports. HTTP cases use the booted proxy and assert both client response and captured upstream request. Existing
  API tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_passthrough* using HelperCase:
  kind: helper and the externally tagged bedrock_services_passthrough variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_passthrough that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Outside-byte boundary: decode_passthrough_log_event consumes AWS passthrough logging event JSON bytes in crates/betterlite-bedrock/src/passthrough.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_passthrough.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_passthrough.
  The adjacent test replays_the_bedrock_services_passthrough_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 219 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 108 behavior/config-test lines,
  83 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 516 planned, 525 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/passthrough.rs
  - crates/betterlite-bedrock/src/passthrough/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers/bedrock_services_passthrough.rs
  - tools/oracle/src/helpers/bedrock_services_passthrough/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/bedrock_services_passthrough.py
  - tools/oracle/cases/helpers/providers/bedrock-services-passthrough/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_services_passthrough*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_passthrough.rs
