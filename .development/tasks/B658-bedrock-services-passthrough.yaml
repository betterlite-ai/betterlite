  - oracle
  - helper-python
- text: >-
    converse id encoding: the production result, omission or failure matches tools/oracle/cases/helpers/providers/bedrock-services-passthrough/converse-id-encoding.yaml.
  proof:
  - case-converse-id-encoding
  - oracle
