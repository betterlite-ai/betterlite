  why: Own _plain_text_delta, _CoalescedChunks.__init__, _CoalescedChunks.add, _CoalescedChunks._seal_text_run,
    _CoalescedChunks.chunks, _translate_message, _build_logged_response, BedrockEventStreamCollector.__init__, BedrockEventStreamCollector.add,
    BedrockEventStreamCollector._add_event, BedrockEventStreamCollector.build_logged_response, BedrockPassthroughConfig.get_error_class,
    BedrockPassthroughConfig.is_streaming_request, BedrockPassthroughConfig._encode_model_id_for_endpoint, BedrockPassthroughConfig.get_complete_url,
    BedrockPassthroughConfig.get_bedrock_bearer_token, BedrockPassthroughConfig.sign_request, BedrockPassthroughConfig.logging_non_streaming_response,
    BedrockPassthroughConfig.create_stream_collector, BedrockPassthroughConfig._get_event_stream_decoder. Other
    functions in this file remain with the owners listed below.
