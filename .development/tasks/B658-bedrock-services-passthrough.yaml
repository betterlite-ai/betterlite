id: B658
title: Bedrock passthrough and typed logging collectors
description: >-
  Add BedrockPassthroughPlan with endpoint-aware model-id encoding, configured native path and signing policy. Provide
  bounded stream collectors that project decoded events into safe normalized logging metadata, preserving text-run
  order. B101/B103 own HTTP route permissions and raw forwarding.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/passthrough/transformation.py:
  _plain_text_delta L28-L39; _CoalescedChunks.__init__ L46-L48; _CoalescedChunks.add L50-L58; _CoalescedChunks._seal_text_run
  L60-L63; _CoalescedChunks.chunks L65-L67; _translate_message L70-L82; _build_logged_response L85-L92; BedrockEventStreamCollector.__init__
  L98-L108; BedrockEventStreamCollector.add L110-L115; BedrockEventStreamCollector._add_event L117-L121; BedrockEventStreamCollector.build_logged_response
  L123-L124; BedrockPassthroughConfig.get_error_class L128-L134; BedrockPassthroughConfig.is_streaming_request L136-L137;
  BedrockPassthroughConfig._encode_model_id_for_endpoint L139-L169; BedrockPassthroughConfig.get_complete_url L171-L210;
  BedrockPassthroughConfig.get_bedrock_bearer_token L212-L213; BedrockPassthroughConfig.sign_request L215-L232;
  BedrockPassthroughConfig.logging_non_streaming_response L234-L275; BedrockPassthroughConfig.create_stream_collector
  L277-L283; BedrockPassthroughConfig._get_event_stream_decoder L285-L305.


  Reuse AmazonInvokeConfig.get_bedrock_invoke_provider from B2205 (litellm/llms/bedrock/chat/invoke_transformations/base_invoke_transformation.py);
  its implementation remains with that prerequisite.


  Named case contracts: invoke_id_encoding: _encode_model_id_for_endpoint wraps model_id in /model/{id}/converse,
  calls B2203 CommonUtils.encode_bedrock_runtime_modelid_arn, then regex /model/([^/]+)/ extracts the result. Preserve
  colon characters and encode ARN resource slash according to B2203. For a non-ARN containing slash, regex returns
  only its first segment; do not replace this with a generic quote-all encoder. converse_id_encoding: The same encoder
  is used for every endpoint. When litellm_params.model_id is not None, replace all regex model/[^/]+/ matches in
  endpoint with model/{encoded id}/, even for empty model_id; no replacement when endpoint has no matching segment.
  Do not silently normalize embedded slashes or decode existing percent sequences. bearer_selection: Base get_bedrock_bearer_token
  always returns None even if litellm_params.api_key exists. sign_request copies params and delegates B595 service
  bedrock,request_data or{},api_key=None from getter; shared signer MAY still resolve AWS_BEARER_TOKEN_BEDROCK.
  This getter is overridden by Mantle B625; do not force the same behavior there. Error factory B682 preserves status/message/headers.
  native_reply_log: If endpoint contains invoke choose chat config model invoke/+model; else if contains converse
  choose converse/+model; elseNone. Invoke takes precedence when both occur. Call shared ProviderConfigManager.get_provider_chat_config
  with LlmProviders(custom_llm_provider); no config -> ValueError No provider config found for model: {model}. Transform
  with original model,response/request_data/logging, fresh ModelResponse, messages=[{role:user,content:no-message-pass-through-endpoint}],
  optional_params={},litellm_params={},api_key empty,global encoding. This is a logging projection only; do not
  alter the relayed bytes. text_run_sealing: Consecutive text-only deltas concatenate with no separators into the
  FIRST chunk object, preserving its id/model/role/other fields even when later chunks differ. On a nontext event
  seal before appending it. Single text chunk stays unchanged; empty strings still count as an open run. chunks()
  seals and returns accumulated sequence; adding more after a read starts a fresh run. Do not reorder usage/tool/finish
  chunks. event_stream_collector: If decoderNone, add ignores bytes entirely. Otherwise feed arbitrary fragments
  into B599 EventStreamBuffer, parse each frame with inherited B599 _parse_message_from_event; None message skipped,
  other text parsed as JSON then B608/B609 _chunk_parser. ModelResponseStream passes through; generic record converts
  only if B005 generic_chunk_has_all_required_fields then convert_generic_chunk_to_model_response_stream, otherwise
  ignored. JSON/decoder errors propagate here. Empty accumulated chunks yieldsNone; otherwise B2227 stream_chunk_builder
  gets list copy and logging_obj. passthrough_url: Copy litellm_params, resolve B591 region with model and model_id,
  then B591 runtime endpoint from explicit api_base and aws_bedrock_runtime_endpoint. Use endpoint_url, ignoring
  proxy_endpoint_url. Call B101 format_url with rewritten endpoint,endpoint_url,request_query_params or{}; return
  formatted URL and endpoint_url. is_streaming_request is case-sensitive substring stream anywhere in endpoint,
  ignoring body stream flag. plain_text_delta_rules: Text-only requires usage isNone, falsey provider_specific_fields,exactly
  one choice, falsey finish_reason,logprobs isNone, and non-None delta fields subset of content/role. content must
  be str, including empty. Tool calls/refusal/reasoning and any other populated delta field prevent coalescing.
  Presence of usage={} also prevents it. collector_decoder_selection: Endpoint containing invoke calls B2205 get_bedrock_invoke_provider.
  None provider warns Bedrock passthrough spend tracking skipped: no invoke provider for model {model} and disables
  collector. Otherwise B609 get_bedrock_event_stream_decoder(provider,model,sync_stream=True,json_mode=False); converse
  endpoint passes providerNone with same flags; other endpoints disable silently. Invoke precedence is the same
  as buffered logging. The shared legacy factory only specializes its actual Anthropic/DeepSeek paths; do not substitute
  the newer _stream_decoder Moonshot branch.


  Write standalone Rust test passthrough_credential_identity_isolation in betterlite-bedrock: Distinct configured
  identities cannot share credentials, headers or cache entries. This invariant is Rust-only, not a Python oracle
  case.


  Write standalone Rust test passthrough_secret_safe_failure in betterlite-bedrock: Debug and owned failure paths
  do not expose fixture credentials. This invariant is Rust-only, not a Python oracle case.


  Shared factory and stream-builder functions must remain single lower implementations with explicit owners; this
  task calls their typed interfaces rather than copying dispatch or aggregation. Passthrough transport/routing stays
  B101/B103.


  ProviderConfigManager.get_provider_chat_config selection is B2230. Consume its closed tag and call the selected
  existing provider constructor at this composition boundary; do not call B157.


  Implement crates/betterlite-bedrock/src/passthrough.rs with adjacent tests under passthrough/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function passthrough_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  invoke_id_encoding, converse_id_encoding, bearer_selection, native_reply_log, text_run_sealing, event_stream_collector,
  passthrough_url, plain_text_delta_rules, collector_decoder_selection. Each case exercises its named outcome independently;
  use stable supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task
  must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_services_passthrough* using HelperCase:
  kind: helper and the externally tagged bedrock_services_passthrough variant inside call. Do not put the Python
  stdin operation field in a HelperCase. Add oracle test helper_seeds_select_bedrock_services_passthrough that parses
  every prefixed seed with the production HelperCase parser, asserts that exact variant and fails on zero seeds;
  then replay the shared corpus.


  Outside-byte boundary: decode_passthrough_log_event consumes AWS passthrough logging event JSON bytes in crates/betterlite-bedrock/src/passthrough.rs
  (or its scoped child module). Add cargo-fuzz target crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_passthrough.rs
  calling that exact production function, with new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_services_passthrough.
  The adjacent test replays_the_bedrock_services_passthrough_corpus uses the same function and asserts expected
  success/failure categories; never introduce a parser solely for fuzzing.


  Budget from 219 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 270 production lines, 295 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 55 parser target/replay lines, 0 config/loader lines and 30 module/dispatch/shared-seed
  wiring lines; 760 planned, 775 maximum changed lines.
scope:
  paths:
  - crates/betterlite-bedrock/Cargo.toml
  - crates/betterlite-bedrock/src/lib.rs
  - crates/betterlite-bedrock/src/error.rs
  - crates/betterlite-bedrock/src/passthrough.rs
  - crates/betterlite-bedrock/src/passthrough/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/bedrock/services_passthrough.rs
  - tools/oracle/src/helpers/bedrock/services_passthrough/**
  - tools/oracle/helpers/bedrock_services_passthrough.py
  - tools/oracle/helpers/bedrock_services_passthrough/**
  - tools/oracle/cases/helpers/providers/bedrock-services-passthrough/**
  - tools/oracle/fuzz/corpus/helper_case/bedrock_services_passthrough*
  - crates/betterlite-bedrock/fuzz/Cargo.toml
  - crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_passthrough.rs
  - crates/betterlite-bedrock/fuzz/corpus/bedrock_services_passthrough/**
  lint_tables: false
