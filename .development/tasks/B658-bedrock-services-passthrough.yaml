deviations: []
out_of_scope:
- B030 owns final executable provider registration; public endpoint routes, persistence and Python SDK wrappers
  remain with their endpoint/SDK tasks.
- Shared transport pooling, timeout/TLS/proxy settings and implicit-retry suppression are B173; do not construct
  a second outbound client in a provider crate.
pitfalls:
- 'The oracle helper for this task is pre-registered as bedrock_services_passthrough in the bedrock group. Replace the stub Op in tools/oracle/src/helpers/bedrock/services_passthrough.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/bedrock_services_passthrough.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- A plain non-ARN model_id containing slash is truncated by the temporary-endpoint regex; generic URL encoding would
  change that result.
- Text-run coalescing keeps the first chunk metadata even when subsequent text chunks carry different ids or roles.
