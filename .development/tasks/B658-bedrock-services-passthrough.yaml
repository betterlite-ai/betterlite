checks:
  optional:
  - mutants
  commands:
  - id: case-invoke-id-encoding
    why: The invoke-id-encoding behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_invoke_id_encoding$/)'
  - id: case-converse-id-encoding
    why: The converse-id-encoding behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_converse_id_encoding$/)'
  - id: case-bearer-selection
    why: The bearer-selection behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_bearer_selection$/)'
  - id: case-native-reply-log
    why: The native-reply-log behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_native_reply_log$/)'
  - id: case-text-run-sealing
    why: The text-run-sealing behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_text_run_sealing$/)'
  - id: case-event-stream-collector
    why: The event-stream-collector behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_event_stream_collector$/)'
  - id: case-passthrough-url
    why: The passthrough-url behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::passthrough_cases::case_[0-9]+_passthrough_url$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_services_passthrough.py)" &&
      uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_services_passthrough*")"
      && grep -lq 'bedrock_services_passthrough' tools/oracle/fuzz/corpus/helper_case/bedrock_services_passthrough*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_services_passthrough$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
    why: The named outside-byte production decoder lacks its target, new seeds or passing replay.
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-bedrock/fuzz/corpus/bedrock_services_passthrough)"
      && grep -q 'decode_passthrough_log_event' crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_services_passthrough.rs
      && cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::replays_the_bedrock_services_passthrough_corpus$/)'
