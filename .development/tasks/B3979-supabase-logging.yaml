id: B3979
title: Supabase request lifecycle records
description: >-
  Build Supabase request logging with initiated inserts and terminal
  success/failure upserts. The Supabase logger handles the complete
  request lifecycle: an initiated insert when the call begins, and an
  upsert on success or failure that updates the row keyed by litellm_call_id.

  Implement three methods. __init__ resolves SUPABASE_URL and SUPABASE_KEY
  from configuration (B002), creates the native Supabase client, and validates
  credentials. input_log_event inserts a new row with status "initiated" at
  pre-call time, capturing model, messages, end_user and litellm_call_id.
  log_event runs at terminal callback time, calculates completion cost through
  B068's completion_cost service, calculates response_time from elapsed seconds,
  and upserts a row keyed by litellm_call_id with final status and outcome.

  Handle success and failure branches. Success: construct a data object from
  response choices, preserving model from response_obj, response content from
  choices[0].message.content, messages and end_user. Failure: construct a
  data object preserving error string from response_obj, checking for the
  special unknown-model error message ("Unable to map your input to a model.")
  and zeroing cost only in that case. In both cases, perform upsert with
  on_conflict="litellm_call_id" to update any prior initiated row.

  The class default table name is "request_logs"; preserve the
  modify_integration table-name override mechanism so callers can override it.
  Catch and log exceptions without failing the callback. The supabase Python
  SDK is imported on first use, installing via pip if needed; native runtime
  package installation requires an explicit betterlite deployment decision.

scope:
  paths:
    - crates/betterlite-logging/src/supabase.rs
    - crates/betterlite-logging/src/supabase/**
  lint_tables: false

