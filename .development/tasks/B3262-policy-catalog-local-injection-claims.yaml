id: B3262
title: Local injection, claims and airline topic catalog records
description: >-
  Retain the local backup prompt-injection, claims and airline-topic records in their distinct guardrail structures.
  The backup file `litellm/policy_templates_backup.json` serves as an offline fallback when the published remote catalog is unreachable.
  This task owns three independently structured templates that have no published counterparts in the root catalog.
  The airline-off-topic-restriction record (lines 1847-1892) uses a single category-based guardrail with airline_off_topic_restriction.yaml category file reference.
  The prompt-injection-protection record (lines 2238-2457) defines three guardrail definitions with blocked_words lists: prompt-injection-blocker (15 keywords), sql-injection-blocker (8 keywords), and code-injection-blocker (7 keywords), plus six example_sentences ("Ignore all previous instructions...", "DROP TABLE users; --", etc.).
  The claims-agent-safety record (lines 2820-2950) defines five guardrail definitions using distinct category file references: claims_fraud_coaching, claims_phi_disclosure, claims_prior_auth_gaming, claims_system_override, and claims_medical_advice.
  Preserve exact field order, keyword values, category file paths, icon colors, complexity levels (Medium/Medium/High), and tag structure (two tags for airline and injection, three tags for claims) as specified in the pinned LiteLLM commit.
  All three records include templateData with policy_name, description, guardrails_add arrays, and empty guardrails_remove arrays. All three records carry estimated_latency_ms value 1.
scope:
  paths:
    - litellm/policy_templates_backup.json
  lint_tables: false
