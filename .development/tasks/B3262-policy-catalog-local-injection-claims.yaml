    proof: [catalog-data]
  - text: The local prompt-injection-protection fragment holds the complete record including three guardrailDefinitions with blocked_words arrays and example_sentences.
    proof: [catalog-data]
  - text: The local claims-agent-safety fragment holds the complete record including five guardrailDefinitions with category file references.
    proof: [catalog-data]
  - text: All three fragments are valid JSON and each holds exactly one object with LiteLLM's keys in order.
    proof: [catalog-data]
  - text: >-
