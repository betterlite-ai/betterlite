id: B3262
title: Local injection, claims and airline topic catalog records
description: >-
  Retain the local backup prompt-injection, claims and airline-topic records in their distinct guardrail structures.
  LiteLLM's backup file `litellm/policy_templates_backup.json` serves as an offline fallback when the published remote catalog is unreachable.
  This task owns three independently structured templates that have no published counterparts in the root catalog.
  Write each record to its own fragment file under `crates/betterlite-policy/assets/templates/local/`: `airline-off-topic-restriction.json`, `prompt-injection-protection.json` and `claims-agent-safety.json`. Each holds exactly one JSON object: the record as LiteLLM has it at the pinned commit, with the same keys in the same order and the same values.
  B3252 (local lookup) and B3253 (remote catalog) assemble the fragments in LiteLLM's source order from an explicit list, so the order of records is their job, not this task's.
  The airline-off-topic-restriction record (lines 1847-1892) uses a single category-based guardrail with airline_off_topic_restriction.yaml category file reference.
  The prompt-injection-protection record (lines 2238-2457) defines three guardrail definitions with blocked_words lists: prompt-injection-blocker (14 keywords), sql-injection-blocker (8 keywords), and code-injection-blocker (7 keywords), plus six example_sentences ("Ignore all previous instructions...", "DROP TABLE users; --", etc.).
  The claims-agent-safety record (lines 2820-2950) defines five guardrail definitions using distinct category file references: claims_fraud_coaching, claims_phi_disclosure, claims_prior_auth_gaming, claims_system_override, and claims_medical_advice.
  Preserve exact field order, keyword values, category file paths, icon colors, complexity levels (Medium/Medium/High), and tag structure (two tags for airline and injection, three tags for claims) as specified in the pinned LiteLLM commit.
  All three records include templateData with policy_name, description, guardrails_add arrays, and empty guardrails_remove arrays. All three records carry estimated_latency_ms value 1.
scope:
  paths:
    - crates/betterlite-policy/assets/templates/local/airline-off-topic-restriction.json
    - crates/betterlite-policy/assets/templates/local/prompt-injection-protection.json
    - crates/betterlite-policy/assets/templates/local/claims-agent-safety.json
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L1847-L1892
    why: The complete airline-off-topic-restriction record with its category-based guardrail definition and estimated_latency_ms.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L2238-L2457
    why: The complete prompt-injection-protection record with three guardrail definitions using blocked_words, example_sentences, and all keyword variants.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/policy_templates_backup.json#L2820-L2950
    why: The complete claims-agent-safety record with five category-based guardrail definitions covering fraud, PHI, prior-auth, system override, and medical advice.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/policy_endpoints/endpoints.py#L610-L624
    why: The _load_policy_templates_from_local_backup function that loads this backup file and returns these records in its catalog array.
