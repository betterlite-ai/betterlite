  why: The downstream tokenizer owner decides whether cohere, anthropic, llama2, and llama3 names attempt Hugging Face loading; this route must not reproduce that choice.
dod:
- text: >-
    With Authorization: Bearer oracle-key and JSON {"model":"gpt-4o","input":"Hello"}, POST /v1/responses/compact
    calls the compact port once with route_type="acompact_responses", model=None, and the complete parsed mapping.
    The mock provider sees B934's expected request and the client receives its HTTP 200 compact response. A provider
    failure reaches B014's _handle_llm_api_exception rather than a second local mapper.
  proof: [case-compact-primary, new-oracle-cases, oracle]
- text: >-
    The same compact body succeeds on POST /responses/compact and POST /openai/v1/responses/compact. Adding
    ?model=wrong leaves body model "gpt-4o" unchanged, creates no duplicate route/provider operation, and all three
    OpenAPI entries use tag "responses" with authentication required.
  proof: [case-compact-aliases, oracle]
- text: >-
    POST /v1/responses/input_tokens with {"model":"gpt-4o","input":"Hello, how are you?"} creates exactly one
    {"role":"user","content":"Hello, how are you?"} message, invokes the counter with call_endpoint=true, and returns
    HTTP 200 with object "response.input_tokens" and the counter's integer total; this route makes no completion call.
  proof: [case-string-input, oracle]
- text: >-
    POST /v1/responses/input_tokens with model "gpt-4o", input [{"role":"user","content":"Hello"}], instructions
    "Be brief", and tools [{"type":"function","function":{"name":"lookup","parameters":{}}}] sends a leading
    {"role":"system","content":"Be brief"} message, the converted list, and the exact tools list to TokenCountRequest.
    HTTP 200 contains object "response.input_tokens". Repeating with instructions "" adds no system message.
  proof: [case-list-instructions-tools, oracle]
- text: >-
    For JSON model absent, null, 7, or "", every input-token alias returns HTTP 400 with type
    "invalid_request_error", param "model", code "missing_required_parameter", and message
    "Missing required parameter: 'model'." before the counter is called.
  proof: [case-model-validation, oracle]
- text: >-
    With model "gpt-4o", input absent and input null each return HTTP 400 with type "invalid_request_error",
    param "input", code "missing_required_parameter", and message "Missing required parameter: 'input'." Input ""
    and [] each return HTTP 400 with param null, code "missing_required_parameter", and message
    "One of \"input\" or \"previous_response_id\" or 'prompt' or 'conversation' must be provided.".
  proof: [case-input-validation, oracle]
- text: >-
    input [1] with model "gpt-4o" enters the B909 conversion and TokenCountRequest try block and returns HTTP 400
    with type "invalid_request_error", param null, code null, and message beginning exactly
    "Invalid request for token counting: ". tools "not-a-list" with input "Hello" follows the same status/type/param/code envelope.
  proof: [case-conversion-validation, oracle]
- text: >-
    A body with model "gpt-4o" and input 42 is not treated as missing: conversion produces an empty message tuple,
    B196 receives it, and HTTP 200 contains object "response.input_tokens" with the independently computed total.
    Model "does-not-exist" with input "Hello" also remains successful and uses B196's configured fallback instead of a
    route-level 400.
  proof: [case-runtime-shapes, oracle]
- text: >-
    Missing Authorization and Authorization: Bearer sk-invalid are rejected on /responses/compact,
    /v1/responses/compact, /openai/v1/responses/compact, /responses/input_tokens, /v1/responses/input_tokens, and
    /openai/v1/responses/input_tokens with HTTP 401, error type "auth_error", param "None", and code "401"; no
    compact processor, conversion, or token-counter call is recorded.
  proof: [case-authentication, oracle]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: The scoped server or core modules lack executable coverage for the compact and input-token route contracts.
    run: cargo nextest run --locked -p betterlite-server -p betterlite-core --no-tests=fail -E 'test(/^api::responses_input_tokens::/) - test(/::replays_corpus$/)'
  - id: case-compact-primary
    why: The primary compact path does not preserve the B014 handoff arguments or B934 provider result.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::compact_primary($|::)/)'
  - id: case-compact-aliases
    why: A compact alias is absent, reads query data, or performs a duplicate route/provider operation.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::compact_aliases($|::)/)'
  - id: case-string-input
    why: A string input is not projected to one user message or its response.input_tokens result is wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::string_input($|::)/)'
  - id: case-list-instructions-tools
    why: List conversion, truthy instruction ordering, empty instruction suppression, or tools passthrough is wrong.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::list_instructions_tools($|::)/)'
  - id: case-model-validation
    why: One of the four literal invalid model values reaches token counting or returns a different 400 envelope.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::model_validation($|::)/)'
  - id: case-input-validation
    why: Null versus empty input does not select its specified message, param, and code fields.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::input_validation($|::)/)'
  - id: case-conversion-validation
    why: A conversion or TokenCountRequest error loses the prefix or explicit null param/code values.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::conversion_validation($|::)/)'
  - id: case-runtime-shapes
    why: Scalar input 42 is incorrectly rejected, or unknown model does-not-exist is rejected before B196's fallback.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::runtime_shapes($|::)/)'
  - id: case-authentication
    why: Any of the six protected aliases accepts missing or invalid credentials or performs downstream work first.
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_input_tokens::tests::authentication($|::)/)'
  - id: new-oracle-cases
    why: The branch adds no response input-token fixtures covering aliases, literals, projection, and compact provider order.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/api/responses-input-tokens)"
