id: B939
title: Responses input tokens
description: >-
  Add the proxy adapters for Responses compaction and input-token counting. Mount exactly POST /responses/compact,
  POST /v1/responses/compact, and POST /openai/v1/responses/compact. Each compact path requires user_api_key_auth,
  reads B1100's parsed JSON mapping, and calls B014's ProxyBaseLLMRequestProcessing.base_process_llm_request with
  the complete mapping, route_type="acompact_responses", and model=None. With Authorization: Bearer oracle-key and
  {"model":"gpt-4o","input":"Hello"}, the mock provider receives B934's compact request and the client receives its
  result; B014 owns _handle_llm_api_exception and the provider error mapping.

  Mount exactly POST /responses/input_tokens, POST /v1/responses/input_tokens, and POST /openai/v1/responses/input_tokens.
  They use the route-level user_api_key_auth dependency and the literal OpenAPI tag "responses". Read model, input,
  instructions, and tools with data.get from B1100's mapping. Absent, null, numeric 7, and empty-string model values
  return HTTP 400 with {"error":{"message":"Missing required parameter: 'model'.","type":"invalid_request_error",
  "param":"model","code":"missing_required_parameter"}}. Absent or null input returns the same shape with message
  "Missing required parameter: 'input'." and param "input". Input "" and [] return HTTP 400 with type
  "invalid_request_error", param null, code "missing_required_parameter", and message
  "One of \"input\" or \"previous_response_id\" or 'prompt' or 'conversation' must be provided.".

  For a non-empty string, the adapter asks B909's transform_responses_api_input_to_messages for one
  {"role":"user","content":<string>} message with replay_reasoning=False. For a list, it supplies the list and the
  optional truthy instructions value to B909; "Be brief" becomes a leading {"role":"system","content":"Be brief"}
  message, while instructions "" adds no system message. Pass data.get("tools") unchanged, including None when
  absent and [] when present. Validate {"model":<model>,"messages":<converted messages>,"tools":<tools>} as
  B196's TokenCountRequest and await the injected counter with call_endpoint=True. A conversion or validation
  exception returns HTTP 400 with type "invalid_request_error", param null, code null, and message
  "Invalid request for token counting: " followed by the caught exception text. Success returns HTTP 200
  {"object":"response.input_tokens","input_tokens":<total_tokens>}; B196 owns the integer, provider fallback,
  disable_token_counter behavior, tokenizer selection, and tokenizer warnings.

  This endpoint slice reads no query parameter, environment variable, or config key, writes no database row, and has
  no warn-and-drop branch. For example, ?model=wrong does not override body model "gpt-4o". Keep typed records in
  crates/betterlite-core/src/api/responses_input_tokens.rs and HTTP adapters and route mounts in
  crates/betterlite-server/src/api/responses_input_tokens.rs. Reuse the existing body, auth, compact, and token
  counter ports; do not add a decoder or tokenizer download path. Test every alias through the booted HTTP oracle,
  including compact mock-provider order and each literal validation envelope.
scope:
  paths:
  - crates/betterlite-server/Cargo.toml
  - crates/betterlite-server/src/lib.rs
  - crates/betterlite-server/src/error.rs
  - crates/betterlite-server/src/api/responses_input_tokens.rs
  - crates/betterlite-server/src/api/responses_input_tokens/**
  - crates/betterlite-server/src/api.rs
  - crates/betterlite-server/src/api/**
  - crates/betterlite-server/src/routes.rs
  - crates/betterlite-server/src/routes/**
  - crates/betterlite-server/src/state.rs
  - crates/betterlite-server/src/state/**
  - crates/betterlite-core/Cargo.toml
  - crates/betterlite-core/src/api/responses_input_tokens.rs
  - crates/betterlite-core/src/api/responses_input_tokens/**
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/**
  - Cargo.toml
