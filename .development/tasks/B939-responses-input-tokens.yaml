- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L1055-L1125
  why: These records and helpers establish the error field types, HTTP 400 response, missing-parameter message construction, and input conversion call.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L1128-L1198
  why: This route block supplies all three input_tokens aliases, data.get ordering, empty-input text, validation boundary, call_endpoint=True, and result object.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L487-L532
  why: B909's transformation adds a system message only for truthy instructions and invokes the input-item converter with replay_reasoning=False.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L603-L729
  why: The delegated list conversion handles user messages, Responses records, function-call merging, tool-output deduplication, and the non-replayed return.
