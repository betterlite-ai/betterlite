id: B939
title: Responses input tokens
description: >-
  Install /responses/compact and /responses/input_tokens (including the source v1 aliases) using responses-compact-call
  and B013 token counting. Preserve input-to-message token projection and exact missing-param errors; endpoint schemas
  and parser remain typed and never download tokenizer assets.


  Register all six POST paths: /responses/compact, /v1/responses/compact, /openai/v1/responses/compact and the corresponding
  /input_tokens paths. Empty string/list input returns 400 with param null and code missing_required_parameter;
  invalid token input returns 400 with code null.


  Open, waiting for Max: permit Hugging Face tokenizer downloads or retain the current offline OpenAI-tokenizer
  fallback documented below; current successful requests still return 200, and validation retains its existing 400
  codes.


  Implement crates/betterlite-server/src/api/responses_input_tokens.rs, crates/betterlite-core/src/api/responses_input_tokens.rs.
  Use ResponsesInputTokensInput and ResponsesInputTokensResult with typed nested records; inject only the clock,
  repositories, transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087;
  do not introduce ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/responses/compact; POST /responses/compact; POST /openai/v1/responses/compact;
  POST /v1/responses/input_tokens; POST /responses/input_tokens; POST /openai/v1/responses/input_tokens. Each alias
  is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts its child
  factories without re-registering their methods/paths.


  Route input projections: data.model (absent None); data.input (absent None); data.tools (absent None); data.instructions
  (absent None).


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): endpoints.py:1099 status_code=400. Compare the actual source status, error type, param and
  code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions compact_route, input_tokens_string, input_tokens_message_list, missing_model,
  missing_input, unknown_model, empty_string_input, empty_list_input, invalid_token_request, openai_compact_alias,
  openai_input_tokens_alias, route_aliases, auth_missing, auth_invalid under api::responses_input_tokens::tests.
  Each named function drives production code and asserts its case result; use named rstest inputs for related values.
  Corpus replay has the separate name replays_corpus.


  Implement tests::compatibility_deviations with one named rstest case per deviation below, asserting the exact
  current betterlite result and the pinned contrast. These cases are not disguised as differential equality; oracle
  inputs for unchanged behavior remain comparable.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/response_api_endpoints/endpoints.py: compact_response (L988-L1052); litellm/proxy/response_api_endpoints/endpoints.py:
  _TokenCounter.__call__ (L1078-L1078); litellm/proxy/response_api_endpoints/endpoints.py: _proxy_token_counter
  (L1081-L1084); litellm/proxy/response_api_endpoints/endpoints.py: _responses_invalid_request_response (L1090-L1099);
  litellm/proxy/response_api_endpoints/endpoints.py: _missing_responses_param_response (L1102-L1107); litellm/proxy/response_api_endpoints/endpoints.py:
  _responses_input_as_token_count_messages (L1110-L1125); litellm/proxy/response_api_endpoints/endpoints.py: responses_input_tokens
  (L1143-L1198). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 165 owned nonblank/non-comment/non-docstring Python lines (193 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 185 implementation,
  124 behavior tests, 168 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring; 515 total within the 520-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B013 (Model cost map, provider
  capability data and token counting), B171 (Direct helper oracle and URL path encoding), B909 (Responses input
  messages), B934 (Responses compact call), B1087 (Api boundaries), B1100 (Shared request body decoding), B732 (Typed
  authentication principals and grant resolution), B855 (Authenticated request admission and budget handoff), B756
  (Authentication header selection and mode dispatch), B1139 (Stateful HTTP oracle scenarios). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
