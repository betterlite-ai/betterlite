deviations: []
out_of_scope:
- 'litellm/proxy/response_api_endpoints/endpoints.py: B080 owns responses_api and its decorators/body processing L194-L458; B938 owns get_response L695-L790, delete_response L811-L899, get_response_input_items L920-L970 and cancel_response L1216-L1313; B940 owns Cursor helpers/routes L77-L191 and L461-L674; B941 owns WebSocket helpers/routes L1316-L1620.'
- 'litellm/proxy/response_api_endpoints/endpoints.py: B014 owns ProxyBaseLLMRequestProcessing.base_process_llm_request and _handle_llm_api_exception. compact_response invokes both directly, so provider exceptions and their status/type/message/param/code mapping are not reimplemented here.'
- 'litellm/responses/main.py: B934 owns acompact_responses L2081-L2155 and compact_responses L2159-L2279. This task supplies route_type="acompact_responses" and consumes the compact response; provider request construction and compact response literals remain with B934.'
- 'litellm/responses/litellm_completion_transformation/transformation.py: B909 owns transform_responses_api_input_to_messages L487-L532, _transform_response_input_param_to_chat_completion_message L603-L729, transform_instructions_to_system_message L1878-L1884 and their input-item helpers. This task records arguments and consumes converted messages; list-record exception text belongs to B909.'
- 'litellm/proxy/proxy_server.py: B196 owns token_counter L13936-L14058, including provider counting when call_endpoint=True, unknown-model fallback, disable_token_counter errors, total_tokens, and warning then local fallback after a provider result with error=True. The route only builds TokenCountRequest and returns total_tokens.'
- 'litellm/utils.py: B195 owns _select_tokenizer_helper L2403-L2419 and Hugging Face family dispatch L2426-L2469; B939 does not read disable_hf_tokenizer_download or download tokenizer assets.'
- 'litellm/proxy/_types.py: B196 owns TokenCountRequest validation and TokenCountResponse fields; B939 uses the type boundary but does not duplicate Pydantic validation or token arithmetic.'
- 'litellm/proxy/common_utils/http_parsing_utils.py: B1100 owns _read_request_body and parsed-body caching. Malformed bytes, non-JSON bodies, request size limits, and decoder errors are not endpoint-local cases.'
- 'litellm/proxy/auth/user_api_key_auth.py: B003, B732, B756 and B855 own bearer extraction, key lookup, model authorization, budgets, database access, and the shared HTTP 401 envelope. B939 attaches user_api_key_auth to each route.'
- 'The six handlers add no env/config lookup, query parsing, database write, or warning-and-drop operation. B1087 owns ApiLimits; B014, B196, B195, B909, B934, and the auth owners govern delegated settings, warnings, writes, and errors. Enterprise hooks and branches are absent from the oracle.'
pitfalls:
- 'The compact decorators put user_api_key_auth in dependencies and again in the function signature, whereas input_tokens uses only the shared route dependency tuple; copying one declaration pattern onto all six paths changes admission behavior.'
- 'compact_response deliberately passes model=None even when JSON contains "model":"gpt-4o"; resolving the body model in this adapter changes the acompact_responses route contract.'
- 'The model guard is not isinstance(model_name, str) or not model_name, so absent, null, numeric 7, and "" must converge before any TokenCountRequest is built.'
- 'The input guard checks input_value is None before testing not input_value; null therefore uses param "input", while "" and [] use param null and the longer previous_response_id/prompt/conversation message.'
- 'The conversion helper does not reject every non-string/non-list runtime value: input 42 becomes an empty message tuple, while list [1] enters B909 item conversion and is caught as an invalid token-count request.'
- 'The route constructs explicit JSONResponse bodies for its validation errors, so caught conversion failures keep HTTP 400 with code null rather than inheriting the string status code used by ProxyException mapping.'
review_level: security
budget:
  max_changed_lines: 560
  max_new_expects: 0
