checks:
  optional:
  - mutants
  commands:
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/openai_mock_transport.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/openai_mock_transport*")"
      && grep -lq 'openai_mock_transport' tools/oracle/fuzz/corpus/helper_case/openai_mock_transport* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_openai_mock_transport$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-mock-reply-literals
    why: Always status200, content-type application/json; id chatcmpl-mock- followed by first8 lowercase UUID4 hex
      digits, object chat.completion, integer created clock, supplied model, one index0 choice role assistant/content
      Mock response/finish_reason stop, usage prompt_tokens1/completion_tokens1/total_tokens2. No SSE even for stream=true.
    run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/::openai_mock_transport_cases::case_[0-9]+_mock_reply_literals$/)'
  - id: case-mock-request-decoder
    why: decode_mock_request parses request.content JSON; JSON/Unicode/value failure uses model mock-model and stream
      false. Valid mapping uses model key by presence, preserving None/empty/nonstrings; missing model uses mock-model.
      Valid nonmapping JSON raises the source attribute-access failure. Method/path/headers do not alter the fixed
      response and never trigger outbound traffic.
    run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/::openai_mock_transport_cases::case_[0-9]+_mock_request_decoder$/)'
  - id: case-mock-selection
    why: litellm_settings.network_mock defaults false. B173 uses a supplied async/sync client_session whenever non-None
      before considering this flag; a truthy flag otherwise selects this mock transport before TLS/proxy/session
      construction. Supplied shared_session is ignored by the mock branch. Test both client variants and configured
      false/true.
    run: cargo nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/::openai_mock_transport_cases::case_[0-9]+_mock_selection$/)'
  - id: config-network-mock
    why: network_mock lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::openai_mock_transport_config_cases::case_[0-9]+_loads_network_mock$/)'
  - id: parser-corpus
    why: Outside bytes lack replay through the actual decoder.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-http/fuzz/corpus/openai_mock_transport)"
      && grep -q 'decode_mock_request' crates/betterlite-http/fuzz/fuzz_targets/openai_mock_transport.rs && cargo
      nextest run --locked -p betterlite-http --no-tests=fail -E 'test(/::replays_the_openai_mock_transport_corpus$/)'
