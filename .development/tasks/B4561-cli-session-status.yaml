id: B4561
title: Routed session status line and stop-hook output
description: >-
  Build the statusline_script module for betterlite-management-cli, a standard-library-only
  Python script that renders Claude Code's status line and Codex's Stop hook from routed
  session metadata. The script reads credentials from environment (ANTHROPIC_AUTH_TOKEN,
  ANTHROPIC_API_KEY, and ANTHROPIC_BASE_URL for Claude; OPENAI_API_KEY and OPENAI_BASE_URL
  for Codex), fetches the session record from GET /auto_router/session on the proxy with
  5-second caching keyed per credential/session pair, and renders a status line with model label,
  cost bar and estimated savings. Codex output is a systemMessage JSON wrapper instead. On any
  error, Claude Code gets a quiet fallback label and Codex gets an empty string. The script is
  stateless: storage, time, HTTP and stdin are injected so tests mock them. Session records hold
  router_name, last_model, spend, baseline_spend, baseline_model, turns and savings fields that
  feed the render logic; definitive 4xx responses (no session, no access) are cached as definite
  misses, while 5xx and network errors do not. Model labels come from Claude Code's own
  ~/.claude/cache/gateway-models.json. Cache entries are staged beside the target and renamed
  into place to avoid torn writes. The cache directory is private-mode on POSIX (0o700, owned
  by the current user) and pre-existing on Windows; symlinks are rejected. The script is
  installed with a version header by configure_claude_settings.install_statusline_script (B4562),
  and stays under 443 lines so it fits in this task's budget.
scope:
  paths:
    - tools/management-cli/litellm/proxy/client/cli/commands/statusline_script.py
  lint_tables: false
