dod:
  - text: The aggregated route answers SpendAnalyticsPaginatedResponse on every prefix, with api_key_limit default 100 and maximum 1000 and a value out of range answering 422.
    proof: [route-tests]
  - text: The search route requires a non-empty search, with limit default 100 and maximum 100, and an out of range limit answers 422 on every prefix.
    proof: [route-tests]
  - text: Exactly 14 routes exist, two per prefix, /end_user is hidden from the schema and answers like /customer, and the team, tag, organization, customer and agent prefixes each have both routes.
    proof: [route-tests]
  - text: The user aggregated route accepts a range of more than 400 days and answers the canonical-date message for a missing date, while the other five aggregated routes and all six search routes answer 400 for a range of more than 400 days.
    proof: [route-tests]
  - text: A reversed or non-canonical date answers 400 with detail.error before the scope resolver runs.
    proof: [route-tests]
  - text: A scope denial answers 403 or 404 with detail.error, and a non-admin asking for another user gets "Non-admin users can only view their own spend data.".
    proof: [route-tests]
  - text: A missing database answers 500 with the db_not_connected_error text before any parameter validation error, and a missing credential answers 401 first.
    proof: [route-tests]
  - text: Malformed timezone or include_current_utc_day values answer 422 instead of being ignored.
    proof: [route-tests]
  - text: The aggregated handler passes the scope, the resolved entity metadata, the resolver's entity breakdown flag and api_key_limit to B3093's function and returns its response unchanged.
    proof: [route-tests]
  - text: The search handler answers an empty list without an aggregate read when no keys match, and otherwise reads the aggregate with api_keys replaced by the found keys, no entity breakdown and the default key limit.
    proof: [search-tests]
  - text: search_rows keeps the order of the found keys, drops a key with no data in any day, sums every one of the 17 metric fields across days and takes the metadata of the first day.
    proof: [search-tests, sum-tests]
  - text: A repository or aggregation error that is not an HTTP error answers 500 with detail.error starting "Failed to fetch analytics" and the error text, and logs the route's own line; an HTTP error passes through unchanged and unlogged.
    proof: [failure-tests]
checks:
  optional: []
  commands:
    - id: route-tests
      why: the routes, their parameter bounds, the route set per prefix, the date check flag per entity, scope denials, the dependency order or the aggregated handler wiring are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^aggregate_activity_routes::tests::route_/)'
    - id: search-tests
      why: the search handler, its early return, its scope copy or search_rows and fold_key_metrics are missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^aggregate_activity_routes::tests::search_/)'
    - id: sum-tests
      why: sum_metrics leaves out a field or adds in the wrong order
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^aggregate_activity_routes::tests::sum_/)'
    - id: failure-tests
      why: errors are not turned into the 500 body and log line LiteLLM uses, or an HTTP error is wrapped
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^aggregate_activity_routes::tests::failure_/)'
oracle_cases: []
deviations:
  - what: >-
      A repository or aggregation failure answers 500 with "Failed to fetch analytics" and a colon, followed by the Rust error's display text, not Python's exception text.
    why: The wording of an internal error cannot match Python's exception strings; the prefix, the status and the detail.error shape do.
  - what: The six resolver callables become a match on B3094's Entity enum, as B3094 already records, so a route function takes the entity and uses B3094 and B3095's query and resolve functions instead of stored callables.
    why: rules.yaml requires an enum matched exhaustively in place of a registry of callables.
  - what: LiteLLM's `exception` log call also prints a stack trace; betterlite logs the one line at error level with the error text and no trace.
    why: A Rust error has no Python traceback to print, and the line text, level and logger match.
out_of_scope:
  - "B3096 owns resolved_scope, date_range_error, key_metadata, key_activity_row, key_activity_rows (L63-L162), get_daily_activity_prisma_client, get_daily_activity_repository, the key page, model leaders and cache leakage routes (L313-L353, L405-L452, L516-L557), and the types KeyActivityRow, KeySpendMetrics, KeySpendActivityRow, DailyActivityKeySearchResponse and the other response models."
  - "B3098 owns the export route and _export_filename, _content_disposition, _csv_cell, _csv_row and _stream_export_rows (L165-L184, L203-L237, L455-L513)."
  - "B8482 composes the routes of B3096 to B3098 and owns register_daily_activity_routes with its loop over the six resolvers (L560-L579); this task only exposes the per-entity route function."
  - "B3093 owns get_daily_activity_aggregated and the rollup folding; B729 owns the repository's search_keys and aggregated methods and their limit checks; B3094 and B3095 own the resolvers and query shapes; B3090 owns SpendMetrics, KeyMetadata, SpendAnalyticsPaginatedResponse, ScopeDenied, InvalidDateRange and raise_public; B815 owns aggregated_date_range_error."
pitfalls:
  - The aggregated route passes user_aggregated true for the user entity only, so /user/daily/activity/aggregated has no 400-day cap and a different missing-date message, while /team, /tag, /organization, /customer, /end_user and /agent keep the cap. The search route passes false for every entity, user included.
  - The missing-database 500 comes from a dependency, so it beats the 422 for a bad limit, api_key_limit or timezone; a test with no database and limit=0 must still answer 500, and a missing credential answers 401 before that.
  - The search route replaces the scope's api_keys with the found keys, so an api_key the caller passed only narrows the first search and not the aggregate read that follows.
  - fold_key_metrics takes the metadata from the first day that holds the key, not the last, and a key found by the search but absent from every day is dropped, so the response can have fewer rows than the limit.
  - get_daily_activity_aggregated already turns its own failure into an HTTP 500, so the handler must let that error through without wrapping it or logging "Daily activity aggregation failed" a second time.
  - include_entity_breakdown on the aggregated route comes from the resolver (B3094 sets it on for team), but the search read always passes false.
  - /end_user is the same handler set as /customer but hidden from /openapi.json, and it must not be registered twice.
  - search is a text fragment for a SQL match inside B729's builder; this task passes it through unchanged and never logs it or puts it in an error body other than inside the repository's own error text.
  - api_key_limit is 1 to 1000 on the aggregated route while the search limit is 1 to 100; do not share one bound between them.
  - 'Query values that FastAPI treats as booleans for include_current_utc_day are true, false, t, f, 1, 0, yes, no, y, n, on and off in any case; anything else is 422.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
