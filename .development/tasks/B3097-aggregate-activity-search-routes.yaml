id: B3097
title: Serve aggregate daily activity and scoped key searches
description: >-
  Build the module `aggregate_activity_routes` in betterlite-server. It serves two reports for every entity that
  has daily activity routes: the aggregated report (all days in a range, with totals and breakdowns, no paging) and
  the key search (find API keys by a text fragment, then return their summed metrics). The caller's scope (which
  users, teams, tags and so on they may see) is decided before any query runs, by B3094 and B3095. B3096 owns the
  helpers and response types used here; import them, do not copy them: `resolved_scope`, `key_metadata`,
  `get_daily_activity_prisma_client` and `get_daily_activity_repository` (the two lookups B3096 builds), plus
  `KeyActivityRow` and `DailyActivityKeySearchResponse`. B3096 owns the module `daily_activity_routes`; this task
  must not write into it.

  Routes. For each prefix in an entity's resolver (`route_prefixes`: /user, /team, /tag, /organization, /customer
  and /end_user, /agent) register GET `{prefix}/daily/activity/aggregated` and GET
  `{prefix}/daily/activity/aggregated/search`. That makes 14 routes. /end_user is an alias of /customer that
  LiteLLM leaves out of /openapi.json; keep it out of the schema too, register it once, and answer exactly like
  /customer. Each route is authenticated by B052 (the route-level dependency runs first, then the handler's own),
  carries the resolver's `tags` and the operation name from `operation_names` (`aggregated` and `search`;
  B3094's `OperationNames`), and each handler runs inside B865's management completion wrapper, like
  `@management_endpoint_wrapper`. The route functions are named after those operation names. Expose one public
  function that returns the axum routes for an entity. B8482 composes them with B3096's and B3098's and mounts them, and this task
  adds no loop over all entities and mounts nothing.

  Query parameters. The entity's own parameters are parsed by the B3094 and B3095 query types (user: start_date,
  end_date, model, api_key, user_id, timezone, include_current_utc_day; team: team_ids, exclude_team_ids and the
  rest; the other four come from B3095). Use each entity's query-params struct and its `*_entity_query` function to
  get an `EntityQuery`; this task turns the query string into those structs. The six public descriptions of the
  user parameters are `pub const` values next to B3094's UserQueryParams; the schema reads them and nothing is
  retyped here. Malformed values (an integer `timezone` that is not an integer, a boolean that is not a boolean)
  answer 422 in the envelope B003 uses for other query validation errors. Added by this task, with LiteLLM's
  constants from litellm/constants.py L2166-L2171:
  aggregated route `api_key_limit` (integer, 1 to 1000, default 100, USAGE_TOP_API_KEYS_DEFAULT and
  USAGE_TOP_API_KEYS_MAX); search route `search` (required string, at least 1 character) and `limit` (1 to 100,
  default 100, USAGE_KEY_SEARCH_DEFAULT and USAGE_KEY_SEARCH_MAX). These are fixed constants, not environment
  settings. A value out of range answers 422, never a clamped value. When the entity query and the handler's own
  parameters are both bad, one 422 lists the entity query's errors first, then the handler's, in declaration
  order (`search`, then `limit`).

  Order inside every handler. First the dependencies run: the route-level authentication, the entity query, the
  caller (B052), the daily activity repository, the database handle. A missing database stops there with HTTP 500
  and detail `{"error": <CommonProxyErrors.db_not_connected_error text>}` (litellm/proxy/_types.py L4391-L4395),
  before any 422 is reported for any parameter. Then `resolved_scope` runs with the `user_aggregated` flag B3096
  built. The aggregated route passes `true` for the user entity and `false` for the other five. The search route
  passes `false` for all six. With `true` only the canonical date parser runs, so a missing date answers B3090's
  `InvalidDateRange` message and a range of more than 400 days is accepted. With `false` B815's
  `aggregated_date_range_error` runs, including the 400-day cap. A date or scope failure becomes the HTTP error
  through B3090's `raise_public` (400, 403 or 404, detail `{"error": <reason>}`).

  Aggregated handler. After the scope, call B3093's `get_daily_activity_aggregated` with the resolved scope,
  `entity_metadata_field` = the resolved scope's entity_metadata, `include_entity_breakdown` = the resolver's flag
  (true for team and the other entities that set it in B3094 and B3095, false for user) and `api_key_limit` from
  the query. Return its `SpendAnalyticsPaginatedResponse` (B3090) unchanged. The user and team routes carry the
  long descriptions LiteLLM sets on the function (daily_activity_routes.py L283-L310); the other four have none.
  Copy those two texts byte for byte as `pub const &str` values in this module.

  Search handler. After the scope, ask the repository for `search_keys(scope, search, limit)`. If it returns no
  keys, answer `DailyActivityKeySearchResponse { api_keys: [] }` and do not read anything else. Otherwise call
  `get_daily_activity_aggregated` with the scope copied and its `api_keys` replaced by the found keys (this
  replaces any api_key the caller filtered on), `include_entity_breakdown` false, no entity metadata and the
  default `api_key_limit` of 100. Then `search_rows` walks the found keys in order and keeps one `KeyActivityRow`
  per key that has data (LiteLLM `_search_rows`). `fold_key_metrics` (LiteLLM `_fold_key_metrics`) collects, for
  one key, the metrics of every day in `results` whose `breakdown.api_keys` holds that key. With none it returns
  nothing, so the key is dropped. Otherwise it returns `KeyActivityRow { api_key, metrics: sum_metrics(all of
  them), metadata: <metadata of the first day that held the key> }`. `sum_metrics` (LiteLLM `_sum_metrics`) adds
  all 17 SpendMetrics fields of B3090 one by one: spend, flat_cost, prompt_tokens, completion_tokens,
  cache_read_input_tokens, cache_creation_input_tokens, compression_saved_tokens, compression_savings_spend,
  prompt_caching_savings_spend, gateway_injected_caching_savings_spend, autorouter_savings_spend, total_tokens,
  successful_requests, failed_requests, api_requests, total_response_time_ms and timed_requests. Floats add in
  order, left to right, from zero.

  Failures. Any error from the repository or from the aggregation that is not already an HTTP error answers 500
  with detail `{"error": "Failed to fetch analytics: <error text>"}`. The handler logs one line at error level:
  "Daily activity aggregation failed: %s" on the aggregated route and "Daily activity key search failed: %s" on the
  search route. An HTTP error from the scope step or from B3093 (which already answers 500 itself) passes through
  unchanged and is not logged by the handler.

  This task has unit tests only. Its routes answer over HTTP once B8482 mounts them, so B8482 owns their HTTP oracle cases (tools/oracle/cases/management/daily-activity-aggregate/) and proves the defaults, bounds, date errors, access errors, missing credential and missing database over HTTP. Here native tests call the per-entity routes on a test router with fake dependencies for the parameter bounds, the route set per prefix, the date check flag per entity, scope denials and the dependency order, and cover summing, folding and error paths with a fake repository.
scope:
  paths:
    - crates/betterlite-server/src/aggregate_activity_routes.rs
    - crates/betterlite-server/src/aggregate_activity_routes/**
    - tools/oracle/helpers/b3097.py
    - tools/oracle/helpers/b3097/**
    - tools/oracle/src/helpers/server/b3097.rs
    - tools/oracle/src/helpers/server/b3097/**
  lint_tables: false
