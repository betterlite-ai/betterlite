dod:
  - text: validate_environment follows the OAuth, key, headers and URL suffix order, including a key that overrides the OAuth token and the two 400 messages for custom endpoints.
    proof: [auth-tests, helper-python, oracle]
  - text: Without the Databricks SDK the SDK path raises the exact 400 ImportError texts instead of reading any profile or file.
    proof: [auth-tests, oracle]
  - text: get_api_base, the partner User-Agent and the header and body redaction match LiteLLM on slash, suffix and empty-name edge cases.
    proof: [auth-tests, helper-python, oracle]
  - text: The OAuth token request has the exact URL, form, basic auth and 30 second timeout, and error replies map to the listed statuses.
    proof: [auth-tests, oauth-corpus]
  - text: Embedding prepare, Responses headers, URL and model strip, and the legacy price table keys match LiteLLM.
    proof: [endpoint-tests, cost-tests, helper-python, oracle]
  - text: New helper cases replay through the shared helper-case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: auth-tests
      why: the credential order, URL rewrite, User-Agent, redaction or OAuth request tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^databricks_auth::/) - test(replays_the_databricks_oauth_reply_corpus)'
    - id: endpoint-tests
      why: the embedding or Responses transforms are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^databricks_embedding::/) | test(/^databricks_responses::/)'
    - id: cost-tests
      why: the legacy endpoint name table or the generic cost call is missing or fails
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^databricks_cost::/)'
    - id: oauth-corpus
      why: the OAuth reply fuzz target or its fresh replay corpus is missing
      run: >-
        test -f crates/betterlite-provider/fuzz/fuzz_targets/databricks_oauth_reply.rs &&
        grep -q 'name = "databricks_oauth_reply"' crates/betterlite-provider/fuzz/Cargo.toml &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-provider/fuzz/corpus/databricks_oauth_reply)" &&
        cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(replays_the_databricks_oauth_reply_corpus)'
    - id: helper-python
      why: strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5980)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5980 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5980/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added Databricks helper cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/databricks_auth-*")" &&
        grep -lE '^[[:space:]]+b5980:' tools/oracle/fuzz/corpus/helper_case/databricks_auth-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/databricks-auth/auth-order-and-key-override.yaml
  - tools/oracle/cases/helpers/databricks-auth/custom-endpoint-missing-key-and-base.yaml
  - tools/oracle/cases/helpers/databricks-auth/sdk-path-import-error.yaml
  - tools/oracle/cases/helpers/databricks-auth/ai-gateway-base-rewrite.yaml
  - tools/oracle/cases/helpers/databricks-auth/partner-user-agent.yaml
  - tools/oracle/cases/helpers/databricks-auth/header-and-body-redaction.yaml
  - tools/oracle/cases/helpers/databricks-auth/oauth-token-request-and-errors.yaml
  - tools/oracle/cases/helpers/databricks-auth/embedding-and-responses-endpoints.yaml
  - tools/oracle/cases/helpers/databricks-auth/legacy-price-keys.yaml
deviations:
  - what: When no key, headers or base resolve, betterlite does not try Databricks unified auth (profiles, ~/.databrickscfg, Azure CLI, cloud metadata). It raises the same 400 DatabricksError that LiteLLM raises when databricks-sdk is not installed.
    why: There is no Databricks SDK for Rust that passes deny.toml. A user who runs LiteLLM with the SDK installed and relies on it must set DATABRICKS_API_BASE and a key, or the OAuth M2M variables, in betterlite.
  - what: An OAuth token reply with status 200 whose body has no access_token (or is not JSON) becomes DatabricksError 500 with a message that names the missing field.
    why: LiteLLM lets a raw KeyError or JSON error escape from response.json()["access_token"], which the proxy turns into a generic 500. A typed error carries the same status.
  - what: The embedding config holds its instruction on the value, not on the class.
    why: LiteLLM writes constructor arguments onto the class, so one call changes every later instance. Rust has no shared class state, and the config sections own settings.
out_of_scope:
  - B5841 owns chat (chat/transformation.py), including DatabricksConfig.validate_environment, which only calls databricks_auth here.
  - B1427 already built databricks/streaming_utils.py as compatible_line_stream in betterlite-openai.
  - B1425 owns the OpenAI-like embedding transport that databricks_embedding hands its URL and headers to.
  - B507 owns OpenAIResponsesAPIConfig.transform_responses_api_request and the other inherited Responses methods.
  - B1672 owns generic_cost_per_token. B1686 owns the call-price dispatch that picks databricks_cost for provider databricks.
  - Reading DATABRICKS_API_BASE, DATABRICKS_API_KEY, litellm.databricks_key and the embedding call site in litellm/main.py is B8330's wiring. B8330 also reads the environment into DatabricksEnv, sends the OAuth request and registers DatabricksEmbeddingConfig and DatabricksResponsesAPIConfig in dispatch.
  - B4782 owns the separate agent endpoint token cache in the proxy crate. It shares no code with this task.
pitfalls:
  - A non-None api_key sets Authorization after the OAuth branch ran, so with all three OAuth variables set a supplied key still wins and the token request is made anyway.
  - OAuth only runs when the client id, the client secret and a base are all truthy; an empty string for any of them skips it silently and falls through to the key checks.
  - Headers that are an empty map count as missing in the api_key None check, but a headers map holding any key (even Content-Type) skips both the SDK path and the missing-key error.
  - custom_endpoint false and custom_endpoint None differ only at the URL step. The suffix is added unless the value is exactly true, while the 400 checks test truthiness.
  - The AI gateway rewrite returns a non-matching base with its trailing slash intact, because only the matching branches use the trimmed copy.
  - A partner made only of "_" or "-" is rejected, since the text left after removing those characters is empty and an empty string is not alphanumeric.
  - The legacy table matches by prefix and replaces the whole model name, so "dbrx-instruct-v2" prices as databricks-dbrx-instruct.
  - Responses validate_environment passes custom_endpoint false, so a missing key with no headers goes to the SDK path error, not to the Missing API Key error.
  - The redaction key list matches substrings, so a key like "max_tokens" is redacted along with "access_token".
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
