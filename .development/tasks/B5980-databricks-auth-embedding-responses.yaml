    - crates/betterlite-provider/src/databricks_auth.rs
    - crates/betterlite-provider/src/databricks_auth/**
    - crates/betterlite-provider/src/databricks_embedding.rs
    - crates/betterlite-provider/src/databricks_embedding/**
    - crates/betterlite-provider/src/databricks_responses.rs
    - crates/betterlite-provider/src/databricks_responses/**
    - crates/betterlite-provider/src/databricks_cost.rs
    - crates/betterlite-provider/src/databricks_cost/**
    - crates/betterlite-provider/fuzz/Cargo.toml
    - crates/betterlite-provider/fuzz/fuzz_targets/databricks_oauth_reply.rs
    - crates/betterlite-provider/fuzz/corpus/databricks_oauth_reply/**
    - tools/oracle/cases/helpers/databricks-auth/**
    - "tools/oracle/fuzz/corpus/helper_case/databricks_auth-*"
    - tools/oracle/helpers/b5980.py
    - tools/oracle/helpers/b5980/**
    - tools/oracle/src/helpers/provider/b5980.rs
    - tools/oracle/src/helpers/provider/b5980/**
  lint_tables: false
