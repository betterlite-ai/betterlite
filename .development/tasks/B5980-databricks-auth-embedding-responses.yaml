id: B5980
title: Databricks credentials, endpoint URLs, embeddings, Responses and pricing
description: >-
  Build the Databricks pieces that sit around chat, in betterlite-provider. Four modules, one per family, all pure
  transforms with no network call of their own: databricks_auth (litellm/llms/databricks/common_utils.py),
  databricks_embedding (embed/handler.py and embed/transformation.py), databricks_responses (responses/transformation.py)
  and databricks_cost (cost_calculator.py). Chat is B5841 and calls databricks_auth. Streaming_utils.py is already built
  by B1427 and is not touched.

  databricks_auth. Define DatabricksError with a status code, a message and optional headers (the type behind
  DatabricksException). Define DatabricksEnv, a plain struct the caller fills from the process environment, with the
  optional fields client_id (DATABRICKS_CLIENT_ID), client_secret (DATABRICKS_CLIENT_SECRET), api_base
  (DATABRICKS_API_BASE), user_agent_override (LITELLM_USER_AGENT, falling back to DATABRICKS_USER_AGENT) and the version
  text used in the User-Agent. Do not add a config section; the caller reads the variables, as LiteLLM does at call time.
  validate_environment(api_key, api_base, endpoint_type, custom_endpoint, headers, custom_user_agent, env, token_source)
  returns the final URL and headers, in this order. (1) api_base None takes env.api_base. (2) When client_id, client_secret
  and api_base are all non-empty, ask the injected OauthTokenSource for a token, start from the given headers (or an empty
  map) and set Authorization to "Bearer <token>" and Content-Type to application/json. (3) Else when api_key is None and
  the headers are None or empty: custom_endpoint true gives DatabricksError 400 "Missing API Key - A call is being made
  to LLM Provider but no key is set either in the environment variables ({LLM_PROVIDER}_API_KEY) or via params" (the
  braces stay literal); otherwise run the SDK path below. (4) Then api_base still None: custom_endpoint truthy gives 400
  "Missing API Base - A call is being made to LLM Provider but no api base is set either in the environment variables
  ({LLM_PROVIDER}_API_KEY) or via params"; otherwise run the SDK path. (5) Headers None become Authorization "Bearer
  <api_key>" plus Content-Type application/json, so a None key prints "Bearer None". Headers present and api_key not None
  get Authorization replaced. (6) api_key not None sets Authorization to "Bearer <api_key>" again, so a key beats the OAuth
  token from step 2. (7) Set User-Agent to build_user_agent(custom_user_agent). (8) Log the headers at debug level through
  redact_headers_for_logging. (9) For chat_completions with custom_endpoint not exactly true, append "/chat/completions"
  to the base; for embeddings append "/embeddings". The result is (url, headers).

  The SDK path is LiteLLM's databricks-sdk fallback (WorkspaceClient, unified auth). betterlite has no Databricks SDK, so
  it behaves like LiteLLM without the library installed: DatabricksError 400 with the exact ImportError text in
  _get_databricks_credentials ("If the Databricks base URL and API key are not set, the databricks-sdk Python library must
  be installed. Please install the databricks-sdk, set {LLM_PROVIDER}_API_BASE and {LLM_PROVIDER}_API_KEY environment
  variables, or provide the base URL and API key as arguments."). get_api_base(None, ...) raises the other ImportError
  text ("Either set the DATABRICKS_API_BASE and DATABRICKS_API_KEY environment variables, or install the databricks-sdk
  Python library."), also 400.

  get_api_base(api_base, use_ai_gateway): with use_ai_gateway false return the base untouched. Otherwise trim trailing
  slashes; a base ending in /ai-gateway/mlflow/v1 stays; one ending in /serving-endpoints swaps that suffix for
  /ai-gateway/mlflow/v1; a base with an empty or "/" URL path gains /ai-gateway/mlflow/v1; any other base is returned as
  given (not trimmed). build_user_agent(custom, version): trim the custom value, take the text before the first "/"
  trimmed as the partner, accept it when non-empty and made only of letters, digits, "_" and "-" (after removing those two
  characters what is left must be non-empty and alphanumeric), and return "<partner>_litellm/<version>"; anything else
  returns "litellm/<version>". redact_headers_for_logging copies headers; for names authorization, x-api-key, api-key and
  x-databricks-token (case-insensitive) a value longer than 10 characters becomes its first 8 characters plus
  "...[REDACTED]", otherwise "[REDACTED]". An empty map gives an empty map. redact_sensitive_data walks a serde_json
  Value: strings go through the six SENSITIVE_PATTERNS in order (Bearer tokens, "Authorization:" values, api_key and
  api-key assignments, client_secret assignments, dapi plus 32 or more alphanumerics replaced by [REDACTED_PAT], and
  access_token assignments, all case-insensitive, keeping the matched prefix and adding [REDACTED]); object keys whose
  lowercase form contains authorization, api_key, apikey, token, secret, password or credential get the value
  "[REDACTED]" without descending; arrays recurse; other values pass through. Use the regex crate from the workspace.

  OAuth M2M. oauth_token_request(api_base, client_id, client_secret) builds the request: URL is the scheme and host of
  api_base plus "/oidc/v1/token", form body grant_type=client_credentials and scope=all-apis, HTTP basic auth with the
  id and secret, Content-Type application/x-www-form-urlencoded, timeout 30 seconds. The OauthTokenSource trait sends it
  and returns status and body text, or a transport error text. parse_oauth_token_reply(status, body) returns the
  access_token. A transport error becomes 500 "OAuth M2M token request failed: <error>"; a status other than 200
  becomes that status with "OAuth M2M token request failed: <body>". The decoder takes bytes from outside, so add a
  cargo-fuzz target named databricks_oauth_reply in crates/betterlite-provider/fuzz and a check that replays its corpus.

  databricks_embedding. DatabricksEmbeddingConfig keeps an optional instruction. get_config returns a map of the fields
  that are set, get_supported_openai_params returns an empty list and map_openai_params returns optional_params
  unchanged. The handler step prepare_embedding takes the optional params, the key, the base, custom_endpoint and the
  headers. It pops user_agent; only when that value is empty or absent does it pop databricks_user_agent, and then it
  falls back to the env override. A non-empty user_agent therefore leaves databricks_user_agent in the optional params,
  and it is sent on. It then calls validate_environment with endpoint_type embeddings and returns the new URL, the
  headers and the remaining optional params. The call itself is B1425's compatible embedding transport, run with
  custom_endpoint true so it does not append another path.

  databricks_responses. DatabricksResponsesAPIConfig reports provider databricks and supports_native_websocket false.
  Its headers step takes the key and base from litellm_params, then DATABRICKS_API_KEY and DATABRICKS_API_BASE, runs
  validate_environment with chat_completions and custom_endpoint false (the URL it returns is discarded), and sets
  Content-Type to application/json. The URL step takes the base from the argument, then DATABRICKS_API_BASE, passes it
  through get_api_base with the gateway off, trims trailing slashes and appends "/responses". The request step strips a
  leading "databricks/" from the model and calls B507's OpenAI Responses request transform.

  databricks_cost. cost_per_token strips a leading "databricks/" from the model, then picks the registry key: the first
  entry of the legacy table whose name the model starts with replaces the whole name (dbrx-instruct to
  databricks-dbrx-instruct, meta-llama-3.1-70b-instruct to databricks-meta-llama-3-1-70b-instruct,
  meta-llama-3.1-405b-instruct to databricks-meta-llama-3-1-405b-instruct, mixtral-8x7b-instruct-v0.1 to
  databricks-mixtral-8x7b-instruct, bge-large-en to databricks-bge-large-en, gte-large-en to databricks-gte-large-en,
  llama-2-70b-chat to databricks-llama-2-70b-chat), in that order. Then call B1672's generic token cost with that key,
  the usage, provider databricks and the service tier. The table is data in the module, not a config key.

  Sizing: about 270 LiteLLM lines in common_utils.py, 25 in cost_calculator.py, 60 in the embed folder and 60 in
  responses. Plan 330 transform lines, 300 tests, 130 for the fuzz target and exports and 150 for helper adapters.
