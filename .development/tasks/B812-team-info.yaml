id: B812
title: Team info visibility and response hydration
description: >-
  Implement only GET /team/info here; B1208 owns members/me, block/unblock, metadata_schema and available
  teams. team_id defaults null and key_limit defaults null (HTTP values must be greater than zero).
  Inside the handler's try, no database raises 500 with the source database-connection URL in detail.error;
  null team_id raises 422 detail.message="Malformed request. No team id passed in.". Read the team with
  model-table, object-permission and organization relations. Missing rows and lookup exceptions both
  become 404 "Team not found, passed team id: ..."; validate the returned model outside that inner catch.
  Cases missing_database, missing_team_id, positive_key_limit and lookup_failure_404 cover this ordering.

  validate_membership first permits proxy_admin and proxy_admin_viewer, then a key whose team_id matches,
  then direct roster user IDs or B800 administrative scope. A null user ID on a different team key gets
  403 "Team key for team=... not authorized to access this team=..."; a key with neither identity gets
  403 "API key not authorized to access this team=.... No user_id or team_id associated with this key.";
  other denied users get 403 "User=... not authorized to access this team=...". strongest_role determines
  parent organization_models disclosure separately: no role yields null, an organization-less team yields
  null, and an organization with absent models yields []. B801 supplies caller_edit_access using its
  existing general_settings policy. Cases membership_identity_matrix, parent_model_disclosure and
  caller_edit_access_projection distinguish visibility from edit authority.

  B124 receives expires=datetime.now() and optional limit, but its team_id branch does not filter expiry,
  so expired keys are included; null results become
  []. Preserve the source collection: its token.pop operates on a temporary model_dump/dict inside the
  loop and does not replace the original keys, so do not claim this handler strips hashes. The HTTP
  key_collection_projection case compares the actual serialized key rows. The spend-only fallback after
  the earlier missing-row exception is unreachable and needs no invented success case. Fetch all team
  memberships with B803. A string team_member_budget_id (including empty) from B809 triggers one budget
  lookup; a missing row stays null, while an exception logs info and returns the unmodified team.
  Only a found budget is an active default for B809 budget_source classification (custom/team_default/none).
  Cases default_budget_found_missing_error and membership_budget_sources cover both response and log.

  Resolve groups through B1209's one-query batch helper. No group IDs leaves inherited fields untouched;
  otherwise silently omit unknown groups, preserve first-seen group order in access_group_details and
  deduplicate model/MCP/agent unions as sets (compare those arrays without ordering). Null resource lists
  contribute nothing. Hydrate roster members in their original order with one user query for sorted unique
  non-null IDs; skip the query for an email-only roster, retain a truthy roster email, fill falsey email
  from the user row, and use user_alias or null. Finally attach B071 model_max_budget_usage for entity
  TEAM and the limiter's dual_cache, then return team_id, team_info, keys and all annotated memberships.
  Cases group_union_and_detail_order, unknown_group_omitted, member_hydration_one_query and model_usage
  verify the computed fields without reimplementing the dependency algorithms.

  The outer except logs every failure and traceback. HTTPException becomes ProxyException type=auth_error,
  param="None" unless supplied, code/status=the original HTTP status, message=detail; an existing
  ProxyException is rethrown; anything else becomes 400 auth_error with "Authentication Error, " plus
  str(error) and the same param rule. Cases own_exception_mapping and downstream_proxy_exception retain
  this route-specific mapping; handle_exception_on_proxy is not called. No secret transform or config
  loader is added by this task.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/team_endpoints.py:
  validate_membership (L4715-L4753; 31 source lines), _add_team_member_budget_table (L4756-L4769; 13 source
  lines), _hydrate_member_user_details (L4772-L4792; 19 source lines), _parent_organization_models (L4803-L4806;
  4 source lines), _resolve_team_access_group_resources (L4809-L4838; 30 source lines), team_info (L4843-L5009;
  145 source lines).


  Register these actual HTTP routes and aliases exactly once: GET /team/info -> team_info. For each route
  use B001 HTTP cases for the scope, projection and error contracts above, including status, type/param/code,
  null fields and JSON content-type. B052 supplies real bearer authentication and B865 supplies the actual
  decorator effects. Database hydration tests use POSTGRES_TEST_URL when supplied, otherwise B860
  testcontainers; connection failure is a test failure.


  Sizing: 242 nonblank, noncomment function lines plus four lines of owned organization projection models
  at L4795-L4800; allow 250 production, 360 behavior/Postgres tests, 0 helper adapters, 65 route/manifests/wiring,
  0 decoder/fuzz and 0 config lines, 675 changed lines within a 700-line gate.


