checks:
  optional:
  - mutants
  commands:
  - id: case-responses
    why: Dispatch B657 native Runtime Responses, including background/tool drops and remote-image rejection; do
      not confuse it with Mantle B626.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_interactive_dispatch_cases::case_[0-9]+_responses$/)'
  - id: case-passthrough
    why: Dispatch B658 native request and logging collector with buffered and streaming replies.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_interactive_dispatch_cases::case_[0-9]+_passthrough$/)'
  - id: case-search
    why: Dispatch B659 AgentCore MCP search including B2212 response errors through the leaf.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_interactive_dispatch_cases::case_[0-9]+_search$/)'
  - id: case-vector-retrieve
    why: Dispatch B660 knowledge-base retrieve and preserve filter/userContext options.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_interactive_dispatch_cases::case_[0-9]+_vector_retrieve$/)'
  - id: case-realtime-bridge
    why: Call B666 complete session transport, which calls B667 pumps; preserve pending session preface, connection
      setup failure and normal cleanup. Do not install a pump as if it were the session opener.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_interactive_dispatch_cases::case_[0-9]+_realtime_bridge$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_interactive_dispatch.py)"
      && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project
      tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_interactive_dispatch*")"
      && grep -lq 'bedrock_interactive_dispatch' tools/oracle/fuzz/corpus/helper_case/bedrock_interactive_dispatch*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_interactive_dispatch$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: unsupported-operation
    why: The unsupported operation invariant has no passing production test.
    run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::bedrock_interactive_dispatch_unsupported_operation$/)'
