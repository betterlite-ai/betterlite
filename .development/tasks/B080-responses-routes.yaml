id: B080
title: Responses create routes and family composition
description: >-
  Register POST /v1/responses, /responses and /openai/v1/responses, owning the complete responses_api
  function from its decorators. Build betterlite-server api/responses_routes and the small core
  composition module. Mount B938 lifecycle, B939 compact/input_tokens, B940 Cursor and B941
  websocket factories once, without repeating their registrations. B1100 reads the request body;
  B004 owns common_processing_pre_call_logic, required-input validation, base_process_llm_request,
  create_response and exception translation. Use B732/B756/B855 admitted principals and B929's
  installed ID security. B124 supplies failure-hook dispatch and B104 blocked-response translation
  through explicit typed ports; do not copy their implementations into this route.

  Select polling with B935 using raw background default=false and model default="". If selected,
  perform admission and required input checks before generating an ID or writing Redis. Then
  derive PollOwner only from the trusted principal/auth mode, write queued state with configured
  TTL and start B936 with a copy of preprocessed data. Ordinary requests call B004 with
  route_type=aresponses and model=null. Both paths pass select_data_generator configured with
  responses_stream_errors=true, using B937's emitted-event failure state. Preserve the normal
  branch's special ModifyResponseException response and the separate polling admission error path.

  Assemble B1078's CreateInterception port with B955 and B2415's ContinuationExecutor with the
  public B932 Responses executor. Register B014 operation dispatch; recursive execution returns
  through these typed ports, never a dependency from lower services to this composer. Re-export
  B921 responses_api_bridge and B935/B936 polling exports from the small package init files.
  The empty file_search initializer has no runtime behavior. Own dispatch.py's six whole public
  wrappers/projection functions as native signature compatibility, using B158's binding seam.
  LiteLLM's rust_bridge accelerator is excluded by litellm.yaml and is not reimplemented.

  All route comparisons boot both proxies with fixed test master key sk-test-master, independent
  B1139 Redis/Postgres fixtures and a mock provider. B2401 additionally exercises public sync/async
  dispatch through SdkHttpCall::ResponsesPublicDispatch; do not invoke FastAPI handlers as helpers.
  No parser is added above B1100/B902. Source count is 336 nonblank/non-comment lines including
  route/dispatch declarations and package exports; estimate 260 composition, 185 tests, 170 HTTP
  fixtures, 90 SDK adapters and 40 wiring, 745 total, plus 80 for the OpenAI binding below: 825 under 830.

  Bind the OpenAI provider's Responses create operation into the dispatcher this task extends: the openai
  target uses B507 input preparation and B508 reply and event decoding, which B932's create call executes,
  and keeps response item IDs, tool metadata and streaming event order. The binding lives here, not in the
  OpenAI provider umbrella B024, because the Responses variant only exists once this task adds it and a
  provider task must not depend on a route task. Test function openai_provider_operation under
  api::responses_routes::tests drives POST /v1/responses with an openai/ model through the booted proxy and
  asserts the captured upstream /v1/responses request and the returned item IDs and stream events.
