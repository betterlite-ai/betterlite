id: B080
title: Responses routes
description: >-
  Finish POST /responses and /v1/responses creation through B014, auth, ID ownership, native/chat/MCP/file-search
  dispatch and optional background polling. Extend the exhaustive operation/result enums and register source route
  aliases. Export the typed native events and decoded ID services required by routing B324/B370; those downstream
  tasks install their own hooks. This final entry integrates completed parts and the Python public dispatcher semantics
  without embedding Python.


  Register create only: POST /responses, /v1/responses and /openai/v1/responses. Compose B938-B941 route factories
  once; never register their routes again. Polling admission runs pre-call auth/rate/budget checks before minting
  litellm_poll_ ids: denied admission returns synchronous 429 and creates no Redis entry. Consume B935 background
  settings. With enterprise absent, a native queued/in_progress background response reaches the import at endpoints.py:391
  and fails through the normal 500 exception mapper; it does not create a managed-object row. Cache polling remains
  usable independently. ModifyResponseException returns 200 with the blocked Responses body, or block SSE chunks
  followed by data: [DONE]; the failure hook still runs.


  Implement crates/betterlite-server/src/api/responses_routes.rs, crates/betterlite-core/src/api/responses_routes.rs.
  Use ResponsesRoutesInput and ResponsesRoutesResult with typed nested records; inject only the clock, repositories,
  transports and resolved settings this slice uses through constructors. Reuse ApiLimits from B1087; do not introduce
  ambient environment or duplicate credential resolution.


  Register exactly these routes in this task: POST /v1/responses; POST /responses; POST /openai/v1/responses. Each
  alias is exercised through the booted proxy. Every route factory is mounted once; a family composer mounts its
  child factories without re-registering their methods/paths.


  Bind the OpenAI provider's Responses create operation into the operation enum and dispatcher this task extends
  in crates/betterlite-core/src/dispatch.rs: the openai target uses B507 input preparation and B508 reply and event
  decoding, which B932's create call executes, and keeps response item IDs, tool metadata and streaming event order.
  This binding moved here from the OpenAI provider umbrella B024 because the Responses variant only exists once
  this task adds it, and a provider task must not depend on a route task. Test function openai_provider_operation
  drives POST /v1/responses with an openai/ model through the booted proxy and asserts the captured upstream
  /v1/responses request and the returned item IDs and stream events.


  Route input projections: data.background (absent False); data.model (absent ''); data.model (absent None); data.background
  (absent None); data.stream (absent None).


  Write adjacent tests.rs behavior functions native_create_route, chat_create_route, stream_create_route, background_poll_route,
  managed_previous_response, mcp_create_route, openai_create_alias, poll_admission_429, native_background_no_ente_cd2e,
  blocked_response_200, blocked_stream_done, response_id_security_create, route_aliases, auth_missing, auth_invalid,
  openai_provider_operation under api::responses_routes::tests. Each named function drives production code and asserts its case result; use
  named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  All oracle cases here are HTTP cases against both booted proxies, using B1139 isolated Postgres/Redis fixtures
  when state is required. Capture client status/body/headers and ordered provider requests. Route aliases are separate
  named steps in route-aliases.yaml, one request per listed alias, sharing only setup/config. No helper adapter
  may import or call these FastAPI handlers. The oracle environment must not install litellm-enterprise.


  Callable ownership: litellm/proxy/response_api_endpoints/endpoints.py: responses_api (L212-L458); litellm/responses/dispatch.py:
  _python_responses (L25-L29); litellm/responses/dispatch.py: _python_aresponses (L32-L36); litellm/responses/dispatch.py:
  _public_request (L45-L65); litellm/responses/dispatch.py: _context (L68-L73); litellm/responses/dispatch.py: responses
  (L90-L101); litellm/responses/dispatch.py: aresponses (L104-L112). Abstract/protocol declarations map to native
  types and synchronous/async wrappers share one implementation; a partial function span is the explicit preparation/transition
  stage described above, with typed values passed to the following stage.


  Sizing: 310 owned nonblank/non-comment/non-docstring Python lines (336 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 338 implementation,
  140 behavior tests, 180 oracle fixtures, 0 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  38 wiring, plus 20 binding, 30 test and 30 fixture lines for the OpenAI Responses operation; 776 total within
  the 780-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B003 (HTTP server, health routes and master key auth), B014 (Call dispatch across providers
  and call types, shared settings and helpers), B171 (Direct helper oracle and URL path encoding), B507 (OpenAI
  Responses replay input and tool schemas), B508 (OpenAI Responses replies and event decoding), B921 (Response
  chat dispatch), B924 (Chat response stream), B929 (Responses id security), B930 (Responses affinity), B932 (Responses
  create call), B936 (Responses poll stream), B937 (Responses stream errors), B938 (Responses read routes), B939
  (Responses input tokens), B940 (Cursor responses compat), B941 (Responses ws auth), B955 (Responses mcp dispatch),
  B957 (Chat mcp loop), B1087 (Api boundaries), B1113 (Responses streaming event records), B1100 (Shared request
  body decoding), B935 (Responses poll state), B1139 (Stateful HTTP oracle scenarios), B732 (Typed authentication
  principals and grant resolution), B855 (Authenticated request admission and budget handoff), B756 (Authentication
  header selection and mode dispatch), B856 (Management oracle namespaces and Postgres test fixture). These are
  callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the
  provider and keys/data branches.


  For cache polling, derive B935 PollOwner exclusively from admitted B732 principal/auth-mode facts and pass it
  to create_initial_state before returning an ID. Request metadata can never supply or overwrite this owner. The
  record is private and the success response projection stays source-compatible; B938 owns the authorization deviation.


  Authenticated route fixtures explicitly configure a fixed non-secret test master key and seed ordinary virtual
  keys through B856/B1139; missing/invalid-auth cases omit or replace those credentials while keeping every other
  input valid. Disabled-auth and intentionally unauthenticated routes have separate explicit configurations. Do
  not rely on an absent master key to exercise an authentication failure.


  For an exception that finally becomes ProxyException, proxy_server.openai_exception_handler uses exc.to_dict():
  error.code is the stringified status code, and the separately stored openai_code is not emitted. Preserve source
  constructor type/param values, including literal "None" where that route passes it. An uncaught HTTPException
  still uses FastAPI detail, while explicit JSONResponse helpers keep their own code/null fields; do not coerce
  those into ProxyException semantics. The constructor inventory above is not a claim that the raw HTTPException
  reaches the client unchanged.
