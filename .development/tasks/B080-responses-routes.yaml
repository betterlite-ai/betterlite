deviations:
- what: Native queued/in_progress background creation remains HTTP 500 internal_server_error,param=null,code="500" without managed storage; cache polling succeeds independently.
  why: Max's managed-files/batches choice remains open. Keep the current no-enterprise behavior instead of implementing an unavailable hook.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L389-L393
- what: Polling IDs carry private trusted ownership; another owner receives 403 permission_error,param=null,code="403" on lifecycle access.
  why: The architect's existing polling-ownership decision requires B080 to supply identity before the initial cache write.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_api_endpoints/endpoints.py#L327-L343
out_of_scope:
- B940 owns endpoint tool/Cursor helpers and Cursor routes; B938 owns retrieve/delete/input-items/cancel routes, B939 compact/input_tokens and B941 websocket routes/helpers.
- B104 owns blocked-response/SSE construction; B004 owns common request processing, required parameters and error envelopes, B124 failure callback dispatch.
- B955 owns MCP and emulated file-search internals; B930 affinity is installed by its router owner B324, not by this create route.
- Enterprise managed-file storage after the import is unreachable in this checkout; its warning-and-skip/storage-error paths are excluded with the enterprise implementation.
- Accelerator selection in litellm/rust_bridge is excluded; B158 owns Python module binding machinery around the retained public call signature.
pitfalls:
- Polling's admission exceptions do not enter the normal branch's ModifyResponseException success handler.
- A native queued response imports the missing enterprise module before checking whether a managed-files hook exists.
- Raw ProxyException auth param="None" is a string, while request-processing failures normalize missing param to null.
- Every create alias enables responses_stream_errors on the data generator; omitting it loses response.failed framing.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
