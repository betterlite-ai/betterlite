dod:
- text: >-
    create_route_aliases posts {model:openai/gpt-4o,input:hello} to each of the three paths with
    valid auth. Expect HTTP 200,application/json and a completed Responses object after exactly
    one upstream POST /v1/responses per request; never 404/405 or duplicate-router registration.
    x-litellm-call-id=call-a is retained. A configured chat-only deployment instead makes one
    /v1/chat/completions call and returns a Responses object through B916. Native file_search
    tools remain on native HTTP; a gateway MCP request reaches B955's composed port and its
    provider follow-up once. Capture actual provider sequence, not a manufactured route result.
  proof: [route-http, oracle]
- text: >-
    create_auth_and_required_input keeps valid model/input while omitting auth: HTTP 401,
    type=auth_error,param="None",code="401",message="Authentication Error, No api key passed in."
    A malformed non-Bearer Authorization header returns the same fields with message
    "Authentication Error, Malformed API Key passed in. Ensure Key has `Bearer ` prefix." Both
    make zero provider calls. With valid auth, missing/null input returns 400,
    type=invalid_request_error,param=input,code="400",message="/responses: Missing required
    parameter: 'input'." Empty string input is not missing. Repeat the missing-input case with
    background=true,polling_via_cache=all: no polling ID, Redis write or background task is created.
  proof: [route-errors, oracle]
- text: >-
    polling_admission_and_owner configures polling_via_cache=all,ttl=17,background=true and
    metadata={trace:a,owner:forged}. Expect HTTP 200 queued response with litellm_poll_ UUID,
    output=[],usage=null,metadata preserved and Redis TTL=17. The private owner is the admitted
    principal, never metadata.owner. One background POST uses stream=true and omits background;
    client disconnect leaves it running. A pre-call HTTPException(429,"slow down") produces
    synchronous 429,type=rate_limit_error,param=null,code="429",message=slow down with no ID/cache
    or provider call. Missing Redis, disabled polling or native_background_mode containing the
    model follows normal native background handling instead of silently fabricating polling.
  proof: [polling-http, oracle]
- text: >-
    native_background_without_managed_hook returns mock status=queued or in_progress for a
    normal background=true request. Without enterprise installed, preserve HTTP 500,
    type=internal_server_error,param=null,code="500",message="No module named 'litellm_enterprise'"
    after one provider request and no managed-object write. A completed native response or a
    stream does not enter that import branch and succeeds. Cache polling remains usable. This
    is the current managed-files/batches choice retained pending Max, not an implemented paid feature.
  proof: [managed-background, oracle]
- text: >-
    blocked_create_body_and_stream injects B104 ModifyResponseException with model=gpt-4o,
    message=blocked and original usage input=2,output=3,total=5. Normal create returns HTTP 200
    completed response with one assistant output_text=blocked and that usage, after the failure
    hook receives e.request_data once. With request stream=true, expect text/event-stream,
    B104's created/output/delta/done/completed sequence and exactly one final "data: [DONE]\n\n".
    A truthy non-boolean stream value does not satisfy this route's is True branch. Failure-hook
    exceptions propagate; do not invent a second blocked-response recovery. Generated IDs/time
    are compared by shape while the output text/status/usage/event order compare literally.
  proof: [blocked-http, oracle]
- text: >-
    create_stream_failure_and_security sends stream=true, receives a committed response.created
    id=resp_a then a provider failure. HTTP stays 200,text/event-stream and B937 emits one
    response.failed with the committed identity and next sequence; emitted terminal events
    prevent another failure frame. With an ordinary key and master key configured, an unmanaged
    previous_response_id=resp_unissued is rejected before provider HTTP with 403,
    type=permission_error,param=null,code="403". B929's disable/allow/admin exceptions remain
    effective. Fresh managed response IDs use random nonce encryption: decode them with B929
    to assert provider ID and trusted owner, and mask only randomized ciphertext in raw HTTP comparison.
  proof: [stream-security, oracle]
- text: >-
    public_dispatch_projection binds positional/keyword input and model with the legacy defaults.
    Invalid binding or non-string model declines the native projection and retains the SDK's
    argument error. stream=1 projects null, stream=true projects true; non-string api_key is null.
    api_base="" falls back to base_url, nonempty api_base wins. Mapping extra_headers survives;
    parameters contains every bound field except kwargs, while kwargs retains the extras. Sync
    aresponses=true bypasses accelerator selection; 1 does not. Actual valid sync and async
    public calls each make one mock POST and preserve B1078/B932 results. __wrapped__/documentation
    signature compatibility is exposed through B158, without implementing excluded rust_bridge code.
  proof: [public-dispatch, oracle, python-sdk]
- text: >-
    openai_provider_operation posts {model:openai/gpt-4o,input:hello} to /v1/responses with valid auth. Expect
    HTTP 200 and exactly one upstream POST /v1/responses whose body carries B507's prepared input; the returned
    item IDs, tool metadata and stream events match the upstream reply unchanged.
  proof: [openai-operation, oracle]
- text: New public-dispatch SDK seeds and route fixtures exercise production composition rather than helper handlers.
  proof: [sdk-corpus, oracle, python-sdk]
checks:
  optional: []
  commands:
  - id: openai-operation
    why: the OpenAI Responses binding never reaches the upstream request or changes its items
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_routes::tests::openai_provider_operation($|::)/)'
  - id: route-http
    why: an alias, chat branch or interception port fails in the booted proxy
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_routes::tests::create_route_aliases($|::)/)'
  - id: route-errors
    why: auth or required-input rejection creates a provider call or polling record
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_routes::tests::create_auth_and_required_input($|::)/)'
  - id: polling-http
    why: admission occurs after minting an ID or request metadata supplies polling ownership
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_routes::tests::polling_admission_and_owner($|::)/)'
  - id: managed-background
    why: the no-enterprise managed-background branch silently changes its client result
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_routes::tests::native_background_without_managed_hook($|::)/)'
  - id: blocked-http
    why: guardrail replacement becomes an HTTP error or lacks its terminal DONE marker
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_routes::tests::blocked_create_body_and_stream($|::)/)'
  - id: stream-security
    why: streaming failure identity or ordinary-key response ownership is bypassed
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^api::responses_routes::tests::create_stream_failure_and_security($|::)/)'
  - id: public-dispatch
    why: public projection loses a bound option or routes a single call twice
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::responses_routes::tests::public_dispatch_projection($|::)/)'
  - id: python-sdk
    why: public SDK parity does not reach its real provider transport
    run: test -f tools/oracle/sdk_http/responses_public_dispatch.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/sdk_http && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/sdk_http/pyrightconfig.json
  - id: sdk-corpus
    why: the public SDK operation lacks a newly added decoder seed
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/sdk_http_case/responses-public-dispatch-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^sdk_http::tests::replays_corpus$/)'
