id: B1040
title: Batch cost finalize
description: >-
  Fetch authorized managed input/output/error files and finalize batch cost/usage through B068/B069 using batch-output-usage.
  Preserve pending-versus-final cost semantics and failed request counts; credential extraction uses file-credentials
  and never trusts embedded IDs alone.


  calculate_batch_cost_and_usage (litellm/batches/batch_utils.py:L71-L95) has no MIT runtime caller at the pin (only
  its declaration; tests are not runtime callers); it is excluded, and no behavior case exercises that unused entry
  point.


  _get_file_content_as_dictionary (litellm/batches/batch_utils.py:L554-L559) has no MIT runtime caller at the pin
  (only its declaration; tests are not runtime callers); it is excluded, and no behavior case exercises that unused
  entry point.


  Cost-finalization tests call the reachable per-provider cost/usage routines with injected file content; the unused
  calculate_batch_cost_and_usage wrapper and _get_file_content_as_dictionary are not copied. Preserve MIT callable
  cost utilities even though the enterprise scheduler is absent.


  Implement crates/betterlite-core/src/api/batch_cost_finalize.rs. Use BatchCostFinalizeInput and BatchCostFinalizeResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions batch_cost_not_final, completed_batch_cost, error_file_request_count,
  managed_output_file_crede_f598, missing_output_file under api::batch_cost_finalize::tests. Each named function
  drives production code and asserts its case result; use named rstest inputs for related values. Corpus replay
  has the separate name replays_corpus.


  Settings contract (load with B002, reuse existing fields where another dependency already declares them): litellm_settings.disable_vertex_batch_output_transformation
  defaults to False. No environment reads occur outside betterlite-config. Test api::batch_cost_finalize::tests::loads_settings
  uses the production Config loader and an injected environment map, with a named rstest case for every key above,
  explicit override, unset/default and invalid-value/fallback behavior. Keys must be accepted, applied and absent
  from the unsupported-key report; a grep is not proof of support. Add new config_yaml seeds for these keys and
  replay B002's existing decoder rather than introducing a second YAML parser.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::BatchCostFinalize in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {batch_cost_finalize: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/batches/batch_utils.py: _uses_native_vertex_output (L39-L48); litellm/batches/batch_utils.py:
  batch_cost_is_final (L54-L68); litellm/batches/batch_utils.py: _handle_completed_batch (L98-L161); litellm/batches/batch_utils.py:
  _provider_output_file_id (L409-L432); litellm/batches/batch_utils.py: _fetch_batch_managed_file_content (L435-L462);
  litellm/batches/batch_utils.py: _fetch_batch_output_file_content (L465-L484); litellm/batches/batch_utils.py:
  count_error_file_failed_requests (L487-L508); litellm/batches/batch_utils.py: _extract_file_access_credentials
  (L511-L551). Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation;
  a partial function span is the explicit preparation/transition stage described above, with typed values passed
  to the following stage.


  Sizing: 142 owned nonblank/non-comment/non-docstring Python lines (196 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 162 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 33 config tests/seeds and
  30 wiring; 445 total within the 450-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B068 (Cost calculation for every call type), B069 (Spend tracking and spend logs), B171
  (Direct helper oracle and URL path encoding), B1020 (File credentials), B1030 (File content stream), B1039 (Batch
  output usage), B1087 (Api boundaries), B1019 (File routing ids), B002 (Load LiteLLM config.yaml into typed config).
  These are callable/type/config owners, not provider-family umbrellas; the external B500-B859 ids retain ownership
  on the provider and keys/data branches.
