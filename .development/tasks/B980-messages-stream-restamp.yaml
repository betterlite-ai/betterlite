  _decode (L30-L31); litellm/llms/anthropic/pass_through/messages/response_cache.py: _split_sse_events (L34-L35);
  litellm/llms/anthropic/pass_through/messages/response_cache.py: AnthropicMessagesStreamCacheWriter.__init__ (L39-L50);
