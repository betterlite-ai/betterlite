checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_restamp::/)
      - test(/::replays_corpus$/)'
  - id: case-split-message-start-model
    why: the split-message-start-model behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_restamp::tests::split_message_start_model($|::)/)'
  - id: case-ping-frame
    why: the ping-frame behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_restamp::tests::ping_frame($|::)/)'
  - id: case-cache-stream-replay
    why: the cache-stream-replay behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_restamp::tests::cache_stream_replay($|::)/)'
  - id: case-partial-final-frame-flush
    why: the partial-final-frame-flush behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_restamp::tests::partial_final_frame_flush($|::)/)'
  - id: case-cache-write-failure-warning
    why: the cache-write-failure-warning behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::messages_stream_restamp::tests::cache_write_failure_warning($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/messages_stream_restamp.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/messages_stream_restamp-*)"
      && grep -qE "^[[:space:]]+messages_stream_restamp:" tools/oracle/fuzz/corpus/helper_case/messages_stream_restamp-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/messages-stream-restamp)"
