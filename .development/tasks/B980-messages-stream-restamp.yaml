  (L57-L60); litellm/llms/anthropic/pass_through/messages/response_cache.py: AnthropicMessagesStreamCacheWriter.messages
  (L63-L66); litellm/llms/anthropic/pass_through/messages/response_cache.py: AnthropicMessagesStreamCacheWriter.model
