id: B980
title: Messages stream restamp
description: >-
  Restamp native message_start models across chunk boundaries and persist/replay cached Anthropic event streams
  using B125. Keep ping filtering and closed-block flushing source-compatible, and preserve served model metadata
  without buffering the whole live stream.


  Implement crates/betterlite-core/src/api/messages_stream_restamp.rs. Use MessagesStreamRestampInput and MessagesStreamRestampResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Write adjacent tests.rs behavior functions split_message_start_model, ping_frame, cache_stream_replay, partial_final_frame_flush,
  cache_write_failure_warning under api::messages_stream_restamp::tests. Each named function drives production code
  and asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::MessagesStreamRestamp in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {messages_stream_restamp: <typed input>};
  operation is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service
  and Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/anthropic_endpoints/streaming_model_restamp.py: _restamped_event (L27-L33);
  litellm/proxy/anthropic_endpoints/streaming_model_restamp.py: _restamped_data_line (L36-L51); litellm/proxy/anthropic_endpoints/streaming_model_restamp.py:
  _restamped_frame (L54-L59); litellm/proxy/anthropic_endpoints/streaming_model_restamp.py: restamp_anthropic_stream_chunk_model
  (L62-L87); litellm/proxy/anthropic_endpoints/streaming_model_restamp.py: _is_ping_frame (L90-L91); litellm/proxy/anthropic_endpoints/streaming_model_restamp.py:
  AnthropicStreamModelRestamper.__init__ (L107-L110); litellm/proxy/anthropic_endpoints/streaming_model_restamp.py:
  AnthropicStreamModelRestamper.process (L112-L122); litellm/proxy/anthropic_endpoints/streaming_model_restamp.py:
  AnthropicStreamModelRestamper.flush (L124-L131); litellm/proxy/anthropic_endpoints/streaming_model_restamp.py:
