  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 272 owned nonblank/non-comment/non-docstring Python lines (294 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 292 implementation,
  70 behavior tests, 60 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 542 total within the 550-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B125 (Response caching core, in-memory and disk caches, cache API), B171 (Direct helper
  oracle and URL path encoding), B978 (Messages sse events), B1087 (Api boundaries), B002 (Load LiteLLM config.yaml
  into typed config). These are callable/type/config owners, not provider-family umbrellas; the external B500-B859
  ids retain ownership on the provider and keys/data branches.
