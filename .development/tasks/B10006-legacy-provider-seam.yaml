deviations:
  - what: A custom_provider_map handler gets logging_obj, encoding, client and logger_fn as None and a print_verbose that does nothing.
    why: betterlite has no Python Logging object, tiktoken encoding or HTTP handler to hand over. The arguments a handler reads to make its call (model, messages, credentials, optional_params, litellm_params, timeout) are LiteLLM's.
  - what: A handler call that runs past the deployment's timeout ends with a timeout error.
    why: LiteLLM passes timeout to the handler but never bounds the call itself, and the embedded interpreter's pool needs a deadline for every job.
out_of_scope:
  - custom_chat_llm_router, the legacy wire formats, decode_custom_output, the Aleph Alpha resolve methods and the litellm_proxy embedding branch are B044's; this task feeds them the seam and calls them.
  - The CustomLLM, CustomLLMError, CustomLLMItem and BaseLLM classes are B164's. The oracle fixture stays a plain class because the same module runs under LiteLLM.
  - The rest of ProxyConfig.load_config belongs to B8590, B8374, B165, B189 and the setting owners B124 lists; this task takes only its custom_provider_map branch. The rest of main.py is B044's, B158's and the provider umbrellas B044's out_of_scope names.
  - The Python SDK's litellm.custom_provider_map, litellm.provider_list and litellm._custom_providers are B157's settings and B5367's custom_llm_setup in betterlite-sdk; the server keeps its own provider set.
pitfalls:
  - main.py checks litellm._custom_providers only after every built-in provider arm (L6061), so a custom provider that reuses a LiteLLM provider name never reaches its handler; decide by LiteLLM's provider names, not by the adapters betterlite has built so far.
  - The custom_provider_map loop has no break, so a duplicated provider name selects the last configured handler.
  - _complete_custom puts litellm.api_base before the deployment's own api_base, unlike every neighboring provider.
  - _complete_aiohttp_openai falls back to https://api.openai.com/v1, while B010's bare adapter defaults to https://api.openai.com without /v1; only the dispatch default reaches a proxy request.
  - A deployment that sets api_base to https://api.openai.com/v1 still configured it, so decide base_configured from litellm_params.api_base and never by comparing the resolved base with the OpenAI default.
  - B9986 and B9988 add Deployment fields and literals of their own. Set legacy to None in each, and report a literal outside this scope so the architect widens it.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
