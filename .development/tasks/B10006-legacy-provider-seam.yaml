id: B10006
title: Custom Python providers and the legacy provider settings through the server
description: >-
  B044 installed Provider::Legacy over the Deployment that exists today: one resolved model, base and key, no
  process settings, and no record of whether the deployment set its own base or key, since
  ChatDeployment::resolve_with fills an absent base and key from the OpenAI fallbacks. Four LiteLLM behaviors had no
  channel there. This task adds the channel and builds them: the custom_provider_map Python handlers
  (_complete_custom_providers, main.py L4982-L5042, and the custom embedding branch, L7274-L7296), the custom
  endpoint's litellm.api_base priority and empty-base error (L4924-L4926), the Aleph Alpha and litellm_proxy fallbacks
  for a deployment that sets no key or base (B044 refuses such a deployment, and a custom one without its own base, at startup until then), and
  _complete_aiohttp_openai (L2390-L2448), whose base and key chain
  contradicts two server tests B010 wrote. It was split off B044 on 11-19 and waits until the core is done.


  Config. B044's proxy_custom_dispatch section reads litellm_settings.custom_provider_map: a list of entries, each
  with a string provider and a string custom_handler, kept in order with duplicates. An entry without either key is a
  config error that names the entry's index, as LiteLLM's item["provider"] lookup fails there. Move the server's
  CustomProviderItem (python_hooks/load.rs) into the section as its entry type and make
  PythonHooks::load_custom_providers take the section's entries, so one type crosses from config to the loader.
  Test custom_provider_map_loads in the section's tests, and add config_yaml seeds named custom_provider_map*.


  Startup. LiteLLM imports each custom_handler with get_instance_fn while load_config walks litellm_settings
  (proxy_server.py L6457-L6470), then custom_llm_setup (utils.py L572-L581) adds the provider names to
  litellm._custom_providers. A call needs the host and tracker beside the HookObject, so load_custom_providers returns
  each provider name with its LoadedHook. Put `LegacyProviders` in the new server module
  crates/betterlite-server/src/server/chat_setup/legacy_providers.rs and its folder, with its own error enum.
  `LegacyProviders::load(config, environment, hooks: &PythonHooks)` loads the handlers in config order and builds one
  `Arc<LegacySettings>` and the configured flags of every deployment, keyed by model_id. B8613's lifespan calls it once
  at its config-load step, at LiteLLM's position, with the LifespanInputs python_hooks Arc, and never calls
  PythonHooks::new. A failed import stops startup with the HooksError that names the handler, as get_instance_fn
  raising stops load_config. Hand the value over the way B9997 hands over the MCP registry: Started carries
  `legacy_providers: Arc<LegacyProviders>`, B8610's StartupOutputs gains it and run_proxy copies it, and Shared gains
  `legacy_providers`, set in application(). chat_executor fills its custom_providers set (chat_setup.rs, today an
  empty BTreeSet beside known_names) with the section's provider names, so a deployment model like
  my-provider/my-model resolves as get_llm_provider does after custom_llm_setup. The names come from config, so that
  step needs no Python.


  The seam. `LegacySettings` lives in B044's legacy_dispatch module and holds the proxy_custom_dispatch Settings,
  B1500's proxy_provider_options Settings (LITELLM_PROXY_API_BASE and LITELLM_PROXY_API_KEY), litellm.api_base,
  litellm.api_key and litellm.openai_key from resource_sdk_settings, litellm.headers from embedding_provider_settings
  (the section that already reads litellm_settings.headers), and the resolved http2 flag of B172's TlsPolicy.
  Deployment gains `pub legacy: Option<LegacyInputs>`, where `LegacyInputs { settings: Arc<LegacySettings>,
  base_configured: bool, key_configured: bool }`. base_configured is true when the deployment's litellm_params.api_base
  is a non-empty string and key_configured when it sets an api_key. from_chat and from_params set None, and so does
  every Deployment literal; None keeps B044's deployment-only behavior. provider_chat, the stream path and
  provider_embedding set inputs.legacy from shared.legacy_providers for the deployment's model_id before prepare.
  Thread it the way B9990 threads the Anthropic runtime: one more argument, or a field on the struct that already
  carries that runtime if B9990's merged code has one. The chat, completions and embeddings routes pass
  `&state.shared.legacy_providers`.


  Through the seam, in B044's base and key functions. Aleph Alpha takes the deployment's key only when key_configured,
  else the section's chain (litellm.aleph_alpha_key, ALEPH_ALPHA_API_KEY, ALEPHALPHA_API_KEY, litellm.api_key), and
  its base the same way (litellm.api_base, ALEPH_ALPHA_API_BASE, https://api.aleph-alpha.com/complete), through the
  resolve methods B044 wrote. litellm_proxy takes B1500's LITELLM_PROXY_API_BASE and LITELLM_PROXY_API_KEY when the
  deployment sets none. The custom endpoint posts to litellm.api_base, else the deployment's base when
  base_configured, else the request fails with LiteLLM's ValueError text "api_base not set. Set api_base or
  litellm.api_base for custom endpoints". Remove B044's custom-base row from docs/deviations/B044.yaml.

  These chains replace B044's startup refusal. Delete the check in chat_deployments in chat_setup.rs, the
  ChatSetupError::UnbuiltChain variant and the rstest unbuilt_chain_stops_startup in chat_setup/tests.rs, so an
  aleph_alpha or litellm_proxy deployment that leaves out its own api_key or api_base starts and takes LiteLLM's
  chain, and a custom deployment without its own api_base starts and takes litellm.api_base at request time, else
  fails that request with the ValueError text above (main.py L4924-L4926), never at startup. The rstest
  a_legacy_deployment_without_its_own_credentials_starts in chat_setup/tests.rs keeps B044's five cases
  (aleph_alpha_prefix_without_api_key, aleph_alpha_provider_without_api_base, litellm_proxy_prefix_without_api_base,
  litellm_proxy_provider_without_api_key, custom_prefix_without_api_base) and asserts chat_executor now answers Ok
  for each.


  aiohttp_openai. apply_aiohttp_defaults in chat_setup.rs stops replacing the resolved values with the deployment's
  own: the base is the deployment's api_base, litellm.api_base, OPENAI_BASE_URL, OPENAI_API_BASE, then
  https://api.openai.com/v1, and the key is the deployment's api_key, litellm.api_key, litellm.openai_key, then
  OPENAI_API_KEY, which is the order OpenAiDefaults already gives resolve_with. The organization stays None. In the
  aiohttp adapter, with legacy set, empty call headers fall back to litellm.headers, a non-None extra_headers overwrites
  the optional extra_headers, and with http2 on each request logs at warning "litellm.http2 is enabled but
  aiohttp_openai/ always uses aiohttp, which has no HTTP/2 client; this request stays on HTTP/1.1" and stays on
  HTTP/1.1. The two cases in provider_call/tests/defaults.rs then expect http://127.0.0.1:1/chat/completions and
  "Bearer env-key"; add a case without the environment that expects https://api.openai.com/v1/chat/completions and
  "Bearer None". In provider_call/tests/errors.rs, aiohttp_without_a_key_sends_bearer_none becomes
  aiohttp_without_a_key_takes_openai_api_key and expects "authorization: bearer env-key". Delete the first row of
  docs/deviations/B010.yaml, which says aiohttp_openai reads only its deployment's values.


  Custom handlers. provider_chat, the stream path and provider_embedding ask Provider::from_deployment first; when it
  answers UnavailableAdapter for a provider name LegacyProviders holds, the call goes to that handler instead. Select
  the last entry with that provider. When none matches, answer LiteLLMUnknownProvider, a 400 BadRequestError with
  "Unmapped LLM provider for this endpoint. You passed model={model}, custom_llm_provider={custom_llm_provider}. Check
  supported provider and route: https://docs.litellm.ai/docs/providers" (types/utils.py L151), in B184's envelope.
  Chat asks B044's custom_chat_llm_router for the method with async_fn true, since the proxy always calls acompletion,
  and the request's stream. It passes the keywords of L5016-L5033: model, messages, headers (the call's, else
  litellm.headers, else {}), model_response (a new betterlite ModelResponse, B5657), print_verbose, api_key, api_base,
  acompletion, logging_obj, optional_params, litellm_params, logger_fn, timeout, custom_prompt_dict, client and
  encoding. Call through HookObject::call_method_raw with the deployment's timeout as the deadline (B165's call_within),
  not the 30 second hook default. A returned ModelResponse becomes the chat completion. Only when stream is literally
  True does the returned async iterator become a stream, its chunks going through B5653's decode_provider_chunk
  custom-provider branch into the SSE relay. Embedding calls aembedding with model, input, logging_obj, api_base,
  api_key, timeout, optional_params, model_response (a new EmbeddingResponse, B5658), print_verbose and
  litellm_params. api_key and api_base are the deployment's configured values or None. An exception the handler raises
  goes through the same error mapping as a provider failure.


  Tests. server::chat_setup::legacy_providers tests load handlers from temporary modules next to a config file through
  a PythonHooks built for that file: order and the last match for a duplicated name, the unknown-provider 400, a plain
  class and a subclass of betterlite's CustomLLM (B164) both serving chat, a stream and an embedding, a failed import,
  and the flags by model_id. Tests whose names start with seam_ in betterlite-provider cover the Aleph Alpha and
  litellm_proxy fallbacks with key_configured and base_configured false, the custom endpoint's priority and empty-base
  error, and the aiohttp headers fallback and http2 warning. shared_legacy_providers asserts Shared.legacy_providers is
  Arc::ptr_eq with the StartupOutputs value; handoff_legacy_providers asserts the lifespan loads once and Started holds
  the result. HTTP cases under tools/oracle/cases/providers/legacy-settings/ boot the proxy: python-chat,
  python-stream and python-embedding over a fixture handler in tools/oracle/fixtures/legacy-settings/, written as a
  plain Python class with acompletion, astreaming and aembedding and no CustomLLM base, because the same module runs
  under LiteLLM; custom-handler-missing (a deployment that names a custom provider no entry registers),
  custom-base-missing (a custom/ model with neither base set), aiohttp-global-base (no base or key on the deployment,
  OPENAI_BASE_URL and OPENAI_API_KEY in the case env) and aleph-env-credentials (no key or base on the deployment,
  ALEPH_ALPHA_API_KEY and ALEPH_ALPHA_API_BASE in the case env). If the oracle cannot yet put the fixture module beside
  the config it generates, add that in tools/oracle/src/gateway.rs. About 170 nonblank LiteLLM lines: the aiohttp arm
  45, the custom provider arm 45, the custom embedding branch 18, the Aleph Alpha, litellm_proxy and custom base
  chains 15, the config load 12 and custom_llm_setup 8.
