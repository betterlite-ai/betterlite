dod:
  - text: The proxy_custom_dispatch section loads custom_provider_map entries in order with duplicates, refuses an entry without provider or custom_handler, and the loader no longer refuses the key as unsupported.
    proof: [map-config-tests, map-config-corpus]
  - text: A custom provider deployment calls the last matching handler's acompletion, astreaming or aembedding with LiteLLM's keywords and the deployment's timeout as deadline, and a provider with no handler answers LiteLLM's unknown-provider 400.
    proof: [legacy-providers-tests, oracle]
  - text: Startup loads every handler once through the lifespan's PythonHooks, a failed import stops startup, and the same LegacyProviders reaches Started, StartupOutputs and shared.legacy_providers.
    proof: [legacy-providers-tests, wiring-tests]
  - text: A deployment without its own base or key gets the Aleph Alpha and litellm_proxy fallbacks, the custom endpoint puts litellm.api_base first and fails with LiteLLM's text when no base is left, and B044's custom-base deviation is gone.
    proof: [seam-tests, oracle]
  - text: B044's startup refusal is gone, with its ChatSetupError::UnbuiltChain variant and its test, and an aleph_alpha or litellm_proxy deployment without its own api_key or api_base, or a custom one without its own api_base, starts.
    proof: [refusal-lifted]
  - text: aiohttp_openai takes main.py's base and key chain, falls back to litellm.headers and warns under http2, the server tests assert LiteLLM's values, and B010's aiohttp deviation is gone.
    proof: [seam-tests, aiohttp-tests, oracle]
  - text: The fixture handler passes ruff.
    proof: [fixture-lint]
checks:
  optional: [mutants]
  commands:
    - id: map-config-tests
      why: custom_provider_map is still refused as unsupported, or loses order, duplicates or the entry error
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(custom_provider_map_loads)'
    - id: map-config-corpus
      why: no fresh configuration seed reaches the custom_provider_map loader
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'crates/betterlite-config/fuzz/corpus/config_yaml/custom_provider_map*')" && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
    - id: legacy-providers-tests
      why: handlers load out of order, the first duplicate wins, the unknown provider is not a 400, a handler call misses a keyword, or the hook loader tests break
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::legacy_providers::/)' && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^python_hooks::load::/)'
    - id: seam-tests
      why: a fallback chain ignores the configured flags, the custom endpoint keeps the deployment base first, a Deployment literal breaks, or a deviation row that this task closes is still there
      run: test -z "$(grep -l B10006 docs/deviations/B044.yaml)" && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/::seam_/)' && cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^legacy_dispatch::/) | test(/^aiohttp_openai_dispatch::/) | test(/^embedding_rerank_providers::/) | test(/^provider::tests::/) | test(/^operation::/)'
    - id: refusal-lifted
      why: B044's startup refusal still stops an aleph_alpha or litellm_proxy deployment, or a custom one without a base, that LiteLLM serves from its global chain
      run: test -z "$(grep -l -e UnbuiltChain -e unbuilt_chain_stops_startup crates/betterlite-server/src/server/chat_setup.rs crates/betterlite-server/src/server/chat_setup/tests.rs)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::tests::a_legacy_deployment_without_its_own_credentials_starts::/)'
    - id: aiohttp-tests
      why: the server tests still assert the bare adapter's base and key, or B010's aiohttp deviation is still logged
      run: test -z "$(grep -l 'https://api.openai.com/chat/completions' crates/betterlite-server/src/server/chat_setup/provider_call/tests/defaults.rs)" && test -z "$(grep -l aiohttp_without_a_key_sends_bearer_none crates/betterlite-server/src/server/chat_setup/provider_call/tests/errors.rs)" && test -z "$(grep -l 'aiohttp_openai reads only its deployment' docs/deviations/B010.yaml)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^server::chat_setup::provider_call::tests::/)'
    - id: wiring-tests
      why: the lifespan loads the handlers twice or not at all, or the routes read another LegacyProviders than Shared holds
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(shared_legacy_providers)' && cargo nextest run --locked -p betterlite --no-tests=fail -E 'test(handoff_legacy_providers)'
    - id: fixture-lint
      why: the fixture handler module is missing or fails ruff
      run: test -d tools/oracle/fixtures/legacy-settings && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/fixtures/legacy-settings
