checks:
  optional: []
  commands:
  - id: behavior-tests
    why: the production domain behavior is absent in the scoped crates or only corpus replay exists
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::claude_plugin_policy::/)
      - test(/::replays_corpus$/)'
  - id: case-plugin-https-source
    why: the plugin-https-source behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::claude_plugin_policy::tests::plugin_https_source($|::)/)'
  - id: case-invalid-plugin-source
    why: the invalid-plugin-source behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::claude_plugin_policy::tests::invalid_plugin_source($|::)/)'
  - id: case-skill-object-permission
    why: the skill-object-permission behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::claude_plugin_policy::tests::skill_object_permission($|::)/)'
  - id: case-nonadmin-plugin-denied
    why: the nonadmin-plugin-denied behavior or its assertions are absent
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::claude_plugin_policy::tests::nonadmin_plugin_denied($|::)/)'
  - id: helper-python
    why: the operation adapter is missing or fails strict Python checks
    run: test -f tools/oracle/helpers/claude_plugin_policy.py && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-corpus
    why: the new external enum tag has no added seed or the shared parser rejects it
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/claude_plugin_policy-*)"
      && grep -qE "^[[:space:]]+claude_plugin_policy:" tools/oracle/fuzz/corpus/helper_case/claude_plugin_policy-*
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: new-oracle-cases
    why: no new domain case exists on this branch
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/claude-plugin-policy)"
