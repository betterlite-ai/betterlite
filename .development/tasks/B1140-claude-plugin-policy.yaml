id: B1140
title: Claude plugin and skill policy
description: >-
  Validate plugin source metadata and admin/skill visibility predicates with typed Claude records; no URL is downloaded
  and no route is registered here.


  Implement crates/betterlite-core/src/api/claude_plugin_policy.rs. Use ClaudePluginPolicyInput and ClaudePluginPolicyResult
  with typed nested records; inject only the clock, repositories, transports and resolved settings this slice uses
  through constructors. Reuse ApiLimits from B1087; do not introduce ambient environment or duplicate credential
  resolution.


  Exception-constructor branches to exercise (these are inputs to the final handler mapper, not automatically the
  HTTP wire envelope): claude_code_marketplace.py:256 status_code=status_code, exception_detail=FastAPI detail object;
  claude_code_marketplace.py:271 status_code=403, exception_detail=FastAPI detail object; claude_code_marketplace.py:198
  status_code=400, exception_detail=FastAPI detail object; claude_code_marketplace.py:204 status_code=400, exception_detail=FastAPI
  detail object; claude_code_marketplace.py:210 status_code=400, exception_detail=FastAPI detail object; claude_code_marketplace.py:217
  status_code=400, exception_detail=FastAPI detail object; claude_code_marketplace.py:222 status_code=400, exception_detail=FastAPI
  detail object; claude_code_marketplace.py:243 status_code=400, exception_detail=FastAPI detail object; claude_code_marketplace.py:230
  status_code=400, exception_detail=FastAPI detail object; claude_code_marketplace.py:238 status_code=400, exception_detail=FastAPI
  detail object; claude_code_marketplace.py:80 status_code=500, exception_detail=FastAPI detail object. Compare
  the actual source status, error type, param and code; ignore only error wording except in message-extraction tests.


  Write adjacent tests.rs behavior functions plugin_https_source, invalid_plugin_source, skill_object_permission,
  nonadmin_plugin_denied under api::claude_plugin_policy::tests. Each named function drives production code and
  asserts its case result; use named rstest inputs for related values. Corpus replay has the separate name replays_corpus.


  This slice consumes typed records or streams and introduces no outside-byte parser. Do not add a cargo-fuzz target
  for arithmetic, routing, lifecycle or an already decoded transformation; byte decoding stays with the dependency
  that owns it.


  Register HelperCall::ClaudePluginPolicy in tools/oracle/src/helpers/mod.rs (and helpers.rs if it owns the re-export)
  and tools/oracle/helpers/dispatch.py. Each HelperCase encodes call: {claude_plugin_policy: <typed input>}; operation
  is only the Python stdin protocol key, never the case tag. The Rust adapter calls this production service and
  Python invokes the pinned MIT helper with independently scripted inputs/dependencies. Compare values and ordered
  diagnostics/effects, never fixtures against themselves; HTTP/auth route behavior stays in consuming route tasks.


  Callable ownership: litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: _get_prisma_client
  (L75-L84); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: _is_https_url_with_host
  (L185-L190); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: _validate_plugin_source
  (L193-L246); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: _build_plugin_manifest
  (L249-L252); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: _error_response
  (L255-L256); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: _name_conflict_error
  (L259-L262); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_marketplace.py: _require_proxy_admin
  (L265-L274); litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_skill_access.py: _skills_of (L22-L23);
  litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_skill_access.py: granted_skills (L26-L40);
  litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_skill_access.py: SkillVisibility.allows (L48-L49);
  litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_skill_access.py: SkillVisibility.where (L51-L56);
  litellm/proxy/anthropic_endpoints/claude_code_endpoints/claude_code_skill_access.py: skill_visibility (L62-L67).
  Abstract/protocol declarations map to native types and synchronous/async wrappers share one implementation; a
  partial function span is the explicit preparation/transition stage described above, with typed values passed to
  the following stage.


  Sizing: 199 owned nonblank/non-comment/non-docstring Python lines (243 nonblank/non-comment physical lines, including
  signatures/docstrings), counted from the linked spans without overlap. Estimated changed lines: 219 implementation,
  64 behavior tests, 48 oracle fixtures, 90 Rust/Python adapters, 0 decoder fuzz/replay, 0 config tests/seeds and
  30 wiring; 451 total within the 460-line cap. The estimate includes tests and adapters, not just production code.


  Direct inputs come from B732 (Typed authentication principals and grant resolution), B171 (Direct helper oracle
  and URL path encoding), B1087 (Api boundaries), B1018 (MIT resource owner compatibility). These are callable/type/config
  owners, not provider-family umbrellas; the external B500-B859 ids retain ownership on the provider and keys/data
  branches.
