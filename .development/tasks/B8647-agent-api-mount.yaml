deviations:
  - what: The agents routes are registered at startup, not on the first request under a matching prefix.
    why: betterlite has no lazy import cost. LiteLLM's OpenAPI document omits them until warmed; the answers to requests are the same.
out_of_scope:
  - "The handlers and their checks: B4781, B4784, B4785, B4786 and B3191. GET /agent/daily/activity: B8482."
  - "The admission and invocation helper cases stay with B4781 and the merged card helper cases with B4785."
  - "The adapters for the agent auth ports: B8645 and B8646. A2A and skills routes: B8648. The embedder itself: B8631."
pitfalls:
  - Mount /public/agents/fields only through mount_public; merged in mount it gets the key check and answers 401 where LiteLLM answers 200.
  - The public group holder is one value shared by the list route and both make_public routes; two copies make a make_public call invisible to the list.
  - The identity status route answers 503 "Agent policy could not be loaded" without a database, not 404, because LiteLLM always builds the store.
  - The 401 for a missing key comes from the auth layers around mount, before any query-parameter 422 of the list route; a case with a bad key and a bad top_k must still answer 401.
  - JWT_ISSUER and JWT_AUDIENCE are read once into IdentitySettings; reading the environment per request breaks the config crate rule.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
