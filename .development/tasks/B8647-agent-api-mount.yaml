id: B8647
title: Mount the agents API and the public agent fields route
description: >-
  The /v1/agents routes are built by four tasks and mounted by none: B4784 `agent_read_routes` (GET `/v1/agents`, GET `/v1/agents/{agent_id}`), B4785 `agent_write_routes` (POST `/v1/agents`, PUT, PATCH and DELETE `/v1/agents/{agent_id}`), B4781 `agent_identity_routes` (GET `/v1/agents/identity/providers`, GET `/v1/agents/{agent_id}/identity`) and B4786's admin action routes (POST `/v1/agents/{agent_id}/kill_switch`, POST `/v1/agents/{agent_id}/make_public`, POST `/v1/agents/make_public`). B3191's `public_endpoints::agent_fields::agent_fields_routes()` (GET `/public/agents/fields`) is done and never mounted. So the agents API answers 404 today. LiteLLM registers the first group as one lazy feature named agents (path prefixes /v1/agents, /agents, /agent/), every route behind user_api_key_auth with the tag "[beta] A2A Agents" (DELETE has "Agents"), and serves /public/agents/fields with no key check. This task builds the state those route functions take, from config and Shared, mounts them, and proves them over HTTP: the route tasks test their handlers with tower's oneshot only, and their HTTP oracle cases moved here. GET `/agent/daily/activity` is not here: spend's B8482 mounts it.

  Where. crates/betterlite-server/src/app/agents.rs, where the skeleton stubs `mount(router, state)` (inside the auth layers), `mount_public(router, state)` (outside them) and `async fn start(state)`, all called by B8610's app.rs; `start` stays as the stub left it. The route state goes in app/agents/api.rs with app/agents/api/** (settings.rs, stores.rs, embedder.rs, public_groups.rs, tests.rs). Keep the mod lines the skeleton put in app/agents.rs. Read each route module before writing: crates/betterlite-server/src/agent_endpoints/{agent_reads,agent_listing,agent_lookup,agent_writes,identity_admin,admin_actions,search,health}.rs and their folders. Use the route function names and state types they export. No statics, no trait objects, native async fn.

  1. Config. A new config section `agent_routes` (crates/betterlite-config/src/sections/agent_routes.rs and agent_routes/**) reads what no other section reads yet: `litellm_settings.public_agent_groups` (list of strings, default absent) and the env vars JWT_ISSUER, JWT_AUDIENCE, MICROSOFT_TENANT and MICROSOFT_CLIENT_ID (each optional, an empty string kept as given). Before adding a key, look in crates/betterlite-config/src/sections for a section that already reads it (B762's JWT sections, B1622's microsoft_login) and take the value from there instead. Tests in sections::agent_routes::tests load each key and its default.

  2. Settings (api/settings.rs). Build B4781's IdentitySettings once at mount: enable_jwt_auth from general_settings.enable_jwt_auth (default false) and issuers from litellm_jwtauth.issuers through B869's section, plus the four env values. Build B4775's JwtAgentSettings from the general_settings keys it names. Never read them again per request.

  3. Public agent groups (api/public_groups.rs). `PublicAgentGroups` is one `Arc<tokio::sync::RwLock<Option<Vec<String>>>>` seeded from litellm_settings.public_agent_groups. B4784's AgentListSettings implementation (`ServerAgentListSettings`) reads it in public_agent_groups(), returns the JwtAgentSettings from item 2 in jwt_agent_settings() and B4783's search section in search_settings(). B4786's make_public routes write through the same holder, so a make_public call is seen by the next list call (LiteLLM writes litellm.public_agent_groups in memory).

  4. Stores (api/stores.rs). B4784's PgAgentReads and B4785's PgAgentWriteStore over `shared.db`, and B4777's AgentStore (max_json_depth 100, the publisher B4777 names for production). B4781's IdentityStatusReads (`StoreIdentityStatus`): with a store, forward to the store's agent method; with no database answer the policy_unavailable failure "Agent policy could not be loaded", which the route turns into 503 (LiteLLM builds the store even without a database and its read fails). B4786's ports (the kill switch webhook through B4774 with `shared.http`, the audit writer, the config writer for public_agent_groups and the database check) are built here too, from the types B4786 defines. B4785's route state takes a ProxyUrls: pass `crate::app::admin::urls::proxy_urls(&state.config)` from B8675, built once per mount.

  5. Search and health (api/embedder.rs). B4783's AgentHealthTransport production implementation over `shared.http`. `InferenceAgentEmbedders` implements B4783's AgentEmbedders over the one RouterEmbedder that inference's B8631 builds next to RouterCalls in crates/betterlite-server/src/app/inference/router_calls (LiteLLM's router_embedder: the proxy logging pre-call hook with call type aembedding, then the router). Reach it through the app::inference module (same crate) as B8631 exposes it. embedder_for answers None when the router has no model list, and otherwise an Embedder that sends the texts to that RouterEmbedder with the embedding model and the caller. Write no second embedder.

  6. Mount (app/agents.rs). mount merges, in this order, agent_identity_routes, agent_read_routes, agent_write_routes and the B4786 routes, each given its state from items 2 to 5 and B8645's AgentServices built once in mount with AgentServices::new(&state.config, &state.shared). axum prefers the static paths (/v1/agents/identity/providers, /v1/agents/make_public) over /v1/agents/{agent_id} on its own; do not register a path twice, and do not call .fallback. mount_public merges agent_fields_routes(), the route LiteLLM serves with no key check. Delete the stale comment line "Awaits a future B003 integration task..." above agent_fields_routes in crates/betterlite-server/src/public_endpoints/agent_fields.rs and change nothing else there.

  HTTP oracle cases through the booted proxy. The cases below moved here from the route tasks; write each from that task's text, with the config its name implies (master key set, no database unless the name says db). From B4781 (items 6 and 7 of its text): providers-jwt-off-empty, providers-jwt-on-issuers, providers-no-key-401 and status-no-database-503. From B4784 (its list and lookup sections): the ten listing cases, covering config agents in order, public agent groups present and empty, the redacted litellm_params, the three 422 query errors, the 400 agent_search_not_configured, the bad key 401 and GET by id without a database. From B4785 (its check order): the 401 without a key on POST and DELETE and the no-database answers of POST, PUT, PATCH and DELETE. From B4786 (its DoD lines): the fifteen kill switch and make_public cases. Plus one of this task's own: GET /public/agents/fields without a key answers 200 with the bundled list.
