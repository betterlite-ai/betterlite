dod:
  - text: The agent_routes section loads public_agent_groups and the four env values with their defaults.
    proof: [config-tests]
  - text: IdentitySettings, JwtAgentSettings and the public group holder are built once, the list route reads the holder and make_public writes it.
    proof: [api-tests]
  - text: StoreIdentityStatus answers the policy_unavailable failure without a database, and InferenceAgentEmbedders answers None without a model list and otherwise embeds through B8631's RouterEmbedder.
    proof: [api-tests]
  - text: The identity, list, lookup, write and admin action routes answer through the booted proxy as LiteLLM does, with 401 for a missing or bad key, and /public/agents/fields answers 200 without a key.
    proof: [oracle]
checks:
  optional: []
  commands:
    - id: config-tests
      why: the agent_routes section is missing or reads a key or default wrong
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::agent_routes::/)'
    - id: api-tests
      why: the agents route state is missing or built per request, or the embedder or status reads differ
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::agents::api::/)'
