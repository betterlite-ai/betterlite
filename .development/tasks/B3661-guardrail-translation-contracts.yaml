dod:
  - text: All Bedrock check category literals and item/model types are defined and match LiteLLM's structure.
    proof: [bedrock-types-exist]
  - text: BedrockChecksConfigModel validator _require_at_least_one_check rejects configs with all checks None and raises the exact LiteLLM error message.
    proof: [bedrock-validator-works]
  - text: BedrockGuardrailConfigModel, LakeraV2GuardrailConfigModel, LassoGuardrailConfigModel, DeepKeepGuardrailConfigModel, PillarGuardrailConfigModel, NomaGuardrailConfigModel, ZscalerAIGuardConfigModel and JavelinGuardrailConfigModel types exist with all fields matching LiteLLM.
    proof: [provider-config-types-exist]
  - text: BedrockGuardrailStreamParams.from_extras extracts only known fields from extras dict and constructs the model correctly.
    proof: [from-extras-method-works]
  - text: All provider config types deserialize from JSON with correct defaults (streaming_buffer_until_moderated=true, streaming_sampling_rate=5, on_flagged="block" for Lakera V2, etc).
    proof: [defaults-correct]
  - text: StreamTransformSink and StreamingScanKey types exist with correct fields and defaults; StreamingScanKey.has_nothing_to_scan returns correct boolean.
    proof: [sink-and-key-types-exist]
  - text: BaseTranslation trait exists with abstract methods (process_input_messages, process_output_response, process_output_streaming_response, get_streaming_scan_key, build_block_sse_chunks, build_stream_error_items, get_structured_messages, extract_request_tool_names).
    proof: [translation-trait-exists]
  - text: transform_user_api_key_dict_to_metadata correctly prefixes all keys with user_api_key_ and skips None values and underscore-prefixed keys.
    proof: [user-metadata-transform-works]
  - text: merge_user_api_key_metadata_into_request merges user_api_key_* metadata into the resolved bucket without overwriting existing keys.
    proof: [user-metadata-merge-works]
  - text: The independently invoked MIT helper matches the production operation and the new helper-case seed replays.
    proof: [guardrail-provider-oracle, guardrail-provider-python, guardrail-provider-corpus]

checks:
  optional:
    - mutants
  commands:
    - id: bedrock-types-exist
      why: Bedrock check category literals or model types are missing or incorrect
      run: grep -q "BedrockChecksContentFilterCategory" crates/betterlite-guardrails/src/*.rs && grep -q "BedrockChecksConfigModel" crates/betterlite-config/src/sections/*.rs && grep -q "_require_at_least_one_check" crates/betterlite-config/src/sections/*.rs
    - id: bedrock-validator-works
      why: The Bedrock validator does not enforce at least one check
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^guardrail_provider_options::.*bedrock.*validator/)' && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_guardrail_provider_options_corpus)'
    - id: provider-config-types-exist
      why: Provider config types are missing or incomplete
      run: grep -q "BedrockGuardrailConfigModel" crates/betterlite-config/src/sections/*.rs && grep -q "LakeraV2GuardrailConfigModel" crates/betterlite-config/src/sections/*.rs && grep -q "PillarGuardrailConfigModel" crates/betterlite-config/src/sections/*.rs && grep -q "NomaGuardrailConfigModel" crates/betterlite-config/src/sections/*.rs && grep -q "ZscalerAIGuardConfigModel" crates/betterlite-config/src/sections/*.rs && grep -q "JavelinGuardrailConfigModel" crates/betterlite-config/src/sections/*.rs
    - id: from-extras-method-works
      why: BedrockGuardrailStreamParams.from_extras is missing or fails to extract fields
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_translation_contracts::guardrail_provider_options::.*from_extras/)'
    - id: defaults-correct
      why: Provider config defaults do not match LiteLLM
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_translation_contracts::guardrail_provider_options::.*defaults/)'
    - id: sink-and-key-types-exist
      why: StreamTransformSink, StreamingScanKey or has_nothing_to_scan property is missing
      run: grep -q "StreamTransformSink" crates/betterlite-guardrails/src/*.rs && grep -q "StreamingScanKey" crates/betterlite-guardrails/src/*.rs && grep -q "has_nothing_to_scan" crates/betterlite-guardrails/src/*.rs
    - id: translation-trait-exists
      why: BaseTranslation trait or its required methods are missing
      run: grep -q "trait BaseTranslation" crates/betterlite-guardrails/src/*.rs && grep -q "process_input_messages" crates/betterlite-guardrails/src/*.rs && grep -q "process_output_response" crates/betterlite-guardrails/src/*.rs && grep -q "get_structured_messages" crates/betterlite-guardrails/src/*.rs
    - id: user-metadata-transform-works
      why: transform_user_api_key_dict_to_metadata is missing or does not prefix keys correctly
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_translation_contracts::.*user_metadata/)'
    - id: user-metadata-merge-works
      why: merge_user_api_key_metadata_into_request is missing or does not merge correctly
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_translation_contracts::.*metadata_merge/)'
    - id: guardrail-provider-oracle
      why: The typed operation has no seed, the oracle helper fails or behavior tests are missing
      run: test -f tools/oracle/helpers/b3661.py && test -f tools/oracle/src/helpers/guardrails/b3661.rs && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^guardrail_provider_options::|replays_the_helper_case_corpus)' && test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/guardrail-provider-options-*)"
    - id: guardrail-provider-python
      why: The helper adapter is missing or strict Python checking fails
      run: test -f tools/oracle/helpers/b3661.py && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: guardrail-provider-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case/guardrail-provider-options-*)" && grep -rlq "guardrail_provider_options" tools/oracle/fuzz/corpus/helper_case/guardrail-provider-options-* && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

