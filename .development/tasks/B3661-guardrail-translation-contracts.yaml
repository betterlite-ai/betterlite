id: B3661
title: Guardrail provider options and translation contracts
description: >-
  Define Bedrock checks/streaming controls and the remaining provider option records together with the endpoint translation contract. Keep scan fingerprints and per-round rewrite/holdback outputs separate from the mutable request.

  Build Rust serde types in betterlite-config matching the LiteLLM types at the pinned commit:
  - BedrockChecksConfigModel: contentFilter/promptAttack/sensitiveInformation union with _require_at_least_one_check validator ensuring at least one is set.
  - BedrockGuardrailConfigModel: guardrailIdentifier, guardrailVersion, AWS credentials, streaming params, contextual grounding, and thresholds.
  - BedrockGuardrailStreamParams: streaming_buffer_until_moderated, streaming_sampling_rate, streaming_end_of_stream_only and streaming_buffer_release_on_scan with from_extras classmethod (Rust name shortened from BedrockGuardrailStreamingParams to fit the 30-character identifier limit).
  - LakeraV2GuardrailConfigModel: api_key, api_base, project_id, payload, breakdown, metadata, dev_info, on_flagged and advisory_system_message.
  - LassoGuardrailConfigModel: lasso_user_id, lasso_conversation_id and mask fields.
  - DeepKeepGuardrailConfigModel: deepkeep_firewall_id field.
  - PillarGuardrailConfigModel: on_flagged_action, async_mode, persist_session, include_scanners and include_evidence fields.
  - NomaGuardrailConfigModel: use_v2, application_id, gateway_name, monitor_mode, block_failures and anonymize_input fields.
  - ZscalerAIGuardConfigModel: policy_id and send_user_api_key_* fields.
  - JavelinGuardrailConfigModel: guard_name, api_version, metadata, application and config fields.

  Build the translation contract layer in crates/betterlite-guardrails: define Rust types for the abstract translation interface:
  - StreamTransformSink dataclass with mutated_text_per_choice and holdback_per_choice dicts.
  - StreamingScanKey frozen dataclass with texts, tool_calls, stream_ended, tool_calls_in_flight fields and has_nothing_to_scan property.
  - BaseTranslation trait with abstract methods: process_input_messages, process_output_response, process_output_streaming_response, get_streaming_scan_key, build_block_sse_chunks, build_stream_error_items, get_structured_messages and extract_request_tool_names.
  - Static/default implementations: transform_user_api_key_dict_to_metadata (prefixes keys with user_api_key_), merge_user_api_key_metadata_into_request (merges into the resolved metadata bucket without overwriting), post_call_hook_response (identity by default).
  - ClassVar defaults: delivers_ended_stream_rewrites=false, assembles_streamed_response=false.

  All Bedrock literal types (BedrockChecksContentFilterCategory, BedrockChecksPromptAttackCategory, BedrockChecksSensitiveInformationEntity) and item/model structures are owned here along with their nested BedrockChecks* classes. The validator _require_at_least_one_check must fail with the exact LiteLLM error message when no checks are enabled. from_extras classmethod on BedrockGuardrailStreamParams must extract only known fields from an extras dict and construct the model. Defaults match LiteLLM exactly: streaming_buffer_until_moderated defaults true, streaming_sampling_rate defaults 5, on_flagged defaults "block" for Lakera V2, etc. ContentFilterAction and BlockedWord are owned by B3660; do not duplicate them.

scope:
  paths:
    - crates/betterlite-guardrails/src/guardrail_translation_contracts.rs
    - crates/betterlite-guardrails/src/guardrail_translation_contracts/**
    - tools/oracle/cases/helpers/guardrail-provider-options/**
    - tools/oracle/fuzz/corpus/helper_case/guardrail-provider-options-*
    - crates/betterlite-config/src/sections/guardrail_translation_contracts.rs
    - crates/betterlite-config/src/sections/guardrail_translation_contracts/**
    - tools/oracle/helpers/b3661.py
    - tools/oracle/helpers/b3661/**
    - tools/oracle/src/helpers/guardrails/b3661.rs
    - tools/oracle/src/helpers/guardrails/b3661/**
  lint_tables: false

