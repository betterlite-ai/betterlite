deviations:
  - what: StreamingScanKey.stream_ended and tool_calls_in_flight fields do not participate in equality comparison, only in observation logic.
    why: These flags indicate protocol state (whether the stream ended, whether tool calls are in flight) rather than scannable content; they are used by the caller but do not affect whether a scan would be redundant.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/guardrail_translation/base_translation.py#L39-L55

out_of_scope:
  - ContentFilterConfigModel and ContentFilterPattern (owned by B3660)
  - ContentFilterAction and BlockedWord (owned by B3660)
  - GuardrailConfigModel base class and per-role/per-hook inheritance (owned by B104)
  - Dynamic provider discovery, factory registry and callback construction (owned by B3680-B3682)
  - Enterprise-package conditional imports or hide-secrets initialization (out of MIT scope)

pitfalls:
  - "The validator _require_at_least_one_check must raise ValueError with exactly the message: Bedrock 'checks' must enable at least one of: contentFilter, promptAttack, sensitiveInformation."
  - "BedrockGuardrailStreamParams.from_extras receives a dict that may have extra keys not in model_fields; extract only known fields before construction."
  - "Defaults in Bedrock models include gt=0 (chunk_budget_chars) and ge/le bounds on thresholds (0.0 to 1.0); preserve these in serde validation."
  - "On_flagged field in LakeraV2GuardrailConfigModel accepts: block, monitor or inject_system_message; ensure serde accepts only these values."
  - "streaming_buffer_until_moderated must default true, not false, to match LiteLLM's buffering-by-default behavior."
  - "Noma's use_v2 controls routing between legacy and v2 implementations; the flag itself is just stored, not interpreted by this config type."
  - "LiteLLM names the Bedrock streaming params class BedrockGuardrailStreamingParams (31 chars); shorten to BedrockGuardrailStreamParams (29 chars) to comply with the 30-character identifier limit."
  - "Bedrock streaming field names all start with streaming_: streaming_sampling_rate (not sampling_rate), streaming_end_of_stream_only (not end_of_stream_only), streaming_buffer_release_on_scan (not buffer_release_on_scan)."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 0
