references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L565-L708
  why: Owned callable/type slice; use decorators for route aliases and the exact branches for behavior.
dod:
- text: 'variation upload: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-variation-upload
  - oracle
- text: 'variation size n: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-variation-size-n
  - oracle
- text: 'variation error: the named production behavior test asserts the result and effects described above.'
  proof:
  - case-variation-error
  - oracle
- text: 'variation response format: the named production behavior test asserts the result and effects described
    above.'
