  - crates/betterlite-core/src/api/image_variations.rs
  - crates/betterlite-core/src/api/image_variations/**
  - crates/betterlite-core/src/api.rs
  - Cargo.toml
  - Cargo.lock
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/mod.rs
  - tools/oracle/src/helpers.rs
  - tools/oracle/src/helpers/image_variations.rs
  - tools/oracle/src/helpers/image_variations/**
  - tools/oracle/helpers/dispatch.py
  - tools/oracle/helpers/image_variations.py
  - tools/oracle/helpers/image_variations/**
  - tools/oracle/fuzz/corpus/helper_case/image_variations-*
  - tools/oracle/cases/helpers/image-variations/**
