checks:
  optional: []
  commands:
    - id: sign-and-execute-tests
      why: "_sign_and_execute_request does not hash body or sign with SigV4"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*sign.*execute/)'
    - id: sign-and-execute-unsupported-method
      why: "_sign_and_execute_request does not raise error for unsupported method"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*unsupported.*method/)'
    - id: bucket-exists-get-then-create
      why: "_ensure_vector_bucket_exists does not call GetVectorBucket before CreateVectorBucket"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*bucket.*get.*then.*create/)'
    - id: bucket-exists-409
      why: "_ensure_vector_bucket_exists does not handle 409 as success"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*bucket.*409/)'
    - id: index-exists-get-then-create
      why: "_ensure_vector_index_exists does not call GetIndex before CreateIndex"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*index.*get.*then.*create/)'
    - id: index-exists-409
      why: "_ensure_vector_index_exists does not handle 409 as success"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*index.*409/)'
    - id: index-exists-dimension
      why: "_ensure_vector_index_exists does not include dimension or use default 1024"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*index.*dimension/)'
    - id: put-vectors-tests
      why: "_put_vectors does not call PutVectors API correctly"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*put.*vectors/)'
    - id: ingest-target-split
      why: "s3_vectors_ingest_target does not split vector_store_id on colon"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*ingest.*target.*split/)'
    - id: ingest-target-fallback
      why: "s3_vectors_ingest_target does not use vector_bucket_name as fallback"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*ingest.*target.*fallback/)'
    - id: ingest-target-missing-error
      why: "s3_vectors_ingest_target does not raise error when both are missing"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*ingest.*target.*missing/)'
    - id: ingest-embedding-override
      why: "s3_vectors_ingest_embedding_options does not override embedding model"
      run: cargo nextest run --locked -p betterlite-rag --no-tests=fail -E 'test(/^s3_vectors_ingestion::.*ingest.*embedding/)'
    - id: endpoint-check
      why: "endpoints do not use https://s3vectors.{region}.api.aws"
      run: grep -q 's3vectors.*api\.aws' crates/betterlite-rag/src/s3_vectors_ingestion.rs
    - id: service-name-check
      why: "SigV4 signing does not use service name 's3vectors'"
      run: grep -q '"s3vectors"' crates/betterlite-rag/src/s3_vectors_ingestion.rs
oracle_cases: []
deviations:
  - what: "When GetVectorBucket or GetIndex fails (non-200 response), betterlite treats it as 'does not exist' and attempts creation rather than propagating the error."
    why: "LiteLLM's pin shows this get-error-to-create pattern (lines 288-314, 324-330)."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/s3_vectors_ingestion.py#L288-L330
out_of_scope:
  - >-
    _get_dimension_from_embedding_request, _get_dimension_from_config, _ensure_config_initialized, embed, store, query_vector_store and S3VectorsRAGIngestion.__init__:
    owned by B3459, which calls these signed request helpers.
  - >-
    The complete transformation.py file:
    B049 owns the vector store provider implementations; B3458 reimplements s3_vectors_ingest_target and s3_vectors_ingest_embedding_options logic.
pitfalls:
  - "SigV4 signing requires exact body hash: hashlib.sha256 on UTF-8 encoded JSON body, or on empty bytes for requests without a body. The x-amz-content-sha256 header must carry the hex digest."
  - "The service name in SigV4Auth must be 's3vectors' (not 's3' or 'vectors'), and the region must match aws_region_name resolved from configuration."
  - "GetVectorBucket, CreateVectorBucket, GetIndex, CreateIndex and PutVectors all use POST method, despite their names suggesting otherwise."
  - "CreateVectorBucket and CreateIndex both return 409 on ConflictException (resource already exists) and must be treated as successful creation, not an error."
  - "s3_vectors_ingest_target and s3_vectors_ingest_embedding_options are called during initialization (B3459), not by these signed request methods. These helpers receive bucket and index already resolved."
  - "The split_s3_vectors_store_id helper validates that both bucket and index parts are non-empty strings."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 2
