id: B3458
title: S3 Vectors signed ingestion operations
description: >-
  Build four reusable signed S3 Vectors request methods that receive resolved state (bucket name,
  index name, AWS region, credentials, and an HTTP client) and execute against AWS S3 Vectors APIs.
  These helpers are called by B3459's ingestion workflow, never by application code directly.

  `_sign_and_execute_request` (lines 191-264) takes method (PUT, POST, or GET), URL, optional JSON
  body and optional headers. It hashes the body with SHA256 (or empty bytes for no body), sets
  x-amz-content-sha256 header to the hex digest, acquires AWS credentials from vector_store_config
  using BaseAWSLLM's get_credentials (aws_access_key_id, aws_secret_access_key, aws_session_token,
  aws_session_name, aws_profile_name, aws_role_name, aws_web_identity_token, aws_sts_endpoint,
  aws_external_id), signs with SigV4 for service 's3vectors' and the resolved aws_region_name, and
  executes the request through the injected async_httpx_client. Returns the response object.

  `_ensure_vector_bucket_exists` (lines 266-314) calls GetVectorBucket API. On any error response,
  calls CreateVectorBucket API. Returns on 200, 201 or 409 (already exists); otherwise raises error.

  `_ensure_vector_index_exists` (lines 316-365) calls GetIndex API. On any error response, calls
  CreateIndex API with dimension, distance_metric and non_filterable_metadata_keys. Dimension comes
  from vector_store_config or defaults to S3_VECTORS_DEFAULT_DIMENSION=1024; distance_metric defaults
  to S3_VECTORS_DEFAULT_DISTANCE_METRIC; non_filterable_metadata_keys defaults to
  S3_VECTORS_DEFAULT_NON_FILTERABLE_METADATA_KEYS. Returns on 200, 201 or 409 (already exists).

  `_put_vectors` (lines 367-397) calls PutVectors API with a sequence of vector entries. Each entry
  has key (string), data (float32 embedding list), and metadata (string mapping). Succeeds on 200
  or 201; otherwise raises error.

  All endpoints use https://s3vectors.{aws_region_name}.api.aws/{OperationName} and SigV4 service
  name 's3vectors'. Preserve exact field names (vectorBucketName, indexName, distanceMetric,
  dataType: "float32") and get-error-to-create fallback pattern for bucket and index checks.
  Treat 409 responses as successful resource creation (already exists).

  Helper functions s3_vectors_ingest_target and s3_vectors_ingest_embedding_options (from
  transformation.py) are built in B3459, which calls them during initialization. s3_vectors_ingest_target
  splits vector_store_id as "bucket_name:index_name" when present, uses vector_bucket_name as
  fallback for the bucket part, and raises ValueError(S3_VECTORS_STORE_ID_ERROR) when neither is
  provided. s3_vectors_ingest_embedding_options returns {model: value} when vector_store_config
  contains litellm_embedding_model or embedding_model, overriding the input embedding config.
