id: B193
title: Pinned model catalog and exact prices
description: >-
  Assemble B204-B205's typed fields into an immutable model catalog in betterlite-models. Copy the pinned root map
  and packaged backup byte-for-byte under fixtures and embed the packaged backup for offline startup; fixture data
  is exempt from the diff budget, Rust implementations are not. Parse all actual entries with explicit special-entry
  handling, bounded bytes/depth/count and duplicate detection, retain generalization declarations for B018, and
  build canonical/alias lookup indexes without overwriting earlier entries. Alias collision decisions must be reported,
  not silently dropped. Expose typed exact lookup and provider/model metadata projections used by B174; do not implement
  pricing formulas. Add model_catalog helper cases against get_model_cost_map's load/finalization helpers plus full-fixture
  parsing tests, and model_catalog fuzz target.  Seed B171's shared helper_case corpus with every added operation
  and replay it through the common typed parser. Bundled-map tests reject unknown fields; runtime remote maps accept
  unknown fields with warnings listing their full paths, per B205. Duplicate keys remain explicit errors. Write
  the behavior rstest functions model_catalog_tests_behavior in adjacent tests.rs files, with a named case
  for each behavior and failure in the DoD; corpus replay tests have separate names. The helper operation model_catalog is already registered; each operation has its
  own Rust and Python adapter file and corpus seed. Budget 280 catalog, 100 adapters, 260 tests and 100 fuzz/replay
  wiring (740 total).


  Also own utils.py _get_bundled_model_cost_map L8418-L8425 (8 nonblank source lines including the cache decorator).
  Load model_prices_and_context_window_backup.json from the packaged asset, cache the parsed result with capacity
  1, and on any asset/read/JSON exception return and cache an empty map without warning. Use the existing production
  catalog decoder and its fuzz corpus; add model_catalog helper case bundled_catalog_read_failure and standalone
  test bundled_map_failure_is_cached. Add 10 production and 25 test/adapter lines to the 740-line budget (775 total).
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-models/Cargo.toml
  - crates/betterlite-models/src/catalog.rs
  - crates/betterlite-models/src/catalog/**
  - crates/betterlite-models/fixtures/**
  - crates/betterlite-models/fuzz/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/models/model_catalog.rs
  - tools/oracle/src/helpers/models/model_catalog/**
  - tools/oracle/helpers/model_catalog.py
  - tools/oracle/helpers/model_catalog/**
  - tools/oracle/cases/helpers/model-catalog/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L64-L105
  why: Packaged catalog loading and raw-byte revision.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L481-L567
  why: Canonical entries, aliases, generalizations and atomic adoption.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/model_prices_and_context_window.json#L1-L140
  why: Pinned root asset.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/model_prices_and_context_window_backup.json#L1-L140
  why: Pinned runtime backup asset.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L8418-L8425
  why: Shared packaged backup loader used by provider raw capability lookup.
dod:
- text: Both raw catalog assets match the pinned checksums and every actual entry parses without unmodeled fields.
  proof:
  - catalog-pins
  - model-catalog-tests
- text: Canonical entries, aliases, conflict reporting and generalization extraction match listed helper cases.
  proof:
  - oracle
  - helper-python
- text: Duplicate JSON keys and excessive input fail explicitly without partial catalog state, and fuzz corpus replay
    covers the parser.
  proof:
  - model-catalog-tests
  - model-catalog-corpus
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
- text: Bundled catalog failures cache an empty map and do not warn.
  proof:
  - bundled-map-failure
  - oracle
  - helper-python
checks:
  optional:
  - mutants
  commands:
  - id: model-catalog-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::model_catalog_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: model-catalog-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-models/fuzz/corpus/model_catalog)"
      && test -f crates/betterlite-models/fuzz/fuzz_targets/model_catalog.rs && test -n "$(ls -A crates/betterlite-models/fuzz/corpus/model_catalog)"
      && cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(replays_the_model_catalog_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: catalog-pins
    why: a bundled catalog file differs from the pinned commit
    run: 'sha256sum --check --quiet <<''SUMS''

      329113e5820834dc2a206500db9ec7861a17c74b86fe79601dec05478c06327e  crates/betterlite-models/fixtures/model_prices_and_context_window.json

      329113e5820834dc2a206500db9ec7861a17c74b86fe79601dec05478c06327e  crates/betterlite-models/fixtures/model_prices_and_context_window_backup.json

      SUMS'
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)"
      && grep -rlq 'model_catalog' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: bundled-map-failure
    why: Bundled fallback retries or propagates a failed asset parse instead of caching an empty map.
    run: cargo nextest run --locked -p betterlite-models --no-tests=fail -E 'test(/::bundled_map_failure_is_cached$/)'
oracle_cases:
- tools/oracle/cases/helpers/model-catalog/packaged-map.yaml
- tools/oracle/cases/helpers/model-catalog/canonical-lookup.yaml
- tools/oracle/cases/helpers/model-catalog/aliases.yaml
- tools/oracle/cases/helpers/model-catalog/alias-canonical-conflict.yaml
- tools/oracle/cases/helpers/model-catalog/alias-alias-conflict.yaml
- tools/oracle/cases/helpers/model-catalog/generalizations-excluded.yaml
deviations:
- what: Duplicate JSON keys are explicit load errors; runtime unknown fields are accepted with path-naming warnings.
  why: Preserve duplicate evidence while allowing forward-compatible remote catalogs under the architect decision.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L85-L88
out_of_scope:
- Refresh, provenance and override layering are B194.
- Cost arithmetic and budget decisions are B068-B069.
pitfalls:
- 'The oracle helper for this task is pre-registered as model_catalog in the models group. Replace the stub Op in tools/oracle/src/helpers/models/model_catalog.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/model_catalog.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The pinned map has no alias entries, so synthetic alias fixtures are necessary to cover alias logic.
- Count actual model entries separately from metadata sentinels.
- Root and packaged price assets happen to match at this pin; do not assume that for provider capability assets.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
