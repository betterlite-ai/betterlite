id: B10220
title: Core's ClientKind and SuppliedClient move onto the betterlite-http home and the oracle's sdk_http Mode copies go
description: >-
  After B10216 and B10217 every core, provider, bedrock and vertex family takes `ClientKind` and `SuppliedClient<'client, Client>` from crates/betterlite-core/src/api/vector_store_http_write/service.rs, while B10221 puts the same pair, for the crates below core, in crates/betterlite-http/src/client_kind.rs. Two homes for one type is still a copy. This task deletes core's pair, moves the hand-written `impl<Client> Clone for SuppliedClient<'_, Client>` and `impl<Client> Copy for SuppliedClient<'_, Client> {}` that B10216 adds to core onto the betterlite-http home, and points every user at `betterlite_http::client_kind`. Every crate involved and every oracle helper group already depends on betterlite-http, so no Cargo.toml changes and no new crate edge. It is a refactor: what each family sends, logs, raises and reports stays the same.


  The users. On main, 149 files import core's ClientKind or SuppliedClient: core's vector_store, vector_file, file, decisions_send, eval_http, genai, genai_http, search_http and video families, provider's transcription_http and watsonx_transcription, and the oracle's sdk_http transports. B10216 adds about 90 more (its twelve families and their users) and B10217 64 (bedrock, vertex, soniox, bfl and their oracle helpers), so about 300 files, half of them tests. Each one swaps its `crate::api::vector_store_http_write::service::` or `betterlite_core::api::vector_store_http_write::service::` import of ClientKind and SuppliedClient for `betterlite_http::client_kind::`, and keeps importing the rest (WriteRequest, WriteTransport, ClientSource, Operation) from core. Inside vector_store_http_write itself, service.rs and error.rs import the pair from betterlite_http too. vertex's gemini_http/call.rs keeps its own `SuppliedClient` (an owned `Arc<dyn GeminiPost>`), so it imports only ClientKind. The variant is already Asynchronous everywhere, so no rename. The scope lists each file and B10216's and B10217's module globs, since their workers decide the exact files that end up importing core's pair.


  The oracle's wire copies. Seventeen enums read the case's "sync" or "async" only to turn it into one of these classes, and the home's serde names now read the same strings. `Mode { Sync, #[serde(rename = "async")] Asynchronous }` with a `client_kind` converter: tools/oracle/src/sdk_http/file_create_list_transport.rs L26-L39, file_http_metadata.rs L27-L40, image_generation_http.rs L20-L33, responses_compact_transport.rs L19-L32 (responses_create_transport.rs L78-L85 converts it again in `Call::client_kind`), responses_read_transport.rs L27-L40, responses_write_transport.rs L25-L38, speech_http.rs L19-L32, store_create_read_transport.rs L30-L43, vector_file_read_transport.rs L43-L56, vector_file_write_transport.rs L26-L39, vector_search_transport.rs L18-L31 and vector_store_transport.rs L26-L39. The same enum converted in a submodule: file_http_upload.rs `RunMode` L18-L22, image_edit_call.rs `Client` L61-L65 and image_edit_http.rs `Mode` L18-L22, each matched in its native.rs. And two helpers: bedrock's other_rerank/input.rs `Supplied` L28-L31, matched in other_rerank/driver.rs L180-L183, and core_ops' soniox_pipeline/perform.rs `Mode` L31-L34 with its `client_kind` fn L102-L107. Each field that holds one takes `ClientKind` itself, every converter and match goes, and soniox's `atranscription: matches!(mode, Mode::Async)` reads `mode == ClientKind::Asynchronous`. The line numbers are main's; B10216 and B10217 rewrite these converters' right-hand sides to the core pair first, so find each by name.


  Not merged. The other sdk_http `Mode` enums (assistant_messages, assistant_threads, responses_compact, responses_chat_call, responses_lifecycle_write, rerank_http, transcription_call, transcription_http, vector_file_create_list, vector_file_read, vector_file_write, vector_store_read, vector_store_write, chat_response_stream's ChatRunMode, image_generation_plan's SyncMode and assistant_create's Entry) pick which LiteLLM call the case drives or set an `is_async` flag; they never become a client class, so they are the entry point concept and stay.


  Tests. No new test: the families' tests already pick a supplied client by class and rebuild the other class, and they pass with only the import changed.


  What users see: nothing.
