out_of_scope:
  - "B10221: the betterlite-http home itself, its serde names and label, and the openai, anthropic and foundry copies below core."
  - "The sdk_http Mode enums that pick a LiteLLM entry point or an `is_async` flag rather than a client class (assistant_messages, assistant_threads, responses_compact, responses_chat_call, responses_lifecycle_write, rerank_http, transcription_call, transcription_http, vector_file_create_list, vector_file_read, vector_file_write, vector_store_read, vector_store_write, ChatRunMode, SyncMode, Entry)."
  - "vertex gemini_http's own SuppliedClient with an owned `Arc<dyn GeminiPost>`, and gemma_call's four-way SuppliedClientKind."
  - "WriteRequest, WriteTransport, ClientSource, Operation and the ProxiedClient adapter, which stay in core's vector_store_http_write::service."
pitfalls:
  - "Core's service.rs keeps WriteRequest, WriteTransport, ClientSource and Operation, so an import like `use crate::api::vector_store_http_write::service::{ClientKind, ClientSource, WriteRequest};` splits in two: the pair from betterlite_http, the rest from core. Do not move the rest."
  - "B10216's realtime_http_calls copies a SuppliedClient out of a borrow, so the Clone and Copy impls must land on the home in the same change that deletes core's struct, or that call stops compiling with E0507."
  - "vertex gemini_http/call.rs declares a struct named SuppliedClient, so it imports only ClientKind from the home."
  - "The sdk_http Mode enums derive Serialize too; the home's serde names are the same \"sync\" and \"async\", so anything that writes the mode back writes the same text. Keep `#[serde(deny_unknown_fields)]` on the structs that hold the field."
  - "Do not leave a `pub use betterlite_http::client_kind::...` in core for old paths; every user imports betterlite_http directly."
review_level: standard
budget:
  max_changed_lines: 1000
  max_new_expects: 0
