dod:
  - text: betterlite-core declares no ClientKind or SuppliedClient of its own, nothing imports them from vector_store_http_write::service, and betterlite-http's SuppliedClient carries the Clone and Copy impls core's had.
    proof: [core-kind-moved]
  - text: The oracle's sdk_http transports and the bedrock rerank and soniox helpers read the supplied client's class straight into the home ClientKind, with no Mode enum or converter of their own.
    proof: [core-kind-wire-copies]
  - text: The families' tests in core, provider, bedrock, vertex and python pass with only the import changed.
    proof: [core-http-kind-tests, provider-http-kind-tests, bedrock-http-kind-tests, vertex-http-kind-tests, python-http-kind-tests]
checks:
  optional: []
  commands:
    - id: core-kind-moved
      why: core still declares or exports its own client class, or the home lost the Copy a borrowed supplied client needs
      run: |-
        test -z "$(grep -nE '^pub (enum ClientKind|struct SuppliedClient)\b' crates/betterlite-core/src/api/vector_store_http_write/service.rs)" &&
        test -z "$(grep -rnE 'vector_store_http_write::service::(ClientKind|SuppliedClient)\b' crates tools --include=*.rs)" &&
        grep -qF "impl<Client> Clone for SuppliedClient<'_, Client> {" crates/betterlite-http/src/client_kind.rs &&
        grep -qxF "impl<Client> Copy for SuppliedClient<'_, Client> {}" crates/betterlite-http/src/client_kind.rs
    - id: core-kind-wire-copies
      why: an oracle helper still reads the class into a Mode enum of its own and converts it
      run: |-
