id: B8102
title: LangGraph chat request and response mapping
description: >-
  Build the non-streaming half of the LangGraph provider, model langgraph/{assistant_id}, in the module langgraph_chat of
  betterlite-provider. It covers litellm/types/llms/langgraph.py (typed records) and in litellm/llms/langgraph/chat/transformation.py
  everything except the streaming wrappers: LangGraphError, provider info, params, URL, assistant id, message conversion,
  transform_request, content extraction, transform_response, validate_environment, get_error_class, supports_stream_param_in_request_body
  and should_fake_stream. B8103 owns the streaming methods and builds on the error type defined here.


  Records. Define typed records for LangGraphMessage (role human, assistant or system; content), LangGraphInput (messages),
  LangGraphRequest (assistant_id, input, stream_mode, config, metadata), LangGraphStreamEvent, LangGraphResponseMessage (type,
  content, id, name), LangGraphResponse (messages, values) and LangGraphParsedResponse (content, role, usage). Only the request
  and response records are used by code; the stream event and parsed response records have no caller at the pin, so define them
  without behavior. The Python types file is also listed in B7929's covers (the Python typing task); this task owns the Rust records.


  Connection settings. Provider info returns api_base = explicit, else LANGGRAPH_API_BASE, else http://localhost:2024, and api_key =
  explicit, else LANGGRAPH_API_KEY. Supported OpenAI params are only stream and mapping returns the options unchanged. get_complete_url
  fails with "api_base is required for LangGraph. Set it via LANGGRAPH_API_BASE env var or api_base parameter." when api_base is None,
  strips trailing slashes and returns {api_base}/runs/stream when stream is truthy, else {api_base}/runs/wait. validate_environment
  sets Content-Type application/json and Authorization "Bearer <key>" when a key exists. supports_stream_param_in_request_body is
  false. should_fake_stream is always false.


  Request. Assistant id: optional_params assistant_id when truthy, else the text after the first "/" in the model, else the whole
  model. Message conversion: role user and any unknown role become human, assistant and system stay; list content goes through the
  shared content-to-text helper; any other non-string content is turned into its string form; a non-empty metadata object on a message
  is copied to the converted message. transform_request builds {assistant_id, input: {messages}}. It reads the stream flag from
  litellm_params stream (not optional_params). When streaming it adds stream_mode = optional_params stream_mode, default
  messages-tuple. It then copies config, metadata and thread_id from optional_params when the key is present (even with a null value).
  Note thread_id lands at the top level of the body.


  Response. transform_response runs inside one guard: any failure inside it (including bad JSON) raises LangGraphError with the HTTP
  status and "Error processing response: <error>". Content extraction: from the top-level messages list, walking from the end, the
  first dict whose type is ai or whose role is assistant gives its content (default empty string); otherwise from values.messages,
  walking from the end, the first dict with type ai; otherwise log a warning "Could not extract content from LangGraph response,
  returning raw" and use the JSON text of the whole body (Python json.dumps default separators). The reply is one stop choice, role
  assistant, model set to the requested model. Usage uses B196's token counter with the gpt-3.5-turbo encoding for the messages and for
  the reply text; a failure logs "Failed to calculate token usage: <error>" and leaves usage unset. get_error_class returns
  LangGraphError with status and message. The dispatch in main.py (_complete_langgraph) is B050's.
