deviations:
  - what: Usage uses betterlite's tokenizer (B196), so token counts match LiteLLM only where B196 does.
    why: LiteLLM calls its own token_counter, which B196 owns.
out_of_scope:
  - "llms/langgraph/chat/transformation.py get_streaming_response, get_sync_custom_stream_wrapper, get_async_custom_stream_wrapper and has_custom_stream_wrapper (L267-L403) belong to B8103."
  - "llms/langgraph/chat/sse_iterator.py belongs to B8103."
  - "main.py _complete_langgraph and the langgraph arm of the dispatch belong to B050."
  - "llms/langgraph/__init__.py and llms/langgraph/chat/__init__.py hold only re-exports."
pitfalls:
  - transform_request reads the stream flag from litellm_params, so a stream option set only in optional_params gets the /runs/stream URL but no stream_mode.
  - config, metadata and thread_id are copied on key presence, so a null value is sent as null.
  - The messages walk accepts type ai OR role assistant, but the values.messages walk accepts type ai only.
  - A matched message with no content gives an empty string and stops the search; it does not fall through to values.
  - Content that is not a string and not a list (a number) is stringified, and a content that is a list of blocks goes through the shared flattening helper.
  - The one guard in transform_response also catches the extraction step, so the error text always starts with "Error processing response:".
  - The raw fallback is the compact-with-spaces Python json.dumps text, not a re-serialization with different separators.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
