dod:
  - text: Provider info, the run URL and the headers follow the defaults and env vars for the stream and wait endpoints.
    proof: [langgraph-chat-tests, oracle]
  - text: The assistant id comes from optional_params first, then the model suffix, then the whole model.
    proof: [langgraph-chat-tests, oracle]
  - text: Messages convert to human, assistant and system roles with list content flattened and metadata kept.
    proof: [langgraph-chat-tests, oracle]
  - text: stream_mode is added only when litellm_params stream is true, and config, metadata and thread_id are copied when present.
    proof: [langgraph-chat-tests, oracle]
  - text: Reply text comes from messages, then values.messages, then the raw JSON fallback.
    proof: [langgraph-chat-tests, oracle]
  - text: Any failure while building the reply raises the wrapped LangGraphError with the HTTP status.
    proof: [langgraph-chat-tests, oracle]
checks:
  optional: []
  commands:
    - id: langgraph-chat-tests
      why: the langgraph_chat behavior tests are missing or fail
      run: cargo nextest run --locked -p betterlite-provider --no-tests=fail -E 'test(/^langgraph_chat::/)'
