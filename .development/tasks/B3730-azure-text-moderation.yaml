id: B3730
title: Azure text moderation thresholds and hooks
description: >-
  Build text moderation chunk submission and category/global/default severity evaluation,
  plus native request, response and per-chunk stream hooks. Keep the pinned truthiness
  behavior for an explicit zero threshold and the distinction between absent and empty
  category maps.

  Implement three hooks: pre_call scans prompts from chat or Responses API inputs,
  post_call_success scans response content extracted from ModelResponse choices,
  and post_call_streaming scans each chunk during streaming. Chunk submission
  iterates text chunks through async_make_request (already split by base.split_text_by_words
  at 10,000-character boundaries), checks severity thresholds, and raises HTTPException
  to block on violation.

  Severity evaluation checks thresholds in order: category-specific thresholds if
  severity_threshold_by_category is set, global severity_threshold if set, or
  default_severity_threshold (2) if neither is set. The truthiness check `if
  severity_threshold is None` correctly distinguishes absent threshold (None) from
  an explicit zero threshold (0); keep this distinction to respect zero as a valid
  input. Category maps can be absent (None) or empty ({}); honor both cases.

  Stream violations emit `data: {"error": <exception detail>}\n\n` rather than
  raising from the per-chunk hook, allowing caller-managed streaming to emit or
  suppress the error frame.

  Direct dependency: B3728 for AzureGuardrailBase.__init__, _post_to_content_safety,
  split_text_by_words, get_user_prompt_from_request and shared AzureContentSafetyConfigModel.

