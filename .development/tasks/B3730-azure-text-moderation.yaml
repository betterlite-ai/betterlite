deviations:
  - what: >-
      Default severity threshold is 2 (LiteLLM modern framework default), distinct from
      legacy Azure SDK hook default of 4.
    why: >-
      B3728 owns the legacy hook with its own default of 4. B3730 uses the modern
      framework default of 2 to match the LiteLLM pinned behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/azure/text_moderation.py#L46

out_of_scope:
  - >-
    Guardrail framework contract (CustomGuardrail.__init__, decorator dispatch, logging):
    owned by B104 (framework).
  - >-
    Base Azure transport (__init__ via super, _post_to_content_safety, split_text_by_words,
    get_user_prompt_from_request, AzureContentSafetyConfigModel): owned by B3728 (base).
  - >-
    Text content type checking (is_text_content_call_type) and message text iteration
    (iter_message_text): owned by U1.
  - "Standard guardrail logging (log_guardrail_information): owned by U1/U3."
  - "Response/choice wire format constructors (Choices, ModelResponse): sourced from litellm imports."

pitfalls:
  - >-
    The truthiness check `if severity_threshold is None` vs `if severity_threshold is not None`
    correctly distinguishes an absent threshold (None) from an explicit zero threshold (0).
    Respect zero as a valid input that blocks all content.
  - >-
    severity_threshold_by_category can be None (not set) or {} (set to empty dict). Check
    `if self.severity_threshold_by_category:` to skip it when None or empty; only iterate
    categories if the dict is non-empty.
  - >-
    check_severity_threshold evaluates thresholds in strict order: category-specific first
    (if set), then global (if set), then default. Early raise stops the check.
  - >-
    async_make_request must check severity on every chunk, not just the last one, to catch
    violations that appear only in earlier chunks.
  - >-
    The streaming hook catches HTTPException and returns a JSON error frame; it does not
    re-raise or let other exceptions escape the function.
  - >-
    _message_content_to_text extracts strings from content blocks in a list; empty blocks,
    missing text fields and non-dict items are skipped.
  - >-
    async_post_call_success_hook iterates only ModelResponse instances (not all LLMResponseTypes);
    skip other response types without error.

