deviations:
  - what: An entry that sets optional_params.unreachable_fallback logs a warning that the nested key is ignored. LiteLLM ignores it without a word.
    why: The UI config model offers the nested key, so an operator can believe the guardrail fails open while it fails closed; the warning says so and the fallback stays LiteLLM's.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/deepkeep/__init__.py#L11-L27
  - what: An os.environ/ reference in timeout or unreachable_fallback that names an unset variable fails the load with MissingEnvironment. LiteLLM turns it into None, so the timeout takes its default and the fallback fails validation and the proxy starts without the guardrail.
    why: Every betterlite field resolves references through the same resolve_string rule, so a mistyped variable can't quietly switch off or weaken a security guardrail.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5782-L5787
out_of_scope:
  - "When a guardrail leaves timeout unset, LiteLLM's cached client uses litellm_settings.request_timeout, then REQUEST_TIMEOUT, then 600 seconds, with a 5 second connect timeout (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L164-L175). That default is a shared gap for every guardrail client, and the loader already parses litellm_settings.request_timeout into LiteLlmSettings.request_timeout, so DeepKeep keeps its fixed 600 second default here."
  - Padded one-line functions in these files belong to B5094, and this task does not touch .ast-grep/rules/.
  - The fixed status per error class (B5102) and the helper statuses in deepkeep_failure (B5103) are merged and stay as they are.
  - DeepKeepGuardrailConfigModel in sections/guardrail_identity/config_models.rs (B3660) has no optional_params.unreachable_fallback; that UI vocabulary is not this task's file.
  - An invalid deepkeep entry still fails the whole load, where init_guardrails_v2 skips the guardrail with an error log. That holds for every guardrail section and is not changed here.
  - No route reaches DeepKeep yet, so there are no HTTP cases and no server wiring.
pitfalls:
  - The DeepKeep Raw view deserializes every guardrails entry, so Parameters must hold timeout, unreachable_fallback and extra_headers as raw values and validate them only in Entry::resolve for guardrail deepkeep.
  - Hold the raw extra_headers as an untagged list of strings or anything else (serde::de::IgnoredAny), so Raw keeps no header values; for a deepkeep entry an absent or null value is fine, a list warns, and anything else is the load error naming extra_headers.
  - timeout still takes a YAML bool (true is one second, the boolean case of deepkeep_config_accepts_timeout_seconds), and RawNumber::Boolean is an InvalidScalar error in crate::resolve, so keep the untagged Seconds shape instead of switching to RawNumber.
  - ConfigError has no variant for an out-of-range value or a wrong shape and loader.rs is out of scope, so turn a TimeoutError, a FallbackError or the extra_headers error into ConfigError::Yaml through <serde_saphyr::Error as serde::de::Error>::custom; the message must keep naming the field, since deepkeep_config_rejects_invalid_parameters checks error.to_string().contains(field).
  - Only optional_params.unreachable_fallback is declared; any other key under optional_params stays an unsupported-key error, and the nested value never changes the fallback.
  - With the header loop gone, DeepKeepError::InvalidHeader is built only for X-API-Key; deepkeep_failure in tools/oracle/src/helpers/guardrails/b3767.rs and the recover_from_failure match in deepkeep.rs both name InvalidHeaderName and lose that arm.
  - apply moves the RequestContext into build_request, so copy input_type, litellm_call_id and litellm_trace_id out first for the fail-open line.
  - Never log a DeepKeepError's Display, because Api carries the response body; deepkeep_guardrail_fail_open_never_logs_upstream_response_body must stay green.
  - deepkeep.rs is at 270 of the 300 lines a source file may have, so the new log lines go in a child module under deepkeep/.
  - The BLOCKED warning logs the reason transport.rs has already redacted, not the raw response.
  - Config log tests capture output the way grayswan/tests.rs does, with tracing::subscriber::with_default and a NamedTempFile writer.
  - The Python construct reads deepkeep.unreachable_fallback after initialize_guardrail, not the parameters, so the getattr default in __init__.py applies.
  - The Rust apply keeps the mock's base_url as host and only swaps the hand-written path for normalize_endpoint(&base).
