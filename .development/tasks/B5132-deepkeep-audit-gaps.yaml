      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- crates/betterlite-guardrails/src/deepkeep/tests.rs)" && cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^deepkeep::/) - test(deepkeep_guardrail_replays_the_deepkeep_response_corpus)'
    - id: helper-python
