  optional: []
  commands:
    - id: agent-execution-tests
      why: tests for agent execution, preparation and catalog sync fail or do not exist
      run: cargo nextest run --locked -p betterlite-management-cli --no-tests=fail -E 'test(/^agent_run::tests::/)'
