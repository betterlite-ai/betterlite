deviations:
  - what: The betterlite management CLI runs as a Rust native binary, not a Python process.
    why: betterlite is a Rust gateway; the CLI must remain compatible as a native executable, not depend on Python.
  - what: process::replace (or the native equivalent) is called only for the agent binary, never for a proxy process or fallback.
    why: The betterlite proxy runs out-of-process as a managed child; the CLI does not launch or manage a local gateway.
out_of_scope:
  - The banner shown when starting the gateway, and the gateway startup contract. B121 owns the banner; the native launcher replaces the Python invocation with a concrete executable/startup contract.
  - The HTTPClient for fetching models. B169 (or its leaf) owns the client; this task injects it as an injected requests.get dependency.
  - Storage of credentials and token refresh. B135 (or its leaf) owns token storage; this task injects it as secrets read through context_secret_vault.
pitfalls:
  - _PREPARERS maps binary name (e.g. "codex", "pi") to a preparer function, placed above both prepare_codex and prepare_pi so neither sees the other.
  - _codex_debug_models must call _windows_command to quote the binary and args for cmd.exe on Windows; the result goes through subprocess.run exactly.
  - The 10-second timeout on `codex debug models` is CODEX_DEBUG_TIMEOUT_SECONDS; Codex 0.130.0+ prints JSON to stdout; earlier versions have no such command.
  - catalog read-back calls `codex debug models` a second time with the -c override already in place; a failure skips Codex sync but does not raise.
  - ModelSyncSkipped.reason becomes a warn() message to the user, not an exception. Best-effort means launch anyway.
  - run_agent replaces the process and never returns on success; reattach_terminal is the last thing before _hand_off.
review_level: security
budget:
  max_changed_lines: 1000
  max_new_expects: 0
