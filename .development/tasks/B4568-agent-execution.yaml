id: B4568
title: Agent preparation, catalog validation and execution
description: >-
  Build the Codex catalog fetch/write/read-back sequence, stop-hook preparation, and the common launch pipeline.
  Preserve best-effort model sync: when fetch, write or read-back fails, log a skip reason and launch anyway with the agent's built-in models.
  User arguments win over sync arguments (sync args come before the user's command).
  A rejected catalog stays on disk under ~/.codex/litellm-models.json for debugging.
  pi gets a separate prepare_pi call even when --skip-verify is passed.

  Build prepare_codex, which either installs a routed Stop hook or warns if the Codex config already names one.
  Call install_statusline_script from B4562 to get the command path; a ClaudeSettingsError becomes AgentRunError.
  Warn and return an empty tuple if codex_declares_stop_hooks returns true.

  Build codex_model_catalog_path to find ~/.codex/litellm-models.json or $CODEX_HOME/litellm-models.json.
  Build _replace_file to write the catalog atomically through a temp file in the same directory.

  Build _codex_debug_models, _stock_codex_models and codex_model_sync_args to fetch the proxy's model list, sync it to a file Codex reads, and hand back -c model_catalog_json=... or a skip reason.
  The command `codex debug models` lists what Codex would launch with (its built-in models plus any catalog override).
  On Windows, quote the command for cmd.exe.
  Timeout the debug call at 10 seconds; a timeout or non-zero exit becomes ModelSyncSkipped.
  Codex releases before 0.130.0 have no debug command; report that the same way.

  Build agent_model_sync_env to dispatch between OpenCode (returns env) and Codex (returns args) and handle --skip-verify by returning a skip reason instead of calling the network.

  Build run_agent to compose everything: verify the proxy key unless --skip-verify, sync models, prepare hooks, build environment, hand off to the agent.
  On success this function never returns (the process is replaced).
  Raise AgentRunError for missing binary, unreachable proxy, rejected key, or a failed preflight sync.
  Warnings for skipped model sync do not block launch.
  Inject reattach_terminal to restore the controlling terminal if it was lost; call it before handoff.

  Codex catalog writes include the proxy's model_list as fetched from /v1/models, merged with stock Codex models from `codex debug models`, and completed with fallback metadata for unknown models from the asset passed to B4567.
  The returned JSON file name is litellm-models.json (Codex expects exactly that).
  A failed read-back (the second `codex debug models` call) skips Codex sync; OpenCode listing never reads back (it is pure env).
