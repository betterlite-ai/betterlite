dod:
  - text: prepare_codex calls install_statusline_script and wraps ClaudeSettingsError as AgentRunError, warns if codex_declares_stop_hooks is true, and returns -c hooks.Stop=... flags or empty tuple.
    proof: [agent-execution-tests]
  - text: codex_model_catalog_path resolves CODEX_HOME env var or defaults to ~/.codex, returns the litellm-models.json path.
    proof: [agent-execution-tests]
  - text: _replace_file writes a file atomically through a temp file in the same directory and cleans up the temp file on OSError.
    proof: [agent-execution-tests]
  - text: _codex_debug_models calls codex with (binary, *args, "debug", "models"), quotes for Windows, times out at CODEX_DEBUG_TIMEOUT_SECONDS, and returns stdout on success or ModelSyncSkipped with the error/stderr.
    proof: [agent-execution-tests]
  - text: _stock_codex_models parses the JSON catalog from `codex debug models` or returns ModelSyncSkipped with a validation error message.
    proof: [agent-execution-tests]
  - text: codex_model_sync_args fetches the proxy's models, reads the instructions asset, merges stock models with proxy models, writes the catalog atomically, reads it back, and returns -c model_catalog_json=... or a skip reason.
    proof: [agent-execution-tests]
  - text: agent_model_sync_env dispatches by agent binary name (codex vs opencode), handles --skip-verify by returning skip reason, and returns ModelSyncResult.
    proof: [agent-execution-tests]
  - text: run_agent verifies the proxy key before syncing models (unless --skip-verify), prepares hooks, composes environment and args, and calls launcher without returning.
    proof: [agent-execution-tests, oracle]
  - text: run_agent handles ModelSyncSkipped by warning and continuing, places sync args before user args, and calls _hand_off with the final command list and environment.
    proof: [agent-execution-tests, oracle]
  - text: run_agent raises AgentRunError for missing binary, missing docs links, unreachable proxy, rejected key, and wraps AgentRunError from preparers.
    proof: [agent-execution-tests]
  - text: run_agent calls reattach_terminal if provided, just before handoff.
    proof: [agent-execution-tests]
  - text: Every oracle case passes with the same agent behavior, environment setup and model catalog sync that LiteLLM shows.
    proof: [oracle]
