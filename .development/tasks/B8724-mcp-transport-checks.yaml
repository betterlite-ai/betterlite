id: B8724
title: MCP transport request checks and routing peeks
description: >-
  The skeleton already declares this task's fuzz [[bin]] with an empty target file; fill that target and add the crate dependency it needs, without a second [[bin]] entry.


  Before an MCP request reaches a transport, server.py runs a set of small checks and readers over the raw request: the Origin check, the protocol version check, the client application allowlist, the server names in the path, the caller fingerprint that binds a session, and peeks into the first bytes of the body. They are pure functions over headers, paths and bytes, so they get helper oracle cases. Code goes in betterlite-server, module mcp::transport_checks (crates/betterlite-server/src/mcp/transport_checks.rs) with the submodules gates, routing and peek, each with a tests.rs. Headers come in as http::HeaderMap; a lookup by name is case insensitive and takes the first value unless a step says all values.


  gates.

  1. reject_disallowed_origin(origins: &[String], headers) -> Result<(), McpHttpError> is reject_disallowed_mcp_origin. origins is the CORS list B8591's cors_config builds from LITELLM_CORS_ORIGINS (["*"] when unset). When "*" is not in it and any Origin header value (all of them) is not in it, fail with 403 and detail "Invalid Origin header".

  2. unsupported_protocol_version(headers, configured: &[String]) -> Option<String>: every mcp-protocol-version value decoded as Latin-1 and trimmed; the first non-empty value outside configured is returned. version_refusal(value, configured) is the 400 body LiteLLM sends: {"jsonrpc": "2.0", "id": null, "error": {"code": -32600, "message": "Unsupported MCP-Protocol-Version <value>; supported: <configured joined by \", \">"}}. B8727 passes B8190's configured_versions().

  3. proxy_error_to_http(code: Option<&str>, message, headers) -> McpHttpError is _proxy_exception_to_http_exception: status is the code parsed as an integer after trimming, else 500; detail is the message; headers are kept, and an empty map counts as none.

  4. The client allowlist. allowlist_from_settings(general_settings) -> Option<McpClientAllowlist> calls B8191's load_mcp_client_allowlist on the general_settings snapshot it is given; it is LiteLLM's _load_mcp_client_allowlist, which re-reads general_settings on every request, so the caller passes the current snapshot each time. jwt_client_field_set(general_settings) -> bool is true when that allowlist exists and its jwt_field is set; B8621 fills B4666's jwt_client_field_set from it. reject_disallowed_client(allowlist: Option<&McpClientAllowlist>, headers, auth: Option<&UserAPIKeyAuth>) -> Result<(), McpHttpError> is reject_disallowed_mcp_client: an auth that B4672's is_ui_session_credential accepts passes untouched; otherwise B8191's check_mcp_client_allowed with the auth's jwt_claims (None without auth) and the headers; a rejection logs the warning "Rejected MCP request from a disallowed client application: {details}" and fails with 403 whose detail is the rejection's response body object {"error": "Forbidden", "details": ...}.

  McpHttpError { status: u16, detail: serde_json::Value, headers: Vec<(String, String)> } is the error every check returns; B8727 renders it.


  routing.

  5. servers_in_path(path) -> Option<Vec<String>> is _get_mcp_servers_in_path, all branches: "/mcp/sse" and "/mcp/sse/messages" (trailing slashes ignored) give None; when the first two non-empty segments are X and "mcp" with X not "mcp", Some([X]); otherwise a match of ^/mcp/([^?#]+) where the captured text holds a comma: strip a trailing path that matches /([^/,]+(/[^/,]+)*)$ and split the rest on commas, trimmed, empties dropped; without a comma the name is the first one or two segments (^([^/]+(/[^/]+)?)); no match gives None. B4654's extract_target_server_names_from_path is not a replacement: it turns None into an empty list, and here None means "use the x-mcp-servers header" while Some(empty) overrides it.

  6. session_id_header(headers) -> Option<String> is _get_session_id_from_scope (first mcp-session-id).

  7. owner_fingerprint(auth: Option<&UserAPIKeyAuth>, oauth2_headers: Option<&BTreeMap<String, String>>, client_ip: Option<&str>) -> String is _owner_fingerprint_for, first match wins: a non-empty api_key gives "key:" plus the lowercase SHA-256 hex of its UTF-8 bytes; a non-empty user_id gives "user:" plus its hash; a non-empty oauth2 "Authorization" (else "authorization") gives "oauth:" plus its hash; a non-empty client ip gives "ip:" plus its hash; else "anonymous".

  8. authorization_header(headers) is the first Authorization value decoded as Latin-1. forwarded_authorization(headers) is _get_forwarded_auth_from_scope: that value only when an x-litellm-api-key header is present, else None.


  peek.

  9. PEEK_LIMIT is 4096 (_MCP_ROUTING_PEEK_MAX_BYTES). peek_routing_body(body: axum::body::Body) -> (Body, Bytes) is _read_request_body_for_routing: read frames until the body ends or PEEK_LIMIT bytes have been kept, keep at most PEEK_LIMIT bytes for sniffing, and return a body that replays every frame read so far followed by the rest of the original stream, so a large body is never buffered whole.

  10. is_initialize_request(bytes) is _is_initialize_request: empty is false, bytes that parse as a JSON object with "method" equal to "initialize" are true, anything else is false.

  11. initialize_client_info(bytes) -> Option<ClientInfo> is _extract_initialize_client_info: the bytes must validate as the SDK's InitializeRequest (method "initialize", params with protocolVersion, capabilities and clientInfo with name and version, under their camelCase names); then the clientInfo name and version, else None.

  12. has_top_level_method(text) is _jsonrpc_text_has_top_level_method, ported character for character: a depth aware scan of a possibly truncated envelope that is true only when a key named method is found at the root object's depth.

  13. is_jsonrpc_response(bytes) is the inline test in handle_streamable_http_mcp: when the bytes parse as JSON, true for an object with "jsonrpc" equal to "2.0", an "id" key, no "method" key and a "result" or "error" key; when they do not parse (the peek cut them), true when the lossy UTF-8 text contains "\"jsonrpc\"" and "\"result\"" or "\"error\"" and has_top_level_method is false.

  Fuzz: the cargo-fuzz target mcp_routing_peek in crates/betterlite-server/fuzz feeds arbitrary bytes to is_initialize_request, initialize_client_info and is_jsonrpc_response, and their lossy text to has_top_level_method. Corpus in crates/betterlite-server/fuzz/corpus/mcp_routing_peek, replay test replays_the_mcp_routing_corpus in peek's tests.


  Helper oracle cases (kind: helper, the b8724 operation) in tools/oracle/cases/helpers/mcp-transport-checks/ compare against LiteLLM's server.py functions: servers-in-path (_get_mcp_servers_in_path over the sse paths, the /{server}/mcp form, comma lists with and without a tail, a slash inside a name, "/mcp", "/mcp/" and "/mcp/,,"), owner-fingerprint (_owner_fingerprint_for for each branch and the empty string cases), initialize-detection (_is_initialize_request), client-info (_extract_initialize_client_info with a full, a partial and a broken initialize), top-level-method-scan (_jsonrpc_text_has_top_level_method with nested and truncated envelopes) and forwarded-authorization (_get_forwarded_auth_from_scope with and without x-litellm-api-key).
