  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/client_allowlist.py#L114-L171
    why: load_mcp_client_allowlist and check_mcp_client_allowed, which B8191 builds.
dod:
  - text: The Origin, protocol version, proxy error and client allowlist gates refuse with LiteLLM's status and body, skip the allowlist for a dashboard session, and jwt_client_field_set answers from the allowlist's jwt_field.
    proof: [gates-tests]
  - text: servers_in_path keeps LiteLLM's None and empty list answers apart on every branch.
    proof: [routing-tests, oracle]
  - text: owner_fingerprint picks key, user, oauth, ip or anonymous in LiteLLM's order with its hashes, and forwarded_authorization returns Authorization only next to x-litellm-api-key.
    proof: [routing-tests, oracle]
  - text: peek_routing_body keeps at most 4096 bytes and the returned body replays the whole request; the initialize, client info, top level method and response tests match LiteLLM.
    proof: [peek-tests, oracle]
  - text: Newly added corpus entries for the routing peeks replay without panic.
    proof: [routing-corpus]
checks:
  optional: []
  commands:
    - id: gates-tests
      why: a gate's condition, status or body differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::transport_checks::gates::/)'
    - id: routing-tests
      why: the path servers, the session header, the fingerprint or the Authorization readers differ from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::transport_checks::routing::/)'
    - id: peek-tests
      why: the peek limit, the body replay or a body test differs from LiteLLM
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::transport_checks::peek::/) - test(replays_the_mcp_routing_corpus)'
    - id: routing-corpus
      why: the routing peeks have no adversarial replay cases
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/mcp_routing_peek)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_mcp_routing_corpus)'
oracle_cases:
  - tools/oracle/cases/helpers/mcp-transport-checks/servers-in-path.yaml
  - tools/oracle/cases/helpers/mcp-transport-checks/owner-fingerprint.yaml
  - tools/oracle/cases/helpers/mcp-transport-checks/initialize-detection.yaml
  - tools/oracle/cases/helpers/mcp-transport-checks/client-info.yaml
  - tools/oracle/cases/helpers/mcp-transport-checks/top-level-method-scan.yaml
  - tools/oracle/cases/helpers/mcp-transport-checks/forwarded-authorization.yaml
deviations: []
out_of_scope:
  - "load_mcp_client_allowlist, check_mcp_client_allowed and the rest of client_allowlist.py: B8191. is_ui_session_credential: B4672. configured_versions: B8190. The CORS origin list: B8591."
  - "Where each check runs and how its error is rendered: B8727."
pitfalls:
  - "The Origin check reads every Origin header, so a request with one allowed and one unknown Origin is refused."
  - "\"/mcp/,,\" gives Some of an empty list, which replaces the header servers with nothing; \"/mcp/sse\" gives None, which keeps them."
  - "owner_fingerprint skips empty strings at every step, so an empty api_key falls through to user_id, not to a hash of the empty string."
  - "has_top_level_method must ignore a method key nested in a result object; reading it as top level would take the session lock and deadlock the tool call that waits for this response."
  - "The peek keeps at most 4096 bytes for sniffing but the replayed body must carry every frame it read, including the part past the limit."
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
