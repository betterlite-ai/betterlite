    - tools/oracle/cases/helpers/mcp-transport-checks/**
    - "tools/oracle/fuzz/corpus/helper_case/mcp-transport-checks-*"
    - tools/oracle/helpers/b8724.py
    - tools/oracle/helpers/b8724/**
    - tools/oracle/src/helpers/server/b8724.rs
    - tools/oracle/src/helpers/server/b8724/**
  lint_tables: false
