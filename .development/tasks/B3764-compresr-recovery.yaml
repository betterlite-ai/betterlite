id: B3764
title: Compresr recovery store and retrieval plans
description: >-
  Implement authenticated caller/call-scoped recovery storage, byte and TTL eviction,
  retrieval deduplication and provider-shaped follow-up plans for Compresr's
  compression-recovery feature. A recovery store in the guardrail instance holds
  compressed originals keyed by (caller virtual-key hash, call-id), scoped per-tenant
  for multi-account deployments. Originals are stored in an OrderedDict with per-entry
  TTL (15 minutes) and pruned when the global byte ceiling (_MAX_TOTAL_STORE_BYTES =
  256 MiB) is exceeded. Compression hashes are 24-character SHA-256 prefixes; the hash
  itself is trusted only when paired with a valid (scope, call_id) and not yet expired.

  When the model calls the ``compresr_retrieve`` tool (detected in the agentic loop),
  this task builds provider-shaped follow-up request patches: for Anthropic's messages
  API, a new tool_use block paired with tool_result; for the Responses API, a
  function_call block paired with function_call_output; for standard chat
  completions, an assistant message with tool_calls plus tool-result messages. Only
  retrieve tool calls are echoed; other tool calls are re-planned so the model
  re-executes them against the recovered content. The ``PRE_CALL_EXECUTED_GUARDRAILS_KEY``
  metadata list is trimmed to keep only Compresr's own pre-call marker, allowing input
  guardrails to re-inspect the restored originals without skipping due to prior cache
  hits.

  Retrieval is limited to _MAX_RETRIEVALS_PER_LOOP=8 calls per turn; repeated hashes
  are deduped. A missing, expired, or out-of-scope hash produces a fallback message
  (not a 500) so the model can retry or work around the missing content.
