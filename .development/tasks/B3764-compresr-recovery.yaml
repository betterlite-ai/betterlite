deviations:
  - what: "Hashes are 24-character SHA-256 prefixes, not full 64-character hashes."
    why: >-
      This matches LiteLLM's _content_hash implementation to keep markers compact and readable in logs.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L249-L252"
  - what: >-
      Recovery store uses OrderedDict with (caller hash, call_id) composite keying for per-tenant isolation.
    why: >-
      Multi-account deployments must not allow one tenant to read another's compressed originals; the caller
      scope is derived from UserAPIKeyAuth.api_key (the unforgeable virtual-key hash set by the proxy).
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L343-L370"
  - what: "Missing, expired or out-of-scope hashes produce a fallback message in the tool result, not a 502 error."
    why: >-
      This allows the model to continue and retry or work around the missing content, matching LiteLLM's fail-open philosophy for retrieval.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L678-L689"
  - what: >-
      The agentic loop builds provider-specific message formats; only retrieve tool calls are echoed, other tool calls
      are omitted so the model re-plans them.
    why: >-
      This preserves recovery semantics: the model re-executes other tool calls against the restored content, matching LiteLLM's behavior.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L1072-L1127"
  - what: >-
      PRE_CALL_EXECUTED_GUARDRAILS_KEY metadata is trimmed to keep only Compresr's own marker, not all markers.
    why: >-
      This allows input guardrails to re-inspect the restored content without skipping due to prior cache decisions;
      only Compresr's marker is kept to avoid recompressing the just-retrieved originals.
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L1129-L1151"
out_of_scope:
  - The CompresrGuardrail constructor, configuration, and apply_guardrail compression dispatch (B3765).
  - The compression request call and parameter passthrough (_call_compress); B3763 owns those.
  - The compression results application to messages (_apply_compression_results); B3765 owns that.
  - Tool call extraction from responses beyond the compresr_retrieve filter (get_tool_calls_from_response); B226 owns that.
  - Text extraction from responses for follow-up message assembly (assistant_text_from_response); B3663 owns that.
  - Pre-call marker generation and base guardrail hooks (async_pre_call_deployment_hook, _pre_call_marker); the framework owns those.
pitfalls:
  - "Store keys use both caller identity (from UserAPIKeyAuth.api_key) and call id; keying on call id alone allows cross-tenant reads."
  - "Display hashes strip non-printables and cap at 32 characters before logging; a huge or control-character-laden model-supplied hash could poison logs without this."
  - "Originals use surrogatepass encoding to preserve lone surrogates from JSON \\uXXXX escapes, matching the hash generation; UTF-8 strict mode would raise."
  - "Per-call byte budget (max_bytes_per_call) drops oldest entries; the global budget (_MAX_TOTAL_STORE_BYTES) keeps the most-recent entry so the current call's originals survive."
  - "Retrieval dedup is per-turn (within a single agentic loop step); a later turn can retrieve the same hash again (within its TTL)."
  - "The model can prompt-inject a compresr_retrieve call with a fake hash; fallback text is returned, not a 500, so the model controls the UX."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
