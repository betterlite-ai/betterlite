  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L328-L394"
    why: Caller scope resolution (resolve_call_id, caller_scope, scoped_store_key).
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L397-L480"
    why: Follow-up message builders for chat, Anthropic and Responses APIs.
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L623-L717"
    why: Recovery store eviction, pruning, storage and retrieval methods.
  - url: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L1055-L1151"
    why: "async_should_run_agentic_loop and async_build_agentic_loop_plan methods, including kwargs sanitization."
dod:
  - text: Recovery hashes are stable SHA-256 prefixes with display-safe bounds for logging.
    proof: [recovery-hashes]
  - text: Recovery store is keyed by (caller virtual-key hash, call-id) and respects per-tenant isolation.
    proof: [scoped-storage]
  - text: Originals are stored with 15-minute TTL and pruned by age, entry count and global byte budget.
    proof: [eviction-ttl]
  - text: Retrieval dedupes repeated hashes and caps the count to 8 per turn; missing/expired hashes produce fallback text.
    proof: [retrieval-limits]
  - text: Agentic loop detects compresr_retrieve calls and builds provider-shaped follow-up request patches.
    proof: [agentic-loop-dispatch]
  - text: Follow-up messages for chat completions echo only retrieve calls, omit other tool calls and rebuild assistant text.
    proof: [chat-followup-format]
  - text: Follow-up messages for Anthropic messages API pair tool_use with tool_result blocks.
    proof: [anthropic-followup-format]
  - text: Follow-up messages for Responses API pair function_call with function_call_output blocks.
    proof: [responses-followup-format]
  - text: The PRE_CALL_EXECUTED_GUARDRAILS_KEY is trimmed to keep only Compresr's own marker.
    proof: [marker-trimming]
checks:
  optional: []
  commands:
    - id: recovery-hashes
      why: hash generation or display bounds are wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*hash(::|$)/)'
    - id: scoped-storage
      why: store keys do not isolate by tenant/call or resolution fails
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*scoped(::|$)/)'
    - id: eviction-ttl
      why: originals are not evicted by age, count or byte budget
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*eviction(::|$)|^compresr_recovery::tests::.*ttl(::|$)/)'
    - id: retrieval-limits
      why: retrieval does not dedupe, cap at 8, or produce fallback text for missing hashes
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*retrieval(::|$)/)'
    - id: agentic-loop-dispatch
      why: compresr_retrieve calls are not detected or loop dispatch fails
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*agentic(::|$)/)'
    - id: chat-followup-format
      why: chat completion follow-up messages lack correct structure or omit other tool calls
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*chat_followup(::|$)/)'
    - id: anthropic-followup-format
      why: Anthropic follow-up lacks tool_use/tool_result pairing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*anthropic_followup(::|$)/)'
    - id: responses-followup-format
      why: Responses API follow-up lacks function_call/function_call_output pairing
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*responses_followup(::|$)/)'
    - id: marker-trimming
      why: PRE_CALL_EXECUTED_GUARDRAILS_KEY is not trimmed to Compresr's marker only
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^compresr_recovery::tests::.*marker_trim(::|$)/)'
