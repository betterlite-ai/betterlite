dod:
  - text: pinned_sql_checksums checks all 29 immutable files and directory identities; postgres_catalog compares every owned column/default, primary key, index and foreign-key action with independent upstream application.
    proof: [behavior-tests, postgres-tests]
  - text: 'postgres_spend_history covers three_tool_indexes_replaced_in_order,
      old_index_names_new_six_columns, nullable_models_and_tool_names,
      organization_end_user_agent_counter_defaults, daily_entity_null_uniqueness,
      tag_request_id, spend_organization_and_agent_nullable and repeated_agent_column_no_change.'
    proof: [postgres-tests]
  - text: 'postgres_mcp_history covers stdio_arrays_json_and_nullable_url,
      server_groups_no_default_permission_groups_empty, alias_values_move_new_alias_null,
      rename_repeat_duplicate_column_42701, other_schema_alias_undefined_column_42703,
      spec_version_drop_loses_only_that_column, allowed_tools_extra_headers_empty,
      static_headers_credentials_empty_raw_json, nullable_tool_permissions and empty_agent_permissions.'
    proof: [postgres-tests]
  - text: 'postgres_resource_history covers rotation_false_zero_and_nullable_times,
      prompt_initial_unique_id, prompt_existing_version_one, prompt_different_versions_allowed,
      prompt_duplicate_version_rejected, search_tool_required_params_and_unique_name,
      vector_index_unique_name_and_actors, vector_store_nullable_params,
      managed_file_storage_fields_no_backfill, tag_defaults_and_budget_set_null,
      singleton_sso_cache_ui_ids_and_required_json, project_defaults_and_model_limit_objects,
      project_three_set_null_references, key_project_set_null_reference and agent_required_card_and_actor_defaults.'
    proof: [postgres-tests]
checks:
  optional: []
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_managed_resources::tests::/)
        - test(/replays_the_/)'
    - id: postgres-tests
      why: Resource defaults, destructive history or index and foreign-key behavior fails against real Postgres.
      run: cargo nextest run --locked -p betterlite-db --no-tests=fail -E 'test(/^schema_managed_resources::tests::postgres_/)'
oracle_cases: []
deviations: []
out_of_scope:
  - B703 supplies the preceding checkpoint, B705-B709 later SQL, B701 final-schema comparison and B873 deploy ledger behavior.
  - B136 and the SSO/cache configuration persistence owners encrypt application credentials; these SQL additions only define nullable JSON columns and defaults.
  - B087 decides managed-file/batch runtime hooks; storage_url here is stored data and is never downloaded by a migration.
pitfalls:
  - Reusing a truncated daily-spend index name hides a changed column set unless the test inspects pg_index.
  - The alias migration recreates alias after renaming it, so rerunning it attempts to rename onto an existing server_name.
  - spec_version is intentionally dropped; copying its value into mcp_info would change the pinned migration.
budget:
  max_changed_lines: 1000
  max_new_expects: 0
review_level: standard
