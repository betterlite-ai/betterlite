id: B704
title: Postgres migrations for managed resources
description: >-
  Register the 29 scoped migrations after B703, preserving exact bytes and directory spellings,
  including 20251122125322_Add organization_id to spend logs. schema_managed_resources tests compare
  independent pinned/candidate histories at behavioral checkpoints. B873 applies this SQL and records
  its ledger. Existing rows survive except for the deliberately dropped MCP spec_version column;
  alias data moves to server_name and a fresh alias starts null.

  DailyTag/Team/UserSpend first drop their compound unique indexes, add nullable TEXT
  mcp_namespaced_tool_name, make model nullable, add tool-name indexes and recreate uniqueness over
  (entity,date,api_key,model,custom_llm_provider,mcp_namespaced_tool_name). Old truncated index names
  are reused. SpendLogs receives a nullable tool name. DailyOrganization/EndUser/AgentSpend each add
  required TEXT id primary key/date/api_key, nullable entity/model/model_group/provider/tool name,
  seven required BIGINT counters prompt_tokens/completion_tokens/cache_read_input_tokens/
  cache_creation_input_tokens/api_requests/successful_requests/failed_requests default 0, required
  DOUBLE PRECISION spend=0 and TIMESTAMP(3) created_at now/updated_at without default. Each has five
  individual indexes on date/entity/api_key/model/tool and six-column compound uniqueness. Check
  distinct-null behavior. DailyTagSpend gains nullable request_id; SpendLogs gains nullable
  organization_id/agent_id. The final schema_sync repeats agent_id ADD COLUMN IF NOT EXISTS.

  MCPServerTable gains nullable args/allowed_tools/extra_headers TEXT arrays default [], command TEXT,
  env/static_headers/credentials JSONB default {}, and mcp_access_groups TEXT[] without a default;
  url becomes nullable. ObjectPermissionTable.mcp_access_groups instead defaults []. The alias rename
  guard checks information_schema without schema qualification. Because alias is added back, a second
  run attempts alias-to-server_name again and fails with duplicate_column 42701; an alias only in another
  schema can trigger undefined_column 42703. The spec_version DROP intentionally loses its values.
  SQL leaves existing/new credential/header/environment JSON unchanged; do not add a cipher migration.

  VerificationToken's nullable auto_rotate defaults false and rotation_count defaults 0; key_rotation_at,
  last_rotation_at and rotation_interval have no defaults. ObjectPermissionTable gets nullable JSONB
  mcp_tool_permissions and later nullable agents/agent_access_groups TEXT arrays default []. AgentsTable
  also gains nullable agent_access_groups default []. These columns alone schedule nothing or grant nothing.

  PromptTable requires TEXT id/prompt_id, JSONB litellm_params, created_at default now and updated_at
  without default, with nullable prompt_info. Initially prompt_id is unique; versioning drops that
  unique index, adds required INTEGER version=1, creates a prompt_id lookup index and unique
  (prompt_id,version). Existing prompts become version 1; different versions may share an ID.
  SearchToolsTable requires search_tool_id/name and litellm_params, nullable search_tool_info,
  created_at now/required updated_at, and unique name. ManagedVectorStoreIndexTable requires
  id/index_name/litellm_params, nullable index_info/actors, created_at now/required updated_at and unique
  index_name. The plural ManagedVectorStoresTable gains nullable JSONB litellm_params. ManagedFileTable
  gains nullable TEXT storage_backend/storage_url without backfill, download or hook activation.

  TagTable has TEXT tag_name primary key, nullable description/models/model_info/budget_id/created_by,
  required spend=0 and required created_at/updated_at default now. Its budget reference deletes SET
  NULL and updates CASCADE. SSOConfig/CacheConfig/UISettings have required TEXT primary-key defaults
  sso_config/cache_config/ui_settings, required JSONB sso_settings/cache_settings/ui_settings without
  defaults, created_at now and required updated_at without default. Preserve these IDs and raw JSON.

  ProjectTable requires TEXT project_id/actors, JSONB metadata/model_spend default {}, spend=0,
  blocked=false and both timestamps now; project_alias/team_id/budget_id/object_permission_id/models
  are nullable. Add nullable description and required model_rpm_limit/model_tpm_limit JSONB {}.
  Its team/budget/object_permission references delete SET NULL and update CASCADE, as does the new
  VerificationToken.project_id reference. AgentsTable requires agent_id/unique agent_name,
  JSONB agent_card_params, actors and both timestamp defaults now; litellm_params is nullable.
  No foreign key is inferred merely from an agent/organization identifier in spend logs.


  B700 supplies typed sessions for catalog/default/constraint checks. B860 supplies independent
  databases through POSTGRES_TEST_URL, using testcontainers only when absent, and cleans up after
  failure. The rename guard case deliberately uses two schemas. Static SQL needs no HTTP adapter or
  byte decoder. Runtime managed files/batches remain B087's open product decision. There are 264
  nonblank, noncomment SQL lines and 431 physical lines to copy; allow 320 tests and 30 registration
  lines, 781 within 800. Keep Rust test/registration modules below 300 lines.
