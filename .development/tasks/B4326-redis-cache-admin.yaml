id: B4326
title: Probe Redis health and expose cache administration operations
description: >-
  B4325 gives the cache a `RedisTransport`. This task adds the health and
  administration methods that `RedisCache` and `RedisClusterCache` carry beside
  their reads and writes. It adds the module `redis_cache_admin` to betterlite-redis.
  The admin routes (B4309) and the cache setup (B360) call it.

  Type. `RedisCacheAdmin::new(transport: Arc<RedisTransport>, store:
  Arc<RedisClientStore>, factory: Arc<LiveClientFactory>, settings:
  RedisConnectionSettings, namespace: Option<String>, hooks: Arc<dyn ServiceHooks>,
  gate: Arc<dyn BreakerGate>)`, with no global. `RedisTransport` keeps no handle to
  the store, the factory or the settings, so the caller passes the same three it gave
  the transport. B5630 builds this type inside the RedisCache facade and passes the
  namespace. This task declares no hook or breaker trait and does not depend on B393
  or B012. B4325's module `redis_client_reuse` declares `ServiceHooks` with `fn
  success(&self, event: &ServiceEvent)` and `fn failure(&self, event: &ServiceEvent,
  error: &(dyn Error + Send + Sync))`, `ServiceEvent` with `call_type: &'static str`,
  `duration: Duration` and `key: Option<String>`, and `BreakerGate` with `fn
  enter(&self, name: &'static str) -> Result<BreakerAdmission, BreakerOpen>`, `fn
  exit(&self, admission: BreakerAdmission)`, `fn record_failure(&self, error: &(dyn
  Error + Send + Sync))` and `fn swallowed(&self, admission: &BreakerAdmission,
  error: &(dyn Error + Send + Sync))`, plus `BreakerAdmission` and `BreakerOpen`. Import
  them from there. B5630 implements them over B393 and B012. The hook pair is
  `service_success_hook` and `service_failure_hook` with `ServiceTypes.REDIS`. Rust has
  no call stack for `_get_call_stack_info`, so each ping takes the caller name as an
  argument and puts it in the event's `key`. A test gate and a test hook in
  `redis_cache_admin/tests/support.rs` record every call.

  Guard rule. Only `delete_cache_keys` and `async_delete_cache` are guarded, and the
  breaker name is the method name. Call `gate.enter(name)` first. An open breaker
  returns its `BreakerOpen` error (as `RedisAdminError::Breaker`) and sends nothing. Run the body. On `Err` call
  `gate.record_failure(&error)` and return the error. On `Ok` call `gate.exit(admission)`
  once. `ping`, `sync_ping`, `disconnect`, `test_connection`, `delete_cache`, `client_list`,
  `info`, `flush_cache` and `flushall` never touch the gate, because LiteLLM's guard
  comment says health and teardown must always run.

  Async ping. `async fn ping(&self, caller: Option<&str>) -> Result<bool,
  RedisAdminError>` gets the client from `transport.async_client()` and sends PING
  through the generic seam `ping_commands<C: AsyncRedisCommands>(commands: &C, hooks:
  &dyn ServiceHooks, caller: Option<&str>) -> Result<bool, RedisAdminError>` in
  `redis_cache_admin/health.rs`. The seam exists so tests and the oracle adapter call
  it with a fake client. It times the call, records one event with `call_type`
  `async_ping` and the caller as `key` (`Success` or `Failure`), and on failure logs at
  error level "LiteLLM Redis Cache PING: - Got exception from REDIS : {error}" and
  returns the error. The hook is sync, so no spawn is needed.

  Sync ping. `fn sync_ping(&self, caller: Option<&str>) -> Result<bool,
  RedisAdminError>` is blocking, for sync call sites only. It runs
  `transport.sync_client.query::<String>(&redis::cmd("PING"))`, and the answer is
  true when the reply is "PONG". It records `call_type` `sync_ping` with the same event
  and log rules as `ping`, and it is not guarded.

  Startup pings. `async fn setup_health_pings(self: &Arc<Self>)` is `_setup_health_pings`
  and runs once after the cache is built. It spawns `ping(None)` with `tokio::spawn` and
  drops the result, since `ping` already logged and recorded it. Then it runs the sync
  probe in an awaited `spawn_blocking`. The sync probe is not `sync_ping`: LiteLLM
  calls `redis_client.ping()` directly, so there is no success event and no caller.
  On an error it logs at error level "Error connecting to Sync Redis client" with the
  error text and records one `hooks.failure` event, `call_type` `redis_sync_ping`, duration
  zero and `key` `None` (`_handle_sync_ping_error`). It returns `()` and never
  fails, because startup must not stop on a bad Redis.

  Delete. `async fn delete_cache_keys(&self, keys: &[String]) -> Result<(),
  RedisAdminError>` is guarded as `delete_cache_keys`. It namespaces each key with
  B4324's `check_and_fix_namespace` and sends one DEL with all of them through
  `transport.async_client()`. `async fn async_delete_cache(&self, key: &str) ->
  Result<i64, RedisAdminError>` is guarded as `async_delete_cache`, namespaces the
  key, and returns the count DEL answered. `fn delete_cache(&self, key: &str) ->
  Result<(), RedisAdminError>` is blocking and unguarded and sends DEL through
  `transport.sync_client.query`. With an empty `keys` list, a `LiveAsyncClient::Cluster`
  client returns `Ok(())` and sends nothing, because redis-py's cluster `delete()` does
  that. Any other client sends a bare `DEL` and returns the server's error, the way
  redis-py does on a plain client.

  Server reads. All four are blocking, unguarded and go through
  `transport.sync_client.query`. `fn client_list(&self) ->
  Result<Vec<IndexMap<String, String>>, RedisAdminError>` sends `CLIENT LIST` and
  parses the text with `parse_client_list`. `fn info(&self) -> Result<IndexMap<String,
  InfoValue>, RedisAdminError>` sends `INFO` and parses the text with `parse_info`.
  `fn flush_cache(&self)` and `fn flushall(&self)` both send `FLUSHALL`; LiteLLM keeps
  two names with one body, so keep both public methods and let one call the other.
  Both return `Result<(), RedisAdminError>`. The proxy's cache routes call these from
  async handlers, so B4309 must wrap them in `spawn_blocking`.

  Parsers, in `redis_cache_admin/info_parse.rs`. They port redis-py 8.1.0
  `parse_info` and `parse_client_list` (`redis/_parsers/helpers.py` L35 and L889 in the
  pinned virtualenv). `parse_info(text: &str) -> IndexMap<String, InfoValue>` walks
  `text.lines()` and skips empty lines and lines that start with `#`. A line with a
  colon splits on the first colon. A key `cmdstat_host` splits on the last colon
  instead, since that key holds one. The key `module` appends its value to a list
  under `modules`. A line with no colon appends to a list of lines under `__raw__`.
  A value with no `,` and no `=` is an integer if it parses as `i64` and a float if it
  holds a `.` and parses as `f64`, and text otherwise. A value with `,` and no `=` is a
  list, split on `,` with empty items dropped and each item parsed the same way. A
  value with `=` is a map. Split on `,`, drop empty items, split an item on its last
  `=`, parse the part after it as a value, and give an item with no `=` the value
  `true`. `InfoValue` is `Int(i64)`, `Float(f64)`, `Text(String)`, `List(Vec<InfoValue>)`,
  `Map(IndexMap<String, InfoValue>)` and `Bool(bool)`, derives `Serialize` untagged, and
  keeps the server's key order, so the INFO route can return it as JSON. A repeated
  key keeps its first position and the last value, as a Python dict does.

  `parse_client_list(text: &str) -> Result<Vec<IndexMap<String, String>>,
  ClientListError>` walks `text.lines()`, splits each line on single spaces, and for a
  token with `=` splits once on the first `=` into key and value. A token without `=`
  is appended to the last value with a space in front, since an address on a Unix
  socket can hold a space. A token without `=` before any key is
  `ClientListError::OrphanToken`, where redis-py raises a KeyError. The error enum is
  owned by `info_parse.rs`.

  Disconnect. `async fn disconnect(&self)` is unguarded. It drops the entry
  `transport.cache_key` from the store for the `Standalone` family (the pool
  disconnect), then calls `transport.close_pubsub_client().await` and ignores its
  error after logging it at debug level, "Error closing cached pub/sub Redis client:
  {error}". The sync client has no close in B4325, so the third step has no counterpart
  (see deviations).

  Connection test. `async fn test_connection(&self) -> ConnectionTestResult` builds a
  new record with `redis_client_factories::dispatch::build_client(&settings,
  ClientKind::Async)`, opens it with `factory.open_async(&client, None)` (no pool, no
  store), runs `ping`, and drops the client. It never returns `Err`. A build, open or
  ping error becomes a failed result and is logged at error level as "Redis connection
  test failed: {error}" (Cluster family: "Redis Cluster connection test failed:
  {error}"). `ConnectionTestResult` has `status: ConnectionStatus` (`Success` or
  `Failed`, serialized lowercase), `message: String` and `error: Option<String>`,
  skipped when `None`. The pure function `connection_test_result(family:
  RedisCacheFamily, ping: Result<bool, String>) -> ConnectionTestResult` in
  `redis_cache_admin/connection_test.rs` holds the texts, so the oracle adapter
  calls it. For `Standalone`: "Redis connection test successful", "Redis ping returned
  False" and "Redis connection failed: {e}" with `error` set to `e`. For `Cluster`:
  "Redis Cluster connection test successful", "Redis Cluster ping returned False" and
  "Redis Cluster connection failed: {e}" with `error` set to `e`. A success or a false
  ping has no `error` key.

  `RedisAdminError` is a `thiserror` enum owned by this module. It wraps
  `ClientReuseError` and `LiveClientError` with `#[from]` and holds `ClientList(#[from]
  ClientListError)` and `Breaker(#[from] BreakerOpen)` for an open breaker. Its `Display` is what the
  logs and events print.

  Cargo. Add `indexmap` 2.14.2 with feature `serde` and `tracing` if the crate does
  not already have it, to `crates/betterlite-redis/Cargo.toml`. Check the workspace
  first and use `workspace = true` when the dependency is listed there.

  Fuzz. Add the cargo-fuzz target `redis_info` at
  `crates/betterlite-redis/fuzz/fuzz_targets/redis_info.rs`. It feeds
  `String::from_utf8_lossy(data)` to `parse_info` and `parse_client_list` and must
  not panic. Add its `[[bin]]` entry to `crates/betterlite-redis/fuzz/Cargo.toml`, seed
  `crates/betterlite-redis/fuzz/corpus/redis_info/` with at least six files (a real
  INFO sample with sections, a keyspace line, a `module:` line, a `cmdstat_host` line,
  a CLIENT LIST with a space in `addr`, and an orphan token), and add the test
  `replays_the_redis_info_corpus` that runs every file in that folder through both
  parsers. The corpus folder is committed, so drop any line a `.gitignore` adds for it.

  Tests live in `redis_cache_admin/tests/`, one file per group, and reuse the fake
  server at `crate::redis_live_client::tests::fake_server` and the helpers of
  `redis_client_reuse` tests. The oracle helper op `b4326` has four functions.
  `parse_info` takes `text` and returns the dict as JSON. `parse_client_list` takes
  `text` and returns the list, or `{error: "orphan_token"}`. `connection_test` takes
  `family` (`standalone` or `cluster`), `ping` (`true`, `false` or `error`) and
  `error_text`, and returns the result dict. `ping_events` takes `outcome` (`success`
  or `error`) and `error_text` and returns `{result, error, events}`, where each event
  is `{call_type, outcome, error}` with no duration and no key. The Python side for
  `connection_test` builds `RedisCache` or `RedisClusterCache` with `object.__new__`,
  sets `redis_kwargs`, and patches `litellm._redis.get_redis_async_client` to return a
  stub whose `ping` returns or raises and whose `aclose` does nothing. For
  `ping_events` it sets `service_logger_obj` to a recording stub and
  `_async_commands` to a stub with a scripted `ping`, then awaits `ping()`. The Rust
  side calls `connection_test_result` and `ping_commands` with a scripted client.

