deviations:
  - what: >-
      `disconnect` has no step that closes the sync Redis connection, and on the
      Cluster family it leaves the per-instance async client open until the cache drops.
    why: >-
      B4325's `LiveSyncClient` has no close method and `RedisTransport` holds the Cluster client in a private cell. A dropped connection closes when its last clone is dropped.
  - what: >-
      `disconnect` does not force-close connections that a running request still
      holds. LiteLLM's pool disconnect passes `inuse_connections=True`.
    why: >-
      Removing the store entry drops the cache's own reference, and an in-flight clone closes the connection as soon as it finishes. redis-rs has no pool to disconnect.
  - what: >-
      On a Cluster client, `sync_ping` and the startup sync probe reach every primary,
      `info` takes the first node's reply, and `client_list` goes to whichever node
      redis-rs picks. redis-py sends all three to the default node.
    why: >-
      `LiveSyncClient::query` takes no routing argument and redis-rs 1.7.0 routes PING and INFO to all primaries. A Cluster INFO then comes back as a map of node to text, and the first entry stands in for the default node.
  - what: >-
      FLUSHALL on a Cluster client reaches every primary in both clients.
    why: >-
      redis-py also sends FLUSHALL to all primaries on RedisCluster, so nothing differs. Listed because INFO and PING differ.
  - what: >-
      `parse_info` reads a number only when `i64` or `f64` parses it. A value that
      Python's `int` or `float` accepts with underscores or surrounding spaces stays
      text, and an integer past `i64` stays text.
    why: >-
      Redis writes plain decimal numbers in INFO, and `i64` is the type the INFO route returns. A server never sends the other forms.

out_of_scope:
  - "`_handle_async_ping_error` and the `no running event loop` branch of `_setup_health_pings`; there is no Rust counterpart. The spawn cannot fail, and Tokio is always running here. Its `redis_async_ping` call type is not built."
  - "`RedisCircuitBreaker`, the guard decorators, `_enter_circuit_breaker`, `_exit_circuit_breaker` and `log_redis_failure`; B393 owns them and B5630 implements `BreakerGate` over it."
  - "`_get_call_stack_info`, `check_and_fix_namespace` and `_get_cache_logic`; B4324 owns them. This task calls the namespace function and takes the caller as an argument."
  - "`RedisCache.__init__` (which calls `_setup_health_pings`), the service logger object and the config keys that choose the namespace; B360 owns the config keys and B5630 builds this type inside the RedisCache facade."
  - "`init_async_client`, `_async_commands`, `init_pubsub_client` and the MGET helpers on both cache classes; B4325 owns them."
  - "`set_cache`, `async_set_cache`, the pipelines, `get_cache` and `batch_get_cache`; B4327 owns them."
  - "`increment_cache`, `async_scan_iter`, `async_register_script` and the other counter methods; B4328 owns them."
  - The list operations at L2053-L2420 of `litellm/caching/redis_cache.py`; B4329 owns them.
  - "`ServiceLogging` in `litellm/_service_logger.py` and the `/cache/ping`, `/cache/redis/info` and `/cache/flushall` routes in `litellm/proxy/caching_routes.py`; B012 and B4309 own them and call this module."

pitfalls:
  - >-
    `setup_health_pings` calls the client's own `ping()` and not `sync_ping`, so a
    working Redis records no event for the sync probe and a failing one records
    `redis_sync_ping`, never `sync_ping`.
  - >-
    Only `delete_cache_keys` and `async_delete_cache` are guarded. Giving `ping`,
    `disconnect` or `test_connection` a gate call would stop health checks on an open
    breaker.
  - >-
    `flush_cache` and `flushall` are two names for one FLUSHALL. The proxy route calls
    `flushall`, so test both, and don't add a FLUSH ASYNC or a key filter.
  - >-
    `test_connection` returns a result for every failure, including a failed client
    build. A `?` on any step lets an error escape to the route as a 500.
  - >-
    A `false` ping is a failed connection test but a plain `Ok(false)` from `ping`.
    The two use different code paths in LiteLLM, so don't merge them.
  - >-
    `parse_info` splits `cmdstat_host` on the last colon only. Every other key splits
    on the first colon, because a value such as `slave0:ip=10.0.0.1,port=6379` holds
    colons and equals signs.
  - >-
    In a map value an item with no `=` is `true`, and an item with `=` splits on the
    last `=`. A keyspace line `db0:keys=1,expires=0,avg_ttl=0` becomes a map of three
    integers.
  - >-
    `parse_client_list` appends a no-equals token to the previous value with one
    space, so a token cannot start a new key. Don't trim or collapse spaces inside a
    value.
  - >-
    `LiveSyncClient::query` blocks, so every sync method here is for sync call sites,
    and `setup_health_pings` must run the sync probe inside `spawn_blocking`.
  - >-
    Error text must not hold the password. Log and record the error's `Display`, never
    the settings or the built record.

