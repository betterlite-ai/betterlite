dod:
  - text: >-
      `ping` and `sync_ping` return the answer, record one event with `call_type`
      `async_ping` or `sync_ping` and the given caller, and on an error log the PING
      text, record a failure and return the error. A `false` answer is a success.
    proof: [health-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `setup_health_pings` sends one async and one sync PING, records nothing on
      success, records one `redis_sync_ping` failure with zero duration and no key
      when the sync probe fails, and returns without error when both fail.
    proof: [setup-tests]
  - text: >-
      `delete_cache_keys` and `async_delete_cache` namespace the keys, send one DEL,
      go through the gate under their own names, send nothing when the breaker is
      open, and report the error to the gate. `delete_cache` sends DEL without the
      gate. An empty key list sends nothing on a Cluster client and a bare DEL on
      any other.
    proof: [delete-tests]
  - text: >-
      `client_list`, `info`, `flush_cache` and `flushall` send CLIENT LIST, INFO and
      FLUSHALL (twice for the two flush names) through the sync client, never touch
      the gate, and return the parsed result or the error.
    proof: [server-tests]
  - text: >-
      `parse_info` matches redis-py for sections, ints, floats, text, lists, maps,
      keyspace lines, repeated `module` lines, `cmdstat_host` and lines with no colon.
      `parse_client_list` matches it for several clients and for a space inside a
      value, and returns `OrphanToken` for a stray token.
    proof: [info-parse-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `connection_test_result` and `test_connection` return the Standalone and Cluster
      texts for success, a false ping and an error, with `error` only on failure. The
      test never reads the store, never fails, and the opened client is dropped.
    proof: [connection-test-tests, helper-python, helper-case-corpus, oracle]
  - text: >-
      `disconnect` removes the cached client for the Standalone family and the
      shared pubsub client for both, keeps going when the pubsub close fails, and can
      be called twice.
    proof: [lifecycle-tests]
  - text: >-
      The parsers have a cargo-fuzz target `redis_info` with a seeded corpus, and
      `replays_the_redis_info_corpus` runs every corpus file through both parsers
      without a panic.
    proof: [fuzz-corpus]

checks:
  optional: []
  commands:
    - id: health-tests
      why: The ping events, the logged text or the returned answer is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache_admin::tests::health::/)'
    - id: setup-tests
      why: The startup async and sync probes or the redis_sync_ping failure event is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache_admin::tests::setup::/)'
    - id: delete-tests
      why: Key deletion, its guard or the empty-list rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache_admin::tests::delete::/)'
    - id: server-tests
      why: CLIENT LIST, INFO or FLUSHALL is not sent or not parsed
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache_admin::tests::server::/)'
    - id: info-parse-tests
      why: A rule of parse_info or parse_client_list is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache_admin::tests::info_parse::/) - test(replays_the_redis_info_corpus)'
    - id: connection-test-tests
      why: The connection test result texts or its fresh-client rule is missing
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache_admin::tests::connection_test::/)'
    - id: lifecycle-tests
      why: Disconnect does not drop the cached clients or stops at a close error
      run: >-
        cargo nextest run --locked -p betterlite-redis --no-tests=fail
        -E 'test(/^redis_cache_admin::tests::lifecycle::/)'
    - id: fuzz-corpus
      why: The redis_info fuzz target or its seeded corpus is missing, or replaying the corpus fails
      run: >-
        test -f crates/betterlite-redis/fuzz/fuzz_targets/redis_info.rs &&
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-redis/fuzz/corpus/redis_info)" &&
        test "$(ls crates/betterlite-redis/fuzz/corpus/redis_info | wc -l)" -ge 6 &&
        grep -q 'name = "redis_info"' crates/betterlite-redis/fuzz/Cargo.toml &&
        cargo nextest run --locked -p betterlite-redis --no-tests=fail -E 'test(replays_the_redis_info_corpus)'
    - id: helper-python
      why: The strict oracle adapter fails lint or type checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4326)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b4326 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b4326/pyrightconfig.json
    - id: helper-case-corpus
      why: The new cache admin cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/redis_cache_admin-*")" &&
        grep -lE '^[[:space:]]+b4326:' tools/oracle/fuzz/corpus/helper_case/redis_cache_admin-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'

