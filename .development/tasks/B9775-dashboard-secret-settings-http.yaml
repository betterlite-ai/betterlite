id: B9775
title: Exercise Vault and CyberArk modal projections over the existing settings APIs
description: >-
  Add booted HTTP coverage for the retained HashicorpVault and CyberArk settings panels.
  Their hooks call config_overrides directly through the shared base/header helpers rather
  than networking.tsx wrappers. B1647 and B1648 already build all eight routes; their planned
  omission/clear tests do not send the edit modals' complete visible-field projections.
  Consult B150-route-audit.md for that distinction and leave the services with those owners.

  Vault GET /config_overrides/hashicorp_vault reads values and field_schema.properties;
  POST the same path submits vault_addr,vault_namespace,vault_login_namespace,
  vault_secret_namespace,vault_mount_name,vault_path_prefix,vault_token,approle_role_id,
  approle_secret_id,approle_mount_path,client_cert,client_key,vault_cert_role. The modal omits
  an untouched blank sensitive field (vault_token,approle_secret_id,client_key), but sends an
  empty string for an ordinary empty text field. The clear control deliberately POSTs the
  selected field as an empty string. Test save/read, a second edit that omits stored secrets,
  an explicit secret clear and DELETE /config_overrides/hashicorp_vault followed by readback.
  POST /config_overrides/hashicorp_vault/test_connection has no request body, not {}; the
  panel uses its message for a toast and treats non-2xx as failure.

  CyberArk uses GET/POST/DELETE /config_overrides/cyberark and bodyless POST
  /config_overrides/cyberark/test_connection. Its fields are cyberark_api_base,cyberark_account,
  cyberark_username,cyberark_api_key,client_cert,client_key,ssl_verify,refresh_interval;
  cyberark_api_key and client_key are sensitive. Preserve the text-control strings and the
  source's declared parsing rather than inventing Python coercion cases. Verify the same
  omit-versus-clear behavior, returned masked values, schema descriptions and delete/read.
  A mutation's success body is not a new modal data model; only GET repopulates the form.

  Use B1630 ordered requests and B860/B5076 database fixtures. B1644's explicit
  native_feature_eligibility=true mode is needed for the MIT secret-manager clients and
  must be visible in eligible case artifacts; no enterprise code or license service is
  installed. Keep general_settings.store_model_in_db and the manager selection/config keys
  exactly as B1647/B1648's accepted fixtures prescribe, with ordinary defaults otherwise.
  Point Vault lookup-self and CyberArk WhoAmI at the oracle's local upstream and compare
  their requested namespace and credential placement. Reuse each owner's existing mock
  response shapes, then check the form's bodyless probe after an edit. No actual vault,
  certificate authority or remote account is contacted. An upstream denial is distinct
  from a viewer who may read but cannot write/probe; compare both through real auth.

  Compare status, error type/param/code, content-type and stable response fields on every
  step, with redaction asserted rather than ignored. Values that were never sent must not
  appear in the request transcript; sensitive values must not appear in diagnostics.
  Approximately 500 YAML lines cover these two workflows; no secret provider, config parser,
  encryption layer, fixture decoder or TypeScript implementation is authored by this task.
scope:
  paths:
    - tools/oracle/cases/ui/secret-settings/**
  lint_tables: false
references:
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/Settings/AdminSettings/HashicorpVault/EditHashicorpVaultModal.tsx#L102-L120
    why: The modal's empty-field and sensitive-field omission rules.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/ui/litellm-dashboard/src/components/Settings/AdminSettings/CyberArk/EditCyberArkModal.tsx#L97-L113
    why: The CyberArk edit projection differs from a generic PATCH of changed fields.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/config_override_endpoints.py#L328-L645
    why: All four Vault route decorators and the existing read/write/probe policy.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/config_override_endpoints.py#L651-L932
    why: All four CyberArk route decorators, masked schema and connection responses.
dod:
  - text: Both edit modals' actual fields and omission/clear semantics persist through independent booted proxy save/read/delete transactions.
    proof: [secret-form-cases, oracle]
  - text: Bodyless probes use the just-edited native manager configuration without leaking secrets or bypassing role checks.
    proof: [secret-form-cases, oracle]
checks:
  optional: []
  commands:
    - id: secret-form-cases
      why: Generic manager helper cases do not exercise the retained modal's HTTP body.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/ui/secret-settings)"
oracle_cases:
  - tools/oracle/cases/ui/secret-settings/vault-modal-omission-and-clear-eligible-mit.yaml
  - tools/oracle/cases/ui/secret-settings/vault-bodyless-probe-and-delete-eligible-mit.yaml
  - tools/oracle/cases/ui/secret-settings/cyberark-modal-omission-and-clear-eligible-mit.yaml
  - tools/oracle/cases/ui/secret-settings/cyberark-bodyless-probe-and-delete-eligible-mit.yaml
  - tools/oracle/cases/ui/secret-settings/viewer-and-upstream-denials-eligible-mit.yaml
deviations: []
out_of_scope:
  - B9090 takes in the panels, placeholders, modal schemas and hooks; B1647/B1648 own their routes and B1644 owns the isolated eligibility fixture.
  - Existing manager implementations and encryption are dependency behavior, with no new auth mode, certificate validation rule or runtime environment overlay here.
pitfalls:
  - Clearing a secret explicitly sends an empty string; merely leaving its password control blank omits it.
  - The connection-test hooks send no JSON body, so a fixture containing {} does not pin their actual request.
  - Removing a saved override must expose the owner's boot-value fallback, not a test-synthesized empty schema.
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
