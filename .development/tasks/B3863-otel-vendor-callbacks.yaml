id: B3863
title: AgentOps Levo Logfire Traceloop and Weave callbacks
description: >-
  Implement AgentOps JWT authentication, Levo health checks and the Logfire/Traceloop event
  adapters. Complete Weave's legacy callback specialization, sharing the base span lifecycle
  and using the pooled HTTP client and injected IDs.

  AgentOps fetches a JWT token from its authentication endpoint at startup by posting the api_key,
  preserving the token refresh behavior and the endpoint fallback when authentication fails. Store
  the project ID from the response and set resource attributes on the tracer provider.

  Levo reads its configuration from four environment variables (LEVOAI_API_KEY, LEVOAI_ORG_ID,
  LEVOAI_WORKSPACE_ID, LEVOAI_COLLECTOR_URL) and builds the otlp_auth_headers string with format
  "Authorization=Bearer {api_key},x-levo-organization-id={org_id},x-levo-workspace-id={workspace_id}".
  The health check validates that all four required env vars are configured and returns status/message or status/error_message.

  Logfire receives call payloads (completion, embedding, image_generation and others) and emits
  them as event spans by branching on call_type to select the appropriate message template. Traceloop
  always emits one "litellm.completion" span regardless of call_type. Both extract call_type, model,
  metadata and usage fields from kwargs and response, sanitize metadata with redact_user_api_key_info,
  and construct the event span. Logfire forwards errors as error-level logs with _exc_info=True.

  Weave's callback overrides three base methods to create a child span on every LLM call instead of
  reusing a parent span, skips the raw_gen_ai_request child span, and never ends externally managed
  wrapper spans. The construct_dynamic_otel_headers method reads wandb_api_key and weave_project_id
  from standard_callback_dynamic_params and builds Authorization and project_id headers.

  Use _get_httpx_client from B173 for the AgentOps authentication POST, never create a client inline.
  All IDs and timestamps come through injected B198 interfaces, never uuid.uuid4() or time calls.
  The base OpenTelemetry.__init__ from B3868 handles the callback name and service registration.

