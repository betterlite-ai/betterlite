deviations:
  - what: AgentOps silently skips JWT token fetch on failure instead of halting initialization. The callback continues with no auth headers.
    why: LiteLLM initializes the callback even when authentication fails, allowing the service to start with degraded telemetry.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/agentops/agentops.py#L59-L65
  - what: Levo uses LEVOAI_COLLECTOR_URL exactly as provided, with no endpoint normalization or defaulting.
    why: LiteLLM does not provide a default collector URL; users must configure it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/levo/levo.py#L71
  - what: Traceloop initializes with disable_batch=True, making every span emit immediately instead of batching.
    why: LiteLLM disables batching to ensure spans reach the backend promptly in low-volume scenarios.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/traceloop.py#L27
  - what: Traceloop.log_event fails silently when response_obj.get("choices") returns None (line 118 calls enumerate(None) raising TypeError), caught by the outer except block (lines 138-139), leaving span.end never reached and the span unclosed.
    why: LiteLLM reproduces this silent-failure/leaked-span path without adding defensive defaults; betterlite preserves the source behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/traceloop.py#L118-L139

out_of_scope:
  - AgentOps resource attribute merging with base OTel provider attributes; B3868 owns the base provider.
  - Levo protocol selection (otlp_http is hardcoded); only the configuration container is built here.
  - Logfire SDK configuration beyond token setup; the logfire module is external.
  - Traceloop tracer wrapper management; the traceloop.sdk is external.
  - Weave's parent span lifecycle management when parent_span is not None; B3859 owns the base success/failure lifecycle.

pitfalls:
  - AgentOps auth_endpoint defaults to "https://api.agentops.ai/v3/auth/token"; do not invent a fallback if the call fails.
  - Levo's four environment variables (LEVOAI_API_KEY, LEVOAI_ORG_ID, LEVOAI_WORKSPACE_ID, LEVOAI_COLLECTOR_URL) must all be present for get_levo_config to succeed; any missing variable raises ValueError with a specific message.
  - Logfire's message_template uses Python f-string format "{request_data[model]!r}"; replicate exactly for compatibility.
  - Logfire's metadata sanitization skips three specific keys (endpoint, caching_groups, previous_models), not all litellm.* keys.
  - Traceloop's SpanKind and semconv attributes are from opentelemetry.*; import from the source SDK, not local copies.
  - Weave's _handle_success must never call span.end() on parent_span or parent spans from kwargs; only child spans created by _start_primary_span are ended.
  - Logfire must handle missing response_obj (default to empty dict), missing usage and missing choices gracefully; line 95 guards response_obj with default empty dict before calling get().
  - Traceloop's actual behavior silently fails if response_obj.get("choices") returns None (TypeError caught by outer except on line 138-139), leaving the span unclosed; betterlite reproduces this without adding defensive defaults.

