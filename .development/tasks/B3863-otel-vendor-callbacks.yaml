dod:
  - text: AgentOps reads api_key from AGENTOPS_API_KEY env var, fetches a JWT token from auth_endpoint with a POST request, stores project_id in resource attributes, and falls back silently if the request fails.
    proof: [agentops-auth, agentops-tests]
  - text: AgentOps resource attributes include service.name (default litellm), deployment.environment (default production) and project.id when fetched.
    proof: [agentops-tests]
  - text: Levo health check returns status=healthy with message when all four env vars (LEVOAI_API_KEY, LEVOAI_ORG_ID, LEVOAI_WORKSPACE_ID, LEVOAI_COLLECTOR_URL) are configured, and status=unhealthy with error_message when any required env var is missing.
    proof: [levo-health, levo-health-partial, levo-tests]
  - text: Levo health check with partial configuration (e.g. LEVOAI_API_KEY set, LEVOAI_ORG_ID missing) calls get_levo_config which raises ValueError, caught by async_health_check except block, returns status=unhealthy with the ValueError message.
    proof: [levo-health-partial]
  - text: Levo's otlp_auth_headers format is "Authorization=Bearer {api_key},x-levo-organization-id={org_id},x-levo-workspace-id={workspace_id}".
    proof: [levo-tests]
  - text: Logfire constructs a SpanConfig with message_template and span_data based on call_type, and logs with logfire.info or logfire.error depending on level.
    proof: [logfire-tests]
  - text: Logfire redacts metadata with redact_user_api_key_info and excludes endpoint/caching_groups/previous_models keys.
    proof: [logfire-tests]
  - text: Traceloop initializes the Traceloop SDK with app_name=Litellm-Server and disable_batch=True, and emits spans with attributes from OpenTelemetry semconv.
    proof: [traceloop-tests]
  - text: Weave's _start_primary_span always creates a child span (never reuses the parent) and sets Status.OK.
    proof: [weave-tests]
  - text: Weave's _maybe_log_raw_request is overridden to do nothing (skip raw_gen_ai_request child span).
    proof: [weave-tests]
  - text: Weave's _handle_success never ends a parent span (external wrapper spans are user-managed).
    proof: [weave-tests]
  - text: Weave's construct_dynamic_otel_headers reads wandb_api_key and weave_project_id from standard_callback_dynamic_params.
    proof: [weave-tests]
  - text: AgentOps uses _get_httpx_client from B173 and closes the client after the POST request.
    proof: [agentops-auth, agentops-tests]

