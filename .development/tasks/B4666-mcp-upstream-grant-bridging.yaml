deviations:
  - what: The mint error and the success body come back as values (OauthError, BridgeTokenBody), and the route adds the no-store headers to the success body. LiteLLM builds a JSONResponse with those headers inside the function.
    why: betterlite-mcp has no HTTP response type, and the client sees the same status, body and headers. B7321 owns the route.
  - what: The JWT checks, the route checks and the centralized common checks sit behind the JwtAdmission and WriteChecks ports, and B8621 wires the production implementations over B760, B766, B877, B883 and B1221.
    why: Those modules read proxy globals in LiteLLM and need the auth crate's state, and a port keeps this task testable with fakes. The order of the checks is part of this task's tests.
  - what: Debug log lines that name an exception class in LiteLLM name the JwtFault kind or the check error kind instead.
    why: Rust has no exception class names, and the text is only a log.
  - what: A string expires_in that Python's float() reads with a non-ASCII digit or a Unicode space is read as Unspecified unless it is plain ASCII text.
    why: Python accepts Unicode decimal digits and Unicode whitespace in float(); the port covers ASCII digits, underscores, exponent and the inf and nan words, which is all a token endpoint sends.
out_of_scope:
