pitfalls:
  - A sub-second positive expires_in (0.4) is Seconds(1), not Expired, because LiteLLM tests the float before it truncates.
  - A negative infinity expires_in is Unspecified and not Expired, since int(-inf) raises before the sign is looked at.
  - The access envelope's grant has refresh_token None on purpose, so sealing the upstream refresh token there would put a long-lived credential in the bearer the client holds.
  - A refresh_expires_in of 0 or below drops the refresh envelope silently and the exchange still succeeds with an access-only body.
  - A refresh token too large to seal degrades to access-only with a warn log, while an access token too large is the 502 TooLarge.
  - On the refresh path an inactive subject is invalid_grant (400), on the mint path the same failure is invalid_request (400, NoIdentity), so the two lift functions must stay separate.
  - A bridge_identity makes prepare_bridge_mint skip every request credential, and only the missing master key is checked before it.
  - A JWT with a client jwt_field is refused before resolve_jwt_auth runs, so the check cannot be moved after the resolution.
  - An unmapped JWT gives NoIdentity even though resolve_identity could name a user, because a user subject would lose the JWT-only restrictions.
  - authorize_oauth_credential_request treats an empty user_id as no user, like Python truthiness, so a key whose user_id is "" never writes.
  - "resolve_jwt_auth checks the key owner and key activity only for a mapped key, and checks SCIM only on user_object for the identity and authorize branches, so each branch has its own deactivation test."
  - The write route is built from the server id as /v1/mcp/server/{server_id}/oauth-user-credential, and both the resolve step and the check step must use that same text.
