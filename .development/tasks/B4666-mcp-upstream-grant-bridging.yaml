id: B4666
title: MCP upstream grant bridging and credential-write authorization
description: >-
  The gateway can stand between an MCP client and an upstream OAuth server. At the token endpoint it exchanges the upstream code, then seals the upstream grant into a bearer the client holds (an access envelope, and a refresh envelope when the upstream sent a refresh token). Before it spends the single-use upstream code it must know who the caller is, and it must refuse in a way the client can act on. A second set of checks decides whether a caller may store a per-user OAuth credential for a server. In LiteLLM this is the second half of bridge_token_flow.py (L408-L990). B4658 owns the first half (L35-L405: key and user reloads, key_is_active, master_key_admin_auth, ActiveSubjects) and this task calls it. The token and credential routes in discoverable_endpoints.py (B7321) and the other token flows call this code, so every name below is public and spelled as written.


  The code goes in three modules. The pure part, which needs only envelope types, goes in betterlite-mcp as the new module bridge_mint (crates/betterlite-mcp/src/bridge_mint.rs, with the submodules lifetime, grant, error and finish, each with a tests.rs beside it). The parts that read the request, the key store or the JWT machinery need betterlite-server, so they go there as mcp::bridge_prepare (submodules mint and refresh) and mcp::credential_write (submodules resolve, jwt and authorize), each with a tests.rs. betterlite-server already depends on betterlite-mcp, auth and models (B4658 adds betterlite-mcp), so no new crate edge appears and betterlite-mcp imports nothing from betterlite-server or betterlite-auth. Add to a Cargo.toml only what a module needs and the crate lacks (secrecy, serde_json, chrono, tracing and http are expected to be there already).


  bridge_mint::lifetime. UpstreamLifetime is Seconds(the integer type of B4651's UpstreamTokenGrant.expires_in), Unspecified or Expired. classify_upstream_lifetime(raw: Option<&serde_json::Value>) -> UpstreamLifetime copies _classify_upstream_lifetime. Unspecified for None, null, a bool, an array or an object. A JSON number is read as f64. A string is read the way Python's float() reads it: trim Python whitespace, accept one underscore between two digits, accept inf, infinity and nan in any case with an optional sign, and anything else is Unspecified. NaN and either infinity are Unspecified, since int() of them raises in LiteLLM (so "-inf" is Unspecified, not Expired). Then a value of 0 or below is Expired, tested on the float and not on the truncated integer, and anything above 0 is Seconds(max(1, truncate toward zero)), so 0.4 gives Seconds(1) and 3600.9 gives Seconds(3600). A value above the integer type's maximum saturates to the maximum, and B4651's builder then answers lifetime unrepresentable.


  bridge_mint::grant. UpstreamGrantRejection is NoAccessToken or ExpiredLifetime. grant_from_token_response(token_response: &serde_json::Value) -> Result<UpstreamTokenGrant, UpstreamGrantRejection> copies _bridge_grant_from_token_response. Anything that is not an object, or has no non-empty string access_token, is NoAccessToken. Lifetime Expired is ExpiredLifetime (checked after the access token). token_type is the response string when it is a non-empty string, otherwise "Bearer". scope is the response string when non-empty, otherwise None. The grant's refresh_token is always None (the edge forwards only token_type and access_token; the refresh envelope carries the upstream refresh token on its own). expires_in is the Seconds value or None for Unspecified. upstream_refresh_credential(token_response) -> Option<RefreshCredential> needs a non-empty string refresh_token, reads refresh_expires_in the same way (Expired gives None, so a dead refresh token degrades to an access-only response), and takes the same scope rule.


  bridge_mint::error. BridgeMintError has eleven values: NoIdentity, JwtClientPolicyUnsupported, InvalidRefresh, IdentityUnavailable, IdentityFaulted, IdentityUnresolvable, NotConfigured, NoUpstreamToken, UpstreamTokenExpired, UpstreamLifetimeUnrepresentable and TooLarge. to_oauth_error(&self) -> OauthError (B4674's type, which already carries the no-store headers) gives these statuses, codes and descriptions, with the descriptions copied from _bridge_mint_error_response word for word: NoIdentity 400 invalid_request, JwtClientPolicyUnsupported 400 invalid_request, InvalidRefresh 400 invalid_grant, IdentityUnavailable 503 temporarily_unavailable, IdentityFaulted 503 temporarily_unavailable, IdentityUnresolvable 500 server_error, NotConfigured 500 server_error, NoUpstreamToken 502 server_error, UpstreamTokenExpired 502 server_error, UpstreamLifetimeUnrepresentable 502 server_error, TooLarge 502 server_error. mint_error_from_failure(ReloadUserFailure) -> BridgeMintError is NoActiveKey to NoIdentity, Unavailable to IdentityUnavailable, Faulted to IdentityFaulted, Unresolvable to IdentityUnresolvable. refresh_error_from_failure is the same except NoActiveKey gives InvalidRefresh. mint_error_from_rejection maps NoAccessToken to NoUpstreamToken and ExpiredLifetime to UpstreamTokenExpired. ReloadUserFailure is B4674's enum in betterlite_mcp::gateway_dcr.


  bridge_mint::finish. BridgeMintReady { identity: EnvelopeIdentity, keys: EnvelopeKeys } and BridgeRefreshReady { ready: BridgeMintReady, upstream_refresh_token: SecretString, upstream_scope: Option<String> } are defined here and built by the server modules below. BridgeTokenBody { access_token: String, expires_in: i64, refresh_token: Option<String> } has body() giving the JSON object {"access_token", "token_type": "Bearer", "expires_in"} plus "refresh_token" only when it is Some. finish_bridge_mint(ready, server_id: &str, token_response: &serde_json::Value, now: DateTime<Utc>) -> Result<BridgeTokenBody, BridgeMintError> is phase 3, after the upstream exchange. Order: grant_from_token_response (rejection lifted by mint_error_from_rejection), then B4653's build_bridge_token_response(identity, grant, keys, now). The B4651 unrepresentable-lifetime result is UpstreamLifetimeUnrepresentable and any other non-sealed result is TooLarge. expires_in is max(0, sealed expiry in whole seconds truncated minus now in seconds rounded up), so the client is never told the bearer outlives the point admission rejects it. The refresh envelope comes from seal_refresh_envelope(identity, token_response, keys, now, server_id) -> Option<String>: None without a refresh credential; B4653's build_bridge_refresh_token_response sealed gives its bearer string; any failure logs at warn "bridge mint: the upstream refresh token is too large to seal into a refresh envelope for server=%s; issuing an access-only response, so the client re-authenticates at access expiry" and gives None, so the exchange still succeeds with an access-only body. The route (B7321) adds B4654's TOKEN_NO_CACHE_HEADERS to the success body.


  bridge_prepare, phase 1, before the upstream exchange. Every precondition lives here so no failure can burn the single-use code or rotate a refresh token. BridgePrep<S: SubjectStore, J: JwtAdmission> is a struct literal with subjects: ActiveSubjects<S> (B4658), jwt: J and settings: BridgeMintSettings { master_key: Option<SecretString>, jwt_client_field_set: bool }. B8621 fills the settings: jwt_client_field_set is true when general_settings holds a client allowlist that names a jwt_field (LiteLLM's load_mcp_client_allowlist(...).jwt_field, whose general_settings reader is B8724's jwt_client_field_set, so it arrives as a plain bool). mint::prepare_bridge_mint(&self, headers: &HeaderMap, server_id: &str, bridge_identity: Option<&str>) -> Result<BridgeMintReady, BridgeMintError>, where bridge_identity is the litellm_user_id recovered from the gateway authorization code. Order: no master key (None or empty) is NotConfigured. Derive keys with B4653's envelope_keys_from_master_key. A bridge_identity gives a user_id identity, nothing else is read. Otherwise take the presented token with B4658's litellm_key_from_request. A JWT (betterlite_auth::resolved_key::credential::is_jwt) with jwt_client_field_set is JwtClientPolicyUnsupported before any resolution. Otherwise the JWT goes to credential_write's resolve_jwt_auth with no write route, and only a key result with a non-empty token hash gives a key_hash identity on that hash, everything else is NoIdentity (an unmapped JWT never becomes a user subject, because that would drop its JWT-only restrictions). A token that is not a JWT goes to subjects.resolve_active_key, with a failure lifted by mint_error_from_failure, and a success gives a key_hash identity on its key_hash. The identity constructors are B4651's (LiteLLM's key_hash_identity and user_identity; read crates/betterlite-mcp/src/envelope for the Rust names).


  refresh::prepare_bridge_refresh(&self, server_id: &str, refresh_value: Option<&str>, now: DateTime<Utc>) -> Result<BridgeRefreshReady, BridgeMintError>. No master key is NotConfigured. A missing or empty value is InvalidRefresh. Otherwise open it with B4653's open_bridge_refresh_envelope(value, keys, now, server_id) and anything but an opened envelope is InvalidRefresh (not a refresh envelope, unreadable, expired, or minted for another server). Then subjects.revalidate_subject(&identity) (B4658): a failure is lifted by refresh_error_from_failure, so an inactive or deleted subject is InvalidRefresh (invalid_grant) while an outage is still 503 and a gateway fault 500. The ready value carries the opened identity, the keys, the unwrapped upstream refresh token and its sealed scope. Identity comes from the envelope, never from the HTTP request, so this function takes no headers.


  credential_write. These decide who may store a per-user OAuth credential. CredentialWrites<S, J, C, L> holds subjects: ActiveSubjects<S>, jwt: J (JwtAdmission), checks: C (WriteChecks) and servers: L (B4672's ContextServers port, which stands for global_mcp_server_manager.get_allowed_mcp_servers). The ports are traits with native async fn used as generic parameters, no dyn, and B8621 writes the production implementations over B760, B766, B877, B883 and B1221 (this task does not call those modules). JwtAdmission has: enabled() -> bool, true only when general_settings enable_jwt_auth is the boolean true, premium_user is the boolean true and a database connection exists; mapping_configured() -> bool (litellm_jwtauth.is_virtual_key_mapping_configured); map_to_key(token) -> Result<JwtKeyMapping, JwtFault>, covering auth_jwt, the custom_validate callable and _resolve_jwt_to_virtual_key, where JwtKeyMapping is Mapped(UserAPIKeyAuth), Rejected (custom_validate said no) or NotMapped; resolve_identity(token) -> Result<JwtIdentity, JwtFault> (JWTAuthManager.resolve_identity, JwtIdentity from B760 with user_id and user_object); and authorize(token, route, headers, method) -> Result<AuthorizedJwt, JwtFault> where AuthorizedJwt holds user_object: Option<LiteLLMUserTable> and key: UserAPIKeyAuth (authorize_jwt then user_api_key_auth_from_result). JwtFault is one opaque error with a kind name for logs. WriteChecks has one method, admit_write(auth, route) -> Result<(), WriteDenied>, which runs RouteChecks.is_virtual_key_allowed_to_call_route and then the centralized common checks with empty request data.


  resolve::resolve_request_auth(&self, headers, method, write_route: Option<&str>) -> Option<ResolvedRequestAuth>, ResolvedRequestAuth being Key(UserAPIKeyAuth) or Jwt(JwtIdentity). A presented JWT goes to jwt::resolve_jwt_auth. Anything else uses subjects.resolve_active_key and gives Key on success, None on any failure. jwt::resolve_jwt_auth(&self, headers, method, token, write_route) -> Option<ResolvedRequestAuth>: not enabled() is None. If mapping_configured(): map_to_key; Rejected is None, Mapped(key) is Key(key) unless subjects.key_owner_deactivated(&key) or the key is not active (B4658's key_is_active at store.now()), in which case None, and NotMapped continues. With no write_route, resolve_identity gives Jwt(identity) unless identity.user_object is a SCIM-deactivated user (user_scim_deactivated), which is None. With a write_route, authorize(...) gives Key(authorized.key) unless authorized.user_object is SCIM-deactivated. Every JwtFault logs at debug "OAuth JWT identity could not be validated (%s)" with the fault kind and gives None, so the public OAuth exchange stays available and an unvalidated identity never writes.


  authorize::extract_user_id(&self, headers, method) -> Option<String> resolves with no write route and gives the Jwt identity's user_id or the Key's active_key_user_id (B4658's subject_state), and does not check write permission, since it only picks the user for identity binding. authorize_oauth_credential_request(&self, headers, method, server_id) -> Option<String> resolves with the write route "/v1/mcp/server/{server_id}/oauth-user-credential" and gives a user id only for a Key (a Jwt identity never writes) whose active_key_user_id is non-empty and for which can_store_oauth_credential is true. can_store_oauth_credential(&self, headers_and_method, auth: &UserAPIKeyAuth, server_id) -> bool runs checks.admit_write(auth, write_route) and then B4672's can_access_mcp_server(auth, server_id, servers). Any Err logs at debug "OAuth credential write not authorized (%s)" and gives false, so an authorization failure never writes.


  Tests use fakes for SubjectStore (B4658), JwtAdmission, WriteChecks and ContextServers, a fixed now and made-up ids. HTTP: no route reaches this code yet (B7321 and the other token flows add the callers), so the umbrella B137 adds the HTTP oracle cases. This task has helper cases for the pure functions. The helper operation b4666 takes a function field: classify_lifetime, grant_from_response, refresh_credential, error_response, lift_failure and finish. The Python side calls _classify_upstream_lifetime, _bridge_grant_from_token_response, _upstream_refresh_credential, _bridge_mint_error_response (status and body), the three lift functions and _finish_bridge_mint with a made-up master key; the Rust side calls the production functions. Cases that return envelopes ignore /access_token and /refresh_token in compare.ignore, and the Rust tests open those two strings with B4653's functions to check identity, lifetime and scope instead. Cases use a fixed now, so no clock is read.
