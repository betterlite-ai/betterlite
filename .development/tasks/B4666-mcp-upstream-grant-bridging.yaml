dod:
  - text: "classify_upstream_lifetime gives Unspecified for null, bool, array, object and unparseable text, NaN and both infinities, Expired for 0, negative and negative-zero values, Seconds(1) for a value between 0 and 1, Seconds of the truncated value otherwise, and reads Python float text such as ' 12 ', '1_0', '1e3' and 'Infinity'."
    proof: [lifetime-tests, helper-oracle, helper-tests, helper-python]
  - text: "grant_from_token_response rejects a non-object, a missing or empty access_token and an Expired lifetime, defaults token_type to Bearer, drops an empty scope, never keeps a refresh_token and leaves expires_in None for an Unspecified lifetime."
    proof: [grant-tests, helper-oracle, helper-tests, helper-python]
  - text: "upstream_refresh_credential returns None without a non-empty refresh_token or with a non-positive refresh_expires_in, and otherwise carries the token, the scope and the classified lifetime."
    proof: [grant-tests, helper-oracle, helper-tests, helper-python]
  - text: "Every BridgeMintError renders the status, OAuth code and description of _bridge_mint_error_response, and the three lift functions map each ReloadUserFailure as the description says, with NoActiveKey giving NoIdentity on mint and InvalidRefresh on refresh."
    proof: [error-tests, helper-oracle, helper-tests, helper-python]
  - text: "finish_bridge_mint seals an access envelope that opens to the prepared identity, reports expires_in as truncated expiry minus rounded-up now and never below 0, adds a refresh envelope only when the upstream sent a usable refresh token, and degrades to an access-only body when the refresh token cannot be sealed."
    proof: [finish-tests, helper-oracle, helper-tests, helper-python]
  - text: "finish_bridge_mint fails with NoUpstreamToken, UpstreamTokenExpired, UpstreamLifetimeUnrepresentable and TooLarge for the matching upstream response or seal result."
    proof: [finish-tests, helper-oracle, helper-tests, helper-python]
  - text: "prepare_bridge_mint fails with NotConfigured without a master key, ignores everything else when a bridge identity is given, refuses a JWT with a client jwt field before resolving it, mints a key_hash identity for a key or a mapped JWT and NoIdentity for an unmapped JWT, and lifts each key resolution failure."
    proof: [prepare-mint-tests]
  - text: "prepare_bridge_refresh fails with NotConfigured, InvalidRefresh for a missing, foreign, expired or non-envelope value and for an inactive subject, keeps 503 and 500 for outages and faults, and returns the unwrapped upstream refresh token and scope."
    proof: [prepare-refresh-tests]
  - text: "resolve_jwt_auth gives None when JWT auth is not enabled, when a mapped key is inactive or its owner is SCIM-deactivated, when custom validation rejects, and on any JwtFault, and takes the identity path without a write route and the authorize path with one."
    proof: [jwt-auth-tests]
  - text: "authorize_oauth_credential_request gives a user id only for a key with a non-empty active user id that passes admit_write and can_access_mcp_server, never for a JWT identity, and any check error gives None."
    proof: [authorize-tests]
  - text: "extract_user_id gives the JWT identity's user_id or the active key's user_id without checking write permission."
    proof: [authorize-tests]
  - text: "The oracle cases and the corpus seeds agree with LiteLLM on the six pure operations."
    proof: [helper-oracle, helper-tests, helper-python, helper-case-corpus]
checks:
  optional: []
  commands:
    - id: lifetime-tests
      why: the upstream lifetime is read differently from Python's float and int rules
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^bridge_mint::lifetime::tests::/)'
    - id: grant-tests
      why: the upstream grant or refresh credential is validated differently from LiteLLM
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^bridge_mint::grant::tests::/)'
    - id: error-tests
      why: a mint error answers with the wrong status, code or description, or a failure is lifted to the wrong error
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^bridge_mint::error::tests::/)'
    - id: finish-tests
      why: the sealed response has the wrong expires_in, loses the refresh envelope or fails the exchange for a refresh token that is too large
      run: cargo nextest run --locked -p betterlite-mcp --no-tests=fail -E 'test(/^bridge_mint::finish::tests::/)'
    - id: prepare-mint-tests
      why: the authorization_code preconditions run in the wrong order or mint an identity for an unmapped JWT
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::bridge_prepare::mint::tests::/)'
    - id: prepare-refresh-tests
      why: a refresh for a revoked or foreign envelope is accepted, or an outage is reported as invalid_grant
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::bridge_prepare::refresh::tests::/)'
    - id: jwt-auth-tests
      why: a JWT that is disabled, deactivated or unvalidated resolves to an identity
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::credential_write::(resolve|jwt)::tests::/)'
    - id: authorize-tests
      why: a caller without the write route, the server grant or an active user id can store a credential
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^mcp::credential_write::authorize::tests::/)'
    - id: helper-tests
      why: the helper adapter does not reach the production functions
      run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^helpers::mcp::b4666::/) - test(/replays_the_/)'
    - id: helper-oracle
      why: the helper cases are missing or differ from LiteLLM
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/helpers/mcp-upstream-grant-bridging)" &&
        cargo run --locked -p betterlite-oracle -- --self-check tools/oracle/cases/helpers/mcp-upstream-grant-bridging
    - id: helper-python
      why: the Python helper adapter is unchanged or fails the strict checks
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b4666.py tools/oracle/helpers/b4666)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: no newly added mcp-upstream-grant-bridging seed reaches the shared parser
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- 'tools/oracle/fuzz/corpus/helper_case/mcp-upstream-grant-bridging-*')" &&
        grep -lE 'b4666"?:' tools/oracle/fuzz/corpus/helper_case/mcp-upstream-grant-bridging-* &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
