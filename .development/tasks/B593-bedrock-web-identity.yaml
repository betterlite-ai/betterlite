  commands:
  - id: case-jwt-audience-hint
    why: The jwt-audience-hint behavior is missing or differs from its pinned fixture.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_jwt_audience_hint$/)'
  - id: case-web-identity-assume-role
