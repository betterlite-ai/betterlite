  commands:
  - id: case-jwt-audience-hint
    why: Require exactly3 dot segments; decode only the middle base64url segment with padding to multiple4, parse
      _WebIdentityTokenClaims aud as optional string/list[str] and iss optionalstring. Unknown claims ignored. Return
      None if both absent/None, else exact aud=<Python repr>, iss=<Python repr>; empty aud/iss still reported. No
      signature/header validation and no role/region routing follows these claims.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_jwt_audience_hint$/)'
  - id: case-web-identity-assume-role
    why: Reject input beginning os.environ/ or exactly matching any environment variable name before get_secret
      with AwsAuthError400 Invalid web identity token reference. Resolved B129 get_secret None ->401 OIDC token
      could not be retrieved from secret manager.; empty token is forwarded. STS kwargs from B591; call AssumeRoleWithWebIdentity
      with RoleArn,RoleSessionName,WebIdentityToken,DurationSeconds3600, compact JSON B590 Policy, optional ExternalId
      whenever non-None including empty. No session tags forwarded in this flow.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_web_identity_assume_role$/)'
  - id: case-secure-transport-session-policy
    why: Replay B590 web_identity_policy exact four Sid/action lists, Version2012-10-17, Resource*, Allow and aws:SecureTransport="true"
      at the STS call seam; serialize compact separators. This source policy is a permission ceiling, not a suggested
      list.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_secure_transport_session_policy$/)'
  - id: case-same-account-irsa
    why: 'No explicit local file read or credential injection: use default STS client with B591 kwargs, optional
      debug GetCallerIdentity failure ignored, then AssumeRole with B590 RoleArn/RoleSessionName/ExternalId/Tags.
      Session name is supplied, not generated in this helper.'
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_same_account_irsa$/)'
  - id: case-cross-account-irsa
    why: 'Read only operator-selected local AWS_WEB_IDENTITY_TOKEN_FILE, strip whitespace, create first STS client
      with B591 endpoint/TLS/region, assume IRSA RoleArn and caller session name with WebIdentityToken only (no
