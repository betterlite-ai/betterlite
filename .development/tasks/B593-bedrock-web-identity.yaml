  - id: config-bedrock-max-policy-size
    why: BEDROCK_MAX_POLICY_SIZE lacks a production config loader case.
    run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/::bedrock_web_identity_config_cases::case_[0-9]+_loads_bedrock_max_policy_size$/)'
