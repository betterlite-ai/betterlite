id: B593
title: AWS web identity and IRSA role chains
description: >-
  Add WebIdentityCredentials and IRSA same-account/cross-account flow using configured token sources and the existing
  STS adapter. Treat the unverified JWT audience only as the pinned diagnostic hint, never as authentication verification.
  Preserve scoped web-identity session policy, target role identity and failure propagation; reads are from operator-chosen
  local token files or secret-manager values.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/base_aws_llm.py:
  BaseAWSLLM._unverified_web_identity_audience L972-L988; BaseAWSLLM._auth_with_web_identity_token L991-L1088; BaseAWSLLM._handle_irsa_cross_account
  L1090-L1155; BaseAWSLLM._handle_irsa_same_account L1157-L1191.


  Named case contracts: jwt_audience_hint: Require exactly3 dot segments; decode only the middle base64url segment
  with padding to multiple4, parse _WebIdentityTokenClaims aud as optional string/list[str] and iss optionalstring.
  Unknown claims ignored. Return None if both absent/None, else exact aud=<Python repr>, iss=<Python repr>; empty
  aud/iss still reported. No signature/header validation and no role/region routing follows these claims. web_identity_assume_role:
  Reject input beginning os.environ/ or exactly matching any environment variable name before get_secret with AwsAuthError400
  Invalid web identity token reference. Resolved B129 get_secret None ->401 OIDC token could not be retrieved from
  secret manager.; empty token is forwarded. STS kwargs from B591; call AssumeRoleWithWebIdentity with RoleArn,RoleSessionName,WebIdentityToken,DurationSeconds3600,
  compact JSON B590 Policy, optional ExternalId whenever non-None including empty. No session tags forwarded in
  this flow. secure_transport_session_policy: Replay B590 web_identity_policy exact four Sid/action lists, Version2012-10-17,
  Resource*, Allow and aws:SecureTransport="true" at the STS call seam; serialize compact separators. This source
  policy is a permission ceiling, not a suggested list. same_account_irsa: No explicit local file read or credential
  injection: use default STS client with B591 kwargs, optional debug GetCallerIdentity failure ignored, then AssumeRole
  with B590 RoleArn/RoleSessionName/ExternalId/Tags. Session name is supplied, not generated in this helper. cross_account_irsa:
  Read only operator-selected local AWS_WEB_IDENTITY_TOKEN_FILE, strip whitespace, create first STS client with
  B591 endpoint/TLS/region, assume IRSA RoleArn and caller session name with WebIdentityToken only (no DurationSeconds,Policy,ExternalId,Tags).
  Create second client with returned AccessKeyId/SecretAccessKey/SessionToken plus same kwargs. GetCallerIdentity
  is debug-only; failure logs Failed to get caller identity: <error> and continues. Then AssumeRole target with
  B590 external-id/tags presence policy and return raw response. malformed_token: Wrong segment count, base64/JSON
  errors or invalid aud/iss types return None; do not turn diagnostic parsing failure into a second authentication
  failure. Fuzz decode_web_identity_claims using the full untrusted token bytes through split, base64url and JSON
  parsing, rather than a test-only intermediate payload parser. sts_credentials_missing: Missing Credentials/required
  fields/PackedPolicySize, local read errors and SDK Session construction failures propagate; no ambient fallback
  in any owned helper. B594 alone decides whether a rejected AssumeRole may fall back. invalid_identity_token_error:
  Only SDK InvalidIdentityTokenException maps to AwsAuthError401 AWS STS rejected the web identity token: <exception>.<optional
  detail>, where detail is a leading space followed by Token aud=<repr>, iss=<repr> only when the input is string
  with reportable claims. Preserve original exception cause. Other STS exceptions propagate unchanged; no fabricated
  param/code. packed_policy_warning_and_ttl: Read mandatory Credentials fields and mandatory PackedPolicySize. Warn
  The policy size is greater than 75% of the allowed size, PackedPolicySize: <value> only when value > integer BEDROCK_MAX_POLICY_SIZE
  env default75; equality does not warn and literal75% stays unchanged if threshold configured. SDK Session uses
  access/secret/token and region_name; get_credentials result returns with B5903540-second TTL regardless of response
  Expiration.


  Load BEDROCK_MAX_POLICY_SIZE through betterlite-config, with injected environment lookup and the defaults/precedence
  stated here. Deployment inputs use litellm_params and global inputs use litellm_settings. Add config rstest bedrock_web_identity_config_cases;
  each named loads_<key> case invokes the real B002 loader, checks explicit values and defaults, and adds config_yaml
  parser seeds. Reject unrelated keys.


  Implement crates/betterlite-bedrock/src/web_identity.rs with adjacent tests under web_identity/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function web_identity_cases in betterlite-bedrock with these exact named cases (one per oracle file):
  jwt_audience_hint, web_identity_assume_role, secure_transport_session_policy, same_account_irsa, cross_account_irsa,
  malformed_token, sts_credentials_missing, invalid_identity_token_error, packed_policy_warning_and_ttl. Each case
  exercises its named outcome independently; use stable supplied clocks/IDs and fixture transports. Existing API
  tasks retain route registration; this task must not register a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_web_identity* using HelperCase: kind:
  helper and the externally tagged bedrock_web_identity variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_bedrock_web_identity that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  Outside-byte boundary: decode_web_identity_claims consumes base64url JWT payload bytes used solely for audience
  diagnostics in crates/betterlite-bedrock/src/web_identity.rs (or its scoped child module). Add cargo-fuzz target
  crates/betterlite-bedrock/fuzz/fuzz_targets/bedrock_web_identity.rs calling that exact production function, with
  new valid, malformed, truncated and boundary seeds under crates/betterlite-bedrock/fuzz/corpus/bedrock_web_identity.
  The adjacent test replays_the_bedrock_web_identity_corpus uses the same function and asserts expected success/failure
  categories; never introduce a parser solely for fuzzing.


  The owned credential boundary also has separate Rust cases credential_identity_isolation (two distinct configured
  identities cannot reuse the other identity/header/cache entry) and secret_safe_failure (the owned failure path
  and Debug do not expose fixture secrets). Exercise the credential inputs this slice actually handles; do not invent
  a cache for a stateless header mapper.


  Write standalone bedrock_web_identity_credential_identity_isolation in betterlite-bedrock for this Rust-specific
  invariant; it is not a Python oracle case.


  Write standalone bedrock_web_identity_secret_safe_failure in betterlite-bedrock for this Rust-specific invariant;
  it is not a Python oracle case.


  Budget from 167 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 245 production lines, 260 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 60 parser target/replay lines, 35 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 735 planned, 750 maximum changed lines.
