    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_cross_account_irsa$/)'
  - id: case-malformed-token
    why: Wrong segment count, base64/JSON errors or invalid aud/iss types return None; do not turn diagnostic parsing
      failure into a second authentication failure. Fuzz decode_web_identity_claims using the full untrusted token
      bytes through split, base64url and JSON parsing, rather than a test-only intermediate payload parser.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_malformed_token$/)'
  - id: case-sts-credentials-missing
    why: Missing Credentials/required fields/PackedPolicySize, local read errors and SDK Session construction failures
      propagate; no ambient fallback in any owned helper. B594 alone decides whether a rejected AssumeRole may fall
      back.
    run: cargo nextest run --locked -p betterlite-bedrock --no-tests=fail -E 'test(/::web_identity_cases::case_[0-9]+_sts_credentials_missing$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_web_identity.py)" && uv run
      --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_web_identity*")"
      && grep -lq 'bedrock_web_identity' tools/oracle/fuzz/corpus/helper_case/bedrock_web_identity* && cargo nextest
      run --locked -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_web_identity$/)'
      && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: parser-corpus
