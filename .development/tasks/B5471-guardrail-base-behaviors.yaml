id: B5471
title: Guardrail base settings and shared behaviors
description: >-
  Add the module `guardrail_base` to betterlite-guardrails and the config section `guardrail_modes`. LiteLLM's `CustomGuardrail` is a base class every guardrail inherits, and Rust has no inheritance, so this task builds the same things as a settings struct, a value that owns them, a failure enum and a trait. Later guardrail tasks build on them. Request bodies are `BTreeMap<String, GuardrailValue>` with `GuardrailValue` and `GuardrailFlag` from `betterlite_config::sections::guardrail_identity::item`. `LitellmParams`, `LitellmParamsMode`, `Mode`, `ModeTarget` and `GuardrailEventHooks` come from B3662's `sections::guardrail_params`.

  The section `guardrail_modes` reads the env var `LITELLM_STRICT_GUARDRAIL_MODES` through `lookup.lookup` and gives `Settings { strict: bool }`, default true. Follow `sections/mcp_tool_helpers.rs` for the shape. Trim the text and lowercase it: `true` is true, `false` is false, and an unset var or any other text stays strict. Don't use `betterlite_env::flag`, since it also accepts `1`, `yes` and `on`, and LiteLLM's `str_to_bool` treats those as unparsable. Callers pass `config.sections.guardrail_modes.strict` into `GuardrailBase::new`.

  `GuardrailSettings` holds the constructor arguments as public fields: `guardrail_name: Option<String>`, `supported_event_hooks: Option<Vec<GuardrailEventHooks>>`, `event_hook: Option<LitellmParamsMode>`, `default_on`, `mask_request_content`, `mask_response_content`, `violation_message_template: Option<String>`, `end_session_after_n_fails: Option<i64>`, `on_violation: Option<String>`, `realtime_violation_message: Option<String>`, `on_sensitive_data: Option<String>`, `sensitive_data_route_to_model: Option<String>`, `sticky_session_routing`, `run_in_parallel`, `scan_raw_request`, `only_scan_new_messages`, `timeout: Option<f64>` and `switches: GuardrailSwitches`. The flags are `GuardrailFlag`, like the existing kwargs struct, because `clippy::struct_excessive_bools` is denied. A hand-written `Default` sets `sticky_session_routing` to true and every other flag to false. `GuardrailSwitches` (derives Default, all `GuardrailFlag`) stands in for what a Python subclass sets on itself: `use_native_during_call_hook`, `use_native_lifecycle_hooks`, `records_own_information` (LiteLLM's `records_own_guardrail_information`), `uses_apply_guardrail_interface` (LiteLLM compares the method to the base one, a Rust guardrail just sets this) and `deny_text_on_error` (LiteLLM looks for `CustomCodeGuardrail` in the class name).

  `GuardrailBase { pub settings: GuardrailSettings, pub mode: Option<LitellmParamsMode> }` is built by `GuardrailBase::new(settings: GuardrailSettings, strict_modes: bool) -> Result<Self, GuardrailBaseError>`. When `supported_event_hooks` is a non-empty list, `new` calls `validate_event_hook(event_hook: Option<&LitellmParamsMode>, supported: &[GuardrailEventHooks], switches: &GuardrailSwitches) -> Result<(), GuardrailBaseError>`. A validation error is returned when `strict_modes` is true. Otherwise `new` logs one `tracing::warn!` with the text `{error}. LITELLM_STRICT_GUARDRAIL_MODES=false; continuing with unsupported event_hook. Set the env var to true (default) to enforce validation and fail at startup.` and goes on. The allowed set is `supported`, plus `logging_only` when `uses_apply_guardrail_interface` is on and `use_native_lifecycle_hooks` is off. A missing hook and an empty list pass. `One` and `Many` check each text. `Tagged` checks every tag value, with lists flattened, and then checks `default` only when it is present and non-empty. Text that names no hook gives `GuardrailBaseError::UnknownEventHook` with the message `'{hook}' is not a valid GuardrailEventHooks`. A real hook outside the allowed set gives `GuardrailBaseError::UnsupportedEventHook` with the message `Event hook {hook} is not in the supported event hooks [{supported}]`, printing wire names joined by `, ` from the `supported` list as given, so without the added `logging_only`.

  `GuardrailBase::update_params(&mut self, params: &LitellmParams)` is LiteLLM's `update_in_memory_litellm_params`. It overwrites `default_on`, `mask_request_content`, `mask_response_content`, `violation_message_template`, `end_session_after_n_fails`, `on_violation`, `realtime_violation_message`, `on_sensitive_data`, `sensitive_data_route_to_model`, `sticky_session_routing`, `run_in_parallel`, `scan_raw_request`, `only_scan_new_messages` and `timeout` from `params.base.fields`, even where the params hold only their default: an empty optional clears the setting and an empty optional bool writes false. `on_violation` and `on_sensitive_data` are enums in B3662, so write their wire names. It sets `self.mode` to `params.mode`. It does not touch `guardrail_name`, `event_hook`, `supported_event_hooks` or `switches`.

  `GuardrailFailure` is the error a guardrail hook returns, with one variant per LiteLLM exception that the status logic has to tell apart: `ModifyResponse`, `GuardrailRaised`, `BlockedPii`, `SensitiveDataRoute`, `Http { status: u16, detail: String }` and `Other(String)`. Fields follow the exception constructors in the references, with `detection_info: BTreeMap<String, GuardrailValue>`, `request_data` as a map and `original_response: Option<GuardrailValue>`. It implements `std::error::Error`, and Display prints the exception's text: `Guardrail raised an exception, Guardrail: {guardrail_name}, Message: {message}` when the field `wrap_default_message` (LiteLLM's `should_wrap_with_default_message`) is true and the bare message when false, `Blocked entity detected: {entity_type} by Guardrail: {guardrail_name}. This entity is not allowed to be used in this request.`, the `message` of a ModifyResponse, the given message of a SensitiveDataRoute or its default `Sensitive data detected by {guardrail_name}. Routing to model: {route_to_model}`, the `detail` of `Http`, and the text of `Other`. Status codes default to 400 at the call site. `is_intervention(&self) -> bool` is one `match`: the first four variants are true, `Http` is true only for 400, 403 and 422, and `Other` is false.

  `GuardrailApiInputs` is LiteLLM's `GenericGuardrailAPIInputs`, with Default, Serialize and Deserialize, every field optional and left out when absent: `texts` and `images` (`Vec<String>`), `tools` (`Vec<GuardrailToolParam>`), `tool_calls` (`Vec<GuardrailExtraValue>`), `structured_messages` (`Vec<GuardrailMessage>`), `model` (`String`) and `stream_holdback_chars` (`i64`). The element types are in `generic_guardrail_contracts`. `GuardrailLogTarget { litellm_params: Option<BTreeMap<String, GuardrailValue>>, model_call_params: Option<BTreeMap<String, GuardrailValue>> }` stands in for the two dicts on LiteLLM's logging object. B3664 writes to it.

  `GuardrailContract: Sync` is the trait a guardrail implements. `apply_guardrail(&self, inputs: GuardrailApiInputs, request_data: &mut BTreeMap<String, GuardrailValue>, input_type: GuardrailInputType, logging_obj: Option<&mut GuardrailLogTarget>) -> impl Future<Output = Result<GuardrailApiInputs, GuardrailFailure>> + Send` returns `inputs` unchanged by default. `get_config_model(&self) -> Option<GuardrailValue>` and `get_supported_event_hooks(&self) -> Option<Vec<GuardrailEventHooks>>` default to `None`, `supports_tool_result_scan(&self) -> bool` (LiteLLM's `supports_scan_only_tool_results`) to true and `messages_cover_full_request(&self) -> bool` (LiteLLM's `structured_messages_cover_full_request`) to false. The shorter names keep to the 30-character rule.

  Methods on `GuardrailBase`. `render_violation_message(&self, default: &str, context: &[(&str, &str)]) -> String` returns `default` when the template is missing or empty. Otherwise it formats the template with `strfmt::strfmt_map`, with the key `default_message` set to `default` and `context` entries overriding it. When formatting fails it warns `Failed to format violation message template for guardrail {name}: {error}` and returns `default`. `panw_prisma_airs/error_detail.rs` has a local version to follow. `passthrough_failure(&self, message: &str, request_data: &BTreeMap<String, GuardrailValue>, detection_info: Option<BTreeMap<String, GuardrailValue>>, original_response: Option<GuardrailValue>) -> GuardrailFailure` returns `ModifyResponse` carrying a copy of the body, the guardrail name, the body's `model` text or `unknown` when it has no `model` key, and an empty map for missing detection info. LiteLLM raises here, and the caller returns this value as its `Err`.

  Free items. `DEFAULT_ADVISORY_MESSAGE` holds LiteLLM's text with its `{reason}` placeholder. `inject_advisory_message(data: &mut BTreeMap<String, GuardrailValue>, message: &str) -> bool` tries these in order, with the advisory object being `{"role": "system", "content": message}`. A string `instructions` gets `\n\n` and the message appended, a `messages` list also gets the advisory object appended, and the result is true. Otherwise a string `input` does the same. Otherwise a non-null `input` of any other shape returns false and changes nothing. Otherwise a `messages` list gets the advisory appended and the result is true. Otherwise `messages` is set to a list of only the advisory and the result is true. `mask_content_in_string(content: &str, mask: &str, start: i64, end: i64) -> String` counts in code points and returns `content` unchanged unless `0 <= start < end <= length`. `session_id_from_request(data: &BTreeMap<String, GuardrailValue>) -> Option<String>` is LiteLLM's `get_session_id_from_request_data`. It tries `litellm_session_id`, then `session_id` inside `metadata`, then `session_id` inside `litellm_metadata`, skips null and empty text, and returns integers as decimal text.

  The task's oracle helper takes `function` and that function's arguments, and it compares results only: for event hook validation the answer is accepted or rejected, not the message. Copy each helper case into `tools/oracle/fuzz/corpus/helper_case/` with the prefix `guardrail_base-`. Native tests live in `guardrail_base::tests` with the name prefixes in the check filters below, and the section's tests in `sections::guardrail_modes`.
