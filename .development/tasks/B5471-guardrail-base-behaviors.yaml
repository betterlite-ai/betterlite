  - tools/oracle/cases/helpers/guardrail-base/failure-intervention.yaml
  - tools/oracle/cases/helpers/guardrail-base/violation-template.yaml
  - tools/oracle/cases/helpers/guardrail-base/violation-bad-key.yaml
  - tools/oracle/cases/helpers/guardrail-base/passthrough-failure.yaml
  - tools/oracle/cases/helpers/guardrail-base/advisory-injection.yaml
  - tools/oracle/cases/helpers/guardrail-base/advisory-list-input.yaml
  - tools/oracle/cases/helpers/guardrail-base/mask-content.yaml
  - tools/oracle/cases/helpers/guardrail-base/session-id.yaml
deviations:
  - what: A `violation_message_template` using `str.format` features beyond named fields and width or alignment specs (`{a!r}`, `{a.b}`, `{a[0]}`) renders the default message, where LiteLLM would expand them.
    why: strfmt, already used by panw_prisma_airs, has no such syntax, and a template that fails to format takes LiteLLM's own fallback to the default.
  - what: "`get_config_model` returns an opaque `GuardrailValue` in place of a Pydantic class."
    why: Rust has no class to return, and the default is `None` until a provider fills it in.
out_of_scope:
  - handle_sensitive_data_detection, should_route_on_sensitive_data, raise_sensitive_data_route_exception and _get_session_id_from_request_data have no caller at the pin, so they are not built. The `SensitiveDataRoute` variant stays because the intervention rule names it.
  - B3664 owns add_standard_logging_guardrail_information_to_request_data, _process_response, _summarize_guardrail_response, _process_error, _inputs_were_modified, get_guardrails_messages_for_call_type, _append_slg_to_litellm_params, _sync_guardrail_info_to_logging_obj, _original_inputs_for, log_guardrail_information and the role of __init_subclass__.
  - B3665 owns should_run_guardrail, _event_hook_is_event_type, get_guardrail_from_metadata, _guardrail_is_in_requested_guardrails, _get_admin_metadata, get_disable_global_guardrail, get_opted_out_global_guardrails_from_metadata, _suppressed_by_auto_router_compression, get_guardrail_dynamic_request_body_params and _validate_premium_user.
  - B3666 owns _scanned_text_hash, _scanned_texts_cache_key, filter_new_texts_for_session, mark_texts_scanned, _pre_call_marker, mark_pre_call_hook_ran, _pre_call_hook_already_ran, _PRE_CALL_EXECUTED_TOKEN, dc, _deployment_hook_target, async_pre_call_deployment_hook, async_pre_call_hook_on_messages, async_post_call_success_deployment_hook, async_logging_hook, _scan_logged_call, _is_valid_response_type, _user_api_key_auth_from_request and _unified_hook_fields.
  - Turning a GuardrailFailure into an HTTP error body. The route and hook tasks map it to `betterlite_error` types, and betterlite-guardrails doesn't depend on that crate.
  - A user's own Python guardrail class. B164 covers that.
pitfalls:
  - "`GuardrailBaseInitKwargs` derives Default, so its `sticky_session_routing` is false while LiteLLM's default is true, and that is why `GuardrailSettings` has its own Default. Don't wrap the kwargs struct."
  - Don't port the Python enum repr in the validation message. `{hook}` prints the wire name such as `post_call`, and the oracle compares only accepted or rejected.
  - The `Mode.default` check is skipped for an empty list too, because LiteLLM tests truthiness there, while `tags` values are always checked.
  - HTTP 401, 408 and 429 are outside the block set on purpose, they are provider trouble and must not count as an intervention, and only 400, 403 and 422 do.
  - Both the instructions branch and the string input branch return true right after writing, so a request with both gets the note in `instructions` only, and `input` stays as it was.
  - A list `input` wins over a `messages` list and gives false, because that endpoint reads only `input` and the caller has to fall back to blocking.
  - Python slices strings by code point, so `mask_content_in_string` must not use byte offsets, and `start` and `end` are signed because providers send them as plain JSON numbers.
  - "`update_in_memory_litellm_params` sets `mode` and never `event_hook`, so a later `event_hook` read still sees the constructor's value."
  - "`GuardrailFailure` carries a whole request body, so box the big variants or `clippy::result_large_err` fails every function returning it."
  - The new module sits next to the local `render_violation_message` in panw_prisma_airs. B3811 and other tasks keep that copy for now, so leave it alone.
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
