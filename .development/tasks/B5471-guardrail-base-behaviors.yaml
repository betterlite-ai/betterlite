dod:
  - text: LITELLM_STRICT_GUARDRAIL_MODES unset, set to `TRUE`, or set to `1` or `off` leaves `strict` true, and ` False ` makes it false, in a named section test.
    proof: [modes-section-tests]
  - text: validate_event_hook passes a missing hook, an empty list and a hook in the supported list, and rejects an unsupported single hook, one bad entry in a list, a bad tag value inside a tag list and a bad non-empty `default`.
    proof: [validate-hook-tests, oracle, helper-python]
  - text: A `Tagged` mode with an empty or missing `default` skips the default check, and text that names no hook is `UnknownEventHook`.
    proof: [validate-hook-tests]
  - text: "`logging_only` is allowed only when `uses_apply_guardrail_interface` is on and `use_native_lifecycle_hooks` is off, and the error message lists the supported hooks without it."
    proof: [validate-hook-tests]
  - text: GuardrailBase::new returns the validation error when strict, succeeds when not strict, and validates nothing when the supported list is missing or empty.
    proof: [validate-hook-tests]
  - text: Default settings have `sticky_session_routing` true and every other flag false, and new keeps `timeout` as given.
    proof: [contract-tests]
  - text: is_intervention is true for the four guardrail variants and for HTTP 400, 403 and 422, and false for HTTP 401, 408, 429, 500 and `Other`.
    proof: [failure-tests, oracle, helper-python]
  - text: Display prints the wrapped and unwrapped GuardrailRaised text, the BlockedPii text and both SensitiveDataRoute forms.
    proof: [failure-tests]
  - text: render_violation_message returns the default with no or empty template, fills `default_message` and context keys, lets context override `default_message`, and returns the default for a template naming an unknown key.
    proof: [violation-tests, oracle, helper-python]
  - text: passthrough_failure carries the message, the guardrail name and the body's model, uses `unknown` with no model key, an empty map with no detection info, and the original response when given.
    proof: [passthrough-tests, oracle, helper-python]
  - text: inject_advisory_message follows the order instructions, string input, other input, messages, new messages, updates `messages` in the first two cases when it is a list, and returns false with data unchanged for a list input.
    proof: [advisory-tests, oracle, helper-python]
  - text: mask_content_in_string counts code points, so a mask after a multi-byte character lands right, and it returns the text unchanged for a negative start, start equal to end and end past the length.
    proof: [mask-tests, oracle, helper-python]
  - text: update_params overwrites listed fields with the params' defaults, clears a template the params leave empty, sets `mode`, and leaves `event_hook` and `guardrail_name` alone.
    proof: [update-tests]
  - text: session_id_from_request follows the three sources in order, skips empty values and returns an integer as text.
    proof: [session-tests, oracle, helper-python]
  - text: The default GuardrailContract returns its inputs unchanged, `None` from both lookups, true from supports_tool_result_scan and false from messages_cover_full_request.
    proof: [contract-tests]
  - text: GuardrailApiInputs writes only the fields that are set and reads back the same value.
    proof: [contract-tests]
  - text: Newly added helper corpus cases replay through the shared helper case parser.
    proof: [helper-case-corpus]
checks:
  optional: [mutants]
  commands:
    - id: modes-section-tests
      why: the strict switch is missing or accepts text LiteLLM rejects
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^sections::guardrail_modes::/)'
    - id: validate-hook-tests
      why: event hook validation or the strict and warning paths of new are wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::validate_hook_/)'
    - id: failure-tests
      why: the failure text or the intervention rule is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::failure_/)'
    - id: violation-tests
      why: template rendering or its fallback to the default is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::violation_/)'
    - id: passthrough-tests
      why: the passthrough failure loses its model, name or detection info
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::passthrough_/)'
    - id: advisory-tests
      why: the advisory lands in the wrong field or a list input is changed
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::advisory_/)'
    - id: mask-tests
      why: masking cuts at byte offsets or ignores the bounds
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::mask_/)'
    - id: update-tests
      why: updating params skips defaults or touches the wrong fields
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::update_/)'
    - id: session-tests
      why: the session id source order is wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::session_/)'
    - id: contract-tests
      why: the settings defaults, trait defaults or inputs shape are wrong
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/^guardrail_base::tests::contract_/)'
    - id: helper-python
      why: the strict oracle adapter lint or type checks fail
      run: >-
        test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/b5471)" &&
        uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers/b5471 &&
        uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/b5471/pyrightconfig.json
    - id: helper-case-corpus
      why: newly added guardrail base cases are absent or do not replay
      run: >-
        test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/guardrail_base-*")" &&
        grep -lE '^[[:space:]]+b5471:' tools/oracle/fuzz/corpus/helper_case/guardrail_base-* &&
        test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs &&
        cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
