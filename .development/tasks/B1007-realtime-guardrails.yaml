id: B1007
title: Realtime guardrail execution
description: >-
  Own the whole run_realtime_guardrails method at 809-941 in
  betterlite-core::api::realtime_guardrails. B2455 owns callback detection/setup policy; B1110
  owns all backend sends, so guardrail-injected messages receive the same provider transformations
  as client messages. Use B104 callback descriptors and apply_guardrail, plus B1006 connection state.
  Default event_hooks is [realtime_input_transcription]; an explicitly empty list runs none.
  item_id defaults None and is unused. pre_block_backend_message defaults None.

  Merge request_data with transcript for should_run_guardrail; invoke each distinct eligible
  CustomGuardrail object once per call, skipping native lifecycle hooks and nonmatching callbacks.
  apply_guardrail receives inputs={texts:[transcript],images:[]},request_data={user_api_key_dict:principal},
  input_type=request. Its returned transformed text is ignored. A status_code attribute or ValueError
  denotes a policy block; an exception with detail alone does not. Stop after the first block.

  Run B901 service realtime_guardrails against a mock WebSocket, using deterministic callback inputs
  and captured client/backend frames. Preserve exact ordering of sanitized tool result, cancellation,
  client notice, spoken-message request and response.create. Native fault tests cover unexpected
  exceptions and close failures. These operations do I/O and do not belong in B171 helpers. Source
  contains110 nonblank/non-comment lines; allow115 implementation,135 tests,125 transcripts,95 adapters
  and 30 wiring, 500 changed lines. B1004 owns all message decoding.
scope:
  paths:
  - crates/betterlite-core/src/api.rs
  - crates/betterlite-core/src/api/realtime_guardrails.rs
  - crates/betterlite-core/src/api/realtime_guardrails/**
  - tools/oracle/src/websocket_driver.rs
  - tools/oracle/src/websocket_driver/realtime_guardrails.rs
  - tools/oracle/src/helpers/core_ops/realtime_guardrails.rs
  - tools/oracle/src/helpers/core_ops/realtime_guardrails/**
  - tools/oracle/helpers/realtime_guardrails.py
  - tools/oracle/helpers/realtime_guardrails/**
  - tools/oracle/cases/websocket/realtime-guardrails/**
  - tools/oracle/fuzz/corpus/websocket_oracle/realtime-guardrails-*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/realtime_streaming.py#L809-L941
  why: Complete callback invocation, block classification, message extraction and ordered send/close effects.
dod:
- text: >-
    realtime_guardrail_selection_and_clean_result supplies duplicate references to one callback, a
    native-lifecycle callback, a non-guardrail callback and a false predicate. Only the eligible object
    runs once with transcript=hello and the precise input records above; clean completion returns false,
    sends no frame and leaves violation_count=0. Explicit event_hooks=[] runs nothing. With hooks=[pre_call],
    selection uses pre_call instead of realtime_input_transcription. A returned replacement text is ignored.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_guardrail_block_sequence raises ValueError(denied) with optional pre_block_backend_message=tool-safe.
    Expect backend tool-safe then {type:response.cancel}; client {type:error,error:{type:guardrail_violation,
    message:denied,code:content_policy_violation}}; backend conversation.item.create with item.type=message,
    role=user,content=[{type:input_text,text:"Say exactly the following message to the user, word for word,
    do not add anything else: denied"}], then {type:response.create}. Return true, increment violations to1
    and do not execute later callbacks. No item_id,param or event_id is added to the notice.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_guardrail_message_precedence tests realtime_violation_message=custom ->custom; empty override
    falls through to detail.error when truthy, otherwise str(exception). Nondict nonnull detail is stringified;
    no detail and empty ValueError yields "I'm sorry, that request was blocked by the content filter.".
    A dict detail with nonstring error retains that value in the client message and formats it in the prompt,
    rather than silently rewriting the callback's result. A RuntimeError with only detail is unexpected,
    logs "[realtime guardrail] unexpected error in apply_guardrail: %s" and rethrows with no synthetic frames.
  proof: [behavior-tests, oracle, service-python]
- text: >-
    realtime_guardrail_end_session closes backend after the synthetic response.create when on_violation=end_session,
    or when count reaches end_session_after_n_fails (None means no threshold;0 closes on first violation).
    At threshold2 the first block stays open and the second closes, logging "[realtime guardrail] ending
    session after violation %d". Every completed block logs "[realtime guardrail] BLOCKED transcript
    (violation %d): %r" with only the first80 transcript characters. Send failure before count increment
    leaves count unchanged; close failure occurs after increment and propagates, skipping the final blocked log.
    No client close is performed directly by this method.
  proof: [behavior-tests, oracle, service-python]
- text: Guardrail execution has fresh WebSocket service cases and decoder seeds.
  proof: [service-corpus, new-cases, oracle, service-python]
checks:
  optional: []
  commands:
  - id: behavior-tests
    why: Block classification and ordered effects must not be reduced to a boolean callback result.
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^api::realtime_guardrails::tests::/)'
  - id: service-python
    why: The pinned guardrail runner must send to the independent mock WebSocket.
    run: test -f tools/oracle/helpers/realtime_guardrails_websocket.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: service-corpus
    why: Guardrail service calls need bounded, newly added WebSocket parser seeds.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/websocket_oracle/realtime-guardrails-*)" && cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/^websocket_oracle::tests::replays_corpus$/)'
  - id: new-cases
    why: Every policy outcome must have a newly recorded send sequence.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/websocket/realtime-guardrails)"
oracle_cases:
- tools/oracle/cases/websocket/realtime-guardrails/realtime-guardrail-selection-and-clean-result.yaml
- tools/oracle/cases/websocket/realtime-guardrails/realtime-guardrail-block-sequence.yaml
- tools/oracle/cases/websocket/realtime-guardrails/realtime-guardrail-message-precedence.yaml
- tools/oracle/cases/websocket/realtime-guardrails/realtime-guardrail-end-session.yaml
deviations: []
out_of_scope:
- B2455 owns callback predicates and setup modifications; _has_realtime_guardrails has no caller at the pin. B1110 owns _maybe_send_guardrail_turn_detection_update and all sends.
- B1004 contracts, B1005 beta mappings, B1006 logging/state, B1124 buffering, B1008 backend relay and B1009 client relay own the rest of realtime_streaming.py.
pitfalls:
- 'The oracle helper for this task is pre-registered as realtime_guardrails in the core_ops group. Replace the stub Op in tools/oracle/src/helpers/core_ops/realtime_guardrails.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/realtime_guardrails.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- An exception having detail but no status_code is not necessarily a policy block; only ValueError gets that special treatment.
- Duplicate callback objects run once, but two different objects with the same configured name can both run.
- A blocked tool result must reach the backend before response.cancel or any synthetic user message.
review_level: security
budget:
  max_changed_lines: 500
  max_new_expects: 0
