pitfalls:
  - 'The oracle helper for this task is pre-registered as model_group_data in the server group. Replace the stub Op in tools/oracle/src/helpers/server/model_group_data.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/model_group_data.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
  - ID-based tagging validates each row immediately before its write, so a later missing ID leaves earlier tags committed.
  - Removing one duplicate group tag leaves the remaining occurrence, and discovery counts both occurrences separately.
