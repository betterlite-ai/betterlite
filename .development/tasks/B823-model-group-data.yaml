id: B823
title: Model access-group deployment and budget helpers
description: >-
  Implement the model-group data services consumed by B824/B825. B725 owns ModelRepository, B726 the
  group-budget table, B733 cache-key construction, B878 eviction, B832 API records, B841 model-info
  parsing/reload verdicts and B844 router name lookup. _prisma_client_or_500 raises HTTPException 500
  detail.error="Database not connected."; _http_error always uses that detail.error shape. Budget
  lookups include litellm_budget_table, and listing maps every row by access_group_name in one query.
  Projection preserves group/name/count fields and stored spend, using 0.0 only with no group-budget
  row; no joined budget gives budget=null even when budget_id is set. Otherwise expose budget_id,
  max_budget, soft_budget, budget_duration and budget_reset_at without inventing defaults. Own the
  flattened ModelAccessGroupBudget record (required name, spend=0.0, max_budget=null) and local protocol/
  filter declarations. Cases budget_join_missing_vs_present and flattened_budget_defaults prove these values.

  Deleting a group-budget row leaves LiteLLM_BudgetTable untouched. After a completed delete, evict
  ("model_access_group:<name>", "model_access_group_registry") unconditionally, even if delete returned
  None, then return whether it returned a row. A thrown delete prevents eviction; an eviction failure
  leaves deletion committed. Native budget_delete_retains_shared_row, absent_row_still_evicts and
  budget_delete_failure_order cover these stages. Group existence is based on deployment tags from
  get_all_access_groups_from_db, not on a budget row; missing groups raise 404 "Access group '<name>' not found".

  validate_models_exist checks exact B844 router model names; no router returns (false, original inputs),
  and missing names preserve request order/duplicates. Read-through attempts every initially missing name
  sequentially via B124 model_registry_read_through, then rechecks against the current proxy_server router,
  since it may have been rebound. Empty missing lists do no work; failures propagate. Native
  readthrough_order_and_rebound_router and readthrough_failure_no_write plus pure exact_model_names
  cover these paths. Read-through settings remain with B124; this task reads no env/config key.

  Add/remove helpers mutate the supplied model_info dictionary/list. Absent access_groups starts as [];
  adding an existing entry does nothing, adding appends, removing deletes only the FIRST matching
  occurrence and keeps an empty access_groups field. Do not silently repair null or malformed lists.
  _readable_model_info_or_raise accepts mappings or JSON objects via B841, treats raw None as {}, but
  raises ValueError "model_info for deployment <id> is not a readable JSON object; refusing to rewrite it"
  for any present unreadable value. Tag/strip copy that mapping shallowly, skip unchanged writes, otherwise
  JSON-serialize the entire updated model_info, write only that column and return (id,updated mapping).
  Tag writes debug-log success; all unrelated model_info, including stored ciphertext, remains unchanged;
  litellm_params/credentials are never rewritten. Cases add_idempotent_remove_first, malformed_groups,
  readable_json_or_absent, unreadable_refuses_write and preserve_other_model_info cover the transforms.

  Name-based updates fetch all DB deployments whose model_name is in the request and check EVERY
  requested name has a DB row before tagging any. The first missing name gives 400 "Can't find model
  '<name>' in Database. Access group management is only supported for database models.". Then write
  sequentially in query order, returning modified pairs only. ID-based updates instead look up and tag
  each ID in request order; missing rows give 400 "Deployment with model_id '<id>' not found in Database."
  after any earlier writes. Neither path is transactional. Cases names_validate_all_before_writes,
  ids_partial_write_on_missing, duplicate_id_rechecks and later_tag_failure preserve these differences.

  get_all_access_groups_from_db reads every model row and uses model_info-or-{} directly as a dictionary,
  without the readable JSON normalization above. Iterate each access_groups occurrence, including
  duplicates; return sorted unique model_names but deployment_count counts occurrences. Malformed
  truthy model_info/group lists raise rather than being logged and dropped. Cases group_count_duplicates
  and discovery_bad_row_failure prove this. Reload degradation delegates to B841 with written_must_serve=false:
  only previously live written models that disappear, plus still-desired collateral drops, are failures.
  Deduplicate missing-then-collateral IDs and raise 500 detail.error saying the group was saved in the DB,
  listing those IDs, that other pods reload on their own interval, and to inspect 'Error upserting deployment'.
  Already-dead written models pass. Cases reload_metadata_only, reload_collateral_and_order and
  reload_saved_but_not_live assert the complete L361-L365 message; live_after=None retains B841's fresh
  snapshot behavior, tested natively as reload_snapshot_fallback.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/management_endpoints/model_access_group_management_endpoints.py:
  _http_error (L95-L97; 3 source lines), _DeploymentRow.model_id (L102-L102; 1 source lines), _DeploymentRow.model_name
  (L105-L105; 1 source lines), _DeploymentRow.model_info (L108-L108; 1 source lines), _ModelTableClient.find_many
  (L112-L112; 1 source lines), _ModelTableClient.find_unique (L114-L114; 1 source lines), _ModelTableClient.update
  (L116-L116; 1 source lines), _BudgetRow.budget_id (L121-L121; 1 source lines), _BudgetRow.max_budget
  (L124-L124; 1 source lines), _BudgetRow.soft_budget (L127-L127; 1 source lines), _BudgetRow.budget_duration
  (L130-L130; 1 source lines), _BudgetRow.budget_reset_at (L133-L133; 1 source lines), _ModelAccessGroupBudgetRow.access_group_name
  (L138-L138; 1 source lines), _ModelAccessGroupBudgetRow.spend (L141-L141; 1 source lines), _ModelAccessGroupBudgetRow.budget_id
  (L144-L144; 1 source lines), _ModelAccessGroupBudgetRow.litellm_budget_table (L147-L147; 1 source lines),
  _ModelAccessGroupBudgetTableClient.find_unique (L151-L153; 3 source lines), _ModelAccessGroupBudgetTableClient.upsert
  (L155-L161; 7 source lines), _ModelAccessGroupBudgetTableClient.find_many (L163-L165; 3 source lines),
  _ModelAccessGroupBudgetTableClient.delete (L167-L167; 1 source lines), _model_table (L170-L171; 2 source
  lines), _model_access_group_budget_table (L174-L175; 2 source lines), _prisma_client_or_500 (L178-L183;
  5 source lines), _auth_cache (L186-L189; 3 source lines), _evict_model_access_group_cache_keys (L192-L205;
  13 source lines), _model_access_group_budget_row (L208-L213; 6 source lines), _model_access_group_budget_rows
  (L216-L223; 8 source lines), _with_budget (L226-L235; 10 source lines), _budget_or_none (L238-L248;
  11 source lines), _budget_response (L251-L256; 6 source lines), _delete_model_access_group_budget_row
  (L259-L273; 14 source lines), _raise_404_if_model_access_group_missing (L276-L279; 4 source lines),
  validate_models_exist (L282-L295; 12 source lines), _missing_models_after_read_through (L298-L312; 14
  source lines), add_access_group_to_deployment (L315-L336; 15 source lines), _raise_http_if_reload_degraded_serving
  (L339-L370; 32 source lines), _tag_deployment_with_access_group (L373-L393; 21 source lines), _readable_model_info_or_raise
  (L396-L403; 8 source lines), _strip_access_group_from_deployment (L406-L425; 20 source lines), update_deployments_with_access_group
  (L428-L467; 36 source lines), update_specific_deployments_with_access_group (L470-L493; 23 source lines),
  _find_deployment_or_400 (L496-L503; 8 source lines), remove_access_group_from_deployment (L506-L527;
  15 source lines), get_all_access_groups_from_db (L530-L566; 28 source lines).


  B856's helper operation invokes only pure budget projections, add/remove, readable-model-info and
  reload verdicts with explicit live_after/still_desired snapshots, plus exact-name checks on a supplied
  catalog. SQL, cache and global read-through paths use native Postgres tests. B171 owns helper-case
  decoding; B841 already owns the stored model_info byte boundary, so do not add a second JSON parser.


  Tagging and joined-budget tests run against B860's POSTGRES_TEST_URL database or testcontainers when
  the variable is absent; fail setup errors and retain earlier deployment writes when a later ID is missing.


  Sizing: 348 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  300 production (the source total includes protocol and function documentation), 370 behavior/Postgres
  tests, 70 helper adapters, 30 wiring, 0 decoder/fuzz and 0 config lines, 770 within an 800-line gate.
