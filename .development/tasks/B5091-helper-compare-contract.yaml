references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py
  why: >-
    LiteLLM's exceptions carry status_code, llm_provider and a message that names the library; clients branch on the
    status and codes, and the class name is Python's own.
dod:
- text: Two helper outputs that differ only in the error's class or message, or only in a warning's message, match.
  proof:
  - helper-comparison
- text: >-
    Two helper outputs that differ in ok, value, the error's status, type, param or code, a warning's subject, the
    warnings' order or an effect do not match, and the Difference pointer names that field.
  proof:
  - helper-comparison
- text: A helper case that lists /error/class or /error/message in compare.ignore fails with a Difference that names the pointer.
  proof:
  - helper-comparison
- text: No helper case lists /error/class or /error/message in compare.ignore, and HTTP cases keep theirs.
  proof:
  - no-skipped-ignores
- text: The 63 rewritten helper cases still match LiteLLM.
  proof:
  - oracle
checks:
  optional: []
  commands:
  - id: helper-comparison
    why: helper comparisons still compare the class or a message, stop comparing a code, or accept an ignore of a skipped field
    run: cargo nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(/helper_comparison_|detects_warning_order|exception_null_and_code_types/)'
  - id: no-skipped-ignores
    why: a helper case still ignores a field the comparison skips, or an HTTP case lost its message ignore
    run: |-
      test -z "$(grep -rlE 'pointer: /error/(class|message)' tools/oracle/cases | xargs -r grep -l '^kind: helper')" && grep -q 'pointer: /error/message' tools/oracle/cases/chat/upstream-429.yaml
