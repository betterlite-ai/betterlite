id: B5091
title: Helper oracle cases compare the value and the error codes
description: >-
  compare_helper in tools/oracle/src/compare.rs serializes the whole HelperOutput from tools/oracle/src/compare/helper.rs
  and compares every field the case does not list in compare.ignore. That includes HelperError's class (the Python
  exception class name), HelperError's message and each HelperWarning's message. docs/compatibility.md and rule
  errors-match-litellm make the message betterlite's own and put an error's HTTP status, type, param and code in the
  contract, so 63 helper cases each list /error/message or /error/class in compare.ignore by hand, and a new case that
  forgets the line fails on wording alone. The class is a Python detail with no Rust counterpart: the native side
  makes it up to match.


  Change compare_helper so a helper comparison never looks at /error/class, /error/message or the message of any
  warning. After the existing ignore checks and compare_effect_secrets, remove /error/class and /error/message from
  both serialized values, and /warnings/<index>/message for every index of each side's warnings, then compare what
  is left as today. ok, value, the error's status, type, param and code, each warning's subject and the warnings'
  count and order, and effects (credentials included) are still compared. HelperOutput, HelperError and HelperWarning
  keep their fields, so the FAIL output and the artifacts still show the class and both messages. An ignore that
  names /error/class or /error/message is no longer needed: compare_helper returns a Difference with the message
  "compare.ignore names a field helper comparisons skip" and that pointer, the same way it reports an ignore that
  points to no field. Drop both pointers from the known list.


  Remove the now redundant /error/class and /error/message entries from the 63 helper cases listed under
  oracle_cases, and keep every other ignore entry of those cases. A case whose ignore list becomes empty keeps
  compare: {ignore: []} the way other cases write it. HTTP cases (kind: http) keep their /error/message ignores,
  since the HTTP comparison does not change.


  Add tests to tools/oracle/src/tests.rs, each named with the helper_comparison_ prefix:
  helper_comparison_skips_error_class_and_message (two failed outputs that differ only in class and message match),
  helper_comparison_compares_error_codes (an rstest over status, type, param and code: two outputs that differ only in
  that field do not match, and the Difference pointer names it), helper_comparison_skips_warning_messages (warnings
  with the same subjects and different messages match, and different subjects do not), and
  helper_comparison_rejects_skipped_ignores (an ignore of /error/class or of /error/message returns the new
  Difference). The existing management_oracle tests detects_warning_order and exception_null_and_code_types keep
  passing unchanged.
