deviations: []
out_of_scope:
- The HTTP and gateway comparisons in compare_responses and compare_provider_requests, and the /error/message ignores of HTTP cases.
- The helper adapters in tools/oracle/helpers and the native helper code; they keep producing class and message.
- Which errors a helper raises; this task changes only what the comparison looks at.
pitfalls:
- remove_pointer sets an array element to null instead of removing it, so remove each warning's message key by its full pointer and never the warning itself; the warnings' count and order still count.
- Reject an ignore of /error/class or /error/message before the "points to no field" check; a failed output has both fields, so that check alone would let the ignore pass.
- The FAIL line and the artifacts serialize HelperOutput, not the trimmed comparison value, so they keep showing class and messages for debugging.
- Some of the 63 cases list a second ignore next to /error/message; keep that one and its why.
review_level: standard
budget:
  max_changed_lines: 400
  max_new_expects: 0
