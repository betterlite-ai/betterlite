  CA [ca-central-1], SA [sa-east-1]. Cache the assembled list once; no live AWS discovery. Cross-region prefixes
  are exactly global,us,eu,apac,jp,au,us-gov in that order. routing_prefix_order: Strip prefixes in one ordered
  pass: bedrock/,chat_completions/,converse/,invoke/,openai/,mantle/,nova-2/,nova/. Each only matches startswith
  at its turn; do not loop back for nested out-of-order prefixes. BedrockModelInfo.get_non_litellm_routing_model_name
  uses the same helper. arn_and_region_path: ARN extraction tests substring arn case-insensitively anywhere, then
  returns final slash component; no ARN grammar validation. split_bedrock_region_path first strips routing prefixes,
  splits first slash and recognizes only exact pinned full-region names; otherwise returns None plus the entire
  stripped id. Preserve unknown region/path suffixes. suffix_rewrite_order: Remove throughput suffix with (:\d+):\d+k$
  -> first capture, then context suffix \[\w+\]$. Throughput before a context suffix survives because removal order
  is not repeated. Preserve version :0, hyphens, and uppercase K; docs suggesting version removal are not the implementation.
  base_model_nova_and_regions: Before general stripping remove only the first matching bedrock/converse/,bedrock/,converse/
  wrapper; nova-2/ returns amazon.nova-2-custom and nova/ returns amazon.nova-custom, regardless of remaining id.
  Otherwise strip routing, ARN and suffixes in order, then remove one dot cross-region prefix or one slash full-region
  prefix. Preserve remaining versions and suffixes. BedrockModelInfo.get_base_model delegates identically. lazy_catalog_binding:
  get_cached_model_info caches the imported get_model_info callable without invoking it; fixtures capture binding
  identity, not a provider call. The later caller owns actual metadata lookup. _get_local_model_cost_map delegates
  B193 packaged-map loading with no network; exceptions propagate and no local fallback map is fabricated. runtime_arn_resource_encoding:
  First call B198 contains_aws_arn; without an ARN return the string unchanged. In order, try (custom-model)/([a-z0-9.-]+)/([a-z0-9]+)
  -> \1%2F\2%2F\3, then a slash immediately following each of :application-inference-profile,:inference-profile,:foundation-model,:imported-model,:provisioned-model,:prompt,:endpoint,:prompt-router,:default-prompt-router
  -> that prefix plus %2F. Stop after the first matching pattern, replacing all its matches in the string. Do not
  encode colons, ordinary model slashes, unknown resources or already encoded %2F. Preserve case sensitivity and
  the custom-model lowercase identifier restrictions; this differs from B591 quote(safe="").


  AmazonBedrockGlobalConfig construction has no side effects; the region_groups case calls its no-op constructor.


  Implement crates/betterlite-context/src/bedrock_model.rs with adjacent tests under bedrock_model/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function bedrock_model_cases in betterlite-context with these exact named cases (one per oracle file):
  region_groups, routing_prefix_order, arn_and_region_path, suffix_rewrite_order, base_model_nova_and_regions, lazy_catalog_binding,
  runtime_arn_resource_encoding. Each case exercises its named outcome independently; use stable supplied clocks/IDs
  and fixture transports. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/bedrock_model* using HelperCase: kind: helper
  and the externally tagged bedrock_model variant inside call. Do not put the Python stdin operation field in a
  HelperCase. Add oracle test helper_seeds_select_bedrock_model that parses every prefixed seed with the production
  HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 184 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 230 production lines, 235 behavior/config-test lines,
  110 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 600 planned, 600 maximum changed lines.
