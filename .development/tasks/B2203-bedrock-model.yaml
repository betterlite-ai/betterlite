budget:
  max_changed_lines: 600
  max_new_expects: 0
checks:
  commands:
  - id: helper-python
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/bedrock_model.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
    why: The operation adapter is absent, unchanged or fails strict Python checks.
  - id: helper-case-corpus
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/bedrock_model*")"
      && grep -lq 'bedrock_model' tools/oracle/fuzz/corpus/helper_case/bedrock_model* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_bedrock_model$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
  - id: case-region-groups
    why: Exact get_all_regions order is US [us-east-1,us-east-2,us-west-1,us-west-2,us-gov-east-1,us-gov-west-1],
      EU [eu-west-1,eu-west-2,eu-west-3,eu-central-1,eu-central-2,eu-south-1,eu-south-2,eu-north-1], AP [ap-northeast-1,ap-northeast-2,ap-northeast-3,ap-south-1,ap-south-2,ap-southeast-1,ap-southeast-2],
      CA [ca-central-1], SA [sa-east-1]. Cache the assembled list once; no live AWS discovery. Cross-region prefixes
      are exactly global,us,eu,apac,jp,au,us-gov in that order.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::bedrock_model_cases::case_[0-9]+_region_groups$/)'
  - id: case-routing-prefix-order
    why: 'Strip prefixes in one ordered pass: bedrock/,chat_completions/,converse/,invoke/,openai/,mantle/,nova-2/,nova/.
      Each only matches startswith at its turn; do not loop back for nested out-of-order prefixes. BedrockModelInfo.get_non_litellm_routing_model_name
      uses the same helper.'
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::bedrock_model_cases::case_[0-9]+_routing_prefix_order$/)'
  - id: case-arn-and-region-path
    why: ARN extraction tests substring arn case-insensitively anywhere, then returns final slash component; no
      ARN grammar validation. split_bedrock_region_path first strips routing prefixes, splits first slash and recognizes
      only exact pinned full-region names; otherwise returns None plus the entire stripped id. Preserve unknown
      region/path suffixes.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::bedrock_model_cases::case_[0-9]+_arn_and_region_path$/)'
  - id: case-suffix-rewrite-order
    why: Remove throughput suffix with (:\d+):\d+k$ -> first capture, then context suffix \[\w+\]$. Throughput before
      a context suffix survives because removal order is not repeated. Preserve version :0, hyphens, and uppercase
      K; docs suggesting version removal are not the implementation.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::bedrock_model_cases::case_[0-9]+_suffix_rewrite_order$/)'
  - id: case-base-model-nova-and-regions
    why: Before general stripping remove only the first matching bedrock/converse/,bedrock/,converse/ wrapper; nova-2/
      returns amazon.nova-2-custom and nova/ returns amazon.nova-custom, regardless of remaining id. Otherwise strip
      routing, ARN and suffixes in order, then remove one dot cross-region prefix or one slash full-region prefix.
      Preserve remaining versions and suffixes. BedrockModelInfo.get_base_model delegates identically.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::bedrock_model_cases::case_[0-9]+_base_model_nova_and_regions$/)'
  - id: case-lazy-catalog-binding
    why: get_cached_model_info caches the imported get_model_info callable without invoking it; fixtures capture
      binding identity, not a provider call. The later caller owns actual metadata lookup. _get_local_model_cost_map
      delegates B193 packaged-map loading with no network; exceptions propagate and no local fallback map is fabricated.
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::bedrock_model_cases::case_[0-9]+_lazy_catalog_binding$/)'
  - id: case-runtime-arn-resource-encoding
    why: First call B198 contains_aws_arn; without an ARN return the string unchanged. In order, try (custom-model)/([a-z0-9.-]+)/([a-z0-9]+)
      -> \1%2F\2%2F\3, then a slash immediately following each of :application-inference-profile,:inference-profile,:foundation-model,:imported-model,:provisioned-model,:prompt,:endpoint,:prompt-router,:default-prompt-router
      -> that prefix plus %2F. Stop after the first matching pattern, replacing all its matches in the string. Do
      not encode colons, ordinary model slashes, unknown resources or already encoded %2F. Preserve case sensitivity
      and the custom-model lowercase identifier restrictions; this differs from B591 quote(safe="").
    run: cargo nextest run --locked -p betterlite-context --no-tests=fail -E 'test(/::bedrock_model_cases::case_[0-9]+_runtime_arn_resource_encoding$/)'
  optional:
  - mutants
description: >-
  Implement BedrockModelId normalization and the pinned region catalog in betterlite-context, below credential,
  endpoint and capability callers. Keep source order and string tests, including apparently malformed but accepted
  identifiers; no endpoint, model download or provider dispatcher is built here.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/bedrock/common_utils.py:
  AmazonBedrockGlobalConfig.__init__ L456-L457; _get_all_bedrock_regions L773-L778; get_bedrock_cross_region_inference_regions
  L781-L783; extract_model_name_from_bedrock_arn L786-L793; strip_bedrock_routing_prefix L805-L810; split_bedrock_region_path
  L821-L831; strip_bedrock_throughput_suffix L992-L1002; get_bedrock_base_model L1064-L1099; BedrockModelInfo.get_non_litellm_routing_model_name
  L1331-L1334; BedrockModelInfo.get_base_model L1336-L1339; get_cached_model_info L156-L169; _get_local_model_cost_map
  L172-L176; AmazonBedrockGlobalConfig.get_all_regions L472-L479; AmazonBedrockGlobalConfig.get_ap_regions L481-L493;
  AmazonBedrockGlobalConfig.get_sa_regions L495-L496; AmazonBedrockGlobalConfig.get_eu_regions L498-L511; AmazonBedrockGlobalConfig.get_ca_regions
  L513-L514; AmazonBedrockGlobalConfig.get_us_regions L516-L527. litellm/passthrough/utils.py: CommonUtils.encode_bedrock_runtime_modelid_arn
  L107-L156.


  Named case contracts: region_groups: Exact get_all_regions order is US [us-east-1,us-east-2,us-west-1,us-west-2,us-gov-east-1,us-gov-west-1],
