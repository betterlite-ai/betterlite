dod:
- text: The search call and search tool list paths and the decisions and systemone paths answer through the booted proxy as LiteLLM does.
  proof: [search-mount-tests, mount-cases, oracle]
- text: KeySearchGrants and KeySearchMetadata forward to B749, B737 and B1106.
  proof: [search-mount-tests]
- text: messages_selector_chain asks the links in LiteLLM's order and lets a non-claude model on a claude-only arm fall through to the JSON tail.
  proof: [chain-tests]
- text: ProviderApiBaseHooks gives the Copilot and ChatGPT bases without a login and the Vertex Claude URL from B1304.
  proof: [chain-tests]
checks:
  optional: []
  commands:
  - id: search-mount-tests
    why: a mount, the route state or a search tool adapter is missing or wrong
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^app::inference::search_routes::/)'
  - id: chain-tests
    why: the selector chain order, the fall-through or an api base hook is wrong
    run: cargo nextest run --locked -p betterlite-core --no-tests=fail -E 'test(/^messages_selector_chain::/) | test(/^api_base_hooks::/)'
  - id: mount-cases
    why: without new case files the oracle compares nothing for these mounts
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/cases/search/wiring tools/oracle/cases/decisions/wiring tools/oracle/cases/search-call tools/oracle/cases/decisions-routes)"
oracle_cases:
- tools/oracle/cases/search/wiring/tools-list.yaml
- tools/oracle/cases/search/wiring/tools-list-empty.yaml
- tools/oracle/cases/search/wiring/call-unknown-tool.yaml
- tools/oracle/cases/decisions/wiring/systemone-invalid-body.yaml
- tools/oracle/cases/search-call/auth-required-search.yaml
- tools/oracle/cases/search-call/auth-required-named.yaml
- tools/oracle/cases/search-call/auth-required-list.yaml
- tools/oracle/cases/decisions-routes/auth-required-systemone.yaml
- tools/oracle/cases/decisions-routes/auth-required-decisions.yaml
- tools/oracle/cases/decisions-routes/invalid-body-decisions.yaml
deviations: []
out_of_scope:
- "Route behavior: B8275 and B8276. The search, tool pick and decisions calls: B3272, B3273, B3515. The authorization checks: B749, B737, B4114."
- "The provider arms of the messages selector chain (anthropic, bedrock, vertex_ai, azure_ai, github_copilot): each provider's task. The api base lookup itself: B7320."
- "The container and /utils mounts and the inference mount order after this task: B8635."
pitfalls:
- 'GET /v1/search/tools has no role or visibility filter; do not reuse B3275''s /search_tools/list filter here.'
- 'The search tool list comes from the router''s search_tools, so with no router or no tools the answer is data: [] and never a 500.'
- 'Every arm matches a different provider, so MessagesHostSelector may sit anywhere before the JSON tail; the JSON tail must be last, and a claude-only arm must answer None for other models so the tail sees them.'
- 'The Copilot hook is a sync &self method while B1513''s Authenticator::get_api_base is async &mut; use B1514''s resolution order without a token refresh, never block on the async call.'
review_level: security
budget:
  max_changed_lines: 1500
  max_new_expects: 0
