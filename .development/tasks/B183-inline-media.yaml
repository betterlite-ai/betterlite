dod:
- text: Inline data conversion, metadata, MIME and supplied ID mappings match helper cases on exact output bytes
    and record shape.
  proof:
  - oracle
  - helper-python
- text: Oversized data and invalid base64 fail before excessive allocation; no request path or URL triggers file/network
    access under the current plan.
  proof:
  - inline-media-tests
- text: The media/ID parser has a cargo-fuzz target and corpus replay; added wire variants retain chat corpus coverage.
  proof:
  - media-data-corpus
  - chat-request-corpus
- text: Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
- text: get_base64_str returns exactly the second comma component or the original string without base64 validation.
  proof:
  - base64-component
  - oracle
  - helper-python
- text: The strict data-URL classifier returns booleans for canonical, malformed, empty and comma-separated inputs
    without fetching URLs.
  proof:
  - base64-classification
  - oracle
  - helper-python
  - media-data-corpus
checks:
  optional:
  - mutants
  commands:
  - id: inline-media-tests
    why: the required tests fail or the filter selects no tests
    run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::inline_media_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: media-data-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-prompts/fuzz/corpus/media_data)"
      && test -f crates/betterlite-prompts/fuzz/fuzz_targets/media_data.rs && test -n "$(ls -A crates/betterlite-prompts/fuzz/corpus/media_data)"
      && cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(replays_the_media_data_corpus)'
  - id: chat-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/inline_media-*")"
      && grep -lq 'inline_media' tools/oracle/fuzz/corpus/helper_case/inline_media-* && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: base64-component
    why: The shared string projection is absent or validates data the source accepts.
    run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::media_base64_string_component$/)'
  - id: base64-classification
    why: Data-URL classification differs from the shared source helper.
    run: cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::media_base64_classification$/)'
