id: B183
title: Bounded inline media conversion
description: >-
  Finish bounded inline media decoding and traversal under betterlite-prompts/media. Own image_handling.py _process_image_response
  for supplied bytes, _rejected_image_fetch and all RemoteMedia/data-URL/inline traversal helpers 146-334, composing
  B234 supplied ID mappings and B235 metadata/MIME. Keep the current no-request-download policy: preserve URLs for
  providers accepting them and return typed ImageFetchError-compatible 400 when bytes are required. Add an oracle
  rejection case using a blocked loopback URL, which LiteLLM rejects through safe_get without an external fetch;
  public-URL policy differences stay documented and tested locally. No pixel/dimension validation is added here
  because LiteLLM has none. Bound encoded and decoded byte counts before allocation, never open request paths. media_data
  fuzz target calls production data-URL/base64 parsing and replays crates/betterlite-prompts/fuzz/corpus/media_data.
  Budget 260 decoder/traversal, 100 adapters, 320 tests/fuzz and 60 wiring (740 total). Write the behavior rstest
  functions inline_media_tests_behavior in adjacent tests.rs files, with a named case for each behavior and failure
  in the DoD; corpus replay tests have separate names. The helper operation inline_media is already registered; each operation has its own Rust and Python adapter file and corpus seed.


  Also own litellm/utils.py get_base64_str L8123-L8129 as the shared inline-media string projection used by Pegasus
  and other providers. If the string contains a comma, return its second comma-separated component, including an
  empty component, and discard later components; otherwise return the entire string. Do not require a data: prefix,
  decode base64, check MIME, or fetch a URL in this helper. Add inline_media operation case base64_string_component
  and standalone Rust test media_base64_string_component. The helper receives a parsed string, so reuse the existing
  media_data decoder boundary without introducing another parser. These seven nonblank source lines add 12 production,
  20 test and 8 adapter lines to the existing 740-line budget, for 780 planned and 800 maximum.


  Also own litellm/utils.py is_base64_encoded L8104-L8120, below Titan and Cohere. Require the case-sensitive data:
  prefix, take only the second comma component, strictly decode base64 and compare its canonical re-encoding with
  that component. Catch every decoding/index error and return False; do not validate MIME or require ;base64. An
  empty second component is valid and later comma components are ignored. Plain base64 and malformed data URLs return
  False so callers may treat them as text. Reuse the media_data production decoder primitives and add the classifier
  to that fuzz target; do not turn a classification failure into the inline-media conversion error. Add standalone
  test media_base64_classification and inline_media oracle case base64_classification. The 11 nonblank, noncomment
  classifier lines add 8 production, 8 test and 4 adapter lines by reusing the existing decoder, bringing the counted
  780-line plan to 800.
