id: B183
title: Bounded inline media conversion
description: >-
  Finish bounded inline media decoding and traversal under betterlite-prompts/media. Own image_handling.py _process_image_response
  for supplied bytes, _rejected_image_fetch and all RemoteMedia/data-URL/inline traversal helpers 146-334, composing
  B234 supplied ID mappings and B235 metadata/MIME. Keep the current no-request-download policy: preserve URLs for
  providers accepting them and return typed ImageFetchError-compatible 400 when bytes are required. Add an oracle
  rejection case using a blocked loopback URL, which LiteLLM rejects through safe_get without an external fetch;
  public-URL policy differences stay documented and tested locally. No pixel/dimension validation is added here
  because LiteLLM has none. Bound encoded and decoded byte counts before allocation, never open request paths. media_data
  fuzz target calls production data-URL/base64 parsing and replays crates/betterlite-prompts/fuzz/corpus/media_data.
  Budget 260 decoder/traversal, 100 adapters, 320 tests/fuzz and 60 wiring (740 total). Write the behavior rstest
  functions b183_inline_media_tests_behavior in adjacent tests.rs files, with a named case for each behavior and
  failure in the DoD; corpus replay tests have separate names. Register helper operations inline_media in tools/oracle/src/helpers/mod.rs
  and tools/oracle/helpers/dispatch.py; each operation has its own Rust and Python adapter file and corpus seed.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-prompts/Cargo.toml
  - crates/betterlite-prompts/src/lib.rs
  - crates/betterlite-prompts/src/error.rs
  - crates/betterlite-prompts/src/media.rs
  - crates/betterlite-prompts/src/media/**
  - crates/betterlite-prompts/fuzz/**
  - crates/betterlite-prompts/tests/fixtures/**
  - crates/betterlite-openai/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/**
  - tools/oracle/helpers/**
  - tools/oracle/cases/helpers/inline-media/**
  - tools/oracle/fuzz/corpus/helper_case/**
  lint_tables: false
references:
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/image_handling.py#L146-L334
  why: Typed media shapes and inlining traversal.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L490-L786
  why: Model-specific file/vector IDs and supplied mappings.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L789-L914
  why: Metadata without file reads and bare string path rejection.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L1439-L1594
  why: MIME inference precedence.
- url: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/image_handling.py#L29-L139
  why: Remote fetch behavior deliberately excluded from request processing.
dod:
- text: >-
    Inline data conversion, metadata, MIME and supplied ID mappings match helper cases on exact output bytes and
    record shape.
  proof:
  - oracle
  - helper-python
- text: >-
    Oversized data and invalid base64 fail before excessive allocation; no request path or URL triggers file/network
    access under the current plan.
  proof:
  - inline-media-tests
- text: >-
    The media/ID parser has a cargo-fuzz target and corpus replay; added wire variants retain chat corpus coverage.
  proof:
  - media-data-corpus
  - chat-request-corpus
- text: >-
    Every added helper operation has a committed shared-parser corpus seed and the complete corpus replays successfully.
  proof:
  - helper-case-corpus
checks:
  optional:
  - mutants
  commands:
  - id: inline-media-tests
    why: the required tests fail or the filter selects no tests
    run: >-
      cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(/::b183_inline_media_tests_behavior($|::)/)
      - test(/replays_the_/)'
  - id: media-data-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-prompts/fuzz/corpus/media_data)"
      && test -f crates/betterlite-prompts/fuzz/fuzz_targets/media_data.rs && test -n "$(ls -A crates/betterlite-prompts/fuzz/corpus/media_data)"
      && cargo nextest run --locked -p betterlite-prompts --no-tests=fail -E 'test(replays_the_media_data_corpus)'
  - id: chat-request-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-openai/fuzz/corpus/chat_request)"
      && test -f crates/betterlite-openai/fuzz/fuzz_targets/chat_request.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/chat_request)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_chat_request_corpus)'
  - id: helper-python
    why: the oracle adapters fail strict Python checks
    run: >-
      test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers)" && uv run --locked --project tools/oracle/litellm
      ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: the fuzz target or nonempty committed corpus is missing, or corpus replay fails
    run: >-
      test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- tools/oracle/fuzz/corpus/helper_case)" &&
      grep -rlq 'inline_media' tools/oracle/fuzz/corpus/helper_case && test -f tools/oracle/fuzz/fuzz_targets/helper_case.rs
      && test -n "$(ls -A tools/oracle/fuzz/corpus/helper_case)" && cargo nextest run --locked -p betterlite-oracle
      --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
oracle_cases:
- tools/oracle/cases/helpers/inline-media/data-image.yaml
- tools/oracle/cases/helpers/inline-media/data-document.yaml
- tools/oracle/cases/helpers/inline-media/blocked-url-400.yaml
- tools/oracle/cases/helpers/inline-media/inline-traversal.yaml
- tools/oracle/cases/helpers/inline-media/invalid-base64.yaml
deviations:
- what: >-
    Open, waiting for Max: keep preserving/rejecting request media URLs without downloads, or allow public URLs
    through user_url_validation and user_url_allowed_hosts with SSRF-checked safe_get.
  why: >-
    LiteLLM downloads public image/PDF data for providers requiring bytes. Keep the current plan and build no download
    behavior until the shared B009 decision is resolved.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/image_handling.py#L84-L139
out_of_scope:
- SDK PathLike and file-handle adapters are B159-B161; storage-backed managed IDs are B087.
- Provider-native attachment upload is implemented by provider/endpoint tasks.
- All common_utils file-ID functions including get_file_ids_from_messages are B234; file metadata/MIME B235.
- >-
  convert_url_to_base64/async_convert_url_to_base64 remote fetching remains blocked by the open decision; the rejection
  path alone is covered here.
pitfalls:
- A filename is metadata, never permission to open a local path.
- Enforce decoded-size bounds before base64 decoding, not after allocating the decoded buffer.
- File metadata extraction must not consume a streaming upload.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
