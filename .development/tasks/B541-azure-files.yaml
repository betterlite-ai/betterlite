id: B541
title: Azure batch lifecycle
description: >-
  Implement Azure batch create/retrieve/cancel/list operations with B517 wire records and B531 endpoints; B694 owns
  file lifecycle. Keep api-version query handling and batch payload fields identical to the SDK calls.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/azure/batches/handler.py:
  AzureBatchesAPI.__init__ L31-L32; AzureBatchesAPI.acreate_batch L34-L40; AzureBatchesAPI.create_batch L42-L74;
  AzureBatchesAPI.aretrieve_batch L76-L82; AzureBatchesAPI.retrieve_batch L84-L116; AzureBatchesAPI.acancel_batch
  L118-L124; AzureBatchesAPI.cancel_batch L126-L164; AzureBatchesAPI.alist_batches L166-L173; AzureBatchesAPI.list_batches
  L175-L208.


  Named case contracts: batch_create: Forward every create/retrieve/cancel request key unchanged to the SDK; validate
  model_dump into LiteLLMBatch. _is_async must be True for async and both standard/v1 and Azure SDK client classes
  are accepted. list_after_limit: List always passes after=None and limit=None by default, forwards explicit values
  and returns the SDK page unchanged, matching B517. sdk_client_missing: Every operation raises ValueError OpenAI
  client is not initialized. Make sure api_key is passed or OPENAI_API_KEY is set in the environment. when B531
  returns None, despite being an Azure wrapper. sdk_client_wrong_async: Create/retrieve/list reject wrong async
  client with ValueError OpenAI client is not an instance of AsyncOpenAI. Make sure you passed an AsyncOpenAI client.
  Cancel instead says Azure client is not an instance of AsyncAzureOpenAI or AsyncOpenAI. Make sure you passed an
  async client. cancel_sync_client_type: Only sync cancel checks AzureOpenAI/OpenAI explicitly and raises ValueError
  Azure client is not an instance of AzureOpenAI or OpenAI. Make sure you passed a sync client. Other sync methods
  cast or call directly. sdk_error_passthrough: No lifecycle catch rewrites upstream errors. B531 receives litellm_params
  or {}, key/base/version/client/is_async; the separate timeout and max_retries arguments are accepted but never
  passed to it or the operation.


  Implement crates/betterlite-azure/src/batches.rs with adjacent tests under batches/. Keep each Rust module at most
  300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf never imports
  betterlite-provider or betterlite-core. The production function is the only Rust implementation used by tests
  and oracle adapters.


  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function batches_cases in betterlite-azure with these exact named cases (one per oracle file): batch_create,
  batch_retrieve_cancel_list, resource_api_version, list_after_limit, sdk_client_missing, sdk_client_wrong_async,
  cancel_sync_client_type, sdk_error_passthrough. Each case exercises its named outcome independently; use stable
  supplied clocks/IDs and fixture transports. Existing API tasks retain route registration; this task must not register
  a duplicate axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/azure_batches* using HelperCase: kind: helper and
  the externally tagged azure_batches variant inside call. Do not put the Python stdin operation field in a HelperCase.
  Add oracle test helper_seeds_select_azure_batches that parses every prefixed seed with the production HelperCase
  parser, asserts that exact variant and fails on zero seeds; then replay the shared corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Budget from 164 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 190 production lines, 175 behavior/config-test lines,
  95 combined Rust/Python adapter lines, 0 parser target/replay lines, 0 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 485 planned, 500 maximum changed lines.
scope:
  paths:
  - crates/betterlite-azure/Cargo.toml
  - crates/betterlite-azure/src/batches.rs
  - crates/betterlite-azure/src/batches/**
  - tools/oracle/Cargo.toml
  - tools/oracle/src/helpers/azure/batches.rs
  - tools/oracle/src/helpers/azure/batches/**
  - tools/oracle/helpers/azure_batches.py
  - tools/oracle/helpers/azure_batches/**
  - tools/oracle/cases/helpers/providers/azure-batches/**
  - tools/oracle/fuzz/corpus/helper_case/azure_batches*
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/batches/handler.py#L31-L208
  why: Own AzureBatchesAPI.__init__, AzureBatchesAPI.acreate_batch, AzureBatchesAPI.create_batch, AzureBatchesAPI.aretrieve_batch,
    AzureBatchesAPI.retrieve_batch, AzureBatchesAPI.acancel_batch, AzureBatchesAPI.cancel_batch, AzureBatchesAPI.alist_batches,
    AzureBatchesAPI.list_batches. Other functions in this file remain with the owners listed below.
