checks:
  optional:
  - mutants
  commands:
  - id: case-batch-create
    why: Forward every create/retrieve/cancel request key unchanged to the SDK; validate model_dump into LiteLLMBatch.
      _is_async must be True for async and both standard/v1 and Azure SDK client classes are accepted.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_create$/)'
  - id: case-batch-retrieve-cancel-list
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-batches/batch-retrieve-cancel-list.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_batch_retrieve_cancel_list$/)'
  - id: case-resource-api-version
    why: the production result, omission or failure matches tools/oracle/cases/helpers/providers/azure-batches/resource-api-version.yaml.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_resource_api_version$/)'
  - id: helper-python
    why: The operation adapter is absent, unchanged or fails strict Python checks.
    run: test -n "$(git diff --name-only "$GATE_BASE" -- tools/oracle/helpers/azure_batches.py)" && uv run --locked
      --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm
      basedpyright --project tools/oracle/helpers/pyrightconfig.json
  - id: helper-case-corpus
    why: New variant-specific valid HelperCase seeds are absent or do not parse/replay.
    run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/azure_batches*")"
      && grep -lq 'azure_batches' tools/oracle/fuzz/corpus/helper_case/azure_batches* && cargo nextest run --locked
      -p betterlite-oracle --no-tests=fail -E 'test(/::helper_seeds_select_azure_batches$/)' && cargo nextest run
      --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
  - id: case-list-after-limit
    why: List always passes after=None and limit=None by default, forwards explicit values and returns the SDK page
      unchanged, matching B517.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_list_after_limit$/)'
  - id: case-sdk-client-missing
    why: Every operation raises ValueError OpenAI client is not initialized. Make sure api_key is passed or OPENAI_API_KEY
      is set in the environment. when B531 returns None, despite being an Azure wrapper.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_sdk_client_missing$/)'
  - id: case-sdk-client-wrong-async
    why: Create/retrieve/list reject wrong async client with ValueError OpenAI client is not an instance of AsyncOpenAI.
      Make sure you passed an AsyncOpenAI client. Cancel instead says Azure client is not an instance of AsyncAzureOpenAI
      or AsyncOpenAI. Make sure you passed an async client.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_sdk_client_wrong_async$/)'
  - id: case-cancel-sync-client-type
    why: Only sync cancel checks AzureOpenAI/OpenAI explicitly and raises ValueError Azure client is not an instance
      of AzureOpenAI or OpenAI. Make sure you passed a sync client. Other sync methods cast or call directly.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_cancel_sync_client_type$/)'
  - id: case-sdk-error-passthrough
    why: No lifecycle catch rewrites upstream errors. B531 receives litellm_params or {}, key/base/version/client/is_async;
      the separate timeout and max_retries arguments are accepted but never passed to it or the operation.
    run: cargo nextest run --locked -p betterlite-azure --no-tests=fail -E 'test(/::batches_cases::case_[0-9]+_sdk_error_passthrough$/)'
