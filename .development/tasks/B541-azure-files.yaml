pitfalls:
- 'The oracle helper for this task is pre-registered as azure_batches in the azure group. Replace the stub Op in tools/oracle/src/helpers/azure/batches.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/azure_batches.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- The missing-client diagnostic still names OPENAI_API_KEY, so correcting its wording would change the source error.
- Separate timeout/max_retries inputs are unused here; only litellm_params reaches client construction.
