dod:
- text: The handler tests call tower's oneshot on cache_settings_test's own Router with fake ports; B8650 runs the HTTP cases through the booted proxy.
  proof: [route-tests]
- text: POST /cache/settings/test answers 401 without a valid key, the admin-only route error for a non-admin key, and 200 for a proxy admin key, with status, message and error in the body, error being null on success. B8650 proves it over HTTP.
  proof: [route-tests]
- text: A body without cache_settings, or with a non-object cache_settings, answers 422 with B003's validation error body. B8650 proves it over HTTP.
  proof: [route-tests]
- text: A type that is not the string "redis" (absent, null, "local" and others) answers status "failed" with the message "Only Redis cache type is currently supported for testing" and constructs no cache. B8650 proves it over HTTP.
  proof: [route-tests]
- text: A reachable Redis answers status "success" with message "Redis connection test successful", and an unreachable one answers status "failed" with a non-null error. B8650 proves it over HTTP.
  proof: [route-tests]
- text: >-
    A password sent as ***REDACTED*** or left out, with the same host and port as the saved row, reaches the Redis as the saved
    (decrypted) password.
  proof: [route-tests]
- text: >-
    A password sent as ***REDACTED*** or left out, with a different host, port, url, redis_startup_nodes, sentinel_nodes or
    service_name than the saved row, is not replaced by the saved one: the Redis at the new target never receives the saved password.
  proof: [route-tests]
- text: A password the caller typed is sent as typed, and an empty string or null clears the saved one.
  proof: [route-tests]
- text: With no saved row, a redacted password is dropped, and the marker string never reaches the Redis.
  proof: [route-tests]
- text: >-
    The saved row is read through the repository, parsed and decrypted per value (a string that does not decrypt stays as stored,
    non-strings pass through), and any failure in that step gives an empty saved map and still tests the connection.
  proof: [saved-tests]
- text: >-
    A construction or connection error answers status "failed", the message "Cache connection test failed: " followed by the error text, and an equal non-null error, never a 500.
  proof: [route-tests]
- text: The debug log carries the redacted settings, and no log line or answer from the route contains the plaintext password, saved or typed.
  proof: [route-tests]
- text: Every mutant in the saved read, the merge and precedence order and the redis-only guard is caught by a test.
  proof: [mutants]

checks:
  optional: [mutants]
  commands:
  - id: saved-tests
    why: the saved row is not read, parsed or decrypted, or a failure there blocks the test
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_test::saved::/)'
  - id: route-tests
    why: the route does not authenticate, merge saved secrets by target, guard the type, test the connection or keep secrets out of logs
    run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^cache_settings_test::route::/)'

oracle_cases: []

deviations:
- what: >-
    The text after "Cache connection test failed: " and in the error member is betterlite error text, not the Python exception text.
  why: Python exception strings (a redis-py connection error, a TypeError from a bad keyword) have no Rust equivalent; status, the prefix and the null or non-null error match.
- what: >-
    A settings map with redis_startup_nodes (cluster mode) answers status "failed" while B4299 cannot build a cluster cache.
  why: B4299 raises its unsupported-type error for cluster mode and the route reports it in the failed message; LiteLLM would connect. Merged betterlite-redis already parses startup_nodes (B4321) and builds the Cluster client (B4323). B5220 opens it, B4325 adds `RedisCacheFamily::Cluster`, B5640's `connect` with that family is the cluster cache constructor and B4326 adds its test_connection, but no task wires B4299's Cache to that constructor yet, so this lasts until one does.

out_of_scope:
- GET /cache/settings and the effective values it returns; B4307 owns them.
- POST /cache/settings, the encryption of the saved row, the audit log row and CacheSettingsManager; B8502 owns them.
- parse_stored_settings, resolve_cache_url_precedence, redact_credentials, has_connection_target, target_repr, saved_secret_is_reusable and merge_over_saved; B4306 owns them and this route calls them.
- RedisCache.test_connection and RedisClusterCache.test_connection; B4326 owns them and this route calls them.
- Cache.__init__ and the Redis connection settings (including REDIS_ environment fallbacks and os.environ/ references in values); B4299 and B4321 own them.
- The cache config repository adapter (B726) and decryption (B1600).

pitfalls:
- "os.environ/ strings in a posted settings map resolve as they do in LiteLLM, so the host the caller names can receive that secret in AUTH. We keep that since only a proxy admin reaches this route: /cache/settings/test is in no non-admin route list, and non_proxy_admin_allowed_routes_check ends in the admin-only 403 (route_checks.py L260-L365). The route must go through the same check, and a valid non-admin key must get that 403 with no connection tried."
- "Merge runs before url precedence. merge_over_saved may drop a stored url when the request names a host, and precedence then sees the final map; calling precedence first keeps a url the merge would have removed."
- "Only restoring the password on a matching target keeps the stored secret from being replayed to another server. Do not restore it from the environment or the saved row any other way, and do not widen the match to host alone."
- "The saved map is decrypted but not overlaid with REDIS_ variables, unlike the GET route. A password that only came from the environment is shown as ***REDACTED*** by GET and arrives here with no saved secret, so it is dropped."
- "The redis-only guard compares the type with the exact string \"redis\" after the merge, so a missing type is rejected and so is \"Redis\" with a capital."
- "A saved-row failure must give an empty map, not a failed answer; a repository outage, a bad JSON column and a bad ciphertext all look the same to the caller."
- "The resolved map holds the plaintext password. Log only the redact_credentials output, and keep the settings map out of the failed message and out of error text built from a connection error."
- "error is null on success and on the redis-only rejection, and it is still a member of the body; a skipped null changes the answer shape."
- "The temporary cache must not register callbacks, set the global cache or keep a connection pool after the answer; drop it before returning."

review_level: security

budget:
  max_changed_lines: 1500
  max_new_expects: 1
