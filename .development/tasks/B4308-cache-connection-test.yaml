id: B4308
title: Test cache connections with target-bound credentials
description: >-
  Serve POST /cache/settings/test from crates/betterlite-server. The admin UI sends the cache form to this route before it
  saves, and the route answers whether a Redis built from those settings answers PING. It never changes the running cache.
  The route is authenticated with the same dependency as the other management routes (user_api_key_auth, whose route check refuses a non-admin key for /cache/settings routes, as in LiteLLM). Put the handler and its types in crates/betterlite-server/src/cache_settings_test/route.rs and expose
  pub fn router(state) -> axum::Router for B8650 to merge. Do not register the route anywhere else and do not touch lib.rs.

  The body is CacheTestRequest, one member cache_settings, a JSON object. A missing member or a non-object value is a 422 with
  the validation error body B003 already produces. The answer is always HTTP 200 with CacheTestResponse: status ("success" or
  "failed"), message, and error. error is always serialized and is null unless there is an error text.

  The handler does these steps in order, as test_cache_connection does:
  1. Load the saved settings (saved.rs). With no database connection the saved map is empty. Otherwise read the row with id
     "cache_config" through B726's cache config repository. When the row exists and its cache_settings is not empty, parse it with
     B4306's parse_stored_settings and decrypt every value as B1600's decrypt_value_helper does with return_original_value true
     (a string that decrypts becomes the plaintext, any other string stays as stored, a non-string value passes through). Any
     error in this step, from the repository, the parser or the decrypt, is swallowed and the saved map is empty. A broken saved
     row must never block a test. This is the one place the route hides an error, so log nothing from it that holds a value.
     B4307 reads the same row but turns a failure into a 500, so do not reuse its loader here.
  2. Merge with B4306's merge_over_saved(request.cache_settings, saved). A credential the form left out or echoed back as
     ***REDACTED*** gets the saved secret only when B4306's saved_secret_is_reusable says the request names the same target as the
     saved row; otherwise the field is dropped. This route is the reason that rule exists: without it a caller could omit the password,
     point host at a server they run, and receive the stored password there. The route calls the two functions only through
     merge_over_saved and never builds its own comparison.
  3. Apply B4306's resolve_cache_url_precedence to the merged map. Merge comes first and precedence second; reversing them
     changes which fields survive.
  4. Log the settings at debug level only after B4306's redact_credentials. The resolved map holds the plaintext secret, so the raw
     map never reaches a log line, a span or an error text.
  5. When the map's "type" is not the string "redis" (absent, null, "local", "redis-semantic" or anything else), answer
     status "failed", message "Only Redis cache type is currently supported for testing", error null. Nothing is constructed.
  6. Build a temporary cache from the map through B4299's Cache constructor, the same call Cache(**cache_settings) makes, then
     call the backend's test_connection from B4326 and return its status, message and error unchanged. The temporary cache is
     dropped afterwards; the route does not store it, register callbacks, or touch the global cache. Python gives Cache the whole
     map: its named options (host, port, password, namespace, ttl, redis_startup_nodes and so on) are read by the constructor and
     every other key (url, username, db, ssl, max_connections, sentinel_nodes, service_name, ssl_cert_reqs and the rest) goes through
     to the Redis connection settings that B4321 resolves. Pass the map the same way; do not pick fields in this route.
  7. Any error from step 6, constructing or connecting, answers status "failed", message "Cache connection test failed: <error text>",
     error "<error text>". An exception is never a 500 here.

  Tests drive the route through the real router. For the connection, start a small TCP listener in the test that speaks enough RESP
  to answer HELLO or AUTH and PING and records the commands it received. That is how the tests prove which password was sent where.
  Use a fake repository for the saved row; B726's repository trait is the seam, so add no trait of your own.
scope:
