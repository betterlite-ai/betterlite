id: B3615
title: Pass-through HTTP route factory and completion adapter
description: >-
  Build an async handler and the create_pass_through_route factory that creates reusable
  HTTP endpoint handlers in betterlite-server. Preserve endpoint markers, header merging,
  and auth selection at route creation.

  Implement the async handler (any name under 30 characters) that accepts fastapi_response:
  Response, request: Request, adapter_id: str, and user_api_key_dict: UserAPIKeyAuth.
  Resolve litellm_call_id from request headers via resolve_litellm_call_id (B198). Parse
  request body as JSON. Select model with fallback priority: general_settings completion_model
  or user_model (whichever is set takes priority; user_model wins if both are set), then
  request model. Enrich data via add_litellm_data_to_request with general_settings, version,
  proxy_config. Override user CLI settings (temperature, request_timeout, max_tokens, api_base).
  Apply model alias mapping (litellm.model_alias_map and user_api_key_dict.aliases). Call
  pre_call_hook on the logging object. Route the request: if api_key in data, call
  litellm.aadapter_completion directly; elif model recognized or has default deployment or
  matches deployment_names, use llm_router.aadapter_completion (specific_deployment=True for
  deployment_names); elif user_model is set, call litellm.aadapter_completion; else raise
  ProxyModelNotFoundError. Extract hidden_params (model_id, cache_key, api_base, response_cost).
  Schedule an async update_request_status to success. Get custom headers via
  ProxyBaseLLMRequestProcessing.get_custom_headers. Return the response. On exception, call
  post_call_failure_hook and raise ProxyException with litellm_call_id headers.

  Implement create_pass_through_route as a factory that takes endpoint: str, target: str, and
  optional custom_headers, forward_headers, merge_query_params, dependencies, include_subpath,
  cost_per_request, custom_llm_provider, is_streaming_request, query_params, default_query_params,
  guardrails, config_file_path, timeout. The function has two branches: if target is a CustomLogger
  or can be resolved via get_instance_fn, create an adapter_id and return an endpoint_func that
  calls the handler built earlier in this task (by whatever name under 30 characters it uses); else
  treat target as a URL and return an endpoint_func that calls pass_through_request via a _relay closure.
  The URL branch parses request data via
  _parse_request_data_by_content_type, checks the registry via is_registered_pass_through_route
  and get_registered_pass_through_route (B3614), raises 404 or 405 as needed, merges config-supplied
  passthrough_params, constructs full_target via construct_target_url_with_subpath (B3600),
  converts custom_headers to a dict, merges query_params, reads request.state for the custom body
  (LITELLM_PASS_THROUGH_CUSTOM_BODY_STATE_KEY), and calls pass_through_request with all parameters.
  The relay closure wraps pass_through_request in a finally block that cleans up three request.state
  keys (LITELLM_PASS_THROUGH_CUSTOM_BODY_STATE_KEY, LITELLM_PASS_THROUGH_RAW_BODY_STATE_KEY,
  LITELLM_PASS_THROUGH_DEPLOYMENT_MODEL_INFO_STATE_KEY) before returning. Wrap the relay result in
  open_sse_before_first_byte with ping_interval_seconds set to litellm.sse_keepalive_ping_interval_seconds
  for streaming requests, None otherwise. Set LITELLM_PASS_THROUGH_ENDPOINT_MARKER attribute on
  endpoint_func to True for auth discovery.

