deviations:
- what: >-
    ProxyBaseLLMRequestProcessing.get_custom_headers is called but its implementation
    (get_custom_headers, _process_chunk_with_cost_injection, and error/hook methods) are not built
    by this task; they are owned by B004 or a shared proxy infrastructure task (gap D).
  why: >-
    This task builds the route factory which calls that method; the method's implementation
    is a dependency owned elsewhere. betterlite calls the method with the same parameters
    LiteLLM does until its owner lands.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L320-L328
- what: >-
    adapter_completion and get_instance_fn calls on LiteLLM objects are treated as external
    dependencies; the factory passes parameters to them without validating their behavior.
  why: >-
    These functions implement LiteLLM's adapter protocol and the typed config instance resolver.
    This task delegates to them as-is, matching LiteLLM's behavior of accepting adapters or
    URLs transparently.
  link: >-
    https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L2005-L2008

out_of_scope:
- >-
  adapter_completion and get_instance_fn from LiteLLM's adapter layer and instance resolution;
  this task calls them as external dependencies for the CustomLogger branch.
- >-
  ProxyBaseLLMRequestProcessing.get_custom_headers and its related methods (ProxyBaseLLMRequestProcessing itself);
  B004 or a shared proxy infrastructure task owns them (gap D).
- >-
  add_litellm_data_to_request, pre_call_hook, and post_call_failure_hook; these are imported
  from the proxy context (proxy_server globals) and called by this task.
- >-
  litellm_call_id_headers, openai_error_type, openai_error_param, openai_error_status_code
  and log_llm_api_exception; these are error handling utilities owned elsewhere and called from
  the exception path.
- >-
  open_sse_before_first_byte wrapper for keepalive pings; this is owned by gap D (shared
  proxy infrastructure); this task calls it with the relay result and ping interval.
- >-
  get_request_route lookup for the URL branch's path extraction; owned by gap D; this task
  calls it to get the canonical route for registry lookups.

pitfalls:
- >-
  Model selection: user_model (if set) always wins over completion_model, even when both are set.
  If neither is set, request model is used. Test both parameters together to catch the actual
  precedence.
- >-
  Model alias mapping has two stages: global litellm.model_alias_map, then user_api_key_dict.aliases.
  Both are dicts and both can be None; apply them in order without overwriting the model twice.
- >-
  The routing decision has five branches: direct api_key (litellm.aadapter_completion), recognized model,
  default/pattern router, specific deployment (specific_deployment=True), and finally user_model
  (litellm.aadapter_completion). The user_model branch is the last fallback before ProxyModelNotFoundError.
- >-
  hidden_params is a dict that might not exist on the response object or might be None;
  getattr with {} default and .get() with empty-string defaults handle both missing and None.
- >-
  The URL branch's _relay closure runs pass_through_request and must clean up state in finally
  even if pass_through_request raises; check hasattr before delattr to avoid KeyError.
- >-
  Three distinct state keys are cleaned up with their full string names: "litellm_pass_through_custom_body",
  "litellm_pass_through_raw_body", "litellm_pass_through_deployment_model_info". Omitting any key
  breaks request isolation.
- >-
  The endpoint marker attribute carries a string value "__litellm_pass_through_endpoint__" on
  endpoint_func (the inner function), not the factory itself, for auth to discover custom routes.
- >-
  open_sse_before_first_byte takes an awaitable (_relay()) and an optional ping_interval_seconds.
  The interval is None for non-streaming (force synchronous read) or the config value for streaming.
  If interval is wrong, keepalive breaks or SSE stalls.
- >-
  The factory accepts default_query_params in its signature and merges config-supplied passthrough_params
  but does not apply default_query_params in the URL branch because it is never added to target_params.
  The parameter is passed to pass_through_request as None for completeness; changing this would require
  modifying target_params construction at line 2068-2076.

