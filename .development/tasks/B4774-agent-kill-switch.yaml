id: B4774
title: Agent kill switch secrets, delivery and audit records
description: >-
  Implement webhook credential restoration/redaction and one-shot outbound delivery through betterlite-http,
  with bounded response capture and an audit record for each attempt. Preserve query merging, no redirects
  and success only for 2xx.

  Redaction: the redact_kill_switch function removes secrets from stored AgentKillSwitchConfig using the marker
  string. Restoration replaces the marker with the original secret from existing storage when the admin echoes
  the marker as a placeholder for an unchanged field. Bearer token, API-key header and Basic auth password
  each restore independently, clearing to empty string if no stored secret exists.

  Request building: merge query parameters into the URL without encoding duplication, add auth headers with
  Bearer/API-key/Basic conversion (only one auth type can exist per config), and preserve configured headers.
  An auth-derived header overwrites a manually configured header of the same name.

  Delivery: send the HTTP request with no redirects (follow_redirects=false), bounded timeout, and capture
  the response status, bounded response body text (up to AGENT_KILL_SWITCH_RESPONSE_BODY_MAX_CHARS characters),
  and any httpx error message. A 2xx status marks success; any other status or error is recorded and returned.

  Auditing: every kill switch attempt writes an audit log with the result (status and response body or error),
  the actor/key, the timestamp, and a changed_by field tracking the human operator or service account that
  triggered the switch. The audit log table name is agents, the action is kill_switch_fired, and the object_id
  is the agent_id.

  Injected contract: KillSwitchHttpClient protocol has build_request (typed params) and send (with stream and
  follow_redirects flags). Default client comes from B173's pooled httpx client configured for AgentKillSwitch.
  Default audit writer is B065's create_audit_log_for_update.

