dod:
  - text: Redacting a kill switch config replaces all bearer token, api_key and password fields with the marker
      string; redacting None returns None.
    proof: [kill-switch-redaction-tests]
  - text: Restoring a redacted config replaces the marker with the original secret from storage for each auth
      type, or empty string if no storage exists.
    proof: [kill-switch-restoration-tests]
  - text: Building a kill switch request merges query parameters into the URL, adds auth headers (Bearer, API-key,
      or Basic based on the single configured auth type), and preserves configured headers with auth-derived
      headers overwriting any configured header of the same name.
    proof: [kill-switch-request-tests]
  - text: Firing a kill switch sends the request with no redirects, bounded timeout from config or default
      AGENT_KILL_SWITCH_TIMEOUT_SECONDS (10.0 seconds), and returns AgentKillSwitchResult with status and
      bounded response text or error message.
    proof: [kill-switch-delivery-tests]
  - text: Only 2xx status codes mark a kill switch result as succeeded; all other statuses and errors return
      succeeded=false.
    proof: [kill-switch-delivery-tests]
  - text: Building a kill switch audit log includes the result, user/api-key actor, timestamp, and changed_by
      derived from the calling actor and admin name.
    proof: [kill-switch-audit-tests]

