deviations:
  - what: >-
      betterlite rejects request-supplied push-callback URLs with HTTP 400 before forwarding.
      LiteLLM's proxy accepts them if they pass SSRF checks.
    why: >-
      The bounded-inputs rule forbids external request destinations; operator-configured webhook URLs are
      trusted. Request callbacks are deferred to a future decision on SSRF policy.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/kill_switch.py#L129-136
  - what: >-
      The kill switch request uses a configured finite deadline (B173's default pooled-client timeout or
      AGENT_KILL_SWITCH_TIMEOUT_SECONDS, default 10.0 seconds). LiteLLM does not override keepalive behavior.
    why: >-
      Bounded request timeouts prevent indefinite hangs on slow webhook servers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L579

out_of_scope:
  - Webhook URL validation (owned by B4770).
  - HTTP routing, request/response middleware and streaming hooks (owned by B4788/B4789).
  - Redirect handling and SSRF policy beyond no-redirects (owned by B009).
  - Database storage and transaction semantics for audit logs (owned by B065/B700).
  - Per-provider kill switch dispatch and retry policy.
  - "litellm/proxy/agent_endpoints/kill_switch.py#L139-150: KillSwitchHttpClient protocol is declared by this task; the protocol implementation methods are injected."
  - "litellm/proxy/agent_endpoints/kill_switch.py#L153-154: default_kill_switch_http_client is a factory function building the B173 client; its implementation belongs to B173."
  - "litellm/proxy/agent_endpoints/kill_switch.py#L160-161: default_kill_switch_audit_log_writer is a factory function returning B065's create_audit_log_for_update; ownership stays with B065."

pitfalls:
  - >-
    AgentKillSwitchConfig.auth is a discriminated union (Bearer | ApiKey | Basic); only one auth type can exist.
    Auth-derived headers override any manually configured header of the same name through simple dict merging.
  - >-
    Redaction and restoration are not symmetrical: restoring twice with the marker does not restore from
    empty. The marker is only a placeholder for unchanged fields in a PATCH request; fresh requests supply
    the full secret.
  - >-
    Response body streaming must not buffer the entire response; read up to max_chars and stop. The iterator
    may represent multiple chunks, and concatenation must not exceed the limit.
  - >-
    httpx.Response.aclose() is not a no-op; it must be called in a finally block to free the connection back
    to the pool.
  - >-
    The audit log table_name is agents (not agent_endpoints), the action is kill_switch_fired, and the
    object_id is the agent_id string. The result serializes as JSON via model_dump_json.

review_level: security

budget:
  max_changed_lines: 1000
  max_new_expects: 0
