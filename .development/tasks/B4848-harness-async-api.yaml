    why: AsyncEventStream (result set on Done, cancel, aclose) and _one_shot, which closes the session before Done is handed out and again in finally.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/runtime.py#L743-L748
