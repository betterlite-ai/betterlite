  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/runtime.py#L779-L829
    why: _collect (last Done wins, no Done is an error) and aagent_session, which builds the config and does not start the session.
  - url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/runtime.py#L832-L919
    why: arun_agent (non-interactive session, async with) and astream_agent (builds the session before the stream exists).
