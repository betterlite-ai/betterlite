dod:
  - text: aagent_session returns an unstarted AsyncSession built through build_config with interactive true, and returns a build, validation or option error before any handler or endpoint call.
    proof: [session-tests]
  - text: aagent_resume accepts a State or its bytes, returns NoNativeId for a missing or empty native id before build_config runs, takes the state's model only when the caller gave none, and passes the native id to the session as resume_from.
    proof: [resume-tests]
  - text: A resume on a harness without the resume capability fails, and bytes that do not load return State(...) without building a session.
    proof: [resume-tests]
  - text: A session that was detached and then resumed with the bytes of its State starts the handler and calls the handler's resume with the saved native id.
    proof: [resume-tests]
  - text: AsyncSession::arun returns the last Done result, returns the OutputInvalid error when it follows a Done, and returns NoResult when the stream ends with no Done.
    proof: [run-tests]
  - text: arun_agent builds a non-interactive session, so permissions ask without an approval callback fails at build; it closes the session after a successful run, after a failed run, and does not call close when start failed.
    proof: [run-tests]
  - text: AsyncSession::astream yields the handler's events in order, sets result only once Done passed, and cancel ends the stream with Done whose stop reason is Cancelled.
    proof: [stream-tests]
  - text: astream_agent returns a build error before any event, and the session it owns is closed before the reader gets Done, also when the turn failed and when aclose ends the stream early.
    proof: [stream-tests]
  - text: aagent gives a RunResult for false and a stream for true; agent_capabilities returns what harness_capabilities gives for each harness.
    proof: [stream-tests]
checks:
  optional: []
  commands:
    - id: session-tests
      why: aagent_session build and eager validation tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^agent_api::tests::session::/)'
    - id: resume-tests
      why: aagent_resume state, native id and model tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^agent_api::tests::resume::/)'
    - id: run-tests
      why: arun and arun_agent tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^agent_api::tests::run::/)'
    - id: stream-tests
      why: event stream, one-shot stream, aagent and capabilities tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-harness --no-tests=fail -E 'test(/^agent_api::tests::stream::/)'
oracle_cases: []
deviations:
  - what: The handler and the endpoint starter are fields of the argument structs, and the arguments are structs with public fields, not keyword arguments.
    why: Handler traits have associated types and the Deep Agents handler lives in a crate that depends on this one. The same values reach the same checks in the same order.
  - what: There are no `__await__`, `__aenter__` or `__aexit__`; `aagent_session` and `aagent_resume` return an unstarted session and the caller calls `start` and `close`.
    why: Rust has no async context manager. `arun_agent` and `astream_agent` do the start and close themselves.
  - what: Dropping an `AsyncEventStream` from `astream_agent` before the end does not close the session; `aclose` does.
    why: Drop cannot wait for async work. `aclose` cancels the turn and runs the stream to its end so the session is closed.
  - what: A non-streaming `aagent` reports a build error when the future is awaited, where Python's `aagent(stream=True)` raises at the call. `aagent` also returns an `AgentOutcome` enum for both flag values.
    why: Rust has no function that returns either of two types by a flag, and a future does nothing before it is awaited.
  - what: The `TypeError` for a state that is neither `State` nor bytes, and the "No harness config registered" errors, cannot happen.
    why: >-
      `StateInput` and `Harness` are closed types.
  - what: A close failure in `arun_agent` is not returned. B4846's `close` already logs the failure.
    why: LiteLLM's `__aexit__` runs while the run's own error is propagating, and that error is the one the caller sees.
out_of_scope:
  - "SessionConfig, build_config, validate, context_for, parse_output and resolve_model_route (runtime.py L72-L255) belong to B4844 and are called here."
  - "AsyncSession (L584-L776 except `arun` L747-L748 and `astream` L743-L745), the registry and the busy permit belong to B4846."
  - "TurnControl, pump_events, call_approval_handler, _Turn and `turn_events` (L259-L541, L732-L741) belong to B4847."
  - "The blocking wrappers in litellm/harness/sync.py belong to B4849, which calls the functions built here."
  - "Re-exports in litellm/harness/__init__.py (L30-L60) have no Rust code."
pitfalls:
  - >-
    aagent_session builds an interactive session and arun_agent a non-interactive one; passing the wrong flag turns `permissions: ask` without `on_approval` from a build error into a hang or the other way round.
  - >-
    aagent_resume checks the native session id before it calls build_config, so a bad state never touches the sandbox or the skill folders.
  - >-
    The state's model is used only when the caller's model is `None`; an explicit model replaces it, as in `model if model is not None else resolved.model`.
  - >-
    arun must return the OutputInvalid error that B4847 yields right after Done; keeping the Done result and ignoring the error would hide a failed output schema.
  - >-
    The generator inside astream_agent owns the session, so `close()` can only run after the borrowed turn stream is dropped; holding items back from the first Done is the only way to close before the reader sees Done.
  - >-
    AsyncEventStream::aclose must cancel before it drains, otherwise a turn that waits on a slow handler keeps the drain waiting.
  - >-
    The close in arun_agent runs also when arun failed, but not when start failed, because B4846's start already stops the endpoint it opened and leaves the session unstarted.
  - >-
    AsyncEventStream::result copies the result on Done only; an error item before Done leaves it None.
  - "crates/betterlite-harness/Cargo.toml and Cargo.lock are in scope because the worker adds the tokio dev features rt and macros to the harness dev-dependencies."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
