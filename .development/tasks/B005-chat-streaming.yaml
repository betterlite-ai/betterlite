id: B005
title: Streaming chat completions
description: >-
  Serve chat completions with stream set to true as server-sent events, for the openai/ deployments from B004. Each
  chunk goes to the client as soon as it arrives from the provider: no buffering of the whole answer, and a slow
  provider never holds back a chunk it already sent. stream_options.include_usage behaves as in LiteLLM, and the
  stream ends with data: [DONE] exactly when LiteLLM's does. When the client disconnects, betterlite drops the upstream
  request so the provider stops generating. When the provider fails before the first chunk, the client gets the
  same status, error type, param and code LiteLLM gives, with betterlite's own message (rule errors-match-litellm).
  Write the cases under tools/oracle/cases/chat/ and match LiteLLM on all of them. Add a cargo-fuzz target that
  feeds arbitrary bytes to the SSE parser, seed its corpus with the event streams of the streaming cases, and replay
  every corpus file in a normal test named replays_the_sse_events_corpus (rule fuzz-parsers).


  Shared buffered chunk assembly is B2227, whose lower ChunkProcessor pieces are B2232/B2233/B2234/B2235. B252 owns
  the three buffered-assembly call sites in streaming_handler.py at 1851-1856, 2105-2110 and 2230-2235. The SSE
  layer emits its existing completion/failure callback; B252 supplies that callback and invokes B2227. B005 does
  not implement these upper logging/assembly blocks.
scope:
  paths:
  - Cargo.toml
  - crates/betterlite-server/**
  - crates/betterlite-http/**
  - crates/betterlite-openai/**
  - tools/oracle/cases/chat/**
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/streaming_handler.py
  why: How LiteLLM rebuilds each chunk before it reaches the client. The oracle decides which of those changes betterlite
    repeats.
- url: https://platform.openai.com/docs/api-reference/chat-streaming
  why: The chunk object and stream_options.include_usage.
- url: https://html.spec.whatwg.org/multipage/server-sent-events.html#event-stream-interpretation
  why: Parsing SSE correctly, including events split across network reads.
dod:
- text: Every listed streaming case matches LiteLLM, chunk by chunk.
  proof:
  - oracle
- text: A chunk reaches the client before the provider sends the next one.
  proof:
  - stream-tests
- text: A client disconnect closes the upstream connection within one second.
  proof:
  - stream-tests
- text: An SSE event split across two network reads is parsed as one event.
  proof:
  - stream-tests
- text: The SSE parser has a cargo-fuzz target at crates/betterlite-openai/fuzz/fuzz_targets/sse_events.rs, and
    replays_the_sse_events_corpus parses every file in its corpus without a panic or a hang.
  proof:
  - sse-fuzz-corpus
- text: Every mutant in the SSE parsing and chunk mapping is caught by a test.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: sse-fuzz-corpus
    why: the SSE fuzz target or its corpus is missing, or replaying the corpus fails
    run: test -f crates/betterlite-openai/fuzz/fuzz_targets/sse_events.rs && test -n "$(ls -A crates/betterlite-openai/fuzz/corpus/sse_events)"
      && cargo nextest run --locked -p betterlite-openai --no-tests=fail -E 'test(replays_the_sse_events_corpus)'
  - id: stream-tests
    why: the streaming tests fail or do not exist
    run: cargo nextest run --locked -p betterlite-openai -p betterlite-server --no-tests=fail -E 'test(/stream/)'
oracle_cases:
- tools/oracle/cases/chat/openai-stream.yaml
- tools/oracle/cases/chat/openai-stream-usage.yaml
- tools/oracle/cases/chat/openai-stream-tools.yaml
- tools/oracle/cases/chat/stream-upstream-500.yaml
deviations: []
out_of_scope:
- Providers other than openai/.
- Errors in the middle of a stream that already started; LiteLLM's behavior there needs its own case design.
- Retries and fallbacks for streams.
pitfalls:
- Test names must contain stream so the stream-tests filter selects them, and the filter must match at least one
  test.
- Timing tests use a mock provider that pauses between chunks and tokio's paused clock where the code allows it,
  not real sleeps of seconds.
- An SSE parser that splits on newlines inside one read breaks on events split across reads. Buffer until the blank
  line.
- B004 created the fuzz crate under crates/betterlite-openai/fuzz/. Add sse_events as a second target there instead
  of a second fuzz crate.
review_level: standard
budget:
  max_changed_lines: 800
  max_new_expects: 0
