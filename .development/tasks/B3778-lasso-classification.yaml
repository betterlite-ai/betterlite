deviations:
  - what: Error messages on blocking violations use betterlite's own wording, not LiteLLM's.
    why: Error messages are betterlite's own per rule errors-match-litellm, with status code and action unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L857-L864

out_of_scope:
  - Lifecycle hook entry points (async_pre_call_hook, async_moderation_hook, async_post_call_success_hook);
    B3779 owns the hook logic.
  - Message expansion and masking application (_run_lasso_guardrail, _handle_masking, _handle_classification,
    _expand_messages_for_classification, _map_masked_messages_back, _apply_masking_to_model_response);
    B3779 owns these.
  - Other guardrail providers (AIM, Akto, Cisco, etc.); each gets its own task.

pitfalls:
  - "Session cache key format is `lasso_conversation_id:{litellm_call_id}` with 3600 second TTL; fallback is a new ULID if cache miss or error."
  - "Tool argument parsing must preserve raw arguments as {arguments: raw_string} when JSON decode fails; do not silently drop malformed arguments."
  - "Only action==\"BLOCK\" triggers a 400 error; AUTO_MASKING, WARN and other actions log and continue."
  - "Missing action field in findings allows even when is_safe=false."
  - "API endpoint selection: /classify for default, /classifix when mask=True and no multimodal content (set via api_url parameter to _call_lasso_api)."
  - "Conversation ID must be included in both headers (lasso-conversation-id) and payload (sessionId) for Lasso's \"Used By\" tracking on Application API Keys."
  - "ULID generation requires the optional `ulid` library; fallback to uuid.uuid4() if not available."
  - "_handle_api_error must wrap httpx-specific exceptions and preserve the HTTPException class for FastAPI response rendering."

