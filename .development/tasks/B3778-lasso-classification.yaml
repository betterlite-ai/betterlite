dod:
  - text: Constructor initializes api_key from parameter or LASSO_API_KEY env var, raising
      LassoGuardrailMissingSecrets if missing; api_base defaults to https://server.lasso.security/gateway/v3,
      reading LASSO_API_BASE; user_id and conversation_id from env vars if not provided.
    proof: [lasso-tests]
  - text: Conversation ID caching uses litellm_call_id as the cache key with format
      `lasso_conversation_id:{litellm_call_id}`, stores generated ULID with 3600 second TTL, and
      returns cached value on cache hit or generates new ULID on miss/error.
    proof: [lasso-tests]
  - text: >-
      Tool-argument extraction parses JSON strings; malformed arguments store
      {arguments: raw_string} to preserve inspection of non-JSON payloads.
    proof: [lasso-tests]
  - text: Headers include lasso-api-key, lasso-user-id (if user_id set), and lasso-conversation-id
      (from cache or generated).
    proof: [lasso-tests]
  - text: >-
      Payload includes messages, messageType (PROMPT/COMPLETION), sessionId, userId (if set),
      tools (flattened ToolDefinition array), and source {type: litellm}.
    proof: [lasso-tests]
  - text: API call to /classify (default) or /classifix (when mask=True, set via api_url param) with
      10 second timeout default, raising on HTTP errors.
    proof: [oracle]
  - text: Response with violations_detected=true and findings.{deputy}[].action=="BLOCK" raises 400
      error; other actions log warning and continue; missing action field allows.
    proof: [oracle]
  - text: LassoGuardrailConfigModel deserializes api_key (required), api_base (default
      https://server.lasso.security/gateway/v3), user_id and conversation_id (optional), returning
      ui_friendly_name() == "Lasso Guardrail".
    proof: [lasso-tests, config-load]
  - text: _handle_api_error distinguishes httpx.TimeoutException, httpx.HTTPStatusError 401 (invalid
      key), 429 (rate limit) and generic errors with appropriate exception messages.
    proof: [lasso-tests]

checks:
  optional: []
  commands:
    - id: lasso-tests
      why: Lasso constructor, session caching, header/payload, API call and response processing tests fail or do not exist
      run: cargo nextest run --locked -p betterlite-guardrails -p betterlite-server --no-tests=fail -E 'test(/lasso_guardrail|lasso.*config/)'
    - id: config-load
      why: Lasso configuration does not load from files or environment
      run: cargo nextest run --locked -p betterlite-guardrails --no-tests=fail -E 'test(/lasso.*config/)'

