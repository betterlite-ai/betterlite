id: B3778
title: Lasso classification transport and session correlation
description: >-
  Build Lasso's constructor, session ID caching, payload/header preparation, network call,
  and action-based rejection. Preserve the one-hour `lasso_conversation_id:` cache entry (TTL 3600),
  raw malformed tool-argument inspection (parse JSON but keep failed arguments as {"arguments": raw_string}),
  and only block findings whose action is "BLOCK"; warn and continue on AUTO_MASKING and other actions.

  Configuration carries api_key (required, reads LASSO_API_KEY), api_base (optional, default
  https://server.lasso.security/gateway/v3, reads LASSO_API_BASE), user_id (optional, reads
  LASSO_USER_ID), conversation_id (optional, reads LASSO_CONVERSATION_ID) and mask (boolean, default
  false). HTTP headers include lasso-api-key (Authorization), lasso-user-id (if set), and
  lasso-conversation-id (generated from litellm_call_id or ULID). Session caching uses
  DualCache.get_cache/set_cache with key `lasso_conversation_id:{litellm_call_id}` and TTL 3600
  seconds.

  Tool-argument extraction parses JSON strings into dicts; malformed arguments stay as
  {"arguments": raw_string} so Lasso still inspects smuggled PII or blocked content in non-JSON
  payloads. Payload includes messages (expanded for inspection), messageType (PROMPT/COMPLETION),
  userId (if user_id set), sessionId (conversation_id), tools (flattened to ToolDefinition array),
  and source: {"type": "litellm"}.

  API endpoints are /classify (default) or /classifix (when mask=True and no multimodal content).
  Response violations_detected=true with findings.{deputy}[].action=="BLOCK" raise 400 error;
  other actions log warning and continue. Missing action field allows even when is_safe=false.

