id: B4786
title: Trigger agent kill switches and manage public discovery
description: >-
  Register POST `/v1/agents/{agent_id}/kill_switch`, `/v1/agents/{agent_id}/make_public`
  and `/v1/agents/make_public`. Preserve authoritative DB webhook selection for kill
  switches, 502 failure results on unsuccessful webhook calls, audit-after-attempt ordering,
  and the different memory/config write order of single-agent append and bulk replacement
  for public discovery.

  The kill_switch route fires the agent's configured kill switch webhook via fire_kill_switch,
  writing an audit log entry after the attempt completes, and returns 200 with the result
  when the webhook answered 2xx, or 502 with the same body when it answered non-2xx.
  Resolution prioritizes the DB row when present; config.yaml agents fall back to the
  in-memory registry. The route calls _check_agent_management_permission for admin access.

  The make_agent_public route adds a single agent's ID to the public_agent_groups list after
  checking the agent exists and is not already listed. It updates litellm_settings.public_agent_groups
  in the config and writes litellm.public_agent_groups in memory. The route checks user_api_key_dict.user_role
  == LitellmUserRoles.PROXY_ADMIN inline with the detail "Only proxy admins can update public model groups.
  Your role={user_api_key_dict.user_role}".

  The bulk make_agents_public route validates all supplied agent IDs exist before any write,
  then replaces the entire public_agent_groups list with the supplied IDs, updating both config
  and memory in that order. The route performs the same inline PROXY_ADMIN role check with
  the same error detail. Both public-discovery routes raise 500 CommonProxyErrors.db_not_connected_error
  when prisma_client is None before proceeding with any agent lookups or writes.

scope:
  paths:
    - crates/betterlite-server/src/lib.rs
    - crates/betterlite-server/src/agent_endpoints/mod.rs
    - crates/betterlite-server/src/agent_endpoints/admin_actions.rs
