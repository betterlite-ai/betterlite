deviations:
  - what: The kill_switch route uses the shared _check_agent_management_permission predicate from B4775,
      while make_agent_public and make_agents_public each perform their own inline user_role == PROXY_ADMIN
      check with the detail "Only proxy admins can update public model groups. Your role={user_api_key_dict.user_role}".
    why: LiteLLM implements the permission checks this way at the pinned commit. The kill_switch route
      shares a common admin predicate, while the public-discovery routes use a domain-specific inline check
      with different error detail text. This is preserved for compatibility with the observed behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L1087
  - what: Both make_agent_public and make_agents_public raise HTTPException 500 with CommonProxyErrors.db_not_connected_error
      detail when prisma_client is None, as a user-visible error on the routes.
    why: LiteLLM checks DB availability at the route entry and returns 500 with that exact detail
      before proceeding with any agent lookup or list modification. betterlite preserves this
      contract as user-visible behavior included in route-level oracle cases.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L1164-L1165
  - what: Kill-switch webhook 502 failures relay the truthful webhook result body instead of wrapped in a 200 error dict.
    why: Clients must distinguish successful webhook delivery (200) from failed webhook (502), so the HTTP status carries the truth.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L1104-L1106

out_of_scope:
  - Kill-switch webhook credential restoration, delivery and audit logging; B4774 owns fire_kill_switch,
    build_kill_switch_audit_log and the audit writer factories.
  - Agent registry lookups, stable ID mapping and public-group state access; B4776 owns agents_table,
    get_agent_by_id, ids_for_agent and public_agent_groups tracking.
  - Config persistence and reading (ProxyConfig.get_config/save_config); G5 owns the configuration storage interface.
  - DB-availability handling for other routes beyond these three; G5 or a dedicated DB-health task owns
    the broader availability check infrastructure.
  - Agent identity validation and policy checks; B4772 owns managed-agent predicates.
  - Middleware-stage route auth installation and feature access checks; B732 owns route setup and B864
    owns check_feature_access_for_user.

pitfalls:
  - Only trigger_agent_kill_switch uses the _check_agent_management_permission predicate from B4775.
    make_agent_public and make_agents_public each implement their own inline PROXY_ADMIN role check
    with the literal error detail "Only proxy admins can update public model groups. Your role={user_api_key_dict.user_role}".
    Do not unify these three routes onto one permission check; the public-discovery routes have different
    error messages and different permission text that must be preserved.
  - The database row always takes precedence over the in-memory registry when resolving a kill-switch
    webhook, so a trigger never fires a webhook that another replica has since disabled or changed.
    Only config.yaml agents without a row fall back to the registry.
  - make_agent_public appends a single agent to the existing list and checks for duplicates using
    all agent IDs; make_agents_public replaces the entire list, making them different operations with
    different semantics. Do not unify them.
  - The kill-switch webhook result carries whatever the webhook returned (headers, body, status code)
    back to the caller on 502; do not lose details or transform it further.
  - Public agent groups are stored as a list of agent IDs in config.litellm_settings.public_agent_groups
    and loaded into memory as litellm.public_agent_groups; both must stay in sync.
  - Both make_agent_public and make_agents_public raise 500 CommonProxyErrors.db_not_connected_error
    when prisma_client is None, before attempting any agent lookups or writes.

