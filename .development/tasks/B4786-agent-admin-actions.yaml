dod:
  - text: >-
      trigger_agent_kill_switch route registers at POST /v1/agents/{agent_id}/kill_switch with user_api_key_auth.
    proof: [http-kill-switch-route]
  - text: >-
      trigger_agent_kill_switch checks agent management permission using _check_agent_management_permission
      and rejects non-admins with 403.
    proof: [http-kill-switch-admin-check]
  - text: >-
      trigger_agent_kill_switch resolves agent kill switch from DB row first, falling back to in-memory
      registry, and rejects missing agents with 404.
    proof: [http-kill-switch-missing-agent]
  - text: >-
      trigger_agent_kill_switch rejects agents with no configured kill_switch with 400.
    proof: [http-kill-switch-no-config]
  - text: >-
      trigger_agent_kill_switch fires the kill switch via fire_kill_switch, writes an audit log entry
      via the supplied writer, and returns 200 with result on 2xx webhook response.
    proof: [http-kill-switch-success]
  - text: >-
      trigger_agent_kill_switch returns 502 with the failed result body when the webhook answers non-2xx.
    proof: [http-kill-switch-failure]
  - text: >-
      make_agent_public route registers at POST /v1/agents/{agent_id}/make_public with user_api_key_auth.
    proof: [http-make-public-single-route]
  - text: >-
      make_agent_public checks user_role == PROXY_ADMIN and rejects non-admins with 403 detail
      "Only proxy admins can update public model groups. Your role=...".
    proof: [http-make-public-single-admin-check]
  - text: >-
      make_agent_public rejects missing agents with 404 after checking registry then DB.
    proof: [http-make-public-single-missing-agent]
  - text: >-
      make_agent_public rejects agents already in public_agent_groups with 400.
    proof: [http-make-public-single-duplicate]
  - text: >-
      make_agent_public appends agent ID to public_agent_groups, updates config then memory, and returns 200.
    proof: [http-make-public-single-success]
  - text: >-
      make_agent_public raises 500 CommonProxyErrors.db_not_connected_error when prisma_client is None.
    proof: [http-make-public-single-db-missing]
  - text: >-
      make_agents_public route registers at POST /v1/agents/make_public with user_api_key_auth.
    proof: [http-make-public-bulk-route]
  - text: >-
      make_agents_public checks user_role == PROXY_ADMIN and rejects non-admins with 403 detail
      "Only proxy admins can update public model groups. Your role=...".
    proof: [http-make-public-bulk-admin-check]
  - text: >-
      make_agents_public validates all supplied agent IDs exist (checking registry then DB) before
      any write, rejecting on first missing agent with 404.
    proof: [http-make-public-bulk-validate-all]
  - text: >-
      make_agents_public replaces the entire public_agent_groups list, updates config then memory, and returns 200.
    proof: [http-make-public-bulk-success]
  - text: >-
      make_agents_public raises 500 CommonProxyErrors.db_not_connected_error when prisma_client is None.
    proof: [http-make-public-bulk-db-missing]
  - text: >-
      Every HTTP status code, error type, param, code and detail message a user can observe in the three
      routes is covered by a named oracle case with literal input and outcome.
    proof: [oracle-management-routes]
  - text: Every mutant in public discovery list management is caught by a test.
    proof: [mutants]

checks:
  optional: [mutants]
  commands:
    - id: http-kill-switch-route
      why: The kill_switch route is not registered or missing the decorator and auth dependency.
      run: grep -qE '@router.post.*kill_switch|fn trigger_agent_kill_switch' crates/betterlite-server/src/agent_endpoints/admin_actions.rs
    - id: http-kill-switch-admin-check
      why: The kill_switch route does not use _check_agent_management_permission or its admin check is missing.
      run: grep -qE '_check_agent_management_permission|check_feature_access_for_user' crates/betterlite-server/src/agent_endpoints/admin_actions.rs
    - id: http-kill-switch-missing-agent
      why: The kill_switch route does not reject missing agents with 404.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*kill.*404/)'
    - id: http-kill-switch-no-config
      why: The kill_switch route does not reject agents without kill_switch config with 400.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*kill.*no.*config/)'
    - id: http-kill-switch-success
      why: The kill_switch route does not fire the kill switch and return 200 on success.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*kill.*success/)'
    - id: http-kill-switch-failure
      why: The kill_switch route does not return 502 on webhook failure.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*kill.*failure.*502/)'
    - id: http-make-public-single-route
      why: The make_agent_public route is not registered or missing the decorator.
      run: grep -qE '@router.post.*make_public.*{agent_id}|fn make_agent_public' crates/betterlite-server/src/agent_endpoints/admin_actions.rs
    - id: http-make-public-single-admin-check
      why: The make_agent_public route does not check PROXY_ADMIN role or uses wrong error detail.
      run: grep -qE 'PROXY_ADMIN|Only proxy admins can update public model groups' crates/betterlite-server/src/agent_endpoints/admin_actions.rs
    - id: http-make-public-single-missing-agent
      why: The make_agent_public route does not reject missing agents with 404.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*make.*single.*404/)'
    - id: http-make-public-single-duplicate
      why: The make_agent_public route does not reject already-public agents with 400.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*make.*single.*duplicate|already/)'
    - id: http-make-public-single-success
      why: The make_agent_public route does not append and return 200 on success.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*make.*single.*success/)'
    - id: http-make-public-single-db-missing
      why: The make_agent_public route does not raise 500 db_not_connected when prisma_client is None.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*make.*single.*(db.*missing|not.*connected)/)'
    - id: http-make-public-bulk-route
      why: The make_agents_public route is not registered or missing the decorator.
      run: grep -qE '@router.post.*make_public[^/]*$|fn make_agents_public' crates/betterlite-server/src/agent_endpoints/admin_actions.rs
    - id: http-make-public-bulk-admin-check
      why: The make_agents_public route does not check PROXY_ADMIN role or uses wrong error detail.
      run: grep -qE 'PROXY_ADMIN|Only proxy admins can update public model groups' crates/betterlite-server/src/agent_endpoints/admin_actions.rs
    - id: http-make-public-bulk-validate-all
      why: The make_agents_public route does not validate all agents before any write.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*make.*bulk.*validate/)'
    - id: http-make-public-bulk-success
      why: The make_agents_public route does not replace and return 200 on success.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*make.*bulk.*success/)'
    - id: http-make-public-bulk-db-missing
      why: The make_agents_public route does not raise 500 db_not_connected when prisma_client is None.
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^agent_admin_actions::tests::.*make.*bulk.*(db.*missing|not.*connected)/)'
    - id: oracle-management-routes
      why: >-
        Kill-switch triggering, public agent management, error status codes, error shapes or permission
        behaviors deviate from LiteLLM behavior in the booted proxy.
      run: >-
        cargo run --locked -p betterlite-oracle --
        tools/oracle/cases/management/agent-admin-actions

