deviations:
  - what: The local records come from 18 embedded fragment files and not from a policy_templates_backup.json read at run time.
    why: A binary has no source tree next to it; the fragments are the same records in the same order, and the helper cases compare ids and records with LiteLLM's file.
out_of_scope:
  - "get_policy_templates (GET /policy/templates, L626-L662), the GitHub fetch, POLICY_TEMPLATES_GITHUB_URL and LITELLM_LOCAL_POLICY_TEMPLATES are B3253's, with the published catalog."
  - "suggest_policy_templates (POST /policy/templates/suggest, L1087-L1120) and AiPolicySuggester are B3253's."
  - "test_policy_template and _test_guardrail_definitions (L1123-L1265) are B3249's."
  - "The validate, list, info and match routes and apply_policies (L67-L605) are B3251's and B3250's."
  - "B005 owns wrap_sse_stream_with_keepalive_pings, SSE_COMMENT_PING and the interval coercion (sse_keepalive.py). This task calls them."
  - "The router handle behind CompetitorModelClient (llm_router.acompletion) is not built here; see notes."

pitfalls:
  - "`_clean_competitor_line` strips only `.`, `-`, `)` and space at the ends, so a leading digit stays and a line like `1. Acme` is kept whole."
  - "`parse_variations` looks names up by lowercase, and two competitors that differ only in case collapse onto the later spelling, so the earlier one gets no variations."
  - "`competitors` in the enrich response is the full list the caller gave, while the variations are asked for only the first MAX_COMPETITOR_NAMES of them."
  - "An empty `competitors` list counts as not given (Python truthiness for a list), so it triggers discovery; a null list does too."
  - "A discovery failure gives an empty list and the route still answers 200 with comparison entries for the brand only, since the two brand entries are added without any competitor."
  - "The no-router case raises ValueError('LLM router not initialized'): the non-stream route hides it, the stream route turns it into an error event with that text."
  - "Refinement streams only new names (the prompt tells the model not to repeat), so the done event's competitors are the given names followed by the new ones, in arrival order."
  - "The last partial line of the streamed text is checked against the set and the cap like any line, but it is not added to the set, which no later line can notice since it is the last."
  - "Pings are comment lines (`: ping`), so the oracle's SSE reader, which keeps only `data: ` lines, never sees them."
  - "A `competitors` list over MAX_COMPETITOR_NAMES is stopped by body decoding with a 422 before the validator's own 400 check, as with pydantic's max_length, so the 400 text only matters for a direct call of the validator."
  - "`MAX_COMPETITOR_NAMES` is read once from the environment; the route code must use the settings value and never a hardcoded 100."
review_level: standard
budget:
  max_changed_lines: 1500
  max_new_expects: 0
