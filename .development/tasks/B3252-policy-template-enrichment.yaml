id: B3252
title: Local template lookup and competitor enrichment
description: >-
  Build three things from LiteLLM's policy_endpoints/endpoints.py: the lookup of the local template catalog, the competitor
  enrichment logic for a template, and the two routes that use them, POST /policy/templates/enrich and POST /policy/templates/enrich/stream.
  The code goes in two crates. Pure logic goes in betterlite-policy and the routes go in betterlite-server.


  Local lookup, in crates/betterlite-policy/src/template_catalog.rs and template_catalog/. LiteLLM's `_load_policy_templates_from_local_backup`
  (L610-L623) reads litellm/policy_templates_backup.json and returns `[]` when the file is missing. betterlite has no such file. Its
  18 local records are one JSON object per file in crates/betterlite-policy/assets/templates/local/ (written by B3254, B3256, B3257,
  B3258, B3261 to B3268). Embed them with `include_str!` from an explicit list of 18 entries, in the order the records have in LiteLLM's
  backup file: advanced-au-pii-protection, baseline-pii-protection, nsfw-content-filter-australia, nsfw-content-filter-basic,
  nsfw-content-filter-all-regions, gdpr-eu-pii-protection, eu-ai-act-article5, mcp-security-unregistered-server-block,
  airline-passenger-data-protection-uae, aviation-operations-security, airline-off-topic-restriction, uae-regulatory-compliance,
  competitor-mention-detection, topic-filtering, prompt-injection-protection, pdpa-singapore, mas-ai-risk-management, claims-agent-safety.
  Do not scan the folder at run time and do not read the published/ folder (B3253 owns the published catalog). Expose
  `local_templates() -> Result<Vec<serde_json::Value>, TemplateCatalogError>` (all 18 records, parsed, keys kept in file order, so enable
  serde_json's `preserve_order` feature if the workspace does not already) and `find_local_template(id: &str) -> Result<Option<serde_json::Value>, TemplateCatalogError>`.
  B3253 calls both. A fragment that does not parse is a `TemplateCatalogError`, not a panic. There is no module-level cache; the caller
  keeps the result if it wants one. serde_json and thiserror are the only new dependencies of betterlite-policy.


  Enrichment logic, in crates/betterlite-policy/src/competitor_enrich.rs and competitor_enrich/. Port these LiteLLM functions with the same
  results (all in endpoints.py):
  - `_clean_competitor_line` (L901-L904): `line.strip()` then strip the characters `.`, `-`, `)` and space from both ends, then strip again;
    return none when the result is empty or one character long. Digits are not in the set, so "1. Acme" stays "1. Acme". Length counts
    characters, not bytes.
  - `_parse_variations_response` (L942-L960): the lookup is lowercase name to the competitor as given (when two competitors differ only in
    case, the later one wins). For each line of the trimmed text that has a colon, split at the first colon, find the competitor by
    the trimmed lowercase name (skip the line when unknown), and set its list to the comma-split, trimmed, non-empty values that differ from the
    competitor ignoring case. A later line for the same competitor replaces the list but keeps the first position in the map.
  - `_build_all_names_per_competitor` (L983-L987), `_build_name_blocked_words` (L1027-L1034), `_build_recommendation_blocked_words`
    (L1037-L1050), `_build_comparison_blocked_words` (L1053-L1084) and `_build_competitor_guardrail_definitions` (L990-L1024). The
    entries are JSON objects `{keyword, action: "BLOCK", description}` with the exact description texts. The recommendation prefixes are
    try, use, switch to, consider, in that order. The two brand entries of the comparison list come last. The definitions function deep
    copies the template's guardrailDefinitions and sets `litellm_params.blocked_words` only for the 11 guardrail_name values in
    LiteLLM's map (competitor-output-blocker, competitor-input-blocker, competitor-name-blocker, competitor-name-input-blocker,
    competitor-name-output-blocker, competitor-recommendation-filter, competitor-recommendation-input-filter,
    competitor-recommendation-output-filter, competitor-comparison-filter, competitor-comparison-input-filter,
    competitor-comparison-output-filter). Other definitions pass through unchanged.
  - Prompt text for the refinement (`_build_refinement_prompt`, L756-L770) and for the variations request (the string built inside
    `_generate_competitor_variations`, L907-L939), character for character. The discovery prompt is the template's own
    `llm_enrichment.prompt` with `{{<parameter>}}` replaced by the brand name.
  - The three constants from litellm/constants.py L2053-L2055: MAX_COMPETITOR_NAMES (env var MAX_COMPETITOR_NAMES, default 100),
    COMPETITOR_LLM_TEMPERATURE (env var COMPETITOR_LLM_TEMPERATURE, default 0.3) and DEFAULT_COMPETITOR_DISCOVERY_MODEL (`gpt-4o-mini`, not an env var). Read the two env vars once at server start into a
    `CompetitorSettings` struct with betterlite-env's `number`, and pass it in. A value that is not a number is a startup error that names the variable.


  Model access. LiteLLM calls `proxy_server.llm_router.acompletion(model, messages, temperature, stream)`. Do not import a router. Define the
  trait `CompetitorModelClient` in betterlite-server (async fn in trait, no `dyn`, like B3103's model client) with
  `complete(&self, model, prompt, temperature) -> Result<String, ModelClientError>` (the first choice's message content, empty text when none) and
  `stream_text(&self, model, prompt, temperature)` returning a stream of content deltas (each chunk's first choice's delta content, empty when
  none). `ModelClientError` carries a message string. The "router is not initialized" case is an error whose text is exactly `LLM router not initialized`.
  Production wiring to the router belongs to the task that builds the router handle; see notes. Tests use a fake client.


  Routes, in crates/betterlite-server/src/policy_template_routes.rs and policy_template_routes/. Both are POST, tag "policy management", in
  the standard authenticated route group (B855 and B756 own auth, B865 owns the management wrapper effects for the non-stream route).
  Neither path is in a role list, so route access follows whatever the shared route checks do for an unlisted path (a non-admin key gets LiteLLM's 403); do not special-case it.
  - `/policy/templates/enrich` (L714-L753). Decode the body (below), validate it (`_validate_enrichment_request`, L682-L711), pick the
    model (`model` or the default), then: when `competitors` is a non-empty list use it as given, else build the prompt and call
    `_discover_competitors_via_llm` (L963-L980: one non-streaming call, split the text into lines, keep the lines `clean_line` accepts, cap at
    MAX_COMPETITOR_NAMES; any model error is logged with `LLM competitor discovery failed: %s` and gives an empty list). Then
    `_generate_competitor_variations` (L907-L939: an empty list gives an empty map without a call; otherwise cap the names at
    MAX_COMPETITOR_NAMES, join with newlines, one call, parse; any model error is logged with `LLM competitor variation generation failed: %s` and gives an empty map). Return
    `{"guardrailDefinitions": [...], "competitors": [...], "competitor_variations": {...}}` where competitors is the list used (not capped)
    and the definitions come from the builder with the template's `guardrailDefinitions` (empty list when the key is missing).
  - Validation errors, all `{"detail": ...}` with the status shown: template id not found among the local records is 404 `Template '<id>' not found`; no
    `llm_enrichment` key is 400 `Template does not support LLM enrichment`; a `competitors` list longer than MAX_COMPETITOR_NAMES is 400
    `competitors list exceeds maximum of <n>`; a missing, null, empty or false `parameters[<llm_enrichment.parameter>]` is 400 `Parameter '<parameter>' is required`. This order. The template is found with `find_local_template`.
  - `/policy/templates/enrich/stream` (L870-L898, generator L813-L867). Same validation, run before the response starts, so errors are plain JSON
    responses. The response is `text/event-stream` with headers `Cache-Control: no-cache` and `X-Accel-Buffering: no`, its stream wrapped by B005's keep-alive
    wrapper with `litellm_settings.sse_keepalive_ping_interval_seconds` (default null, no pings) and the ping text `: ping\n\n`
    (sse_keepalive.py L12 and L45-L60). Each event is `data: <json>\n\n`. Modes, chosen in this order:
    1. `instruction` set and `competitors` non-empty (refinement): emit one `{"type":"competitor","name":...}` per given name, then stream the
       refinement prompt through `_stream_llm_competitor_names` (L773-L810) and emit each new name as it arrives.
    2. `competitors` non-empty without instruction: emit one competitor event per given name and call no model.
    3. otherwise (discovery): stream the discovery prompt with no existing names.
    On a model error in 1 or 3, log `LLM competitor refinement failed: %s` or `LLM competitor streaming failed: %s` at error level, emit
    `{"type":"error","message":<error text>}` and end the stream (no done event). Otherwise emit
    `{"type":"status","message":"Generating alternate spellings for <n> competitors..."}`, run the variations call, emit
    `{"type":"status","message":"Building guardrail definitions with <total> variations..."}` (total is the sum of the list lengths), then
    `{"type":"done","competitors":[...],"competitor_variations":{...},"guardrailDefinitions":[...]}`. The stream-names function: lowercase set
    of the existing names; read deltas, split off each complete line as the buffer fills, clean it, and yield it when it is not in the set and the count (starting at the
    number of existing names) is below MAX_COMPETITOR_NAMES; add it to the set and bump the count. The leftover buffer is handled the same way
    at the end, except that it does not add to the set. Errors from the model client, including `LLM router not initialized`, reach the caller.
  - Request body `EnrichTemplateRequest` (L667-L679): `template_id` string, `parameters` object, `model` optional string, `competitors` optional
    list of strings with at most MAX_COMPETITOR_NAMES entries, `instruction` optional string. Add the pure function
    `decode_enrich_request(bytes: &[u8], max_competitors: usize) -> Result<EnrichTemplateRequest, EnrichRequestError>`. Invalid JSON, a missing
    `template_id` or `parameters`, a wrong type, or a `competitors` list over the limit is the server's shared 422 validation response. Unknown keys are ignored.


  Tests. Native tests, named so the checks can filter on them: `template_catalog::tests::` in betterlite-policy (`lookup_` for the 18 ids and their order, a
  record found by id, an unknown id; `fragment_` for a bad fragment error), `competitor_enrich::tests::` (`clean_` , `parse_`, `names_` for the builder functions,
  `definitions_` for the 11 names and pass-through), and `policy_template_routes::tests::` in betterlite-server (`validate_`, `enrich_`, `stream_` with the fake client, one test per mode and
  per error event; a test that a deduplicated and capped stream stops at the limit; `decode_` for the body decoder). Add a cargo-fuzz target
  `enrich_request` in crates/betterlite-server/fuzz that feeds `decode_enrich_request` and commit corpus files for it (empty input, truncated JSON, a competitors
  value that is a string, a 101-entry list); a test named `replays_the_enrich_request_corpus` replays them.


  Oracle. The helper operation for this task (the skeleton names it b3252 in the policy helper group) runs LiteLLM's own functions through
  `function`: `clean_line`, `parse_variations`, `build_definitions` (a template id from the backup file, competitors, brand name, variations map), `refinement_prompt`, and
  `local_template_ids` (ids of `_load_policy_templates_from_local_backup()` in order) plus `local_template` (one record by id). The Python adapter imports them from
  litellm.proxy.management_endpoints.policy_endpoints.endpoints. HTTP cases go in tools/oracle/cases/policies/templates-enrich/. They use the master key `oracle-master`,
  template `aviation-operations-security` (it has llm_enrichment parameter `brand_name`) and: 404 unknown template, 400 template without enrichment (`baseline-pii-protection`), 400 missing brand,
  422 bad body, 401 without key; enrich with `competitors` given and no model in the config (the router is None in LiteLLM, so variations are empty);
  enrich with `competitors` given and an `oracle-model` openai deployment with an `upstream` reply carrying
  variation lines; enrich with discovery from an upstream reply; stream in the three modes and the no-router error event (the oracle reads each `data:` line as JSON).
  Copy the config and `upstream` shape of tools/oracle/cases/chat/openai-basic.yaml and openai-stream.yaml.

