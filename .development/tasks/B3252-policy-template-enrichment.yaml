dod:
  - text: >-
      local_templates returns the 18 local records parsed from the embedded fragments in LiteLLM's backup-file order, and find_local_template
      returns one by id or none.
    proof: [catalog-tests, oracle, helper-python]
  - text: >-
      clean_line, parse_variations and the prompt builders give LiteLLM's results, including the character set that is stripped, the
      one-character drop, the case-insensitive match and the removal of a variation equal to the name.
    proof: [enrich-logic-tests, oracle, helper-python]
  - text: >-
      The name, recommendation and comparison builders and the definitions builder produce LiteLLM's entries and descriptions, set blocked_words
      only on the 11 named guardrails, and leave the template itself unchanged.
    proof: [enrich-logic-tests, oracle, helper-python]
  - text: >-
      CompetitorSettings reads MAX_COMPETITOR_NAMES (default 100) and COMPETITOR_LLM_TEMPERATURE (default 0.3) and rejects a value that is not a number.
    proof: [enrich-logic-tests]
  - text: >-
      POST /policy/templates/enrich returns the three keys, uses given competitors or discovers them, swallows model errors into empty lists and maps, and
      answers 404, 400 and 422 with LiteLLM's detail texts in the stated order.
    proof: [route-tests, oracle]
  - text: >-
      POST /policy/templates/enrich/stream sends the event types and texts of the three modes in order, dedupes and caps names, ends with an error event
      without done on a model error, and sets the event-stream headers and the keep-alive wrapper.
    proof: [route-tests, oracle]
  - text: >-
      The enrich body decoder rejects malformed bytes and wrong shapes with the shared 422 without panicking and has committed corpus inputs.
    proof: [request-corpus]
checks:
  optional: []
  commands:
    - id: catalog-tests
      why: the local template lookup is missing, out of order or fails on an unknown id
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^template_catalog::.*tests::/)'
    - id: enrich-logic-tests
      why: a line cleaner, parser, builder or settings reader of the enrichment logic is missing or wrong
      run: cargo nextest run --locked -p betterlite-policy --no-tests=fail -E 'test(/^competitor_enrich::.*tests::/)'
    - id: route-tests
      why: an enrich route, its validation, its stream events or its fake-client behavior is missing or wrong
      run: cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(/^policy_template_routes::/) - test(replays_the_enrich_request_corpus)'
    - id: request-corpus
      why: the request decoder has no committed malformed-input regressions or no replay test
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- crates/betterlite-server/fuzz/corpus/enrich_request)" && cargo nextest run --locked -p betterlite-server --no-tests=fail -E 'test(replays_the_enrich_request_corpus)'
    - id: helper-python
      why: the Python oracle helper adapter for this task fails strict Python checks
      run: test -f tools/oracle/helpers/b3252.py && uv run --locked --project tools/oracle/litellm ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright --project tools/oracle/helpers/pyrightconfig.json
