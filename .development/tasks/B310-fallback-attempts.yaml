id: B310
title: Execute authorized fallback attempts
description: 'Compose B309 plans with the B017 retry executor and B052/B071 access and budget checks.
  Recheck access and budget on every target before contacting a provider, preserve provider-scoped resources,
  and move capacity and reservation ownership between attempts. Emit B012 success/failure fallback events
  and the retry/fallback headers, including optional redacted error details. Expose the same engine to
  B014''s direct completion fallbacks without duplicating traversal; retain the direct-call terminal error
  contract through B011. Use B398 for fallback observations and response metadata; do not reproduce its
  callback or header code. Implement the owned native service in crates/betterlite-router/src/fallback_attempts.rs.
  Add ProbeOperation::FallbackAttempts in tools/oracle/src/router_probes/mod.rs and the corresponding B310 entry in
  tools/oracle/litellm/probes/registry.py; the adapters only call production services. Shared exports
  and dispatch files are explicitly in scope. Budget allocation: at most 360 implementation lines, 220
  behavior-test lines, 140 Rust/Python adapter lines and 80 parser/fuzz/integration lines (800 total);
  fixture/corpus files use only the existing checks.yaml exclusions. Reuse predecessor services instead
  of copying their algorithms. Function coverage in litellm/litellm_core_utils/fallback_utils.py: async_completion_with_fallbacks
  (L17-L81), completion_with_fallbacks (L84-L85). Implement these behaviors through the typed Rust services
  above; synchronous facades and structural accessors reuse the same primitive instead of separate ports.
  Function coverage in litellm/router_utils/fallback_event_handlers.py: _get_fallback_target_model_group
  (L498-L502), _is_fallback_target_authorized (L505-L526), _is_fallback_target_within_budget (L529-L545),
  references_provider_scoped_resource (L548-L567), creates_provider_scoped_resource (L570-L579), run_async_fallback
  (L582-L719), _check_non_standard_fallback_format (L778-L802), run_non_standard_fallback_format (L805-L806).
  Implement these behaviors through the typed Rust services above; synchronous facades and structural
  accessors reuse the same primitive instead of separate ports.'
