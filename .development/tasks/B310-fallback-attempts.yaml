id: B310
title: Execute authorized fallback attempts
description: Compose B309 plans with the B017 retry executor and B052/B071 access and budget checks. Recheck
  access and budget on every target before contacting a provider, preserve provider-scoped resources,
  and move capacity and reservation ownership between attempts. Emit B012 success/failure fallback events
  and the retry/fallback headers, including optional redacted error details. Expose the same engine to
  B014's direct completion fallbacks without duplicating traversal; retain the direct-call terminal error
  contract through B011. Use the existing Rust crate boundaries from B004 and B008; integrate through
  the server when the provider dispatcher or callbacks live in another core crate. This task's source
  slices are the linked ranges, not a port of their Python classes. Add the listed oracle cases and the
  matching adapters to B301's component runner where state is not observable over HTTP; adapters call
  production logic and never reproduce it. Use deterministic candidate sets or supplied random samples
  for comparisons, and separate seeded distribution tests for random choices. Extend the existing config_yaml
  fuzz target and committed corpus for every newly accepted config form; unsupported keys still fail by
  full path. Keep the implementation, adapters and tests within 800 changed lines; fixtures and oracle
  cases are budget-excluded by checks.yaml.
scope:
  paths:
  - crates/betterlite-router/**
  - crates/betterlite-config/**
  - crates/betterlite-server/**
  - tools/oracle/cases/routing/fallback-attempts/**
  - tools/oracle/src/router_probes/fallback-attempts/**
  - tools/oracle/src/router_probes/mod.rs
  - tools/oracle/litellm/probes/fallback_attempts.py
  - tools/oracle/litellm/probes/registry.py
  lint_tables: false
references:
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/fallback_event_handlers.py#L498-L806
  why: Authorization, resource ownership, budget checks and traversal.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_utils.py#L17-L85
  why: Direct completion fallback contract.
- url: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/add_retry_fallback_headers.py#L228-L334
  why: Failure detail and attempt headers.
dod:
- text: Every listed case compares the production result and relevant state transitions against the pinned
    LiteLLM implementation.
  proof:
  - oracle
- text: Focused tests cover cancellation, bounds and invalid inputs at this module's boundaries without
    weakening existing routing tests.
  proof:
  - routing-tests
- text: The newly supported config fields have valid and invalid corpus seeds, remain typed, and unknown
    fields still fail startup.
  proof:
  - config-corpus
  - routing-tests
- text: All mutants in changed router, config or wire code are caught.
  proof:
  - mutants
checks:
  optional:
  - mutants
  commands:
  - id: routing-tests
    why: the focused routing tests are missing or fail
    run: cargo nextest run --locked -p betterlite-router -p betterlite-config -p betterlite-server --no-tests=fail
      -E 'test(fallback_attempts)'
  - id: config-corpus
    why: the new configuration forms are absent from the fuzz corpus or their replay fails
    run: test -f crates/betterlite-config/fuzz/fuzz_targets/config_yaml.rs && test -n "$(ls -A crates/betterlite-config/fuzz/corpus/config_yaml)"
      && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
  - id: probe-python
    why: the task's Python oracle adapter fails strict typing or linting
    run: uv run --locked --project tools/oracle/litellm ruff check tools/oracle/litellm/probes && uv run
      --locked --project tools/oracle/litellm basedpyright tools/oracle/litellm/probes
oracle_cases:
- tools/oracle/cases/routing/fallback-attempts/retry-before-fallback.yaml
- tools/oracle/cases/routing/fallback-attempts/fallback-success-headers.yaml
- tools/oracle/cases/routing/fallback-attempts/last-fallback-error.yaml
- tools/oracle/cases/routing/fallback-attempts/denied-target-no-upstream.yaml
- tools/oracle/cases/routing/fallback-attempts/over-budget-target-no-upstream.yaml
- tools/oracle/cases/routing/fallback-attempts/provider-resource-stays-in-group.yaml
- tools/oracle/cases/routing/fallback-attempts/parameter-overrides-no-leak.yaml
- tools/oracle/cases/routing/fallback-attempts/bounded-cycle.yaml
- tools/oracle/cases/routing/fallback-attempts/direct-completion-fallback.yaml
deviations: []
out_of_scope:
- New budget or access-control subsystems.
- Streaming fallback commitment, handled by B311/B312.
pitfalls:
- Authentication of the original model does not authorize all fallback targets.
- Provider-owned IDs must not cross model groups.
- No request-scoped fallback can bypass the configured destination policy.
review_level: security
budget:
  max_changed_lines: 800
  max_new_expects: 0
