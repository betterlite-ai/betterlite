id: B714
title: Reader routing and writer-pinned transactions
description: >-
  Expose ReadTarget and WriterSession over independently injected writer and reader pools. Keep read method
  routing and explicit writer pinning in repository calls; transaction writes and read-after-write invariants
  must not depend on replica lag. Exercise independent connection and recreation failures against the
  same typed session contract.


  Build the production database_replica module in betterlite-db; reuse the typed dependencies listed in
  the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with adjacent
  tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/db/routing_prisma_wrapper.py:
  _RoutedActions.__init__ (L48-L56; 9 source lines), _RoutedActions.__getattr__ (L58-L61; 4 source lines),
  WriterPinnedClient.__init__ (L80-L81; 2 source lines), writer_wrapper (L84-L86; 3 source lines), RoutingPrismaWrapper.__init__
  (L119-L125; 5 source lines), RoutingPrismaWrapper.writer (L128-L129; 2 source lines), RoutingPrismaWrapper.reader
  (L132-L133; 2 source lines), RoutingPrismaWrapper.read_target (L136-L144; 8 source lines), RoutingPrismaWrapper.reader_unavailable
  (L147-L148; 2 source lines), RoutingPrismaWrapper.writer_unavailable (L151-L152; 2 source lines), RoutingPrismaWrapper.mark_writer_recovered
  (L154-L161; 8 source lines), RoutingPrismaWrapper._should_use_reader (L163-L164; 2 source lines), RoutingPrismaWrapper._try_connect
  (L167-L174; 8 source lines), RoutingPrismaWrapper.connect (L176-L206; 27 source lines), RoutingPrismaWrapper.disconnect
  (L208-L218; 11 source lines), RoutingPrismaWrapper.is_connected (L220-L225; 2 source lines), RoutingPrismaWrapper.start_token_refresh_task
  (L227-L229; 3 source lines), RoutingPrismaWrapper.stop_token_refresh_task (L231-L233; 3 source lines),
  RoutingPrismaWrapper.recreate_prisma_client (L235-L275; 39 source lines), RoutingPrismaWrapper._recreate_reader
  (L277-L293; 16 source lines), RoutingPrismaWrapper.__getattr__ (L295-L308; 11 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): DATABASE_URL_READ_REPLICA=''.


  Real Postgres tests use betterlite-postgres-fixture as a dev-dependency: POSTGRES_TEST_URL when set,
  otherwise testcontainers. Failure to connect/start is a test failure, never an ignored or skipped test.
  The architect supplies the CI Postgres service. postgres_pinned_rows checks actual rows/catalog facts
  against independently initialized pinned fixtures; postgres_failure_effects injects a failure and checks
  the exact source transaction rollback or preceding partial writes. Use a unique schema per test and
  clean it on every exit.


  Write betterlite-config::database_replica::tests::loads_settings, defaults_and_precedence and invalid_value_fallback.
  Each must call the production B002 config loader, set every listed key/env binding, assert the resulting
  typed value is consumed by this component, and exercise the specified warning/ignore/error branch. A
  grep or successful generic corpus replay does not prove acceptance. Seed existing config_yaml with the
  actual nested key and an env-resolution case; no new config parser or fuzz workspace.


  This part consumes already typed inputs or a decoder owned by its direct dependencies; it adds no byte
  parser and no task-specific fuzz target. HTTP request schema changes belong to the named request/model
  contract owner, not a duplicate decoder in the handler.


  The oracle runs open-source LiteLLM without its enterprise directory/package. Follow the reachable MIT
  fallback. Only the explicitly recorded no-paid-tier deviations may enable an MIT premium_user branch;
  prove those differences in Rust tests, outside the equality corpus.


  Sizing: 169 nonblank, noncomment pinned source lines (including owned declarations/static SQL); allow
  169 production, 154 behavior/Postgres tests, 0 helper adapters, 30 route/manifests/wiring, 0 decoder/fuzz
  and 50 config lines, 403 changed lines estimated within a 425-line gate. Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.
