id: B503
title: OpenAI chat media and tool sanitation
description: >-
  Implement immutable ChatContent normalization and request assembly using the existing typed chat model and prompt
  helpers. Preserve configured openai_system_messages_first (default false) as an injected flag, provider-specific
  cache-control handling, bounded schema sanitation, and missing-file errors. A supplied filename remains metadata.
  Existing chat parsing owns the public shape; this module accepts and returns that typed value.


  Own exactly these source functions or explicitly delimited dispatch branches: litellm/llms/openai/chat/gpt_transformation.py:
  OpenAIGPTConfig.contains_pdf_url L233-L238; OpenAIGPTConfig._handle_pdf_url L240-L248; OpenAIGPTConfig._async_handle_pdf_url
  L250-L257; OpenAIGPTConfig._common_file_data_check L259-L264; OpenAIGPTConfig._apply_common_transform_content_item
  L266-L296; OpenAIGPTConfig._transform_content_item L298-L313; OpenAIGPTConfig._async_transform_content_item L315-L329;
  OpenAIGPTConfig._transform_messages L334-L337; OpenAIGPTConfig._transform_messages L340-L346; OpenAIGPTConfig._transform_messages
  L350-L382; OpenAIGPTConfig.remove_cache_control_flag_from_messages_and_tools L384-L406; OpenAIGPTConfig._targets_openai_hosted_endpoint
  L408-L421; OpenAIGPTConfig._should_preserve_cache_control_for_endpoint L423-L436; OpenAIGPTConfig._sanitized_tools_update_for_openai
  L438-L465; OpenAIGPTConfig._prompt_cache_ordered_messages L467-L474; OpenAIGPTConfig.transform_request L476-L511;
  OpenAIGPTConfig.async_transform_request L513-L548.


  remote-url-current-rejection supplies an http:// image or PDF URL requiring local bytes and expects ImageFetchError
  status 400 before transport under the current open request-download decision; inject the same failed-download
  seam into the pinned helper. Inline bytes continue to compare normally; provider-forwardable URL descriptors remain
  unchanged where the source forwards them.


  Implement crates/betterlite-openai/src/chat_content.rs with adjacent tests under chat_content/. Keep each Rust
  module at most 300 lines. Use the typed records and direct prerequisites listed in backlog.yaml; a provider leaf
  never imports betterlite-provider or betterlite-core. The production function is the only Rust implementation
  used by tests and oracle adapters.


  Register helper operation openai_chat_content in tools/oracle/src/helpers/mod.rs and tools/oracle/helpers/dispatch.py.
  The Rust adapter calls production code; the Python adapter invokes the referenced pinned functions with fixture
  transport/SDK constructors, clocks and IDs, never a copied algorithm. Run with LITELLM_RUST=false and the local
  model map; intercept HTTP before external IO. A native-only binding is captured at its call seam where specified
  above. Compare omissions, warning/drop/fallback outcomes and stable error fields as well as success.


  Write rstest function chat_content_cases in betterlite-openai with these exact named cases (one per oracle file):
  string_image_url, file_data_default_filename, file_block_without_file, inline_pdf, custom_base_cache_control,
  hosted_cache_control_removal, schema_combinators_and_regex, tool_choice_without_tools, sync_async_max_retries,
  system_messages_first, remote_url_current_rejection. Each case exercises its named outcome independently; use
  stable supplied clocks/IDs and fixture transports. HTTP cases use the booted proxy and assert both client response
  and captured upstream request. Existing API tasks retain route registration; this task must not register a duplicate
  axum route.


  Add new shared-parser seeds tools/oracle/fuzz/corpus/helper_case/openai_chat_content* using HelperCase: kind:
  helper and the externally tagged openai_chat_content variant inside call. Do not put the Python stdin operation
  field in a HelperCase. Add oracle test helper_seeds_select_openai_chat_content that parses every prefixed seed
  with the production HelperCase parser, asserts that exact variant and fails on zero seeds; then replay the shared
  corpus.


  This task transforms already parsed records or delegates byte decoding to a named prerequisite/library; it adds
  no provider byte parser and no provider fuzz target. The HelperCase parser is B171; configuration parsing, when
  needed, is B002.


  Resolve only these newly owned config/environment inputs in crates/betterlite-config/src/providers/openai/chat_content.rs
  and its loader wiring: openai_system_messages_first. Module-level settings enter litellm_settings; deployment
  settings enter litellm_params; environment lookup is injected. Keep the defaults and precedence specified above
  and in the linked branches; existing key owners remain unchanged. Write config rstest openai_chat_content_config_cases
  with named cases loads_openai_system_messages_first, plus rejects_unrelated_key. Each loads case calls the real
  config loader with that key and asserts the resolved value, default, precedence and secret redaction where applicable.
  Seed B002 config_yaml with new openai_chat_content* files for every key; reuse its parser/fuzz target.


  Budget from 285 nonblank, noncomment lines in the owned LiteLLM ranges (including executable declarations and
  docstrings; SDK overloads share an async implementation): 305 production lines, 151 behavior/config-test lines,
  99 combined Rust/Python adapter lines, 0 parser target/replay lines, 28 config/loader lines and 25 module/dispatch/shared-seed
  wiring lines; 608 planned, 625 maximum changed lines.
