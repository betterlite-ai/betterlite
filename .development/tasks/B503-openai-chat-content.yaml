pitfalls:
- 'The oracle helper for this task is pre-registered as openai_chat_content in the openai group. Replace the stub Op in tools/oracle/src/helpers/openai/chat_content.rs with an impl Helper whose Input is the typed input, and write run in tools/oracle/helpers/openai_chat_content.py. The registry files (helpers/mod.rs, the group files, dispatch.py) are not this task''s to edit.'
- contains_pdf_url checks only https://, http:// and www. prefixes, not a .pdf suffix.
- The async subclass path transforms messages before invoking the sync hook again, so hooks must not accidentally
  duplicate hoisted image blocks.
- The hosted-cache predicate accepts openai.com and any of its subdomains, broader than the api.openai.com credential-host
  predicate.
