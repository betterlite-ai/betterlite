id: B890
title: JWT role and scope claim projections
description: >-
  Project JWT roles without normalizing away the source's claim-shape behavior. get_scopes reads only
  the literal scope claim: missing means [], strings split on arbitrary whitespace, and lists are
  returned unchanged, including nonstring members. Null, numbers and objects raise the 'Unmapped
  scope type' exception; they are not empty scopes. is_admin tests exact membership of configured
  admin_jwt_scope (default litellm_proxy_admin). The scope error occurs before any team/user/role
  mapping can grant access.

  get_user_roles and get_jwt_role use B213's get_nested_value with respectively user_roles_jwt_field
  and roles_jwt_field; unset fields and KeyError return the caller's default. Present values retain
  their shape: a string is not wrapped as one role and null is not replaced by the default. Other
  lookup errors propagate. is_allowed_user_role requires nonnull claim and user_allowed_roles, then
  iterates the claim and accepts any exact member; a string therefore iterates characters, a dict
  iterates keys, and a noniterable fails. role_mappings likewise builds a set of the truthy roles
  and returns the first mapping whose role is in it; null/empty means no mapping, unhashable members
  fail. Map order wins over claim order, and these mappings have no wildcard matching.

  get_rbac_role evaluates scopes/admin and user roles first, then chooses proxy_admin, a nonnull
  B760 team id (including an empty id), a nonnull B760 user id or allowed user role, then the first
  role_mappings match, else None. A user id does not need an allowed role. B760 alone owns trusted
  issuer normalization; this task neither accepts a request trust marker nor verifies signatures.
  jwt_litellm_role_map is a separate projection used by role synchronization: for each mapping in
  configuration order, scan the JWT roles and return the first fnmatch match. Match Python fnmatch's
  pinned Linux behavior: case-sensitive *, ?, bracket sets/ranges/negation, slash as an ordinary
  character and unmatched brackets literal. Do not use model/provider wildcard semantics. Empty
  mappings or roles return None; wrong role types propagate instead of silently dropping the role.


  Build the production jwt_role_claims module in betterlite-auth; reuse the typed dependencies listed
  in the backlog. Keep Rust implementation files below 300 lines by using named domain submodules with
  adjacent tests.rs files.


  Production ownership, including fields, protocol contracts and accessors as native types: litellm/proxy/auth/handle_jwt.py:
  JWTHandler._rbac_role_from_role_mapping (L304-L333; 22 source lines), JWTHandler.get_rbac_role (L335-L369;
  30 source lines), JWTHandler.is_admin (L371-L374; 4 source lines), JWTHandler.get_user_roles (L587-L604;
  17 source lines), JWTHandler.map_jwt_role_to_litellm_role (L606-L619; 12 source lines), JWTHandler.get_jwt_role
  (L621-L640; 18 source lines), JWTHandler.is_allowed_user_role (L642-L654; 12 source lines), JWTHandler.get_scopes
  (L735-L746; 11 source lines).


  Pinned settings read by this component (resolve once in betterlite-config, pass typed values): litellm_jwtauth.admin_jwt_scope='litellm_proxy_admin';
  litellm_jwtauth.user_roles_jwt_field=None; litellm_jwtauth.user_allowed_roles=None; litellm_jwtauth.roles_jwt_field=None;
  litellm_jwtauth.role_mappings=None; litellm_jwtauth.jwt_litellm_role_map=None.


  Add the jwt_role_claims operation under B856 Management::jwt. Python calls only the owned MIT helper
  with injected clock/cache/DB/network collaborators; it never calls a route or copies the expected algorithm.
  Rust invokes the production module. Compare typed values, exception status/type/param/code, ordered
  warnings and effects; exclude only random IDs and message text with a reason per pointer. Add a jwt-role-claims-*
  seed to B171 helper_case, which already owns this decoder.


  These pure projections have no route, SQL or authentication success of their own. The equality
  corpus invokes JWTHandler methods on constructed verified-claim fixtures, not a JWT HTTP request
  that MIT LiteLLM rejects at B875's license gate. B875/B053 own the native JWT integration and
  B757 owns outer error translation (a plain scope/role exception becomes 401 auth_error, string
  None param, code 401); do not add a second premium deviation here.

  Load the six settings through B869 and test the real B002 boundary with
  jwt_role_claims::tests::six_role_settings_defaults, six_role_settings_consumed and
  invalid_role_setting_shapes_fail. Config schema errors stop loading; they do not pick a fallback.
  Preserve B869's requirement that user_roles_jwt_field and user_allowed_roles appear together.


  Sizing: the eight ranges contain 126 lines before docstring exclusion; allow 160 production,
  240 behavior tests, 65 helper adapters, 25 wiring and 50 config lines, 540 within a 600-line gate.
  Only the repository fixture/corpus/lock
  exclusions apply; production SQL counts. Do not duplicate dependency implementations.


  Keep the implementation in the auth crate; B053 calls these projections through its handler.
