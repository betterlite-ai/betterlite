dod:
  - text: 'Cases scope_missing_empty, scope_whitespace_split, scope_list_preserves_shapes,
      scope_other_types_error_before_identity, admin_scope_exact, roles_unset_or_missing_default,
      roles_null_retained, roles_dot_path_errors, user_role_any_exact_member,
      role_string_character_semantics, role_dict_key_semantics, role_noniterable_and_unhashable_errors,
      rbac_admin_team_user_mapping_precedence, nonnull_empty_identity_counts,
      user_identity_bypasses_allowed_roles, role_mapping_order_and_exactness,
      litellm_role_map_configuration_order, fnmatch_case_slash_question_brackets,
      empty_maps_and_roles_none and no_mapping_none exercise every projection branch.'
    proof:
      - behavior-tests
      - oracle
      - helper-python
      - helper-case-corpus
  - text: The independently invoked MIT helper matches the production operation and the new helper-case
      seed replays.
    proof:
      - oracle
      - helper-python
      - helper-case-corpus
  - text: Every named setting loads through the production config boundary with its pinned default, precedence
      and invalid-value behavior.
    proof:
      - config-tests
      - config-corpus
checks:
  optional:
    - mutants
  commands:
    - id: behavior-tests
      why: The named domain behavior tests are absent or the pinned behavior fails.
      run: cargo nextest run --locked -p betterlite-auth --no-tests=fail -E 'test(/^jwt_role_claims::tests::/)
        - test(/replays_the_/)'
    - id: helper-python
      why: The referenced helper adapter is missing or strict Python checking fails.
      run: test -f tools/oracle/helpers/jwt_role_claims.py && uv run --locked --project tools/oracle/litellm
        ruff check tools/oracle/helpers && uv run --locked --project tools/oracle/litellm basedpyright
        --project tools/oracle/helpers/pyrightconfig.json
    - id: helper-case-corpus
      why: The new typed operation has no seed or the existing HelperCase decoder fails replay.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "tools/oracle/fuzz/corpus/helper_case/jwt-role-claims-*")"
        && grep -rlq "jwt_role_claims" tools/oracle/fuzz/corpus/helper_case/jwt-role-claims-* && cargo
        nextest run --locked -p betterlite-oracle --no-tests=fail -E 'test(replays_the_helper_case_corpus)'
    - id: config-tests
      why: The actual configuration loader rejects, ignores or misresolves a new setting.
      run: cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(/^jwt_role_claims::tests::/)
        - test(/replays_the_/)'
    - id: config-corpus
      why: The task added no new configuration seed or production config replay fails.
      run: test -n "$(git diff --name-only --diff-filter=A "$GATE_BASE" -- "crates/betterlite-config/fuzz/corpus/config_yaml/jwt-role-claims-*")"
        && grep -rlq "admin_jwt_scope" crates/betterlite-config/fuzz/corpus/config_yaml/jwt-role-claims-*
        && cargo nextest run --locked -p betterlite-config --no-tests=fail -E 'test(replays_the_config_yaml_corpus)'
