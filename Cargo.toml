[workspace]
exclude = ["crates/.claude", "crates/betterlite-openapi/fuzz", "tools/.claude", "tools/dashboard", "tools/python-release"]
members = [
  "crates/*",
  "crates/*/fuzz",
  "tools/*",
  "tools/*/fuzz",
  "tools/oracle/groups",
  "tools/oracle/helper-api",
  "tools/oracle/runner",
  "tools/oracle/src/helpers/a2a",
  "tools/oracle/src/helpers/anthropic",
  "tools/oracle/src/helpers/auth",
  "tools/oracle/src/helpers/azure",
  "tools/oracle/src/helpers/bedrock",
  "tools/oracle/src/helpers/cache",
  "tools/oracle/src/helpers/cli",
  "tools/oracle/src/helpers/config",
  "tools/oracle/src/helpers/context",
  "tools/oracle/src/helpers/core_ops",
  "tools/oracle/src/helpers/cost",
  "tools/oracle/src/helpers/db",
  "tools/oracle/src/helpers/error",
  "tools/oracle/src/helpers/foundry",
  "tools/oracle/src/helpers/guardrails",
  "tools/oracle/src/helpers/harness",
  "tools/oracle/src/helpers/http",
  "tools/oracle/src/helpers/lens",
  "tools/oracle/src/helpers/logging",
  "tools/oracle/src/helpers/mcp",
  "tools/oracle/src/helpers/models",
  "tools/oracle/src/helpers/ocr",
  "tools/oracle/src/helpers/openai",
  "tools/oracle/src/helpers/openapi",
  "tools/oracle/src/helpers/paths",
  "tools/oracle/src/helpers/policy",
  "tools/oracle/src/helpers/prometheus",
  "tools/oracle/src/helpers/prompts",
  "tools/oracle/src/helpers/provider",
  "tools/oracle/src/helpers/proxy",
  "tools/oracle/src/helpers/pyhost",
  "tools/oracle/src/helpers/rate_limit",
  "tools/oracle/src/helpers/redact",
  "tools/oracle/src/helpers/redis",
  "tools/oracle/src/helpers/reporting",
  "tools/oracle/src/helpers/roi",
  "tools/oracle/src/helpers/sdk",
  "tools/oracle/src/helpers/secret_managers",
  "tools/oracle/src/helpers/secrets",
  "tools/oracle/src/helpers/server",
  "tools/oracle/src/helpers/streaming",
  "tools/oracle/src/helpers/tokenizer",
  "tools/oracle/src/helpers/vertex",
  "tools/oracle/src/helpers/websearch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "original-uri", "tokio"] }
blake2 = "0.10.6"
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde"] }
deadpool-postgres = "0.14.2"
hex = "0.4.3"
hyper-util = "0.1.21"
percent-encoding = "2.3.2"
phf = { version = "0.13.1", features = ["macros"] }
quick-xml = "0.41.0"
redis = { version = "1.7.0", default-features = false }
regex = "1.13.1"
rust_decimal = { version = "1.43.0", features = ["serde-with-arbitrary-precision"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.5"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "2.0.0", features = ["serialize"] }
serde_ignored = "0.1.14"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls-improved = { version = "0.17.1", default-features = false, features = ["aws-lc-rs"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.28.0", default-features = false, features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow" # denying the whole restriction group is the point
implicit_return = "allow" # contradicts needless_return; the tail expression is how Rust returns
question_mark_used = "allow" # ? is the explicit, checked way to pass an error up
missing_docs_in_private_items = "allow" # doc comments are banned; names and types carry the meaning
missing_errors_doc = "allow" # same; the error enum documents the failures
missing_panics_doc = "allow" # same; panics are denied anyway
field_scoped_visibility_modifiers = "allow" # the alternative is one-line getters, which are banned
redundant_pub_crate = "allow" # contradicts rustc's unreachable_pub
pub_with_shorthand = "allow" # contradicts pub_without_shorthand; pub(crate) stays
self_named_module_files = "allow" # contradicts mod_module_files; foo.rs next to foo/ stays
separated_literal_suffix = "allow" # contradicts unseparated_literal_suffix
semicolon_inside_block = "allow" # contradicts semicolon_outside_block
big_endian_bytes = "allow" # the three byte-order lints contradict each other; host order stays denied
little_endian_bytes = "allow" # same
arbitrary_source_item_ordering = "allow" # sorts items by kind and splits a type from its impl
single_call_fn = "allow" # contradicts too_many_lines; a long function splits into steps called once
pattern_type_mismatch = "allow" # forces & in every pattern over a reference and catches no bug
std_instead_of_alloc = "allow" # betterlite is a std server with no no_std target
std_instead_of_core = "allow" # same
missing_trait_methods = "allow" # would force overriding every default trait method
exhaustive_structs = "allow" # no outside users; #[non_exhaustive] only forces wildcard arms, which are denied
exhaustive_enums = "allow" # same
missing_inline_in_public_items = "allow" # inlining is the compiler's call
module_name_repetitions = "allow" # contradicts error_impl_error, which asks for ConfigError over Error
missing_assert_message = "allow" # the test name and the compared values already say what failed
cargo_common_metadata = "allow" # nothing is published to crates.io
multiple_crate_versions = "allow" # cargo deny reports duplicate versions where they can be acted on

[profile.release]
panic = "unwind" # a panic that slips through ends one request's task, not every request in flight

[profile.dev]
debug = false # nobody reads debug info here; dropping it cut a full CI test build by 18% (run 43735860292) and saves disk in every worktree

[profile.dev.package]
# with serde_core, serde_json and sha1 also at 3, a test parses the 3 MB bundled model catalog in 0.2 s instead of 0.73 s, and betterlite-models builds in 43 s instead of 12
betterlite-models = { opt-level = 3 }
granit-parser = { opt-level = 3 } # with serde-saphyr and serde_ignored, the 352-file config corpus loads in 19.7 s instead of 37.6 s
kitoken = { opt-level = 3 } # a tiktoken vocabulary builds twice as fast
lopdf = { opt-level = 3 } # with nom, a 33 MiB PDF text stream parses in 1.0 s instead of 20 s
nom = { opt-level = 3 }
regex-automata = { opt-level = 2 } # Redactor compilation otherwise dominates debug startup.
regex-syntax = { opt-level = 2 }
salsa20 = { opt-level = 3 }
scrypt = { opt-level = 3 } # an N=2^15 key derivation takes 0.1 s instead of 6 s
serde-saphyr = { opt-level = 3 }
serde_core = { opt-level = 3 }
serde_json = { opt-level = 3 }
serde_ignored = { opt-level = 3 }
sha1 = { opt-level = 3 }
