[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
hyper-util = "0.1.21"
percent-encoding = "2.3.2"
regex = "1.13.1"
rust_decimal = { version = "1.43.0", default-features = false, features = ["serde"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_ignored = "0.1.14"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
variant_size_differences = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow" # denying the whole restriction group is the point
implicit_return = "allow" # contradicts needless_return; the tail expression is how Rust returns
question_mark_used = "allow" # ? is the explicit, checked way to pass an error up
missing_docs_in_private_items = "allow" # doc comments are banned; names and types carry the meaning
missing_errors_doc = "allow" # same; the error enum documents the failures
missing_panics_doc = "allow" # same; panics are denied anyway
field_scoped_visibility_modifiers = "allow" # the alternative is one-line getters, which are banned
redundant_pub_crate = "allow" # contradicts rustc's unreachable_pub
pub_with_shorthand = "allow" # contradicts pub_without_shorthand; pub(crate) stays
self_named_module_files = "allow" # contradicts mod_module_files; foo.rs next to foo/ stays
separated_literal_suffix = "allow" # contradicts unseparated_literal_suffix
semicolon_inside_block = "allow" # contradicts semicolon_outside_block
big_endian_bytes = "allow" # the three byte-order lints contradict each other; host order stays denied
little_endian_bytes = "allow" # same
arbitrary_source_item_ordering = "allow" # sorts items by kind and splits a type from its impl
single_call_fn = "allow" # contradicts too_many_lines; a long function splits into steps called once
pattern_type_mismatch = "allow" # forces & in every pattern over a reference and catches no bug
std_instead_of_alloc = "allow" # betterlite is a std server with no no_std target
std_instead_of_core = "allow" # same
missing_trait_methods = "allow" # would force overriding every default trait method
exhaustive_structs = "allow" # no outside users; #[non_exhaustive] only forces wildcard arms, which are denied
exhaustive_enums = "allow" # same
missing_inline_in_public_items = "allow" # inlining is the compiler's call
module_name_repetitions = "allow" # contradicts error_impl_error, which asks for ConfigError over Error
missing_assert_message = "allow" # the test name and the compared values already say what failed
cargo_common_metadata = "allow" # nothing is published to crates.io
multiple_crate_versions = "allow" # cargo deny reports duplicate versions where they can be acted on

[profile.release]
panic = "unwind" # a panic that slips through ends one request's task, not every request in flight
