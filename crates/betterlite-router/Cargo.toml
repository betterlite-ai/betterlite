[package]
name = "betterlite-router"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
testing = []

[dependencies]
async-trait = "0.1.92"
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-error = { path = "../betterlite-error" }
betterlite-models = { path = "../betterlite-models" }
betterlite-redis = { path = "../betterlite-redis" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
chrono.workspace = true
fancy-regex = "0.19.2"
hex.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
rand = { version = "0.10.3", default-features = false, features = ["alloc", "std_rng"] }
redis.workspace = true
regex.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing = "0.1.44"
unicode-general-category = "1.1.0"

[dev-dependencies]
betterlite-http = { path = "../betterlite-http" }
betterlite-models = { path = "../betterlite-models" }
prometheus-client = "0.25.1"
rstest = "=0.27.0"
tokio = { workspace = true, features = ["test-util"] }
