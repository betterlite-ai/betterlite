[package]
name = "betterlite-tokenizer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-http = { path = "../betterlite-http" }
betterlite-models = { path = "../betterlite-models" }
futures-util = { version = "0.3.34", default-features = false, features = ["async-await"] }
hex.workspace = true
hf-hub = { version = "=1.0.0", features = ["rustls-tls"] }
http = "1.5.0"
kitoken = { version = "=0.11.1", default-features = false, features = ["std", "convert-tiktoken", "regex-unicode"] }
lru = "0.18.4"
secrecy.workspace = true
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2.workspace = true
thiserror.workspace = true
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true
[dev-dependencies]
rstest = "=0.27.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
[lints]
workspace = true
