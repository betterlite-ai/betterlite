[package]
name = "betterlite-guardrails"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
betterlite-anthropic = { path = "../betterlite-anthropic" }
betterlite-bedrock = { path = "../betterlite-bedrock" }
betterlite-bedrock-guardrails = { path = "../betterlite-bedrock-guardrails" }
betterlite-compression = { path = "../betterlite-compression" }
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-core = { path = "../betterlite-core" }
betterlite-db = { path = "../betterlite-db" }
betterlite-env = { path = "../betterlite-env" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-redis = { path = "../betterlite-redis" }
betterlite-streaming = { path = "../betterlite-streaming" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
chrono.workspace = true
fancy-regex = "0.19.2"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "sink"] }
hex.workspace = true
hyper = { version = "1.12.0", features = ["client", "http1"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
lru = "0.18.4"
mime_guess = { version = "2.0.5", default-features = false }
pem = "4.0.0"
percent-encoding.workspace = true
pkcs8 = { version = "0.11.0", default-features = false }
rand = { version = "0.10.3", default-features = false, features = ["alloc", "std_rng", "sys_rng"] }
regex.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "multipart", "query"] }
rust_decimal.workspace = true
rustls = { workspace = true, features = ["std", "tls12"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-saphyr.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2.workspace = true
strfmt = "0.2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
ulid = "3.0.0"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
axum.workspace = true
betterlite-test-ports = { path = "../betterlite-test-ports" }
mutants = "0.0.4"
rcgen ={ version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rstest = "=0.27.0"
temp-env = "0.3.6"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing-subscriber.workspace = true

[[test]]
name = "block_code_execution"
path = "src/block_code_execution/lifecycle/tests.rs"

[[test]]
name = "noma_v2"
path = "src/noma_v2/tests.rs"

[[test]]
name = "onyx"
path = "src/onyx/tests.rs"

[[test]]
name = "repello_lifecycle"
path = "src/repello_lifecycle/tests.rs"

[[test]]
name = "vigil_guard"
path = "src/vigil_guard/tests.rs"
