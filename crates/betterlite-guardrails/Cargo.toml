[package]
name = "betterlite-guardrails"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
betterlite-compression = { path = "../betterlite-compression" }
betterlite-config = { path = "../betterlite-config" }
betterlite-http = { path = "../betterlite-http" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-redact = { path = "../betterlite-redact" }
fancy-regex = "0.19.2"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
indexmap = { version = "2.14.2", features = ["serde"] }
lru = "0.18.4"
mime_guess = { version = "2.0.5", default-features = false }
regex.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query"] }
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tree-sitter = "0.25.10"
tree-sitter-python = "0.25.0"
ulid = "3.0.0"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
rstest = "=0.27.0"
rustls = { workspace = true, features = ["std", "tls12"] }
temp-env = "0.3.6"
tracing-subscriber.workspace = true

[[test]]
name = "vigil_guard"
path = "src/vigil_guard/tests.rs"
