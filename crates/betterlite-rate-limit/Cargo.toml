[package]
name = "betterlite-rate-limit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum.workspace = true
betterlite-auth = { path = "../betterlite-auth" }
betterlite-cache = { path = "../betterlite-cache" }
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-core = { path = "../betterlite-core" }
betterlite-db = { path = "../betterlite-db" }
betterlite-error = { path = "../betterlite-error" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-redis = { path = "../betterlite-redis" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
chrono = { workspace = true, features = ["clock"] }
crc16 = "0.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
num-traits = "0.2.19"
rust_decimal.workspace = true
serde.workspace = true
serde_json = "1.0.154"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
betterlite-http = { path = "../betterlite-http" }
rstest = "=0.27.0"
tokio = { workspace = true, features = ["time"] }
tracing-subscriber.workspace = true

# the dynamic limiter's tests name their module after the hook, so nextest sees dynamic_limits::<test>
[[test]]
name = "dynamic_limits"
path = "src/dynamic_limits/tests.rs"

[lints]
workspace = true
