[package]
name = "betterlite-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
betterlite-cache = { path = "../betterlite-cache" }
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-db = { path = "../betterlite-db" }
betterlite-env = { path = "../betterlite-env" }
betterlite-error = { path = "../betterlite-error" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-paths = { path = "../betterlite-paths" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-redis = { path = "../betterlite-redis" }
betterlite-routes = { path = "../betterlite-routes" }
betterlite-secrets = { path = "../betterlite-secrets" }
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
deadpool-postgres.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex.workspace = true
http = "1.5.0"
indexmap = "2.14.2"
lru = "0.18.4"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
pcre2 = "0.2.11"
regex.workspace = true
regex-syntax = "0.8.11"
rust_decimal = { workspace = true, features = ["serde-with-float"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
sha2.workspace = true
speedate = "0.18.0"
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
betterlite-postgres-fixture = { path = "../../tools/postgres-fixture" }
betterlite-test-ports = { path = "../betterlite-test-ports" }
clap = { version = "4.6.7", features = ["derive", "env"] }
mutants = "0.0.4"
redis.workspace = true
rstest = "=0.27.0"
serde_json = "1.0.154"
tokio = { workspace = true, features = ["test-util", "time"] }
tokio-postgres.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }

[lints]
workspace = true
