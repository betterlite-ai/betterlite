[package]
name = "betterlite-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-core = { path = "../betterlite-core" }
betterlite-error = { path = "../betterlite-error" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-streaming = { path = "../betterlite-streaming" }
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex.workspace = true
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
bytes = "1.12.1"
rstest = "=0.27.0"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["registry"] }

[lints]
workspace = true
