[package]
name = "betterlite-bedrock-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
async-trait = "0.1.92"
betterlite-bedrock = { path = ".." }
