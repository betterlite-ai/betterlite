[package]
name = "betterlite-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
betterlite-secrets = { path = "../betterlite-secrets" }
chrono.workspace = true
deadpool-postgres.workspace = true
percent-encoding.workspace = true
regex.workspace = true
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.145", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"

[dev-dependencies]
betterlite-postgres-fixture = { path = "../../tools/postgres-fixture" }
clap = { version = "4.6.7", features = ["derive", "env"] }
rstest = "=0.27.0"
serde_json = { version = "1.0.145", features = ["raw_value"] }
tokio.workspace = true
