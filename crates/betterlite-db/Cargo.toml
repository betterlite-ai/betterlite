[package]
name = "betterlite-db"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio", "test-util"] }
aws-credential-types = "=1.3.1"
aws-runtime = "=1.9.4"
aws-sdk-sts = { version = "=1.116.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-async = "=1.3.1"
aws-smithy-runtime-api = { version = "=1.19.2", features = ["client"] }
aws-types = "=1.6.0"
base64 = "0.23.1"
betterlite-env = { path = "../betterlite-env" }
betterlite-lens = { path = "../betterlite-lens" }
betterlite-models = { path = "../betterlite-models" }
betterlite-policy = { path = "../betterlite-policy" }
betterlite-prometheus = { path = "../betterlite-prometheus" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-redis = { path = "../betterlite-redis" }
betterlite-roi = { path = "../betterlite-roi" }
betterlite-secret-managers = { path = "../betterlite-secret-managers" }
betterlite-secrets = { path = "../betterlite-secrets" }
betterlite-sigv4 = { path = "../betterlite-sigv4" }
blake2.workspace = true
bytes = "1.12.1"
chrono = { workspace = true, features = ["clock"] }
csv = "1.4.0"
deadpool-postgres.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
num-traits = "0.2.19"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
percent-encoding.workspace = true
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
redis = { workspace = true, features = ["aio", "tokio-comp"] }
regex.workspace = true
rust_decimal = { workspace = true, features = ["db-tokio-postgres", "serde-with-float"] }
rustls = { workspace = true, features = ["std", "tls12"] }
rustls-native-certs.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.145", features = ["float_roundtrip", "raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
sha2.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls-improved.workspace = true
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
unicode-normalization = "0.1.26"
uuid.workspace = true
whoami = "2.1.3"

[dev-dependencies]
aws-smithy-types = "=1.9.1"
betterlite-openai = { path = "../betterlite-openai" }
betterlite-postgres-fixture = { path = "../../tools/postgres-fixture" }
betterlite-redis-fixture = { path = "../../tools/redis-fixture" }
betterlite-test-ports = { path = "../betterlite-test-ports" }
clap = { version = "4.6.7", features = ["derive", "env"] }
mutants = "0.0.4"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rstest = "=0.27.0"
serde_json = { version = "1.0.145", features = ["raw_value"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing-subscriber.workspace = true
url = "2.5.8"
