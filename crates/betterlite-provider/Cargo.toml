[package]
name = "betterlite-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-env = { path = "../betterlite-env" }
betterlite-http = { path = "../betterlite-http" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
pem = "4.0.0"
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
url = "2.5.8"

[dev-dependencies]
mutants = "0.0.4"
rstest = "=0.27.0"
tokio.workspace = true

[lints]
workspace = true
