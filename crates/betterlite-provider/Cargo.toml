[package]
name = "betterlite-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-env = { path = "../betterlite-env" }
betterlite-error = { path = "../betterlite-error" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-streaming = { path = "../betterlite-streaming" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
hex.workspace = true
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "dds", "ff", "hdr", "ico", "jpeg", "png", "pnm", "tga"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
pem = "4.0.0"
regex.workspace = true
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
serde_repr = "0.1.21"
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true
zeroize = "1.9.1"

[dev-dependencies]
mutants = "0.0.4"
rstest = "=0.27.0"
tokio = { workspace = true, features = ["io-util", "net", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
