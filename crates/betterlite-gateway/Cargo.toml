[package]
name = "betterlite-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-routes = { path = "../betterlite-routes" }
betterlite-server = { path = "../betterlite-server" }
clap = { version = "4.6.7", features = ["derive", "env"] }

[dev-dependencies]
axum.workspace = true
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
phf.workspace = true
rstest = "=0.27.0"
serde.workspace = true
serde_json = "1.0.145"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "time"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
