[package]
name = "betterlite-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
betterlite-config = { path = "../betterlite-config" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-routes = { path = "../betterlite-routes" }
betterlite-server = { path = "../betterlite-server" }
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
