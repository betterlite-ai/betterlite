[package]
name = "betterlite-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
betterlite-config = { path = "../betterlite-config" }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["async-await"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
percent-encoding.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "stream"] }
rustls = { workspace = true, features = ["std", "tls12"] }
rustls-native-certs.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
