[package]
name = "betterlite-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio", "test-util"] }
aws-credential-types = "=1.3.1"
aws-sdk-sts = { version = "=1.116.0", default-features = false, features = ["rt-tokio"] }
aws-sigv4 = "1.6.2"
aws-smithy-async = "=1.3.1"
aws-smithy-runtime-api = { version = "=1.19.2", features = ["client"] }
aws-types = "=1.6.0"
betterlite-config = { path = "../betterlite-config" }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["async-await"] }
hex.workspace = true
http = "1.5.0"
idna = "1.1.0"
ipnet = "2.12.2"
libc = "0.2.191"
opentelemetry-http = { version = "0.33.1", default-features = false }
percent-encoding.workspace = true
regex.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "deflate", "gzip", "http2", "rustls", "stream"] }
rustls = { workspace = true, features = ["std", "tls12"] }
rustls-native-certs.workspace = true
secrecy.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid.workspace = true
webpki-roots = "1.0.11"
zip = { version = "9.1.0", default-features = false, features = ["bzip2", "deflate-flate2-zlib", "lzma"] }

[dev-dependencies]
aws-smithy-types = "=1.9.1"
base64 = "0.23.1"
crc32fast = "1.5.3"
h2 = "0.4.20"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
