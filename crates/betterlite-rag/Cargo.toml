[package]
name = "betterlite-rag"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
betterlite-bedrock = { path = "../betterlite-bedrock" }
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-provider = { path = "../betterlite-provider" }
betterlite-redis = { path = "../betterlite-redis" }
hex.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
percent-encoding.workspace = true
redis.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
aws-smithy-async = "=1.3.1"
aws-smithy-runtime-api = { version = "=1.19.2", features = ["client"] }
aws-types = "=1.6.0"
betterlite-redact = { path = "../betterlite-redact" }
betterlite-secret-managers = { path = "../betterlite-secret-managers" }
rstest = "=0.27.0"
tokio = { workspace = true, features = ["test-util", "time"] }

[lints]
workspace = true
