[package]
name = "betterlite-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Nothing enables this; a declared feature changes the unit fingerprint, so the shared lint lane rebuilds this crate and its dependents instead of reusing metadata another checkout built before the complexity_placement Config existed.
lint-lane-rebuild = []

[dependencies]
aws-credential-types = "1.3.1"
aws-sigv4 = "1.6.2"
aws-smithy-runtime-api = "1.19.1"
betterlite-db = { path = "../betterlite-db" }
betterlite-env = { path = "../betterlite-env" }
betterlite-models = { path = "../betterlite-models" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-redis = { path = "../betterlite-redis" }
betterlite-secret-managers = { path = "../betterlite-secret-managers" }
betterlite-secrets = { path = "../betterlite-secrets" }
chrono.workspace = true
derive_more = { version = "2.1.1", default-features = false, features = ["into"] }
fancy-regex = "0.19.2"
indexmap = { version = "2.14.2", features = ["serde"] }
netrc-rs = "0.1.2"
percent-encoding.workspace = true
regex.workspace = true
regex-syntax = "0.8.11"
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-inline-default = "1.0.3"
serde-saphyr.workspace = true
serde_ignored.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
shellexpand = { version = "3.1.2", default-features = false, features = ["full"] }
soft-canonicalize = "0.5.6"
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tracing.workspace = true
unicode-general-category = "1.1.0"
unicode-ident = "1.0.27"
unicode_titlecase = "2.5.0"
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
betterlite-db = { path = "../betterlite-db" }
betterlite-postgres-fixture = { path = "../../tools/postgres-fixture" }
deadpool-postgres.workspace = true
insta = { version = "1.49.0", default-features = false, features = ["yaml"] }
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
