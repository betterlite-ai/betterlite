[package]
name = "betterlite-config-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
betterlite-config = { path = ".." }
libfuzzer-sys = "0.4.9"
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3.27.0"

[[bin]]
name = "config_yaml"
path = "fuzz_targets/config_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_includes"
path = "fuzz_targets/config_includes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rag_ingest_options"
path = "fuzz_targets/rag_ingest_options.rs"
test = false
doc = false
bench = false

[workspace]
