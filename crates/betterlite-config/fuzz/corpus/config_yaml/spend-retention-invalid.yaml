model_list:
  - model_name: gpt
    litellm_params:
      model: openai/gpt-4o-mini
general_settings:
  maximum_spend_logs_retention_period: forever
  maximum_autorouter_session_retention_period: 2.5
  maximum_health_check_retention_period: [7]
