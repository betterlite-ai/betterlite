  maximum_spend_logs_cleanup_batch_size: 2.9
  maximum_spend_logs_cleanup_max_batches: false
  maximum_spend_logs_cleanup_run_budget: 300
  maximum_spend_logs_cleanup_batch_timeout: {seconds: 30}
