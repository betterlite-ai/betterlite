# a Veo deployment: DEFAULT_GOOGLE_VIDEO_DURATION_SECONDS comes from the environment, not the file
litellm_settings:
  num_retries: 2
  vertex_project: project-example
  vertex_location: us-central1

model_list:
  - model_name: veo-3.0-generate-001
    litellm_params:
      model: vertex_ai/veo-3.0-generate-001
      api_base: https://us-central1-aiplatform.googleapis.com
    model_info:
      id: veo-video-deployment
