router_settings:
  routing_groups:
    - group_name: cheap
      models:
        - gpt-4o-mini
        - gpt-4.1-mini
      routing_strategy: least-busy
    - group_name: escalation
      models:
        - gpt-4o
        - gpt-4.1
      routing_strategy: priority
      model_priorities:
        gpt-4o: 1
        gpt-4.1: 2
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
