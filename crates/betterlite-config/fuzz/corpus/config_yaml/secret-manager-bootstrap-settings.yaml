general_settings:
  key_management_system: hashicorp_vault
  key_management_settings:
    access_mode: read_only
    hosted_keys: [virtual-key]
    prefix_for_stored_virtual_keys: litellm/
    primary_secret_name: primary
    kms_key_id: os.environ/KMS_ID
    tags:
      Environment: os.environ/KMS_ENVIRONMENT
    replica_regions: [us-east-1]
    store_virtual_keys: os.environ/STORE_VIRTUAL_KEYS
model_list:
- model_name: gpt
  litellm_params:
    model: openai/gpt-4o-mini
    api_key: os.environ/OPENAI_API_KEY
