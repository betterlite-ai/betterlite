model_list:
  - model_name: quality-router
    litellm_params:
      model: auto_router/quality_router
      quality_router_config:
        available_models: [quality-fast, quality-strong]
        complexity_to_quality:
          SIMPLE: 1
          MEDIUM: 2
          COMPLEX: 3
          REASONING: 4
        default_model: quality-fallback
  - model_name: quality-fast
    litellm_params:
      model: openai/gpt-4o-mini
    model_info:
      litellm_routing_preferences:
        quality_tier: 1
        keywords: [code]
        order: 1
      input_cost_per_token: 0.000001
  - model_name: quality-strong
    litellm_params:
      model: openai/gpt-4o
    model_info:
      litellm_routing_preferences:
        quality_tier: 4
      input_cost_per_token: 0.00001
