[package]
name = "betterlite-prompts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
chrono.workspace = true
fancy-regex = "0.19.2"
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
minijinja = { version = "3.0.4", features = ["builtins", "fuel", "preserve_order", "serde"] }
minijinja-contrib = { version = "3.0.4", default-features = false, features = ["pycompat"] }
percent-encoding.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-saphyr.workspace = true
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
thiserror.workspace = true
tracing.workspace = true
url = "2.5.8"

[dev-dependencies]
betterlite-config = { path = "../betterlite-config" }
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
