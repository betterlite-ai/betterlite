[package]
name = "betterlite-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-db = { path = "../betterlite-db" }
betterlite-http = { path = "../betterlite-http" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-secrets = { path = "../betterlite-secrets" }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
derive_more = { version = "2.1.1", default-features = false, features = ["display"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex.workspace = true
http = "1.5.0"
pem = "4.0.0"
regex.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw"] }
rust_decimal = { workspace = true, features = ["serde-with-float"] }
rustix = { version = "1.1.5", features = ["process"] }
scrypt = { version = "0.11.0", default-features = false }
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value", "arbitrary_precision"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2.workspace = true
sse-stream = "0.2.6"
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
url = "2.5.8"

[dev-dependencies]
aws-credential-types = "=1.3.1"
aws-smithy-async = "=1.3.1"
axum = { workspace = true }
rstest = "=0.27.0"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
