[package]
name = "betterlite-azure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-error = { path = "../betterlite-error" }
