url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
async-trait = "0.1.92"
rstest = "=0.27.0"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
