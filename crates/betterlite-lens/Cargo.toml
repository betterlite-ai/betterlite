[package]
name = "betterlite-lens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
garde = { version = "0.23.0", default-features = false, features = ["derive", "regex", "rust_decimal"] }
hex = "0.4.3"
indexmap = "2.14.2"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-inline-default = "1.0.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
rstest = "=0.27.0"
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
