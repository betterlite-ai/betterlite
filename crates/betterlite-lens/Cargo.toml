[package]
name = "betterlite-lens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
garde = { version = "0.23.0", default-features = false, features = ["derive", "regex", "rust_decimal"] }
hex = "0.4.3"
indexmap = "2.14.2"
rust_decimal = { version = "1.43.0", features = ["serde-with-float"] }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-inline-default = "1.0.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror.workspace = true

[dev-dependencies]
rstest = "=0.27.0"

[lints]
workspace = true
