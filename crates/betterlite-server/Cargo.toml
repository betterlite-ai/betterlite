regex.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["server"] }
rust_decimal.workspace = true
scrypt = { version = "0.11.0", default-features = false }
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-saphyr.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
sha1 = "0.11.0"
sha2.workspace = true
soft-canonicalize = "0.5.6"
speedate = "0.18.0"
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tower = { workspace = true, features = ["timeout"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
betterlite-postgres-fixture = { path = "../../tools/postgres-fixture" }
betterlite-router = { path = "../betterlite-router", features = ["testing"] }
betterlite-secrets = { path = "../betterlite-secrets" }
betterlite-test-ports = { path = "../betterlite-test-ports" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
clap = { version = "4.6.7", features = ["derive", "env"] }
mutants = "0.0.4"
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["testing", "trace"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rquickjs = "0.14.0"
rstest = "=0.27.0"
rustls = { workspace = true, features = ["std", "tls12"] }
signal-hook = { version = "0.4.6", default-features = false }
temp-env = { version = "0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower = { workspace = true, features = ["util"] }
zip = { version = "9.1.0", default-features = false, features = ["bzip2", "deflate-flate2-zlib", "lzma"] }

[[test]]
name = "public_endpoints_resource_hubs"
path = "src/public_endpoints/resource_hubs/routes.rs"

[lints]
workspace = true
