[package]
name = "betterlite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum.workspace = true
base64 = "0.23.1"
betterlite-auth = { path = "../betterlite-auth" }
betterlite-billing = { path = "../betterlite-billing" }
betterlite-config = { path = "../betterlite-config" }
betterlite-core = { path = "../betterlite-core" }
betterlite-db = { path = "../betterlite-db" }
betterlite-env = { path = "../betterlite-env" }
betterlite-error = { path = "../betterlite-error" }
betterlite-http = { path = "../betterlite-http" }
betterlite-models = { path = "../betterlite-models" }
betterlite-ocr = { path = "../betterlite-ocr" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-roi = { path = "../betterlite-roi" }
betterlite-router = { path = "../betterlite-router" }
betterlite-semantic = { path = "../betterlite-semantic" }
caseless = "0.2.2"
chrono = { workspace = true }
email_address = "0.2.9"
encoding_rs = "0.8.42"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await"] }
getrandom = "0.4.3"
hex.workspace = true
http-body = "1.1.0"
hyper-util = { workspace = true, features = ["server-auto", "tokio", "service"] }
icu_properties = "2.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
multipart-rs = "0.2.3"
percent-encoding.workspace = true
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
regex.workspace = true
rust_decimal.workspace = true
scrypt = { version = "0.11.0", default-features = false }
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
sha1 = "0.11.0"
sha2.workspace = true
soft-canonicalize = "0.5.6"
speedate = "0.18.0"
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tower = { workspace = true, features = ["timeout"] }
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
betterlite-postgres-fixture = { path = "../../tools/postgres-fixture" }
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool-postgres.workspace = true
rquickjs = "0.14.0"
rstest = "=0.27.0"
rustls = { workspace = true, features = ["std", "tls12"] }
signal-hook = { version = "0.4.6", default-features = false }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
