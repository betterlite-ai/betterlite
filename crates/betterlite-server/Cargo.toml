percent-encoding.workspace = true
phf.workspace = true
pkcs8 = { version = "0.11.0", default-features = false }
pyo3 = { version = "0.30.1", default-features = false }
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
