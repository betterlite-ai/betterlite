bytes = "1.12.1"
caseless = "0.2.2"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { workspace = true }
crc32fast = "1.5.3"
deadpool-postgres.workspace = true
email_address = "0.2.9"
encoding_rs = "0.8.42"
