[package]
name = "betterlite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
betterlite-config = { path = "../betterlite-config" }
betterlite-http = { path = "../betterlite-http" }
betterlite-openai = { path = "../betterlite-openai" }
email_address = "0.2.9"
form_urlencoded = "1.2.2"
hyper-util = { workspace = true, features = ["server-auto", "tokio", "service"] }
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
regex.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["timeout"] }
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
rquickjs = "0.14.0"
rstest = "=0.27.0"
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
