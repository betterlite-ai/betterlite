[package]
name = "betterlite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
betterlite-config = { path = "../betterlite-config" }
betterlite-db = { path = "../betterlite-db" }
betterlite-error = { path = "../betterlite-error" }
betterlite-http = { path = "../betterlite-http" }
betterlite-ocr = { path = "../betterlite-ocr" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-roi = { path = "../betterlite-roi" }
chrono = { workspace = true }
email_address = "0.2.9"
encoding_rs = "0.8.42"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["async-await"] }
hyper-util = { workspace = true, features = ["server-auto", "tokio", "service"] }
multipart-rs = "0.2.3"
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
regex.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["timeout"] }
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
betterlite-postgres-fixture = { path = "../../tools/postgres-fixture" }
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool-postgres.workspace = true
rquickjs = "0.14.0"
rstest = "=0.27.0"
tokio-postgres = { workspace = true, features = ["with-chrono-0_4"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
