[package]
name = "betterlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-config = { path = "../betterlite-config" }
betterlite-env = { path = "../betterlite-env" }
betterlite-server = { path = "../betterlite-server" }
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
croner = "2.2.0"
nix = { version = "0.31.3", default-features = false, features = ["term"] }
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
regex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
whoami = "2.1.3"

[lints]
workspace = true

[dev-dependencies]
rstest = "=0.27.0"
serde.workspace = true
serde_json = "1.0.145"
tokio = { workspace = true, features = ["test-util", "time"] }
