[package]
name = "betterlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
betterlite-auth = { path = "../betterlite-auth" }
betterlite-config = { path = "../betterlite-config" }
betterlite-core = { path = "../betterlite-core" }
betterlite-db = { path = "../betterlite-db" }
betterlite-env = { path = "../betterlite-env" }
betterlite-guardrails = { path = "../betterlite-guardrails" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-pyhost = { path = "../betterlite-pyhost" }
betterlite-router = { path = "../betterlite-router" }
betterlite-secret-managers = { path = "../betterlite-secret-managers" }
betterlite-server = { path = "../betterlite-server" }
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
croner = "2.2.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
nix = { version = "0.31.3", default-features = false, features = ["term"] }
rand = { version = "0.10.3", default-features = false, features = ["std_rng", "sys_rng"] }
regex.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json = "1.0.145"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true
whoami = "2.1.3"

[lints]
workspace = true

[dev-dependencies]
betterlite-cache = { path = "../betterlite-cache" }
betterlite-secrets = { path = "../betterlite-secrets" }
betterlite-server = { path = "../betterlite-server", features = ["testing"] }
betterlite-test-ports = { path = "../betterlite-test-ports" }
rstest = "=0.27.0"
serde.workspace = true
serde_json = "1.0.145"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util", "time"] }
tracing-subscriber.workspace = true
