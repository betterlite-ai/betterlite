[package]
name = "betterlite-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await"] }
hex.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
rust_decimal = "1.43.0"
rustix = { version = "1.1.5", features = ["process"] }
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2.workspace = true
similar = "3.2.0"
soft-canonicalize = "0.5.6"
tempfile = "3.27.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
which = "8.0.6"

[dev-dependencies]
rstest = "=0.27.0"
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
