[package]
name = "betterlite-harness-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
metadata.cargo-fuzz = true
[dependencies]
betterlite-harness = { path = ".." }
libfuzzer-sys = "0.4.9"
tokio = { version = "=1.53.3", features = ["io-util", "rt"] }
[[bin]]
name = "payloads"
path = "fuzz_targets/payloads.rs"
test = false
doc = false
bench = false
[[bin]]
name = "snapshots"
path = "fuzz_targets/snapshots.rs"
test = false
doc = false
bench = false
[[bin]]
name = "cli_jsonl_framing"
path = "fuzz_targets/cli_jsonl_framing.rs"
test = false
doc = false
bench = false
[workspace]
