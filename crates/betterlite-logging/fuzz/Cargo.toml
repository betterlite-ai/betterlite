[package]
name = "betterlite-logging-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
betterlite-logging = { path = ".." }
chrono = "0.4.45"
libfuzzer-sys = "0.4.9"
serde_json = { version = "1.0.154", features = ["raw_value"] }

[[bin]]
name = "otlp_decode"
path = "fuzz_targets/otlp_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opik_config_file"
path = "fuzz_targets/opik_config_file.rs"
test = false
doc = false
bench = false


[[bin]]
name = "s3_v2"
path = "fuzz_targets/s3_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prometheus_query"
path = "fuzz_targets/prometheus_query.rs"
test = false
doc = false
bench = false
