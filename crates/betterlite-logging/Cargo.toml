[package]
name = "betterlite-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-config = { path = "../betterlite-config" }
betterlite-models = { path = "../betterlite-models" }
chrono.workspace = true
flate2 = "1.1.5"
hex.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
parquet-format-safe = "0.2.4"
parquet2 = { version = "0.17.2", default-features = false, features = ["snappy"] }
pep440_rs = "0.7.3"
prost = "0.14.4"
regex.workspace = true
rust_decimal.workspace = true
ryu = "1.0.23"
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc"] }
sha2.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[dev-dependencies]
insta = { version = "1.49.0", default-features = false, features = ["yaml"] }
rstest = "=0.27.0"
serde-saphyr.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
tracing-subscriber.workspace = true

[[test]]
name = "mlflow_logging"
path = "src/mlflow/test_target.rs"

[lints]
workspace = true

[[test]]
name = "sdk_analytics"
path = "src/analytics/suite.rs"

[[test]]
name = "s3_v2_params"
path = "src/s3_v2/tests/suite.rs"
