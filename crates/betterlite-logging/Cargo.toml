[package]
name = "betterlite-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-config = { path = "../betterlite-config" }
chrono.workspace = true
polars = { version = "0.51.0", default-features = false, features = ["csv", "dtype-datetime", "dtype-decimal", "lazy", "parquet"] }
serde.workspace = true
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[dev-dependencies]
rstest = "=0.27.0"

[lints]
workspace = true
