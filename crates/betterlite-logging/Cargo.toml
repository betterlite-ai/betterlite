[package]
name = "betterlite-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-config = { path = "../betterlite-config" }
chrono.workspace = true
flate2 = "1.1.5"
hex.workspace = true
parquet-format-safe = "0.2.4"
parquet2 = { version = "0.17.2", default-features = false, features = ["snappy"] }
pep440_rs = "0.7.3"
regex.workspace = true
rust_decimal.workspace = true
ryu = "1.0.23"
serde.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }

[dev-dependencies]
rstest = "=0.27.0"
serde-saphyr.workspace = true
serde_json = "1.0.154"
tracing-subscriber.workspace = true

[[test]]
name = "mlflow_logging"
path = "src/mlflow/test_target.rs"

[lints]
workspace = true

[[test]]
name = "sdk_analytics"
path = "src/analytics/suite.rs"
