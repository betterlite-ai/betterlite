[package]
name = "betterlite-logging"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-env = { path = "../betterlite-env" }
betterlite-http = { path = "../betterlite-http" }
betterlite-models = { path = "../betterlite-models" }
betterlite-prometheus = { path = "../betterlite-prometheus" }
betterlite-redact = { path = "../betterlite-redact" }
chrono.workspace = true
csv = "1.4.0"
flate2 = "1.1.5"
hex.workspace = true
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
minijinja = { version = "3.0.4", features = ["builtins", "fuel", "preserve_order", "serde"] }
minijinja-contrib = { version = "3.0.4", default-features = false, features = ["pycompat"] }
nix = { version = "0.31.3", default-features = false, features = ["feature"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["logs", "metrics", "trace"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "http-json", "http-proto", "logs", "metrics", "trace"] }
opentelemetry-stdout = { version = "0.33.1", default-features = false, features = ["logs", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["logs", "metrics", "testing", "trace"] }
parquet-format-safe = "0.2.4"
parquet2 = { version = "0.17.2", default-features = false, features = ["snappy"] }
pep440_rs = "0.7.3"
percent-encoding.workspace = true
prost = "0.14.4"
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
regex.workspace = true
rust_decimal.workspace = true
ryu = "1.0.23"
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
sha2.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tonic = { version = "0.14.9", default-features = false }
tracing.workspace = true
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
betterlite-openai = { path = "../betterlite-openai" }
betterlite-privacy-openai = { path = "src/logging_privacy/openai" }
h2 = "0.4.20"
insta = { version = "1.49.0", default-features = false, features = ["yaml"] }
rstest = "=0.27.0"
serde-saphyr.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
temp-env = "0.3.6"
tokio = { workspace = true, features = ["test-util", "time"] }
tracing-subscriber.workspace = true

[[test]]
name = "mlflow_logging"
path = "src/mlflow/test_target.rs"

[lints]
workspace = true

[[test]]
name = "sdk_analytics"
path = "src/analytics/suite.rs"

[[test]]
name = "mavvrik_delivery"
path = "src/mavvrik_delivery/tests/suite.rs"

[[test]]
name = "opik"
path = "src/opik/tests.rs"

[[test]]
name = "rubrik_payloads"
path = "src/rubrik/tests.rs"

[[test]]
name = "s3_v2_params"
path = "src/s3_v2/tests/suite.rs"
