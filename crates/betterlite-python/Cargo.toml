[package]
name = "betterlite-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "betterlite_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-guardrails = { path = "../betterlite-guardrails" }
betterlite-models = { path = "../betterlite-models" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-secrets = { path = "../betterlite-secrets" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
rust_decimal.workspace = true
secrecy = { workspace = true }
serde.workspace = true
serde_json = "1.0.154"
thiserror.workspace = true

[dev-dependencies]
rstest = "=0.27.0"
temp-env = "0.3.6"
tempfile = "3.27.0"

[lints]
workspace = true
