[package]
name = "betterlite-python"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "betterlite_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1.92"
aws-smithy-async = { version = "=1.3.1", features = ["rt-tokio"] }
aws-smithy-runtime-api = { version = "=1.19.2", features = ["client"] }
aws-types = "=1.6.0"
betterlite-a2a = { path = "../betterlite-a2a" }
betterlite-anthropic = { path = "../betterlite-anthropic" }
betterlite-azure = { path = "../betterlite-azure" }
betterlite-bedrock = { path = "../betterlite-bedrock" }
betterlite-cache = { path = "../betterlite-cache" }
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-core = { path = "../betterlite-core" }
betterlite-cost = { path = "../betterlite-cost" }
betterlite-env = { path = "../betterlite-env" }
betterlite-error = { path = "../betterlite-error" }
betterlite-foundry = { path = "../betterlite-foundry" }
betterlite-guardrails = { path = "../betterlite-guardrails" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-mcp = { path = "../betterlite-mcp" }
betterlite-models = { path = "../betterlite-models" }
betterlite-ocr = { path = "../betterlite-ocr" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-provider = { path = "../betterlite-provider" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-redis = { path = "../betterlite-redis" }
betterlite-router = { path = "../betterlite-router" }
betterlite-sdk = { path = "../betterlite-sdk" }
betterlite-secret-managers = { path = "../betterlite-secret-managers" }
betterlite-secrets = { path = "../betterlite-secrets" }
betterlite-streaming = { path = "../betterlite-streaming" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
betterlite-vertex = { path = "../betterlite-vertex" }
bytes = "1.12.1"
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["async-await"] }
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
mime_guess = { version = "2.0.5", default-features = false }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client"] }
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
betterlite-http-fixture = { path = "../../tools/http-fixture" }
mutants = "0.0.4"
rstest = "=0.27.0"
temp-env = "0.3.6"
tempfile = "3.27.0"

[lints]
workspace = true

# typos reads the nearest config carrier, and this manifest is the one above python/
[package.metadata.typos.default.extend-words]
ACN = "ACN"
NIN = "NIN"
acount = "acount"
initalization = "initalization"
asend = "asend"
