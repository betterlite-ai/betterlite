[package]
name = "betterlite-a2a-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
betterlite-a2a = { path = ".." }
betterlite-core = { path = "../../betterlite-core" }
futures-executor = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
libfuzzer-sys = "0.4.9"
serde_json = "1.0.154"

[[bin]]
name = "agentcore_sse"
path = "fuzz_targets/agentcore_sse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalize_protocol_version"
path = "fuzz_targets/normalize_protocol_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "completion_bridge"
path = "fuzz_targets/completion_bridge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "watsonx_token_response"
path = "fuzz_targets/watsonx_token_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "watsonx_run_event"
path = "fuzz_targets/watsonx_run_event.rs"
test = false
doc = false
bench = false
