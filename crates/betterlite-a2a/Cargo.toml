[package]
name = "betterlite-a2a"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
base64 = "0.22.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-core = { path = "../betterlite-core" }
betterlite-http = { path = "../betterlite-http" }
chrono = { workspace = true }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["async-await"] }
hex.workspace = true
http = "1.5.0"
lru = "0.18.4"
num-traits = "0.2.19"
secrecy = { workspace = true, features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
url = "2.5.8"
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
rstest = "=0.27.0"
