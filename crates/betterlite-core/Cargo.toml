[package]
name = "betterlite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-auth = { path = "../betterlite-auth" }
betterlite-config = { path = "../betterlite-config" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
indexmap = { version = "2.14.2", features = ["serde"] }
lopdf = { version = "0.46.0", default-features = false }
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
thiserror.workspace = true
tokio.workspace = true
url = "2.5.8"

[lints]
workspace = true
[dev-dependencies]
betterlite-context = { path = "../betterlite-context" }
rstest = "=0.27.0"
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true
