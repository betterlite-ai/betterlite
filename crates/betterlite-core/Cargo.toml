[package]
name = "betterlite-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
betterlite-anthropic = { path = "../betterlite-anthropic" }
betterlite-auth = { path = "../betterlite-auth" }
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-cost = { path = "../betterlite-cost" }
betterlite-db = { path = "../betterlite-db" }
betterlite-env = { path = "../betterlite-env" }
betterlite-error = { path = "../betterlite-error" }
betterlite-foundry = { path = "../betterlite-foundry" }
betterlite-http = { path = "../betterlite-http" }
betterlite-interactions = { path = "../betterlite-interactions" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-mcp = { path = "../betterlite-mcp" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-paths = { path = "../betterlite-paths" }
betterlite-policy = { path = "../betterlite-policy" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-streaming = { path = "../betterlite-streaming" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex.workspace = true
http = "1.5.0"
httpdate = "1.0.3"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
jsonschema = { version = "0.60.2", default-features = false, features = ["arbitrary-precision"] }
lopdf = { version = "0.46.0", default-features = false }
lru = "0.18.5"
num-traits = "0.2.19"
regex.workspace = true
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true

[lints]
workspace = true
[dev-dependencies]
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
uuid.workspace = true
