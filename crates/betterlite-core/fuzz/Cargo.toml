[package]
name = "betterlite-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
betterlite-config = { path = "../../betterlite-config" }
betterlite-core = { path = ".." }
chrono = { version = "0.4.45", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
libfuzzer-sys = "0.4.9"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }

[[bin]]
name = "budget_reset_clock"
path = "fuzz_targets/budget_reset_clock.rs"
test = false
doc = false
bench = false

[[bin]]
name = "duration_spec"
path = "fuzz_targets/duration_spec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_extraction"
path = "fuzz_targets/pdf_extraction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proc_statm_meminfo"
path = "fuzz_targets/proc_statm_meminfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "route_pattern"
path = "fuzz_targets/route_pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_provider"
path = "fuzz_targets/agent_provider.rs"
test = false
doc = false
bench = false

[[bin]]
name = "runway_task"
path = "fuzz_targets/runway_task.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upload_security_content"
path = "fuzz_targets/upload_security_content.rs"
test = false
doc = false
bench = false

[[bin]]
