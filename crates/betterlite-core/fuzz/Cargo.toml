[package]
name = "betterlite-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
betterlite-config = { path = "../../betterlite-config" }
betterlite-core = { path = ".." }
betterlite-http = { path = "../../betterlite-http" }
betterlite-models = { path = "../../betterlite-models" }
betterlite-openai = { path = "../../betterlite-openai" }
betterlite-pyhost = { path = "../../betterlite-pyhost" }
betterlite-secrets = { path = "../../betterlite-secrets" }
chrono = { version = "0.4.45", default-features = false }
http = "1.5.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
libfuzzer-sys = "0.4.9"
secrecy = { workspace = true }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
uuid.workspace = true

