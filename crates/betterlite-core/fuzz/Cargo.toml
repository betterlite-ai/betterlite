[package]
name = "betterlite-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
betterlite-core = { path = ".." }
libfuzzer-sys = "0.4.9"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }

[[bin]]
name = "pdf_extraction"
path = "fuzz_targets/pdf_extraction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proc_statm_meminfo"
path = "fuzz_targets/proc_statm_meminfo.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "agent_provider"
path = "fuzz_targets/agent_provider.rs"
test = false
doc = false
bench = false
