[package]
name = "betterlite-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.146.1", default-features = false, features = ["http-1x", "rt-tokio"] }
aws-smithy-types = "1.6.4"
azure_core = { version = "1.1.0", default-features = false, features = ["tokio"] }
azure_storage_blob = { version = "1.1.0", default-features = false, features = ["tokio"] }
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-redis = { path = "../betterlite-redis" }
hex.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
num-traits = "0.2.19"
rusqlite = { version = "0.41.0", features = ["bundled"] }
secrecy.workspace = true
serde.workspace = true
serde_json = "1.0.154"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
unicode-general-category = "1.1.0"

[dev-dependencies]
aws-smithy-http-client = { version = "1.5.1", default-features = false, features = ["rustls-aws-lc"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await"] }
rstest = "=0.27.0"
tempfile = "3.27.0"
tracing-subscriber.workspace = true

[lints]
workspace = true
