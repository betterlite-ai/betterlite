[package]
name = "betterlite-billing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-config = { path = "../betterlite-config" }
opentelemetry = { version = "0.33.1", default-features = false, features = ["internal-logs", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "internal-logs", "metrics", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["internal-logs", "metrics"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { workspace = true, features = ["std", "tls12"] }
rustls-native-certs.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "testing"] }
rstest = "=0.27.0"
secrecy.workspace = true
tempfile = "3.27.0"
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
