[package]
name = "betterlite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
os-keyring = ["dep:apple-native-keyring-store", "dep:secret-service-store", "dep:keyring-core", "dep:windows-native-keyring-store"]

[dependencies]
anstyle = "1.0.14"
async-trait = "0.1.92"
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-env = { path = "../betterlite-env" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-secrets = { path = "../betterlite-secrets" }
chrono = { workspace = true, features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.1", default-features = false }
console = "0.16.6"
getrandom = "0.4.3"
hex.workspace = true
http = "1.5.0"
httparse = "1.10.1"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = { version = "0.9.4", default-features = false, features = ["console", "fuzzy"] }
keyring-core = { version = "1.0.1", optional = true }
num-traits = "0.2.19"
regex.workspace = true
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde-saphyr.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"] }
sha2.workspace = true
shlex = "2.0.1"
socket2 = "0.6.5"
soft-canonicalize = "0.5.6"
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml_edit = "0.25.17"
url = "2.5.8"
which = "8.0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process", "stdio"] }
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service-store = { package = "dbus-secret-service-keyring-store", version = "1.0.1", features = ["crypto-rust", "vendored"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", optional = true }

[dev-dependencies]
axum = { workspace = true }
mutants = "0.0.4"
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio = { workspace = true }

[lints]
workspace = true
