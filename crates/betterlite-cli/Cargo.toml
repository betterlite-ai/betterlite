[package]
name = "betterlite-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
os-keyring = ["dep:apple-native-keyring-store", "dep:secret-service-store", "dep:keyring-core", "dep:windows-native-keyring-store"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-env = { path = "../betterlite-env" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-secrets = { path = "../betterlite-secrets" }
clap = { version = "4.6.7", features = ["derive"] }
hex.workspace = true
httparse = "1.10.1"
indexmap = "2.14.2"
keyring-core = { version = "1.0.1", optional = true }
num-traits = "0.2.19"
regex.workspace = true
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["float_roundtrip", "raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc"] }
sha2.workspace = true
shlex = "2.0.1"
soft-canonicalize = "0.5.6"
strum = { version = "0.28.0", features = ["derive"] }
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml_edit = "0.25.17"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["stdio"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service-store = { package = "dbus-secret-service-keyring-store", version = "1.0.1", features = ["crypto-rust", "vendored"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", optional = true }

[dev-dependencies]
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio = { workspace = true }

[lints]
workspace = true
