[package]
name = "betterlite-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-http = { path = "../betterlite-http" }
betterlite-models = { path = "../betterlite-models" }
betterlite-prompts = { path = "../betterlite-prompts" }
fancy-regex = "0.19.2"
futures-util = { version = "0.3.34", default-features = false }
hex.workspace = true
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
mime_guess = { version = "2.0.5", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["feature"] }
percent-encoding.workspace = true
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2.workspace = true
speedate = "0.18.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
rstest = "=0.27.0"
tempfile = "3.27.0"
tracing-subscriber.workspace = true

[lints]
workspace = true
