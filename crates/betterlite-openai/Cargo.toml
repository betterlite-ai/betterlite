[package]
name = "betterlite-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
aws-credential-types = "=1.3.1"
aws-sigv4 = "1.6.2"
aws-smithy-runtime-api = { version = "=1.19.2", features = ["client"] }
base64 = "0.23.1"
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-env = { path = "../betterlite-env" }
betterlite-error = { path = "../betterlite-error" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-redact = { path = "../betterlite-redact" }
betterlite-secret-managers = { path = "../betterlite-secret-managers" }
betterlite-streaming = { path = "../betterlite-streaming" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
chrono.workspace = true
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
futures-util = { version = "0.3.34", default-features = false }
hex.workspace = true
hound = "3.5.1"
http = "1.5.0"
httparse = "1.10.1"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
lru = "0.18.5"
mime_guess = { version = "2.0.5", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["feature"] }
percent-encoding.workspace = true
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2.workspace = true
speedate = "0.18.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
rstest = "=0.27.0"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
