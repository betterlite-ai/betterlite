[package]
name = "betterlite-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-config = { path = "../betterlite-config" }
betterlite-http = { path = "../betterlite-http" }
betterlite-models = { path = "../betterlite-models" }
hex.workspace = true
indexmap = { version = "2.14.2", features = ["serde"] }
nix = { version = "0.31.3", default-features = false, features = ["feature"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = "1.0.154"
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
rstest = "=0.27.0"
tokio.workspace = true

[lints]
workspace = true
