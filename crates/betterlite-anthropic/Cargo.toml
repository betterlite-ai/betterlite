[package]
name = "betterlite-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-config = { path = "../betterlite-config" }
betterlite-context = { path = "../betterlite-context" }
betterlite-error = { path = "../betterlite-error" }
betterlite-http = { path = "../betterlite-http" }
betterlite-logging = { path = "../betterlite-logging" }
betterlite-models = { path = "../betterlite-models" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
betterlite-streaming = { path = "../betterlite-streaming" }
betterlite-tokenizer = { path = "../betterlite-tokenizer" }
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
num-traits = "0.2.19"
regex.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json = { version = "1.0.154", features = ["raw_value"] }
serde_with = "3.24.0"
sha2 = "0.11.1"
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url = "2.5.8"
uuid.workspace = true

[dev-dependencies]
async-trait = "0.1.92"
rstest = "=0.27.0"
tokio = { workspace = true, features = ["test-util", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
