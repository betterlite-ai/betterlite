[package]
name = "betterlite-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
fancy-regex = "0.19.2"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
rust_decimal.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
serde_path_to_error = "0.1.20"
serde_repr = "0.1.21"
serde_with = { version = "3.24.0", default-features = false, features = ["alloc"] }
speedate = "0.18.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
url = "2.5.8"

[dev-dependencies]
rstest = "=0.27.0"

[lints]
workspace = true
