[package]
name = "betterlite-vertex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
betterlite-bedrock = { path = "../../betterlite-bedrock" }
betterlite-models = { path = "../../betterlite-models" }
betterlite-tokenizer = { path = "../../betterlite-tokenizer" }
betterlite-vertex = { path = ".." }
indexmap = "2.14.2"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
libfuzzer-sys = "0.4.9"
serde_json = "1.0.154"

