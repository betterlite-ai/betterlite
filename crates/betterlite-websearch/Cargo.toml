[package]
name = "betterlite-websearch"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
betterlite-anthropic = { path = "../betterlite-anthropic" }
betterlite-context = { path = "../betterlite-context" }
betterlite-error = { path = "../betterlite-error" }
betterlite-openai = { path = "../betterlite-openai" }
betterlite-prompts = { path = "../betterlite-prompts" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
indexmap = { version = "2.14.2", features = ["serde"] }
num-traits = "0.2.19"
serde.workspace = true
serde_json = { version = "1.0.145", features = ["raw_value"] }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rstest = "=0.27.0"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
