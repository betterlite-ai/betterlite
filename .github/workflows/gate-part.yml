name: gate part

# gate.yml calls this once for lint and task and once more for mutants, so mutants start only after the first parts pass
on:
  workflow_call:
    inputs:
      parts:
        description: JSON list of the parts this call runs, one runner each
        type: string
        required: true
      all-parts:
        description: JSON list of every part the gate run starts
        type: string
        required: true
      base:
        type: string
        required: true
      task:
        type: string
        required: false
        default: ""
      all-tests:
        description: true when every package is tested and linted, not only the ones the change affects
        type: string
        required: false
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  part:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    # a B1553 shard of 54 mutants at 267 s each needed the whole 300 minutes on 11-21, and GitHub stops a hosted job at 360
    timeout-minutes: ${{ startsWith(matrix.part, 'mutants-') && 350 || 120 }}
    permissions:
      contents: read
    strategy:
      # one red part must not cancel the others, or their failures only show in the next fix round
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    container:
      image: rust:1.98.0-slim-trixie@sha256:17d1ba895198f9934c6314ec5346a0d5115372f3243390c3d731e242f35c2f27
      volumes:
        - /usr/local/lib/android:/runner-android
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env:
          POSTGRES_USER: betterlite
          POSTGRES_PASSWORD: betterlite
          POSTGRES_DB: betterlite
        options: >-
          --health-cmd "pg_isready -U betterlite"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      CARGO_TERM_COLOR: never
      # the tools check reads the cargo-shear version from .crates.toml, since cargo shear --version prints "dev"
      TOOLS: |
        /usr/local/cargo/bin/cargo-nextest
        /usr/local/cargo/bin/cargo-deny
        /usr/local/cargo/bin/cargo-llvm-cov
        /usr/local/cargo/bin/cargo-mutants
        /usr/local/cargo/bin/typos
        /usr/local/cargo/bin/prek
        /usr/local/cargo/bin/zizmor
        /usr/local/cargo/bin/shellcheck
        /usr/local/cargo/bin/shfmt
        /usr/local/cargo/bin/actionlint
        /usr/local/cargo/bin/uv
        /usr/local/cargo/bin/uvx
        /usr/local/cargo/bin/cargo-shear
        /usr/local/cargo/bin/ast-grep
        /usr/local/cargo/bin/sg
        /usr/local/cargo/bin/similarity-rs
        /usr/local/cargo/bin/similarity-py
        /usr/local/cargo/.crates.toml
        /usr/local/cargo/.crates2.json
      # names every version the two install steps pin, so a bump misses the cache and installs fresh; layout2 skips the cache saved without shellcheck and shfmt
      TOOLS_KEY: tools-layout2-nextest-0.9.140-deny-0.20.2-llvm-cov-0.8.7-mutants-27.1.0-typos-1.48.0-prek-0.4.9-zizmor-1.26.1-shellcheck-0.11.0-shfmt-3.14.1-actionlint-1.7.12-uv-0.11.14-shear-1.13.1-ast-grep-0.45.3-similarity-rs-0.5.0-similarity-py-0.5.0
      POSTGRES_TEST_URL: postgresql://betterlite:betterlite@postgres:5432/betterlite
    steps:
      # a test build filled the disk on runner image 20261018.96; emptying the 14 GiB Android SDK takes 30 to 270 s, so it waits for a runner with less than 60 GiB free
      - name: Free the runner's disk
        if: matrix.part != 'lint'
        run: |
          df -h /
          free=$(df --output=avail -B 1G / | tail -n 1 | tr -d ' G')
          if (( free >= 60 )); then echo "$free GiB free, the Android SDK stays"; exit 0; fi
          rm -rf /runner-android/*
          df -h /

      # g++: libfuzzer-sys compiles libFuzzer from C++ even under cargo check; python3-dev: betterlite-python links libpython through PyO3, whose build script needs an interpreter; unzip: hashicorp/setup-terraform unpacks the Terraform release with it; redis-server: Redis tests start a server of their own from this binary, about 30 ms each
      - name: Install system packages
        run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl git jq procps zstd g++ python3 python3-dev unzip redis-server

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add Rust components
        run: rustup component add clippy rustfmt llvm-tools-preview

      # clippy keeps check builds and the tests keep full builds, so each kind has its own cache, and main's cache part saves the test one
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-${{ matrix.part == 'lint' && 'lint' || 'tests' }}
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.part == 'lint' || matrix.part == 'cache') }}
          workspaces: |
            .development/gate -> target
            . -> target

      - name: Check whitespace in the change
        if: matrix.part == 'lint'
        env:
          BASE: ${{ inputs.base }}
        run: git diff --check "$BASE" HEAD

      - name: Validate the specs
        if: matrix.part == 'lint'
        run: cargo gate validate

      - name: Test and lint the gate
        if: matrix.part == 'lint' && github.event_name != 'pull_request'
        env:
          BASE: ${{ inputs.base }}
        run: |
          if git diff --quiet "$BASE" HEAD -- .development/gate; then
            echo "the change leaves .development/gate alone"
            exit 0
          fi
          cargo fmt --check --manifest-path .development/gate/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path .development/gate/Cargo.toml -- -D warnings
          # one thread: a child process spawned by one test holds another test's seat lock until it execs
          cargo test --locked --manifest-path .development/gate/Cargo.toml -- --test-threads=1

      # one prebuilt download took 3.5 minutes (run 42477832070), so every tool comes from one cache that main's lint job fills
      - name: Restore the tools
        if: github.event_name != 'pull_request' || inputs.task != ''
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS }}
          key: ${{ env.TOOLS_KEY }}

      - name: Install the pinned tools
        if: (github.event_name != 'pull_request' || inputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2,cargo-llvm-cov@0.8.7,cargo-mutants@27.1.0,typos@1.48.0,prek@0.4.9,zizmor@1.26.1,shellcheck@0.11.0,shfmt@3.14.1,uv@0.11.14

      # install-action puts shellcheck and shfmt in ~/.install-action/bin, outside the cached folder
      - name: Move shellcheck and shfmt next to the other tools
        if: (github.event_name != 'pull_request' || inputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        run: mv "$HOME/.install-action/bin/shellcheck" "$HOME/.install-action/bin/shfmt" /usr/local/cargo/bin/

      - name: Install the tools without prebuilt binaries
        if: (github.event_name != 'pull_request' || inputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --force cargo-shear@1.13.1 ast-grep@0.45.3 similarity-rs@0.5.0 similarity-py@0.5.0

      # install-action has no actionlint at this pin, so the release archive comes with its published checksum
      - name: Install actionlint
        if: (github.event_name != 'pull_request' || inputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        env:
          ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C /usr/local/cargo/bin actionlint

      - name: Save the tools
        if: github.ref == 'refs/heads/main' && matrix.part == 'lint' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS }}
          key: ${{ env.TOOLS_KEY }}

      # cargo gate affected reads the package graph offline, and a cold cache lacks the crates no Linux build downloads.
      - name: Download every crate the lockfile names
        if: github.event_name != 'pull_request' || inputs.task != ''
        run: cargo fetch --locked

      - name: Restore LiteLLM's helper answers
        if: matrix.part != 'lint' && (github.event_name != 'pull_request' || inputs.task != '')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/betterlite-oracle
          key: oracle-answers-all-${{ github.sha }}
          restore-keys: oracle-answers-all-

      # a task's own checks may run node (B9090's do), and the image has none; 24.19.0 is what LiteLLM's ui/litellm-dashboard/.nvmrc pins
      - name: Set up Node
        if: matrix.part == 'task'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      # the Helm, Terraform and Go tasks check with those toolchains at the versions LiteLLM's own CI pins (Max, 11-15); only a task whose file names one downloads it
      - name: Find the toolchains the task needs
        if: matrix.part == 'task' && inputs.task != ''
        id: toolchains
        env:
          TASK: ${{ inputs.task }}
        run: |
          file=$(ls .development/tasks/"$TASK"-*.yaml)
          if grep -q -w helm "$file"; then echo "helm=true" >> "$GITHUB_OUTPUT"; fi
          if grep -q -w terraform "$file"; then echo "terraform=true" >> "$GITHUB_OUTPUT"; fi
          if grep -q -E '\bgo (vet|build|test|run)\b|\bgofmt\b' "$file"; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
          if grep -q -E '(^|[[:space:]])ruby[[:space:]]' "$file"; then echo "ruby=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Helm
        if: steps.toolchains.outputs.helm == 'true'
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: "3.11.1"

      # the plugin's release archive with its published checksum, as LiteLLM's helm_unit_test.yml installs it
      - name: Install helm-unittest
        if: steps.toolchains.outputs.helm == 'true'
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm-unittest.tgz" https://github.com/helm-unittest/helm-unittest/releases/download/v0.8.2/helm-unittest-linux-amd64-0.8.2.tgz
          echo "56ab3091e6fa52a7c92ee951def9bed957f295d9ce98483aed404e748d7b3a94  $RUNNER_TEMP/helm-unittest.tgz" | sha256sum -c -
          plugin="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "$plugin"
          tar -xzf "$RUNNER_TEMP/helm-unittest.tgz" -C "$plugin"

      - name: Set up Terraform
        if: steps.toolchains.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Set up Go
        if: steps.toolchains.outputs.go == 'true'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: 1.25.0
          cache: false

      # the Homebrew task tests its formula with Ruby, Debian's 3.3 in this image
      - name: Install Ruby
        if: steps.toolchains.outputs.ruby == 'true'
        run: apt-get install --yes --no-install-recommends ruby

      # lint and task split every check between them, so a check added to checks.yaml runs in task
      - name: Run the gate's ${{ matrix.part }} checks on the merged result
        if: github.event_name != 'pull_request' || inputs.task != ''
        # the cache build took 22 to 33 minutes before its heavy builds took turns, which adds about 30%; out of memory, it once hung until the runner was lost at 61 minutes (run 45129968169)
        timeout-minutes: ${{ matrix.part == 'cache' && 50 || 350 }}
        env:
          EVENT: ${{ github.event_name }}
          GATE_BASE: ${{ inputs.base }}
          GATE_ALL_TESTS: ${{ inputs.all-tests }}
          PART: ${{ matrix.part }}
          PARTS: ${{ inputs.all-parts }}
          TASK: ${{ inputs.task }}
        run: |
          lint=(fmt clippy deny shear hooks similarity file-size module-tree case-ignores shared-names workflows)
          if [[ -n $TASK ]]; then
            local_checks=$(cargo gate list "$TASK" --local) || exit 1
            mapfile -t lint < <(awk '/^[^ ]/ {print $1}' <<<"$local_checks")
            # a dispatch no longer runs clippy on the laptop (stage 3), so the lint part adds it to the task's local checks
            lint+=(clippy)
          fi
          # the pull request run checked the task's own diff, so the queue re-checks only what another queued change can break (Max, 11-15)
          if [[ $EVENT == merge_group && -n $TASK ]]; then lint=(clippy similarity shared-names); fi
          # coverage runs with the task's tests on the pull request, so the queue leaves it out
          later=(mutants)
          if [[ $EVENT != pull_request ]]; then later+=(coverage); fi
          selection=()
          case $PART in
            lint)
              for id in "${lint[@]}"; do selection+=(--only "$id"); done
              # clippy starts at once, so hooks and similarity run while it builds
              selection+=(--beside clippy)
              # find reads rules.toml without the gate, so a queued change that got no tests part must affect no package
              if [[ $EVENT == merge_group && -z $TASK && $PARTS != *tests-1* ]]; then
                affected=$(cargo gate affected) || exit 1
                if [[ -n $affected ]]; then echo "the change affects $affected, but find started no tests part"; exit 1; fi
              fi
              # clippy takes turns on the same heavy targets: betterlite-server's lib test was killed out of memory in run 45566938360
              export RUSTC_WRAPPER="$GITHUB_WORKSPACE/.github/scripts/rustc-turns.sh" ;;
            tests-*|edited)
              if [[ $PART == edited ]]; then
                affected=$(cargo gate affected --edited) || exit 1
              else
                affected=$(cargo gate affected --shard "${PART#tests-}" --shards "$(jq '[.[] | select(startswith("tests-"))] | length' <<<"$PARTS")") || exit 1
              fi
              if [[ -z $affected ]]; then echo "no package the change touches falls in this part"; exit 0; fi
              read -r -a packages <<< "$affected"
              # the builds that need over 4 GB take turns: two at once ran the 16 GB runner out of memory in the tests parts (#1542) and in the cache part (runs 45129968169, 45144639135)
              export RUSTC_WRAPPER="$GITHUB_WORKSPACE/.github/scripts/rustc-turns.sh"
              # the tests use LiteLLM but not its dev tools, about 330 MB
              # a shard that stops at its first failure hides the rest: on 11-13 shard 3 ran 30 of 22702 tests in run 43451345497
              UV_NO_DEV=1 exec cargo nextest run --locked --no-tests=warn --max-fail 20 "${packages[@]}" ;;
            cache)
              # every other part builds the gate first, and without its dependencies in this cache each job spent about 110 s on them (run 43847942706)
              cargo build --locked --quiet --manifest-path .development/gate/Cargo.toml || exit 1
              export RUSTC_WRAPPER="$GITHUB_WORKSPACE/.github/scripts/rustc-turns.sh"
              exec cargo test --locked --no-run --workspace ;;
            task)
              export NEXTEST_PROFILE=task
              for id in "${lint[@]}" "${later[@]}"; do selection+=(--skip "$id"); done ;;
            mutants-*)
              if ! cargo gate list "$TASK" | awk '$1 == "mutants" {found = 1} END {exit !found}'; then echo "the task has no mutants check"; exit 0; fi
              export UV_NO_DEV=1
              # cargo mutants numbers its shards from 0
              shards=$(jq '[.[] | select(startswith("mutants-"))] | length' <<<"$PARTS") || exit 1
              export MUTANTS_SHARD="$(( ${PART#mutants-} - 1 ))/$shards"
              # the mutants check clears RUSTC_WRAPPER for incremental builds, so the heavy targets take turns through the workspace wrapper: all six shards of run 45709493351 died with exit 137 in three attempts
              export RUSTC_WORKSPACE_WRAPPER="$GITHUB_WORKSPACE/.github/scripts/rustc-turns.sh"
              selection=(--only mutants) ;;
          esac
          if [[ $PART == task ]]; then
            checks=$(cargo gate list "$TASK")
            # find reads the task file without the gate, so a task with a mutants check must have got its mutants parts
            if [[ $EVENT == pull_request && $PARTS != *mutants-1* ]] && awk '$1 == "mutants" {found = 1} END {exit !found}' <<<"$checks"; then
              echo "the task has a mutants check, but find started no mutants part"
              exit 1
            fi
            if ! awk -v skipped=" ${lint[*]} ${later[*]} " '/^[^ ]/ && !index(skipped, " "$1" "){remaining=1} END{exit !remaining}' <<<"$checks"; then
              echo "every task check belongs to another gate part"
              exit 0
            fi
          fi
          cargo gate run "${TASK:-B000}" "${selection[@]}"

      # a shard computes only its own packages' answers, so the oracle answers job in gate.yml merges them into the one cache every part restores
      - name: Keep LiteLLM's new helper answers
        if: github.ref == 'refs/heads/main' && startsWith(matrix.part, 'tests-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-answers-${{ matrix.part }}
          path: target/oracle-answers
          if-no-files-found: ignore
          retention-days: 1

      - name: Keep the gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs-${{ matrix.part }}
          path: .git/betterlite/*/gate/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
