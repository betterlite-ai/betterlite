name: gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions: {}

env:
  # cargo gate affected --shard packs whole packages onto the shards by their test seconds; six took 9.6 to 17.1 minutes on 11-13 (run 43471939068) against 20 to 28 for three hash shards
  TEST_SHARDS: 6
  # cargo mutants tests one mutant at a time, so a task pull request splits them over six runners; three took a median 20 and a p90 38 minutes on 11-13
  MUTANTS_SHARDS: 6

concurrency:
  group: gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
  run:
    shell: bash

jobs:
  find:
    name: find the base and the task
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # a merge queue run looks up the queued PR's branch to find its task
    outputs:
      base: ${{ steps.find.outputs.base }}
      task: ${{ steps.find.outputs.task }}
      parts: ${{ steps.find.outputs.parts }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a queued group's base lies as many commits back as the group holds pull requests
          persist-credentials: false

      - name: Find the base, the task and the parts to run
        id: find
        env:
          EVENT: ${{ github.event_name }}
          PR_BRANCH: ${{ github.head_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $EVENT == merge_group ]]; then
            base=$QUEUE_BASE
            number=$(sed -E 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*$#\1#' <<<"$QUEUE_REF")
            branch=$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/pulls/$number" | jq -r .head.ref)
          else
            base=$(git rev-parse HEAD^1)
            branch=$PR_BRANCH
          fi
          task=""
          if [[ $branch =~ ^task/(B[0-9]+)(-|$) ]]; then
            task=${BASH_REMATCH[1]}
          fi
          parts=$(jq -cn --argjson shards "$TEST_SHARDS" '["lint"] + [range(1; $shards + 1) | "tests-\(.)"]')
          if [[ $EVENT == pull_request ]]; then
            parts='["lint"]'
            if [[ -n $task ]]; then
              parts='["lint","task"]'
              # a mutants runner took 2.7 minutes to print that its task has no mutants check, so the task file decides here
              task_files=(.development/tasks/"$task"-*.yaml)
              optional=$(yq '.checks.optional[]' "${task_files[0]}")
              if grep -qx mutants <<<"$optional"; then
                parts=$(jq -cn --argjson shards "$MUTANTS_SHARDS" '["lint","task"] + [range(1; $shards + 1) | "mutants-\(.)"]')
              fi
            fi
          elif [[ $EVENT == merge_group && -n $task ]]; then
            parts='["lint","task"]'
          elif [[ $EVENT == merge_group ]]; then
            # a tests runner took 2.8 minutes to print that the change affects no package, so the paths rules.toml marks for no package decide here
            changed=$(git diff --name-only --no-renames "$base" HEAD)
            rules=$(yq -p toml -o json '.' .development/gate/src/affected/rules.toml)
            if jq -en --arg changed "$changed" --argjson rules "$rules" '[$rules["path-rule"][] | select(.["mark-changed"] == []) | .globs[]] as $inert | $changed | split("\n") | all(. as $path | $inert | any(. as $glob | if endswith("/**") then $path | startswith($glob[:-2]) else $path == $glob end))' > /dev/null; then
              parts='["lint"]'
            fi
          fi
          # a tests part builds only its own packages, so on main one part builds every test target for the cache
          if [[ $EVENT == push ]]; then
            parts=$(jq -c '. + ["cache"]' <<<"$parts")
          fi
          echo "branch $branch, base $base, task ${task:-none}, parts $parts"
          printf 'base=%s\ntask=%s\nparts=%s\n' "$base" "$task" "$parts" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.part }}
    needs: find
    runs-on: ubuntu-24.04
    # the longest local mutants run took 130 minutes
    timeout-minutes: ${{ startsWith(matrix.part, 'mutants-') && 300 || 120 }}
    permissions:
      contents: read
    strategy:
      # one red part must not cancel the others, or their failures only show in the next fix round
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.find.outputs.parts) }}
    container:
      image: rust:1.98.0-slim-trixie@sha256:17d1ba895198f9934c6314ec5346a0d5115372f3243390c3d731e242f35c2f27
      volumes:
        - /usr/local/lib/android:/runner-android
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env:
          POSTGRES_USER: betterlite
          POSTGRES_PASSWORD: betterlite
          POSTGRES_DB: betterlite
        options: >-
          --health-cmd "pg_isready -U betterlite"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # the tools check reads the cargo-shear version from .crates.toml, since cargo shear --version prints "dev"
      TOOLS: |
        /usr/local/cargo/bin/cargo-nextest
        /usr/local/cargo/bin/cargo-deny
        /usr/local/cargo/bin/cargo-llvm-cov
        /usr/local/cargo/bin/cargo-mutants
        /usr/local/cargo/bin/typos
        /usr/local/cargo/bin/prek
        /usr/local/cargo/bin/zizmor
        /usr/local/cargo/bin/shellcheck
        /usr/local/cargo/bin/shfmt
        /usr/local/cargo/bin/actionlint
        /usr/local/cargo/bin/uv
        /usr/local/cargo/bin/uvx
        /usr/local/cargo/bin/cargo-shear
        /usr/local/cargo/bin/ast-grep
        /usr/local/cargo/bin/sg
        /usr/local/cargo/bin/similarity-rs
        /usr/local/cargo/bin/similarity-py
        /usr/local/cargo/.crates.toml
        /usr/local/cargo/.crates2.json
      # names every version the two install steps pin, so a bump misses the cache and installs fresh; layout2 skips the cache saved without shellcheck and shfmt
      TOOLS_KEY: tools-layout2-nextest-0.9.140-deny-0.20.2-llvm-cov-0.8.7-mutants-27.1.0-typos-1.48.0-prek-0.4.9-zizmor-1.26.1-shellcheck-0.11.0-shfmt-3.14.1-actionlint-1.7.12-uv-0.11.14-shear-1.13.1-ast-grep-0.45.3-similarity-rs-0.5.0-similarity-py-0.5.0
      POSTGRES_TEST_URL: postgresql://betterlite:betterlite@postgres:5432/betterlite
      BETTERLITE_ORACLE_CACHE: ${{ github.event_name == 'push' && 'shared' || 'own' }}
    steps:
      # a test build filled the disk on runner image 20261018.96; emptying the 14 GiB Android SDK takes 30 to 270 s, so it waits for a runner with less than 60 GiB free
      - name: Free the runner's disk
        if: matrix.part != 'lint'
        run: |
          df -h /
          free=$(df --output=avail -B 1G / | tail -n 1 | tr -d ' G')
          if (( free >= 60 )); then echo "$free GiB free, the Android SDK stays"; exit 0; fi
          rm -rf /runner-android/*
          df -h /

      # g++: libfuzzer-sys compiles libFuzzer from C++ even under cargo check; python3-dev: betterlite-python links libpython through PyO3, whose build script needs an interpreter
      - name: Install system packages
        run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl git jq procps zstd g++ python3 python3-dev

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add Rust components
        run: rustup component add clippy rustfmt llvm-tools-preview

      # clippy keeps check builds and the tests keep full builds, so each kind has its own cache, and main's cache part saves the test one
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate-${{ matrix.part == 'lint' && 'lint' || 'tests' }}
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.part == 'lint' || matrix.part == 'cache') }}
          workspaces: |
            .development/gate -> target
            . -> target

      - name: Check whitespace in the change
        if: matrix.part == 'lint'
        env:
          BASE: ${{ needs.find.outputs.base }}
        run: git diff --check "$BASE" HEAD

      - name: Validate the specs
        if: matrix.part == 'lint'
        run: cargo gate validate

      - name: Test and lint the gate
        if: matrix.part == 'lint' && github.event_name != 'pull_request'
        env:
          BASE: ${{ needs.find.outputs.base }}
        run: |
          if git diff --quiet "$BASE" HEAD -- .development/gate; then
            echo "the change leaves .development/gate alone"
            exit 0
          fi
          cargo fmt --check --manifest-path .development/gate/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path .development/gate/Cargo.toml -- -D warnings
          # one thread: a child process spawned by one test holds another test's seat lock until it execs
          cargo test --locked --manifest-path .development/gate/Cargo.toml -- --test-threads=1

      # one prebuilt download took 3.5 minutes (run 42477832070), so every tool comes from one cache that main's lint job fills
      - name: Restore the tools
        if: github.event_name != 'pull_request' || needs.find.outputs.task != ''
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS }}
          key: ${{ env.TOOLS_KEY }}

      - name: Install the pinned tools
        if: (github.event_name != 'pull_request' || needs.find.outputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.140,cargo-deny@0.20.2,cargo-llvm-cov@0.8.7,cargo-mutants@27.1.0,typos@1.48.0,prek@0.4.9,zizmor@1.26.1,shellcheck@0.11.0,shfmt@3.14.1,uv@0.11.14

      # install-action puts shellcheck and shfmt in ~/.install-action/bin, outside the cached folder
      - name: Move shellcheck and shfmt next to the other tools
        if: (github.event_name != 'pull_request' || needs.find.outputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        run: mv "$HOME/.install-action/bin/shellcheck" "$HOME/.install-action/bin/shfmt" /usr/local/cargo/bin/

      - name: Install the tools without prebuilt binaries
        if: (github.event_name != 'pull_request' || needs.find.outputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        run: cargo install --locked --force cargo-shear@1.13.1 ast-grep@0.45.3 similarity-rs@0.5.0 similarity-py@0.5.0

      # install-action has no actionlint at this pin, so the release archive comes with its published checksum
      - name: Install actionlint
        if: (github.event_name != 'pull_request' || needs.find.outputs.task != '') && steps.tools.outputs.cache-hit != 'true'
        env:
          ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C /usr/local/cargo/bin actionlint

      - name: Save the tools
        if: github.ref == 'refs/heads/main' && matrix.part == 'lint' && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS }}
          key: ${{ env.TOOLS_KEY }}

      # cargo gate affected reads the package graph offline, and a cold cache lacks the crates no Linux build downloads.
      - name: Download every crate the lockfile names
        if: github.event_name != 'pull_request' || needs.find.outputs.task != ''
        run: cargo fetch --locked

      - name: Restore LiteLLM's helper answers
        if: matrix.part != 'lint' && (github.event_name != 'pull_request' || needs.find.outputs.task != '')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/betterlite-oracle
          key: oracle-answers-${{ github.sha }}
          restore-keys: oracle-answers-

      # a task's own checks may run node (B9090's do), and the image has none; 24.19.0 is what LiteLLM's ui/litellm-dashboard/.nvmrc pins
      - name: Set up Node
        if: matrix.part == 'task'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      # lint and task split every check between them, so a check added to checks.yaml runs in task
      - name: Run the gate's ${{ matrix.part }} checks on the merged result
        if: github.event_name != 'pull_request' || needs.find.outputs.task != ''
        env:
          EVENT: ${{ github.event_name }}
          GATE_BASE: ${{ needs.find.outputs.base }}
          GATE_ALL_TESTS: ${{ github.event_name == 'push' && 'true' || '' }}
          PART: ${{ matrix.part }}
          PARTS: ${{ needs.find.outputs.parts }}
          TASK: ${{ needs.find.outputs.task }}
        run: |
          lint=(fmt clippy deny shear hooks similarity file-size module-tree case-ignores workflows)
          if [[ -n $TASK ]]; then
            local_checks=$(cargo gate list "$TASK" --local) || exit 1
            mapfile -t lint < <(awk '/^[^ ]/ {print $1}' <<<"$local_checks")
            # a dispatch no longer runs clippy on the laptop (stage 3), so the lint part adds it to the task's local checks
            lint+=(clippy)
          fi
          # coverage runs with the task's tests on the pull request, so the queue leaves it out
          later=(mutants)
          if [[ $EVENT != pull_request ]]; then later+=(coverage); fi
          selection=()
          case $PART in
            lint)
              for id in "${lint[@]}"; do selection+=(--only "$id"); done
              # clippy starts at once, so hooks and similarity run while it builds
              selection+=(--beside clippy)
              # find reads rules.toml without the gate, so a queued change that got no tests part must affect no package
              if [[ $EVENT == merge_group && -z $TASK && $PARTS != *tests-1* ]]; then
                affected=$(cargo gate affected) || exit 1
                if [[ -n $affected ]]; then echo "the change affects $affected, but find started no tests part"; exit 1; fi
              fi ;;
            tests-*)
              affected=$(cargo gate affected --shard "${PART#tests-}" --shards "$TEST_SHARDS") || exit 1
              if [[ -z $affected ]]; then echo "no package the change affects falls in this shard"; exit 0; fi
              read -r -a packages <<< "$affected"
              # the oracle library and its unit-test build need about 8 GB each, so they take turns on a 16 GB runner
              export RUSTC_WRAPPER="$GITHUB_WORKSPACE/.github/scripts/oracle-rustc-turns.sh"
              # the tests use LiteLLM but not its dev tools, about 330 MB
              # a shard that stops at its first failure hides the rest: on 11-13 shard 3 ran 30 of 22702 tests in run 43451345497
              UV_NO_DEV=1 exec cargo nextest run --locked --no-tests=warn --max-fail 20 "${packages[@]}" ;;
            cache)
              export RUSTC_WRAPPER="$GITHUB_WORKSPACE/.github/scripts/oracle-rustc-turns.sh"
              exec cargo test --locked --no-run --workspace ;;
            task)
              export NEXTEST_PROFILE=task
              for id in "${lint[@]}" "${later[@]}"; do selection+=(--skip "$id"); done ;;
            mutants-*)
              if ! cargo gate list "$TASK" | awk '$1 == "mutants" {found = 1} END {exit !found}'; then echo "the task has no mutants check"; exit 0; fi
              export UV_NO_DEV=1
              # cargo mutants numbers its shards from 0
              export MUTANTS_SHARD="$(( ${PART#mutants-} - 1 ))/$MUTANTS_SHARDS"
              selection=(--only mutants) ;;
          esac
          if [[ $PART == task ]]; then
            checks=$(cargo gate list "$TASK")
            # find reads the task file without the gate, so a task with a mutants check must have got its mutants parts
            if [[ $EVENT == pull_request && $PARTS != *mutants-1* ]] && awk '$1 == "mutants" {found = 1} END {exit !found}' <<<"$checks"; then
              echo "the task has a mutants check, but find started no mutants part"
              exit 1
            fi
            if ! awk -v skipped=" ${lint[*]} ${later[*]} " '/^[^ ]/ && !index(skipped, " "$1" "){remaining=1} END{exit !remaining}' <<<"$checks"; then
              echo "every task check belongs to another gate part"
              exit 0
            fi
          fi
          cargo gate run "${TASK:-B000}" "${selection[@]}"

      - name: Save LiteLLM's helper answers
        if: github.ref == 'refs/heads/main' && startsWith(matrix.part, 'tests-')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/betterlite-oracle
          key: oracle-answers-${{ github.sha }}-${{ matrix.part }}

      - name: Keep the gate logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs-${{ matrix.part }}
          path: .git/betterlite/*/gate/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: gate
    needs: [find, checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every part to pass
        env:
          FIND: ${{ needs.find.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "find $FIND, checks $CHECKS"
          [[ $FIND == success && $CHECKS == success ]]
