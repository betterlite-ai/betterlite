name: gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # the queue already tested each merged tree, and testing only what a push affects still ran 87,708 and 88,290 of 91,578 tests (runs 43789028753, 43793982262), so a push lints, every 2 hours a run tests what changed, and at 01:17 UTC everything runs and refills the cargo cache (Max, 11-16); at minute 17, since GitHub drops scheduled runs at the start of an hour under load and none fired at 10:00 on 11-16
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 */2 * * *"
  # GitHub never started a scheduled run in this repository (none for any workflow by 13:11 UTC on 11-16), so the same run can start by hand
  workflow_dispatch:
    inputs:
      everything:
        description: test every package and refill the cargo cache, as the 01:17 UTC run does
        type: boolean
        default: false

permissions: {}

env:
  # cargo gate affected --shard packs whole packages onto the shards by their test seconds; six took 9.6 to 17.1 minutes on 11-13 (run 43471939068) against 20 to 28 for three hash shards
  TEST_SHARDS: 6
  # cargo mutants tests one mutant at a time, so a task pull request splits them over six runners; three took a median 20 and a p90 38 minutes on 11-13
  MUTANTS_SHARDS: 6

concurrency:
  group: gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'scheduled') || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  find:
    name: find the base and the task
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # a merge queue run looks up the queued PR's branch to find its task
      actions: read # a main run looks up the last green main run
    outputs:
      base: ${{ steps.find.outputs.base }}
      task: ${{ steps.find.outputs.task }}
      parts: ${{ steps.find.outputs.parts }}
      first: ${{ steps.find.outputs.first }}
      mutants: ${{ steps.find.outputs.mutants }}
      all-tests: ${{ steps.find.outputs.all-tests }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a queued group's base lies as many commits back as the group holds pull requests
          persist-credentials: false

      - name: Find the base, the task and the parts to run
        id: find
        env:
          # a run started by hand is a scheduled run
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'schedule' || github.event_name }}
          NIGHTLY: ${{ github.event.schedule == '17 1 * * *' || inputs.everything == true }}
          PR_BRANCH: ${{ github.head_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          all_tests=""
          if [[ $EVENT == merge_group ]]; then
            base=$QUEUE_BASE
            number=$(sed -E 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-.*$#\1#' <<<"$QUEUE_REF")
            branch=$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/pulls/$number" | jq -r .head.ref)
          elif [[ $EVENT == push || $EVENT == schedule ]]; then
            # a waiting run gives way to the next one (11-15: 193 merges, 49 push runs, 21 cancelled), and a red run proves nothing, so a push lints everything since the last green main run and a scheduled run tests everything since the last green scheduled run
            events='["schedule","workflow_dispatch"]'
            if [[ $EVENT == push ]]; then
              events='["push","schedule","workflow_dispatch"]'
            fi
            base=$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPOSITORY/actions/workflows/gate.yml/runs?branch=main&status=success&per_page=100" | jq -r --argjson events "$events" '[.workflow_runs[] | select(.event | IN($events[]))][0].head_sha // empty')
            if [[ -z $base ]] || ! git merge-base --is-ancestor "$base" HEAD; then
              base=$(git rev-parse HEAD^1)
              all_tests=true
            fi
            branch=""
          else
            base=$(git rev-parse HEAD^1)
            branch=$PR_BRANCH
          fi
          if [[ $NIGHTLY == true ]]; then
            all_tests=true
          fi
          task=""
          if [[ $branch =~ ^task/(B[0-9]+)(-|$) ]]; then
            task=${BASH_REMATCH[1]}
          fi
          parts=$(jq -cn --argjson shards "$TEST_SHARDS" '["lint"] + [range(1; $shards + 1) | "tests-\(.)"]')
          if [[ $EVENT == pull_request ]]; then
            parts='["lint"]'
            if [[ -n $task ]]; then
              parts='["lint","task"]'
              # a mutants runner took 2.7 minutes to print that its task has no mutants check, so the task file decides here
              task_files=(.development/tasks/"$task"-*.yaml)
              optional=$(yq '.checks.optional[]' "${task_files[0]}")
              if grep -qx mutants <<<"$optional"; then
                parts=$(jq -cn --argjson shards "$MUTANTS_SHARDS" '["lint","task"] + [range(1; $shards + 1) | "mutants-\(.)"]')
              fi
            fi
          elif [[ $EVENT == merge_group && -n $task ]]; then
            # the pull request run passed the task's own checks, and edited runs every test of the crates the queued change edits (Max, 11-15)
            parts='["lint","edited"]'
          elif [[ $EVENT == push ]]; then
            parts='["lint"]'
          elif [[ ($EVENT == merge_group || $EVENT == schedule) && -z $all_tests ]]; then
            # a tests runner took 2.8 minutes to print that the change affects no package, so the paths rules.toml marks for no package decide here
            changed=$(git diff --name-only --no-renames "$base" HEAD)
            rules=$(yq -p toml -o json '.' .development/gate/src/affected/rules.toml)
            if jq -en --arg changed "$changed" --argjson rules "$rules" '[$rules["path-rule"][] | select(.["mark-changed"] == []) | .globs[]] as $inert | $changed | split("\n") | all(. as $path | $inert | any(. as $glob | if endswith("/**") then $path | startswith($glob[:-2]) else $path == $glob end))' > /dev/null; then
              parts='["lint"]'
            fi
          fi
          # a tests part builds only its own packages, so one part builds every test target for the cargo cache; rust-cache keys on the manifests, and on 11-15 run 43776330827 built for 17 minutes and saved nothing
          changed=$(git diff --name-only "$base" HEAD)
          if [[ $EVENT == schedule ]] && { [[ -n $all_tests ]] || grep -qE '(^|/)Cargo\.(toml|lock)$|^rust-toolchain' <<<"$changed"; }; then
            parts=$(jq -c '. + ["cache"]' <<<"$parts")
          fi
          echo "branch $branch, base $base, task ${task:-none}, all tests ${all_tests:-no}, parts $parts"
          first=$(jq -c '[.[] | select(startswith("mutants-") | not)]' <<<"$parts")
          mutants=$(jq -c '[.[] | select(startswith("mutants-"))]' <<<"$parts")
          printf 'base=%s\ntask=%s\nparts=%s\nfirst=%s\nmutants=%s\nall-tests=%s\n' "$base" "$task" "$parts" "$first" "$mutants" "$all_tests" >> "$GITHUB_OUTPUT"

  checks:
    name: checks
    needs: find
    permissions:
      contents: read
    uses: ./.github/workflows/gate-part.yml
    with:
      parts: ${{ needs.find.outputs.first }}
      all-parts: ${{ needs.find.outputs.parts }}
      base: ${{ needs.find.outputs.base }}
      task: ${{ needs.find.outputs.task }}
      all-tests: ${{ needs.find.outputs.all-tests }}

  # 79% of mutant runner time on 11-15 went to pushes whose lint or task part had already failed
  mutants:
    name: mutants
    needs: [find, checks]
    if: needs.find.outputs.mutants != '[]'
    permissions:
      contents: read
    uses: ./.github/workflows/gate-part.yml
    with:
      parts: ${{ needs.find.outputs.mutants }}
      all-parts: ${{ needs.find.outputs.parts }}
      base: ${{ needs.find.outputs.base }}
      task: ${{ needs.find.outputs.task }}
      all-tests: ${{ needs.find.outputs.all-tests }}

  # one cache key per shard made each part restore a single shard's answers, so most LiteLLM comparisons ran Python again (11-17)
  oracle-answers:
    name: oracle answers
    needs: [find, checks]
    if: always() && github.ref == 'refs/heads/main' && contains(needs.find.outputs.first, 'tests-')
    runs-on: ubuntu-24.04
    # actions/cache keeps a path outside the workspace relative to it, so the save has to run in the shards' image or their restore lands outside $HOME (11-17)
    container:
      image: rust:1.98.0-slim-trixie@sha256:17d1ba895198f9934c6314ec5346a0d5115372f3243390c3d731e242f35c2f27
    timeout-minutes: 10
    permissions: {}
    steps:
      # the compression method is part of the cache version, and the shards compress with zstd
      - name: Install zstd
        run: apt-get update && apt-get install --yes --no-install-recommends zstd

      - name: Restore the answers so far
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/betterlite-oracle
          key: oracle-answers-all-${{ github.sha }}
          restore-keys: oracle-answers-all-

      - name: Add each shard's new answers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oracle-answers-tests-*
          path: ~/.cache/betterlite-oracle
          merge-multiple: true

      - name: Save every answer under one key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/betterlite-oracle
          key: oracle-answers-all-${{ github.sha }}

  gate:
    name: gate
    needs: [find, checks, mutants]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every part to pass
        env:
          FIND: ${{ needs.find.result }}
          CHECKS: ${{ needs.checks.result }}
          MUTANTS: ${{ needs.mutants.result }}
        run: |
          echo "find $FIND, checks $CHECKS, mutants $MUTANTS"
          [[ $FIND == success && $CHECKS == success && ($MUTANTS == success || $MUTANTS == skipped) ]]
