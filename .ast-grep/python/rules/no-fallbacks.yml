id: no-fallbacks
language: python
severity: error
message: a fallback value hides a missing or wrong input; read the typed field directly, handle None where the type allows it, and let a missing environment variable fail
rule:
  any:
    - kind: boolean_operator
      all:
        - has:
            field: operator
            regex: ^or$
        - has:
            field: right
            any:
              - kind: list
              - kind: dictionary
              - kind: tuple
              - kind: set
              - kind: string
              - kind: integer
              - kind: float
              - kind: "true"
              - kind: "false"
              - kind: none
    - kind: call
      all:
        - has:
            field: function
            any:
              - kind: attribute
                regex: \.(get|getenv)$
              - kind: identifier
                regex: ^getenv$
        - has:
            field: arguments
            has:
              nthChild: 2
