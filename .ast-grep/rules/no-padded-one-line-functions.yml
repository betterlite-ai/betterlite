id: no-padded-one-line-functions
language: rust
severity: error
message: a one-line let followed by a one-line tail that uses it is still a one-line function; write the code where the function is called instead of padding the body
note: the same exemptions as no-one-line-functions apply
ignores:
  - "**/tests.rs"
  - "**/tests/**"
rule:
  kind: function_item
  has:
    field: body
    all:
      - has:
          nthChild: 1
          kind: let_declaration
          regex: "^[^\\n]*$"
          has:
            field: pattern
            pattern: $X
      - has:
          nthChild: 2
          regex: "^[^\\n]*$"
          not:
            kind: let_declaration
          has:
            pattern: $X
            stopBy: end
      - not:
          has:
            nthChild: 3
  not:
    matches: exempt-function
