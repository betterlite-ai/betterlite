rule:
  kind: function_item
  has:
    field: body
    all:
      - has:
          nthChild: 1
          kind: let_declaration
          regex: "^[^\\n]*$"
          has:
            field: pattern
            pattern: $X
      - has:
          nthChild: 2
          regex: "^[^\\n]*$"
          not:
            kind: let_declaration
          has:
            pattern: $X
            stopBy: end
      - not:
          has:
            nthChild: 3
  not:
    matches: exempt-function
