id: no-one-line-functions
language: rust
severity: error
message: a function whose body fits on one line is only a name for that line; write it where the function is called. Padding the body to pass this check (a throwaway let, a constant spelled as math, a branch whose arms give the same value, a move into a trait impl, an identity conversion) is the same defect
note: trait impls, trait default methods, main, a serde default (a function named default_<field> with no parameters), a body that is one match, if or loop, and a body rustfmt spreads over several lines are exempt
ignores:
  - "**/tests.rs"
  - "**/tests/**"
rule:
  kind: function_item
  has:
    field: body
    all:
      - has:
          nthChild: 1
          regex: "^[^\\n]*$"
          not:
            any:
              - kind: match_expression
              - kind: if_expression
              - kind: for_expression
              - kind: while_expression
              - kind: loop_expression
              - has:
                  any:
                    - kind: match_expression
                    - kind: if_expression
                    - kind: for_expression
                    - kind: while_expression
                    - kind: loop_expression
      - not:
          has:
            nthChild: 2
  not:
    matches: exempt-function
