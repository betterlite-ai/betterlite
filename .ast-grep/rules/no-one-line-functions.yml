id: no-one-line-functions
language: rust
severity: error
message: a function whose body is a single statement or expression is only a name for it; write that code where the function is called
note: trait impls, trait default methods, main, and a body that is one match, if or loop are exempt
ignores:
  - "**/tests.rs"
  - "**/tests/**"
rule:
  kind: function_item
  has:
    field: body
    all:
      - has:
          nthChild: 1
          not:
            any:
              - kind: match_expression
              - kind: if_expression
              - kind: for_expression
              - kind: while_expression
              - kind: loop_expression
              - has:
                  any:
                    - kind: match_expression
                    - kind: if_expression
                    - kind: for_expression
                    - kind: while_expression
                    - kind: loop_expression
      - not:
          has:
            nthChild: 2
  not:
    any:
      - has:
          field: name
          regex: ^main$
      - inside:
          kind: impl_item
          has:
            field: trait
            regex: .
          stopBy: end
      - inside:
          kind: trait_item
          stopBy: end
