id: no-plain-secret-fields
language: rust
severity: error
message: a key, password or auth token in a String field of a Debug type leaks through Debug, logs and error text; type the field secrecy::SecretString from the moment it is read
note: a wire struct that must write the secret out derives no Debug and converts from and to SecretString at its edges; a hashed key is not a secret, so name it hashed_<field> or <field>_hash; the files below held a plain field when the rule landed, so drop one once its field is fixed
ignores:
  - tools/**
  - .development/**
  - crates/*/tests/**
  - "**/tests.rs"
  - "**/tests/**"
  - crates/betterlite-db/src/team_rows/archived.rs
  - crates/betterlite-logging/src/finops/cloudzero/records.rs
  - crates/betterlite-logging/src/focus_records/transformer.rs
  - crates/betterlite-logging/src/trace_types.rs
rule:
  kind: field_declaration
  all:
    - has:
        field: name
        regex: ^(.*_)?(api_key|master_key|secret_key|access_key|private_key|admin_key|virtual_key|signing_key|client_secret|secret|password|passwd|access_token|refresh_token|bearer_token|auth_token|session_token|id_token|ad_token)$
    - has:
        field: type
        regex: ^(Option<)?(String|&'?[a-z]* ?str|Cow<.*str>)>?$
    - not:
        has:
          field: name
          regex: ^hashed_|_hash$
    - inside:
        any: [{kind: struct_item}, {kind: enum_item}]
        stopBy: end
        follows:
          kind: attribute_item
          regex: derive\([^)]*\bDebug\b
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
