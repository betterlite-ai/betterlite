{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "betterlite.gateway.fullname" . }}
  labels:
    {{- include "betterlite.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if and (not .Values.gateway.hpa.enabled) (not (kindIs "invalid" .Values.gateway.replicaCount)) }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  {{- with .Values.gateway.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "betterlite.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.gateway.config.create .Values.gateway.podAnnotations }}
      annotations:
        {{- if .Values.gateway.config.create }}
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "betterlite.gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.gateway.podLabels }}
        {{- include "betterlite.podLabels" (dict "podLabels" . "componentName" "gateway") | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "betterlite.gateway.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.gateway.automount }}
      {{- with .Values.gateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          {{- with .Values.gateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports: [{ name: http, containerPort: 4000, protocol: TCP }]
          env:
            {{- include "betterlite.serverEnv" (dict "root" $ "component" .Values.gateway) | nindent 12 }}
            {{- if .Values.gateway.config.create }}
            - { name: CONFIG_FILE_PATH, value: /etc/betterlite/config.yaml }
            {{- end }}
            {{- if .Values.gateway.numWorkers }}
            - { name: NUM_WORKERS, value: {{ .Values.gateway.numWorkers | quote }} }
            {{- end }}
            {{- if .Values.database.connectionPool.enabled }}
            {{- include "betterlite.connectionPoolEnv" $ | nindent 12 }}
            {{- end }}
            {{- if .Values.gateway.metricsServer.enabled }}
            {{- if eq (int .Values.gateway.metricsServer.port) 4000 }}
            {{- fail "gateway.metricsServer.port must differ from the gateway port 4000" }}
            {{- end }}
            - { name: PROMETHEUS_MULTIPROC_DIR, value: {{ include "betterlite.gateway.prometheusMultiprocDir" . }} }
            {{- end }}
            {{- if .Values.gateway.collector.enabled }}
            {{- include "betterlite.gateway.collectorEnv" . | nindent 12 }}
            {{- end }}
          {{- include "betterlite.envFrom" .Values.gateway | nindent 10 }}
          {{- if or .Values.gateway.config.create .Values.gateway.volumeMounts .Values.gateway.metricsServer.enabled (include "betterlite.gateway.collectorSocketDir" .) }}
          volumeMounts:
            {{- if .Values.gateway.config.create }}
            - { name: gateway-config, mountPath: /etc/betterlite/config.yaml, subPath: config.yaml }
            {{- end }}
            {{- if .Values.gateway.metricsServer.enabled }}
            - { name: prometheus-multiproc, mountPath: {{ include "betterlite.gateway.prometheusMultiprocDir" . }} }
            {{- end }}
            {{- if include "betterlite.gateway.collectorSocketDir" . }}
            - { name: collector-socket, mountPath: {{ include "betterlite.gateway.collectorSocketDir" . }} }
            {{- end }}
            {{- with .Values.gateway.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.gateway.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
        {{- if .Values.gateway.metricsServer.enabled }}
        - name: metrics
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          {{- with .Values.gateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- with .Values.gateway.metricsServer.command }}
            {{- toYaml . | nindent 12 }}
            {{- else }}
            - betterlite
            - metrics-server
            - --port
            - {{ .Values.gateway.metricsServer.port | quote }}
            {{- end }}
          env: [{ name: PROMETHEUS_MULTIPROC_DIR, value: {{ include "betterlite.gateway.prometheusMultiprocDir" . }} }]
          ports: [{ name: metrics, containerPort: {{ .Values.gateway.metricsServer.port }}, protocol: TCP }]
          volumeMounts: [{ name: prometheus-multiproc, mountPath: {{ include "betterlite.gateway.prometheusMultiprocDir" . }} }]
          readinessProbe: { tcpSocket: { port: metrics }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: metrics }, periodSeconds: 15, failureThreshold: 6 }
          resources:
            {{- toYaml .Values.gateway.metricsServer.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.gateway.collector.enabled }}
        - name: collector
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          {{- with .Values.gateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.collector.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "betterlite.serverEnv" (dict "root" $ "component" .Values.gateway) | nindent 12 }}
            {{- if .Values.gateway.config.create }}
            - { name: CONFIG_FILE_PATH, value: /etc/betterlite/config.yaml }
            {{- end }}
            {{- if .Values.database.connectionPool.enabled }}
            {{- include "betterlite.connectionPoolEnv" $ | nindent 12 }}
            {{- end }}
            {{- include "betterlite.gateway.collectorEnv" . | nindent 12 }}
            - { name: LITELLM_JOB_ROLE, value: collector }
          {{- include "betterlite.envFrom" .Values.gateway | nindent 10 }}
          {{- if or .Values.gateway.config.create .Values.gateway.volumeMounts (include "betterlite.gateway.collectorSocketDir" .) }}
          volumeMounts:
            {{- if .Values.gateway.config.create }}
            - { name: gateway-config, mountPath: /etc/betterlite/config.yaml, subPath: config.yaml }
            {{- end }}
            {{- if include "betterlite.gateway.collectorSocketDir" . }}
            - { name: collector-socket, mountPath: {{ include "betterlite.gateway.collectorSocketDir" . }} }
            {{- end }}
            {{- with .Values.gateway.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.gateway.collector.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.gateway.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- if or .Values.gateway.config.create .Values.gateway.volumes .Values.gateway.metricsServer.enabled (include "betterlite.gateway.collectorSocketDir" .) }}
      volumes:
        {{- if .Values.gateway.config.create }}
        - { name: gateway-config, configMap: { name: {{ include "betterlite.gateway.fullname" . }}-config } }
        {{- end }}
        {{- if .Values.gateway.metricsServer.enabled }}
        - { name: prometheus-multiproc, emptyDir: {} }
        {{- end }}
        {{- if include "betterlite.gateway.collectorSocketDir" . }}
        - { name: collector-socket, emptyDir: { sizeLimit: 1Mi } }
        {{- end }}
        {{- with .Values.gateway.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $gracePeriod := .Values.gateway.terminationGracePeriodSeconds }}
      {{- if not (or (kindIs "invalid" $gracePeriod) (eq (printf "%v" $gracePeriod) "")) }}
      terminationGracePeriodSeconds: {{ $gracePeriod }}
      {{- end }}
{{- end }}
