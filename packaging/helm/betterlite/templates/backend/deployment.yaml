{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "betterlite.backend.fullname" . }}
  labels:
    {{- include "betterlite.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if and (not .Values.backend.hpa.enabled) (not (kindIs "invalid" .Values.backend.replicaCount)) }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  {{- with .Values.backend.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "betterlite.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.gateway.config.create .Values.backend.podAnnotations }}
      annotations:
        {{- if .Values.gateway.config.create }}
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "betterlite.backend.selectorLabels" . | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- include "betterlite.podLabels" (dict "podLabels" . "componentName" "backend") | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "betterlite.backend.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccounts.backend.automount }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports: [{ name: http, containerPort: 4001, protocol: TCP }]
          env:
            {{- include "betterlite.serverEnv" (dict "root" $ "component" .Values.backend) | nindent 12 }}
            {{- if .Values.gateway.config.create }}
            - { name: CONFIG_FILE_PATH, value: /etc/betterlite/config.yaml }
            {{- end }}
          {{- include "betterlite.envFrom" .Values.backend | nindent 10 }}
          {{- if or .Values.gateway.config.create .Values.backend.volumeMounts }}
          volumeMounts:
            {{- if .Values.gateway.config.create }}
            - { name: gateway-config, mountPath: /etc/betterlite/config.yaml, subPath: config.yaml }
            {{- end }}
            {{- with .Values.backend.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- if or .Values.gateway.config.create .Values.backend.volumes }}
      volumes:
        {{- if .Values.gateway.config.create }}
        - { name: gateway-config, configMap: { name: {{ include "betterlite.gateway.fullname" . }}-config } }
        {{- end }}
        {{- with .Values.backend.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $gracePeriod := .Values.backend.terminationGracePeriodSeconds }}
      {{- if not (or (kindIs "invalid" $gracePeriod) (eq (printf "%v" $gracePeriod) "")) }}
      terminationGracePeriodSeconds: {{ $gracePeriod }}
      {{- end }}
{{- end }}
