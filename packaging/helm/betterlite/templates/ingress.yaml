{{- if .Values.ingress.enabled }}
{{- $gatewayName := include "betterlite.gateway.fullname" . }}
{{- $backendName := include "betterlite.backend.fullname" . }}
{{- $uiName := include "betterlite.ui.fullname" . }}
{{- $gatewayPort := .Values.gateway.service.port }}
{{- $backendPort := .Values.backend.service.port }}
{{- $uiPort := .Values.ui.service.port }}
{{- $controller := .Values.ingress.controller | default "alb" }}
{{- if not (has $controller (list "alb" "nginx")) }}
{{- fail (printf "ingress.controller: unknown controller %q, expected one of alb, nginx" $controller) }}
{{- end }}
{{/* Backends addressable from ingress.extraPaths, keyed by the service field */}}
{{- $extraPathBackends := dict
    "gateway" (dict "name" $gatewayName "port" $gatewayPort)
    "backend" (dict "name" $backendName "port" $backendPort)
    "ui" (dict "name" $uiName "port" $uiPort)
-}}
{{/* The static export fetches every route's payload as a root-level <route>.txt, which only an ALB wildcard can match */}}
{{- $uiPaths := list
    (dict "path" "/" "pathType" "Exact")
    (dict "path" "/favicon.ico" "pathType" "Exact")
    (dict "path" "/litellm-asset-prefix" "pathType" "Prefix")
    (dict "path" "/_next" "pathType" "Prefix")
    (dict "path" "/ui" "pathType" "Prefix")
-}}
{{- if eq $controller "alb" }}
{{- $uiPaths = append $uiPaths (dict "path" "/*.txt" "pathType" "ImplementationSpecific") }}
{{- end }}
{{/* Mirrors crates/betterlite-routes GATEWAY_PATH_PREFIXES, a copy of LiteLLM's data-plane allowlist; versioned paths stay explicit so management routes never reach the gateway */}}
{{- $gatewayPrefixes := list
    "/v1/chat" "/chat" "/v1/completions" "/completions" "/v1/embeddings" "/embeddings"
    "/v1/moderations" "/moderations" "/v1/audio" "/audio" "/v1/images" "/images"
    "/v1/files" "/files" "/v1/batches" "/batches" "/v1/fine_tuning" "/fine_tuning"
    "/v1/fine-tuning" "/fine-tuning" "/v1/responses" "/responses" "/v1/threads" "/threads"
    "/v1/assistants" "/assistants" "/v1/vector_stores" "/vector_stores" "/v1/indexes"
    "/v1/models" "/models" "/openai" "/engines"
    "/v1/messages" "/messages" "/v1/skills" "/v1/a2a" "/a2a"
    "/v1/rerank" "/v2/rerank" "/rerank" "/v1/decisions" "/decisions" "/v1/systemone" "/systemone"
    "/v1/ocr" "/ocr" "/v1/rag" "/rag" "/v1/video" "/v1/videos" "/video" "/videos"
    "/v1/search" "/search" "/v1/containers" "/containers" "/v1/evals" "/v1/traces"
    "/v1/memory" "/queue/chat" "/v1beta" "/interactions"
    "/anthropic" "/azure" "/azure_ai" "/azure_speech" "/aws" "/bedrock" "/comprehendmedical" "/transcribe" "/cohere" "/gemini" "/gigachat" "/google"
    "/vertex_ai" "/vertex-ai" "/assemblyai" "/eu.assemblyai" "/deepgram" "/fal_ai" "/langfuse" "/vllm"
    "/mistral" "/typesafe" "/openrouter" "/nvidia_nim" "/groq" "/voyage" "/cursor" "/milvus" "/openai_passthrough" "/tinyfish"
    "/toolset"
    "/v1/realtime" "/realtime"
    "/health" "/metrics" "/watsonx"
-}}
{{/* /test is gateway-only as an Exact path while /test/* MCP management endpoints stay on the backend, so a Prefix here would 404 them */}}
{{- $gatewayExactPaths := list "/test" "/debug/memory/summary" "/api/event_logging/batch" -}}
{{/* Every "<path>|<pathType>" rendered on its own; an extraPaths entry repeating one is rejected rather than taking it over */}}
{{- $builtinPathKeys := list "/|Prefix" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "betterlite.fullname" . }}
  labels:
    {{- include "betterlite.commonLabels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range $uiPaths }}
          {{- $pathType := include "betterlite.ingress.pathType" (dict "controller" $controller "path" .path "pathType" .pathType) }}
          {{- $builtinPathKeys = append $builtinPathKeys (printf "%s|%s" .path $pathType) }}
          - path: {{ .path }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $uiName }}
                port:
                  number: {{ $uiPort }}
          {{- end }}
          {{- range $gatewayExactPaths }}
          {{- $builtinPathKeys = append $builtinPathKeys (printf "%s|Exact" .) }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ $gatewayName }}
                port:
                  number: {{ $gatewayPort }}
          {{- end }}
          {{- range $gatewayPrefixes }}
          {{- $pathType := include "betterlite.ingress.pathType" (dict "controller" $controller "path" . "pathType" "Prefix") }}
          {{- $builtinPathKeys = append $builtinPathKeys (printf "%s|%s" . $pathType) }}
          - path: {{ . }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $gatewayName }}
                port:
                  number: {{ $gatewayPort }}
          {{- end }}
          {{/* Operator entries come after every built-in path and before the backend catch-all, so one can only add to the routing */}}
          {{- range $idx, $extra := .Values.ingress.extraPaths }}
          {{- if not (kindIs "map" $extra) }}
          {{- fail (printf "ingress.extraPaths[%d]: each entry must be a mapping with a 'path' key" $idx) }}
          {{- end }}
          {{- if not $extra.path }}
          {{- fail (printf "ingress.extraPaths[%d]: 'path' is required" $idx) }}
          {{- end }}
          {{- $service := $extra.service | default "gateway" }}
          {{- $target := get $extraPathBackends $service }}
          {{- if not $target }}
          {{- fail (printf "ingress.extraPaths[%d] (path %s): unknown service %q, expected one of backend, gateway, ui" $idx $extra.path $service) }}
          {{- end }}
          {{- $requestedPathType := $extra.pathType | default "Prefix" }}
          {{- if not (has $requestedPathType (list "Prefix" "Exact" "ImplementationSpecific")) }}
          {{- fail (printf "ingress.extraPaths[%d] (path %s): unknown pathType %q, expected one of Exact, ImplementationSpecific, Prefix" $idx $extra.path $requestedPathType) }}
          {{- end }}
          {{- $pathType := include "betterlite.ingress.pathType" (dict "controller" $controller "path" $extra.path "pathType" $requestedPathType) }}
          {{- if eq $extra.path "/" }}
          {{- fail (printf "ingress.extraPaths[%d]: path / is already routed in both directions, Exact to ui and Prefix to backend, so no pathType leaves a request for an entry here to capture" $idx) }}
          {{- end }}
          {{- if has (printf "%s|%s" $extra.path $pathType) $builtinPathKeys }}
          {{- fail (printf "ingress.extraPaths[%d]: path %s with pathType %s is already routed by this chart, and a duplicate would take it over rather than add to it" $idx $extra.path $pathType) }}
          {{- end }}
          - path: {{ $extra.path | quote }}
            pathType: {{ $pathType }}
            backend:
              service:
                name: {{ $target.name }}
                port:
                  number: {{ $target.port }}
          {{- end }}
          {{/* Catch-all to the backend management API: /key/*, /user/*, /team/*, ... */}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  number: {{ $backendPort }}
{{- end }}
