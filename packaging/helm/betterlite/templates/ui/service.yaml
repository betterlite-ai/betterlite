{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "betterlite.ui.fullname" . }}
  labels:
    {{- include "betterlite.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports: [{ port: {{ .Values.ui.service.port }}, targetPort: http, protocol: TCP, name: http }]
  selector:
    {{- include "betterlite.ui.selectorLabels" . | nindent 4 }}
{{- end }}
