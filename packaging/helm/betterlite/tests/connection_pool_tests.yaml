suite: test in-container connection pool env vars
templates: [gateway/deployment.yaml, gateway/configmap.yaml, backend/deployment.yaml]
values: [./values/required.yaml]
tests:
  - it: renders NUM_WORKERS from gateway.numWorkers without the pool
    template: gateway/deployment.yaml
    set:
      gateway.numWorkers: 2
      gateway.collector.enabled: true
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: NUM_WORKERS, value: "2" }, any: true }
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_PGBOUNCER_ENABLED }, any: true }
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS }, any: true }
      - notContains: { path: 'spec.template.spec.containers[1].env', content: { name: LITELLM_PGBOUNCER_ENABLED }, any: true }
  - it: an enabled pool renders the three pgbouncer vars with the configured sizes
    template: gateway/deployment.yaml
    set:
      gateway.numWorkers: 4
      database.connectionPool.enabled: true
      database.connectionPool.maxDbConnections: 8
      database.connectionPool.maxClientConn: 250
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_PGBOUNCER_ENABLED, value: "true" }, any: true }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS, value: "8" }, any: true }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_PGBOUNCER_MAX_CLIENT_CONN, value: "250" }, any: true }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: NUM_WORKERS, value: "4" }, any: true }
  - it: backend never gets the pool env
    template: backend/deployment.yaml
    set:
      database.connectionPool.enabled: true
    asserts:
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_PGBOUNCER_ENABLED }, any: true }
  - it: the collector sidecar gets the same pool env as the gateway container, the metrics sidecar none
    template: gateway/deployment.yaml
    set:
      gateway.collector.enabled: true
      gateway.metricsServer.enabled: true
      database.connectionPool.enabled: true
      database.connectionPool.maxDbConnections: 8
      database.connectionPool.maxClientConn: 250
    asserts:
      - equal: { path: 'spec.template.spec.containers[1].name', value: metrics }
      - notContains: { path: 'spec.template.spec.containers[1].env', content: { name: LITELLM_PGBOUNCER_ENABLED }, any: true }
      - equal: { path: 'spec.template.spec.containers[2].name', value: collector }
      - contains: { path: 'spec.template.spec.containers[2].env', content: { name: LITELLM_PGBOUNCER_ENABLED, value: "true" }, any: true }
      - contains: { path: 'spec.template.spec.containers[2].env', content: { name: LITELLM_PGBOUNCER_MAX_DB_CONNECTIONS, value: "8" }, any: true }
      - contains: { path: 'spec.template.spec.containers[2].env', content: { name: LITELLM_PGBOUNCER_MAX_CLIENT_CONN, value: "250" }, any: true }
