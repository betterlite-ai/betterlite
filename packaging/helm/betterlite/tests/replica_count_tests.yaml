suite: test fixed replica count when HPA is disabled
templates: [gateway/deployment.yaml, gateway/configmap.yaml, backend/deployment.yaml, ui/deployment.yaml]
values: [./values/required.yaml]
tests:
  - it: every component renders replicaCount into spec.replicas when its HPA is disabled
    templates: [gateway/deployment.yaml, backend/deployment.yaml, ui/deployment.yaml]
    set:
      gateway.hpa.enabled: false
      gateway.replicaCount: 3
      backend.hpa.enabled: false
      backend.replicaCount: 2
      ui.hpa.enabled: false
      ui.replicaCount: 2
    asserts:
      - { equal: { path: 'spec.replicas', value: 3 }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.replicas', value: 2 }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.replicas', value: 2 }, template: ui/deployment.yaml }
  - it: replicaCount 0 scales the gateway to zero instead of being treated as unset
    template: gateway/deployment.yaml
    set:
      gateway.hpa.enabled: false
      gateway.replicaCount: 0
    asserts:
      - equal: { path: 'spec.replicas', value: 0 }
  - it: a component with HPA disabled but no replicaCount set keeps omitting spec.replicas
    templates: [gateway/deployment.yaml, backend/deployment.yaml, ui/deployment.yaml]
    set:
      gateway.hpa.enabled: false
      backend.hpa.enabled: false
      ui.hpa.enabled: false
    asserts:
      - notExists: { path: 'spec.replicas' }
  - it: every component omits spec.replicas when its HPA is enabled, so the autoscaler owns the count
    templates: [gateway/deployment.yaml, backend/deployment.yaml, ui/deployment.yaml]
    set:
      gateway.hpa.enabled: true
      gateway.replicaCount: 3
      backend.hpa.enabled: true
      backend.replicaCount: 3
      ui.hpa.enabled: true
      ui.replicaCount: 3
    asserts:
      - notExists: { path: 'spec.replicas' }
