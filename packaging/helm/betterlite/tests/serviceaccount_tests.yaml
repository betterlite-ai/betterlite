suite: test component service accounts
templates:
  - serviceaccount.yaml
values:
  - ./values/required.yaml
tests:
  - it: renders no ServiceAccount by default
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the gateway account from the component fullname
    set:
      serviceAccounts.gateway.create: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterlite-gateway
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: betterlite
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: gateway
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: betterlite-0.1.0
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: uses an explicit account name when create is true
    set:
      serviceAccounts.gateway.create: true
      serviceAccounts.gateway.name: my-gateway-sa
    asserts:
      - equal:
          path: metadata.name
          value: my-gateway-sa

  - it: uses the configured annotations and automount setting
    set:
      serviceAccounts.gateway.create: true
      serviceAccounts.gateway.automount: false
      serviceAccounts.gateway.annotations:
        example.com/role: gateway
    asserts:
      - equal:
          path: metadata.annotations["example.com/role"]
          value: gateway
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: creates the backend account with its annotations and automount setting
    set:
      serviceAccounts.backend.create: true
      serviceAccounts.backend.annotations:
        example.com/role: backend
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterlite-backend
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: backend
      - equal:
          path: metadata.annotations["example.com/role"]
          value: backend
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: creates the ui account without a token mount by default
    set:
      serviceAccounts.ui.create: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterlite-ui
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: ui
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: renders one account per component when all three create
    set:
      serviceAccounts.gateway.create: true
      serviceAccounts.backend.create: true
      serviceAccounts.ui.create: true
    asserts:
      - hasDocuments:
          count: 3

  - it: skips a disabled component even when its create is true
    set:
      gateway.enabled: false
      serviceAccounts.gateway.create: true
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create an account for a name bound with create false
    set:
      serviceAccounts.backend.name: existing-backend-sa
    asserts:
      - hasDocuments:
          count: 0

  - it: puts the nameOverride into the component fullname and the name label
    set:
      nameOverride: custom
      serviceAccounts.gateway.create: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-custom-gateway
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: custom

  - it: truncates the component fullname to 63 characters
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      serviceAccounts.gateway.create: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^a{60}-ga$
