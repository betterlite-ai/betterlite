suite: test pod hardening knobs on the component deployments
templates: [gateway/deployment.yaml, gateway/configmap.yaml, backend/deployment.yaml, ui/deployment.yaml]
values: [./values/required.yaml]
tests:
  - it: gateway renders no hardening fields by default
    template: gateway/deployment.yaml
    asserts:
      - isNull: { path: 'spec.template.spec.securityContext' }
      - isNull: { path: 'spec.template.spec.containers[0].securityContext' }
      - isNull: { path: 'spec.template.spec.containers[0].lifecycle' }
      - isNull: { path: 'spec.template.spec.terminationGracePeriodSeconds' }
      - equal: { path: 'spec.template.metadata.labels', value: { app.kubernetes.io/name: betterlite, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: gateway } }

  - it: backend and ui render no hardening fields by default
    templates: [backend/deployment.yaml, ui/deployment.yaml]
    asserts:
      - isNull: { path: 'spec.template.spec.securityContext' }
      - isNull: { path: 'spec.template.spec.containers[0].securityContext' }
      - isNull: { path: 'spec.template.spec.containers[0].lifecycle' }
      - isNull: { path: 'spec.template.spec.terminationGracePeriodSeconds' }

  - it: gateway renders pod-level and container-level securityContext in their own scopes
    template: gateway/deployment.yaml
    set:
      gateway.podSecurityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      gateway.securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
    asserts:
      - equal: { path: 'spec.template.spec.securityContext', value: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } } }
      - equal: { path: 'spec.template.spec.containers[0].securityContext', value: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } } }

  - it: gateway merges podLabels with the selector labels without touching the selector
    template: gateway/deployment.yaml
    set:
      gateway.podLabels: { egress-policy: restricted, team: platform }
    asserts:
      - equal: { path: 'spec.template.metadata.labels', value: { app.kubernetes.io/name: betterlite, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: gateway, egress-policy: restricted, team: platform } }
      - equal: { path: 'spec.selector.matchLabels', value: { app.kubernetes.io/name: betterlite, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: gateway } }

  - it: gateway rejects a podLabel that collides with the selector
    template: gateway/deployment.yaml
    set:
      gateway.podLabels: { app.kubernetes.io/component: not-gateway }
    asserts:
      - failedTemplate: { errorMessage: "gateway.podLabels cannot set app.kubernetes.io/component: it is part of the Deployment's immutable selector" }

  - it: backend rejects a podLabel that collides with its selector
    template: backend/deployment.yaml
    set:
      backend.podLabels: { app.kubernetes.io/name: not-betterlite }
    asserts:
      - failedTemplate: { errorMessage: "backend.podLabels cannot set app.kubernetes.io/name: it is part of the Deployment's immutable selector" }

  - it: ui rejects a podLabel that collides with its selector
    template: ui/deployment.yaml
    set:
      ui.podLabels: { app.kubernetes.io/instance: not-the-release }
    asserts:
      - failedTemplate: { errorMessage: "ui.podLabels cannot set app.kubernetes.io/instance: it is part of the Deployment's immutable selector" }

  - it: gateway renders lifecycle hooks and terminationGracePeriodSeconds on the pod
    template: gateway/deployment.yaml
    set:
      gateway.lifecycle: { preStop: { httpGet: { path: /health/drain, port: 4000 } } }
      gateway.terminationGracePeriodSeconds: 90
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].lifecycle', value: { preStop: { httpGet: { path: /health/drain, port: 4000 } } } }
      - equal: { path: 'spec.template.spec.terminationGracePeriodSeconds', value: 90 }

  - it: gateway honors an explicit terminationGracePeriodSeconds of zero
    template: gateway/deployment.yaml
    set:
      gateway.terminationGracePeriodSeconds: 0
    asserts:
      - equal: { path: 'spec.template.spec.terminationGracePeriodSeconds', value: 0 }

  - it: gateway appends extraContainers after the gateway container and templates chart context inside them
    template: gateway/deployment.yaml
    set:
      gateway.extraContainers:
        - name: auth-sidecar
          image: registry.example.com/auth-proxy:1.2.3
          env: [{ name: RELEASE, value: "{{ .Release.Name }}" }]
    asserts:
      - lengthEqual: { path: 'spec.template.spec.containers', count: 2 }
      - equal: { path: 'spec.template.spec.containers[0].name', value: gateway }
      - equal: { path: 'spec.template.spec.containers[1].name', value: auth-sidecar }
      - equal: { path: 'spec.template.spec.containers[1].env[0].value', value: RELEASE-NAME }

  - it: backend and ui render every hardening knob in the right scope
    set:
      backend.podLabels: { egress-policy: restricted }
      backend.podSecurityContext: { runAsNonRoot: true }
      backend.securityContext: { readOnlyRootFilesystem: true }
      backend.lifecycle: { preStop: { exec: { command: [sleep, "5"] } } }
      backend.terminationGracePeriodSeconds: 60
      backend.extraContainers: [{ name: auth-sidecar, image: registry.example.com/auth-proxy:1.2.3 }]
      ui.podLabels: { egress-policy: restricted }
      ui.podSecurityContext: { runAsNonRoot: true, fsGroup: 101 }
      ui.securityContext: { readOnlyRootFilesystem: true }
      ui.lifecycle: { preStop: { exec: { command: [/bin/sh, -c, nginx -s quit] } } }
      ui.terminationGracePeriodSeconds: 30
      ui.extraContainers: [{ name: auth-sidecar, image: registry.example.com/auth-proxy:1.2.3 }]
    asserts:
      - { equal: { path: 'spec.template.metadata.labels["egress-policy"]', value: restricted }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.spec.securityContext', value: { runAsNonRoot: true } }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[0].securityContext', value: { readOnlyRootFilesystem: true } }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[0].lifecycle', value: { preStop: { exec: { command: [sleep, "5"] } } } }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.spec.terminationGracePeriodSeconds', value: 60 }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].name', value: auth-sidecar }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.metadata.labels["egress-policy"]', value: restricted }, template: ui/deployment.yaml }
      - { equal: { path: 'spec.template.spec.securityContext', value: { runAsNonRoot: true, fsGroup: 101 } }, template: ui/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[0].securityContext', value: { readOnlyRootFilesystem: true } }, template: ui/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[0].lifecycle', value: { preStop: { exec: { command: [/bin/sh, -c, nginx -s quit] } } } }, template: ui/deployment.yaml }
      - { equal: { path: 'spec.template.spec.terminationGracePeriodSeconds', value: 30 }, template: ui/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].name', value: auth-sidecar }, template: ui/deployment.yaml }

  - it: gateway and backend pods carry the config checksum and ui carries only its podAnnotations
    set:
      gateway.podAnnotations: { example.com/team: platform }
      backend.podAnnotations: { example.com/team: platform }
      ui.podAnnotations: { example.com/team: platform }
    asserts:
      - { isNotNullOrEmpty: { path: 'spec.template.metadata.annotations["checksum/config"]' }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.metadata.annotations["example.com/team"]', value: platform }, template: gateway/deployment.yaml }
      - { isNotNullOrEmpty: { path: 'spec.template.metadata.annotations["checksum/config"]' }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.metadata.annotations["example.com/team"]', value: platform }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.metadata.annotations["example.com/team"]', value: platform }, template: ui/deployment.yaml }
      - { notExists: { path: 'spec.template.metadata.annotations["checksum/config"]' }, template: ui/deployment.yaml }

  - it: gateway and backend drop the annotations map when there is no config and no pod annotation
    set:
      gateway.config.create: false
    asserts:
      - { notExists: { path: 'spec.template.metadata.annotations' }, template: gateway/deployment.yaml }
      - { notExists: { path: 'spec.template.metadata.annotations' }, template: backend/deployment.yaml }

  - it: imagePullSecrets reach every pod
    templates: [gateway/deployment.yaml, backend/deployment.yaml, ui/deployment.yaml]
    set:
      imagePullSecrets: [{ name: registry-creds }]
    asserts:
      - equal: { path: 'spec.template.spec.imagePullSecrets', value: [{ name: registry-creds }] }

  - it: each pod binds its component ServiceAccount and automount setting
    set:
      serviceAccounts.gateway.create: true
      serviceAccounts.backend.name: existing-backend-sa
      serviceAccounts.backend.automount: false
    asserts:
      - { equal: { path: 'spec.template.spec.serviceAccountName', value: RELEASE-NAME-betterlite-gateway }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.automountServiceAccountToken', value: true }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.serviceAccountName', value: existing-backend-sa }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.spec.automountServiceAccountToken', value: false }, template: backend/deployment.yaml }
      - { equal: { path: 'spec.template.spec.serviceAccountName', value: default }, template: ui/deployment.yaml }
      - { equal: { path: 'spec.template.spec.automountServiceAccountToken', value: false }, template: ui/deployment.yaml }
