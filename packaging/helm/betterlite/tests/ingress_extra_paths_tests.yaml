suite: test ingress.extraPaths
templates: [ingress.yaml]
values: [./values/required.yaml]
tests:
  - it: renders nothing extra between the built-in gateway prefixes and the backend catch-all when unset
    set:
      ingress.enabled: true
    asserts:
      - equal:
          path: 'spec.rules[0].http.paths[-1]'
          value:
            path: /
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-backend
                port:
                  number: 4001
      - equal:
          path: 'spec.rules[0].http.paths[-2]'
          value:
            path: /watsonx
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000
      - equal:
          path: 'spec.rules[0].http.paths[-3]'
          value:
            path: /metrics
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000

  - it: routes an extra path to the gateway by default, immediately before the backend catch-all
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /my-passthrough
    asserts:
      - equal:
          path: 'spec.rules[0].http.paths[-2]'
          value:
            path: /my-passthrough
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000
      - equal:
          path: 'spec.rules[0].http.paths[-1]'
          value:
            path: /
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-backend
                port:
                  number: 4001

  - it: keeps every built-in path when extra paths are supplied
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /my-passthrough
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-betterlite-ui
                port:
                  number: 3000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /ui
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-ui
                port:
                  number: 3000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /test
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /v1/chat
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000

  - it: renders every entry in order and honours the service and pathType selectors
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /my-passthrough
          service: gateway
        - path: /my-management
          pathType: Exact
          service: backend
        - path: /brand.txt
          pathType: ImplementationSpecific
          service: ui
    asserts:
      - equal:
          path: 'spec.rules[0].http.paths[-4]'
          value:
            path: /my-passthrough
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000
      - equal:
          path: 'spec.rules[0].http.paths[-3]'
          value:
            path: /my-management
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-betterlite-backend
                port:
                  number: 4001
      - equal:
          path: 'spec.rules[0].http.paths[-2]'
          value:
            path: /brand.txt
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-betterlite-ui
                port:
                  number: 3000

  - it: addresses the component services by their configured ports
    set:
      ingress.enabled: true
      gateway.service.port: 8000
      backend.service.port: 8001
      ui.service.port: 8080
      ingress.extraPaths:
        - path: /my-passthrough
        - path: /my-management
          service: backend
        - path: /brand.txt
          service: ui
    asserts:
      - equal: { path: 'spec.rules[0].http.paths[-4].backend.service.port.number', value: 8000 }
      - equal: { path: 'spec.rules[0].http.paths[-3].backend.service.port.number', value: 8001 }
      - equal: { path: 'spec.rules[0].http.paths[-2].backend.service.port.number', value: 8080 }

  - it: rejects an entry naming a service the chart does not deploy
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /my-passthrough
          service: proxy
    asserts:
      - failedTemplate:
          errorMessage: 'ingress.extraPaths[0] (path /my-passthrough): unknown service "proxy", expected one of backend, gateway, ui'

  - it: rejects an entry whose pathType is not a kubernetes pathType
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /my-passthrough
          pathType: prefix
    asserts:
      - failedTemplate:
          errorMessage: 'ingress.extraPaths[0] (path /my-passthrough): unknown pathType "prefix", expected one of Exact, ImplementationSpecific, Prefix'

  - it: rejects an entry with no path
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - service: gateway
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: 'path' is required"

  - it: rejects a bare string entry instead of failing on template internals
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - /my-passthrough
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: each entry must be a mapping with a 'path' key"

  - it: rejects a root entry that would take over the backend catch-all
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /
          service: gateway
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path / is already routed in both directions, Exact to ui and Prefix to backend, so no pathType leaves a request for an entry here to capture"

  - it: rejects a root entry that would take over the UI root
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /
          pathType: Exact
          service: gateway
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path / is already routed in both directions, Exact to ui and Prefix to backend, so no pathType leaves a request for an entry here to capture"

  - it: rejects a root entry that would render but never match
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /
          pathType: ImplementationSpecific
          service: gateway
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path / is already routed in both directions, Exact to ui and Prefix to backend, so no pathType leaves a request for an entry here to capture"

  - it: rejects an entry that would take over a UI prefix
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /ui
          service: gateway
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /ui with pathType Prefix is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: rejects an entry that would take over the UI payload rule
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /*.txt
          pathType: ImplementationSpecific
          service: backend
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /*.txt with pathType ImplementationSpecific is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: rejects an entry that would take over a gateway data-plane prefix
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /v1/chat
          service: backend
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /v1/chat with pathType Prefix is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: rejects an entry that would take over the exact /test route
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /test
          pathType: Exact
          service: backend
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /test with pathType Exact is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: rejects an entry that would take over the exact /debug/memory/summary route
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /debug/memory/summary
          pathType: Exact
          service: backend
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /debug/memory/summary with pathType Exact is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: rejects an entry that would take over the exact event logging batch route
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /api/event_logging/batch
          pathType: Exact
          service: backend
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /api/event_logging/batch with pathType Exact is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: allows a built-in path under a different pathType, which is a distinct rule
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /ui
          pathType: Exact
          service: ui
    asserts:
      - equal:
          path: 'spec.rules[0].http.paths[-2]'
          value:
            path: /ui
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-betterlite-ui
                port:
                  number: 3000

  - it: renders a dotted extraPaths entry as ImplementationSpecific for ingress-nginx
    set:
      ingress.enabled: true
      ingress.controller: nginx
      ingress.extraPaths:
        - path: /eu.assemblyai.custom
          service: gateway
        - path: /robots.txt
          service: ui
          pathType: Exact
    asserts:
      - notMatchRegexRaw:
          pattern: 'path: "?/\S*\.\S*"?\n\s+pathType: (Exact|Prefix)\n'
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /eu.assemblyai.custom
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /robots.txt
            pathType: ImplementationSpecific
            backend:
              service:
                name: RELEASE-NAME-betterlite-ui
                port:
                  number: 3000

  - it: rejects an extraPaths entry that repeats a built-in path once ingress-nginx normalizes its pathType
    set:
      ingress.enabled: true
      ingress.controller: nginx
      ingress.extraPaths:
        - path: /favicon.ico
          service: ui
    asserts:
      - failedTemplate:
          errorMessage: "ingress.extraPaths[0]: path /favicon.ico with pathType ImplementationSpecific is already routed by this chart, and a duplicate would take it over rather than add to it"

  - it: keeps the requested pathType of a dotted extraPaths entry for the AWS Load Balancer Controller
    set:
      ingress.enabled: true
      ingress.extraPaths:
        - path: /eu.assemblyai.custom
          service: gateway
        - path: /robots.txt
          service: ui
          pathType: Exact
    asserts:
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /eu.assemblyai.custom
            pathType: Prefix
            backend:
              service:
                name: RELEASE-NAME-betterlite-gateway
                port:
                  number: 4000
      - contains:
          path: spec.rules[0].http.paths
          content:
            path: /robots.txt
            pathType: Exact
            backend:
              service:
                name: RELEASE-NAME-betterlite-ui
                port:
                  number: 3000
