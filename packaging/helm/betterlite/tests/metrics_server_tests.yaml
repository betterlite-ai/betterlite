suite: test gateway metrics sidecar and the component Services
templates: [gateway/configmap.yaml, gateway/deployment.yaml, gateway/service.yaml, gateway/service-metrics.yaml, backend/service.yaml, ui/service.yaml]
values: [./values/required.yaml]
tests:
  - it: adds no sidecar, volume, env or metrics service when the metrics server is off
    asserts:
      - { lengthEqual: { path: 'spec.template.spec.containers', count: 1 }, template: gateway/deployment.yaml }
      - { notContains: { path: 'spec.template.spec.containers[0].env', content: { name: PROMETHEUS_MULTIPROC_DIR }, any: true }, template: gateway/deployment.yaml }
      - { notContains: { path: 'spec.template.spec.volumes', content: { name: prometheus-multiproc }, any: true }, template: gateway/deployment.yaml }
      - { hasDocuments: { count: 0 }, template: gateway/service-metrics.yaml }
  - it: runs the metrics server as a sidecar over a shared multiproc dir and exposes it on a ClusterIP metrics service
    set:
      gateway.metricsServer.enabled: true
      gateway.metricsServer.port: 4101
      gateway.service.type: LoadBalancer
      gateway.image.tag: v1.3.0
      gateway.collector.enabled: true
      gateway.securityContext: { readOnlyRootFilesystem: true }
    asserts:
      - { contains: { path: 'spec.template.spec.containers[0].env', content: { name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/litellm_prometheus_multiproc }, any: true }, template: gateway/deployment.yaml }
      - { contains: { path: 'spec.template.spec.containers[0].volumeMounts', content: { name: prometheus-multiproc, mountPath: /tmp/litellm_prometheus_multiproc }, any: true }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].name', value: metrics }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].image', value: 'ghcr.io/betterlite-ai/betterlite-gateway:v1.3.0' }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].command', value: [betterlite, metrics-server, --port, "4101"] }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].env', value: [{ name: PROMETHEUS_MULTIPROC_DIR, value: /tmp/litellm_prometheus_multiproc }] }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].ports', value: [{ name: metrics, containerPort: 4101, protocol: TCP }] }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].volumeMounts', value: [{ name: prometheus-multiproc, mountPath: /tmp/litellm_prometheus_multiproc }] }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].readinessProbe.tcpSocket.port', value: metrics }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].livenessProbe.tcpSocket.port', value: metrics }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].securityContext', value: { readOnlyRootFilesystem: true } }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[2].name', value: collector }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[2].securityContext', value: { readOnlyRootFilesystem: true } }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.template.spec.containers[1].resources.requests.cpu', value: 50m }, template: gateway/deployment.yaml }
      - { contains: { path: 'spec.template.spec.volumes', content: { name: prometheus-multiproc, emptyDir: {} } }, template: gateway/deployment.yaml }
      - { equal: { path: 'spec.type', value: LoadBalancer }, template: gateway/service.yaml }
      - { equal: { path: 'metadata.name', value: RELEASE-NAME-betterlite-gateway-metrics }, template: gateway/service-metrics.yaml }
      - { equal: { path: 'spec.type', value: ClusterIP }, template: gateway/service-metrics.yaml }
      - { equal: { path: 'spec.ports', value: [{ port: 4101, targetPort: metrics, protocol: TCP, name: metrics }] }, template: gateway/service-metrics.yaml }
      - { equal: { path: 'spec.selector', value: { app.kubernetes.io/name: betterlite, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: gateway } }, template: gateway/service-metrics.yaml }
  - it: runs the command from gateway.metricsServer.command
    template: gateway/deployment.yaml
    set:
      gateway.metricsServer.enabled: true
      gateway.metricsServer.command: [/opt/metrics-server, --listen, ':9090']
    asserts:
      - equal: { path: 'spec.template.spec.containers[1].command', value: [/opt/metrics-server, --listen, ':9090'] }
  - it: rejects a metrics port equal to the gateway port
    template: gateway/deployment.yaml
    set:
      gateway.metricsServer.enabled: true
      gateway.metricsServer.port: 4000
    asserts:
      - failedTemplate: { errorMessage: gateway.metricsServer.port must differ from the gateway port 4000 }
  - it: renders one http Service per component with its port, type and selector
    set:
      gateway.service.type: NodePort
      backend.service.type: LoadBalancer
      ui.service.type: LoadBalancer
    asserts:
      - { equal: { path: spec.type, value: NodePort }, template: gateway/service.yaml }
      - { equal: { path: spec.type, value: LoadBalancer }, template: backend/service.yaml }
      - { equal: { path: spec.type, value: LoadBalancer }, template: ui/service.yaml }
      - { isKind: { of: Service }, template: gateway/service.yaml }
      - { equal: { path: metadata.name, value: RELEASE-NAME-betterlite-gateway }, template: gateway/service.yaml }
      - { equal: { path: 'spec.ports', value: [{ port: 4000, targetPort: http, protocol: TCP, name: http }] }, template: gateway/service.yaml }
      - { equal: { path: spec.selector, value: { app.kubernetes.io/name: betterlite, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: gateway } }, template: gateway/service.yaml }
      - { equal: { path: metadata.name, value: RELEASE-NAME-betterlite-backend }, template: backend/service.yaml }
      - { equal: { path: 'spec.ports', value: [{ port: 4001, targetPort: http, protocol: TCP, name: http }] }, template: backend/service.yaml }
      - { equal: { path: spec.selector, value: { app.kubernetes.io/name: betterlite, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: backend } }, template: backend/service.yaml }
      - { equal: { path: metadata.name, value: RELEASE-NAME-betterlite-ui }, template: ui/service.yaml }
      - { equal: { path: 'spec.ports', value: [{ port: 3000, targetPort: http, protocol: TCP, name: http }] }, template: ui/service.yaml }
      - { equal: { path: spec.selector, value: { app.kubernetes.io/name: betterlite, app.kubernetes.io/instance: RELEASE-NAME, app.kubernetes.io/component: ui } }, template: ui/service.yaml }
  - it: a disabled component renders no Service
    set:
      gateway.enabled: false
      backend.enabled: false
      ui.enabled: false
      gateway.metricsServer.enabled: true
    asserts:
      - { hasDocuments: { count: 0 }, template: gateway/service.yaml }
      - { hasDocuments: { count: 0 }, template: backend/service.yaml }
      - { hasDocuments: { count: 0 }, template: ui/service.yaml }
      - { hasDocuments: { count: 0 }, template: gateway/service-metrics.yaml }
