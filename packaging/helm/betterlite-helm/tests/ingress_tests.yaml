suite: ingress
templates:
  - ingress.yaml
tests:
  - it: renders no ingress by default
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders an ingress for the service when enabled
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Ingress }
      - equal: { path: apiVersion, value: networking.k8s.io/v1 }
      - equal: { path: metadata.name, value: RELEASE-NAME-betterlite }
      - equal: { path: 'metadata.labels["app.kubernetes.io/name"]', value: betterlite }
      - equal: { path: 'metadata.labels["app.kubernetes.io/instance"]', value: RELEASE-NAME }

  - it: writes the class name on clusters that support ingressClassName
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
    asserts:
      - equal: { path: spec.ingressClassName, value: nginx }
      - isNull: { path: metadata.annotations }

  - it: omits the class when none is configured
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
      ingress.className: ""
    asserts:
      - isNull: { path: spec.ingressClassName }
      - isNull: { path: metadata.annotations }

  - it: renders one rule per host and path with the v1 backend
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
    asserts:
      - equal: { path: 'spec.rules[0].host', value: api.example.local }
      - equal: { path: 'spec.rules[0].http.paths[0].path', value: / }
      - equal: { path: 'spec.rules[0].http.paths[0].pathType', value: ImplementationSpecific }
      - equal: { path: 'spec.rules[0].http.paths[0].backend.service.name', value: RELEASE-NAME-betterlite }
      - equal: { path: 'spec.rules[0].http.paths[0].backend.service.port.number', value: 4000 }
      - isNull: { path: 'spec.rules[0].http.paths[0].backend.serviceName' }

  - it: adds custom labels and annotations
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
      ingress.labels:
        team: platform
      ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 10m
    asserts:
      - equal: { path: metadata.labels.team, value: platform }
      - equal: { path: 'metadata.labels["app.kubernetes.io/name"]', value: betterlite }
      - equal: { path: 'metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]', value: 10m }

  - it: renders tls blocks
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
      ingress.tls:
        - hosts:
            - api.example.local
          secretName: betterlite-tls
    asserts:
      - equal: { path: 'spec.tls[0].hosts[0]', value: api.example.local }
      - equal: { path: 'spec.tls[0].secretName', value: betterlite-tls }

  - it: renders several hosts and paths in order
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: first.example.local
          paths:
            - { path: /, pathType: Prefix }
            - { path: /v1, pathType: Exact }
        - host: second.example.local
          paths:
            - { path: /v1/chat, pathType: Prefix }
    asserts:
      - lengthEqual: { path: spec.rules, count: 2 }
      - equal: { path: 'spec.rules[0].host', value: first.example.local }
      - equal: { path: 'spec.rules[0].http.paths[1].path', value: /v1 }
      - equal: { path: 'spec.rules[0].http.paths[1].pathType', value: Exact }
      - equal: { path: 'spec.rules[1].host', value: second.example.local }
      - equal: { path: 'spec.rules[1].http.paths[0].path', value: /v1/chat }

  - it: keeps a path without a pathType
    capabilities: { majorVersion: 1, minorVersion: 27 }
    set:
      ingress.enabled: true
      ingress.hosts:
        - host: api.example.local
          paths:
            - path: /
    asserts:
      - isNull: { path: 'spec.rules[0].http.paths[0].pathType' }

  - it: writes the class annotation and the legacy backend before 1.18
    capabilities: { majorVersion: 1, minorVersion: 17 }
    set:
      ingress.enabled: true
    asserts:
      - equal: { path: apiVersion, value: networking.k8s.io/v1beta1 }
      - isNull: { path: spec.ingressClassName }
      - equal: { path: 'metadata.annotations["kubernetes.io/ingress.class"]', value: nginx }
      - isNull: { path: 'spec.rules[0].http.paths[0].pathType' }
      - equal: { path: 'spec.rules[0].http.paths[0].backend.serviceName', value: RELEASE-NAME-betterlite }
      - equal: { path: 'spec.rules[0].http.paths[0].backend.servicePort', value: 4000 }
      - isNull: { path: 'spec.rules[0].http.paths[0].backend.service' }

  - it: keeps a user supplied class annotation before 1.18
    capabilities: { majorVersion: 1, minorVersion: 17 }
    set:
      ingress.enabled: true
      ingress.annotations:
        kubernetes.io/ingress.class: traefik
    asserts:
      - equal: { path: 'metadata.annotations["kubernetes.io/ingress.class"]', value: traefik }

  - it: adds a pathType and the class name from 1.18
    capabilities: { majorVersion: 1, minorVersion: 18 }
    set:
      ingress.enabled: true
    asserts:
      - equal: { path: apiVersion, value: networking.k8s.io/v1beta1 }
      - equal: { path: spec.ingressClassName, value: nginx }
      - equal: { path: 'spec.rules[0].http.paths[0].pathType', value: ImplementationSpecific }
      - isNull: { path: metadata.annotations }

  - it: writes the v1 backend from 1.19
    capabilities: { majorVersion: 1, minorVersion: 19 }
    set:
      ingress.enabled: true
    asserts:
      - equal: { path: apiVersion, value: networking.k8s.io/v1 }
      - equal: { path: 'spec.rules[0].http.paths[0].backend.service.name', value: RELEASE-NAME-betterlite }
      - isNull: { path: 'spec.rules[0].http.paths[0].backend.serviceName' }

  - it: writes the beta api from 1.14
    capabilities: { majorVersion: 1, minorVersion: 14 }
    set:
      ingress.enabled: true
    asserts:
      - equal: { path: apiVersion, value: networking.k8s.io/v1beta1 }
      - equal: { path: 'spec.rules[0].http.paths[0].backend.serviceName', value: RELEASE-NAME-betterlite }

  - it: writes the extensions api before 1.14
    capabilities: { majorVersion: 1, minorVersion: 13 }
    set:
      ingress.enabled: true
    asserts:
      - equal: { path: apiVersion, value: extensions/v1beta1 }
      - equal: { path: 'spec.rules[0].http.paths[0].backend.serviceName', value: RELEASE-NAME-betterlite }
