suite: test database credentials secret
templates:
  - secret-dbcredentials.yaml
tests:
  - it: should store the bundled database credentials under the names the proxy reads
    template: secret-dbcredentials.yaml
    set:
      db.deployStandalone: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterlite-dbcredentials
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.username
          value: bGl0ZWxsbQ==
      - equal:
          path: data.password
          value: Tm9UYUdyRWFUcEFzU3dPckQ=
      - equal:
          path: data["postgres-password"]
          value: Tm9UYUdyRWFUcEFzU3dPckQ=
  - it: should carry overridden credentials, including the dashed postgres-password key
    template: secret-dbcredentials.yaml
    set:
      db.deployStandalone: true
      postgresql.auth.username: custom-user
      postgresql.auth.password: custom-secret
      postgresql.auth.postgres-password: custom-admin
    asserts:
      - equal:
          path: data.username
          value: Y3VzdG9tLXVzZXI=
      - equal:
          path: data.password
          value: Y3VzdG9tLXNlY3JldA==
      - equal:
          path: data["postgres-password"]
          value: Y3VzdG9tLWFkbWlu
  - it: should fall back to litellm for empty credentials
    template: secret-dbcredentials.yaml
    set:
      db.deployStandalone: true
      postgresql.auth.username: ""
      postgresql.auth.password: ""
      postgresql.auth.postgres-password: ""
    asserts:
      - equal:
          path: data.username
          value: bGl0ZWxsbQ==
      - equal:
          path: data.password
          value: bGl0ZWxsbQ==
      - equal:
          path: data["postgres-password"]
          value: bGl0ZWxsbQ==
  - it: should not create the secret when the bundled database is not deployed
    template: secret-dbcredentials.yaml
    set:
      db.deployStandalone: false
    asserts:
      - hasDocuments:
          count: 0
