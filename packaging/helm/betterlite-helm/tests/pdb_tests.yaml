suite: pdb
templates:
  - poddisruptionbudget.yaml
tests:
  - it: renders no budget by default
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders a budget for the deployment when enabled
    set:
      pdb.enabled: true
      pdb.maxUnavailable: 1
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: PodDisruptionBudget }
      - equal: { path: apiVersion, value: policy/v1 }
      - equal: { path: metadata.name, value: RELEASE-NAME-betterlite }
      - equal: { path: spec.maxUnavailable, value: 1 }
      - isNull: { path: spec.minAvailable }
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: betterlite
            app.kubernetes.io/instance: RELEASE-NAME

  - it: defaults to one unavailable pod when neither bound is set
    set:
      pdb.enabled: true
    asserts:
      - equal: { path: spec.maxUnavailable, value: 1 }
      - isNull: { path: spec.minAvailable }

  - it: uses minAvailable when both are set
    set:
      pdb.enabled: true
      pdb.minAvailable: "50%"
      pdb.maxUnavailable: 1
    asserts:
      - equal: { path: spec.minAvailable, value: "50%" }
      - isNull: { path: spec.maxUnavailable }

  - it: uses minAvailable alone
    set:
      pdb.enabled: true
      pdb.minAvailable: 2
    asserts:
      - equal: { path: spec.minAvailable, value: 2 }
      - isNull: { path: spec.maxUnavailable }

  - it: uses a percentage maxUnavailable
    set:
      pdb.enabled: true
      pdb.maxUnavailable: "20%"
    asserts:
      - equal: { path: spec.maxUnavailable, value: "20%" }
      - isNull: { path: spec.minAvailable }

  - it: carries custom labels and annotations
    set:
      pdb.enabled: true
      pdb.labels:
        team: platform
      pdb.annotations:
        example.com/owner: gateway
    asserts:
      - equal: { path: metadata.labels.team, value: platform }
      - equal: { path: 'metadata.labels["app.kubernetes.io/name"]', value: betterlite }
      - equal: { path: 'metadata.annotations["example.com/owner"]', value: gateway }
