suite: test masterkey secret
templates:
  - secret-masterkey.yaml
  - serviceaccount.yaml
tests:
  - it: should create a secret if masterkeySecretName is not set. should start with sk-xxxx (base64 encoded as c2st*)
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: ""
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterlite-masterkey
      # The masterkey is "sk-" plus 18 random letters and digits in plain text, which is 21 bytes,
      # so the base64 in the Secret is "c2st" followed by exactly 24 characters and no padding.
      - matchRegex:
          path: data.masterkey
          pattern: ^c2st[A-Za-z0-9+/]{24}$
  - it: should reuse the master key already stored in the cluster instead of generating a new one on upgrade
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: ""
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-betterlite-masterkey
            namespace: NAMESPACE
          data:
            masterkey: c2stZXhpc3Rpbmcta2V5
    asserts:
      - equal:
          path: data.masterkey
          value: c2stZXhpc3Rpbmcta2V5
  - it: should let an explicit masterkey value override the one already stored in the cluster
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: ""
      masterkey: sk-explicit
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: RELEASE-NAME-betterlite-masterkey
            namespace: NAMESPACE
          data:
            masterkey: c2stZXhpc3Rpbmcta2V5
    asserts:
      - equal:
          path: data.masterkey
          value: c2stZXhwbGljaXQ=
  - it: should use an explicit masterkey value when the cluster holds no key yet
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: ""
      masterkey: sk-explicit
    asserts:
      - equal:
          path: data.masterkey
          value: c2stZXhwbGljaXQ=
  - it: should not create a secret if masterkeySecretName is set
    template: secret-masterkey.yaml
    set:
      masterkeySecretName: my-secret
    asserts:
      - hasDocuments:
          count: 0
  # The task's scope lists only these five suites, and the ServiceAccount has no suite of its own
  - it: should not create the service account unless serviceAccount.create is true
    template: serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should name the created service account after the fullname and mount its token
    template: serviceaccount.yaml
    set:
      serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-betterlite
      - equal:
          path: metadata.labels["helm.sh/chart"]
          value: betterlite-helm-1.1.3
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: betterlite
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: v1.85.1
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: automountServiceAccountToken
          value: true
  - it: should use the configured name, annotations and automount setting
    template: serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.name: my-sa
      serviceAccount.automount: false
      serviceAccount.annotations:
        example.com/role: gateway
    asserts:
      - equal:
          path: metadata.name
          value: my-sa
      - equal:
          path: metadata.annotations["example.com/role"]
          value: gateway
      - equal:
          path: automountServiceAccountToken
          value: false
