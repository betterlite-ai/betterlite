suite: collector sidecar
templates:
  - deployment.yaml
  - configmap-betterlite.yaml
tests:
  - it: runs the proxy alone with no collector environment by default
    template: deployment.yaml
    asserts:
      - lengthEqual: { path: spec.template.spec.containers, count: 1 }
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_ENABLED }, any: true }
      - notContains: { path: spec.template.spec.volumes, content: { name: collector-socket }, any: true }

  - it: adds the sidecar on the same image and shares the collector environment
    template: deployment.yaml
    set:
      image: { tag: test }
      collector:
        enabled: true
        resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "1", memory: 2Gi } }
      securityContext: { readOnlyRootFilesystem: true }
      volumeMounts: [{ name: tls, mountPath: /etc/tls, readOnly: true }]
      environmentSecrets: [gateway-secrets]
    asserts:
      - lengthEqual: { path: spec.template.spec.containers, count: 2 }
      - equal: { path: 'spec.template.spec.containers[1].name', value: betterlite-collector }
      - equal: { path: 'spec.template.spec.containers[1].image', value: 'ghcr.io/betterlite-ai/betterlite:test' }
      - equal: { path: 'spec.template.spec.containers[1].command', value: [betterlite, collector] }
      - equal: { path: 'spec.template.spec.containers[1].resources.requests.cpu', value: 500m }
      - equal: { path: 'spec.template.spec.containers[1].resources.limits.memory', value: 2Gi }
      - equal: { path: 'spec.template.spec.containers[1].securityContext', value: { readOnlyRootFilesystem: true } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_ENABLED, value: "true" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_ADDRESS, value: unix:///var/run/litellm/collector.sock } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_BUFFER_SIZE, value: "1000" } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_ON_UNAVAILABLE, value: fallback } }
      - notContains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_JOB_ROLE }, any: true }
      - contains: { path: 'spec.template.spec.containers[1].env', content: { name: LITELLM_JOB_ROLE, value: collector } }
      - contains: { path: 'spec.template.spec.containers[1].env', content: { name: CONFIG_FILE_PATH, value: /etc/betterlite/config.yaml } }
      - contains: { path: 'spec.template.spec.containers[1].env', content: { name: DATABASE_HOST, value: RELEASE-NAME-postgresql } }
      - contains:
          path: 'spec.template.spec.containers[1].env'
          content: { name: DATABASE_PASSWORD, valueFrom: { secretKeyRef: { name: RELEASE-NAME-betterlite-dbcredentials, key: password } } }
      - contains: { path: 'spec.template.spec.containers[1].env', content: { name: LITELLM_COLLECTOR_DRAIN_TIMEOUT_SECONDS, value: "10" } }
      - equal: { path: 'spec.template.spec.containers[1].envFrom', value: [{ secretRef: { name: gateway-secrets } }] }
      - contains: { path: 'spec.template.spec.containers[1].volumeMounts', content: { name: betterlite-config, mountPath: /etc/betterlite/config.yaml, subPath: config.yaml } }
      - contains: { path: 'spec.template.spec.containers[1].volumeMounts', content: { name: tmp, mountPath: /tmp } }
      - contains: { path: 'spec.template.spec.containers[1].volumeMounts', content: { name: tls, mountPath: /etc/tls, readOnly: true } }
      - contains: { path: 'spec.template.spec.containers[0].volumeMounts', content: { name: collector-socket, mountPath: /var/run/litellm } }
      - contains: { path: 'spec.template.spec.containers[1].volumeMounts', content: { name: collector-socket, mountPath: /var/run/litellm } }
      - contains: { path: spec.template.spec.volumes, content: { name: collector-socket, emptyDir: { sizeLimit: 1Mi } } }

  - it: skips the socket volume and passes the policy through on tcp transport
    template: deployment.yaml
    set:
      collector: { enabled: true, address: tcp://127.0.0.1:4100, onUnavailable: drop, bufferSize: 50 }
      envVars: { CONFIG_FILE_PATH: /custom/config.yaml }
    asserts:
      - lengthEqual: { path: spec.template.spec.containers, count: 2 }
      - notContains: { path: 'spec.template.spec.containers[1].env', content: { name: CONFIG_FILE_PATH, value: /etc/betterlite/config.yaml }, any: true }
      - contains: { path: 'spec.template.spec.containers[1].env', content: { name: CONFIG_FILE_PATH, value: /custom/config.yaml } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_ADDRESS, value: tcp://127.0.0.1:4100 } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_ON_UNAVAILABLE, value: drop } }
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: LITELLM_COLLECTOR_BUFFER_SIZE, value: "50" } }
      - notContains: { path: spec.template.spec.volumes, content: { name: collector-socket }, any: true }

  - it: takes the sidecar command from values
    template: deployment.yaml
    set: { collector: { enabled: true, command: [betterlite, collector, --verbose] } }
    asserts:
      - equal: { path: 'spec.template.spec.containers[1].command', value: [betterlite, collector, --verbose] }

  - it: keeps the metrics port environment on the proxy container only
    template: deployment.yaml
    set:
      collector: { enabled: true }
      metricsServer: { enabled: true, port: 9090 }
    asserts:
      - contains: { path: 'spec.template.spec.containers[0].env', content: { name: PROMETHEUS_METRICS_PORT, value: "9090" } }
      - notContains: { path: 'spec.template.spec.containers[1].env', content: { name: PROMETHEUS_METRICS_PORT }, any: true }
