{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "betterlite.fullname" . }}
  labels:
    {{- include "betterlite.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "betterlite.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      {{- if .Values.serviceMonitor.namespaceSelector.matchNames }}
      {{- toYaml .Values.serviceMonitor.namespaceSelector.matchNames | nindent 6 }}
      {{- else }}
      - {{ .Release.Namespace | quote }}
      {{- end }}
  endpoints:
    - port: {{ ternary "metrics" "http" .Values.metricsServer.enabled }}
      path: /metrics/
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      scheme: http
      {{- with .Values.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
