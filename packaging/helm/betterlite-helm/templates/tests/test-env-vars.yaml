apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "betterlite.fullname" . }}-env-test"
  labels:
    {{- include "betterlite.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test
      image: busybox
      command: ['sh', '-c']
      args:
        - |
          if [ "$EXAMPLE_ENV" != "dev_helm" ]; then
            echo "Environment variable EXAMPLE_ENV mismatch. Expected: dev_helm, Got: $EXAMPLE_ENV"
            exit 1
          fi
          echo "Environment variable EXAMPLE_ENV matches expected value: $EXAMPLE_ENV"
      env:
        - name: EXAMPLE_ENV
          value: {{ .Values.envVars.EXAMPLE_ENV | quote }}
  restartPolicy: Never
