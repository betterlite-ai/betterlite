[package]
name = "betterlite-oracle-rate-limit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1.92"
betterlite-auth = { path = "../../../../../crates/betterlite-auth" }
betterlite-config = { path = "../../../../../crates/betterlite-config" }
betterlite-db = { path = "../../../../../crates/betterlite-db" }
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-rate-limit = { path = "../../../../../crates/betterlite-rate-limit" }
betterlite-redis = { path = "../../../../../crates/betterlite-redis" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }

[lints]
workspace = true
