[package]
name = "betterlite-oracle-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
betterlite-auth = { path = "../../../../../crates/betterlite-auth" }
betterlite-cache = { path = "../../../../../crates/betterlite-cache" }
betterlite-config = { path = "../../../../../crates/betterlite-config" }
betterlite-context = { path = "../../../../../crates/betterlite-context" }
betterlite-core = { path = "../../../../../crates/betterlite-core" }
betterlite-db = { path = "../../../../../crates/betterlite-db" }
betterlite-error = { path = "../../../../../crates/betterlite-error" }
betterlite-http = { path = "../../../../../crates/betterlite-http" }
betterlite-models = { path = "../../../../../crates/betterlite-models" }
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-oracle-runner = { path = "../../../runner" }
betterlite-redact = { path = "../../../../../crates/betterlite-redact" }
betterlite-redis = { path = "../../../../../crates/betterlite-redis" }
betterlite-secrets = { path = "../../../../../crates/betterlite-secrets" }
betterlite-server = { path = "../../../../../crates/betterlite-server" }
chrono.workspace = true
hex = "0.4.3"
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
redis.workspace = true
rust_decimal.workspace = true
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
sha2.workspace = true
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry"] }

[dev-dependencies]
rstest = "=0.27.0"
serde-saphyr = "2.0.0"

[lints]
workspace = true
