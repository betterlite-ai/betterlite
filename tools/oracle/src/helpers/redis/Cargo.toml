[package]
name = "betterlite-oracle-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-redis = { path = "../../../../../crates/betterlite-redis" }
redis.workspace = true
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }

[lints]
workspace = true
