[package]
name = "betterlite-oracle-foundry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1.92"
betterlite-azure = { path = "../../../../../crates/betterlite-azure" }
betterlite-config = { path = "../../../../../crates/betterlite-config" }
betterlite-core = { path = "../../../../../crates/betterlite-core" }
betterlite-foundry = { path = "../../../../../crates/betterlite-foundry" }
betterlite-models = { path = "../../../../../crates/betterlite-models" }
betterlite-openai = { path = "../../../../../crates/betterlite-openai" }
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-oracle-runner = { path = "../../../runner" }
betterlite-prompts = { path = "../../../../../crates/betterlite-prompts" }
betterlite-secret-managers = { path = "../../../../../crates/betterlite-secret-managers" }
chrono.workspace = true
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
rust_decimal.workspace = true
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }

[dev-dependencies]
serde-saphyr = "2.0.0"

[lints]
workspace = true
