[package]
name = "betterlite-oracle-core-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
betterlite-anthropic = { path = "../../../../../crates/betterlite-anthropic" }
betterlite-auth = { path = "../../../../../crates/betterlite-auth" }
betterlite-config = { path = "../../../../../crates/betterlite-config" }
betterlite-context = { path = "../../../../../crates/betterlite-context" }
betterlite-core = { path = "../../../../../crates/betterlite-core" }
betterlite-error = { path = "../../../../../crates/betterlite-error" }
betterlite-guardrails = { path = "../../../../../crates/betterlite-guardrails" }
betterlite-http = { path = "../../../../../crates/betterlite-http" }
betterlite-logging = { path = "../../../../../crates/betterlite-logging" }
betterlite-mcp = { path = "../../../../../crates/betterlite-mcp" }
betterlite-models = { path = "../../../../../crates/betterlite-models" }
betterlite-openai = { path = "../../../../../crates/betterlite-openai" }
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-policy = { path = "../../../../../crates/betterlite-policy" }
betterlite-prompts = { path = "../../../../../crates/betterlite-prompts" }
betterlite-provider = { path = "../../../../../crates/betterlite-provider" }
betterlite-redact = { path = "../../../../../crates/betterlite-redact" }
betterlite-streaming = { path = "../../../../../crates/betterlite-streaming" }
betterlite-tokenizer = { path = "../../../../../crates/betterlite-tokenizer" }
betterlite-transcribe = { path = "../../../../../crates/betterlite-transcribe" }
betterlite-vertex = { path = "../../../../../crates/betterlite-vertex" }
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
rust_decimal.workspace = true
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry"] }
url = "2.5.8"
uuid = { version = "1.28.0", default-features = false }

[dev-dependencies]
betterlite-oracle = { path = "../../.." }
serde-saphyr = "2.0.0"

[lints]
workspace = true
