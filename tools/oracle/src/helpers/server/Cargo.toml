[package]
name = "betterlite-oracle-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
async-trait = "0.1.92"
aws-smithy-eventstream = "=0.61.6"
aws-smithy-types = "=1.9.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
betterlite = { path = "../../../../../crates/betterlite" }
betterlite-analytics = { path = "../../../../../crates/betterlite-analytics" }
betterlite-auth = { path = "../../../../../crates/betterlite-auth" }
betterlite-backend = { path = "../../../../../crates/betterlite-backend" }
betterlite-cache = { path = "../../../../../crates/betterlite-cache" }
betterlite-config = { path = "../../../../../crates/betterlite-config" }
betterlite-context = { path = "../../../../../crates/betterlite-context" }
betterlite-core = { path = "../../../../../crates/betterlite-core" }
betterlite-db = { path = "../../../../../crates/betterlite-db" }
betterlite-error = { path = "../../../../../crates/betterlite-error" }
betterlite-gateway = { path = "../../../../../crates/betterlite-gateway" }
betterlite-guardrails = { path = "../../../../../crates/betterlite-guardrails" }
betterlite-http = { path = "../../../../../crates/betterlite-http" }
betterlite-lens = { path = "../../../../../crates/betterlite-lens" }
betterlite-logging = { path = "../../../../../crates/betterlite-logging" }
betterlite-mcp = { path = "../../../../../crates/betterlite-mcp" }
betterlite-models = { path = "../../../../../crates/betterlite-models" }
betterlite-ocr = { path = "../../../../../crates/betterlite-ocr" }
betterlite-openai = { path = "../../../../../crates/betterlite-openai" }
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-oracle-runner = { path = "../../../runner" }
betterlite-paths = { path = "../../../../../crates/betterlite-paths" }
betterlite-policy = { path = "../../../../../crates/betterlite-policy" }
betterlite-prometheus = { path = "../../../../../crates/betterlite-prometheus" }
betterlite-redact = { path = "../../../../../crates/betterlite-redact" }
betterlite-redis = { path = "../../../../../crates/betterlite-redis" }
betterlite-reporting = { path = "../../../../../crates/betterlite-reporting" }
betterlite-roi = { path = "../../../../../crates/betterlite-roi" }
betterlite-routes = { path = "../../../../../crates/betterlite-routes" }
betterlite-secret-managers = { path = "../../../../../crates/betterlite-secret-managers" }
betterlite-secrets = { path = "../../../../../crates/betterlite-secrets" }
betterlite-semantic = { path = "../../../../../crates/betterlite-semantic" }
betterlite-server = { path = "../../../../../crates/betterlite-server", features = ["testing"] }
betterlite-tracing = { path = "../../../../../crates/betterlite-tracing" }
betterlite-transcribe = { path = "../../../../../crates/betterlite-transcribe" }
betterlite-vertex = { path = "../../../../../crates/betterlite-vertex" }
chrono.workspace = true
flate2 = "1.1.5"
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
http = "1.5.0"
indexmap = "2.14.2"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server"] }
rust_decimal.workspace = true
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
sha2.workspace = true
soft-canonicalize = "0.5.6"
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry"] }
uuid.workspace = true

[dev-dependencies]
rstest = "=0.27.0"
serde-saphyr = "2.0.0"

[lints]
workspace = true
