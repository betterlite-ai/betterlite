[package]
name = "betterlite-oracle-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
betterlite-config = { path = "../../../../../crates/betterlite-config" }
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-secrets = { path = "../../../../../crates/betterlite-secrets" }
hex = "0.4.3"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }

[dev-dependencies]
rstest = "=0.27.0"

[lints]
workspace = true
