[package]
name = "betterlite-oracle-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
betterlite-oracle-helper-api = { path = "../../../helper-api" }
betterlite-oracle-runner = { path = "../../../runner" }
betterlite-policy = { path = "../../../../../crates/betterlite-policy" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }

[dev-dependencies]
serde-saphyr = "2.0.0"

[lints]
workspace = true
