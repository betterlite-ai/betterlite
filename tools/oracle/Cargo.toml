[package]
name = "betterlite-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-anthropic = { path = "../../crates/betterlite-anthropic" }
betterlite-auth = { path = "../../crates/betterlite-auth" }
betterlite-azure = { path = "../../crates/betterlite-azure" }
betterlite-billing = { path = "../../crates/betterlite-billing" }
betterlite-compression = { path = "../../crates/betterlite-compression" }
betterlite-config = { path = "../../crates/betterlite-config" }
betterlite-context = { path = "../../crates/betterlite-context" }
betterlite-core = { path = "../../crates/betterlite-core" }
betterlite-cost = { path = "../../crates/betterlite-cost" }
betterlite-db = { path = "../../crates/betterlite-db" }
betterlite-error = { path = "../../crates/betterlite-error" }
betterlite-foundry = { path = "../../crates/betterlite-foundry" }
betterlite-http = { path = "../../crates/betterlite-http" }
betterlite-logging = { path = "../../crates/betterlite-logging" }
betterlite-models = { path = "../../crates/betterlite-models" }
betterlite-ocr = { path = "../../crates/betterlite-ocr" }
betterlite-paths = { path = "../../crates/betterlite-paths" }
betterlite-prompts = { path = "../../crates/betterlite-prompts" }
betterlite-provider = { path = "../../crates/betterlite-provider" }
betterlite-rate-limit = { path = "../../crates/betterlite-rate-limit" }
betterlite-redact = { path = "../../crates/betterlite-redact" }
betterlite-router = { path = "../../crates/betterlite-router" }
betterlite-streaming = { path = "../../crates/betterlite-streaming" }
betterlite-tokenizer = { path = "../../crates/betterlite-tokenizer" }
betterlite-vertex = { path = "../../crates/betterlite-vertex" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "time", "io-util", "macros", "process", "fs"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = "2.0.0"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
uuid = { version = "1.28.0", default-features = false }

[dev-dependencies]
rstest = "=0.27.0"

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["betterlite-anthropic", "betterlite-auth", "betterlite-azure", "betterlite-billing", "betterlite-compression", "betterlite-config", "betterlite-core", "betterlite-cost", "betterlite-db", "betterlite-error", "betterlite-foundry", "betterlite-logging", "betterlite-ocr", "betterlite-prompts", "betterlite-provider", "betterlite-rate-limit", "betterlite-redact", "betterlite-router", "betterlite-streaming", "betterlite-tokenizer", "betterlite-vertex"]
ignored-paths = ["src/helpers/*/*.rs"]
