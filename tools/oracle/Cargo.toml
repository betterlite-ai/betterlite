[package]
name = "betterlite-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
betterlite-anthropic = { path = "../../crates/betterlite-anthropic" }
betterlite-auth = { path = "../../crates/betterlite-auth" }
betterlite-bedrock = { path = "../../crates/betterlite-bedrock" }
betterlite-config = { path = "../../crates/betterlite-config" }
betterlite-context = { path = "../../crates/betterlite-context" }
betterlite-core = { path = "../../crates/betterlite-core" }
betterlite-db = { path = "../../crates/betterlite-db" }
betterlite-guardrails = { path = "../../crates/betterlite-guardrails" }
betterlite-harness = { path = "../../crates/betterlite-harness" }
betterlite-http = { path = "../../crates/betterlite-http" }
betterlite-lens = { path = "../../crates/betterlite-lens" }
betterlite-logging = { path = "../../crates/betterlite-logging" }
betterlite-mcp = { path = "../../crates/betterlite-mcp" }
betterlite-models = { path = "../../crates/betterlite-models" }
betterlite-openai = { path = "../../crates/betterlite-openai" }
betterlite-openapi = { path = "../../crates/betterlite-openapi" }
betterlite-paths = { path = "../../crates/betterlite-paths" }
betterlite-postgres-fixture = { path = "../postgres-fixture" }
betterlite-prompts = { path = "../../crates/betterlite-prompts" }
betterlite-rate-limit = { path = "../../crates/betterlite-rate-limit" }
betterlite-redact = { path = "../../crates/betterlite-redact" }
betterlite-router = { path = "../../crates/betterlite-router" }
betterlite-secrets = { path = "../../crates/betterlite-secrets" }
betterlite-server = { path = "../../crates/betterlite-server" }
betterlite-streaming = { path = "../../crates/betterlite-streaming" }
betterlite-websearch = { path = "../../crates/betterlite-websearch" }
chrono.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.145", features = ["raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc"] }
thiserror = "2.0.17"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "time", "io-util", "macros", "process", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
ulid = "3.0.0"
uuid = { version = "1.28.0", default-features = false }

[dev-dependencies]
rstest = "=0.27.0"

[[test]]
name = "otlp_normalization"
path = "src/helpers/logging/otlp_normalization/tests.rs"

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["src/helpers/*/*.rs"]
