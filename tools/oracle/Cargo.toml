[package]
name = "betterlite-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
betterlite-bedrock = { path = "../../crates/betterlite-bedrock" }
betterlite-context = { path = "../../crates/betterlite-context" }
betterlite-http = { path = "../../crates/betterlite-http" }
betterlite-models = { path = "../../crates/betterlite-models" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "time", "io-util", "macros", "process", "fs"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = "2.0.0"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
uuid = { version = "1.28.0", default-features = false }

[dev-dependencies]
rstest = "=0.27.0"

[lints]
workspace = true
