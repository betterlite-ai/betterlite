[package]
name = "betterlite-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "betterlite-oracle"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
betterlite = { path = "../../crates/betterlite" }
betterlite-a2a = { path = "../../crates/betterlite-a2a" }
betterlite-anthropic = { path = "../../crates/betterlite-anthropic" }
betterlite-auth = { path = "../../crates/betterlite-auth" }
betterlite-azure = { path = "../../crates/betterlite-azure" }
betterlite-cli = { path = "../../crates/betterlite-cli" }
betterlite-compression = { path = "../../crates/betterlite-compression" }
betterlite-config = { path = "../../crates/betterlite-config" }
betterlite-context = { path = "../../crates/betterlite-context" }
betterlite-core = { path = "../../crates/betterlite-core" }
betterlite-db = { path = "../../crates/betterlite-db" }
betterlite-env = { path = "../../crates/betterlite-env" }
betterlite-error = { path = "../../crates/betterlite-error" }
betterlite-foundry = { path = "../../crates/betterlite-foundry" }
betterlite-guardrails = { path = "../../crates/betterlite-guardrails" }
betterlite-http = { path = "../../crates/betterlite-http" }
betterlite-logging = { path = "../../crates/betterlite-logging" }
betterlite-models = { path = "../../crates/betterlite-models" }
betterlite-openai = { path = "../../crates/betterlite-openai" }
betterlite-oracle-core-ops = { path = "src/helpers/core_ops" }
betterlite-oracle-groups = { path = "groups", features = ["all"] }
betterlite-oracle-helper-api = { path = "helper-api" }
betterlite-oracle-runner = { path = "runner" }
betterlite-oracle-tokenizer = { path = "src/helpers/tokenizer" }
betterlite-postgres-fixture = { path = "../postgres-fixture" }
betterlite-prompts = { path = "../../crates/betterlite-prompts" }
betterlite-provider = { path = "../../crates/betterlite-provider" }
betterlite-rate-limit = { path = "../../crates/betterlite-rate-limit" }
betterlite-redact = { path = "../../crates/betterlite-redact" }
betterlite-redis = { path = "../../crates/betterlite-redis" }
betterlite-router = { path = "../../crates/betterlite-router", features = ["testing"] }
betterlite-sdk = { path = "../../crates/betterlite-sdk" }
betterlite-secret-managers = { path = "../../crates/betterlite-secret-managers" }
betterlite-server = { path = "../../crates/betterlite-server", features = ["testing"] }
betterlite-streaming = { path = "../../crates/betterlite-streaming" }
betterlite-tokenizer = { path = "../../crates/betterlite-tokenizer" }
betterlite-transcribe = { path = "../../crates/betterlite-transcribe" }
betterlite-vertex = { path = "../../crates/betterlite-vertex" }
betterlite-websearch = { path = "../../crates/betterlite-websearch" }
bytes = "1.12.1"
chrono.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
cookie_store = "0.22.0"
flate2 = "1.1.5"
futures-executor = "0.3.34"
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
percent-encoding.workspace = true
quick-xml.workspace = true
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng", "sys_rng"] }
redis.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
rust_decimal.workspace = true
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "raw_value"] }
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "indexmap_2", "macros"] }
sha2.workspace = true
tempfile = "3.27.0"
thiserror = "2.0.17"
tl = "0.7.8"
tokio = { version = "=1.53.3", features = ["rt", "net", "sync", "test-util", "time", "io-util", "macros", "process", "fs"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "registry"] }
url = "2.5.8"
uuid = { version = "1.28.0", default-features = false }
[dev-dependencies]
rstest = "=0.27.0"
tokio-postgres.workspace = true
[[test]]
name = "otlp_normalization"
path = "src/helpers/logging/otlp_normalization/tests.rs"
[[test]]
name = "dashboard_governance_case"
path = "src/dashboard_governance_fixture/decoder.rs"
[[test]]
name = "foundry_image_generation_seeds"
path = "src/helpers/foundry/image_generation/target.rs"
[lints]
workspace = true
[package.metadata.cargo-shear]
ignored-paths = ["src/helpers/*/*.rs"]
