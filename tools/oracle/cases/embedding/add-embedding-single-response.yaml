kind: helper
name: add-embedding-single-response
call:
  b4298:
    add_embedding_response_to_cache:
      request:
        key:
          params:
            - {name: model, value: text-embedding-3-small}
            - {name: input, value: hello}
      result:
        model: text-embedding-3-small
        data:
          - {embedding: [0.1, 0.2], index: 0, object: embedding}
        usage:
          prompt_tokens: 4
          prompt_tokens_details:
            image_tokens: 2
      input: hello
      idx: 0
      cache_type: local
      mode: default_on
      settings:
        ttl: 600.0
env: {}
compare:
  ignore: []
