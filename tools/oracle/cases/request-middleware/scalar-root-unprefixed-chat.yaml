name: request-middleware-scalar-root-unprefixed-chat
config: |
  model_list:
    - model_name: scalar-root-model
      litellm_params: {model: openai/gpt-scalar-root-upstream, api_base: "{{upstream}}", api_key: oracle-key}
env: {SERVER_ROOT_PATH: /proxy}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-scalar-root-unprefixed}
  body: {model: scalar-root-model, messages: [{role: user, content: hi}]}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-scalar-root-unprefixed
      object: chat.completion
      created: 1700000008
      model: gpt-scalar-root-upstream
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: [content-type, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base, x-frame-options, content-security-policy, x-content-type-options]
  headers_present: [x-litellm-response-duration-ms]
  upstream_headers: [authorization, content-type]
  ignore: []
