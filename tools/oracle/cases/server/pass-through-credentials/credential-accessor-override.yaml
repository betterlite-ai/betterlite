kind: helper
name: credential-accessor-override
call:
  b3602:
    function: credentials
    provider: openai
    deployments:
      - model_name: gpt
        litellm_params:
          model: openai/gpt-4o-mini
          use_in_pass_through: true
          litellm_credential_name: named-key
          api_key: parameter-key
    credentials:
      named-key:
        api_key: stored-key
    environment: {}
env: {}
compare: {ignore: []}
