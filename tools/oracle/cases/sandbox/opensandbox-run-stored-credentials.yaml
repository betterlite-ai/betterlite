kind: helper
name: opensandbox-run-stored-credentials
call:
  b3518:
    operation: run
    container:
      id: sbx_1
      provider: opensandbox
      domain: http://stored.example
      hidden_params:
        api_base: http://stored.example
        api_key: stored-key
        execd_endpoint: http://execd.local
        execd_headers:
          X-Execd-Token: execd-token
        use_server_proxy: true
    code: "print('hello')"
    responses:
      - status: 200
        body: |
          data: {"type":"stdout","text":"hello\n"}
          data: {"type":"execution_count","execution_count":1}
          data: {"type":"result","text":"'hello'","results":{"text/plain":"hello"}}
          data: {"type":"error","error":{"ename":"ValueError","evalue":"bad input","traceback":["line 1"]}}
env: {}
compare:
  ignore: []
