kind: helper
name: opensandbox-endpoint-503-retry
call:
  b3517:
    operation: wait_for_execd_endpoint
    sandbox_id: sbx_1
    api_base: http://sandbox.example
    headers:
      Content-Type: application/json
    use_server_proxy: false
    ready_timeout: 30.0
    poll_interval: 0.1
    responses:
      - status: 503
        body: '{"error":"not ready"}'
      - status: 200
        body: '{"endpoint":"10.0.0.5:44772","headers":{"X-Exec-Token":"abc"}}'
env: {}
compare:
  ignore: []
