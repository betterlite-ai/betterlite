kind: helper
name: sandbox-secret-resolution
call:
  b3519:
    operation: registry
    tools:
      - sandbox_tool_name: resolved
        litellm_params:
          sandbox_provider: e2b
          api_key: os.environ/E2B_API_KEY
          api_base: os.environ/E2B_API_BASE
      - sandbox_tool_name: missing
        litellm_params:
          sandbox_provider: e2b
          api_key: os.environ/MISSING_KEY
      - sandbox_tool_name: flag
        litellm_params:
          sandbox_provider: e2b
          api_key: os.environ/FLAG_VALUE
      - sandbox_tool_name: literal
        litellm_params:
          sandbox_provider: e2b
          api_key: aws_secret_manager/key
    names: [resolved, missing, flag, literal]
    environment:
      E2B_API_KEY: resolved-key
      E2B_API_BASE: https://e2b.test
      FLAG_VALUE: "true"
env: {}
compare:
  ignore: []
