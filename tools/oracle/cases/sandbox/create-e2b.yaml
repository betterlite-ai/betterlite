kind: helper
name: sandbox-create-e2b
call:
  b3519:
    operation: create
    provider: e2b
    api_key: e2b-test-key
    api_base: https://e2b.test
    template: code-interpreter-v1
    timeout: 120
    allow_internet_access: false
    replies:
      - body: '{"sandboxID":"sbx_123","domain":"custom.e2b.app","envdAccessToken":"envd-secret"}'
env: {}
compare:
  ignore: []
