kind: helper
name: opensandbox-run-sse-output
call:
  b3517:
    operation: run
    url: http://sandbox.example/sandboxes/sbx_1/endpoints/44772/code
    headers:
      Content-Type: application/json
      Accept: text/event-stream
      Cache-Control: no-cache
    body:
      code: "print('hello')"
      context:
        language: python
    response_body: |
      data: {"type":"stdout","text":"hello\n"}
      data: {"type":"stderr","text":"warning\n"}
      data: {"type":"execution_count","execution_count":1}
      data: {"type":"result","text":"'hello'","results":{"text/plain":"hello"}}
      data: {"type":"error","error":{"ename":"ValueError","evalue":"bad input","traceback":["line 1"]}}
env: {}
compare:
  ignore: []
