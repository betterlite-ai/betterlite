kind: helper
name: frame-over-limit
call:
  b3042:
    function: enforce_project_io_token_quota_for_frame
    auth:
      project_id: p1
      project_metadata:
        model_itpm_limit:
          gpt-4: 500
        model_otpm_limit:
          gpt-4: 900
    requested_model: "gpt-4-0613"
    estimated_input_tokens: 500
    estimated_output_tokens: 70
    window_size: 60
    now: 1700000000
    groups:
      "gpt-4-0613": "gpt-4"
    cache:
      "{model_per_project_itpm:p1:gpt-4}:window": "1699999970"
      "{model_per_project_itpm:p1:gpt-4}:tokens": 40
env:
  LITELLM_RATE_LIMIT_WINDOW_SIZE: "60"
compare:
  ignore: []
