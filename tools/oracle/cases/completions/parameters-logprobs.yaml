name: completions-parameters-logprobs
config: |
  model_list:
    - model_name: text-model
      litellm_params: {model: openai/gpt-3.5-turbo-instruct, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body: {model: text-model, prompt: Once upon a time, max_tokens: 16, temperature: 0.7, top_p: 0.9, n: 2, logprobs: 3, top_logprobs: 1, stop: ['\n', END], seed: 42, max_retries: 3}
upstream: [{status: 200, headers: {content-type: application/json}, body: {id: cmpl-3, object: text_completion, created: 1700000002, model: gpt-3.5-turbo-instruct, choices: [{text: ' hi', index: 0, logprobs: {tokens: [' hi'], token_logprobs: [-0.25], top_logprobs: [{' hi': -0.25}], text_offset: [0]}, finish_reason: length}], usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}}}]
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
