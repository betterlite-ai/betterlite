name: completions-empty-list-rejected
config: |
  model_list:
    - model_name: text-model
      litellm_params: {model: openai/gpt-3.5-turbo-instruct, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body: {model: text-model, prompt: []}
upstream: []
compare:
  headers: [content-type, llm_provider-x-request-id]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /error/message, why: betterlite writes its own provider error message}
  expected_difference:
    - pointer: /status
      reference: 500
      rust: 400
      why: an empty prompt names no prompt to send, so betterlite answers the client mistake instead of LiteLLM's unhandled Exception
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7646-L7649
    - pointer: /error/type
      reference: null
      rust: invalid_request_error
      why: the Exception reaches the client with a null type, so betterlite names the field instead
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7646-L7649
    - pointer: /error/code
      reference: "500"
      rust: "400"
      why: the proxy copies the exception's status into the body code, so the status change moves the code with it
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12265-L12272
