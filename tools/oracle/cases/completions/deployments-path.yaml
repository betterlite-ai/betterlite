name: completions-deployments-path
config: |
  model_list:
    - model_name: text-model
      litellm_params: {model: openai/gpt-3.5-turbo-instruct, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /openai/deployments/text-model/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body: {model: wrong, prompt: hello}
upstream: [{status: 200, headers: {content-type: application/json}, body: {id: cmpl-1, object: text_completion, created: 1700000000, model: gpt-3.5-turbo-instruct, choices: [{text: ' hello', index: 0, logprobs: null, finish_reason: stop}], usage: {prompt_tokens: 3, completion_tokens: 2, total_tokens: 5}}}]
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
