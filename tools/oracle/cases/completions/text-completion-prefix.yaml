name: completions-text-completion-prefix
config: |
  model_list:
    - model_name: text-model
      litellm_params: {model: text-completion-openai/gpt-4o, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body: {model: text-model, prompt: hello}
upstream: [{status: 200, headers: {content-type: application/json}, body: {id: cmpl-4, object: text_completion, created: 1700000003, model: gpt-4o, choices: [{text: ' hi', index: 0, logprobs: null, finish_reason: stop}], usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}}}]
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
