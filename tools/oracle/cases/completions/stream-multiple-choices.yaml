name: completions-stream-multiple-choices
config: |
  model_list:
    - model_name: text-multi
      litellm_params: {model: "text-completion-openai/multi-text", api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body: {model: text-multi, prompt: Once upon a time, stream: true, n: 2}
upstream:
  - status: 200
    headers: {content-type: text/event-stream, x-request-id: provider-stream}
    events:
      - '{"id":"cmpl-text","object":"text_completion","created":1700000000,"model":"multi-text","choices":[{"text":" Hel","index":0,"logprobs":null,"finish_reason":null},{"text":" Bye","index":1,"logprobs":null,"finish_reason":null}]}'
      - '{"id":"cmpl-text","object":"text_completion","created":1700000000,"model":"multi-text","choices":[{"text":"","index":0,"logprobs":null,"finish_reason":"stop"},{"text":"","index":1,"logprobs":null,"finish_reason":"stop"}]}'
      - '[DONE]'
compare:
  headers: [content-type, llm_provider-x-request-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name]
  headers_present: [x-litellm-call-id]
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /0/created, why: LiteLLM timestamps every stream chunk}
    - {pointer: /1/created, why: LiteLLM timestamps every stream chunk}
