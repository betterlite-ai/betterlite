name: completions-strings-prompt
config: |
  model_list:
    - model_name: text-model
      litellm_params: {model: openai/gpt-3.5-turbo-instruct, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body: {model: text-model, prompt: [hello, world]}
upstream: [{status: 200, headers: {content-type: application/json}, body: {id: cmpl-2, object: text_completion, created: 1700000001, model: gpt-3.5-turbo-instruct, choices: [{text: ' first', index: 0, logprobs: null, finish_reason: stop}, {text: ' second', index: 1, logprobs: null, finish_reason: stop}], usage: {prompt_tokens: 2, completion_tokens: 4, total_tokens: 6}}}]
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
