kind: helper
name: genai-http-error-handling
call:
  b3488:
    mode: sync
    provider: gemini
    model: gemini-2.5-flash
    contents:
      - role: user
        parts:
          - text: Hello
    config:
      temperature: 0.2
      maxOutputTokens: 16
    tools: null
    system_instruction: null
    litellm_params:
      api_key: provider-key
    extra_headers: null
    extra_body: null
    timeout: 30.0
    stream: false
    reply:
      status: 429
      headers:
        retry-after: '1'
      body: '{"error":{"code":429,"message":"slow down"}}'
env: {}
compare:
  ignore: []
