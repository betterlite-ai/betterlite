kind: helper
name: genai-http-hidden-params-model-info
call:
  b3488:
    mode: sync
    provider: gemini
    model: gemini-2.5-flash
    contents:
      - role: user
        parts:
          - text: Hello
    config:
      temperature: 0.2
      maxOutputTokens: 16
    tools: null
    system_instruction: null
    litellm_params:
      api_key: provider-key
      model_info:
        id: deployment-7
    extra_headers: null
    extra_body: null
    timeout: 30.0
    stream: true
    reply:
      status: 200
      headers:
        x-request-id: r3
        x-ratelimit-remaining-requests: '9'
      body: |
        data: {"candidates":[{"content":{"parts":[{"text":"Hi"}]}}]}
env: {}
compare:
  ignore:
    - pointer: /value/pre_call/headers/x-goog-api-key
      why: B249 masks the headers kept on the call details, where LiteLLM stores the live value
