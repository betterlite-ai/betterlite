name: embeddings-upstream-429
config: |
  model_list:
    - model_name: embed-model
      litellm_params: {model: openai/text-embedding-3-small, api_base: "{{upstream}}", api_key: oracle-key}
  router_settings: {num_retries: 0}
env: {}
request:
  method: POST
  path: /v1/embeddings
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body: {model: embed-model, input: hello}
upstream:
  - status: 429
    headers: {content-type: application/json, x-request-id: embedding-error}
    body: {error: {message: bad input, type: requests, param: input, code: invalid}}
compare:
  headers: [content-type, llm_provider-x-request-id]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /error/message, why: provider SDK error text formatting differs across OpenAI client versions}
