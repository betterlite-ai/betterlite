name: embeddings-string-input
config: |
  model_list:
    - model_name: embed-model
      litellm_params: {model: openai/text-embedding-3-small, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/embeddings
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-embedding}
  body: {model: embed-model, input: hello world}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {object: list, data: [{object: embedding, embedding: [0.1, 0.2], index: 0}], model: text-embedding-3-small, usage: {prompt_tokens: 2, total_tokens: 2}}
compare: {headers: [content-type, x-litellm-call-id, x-litellm-model-group], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
