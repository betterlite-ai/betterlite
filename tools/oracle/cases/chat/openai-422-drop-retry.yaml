name: chat-openai-422-drop-retry
config: |
  model_list:
    - model_name: gpt-3.5-turbo
      litellm_params:
        model: openai/gpt-3.5-turbo
        api_base: "{{upstream}}"
        api_key: oracle-key
  litellm_settings:
    drop_params: true
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
  body:
    model: gpt-3.5-turbo
    messages:
      - role: user
        content: hello world
    temperature: 2
upstream:
  - status: 422
    headers:
      content-type: application/json
    body:
      error:
        message: '{"detail":[{"loc":["body","temperature"],"type":"extra_forbidden"}]}'
        type: invalid_request_error
  - status: 200
    headers:
      content-type: application/json
      x-request-id: upstream-after-retry
    body:
      id: chatcmpl-after-retry
      object: chat.completion
      created: 1700000000
      model: gpt-3.5-turbo
      choices:
        - index: 0
          message: {role: assistant, content: recovered}
          finish_reason: stop
      usage: {prompt_tokens: 9, completion_tokens: 1, total_tokens: 10}
compare:
  headers:
    - content-type
    - x-litellm-model-id
    - x-litellm-model-name
    - x-litellm-model-api-base
  headers_present:
    - x-litellm-call-id
  upstream_headers:
    - authorization
    - content-type
  ignore: []
