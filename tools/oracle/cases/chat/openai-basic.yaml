name: chat-openai-basic
config: |
  model_list:
    - model_name: oracle-model
      litellm_params:
        model: openai/oracle-model
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
  body:
    model: oracle-model
    messages:
      - role: user
        content: Say hello.
    stream: false
upstream:
  - status: 200
    headers:
      content-type: application/json
    body:
      id: chatcmpl-oracle
      object: chat.completion
      created: 1700000000
      model: oracle-model
      choices:
        - index: 0
          message:
            role: assistant
            content: Hello!
          finish_reason: stop
      usage:
        prompt_tokens: 5
        completion_tokens: 2
        total_tokens: 7
compare:
  headers:
    - content-type
  headers_present:
    - x-litellm-call-id
  upstream_headers:
    - authorization
    - content-type
  ignore:
    - pointer: /id
      why: LiteLLM generates a request id for each gateway process.
    - pointer: /created
      why: LiteLLM timestamps each response.
