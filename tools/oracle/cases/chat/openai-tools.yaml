name: chat-openai-tools
config: |
  model_list:
    - model_name: tools-model
      litellm_params: {model: openai/gpt-tools-upstream, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-tools}
  body:
    model: tools-model
    messages:
      - {role: user, content: Weather in Paris?}
      - role: assistant
        content: null
        tool_calls: [{id: call_0, type: function, function: {name: get_weather, arguments: "{\"city\":\"Rome\"}"}}]
      - {role: tool, tool_call_id: call_0, content: "sunny"}
    tools:
      - type: function
        function:
          name: get_weather
          description: Current weather
          parameters: {type: object, properties: {city: {type: string}}, required: [city]}
    tool_choice: auto
    parallel_tool_calls: false
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-tools
      object: chat.completion
      created: 1700000001
      model: gpt-tools-upstream
      choices:
        - index: 0
          message:
            role: assistant
            content: null
            tool_calls: [{id: call_1, type: function, function: {name: get_weather, arguments: "{\"city\":\"Paris\"}"}}]
          finish_reason: tool_calls
      usage: {prompt_tokens: 30, completion_tokens: 9, total_tokens: 39}
compare:
  headers: [content-type, llm_provider-content-type, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base, x-litellm-attempted-retries, x-litellm-attempted-fallbacks]
  headers_present: [x-litellm-response-duration-ms, x-litellm-overhead-duration-ms, x-litellm-callback-duration-ms, x-litellm-version]
  upstream_headers: [authorization, content-type]
  ignore: []
