name: chat-openai-output-limit-stream
config: |
  model_list:
    - model_name: gpt-3.5-turbo
      litellm_params:
        model: openai/gpt-3.5-turbo
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
  body:
    model: gpt-3.5-turbo
    messages:
      - role: user
        content: hello world
    stream: true
upstream:
  - status: 400
    headers:
      content-type: application/json
      x-request-id: upstream-output-limit
    body:
      error:
        message: "Could not finish the message because max_tokens or model output limit was reached."
        type: invalid_request_error
        param: max_tokens
        code: invalid_value
compare:
  headers:
    - content-type
    - x-litellm-model-id
    - x-litellm-model-name
    - x-litellm-model-api-base
  headers_present:
    - x-litellm-call-id
  upstream_headers:
    - authorization
    - content-type
  ignore:
    - pointer: /0/id
      why: LiteLLM generates a stream id for each gateway process.
    - pointer: /0/created
      why: LiteLLM timestamps stream chunks.
    - pointer: /1/id
      why: LiteLLM repeats its generated stream id.
    - pointer: /1/created
      why: LiteLLM timestamps stream chunks.
