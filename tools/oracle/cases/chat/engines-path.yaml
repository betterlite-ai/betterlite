name: chat-engines-path
config: |
  model_list:
    - model_name: engines-model
      litellm_params: {model: openai/gpt-engines-upstream, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /engines/engines-model/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-engines}
  body: {model: not-configured, messages: [{role: user, content: hi}]}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-engines
      object: chat.completion
      created: 1700000005
      model: gpt-engines-upstream
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: [content-type, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base]
  headers_present: [x-litellm-response-duration-ms]
  upstream_headers: [authorization, content-type]
  ignore: []
