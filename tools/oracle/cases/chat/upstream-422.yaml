name: chat-upstream-422
config: |
  model_list:
    - model_name: unprocessable-model
      litellm_params: {model: openai/gpt-422-upstream, api_base: "{{upstream}}", api_key: oracle-key}
  router_settings: {num_retries: 0}
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-422}
  body: {model: unprocessable-model, messages: [{role: user, content: hi}]}
upstream:
  - status: 422
    headers: {content-type: application/json}
    body: {error: {message: "Unprocessable entity", type: invalid_request_error, param: null, code: null}}
compare:
  headers: [content-type, llm_provider-content-type, x-litellm-call-id, x-litellm-timeout]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /error/message, why: betterlite writes its own message}
