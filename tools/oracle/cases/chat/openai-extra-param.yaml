name: chat-openai-extra-param
config: |
  model_list:
    - model_name: extra-model
      litellm_params: {model: openai/gpt-extra-upstream, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-extra}
  body:
    model: extra-model
    messages: [{role: user, content: hi}]
    service_tier: auto
    user: oracle-user
    logprobs: true
    top_logprobs: 2
    vendor_flag: {mode: fast, level: 3}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-extra
      object: chat.completion
      created: 1700000003
      model: gpt-extra-upstream
      choices:
        - index: 0
          message: {role: assistant, content: Hello!}
          logprobs: {content: [{token: Hello, logprob: -0.5, bytes: [72, 101, 108, 108, 111], top_logprobs: [{token: Hello, logprob: -0.5, bytes: [72, 101, 108, 108, 111]}]}]}
          finish_reason: stop
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: [content-type, llm_provider-content-type, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base, x-litellm-attempted-retries, x-litellm-attempted-fallbacks]
  headers_present: [x-litellm-response-duration-ms, x-litellm-overhead-duration-ms, x-litellm-callback-duration-ms, x-litellm-version]
  upstream_headers: [authorization, content-type]
  ignore: []
