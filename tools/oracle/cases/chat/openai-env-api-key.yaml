name: chat-openai-env-api-key
config: |
  model_list:
    - model_name: env-key-model
      litellm_params: {model: openai/gpt-env-upstream, api_base: "{{upstream}}"}
env: {OPENAI_API_KEY: oracle-env-key}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-env}
  body: {model: env-key-model, messages: [{role: user, content: hi}]}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-env
      object: chat.completion
      created: 1700000004
      model: gpt-env-upstream
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: [content-type, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base]
  headers_present: [x-litellm-response-duration-ms]
  upstream_headers: [authorization, content-type]
  ignore: []
