name: chat-anthropic-provider-dispatch-http
config: |
  model_list:
    - model_name: anthropic-dispatch-model
      litellm_params:
        model: anthropic/claude-3-haiku-20240307
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
    x-litellm-call-id: oracle-call-anthropic
  body:
    model: anthropic-dispatch-model
    messages:
      - {role: user, content: Say hello over anthropic.}
    temperature: 0.2
    max_tokens: 20
upstream:
  - status: 200
    headers:
      content-type: application/json
      request-id: upstream-anthropic-1
      anthropic-ratelimit-requests-limit: "50"
    body:
      id: msg_dispatch
      type: message
      role: assistant
      model: claude-3-haiku-20240307
      content:
        - {type: text, text: hello over anthropic}
      stop_reason: end_turn
      stop_sequence: null
      usage: {input_tokens: 3, output_tokens: 2}
compare:
  headers: [content-type, llm_provider-content-type, llm_provider-request-id, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name]
  headers_present: [x-litellm-response-duration-ms, x-litellm-overhead-duration-ms, x-litellm-callback-duration-ms, x-litellm-version]
  upstream_headers: [x-api-key, anthropic-version, content-type]
  ignore:
    - {pointer: /id, why: LiteLLM generates the completion id and betterlite keeps the upstream message id}
    - {pointer: /created, why: the completion time is read from the clock on each side}
