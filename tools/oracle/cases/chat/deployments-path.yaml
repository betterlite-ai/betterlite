name: chat-deployments-path
config: |
  model_list:
    - model_name: deployments-model
      litellm_params: {model: openai/gpt-deployments-upstream, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /openai/deployments/deployments-model/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-deployments}
  body: {messages: [{role: user, content: hi}]}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-deployments
      object: chat.completion
      created: 1700000006
      model: gpt-deployments-upstream
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: [content-type, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base]
  headers_present: [x-litellm-response-duration-ms]
  upstream_headers: [authorization, content-type]
  ignore: []
