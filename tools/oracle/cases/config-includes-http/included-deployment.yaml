name: includes-included-deployment
config: |
  include:
    - fragments/models.yaml
  general_settings:
    master_key: oracle-master
  router_settings:
    num_retries: 0
env: {ORACLE_INCLUDE_KEY: oracle-include-key}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-included-deployment}
  body: {model: include-deployment, messages: [{role: user, content: hi}]}
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-included-deployment}
    body:
      id: chatcmpl-included-deployment
      object: chat.completion
      created: 1700000101
      model: gpt-4o
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
config_files:
  fragments/models.yaml: |
    model_list:
      - model_name: include-deployment
        litellm_params:
          model: openai/gpt-4o
          api_base: "{{upstream}}"
          api_key: os.environ/ORACLE_INCLUDE_KEY
          max_retries: 0
compare:
  headers: [content-type, llm_provider-content-type, llm_provider-x-request-id, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base, x-litellm-attempted-retries, x-litellm-attempted-fallbacks]
  headers_present: [x-litellm-response-duration-ms, x-litellm-overhead-duration-ms, x-litellm-callback-duration-ms, x-litellm-version]
  upstream_headers: [authorization, content-type]
  ignore: []
