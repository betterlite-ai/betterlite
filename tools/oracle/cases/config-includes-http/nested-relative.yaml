name: includes-nested-relative
config: |
  include:
    - nested/entry.yaml
  general_settings:
    master_key: oracle-master
  router_settings:
    num_retries: 0
env: {}
request:
  method: POST
  path: /engines/nested-include/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-nested-include}
  body: {model: nested-include, messages: [{role: user, content: nested}]}
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-nested-include}
    body:
      id: chatcmpl-nested-include
      object: chat.completion
      created: 1700000104
      model: gpt-4o
      choices: [{index: 0, message: {role: assistant, content: Nested!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
config_files:
  nested/entry.yaml: |
    include:
      - models.yaml
  nested/models.yaml: |
    model_list:
      - model_name: nested-include
        litellm_params:
          model: openai/gpt-4o
          api_base: "{{upstream}}"
          api_key: nested-key
          max_retries: 0
compare:
  headers: [content-type, llm_provider-content-type, llm_provider-x-request-id, x-litellm-call-id, x-litellm-model-group, x-litellm-model-id, x-litellm-model-name, x-litellm-model-api-base, x-litellm-attempted-retries, x-litellm-attempted-fallbacks]
  headers_present: [x-litellm-response-duration-ms, x-litellm-overhead-duration-ms, x-litellm-callback-duration-ms, x-litellm-version]
  upstream_headers: [authorization, content-type]
  ignore: []
