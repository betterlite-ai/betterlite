kind: helper
name: reconciliation-operations-io-token-released
call:
  b3045:
    function: io_token_ops
    call_id: call-1
    stash:
      owner_call_id: call-1
      itpm_reserved_tokens: 60
      itpm_reserved_scopes:
        - [model_per_project_itpm, "proj-1:gpt-4"]
      itpm_reserved_windows:
        - counter_key: "{model_per_project_itpm:proj-1:gpt-4}:tokens"
          window_start: "1700000000"
          backend: redis
      otpm_reserved_tokens: 30
      otpm_reserved_scopes:
        - [model_per_project_otpm, "proj-1:gpt-4"]
      otpm_reserved_windows:
        - counter_key: "{model_per_project_otpm:proj-1:gpt-4}:tokens"
          window_start: "1700000000"
          backend: local
      reservation_released: true
    response:
      kind: usage
      usage: {prompt_tokens: 100, completion_tokens: 50, total_tokens: 150}
    window_size: 60
env: {LITELLM_RATE_LIMIT_WINDOW_SIZE: "60"}
compare: {ignore: []}
