kind: helper
name: google-secret-manager-cache-negative
call:
  b4420:
    environment: {GOOGLE_SECRET_MANAGER_PROJECT_ID: "oracle-project"}
    refresh_interval: 30
    responses:
      - {status: 404, body: '{"error":{"code":404}}'}
      - {status: 200, body: '{"payload":{"data":"c2VjcmV0"}}'}
    steps:
      - {read: "db-password"}
      - {read: "db-password"}
      - {advance: 30}
      - {read: "db-password"}
      - {advance: 1}
      - {read: "db-password"}
env: {}
compare: {ignore: []}
