kind: helper
name: vault-secret-operations-rotate-old-not-found
env: {}
compare: {ignore: []}
call:
  b4417:
    env:
      HCP_VAULT_TOKEN: token
    routes:
      - route: "GET http://127.0.0.1:8200/v1/secret/data/OLD_KEY"
        replies:
          - {status: 404, body: '{"errors":[]}'}
    steps:
      - {op: rotate, current: OLD_KEY, new: NEW_KEY, value: new-secret}
