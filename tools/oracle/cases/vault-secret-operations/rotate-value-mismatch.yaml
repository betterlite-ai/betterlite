kind: helper
name: vault-secret-operations-rotate-value-mismatch
env: {}
compare: {ignore: []}
call:
  b4417:
    env:
      HCP_VAULT_TOKEN: token
    routes:
      - route: "GET http://127.0.0.1:8200/v1/secret/data/OLD_KEY"
        replies:
          - {status: 200, body: '{"data":{"data":{"key":"old-secret"}}}'}
      - route: "POST http://127.0.0.1:8200/v1/secret/data/NEW_KEY"
        replies:
          - {status: 200, body: '{"request_id":"req-1","data":{"version":1}}'}
      - route: "GET http://127.0.0.1:8200/v1/secret/data/NEW_KEY"
        replies:
          - {status: 200, body: '{"data":{"data":{"key":"different-secret"}}}'}
    steps:
      - {op: rotate, current: OLD_KEY, new: NEW_KEY, value: new-secret}
