kind: helper
name: vault-secret-operations-rotate-same-name
env: {}
compare: {ignore: []}
call:
  b4417:
    env:
      HCP_VAULT_TOKEN: token
    routes:
      - route: "GET http://127.0.0.1:8200/v1/secret/data/SAME_KEY"
        replies:
          - {status: 200, body: '{"data":{"data":{"key":"old-secret"}}}'}
          - {status: 200, body: '{"data":{"data":{"key":"new-secret"}}}'}
      - route: "POST http://127.0.0.1:8200/v1/secret/data/SAME_KEY"
        replies:
          - {status: 200, body: '{"request_id":"req-1","data":{"version":2}}'}
    steps:
      - {op: rotate, current: SAME_KEY, new: SAME_KEY, value: new-secret}
