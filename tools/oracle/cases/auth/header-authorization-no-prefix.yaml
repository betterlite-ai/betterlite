name: auth-header-authorization-no-prefix
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    Authorization: oracle-master
  body:
    model: test
    messages: []
upstream: []
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore:
    - pointer: ""
      why: LiteLLM returns an unstructured internal-server-error body for an Authorization value with no recognized prefix
