# A request fallback target is resolved only after the primary fails, so this request never
# reaches it; the case pins that enabling fallback authorization leaves the successful path
# byte-identical between the proxies.
name: auth-model-grants-fallback-target-denied
config: |
  general_settings:
    master_key: oracle-master
    enforce_fallback_model_access: true
  model_list:
    - model_name: fallback-model
      litellm_params:
        model: openai/fallback-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
    - model_name: fallback-target
      litellm_params:
        model: openai/fallback-target-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
    x-litellm-call-id: oracle-call-fallback-target-denied
  body:
    model: fallback-model
    messages:
      - {role: user, content: Say hello.}
    stream: false
    fallbacks: [fallback-target]
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-request-fallback}
    body:
      id: chatcmpl-fallback
      object: chat.completion
      created: 1700000000
      model: gpt-fallback-upstream-2024
      system_fingerprint: fp_oracle
      service_tier: default
      choices:
        - index: 0
          message: {role: assistant, content: Hello!, refusal: null, annotations: []}
          logprobs: null
          finish_reason: stop
      usage:
        prompt_tokens: 5
        completion_tokens: 2
        total_tokens: 7
        prompt_tokens_details: {cached_tokens: 0, audio_tokens: 0}
        completion_tokens_details: {reasoning_tokens: 0, audio_tokens: 0, accepted_prediction_tokens: 0, rejected_prediction_tokens: 0}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
