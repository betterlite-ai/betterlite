# The caller restriction reads the authenticated token, never client metadata: a forged
# agent_caller in the body must leave the master-key request untouched on both proxies.
name: auth-model-grants-agent-caller-restriction
config: |
  general_settings:
    master_key: oracle-master
    enforce_fallback_model_access: true
  model_list:
    - model_name: agent-caller-model
      litellm_params:
        model: openai/agent-caller-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
    x-litellm-call-id: oracle-call-agent-caller-restriction
  body:
    model: agent-caller-model
    messages:
      - {role: user, content: Say hello.}
    metadata:
      agent_caller: {user_id: forged-user, team_id: forged-team}
    stream: false
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-request-agent-caller}
    body:
      id: chatcmpl-agent-caller
      object: chat.completion
      created: 1700000007
      model: gpt-agent-caller-upstream-2024
      system_fingerprint: fp_oracle
      service_tier: default
      choices:
        - index: 0
          message: {role: assistant, content: Hello!, refusal: null, annotations: []}
          logprobs: null
          finish_reason: stop
      usage:
        prompt_tokens: 5
        completion_tokens: 2
        total_tokens: 7
        prompt_tokens_details: {cached_tokens: 0, audio_tokens: 0}
        completion_tokens_details: {reasoning_tokens: 0, audio_tokens: 0, accepted_prediction_tokens: 0, rejected_prediction_tokens: 0}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
