kind: helper
name: entity-model-access-auth-key-resolved-target
call:
  entity_model_access:
    steps:
      - function: key
        model: fast
        database: false
        token: {token: hash-1, models: [gpt-4o], aliases: {fast: claude}}
      - function: key
        model: fast
        database: false
        token: {token: hash-1, models: [claude], aliases: {fast: claude}}
      - function: key
        model: fast
        database: false
        token: {token: hash-1, models: [fast], aliases: {fast: claude}}
      - function: resolved
        model: fast
        database: true
        token: {token: hash-1, models: [claude], aliases: {fast: claude}, team_id: team-1}
        cache:
          "team_id:team-1": {team_id: team-1, models: [fast]}
      - function: resolved
        model: fast
        database: true
        token: {token: hash-1, models: [claude], aliases: {fast: claude}, team_id: team-1}
        cache:
          "team_id:team-1": {team_id: team-1, models: [claude]}
env: {}
compare: {ignore: []}
