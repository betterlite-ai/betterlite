name: auth-trusted-network-mcp-hop-limit
config: |
  general_settings:
    master_key: oracle-master
    use_x_forwarded_for: true
    mcp_trusted_proxy_ranges: [127.0.0.0/8]
    mcp_xff_num_trusted_hops: 2
  model_list:
    - model_name: trusted-model
      litellm_params:
        model: openai/trusted-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
    x-forwarded-for: "203.0.113.9, 198.51.100.7"
  body:
    model: trusted-model
    messages:
      - {role: user, content: Say hello.}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-hop-limit
      object: chat.completion
      created: 1700000024
      model: trusted-upstream
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
