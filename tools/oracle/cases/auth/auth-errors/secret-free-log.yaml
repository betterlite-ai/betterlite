kind: helper
name: auth-errors-route-secret-free-log
call:
  auth_errors:
    rows:
      # a provider key quoted in a transformed rejection never reaches the log in clear
      - step: handle
        failure: {kind: http, message: "Authentication Error, sk-dddddddddddddddddddddddddddddd is not valid", type: auth_error, param: null, status_code: 401, marked: true, internal_message: ""}
        reply: replace
        replacement: {kind: http, message: "rejected sk-eeeeeeeeeeeeeeeeeeeeeeeeeeeeee", type: auth_error, param: null, status_code: 429, marked: false, internal_message: ""}
        switches: []
        identity: null
        request_data: {model: gpt-4o}
        route: /v1/chat/completions
        user_agent: curl/8.5
        client_host: 192.0.2.10
env: {}
compare:
  ignore: []
