kind: helper
name: auth-errors-route-model-denial-403
call:
  auth_errors:
    rows:
      # a team model denial: public detail on the wire, the private message kept for logs
      - step: handle
        failure: {kind: model_denial, message: "team not allowed to access model. This team can only access models=['claude-3-haiku']. Tried to access gpt-4o", type: auth_error, param: null, status_code: 401, marked: false, internal_message: "team team-9 key hash abc"}
        reply: original
        replacement: null
        switches: [log_auth_failure_key_identity]
        identity: {team_id: team-9, team_alias: research}
        request_data: {model: gpt-4o, metadata: {tags: [batch]}}
        route: /v1/chat/completions
        user_agent: curl/8.5
        client_host: 192.0.2.10
env: {}
compare:
  ignore: []
