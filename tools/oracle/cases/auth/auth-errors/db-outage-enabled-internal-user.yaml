kind: helper
name: auth-errors-route-db-outage-enabled-internal-user
call:
  auth_errors:
    rows:
      # the outage identity keeps the raw route and is an internal user, never an administrator
      - step: handle
        failure: {kind: connect, message: "All connection attempts failed", type: "", param: null, status_code: 0, marked: false, internal_message: ""}
        reply: raise
        replacement: null
        switches: [allow_requests_on_db_unavailable, log_client_error_tracebacks]
        identity: {user_id: known-user}
        request_data: {model: gpt-4o}
        route: /v1/responses/resp_abc
        user_agent: openai-python/1.60.0
        client_host: 192.0.2.10
env: {}
compare:
  ignore: []
