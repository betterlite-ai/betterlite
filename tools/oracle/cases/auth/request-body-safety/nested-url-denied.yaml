name: request-body-safety-nested-url-denied
config: |
  general_settings:
    master_key: oracle-master
  model_list:
    - model_name: safety-model
      litellm_params:
        model: openai/safety-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
  body:
    model: safety-model
    messages:
      - {role: user, content: Say hello.}
    extra_body:
      api_base: https://evil.example
upstream: []
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: []
  ignore: []
