name: request-body-safety-metadata-not-object
config: |
  general_settings:
    master_key: oracle-master
  model_list:
    - model_name: safety-model
      litellm_params:
        model: openai/safety-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
    x-litellm-call-id: oracle-call-request-body-safety-metadata
  body:
    model: safety-model
    messages:
      - {role: user, content: Say hello.}
    metadata: not json
    stream: false
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-request-safety-metadata}
    body:
      id: chatcmpl-safety-metadata
      object: chat.completion
      created: 1700000006
      model: gpt-safety-upstream-2024
      system_fingerprint: fp_oracle
      service_tier: default
      choices:
        - index: 0
          message: {role: assistant, content: Hello!, refusal: null, annotations: []}
          logprobs: null
          finish_reason: stop
      usage:
        prompt_tokens: 5
        completion_tokens: 3
        total_tokens: 8
        prompt_tokens_details: {cached_tokens: 0, audio_tokens: 0}
        completion_tokens_details: {reasoning_tokens: 0, audio_tokens: 0, accepted_prediction_tokens: 0, rejected_prediction_tokens: 0}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
