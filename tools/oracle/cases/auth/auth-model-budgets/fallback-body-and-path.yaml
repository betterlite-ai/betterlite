kind: helper
name: auth-model-budgets-auth-fallback-body-and-path
call:
  auth_model_budgets:
    calls:
      - function: key_fallback
        token:
          token: sk-p
          models: [gpt-4, gpt-3.5]
        model_name: gpt-4
        request_model: gpt-4
        request_data:
          model: gpt-4
          stream: true
        path_params:
          model: gpt-4
          provider: openai
        failing: true
        fallback: gpt-3.5
      - function: key_fallback
        token:
          token: sk-q
          models: [gpt-4, gpt-3.5]
        model_name: gpt-4
        request_model: gpt-4
        request_data:
          model: gpt-4
        path_params:
          id: xyz
        failing: true
        fallback: gpt-3.5
env: {}
compare:
  ignore: []
