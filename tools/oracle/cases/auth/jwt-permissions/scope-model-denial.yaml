kind: helper
name: jwt-permissions-auth-scope-model-denial
call:
  jwt_permissions:
    function: scope_access
    scope_mappings:
      - scope: chat
        models: [gpt-4o]
    scopes: [chat]
    model: claude-3
env: {}
compare:
  ignore:
    - pointer: /value/message
      why: betterlite writes its own denial text and never echoes the bearer
