kind: helper
name: jwt-permissions-auth-missing-model
call:
  jwt_permissions:
    function: check_rbac_role
    enforce_rbac: true
    role: internal_user
    role_permissions:
      - role: internal_user
        models: [gpt-4o]
        routes: [/user/info]
    route: /user/info
env: {}
compare: {ignore: []}
