name: auth-model-patterns-generic-model-denial
config: |
  model_list:
    - {model_name: alpha, litellm_params: {model: openai/alpha-upstream, api_key: oracle-key}}
env:
  DEFAULT_MAX_RECURSE_DEPTH: "1"
request:
  method: GET
  path: /v1/files?model=alpha&target_model_names=beta
  headers: {authorization: Bearer oracle-master}
  body: null
upstream: []
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: []
  ignore:
    - {pointer: /error/message, why: "betterlite writes its own message"}
