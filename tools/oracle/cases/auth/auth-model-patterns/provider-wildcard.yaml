name: auth-model-patterns-provider-wildcard
config: |
  model_list:
    - model_name: gpt-wild
      litellm_params: {model: openai/gpt-4o-upstream, api_base: "{{upstream}}", api_key: oracle-key}
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-provider}
  body: {model: gpt-wild, messages: [{role: user, content: hi}]}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-provider
      object: chat.completion
      created: 1700000011
      model: gpt-4o-upstream
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: [content-type, x-litellm-call-id]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
