name: auth-model-patterns-unknown-group
config: |
  model_list:
    - {model_name: team-fast, litellm_params: {model: openai/team-fast-upstream}}
env: {}
request:
  method: GET
  path: /v1/models/team-missing
  headers: {authorization: Bearer oracle-master}
  body: null
upstream: []
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: []
  ignore: [{pointer: /detail, why: "betterlite writes its own message, and LiteLLM's 404 body is only this detail string"}]
