name: auth-model-lists-credential-hydration
config: |
  model_list:
    - {model_name: creds-model, litellm_params: {model: openai/creds-upstream}}
    - {model_name: creds-model-b, litellm_params: {model: openai/creds-upstream-b}}
env: {}
request:
  method: GET
  path: /v1/models
  headers: {authorization: Bearer oracle-master}
  body: null
upstream: []
compare: {headers: [content-type], headers_present: [], upstream_headers: [], ignore: []}
