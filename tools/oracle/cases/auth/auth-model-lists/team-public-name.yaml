name: auth-model-lists-team-public-name
config: |
  model_list:
    - {model_name: team-public, litellm_params: {model: openai/team-public-upstream}}
    - {model_name: team-internal, litellm_params: {model: openai/team-internal-upstream}}
env: {}
request:
  method: GET
  path: /v1/models
  headers: {authorization: Bearer oracle-master}
  body: null
upstream: []
compare: {headers: [content-type], headers_present: [], upstream_headers: [], ignore: []}
