name: auth-model-lists-wildcard-known-models
config: |
  model_list:
    - {model_name: gpt-wild, litellm_params: {model: openai/gpt-4o-upstream}}
    - {model_name: gemini-wild, litellm_params: {model: openai/gemini-upstream}}
env: {}
request:
  method: GET
  path: /v1/models
  headers: {authorization: Bearer oracle-master}
  body: null
upstream: []
compare: {headers: [content-type], headers_present: [], upstream_headers: [], ignore: []}
