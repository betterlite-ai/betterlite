kind: helper
name: auth-key-budgets-auth-multi-window-exhaustion
call:
  auth_key_budgets:
    calls:
      - function: admit
        token:
          token: sk-win-auth
          budget_limits:
            - budget_duration: 1h
              max_budget: 10.0
              reset_at: "2026-06-01T12:00:00Z"
            - budget_duration: 1d
              max_budget: 20.0
              reset_at: "2026-06-01T00:00:00"
            - budget_duration: 1w
              max_budget: 30.0
              reset_at: "2026-05-30T12:00:00Z"
        spends: [2.0, 20.0, 31.0]
        now: "2026-06-01T12:00:00Z"
env: {}
compare:
  ignore: []
