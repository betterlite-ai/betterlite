name: auth-jwt-verification-algorithm-confusion-401
native_feature_eligibility: true
# betterlite refuses general_settings.enable_jwt_auth until B10006, so only the LiteLLM child's root sets it
config: |
  general_settings:
    master_key: oracle-master
config_files:
  litellm.yaml: |
    general_settings:
      master_key: oracle-master
      enable_jwt_auth: true
env:
  JWT_AUDIENCE: "litellm-proxy"
  JWT_PUBLIC_KEY_URL: "{{upstream}}/jwks"
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLTEiLCJleHAiOjQxMDI0NDQ4MDAsImlhdCI6MTYwMDAwMDAwMCwibmJmIjoxNjAwMDAwMDAwLCJhdWQiOiJsaXRlbGxtLXByb3h5In0.udyXITyztmHFJHc4o9uMrPqq17APaKDrB4YMj5liJNg
  body:
    model: oracle-model
    messages:
      - {role: user, content: hi}
upstream:
  # the provider publishes the key the token claims, so only the token itself can fail
  - status: 200
    headers: {content-type: application/json}
    body: {"keys": [{"kty":"RSA","kid":"rsa-key","n":"qBV4uuD4ho4EljGE_P0Mkeu4ez_KwlFScpDLtRQDxOg8Xmq-QcuML77h593QZ-K_rbWxHqD_VVHUQLKTiLuIJNeUS6QXqpbbkvwhJpNNyUFBr0d46RnnU6kQF5wH4KIfWYs2ns97lceqOLc40a8eppoap6k1aXr2l_b2NuJvKPB7qmeAbGu9qvLKzOIhqUGCjcVZFr75IXrVDrX8VXkN3LIBgtdFIbz89AGfh8hV4iNbGmCGWJxadJENmbNCmqNt0GS1zJsl9fK7ivXVnZbT8psHOxnmipU_DjXvxhIoBSZH9b1F0mrBdejxM3rP8BZPPpcZPC_sKzMyNwxTeRJQhw","e":"AQAB"}]}
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore:
    - pointer: /error/message
      why: betterlite writes its own message
