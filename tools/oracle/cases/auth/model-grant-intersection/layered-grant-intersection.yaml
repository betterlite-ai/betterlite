kind: helper
name: auth-model-grant-intersection-layered-walk
call:
  # the auth check view: five lists, the user scope empty while a team answered, no org read
  model_grant_intersection:
    function: enforced
    database: true
    token: {models: [gpt-4o], team_id: t1, user_id: u1, project_id: p1, org_id: o1}
    team: {team_id: t1, models: [gpt-4o, tier-a], organization_id: o1}
    user: {user_id: u1, models: [user-model]}
    project: {project_id: p1, models: [proj-model]}
    membership: {user_id: u1, team_id: t1, allowed_models: [tier-a]}
calls:
  # the attribution view reuses the preloaded membership and reads the org
  - model_grant_intersection:
      function: collected
      database: true
      token: {models: [gpt-4o], team_id: t1, user_id: u1, project_id: p1, org_id: o1}
      models: [gpt-4o]
      membership_loaded: true
      team: {team_id: t1, models: [gpt-4o, tier-a], organization_id: o1}
      project: {project_id: p1, models: [proj-model]}
      membership: {user_id: u1, team_id: t1, allowed_models: [tier-a]}
      org: {organization_id: o1, models: [tier-b]}
      registry: [tier-a, tier-b]
      serving: {gpt-4o: [tier-a, tier-b]}
  # the stamped groups are what the spend writer reads back
  - model_grant_intersection:
      function: stamped
      database: true
      token: {models: [gpt-4o], team_id: t1, user_id: u1, project_id: p1, org_id: o1}
      models: [gpt-4o]
      stamp_before: [stale]
      membership_loaded: true
      team: {team_id: t1, models: [gpt-4o, tier-a], organization_id: o1}
      project: {project_id: p1, models: [proj-model]}
      membership: {user_id: u1, team_id: t1, allowed_models: [tier-a]}
      org: {organization_id: o1, models: [tier-b]}
      registry: [tier-a, tier-b]
      serving: {gpt-4o: [tier-a, tier-b]}
env: {}
compare: {ignore: []}
