kind: helper
name: auth-key-lookup-auth-key-cache-copy
call:
  auth_key_lookup:
    aspect: key_object
    hashed_token: sk-hashed-b
    cached:
      token: sk-hashed-b
      key_name: sk-ops
      user_id: u2
      team_id: t2
      team_alias: beta
      models: [claude-3]
      team_models: [gpt-4o]
      object_permission_id: op-beta
    reconnect: {answer: false}
calls:
  # a cold lookup reads the row and writes the cache copy once
  - auth_key_lookup:
      aspect: key_object
      hashed_token: sk-hashed-b
      rows:
        - kind: row
          fields:
            token: sk-hashed-b
            key_name: sk-ops
            user_id: u2
            team_id: t2
            team_alias: beta
            models: [claude-3]
            team_models: [gpt-4o]
      reconnect: {answer: false}
env: {}
compare: {ignore: []}
