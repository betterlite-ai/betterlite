name: auth-oauth-tokens-proxy-mapping-absent
config: |
  general_settings:
    master_key: oracle-master
    enable_oauth2_proxy_auth: true
    trusted_proxy_ranges: [127.0.0.0/8]
  model_list:
    - model_name: proxy-model
      litellm_params:
        model: openai/proxy-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    x-user-id: oauth-user
  body:
    model: proxy-model
    messages:
      - {role: user, content: Say hello.}
upstream: []
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore: []
