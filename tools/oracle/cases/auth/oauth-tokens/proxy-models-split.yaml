name: auth-oauth-tokens-proxy-models-split
config: |
  general_settings:
    master_key: oracle-master
    enable_oauth2_proxy_auth: true
    trusted_proxy_ranges: [127.0.0.0/8]
    oauth2_config_mappings:
      user_id: x-user-id
      models: x-models
  model_list:
    - model_name: proxy-model
      litellm_params:
        model: openai/proxy-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    x-user-id: oauth-user
    x-models: " proxy-model , other-model ,"
  body:
    model: proxy-model
    messages:
      - {role: user, content: Say hello.}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-oauth-models
      object: chat.completion
      created: 1700000032
      model: proxy-upstream
      choices: [{index: 0, message: {role: assistant, content: Hello!}, finish_reason: stop}]
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
