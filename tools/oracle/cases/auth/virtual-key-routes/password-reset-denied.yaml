name: virtual-key-routes-password-reset-not-required-reaches-upstream
config: |
  general_settings:
    master_key: oracle-master
  model_list:
    - model_name: reset-model
      litellm_params:
        model: openai/reset-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
  body:
    model: reset-model
    messages:
      - {role: user, content: Say hello.}
    stream: false
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-request-reset}
    body:
      id: chatcmpl-reset
      object: chat.completion
      created: 1700000000
      model: gpt-reset-upstream-2024
      system_fingerprint: fp_oracle
      service_tier: default
      choices:
        - index: 0
          message: {role: assistant, content: Hello!, refusal: null, annotations: []}
          logprobs: null
          finish_reason: stop
      usage:
        prompt_tokens: 5
        completion_tokens: 2
        total_tokens: 7
        prompt_tokens_details: {cached_tokens: 0, audio_tokens: 0}
        completion_tokens_details: {reasoning_tokens: 0, audio_tokens: 0, accepted_prediction_tokens: 0, rejected_prediction_tokens: 0}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
