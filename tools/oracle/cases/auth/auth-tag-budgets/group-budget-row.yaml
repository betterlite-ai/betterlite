name: auth-tag-budgets-group-budget-row
config: |
  model_list:
    - model_name: group-budget-model
      litellm_params:
        model: openai/group-budget-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
    x-litellm-call-id: oracle-call-tag-budgets-group
  body:
    model: group-budget-model
    messages:
      - {role: user, content: Say hello.}
    stream: false
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-request-group-budget}
    body:
      id: chatcmpl-group-budget
      object: chat.completion
      created: 1700000002
      model: gpt-group-budget-upstream-2024
      system_fingerprint: fp_oracle
      service_tier: default
      choices:
        - index: 0
          message: {role: assistant, content: Hello!, refusal: null, annotations: []}
          logprobs: null
          finish_reason: stop
      usage:
        prompt_tokens: 6
        completion_tokens: 2
        total_tokens: 8
        prompt_tokens_details: {cached_tokens: 0, audio_tokens: 0}
        completion_tokens_details: {reasoning_tokens: 0, audio_tokens: 0, accepted_prediction_tokens: 0, rejected_prediction_tokens: 0}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
