name: route-match-path-template
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: POST
  path: /v1/batches/example/cancel
  headers:
    Authorization: Bearer rejected-master
  body: null
upstream: []
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore:
    - pointer: /error/message
      why: betterlite and LiteLLM use different no database authentication messages
