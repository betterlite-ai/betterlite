name: auth-policy-support-token-team-provenance
config: |
  model_list:
    - model_name: policy-model-a
      litellm_params: {model: openai/policy-model-a-upstream}
    - model_name: policy-model-b
      litellm_params: {model: azure/policy-model-b-upstream}
env: {}
request:
