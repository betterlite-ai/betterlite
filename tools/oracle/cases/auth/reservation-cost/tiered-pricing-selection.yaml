kind: helper
name: reservation-cost-tiered-pricing-selection
call:
  b3001:
    function: max_cost
    request:
      model: tiered-model
      max_tokens: 1000
    route: /v1/chat/completions
    model_cost:
      tiered-model:
        mode: chat
        max_input_tokens: 1000000
        max_output_tokens: 1000
        tiered_pricing:
          - input_cost_per_token: 0.00000005
            output_cost_per_token: 0.0000004
            range: [0, 256000]
          - input_cost_per_token: 0.00000025
            output_cost_per_token: 0.000002
            range: [256000, 1000000]
    input_token_counts:
      tiered-model: 300000
    model_list: []
env: {}
compare: {ignore: []}
