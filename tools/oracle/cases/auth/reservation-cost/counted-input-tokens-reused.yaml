kind: helper
name: reservation-cost-counted-input-tokens-reused
call:
  b3001:
    function: max_cost
    request:
      model: flat-model
      max_tokens: 100
      messages:
        - role: user
          content: this prompt would tokenize to a different count
    route: /v1/chat/completions
    model_cost:
      flat-model:
        mode: chat
        max_input_tokens: 100000
        max_output_tokens: 1000
        input_cost_per_token: 0.000002
        output_cost_per_token: 0.00001
    input_token_counts:
      flat-model: 1000
    model_list: []
env: {}
compare: {ignore: []}
