kind: helper
name: reservation-cost-multiple-models-takes-max
call:
  b3001:
    function: max_cost
    request:
      model: [cheap-model, dear-model]
      max_tokens: 100
    route: /v1/chat/completions
    model_cost:
      cheap-model:
        mode: chat
        max_input_tokens: 1000
        max_output_tokens: 1000
        input_cost_per_token: 0.000001
        output_cost_per_token: 0.000002
      dear-model:
        mode: chat
        max_input_tokens: 1000
        max_output_tokens: 1000
        input_cost_per_token: 0.000004
        output_cost_per_token: 0.00001
    input_token_counts:
      cheap-model: 1000
      dear-model: 1000
    model_list: []
env: {}
compare: {ignore: []}
