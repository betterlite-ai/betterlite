kind: helper
name: reservation-cost-moderation-route-zero-output
call:
  b3001:
    function: max_cost
    request:
      model: moderation-model
    route: /v1/moderations
    model_cost:
      moderation-model:
        mode: moderation
        input_cost_per_token: 0.0000005
    input_token_counts:
      moderation-model: 1000
    model_list: []
env: {}
compare: {ignore: []}
