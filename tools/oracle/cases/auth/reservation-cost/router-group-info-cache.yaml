kind: helper
name: reservation-cost-router-group-info-cache
call:
  b3001:
    function: max_cost
    request:
      model: grouped
      max_tokens: 100
    route: /v1/chat/completions
    model_cost:
      flat-model:
        mode: chat
        max_input_tokens: 100000
        max_output_tokens: 1000
        input_cost_per_token: 0.000002
        output_cost_per_token: 0.00001
    input_token_counts:
      grouped: 1000
    model_list:
      - model_name: grouped
        backend_model: openai/flat-model
        model_info:
          id: dep-a
          mode: chat
          max_input_tokens: 100000
          max_output_tokens: 1000
          input_cost_per_token: 0.000004
          output_cost_per_token: 0.000012
env: {}
compare: {ignore: []}
