kind: helper
name: reservation-cost-output-multiplier-n
call:
  b3001:
    function: max_cost
    request:
      model: flat-model
      max_tokens: 10
      n: 3
    route: /v1/chat/completions
    model_cost:
      flat-model:
        mode: chat
        max_input_tokens: 100000
        max_output_tokens: 1000
        input_cost_per_token: 0.000002
        output_cost_per_token: 0.00001
    input_token_counts:
      flat-model: 100
    model_list: []
env: {}
compare: {ignore: []}
