kind: helper
name: reservation-cost-image-generation-cost
call:
  b3001:
    function: max_cost
    request:
      model: image-model
      n: 2
    route: /v1/images/generations
    model_cost:
      image-model:
        mode: image_generation
        input_cost_per_image: 0.0011
        output_cost_per_image: 0.134
    input_token_counts: null
    model_list: []
env: {}
compare: {ignore: []}
