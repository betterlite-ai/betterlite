kind: helper
name: reservation-cost-multimodal-vision-input-gate
call:
  b3001:
    function: max_cost
    request:
      model: vision-model
      max_tokens: 100
    route: /v1/chat/completions
    model_cost:
      vision-model:
        mode: chat
        max_input_tokens: 100000
        max_output_tokens: 1000
        input_cost_per_token: 0.000002
        output_cost_per_token: 0.00001
        input_cost_per_image: 0.0011
        output_cost_per_image: 0.00012
    input_token_counts:
      vision-model: 1000
    model_list: []
env: {}
compare: {ignore: []}
