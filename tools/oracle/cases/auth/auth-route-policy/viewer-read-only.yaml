name: auth-route-policy-viewer-read-only
config: |
  model_list:
    - {model_name: route-policy-model, litellm_params: {model: openai/route-policy-upstream}}
env: {}
request:
  method: GET
  path: /v1/models
  headers: {authorization: Bearer oracle-master}
  body: null
upstream: []
compare: {headers: [content-type], headers_present: [], upstream_headers: [], ignore: []}
