name: auth-route-policy-masked-denial
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: GET
  path: /v1/models
  headers: {x-api-key: rejected-key}
  body: null
upstream: []
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: []
  ignore: [{pointer: /error/message, why: betterlite writes its own authentication error message}]
