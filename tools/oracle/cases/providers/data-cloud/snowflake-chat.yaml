kind: helper
name: snowflake-chat
call:
  b8330:
    op: chat
    provider: snowflake
    model: claude-3-5-sonnet
    messages:
      - role: user
        content: hi
    api_base: "{{upstream}}/api/v2"
    api_key: pat/oracle-pat
    answer:
      status: 200
      body: '{"id":"msg-1","type":"message","role":"assistant","model":"claude-3-5-sonnet","content":[{"type":"text","text":"hi"}],"stop_reason":"end_turn","usage":{"input_tokens":1,"output_tokens":1}}'
compare:
  ignore: []
