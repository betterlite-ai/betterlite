name: proxy-custom-nested-proxy-chat
config: |
  model_list:
    - model_name: nested-proxy-model
      litellm_params:
        model: litellm_proxy/gemini/gemini-1.5-pro
        api_base: "{{upstream}}/proxy"
        api_key: oracle-proxy-key
  router_settings: {num_retries: 0}
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-nested-proxy}
  body:
    model: nested-proxy-model
    messages: [{role: user, content: hi}]
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-oracle-proxy
      object: chat.completion
      created: 1700000000
      model: gemini-1.5-pro-001
      choices:
        - index: 0
          message: {role: assistant, content: Hello!}
          finish_reason: stop
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: [content-type, x-litellm-call-id, x-litellm-model-group]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
