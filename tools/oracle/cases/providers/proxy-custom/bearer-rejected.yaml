name: proxy-custom-bearer-rejected
config: |
  model_list:
    - model_name: rejected-proxy-model
      litellm_params:
        model: litellm_proxy/gemini/gemini-1.5-pro
        api_base: "{{upstream}}/unauthorized"
        api_key: oracle-wrong-key
  router_settings: {num_retries: 0}
env: {}
request:
  method: POST
  path: /chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-rejected}
  body:
    model: rejected-proxy-model
    messages: [{role: user, content: hi}]
upstream:
  - status: 401
    headers: {content-type: application/json}
    body: {error: {message: "Incorrect API key provided", type: invalid_request_error, param: null, code: invalid_api_key}}
compare:
  headers: [content-type, x-litellm-call-id]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /error/message, why: betterlite writes its own message}
