name: proxy-custom-proxy-embedding
config: |
  model_list:
    - model_name: proxy-embedding-model
      litellm_params:
        model: litellm_proxy/text-embedding-3-small
        api_base: "{{upstream}}/embedding"
        api_key: oracle-embedding-key
  router_settings: {num_retries: 0}
env: {}
request:
  method: POST
  path: /embeddings
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-proxy-embedding}
  body:
    model: proxy-embedding-model
    input: ["hello"]
    encoding_format: none
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      object: list
      data: [{object: embedding, embedding: [0.1, 0.2], index: 0}]
      model: text-embedding-3-small
      usage: {prompt_tokens: 1, total_tokens: 1}
compare:
  headers: [content-type, x-litellm-call-id, x-litellm-model-group]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
