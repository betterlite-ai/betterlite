name: proxy-custom-upstream-failure
config: |
  model_list:
    - model_name: failing-proxy-model
      litellm_params:
        model: litellm_proxy/gemini/gemini-1.5-pro
        api_base: "{{upstream}}/failure"
        api_key: oracle-failing-key
  router_settings: {num_retries: 0}
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-call-failure}
  body:
    model: failing-proxy-model
    messages: [{role: user, content: hi}]
upstream:
  - status: 500
    headers: {content-type: application/json}
    body: {error: {message: "The server had an error", type: server_error, param: null, code: null}}
compare:
  headers: [content-type, x-litellm-call-id]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /error/message, why: betterlite writes its own message}
