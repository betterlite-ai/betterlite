kind: helper
name: sap-embedding
call:
  b8331:
    op: sap_embedding
    model: text-embedding-3-small
    input: hi
    env:
      AICORE_CLIENT_ID: client
      AICORE_CLIENT_SECRET: secret
      AICORE_AUTH_URL: "{{upstream}}/auth"
      AICORE_BASE_URL: "{{upstream}}/v2"
      AICORE_HOME: /nonexistent-b8331-home
    upstream:
      - status: 200
        body: '{"access_token":"oracle-token","expires_in":7200}'
      - status: 200
        body: '{"resources":[{"scenarioId":"orchestration","configurationId":"cfg","deploymentUrl":"https://dep.example.com","createdAt":"2024-06-01"}]}'
      - status: 200
        body: '{"executableId":"orchestration"}'
      - status: 200
        body: '{"final_result":{"object":"list","data":[{"object":"embedding","embedding":[0.1,0.2],"index":0}],"model":"text-embedding-3-small","usage":{"prompt_tokens":2,"total_tokens":2}}}'
env: {}
compare:
  ignore: []
