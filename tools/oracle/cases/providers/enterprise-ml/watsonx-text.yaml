kind: helper
name: watsonx-text
call:
  b8331:
    op: watsonx_text
    model: ibm-mistralai/granite-chat-13b
    messages: [{role: user, content: hi}]
    api_base: "{{upstream}}"
    api_key: oracle-wx-key
    temperature: 0.2
    max_tokens: 16
    env:
      WATSONX_IAM_URL: "{{upstream}}/identity/token"
      WATSONX_PROJECT_ID: project
    upstream:
      - status: 200
        body: '{"access_token":"iam-token","expires_in":3600}'
      - status: 200
        body: '{"model_id":"ibm-mistralai/granite-chat-13b","created_at":"2024-01-01T00:00:00Z","results":[{"generated_text":"hello","input_token_count":3,"generated_token_count":2,"stop_reason":"stop"}]}'
env: {}
compare:
  ignore: []
