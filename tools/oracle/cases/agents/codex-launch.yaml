        command: ["codex"]
        binary: /usr/local/bin/codex
        models:
          - {id: gpt-4o, mode: chat}
      - agent: codex
        scenario: hooks
        command: ["codex"]
        binary: /usr/local/bin/codex
        models:
          - {id: gpt-4o, mode: chat}
      - agent: codex
        scenario: skip
        command: ["codex", "--version"]
        binary: /usr/local/bin/codex
env: {}
