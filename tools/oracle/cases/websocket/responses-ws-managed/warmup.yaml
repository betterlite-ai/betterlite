kind: helper
name: warmup
call:
  responses_ws_managed:
    setup:
      model: openai/gpt-4o-mini
      litellm_metadata: null
      custom_llm_provider: null
      api_key: null
      api_base: null
      timeout: null
      first_message: null
      kwargs: {}
    frames:
    - '{"type": "response.create", "response": {"generate": false, "model": "gpt-4o-mini"}}'
    disconnect: connection closed
    scripts: []
    quota:
      kind: rate_limit
      message: quota exceeded
    sink:
      fails_at: null
      message: client send failed
env: {}
compare:
  ignore:
    - {pointer: /value/frames/0/response/id, why: the warmup response id is generated}
    - {pointer: /value/frames/0/response/created_at, why: the warmup timestamp is generated}
    - {pointer: /value/frames/1/response/id, why: the warmup response id is generated}
    - {pointer: /value/frames/1/response/created_at, why: the warmup timestamp is generated}
