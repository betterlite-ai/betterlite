kind: helper
name: stream-forwarding
call:
  responses_ws_managed:
    setup:
      model: openai/gpt-4o-mini
      litellm_metadata: null
      custom_llm_provider: null
      api_key: null
      api_base: null
      timeout: null
      first_message: null
      kwargs: {}
    frames:
    - '{"type": "response.create", "input": "hello"}'
    disconnect: connection closed
    scripts:
    - fail: null
      chunks:
      - kind: none
        value: null
        event_type: null
        dump: null
      - kind: json
        value: {type: response.created, response: {id: r-part}}
        event_type: null
        dump: null
      - kind: object
        value: null
        event_type: null
        dump: '{"type": "response.progress", "response": {"id": "r-progress"}}'
      - kind: broken
        value: null
        event_type: null
        dump: null
      - kind: json
        value: {type: response.completed, response: {id: r1, output: [{type: message, content: [{type: output_text, text: A}]}]}}
        event_type: null
        dump: null
      - kind: json
        value: {type: response.completed, response: {id: r2, output: [{type: message, content: [{type: output_text, text: B}]}]}}
        event_type: null
        dump: null
      raise_after: null
      raise_message: ''
    quota: null
    sink:
      fails_at: null
      message: client send failed
env: {}
compare:
  ignore:
    - pointer: /value/provider_calls/0/kwargs/litellm_metadata/llm_api_timing_windows
      why: "LiteLLM adds a wall-clock timing window to metadata; the managed provider call has no timing data"
