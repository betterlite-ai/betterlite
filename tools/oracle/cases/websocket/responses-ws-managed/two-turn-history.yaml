kind: helper
name: two-turn-history
call:
  websocket_oracle:
    service: managed_responses_turns
    input:
      setup:
        model: openai/gpt-4o-mini
        litellm_metadata: null
        custom_llm_provider: null
        api_key: null
        api_base: null
        timeout: null
        first_message: null
        kwargs: {}
      frames:
      - '{"type": "response.create", "input": "hello"}'
      - '{"type": "response.create", "input": "again", "previous_response_id": "r1"}'
      disconnect: connection closed
      scripts:
      - fail: null
        chunks:
        - kind: json
          value:
            type: response.completed
            response:
              id: r1
              output:
              - type: message
                content:
                - type: output_text
                  text: A
              usage:
                input_tokens: 0
                output_tokens: 0
                total_tokens: 0
                cost: 0.0
          event_type: null
          dump: null
        raise_after: null
        raise_message: ''
      - fail: null
        chunks:
        - kind: json
          value:
            type: response.completed
            response:
              id: r2
              output:
              - type: message
                content:
                - type: output_text
                  text: B
              usage:
                input_tokens: 0
                output_tokens: 0
                total_tokens: 0
                cost: 0.0
          event_type: null
          dump: null
        raise_after: null
        raise_message: ''
      quota: null
      sink:
        fails_at: null
        message: client send failed
env: {}
compare:
  ignore: []
