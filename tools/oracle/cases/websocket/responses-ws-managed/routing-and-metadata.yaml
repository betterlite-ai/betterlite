kind: helper
name: routing-and-metadata
call:
  responses_ws_managed:
    setup:
      model: openai/gpt-4o-mini
      litellm_metadata:
        model_group: router-model
      custom_llm_provider: openai
      api_key: key-1
      api_base: null
      timeout: 7.5
      first_message: null
      kwargs:
        stream: false
    frames:
    - '{"type": "response.create", "model": "router-model", "input": "hello", "store": true, "tools": [{"type": "function", "name": "lookup"}], "tool_choice": "auto", "instructions": "be brief", "metadata": {"k": "v"}}'
    disconnect: connection closed
    scripts:
    - fail: null
      chunks:
      - kind: json
        value: {type: response.completed, response: {id: r-route, output: [{type: message, content: [{type: output_text, text: A}]}]}}
        event_type: null
        dump: null
      raise_after: null
      raise_message: ''
    quota: null
    sink:
      fails_at: null
      message: client send failed
env: {}
compare:
  ignore:
    - pointer: /value/provider_calls/0/kwargs/litellm_metadata/llm_api_timing_windows
      why: "LiteLLM adds a wall-clock timing window to metadata; the managed provider call has no timing data"
