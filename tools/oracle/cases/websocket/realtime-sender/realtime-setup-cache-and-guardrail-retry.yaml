kind: helper
name: realtime-setup-cache-and-guardrail-retry
call:
  realtime_sender_websocket:
    model: openai/gpt-4o-realtime-preview
    force_transcription_model: null
    client_wants_beta: false
    backend_uses_beta_protocol: null
    provider:
      requires_session_configuration: true
      setup: []
      content: []
      transforms:
        - []
        - [{kind: text, text: '{"type": "session.update", "session": {"audio": {"input": {"turn_detection": {"type": "server_vad", "create_response": false}}}}}'}]
        - []
      fail_transform: false
    guardrails:
      - {custom: true, runs_for: [realtime_input_transcription]}
    backend_failures: []
    client_failures: []
    operations:
      - kind: disable
      - kind: disable
      - kind: disable
calls:
  - realtime_sender_websocket:
      model: openai/gpt-4o-realtime-preview
      force_transcription_model: null
      client_wants_beta: false
      backend_uses_beta_protocol: null
