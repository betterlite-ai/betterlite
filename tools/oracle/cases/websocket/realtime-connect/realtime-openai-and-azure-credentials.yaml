kind: helper
name: realtime-openai-and-azure-credentials
call:
  realtime_connect_websocket:
    scenarios:
      - model: azure/my-deployment
        params:
          user: u1
          user_api_key_dict: {key: k1}
          timeout: 9.0
        query_params: {model: alias, intent: transcription}
        settings:
          api_base: https://global.example
          api_key: sk-global
      - model: azure_ai/my-deployment
        params:
          api_base: https://named.example
          api_version: 2024-06-01
          realtime_protocol: beta
          timeout: 5.0
      - model: openai/gpt-realtime
        params:
          user: u2
        settings:
          openai_key: sk-openai-global
env: {}
compare: {ignore: []}
