kind: helper
name: realtime-vertex-credentials-and-refresh
call:
  realtime_connect_websocket:
    scenarios:
      - model: vertex_ai/gemini-live
        params:
          vertex_credentials: {client_email: svc@example}
          vertex_project: named-project
          vertex_location: ''
          timeout: 7.0
          user: u1
          user_api_key_dict: {key: k1}
        query_params: {model: alias}
        settings:
          vertex_project: global-project
          vertex_location: ai-location
        token:
          tokens: [token-a, token-b]
          projects: [resolved-project, refreshed-project]
      - model: vertex_ai/gemini-live
        params:
          generic_api_base: https://vertex-generic.example
        token:
          tokens: [token-c]
          projects: [resolved-project]
env: {}
compare: {ignore: []}
