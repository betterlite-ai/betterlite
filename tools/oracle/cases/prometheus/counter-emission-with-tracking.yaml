    function: inc_labeled_counter
    metric_name: litellm_requests_metric
    supported_labels: [model, end_user]
    metrics: {}
    steps: []
    enable_end_user_tracking: true
    max_series: 2
    ttl_seconds: null
    cleanup_interval_seconds: null
