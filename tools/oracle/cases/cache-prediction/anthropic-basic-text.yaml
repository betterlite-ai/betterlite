    body: {model: claude, max_tokens: 32, messages: [{role: user, content: [{type: text, text: a, cache_control: {type: ephemeral}}, {type: text, text: b, cache_control: {type: ephemeral}}, {type: text, text: c, cache_control: {type: ephemeral}}, {type: text, text: d, cache_control: {type: ephemeral}}, {type: text, text: e, cache_control: {type: ephemeral}}]}]}
env: {}
compare: {ignore: []}

