kind: helper
name: anthropic-automatic-cache
call:
  anthropic_cache_plan:
    function: cache_plan
    body: '{"model":"claude","max_tokens":32,"cache_control":{"type":"ephemeral","ttl":"1h"},"messages":[{"role":"user","content":[{"type":"text","text":"keep"},{"type":"text","text":"\u001c"}]}]}'
env: {}
compare: {ignore: []}
