kind: helper
name: retrieve-transport-error
call:
  b3365:
    operation: retrieve
    asynchronous: false
    container_id: cntr_1
    api_key: sk-test
    api_base: https://api.example/v1
    extra_headers: {}
    extra_query: {}
    reply:
      status: 200
      headers: {}
      body: '{"id":"cntr_1","object":"container","created_at":1740000000,"status":"running"}'
    failure: timeout
env: {}
compare:
  ignore:
    - pointer: /value/outcome/message
      why: "betterlite names its own transport failure, and LiteLLM's text is the httpx read-timeout message"
    - pointer: /value/outcome/synthesized
      why: "LiteLLM's container get_error_class raises before _handle_error marks the synthesized status, see docs/deviations/B3365.yaml"
