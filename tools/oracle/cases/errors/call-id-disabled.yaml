name: errors-call-id-disabled
config: |
  model_list:
    - model_name: error-model
      litellm_params: {model: openai/gpt-call-id, api_base: "{{upstream}}", api_key: oracle-key}
  router_settings: {num_retries: 0}
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: client-call-id}
  body: {model: error-model, messages: [{role: user, content: hi}]}
upstream:
  - status: 502
    headers: {content-type: application/json}
    body: {error: {message: "upstream failed", type: server_error, param: null, code: null}}
compare:
  headers: [content-type, llm_provider-content-type, x-litellm-call-id]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: [{pointer: /error/message, why: betterlite writes its own message}]
