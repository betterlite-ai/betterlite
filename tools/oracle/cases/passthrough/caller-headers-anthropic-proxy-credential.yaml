kind: helper
name: caller-headers-anthropic-proxy-credential
call:
  b3603:
    anthropic:
      headers:
        - ["Authorization", "Bearer caller-token"]
        - ["X-Api-Key", "caller-key"]
        - ["X-Goog-Api-Key", "goog-key"]
        - ["Accept-Encoding", "gzip"]
        - ["Host", "proxy"]
        - ["X-Custom", "v"]
      caller:
        stored_api_key: null
        jwt_claims: null
      settings:
        master_key: null
        custom_auth_configured: true
        auth_mode: []
        litellm_key_header_name: null
        endpoint_headers: []
      proxy_auth_header:
        - ["x-api-key", "proxy-key"]
        - ["anthropic-version", "2023-06-01"]
env: {}
compare:
  ignore: []
