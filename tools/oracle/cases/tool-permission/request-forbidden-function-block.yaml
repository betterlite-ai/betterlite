kind: helper
name: request-forbidden-function-block
call:
  b3812:
    rules:
      - {id: deny-bash, tool_name: Bash, decision: deny}
      - {id: allow-read, tool_name: Read, decision: allow}
      - {id: deny-write, tool_name: "Write.*", decision: deny}
