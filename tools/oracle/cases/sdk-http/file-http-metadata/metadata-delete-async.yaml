kind: sdk_http
name: file-http-metadata-delete-async
env: {}
call:
  file_http_metadata:
    operation: delete
    mode: async
    file_id: file_batch
    api_key: sk-xai
    timeout_seconds: 5
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_batch, deleted: true}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore: []
