kind: sdk_http
name: file-http-metadata-delete-status-error
env: {}
call:
  file_http_metadata:
    operation: delete
    mode: async
    file_id: file_batch
    api_key: sk-xai
    timeout_seconds: 5
upstream:
  - status: 500
    headers: {content-type: application/json}
    body: {error: {message: storage down}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - pointer: /file_http_metadata/value/failure/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
