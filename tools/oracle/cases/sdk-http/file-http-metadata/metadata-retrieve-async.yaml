kind: sdk_http
name: file-http-metadata-retrieve-async
env: {XAI_API_KEY: sk-env}
call:
  file_http_metadata:
    operation: retrieve
    mode: async
    file_id: file_batch
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: file_batch
      bytes: 12
      created_at: 1700000000
      filename: batch.jsonl
      purpose: batch
      expires_at: 1800000000
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore: []
