kind: sdk_http
name: rerank-local-and-hosted-credentials
env: {}
call:
  rerank_provider_plan:
    model: rerank-v1
    query: q
    documents: [a]
    custom_llm_provider: hosted_vllm
upstream: []
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore:
    - pointer: /rerank_provider_plan/value/failure/message
      why: >-
        LiteLLM prefixes the ValueError with the SDK exception name and a
        traceback, so only the message wording differs.
