kind: sdk_http
name: streaming-logging-identity
call:
  file_content_stream:
    steps:
      - function: afile_content
        file_id: file-openai
        custom_llm_provider: openai
        model: gpt-4o
        api_key: sk-id
        stream: true
        chunk_size: 5
        supplied_logging: true
      - function: afile_content
        file_id: file-vllm
        custom_llm_provider: hosted_vllm
        api_key: sk-id
        stream: true
        supplied_logging: true
      - function: file_content
        file_id: file-buffered
        custom_llm_provider: openai
        api_key: sk-id
        supplied_logging: true
      - function: afile_content
        file_id: file-azure
        custom_llm_provider: azure
        api_key: az-key
        api_version: "2024-10-21"
        stream: true
        supplied_logging: true
upstream:
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, api-key]
  ignore:
    - pointer: /file_content_stream/value/steps/0/identity/api_base
      why: each side logs its own mock server's generated port; streaming_logging_identity_writes_only_a_non_null_api_base checks exact values in native tests
    - pointer: /file_content_stream/value/steps/1/identity/api_base
      why: each side logs its own mock server's generated port; streaming_logging_identity_writes_only_a_non_null_api_base checks exact values in native tests
    - pointer: /file_content_stream/value/steps/0/streamed/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/1/streamed/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/2/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/3/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
