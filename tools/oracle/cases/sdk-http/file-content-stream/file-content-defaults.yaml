kind: sdk_http
name: file-content-defaults
call:
  file_content_stream:
    steps:
      - function: afile_content
        file_id: file-default
        api_key: sk-default
      - function: file_content
        file_id: file-sync
        custom_llm_provider: openai
        api_key: sk-sync
        timeout: "7"
        request_timeout: 5
      - function: file_content
        file_id: file-undecorated
        api_key: sk-ignored
upstream:
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - pointer: /file_content_stream/value/steps/0/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/1/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/2/failure/message
      why: Python's enum lookup text and betterlite's provider-name text differ
