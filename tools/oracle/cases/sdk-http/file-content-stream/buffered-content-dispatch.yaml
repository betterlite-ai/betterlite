kind: sdk_http
name: buffered-content-dispatch
call:
  file_content_stream:
    steps:
      - function: file_content
        file_id: file-openai
        custom_llm_provider: openai
        api_key: sk-openai
        extra_headers: {x-trace: t1}
        extra_body: {purpose: batch}
      - function: file_content
        file_id: file-vllm
        custom_llm_provider: hosted_vllm
        api_key: sk-vllm
      - function: file_content
        file_id: file-proxy
        custom_llm_provider: litellm_proxy
        api_key: sk-proxy
      - function: file_content
        file_id: file-azure
        custom_llm_provider: azure
        api_key: az-key
        api_version: "2024-10-21"
      - function: file_content
        file_id: file_ant
        custom_llm_provider: anthropic
        api_key: sk-ant
        extra_headers: {x-trace: t1}
        extra_body: {purpose: batch}
        client: http_handler
      - function: afile_content
        file_id: file_ant
        custom_llm_provider: anthropic
        api_key: sk-ant
      - function: file_content
        file_id: file-supplied
        custom_llm_provider: openai
        api_key: sk-ignored
        client: openai_sdk
      - function: file_content
        file_id: file-missing
        custom_llm_provider: openai
        api_key: sk-openai
        max_retries: 0
      - function: afile_content
        file_id: file-limited
        custom_llm_provider: openai
        api_key: sk-openai
        max_retries: 0
      - function: afile_content
        file_id: file-azure-ad
        custom_llm_provider: azure
        azure_ad_token: ad-content-token
        api_version: "2024-10-21"
upstream:
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
  - status: 404
    headers: {content-type: application/json}
    body:
      error: {message: missing, type: invalid_request_error, param: file_id, code: file_not_found}
  - status: 429
    headers: {content-type: application/json}
    body:
      error: {message: slow down, type: rate_limit_error, param: null, code: rate_limited}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, api-key, x-api-key, anthropic-version, anthropic-beta, x-trace, x-supplied-client]
  ignore:
    - pointer: /file_content_stream/value/steps/0/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/1/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/2/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/3/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/4/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/5/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/6/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
    - pointer: /file_content_stream/value/steps/7/failure/message
      why: the openai client prefixes the status and the body, betterlite prints betterlite's own message
    - pointer: /file_content_stream/value/steps/8/failure/message
      why: the openai client prefixes the status and the body, betterlite prints betterlite's own message
    - pointer: /file_content_stream/value/steps/9/buffered/headers/date
      why: each mock answer is stamped when it is served, so the date differs while answering nothing
