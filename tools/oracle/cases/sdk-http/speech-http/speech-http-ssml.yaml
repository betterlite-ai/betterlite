kind: sdk_http
name: sdk-http-speech-http-ssml
env: {}
call:
  speech_http:
    steps:
      - mode: sync
        input: hello
        supplied: async
        extra_headers: {x: caller}
        validated: {x: validated}
        transformed:
          ssml_body: "<speak>hello</speak>"
      - mode: async
        input: hello
        ssl_verify: false
        supplied: sync
        validated: {x: validated}
        transformed:
          ssml_body: "<speak>hello</speak>"
upstream:
  - status: 200
    headers: {x-request-id: speech_1}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: audio/wav}
  - status: 200
    headers: {x-request-id: speech_1}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: audio/wav}
compare:
  headers: []
  headers_present: []
  # betterlite sends text/plain for a raw body where httpx sends no content type; see docs/deviations/B2452.yaml
  upstream_headers: [content-length, x]
  ignore:
    - {pointer: /speech_http/value/steps/0/value/headers/date, why: each mock stamps its own date header}
    - {pointer: /speech_http/value/steps/1/value/headers/date, why: each mock stamps its own date header}
