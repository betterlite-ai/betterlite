kind: sdk_http
name: file-provider-write-write-timeout-coercion
env:
  OPENAI_API_KEY: sk-env
call:
  file_provider_write:
    steps:
      - create_file:
          file: {filename: a.jsonl, content_type: application/jsonl, content: "{}"}
          purpose: batch
          custom_llm_provider: openai
          params: {timeout: 0, request_timeout: 3}
      - create_file:
          file: {filename: a.jsonl, content_type: application/jsonl, content: "{}"}
          purpose: batch
          custom_llm_provider: openai
          params: {timeout: "2.5"}
      - acreate_file:
          file: {filename: a.jsonl, content_type: application/jsonl, content: "{}"}
          purpose: batch
          params: {timeout: {connect: 1, read: 5}}
      - create_file:
          file: {filename: notes.txt, content_type: text/plain, content: "hello"}
          purpose: messages
          custom_llm_provider: anthropic
          params: {api_key: sk-ant, timeout: {read: 5}}
      - create_file:
          file: {filename: a.jsonl, content_type: application/jsonl, content: "{}"}
          purpose: batch
          custom_llm_provider: openai
          params: {timeout: "soon"}
      - file_delete:
          file_id: file-abc
          params: {request_timeout: "soon"}
      - afile_delete:
          file_id: file-abc
          params: {timeout: 2, request_timeout: 3}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-abc, object: file, bytes: 2, created_at: 1700000000, filename: a.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-abc, object: file, bytes: 2, created_at: 1700000000, filename: a.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-abc, object: file, bytes: 2, created_at: 1700000000, filename: a.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body:
      id: file_011
      type: file
      filename: notes.txt
      mime_type: text/plain
      size_bytes: 5
      created_at: "2025-01-01T00:00:00Z"
      downloadable: false
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-abc, object: file, deleted: true}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, x-api-key]
  ignore:
    - {pointer: /upstream/0/body, why: a multipart boundary is random on each side so the captured body bytes never match}
    - {pointer: /upstream/1/body, why: a multipart boundary is random on each side so the captured body bytes never match}
    - {pointer: /upstream/2/body, why: a multipart boundary is random on each side so the captured body bytes never match}
    - {pointer: /upstream/3/body, why: a multipart boundary is random on each side so the captured body bytes never match}
