kind: sdk_http
name: image-edit-call-openai-upload
env: {}
call:
  image_edit_call:
    runs:
      - model: openai/gpt-image-1
        image: [abc, def]
        mask: ghi
        prompt: change
        n: 1
        quality: high
        size: 1024x1024
        response_format: b64_json
        user: u
        kwargs: {api_key: sk-test}
      - model: openai/gpt-image-1
        image: abc
        prompt: single
        kwargs: {api_key: sk-test}
      - recorded: true
        prompt: no image
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {created: 1, data: [{b64_json: YQ==}]}
  - status: 200
    headers: {content-type: application/json}
    body: {created: 2, data: [{url: https://example.com/a.png}]}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore: []
