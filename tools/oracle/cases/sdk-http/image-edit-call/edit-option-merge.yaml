kind: sdk_http
name: image-edit-call-option-merge
env: {}
call:
  image_edit_call:
    runs:
      - model: openai/gpt-image-1
        image: abc
        prompt: merge
        n: 1
        extra_headers: {x: new}
        extra_body: {settings: {strength: 2}, tags: [a, b]}
        extra_query: {ignored: "yes"}
        kwargs:
          api_key: sk-test
          headers: {x: old}
          settings: {strength: 1}
      - recorded: true
        model: gemini/gemini-2.5-flash-image
        image: abc
        prompt: json
        extra_headers: {x: new}
        extra_body: {settings: {strength: 2}, tags: [a, b]}
        kwargs:
          headers: {x: old}
          settings: {strength: 1}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {created: 1, data: [{b64_json: YQ==}]}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, x]
  ignore:
    - {pointer: /upstream/0/body, why: a multipart boundary is random on each side so the captured body bytes never match}
