kind: sdk_http
name: file-http-upload-plan-order
env: {}
call:
  file_http_upload:
    mode: sync
    headers: {accept: application/json}
    file: {filename: notes.txt, content_type: text/plain, content: "hello oracle"}
    plan:
      multipart:
        parts:
          - {name: file, filename: notes.txt, content_type: text/plain, content: "hello oracle"}
          - {name: purpose, content: batch}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-oracle, object: file, bytes: 12, filename: notes.txt, purpose: batch}
compare:
  headers: []
  headers_present: []
  upstream_headers: [content-type]
  ignore: []
