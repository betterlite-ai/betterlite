kind: sdk_http
name: file-http-upload-body-modes
env: {}
call:
  file_http_upload:
    mode: sync
    upload_method: put
    headers: {x-client-version: oracle}
    file: {filename: notes.txt, content: "hello oracle"}
    plan:
      presigned:
        method: put
        url: "{{upstream}}/presigned-target"
        headers: {content-type: text/plain, x-amz-meta-ticket: "7"}
        data: "hello oracle"
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-oracle, object: file, bytes: 12, filename: notes.txt, purpose: batch}
compare:
  headers: []
  headers_present: []
  upstream_headers: [content-type, x-amz-meta-ticket]
  ignore: []
