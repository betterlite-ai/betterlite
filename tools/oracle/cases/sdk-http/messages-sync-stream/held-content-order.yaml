kind: sdk_http
name: messages-sync-held-content-order
env: {}
call:
  messages_sync_stream:
    model: claude-sonnet-4-5
    messages:
      - {role: user, content: hi}
    api_key: sk-test
    timeout_seconds: 30
    runs:
      - initial:
          holding_chunk: {type: content_block_delta, index: 0, delta: {type: text_delta, text: H}}
          holding_stop_reason_chunk: {type: message_delta, delta: {stop_reason: end_turn}, usage: {input_tokens: 9, output_tokens: 3}}
        steps: [next, next, next, next, drain]
      - initial:
          holding_chunk: {type: content_block_delta, index: 0, delta: {type: text_delta, text: H}}
          queued_usage_chunk: true
        steps: [next, drain]
upstream:
  - status: 200
    headers: {content-type: text/event-stream}
    events: []
  - status: 200
    headers: {content-type: text/event-stream}
    events: []
compare: {headers: [], headers_present: [], upstream_headers: [], ignore: []}
