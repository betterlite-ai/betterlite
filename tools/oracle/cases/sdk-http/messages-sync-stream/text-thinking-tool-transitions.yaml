kind: sdk_http
name: messages-sync-text-thinking-tool-transitions
env: {}
call:
  messages_sync_stream:
    model: claude-sonnet-4-5
    messages:
      - {role: user, content: hi}
    api_key: sk-test
    timeout_seconds: 30
    runs:
      - steps: [next, next, next, next, next, next, next, next, next, next, next, next, next]
upstream:
  - status: 200
    headers: {content-type: text/event-stream}
    events:
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{"role":"assistant"},"finish_reason":null}]}'
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{"content":"A"},"finish_reason":null}]}'
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{"reasoning_content":"R"},"finish_reason":null}]}'
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{"tool_calls":[{"index":0,"id":"call_1","type":"function","function":{"name":"lookup","arguments":"{\"x\":1}"}}]},"finish_reason":null}]}'
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}'
compare: {headers: [], headers_present: [], upstream_headers: [], ignore: []}
