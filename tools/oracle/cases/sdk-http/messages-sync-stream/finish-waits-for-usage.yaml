kind: sdk_http
name: messages-sync-finish-waits-for-usage
env: {}
call:
  messages_sync_stream:
    model: claude-sonnet-4-5
    messages:
      - {role: user, content: hi}
    api_key: sk-test
    timeout_seconds: 30
    applied_edits:
      - {type: clear_tool_uses_20250919, cleared_tool_uses: 1}
    runs:
      - steps: [next, next, next, next, drain]
upstream:
  - status: 200
    headers: {content-type: text/event-stream}
    events:
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{"content":"A"},"finish_reason":null}]}'
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}'
      - '{"id":"chatcmpl-1","object":"chat.completion.chunk","created":0,"model":"claude-sonnet-4-5","choices":[],"usage":{"prompt_tokens":5,"completion_tokens":2,"total_tokens":7}}'
compare: {headers: [], headers_present: [], upstream_headers: [], ignore: []}
