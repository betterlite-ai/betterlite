kind: sdk_http
name: sdk-http-speech-chat-request
env: {}
call:
  speech_chat_bridge:
    model: gpt-4o-audio-preview
    input: hello
    voice: alloy
    optional_params: {temperature: 0, response_format: mp3, speed: 2}
    litellm_params: {}
    headers: {x: a}
    custom_llm_provider: openai
    api_key: sk-test
    timeout_seconds: 10
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chat_a
      object: chat.completion
      created: 1
      model: gpt-4o-audio-preview
      choices:
        - index: 0
          message:
            role: assistant
            content: null
            audio: {id: audio_1, data: YQ==, expires_at: 0, transcript: ""}
          finish_reason: stop
      usage: {prompt_tokens: 0, completion_tokens: 0, total_tokens: 0}
compare:
  headers: []
  headers_present: []
  # the bridge hands LiteLLM its caller headers; betterlite's chat pipeline has no per-call header seam
  upstream_headers: [authorization, content-type]
  ignore: []
