kind: sdk_http
name: sdk-http-gemini-pcm-and-wav
env: {}
call:
  speech_chat_bridge:
    model: gemini-2.5-flash-preview-tts
    input: hello
    voice: Kore
    optional_params: {response_format: wav}
    litellm_params: {}
    headers: {}
    custom_llm_provider: openai
    api_key: sk-test
    timeout_seconds: 10
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chat_a
      object: chat.completion
      created: 1
      model: gemini-2.5-flash-preview-tts
      choices:
        - index: 0
          message:
            role: assistant
            content: null
            audio: {id: audio_1, data: AAA=, expires_at: 0, transcript: ""}
          finish_reason: stop
      usage: {prompt_tokens: 0, completion_tokens: 0, total_tokens: 0}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
