      max_tokens: 2048
      messages:
        - {role: user, content: "run the tool"}
      model: claude-sonnet-4-20250514
      metadata: {user_id: u_9}
      stop_sequences: [END]
      stream: false
      system: sys
      temperature: 0.25
      thinking:
      tool_choice: {type: auto}
      tools:
        - {name: Bash, description: run, input_schema: {type: object, properties: {}}}
      top_k: 3
      top_p: 0.75
      api_key: sk-test
      custom_llm_provider: anthropic
