kind: sdk_http
name: messages-native-hook-named-overrides
env: {}
call:
  messages_native_execute:
    request:
      max_tokens: 4096
      messages:
        - {role: user, content: "hello"}
      model: claude-sonnet-4-20250514
      metadata: {user_id: u_1}
      stop_sequences: [ORIG]
      stream: false
      system: original system
      temperature:
      thinking: {type: enabled, budget_tokens: 1024}
      tool_choice: {type: auto}
      tools:
        - {name: Bash, description: run, input_schema: {type: object, properties: {}}}
      top_k: 5
      top_p: 0.9
      api_key: sk-test
      custom_llm_provider: anthropic
      kwargs: {}
    provider:
    hooks:
      - effect: mutate
        values:
          metadata: {user_id: u_2}
          stop_sequences: [HALT]
          stream: false
          system: hook system
          thinking: {type: enabled, budget_tokens: 2048}
          tool_choice: {type: none}
          tools: null
          top_k: 0
          top_p: 0.25
    searches: []
    interceptors: []
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: msg_03
      type: message
      role: assistant
      model: claude-sonnet-4-20250514
      content:
        - {type: text, text: ok}
      stop_reason: end_turn
      stop_sequence:
      usage: {input_tokens: 5, output_tokens: 2}
compare: {headers: [], headers_present: [], upstream_headers: [x-api-key, anthropic-version], ignore: []}
