kind: sdk_http
name: responses-followup-http
env: {}
call:
  responses_agentic_continuation:
    model: gpt-4o-mini
    input: hello
    params:
      stream: false
      temperature: 0.2
      tools: []
    kwargs:
      custom_llm_provider: openai
      _agentic_loop_depth: 0
      max_agentic_loops: 2
      _agentic_loop_fingerprints: []
    callbacks: []
    dynamic:
      - name: rerun-callback
        gate:
          run: true
          tools:
            tool_calls:
              - {id: call-ws, name: web_search}
        plan:
          run_agentic_loop: true
          request_patch:
            model: gpt-4o-mini
            messages:
              - {role: user, content: continue}
            tools: []
            optional_params:
              temperature: 0.2
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: resp_first, object: response, created_at: 1, status: completed, output: []}
  - status: 200
    headers: {content-type: application/json}
    body: {id: resp_next, object: response, created_at: 2, status: completed, output: []}
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore: []
