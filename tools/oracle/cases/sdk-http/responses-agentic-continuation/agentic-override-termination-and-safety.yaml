kind: sdk_http
name: agentic-override-termination-and-safety
env: {}
call:
  responses_agentic_continuation:
    model: gpt-4o-mini
    input: hello
    params: {}
    kwargs:
      custom_llm_provider: openai
      _agentic_loop_depth: 2
      max_agentic_loops: 2
      _agentic_loop_fingerprints: []
    callbacks: []
    dynamic:
      - name: refusing-callback
        gate:
          run: true
          tools:
            tool_calls:
              - {id: call-ws, name: web_search}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: resp_first, object: response, created_at: 1, status: completed, output: []}
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore: []
