kind: sdk_http
name: file-provider-read-list-purpose-without-client-cursor
env:
  OPENAI_API_KEY: sk-env
  ANTHROPIC_API_KEY: sk-ant-env
call:
  file_provider_read:
    steps:
      - function: file_list
        after: f
        limit: 1
        order: asc
      - function: file_list
        purpose: null
        after: f
        limit: 1
        order: asc
      - function: file_list
        purpose: ""
        after: f
        limit: 1
        order: asc
      - function: file_list
        purpose: batch
        after: f
        limit: 1
        order: asc
      - function: afile_list
        purpose: batch
        after: f
      - function: file_list
        custom_llm_provider: anthropic
        purpose: batch
        after: f
        limit: 1
        order: asc
      - function: afile_list
        custom_llm_provider: anthropic
      - function: file_list
        custom_llm_provider: azure
        api_key: az-key
        api_version: "2024-10-21"
        purpose: batch
        after: f
        limit: 1
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      object: list
      data:
        - {id: file-b, object: file, bytes: 2, created_at: 1700000002, filename: b.jsonl, purpose: batch, status: processed}
        - {id: file-a, object: file, bytes: 1, created_at: 1700000001, filename: a.jsonl, purpose: batch, status: processed}
        - {id: file-b, object: file, bytes: 2, created_at: 1700000002, filename: b.jsonl, purpose: batch, status: processed}
      has_more: false
      first_id: file-b
      last_id: file-b
  - status: 200
    headers: {content-type: application/json}
    body: {object: list, data: [], has_more: false}
  - status: 200
    headers: {content-type: application/json}
    body: {object: list, data: [], has_more: false}
  - status: 200
    headers: {content-type: application/json}
    body:
      object: list
      data:
        - {id: file-c, object: file, bytes: 3, created_at: 1700000003, filename: c.jsonl, purpose: batch, status: processed}
      has_more: true
  - status: 200
    headers: {content-type: application/json}
    body:
      object: list
      data:
        - {id: file-c, object: file, bytes: 3, created_at: 1700000003, filename: c.jsonl, purpose: batch, status: processed}
      has_more: false
  - status: 200
    headers: {content-type: application/json}
    body:
      data:
        - {id: file_b, type: file, filename: b.pdf, mime_type: application/pdf, size_bytes: 20, created_at: "2025-04-02T00:00:00Z", downloadable: false}
        - {id: file_a, type: file, filename: a.pdf, mime_type: application/pdf, size_bytes: 10, created_at: "2025-04-01T00:00:00Z", downloadable: false}
        - {id: file_b, type: file, filename: b.pdf, mime_type: application/pdf, size_bytes: 20, created_at: "2025-04-02T00:00:00Z", downloadable: false}
      has_more: false
      first_id: file_b
      last_id: file_b
  - status: 200
    headers: {content-type: application/json}
    body:
      data:
        - {id: file_a, type: file, filename: a.pdf, mime_type: application/pdf, size_bytes: 10, created_at: "2025-04-01T00:00:00Z", downloadable: false}
      has_more: false
  - status: 200
    headers: {content-type: application/json}
    body:
      object: list
      data:
        - {id: file-z, object: file, bytes: 9, created_at: 1700000009, filename: z.jsonl, purpose: batch, status: processed}
      has_more: false
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, api-key, x-api-key]
  ignore: []
