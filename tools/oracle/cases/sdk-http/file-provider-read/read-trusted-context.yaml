kind: sdk_http
name: file-provider-read-read-trusted-context
env:
  OPENAI_API_KEY: sk-env
  ANTHROPIC_API_KEY: sk-ant-env
  AZURE_API_KEY: az-env
  AZURE_API_VERSION: "2024-10-21"
call:
  file_provider_read:
    steps:
      - function: file_retrieve
        file_id: file-a
        client: openai_sdk
      - function: file_list
        client: openai_sdk
      - function: afile_retrieve
        file_id: file-a
        client: http_handler
      - function: file_retrieve
        file_id: file-a
        custom_llm_provider: azure
        client: openai_sdk
      - function: file_list
        custom_llm_provider: azure
        client: http_handler
      - function: file_retrieve
        file_id: file_ant
        custom_llm_provider: anthropic
        client: http_handler
      - function: file_retrieve
        file_id: file_ant
        custom_llm_provider: anthropic
        api_key: sk-ant-call
        client: openai_sdk
      - function: file_list
        custom_llm_provider: anthropic
        api_key: sk-ant-call
        client: http_handler
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 1, created_at: 1700000001, filename: a.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {object: list, data: [], has_more: false}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 2, created_at: 1700000002, filename: a.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 3, created_at: 1700000003, filename: azure.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {object: list, data: [], has_more: false}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_ant, type: file, filename: h.pdf, mime_type: application/pdf, size_bytes: 4, created_at: "2025-04-01T00:00:04Z", downloadable: false}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_ant, type: file, filename: k.pdf, mime_type: application/pdf, size_bytes: 5, created_at: "2025-04-01T00:00:05Z", downloadable: false}
  - status: 200
    headers: {content-type: application/json}
    body:
      data:
        - {id: file_ant, type: file, filename: k.pdf, mime_type: application/pdf, size_bytes: 6, created_at: "2025-04-01T00:00:06Z", downloadable: false}
      has_more: false
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, api-key, x-api-key, x-supplied-client]
  ignore: []
