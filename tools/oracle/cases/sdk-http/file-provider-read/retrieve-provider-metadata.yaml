kind: sdk_http
name: file-provider-read-retrieve-provider-metadata
env:
  OPENAI_API_KEY: sk-env
  ANTHROPIC_API_KEY: sk-ant-env
call:
  file_provider_read:
    steps:
      - function: file_retrieve
        file_id: file-a
      - function: afile_retrieve
        file_id: file-a
      - function: file_retrieve
        file_id: file-a
        custom_llm_provider: hosted_vllm
        extra_headers: {x-trace: t1}
        extra_body: {purpose: batch}
      - function: file_retrieve
        file_id: file-a
        custom_llm_provider: litellm_proxy
      - function: file_retrieve
        file_id: file-a
        custom_llm_provider: azure
        api_key: az-key
        api_version: "2024-10-21"
        extra_headers: {x-trace: t1}
      - function: afile_retrieve
        file_id: file-a
        custom_llm_provider: azure
        api_key: az-key
        api_version: "2024-10-21"
      - function: file_retrieve
        file_id: file_ant
        custom_llm_provider: anthropic
        api_key: sk-ant-call
        extra_headers: {x-trace: t1}
        extra_body: {purpose: batch}
      - function: afile_retrieve
        file_id: file_ant
        custom_llm_provider: anthropic
      - function: file_retrieve
        file_id: file-missing
      - function: afile_retrieve
        file_id: file-missing
        custom_llm_provider: azure
        api_key: az-key
        api_version: "2024-10-21"
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 12, created_at: 1700000000, filename: data.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 12, created_at: 1700000000, filename: data.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 13, created_at: 1700000001, filename: vllm.jsonl, purpose: assistants, status: uploaded}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 14, created_at: 1700000002, filename: proxy.jsonl, purpose: fine-tune, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 15, created_at: 1700000003, filename: azure.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 15, created_at: 1700000003, filename: azure.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_ant, type: file, filename: notes.pdf, mime_type: application/pdf, size_bytes: 2048, created_at: "2025-04-01T12:00:00Z", downloadable: false}
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_ant, type: file, filename: notes.pdf, mime_type: application/pdf, size_bytes: 2048, created_at: "2025-04-01T12:00:00.250Z", downloadable: false}
  - status: 404
    headers: {content-type: application/json}
    body:
      error: {message: missing, type: invalid_request_error, param: file_id, code: file_not_found}
  - status: 404
    headers: {content-type: application/json}
    body:
      error: {message: missing, type: invalid_request_error, param: file_id, code: file_not_found}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, api-key, x-api-key, anthropic-beta, x-trace]
  ignore:
    - pointer: /file_provider_read/value/steps/8/failure/message
      why: the openai client prefixes the status and the body repr, betterlite prints the body as JSON
    - pointer: /file_provider_read/value/steps/9/failure/message
      why: the openai client prefixes the status and the body repr, betterlite prints the body as JSON
