kind: sdk_http
name: responses-compact-transport-errors
env: {OPENAI_API_KEY: sk-provider}
call:
  responses_compact_transport:
    mode: async
    model: gpt-4o
    input: hello
upstream:
  - status: 429
    headers: {content-type: text/plain, retry-after: "3"}
    body: slow down
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - pointer: /responses_compact_transport/value/failure/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
