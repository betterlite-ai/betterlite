kind: sdk_http
name: transcription-native-selection
env: {}
call:
  transcription_call:
    mode: sync
    model: xai/whisper-1
    file: {filename: a.wav, content: abc}
    language: en
    api_key: sk-xai
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      text: Hello
      language: en
      duration: 1.5
      words:
        - {text: Hello, start: 0.0, end: 1.5}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /upstream/0/body, why: a multipart boundary is random on each side so the captured body bytes never match}
