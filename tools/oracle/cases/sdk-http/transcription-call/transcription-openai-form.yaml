kind: sdk_http
name: transcription-openai-form
env: {OPENAI_API_KEY: sk-env}
call:
  transcription_call:
    mode: sync
    model: openai/whisper-1
    file: {filename: a.wav, content: abc}
    language: en
    prompt: hint
    response_format: verbose_json
    timestamp_granularities: [word, segment]
    temperature: 0
    api_key: sk-call
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      text: Hello
      language: en
      duration: 1.0
      words:
        - {word: Hello, start: 0.0, end: 1.0}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /upstream/0/body, why: a multipart boundary is random on each side so the captured body bytes never match}
