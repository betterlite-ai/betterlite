kind: sdk_http
name: transcription-credential-precedence
env: {OPENAI_API_KEY: sk-env, OPENAI_ORGANIZATION: org-env}
call:
  transcription_call:
    mode: sync
    model: openai/whisper-1
    file: {filename: a.wav, content: abc}
    api_key: sk-call
    base_url: https://ignored.example/v1
upstream:
  - status: 400
    headers: {content-type: application/json}
    body: {error: {message: bad audio, type: invalid_request_error}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, openai-organization, content-type]
  ignore:
    - {pointer: /upstream/0/body, why: a multipart boundary is random on each side so the captured body bytes never match}
