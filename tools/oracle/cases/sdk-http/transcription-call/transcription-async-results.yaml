kind: sdk_http
name: transcription-async-results
env: {}
call:
  transcription_call:
    mode: async
    model: openai/whisper-1
    file: {filename: a.wav, content: abc}
    api_key: sk-async
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {text: Hello}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /upstream/0/body, why: a multipart boundary is random on each side so the captured body bytes never match}
