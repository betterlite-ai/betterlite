kind: sdk_http
name: vector-query-embedding-embedding-failure-boundaries
env: {OPENAI_API_KEY: sk-env}
call:
  vector_query_embedding:
    query_text: a b
    litellm_params:
      litellm_embedding_model: openai/text-embedding-3-small
      litellm_embedding_config: {dimensions: 2}
upstream:
  - status: 401
    headers: {content-type: application/json}
    body: {error: {message: Invalid API key, type: invalid_api_key, param: null, code: invalid_api_key}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - {pointer: /failure/message, why: LiteLLM prefixes its exception text and betterlite writes its own}
