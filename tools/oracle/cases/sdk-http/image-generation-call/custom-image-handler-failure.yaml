kind: sdk_http
name: image-generation-call-custom-image-handler-failure
env: {}
call:
  image_generation_call:
    prompt: cat
    model: custom-model
    custom_llm_provider: myprov
    custom_providers: [myprov]
    api_key: custom-key
upstream:
  - status: 429
    headers: {content-type: text/plain}
    body: slow down
compare:
  headers: []
  headers_present: []
  upstream_headers: [content-type]
  ignore:
    - pointer: /image_generation_call/value/failure/message
      why: >-
        LiteLLM prefixes the exception's own message with its class name, and
        each side words the rate limit differently
