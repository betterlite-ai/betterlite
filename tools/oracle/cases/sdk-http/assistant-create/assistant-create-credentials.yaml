kind: sdk_http
name: sdk-http-assistant-create-credentials
env:
  OPENAI_API_BASE: http://wrong.test/v1
  OPENAI_API_KEY: sk-env
  OPENAI_ORGANIZATION: org-env
call:
  assistant_create:
    provider: openai
    model: gpt-4o-mini
    entry: sync
    api_base: mock
    api_key: sk-request
    max_retries: 3
    timeout: 7.5
    request_timeout: 12
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: asst_a
      object: assistant
      model: gpt-4o-mini
      created_at: 1
      name: null
      tools: []
compare:
  headers: []
  headers_present: []
  upstream_headers:
    [authorization, openai-beta, openai-organization, content-type, accept]
  ignore: []
