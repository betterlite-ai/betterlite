kind: sdk_http
name: sdk-http-assistant-create-optional-values
env: {}
call:
  assistant_create:
    provider: openai
    model: gpt-4o-mini
    entry: sync
    api_key: sk-test
    name: ""
    description: ""
    instructions: ""
    tools: []
    tool_resources: {}
    metadata: {}
    temperature: 0
    top_p: 0
    response_format: {type: json_object}
    unknown_kwarg: dropped
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: asst_a
      object: assistant
      model: gpt-4o-mini
      created_at: 1
      name: null
      tools: []
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, openai-beta, content-type, accept]
  ignore: []
