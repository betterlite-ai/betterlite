kind: sdk_http
name: realtime-client-secret-sdk
call:
  realtime_http_calls:
    operation: client_secret
    model: anthropic/claude-3-5-sonnet-latest
    session:
      model: openai/gpt-4o-realtime-preview
      type: realtime
      instructions: be brief
      audio:
        input: {format: pcm16}
        vendor_extension: null
      vendor_extension: {flag: true}
    expires_after: {seconds: 60}
env:
  OPENAI_API_KEY: sk-env
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {value: ek_2, session: {id: sess_2}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - pointer: /realtime_http_calls/value/result/headers/date
      why: each side answers from its own mock, so a server-stamped date differs while answering nothing
    - pointer: /realtime_http_calls/value/logged/litellm_api_base
      why: each side answers from its own mock, so the resolved api_base the logger records differs
