kind: sdk_http
name: realtime-http-credentials
call:
  realtime_http_calls:
    operation: client_secret
    model: openai/gpt-4o-realtime-preview
    api_key: sk-raw
    session: {type: realtime, model: openai/gpt-4o-realtime-preview}
    settings: {api_key: sk-global, openai_key: sk-openai}
    extra_headers: {x-custom: "1"}
    api_version: "2024-10-01"
env:
  OPENAI_API_KEY: sk-env
upstream:
  - status: 201
    headers: {content-type: application/json}
    body: {value: ek_1, expires_at: 1700000000}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type, x-custom]
  ignore:
    - pointer: /realtime_http_calls/value/result/headers/date
      why: each side answers from its own mock, so a server-stamped date differs while answering nothing
    - pointer: /realtime_http_calls/value/logged/litellm_api_base
      why: each side answers from its own mock, so the resolved api_base the logger records differs
