kind: sdk_http
name: fine-tuning-create-unsupported-tuning-create
env: {}
call:
  fine_tuning_create:
    runs:
      - provider: anthropic
        model: claude-3-haiku
        training_file: file_train
      - provider: openai
        model: gpt-4o-mini
        training_file: file_train
        params: {api_key: sk-openai, max_retries: 0}
upstream:
  - status: 400
    headers: {content-type: application/json}
    body:
      error: {message: bad, type: invalid_request_error, param: training_file, code: invalid_file}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /fine_tuning_create/value/runs/1/failure/message, why: "LiteLLM's message is the SDK's \"Error code: 400 - {body}\" repr, which betterlite does not reproduce"}
