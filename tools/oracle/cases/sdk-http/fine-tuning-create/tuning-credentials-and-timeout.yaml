kind: sdk_http
name: fine-tuning-create-tuning-credentials-and-timeout
env:
  OPENAI_API_KEY: sk-openai-env
  OPENAI_ORGANIZATION: org-openai-env
  AZURE_API_VERSION: "2024-06-01"
  AZURE_OPENAI_API_KEY: ""
  AZURE_API_KEY: sk-azure-env
  VERTEXAI_LOCATION: europe-west4
call:
  fine_tuning_create:
    runs:
      - provider: openai
        model: gpt-4o-mini
        training_file: file_train
        params: {api_key: sk-openai-request, organization: org-openai-request, request_timeout: 7, max_retries: 0}
      - provider: openai
        model: gpt-4o-mini
        training_file: file_train
        params: {max_retries: 0}
      - provider: azure
        model: gpt-4o-mini
        training_file: file_train
        params: {api_key: sk-azure-request, api_version: "2024-10-01", max_retries: 0}
      - provider: azure
        model: gpt-4o-mini
        training_file: file_train
        params: {max_retries: 0}
      - provider: vertex_ai
        is_async: true
        model: gemini-1.5-pro
        training_file: gs://bucket/train.jsonl
        params: {vertex_project: mock-project-id, vertex_location: us-central1}
      - provider: vertex_ai
        is_async: true
        model: gemini-1.5-pro
        training_file: gs://bucket/train.jsonl
        params: {vertex_project: mock-project-id}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: ft_a
      object: fine_tuning.job
      created_at: 1720000000
      model: gpt-4o-mini
      status: queued
      training_file: file_train
      organization_id: org_a
      result_files: []
      seed: 3
      hyperparameters: {n_epochs: 3}
  - status: 200
    headers: {content-type: application/json}
    body:
      id: ft_a
      object: fine_tuning.job
      created_at: 1720000000
      model: gpt-4o-mini
      status: queued
      training_file: file_train
      organization_id: org_a
      result_files: []
      seed: 3
      hyperparameters: {n_epochs: 3}
  - status: 200
    headers: {content-type: application/json}
    body:
      id: ft_az
      object: fine_tuning.job
      created_at: 1720000100
      model: gpt-4o-mini
      status: queued
      training_file: file_train
      organization_id: org_az
      result_files: []
      seed: 7
      hyperparameters: {n_epochs: 2}
  - status: 200
    headers: {content-type: application/json}
    body:
      id: ft_az
      object: fine_tuning.job
      created_at: 1720000100
      model: gpt-4o-mini
      status: queued
      training_file: file_train
      organization_id: org_az
      result_files: []
      seed: 7
      hyperparameters: {n_epochs: 2}
  - status: 200
    headers: {content-type: application/json}
    body:
      name: projects/mock-project-id/locations/us-central1/tuningJobs/12345
      tunedModelDisplayName: custom
      baseModel: gemini-1.5-pro
      supervisedTuningSpec:
        trainingDatasetUri: gs://bucket/train.jsonl
        hyperParameters: {epoch_count: 2}
      state: JOB_STATE_PENDING
      createTime: "2024-01-01T00:00:00.000000Z"
  - status: 200
    headers: {content-type: application/json}
    body:
      name: projects/mock-project-id/locations/europe-west4/tuningJobs/12346
      tunedModelDisplayName: custom
      baseModel: gemini-1.5-pro
      supervisedTuningSpec:
        trainingDatasetUri: gs://bucket/train.jsonl
        hyperParameters: {epoch_count: 2}
      state: JOB_STATE_PENDING
      createTime: "2024-01-01T00:00:00.000000Z"
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, api-key, openai-organization, content-type]
  ignore:
    - {pointer: /upstream/4/headers/authorization, why: the mocked LiteLLM auth returns mock-gcs-token while the native credential seam returns vertex-test}
    - {pointer: /upstream/5/headers/authorization, why: the mocked LiteLLM auth returns mock-gcs-token while the native credential seam returns vertex-test}
