kind: sdk_http
name: fine-tuning-create-openai-tuning-body
env: {}
call:
  fine_tuning_create:
    runs:
      - provider: openai
        model: gpt-4o-mini
        training_file: file_train
        hyperparameters: null
        extra_headers: {X-Ignored: x}
        extra_body: {ignored: true}
        params: {api_key: sk-openai, max_retries: 0}
      - provider: openai
        is_async: true
        model: gpt-4o-mini
        training_file: file_train
        hyperparameters: {batch_size: auto, n_epochs: 3, learning_rate_multiplier: 0.5, extra_flag: x}
        suffix: ""
        validation_file: ""
        integrations: []
        seed: 0
        params: {api_key: sk-openai, max_retries: 0}
      - provider: openai
        model: gpt-4o-mini
        training_file: file_train
        hyperparameters: {n_epochs: null, batch_size: auto}
        params: {api_key: sk-openai, max_retries: 0}
