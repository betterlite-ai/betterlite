kind: sdk_http
name: async-rerank-awaits-one-result
env: {}
call:
  rerank_call:
    runs:
      - model: cohere/rerank-english-v3.0
        query: first
        documents: [a]
        kwargs:
          api_key: sk-one
          api_base: "{mock}"
      - model: cohere/rerank-english-v3.0
        query: second
        documents: [b]
        return_documents: false
        kwargs:
          api_key: sk-two
          api_base: "{mock}"
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: r1
      results:
        - index: 0
          relevance_score: 0.9
  - status: 200
    headers: {content-type: application/json}
    body:
      id: r2
      results:
        - index: 0
          relevance_score: 0.1
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, accept, content-type]
  ignore: []
