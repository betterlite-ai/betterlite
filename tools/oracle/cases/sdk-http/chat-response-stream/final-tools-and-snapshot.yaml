kind: sdk_http
name: sdk-http-chat-response-stream-final-tools-and-snapshot
env: {}
call:
  chat_response_stream:
    model: gpt-4o-mini
    messages:
      - {role: user, content: hi}
    api_key: sk-test
    timeout_seconds: 30
    request_input: hi
    runs:
      - {mode: sync, steps: [next, drain]}
      - {mode: async, steps: [next, drain]}
upstream:
  - status: 200
    headers: {content-type: text/event-stream}
    events:
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"tool_calls":[{"index":0,"id":"call_1","type":"function","function":{"name":"lookup","arguments":"{\"x\":1}"}}]},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{},"finish_reason":"tool_calls"}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[],"usage":{"prompt_tokens":8,"completion_tokens":2,"total_tokens":10,"cost":0.5,"completion_tokens_details":{"reasoning_tokens":0,"text_tokens":0}}}'
      - '[DONE]'
  - status: 200
    headers: {content-type: text/event-stream}
    events:
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"tool_calls":[{"index":0,"id":"call_1","type":"function","function":{"name":"lookup","arguments":"{\"x\":1}"}}]},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{},"finish_reason":"tool_calls"}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[],"usage":{"prompt_tokens":8,"completion_tokens":2,"total_tokens":10,"cost":0.5,"completion_tokens_details":{"reasoning_tokens":0,"text_tokens":0}}}'
      - '[DONE]'
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore: []
