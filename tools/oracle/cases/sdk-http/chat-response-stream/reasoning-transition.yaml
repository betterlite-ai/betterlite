kind: sdk_http
name: sdk-http-chat-response-stream-reasoning-transition
env: {}
call:
  chat_response_stream:
    model: gpt-4o-mini
    messages:
      - {role: user, content: hi}
    api_key: sk-test
    timeout_seconds: 30
    request_input: hi
    runs:
      - {mode: sync, steps: [drain]}
      - {mode: async, steps: [drain]}
upstream:
  - status: 200
    headers: {content-type: text/event-stream}
    events:
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"reasoning_content":"a"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"reasoning_content":"b"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"content":"hi"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[],"usage":{"prompt_tokens":8,"completion_tokens":2,"total_tokens":10,"cost":0.5,"completion_tokens_details":{"reasoning_tokens":1,"text_tokens":1}}}'
      - '[DONE]'
  - status: 200
    headers: {content-type: text/event-stream}
    events:
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"reasoning_content":"a"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"reasoning_content":"b"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"content":"hi"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[],"usage":{"prompt_tokens":8,"completion_tokens":2,"total_tokens":10,"cost":0.5,"completion_tokens_details":{"reasoning_tokens":1,"text_tokens":1}}}'
      - '[DONE]'
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore: []
