kind: sdk_http
name: vector-store-create-read-transport-create-read-failures
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_store_create_read_transport:
    operation: create
    mode: sync
upstream:
  - status: 429
    headers: {content-type: text/plain, retry-after: "3"}
    body: slow
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - pointer: /vector_store_create_read_transport/value/failure/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
