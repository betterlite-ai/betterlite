kind: sdk_http
name: vector-store-create-read-transport-retrieve-encoded-store
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_store_create_read_transport:
    operation: retrieve
    mode: sync
    vector_store_id: vs/a
    extra_body: {ignored: true}
    timeout_seconds: 7
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: vs_a, object: vector_store, name: notes}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type, openai-beta]
  ignore: []
