kind: sdk_http
name: responses-create-transport-agentic-depth-zero
env: {OPENAI_API_KEY: sk-provider}
call:
  responses_create_transport:
    mode: async
    model: gpt-4o
    input: hello
    litellm_params: {_websearch_interception_converted_stream: true, _agentic_loop_depth: 0}
    timeout_seconds: 7
    agentic: true
    agentic_result:
      id: resp_agentic
      created_at: 100
      object: response
      status: completed
      model: gpt-4o
      output: []
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: resp_initial
      created_at: 100
      object: response
      status: completed
      model: gpt-4o
      output: []
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
