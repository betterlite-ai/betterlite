kind: sdk_http
name: image-edit-http-json-and-unused-arguments
env: {}
call:
  image_edit_http:
    mode: async
    model: gpt-image-1
    prompt: change
    image:
      filename: a.png
      content: abc
      content_type: image/png
    api_key: key
    ssl_verify: false
    extra_body: {ignored: true}
    fake_stream: true
    litellm_metadata: {tag: t}
    multipart: false
    timeout_seconds: 5
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {created: 1, data: [{b64_json: YQ==}]}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - pointer: /image_edit_http/value/provider_headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
