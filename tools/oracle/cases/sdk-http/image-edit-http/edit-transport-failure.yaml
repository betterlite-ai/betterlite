kind: sdk_http
name: image-edit-http-transport-failure
env: {}
call:
  image_edit_http:
    mode: sync
    model: gpt-image-1
    prompt: change
    image:
      filename: a.png
      content: abc
      content_type: image/png
    api_key: key
    multipart: false
    timeout_seconds: 5
upstream:
  - status: 400
    headers: {content-type: text/plain, x-error: bad}
    body: bad image
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - pointer: /image_edit_http/value/failure/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
