kind: sdk_http
name: vector-search-transport-search-timeout-and-errors
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_search_transport:
    mode: sync
    vector_store_id: vs_a
    query: a
upstream:
  - status: 429
    headers: {content-type: text/plain, retry-after: "3"}
    body: slow
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - pointer: /vector_search_transport/value/failure/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
