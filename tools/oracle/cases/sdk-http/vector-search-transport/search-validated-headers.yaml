kind: sdk_http
name: vector-search-transport-search-validated-headers
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_search_transport:
    mode: sync
    vector_store_id: vs_a
    query: a
    extra_headers:
      Authorization: "Bearer sk-caller"
      Content-Type: text/plain
      OpenAI-Beta: assistants=v1
      X-Trace: t
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {object: vector_store.search_results.page, search_query: a, data: []}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type, openai-beta, x-trace]
  ignore: []
