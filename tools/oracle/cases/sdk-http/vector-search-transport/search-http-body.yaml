kind: sdk_http
name: vector-search-transport-search-http-body
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_search_transport:
    mode: sync
    vector_store_id: vs/a
    query: [alpha, beta]
    optional_params:
      filters: {type: eq, key: category, value: docs}
      max_num_results: 2
      ranking_options: {ranker: default-2024-11-15, score_threshold: 0.5}
      rewrite_query: false
    extra_body: {query: override, filters: {type: ne}}
    timeout_seconds: 7
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {object: vector_store.search_results.page, search_query: override, data: []}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
