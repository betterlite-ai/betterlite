kind: sdk_http
name: assistant-dispatch-config-environment
env:
  DISPATCH_KEY: sk-env
call:
  assistant_dispatch:
    runs:
      - operation: create_assistant
        payload:
          name: helper
          params: {api_base: $API_BASE}
        config:
          custom_llm_provider: openai
          litellm_params: {api_key: 'os.environ/DISPATCH_KEY', model: gpt-4o-mini}
        startup: true
      - operation: create_assistant
        provider: openai
        payload:
          model: gpt-4o
          params: {api_base: $API_BASE, api_key: request-key}
        config:
          custom_llm_provider: openai
          litellm_params: {api_key: 'os.environ/DISPATCH_KEY', model: gpt-4o-mini}
        startup: true
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: asst_a, object: assistant, created_at: 1, model: gpt-4o-mini, name: helper, tools: []}
  - status: 200
    headers: {content-type: application/json}
    body: {id: asst_a, object: assistant, created_at: 1, model: gpt-4o, name: helper, tools: []}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, openai-beta]
  ignore: []
