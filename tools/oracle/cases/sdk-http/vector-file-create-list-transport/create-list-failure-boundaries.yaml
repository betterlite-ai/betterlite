kind: sdk_http
name: vector-file-create-list-transport-create-list-failure-boundaries
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_file_create_list_transport:
    operation: create
    mode: async
    vector_store_id: vs_a
    create_request: {file_id: file_a}
upstream:
  - status: 429
    headers: {content-type: text/plain, retry-after: "3"}
    body: slow down
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - pointer: /vector_file_create_list_transport/value/failure/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
