kind: sdk_http
name: vector-file-create-list-transport-create-overlay-before-cleaning
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_file_create_list_transport:
    operation: create
    mode: sync
    vector_store_id: vs/a
    create_request: {file_id: old, attributes: {old: x, hidden_params: secret, count: 2}}
    extra_body: {file_id: file_a, attributes: {keep: y, count: 2, hidden_params: secret}, ignored: null, client_tag: ticket-7}
    timeout_seconds: 7
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_a, object: vector_store.file, status: completed}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore: []
