kind: sdk_http
name: image-variations-variation-timeout-and-async-shapes
env: {OPENAI_API_KEY: sk-env}
call:
  image_variations:
    image: {filename: a.png, content: abc, content_type: image/png}
    asynchronous: true
    litellm_params: {timeout_seconds: 3}
upstream:
  - status: 400
    headers: {content-type: application/json}
    body: {error: {message: no variation, type: invalid_request_error}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - {pointer: /image_variations/value/failure/message, why: LiteLLM prefixes its exception text and betterlite writes its own}
