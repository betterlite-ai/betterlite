kind: sdk_http
name: sdk-http-responses-chat-call-stream-dispatch
env: {}
call:
  responses_chat_call:
    mode: sync
    model: gpt-4o-mini
    request: {model: gpt-4o-mini, input: hi, stream: true}
    api_key: sk-test
    timeout_seconds: 10
upstream:
  - status: 200
    headers: {content-type: text/event-stream}
    events:
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"role":"assistant"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"content":"hi"},"finish_reason":null}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}'
      - '{"id":"chat_a","object":"chat.completion.chunk","created":0,"model":"gpt-4o-mini","choices":[],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2,"cost":0.5,"completion_tokens_details":{"reasoning_tokens":0,"text_tokens":1}}}'
      - '[DONE]'
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore: []
