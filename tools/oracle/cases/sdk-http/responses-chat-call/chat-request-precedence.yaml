kind: sdk_http
name: sdk-http-responses-chat-call-request-precedence
env: {}
call:
  responses_chat_call:
    mode: sync
    model: gpt-4o-mini
    request: {model: gpt-4o-mini, input: hello, max_output_tokens: 7}
    api_key: sk-test
    timeout_seconds: 10
    extra_headers: {x-client: probe}
    kwargs: {max_tokens: 3, _skip_responses_api_bridge: false}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chat_a
      created: 0
      object: chat.completion
      model: gpt-4o-mini
      choices:
        - index: 0
          message: {role: assistant, content: hi}
          finish_reason: stop
      usage: {prompt_tokens: 1, completion_tokens: 1, total_tokens: 2}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, x-client]
  ignore:
    - pointer: /responses_chat_call/value/response/output/0/id
      why: LiteLLM stamps the message item with a fresh uuid4 while betterlite feeds the pinned id source
