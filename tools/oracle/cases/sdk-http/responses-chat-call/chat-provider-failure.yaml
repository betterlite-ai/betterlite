kind: sdk_http
name: sdk-http-responses-chat-call-provider-failure
env: {}
call:
  responses_chat_call:
    mode: sync
    model: gpt-4o-mini
    request: {model: gpt-4o-mini, input: hello}
    api_key: sk-test
    timeout_seconds: 10
upstream:
  - status: 401
    headers: {content-type: application/json}
    body:
      error: {type: invalid_api_key, message: bad key, param: null, code: invalid_api_key}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization]
  ignore:
    - pointer: /responses_chat_call/value/failure/message
      why: B011 compares a provider error by class, status and the body-projected type/param/code, never by message text, and LiteLLM prefixes its own exception name onto the text
