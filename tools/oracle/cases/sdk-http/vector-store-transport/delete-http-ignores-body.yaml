kind: sdk_http
name: vector-store-transport-delete-http-ignores-body
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_store_transport:
    operation: delete
    mode: sync
    vector_store_id: vs_a
    extra_body: {ignored: true}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: vs_a, object: vector_store.deleted, deleted: true}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
