kind: sdk_http
name: file-http-content-decoded-content-headers
env: {MANUS_API_KEY: sk-manus}
call:
  file_http_content:
    mode: streaming
    file_id: f
    chunk_size: 4
upstream:
  - status: 200
    headers: {content-encoding: '', content-disposition: inline}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: application/octet-stream}
compare:
  headers: []
  headers_present: []
  upstream_headers: [api_key]
  ignore:
    - pointer: /file_http_content/value/result/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
