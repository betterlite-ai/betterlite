kind: sdk_http
name: decisions-send-invalid-provider-answer
env: {}
call:
  decisions_send:
    runs:
      - model: model-1
        questions: {first: {type: noul, instructions: "Is it true?"}}
        custom_llm_provider: typesafe
        api_key: sk-call
        api_base: "{mock}"
        kwargs: {state: "The order shipped on Tuesday."}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {model: model-1, answers: {first: {type: noul}}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - pointer: /decisions_send/value/runs/0/failure/message
      why: >-
        LiteLLM appends pydantic's validation detail and betterlite appends
        serde's, so the two messages name the same provider and class but
        describe the missing field differently.
