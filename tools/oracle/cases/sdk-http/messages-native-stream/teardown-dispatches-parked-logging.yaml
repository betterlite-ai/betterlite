kind: sdk_http
name: teardown-dispatches-parked-logging
env:
  ANTHROPIC_MESSAGES_STREAM_RELAY_QUEUE_MAXSIZE: "4"
  ANTHROPIC_MESSAGES_MAX_DETACHED_STREAM_DRAINS: "100"
call:
  messages_native_stream:
    body:
      model: claude-sonnet-4-20250514
      max_tokens: 1
      messages:
        - {role: user, content: hi}
    queue_maxsize: 4
    max_detached_stream_drains: 100
    steps:
      - {op: start, stream: a}
      - {op: arm, stream: a}
      - {op: release, stream: a, count: 2}
      - {op: read, stream: a}
      - {op: read, stream: a}
      - {op: finish, stream: a}
      - {op: wait, stream: a, until: parked}
      - {op: detach, stream: a}
      - {op: start, stream: b}
      - {op: release, stream: b, count: 1}
      - {op: read, stream: b}
      - {op: arm, stream: b}
      - {op: detach, stream: b}
      - {op: finish, stream: b}
      - {op: settle}
upstream:
  - status: 200
    headers:
      content-type: text/event-stream
    events:
      - '{"type": "content_block_delta", "delta": {"type": "text_delta", "text": "a"}}'
      - "\nevent: message_stop\ndata: {\"type\":\"message_stop\"}"
  - status: 200
    headers:
      content-type: text/event-stream
    events:
      - '{"type": "content_block_delta", "delta": {"type": "text_delta", "text": "b"}}'
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore: []
