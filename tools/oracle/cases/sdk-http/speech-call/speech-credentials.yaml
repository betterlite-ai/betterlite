kind: sdk_http
name: sdk-http-speech-call-credentials
env:
  OPENAI_BASE_URL: '$API_BASE'
  OPENAI_API_KEY: sk-env
  OPENAI_ORGANIZATION: org-env
  OPENAI_PROJECT: proj-env
call:
  speech_call:
    steps:
      - model: openai/tts-1
        voice: alloy
        api_base: '$API_BASE'
        api_key: sk-call
        organization: org-call
        project: proj-call
      - model: openai/tts-1
        voice: alloy
        api_base: ''
        api_key: ''
        organization: ''
        project: ''
      - model: openai/tts-1
        voice: alloy
      - model: openai/tts-1
        voice: alloy
        base_url: '$API_BASE'
        api_key: sk-call
upstream:
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: audio/wav}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: audio/wav}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: audio/wav}
  - status: 200
    headers: {}
    body: {body_kind: bytes, fixture: binary-response.bin, content_type: audio/wav}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, accept, content-type]
  ignore: []
