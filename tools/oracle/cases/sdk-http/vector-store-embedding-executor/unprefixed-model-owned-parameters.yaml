kind: sdk_http
name: vector-store-embedding-executor-unprefixed-model
env: {OPENAI_API_KEY: sk-env}
call:
  vector_store_embedding_executor:
    model: text-embedding-3-small
    query: hello
    configuration: {api_key: sk-direct, timeout: 20, organization: org, tags: [t], litellm_metadata: {team: a}, client_secret: s, input_type: null}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {object: list, data: [{object: embedding, index: 0, embedding: [0.25, 0.5]}], model: text-embedding-3-small, usage: {prompt_tokens: 1, total_tokens: 1}}
  - status: 200
    headers: {content-type: application/json}
    body: {object: list, data: [{object: embedding, index: 0, embedding: [0.25, 0.5]}], model: text-embedding-3-small, usage: {prompt_tokens: 1, total_tokens: 1}}
compare: {headers: [], headers_present: [], upstream_headers: [authorization], ignore: []}
