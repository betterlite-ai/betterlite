kind: sdk_http
name: run-raw-status-failure
env: {}
call:
  assistant_run:
    mode: run
    provider: openai
    thread_id: thread_a
    assistant_id: asst_a
    params: {api_key: 'sk-test'}
upstream:
  - status: 404
    headers: {content-type: application/json}
    body: {"error": {"message": "no such run", "type": "not_found_error", "param": "thread_id", "code": "run_missing"}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, openai-beta]
  ignore:
    - pointer: /assistant_run/value/failure/message
      why: 'the openai client formats the parsed error body as a Python dict repr, which no JSON error text reproduces'
