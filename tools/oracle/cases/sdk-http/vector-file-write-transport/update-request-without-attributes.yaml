kind: sdk_http
name: vector-file-write-transport-update-request-without-attributes
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_file_write_transport:
    operation: update
    mode: sync
    vector_store_id: vs_a
    file_id: file_a
    update_request: {}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_a, object: vector_store.file, attributes: {}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
