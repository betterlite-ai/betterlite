kind: sdk_http
name: vector-file-write-transport-update-body-before-transform
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_file_write_transport:
    operation: update
    mode: sync
    vector_store_id: vs/a
    file_id: file/b
    update_request: {attributes: {old: x}}
    extra_body: {attributes: {keep: "y", count: 2}, tag: null}
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_b, object: vector_store.file, attributes: {keep: "y"}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
