kind: sdk_http
name: vector-file-write-transport-file-write-header-order
env: {OPENAI_API_KEY: sk-p}
call:
  vector_file_write_transport:
    operation: update
    mode: sync
    vector_store_id: vs_a
    file_id: file_a
    update_request: {}
    extra_headers:
      Authorization: "Bearer sk-caller"
      Content-Type: text/plain
      OpenAI-Beta: assistants=v1
      X-Trace: t
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_a, object: vector_store.file, attributes: {keep: "y"}}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type, openai-beta, x-trace]
  ignore: []
