kind: sdk_http
name: vector-file-read-transport-read-header-mutation
env: {OPENAI_API_KEY: sk-provider}
call:
  vector_file_read_transport:
    mode: sync
    vector_store_id: vs_a
    file_id: file_b
    operations: [retrieve, content]
    extra_headers:
      Authorization: Bearer caller
      Content-Type: text/plain
      OpenAI-Beta: assistants=v1
      X-Trace: t
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file_b, object: vector_store.file, status: completed}
  - status: 200
    headers: {content-type: application/json}
    body: {file_id: file_b, filename: b, content: [{type: text, text: hello}]}
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type, openai-beta, x-trace]
