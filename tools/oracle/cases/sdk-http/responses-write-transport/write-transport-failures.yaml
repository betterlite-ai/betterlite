kind: sdk_http
name: responses-write-transport-write-transport-failures
env: {OPENAI_API_KEY: sk-provider}
call:
  responses_write_transport:
    operation: delete
    mode: async
    response_id: resp_a
upstream:
  - status: 429
    headers: {content-type: text/plain, retry-after: "3"}
    body: slow down
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore:
    - pointer: /responses_write_transport/value/failure/headers/date
      why: each side answers from its own mock, so a server-stamped date would differ while answering nothing
