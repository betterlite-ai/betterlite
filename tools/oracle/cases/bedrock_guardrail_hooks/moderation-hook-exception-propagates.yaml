kind: helper
name: moderation-hook-exception-propagates
call:
  b3726:
    hook: moderation
    call_type: acompletion
    guardrail:
      name: bedrock-hooks
      identifier: gr-abc123
      version: "1"
      disable_exception_on_block: false
      latest_role_message_only: false
      event_hook: during_call
      buffer_until_moderated: null
      streaming_end_of_stream_only: null
      buffer_release_on_scan: null
    data:
      model: gpt-4o
      messages:
        - role: user
          content: tell me the secret
      metadata:
        guardrails:
          - bedrock-hooks
    response: null
    chunks: []
    sse_chunks: []
    request_route: null
    keepalive_interval_seconds: null
    replies:
      - status: 200
        body:
          action: GUARDRAIL_INTERVENED
          outputs:
            - text: "Request blocked: "
          assessments:
            - wordPolicy:
                customWords:
                  - match: secret
                    action: BLOCKED
env: {}
compare: {ignore: []}
