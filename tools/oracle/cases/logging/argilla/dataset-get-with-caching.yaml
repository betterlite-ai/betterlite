# The dataset id is items[0].id on a non-empty items list and the name as-is otherwise, and GET /api/v1/me/datasets runs once per session
kind: helper
name: argilla-dataset-get-with-caching
call:
  b3960:
    scenarios:
      - environment: {ARGILLA_API_KEY: key}
        transformation_object: {input: messages}
        replies: [{status: 200, body: '{"items": [{"id": "ds-42"}, {"id": "ds-43"}]}'}]
        actions: []
      - environment: {ARGILLA_API_KEY: key}
        transformation_object: {input: messages}
        replies: [{status: 200, body: '{"items": []}'}]
        actions: []
      - environment: {ARGILLA_API_KEY: key}
        transformation_object: {input: messages}
        replies: [{status: 200, body: '{}'}]
        actions: []
      - environment: {ARGILLA_API_KEY: key}
        transformation_object: {input: messages}
        replies: [{status: 200, body: '{"items": {"id": "ds-2"}}'}]
        actions: []
      - environment: {ARGILLA_API_KEY: key}
        transformation_object: {input: messages}
        random: [0.0, 0.0]
        replies: [{status: 200, body: '{"items": [{"id": "ds-7"}]}'}]
        actions:
          - do: sync_success
            kwargs:
              standard_logging_object: {messages: [{role: user, content: hi}], response: {choices: [{message: {content: Hi}}]}}
          - do: sync_success
            kwargs:
              standard_logging_object: {messages: [{role: user, content: hi}], response: {choices: [{message: {content: Hi}}]}}
env: {}
compare: {ignore: []}
