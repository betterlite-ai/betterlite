# log_success_event samples with LANGSMITH_SAMPLING_RATE through the digit-only parser and falls back to 1.0 for "0.5"
kind: helper
name: argilla-sync-sampling-with-langsmith-rate
call:
  b3960:
    scenarios:
      - environment: {ARGILLA_API_KEY: key, LANGSMITH_SAMPLING_RATE: "0"}
        transformation_object: {input: messages}
        random: [0.5, 0.0]
        replies: [{status: 200, body: '{"items": [{"id": "ds-1"}]}'}]
        actions:
          - do: sync_success
            kwargs: {standard_logging_object: {messages: [{role: user, content: hi}], response: {choices: [{message: {content: Hi}}]}}}
          - do: sync_success
            kwargs: {standard_logging_object: {messages: [{role: user, content: hi}], response: {choices: [{message: {content: Hi}}]}}}
      - environment: {ARGILLA_API_KEY: key, LANGSMITH_SAMPLING_RATE: "0.5"}
        transformation_object: {input: messages}
        random: [0.9]
        replies: [{status: 200, body: '{"items": [{"id": "ds-1"}]}'}]
        actions:
          - do: sync_success
            kwargs: {standard_logging_object: {messages: [{role: user, content: hi}], response: {choices: [{message: {content: Hi}}]}}}
      - environment: {ARGILLA_API_KEY: key, ARGILLA_SAMPLING_RATE: "0"}
        transformation_object: {input: messages}
        random: [0.9]
        replies: [{status: 200, body: '{"items": [{"id": "ds-1"}]}'}]
        actions:
          - do: sync_success
            kwargs: {standard_logging_object: {messages: [{role: user, content: hi}], response: {choices: [{message: {content: Hi}}]}}}
env: {}
compare: {ignore: []}
