# greenscale UTC ISO 8601 timestamp in YYYY-MM-DDTHH:MM:SSZ form and invocation latency in milliseconds
kind: helper
name: greenscale-timestamp-utc
call:
  b3961:
    function: log
    scenarios:
      - logger: greenscale
        environment: {GREENSCALE_API_KEY: green-key, GREENSCALE_ENDPOINT: "https://greenscale.example.com/v1/log"}
        kwargs: {model: gpt-4o, litellm_params: {metadata: {}}}
        response:
          id: chatcmpl-1
          created: 1700000000
          model: gpt-4o
          object: chat.completion
          system_fingerprint: null
          choices:
            - finish_reason: stop
              index: 0
              message: {content: hi, role: assistant, tool_calls: null, function_call: null}
          usage:
            completion_tokens: 2
            prompt_tokens: 3
            total_tokens: 5
            completion_tokens_details: null
            prompt_tokens_details: null
        now: "2026-01-02T03:04:05Z"
        start_time: "2026-01-02T03:00:00Z"
        end_time: "2026-01-02T03:00:01.250000Z"
        answers: []
env: {}
compare: {ignore: []}
