          - {status: 200, body: {}}
      - path: async
        start_time: "2023-11-14T22:13:20+00:00"
        end_time: "2023-11-14T22:13:21.500000+00:00"
        environment: {BRAINTRUST_API_KEY: braintrust-key}
        api_base: "http://braintrust.test/v1"
        metadata: {}
        answers:
          - {status: 200, body: {id: async-default}}
          - {status: 200, body: {}}
env: {}
compare: {ignore: []}
