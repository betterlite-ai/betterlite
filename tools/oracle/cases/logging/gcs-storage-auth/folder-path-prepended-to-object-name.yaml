# a bucket with a folder path moves the folder in front of the object name
kind: helper
name: gcs-storage-auth-folder-path-prepended-to-object-name
call:
  b3997: {"action": "upload", "bucket": "my-bucket/my-folder/dev", "object_name": "my-object", "payload": "text", "body": "{\"name\": \"obj\", \"bucket\": \"env-bucket\", \"size\": \"12\"}"}
env: {}
compare: {ignore: []}
