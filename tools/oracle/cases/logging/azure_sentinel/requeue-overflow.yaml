# requeue puts the undelivered records ahead of new arrivals and drops the oldest ones past max_queue_size, with one overflow warning per queue
kind: helper
name: azure-sentinel-requeue-overflow
call:
  b4002:
    scenarios:
      - init: {dcr_immutable_id: dcr-1, endpoint: "https://dce.example.test", tenant_id: tenant-1, client_id: client-1, client_secret: secret-1}
        batch_size: 3
        max_queue_size: 4
        replies:
          - {status: 200, body: '{"access_token": "tok-1", "expires_in": 3600}'}
          - {status: 503, body: down, arrive: {model: [d, e]}}
          - {status: 200}
          - {status: 200}
        actions:
          - {do: model, ids: [a, b, c]}
          - {do: flush}
      - init: {dcr_immutable_id: dcr-1, endpoint: "https://dce.example.test", tenant_id: tenant-1, client_id: client-1, client_secret: secret-1}
        batch_size: 3
        max_queue_size: 10
        replies:
          - {status: 200, body: '{"access_token": "tok-1", "expires_in": 3600}'}
          - {status: 503, body: down, arrive: {model: [d]}}
        actions:
          - {do: model, ids: [a, b, c]}
      - init: {dcr_immutable_id: dcr-1, endpoint: "https://dce.example.test", tenant_id: tenant-1, client_id: client-1, client_secret: secret-1}
        batch_size: 3
        max_queue_size: 5
        replies:
          - {status: 200, body: '{"access_token": "tok-1", "expires_in": 3600}'}
          - {status: 503, body: down, arrive: {model: [d, e]}}
        actions:
          - {do: model, ids: [a, b, c]}
      - init: {dcr_immutable_id: dcr-1, endpoint: "https://dce.example.test", tenant_id: tenant-1, client_id: client-1, client_secret: secret-1}
        batch_size: 3
        max_queue_size: 5
        replies:
          - {status: 200, body: '{"access_token": "tok-1", "expires_in": 3600}'}
          - {status: 503, body: down, arrive: {model: [d, e, f]}}
        actions:
          - {do: model, ids: [a, b, c]}
      - init: {dcr_immutable_id: dcr-1, endpoint: "https://dce.example.test", tenant_id: tenant-1, client_id: client-1, client_secret: secret-1}
        batch_size: 3
        max_queue_size: 3
        replies:
          - {status: 200, body: '{"access_token": "tok-1", "expires_in": 3600}'}
          - {status: 503, body: down, arrive: {model: [d, e]}}
        actions:
          - {do: model, ids: [a, b, c]}
      - init: {dcr_immutable_id: dcr-1, endpoint: "https://dce.example.test", tenant_id: tenant-1, client_id: client-1, client_secret: secret-1}
        batch_size: 2
        max_queue_size: 3
        replies:
          - {status: 200, body: '{"access_token": "tok-1", "expires_in": 3600}'}
          - {status: 503, body: down, arrive: {audit: [z, w]}}
        actions:
          - {do: model, ids: [a]}
          - {do: audit, ids: [x, z]}
      - init: {dcr_immutable_id: dcr-1, endpoint: "https://dce.example.test", tenant_id: tenant-1, client_id: client-1, client_secret: secret-1}
        batch_size: 3
        max_queue_size: 4
        replies:
          - {status: 200, body: '{"access_token": "tok-1", "expires_in": 3600}'}
          - {status: 200, arrive: {model: [d]}}
        actions:
          - {do: model, ids: [a, b, c]}
env: {}
compare: {ignore: []}
