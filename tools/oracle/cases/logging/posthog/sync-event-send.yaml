    operation: sync_send
    settings: {api_key: phk-test, api_url: "https://eu.i.posthog.com/", mock: false}
    metadata: {}
    events:
      - payload: {"id": "span-1", "trace_id": "trace-1", "session_id": "session-1", "call_type": "completion", "response_cost": 0.5, "status": "success", "status_fields": {"llm_api_status": "success", "guardrail_status": "not_run"}, "custom_llm_provider": "openai", "total_tokens": 15, "prompt_tokens": 10, "completion_tokens": 5, "startTime": 1700000000, "endTime": 1700000001, "completionStartTime": 1700000000.5, "response_time": 1, "model_map_information": {}, "model": "gpt-4o", "api_base": "https://api.openai.com", "metadata": {}, "saved_cache_cost": 0, "request_tags": [], "model_parameters": {}, "hidden_params": {}, "messages": [{"role": "user", "content": "hi"}], "response": {"choices": []}}
      - payload: {"id": "span-2", "trace_id": "trace-2", "session_id": "session-1", "call_type": "completion", "response_cost": 0.5, "status": "success", "status_fields": {"llm_api_status": "success", "guardrail_status": "not_run"}, "custom_llm_provider": "openai", "total_tokens": 15, "prompt_tokens": 10, "completion_tokens": 5, "startTime": 1700000000, "endTime": 1700000001, "completionStartTime": 1700000000.5, "response_time": 1, "model_map_information": {}, "model": "gpt-4o", "api_base": "https://api.openai.com", "metadata": {}, "saved_cache_cost": 0, "request_tags": [], "model_parameters": {}, "hidden_params": {}, "messages": [{"role": "user", "content": "hi"}], "response": {"choices": []}}
        dynamic_params: {posthog_api_key: request-key, posthog_api_url: "https://request.example///"}
