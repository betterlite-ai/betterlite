{
  "kind": "helper",
  "name": "token-exchange-rfc8693-with-audience",
  "call": {
    "b4665": {
      "config": {
        "token_exchange_endpoint": "https://idp.example.com/token",
        "client_id": "cid",
        "client_secret": "csec",
        "audience": "https://up.example.com",
        "scopes": [
          "s1",
          "s2"
        ]
      },
      "steps": [
        {
          "op": "exchange",
          "subject_token": "caller-jwt",
          "now_ms": 1000000,
          "responses": [
            {
              "kind": "body",
              "body": {
                "access_token": "exchanged",
                "expires_in": 120
              }
            }
          ]
        }
      ]
    }
  },
  "env": {},
  "compare": {
    "ignore": []
  }
}
