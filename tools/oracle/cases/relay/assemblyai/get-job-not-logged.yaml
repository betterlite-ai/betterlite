kind: helper
name: relay-assemblyai-get-job-not-logged
call:
  b3647:
    calls:
      - method: GET
        url_route: "https://api.assemblyai.com/v2/transcript/t1"
        response_body: {id: t1, status: completed, audio_duration: 12.5}
        transcripts:
          - {status: 200, body: {id: t1, status: completed, audio_duration: 12.5}}
        catalog:
          assemblyai/best: {litellm_provider: assemblyai, input_cost_per_second: 0.00003333}
          assemblyai/nano: {litellm_provider: assemblyai, input_cost_per_second: 0.00010278}
        api_key: secret-key
        polling_interval_seconds: 0
        max_polling_attempts: 3
env: {}
compare: {ignore: []}
