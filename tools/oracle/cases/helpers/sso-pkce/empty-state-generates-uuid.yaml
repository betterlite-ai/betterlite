kind: helper
name: sso-pkce-empty-state-generates-uuid
call:
  sso_pkce:
    state: null
    environment:
      GENERIC_CLIENT_STATE: ""
env: {}
compare:
  ignore:
    - pointer: /value/state
      why: Both sides draw their own UUID, so the generated bytes differ while the native test asserts the 32-character hex format.
