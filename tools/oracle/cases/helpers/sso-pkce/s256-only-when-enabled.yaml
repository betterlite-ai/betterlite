kind: helper
name: sso-pkce-s256-only-when-enabled
call:
  sso_pkce:
    state: callback-state
    environment:
      GENERIC_CLIENT_STATE: ignored-state
      GENERIC_CLIENT_USE_PKCE: "true"
env: {}
compare:
  ignore:
    - pointer: /value/code_challenge
      why: The verifier is random on both sides, so the S256 challenge bytes differ while the native test asserts the S256 derivation.
