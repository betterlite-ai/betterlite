kind: helper
name: discovery_identifiers
call:
  tool_row:
    rows:
      - {"tool_id":"t1","tool_name":"owned","origin":"user_defined","key_hash":"k1","team_id":"team-1","key_alias":"alias-1","user_agent":"agent/1","assignments":{"scope":"read"},"created_at":"2026-01-02T03:04:05","last_used_at":"2026-01-03T04:05:06","created_by":"creator","updated_by":"updater"}
