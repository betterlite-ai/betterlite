      - {"tool_id":"t3","tool_name":"alias-less","key_hash":"k2"}
      - {"tool_id":"t4","tool_name":"missing-owner","key_hash":"k3"}
      - {"tool_id":"t5","tool_name":"null-owner","key_hash":"k4"}
      - {"tool_id":"t6","tool_name":"no-key","key_hash":null}
