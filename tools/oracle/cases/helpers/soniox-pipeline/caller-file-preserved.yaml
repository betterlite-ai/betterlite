kind: helper
name: soniox-pipeline-caller-file-preserved
call:
  soniox_pipeline:
    model: soniox/stt-async-v4
    timeout_millis: 2500
    api_key: sk-local
    api_base: https://api.soniox.test
    optional_params:
      file_id: caller-file
    audio:
      filename: audio.mp3
      content: RIFF-data
    answers:
    - status: 200
      body: '{"id": "tr_1"}'
    - status: 200
      body: '{"status": "completed", "audio_duration_ms": 1500}'
    - status: 200
      body: '{"text": "hello"}'
    - status: 200
      body: '{"id": "tr_1"}'
compare: {ignore: []}
env: {}
