kind: helper
name: soniox-pipeline-uploaded-success
call:
  soniox_pipeline:
    pipeline:
      model: soniox/stt-async-v4
      timeout_millis: 2500
      api_key: sk-local
      api_base: https://api.soniox.test
      optional_params: {}
      audio:
        filename: audio.mp3
        content: RIFF-data
      headers:
        x-soniox-extra: suite
      answers:
      - status: 200
        body: '{"id": "file_1"}'
      - status: 200
        body: '{"id": "tr_1"}'
      - status: 200
        body: '{"status": "completed", "audio_duration_ms": 1500}'
      - status: 200
        body: '{"text": "hello"}'
      - status: 200
        body: '{"id": "tr_1"}'
      - status: 200
        body: '{"id": "file_1"}'
compare: {ignore: []}
env: {}
