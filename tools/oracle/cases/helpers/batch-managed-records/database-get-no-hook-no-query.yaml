kind: helper
name: batch-managed-records-database-get-no-hook-no-query
call:
  batch_managed_records:
    plan:
      op: database_get
      batch_id: batch-1
      unified_batch_id: "litellm_proxy:batch:1"
    database:
      present: true
      found:
        file-raw-out: "litellm_proxy:file:unified-out"
      failures: []
env: {}
compare: {ignore: []}
