kind: helper
name: batch-managed-records-existing-input-id-mapping
call:
  batch_managed_records:
    plan:
      op: resolve_input
      files:
        input_file_id: file-raw-in
        output_file_id: file-raw-out
        error_file_id: null
    database:
      present: true
      found:
        file-raw-in: "litellm_proxy:file:unified-in"
      failures: []
env: {}
compare: {ignore: []}
