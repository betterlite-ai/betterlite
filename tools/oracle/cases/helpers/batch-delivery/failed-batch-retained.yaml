kind: helper
name: batch-delivery-failed-batch-retained
call:
  batch_delivery:
    flush:
      settings: {batch_size: 4, flush_interval_seconds: 5, max_queue_size: 100}
      preserve_events_added_during_flush: false
      steps:
        - {op: enqueue, events: [a, b]}
        - {op: flush, script: [{outcome: failed}]}
        - {op: flush, script: [{outcome: delivered}]}
env: {}
compare:
  ignore: []
