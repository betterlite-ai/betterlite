kind: helper
name: parse-execution-malformed-base64
call:
  b4502:
    parse_execution:
      value: "not valid base64!!"
env: {}
compare:
  ignore:
    - pointer: /error/class
      why: betterlite raises a typed ParseExecutionError where LiteLLM raises binascii.Error through pydantic's ValidationError
    - pointer: /error/message
      why: betterlite writes its own message
