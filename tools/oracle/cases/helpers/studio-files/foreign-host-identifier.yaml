kind: helper
name: studio-files-foreign-host-identifier
call:
  studio_files:
    calls:
      - function: targets
        file_ids:
          - https://generativelanguage.googleapis.com/v1beta/files/abc123
          - http://files.foreign.example/v1beta/files/nested/id
          - files/abc123
        api_base: "https://studio.example///"
        environment: {GOOGLE_API_KEY: google-key}
      - function: targets
        delete: true
        file_ids:
          - https://foreign.example/v1beta/files/abc123?alt=json
        api_base: "https://studio.example/"
        environment: {GEMINI_API_KEY: gemini-key}
env: {}
compare: {ignore: []}
