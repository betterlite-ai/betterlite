kind: helper
name: token-count-sample-above-exact-threshold
call:
  token_count:
    function: token_counter
    model: gpt-3.5-turbo
    text: "hello world hello world hello world hello world hello world hello world hello world hello world hello world hello world "
    max_exact_chars: 32
env:
  TOKEN_COUNTER_MAX_EXACT_CHARS: "32"
compare: {ignore: []}
