kind: helper
name: request-provider-mapping
call:
  b5990:
    steps:
      - kind: transform_request
        model: "novita/org/model"
        messages: [{role: user, content: "hi"}]
        optional_params: {max_retries: 2, temperature: 0.5}
        mapping: {novita: {status: live, providerId: "org/mapped"}}
      - kind: transform_request
        model: "novita/org/model"
        messages: [{role: user, content: "hi"}]
        mapping: {novita: {status: staging, providerId: "org/staged"}}
      - kind: transform_request
        model: "org/model"
        messages:
          - role: user
            content:
              - {type: text, text: "hi"}
              - {type: image_url, image_url: "https://example.com/a.png"}
      - kind: transform_request
        model: "novita/org/model"
        messages:
          - role: assistant
            content: null
            tool_calls:
              - {id: "call_1", type: function, function: {name: lookup, arguments: "{}"}}
        mapping: {novita: {status: live, providerId: "org/mapped"}}
      - kind: transform_request
        model: "novita/org/model"
        api_base: "http://mock"
        messages:
          - role: assistant
            content: null
            tool_calls:
              - {id: "call_1", type: function, function: {name: lookup, arguments: "{}"}}
env: {}
compare: {ignore: []}

