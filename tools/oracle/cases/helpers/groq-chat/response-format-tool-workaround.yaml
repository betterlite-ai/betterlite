kind: helper
name: groq-response-format-tool-workaround
call:
  b5833:
    capabilities:
      web_search: "no"
      reasoning: "no"
      response_schema: "no"
    options:
      - model: llama-3.3-70b-versatile
        non_default:
          response_format:
            type: json_schema
            json_schema:
              schema:
                type: object
                properties:
                  answer: {type: string}
        optional_params:
          temperature: 0.2
      - model: llama-3.3-70b-versatile
        non_default:
          response_format:
            type: json_schema
            json_schema: {}
        optional_params: {}
env: {}
compare:
  ignore:
    - pointer: /value/options/1/error/status
      why: betterlite returns 400 for a json_schema without schema where LiteLLM's KeyError carries no status (docs/deviations/B5833.yaml)
