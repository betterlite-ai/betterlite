kind: helper
name: messages-response-events-tool-arguments-and-done
call:
  messages_response_events:
    message_id: msg_tools
    model: model_a
    redaction: enabled
    steps:
      - {function: process_event, event: {shape: mapping, fields: {type: response.function_call_arguments.delta, item_id: tool_a, delta: '{"x":'}}}
      - function: process_event
        event:
          shape: mapping
          fields:
            type: response.output_item.added
            item: {type: function_call, id: tool_a, call_id: call_a, name: lookup}
      - {function: process_event, event: {shape: mapping, fields: {type: response.function_call_arguments.delta, item_id: tool_a, delta: "1}"}}}
      - {function: process_event, event: {shape: mapping, fields: {type: response.function_call_arguments.delta, item_id: tool_a, delta: ""}}}
      - {function: process_event, event: {shape: mapping, fields: {type: response.function_call_arguments.delta, delta: orphan}}}
      - function: process_event
        event:
          shape: mapping
          fields:
            type: response.output_item.done
            item: {type: function_call, id: tool_a}
      - function: process_event
        event:
          shape: mapping
          fields:
            type: response.output_item.done
            item: {type: function_call, id: tool_a}
      - function: process_event
        event:
          shape: mapping
          fields:
            type: response.output_item.done
            item: {type: function_call, id: missing}
      - function: process_event
        event:
          shape: mapping
          fields:
            type: response.output_item.done
            item: {type: message}
calls:
  - messages_response_events:
      message_id: msg_unmapped
      model: model_a
      redaction: enabled
      steps:
        - function: process_event
          event:
            shape: mapping
            fields:
              type: response.output_item.done
              item: {type: function_call, id: tool_a}
  - messages_response_events:
      message_id: msg_attributes
      model: model_a
      redaction: enabled
      steps:
        - function: process_event
          event:
            shape: attributes
            attributes: {type: response.function_call_arguments.delta, item_id: tool_attr, delta: "{}"}
        - function: process_event
          event:
            shape: attributes
            attributes:
              type: response.output_item.added
              item: {type: function_call, id: tool_attr, call_id: call_attr, name: attr_name}
        - function: process_event
          event:
            shape: attributes
            attributes:
              type: response.output_item.done
              item: {type: function_call, id: tool_attr}
env: {}
compare: {ignore: []}
