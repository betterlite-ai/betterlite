kind: helper
name: triton-provider-embedding-split
env: {}
compare: {ignore: []}
call:
  b8154:
    op: embedding
    inputs:
      - hello
      - [hello, world]
      - [1, 2, 3]
      - [[1, 2], [3]]
    replies:
      - status: 200
        model: trtllm
        input: hello world
        body: '{"model_name":"trtllm","outputs":[{"shape":[1,3],"data":[1.5,2.5,3.5]}]}'
      - status: 200
        model: model
        input: [hello world]
        body: '{"outputs":[{"shape":[2,2],"data":[1.5,2.5,3.5,4.5]}]}'
      - status: 200
        model: model
        input: [hello world, ""]
        body: '{"outputs":[{"shape":[2,1],"data":[1.5,2.5]},{"shape":[1,1],"data":[3.5]}]}'
      - status: 500
        model: model
        input: [hello]
        body: "nope"
      - status: 200
        model: model
        input: [hello]
        body: '{"outputs":[{"shape":[1],"data":[1.5]}]}'
      - status: 200
        model: model
        input: [1, 22, 333]
        body: '{"outputs":[{"shape":[1,1],"data":[1.5]}]}'
      - status: 200
        model: model
        input: [[1, 2], [3]]
        body: '{"outputs":[{"shape":[1,1],"data":[1.5]}]}'
      - status: 200
        model: model
        input: [hello]
        body: '[[{"shape":[1,1],"data":[1.5]}]]'
    split:
      - {data: [1.5, 2.5, 3.5, 4.5, 5.5, 6.5], shape: [2, 3]}
      - {data: [1.5, 2.5], shape: [2, 3]}
      - {data: [1.5, 2.5, 3.5, 4.5], shape: [1, 3]}
      - {data: [], shape: [0, 3]}
      - {data: [1.5], shape: [1]}
