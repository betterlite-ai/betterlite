kind: helper
name: wildcard_probe
call:
  b4440:
    mode: []
    wildcard:
      - model: "*"
        custom_llm_provider: openai
        params: {model: "*", messages: [{role: user, content: hi}], max_tokens: 32}
        cheapest: [gpt-4o-mini, gpt-4o, o3-mini]
      - model: "*"
        custom_llm_provider: openai
        params: {model: "*"}
        cheapest: [gpt-4o-mini]
      - model: "*"
        custom_llm_provider: openai
        params: {model: "*", max_tokens: null}
        cheapest: [gpt-4o-mini]
      - model: "*"
        custom_llm_provider: openai
        params: {model: "*"}
        cheapest: []
    tracking: []
    response: []
env: {}
compare: {ignore: []}
