kind: helper
name: hosted-vllm-chat-video-messages
call:
  b8150:
    function: "chat_messages"
    calls:
      - model: "my-model"
        messages:
          - role: "user"
            content:
              - type: "file"
                file: {file_data: "data:video/mp4;base64,AAAA", format: "video/mp4"}
          - role: "user"
            content:
              - type: "file"
                file: {file_id: "https://host/clip.mp4"}
          - role: "user"
            content: "plain text"
      - model: "my-model"
        messages:
          - role: "assistant"
            content:
              - {type: "text", text: "one"}
              - {type: "text", text: "two"}
          - role: "assistant"
            content:
              - {type: "text", text: "calling"}
              - {type: "tool_use", id: "call_1", name: "lookup", input: "{\"q\":\"x\"}"}
          - role: "assistant"
            content: "kept"
            reasoning_content: "a thought"
            thinking_blocks: [{type: "thinking", thinking: "hidden"}]
          - role: "assistant"
            content: "dropped"
            reasoning_content: {nested: true}
      - model: "my-model"
        messages:
          - role: "user"
            content:
              - type: "file"
                file: {file_data: "data:video/mp4;base64,AAAA"}
          - role: "user"
            content:
              - type: "file"
                file: {file_id: "clip.mp4", file_data: "data:video/mp4;base64,AAAA"}
      - model: "my-model"
        messages:
          - role: "assistant"
            tool_calls:
              - id: "call_1"
                type: "function"
                function: {name: "first", arguments: "{}"}
            content:
              - type: "tool_use"
                id: "call_2"
                name: "lookup"
                input: "{\"q\":\"x\"}"
env: {}
compare: {ignore: []}
