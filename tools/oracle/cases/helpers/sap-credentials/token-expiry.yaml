kind: helper
name: sap-credentials-token-expiry
call:
  b5950:
    function: token
    credentials:
      client_id: c
      client_secret: s
      auth_url: https://auth.example.com/oauth/token
      base_url: https://api.example.com/v2
      resource_group: default
    responses:
      - '{"access_token": "one", "expires_in": 7200}'
      - '{"access_token": "two", "expires_in": 7200}'
    times:
      - 1700000000
      - 1700003601
env: {}
compare: {ignore: []}
