kind: helper
name: exa_passthrough_blocked_names
call:
  b8020:
    environment:
      EXA_API_KEY: sk-exa
    calls:
      - provider: exa_ai
        call:
          kind: request
          query: "search text"
          optional_params:
            max_results: 5
            search_domain_filter: ["a.com"]
            country: "US"
            max_tokens_per_page: 7
            numResults: 3
            includeDomains: ["b.com"]
            userLocation: "GB"
            query: "shadow"
            type: neural
            contents: {text: false}
      - provider: exa_ai
        call:
          kind: request
          query: "search text"
          optional_params:
            numResults: 3
            includeDomains: ["b.com"]
            userLocation: "GB"
env: {}
compare: {ignore: []}
