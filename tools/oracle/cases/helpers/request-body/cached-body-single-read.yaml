kind: helper
name: cached_body_single_read
call:
  request_body:
    function: read_request_body
    request:
      method: POST
      route_path: /v1/chat/completions
      headers: {content-type: application/json}
      body: {encoding: utf8, value: '{"model":"raw"}'}
      cached_body: {model: cached, messages: []}
    max_repair_bytes: 1048576
env: {}
compare:
  ignore: []
