kind: helper
name: stored-sibling-kept
call:
  team_model_cleanup:
    calls:
      - function: remove_unbacked_team_models
        model_name: pub
        team_id: t1
        team_public_model_name: pub
        aliases: []
        deployments:
          - {model_name: model_name_t1_sibling, model_info: {team_id: t1, team_public_model_name: pub}}
        served_names: null
        team_models: [pub]
calls:
  - team_model_cleanup:
      calls:
        - function: get_team_public_model_names
          team_id: t1
          deployments:
            - {model_name: model_name_t1_sibling, model_info: {team_id: t1, team_public_model_name: pub}}
            - {model_name: model_name_t1_dup, model_info: {team_id: t1, team_public_model_name: pub}}
            - {model_name: model_name_t1_empty, model_info: {team_id: t1, team_public_model_name: ""}}
            - {model_name: model_name_t1_absent, model_info: {team_id: t1}}
            - {model_name: model_name_t2_only, model_info: {team_id: t2, team_public_model_name: foreign}}
env: {}
compare: {ignore: []}
