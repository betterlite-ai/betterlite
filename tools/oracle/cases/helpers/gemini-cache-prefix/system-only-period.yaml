kind: helper
name: gemini-cache-prefix-system-only-period
call:
  gemini_cache_prefix:
    cases:
      - model: gemini-2.5-pro
        provider: vertex_ai
        supports_system_message: true
        cache_key: cache-key-1
        project: proj
        location: us-central1
        now: "2026-11-12T00:00:00Z"
        disable_transform: false
        messages:
          - {role: system, content: [{type: text, text: rules, cache_control: {type: ephemeral}}]}
      - model: gemini-2.5-pro
        provider: vertex_ai
        supports_system_message: true
        cache_key: cache-key-2
        project: proj
        location: us-central1
        now: "2026-11-12T00:00:00Z"
        disable_transform: false
        messages:
          - role: system
            content:
              - {type: text, text: one, cache_control: {type: ephemeral}}
              - {type: text, text: two}
      - model: gemini-2.5-pro
        provider: vertex_ai
        supports_system_message: true
        cache_key: cache-key-3
        project: proj
        location: us-central1
        now: "2026-11-12T00:00:00Z"
        disable_transform: false
        messages:
          - {role: system, content: "first", cache_control: {type: ephemeral}}
          - {role: system, content: [{type: text, text: second, cache_control: {type: ephemeral}}]}
          - {role: user, content: question, cache_control: {type: ephemeral}}
      - model: text-bison
        provider: vertex_ai
        supports_system_message: false
        cache_key: cache-key-4
        project: proj
        location: us-central1
        now: "2026-11-12T00:00:00Z"
        disable_transform: false
        messages:
          - {role: system, content: [{type: text, text: rules, cache_control: {type: ephemeral}}]}
          - {role: user, content: question, cache_control: {type: ephemeral}}
      - model: gemini-2.5-pro
        provider: vertex_ai
        supports_system_message: true
        cache_key: cache-key-5
        project: proj
        location: us-central1
        now: "2026-11-12T00:00:00Z"
        disable_transform: false
        messages:
          - {role: system, content: [], cache_control: {type: ephemeral}}
          - {role: user, content: question, cache_control: {type: ephemeral}}
      - model: gemini/gemini-2.5-pro
        provider: gemini
        supports_system_message: false
        cache_key: cache-key-6
        project: proj
        location: us-central1
        now: "2026-11-12T00:00:00Z"
        disable_transform: false
        messages:
          - {role: system, content: "forced", cache_control: {type: ephemeral}}
          - {role: user, content: question, cache_control: {type: ephemeral}}
env: {}
compare:
  ignore: []
