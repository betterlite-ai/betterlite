      op: redact_vector_credentials
      litellm_params:
        litellm_embedding_config:
          nested:
            api_key: sk-nested
            note: plain
        max_tokens: 2048
        regions:
          - us-east-1
          - eu-west-1
        flags:
          - true
          - null
          - 3
      depth: 0
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params:
        note: '{"api_key": "sk-inline"}'
      depth: 0
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params: null
      depth: 0
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params: 7
      depth: 0
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params: true
      depth: 0
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params:
        - us-east-1
        - 3
        - null
      depth: 0
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params:
        a:
          b: plain
      depth: 9
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params:
        a:
          b: plain
      depth: 10
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params:
        a: b
        region: us
      depth: 9
env: {}
compare: {ignore: []}
