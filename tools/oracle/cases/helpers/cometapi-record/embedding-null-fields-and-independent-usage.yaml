kind: helper
name: cometapi-record-embedding-null-fields-and-independent-usage
call:
  cometapi_record:
    function: embedding_replies
    replies:
      - body: '{"model":"up","data":[{"object":"embedding","embedding":[1,2],"index":0}],"object":"list","usage":{"prompt_tokens":3,"total_tokens":4}}'
        status: 200
        headers: {}
      - {body: '{"model":null,"data":null,"object":null}', status: 200, headers: {}}
      - {body: '{"usage":{"prompt_tokens":3}}', status: 200, headers: {}}
      - {body: '{"usage":{"total_tokens":4}}', status: 200, headers: {}}
      - {body: '{"usage":{}}', status: 200, headers: {}}
      - {body: 'not json', status: 502, headers: {X-Request-Id: req-1}}
env: {}
compare: {ignore: []}
