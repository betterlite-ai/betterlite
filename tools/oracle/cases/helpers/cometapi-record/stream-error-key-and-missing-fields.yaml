kind: helper
name: cometapi-record-stream-error-key-and-missing-fields
call:
  cometapi_record:
    function: chunks
    chunks:
      - {error: {message: boom, code: 429, choices: []}}
      - {error: {message: boom}}
      - {error: {code: 500}}
      - {error: {}}
      - {error: {message: boom, code: null}}
      - {id: a, created: 1, model: m}
      - {id: a, created: 1, choices: []}
      - {id: a, model: m, choices: []}
      - {created: 1, model: m, choices: []}
env: {}
compare: {ignore: []}
