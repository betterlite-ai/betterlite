kind: helper
name: auth-model-budgets-key-model-budget-fallback
call:
  auth_model_budgets:
    calls:
      - function: key_fallback
        token:
          token: sk-budget
          models: [gpt-4, gpt-3.5]
          model_max_budget: {}
        model_name: gpt-4
        request_model: gpt-4
        request_data:
          model: gpt-4
          messages:
            - role: user
              content: hi
        path_params:
          model: gpt-4
        failing: true
        fallback: gpt-3.5
      - function: key_fallback
        token:
          token: sk-within
          models: [gpt-4]
        model_name: gpt-4
        request_model: gpt-4
        request_data:
          model: gpt-4
        failing: false
      - function: key_fallback
        token:
          token: sk-none
          models: [gpt-4]
        model_name: gpt-4
        request_model: gpt-4
        request_data:
          model: gpt-4
        failing: true
env: {}
compare:
  ignore: []
