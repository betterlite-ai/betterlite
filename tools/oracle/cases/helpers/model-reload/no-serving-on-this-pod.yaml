    environment: {LITELLM_ENVIRONMENT: production}
    calls:
      - function: reload_serving_verdict
        obligation: must_serve
        before: []
        written:
          - {id: inactive, model_info: {supported_environments: [development]}}
        still_desired: null
        live: {captured: null, router_ids: []}
