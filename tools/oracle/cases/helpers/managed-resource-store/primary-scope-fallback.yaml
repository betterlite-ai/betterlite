    principal: {team_id: t, org_id: o, api_key: a, token: b}
    owner: team:t
    probes:
      - {principal: {org_id: o, api_key: a, token: b}, owner: 'org:o'}
      - {principal: {api_key: a, token: b}, owner: 'key:a'}
