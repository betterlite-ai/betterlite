kind: helper
name: failure-metadata-oauth-bucket-and-bool-only
call:
  failure_metadata:
    calls:
      - {function: stamp, request_data: {}, request_route: null}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: true}}, request_route: null}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: false}}, request_route: null}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: "true"}}, request_route: null}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: 1}}, request_route: null}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: null}}, request_route: null}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: true}, litellm_metadata: {}}, request_route: null}
      - {function: stamp, request_data: {litellm_metadata: {used_client_oauth_token: false}, metadata: {used_client_oauth_token: true}}, request_route: "/v1/messages"}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: true}}, request_route: "/v1/messages"}
      - {function: stamp, request_data: {metadata: {used_client_oauth_token: true}}, request_route: "/v1/chat/completions"}
      - {function: stamp, request_data: {litellm_metadata: {used_client_oauth_token: true}}, request_route: "/v1/batches"}
env: {}
compare: {ignore: []}
