kind: helper
name: pre-call-hook-block-verdict-skips-applied-guardrail
call:
  b3762:
    pre_call_hook:
      settings:
        api_key: test-key
        api_base: "https://cisco.test"
        inspection_type: chat
        on_flagged_action: block
        fallback_on_error: block
        timeout: 5
      request_data:
        messages:
          - {role: user, content: "hello there"}
      answer: {status: 200, headers: {}, body: {action: denied}}
env: {}
compare:
  ignore:
    - pointer: /value/outcome
      why: >-
        The Python oracle wrapper tags every caught HTTPException as
        api_error_blocked, whether it came from a block verdict or a
        transport failure, while betterlite's outcome_tag reports the
        real blocked tag for a verdict-driven block.
