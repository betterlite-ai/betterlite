kind: helper
name: post-call-hook-output-direction
call:
  b3762:
    post_call_hook:
      settings:
        api_key: test-key
        api_base: "https://cisco.test"
        inspection_type: chat
        on_flagged_action: block
        fallback_on_error: block
        timeout: 5
      request_data:
        messages:
          - {role: user, content: "hello there"}
      response:
        choices:
          - message: {role: assistant, content: "hi back"}
      answer: {status: 200, headers: {}, body: {action: sanitize, sanitized_text: "[REDACTED]"}}
env: {}
compare:
  ignore:
    - pointer: /value/outcome
      why: >-
        The Python oracle wrapper only ever reports allow or
        api_error_blocked for this hook, so it can't distinguish a redact
        from an allow the way betterlite's outcome_tag does.
