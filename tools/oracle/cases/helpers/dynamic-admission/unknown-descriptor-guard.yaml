kind: helper
name: dynamic-admission-unknown-descriptor-guard
call:
  b3052:
    model: gpt-4
    rpm: 100
    tpm: 1000
    window_size: 60
    priority: null
    priority_reservation: null
    default_priority: 0.25
    saturation_threshold: 0.5
    saturation: 0.3
    atomic:
      overall_code: OVER_LIMIT
      statuses:
        - code: OVER_LIMIT
          current_limit: 10
          limit_remaining: 0
          rate_limit_type: max_parallel_requests
          descriptor_key: future_limit
          descriptor_value: pool
    tracking:
      overall_code: OK
      statuses: []
env: {}
compare: {ignore: []}
