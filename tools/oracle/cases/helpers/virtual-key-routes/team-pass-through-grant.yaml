kind: helper
name: virtual-key-routes-team-pass-through-grant
call:
  virtual_key_routes:
    function: should_call_route
    route: /team-pass
    method: POST
    key:
      allowed_routes: [llm_api_routes]
      metadata: {}
      team_metadata:
        allowed_passthrough_routes: [/team-pass]
    registrations:
      - {endpoint_id: pass-a, route_type: exact, path: /team-pass, auth: true}
env: {}
compare: {ignore: []}
