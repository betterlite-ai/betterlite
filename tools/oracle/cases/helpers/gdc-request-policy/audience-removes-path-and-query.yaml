          - {base: "https://[fd00::1/x", deployment: 0}
          - {base: "https://[fe80::1%25eth0]:443/x", deployment: 0}
          - {base: "https://u[]@v1.x", deployment: 0}
          - {base: "https://u[@v1.a]b", deployment: 0}
          - {base: "https://gdc.example℀", deployment: 0}
          - {base: "https://u[]@v1.", deployment: 0}
env: {}
compare: {ignore: []}
