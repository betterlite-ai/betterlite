kind: helper
name: vertex-text-embeddings-labels-each-branch
call:
  vertex_text_embeddings:
    requests:
      - {model: "42", input: hello, optional: {labels: {team: search, count: 5}}}
      - {model: bge-small, input: hello, optional: {labels: {team: search, count: 5}}}
      - {model: text-embedding-005, input: hello, optional: {labels: {team: search, count: 5}}}
      - model: text-embedding-005
        input: hello
        optional: {labels: {}}
        litellm_params: {metadata: {requester_metadata: {team: search}}}
      - model: bge-small
        input: hello
        optional: {labels: ignored}
        litellm_params: {metadata: {requester_metadata: {team: search}}}
compare: {ignore: []}
env: {}
