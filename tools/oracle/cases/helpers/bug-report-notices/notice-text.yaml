kind: helper
name: bug-report-notices-notice-text
call:
  b10218:
    env: {}
    calls:
      # the record handle_exception_on_proxy builds for a caught FailureError: no frame, no config, no call fields
      - function: notice
        record:
          environment: {surface: proxy, litellm_version: "1.105.1", python_version: "3.11.9", deployment: null, config_lines: []}
          exception_type: FailureError
          litellm_frames: []
          call_type: null
          custom_llm_provider: null
          stream: null
      # the same record from a Docker deployment
      - function: notice
        record:
          environment: {surface: proxy, litellm_version: "1.105.1", python_version: "3.11.9", deployment: Docker, config_lines: []}
          exception_type: FailureError
          litellm_frames: []
          call_type: null
          custom_llm_provider: null
          stream: null
      # a frame, config lines, a provider and a stream, the fields _handle_llm_api_exception fills
      - function: notice
        record:
          environment: {surface: proxy, litellm_version: "1.105.1", python_version: "3.11.9", deployment: Docker, config_lines: ["general_settings.store_model_in_db = true", "litellm_settings.success_callback = [openai]"]}
          exception_type: FailureError
          litellm_frames: ["litellm/proxy/utils.py:8229 in handle_exception_on_proxy"]
          call_type: "/chat/completions"
          custom_llm_provider: openai
          stream: true
      # config lines alone push the URL past MAX_URL_LENGTH, so both sides trim them to the same count
      - function: notice
