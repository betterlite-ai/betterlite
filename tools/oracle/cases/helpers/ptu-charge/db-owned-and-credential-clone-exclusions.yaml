kind: helper
name: db-owned-and-credential-clone-exclusions
call:
  ptu_charge:
    steps:
      config:
        kind: config
        owned_by_db:
          - db-1
        entries:
          - model_name: team_1_owned
            model_info:
              id: db-1
              team_id: team-1
              db_model: true
              ptu_count: 1
              cost_per_ptu_per_hour: 0.5
              ptu_effective_from: "2026-03-01T00:00:00Z"
          - model_name: team_1_clone
            model_info:
              id: clone-1
              original_model_id: db-1
              team_id: team-1
              ptu_count: 1
              cost_per_ptu_per_hour: 0.5
              ptu_effective_from: "2026-03-01T00:00:00Z"
          - model_name: team_1_dbtrue
            model_info:
              id: cfg-db-true
              team_id: team-1
              db_model: true
              ptu_count: 1
              cost_per_ptu_per_hour: 0.5
              ptu_effective_from: "2026-03-01T00:00:00Z"
          - model_name: team_1_kept
            model_info:
              id: cfg-2
              team_id: team-1
              db_model: false
              ptu_count: 1
              cost_per_ptu_per_hour: 0.5
              ptu_effective_from: "2026-03-01T00:00:00Z"
          - model_name: team_1_noid
            model_info:
              team_id: team-1
              ptu_count: 1
              cost_per_ptu_per_hour: 0.5
              ptu_effective_from: "2026-03-01T00:00:00Z"
          - model_name: team_1_text
            model_info: '{"id": "cfg-3", "team_id": "team-1", "ptu_count": 1, "cost_per_ptu_per_hour": 0.5, "ptu_effective_from": "2026-03-01T00:00:00Z"}'
          - model_name: team_1_nullorigin
            model_info:
              id: cfg-4
              team_id: team-1
              original_model_id: null
              ptu_count: 1
              cost_per_ptu_per_hour: 0.5
              ptu_effective_from: "2026-03-01T00:00:00Z"
          - model_name: team_1_missing
env: {}
compare: {ignore: []}
