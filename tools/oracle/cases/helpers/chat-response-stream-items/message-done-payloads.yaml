kind: helper
name: chat-response-stream-items-message-done-payloads
call:
  chat_response_stream_items:
    model: m
    request_value: hi
    responses_api_request: {}
    custom_llm_provider: null
    litellm_metadata: null
    logging_marker: ctx
    now: 10
    uuid_ids: [msg]
    steps:
      - kind: set
        cached_item_id: msg_c
        message_output_index: 2
        sequence_number: 5
      - kind: done
        target: text
        completion: {choices: [{message: {content: hello}}]}
      - kind: done
        target: part
        completion:
          choices:
            - message:
                content: hello
                annotations:
                  - type: url_citation
                    url_citation: {url: "https://example.com", title: Example, start_index: 1, end_index: 4}
      - kind: set
        litellm_model_response: {choices: [{message: {content: stored, annotations: []}}]}
      - kind: done
        target: item
        completion: {choices: [{message: {content: passed}}]}
      - kind: done
        target: text
        completion: {choices: [{message: {content: null}}]}
      - kind: done
        target: part
        completion: {choices: [{message: {}}]}
env: {}
compare:
  ignore:
    - pointer: /value/results/2/step/part/annotations
      why: LiteLLM's ContentPartDonePartOutputText drops the annotation fields and dumps an empty object; betterlite keeps the citation fields the output_item.done payload carries
