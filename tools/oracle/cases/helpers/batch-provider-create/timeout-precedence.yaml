kind: helper
name: timeout-precedence
call:
  batch_provider_create:
    env: {}
    module: {}
    steps:
      - completion_window: "24h"
        endpoint: "/v1/chat/completions"
        input_file_id: file-1
        custom_llm_provider: xai
        optional_params: {timeout: 12.5, request_timeout: 7.5}
      - completion_window: "24h"
        endpoint: "/v1/chat/completions"
        input_file_id: file-2
        custom_llm_provider: xai
        optional_params: {request_timeout: 7.5}
      - completion_window: "24h"
        endpoint: "/v1/chat/completions"
        input_file_id: file-3
        custom_llm_provider: xai
      - completion_window: "24h"
        endpoint: "/v1/chat/completions"
        input_file_id: file-4
        custom_llm_provider: openai
        optional_params: {timeout: 30}
env: {}
compare: {ignore: []}
