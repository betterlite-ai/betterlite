kind: helper
name: try_safe_join_returns_null_instead_of_raising_on_escape
call:
  assets:
    op: try_safe_join
    fixture:
      - {kind: dir, path: "../outside"}
      - {kind: symlink, path: escape, target: "../outside"}
    parts: [escape, secret.txt]
env: {}
compare:
  ignore:
    - pointer: /value
      why: both sides agree the join is rejected, but the oracle harness round-trips a bare top-level null answer through Option<Value>, which collapses the Python side to a missing key while the native side keeps it present
