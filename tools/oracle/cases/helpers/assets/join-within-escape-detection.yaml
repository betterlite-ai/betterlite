kind: helper
name: join_within_rejects_a_parent_directory_component
call:
  assets:
    op: join_within
    base_dir: /srv/assets
    parts: ["..", "secret.txt"]
env: {}
compare:
  ignore:
    - pointer: /value
      why: both sides agree the joined path is rejected, but the oracle harness round-trips a bare top-level null answer through Option<Value>, which collapses the Python side to a missing key while the native side keeps it present
