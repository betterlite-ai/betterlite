        - {kind: gemini, mode: chat, model: gemini-flash-lite-latest}
        - {kind: gemini, mode: chat, model: gemini-pro-lite-latest}
        - {kind: gemini, mode: chat, model: gemini-experimental}
        - {kind: gemini, mode: chat, model: gemini-pro-latest}
        - {kind: gemini, mode: chat, model: gemini-pro}
        - {kind: gemini, mode: chat, model: 'gemini/1234'}
        - {kind: gemini, mode: chat, model: 'gemini/GEMINI-3-pro'}
