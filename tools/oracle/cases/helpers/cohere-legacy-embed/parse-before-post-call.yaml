kind: helper
name: cohere-legacy-embed-parse-before-post-call
call:
  cohere_legacy_embed:
    model: embed-english-v3.0
    input: [hello]
    runs:
      - status: 200
        body: '{"embeddings":['
      - status: 200
        body: '{"meta":{}}'
      - status: 200
        body: '{"embeddings":[[0.5]]}'
compare: {ignore: []}
env: {}
