kind: helper
name: cohere-legacy-embed-flat-and-grouped-types
call:
  cohere_legacy_embed:
    mode: async
    model: embed-english-v3.0
    input: [hello]
    runs:
      - reply:
          status: 200
          body: '{"embeddings":[[0.5],[0.25]]}'
      - reply:
          status: 200
          body: '{"embeddings":{"float":[[0.5]],"int8":[[1],[2]]},"response_type":"embeddings_by_type"}'
      - reply:
          status: 200
          body: '{"embeddings":{"float":[[0.75]]},"meta":{"billed_units":{"images":3,"input_tokens":2}}}'
compare: {ignore: []}
env: {}
