kind: helper
name: messages-responses-input-midturn-system-responses
call:
  messages_responses_input:
    messages:
    - role: system
      content: be brief
    - role: user
      content: question
    - role: system
      content:
      - text: untyped
      - type: text
        text: mid
      - type: text
        text: marked
        prompt_cache_breakpoint:
          mode: explicit
