kind: helper
name: credential-failure-and-alert-classification
call:
  capture_rate:
    cases:
      healthy_report_is_silent:
        function: alert_report
        provider: openai
        start_date: "2026-11-16"
        end_date: "2026-11-16"
        threshold: 0.9
        captured_by_day: {"2026-11-16": 95.0}
        billed_by_day: {"2026-11-16": 100.0}
      below_threshold_report_alerts:
        function: alert_report
        provider: openai
        start_date: "2026-11-16"
        end_date: "2026-11-16"
        threshold: 0.9
        captured_by_day: {"2026-11-16": 45.0}
        billed_by_day: {"2026-11-16": 100.0}
      grouped_amounts_alert:
        function: alert_report
        provider: openai
        start_date: "2026-11-16"
        end_date: "2026-11-16"
        threshold: 0.9
        captured_by_day: {"2026-11-16": 1250000.0}
        billed_by_day: {"2026-11-16": 2000000.0}
      zero_bill_report_is_silent:
        function: alert_report
        provider: openai
        start_date: "2026-11-16"
        end_date: "2026-11-16"
        threshold: 0.9
        captured_by_day: {"2026-11-16": 5.0}
        billed_by_day: {}
      credential_missing:
        function: alert_credential_missing
        provider: openai
        env_var: OPENAI_ADMIN_KEY
      request_failed:
        function: alert_request_failed
        provider: openai
        detail: "HTTP 500: boom"
env: {}
compare: {ignore: []}
