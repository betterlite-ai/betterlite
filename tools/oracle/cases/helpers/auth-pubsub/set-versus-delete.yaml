    subscriber:
      sessions:
        - - {kind: message, message: '{"cache_key": "spend:team:1", "new_value": 1200.0, "ttl": 30.0}'}
          - {kind: message, message: '{"cache_key": "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}'}
          - {kind: message, message: '{"cache_key": ""}'}
