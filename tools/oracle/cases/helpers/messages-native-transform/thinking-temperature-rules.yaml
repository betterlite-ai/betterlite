kind: helper
name: messages-native-transform-thinking-temperature-rules
call:
  messages_native_transform:
    model_cost:
      claude-sonnet-4-5: {litellm_provider: anthropic, supports_reasoning: true, supports_adaptive_thinking: false, supports_output_config: false, supports_legacy_thinking: false, supports_xhigh_reasoning_effort: false, supports_max_reasoning_effort: false, thinking_always_on: false}
      claude-opus-4-5: {litellm_provider: anthropic, supports_reasoning: true, supports_adaptive_thinking: false, supports_output_config: true, supports_legacy_thinking: false, supports_xhigh_reasoning_effort: false, supports_max_reasoning_effort: false, thinking_always_on: false}
      claude-opus-4-6: {litellm_provider: anthropic, supports_reasoning: true, supports_adaptive_thinking: true, supports_output_config: true, supports_legacy_thinking: true, supports_xhigh_reasoning_effort: false, supports_max_reasoning_effort: true, thinking_always_on: false}
    packaged: {}
    calls:
      - model: claude-sonnet-4-5
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 32768, temperature: 0, thinking: {type: enabled, budget_tokens: 2000}}
        strips_billing_metadata: false
      - model: claude-opus-4-5
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 32768, temperature: 0, output_config: {effort: high}}
        strips_billing_metadata: false
      - model: claude-sonnet-4-5
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 32768, temperature: 1, thinking: {type: enabled, budget_tokens: 2000}}
        strips_billing_metadata: false
      - model: claude-sonnet-4-5
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 32768, temperature: null, thinking: {type: enabled, budget_tokens: 2000}}
        strips_billing_metadata: false
      - model: claude-sonnet-4-5
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 32768, temperature: 0, thinking: {type: disabled}}
        strips_billing_metadata: false
      - model: claude-opus-4-6
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 32768, temperature: 0, reasoning_effort: medium}
        strips_billing_metadata: false
      - model: claude-sonnet-4-5
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 32768, temperature: 0, thinking: {type: adaptive}, output_config: {effort: medium}}
        strips_billing_metadata: false
      - model: claude-sonnet-4-5
        custom_llm_provider: anthropic
        messages: [{role: user, content: hello}]
        optional_params: {max_tokens: 1024, temperature: 0, thinking: {type: adaptive}, output_config: {effort: medium}}
        strips_billing_metadata: false
env: {}
compare: {ignore: []}
