kind: helper
name: voyage-contextual-suffix-and-key-aliases
call:
  voyage_contextual:
    text: {model: voyage-3, input: hello, options: {}, base: https://example.test/v1/embeddings}
    contextual: {model: voyage-contextual, input: [hello], options: {}, base: https://example.test/v1/contextualizedembeddings}
env: {VOYAGE_API_KEY: first, VOYAGE_AI_API_KEY: second, VOYAGE_AI_TOKEN: third}
compare: {ignore: []}
