kind: helper
name: speaker-zero-and-duration
call:
  xai_stt:
    operation: reply
    env: {}
    xai_key: null
    calls:
      - status: 200
        headers: []
        body: '{"text": "hello", "language": "en", "duration": 2.5, "words": [{"text": "he", "start": 0.0, "end": 1.0, "speaker": 0}, {"text": "llo", "start": 1.0, "end": 2.0}]}'
      - status: 200
        headers: []
        body: '{"text": "hi", "language": "de", "words": [], "duration": null}'
env: {}
compare: {ignore: []}
