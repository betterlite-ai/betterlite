kind: helper
name: defaults-and-malformed-success
call:
  xai_stt:
    operation: reply
    env: {}
    xai_key: null
    calls:
      - status: 200
        headers: []
        body: "{}"
      - status: 422
        headers: [["x-a", "b"]]
        body: bad audio
      - status: 201
        headers: []
        body: not json
      - status: 200
        headers: []
        body: '{"text": 5}'
env: {}
compare: {ignore: []}
