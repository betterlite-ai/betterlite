kind: helper
name: flatten-and-boolean-form
call:
  xai_stt:
    operation: request
    env: {}
    xai_key: null
    calls:
      - api_base: null
        api_key: sk-key
        model: grok-stt
        audio: {filename: clip.wav, content: audio}
        extra_body:
          language: fr
          diarize: true
          custom: x
          temperature: 0.25
          OPENAI_TRANSCRIPTION_PARAMS: nested
          extra_body: nested
        options:
          language: en
          temperature: 0.5
          prompt: hi
          response_format: null
          timestamp_granularities: [word, segment]
      - api_base: "https://proxy.example/v1/"
        api_key: sk-key
        model: m
        audio: {filename: null, content: raw}
        extra_body: {flag: false, n: 3, f: 1.5, items: [true, false, 1]}
        options: {}
      - api_base: "https://proxy.example/v2"
        api_key: null
        model: m
        audio: {filename: sound.flac, content: abc}
        extra_body: {}
        options: {}
env: {}
compare: {ignore: []}
