kind: helper
name: gemini-tool-results-parallel-results
call:
  gemini_tool_results:
    message:
      role: tool
      tool_call_id: call_b
      content: '{"ok":true}'
    last_message_with_tool_calls:
      role: assistant
      tool_calls:
        - id: call_a
          type: function
          function:
            name: first
            arguments: '{}'
        - id: call_b
          type: function
          function:
            name: second
            arguments: '{}'
        - id: call_c
          type: function
          function:
            name: third
            arguments: '{}'
    forward_function_call_id: true
env: {}
compare:
  ignore: []
