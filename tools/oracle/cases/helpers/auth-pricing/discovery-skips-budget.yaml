kind: helper
name: auth-pricing-discovery-skips-budget
call:
  auth_pricing:
    calls:
      # every discovery route skips both checks, and a charged model is never looked up
      - function: request_skip
        router:
          cache: {}
        route: /v1/models
        model: charged
      - function: request_skip
        router:
          cache: {}
        route: /models
        model: charged
      - function: request_skip
        router:
          cache: {}
        route: /model/info
        model: charged
      - function: request_skip
        router:
          cache: {}
        route: /v1/model/info
        model: charged
      - function: request_skip
        router:
          cache: {}
        route: /v2/model/info
        model: charged
      - function: request_skip
        router:
          cache: {}
        route: /model_group/info
        model: charged
      - function: request_skip
        router:
          cache: {}
        route: /utils/model_info
        model: charged
      # an LLM route does not skip, and a charged model records its group lookup
      - function: request_skip
        router:
          groups:
            charged: {input: 0.0001, output: 0.0001}
          cache: {}
        route: /chat/completions
        model: charged
      # a management route is not an LLM route, so it skips
      - function: request_skip
        router:
          cache: {}
        route: /key/info
        model: charged
      # the budget check itself is bypassed on a discovery route even with spend past the ceiling
      - function: request_checks
        router:
          cache: {}
        route: /v1/models
        method: GET
        body: {}
        max_budget: 10.0
        global_spend: 100.0
env: {}
compare:
  ignore: []
