kind: helper
name: tls-http2
call:
  tls_policy:
    deployment_ssl_verify: null
    config_ssl_verify: null
    config_http2: false
    environment:
      LITELLM_HTTP2: "true"
env: {}
compare:
  ignore:
    - pointer: /value/user_agent
      reason: the default User-Agent intentionally differs from LiteLLM
