kind: helper
name: tls-certificate-environment-precedence
call:
  tls_policy:
    ca_pem: null
    deployment_ssl_verify: null
    config_ssl_verify: null
    config_ssl_certificate: configured-client.pem
    config_http2: false
    environment:
      SSL_CERTIFICATE: environment-client.pem
env: {}
compare:
  ignore:
    - pointer: /value/user_agent
      why: the default User-Agent intentionally differs from LiteLLM
