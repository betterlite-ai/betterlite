kind: helper
name: tls-argument-precedence
call:
  tls_policy:
    deployment_ssl_verify: false
    config_ssl_verify: null
    config_http2: false
    environment:
      SSL_VERIFY: "true"
env: {}
compare:
  ignore:
    - pointer: /value/user_agent
      reason: the default User-Agent intentionally differs from LiteLLM
