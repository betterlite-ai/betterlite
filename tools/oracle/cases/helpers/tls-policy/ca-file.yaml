kind: helper
name: tls-ca-file
call:
  tls_policy:
    deployment_ssl_verify: null
    config_ssl_verify: null
    config_http2: false
    environment:
      SSL_CERT_FILE: /dev/null
env: {}
compare:
  ignore:
    - pointer: /value/user_agent
      why: the default User-Agent intentionally differs from LiteLLM
