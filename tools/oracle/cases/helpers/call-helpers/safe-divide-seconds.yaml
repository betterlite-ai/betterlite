kind: helper
name: safe-divide-seconds
call:
  call_helpers:
    function: safe_divide_seconds
    values:
      - {seconds: 10, denominator: 4}
      - {seconds: 10, denominator: 0}
      - {seconds: 10, denominator: 0, default: 0}
      - {seconds: 10, denominator: -2, default: 3.5}
      - {seconds: 0, denominator: 5}
      - {seconds: 1, denominator: 8}
env: {}
compare: {ignore: []}
