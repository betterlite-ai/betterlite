kind: helper
name: semantic-vad-override
call:
  gemini_live_setup:
    calls:
      - op: session_update
        model: gemini-2.5-flash
        session:
          turn_detection: {type: semantic_vad}
      - op: session_update
        model: gemini-2.5-flash
        session:
          turn_detection: {type: semantic_vad, create_response: false}
      - op: session_update
        model: gemini-2.5-flash
        session:
          turn_detection: {type: semantic_vad, create_response: true}
      - op: session_update
        model: gemini-2.5-flash
        session:
          turn_detection: {type: server_vad, create_response: false, prefix_padding_ms: 20, silence_duration_ms: 500}
      - op: session_update
        model: gemini-2.5-flash
        session:
          turn_detection: {type: custom_vad}
      - op: session_update
        model: gemini-2.5-flash
        session:
          turn_detection: {type: server_vad, prefix_padding_ms: 20.5, silence_duration_ms: true}
      - op: session_update
        model: gemini-2.5-flash
        session:
          audio: {input: {turn_detection: {type: semantic_vad}}}
      - op: session_update
        model: gemini-2.5-flash
        session:
          turn_detection: {}
env: {}
compare: {ignore: []}
