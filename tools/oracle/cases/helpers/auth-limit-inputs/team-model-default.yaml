kind: helper
name: auth-limit-inputs-team-model-default
call:
  auth_limit_inputs:
    function: key_model_limits
    auth:
      api_key: sk-oracle
      team_metadata:
        model_rpm_limit:
          gpt-4: 7
        model_tpm_limit:
          gpt-4: 70
    model_name: gpt-4
    deployments:
      - model_name: gpt-4
        default_api_key_rpm_limit: 1
        default_api_key_tpm_limit: 1
env: {}
compare:
  ignore: []
