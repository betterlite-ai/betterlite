kind: helper
name: storage-file-projection
call:
  file_storage_service:
    operation: projection
    content: abc
    filename: a.bin
    content_type: text/plain
    purpose: batch
    target_storage: litellm_db
    storage_url: "litellm_db://r"
    target_model_names: []
    environment: {}
    now: 1234.9
    uuid: "12345678-1234-5678-1234-567812345678"
calls:
  - file_storage_service:
      operation: projection
      content: ""
      filename: empty.bin
      content_type: application/octet-stream
      purpose: user_data
      target_storage: azure_storage
      storage_url: "https://acct.blob.core.windows.net/files/f"
      target_model_names: []
      environment: {}
      now: 1234.9
      uuid: "12345678-1234-5678-1234-567812345678"
  # the service refuses a target upload before any write, with the factory error taking precedence
  - file_storage_service:
      operation: upload
      content: abc
      filename: a.bin
      content_type: text/plain
      purpose: user_data
      target_storage: azure_storage
      storage_url: ""
      target_model_names: [m]
      environment:
        AZURE_STORAGE_ACCOUNT_NAME: acct
        AZURE_STORAGE_FILE_SYSTEM: files
      now: 1234.9
      uuid: "12345678-1234-5678-1234-567812345678"
  - file_storage_service:
      operation: upload
      content: abc
      filename: a.bin
      content_type: text/plain
      purpose: user_data
      target_storage: litellm_db
      storage_url: ""
      target_model_names: []
      environment: {}
      now: 1234.9
      uuid: "12345678-1234-5678-1234-567812345678"
  - file_storage_service:
      operation: upload
      content: abc
      filename: a.bin
      content_type: text/plain
      purpose: user_data
      target_storage: other
      storage_url: ""
      target_model_names: [m]
      environment: {}
      now: 1234.9
      uuid: "12345678-1234-5678-1234-567812345678"
env: {}
compare: {ignore: []}
