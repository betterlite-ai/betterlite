kind: helper
name: charge-single-custom-rates
call:
  b4504:
    operation: charge
    deployments:
      - litellm_params: {model: lens-model, input_cost_per_token: 0.25, output_cost_per_token: 0.5}
    estimate: 100.0
    response:
      id: chatcmpl-1
      object: chat.completion
      created: 1
      model: lens-model
      choices:
        - index: 0
          message: {role: assistant, content: "{}"}
      usage: {prompt_tokens: 2, completion_tokens: 4, total_tokens: 6}
env: {}
compare: {ignore: []}
