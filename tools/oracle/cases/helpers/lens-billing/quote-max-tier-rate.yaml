kind: helper
name: quote-max-tier-rate
call:
  b4504:
    operation: quote
    prompt: hello
    deployments:
      - litellm_params: {model: lens-model}
    model_info:
      lens-model:
        input_cost_per_token: 0.25
        output_cost_per_token: 0.5
        input_cost_per_token_above_200k_tokens: 1.0
        output_cost_per_token_above_200k_tokens: 2.0
        input_cost_per_token_above_128k_tokens: 1.5
        output_cost_per_token_above_128k_tokens: 2.5
env: {}
compare: {ignore: []}
