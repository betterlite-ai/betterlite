kind: helper
name: brave-search-credential-host-guard
call:
  brave_search:
    environment: {BRAVE_API_KEY: server-key}
    calls:
      - kind: request
        headers: {}
        api_key: null
        api_base: "https://api.search.brave.com/res/v1/web/search"
        query: trusted
        optional_params: {}
      - kind: request
        headers: {}
        api_key: null
        api_base: "https://evil.example/res/v1/web/search"
        query: untrusted
        optional_params: {}
      - kind: request
        headers: {}
        api_key: caller-key
        api_base: "https://evil.example/res/v1/web/search"
        query: explicit
        optional_params: {}
      - kind: request
        headers: {}
        api_key: null
        api_base: null
        query: default
        optional_params: {}
env: {}
compare: {ignore: []}
