kind: helper
name: fal-image-core-key-scheme
call:
  fal_image_core:
    operation: key_scheme
    environment: {FAL_AI_API_KEY: env-key}
    cases:
      - headers: {}
        api_key: explicit-key
      - headers: {Authorization: "Bearer other", x-request-id: req-1}
        api_key: null
      - headers: {}
        api_key: ""
env: {}
compare:
  ignore: []
