kind: helper
name: cost-estimate-values-params-before-info
call:
  cost_estimate_values:
    model_list:
      - model_name: on-prem-quote
        litellm_params:
          model: claude-haiku-4-5-20251001
          custom_llm_provider: anthropic
          input_cost_per_token: 0.5
          output_cost_per_token: 1.5
          cache_read_input_token_cost: 0.25
        model_info:
          input_cost_per_token: 9.0
          output_cost_per_token: 9.0
          cache_creation_input_token_cost: 0.25
    request:
      model: on-prem-quote
      input_tokens: 8
      output_tokens: 4
      cache_read_input_tokens: 4
      cache_creation_input_tokens: 2
      reasoning_tokens: 1
env: {}
compare: {ignore: []}
