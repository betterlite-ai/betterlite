call:
  batch_enqueued_refund:
    plan:
      op: post_call
      batch_id: batch-1
      status: completed
      pending:
        tokens: 500
        scopes:
          - {key: api_key, value: sk-oracle-key, limit: 1000}
          - {key: team, value: team-oracle, limit: 2000}
        reserved_at_monotonic: 12.5
    redis:
      save:
        - {kind: done}
      pop:
        - kind: record
          record:
            tokens: 500
            scopes:
              - {key: api_key, value: sk-oracle-key, limit: 1000}
              - {key: team, value: team-oracle, limit: 2000}
            backend: redis
            owner: ''
            reserved_at_monotonic: 12.5
      refund:
        - {kind: done}
        - {kind: done}
    memory:
      counters: {}
      records: {}
      read: []
    now: 20.0
env: {}
compare: {ignore: []}
