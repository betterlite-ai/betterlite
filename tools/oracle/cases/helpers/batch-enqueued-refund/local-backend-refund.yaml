kind: helper
name: batch-enqueued-refund-local-backend-refund
call:
  batch_enqueued_refund:
    plan:
      op: refund
      reservation:
        tokens: 500
        scopes:
          - {key: api_key, value: sk-oracle-key, limit: 1000}
        backend: memory
        owner: worker-b
        reserved_at_monotonic: 12.5
    redis: null
    memory:
      counters:
        'batch_enqueued_tokens:api_key:sk-oracle-key': 800
      records: {}
      read:
        - 'batch_enqueued_tokens:api_key:sk-oracle-key'
    now: 20.0
env: {}
compare: {ignore: []}
