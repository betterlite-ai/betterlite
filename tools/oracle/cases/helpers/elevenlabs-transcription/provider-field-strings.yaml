kind: helper
name: elevenlabs-transcription-provider-field-strings
call:
  elevenlabs_transcription:
    calls:
    - {function: request, model: scribe_v1, filename: null, content: raw, optional_params: {bias: 1e-05, diarize: true, note: hi, score: 1.5, seed: 7, tag_audio_events: false, unset: null}}
    - {function: request, model: model, filename: sound.flac, content: abc, optional_params: {OPENAI_TRANSCRIPTION_PARAMS: nested, model: other, model_id: override}}
    - {function: request, model: m, filename: clip.wav, content: "", optional_params: {language_code: ""}}
    - {function: request, model: m, filename: null, content: raw, optional_params: {language_code: en, temperature: 0.0}}
compare: {ignore: []}
env: {}
