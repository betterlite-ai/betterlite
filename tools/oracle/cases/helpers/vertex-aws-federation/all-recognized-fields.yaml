      - https://www.googleapis.com/auth/cloud-platform
    aws_access_key_id: AKIAORACLEEXAMPLE
    aws_secret_access_key: oracle-secret-key
    aws_session_token: oracle-session-token
    aws_region_name: us-east-1
    aws_session_name: oracle-session
    aws_profile_name: oracle-profile
    aws_role_name: arn:aws:iam::123456789012:role/oracle
    aws_web_identity_token: oracle-web-identity-token
    aws_sts_endpoint: https://sts.us-east-1.amazonaws.com
    aws_external_id: oracle-external-id
env: {}
compare: {ignore: []}
