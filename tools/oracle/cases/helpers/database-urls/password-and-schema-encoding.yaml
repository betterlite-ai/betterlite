kind: helper
name: database-urls-password-and-schema-encoding
call:
  database_urls:
    function: batch
    calls:
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user name
          database_name: db/name
          database_password: p@ss word
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user
          database_name: name
          database_password: p%40ss
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user
          database_name: name
          database_password: "secret?"
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user
          database_name: name
          database_schema: tenant one
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user
          database_name: name
          database_schema: tenant one
          database_sslmode: require
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: "ü ser"
          database_name: "näme"
env: {}
compare: {ignore: []}
