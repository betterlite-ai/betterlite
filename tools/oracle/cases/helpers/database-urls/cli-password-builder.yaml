kind: helper
name: database-urls-cli-password-builder
call:
  database_urls:
    function: batch
    calls:
      - function: construct_cli_url
        environment:
          DATABASE_HOST: db.example
          DATABASE_USERNAME: cli user
          DATABASE_USER: ignored
          DATABASE_NAME: cli_db
          DATABASE_PORT: "6543"
          DATABASE_PASSWORD: p@ss
          DATABASE_SCHEMA: tenant
          DATABASE_SSLMODE: require
      - function: construct_cli_url
        environment:
          DATABASE_HOST: db.example
          DATABASE_USERNAME: user
          DATABASE_NAME: cli_db
      - function: construct_cli_url
        environment:
          DATABASE_HOST: db.example
          DATABASE_USER: user
          DATABASE_NAME: cli_db
      - function: construct_cli_url
        environment:
          DATABASE_HOST: db.example
          DATABASE_NAME: cli_db
          DATABASE_MAX_IDLE_CONNECTION_LIFETIME: soon
      - function: construct_cli_url
        environment:
          DATABASE_HOST: db.example
          DATABASE_USERNAME: user
          DATABASE_NAME: cli_db
          DATABASE_MAX_IDLE_CONNECTION_LIFETIME: soon
      - function: construct_cli_url
        environment:
          DATABASE_HOST: db.example
          DATABASE_USERNAME: user
          DATABASE_NAME: cli_db
          DATABASE_SSLROOTCERT: /certs/root.pem
      - function: construct_cli_url
        environment:
          DATABASE_HOST: db.example
          DATABASE_USERNAME: user
          DATABASE_NAME: cli_db
          DATABASE_SCHEMA: "tenant&sslmode="
          DATABASE_SSLMODE: require
      - function: construct_cli_url
        environment:
          database_host: db.example
          database_username: cli user
          database_name: cli_db
      - function: construct_cli_url
        environment: {}
env: {}
compare: {ignore: []}
