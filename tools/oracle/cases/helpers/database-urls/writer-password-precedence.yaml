kind: helper
name: database-urls-writer-password-precedence
call:
  database_urls:
    function: batch
    calls:
      - function: build_writer_url
        settings:
          database_url: postgresql://pinned/db
          database_host: db.example
          database_user: user
          database_name: name
      - function: build_writer_url
        settings:
          database_url: ""
          database_host: db.example
          database_user: user
          database_name: name
      - function: build_writer_url
        settings:
          database_user: user
          database_name: name
      - function: build_writer_url
        settings:
          database_host: db.example
          database_name: name
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user
      - function: build_writer_url
        settings:
          database_host: ""
          database_user: user
          database_name: name
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user
          database_name: name
      - function: build_writer_url
        settings:
          database_host: db.example
          database_user: user
          database_name: name
          database_password: ""
      - function: apply_writer_url
        settings:
          database_host: db.example
          database_user: user
          database_name: name
      - function: apply_writer_url
        settings:
          database_url: postgresql://pinned/db
          database_host: db.example
          database_user: user
          database_name: name
env: {}
compare: {ignore: []}
