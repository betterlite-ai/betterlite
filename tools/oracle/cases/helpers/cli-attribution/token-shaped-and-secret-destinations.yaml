kind: helper
name: token-shaped-and-secret-destinations
call:
  cli_attribution:
    function: build
    claim_map: jwt_claim->jwt_note,short_token->token_hint,long_claim->long_note,long_ok_claim->long_ok_note,list_claim->list_note,label->access_token,label->api_key,label->display_name
    identity:
      id: cli-user
      email: cli@example.com
      first_name: null
      last_name: null
      display_name: null
      picture: https://img.example/p.png
      provider: generic
      team_ids: []
      user_role: null
      extra_fields:
        jwt_claim: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjbGktdXNlciJ9.c2lnbmF0dXJl
        short_token: eyJhbGciOiJIUzI1NiJ9
        long_claim: 
        long_ok_claim: 
        list_claim:
        - 1
        - 2
        label: shown
calls:
- cli_attribution:
    function: flatten
    attribution_metadata:
      profile:
        region: eu
        tier: 2
      jwt_note: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjbGktdXNlciJ9.c2lnbmF0dXJl
      empty: {}
      list_note:
      - 1
- cli_attribution:
    function: poll
    session:
      attribution_metadata:
        profile:
          region: eu
        flag: true
        nothing: null
- cli_attribution:
    function: poll
    session:
      attribution_metadata: text
env:
  CLI_SSO_CLAIM_MAP: jwt_claim->jwt_note,short_token->token_hint,long_claim->long_note,long_ok_claim->long_ok_note,list_claim->list_note,label->access_token,label->api_key,label->display_name
compare:
  ignore: []
