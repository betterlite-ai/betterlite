kind: helper
name: vector-store-registry-named-credentials
call:
  vector_store_registry:
    operation: named_credentials
    stores:
      - vector_store_id: vs_cred
        custom_llm_provider: openai
        litellm_credential_name: cred
    credentials:
      cred:
        api_key: secret-value
    ids: [vs_cred, vs_absent]
calls:
  - vector_store_registry:
      operation: named_credentials
      stores:
        - vector_store_id: vs_empty
          custom_llm_provider: openai
          litellm_credential_name: ""
        - vector_store_id: vs_inline
          custom_llm_provider: openai
          litellm_params:
            api_key: sk-inline-store-key
        - vector_store_id: vs_dup
          custom_llm_provider: openai
          litellm_credential_name: absent
      credentials:
        cred:
          api_key: secret-value
      ids: [vs_empty, vs_inline, vs_dup]
  - vector_store_registry:
      operation: named_credentials
      stores:
        - vector_store_id: vs_dup
          custom_llm_provider: openai
          litellm_credential_name: ""
        - vector_store_id: vs_dup
          custom_llm_provider: openai
          litellm_credential_name: second
      credentials:
        second:
          api_key: second-value
      ids: [vs_dup]
env: {}
compare: {ignore: []}
