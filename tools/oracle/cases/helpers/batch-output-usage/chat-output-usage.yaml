kind: helper
name: chat_output_usage
call:
  batch_output_usage:
    kind: output_usage
    provider: openai
    model_name: gpt-4o
    model_info:
      input_cost_per_token: 1.0
      input_cost_per_token_batches: 0.5
      output_cost_per_token: 0.5
      output_cost_per_token_batches: 0.25
    content:
      kind: lines
      lines:
        - custom_id: chat-1
          response:
            status_code: 200
            body:
              model: gpt-4o
              usage: {prompt_tokens: 10, completion_tokens: 5, total_tokens: 15}
        - custom_id: chat-2
          response:
            status_code: 400
            body: {error: {message: rate limited}}
env: {}
compare: {ignore: []}
