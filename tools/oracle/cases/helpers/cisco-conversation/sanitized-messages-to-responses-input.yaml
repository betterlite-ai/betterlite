kind: helper
name: cisco-sanitized-to-responses
call:
  cisco_conversation:
    function: to_responses
    messages:
      - {role: user, content: text}
      - {role: assistant, content: reply}
      - {content: no role}
      - {role: system, content: [{type: input_text, text: kept}]}
      - {role: user, content: 5}
      - {role: user}
      - not a message
env: {}
compare:
  ignore: []
