kind: helper
name: cisco-flatten-message-array
call:
  cisco_conversation:
    function: flatten
    input:
      - {role: user, content: [{type: input_text, text: x}]}
      - {role: assistant, content: [{type: output_text, text: y}]}
      - {role: null, content: [{type: input_text, text: z}]}
      - {role: user, content: []}
      - skipped
env: {}
compare:
  ignore: []
