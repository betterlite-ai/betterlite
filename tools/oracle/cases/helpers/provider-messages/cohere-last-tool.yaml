kind: helper
name: provider-messages-cohere-last-tool
call:
  provider_messages:
    operation: cohere_messages
    messages:
      - role: user
        content: check the weather
      - role: assistant
        content: null
        tool_calls:
          - id: call_1
            type: function
            function:
              name: get_weather
              arguments: '{"city":"Paris"}'
      - role: tool
        tool_call_id: call_1
        content: '{"temperature":22}'
env: {}
compare:
  ignore: []
