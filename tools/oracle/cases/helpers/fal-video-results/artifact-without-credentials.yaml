kind: helper
name: fal-video-results-artifact-without-credentials
call:
  fal_video_results:
    operation: artifact_without_credentials
    cases:
      - body: '{"video": {"url": "https://cdn.fal.test/out.mp4"}}'
        status: 200
        response_headers: {}
        artifact_status: 200
        artifact_body: "video-bytes"
      - body: '{"video": {"url": "https://cdn.fal.test/out.mp4"}}'
        status: 200
        response_headers:
          authorization: "Bearer queue-key"
          x-api-key: "api-key-1"
          x-request-id: "r-1"
        artifact_status: 200
        artifact_body: "second-bytes"
      - body: '{"video": {"url": "https://cdn.fal.test/missing.mp4"}}'
        status: 200
        response_headers: {}
        artifact_status: 404
        artifact_body: '{"detail": "not found"}'
      - body: '{"video": {"url": "https://cdn.fal.test/broken.mp4"}}'
        status: 200
        response_headers: {}
        artifact_status: 500
        artifact_body: "boom"
      - body: '{"video": {"url": "https://cdn.fal.test/unreachable.mp4"}}'
        status: 200
        response_headers: {}
        artifact_status: null
        artifact_body: ""
      - body: '{"video": {"url": "https://cdn.fal.test/created.mp4"}}'
        status: 201
        response_headers: {}
        artifact_status: 200
        artifact_body: "created-bytes"
      - body: '{"video": {"url": "https://cdn.fal.test/empty.mp4"}}'
        status: 200
        response_headers: {}
        artifact_status: 204
        artifact_body: ""
      - body: '{"video": {"url": "https://cdn.fal.test/a%20b.mp4"}}'
        status: 200
        response_headers: {}
        artifact_status: 200
        artifact_body: "encoded-name"
      - body: '{"video": {"url": "https://cdn.fal.test/typed.mp4", "content_type": "video/mp4"}}'
        status: 200
        response_headers: {}
        artifact_status: 200
        artifact_body: "typed-bytes"
env: {}
compare:
  ignore: []
