kind: helper
name: redis-cluster-node-timeout-isolation
call:
  redis_cluster_node_isolation:
    version: 5.3.1
    has_update_active_connections_for_reconnect: false
    node: node-a
    ttl: 3
    reinitialize_steps: 0
    initialize: false
    read_from_replicas: true
    outcomes:
      - {kind: timeout, node: ""}
env: {}
compare:
  ignore: []
