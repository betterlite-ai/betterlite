kind: helper
name: chirp-stream-records-no-alternative
call:
  chirp_stream_records:
    configure:
      model: chirp_2
      language_codes: [en-US]
      sample_rate_hertz: 16000
    recognizer: projects/project/locations/us-central1/recognizers/_
    billed_before: 0.0
    responses:
      - speech_event_type: SPEECH_EVENT_TYPE_UNSPECIFIED
        results:
          - alternatives: []
            is_final: true
        total_billed_duration: {seconds: 0, nanos: 250000000}
env: {}
compare: {ignore: []}
