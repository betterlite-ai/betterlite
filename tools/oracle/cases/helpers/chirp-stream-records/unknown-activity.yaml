kind: helper
name: chirp-stream-records-unknown-activity
call:
  chirp_stream_records:
    configure:
      model: chirp_2
      language_codes: [en-US]
      sample_rate_hertz: 48000
    recognizer: projects/project/locations/us-central1/recognizers/_
    billed_before: 0.0
    responses:
      - speech_event_type: SPEECH_ACTIVITY_BEGIN
        results: []
        total_billed_duration: {seconds: 0, nanos: 100000000}
      - speech_event_type: SPEECH_EVENT_TYPE_UNSPECIFIED
        results: []
        total_billed_duration: {seconds: 0, nanos: 200000000}
env: {}
compare: {ignore: []}
