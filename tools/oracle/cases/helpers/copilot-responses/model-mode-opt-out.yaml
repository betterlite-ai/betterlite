kind: helper
name: model_mode_opt_out
call:
  copilot_responses:
    settings: {}
    steps:
      - step: supports
        model: dual-chat
        models: {github_copilot/dual-chat: {litellm_provider: github_copilot, mode: chat, supported_endpoints: [/v1/chat/completions, /v1/responses]}}
      - step: supports
        model: mode-responses
        models: {github_copilot/mode-responses: {litellm_provider: github_copilot, mode: responses}}
      - step: capability
env: {}
compare:
  ignore: []
