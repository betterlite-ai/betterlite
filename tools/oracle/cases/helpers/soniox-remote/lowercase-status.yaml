kind: helper
name: soniox-remote-lowercase-status
call:
  soniox_remote:
    calls:
    - function: poll
      auth_headers: {Authorization: "Bearer sk-local", x-client: suite}
      api_base: "https://api.soniox.test"
      transcription_id: job-7
      poll_interval: 0.5
      max_attempts: 2
      timeout_ms: 2500
      answers:
      - {status: 200, headers: {}, body: '{"status": "completed", "text": "hi"}'}
    - function: poll
      auth_headers: {Authorization: "Bearer sk-local"}
      api_base: "https://api.soniox.test"
      transcription_id: job-7
      poll_interval: 0.5
      max_attempts: 1
      timeout_ms: 2500
      answers:
      - {status: 200, headers: {}, body: '{"status": "COMPLETED", "text": "hi"}'}
    - function: poll
      auth_headers: {Authorization: "Bearer sk-local"}
      api_base: "https://api.soniox.test"
      transcription_id: job-7
      poll_interval: 0.5
      max_attempts: 1
      timeout_ms: 2500
      answers:
      - {status: 200, headers: {}, body: '{"text": "hi"}'}
compare: {ignore: []}
env: {}
