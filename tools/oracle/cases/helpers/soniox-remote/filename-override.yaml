kind: helper
name: soniox-remote-filename-override
call:
  soniox_remote:
    calls:
    - function: upload
      auth_headers: {Authorization: "Bearer sk-local"}
      api_base: "https://api.soniox.test"
      filename: audio.mp3
      content: "RIFF-data"
      content_type: audio/mpeg
      filename_override: renamed.mp3
      timeout_ms: 2500
      answers:
      - {status: 200, headers: {}, body: '{"id": "file-1"}'}
    - function: upload
      auth_headers: {Authorization: "Bearer sk-local"}
      api_base: "https://api.soniox.test"
      filename: audio.mp3
      content: "RIFF-data"
      content_type: audio/mpeg
      filename_override: ""
      timeout_ms: 2500
      answers:
      - {status: 200, headers: {}, body: '{"id": "file-2"}'}
compare: {ignore: []}
env: {}
