kind: helper
name: request-model-overrides-prealias-credential-override
call:
  request_model_overrides:
    settings:
      credential_overrides: true
      enforced_params: null
      service_account_params: null
      team_stale_alias_bypass: false
    deployments:
      - model_name: team-target
        model: azure/gpt-4o
        custom_llm_provider: null
        team_id: null
        team_public_model_name: null
      - model_name: public
        model: openai/gpt-4o-mini
        custom_llm_provider: null
        team_id: null
        team_public_model_name: null
      - model_name: bare
        model: gpt-4o
        custom_llm_provider: null
        team_id: null
        team_public_model_name: null
    credentials:
      - name: pre-cred
        values: {api_key: sk-pre, api_base: "https://pre.example", api_version: "2024-01-01"}
      - name: team-cred
        values: {api_key: sk-team}
      - name: proj-cred
        values: {api_base: "https://proj.example"}
      - name: empty-cred
        values: {}
    calls:
      - data: {model: public}
        principal:
          team_id: team-1
          team_model_aliases: {public: team-target}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              public: {azure: {litellm_credentials: pre-cred}}
          project_metadata: null
        premium_user: true
      - data: {model: public}
        principal:
          team_id: team-1
          team_model_aliases: {public: team-target}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              public: {openai: {}}
              defaultconfig: {azure: {litellm_credentials: team-cred}}
          project_metadata: null
        premium_user: true
      - data: {model: public, api_key: sk-client}
        principal:
          team_id: team-1
          team_model_aliases: {public: team-target}
          aliases: {}
          metadata: null
          team_metadata: null
          project_metadata:
            model_config:
              defaultconfig: {azure: {litellm_credentials: proj-cred}}
        premium_user: true
      - data: {model: azure/public}
        principal:
          team_id: team-1
          team_model_aliases: {azure/public: azure/team-target}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              azure/team-target: {azure: {litellm_credentials: team-cred}}
          project_metadata:
            model_config:
              azure/public: {azure: {litellm_credentials: proj-cred}}
        premium_user: true
      - data: {model: x}
        principal:
          team_id: team-1
          team_model_aliases: {}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              defaultconfig: {azure: {litellm_credentials: missing-cred}}
          project_metadata: null
        premium_user: true
      - data: {model: x}
        principal:
          team_id: team-1
          team_model_aliases: {}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              x: {azure: {litellm_credentials: empty-cred}}
          project_metadata: null
        premium_user: true
      - data: {model: bare}
        principal:
          team_id: team-1
          team_model_aliases: {}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              bare:
                azure: {litellm_credentials: pre-cred}
                openai: {litellm_credentials: team-cred}
          project_metadata: null
        premium_user: true
      - data: {model: public}
        principal:
          team_id: team-1
          team_model_aliases: {public: alias-target}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              alias-target:
                azure: {litellm_credentials: pre-cred}
                openai: {litellm_credentials: team-cred}
          project_metadata: null
        premium_user: true
      - data: {model: public}
        principal:
          team_id: team-1
          team_model_aliases: {}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              public: {azure: {litellm_credentials: pre-cred}}
          project_metadata: null
        premium_user: true
      - data: {model: public, api_base: "https://client.example"}
        principal:
          team_id: team-1
          team_model_aliases: {public: team-target}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              defaultconfig: {azure: {litellm_credentials: pre-cred}}
          project_metadata: null
        premium_user: true
      - data: {model: public, api_key: ""}
        principal:
          team_id: team-1
          team_model_aliases: {public: team-target}
          aliases: {}
          metadata: null
          team_metadata:
            model_config:
              defaultconfig: {azure: {litellm_credentials: pre-cred}}
          project_metadata: null
        premium_user: true
env: {}
compare: {ignore: []}
