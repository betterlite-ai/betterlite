kind: helper
name: anthropic-history-group-tool-exchanges
call:
  anthropic_history:
    function: group_tool_exchanges
    messages:
      - {role: assistant, tool_calls: [{id: call-a}]}
      - {role: tool, tool_call_id: call-a}
      - {role: tool, tool_call_id: call-b}
      - {role: user, content: next}
env: {}
compare:
  ignore: []
