kind: helper
name: anthropic-history-missing-result
call:
  anthropic_history:
    function: add_missing_tool_results
    current_index: 0
    current_message:
      role: assistant
      tool_calls:
        - id: call-1
          type: function
          function: {name: lookup, arguments: "{}"}
        - id: call-2
          type: function
          function: {name: search, arguments: "{}"}
    messages:
      - role: assistant
        tool_calls:
          - id: call-1
            type: function
            function: {name: lookup, arguments: "{}"}
          - id: call-2
            type: function
            function: {name: search, arguments: "{}"}
      - role: tool
        tool_call_id: call-1
        content: existing result
      - role: user
        content: continue
env: {}
compare:
  ignore: []
