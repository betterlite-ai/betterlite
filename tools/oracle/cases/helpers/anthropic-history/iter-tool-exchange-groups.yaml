kind: helper
name: anthropic-history-iter-tool-exchange-groups
call:
  anthropic_history:
    function: iter_tool_exchange_groups
    messages:
      - {role: assistant, tool_calls: [{id: call-a}]}
      - {role: tool, tool_call_id: call-a}
