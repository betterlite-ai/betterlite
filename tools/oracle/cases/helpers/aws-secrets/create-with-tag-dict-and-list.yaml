kind: helper
name: aws-secrets-create-with-tag-dict-and-list
env: {}
compare: {ignore: []}
call:
  b4415:
    env:
      AWS_ACCESS_KEY_ID: AKIAORACLEEXAMPLE
      AWS_SECRET_ACCESS_KEY: oracle-secret-key
      AWS_REGION_NAME: us-east-1
    manager: {replica_regions: [], kms_key_id: null}
    routes:
      - route: "POST https://secretsmanager.us-east-1.amazonaws.com"
        replies:
          - {status: 200, body: '{"ARN":"arn:dict"}'}
          - {status: 200, body: '{"ARN":"arn:list"}'}
    steps:
      - {op: async_write_secret, name: prod/dict, value: one, tags: {Environment: Prod, Owner: AI-Platform}}
      - {op: async_write_secret, name: prod/list, value: two, tags: [{Key: Owner, Value: AI-Platform}, {Key: Environment, Value: Prod}]}
