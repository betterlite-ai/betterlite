kind: helper
name: metadata-mint-failure
call:
  b9961:
    model: gemini-2.5-flash
    messages:
      - role: user
        content:
          - {type: text, text: look}
          - {type: image_url, image_url: {url: "gs://my-bucket/private"}}
    litellm_params: {vertex_project: "my-project"}
    metadata: {status: 200, json: {contentType: "image/png"}, body: null, connect: false}
    mint_error: true
env: {}
compare: {ignore: []}
