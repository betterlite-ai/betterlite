kind: helper
name: oidc-token-response-non-json-and-nonobject
call:
  oidc_token_response:
    body: "<html><body>gateway timeout</body></html>"
calls:
  - oidc_token_response:
      body: '{"access_token":'
  - oidc_token_response:
      body: "[1, 2]"
  - oidc_token_response:
      body: '"a token"'
  - oidc_token_response:
      body: "true"
  - oidc_token_response:
      body: "null"
env: {}
compare:
  ignore: []
