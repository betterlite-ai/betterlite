      - {route: "/cost/predict-cache", endpoint_marker: null, path_params: [], team_id: null, deployments: [{model_name: current, litellm_params: {model: "openai/gpt"}, model_info: {id: current-id, team_id: other}}, {model_name: candidate, litellm_params: {model: "openai/gpt"}, model_info: {id: candidate-id, team_id: null}}], current_deployment_id: current-id, candidate_deployment_id: candidate-id}
