kind: helper
name: responses-affinity-selective-history-strip
call:
  responses_affinity:
    model: gpt-group
    healthy_deployments:
      - model_name: gpt-group
        litellm_params:
          model: openai/a
          api_base: https://a.example
          api_key: sk-a
        model_info:
          id: A
    request_kwargs:
      input:
        - type: reasoning
          id: encitem_bGl0ZWxsbTptb2RlbF9pZDpBO2l0ZW1faWQ6cjE=
          encrypted_content: litellm_enc:bW9kZWxfaWQ6QQ==;cipher
        - type: reasoning
          id: encitem_bGl0ZWxsbTptb2RlbF9pZDpCO2l0ZW1faWQ6cjE=
          encrypted_content: litellm_enc:bW9kZWxfaWQ6Qg==;cipher
        - type: reasoning
          id: encitem_bGl0ZWxsbTptb2RlbF9pZDpCO2l0ZW1faWQ6cjE=
          encrypted_content: cipher
          summary:
            - type: summary_text
              text: readable
        - type: message
          role: user
          content: hello
calls:
  - responses_affinity:
      model: gpt-group
      model_list:
        - model_name: gpt-group
          litellm_params:
            model: openai/a
            api_base: https://shared.example
            api_key: sk-shared
          model_info:
            id: A
        - model_name: gpt-group
          litellm_params:
            model: openai/c
            api_base: https://shared.example
            api_key: sk-shared
          model_info:
            id: C
        - model_name: gpt-group
          litellm_params:
            model: openai/d
            api_base: https://other.example
            api_key: sk-shared
          model_info:
            id: D
      healthy_deployments:
        - model_name: gpt-group
          litellm_params:
            model: openai/a
            api_base: https://shared.example
            api_key: sk-shared
          model_info:
            id: A
      request_kwargs:
        input:
          - type: reasoning
            id: encitem_bGl0ZWxsbTptb2RlbF9pZDpBO2l0ZW1faWQ6cjE=
            encrypted_content: litellm_enc:bW9kZWxfaWQ6QQ==;cipher
          - type: reasoning
            id: encitem_bGl0ZWxsbTptb2RlbF9pZDpDO2l0ZW1faWQ6cjE=
            encrypted_content: litellm_enc:bW9kZWxfaWQ6Qw==;cipher
          - type: reasoning
            id: encitem_bGl0ZWxsbTptb2RlbF9pZDpEO2l0ZW1faWQ6cjE=
            encrypted_content: litellm_enc:bW9kZWxfaWQ6RA==;cipher
  - responses_affinity:
      model: gpt-group
      healthy_deployments:
        - model_name: gpt-group
          litellm_params:
            model: openai/a
            api_base: https://a.example
            api_key: sk-a
          model_info:
            id: A
      messages:
        - role: assistant
          content:
            - type: thinking
              thinking: t
              signature: litellm_encrypted_reasoning:litellm_enc:bW9kZWxfaWQ6QQ==;cipher
            - type: thinking
              thinking: t
              signature: litellm_encrypted_reasoning:litellm_enc:bW9kZWxfaWQ6Qg==;cipher
            - type: text
              text: keep
      request_kwargs:
        input: hello
  - responses_affinity:
      model: gpt-group
      healthy_deployments:
        - model_name: gpt-group
          litellm_params:
            model: openai/a
            api_base: https://a.example
            api_key: sk-a
          model_info:
            id: A
      messages: []
      request_kwargs:
        input: hello
        messages:
          - role: assistant
            content:
              - type: redacted_thinking
                data: litellm_encrypted_reasoning:litellm_enc:bW9kZWxfaWQ6QQ==;cipher
              - type: redacted_thinking
                data: litellm_encrypted_reasoning:litellm_enc:bW9kZWxfaWQ6Qg==;cipher
              - type: text
                text: keep
env: {}
compare: {ignore: []}
