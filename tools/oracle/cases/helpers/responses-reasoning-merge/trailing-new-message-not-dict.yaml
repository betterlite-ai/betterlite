kind: helper
name: trailing-new-message-not-dict
call:
  responses_reasoning_merge:
    mode: trailing
    messages:
      - {role: assistant, content: a, tool_calls: [{id: call-1}]}
    new_messages:
      - not-a-dict
env: {}
compare:
  ignore:
    - pointer: /error/class
      why: betterlite raises a typed MergeError where LiteLLM's pydantic adapter raises a ValidationError
    - pointer: /error/message
      why: betterlite writes its own message
