kind: helper
name: url_password_encoding
call:
  b7813:
    calls:
      - {call: url, input: {host: valkey.example.com, port: 6379, password: "p@ss word/", ssl: false}}
      - {call: url, input: {host: valkey.example.com, port: 6379, password: "p@ss:w/rd", ssl: false}}
      - {call: url, input: {host: valkey.example.com, port: 6379, password: "a_b.c-d~e", ssl: false}}
      - {call: url, input: {host: valkey.example.com, port: 6379, password: "a b%c", ssl: false}}
      - {call: url, input: {host: valkey.example.com, port: 6379, password: "a?b#c&d=e", ssl: false}}
      - {call: url, input: {host: valkey.example.com, port: 6379, password: "café", ssl: false}}
env: {}
compare: {ignore: []}
