kind: helper
name: aleph-alpha-control-roles
call:
  aleph_alpha:
    model: luminous-base-control
    messages:
      - role: assistant
        content: First
      - role: system
        content: Rules
      - role: user
        content: Question
      - role: assistant
        content: Answer
    api_base: https://api.aleph-alpha.com/complete
    api_key: sk-aleph
    optional_params: {}
    defaults: {}
    max_tokens: 4096
    created: 1700000000
    reply:
      status: 200
      body: '{"completions":[{"completion":"hello there","finish_reason":"stop"}]}'
env: {}
compare: {ignore: []}
