        generations: {writer: 0, reader: 0}
        reader_unavailable: false
        routing: false
        engine_state: dead
        bump_writer_generation_on_probe: false
        request: {reason: dead_failure, force: true, force_recreate: false, timeout_ms: null, lock_timeout_ms: null}
        stale: null
