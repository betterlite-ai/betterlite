kind: helper
name: custom-prompt-exact-model
call:
  codestral_plan:
    calls:
      - mode: sync
        api_key: sk-codestral
        model: codestral-latest
        messages: [{role: user, content: write}, {role: assistant, content: done}]
        timeout: 12.5
        custom_prompt_dict:
          codestral-latest:
            roles:
              user: {pre_message: "U:", post_message: ""}
              assistant: {pre_message: "A:", post_message: ""}
            initial_prompt_value: "<start>"
            final_prompt_value: "<end>"
            bos_token: "<ignored>"
            eos_token: "<ignored>"
      - mode: sync
        api_key: sk-codestral
        model: codestral-latest
        messages: [{role: user, content: write}]
        timeout: 12.5
        custom_prompt_dict:
          Codestral-Latest:
            roles:
              user: {pre_message: "L:", post_message: ""}
            initial_prompt_value: "<lower>"
            final_prompt_value: "<stop>"
env: {}
compare: {ignore: []}
