kind: helper
name: async-stream-body-and-provider
call:
  codestral_plan:
    calls:
      - mode: async
        api_key: sk-codestral
        model: codestral-latest
        messages: [{role: user, content: write}]
        timeout: 12.5
        optional_params: {stream: true}
      - mode: async
        api_key: sk-codestral
        model: codestral-latest
        messages: [{role: user, content: write}]
        timeout: 12.5
        optional_params: {temperature: 0.3}
env: {}
compare: {ignore: []}
