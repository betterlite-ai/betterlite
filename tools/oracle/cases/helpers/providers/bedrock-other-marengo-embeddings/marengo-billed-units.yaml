kind: helper
name: marengo-billed-units
call:
  bedrock_other_marengo_embeddings:
    marengo_billed_units:
      model: twelvelabs.marengo-embed-2-7-v1:0
      input: [one, two]
      inference:
        input_type: text
      replies:
        - data:
            - embedding: [1.0]
        - data:
            - embedding: [2.0]
            - embedding: [3.0]
            - embedding: [4.0]
env: {}
compare:
  ignore: []
