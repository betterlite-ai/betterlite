kind: helper
name: client-secret-inference
call:
  azure_default_chain:
    infer:
      steps:
        - environment: {AZURE_CLIENT_ID: c, AZURE_CLIENT_SECRET: s, AZURE_TENANT_ID: t}
        - environment: {AZURE_FEDERATED_TOKEN_FILE: /var/run/token}
        - environment: {AZURE_FEDERATED_TOKEN_FILE: /var/run/token, AZURE_CLIENT_ID: partial-client}
        - environment: {AZURE_CLIENT_ID: "", AZURE_CLIENT_SECRET: "", AZURE_TENANT_ID: ""}
        - environment: {AZURE_CLIENT_SECRET: s, AZURE_TENANT_ID: t}
env: {}
compare: {ignore: []}
