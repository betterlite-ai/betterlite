kind: helper
name: credential-constructor-arguments
call:
  azure_default_chain:
    provider:
      steps:
        - environment: {AZURE_CLIENT_ID: c}
          credential: ClientSecretCredential
          scope: null
        - environment: {AZURE_CLIENT_ID: c, AZURE_CLIENT_SECRET: s}
          credential: ClientSecretCredential
          scope: null
        - environment: {}
          credential: ManagedIdentityCredential
          scope: null
        - environment: {AZURE_CLIENT_ID: c, AZURE_TENANT_ID: t}
          credential: CertificateCredential
          scope: null
        - environment: {AZURE_CLIENT_ID: c, AZURE_TENANT_ID: t, AZURE_CERTIFICATE_PATH: /certs/pem}
          credential: CertificateCredential
          scope: null
        - environment: {AZURE_CLIENT_ID: c, AZURE_TENANT_ID: t, AZURE_CERTIFICATE_PATH: /certs/pem, AZURE_CERTIFICATE_PASSWORD: pw}
          credential: CertificateCredential
          scope: null
        - environment: {AZURE_CLIENT_ID: "", AZURE_CLIENT_SECRET: "", AZURE_TENANT_ID: ""}
          credential: ClientSecretCredential
          scope: null
env: {}
compare: {ignore: []}
