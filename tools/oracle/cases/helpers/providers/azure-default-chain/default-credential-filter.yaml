kind: helper
name: default-credential-filter
call:
  azure_default_chain:
    chain:
      steps:
        - environment: {AZURE_CLIENT_ID: c, AZURE_CLIENT_SECRET: s, AZURE_TENANT_ID: t}
          credential: DefaultAzureCredential
          scope: https://cognitiveservices.azure.com/.default
        - environment: {AZURE_CLIENT_ID: c, AZURE_CLIENT_SECRET: s, AZURE_TENANT_ID: t, AZURE_TOKEN_CREDENTIALS: " PROD "}
          credential: DefaultAzureCredential
          scope: https://cognitiveservices.azure.com/.default
        - environment: {AZURE_CLIENT_ID: c, AZURE_CLIENT_SECRET: s, AZURE_TENANT_ID: t, AZURE_TOKEN_CREDENTIALS: environmentcredential}
          credential: DefaultAzureCredential
          scope: https://cognitiveservices.azure.com/.default
        - environment: {AZURE_CLIENT_ID: wl, AZURE_TENANT_ID: wt, AZURE_FEDERATED_TOKEN_FILE: /var/run/token, AZURE_TOKEN_CREDENTIALS: workloadidentitycredential}
          credential: DefaultAzureCredential
