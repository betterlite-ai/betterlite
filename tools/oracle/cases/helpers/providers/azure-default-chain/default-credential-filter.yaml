        - environment: {AZURE_TOKEN_CREDENTIALS: managedidentitycredential}
          credential: DefaultAzureCredential
          scope: https://cognitiveservices.azure.com/.default
        - environment: {AZURE_TOKEN_CREDENTIALS: bogus}
          credential: DefaultAzureCredential
          scope: https://cognitiveservices.azure.com/.default
