kind: helper
name: generic-credential-constructor
call:
  azure_default_chain:
    provider:
      steps:
        - environment: {AZURE_CLIENT_ID: wl, AZURE_TENANT_ID: wt, AZURE_FEDERATED_TOKEN_FILE: /var/run/token}
          credential: WorkloadIdentityCredential
          scope: null
        - environment: {}
          credential: WorkloadIdentityCredential
          scope: null
        - environment: {}
          credential: UsernamePasswordCredential
          scope: null
env: {}
compare: {ignore: []}
