kind: helper
name: explicit-credential
call:
  azure_default_chain:
    provider:
      steps:
        - environment: {AZURE_CREDENTIAL: ClientSecretCredential, AZURE_CLIENT_ID: explicit-client, AZURE_CLIENT_SECRET: explicit-secret, AZURE_TENANT_ID: explicit-tenant, AZURE_CERTIFICATE_PATH: /certs/explicit.pem, AZURE_CERTIFICATE_PASSWORD: explicit-pass}
          credential: CertificateCredential
          scope: null
        - environment: {AZURE_CREDENTIAL: ManagedIdentityCredential, AZURE_CLIENT_ID: env-client}
          credential: null
          scope: null
        - environment: {AZURE_CREDENTIAL: "", AZURE_CLIENT_ID: inferred-client, AZURE_CLIENT_SECRET: inferred-secret, AZURE_TENANT_ID: inferred-tenant}
          credential: null
          scope: null
        - environment: {AZURE_CREDENTIAL: ManagedIdentityCredential, AZURE_CLIENT_ID: scope-client, AZURE_SCOPE: env-scope}
          credential: null
          scope: null
        - environment: {AZURE_CREDENTIAL: ManagedIdentityCredential, AZURE_CLIENT_ID: scope-client, AZURE_SCOPE: env-scope}
          credential: null
          scope: ""
        - environment: {AZURE_CREDENTIAL: ManagedIdentityCredential, AZURE_CLIENT_ID: scope-client, AZURE_SCOPE: env-scope}
          credential: null
          scope: explicit-scope
        - environment: {AZURE_CREDENTIAL: ManagedIdentityCredential, AZURE_CLIENT_ID: scope-client, AZURE_SCOPE: ""}
          credential: null
          scope: null
env: {}
compare: {ignore: []}
