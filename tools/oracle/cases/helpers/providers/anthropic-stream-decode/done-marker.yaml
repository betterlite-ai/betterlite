kind: helper
name: anthropic-stream-decode-done-marker
call:
  anthropic_stream_decode:
    ids: ["01234567-89ab-4def-8123-456789abcdef"]
    steps:
      - function: text
        value: 'data: {"type":"message_stop"}'
      - function: text
        value: 'data:{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"d"}}'
      - function: text
        value: 'data: [DONE]'
      - function: text
        value: 'data:{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"e"}}'
      - function: text
        value: 'data: [DONE]'
    passthrough: []
env: {}
compare: {ignore: []}
