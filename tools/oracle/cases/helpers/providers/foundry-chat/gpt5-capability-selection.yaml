kind: helper
name: foundry-chat-gpt5-capability-selection
call:
  foundry_chat:
    model_cost:
      azure_ai/gpt-5: {litellm_provider: azure_ai, mode: chat, supports_tool_choice: true, supports_none_reasoning_effort: true}
      gpt-5: {litellm_provider: openai, mode: chat, supports_tool_choice: true, supports_none_reasoning_effort: true}
      azure_ai/gpt-5-mini: {litellm_provider: azure_ai, mode: chat, supports_tool_choice: true, supports_none_reasoning_effort: false}
      gpt-5-mini: {litellm_provider: openai, mode: chat, supports_tool_choice: true, supports_none_reasoning_effort: false}
      azure_ai/gpt-4o: {litellm_provider: azure_ai, mode: chat, supports_tool_choice: false}
      gpt-4o: {litellm_provider: openai, mode: chat, supports_tool_choice: true}
      azure_ai/grok-4: {litellm_provider: azure_ai, mode: chat, supports_tool_choice: true}
      azure_ai/grok-3: {litellm_provider: azure_ai, mode: chat, supports_tool_choice: true}
    chat_models: [gpt-5, gpt-5-mini, gpt-4o, grok-4, grok-3]
    text_models: []
    supported: [gpt-5, gpt-5-mini, grok-4, grok-3]
    maps:
      - {model: gpt-5, non_default: {temperature: 0.5}, optional: {}, drop_params: false, global_drop_params: false}
      - {model: gpt-5, non_default: {temperature: 0.5}, optional: {}, drop_params: true, global_drop_params: false}
      - {model: gpt-5, non_default: {max_tokens: 64, temperature: 1, reasoning_effort: {effort: none}}, optional: {}, drop_params: false, global_drop_params: false}
      - {model: gpt-5, non_default: {reasoning_effort: low, logprobs: true}, optional: {}, drop_params: false, global_drop_params: false}
      - {model: gpt-5, non_default: {reasoning_effort: low, logprobs: true}, optional: {}, drop_params: true, global_drop_params: false}
      - {model: gpt-4o, non_default: {temperature: 0.5, tool_choice: auto, stop: [x], user: u, nonsense: 1}, optional: {}, drop_params: false, global_drop_params: false}
      - {model: grok-4, non_default: {stop: [x], temperature: 0.3}, optional: {}, drop_params: false, global_drop_params: false}
      - {model: gpt-5-mini, non_default: {temperature: 0.5, logprobs: true}, optional: {}, drop_params: false, global_drop_params: true}
env: {}
compare: {ignore: []}
