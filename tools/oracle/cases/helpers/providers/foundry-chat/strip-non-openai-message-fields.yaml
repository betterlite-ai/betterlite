kind: helper
name: foundry-chat-strip-non-openai-message-fields
call:
  foundry_chat:
    model_cost: {}
    chat_models: []
    text_models: []
    requests:
      - model: mistral-large
        optional: {}
        messages:
          - role: assistant
            content:
              - {type: thinking, thinking: t}
              - {type: text, text: answer}
            thinking_blocks:
              - {type: thinking}
            reasoning_content: r
            provider_specific_fields: {x: 1}
            cache_control: {type: ephemeral}
      - model: mistral-large
        optional: {}
        messages:
          - role: user
            content:
              - {type: text, text: a}
              - {type: text, text: b}
            nested: {cache_control: {type: ephemeral}, keep: 1}
      - model: mistral-large
        optional: {}
        messages:
          - role: tool
            content:
              - {type: text, text: r}
            tool_call_id: call-1
            name: f
      - model: mistral-large
        optional: {}
        messages:
          - role: user
            content: hi
            search_results:
              - title: T
                content:
                  - {type: text, text: C}
env: {}
compare: {ignore: []}
