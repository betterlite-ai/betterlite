          environment: {ANTHROPIC_API_KEY: sk-factory-environment}
          reply: {status: 200, body: '{"input_tokens":3}'}
        - models: [claude-3-5-sonnet-20241022]
          providers: [anthropic, azure_ai]
          messages: [{role: user, content: hi}]
          environment: {ANTHROPIC_API_KEY: sk-factory-environment}
          reply: {status: 200, body: '{"input_tokens":5}'}
env: {}
compare: {ignore: []}
