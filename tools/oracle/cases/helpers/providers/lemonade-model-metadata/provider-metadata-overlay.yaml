kind: helper
name: lemonade-model-metadata-provider-metadata-overlay
call:
  lemonade_model_metadata:
    operation: provider_entry
    model_infos:
      - provider_specific_entry: {kept: true, context_window: 1}
        recipe_options: {ctx_size: 4}
        context_window: null
      - max_context_window: 64
        provider_specific_entry: text
      - provider_specific_entry: {}
      - provider_specific_entry: null
      - provider_specific_entry: {recipe_options: {ctx_size: 1}}
        context_window: 2
        max_context_window: 3
      - provider_specific_entry: {context_window: 9, max_context_window: 10}
        context_window: 11
      - recipe_options: null
        max_context_window: {nested: [1, 2]}
env: {}
compare: {ignore: []}
