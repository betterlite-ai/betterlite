kind: helper
name: openai-evals-eval-create-update
call:
  openai_evals:
    eval_create_update:
      probes:
        - create:
            name: null
            data_source_config:
              type: custom
              item_schema:
                role: string
                required: false
                count: 0
                note: null
                tags: []
              include_sample_schema: false
            testing_criteria:
              - {type: llm_as_judge, model: gpt-4o}
              - {type: custom, function_id: fn-1}
              - {type: ground_truth, metric: f1_score}
            metadata: {team: ml, flag: false, count: 0, tags: [], note: null}
          headers: {X-Unused: kept}
        - create:
            name: ''
            data_source_config: {type: logs}
            testing_criteria: []
            metadata: {}
        - update:
            name: null
            metadata: {a: 1, b: null}
          eval_id: eval/1
          api_base: https://fixture.test
          headers: {X-Custom: kept, Authorization: 'Bearer original'}
        - update:
            name: renamed
          eval_id: eval-2
          api_base: https://fixture.test
        - create_run:
            data_source:
              type: inline
              samples:
                - {input: null, ok: false, count: 0}
            name: null
            metadata: {run: 1, note: null}
          eval_id: eval-3
          litellm_params: {api_base: 'https://runs.test/v1'}
        - create_run:
            data_source: {}
          eval_id: eval/4
env: {}
compare: {ignore: []}
