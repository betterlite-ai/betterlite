kind: helper
name: bedrock-credentials-non-irsa-assume-role
call:
  bedrock_credentials:
    auth_with_aws_role:
      environment:
        AWS_ACCESS_KEY_ID: ambient
        AWS_SECRET_ACCESS_KEY: ambient-secret
        AWS_EC2_METADATA_DISABLED: 'true'
      steps:
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: bedrock
            aws_access_key_id: explicit-key
            aws_secret_access_key: explicit-secret
            aws_session_token: explicit-token
            aws_external_id: external-1
            aws_session_tags:
              - {Key: team, Value: genai}
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: bedrock
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: bedrock
      answers:
        assume_role:
          - credentials: {access_key_id: ASIAEXPLICIT, secret_access_key: explicit-secret, session_token: explicit-token, expiration: '2026-01-01T01:00:00Z'}
          - credentials: {access_key_id: ASIADEFAULT, secret_access_key: default-secret, session_token: default-token, expiration: '2026-01-01T01:00:00.5Z'}
          - credentials: {access_key_id: ASIANEGATIVE, secret_access_key: negative-secret, session_token: negative-token, expiration: '2025-12-31T23:59:00Z'}
env: {}
compare: {ignore: []}
