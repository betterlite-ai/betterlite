kind: helper
name: bedrock-credentials-irsa-branch-and-failure
call:
  bedrock_credentials:
    auth_with_aws_role:
      environment:
        AWS_ROLE_ARN: 'arn:aws:iam::123456789012:role/IrsaRole'
        AWS_WEB_IDENTITY_TOKEN_FILE: /var/run/secrets/token
        AWS_ACCESS_KEY_ID: ambient
        AWS_SECRET_ACCESS_KEY: ambient-secret
        AWS_EC2_METADATA_DISABLED: 'true'
      files:
        /var/run/secrets/token: "irsa-token\n"
      steps:
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/IrsaRole'
            aws_session_name: bedrock
        - params:
            aws_role_name: 'arn:aws:iam::999999999999:role/TargetRole'
            aws_session_name: bedrock
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/IrsaRole'
            aws_session_name: bedrock
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/IrsaRole'
            aws_session_name: bedrock
            aws_access_key_id: explicit-key
            aws_secret_access_key: explicit-secret
      answers:
        get_caller_identity:
          - error: {status: 403, code: AccessDenied, message: the fixture identity call is denied}
          - error: {status: 403, code: AccessDenied, message: the fixture identity call is denied}
          - error: {status: 403, code: AccessDenied, message: the fixture identity call is denied}
        assume_role_with_web_identity:
          - credentials: {access_key_id: ASIAIRSA, secret_access_key: irsa-secret, session_token: irsa-session, expiration: '2026-01-01T00:30:00Z'}
        assume_role:
          - credentials: {access_key_id: ASIASAME, secret_access_key: same-secret, session_token: same-session, expiration: '2026-01-01T01:00:00Z'}
          - credentials: {access_key_id: ASIACROSS, secret_access_key: cross-secret, session_token: cross-session, expiration: '2026-01-01T01:00:00Z'}
          - error: {status: 403, code: AccessDenied, message: "User: arn:aws:iam::123456789012:role/IrsaRole is not authorized to perform: sts:AssumeRole on resource: arn:aws:iam::123456789012:role/IrsaRole"}
          - credentials: {access_key_id: ASIAEXPLICIT, secret_access_key: explicit-secret, session_token: explicit-session, expiration: '2026-01-01T01:00:00Z'}
env: {}
compare: {ignore: []}
