kind: helper
name: bedrock-credentials-credentials-cache-key-isolation
call:
  bedrock_credentials:
    get_credentials:
      environment:
        AWS_ACCESS_KEY_ID: ambient
        AWS_SECRET_ACCESS_KEY: ambient-secret
        AWS_EC2_METADATA_DISABLED: 'true'
      steps:
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: one
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: one
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: one
            aws_profile_name: another
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: one
          ssl_verify: true
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: one
          ssl_verify: true
      answers:
        get_caller_identity:
          - error: {status: 403, code: AccessDenied, message: the fixture identity call is denied}
          - error: {status: 403, code: AccessDenied, message: the fixture identity call is denied}
          - error: {status: 403, code: AccessDenied, message: the fixture identity call is denied}
        assume_role:
          - credentials: {access_key_id: ASIAONE, secret_access_key: role-secret, session_token: role-token, expiration: '2026-01-01T01:00:00Z'}
          - credentials: {access_key_id: ASIATWO, secret_access_key: role-secret, session_token: role-token, expiration: '2026-01-01T01:00:00Z'}
          - credentials: {access_key_id: ASIATHREE, secret_access_key: role-secret, session_token: role-token, expiration: '2026-01-01T01:00:00Z'}
env: {}
compare: {ignore: []}
