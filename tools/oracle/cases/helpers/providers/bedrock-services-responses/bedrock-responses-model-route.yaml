kind: helper
name: bedrock-responses-model-route
call:
  bedrock_services_responses:
    bedrock_responses_model_route:
      - model: openai.served
        model_cost:
          openai.served: {supported_endpoints: [/v1/responses, /v1/chat/completions]}
      - model: openai.prefixed
        model_cost:
          bedrock/openai.prefixed: {supported_endpoints: [/v1/responses]}
      - model: chat_completions/openai.served
        model_cost:
          openai.served: {supported_endpoints: [/v1/responses]}
      - model: chat_completions/chat_completions/openai.served
        model_cost:
          openai.served: {supported_endpoints: [/v1/responses]}
      - model: chat_completions/openai.nested
        model_cost:
          chat_completions/openai.nested: {supported_endpoints: [/v1/responses]}
      - model: openai.chat-only
        model_cost:
          openai.chat-only: {supported_endpoints: [/v1/chat/completions]}
      - model: openai.unknown
      - model: chat_completions/
      - model: ""
      - model: null
env: {}
compare: {ignore: []}
