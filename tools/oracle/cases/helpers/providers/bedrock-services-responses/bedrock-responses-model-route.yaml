kind: helper
name: bedrock-responses-model-route
call:
  bedrock_services_responses:
    bedrock_responses_model_route:
      # model_cost mirrors the entries LiteLLM's local model map holds for these names; the Rust side reads only it
      - model: us.openai.gpt-5.6-sol
        model_cost:
          us.openai.gpt-5.6-sol: {supported_endpoints: [/v1/responses, /v1/chat/completions]}
      - model: chat_completions/us.openai.gpt-5.6-sol
        model_cost:
          us.openai.gpt-5.6-sol: {supported_endpoints: [/v1/responses, /v1/chat/completions]}
      - model: chat_completions/chat_completions/us.openai.gpt-5.6-sol
        model_cost:
          us.openai.gpt-5.6-sol: {supported_endpoints: [/v1/responses, /v1/chat/completions]}
      - model: writer.palmyra-x4-v1:0
      - model: openai.unknown
      - model: chat_completions/
      - model: ""
      - model: null
env: {}
compare: {ignore: []}
