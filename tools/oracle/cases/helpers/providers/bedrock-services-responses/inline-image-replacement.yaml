kind: helper
name: inline-image-replacement
call:
  bedrock_services_responses:
    inline_image_replacement:
      - input: "http://a.example/1.png"
        inlined: {"http://a.example/1.png": "data:image/png;base64,QQ=="}
      - input:
          - type: message
            role: user
            content:
              - {type: input_image, detail: auto, image_url: "http://a.example/1.png"}
        inlined: {}
      - input:
          - type: message
            role: user
            content:
              - {image_url: "http://a.example/1.png", type: input_image, detail: auto}
              - {type: input_file, file_url: "http://a.example/1.png"}
              - {type: input_image, detail: auto, image_url: "s3://bucket/key.png"}
              - {type: input_image, detail: auto, image_url: "HTTP://a.example/1.png"}
          - type: computer_call_output
            call_id: c
            output: {type: computer_screenshot, image_url: "https://b.example/2.png"}
          - type: function_call_output
            call_id: d
            output:
              - {type: input_image, detail: auto, image_url: "https://b.example/2.png"}
          - type: message
            role: user
            content: "http://a.example/1.png"
        inlined:
          "http://a.example/1.png": "data:image/png;base64,QQ=="
          "https://b.example/2.png": "data:image/png;base64,Qg=="
      - input:
          - type: message
            role: user
            content:
              - {type: input_image, detail: auto, image_url: "http://a.example/1.png"}
        inlined: {"http://other.example/x.png": "data:image/png;base64,QQ=="}
env: {}
compare: {ignore: []}
