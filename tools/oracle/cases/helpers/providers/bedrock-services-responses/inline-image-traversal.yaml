kind: helper
name: inline-image-traversal
call:
  bedrock_services_responses:
    inline_image_traversal:
      - input: just text
      - input: []
      - input:
          - type: message
            role: user
            content:
              - {type: input_text, text: hi}
              - {type: input_image, detail: auto, image_url: "http://a.example/1.png"}
              - {type: input_image, detail: auto, image_url: "https://b.example/2.png"}
              - {type: input_image, detail: auto, image_url: "http://a.example/1.png"}
              - {type: input_image, detail: auto, image_url: "HTTP://upper.example/x.png"}
              - {type: input_image, detail: auto, image_url: "s3://bucket/key.png"}
              - {type: input_image, detail: auto, image_url: "data:image/png;base64,AAAA"}
              - {type: input_image, detail: auto, file_id: file-1}
