kind: helper
name: openai-image-generation-image-raw-response-headers
call:
  openai_image_generation:
    function: image_raw_response_headers
    probes:
      - model: dall-e-2
        prompt: a cat
        optional_params: {}
        api_key: sk-test
        api_base: https://example.test/v1
        timeout: 30
        reply:
          status: 200
          headers: {x-request-id: req-1, openai-processing-ms: '42'}
          body: '{"created":1700000000,"data":[{"url":"https://example.test/a.png"}]}'
      - model: gpt-image-1
        prompt: a dog
        optional_params: {output_format: png}
        api_key: sk-test
        api_base: https://example.test/v1
        timeout: 45
        is_async: true
        reply:
          status: 200
          headers: {x-request-id: req-2, openai-processing-ms: '17'}
          body: '{"created":1700000000,"data":[{"b64_json":"YQ=="}]}'
env: {}
compare: {ignore: []}
