kind: helper
name: openai-image-generation-missing-created
call:
  openai_image_generation:
    function: missing_created
    probes:
      - model: dall-e-2
        prompt: a cat
        optional_params: {}
        reply: {status: 200, body: '{"data":[{"url":"https://example.test/a.png"}]}'}
      - model: dall-e-2
        prompt: a dog
        optional_params: {}
        reply: {status: 200, body: '{"created":null,"data":[]}'}
      - model: dall-e-2
        prompt: a bird
        optional_params: {}
        reply: {status: 200, body: '{"created":123,"data":[]}'}
env: {}
compare: {ignore: []}
