kind: helper
name: openai-image-generation-unsupported-image-param
call:
  openai_image_generation:
    function: unsupported_image_param
    probes:
      - model: dall-e-2
        existing_params: {quality: low}
        non_default_params: {n: 2, style: vivid}
        drop_params: false
      - model: dall-e-2
        existing_params: {style: natural}
        non_default_params: {style: vivid}
        drop_params: false
      - model: dall-e-2
        existing_params: {}
        non_default_params: {style: vivid}
        drop_params: true
      - model: dall-e-3
        existing_params: {}
        non_default_params: {style: vivid, n: 1}
        drop_params: false
env: {}
compare: {ignore: []}
