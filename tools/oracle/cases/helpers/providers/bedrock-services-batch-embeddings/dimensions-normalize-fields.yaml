        {litellm_provider: bedrock, mode: embedding, provider_specific_entry: {bedrock_invocation_schema: titan_v2}}
    model: "amazon.titan-embed-text-v2:0"
    body:
      model: "amazon.titan-embed-text-v2:0"
      input: hello
