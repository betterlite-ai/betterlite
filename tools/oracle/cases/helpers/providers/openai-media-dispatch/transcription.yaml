kind: helper
name: transcription
call:
  openai_media_dispatch:
    case: transcription
    api_base: https://mock.example/v1
    model: whisper-1
    family: whisper
    options:
      language: en
    status: 200
    reply: '{"text": "hello world"}'
calls:
  - openai_media_dispatch:
      case: transcription
      api_base: https://mock.example/v1
      model: gpt-4o-transcribe
      family: gpt
      options:
        language: en
        prompt: a greeting
        response_format: json
      status: 200
      reply: '{"text": "hi there", "language": "en"}'
  - openai_media_dispatch:
      case: transcription
      api_base: https://mock.example/v1
      model: whisper-1
      family: whisper
      options: {}
      status: 400
      reply: '{"error": {"message": "bad audio", "type": "invalid_request_error", "param": "file",
        "code": null}}'
env: {}
compare: {ignore: []}
