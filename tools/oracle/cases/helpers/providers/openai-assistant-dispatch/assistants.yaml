kind: helper
name: openai-assistant-dispatch-assistants
call:
  openai_assistant_dispatch:
    kind: assistants
    operation: async_list
    api_base: https://example.test/v1
    api_key: sk-fixture
    params: {order: asc, limit: 5, before: b1, after: a1}
    aget_assistants: null
    replies:
      - status: 200
        body:
          object: list
          data:
            - {id: asst_1, object: assistant, created_at: 1, model: gpt-4o, tools: []}
          first_id: asst_1
          last_id: asst_1
          has_more: false
calls:
  - openai_assistant_dispatch:
      kind: assistants
      operation: async_list
      api_base: https://example.test/v1
      api_key: sk-fixture
      params: {order: asc, limit: 5, before: b1, after: a1}
      aget_assistants: true
      replies:
        - status: 200
          body:
            object: list
            data:
              - {id: asst_1, object: assistant, created_at: 1, model: gpt-4o, tools: []}
            first_id: asst_1
            last_id: asst_1
            has_more: false
  - openai_assistant_dispatch:
      kind: assistants
      operation: async_list
      api_base: https://example.test/v1
      api_key: sk-fixture
      params: {order: desc, limit: 20, before: null, after: null}
      aget_assistants: false
      replies:
        - status: 200
          body:
            object: list
            data:
              - {id: asst_1, object: assistant, created_at: 1, model: gpt-4o, tools: []}
            first_id: asst_1
            last_id: asst_1
            has_more: false
  - openai_assistant_dispatch:
      kind: assistants
      operation: create
      api_base: https://example.test/v1
      api_key: sk-fixture
      data: {model: gpt-4o, name: helper}
      replies:
        - status: 200
          body: {id: asst_1, object: assistant, created_at: 1, model: gpt-4o, name: helper, tools: []}
  - openai_assistant_dispatch:
      kind: assistants
      operation: delete
      api_base: https://example.test/v1
      api_key: sk-fixture
      assistant_id: "a/b c"
      replies:
        - status: 200
          body: {id: asst_1, deleted: true, object: assistant.deleted}
  - openai_assistant_dispatch:
      kind: assistants
      operation: create
      api_base: https://example.test/v1
      api_key: sk-fixture
      data: {model: gpt-4o, name: helper}
      replies:
        - status: 404
          body:
            error: {message: no such model, type: invalid_request_error, param: model, code: model_not_found}
env: {}
compare: {ignore: []}
