  - bedrock_services_batch_call:
      operation: model_job_status
      batch_id: "arn:aws:bedrock:eu-west-1:123456789012:model-invocation-job/job-1"
      region: eu-west-1
      credentials: {access_key_id: AKIDEXAMPLE, secret_access_key: wJalrXUtnFEMI/K7MDENG+bPxRfiCYEXAMPLEKEY}
      replies:
        - {status: 500, headers: {}, body: '{"code":"InternalServerException"}'}
