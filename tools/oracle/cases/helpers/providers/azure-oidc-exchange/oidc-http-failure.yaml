kind: helper
name: oidc-http-failure
call:
  azure_oidc_exchange:
    steps:
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant, OIDC_ASSERTION: assertion-value}
        calls:
          - azure_ad_token: os.environ/OIDC_ASSERTION
        replies:
          - {status: 400, body: '{"error":"invalid_client"}'}
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant, OIDC_ASSERTION: assertion-value}
        calls:
          - azure_ad_token: os.environ/OIDC_ASSERTION
        replies:
          - {status: 201, body: '{"access_token":"tok-value","expires_in":3600}'}
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant, OIDC_ASSERTION: assertion-value}
        calls:
          - azure_ad_token: os.environ/OIDC_ASSERTION
        replies:
          - {status: 500, body: unexpected}
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant, OIDC_ASSERTION: assertion-value}
        calls:
          - azure_ad_token: os.environ/OIDC_ASSERTION
        replies:
          - {status: 200, body: not json}
env: {}
compare: {ignore: []}
