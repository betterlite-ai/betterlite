kind: helper
name: expired-token-refresh
call:
  azure_oidc_exchange:
    steps:
      - environment: {OIDC_ASSERTION: assertion-value}
        calls:
          - {azure_ad_token: os.environ/OIDC_ASSERTION, azure_client_id: client, azure_tenant_id: tenant}
          - {azure_ad_token: os.environ/OIDC_ASSERTION, azure_client_id: client, azure_tenant_id: tenant, advance: 3600}
          - {azure_ad_token: os.environ/OIDC_ASSERTION, azure_client_id: client, azure_tenant_id: tenant, advance: 1}
        replies:
          - {status: 200, body: '{"access_token":"first","expires_in":3600}'}
          - {status: 200, body: '{"access_token":"second","expires_in":3600}'}
env: {}
compare: {ignore: []}
