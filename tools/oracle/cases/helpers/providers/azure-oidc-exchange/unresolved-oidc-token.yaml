kind: helper
name: unresolved-oidc-token
call:
  azure_oidc_exchange:
    steps:
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant}
        calls:
          - azure_ad_token: os.environ/MISSING
        replies: []
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant}
        calls:
          - azure_ad_token: plain-token
        replies: []
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant}
        calls:
          - azure_ad_token: ''
        replies: []
      - environment: {AZURE_CLIENT_ID: client, AZURE_TENANT_ID: tenant, OIDC_ASSERTION: ''}
        calls:
          - azure_ad_token: os.environ/OIDC_ASSERTION
        replies:
          - {status: 200, body: '{"access_token":"tok-value","expires_in":3600}'}
env: {}
compare: {ignore: []}
