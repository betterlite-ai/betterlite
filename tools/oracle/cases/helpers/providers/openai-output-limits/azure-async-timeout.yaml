kind: helper
name: output-limits-azure-async-timeout
call:
  openai_output_limits:
    azure:
      asynchronous: true
      data: {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "hello world"}]}
      timeout: 2.5
      outcome:
        kind: timeout
env: {}
compare:
  ignore:
    - pointer: /error/message
      why: "LiteLLM appends its own wall-clock elapsed time and Python's float repr; betterlite renders both with a fixed two-decimal format"
