kind: helper
name: openai-chat-content-string-image-url
call:
  openai_chat_content:
    transform_requests:
      requests:
        - model: gpt-4o
          provider: openai
          messages:
            - role: user
              content:
                - type: image_url
                  image_url: https://example.com/cat.png
                - type: image_url
                  image_url:
                    url: https://example.com/dog.png
                    detail: high
                    format: png
                - type: file
                  file:
                    file_data: data:application/pdf;base64,JVBERi0=
                    format: pdf
env: {}
compare: {ignore: []}
