kind: helper
name: openai-chat-content-system-messages-first
call:
  openai_chat_content:
    transform_requests:
      requests:
        - model: gpt-4.1
          provider: openai
          messages:
            - {role: user, content: first turn}
            - {role: system, content: sys 1}
            - {role: assistant, content: reply}
            - {role: developer, content: dev}
            - {role: user, content: second turn}
            - {role: system, content: sys 2}
        - model: gpt-4.1
          provider: openai
          system_messages_first: true
          messages:
            - {role: user, content: first turn}
            - {role: system, content: sys 1}
            - {role: assistant, content: reply}
            - {role: developer, content: dev}
            - {role: user, content: second turn}
            - {role: system, content: sys 2}
        - model: gpt-4.1
          provider: azure
          system_messages_first: true
          messages:
            - {role: user, content: first turn}
            - {role: system, content: sys 1}
            - {role: assistant, content: reply}
            - {role: developer, content: dev}
            - {role: user, content: second turn}
            - {role: system, content: sys 2}
        - model: deepseek-chat
          provider: deepseek
          system_messages_first: true
          messages:
            - {role: user, content: first turn}
            - {role: system, content: sys 1}
            - {role: assistant, content: reply}
            - {role: developer, content: dev}
            - {role: user, content: second turn}
            - {role: system, content: sys 2}
        - model: gpt-4.1
          provider: openai
          system_messages_first: false
          messages:
            - {role: user, content: first turn}
            - {role: system, content: sys 1}
            - {role: assistant, content: reply}
            - {role: developer, content: dev}
            - {role: user, content: second turn}
            - {role: system, content: sys 2}
env: {}
compare: {ignore: []}
