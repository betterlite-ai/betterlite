kind: helper
name: openai-chat-content-remote-url-current-rejection
call:
  openai_chat_content:
    transform_requests:
      requests:
        - model: gpt-4o
          provider: openai
          messages:
            - role: user
              content:
                - type: file
                  file:
                    file_id: https://example.com/report
        - model: gpt-4o
          provider: openai
          messages:
            - role: user
              content:
                - type: file
                  file:
                    file_id: http://example.com/report.pdf
        - model: gpt-4o
          provider: openai
          messages:
            - role: user
              content:
                - type: file
                  file:
                    file_id: www.example.com/report
        - model: gpt-4o
          provider: openai
          messages:
            - role: user
              content:
                - type: image_url
                  image_url:
                    url: http://example.com/image.png
                    detail: auto
        - model: gpt-4o
          provider: openai
          messages:
            - role: user
              content:
                - type: file
                  file:
                    file_id: file-abc123
                - type: file
                  file:
                    file_id: data:application/pdf;base64,JVBERi0=
env:
  MAX_IMAGE_URL_DOWNLOAD_SIZE_MB: "0"
compare: {ignore: []}
