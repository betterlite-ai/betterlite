        input_file_id: s3://in-bucket/in.jsonl
        litellm_params:
          aws_batch_role_arn: arn:aws:iam::111:role/batch
          s3_output_bucket_name: ""
        environment:
          AWS_S3_OUTPUT_BUCKET_NAME: env-bucket
      - model: m
        input_file_id: s3://in-bucket/in.jsonl
        litellm_params:
          aws_batch_role_arn: arn:aws:iam::111:role/batch
        optional_params:
          s3_output_bucket_name: request-bucket
        environment:
          AWS_S3_OUTPUT_BUCKET_NAME: env-bucket
      - model: m
        input_file_id: s3://in-bucket/in.jsonl
        litellm_params:
          aws_batch_role_arn: arn:aws:iam::111:role/batch
        environment:
          AWS_S3_OUTPUT_BUCKET_NAME: env-bucket
      - model: m
        input_file_id: s3://in-bucket/in.jsonl
        litellm_params:
          aws_batch_role_arn: arn:aws:iam::111:role/batch
env: {}
compare: {ignore: []}
