kind: helper
name: bedrock-invoke-inline-output-schema
call:
  bedrock_invoke_schema:
    model_cost:
      plain-model: {litellm_provider: bedrock}
    steps:
      - function: apply_structured_output
        model: plain-model
        body:
          messages:
            - {role: assistant, content: earlier}
            - {role: user, content: hi}
          output_config:
            format: {type: json_schema, schema: {type: object}}
            effort: high
      - function: apply_structured_output
        model: plain-model
        body:
          messages: [{role: user, content: hi}]
          output_format: {schema: {type: object, properties: {a: {type: string}}}}
          output_config:
            format: {type: json_schema, schema: {type: string}}
      - function: apply_structured_output
        model: plain-model
        body:
          messages: [{role: user, content: hi}]
          output_format: {}
          output_config:
            format: {type: json_schema, schema: {type: object}}
      - function: apply_structured_output
        model: plain-model
        body:
          messages: [{role: user, content: [{type: text, text: first}]}]
          output_format: ignored
          output_config:
            format: {type: json_schema, schema: {type: object}}
      - function: apply_structured_output
        model: plain-model
        body:
          messages: [{role: user, content: hi}]
          output_config: {format: not-a-dict}
      - function: apply_structured_output
        model: plain-model
        body:
          messages: [{role: user}]
          output_config:
            format: {type: json_schema, schema: {type: object}}
      - function: apply_structured_output
        model: plain-model
        body:
          messages: [{role: user, content: null}]
          output_config:
            format: {type: json_schema, schema: {type: object}}
      - function: apply_structured_output
        model: plain-model
        body:
          messages: []
          output_config:
            format: {type: json_schema, schema: {type: object}}
env: {}
compare:
  ignore:
    - {pointer: /value/0/body/messages/1/content/1/text, why: "json.dumps spacing of the inlined schema text is not part of the contract (docs/compatibility.md)"}
    - {pointer: /value/1/body/messages/0/content/1/text, why: "json.dumps spacing of the inlined schema text is not part of the contract (docs/compatibility.md)"}
    - {pointer: /value/3/body/messages/0/content/1/text, why: "json.dumps spacing of the inlined schema text is not part of the contract (docs/compatibility.md)"}
    - {pointer: /value/5/body/messages/0/content/0/text, why: "json.dumps spacing of the inlined schema text is not part of the contract (docs/compatibility.md)"}
