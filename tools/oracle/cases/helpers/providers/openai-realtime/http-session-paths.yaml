      - {api_base: null, api_key: null, litellm_api_base: "https://global.test/v1", litellm_api_key: null, litellm_openai_key: null, api_version: null, headers: {}}
env:
  OPENAI_API_BASE: "https://env.test/base"
  OPENAI_BASE_URL: "https://ignored.test"
compare: {ignore: []}
