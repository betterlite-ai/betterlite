kind: helper
name: bedrock-services-batch-records-alias-and-target
call:
  bedrock_services_batch_records:
    function: transform_records
    target_model: "anthropic.claude-3-5-sonnet-20241022-v2:0"
    model_alias_map:
      my-alias: "anthropic.claude-3-5-sonnet-20241022-v2:0"
      "anthropic.claude-3-5-sonnet-20241022-v2:0": "amazon.nova-pro-v1:0"
      my-haiku: "anthropic.claude-3-haiku-20240307-v1:0"
    model_cost:
      "anthropic.claude-3-5-sonnet-20241022-v2:0": {litellm_provider: bedrock}
      "anthropic.claude-3-haiku-20240307-v1:0": {litellm_provider: bedrock}
    records:
      # the alias resolves once: the anthropic id keeps its own provider instead of following its alias entry
      - custom_id: alias-anthropic
        url: /v1/chat/completions
        body:
          model: my-alias
          messages:
            - {role: user, content: hi}
          max_tokens: 32
      # an unknown record model takes the target model when the target names a provider
      - custom_id: target-replaces
        url: /v1/chat/completions
        body:
          model: custom-model-v1
          messages:
            - {role: user, content: hi}
          max_tokens: 16
      # a record model whose provider is known keeps itself
      - custom_id: record-wins
        url: /v1/chat/completions
        body:
          model: openai.gpt-oss-20b-1:0
          messages:
            - {role: user, content: hi}
          max_tokens: 16
      - custom_id: alias-haiku
        url: /v1/chat/completions
        body:
          model: my-haiku
          messages:
            - {role: user, content: hi}
      - custom_id: missing-model
        url: /v1/chat/completions
        body:
          messages:
            - {role: user, content: hi}
env: {}
compare: {ignore: []}
