kind: helper
name: openai-workload-identity-kubernetes-token-exchange
env: {}
compare: {ignore: []}
call:
  openai_workload_identity:
    flow:
      files:
        k8s: "  jwt-subject\r\n"
        second: "other-subject"
      replies:
        - {status: 200, body: '{"access_token":"access-1","expires_in":3600}'}
        - {status: 200, body: '{"access_token":"access-2","expires_in":3600}'}
      steps:
        - {op: token, identity: {name: k8s}}
        - {op: advance, ms: 1000}
        - {op: token, identity: {name: k8s}}
        - {op: token, identity: {name: second}}
        - {op: token, identity: {name: second}}
