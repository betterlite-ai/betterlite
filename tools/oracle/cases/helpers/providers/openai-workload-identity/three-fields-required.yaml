kind: helper
name: openai-workload-identity-three-fields-required
env: {}
compare: {ignore: []}
call:
  openai_workload_identity:
    resolve:
      probes:
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: idp, OPENAI_SERVICE_ACCOUNT_ID: sa, OPENAI_IDENTITY_TOKEN_FILE: /run/token}}
        - {env: {OPENAI_SERVICE_ACCOUNT_ID: sa, OPENAI_IDENTITY_TOKEN_FILE: /run/token}}
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: "", OPENAI_SERVICE_ACCOUNT_ID: sa, OPENAI_IDENTITY_TOKEN_FILE: /run/token}}
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: idp, OPENAI_IDENTITY_TOKEN_FILE: /run/token}}
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: idp, OPENAI_SERVICE_ACCOUNT_ID: "", OPENAI_IDENTITY_TOKEN_FILE: /run/token}}
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: idp, OPENAI_SERVICE_ACCOUNT_ID: sa}}
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: idp, OPENAI_SERVICE_ACCOUNT_ID: sa, OPENAI_IDENTITY_TOKEN_FILE: ""}}
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: idp}}
        - {env: {OPENAI_SERVICE_ACCOUNT_ID: sa, OPENAI_IDENTITY_TOKEN_FILE: /run/token}}
        - {env: {}}
        - {env: {OPENAI_IDENTITY_PROVIDER_ID: " ", OPENAI_SERVICE_ACCOUNT_ID: " ", OPENAI_IDENTITY_TOKEN_FILE: " "}}
