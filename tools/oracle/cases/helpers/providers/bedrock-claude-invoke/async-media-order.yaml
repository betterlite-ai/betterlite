kind: helper
name: bedrock-claude-invoke-async-media-order
call:
  bedrock_claude_invoke:
    function: transform
    model_cost:
      bedrock/claude-plain: {litellm_provider: bedrock}
    calls:
      - model: claude-plain
        messages:
          - role: user
            content:
              - type: document
                source: {type: url, url: 'https://example.test/second.pdf'}
              - {type: image_url, image_url: 'https://example.test/pic.png'}
              - {type: text, text: and this}
        optional_params: {max_tokens: 64}
        litellm_params: {}
        headers: {}
        fetch:
          'https://example.test/pic.png': 'data:image/png;base64,iVBORw0KGgo='
          'https://example.test/second.pdf': 'data:application/pdf;base64,U0VDT05E'
        inline: true
env: {LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: 'True'}
compare: {ignore: []}
