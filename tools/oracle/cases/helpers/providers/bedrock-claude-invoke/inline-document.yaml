kind: helper
name: bedrock-claude-invoke-inline-document
call:
  bedrock_claude_invoke:
    function: transform
    model_cost:
      bedrock/claude-plain: {litellm_provider: bedrock}
    calls:
      - model: claude-plain
        messages:
          - role: user
            content:
              - {type: text, text: read this}
              - type: document
                source: {type: url, url: 'https://example.test/doc.pdf'}
        optional_params: {max_tokens: 64}
        litellm_params: {}
        headers: {}
        fetch:
          'https://example.test/doc.pdf': 'data:application/octet-stream;base64,JVBERi0xLjQK'
        inline: false
      - model: claude-plain
        messages:
          - role: user
            content:
              - type: document
                source: {type: base64, media_type: application/pdf, data: QUJD}
        optional_params: {max_tokens: 64}
        litellm_params: {}
        headers: {}
        fetch: {}
        inline: false
env: {LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: 'True'}
compare: {ignore: []}
