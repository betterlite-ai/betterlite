kind: helper
name: bedrock-claude-invoke-forced-tool-choice-removed
call:
  bedrock_claude_invoke:
    function: map_params
    model_cost:
      bedrock/claude-test: {litellm_provider: bedrock, supports_forced_tool_use: false}
      bedrock/claude-native: {litellm_provider: bedrock, supports_forced_tool_use: true}
    calls:
      - model: claude-test
        non_default_params:
          response_format:
            type: json_schema
            json_schema: {name: answer, schema: {type: object, properties: {}}}
        optional_params:
          tool_choice: {type: function, function: {name: json_tool_call}}
        drop_params: false
      - model: claude-native
        non_default_params:
          response_format:
            type: json_schema
            json_schema: {name: answer, schema: {type: object, properties: {}}}
        optional_params:
          tool_choice: {type: function, function: {name: json_tool_call}}
        drop_params: false
env: {LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: 'True'}
compare: {ignore: []}
