kind: helper
name: tool-call-json-content
call:
  openai_chat_choices:
    tool_call_json_content:
      steps:
        - optional_params:
            tools:
              - {type: function, function: {name: lookup, parameters: {type: object}}}
          json_mode: false
          choices:
            - index: 0
              finish_reason: stop
              message: {content: '{"type":"function","name":"lookup","arguments":"{\"city\":\"Paris\"}"}'}
        - optional_params: null
          choices:
            - index: 0
              finish_reason: stop
              message: {content: '{"type":"function","name":"lookup","arguments":"{}"}'}
        - optional_params:
            tools:
              - {type: function, function: {name: lookup, parameters: {type: object}}}
          choices:
            - {index: 0, finish_reason: stop, message: {content: 'not json'}}
        - optional_params:
            tools:
              - {type: function, function: {name: lookup, parameters: {type: object}}}
          choices:
            - {index: 0, finish_reason: stop, message: {content: '{"type":"function","name":"other","arguments":""}'}}
        - optional_params:
            tools:
              - {type: function, function: {name: lookup, parameters: {type: object}}}
          choices:
            - {index: 0, finish_reason: stop, message: {content: '{"type":"function","name":"lookup","arguments":"{}"}', tool_calls: []}}
        - optional_params:
            tools:
              - {type: function, function: {name: lookup, parameters: {type: object}}}
          choices:
            - {index: 0, finish_reason: stop, message: {tool_calls: [{id: call_a, type: function, function: {name: lookup, arguments: '{}'}}]}}
env: {}
compare: {ignore: []}
