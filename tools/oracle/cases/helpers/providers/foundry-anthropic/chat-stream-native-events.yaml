kind: helper
name: foundry-anthropic-chat-stream-native-events
call:
  foundry_anthropic:
    api_base: https://resource.services.ai.azure.com/anthropic/v1/messages
    model: claude-sonnet-4-5
    messages:
      - role: user
        content: hi
    optional_params:
      max_tokens: 16
      stream: true
      json_mode: true
      is_vertex_request: true
      stream_options:
        include_usage: true
    litellm_params: {}
    caller_headers: {}
    api_key: sk-azure-key-fixture
    azure_ad_token: null
    upstream_status: 200
    upstream_headers: {}
    upstream_body: null
    upstream_lines:
      - 'event: message_start'
      - 'data: {"type":"message_start","message":{"id":"msg_1","type":"message","role":"assistant","model":"claude-sonnet-4-5","content":[],"stop_reason":null,"usage":{"input_tokens":5,"output_tokens":1}}}'
      - 'event: content_block_start'
      - 'data: {"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}'
      - 'event: content_block_delta'
      - 'data: {"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"hello"}}'
      - 'event: content_block_stop'
      - 'data: {"type":"content_block_stop","index":0}'
      - 'event: message_delta'
      - 'data: {"type":"message_delta","delta":{"stop_reason":"end_turn"},"usage":{"output_tokens":1}}'
      - 'event: message_stop'
      - 'data: {"type":"message_stop"}'
env:
  LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: "true"
compare: {ignore: []}
