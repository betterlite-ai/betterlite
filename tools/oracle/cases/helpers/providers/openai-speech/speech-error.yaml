kind: helper
name: openai-speech-status-error
call:
  openai_speech:
    client:
      api_key: sk-speech
      api_base: 'https://speech.test/v1'
      timeout: 30
      max_retries: 4
    request:
      model: tts-1
      input: Unknown voice
      voice: nobody
    reply:
      status: 404
      headers: [[content-type, application/json]]
      text: '{"error":{"message":"The voice does not exist","type":"invalid_request_error","param":"voice","code":"voice_not_found"}}'
env: {}
compare: {ignore: []}
