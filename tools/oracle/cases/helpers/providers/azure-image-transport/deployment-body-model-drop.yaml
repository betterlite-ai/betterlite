kind: helper
name: deployment-body-model-drop
call:
  azure_image_transport:
    steps:
      - api_base: 'https://example.test/openai/deployments/dall-e-2/images/generations?api-version=2024-02-01'
        api_version: '2024-02-01'
        deployment_name: dall-e-2
        headers: {api-key: fixture-secret-key, content-type: application/json}
        data: {model: dall-e-2, prompt: a cat, n: 1}
        is_async: true
        environment: {}
        replies:
          - {status: 200, body: '{"created":1,"data":[{"url":"https://example.test/image.png"}]}'}
env: {}
compare: {ignore: []}
