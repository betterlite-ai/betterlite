kind: helper
name: bedrock-tools-with-reasoning
call:
  bedrock_model_routes:
    price_map:
      openai.gpt-5.6:
        supported_endpoints: ["/v1/chat/completions"]
      "openai.gpt-oss-20b-1:0":
        supports_bedrock_runtime_chat_completions_tools_with_reasoning: true
      openai.gpt-5.6-literal:
        supports_bedrock_runtime_chat_completions_tools_with_reasoning: "true"
      openai.gpt-5.6-number:
        supports_bedrock_runtime_chat_completions_tools_with_reasoning: 1
    converse_models: []
    request_metadata_fields: []
    tool_names: {}
    step:
      request_needs_converse:
        probes:
          - model: openai.gpt-5.6
            request_params: {tools: []}
          - model: openai.gpt-5.6
            request_params: {functions: []}
          - model: "openai.gpt-oss-20b-1:0"
            request_params: {tools: [{type: function}]}
          - model: "openai.gpt-oss-20b-1:0"
            request_params: {functions: [{name: f}]}
          - model: openai.gpt-5.6
            request_params: {tools: [{type: function}], reasoning_effort: "none"}
          - model: openai.gpt-5.6
            request_params: {tools: [{type: function}]}
          - model: openai.gpt-5.6
            request_params: {tools: [{type: function}], reasoning_effort: null}
          - model: openai.gpt-5.6
            request_params: {tools: [{type: function}], reasoning_effort: low}
          - model: openai.gpt-5.6-literal
            request_params: {tools: [{type: function}], reasoning_effort: "none"}
          - model: openai.gpt-5.6-literal
            request_params: {tools: [{type: function}]}
          - model: openai.gpt-5.6-number
            request_params: {tools: [{type: function}]}
          - model: openai.gpt-5.6
            request_params: {temperature: 0.2}
env: {}
compare:
  ignore: []
