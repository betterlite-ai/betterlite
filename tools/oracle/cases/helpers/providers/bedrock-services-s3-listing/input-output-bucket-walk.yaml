kind: helper
name: bedrock-services-s3-listing-input-output-bucket-walk
call:
  bedrock_services_s3_listing:
    operation: list_request
    requests:
      - purpose: batch_output
        litellm_params: {aws_region_name: us-east-1}
        trusted: [[s3_bucket_name, in], [s3_output_bucket_name, out]]
      - purpose: batch_output
        litellm_params: {aws_region_name: us-east-1}
        environment: {AWS_S3_BUCKET_NAME: in, AWS_S3_OUTPUT_BUCKET_NAME: out}
      - purpose: batch_output
        litellm_params: {aws_region_name: us-east-1}
        trusted: [[s3_bucket_name, bucket]]
      - purpose: batch_output
        litellm_params: {aws_region_name: us-east-1}
        trusted: [[s3_bucket_name, in], [s3_output_bucket_name, ""]]
      - purpose: batch_output
        litellm_params: {aws_region_name: us-east-1}
        trusted: [[s3_bucket_name, in], [s3_output_bucket_name, true]]
      - purpose: batch_output
        litellm_params: {aws_region_name: us-east-1}
      - purpose: null
        litellm_params: {aws_region_name: us-east-1}
        trusted: [[s3_bucket_name, in], [s3_output_bucket_name, out]]
      - purpose: batch_output
        litellm_params: {aws_region_name: us-east-1}
        trusted: [[s3_bucket_name, bucket/in], [s3_output_bucket_name, bucket/out]]
calls:
  - bedrock_services_s3_listing:
      operation: next_request
      next:
        - status: 200
          body: '<ListBucketResult><Name>in</Name></ListBucketResult>'
          litellm_params: {aws_region_name: us-east-1, _s3_list_files_purpose: null}
          trusted: [[s3_bucket_name, in], [s3_output_bucket_name, out]]
        - status: 200
          body: '<ListBucketResult/>'
          litellm_params: {aws_region_name: us-east-1}
          trusted: [[s3_bucket_name, bucket], [s3_output_bucket_name, bucket]]
        - status: 200
          body: '<ListBucketResult/>'
          litellm_params: {aws_region_name: us-east-1}
          trusted: [[s3_bucket_name, bucket/in], [s3_output_bucket_name, bucket/out]]
        - status: 200
          body: '<ListBucketResult><NextContinuationToken></NextContinuationToken></ListBucketResult>'
          litellm_params: {aws_region_name: us-east-1}
          trusted: [[s3_bucket_name, in], [s3_output_bucket_name, out]]
        - status: 200
          body: '<ListBucketResult/>'
          litellm_params: {aws_region_name: us-east-1, _s3_list_files_purpose: ""}
          trusted: [[s3_bucket_name, in], [s3_output_bucket_name, out]]
env: {}
compare: {ignore: []}
