kind: helper
name: openai-response-events-non-native-streaming-model
env: {}
compare: {ignore: []}
call:
  openai_response_events:
    non_native_streaming_model:
      probes:
        - {model: gpt-4o, stream: true, provider: openai, native: 'false'}
        - {model: gpt-4o, stream: true, provider: null, native: 'true'}
        - {model: gpt-4o, stream: true, provider: openai, native: error}
        - {model: gpt-4o, stream: null, provider: openai, native: 'false'}
        - {model: gpt-4o, stream: false, provider: openai, native: 'false'}
        - {model: null, stream: true, provider: openai, native: 'false'}
