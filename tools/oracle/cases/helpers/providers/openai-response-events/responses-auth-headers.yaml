        - {headers: {}, api_key: null, litellm_api_key: null, litellm_openai_key: null, env_api_key: env-key, api_base: null, identity: false}
        - {headers: {}, api_key: null, litellm_api_key: null, litellm_openai_key: null, env_api_key: null, api_base: null, identity: false}
