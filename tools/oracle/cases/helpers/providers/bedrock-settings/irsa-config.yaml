kind: helper
name: irsa-config
call:
  bedrock_settings:
    settings:
      deployments:
        - {aws_role_name: "arn:aws:iam::111111111111:role/target", aws_session_name: pod}
        - {}
      environment:
        AWS_ROLE_ARN: "arn:aws:iam::111111111111:role/pod"
        AWS_WEB_IDENTITY_TOKEN_FILE: /var/run/secrets/eks/token
env:
  AWS_ROLE_ARN: "arn:aws:iam::111111111111:role/pod"
  AWS_WEB_IDENTITY_TOKEN_FILE: /var/run/secrets/eks/token
compare: {ignore: []}
