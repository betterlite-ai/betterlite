kind: helper
name: auth-selector-presence
call:
  bedrock_aws_settings:
    operation: auth_selector
    params:
      aws_web_identity_token: 'oidc/env/BEDROCK_ORACLE_TOKEN'
      aws_role_name: 'arn:aws:iam::123:role/demo'
      aws_session_name: 'session'
env:
  BEDROCK_ORACLE_TOKEN: 'fixture-token'
compare: {ignore: []}
