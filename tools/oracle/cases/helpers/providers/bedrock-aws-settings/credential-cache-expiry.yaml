{
  "kind": "helper",
  "name": "credential-cache-expiry",
  "call": {
    "bedrock_aws_settings": {
      "operation": "cache",
      "params": {
        "parameters": {
          "aws_session_name": "expiry",
          "ssl_verify": true
        },
        "steps": [
          {
            "now": 0,
            "access": "first"
          },
          {
            "now": 600,
            "access": "unexpected"
          },
          {
            "now": 601,
            "access": "next"
          },
          {
            "now": 1202,
            "access": null,
            "fail": true
          },
          {
            "now": 1204,
            "access": "recovered"
          }
        ]
      }
    }
  },
  "env": {},
  "compare": {
    "ignore": []
  }
}
