kind: helper
name: azure-file-client-errors
call:
  azure_files:
    steps:
    - action: client
      args: {api_key: null, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
    - action: client
      args: {api_key: key-1, api_base: null, api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
    - action: client
      args: {api_key: key-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
      client: azure_open_ai
      builder: none
