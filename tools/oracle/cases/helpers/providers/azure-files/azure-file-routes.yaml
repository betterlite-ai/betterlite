kind: helper
name: azure-file-routes
call:
  azure_files:
    steps:
    - action: create
      args: {api_key: key-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
      content: file-bytes
      create_purpose: batch
      reply: {status: 200, headers: {content-type: application/json}, body: '{"id": "file-1", "object": "file", "bytes": 5, "created_at": 1700000000, "filename": "notes.txt", "purpose": "batch", "status": "processed"}'}
    - action: content
      args: {api_key: key-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
      file_id: file-1
      reply: {status: 200, headers: {content-type: application/binary}, body: file-bytes}
    - action: retrieve
      args: {api_key: key-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
      file_id: file-1
      reply: {status: 200, headers: {content-type: application/json}, body: '{"id": "file-1", "object": "file", "bytes": 5, "created_at": 1700000000, "filename": "notes.txt", "purpose": "batch", "status": "processed"}'}
    - action: list
      args: {api_key: key-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
      purpose: batch
      reply: {status: 200, headers: {content-type: application/json}, body: '{"object": "list", "data": [], "has_more": false, "first_id": null, "last_id": null}'}
    - action: delete
      args: {api_key: key-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
      file_id: file-1
      reply: {status: 200, headers: {content-type: application/json}, body: '{"id": "file-1", "object": "file", "deleted": true}'}
env: {}
compare: {ignore: []}
