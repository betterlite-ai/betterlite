    - action: retrieve
      args: {api_key: key-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 600.0, max_retries: 2}
      file_id: file-two
      reply: {status: 200, headers: {content-type: application/json}, body: '{"id": "file-two", "object": "file", "bytes": 0, "created_at": 1700000001, "filename": "empty.txt", "purpose": "assistants", "status": "uploaded", "expires_at": 1800000000, "status_details": "still processing"}'}
