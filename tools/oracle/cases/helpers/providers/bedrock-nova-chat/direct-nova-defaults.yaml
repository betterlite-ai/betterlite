    function: defaults
    arguments:
      max_completion_tokens: 16
      max_tokens: 32
      temperature: 1
      top_p: 1
      tools:
        - type: function
          function:
            name: lookup
            description: finds things
            parameters: {type: object, properties: {}}
      reasoning_effort: [low]
