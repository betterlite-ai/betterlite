kind: helper
name: gpt-oss-and-deepseek-effort
call:
  bedrock_converse_options:
    function: deepseek_flags
    cases:
      - {model: deepseek.v3-v1:0, base_model: deepseek.v3-v1:0}
      - {model: us.deepseek.v3-v1:0, base_model: deepseek.v3-v1:0}
      - {model: deepseek.r1-v1:0, base_model: deepseek.r1-v1:0}
      - {model: us.deepseek.r1-v1:0, base_model: deepseek.r1-v1:0}
      - {model: DeepSeek.V3, base_model: DeepSeek.V3}
      - {model: fixture, base_model: deepseek.r1-v1:0}
      - {model: deepseek.r1, base_model: deepseek.r1-v1:0}
calls:
  - bedrock_converse_options:
      function: handle
      model_cost: {}
      environment: {}
      model: openai.gpt-oss-120b-1:0
      effort: minimal
      optional_params: {}
  - bedrock_converse_options:
      function: handle
      model_cost: {}
      environment: {}
      model: deepseek.v3-v1:0
      effort: high
      optional_params: {thinking: {type: enabled, budget_tokens: 2048}}
  - bedrock_converse_options:
      function: handle
      model_cost: {}
      environment: {}
      model: deepseek.r1-v1:0
      effort: high
      optional_params: {}
  - bedrock_converse_options:
      function: thinking_accepts
      model_cost:
        deepseek.v3-v1:0: {litellm_provider: bedrock, supports_reasoning: true}
        deepseek.r1-v1:0: {litellm_provider: bedrock, supports_reasoning: true}
        fixture-reasoning: {litellm_provider: bedrock, supports_reasoning: true}
        fixture-plain: {litellm_provider: bedrock, supports_reasoning: false}
      cases:
        - {model: deepseek.v3-v1:0, base_model: deepseek.v3-v1:0}
        - {model: deepseek.r1-v1:0, base_model: deepseek.r1-v1:0}
        - {model: anthropic.claude-3-7-sonnet-20250219-v1:0, base_model: anthropic.claude-3-7-sonnet-20250219-v1:0}
        - {model: us.anthropic.claude-sonnet-4-5-v1:0, base_model: anthropic.claude-sonnet-4-5-v1:0}
        - {model: anthropic.claude-opus-4-1-v1:0, base_model: anthropic.claude-opus-4-1-v1:0}
        - {model: fixture-reasoning, base_model: fixture-reasoning}
        - {model: us.fixture-reasoning, base_model: fixture-reasoning}
        - {model: fixture-plain, base_model: fixture-plain}
        - {model: fixture-unknown, base_model: fixture-unknown}
env: {}
compare: {ignore: []}
