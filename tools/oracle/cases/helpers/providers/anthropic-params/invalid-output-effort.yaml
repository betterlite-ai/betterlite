kind: helper
name: invalid-output-effort
call:
  anthropic_params:
    fixture:
      model_cost:
        effort-model: {litellm_provider: anthropic, supports_output_config: true, supports_max_reasoning_effort: true}
        plain-model: {litellm_provider: anthropic}
      packaged: {}
      budgets: {minimal: 128, low: 1024, medium: 2048, high: 4096, xhigh: 8192, max: 16384}
    default_max_tokens: 4096
    steps:
      - {function: apply_output_config, model: effort-model, data: {output_config: {effort: bogus}}, optional_params: {output_config: {effort: bogus}}, global_drop_params: false}
      - {function: apply_output_config, model: plain-model, data: {output_config: {effort: xhigh, format: {type: json_schema}}}, optional_params: {output_config: {effort: xhigh, format: {type: json_schema}}}, global_drop_params: false}
      - {function: apply_output_config, model: effort-model, data: {output_config: {effort: max, note: kept}}, optional_params: {output_config: {effort: max, note: kept}}, global_drop_params: false}
      - {function: apply_output_config, model: effort-model, data: {output_config: {effort: high}}, optional_params: {output_config: {effort: high}}, global_drop_params: false}
      - {function: apply_output_config, model: effort-model, data: {output_config: {effort: medium}}, optional_params: {output_config: {effort: medium}}, global_drop_params: false}
      - {function: apply_output_config, model: effort-model, data: {output_config: {effort: low}}, optional_params: {output_config: {effort: low}}, global_drop_params: false}
      - {function: apply_output_config, model: effort-model, data: {output_config: {effort: xhigh}}, optional_params: {output_config: {effort: xhigh}}, global_drop_params: false}
      - {function: apply_output_config, model: plain-model, data: {output_config: {format: {type: json_schema}}}, optional_params: {output_config: {format: {type: json_schema}}}, global_drop_params: false}
env: {}
compare: {ignore: []}
