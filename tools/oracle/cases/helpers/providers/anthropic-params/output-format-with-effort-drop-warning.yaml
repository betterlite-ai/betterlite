kind: helper
name: output-format-with-effort-drop-warning
call:
  anthropic_params:
    fixture:
      model_cost:
        effort-model: {litellm_provider: anthropic, supports_output_config: true}
        plain-model: {litellm_provider: anthropic}
      packaged: {}
    default_max_tokens: 4096
    steps:
      - {function: apply_output_config, model: plain-model, data: {output_config: {effort: high, format: {type: json_schema}}}, optional_params: {output_config: {effort: high, format: {type: json_schema}}}, global_drop_params: true}
      - {function: apply_output_config, model: plain-model, data: {output_config: {effort: high}}, optional_params: {output_config: {effort: high}}, global_drop_params: true}
      - {function: apply_output_config, model: plain-model, data: {output_config: {format: {type: json_schema}}}, optional_params: {output_config: {format: {type: json_schema}}}, global_drop_params: true}
      - {function: apply_output_config, model: effort-model, data: {output_config: {effort: high, format: {type: json_schema}}}, optional_params: {output_config: {effort: high, format: {type: json_schema}}}, global_drop_params: true}
      - {function: apply_output_config, model: plain-model, data: {output_config: null}, optional_params: {output_config: null}, global_drop_params: true}
      - {function: apply_output_config, model: plain-model, data: {output_config: {}}, optional_params: {output_config: {}}, global_drop_params: true}
      - {function: apply_output_config, model: plain-model, data: {}, optional_params: {}, global_drop_params: true}
env: {}
compare: {ignore: []}
