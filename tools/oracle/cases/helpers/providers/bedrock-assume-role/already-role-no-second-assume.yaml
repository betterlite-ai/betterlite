kind: helper
name: already-role-no-second-assume
call:
  bedrock_assume_role:
    operation: already_running
    params:
      environment: {AWS_ACCESS_KEY_ID: AKIAFIXTURE, AWS_SECRET_ACCESS_KEY: fixture, AWS_REGION: us-east-1}
      target: 'arn:aws:iam::123456789012:role/path/to/MyRole'
      reply: {identity: 'arn:aws:sts::123456789012:assumed-role/MyRole/session'}
env: {}
compare: {ignore: []}
