kind: helper
name: advisor-block-removal
call:
  anthropic_message_replay:
    function: advisor
    replace_with_text: true
    messages:
    - pass-through
    - role: user
      content:
      - type: server_tool_use
        id: adv_u
        name: advisor
        input: {}
      - type: advisor_tool_result
        tool_use_id: adv_u
        content: user advice
    - role: assistant
      content:
      - type: text
        text: before
      - type: server_tool_use
        id: adv_1
        name: advisor
        input:
          q: x
      - type: advisor_tool_result
        tool_use_id: adv_1
        content:
        - type: text
          text: first advice
        - type: text
          text: second advice
      - type: text
        text: after
    - role: assistant
      content:
      - type: advisor_tool_result
        tool_use_id: orphan
        content: orphan advice
      - type: text
        text: kept
    - role: assistant
      content: plain string
    - role: assistant
      content:
      - type: server_tool_use
        id: adv_2
        name: advisor
        input: {}
      - type: advisor_tool_result
        tool_use_id: adv_2
        content: plain advice
    - role: assistant
      content:
      - type: server_tool_use
        id: adv_3
        name: advisor
        input: {}
      - type: advisor_tool_result
        tool_use_id: adv_3
        content:
        - type: text
          text: ''
    - role: assistant
      content:
      - type: server_tool_use
        id: ''
        name: advisor
        input: {}
      - type: advisor_tool_result
        tool_use_id: ''
        content: empty id advice
      - opaque
    - role: assistant
      content:
      - type: server_tool_use
        id: adv_5
        name: other
        input: {}
      - type: advisor_tool_result
        tool_use_id: adv_5
        content: other tool
      - type: server_tool_use
        id: adv_6
        name: advisor
        input: {}
      - type: advisor_tool_result
        tool_use_id: adv_6
        content:
        - type: text
          text: last one wins A
      - type: advisor_tool_result
        tool_use_id: adv_6
        content: last one wins B
env: {}
compare:
  ignore: []
