kind: helper
name: openai-response-resources-include-comma-query
env: {}
compare: {ignore: []}
call:
  openai_response_resources:
    include_comma_query:
      probes:
        - {endpoint: list, response_id: r, api_base: 'https://h/v1', include: [input_text, output_text]}
        - {endpoint: list, response_id: r, api_base: 'https://h/v1', include: []}
        - {endpoint: list, response_id: r, api_base: 'https://h/v1', include: ['']}
        - {endpoint: list, response_id: r, api_base: 'https://h/v1', include: [a, '']}
        - {endpoint: list, response_id: r, api_base: 'https://h/v1', include: null}
        - {endpoint: list, response_id: r, api_base: 'https://h/v1'}
