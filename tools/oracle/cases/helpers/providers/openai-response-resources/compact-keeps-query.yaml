kind: helper
name: openai-response-resources-compact-keeps-query
env: {}
compare: {ignore: []}
call:
  openai_response_resources:
    compact_keeps_query:
      probes:
        - {endpoint: compact, model: gpt-4o, input: hi, api_base: https://api.openai.com/v1}
        - {endpoint: compact, model: gpt-4o, input: hi, api_base: 'https://api.openai.com/v1/', params: {}}
        - {endpoint: compact, model: gpt-4o, input: hi, api_base: 'https://api.openai.com/v1?api-version=2025-01-01'}
        - {endpoint: compact, model: gpt-4o, input: hi, api_base: 'https://host.example/openai/v1/?api-version=2025-01-01&x=1', params: {temperature: 1}}
        - {endpoint: compact, model: gpt-4o, input: hi, api_base: https://api.openai.com}
        - {endpoint: compact, model: gpt-4o, input: hi, api_base: 'https://host/v1//'}
