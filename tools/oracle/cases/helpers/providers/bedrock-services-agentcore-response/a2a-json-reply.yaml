kind: helper
name: a2a-json-reply
call:
  bedrock_services_agentcore_response:
    status: 200
    headers: [[content-type, application/json]]
    body: '{"jsonrpc": "2.0", "result": {"message": {"parts": [{"kind": "text", "text": "a2a hello"}]}}}'
    model: gpt-4
    messages: [{role: user, content: hi}]
    content: a2a hello
    tokens: {prompt: 3, completion: 5}
    response:
      id: chatcmpl-fixture
      object: chat.completion
      created: 123
      model: supplied
      system_fingerprint: fp-fixture
      choices: []
      usage: {prompt_tokens: 1, completion_tokens: 2, total_tokens: 3}
env: {}
compare: {ignore: []}
