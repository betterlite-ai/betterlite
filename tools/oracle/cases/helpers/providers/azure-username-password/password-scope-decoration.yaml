kind: helper
name: password-scope-decoration
call:
  azure_username_password:
    action: password_scope_decoration
    steps:
      - environment: {}
        client_id: client
        username: user@example.com
        password: password
        scope: https://cognitiveservices.azure.com/.default
        replies:
          - url_contains: well-known
            status: 200
            body: '{"authorization_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/token"}'
          - url_contains: userrealm
            status: 200
            body: '{}'
          - url_contains: /oauth2/v2.0/token
            status: 200
            body: '{"access_token":"tok-value","expires_in":3600,"id_token_claims":{"aud":"client","iss":"https://login.microsoftonline.com/tenant/v2.0","sub":"subject","tid":"tenant","preferred_username":"user@example.com"},"client_info":"eyJ1aWQiOiJ1aWQiLCJ1dGlkIjoidXRpZCJ9"}'
      - environment: {}
        client_id: client
        username: user@example.com
        password: password
        scope: openid
        replies:
          - url_contains: well-known
            status: 200
            body: '{"authorization_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/token"}'
      - environment: {}
        client_id: client
        username: user@example.com
        password: password
        scope: profile
        replies:
          - url_contains: well-known
            status: 200
            body: '{"authorization_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/token"}'
      - environment: {}
        client_id: client
        username: user@example.com
        password: password
        scope: offline_access
        replies:
          - url_contains: well-known
            status: 200
            body: '{"authorization_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/token"}'
env: {}
compare: {ignore: []}
