kind: helper
name: azure-stream-errors-request
call:
  azure_stream_errors:
    function: streaming
    cases:
      - model: deployment
        api_base: https://unit.test
        api_version: "2024-02-01"
        api_key: call-key
        max_retries: 0
        timeout: 30.0
        dynamic_params: false
        data:
          model: deployment
          messages:
            - role: user
              content: Hello
          stream: true
        litellm_params:
          azure_ad_token: litellm-token
          max_retries: 1
          timeout: 5.0
        supplied:
          kind: azure_sync
          api_key: client-key
        send:
          headers:
            content-type: text/event-stream
            x-ms-request-id: req-1
          events:
            - "data: {\"id\":\"chatcmpl-1\",\"object\":\"chat.completion.chunk\",\"created\":1700000000,\"model\":\"deployment\",\"choices\":[{\"index\":0,\"delta\":{\"role\":\"assistant\",\"content\":\"Hello\"},\"finish_reason\":\"stop\"}]}\n\n"
            - "data: [DONE]\n\n"
      - model: deployment
        api_base: https://unit.test
        api_version: "2024-02-01"
        api_key: call-key
        max_retries: 2
        timeout: 12.5
        data:
          model: deployment
          messages:
            - role: user
              content: Hi
          stream: true
        supplied:
          kind: open_ai_sync
          api_key: client-key
        send:
          headers:
            content-type: text/event-stream
            x-ms-request-id: req-2
          events:
            - "data: {\"id\":\"chatcmpl-2\",\"object\":\"chat.completion.chunk\",\"created\":1700000000,\"model\":\"deployment\",\"choices\":[{\"index\":0,\"delta\":{\"role\":\"assistant\",\"content\":\"Hi\"},\"finish_reason\":\"stop\"}]}\n\n"
            - "data: [DONE]\n\n"
calls:
  - azure_stream_errors:
      function: async_streaming
      cases:
        - model: deployment
          api_base: https://unit.test
          api_version: "2024-02-01"
          api_key: call-key
          max_retries: 0
          timeout: 30.0
          data:
            model: deployment
            messages:
              - role: user
                content: Hello
            stream: true
          supplied:
            kind: azure_async
            api_key: client-key
          send:
            headers:
              content-type: text/event-stream
              x-ms-request-id: req-3
            events:
              - "data: {\"id\":\"chatcmpl-3\",\"object\":\"chat.completion.chunk\",\"created\":1700000000,\"model\":\"deployment\",\"choices\":[{\"index\":0,\"delta\":{\"role\":\"assistant\",\"content\":\"Hello\"},\"finish_reason\":\"stop\"}]}\n\n"
              - "data: [DONE]\n\n"
        - model: deployment
          api_base: https://unit.test
          api_version: "2024-02-01"
          api_key: call-key
          max_retries: 4
          timeout: 12.5
          data:
            model: deployment
            messages:
              - role: user
                content: Hi
            stream: true
          supplied:
            kind: open_ai_async
            api_key: client-key
          send:
            headers:
              content-type: text/event-stream
              x-ms-request-id: req-4
            events:
              - "data: {\"id\":\"chatcmpl-4\",\"object\":\"chat.completion.chunk\",\"created\":1700000000,\"model\":\"deployment\",\"choices\":[{\"index\":0,\"delta\":{\"role\":\"assistant\",\"content\":\"Hi\"},\"finish_reason\":\"stop\"}]}\n\n"
              - "data: [DONE]\n\n"
env: {}
compare: {ignore: []}
