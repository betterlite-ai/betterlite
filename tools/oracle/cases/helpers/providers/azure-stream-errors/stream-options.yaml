kind: helper
name: azure-stream-errors-options
call:
  azure_stream_errors:
    function: streaming
    cases:
      - model: deployment
        api_base: https://unit.test
        api_version: "2024-02-01"
        api_key: call-key
        max_retries: 0
        data:
          model: deployment
          messages:
            - role: user
              content: Hello
          stream: true
          stream_options: {}
        supplied:
          kind: azure_sync
          api_key: client-key
        send:
          headers:
