kind: helper
name: text-reply-as-chat
call:
  text_completion_policy:
    text_reply_as_chat:
      response_object:
        object: text_completion
        created: 1700000000
        model: gpt-3.5-turbo-instruct
        choices:
        - text: hello
          finish_reason: stop
          index: 0
          logprobs: null
        - text: world
          finish_reason: stop_sequence
          index: 1
          logprobs: null
        - text: again
          finish_reason: tool_use
          index: 2
          logprobs: null
        - text: refused
          finish_reason: refusal
          index: 3
          logprobs: null
        - text: calling
          finish_reason: function_call
          index: 4
          logprobs: null
      model_response_object:
        id: chatcmpl-fresh
        object: chat.completion
        created: 1700000000
        model: null
        system_fingerprint: null
env: {}
compare:
  ignore:
    - pointer: /value/id
      why: id is omitted from response_object, so both LiteLLM and betterlite generate it from a fresh random source
    - pointer: /value/_hidden_params/original_response/id
      why: id is omitted from response_object, so both LiteLLM and betterlite generate it from a fresh random source
