kind: helper
name: raw-binary-reply
call:
  bedrock_services_file_content:
    response:
      status_code: 200
      body: [0, 255, 10]
      headers: {content-type: application/x-custom, content-disposition: 'attachment; filename=x', content-length: '3'}
      request: {method: GET, url: 'https://bedrock.example/files/id/content'}
env: {}
compare: {ignore: []}
