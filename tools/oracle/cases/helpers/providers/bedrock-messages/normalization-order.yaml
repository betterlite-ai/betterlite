kind: helper
name: bedrock-messages-normalization-order
call:
  bedrock_messages:
    function: transform
    model_cost:
      bedrock/fixture-plain: {litellm_provider: bedrock, mode: chat}
      fixture-plain: {litellm_provider: bedrock, mode: chat}
    calls:
      - model: fixture-plain
        messages: [{role: user, content: hi}]
        optional_params:
          max_tokens: 256
          tools:
            - name: geo
              input_schema: {type: object}
              eager_input_streaming: true
              custom: {defer_loading: true}
          safeguards: []
          mcp_servers: [{type: url, url: "https://example.test/mcp"}]
env: {LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: 'True'}
compare: {ignore: []}
