kind: helper
name: bedrock-invoke-primitives-guardrail-metadata-merge
call:
  bedrock_invoke_primitives:
    guardrail_metadata_merge:
      merges:
        - headers:
            x-custom: keep
            x-amzn-bedrock-guardrailidentifier: caller
          optional_params:
            guardrailConfig: {guardrailIdentifier: derived, trace: disabled}
            temperature: 0.2
        - headers: {x-only: v}
          optional_params: {temperature: 0.2}
        - headers: {x-only: v}
          optional_params: {guardrailConfig: null}
        - headers: {x-amzn-bedrock-request-metadata: spoof, x-other: v}
          identity: {user_api_key_hash: hash}
          spend_logs_metadata: {team: a, 'bad key!': x}
          policy_fields: [user_api_key_hash, spend_logs_metadata]
        - headers: {x-amzn-bedrock-request-metadata: spoof, x-other: v}
          policy_fields: [user_api_key_hash]
        - headers: {}
          optional_params: {guardrailConfig: {guardrailIdentifier: 5}}
      error:
        message: boom
        status_code: 429
        headers: {retry-after: '1'}
env: {}
compare: {ignore: []}
