kind: helper
name: sdk-error-passthrough
call:
  azure_fine_tuning:
    steps:
    - action: create
      args: {api_key: er-1, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 7.5, max_retries: 7, organization: org-x}
      data: {model: m, training_file: f}
      reply: {status: 400, body: {error: {message: bad job, type: invalid_request_error, param: training_file, code: invalid}}}
    - action: cancel
      job_id: ft_cancel
      args: {api_key: er-2, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 7.5, max_retries: 7, organization: org-x}
      reply: {status: 404, body: {error: {message: no such job, type: invalid_request_error, param: null, code: not_found}}}
    - action: list
      after: ft_1
      limit: 7
      args: {api_key: er-3, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 7.5, max_retries: 7, organization: org-x}
      reply: {status: 200, body: {object: list, data: [{id: ft_1, created_at: 1, error: null, fine_tuned_model: null, finished_at: null, hyperparameters: {batch_size: null, learning_rate_multiplier: null, n_epochs: 3}, model: gpt-4o-mini, object: fine_tuning.job, organization_id: org, result_files: [], seed: 5, status: queued, trained_tokens: null, training_file: file_a, validation_file: null, estimated_finish: null, integrations: null, metadata: null, method: null}], has_more: true}}
    - action: list
      is_async: true
      after: ft_2
      limit: 3
      args: {api_key: er-4, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 7.5, max_retries: 7, organization: org-x}
      reply: {status: 200, body: {object: list, data: [], has_more: false}}
    - action: retrieve
      job_id: ft_paused
      args: {api_key: er-5, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 7.5, max_retries: 7, organization: org-x}
      reply: {status: 200, body: {id: ft_1, created_at: 1, error: null, fine_tuned_model: null, finished_at: null, hyperparameters: {batch_size: null, learning_rate_multiplier: null, n_epochs: 3}, model: gpt-4o-mini, object: fine_tuning.job, organization_id: org, result_files: [], seed: 5, status: paused, trained_tokens: null, training_file: file_a, validation_file: null, estimated_finish: null, integrations: null, metadata: null, method: null}}
env: {}
compare: {ignore: []}
