kind: helper
name: mantle-model-name
call:
  bedrock_mantle_responses:
    mantle_model_name:
      cases:
        - model: us-east-1/openai.gpt-oss-120b
          params: {temperature: 0.5}
        - model: openai.gpt-oss-120b
        - model: bedrock_mantle/openai.gpt-5.5-quux
          params: {temperature: 0.5}
        - model: us-east-1/openai.gpt-5.5-quux
          params: {temperature: 0.5}
          drop_params: true
        - model: openai.gpt-5.5-quux
          params: {top_p: 0.5, reasoning: {effort: high}}
env: {}
compare: {ignore: []}
