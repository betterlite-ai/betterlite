kind: helper
name: bedrock-message-usage-start-cache-into-delta
call:
  bedrock_message_usage:
    events:
      - type: message_start
        message:
          usage: {cache_creation_input_tokens: 3, cache_read_input_tokens: 4, cache_creation: {ephemeral_5m_input_tokens: 5}}
      - type: message_delta
        usage: {}
env: {}
compare:
  ignore: []
