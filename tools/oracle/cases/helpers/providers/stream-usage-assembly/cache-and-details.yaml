kind: helper
name: stream-usage-assembly-cache-and-details
call:
  stream_usage_assembly:
    function: batch
    cases:
    - function: calculate_usage
      chunks:
      - usage: {cache_creation_input_tokens: 7}
      - usage: {cache_creation_input_tokens: 9, prompt_tokens: 3}
      - usage: {cache_creation_input_tokens: 11}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {cache_read_input_tokens: 2}
      - usage: {cache_read_input_tokens: 5, prompt_tokens: 1}
      - usage: {cache_read_input_tokens: 8}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {completion_tokens: 4, completion_tokens_details: {reasoning_tokens: 2}}
      - usage: {completion_tokens: 5}
      - usage: {completion_tokens: 6, completion_tokens_details: {reasoning_tokens: 3}}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage:
          prompt_tokens: 3
          prompt_tokens_details:
            cached_tokens: 1
            cache_creation_token_details: {ephemeral_1h_input_tokens: 5}
      - usage:
          prompt_tokens: 4
          prompt_tokens_details:
            cached_tokens: 2
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage:
          prompt_tokens: 3
          prompt_tokens_details:
            cache_creation_token_details: {ephemeral_5m_input_tokens: 1}
      - usage:
          prompt_tokens: 4
          prompt_tokens_details:
            cached_tokens: 2
            cache_creation_token_details: {ephemeral_1h_input_tokens: 6}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, server_tool_use: {web_search_requests: 2}}
      - usage: {prompt_tokens: 2, server_tool_use: null}
      - usage: {prompt_tokens: 3, server_tool_use: {web_search_requests: 4, browser_open_requests: 1}}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, server_tool_use: {web_search_requests: 2, code_execution_requests: 1}}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, server_tool_use: "x"}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, server_tool_use: {web_search_requests: two}}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens_details: {cache_write_tokens: 5}}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {cache_creation_input_tokens: 7}
      - usage: {cache_creation_input_tokens: 0}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {cache_read_input_tokens: 2}
      - usage: {cache_read_input_tokens: 0}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {cache_creation_input_tokens: 7}
      - usage: {cache_creation_input_tokens: 0, prompt_tokens: 3}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 3, prompt_tokens_details: {cached_tokens: 2}}
      - usage: {prompt_tokens: 4, prompt_tokens_details: {}}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, prompt_cache_hit_tokens: 5}
      model: deepseek-chat
      completion_output: ""
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage:
          completion_tokens: 10
          reasoning_tokens: 4
          completion_tokens_details: {image_tokens: 2, audio_tokens: 1}
      model: gpt-4o
      completion_output: ""
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, prompt_tokens_details: {cache_creation_tokens: 5}}
      model: claude-3
      completion_output: ""
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, prompt_tokens_details: {cache_creation_input_tokens: 4}}
      model: claude-3
      completion_output: ""
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - form: model_response
        _hidden_params: {custom_llm_provider: anthropic}
        usage: {completion_tokens: 8}
        choices: [{finish_reason: null}]
      model: claude-3
      completion_output: hello world
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - form: model_response
        _hidden_params: {custom_llm_provider: anthropic}
        usage: {completion_tokens: 8}
        choices: [{}]
      model: claude-3
      completion_output: hello world
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 3, prompt_tokens_details: {cached_tokens: 2}}
      - usage: {prompt_tokens: 4, prompt_tokens_details: {cached_tokens: null}}
      model: claude-3
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {completion_tokens: 5, completion_tokens_details: {reasoning_tokens: 2}}
      - usage: {completion_tokens: 6, completion_tokens_details: {}}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {completion_tokens: 5, completion_tokens_details: {reasoning_tokens: 2}}
      - usage: {completion_tokens: 6, completion_tokens_details: {reasoning_tokens: null}}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
env: {LITELLM_RUST: 'false'}
compare: {ignore: []}
