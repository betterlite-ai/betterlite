kind: helper
name: stream-usage-assembly-grounding-and-pricing
call:
  stream_usage_assembly:
    function: batch
    cases:
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, prompt_tokens_details: {web_search_requests: 1}}
      - usage: {prompt_tokens: 2, prompt_tokens_details: {google_maps_grounding_requests: 0, cached_tokens: 3}}
      model: gemini-1.5-pro
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, prompt_tokens_details: {web_search_requests: 1}}
      - usage: {prompt_tokens: 2, prompt_tokens_details: {web_search_requests: 5}}
      model: gemini-1.5-pro
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: apply_grounding
      web_search_requests: 1
      google_maps_grounding_requests: 2
    - function: apply_grounding
      prompt_tokens_details: {cached_tokens: 3}
      google_maps_grounding_requests: 0
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, cost: 0.5}
      - usage: {prompt_tokens: 2, cost: 0}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, cost: 0}
      - usage: {prompt_tokens: 2}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, cost: 1.25}
      - usage: {prompt_tokens: 2, cost: null}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, inference_geo: us, speed: fast}
      - usage: {prompt_tokens: 2, inference_geo: 5, speed: ""}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, speed: slow, inference_geo: eu}
      - usage: {prompt_tokens: 2, speed: null, inference_geo: null}
      model: gpt-4o
      completion_output: hi
      counter: {text: 7, messages: 4}
    - function: calculate_usage
      chunks:
      - usage: {prompt_tokens: 1, prompt_tokens_details: {google_maps_grounding_requests: 2}}
      - usage: {prompt_tokens: 2, prompt_tokens_details: {cached_tokens: 3}}
      model: gemini-1.5-pro
      completion_output: hi
      counter: {text: 7, messages: 4}
env: {LITELLM_RUST: 'false'}
compare: {ignore: []}
