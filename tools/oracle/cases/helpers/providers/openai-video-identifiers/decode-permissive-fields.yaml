      - op: decode_character_id
        encoded: character_bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOnA7bW9kZWxfaWQ6bTtjaGFyYWN0ZXJfaWQ6b25lIGNoYXJhY3Rlcl9pZDp0d287ZXh0cmE=
