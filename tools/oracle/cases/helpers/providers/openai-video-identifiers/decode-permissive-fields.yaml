env: {}
compare:
  ignore:
    - pointer: /value/5
      why: >-
        The pinned CPython 3.13 keeps decoding after the padding quad and gives this payload the
        video_id c\0\0; betterlite stops at the quad that completes the group, CPython 3.12 and
        earlier's rule, so the trailing bytes are not decoded and the two answers differ.
    - pointer: /value/6
      why: >-
        The pinned CPython 3.13 raises Incorrect padding for this payload and LiteLLM falls back
        with a debug line; betterlite stops at the padding quad and decodes abc;b;c, so the two
        answers differ on this malformed payload.
