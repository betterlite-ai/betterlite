kind: helper
name: foundry-anthropic-messages-system-role-normalization
call:
  foundry_anthropic_messages:
    function: transform
    request:
      model: claude-sonnet-4-5
      system:
        - type: text
          text: be brief
          cache_control: {type: ephemeral, scope: global}
      messages:
        - role: user
          content:
            - type: text
              text: hi
        - role: assistant
          content: hello
        - role: user
          content: more
env: {}
compare:
  ignore: []
