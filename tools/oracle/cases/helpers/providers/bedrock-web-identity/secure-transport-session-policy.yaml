kind: helper
name: bedrock-web-identity-secure-transport-session-policy
call:
  bedrock_web_identity:
    web_identity:
      environment:
        AWS_ACCESS_KEY_ID: AKIAAMBIENT
        AWS_SECRET_ACCESS_KEY: ambient-secret
        AWS_REGION: eu-west-1
      token_reference: web-identity-token
      resolved_token: header.eyJhdWQiOiJsaXRlbGxtIn0.signature
      role_arn: 'arn:aws:iam::123456789012:role/PolicyRole'
      session_name: policy-session
      max_policy_size: 75
      reply:
        credentials:
          access_key_id: ASIAPOLICY
          secret_access_key: policy-secret
          session_token: policy-session-token
          expiration: '2026-01-01T02:00:00Z'
          packed_policy_size: 2
env: {}
compare: {ignore: []}
