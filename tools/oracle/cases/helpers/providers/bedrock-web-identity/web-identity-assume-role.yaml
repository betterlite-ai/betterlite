kind: helper
name: bedrock-web-identity-assume-role
call:
  bedrock_web_identity:
    web_identity:
      environment:
        AWS_ACCESS_KEY_ID: AKIAAMBIENT
        AWS_SECRET_ACCESS_KEY: ambient-secret
        AWS_SESSION_TOKEN: ambient-session
        AWS_REGION: us-east-1
      token_reference: web-identity-token
      resolved_token: header.eyJhdWQiOiJsaXRlbGxtIn0.signature
      role_arn: 'arn:aws:iam::123456789012:role/TargetRole'
      session_name: bedrock-session
      max_policy_size: 75
      reply:
        credentials:
          access_key_id: ASIAFIXTURE
          secret_access_key: fixture-secret
          session_token: fixture-session
          expiration: '2026-01-01T01:00:00Z'
          packed_policy_size: 1
env: {}
compare: {ignore: []}
