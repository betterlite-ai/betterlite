kind: helper
name: bedrock-web-identity-invalid-identity-token-error
call:
  bedrock_web_identity:
    web_identity:
      environment:
        AWS_ACCESS_KEY_ID: AKIAAMBIENT
        AWS_SECRET_ACCESS_KEY: ambient-secret
        AWS_REGION: us-east-1
      token_reference: web-identity-token
      resolved_token: header.eyJhdWQiOiJsaXRlbGxtIn0.signature
      role_arn: 'arn:aws:iam::123456789012:role/TargetRole'
      session_name: bedrock-session
      reply:
        invalid_identity_token:
          message: the token is not valid
env: {}
compare: {ignore: []}
