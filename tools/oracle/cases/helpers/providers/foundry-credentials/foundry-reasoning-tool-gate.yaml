kind: helper
name: foundry-reasoning-tool-gate
call:
  foundry_credentials:
    reasoning_gate:
      - model: gpt-6
      - model: gpt-5.6
      - model: gpt-5
      - model: azure_ai/gpt-6-mini
      - model: gpt-5.5
      - model: gpt-6
        reasoning_effort: low
      - model: gpt-5.6
        reasoning_effort: low
      - model: gpt-5.5
        reasoning_effort: low
      - model: gpt-5.6
        reasoning_effort: {}
      - model: gpt-5.5
        reasoning_effort: {}
      - model: gpt-5.6
        reasoning_effort: ""
      - model: gpt-5.6
        reasoning_effort: false
      - model: gpt-5.6
        reasoning_effort: []
      - model: gpt-6
        reasoning_effort: {}
env: {}
compare: {ignore: []}
