    step:
      effort:
        model: "openai.gpt-5.6"
        params: {temperature: 0.2, top_p: 0.9, frequency_penalty: 0.1, logprobs: true, reasoning_effort: 3}
calls:
  - bedrock_reasoning_stream:
      step:
        effort:
          model: "openai.gpt-5.6"
          params: {reasoning_effort: none, temperature: 0.2, presence_penalty: null}
  - bedrock_reasoning_stream:
      step:
        effort:
          model: "openai.gpt-oss-120b-1:0"
          params: {temperature: 0.2, reasoning_effort: true}
  - bedrock_reasoning_stream:
      step:
        effort:
          model: "openai.gpt-5.6-2026-01-01"
          params: {top_logprobs: 2, temperature: null}
env: {}
compare: {ignore: []}
