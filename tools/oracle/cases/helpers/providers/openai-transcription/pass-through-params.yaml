kind: helper
name: openai-transcription-pass-through-params
call:
  openai_transcription:
    function: exchange
    probes:
      - model: whisper-1
        provider: whisper
        optional_params: {include: [logprobs], response_format: json}
        api_key: sk-fixture
        api_base: 'https://transcription.test/v1'
      - model: gpt-4o-transcribe
        provider: gpt
        optional_params: {timestamp_granularities: [word], response_format: json}
        api_key: sk-fixture
        api_base: 'https://transcription.test/v1'
      - model: whisper-1
        provider: whisper
        atranscription: true
        optional_params: {include: [logprobs], language: en}
        api_key: sk-fixture
        api_base: 'https://transcription.test/v1'
env: {}
compare: {ignore: []}
