kind: helper
name: openai-transcription-upstream-error
call:
  openai_transcription:
    function: exchange
    probes:
      - model: whisper-1
        provider: whisper
        api_key: sk-fixture
        api_base: 'https://transcription.test/v1'
        reply:
          status: 404
          headers: {content-type: application/json}
          body: '{"error":{"message":"The model does not exist","type":"invalid_request_error","param":"model","code":"model_not_found"}}'
      - model: whisper-1
        provider: whisper
        atranscription: true
        api_key: sk-fixture
        api_base: 'https://transcription.test/v1'
        reply:
          status: 404
          headers: {content-type: application/json}
          body: '{"error":{"message":"The model does not exist","type":"invalid_request_error","param":"model","code":"model_not_found"}}'
env: {}
compare: {ignore: []}
