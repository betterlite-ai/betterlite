kind: helper
name: openai-transcription-text-srt-vtt-body
call:
  openai_transcription:
    function: exchange
    probes:
      - model: whisper-1
        provider: whisper
        optional_params: {response_format: srt}
        api_key: sk-fixture
        api_base: 'https://transcription.test/v1'
        reply:
          status: 200
          headers: {content-type: text/plain}
          body: "1\n00:00:01,000 --> 00:00:02,000\nhi\n"
      - model: whisper-1
        provider: whisper
        atranscription: true
        optional_params: {response_format: vtt}
        api_key: sk-fixture
        api_base: 'https://transcription.test/v1'
        reply:
          status: 200
          headers: {content-type: text/plain}
          body: "WEBVTT\n\n00:00:01.500 --> 00:00:03.250\nhi"
env: {}
compare: {ignore: []}
