kind: helper
name: mcp-structured-fallback
call:
  agentcore_search_reply:
    status: 200
    headers: [[content-type, application/json]]
    body: '{"result":{"content":[{"type":"text","text":"prose only"}],"structuredContent":[{"title":"s1"},{"title":"s2"}]}}'
calls:
  - agentcore_search_reply:
      status: 200
      headers: [[content-type, application/json]]
      body: '{"result":{"content":[{"type":"text","text":"prose"}],"structuredContent":{"results":[{"title":"r"}]}}}'
  - agentcore_search_reply:
      status: 200
      headers: [[content-type, application/json]]
      body: '{"result":{"content":[{"type":"text","text":"[{}]"}],"structuredContent":[{"title":"s"}]}}'
  - agentcore_search_reply:
      status: 200
      headers: [[content-type, application/json]]
      body: '{"result":{"content":[{"type":"text","text":"[]"}],"structuredContent":[{"title":"s"}]}}'
  - agentcore_search_reply:
      status: 200
      headers: [[content-type, application/json]]
      body: '{"result":{"content":[{"type":"text","text":"[{\"title\":\"first\"}]"},{"type":"text","text":"[{\"title\":\"second\"}]"}]}}'
  - agentcore_search_reply:
      status: 200
      headers: [[content-type, application/json]]
      body: '{"result":{"content":[{"type":"text","text":"x"}],"structuredContent":"no"}}'
  - agentcore_search_reply:
      status: 200
      headers: [[content-type, application/json]]
      body: '{"result":{"content":[{"type":"text","text":"x"}]}}'
env: {}
compare: {ignore: []}
