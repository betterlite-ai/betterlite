kind: helper
name: client-secret-precedence
call:
  azure_credentials:
    token:
      - cache: []
        params: {tenant_id: tenant, client_id: client, client_secret: secret}
      - cache: []
        environment: {AZURE_TENANT_ID: env-tenant, AZURE_CLIENT_ID: env-client, AZURE_CLIENT_SECRET: env-secret}
      - cache: []
        params: {tenant_id: explicit-tenant, client_id: explicit-client, client_secret: explicit-secret}
        environment: {AZURE_TENANT_ID: env-tenant, AZURE_CLIENT_ID: env-client, AZURE_CLIENT_SECRET: env-secret}
      - cache: []
        params: {azure_ad_token: static-token, tenant_id: tenant, client_id: client, client_secret: secret}
      - cache: []
        params: {tenant_id: tenant, client_id: client, client_secret: secret}
        provider: {outcome: token, token: caller-token}
      - cache: []
        params: {tenant_id: tenant, client_id: client, client_secret: secret, azure_username: user, azure_password: password}
env: {}
compare: {ignore: []}
