kind: helper
name: malformed-rule-warnings
call:
  catalog_generalizations:
    rules:
      - {name: no-pattern, model_info: {}}
      - {pattern: p1, model_info: []}
      - {model_info: {}}
      - {name: null, pattern: p2}
      - {name: 3, pattern: 5, model_info: {}}
      - {pattern: "(", model_info: {}, fill_missing_for_providers: 5}
      - {pattern: "it's(", model_info: {}}
      - {name: fills, pattern: f, model_info: {}, fill_missing_for_providers: openai}
      - {pattern: f2, model_info: {}, fill_missing_for_providers: [1]}
      - {pattern: prov, model_info: {litellm_provider: null}}
      - {pattern: ok, model_info: {mode: chat}}
    routing: [prov]
    capabilities: [ok, f2, p1]
    fill_missing: []
env: {}
compare:
  ignore:
    - pointer: /value/warnings/5/message
      why: the invalid-regex warning ends with the regex engine's own error text; the subject still compares the pattern
    - pointer: /value/warnings/6/message
      why: the invalid-regex warning ends with the regex engine's own error text; the subject still compares the pattern
