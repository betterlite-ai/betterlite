kind: helper
name: openai-files-delete-object
call:
  openai_files:
    action: delete_file
    client: {api_key: sk-files, api_base: 'https://files.test/v1', supplied: null, is_async: true}
    request:
      file_id: file-gone
    reply:
      status: 200
      headers: [[content-type, application/json]]
      json: {id: file-gone, object: file, deleted: true}
env: {}
compare: {ignore: []}
