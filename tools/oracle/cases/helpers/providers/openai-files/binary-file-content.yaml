kind: helper
name: openai-files-binary-file-content
call:
  openai_files:
    action: file_content
    client: {api_key: sk-files, api_base: 'https://files.test/v1', supplied: null, is_async: true}
    request:
      file_id: file-bin
      extra_headers: {x-trace: abc}
      extra_body: {dropped: 'yes'}
    reply:
      status: 200
      headers: [[content-type, application/octet-stream], [x-request-id, req-1]]
      chunks: [[0, 255, 10, 128]]
env: {}
compare: {ignore: []}
