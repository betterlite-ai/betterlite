      receive_failures: []
      client_send_failures: []
      bedrock_close_error: false
    - kind: client
      trace_id: trace-bridge-1
      initial: '{"type": "session.update", "session": {}}'
      frames:
      - '{"type":"input_audio_buffer.append","audio":"AAAA"}'
      - null
