kind: helper
name: bedrock-services-passthrough-event-stream-collector
call:
  bedrock_services_passthrough:
    kind: collector
    model: anthropic.claude-3-sonnet-20240229-v1:0
    endpoint: /model/m/converse
    split: true
    frames:
      - {event_type: contentBlockDelta, payload: '{"contentBlockIndex":0,"delta":{"text":"a"}}'}
      - {event_type: contentBlockDelta, payload: '{"contentBlockIndex":0,"delta":{"text":"b"}}'}
      - {event_type: messageStop, payload: '{"stopReason":"end_turn"}'}
      - {event_type: metadata, payload: '{"usage":{"inputTokens":3,"outputTokens":4,"totalTokens":7}}'}
env: {}
compare: {ignore: []}
