    function: completion
    cases:
      - model: gpt-35-turbo-instruct
        messages:
          - {role: user, content: Hello}
        api_key: sk-unit
        api_base: https://unit.test
        api_version: "2024-02-01"
        timeout: 30.0
        optional_params: {prompt: overridden}
      - model: gpt-35-turbo-instruct
        messages:
          - {role: user, content: Hello}
        api_key: sk-unit
        api_base: https://unit.test
        api_version: "2024-02-01"
        timeout: 30.0
        acompletion: true
        optional_params: {prompt: overridden}
env: {}
compare: {ignore: []}
