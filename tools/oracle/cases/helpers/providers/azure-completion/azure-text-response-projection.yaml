          body: '{"id":"cmpl-9","object":"text_completion","created":1234,"model":"gpt-35-turbo-instruct","system_fingerprint":"fp_1","choices":[{"text":"A","index":5,"logprobs":null,"finish_reason":"length"},{"text":"B","index":9,"finish_reason":"stop"}],"usage":{"prompt_tokens":3,"completion_tokens":2,"total_tokens":5}}'
