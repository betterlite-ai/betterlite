kind: helper
name: request-credentials-rejected
call:
  bedrock_services_s3_access:
    operation: request_credentials_rejected
    trusted:
      - [s3_bucket_name, first]
      - [s3_bucket_name, trusted]
      - [nested, [1, 2]]
    plain:
      - [s3_bucket_name, plain]
    malformed:
      - [s3_bucket_name, 42]
    request_bucket_name: request-bucket
    request_output_bucket_name: request-output
    environment:
      AWS_S3_BUCKET_NAME: env-bucket
      AWS_S3_OUTPUT_BUCKET_NAME: env-output
env: {}
compare: {ignore: []}
