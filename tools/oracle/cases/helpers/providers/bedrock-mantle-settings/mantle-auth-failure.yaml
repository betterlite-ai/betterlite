kind: helper
name: mantle-auth-failure
call:
  bedrock_mantle_settings:
    mantle_auth_failure:
      cases:
        - {kind: no_credentials}
        - {kind: partial_credentials}
        - {kind: profile_not_found}
        - {kind: credential_retrieval}
        - {kind: region, aws_region_name: NOT A REGION, api_base: 'https://proxy.example/v1'}
env: {}
compare: {ignore: []}
