kind: helper
name: standalone-mantle-base
call:
  bedrock_mantle_settings:
    standalone_mantle_base:
      model_cost:
        bedrock_mantle/openai.gpt-oss-120b: {use_openai_responses_path: false}
        bedrock_mantle/gpt-5.2: {use_openai_responses_path: true}
      cases:
        - {model: openai.gpt-oss-120b, inject_signer: true}
        - {aws_region_name: eu-west-3}
        - {api_base: 'https://bedrock-mantle.eu-west-3.api.aws/v1'}
        - {environment: {AWS_REGION: eu-central-1}}
        - {model: eu-west-2/openai.gpt-oss-120b}
        - {model: gpt-5.2}
        - {api_key: explicit-fixture-key}
        - {environment: {BEDROCK_MANTLE_API_KEY: mantle-fixture-key}}
        - {environment: {BEDROCK_MANTLE_API_BASE: 'https://bedrock-mantle.ap-south-1.api.aws/openai/v1'}}
        - {aws_region_name: NOT A REGION}
        - {api_base: 'https://proxy.example/v1', model: gpt-5.2}
env: {}
compare: {ignore: []}
