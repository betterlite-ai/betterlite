kind: helper
name: native-session-and-state
call:
  bedrock_services_realtime_events:
    ids:
    - 00000000-0000-4000-8000-000000000001
    - 00000000-0000-4000-8000-000000000002
    - 00000000-0000-4000-8000-000000000003
    - 00000000-0000-4000-8000-000000000004
    - 00000000-0000-4000-8000-000000000005
    - 00000000-0000-4000-8000-000000000006
    - 00000000-0000-4000-8000-000000000007
    - 00000000-0000-4000-8000-000000000008
    - 00000000-0000-4000-8000-000000000009
    - 00000000-0000-4000-8000-000000000010
    - 00000000-0000-4000-8000-000000000011
    - 00000000-0000-4000-8000-000000000012
    - 00000000-0000-4000-8000-000000000013
    - 00000000-0000-4000-8000-000000000014
    steps:
    - method: dispatch
      message: '{"event": {"sessionStart": {"sessionId": "s"}}}'
      state:
        session_configuration_request: null
        current_output_item_id: null
        current_response_id: null
        current_delta_chunks: []
        current_item_chunks: []
        current_conversation_id: null
        current_delta_type: null
    - method: dispatch
      message: '{"event": {"sessionStart": {"sessionId": "s"}}}'
      state:
        session_configuration_request: '{"configured": true}'
        current_output_item_id: item_kept
        current_response_id: resp_kept
        current_delta_chunks:
        - content_index: 0
          delta: kept
          event_id: event_kept
          item_id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.text.delta
        current_item_chunks:
        - event_id: event_item
          item:
            id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.output_item.done
        current_conversation_id: conv_kept
        current_delta_type: text
    - method: dispatch
      message: '{"event": {"sessionEnd": {"sessionId": "s"}}}'
      state:
        session_configuration_request: '{"configured": true}'
        current_output_item_id: item_kept
        current_response_id: resp_kept
        current_delta_chunks:
        - content_index: 0
          delta: kept
          event_id: event_kept
          item_id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.text.delta
        current_item_chunks:
        - event_id: event_item
          item:
            id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.output_item.done
        current_conversation_id: conv_kept
        current_delta_type: text
    - method: dispatch
      message: '{"event": {"contentStart": {"role": "ASSISTANT", "type": "AUDIO"}}}'
      state:
        session_configuration_request: '{"configured": true}'
        current_output_item_id: item_kept
        current_response_id: resp_kept
        current_delta_chunks:
        - content_index: 0
          delta: kept
          event_id: event_kept
          item_id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.text.delta
        current_item_chunks:
        - event_id: event_item
          item:
            id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.output_item.done
        current_conversation_id: conv_kept
        current_delta_type: text
    - method: dispatch
      message: '{"event": {"textOutput": {"content": "audio text"}}}'
      state:
        session_configuration_request: '{"configured": true}'
        current_output_item_id: item_kept
        current_response_id: resp_kept
        current_delta_chunks:
        - content_index: 0
          delta: kept
          event_id: event_kept
          item_id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.text.delta
        current_item_chunks:
        - event_id: event_item
          item:
            id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.output_item.done
        current_conversation_id: conv_kept
        current_delta_type: audio
    - method: dispatch
      message: '{"event": {"contentEnd": {"stopReason": "MAX_TOKENS"}}}'
      state:
        session_configuration_request: '{"configured": true}'
        current_output_item_id: item_kept
        current_response_id: resp_kept
        current_delta_chunks:
        - content_index: 0
          delta: kept
          event_id: event_kept
          item_id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.text.delta
        - type: response.text.delta
          content_index: 0
          event_id: event_00000000-0000-4000-8000-000000000003
          item_id: item_kept
          output_index: 0
          response_id: resp_kept
          delta: audio text
        current_item_chunks:
        - event_id: event_item
          item:
            id: item_kept
          output_index: 0
          response_id: resp_kept
          type: response.output_item.done
        current_conversation_id: conv_kept
        current_delta_type: audio
env: {}
compare:
  ignore: []
