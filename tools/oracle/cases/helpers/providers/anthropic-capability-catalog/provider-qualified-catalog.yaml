kind: helper
name: provider-qualified-catalog
call:
  anthropic_capability_catalog:
    fixture:
      model_cost:
        anthropic/claude-x: {litellm_provider: anthropic, supports_adaptive_thinking: true}
        claude-y: {litellm_provider: anthropic, supports_adaptive_thinking: false}
        claude-z: {litellm_provider: anthropic}
      packaged:
        claude-x: {thinking_always_on: true}
        claude-y: {supports_adaptive_thinking: true}
        claude-z: {supports_legacy_thinking: true}
      thresholds: {medium: 2048, high: 4096, xhigh: 8192}
    steps:
      - {function: provider_qualified_catalog, model: claude-x, custom_llm_provider: anthropic}
      - {function: provider_qualified_catalog, model: claude-y, custom_llm_provider: anthropic}
      - {function: provider_qualified_catalog, model: claude-z, custom_llm_provider: anthropic}
env: {}
compare: {ignore: []}
