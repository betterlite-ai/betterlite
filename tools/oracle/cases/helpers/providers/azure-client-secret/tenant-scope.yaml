kind: helper
name: tenant-scope
call:
  azure_client_secret:
    action: tenant_scope
    steps:
      - environment: {}
        tenant_id: contoso.onmicrosoft.com
        client_id: client
        client_secret: secret
        scope: https://management.azure.com/.default
        replies:
          - url_contains: well-known
            status: 200
            body: '{"authorization_endpoint":"https://login.microsoftonline.com/contoso.onmicrosoft.com/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/contoso.onmicrosoft.com/oauth2/v2.0/token"}'
          - url_contains: /oauth2/v2.0/token
            status: 200
            body: '{"access_token":"tok-value","expires_in":3600}'
      - environment: {}
        tenant_id: tenant
        client_id: client
        client_secret: secret
        scope: ''
        replies:
          - url_contains: well-known
            status: 200
            body: '{"authorization_endpoint":"https://login.microsoftonline.com/tenant/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/tenant/oauth2/v2.0/token"}'
          - url_contains: /oauth2/v2.0/token
            status: 200
            body: '{"access_token":"tok-value","expires_in":3600}'
      - environment: {}
        tenant_id: ''
        client_id: client
        client_secret: secret
        replies: []
      - environment: {}
        tenant_id: tenant
        client_id: ''
        client_secret: secret
        replies: []
      - environment: {}
        tenant_id: tenant
        client_id: client
        client_secret: ''
        replies: []
      - environment: {}
        tenant_id: tenant name
        client_id: client
        client_secret: secret
        replies: []
env: {}
compare: {ignore: []}
