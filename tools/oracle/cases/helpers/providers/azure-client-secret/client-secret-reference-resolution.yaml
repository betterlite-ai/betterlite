kind: helper
name: client-secret-reference-resolution
call:
  azure_client_secret:
    action: client_secret_reference_resolution
    steps:
      - environment:
          TENANT: resolved-tenant
          CLIENT: resolved-client
          SECRET: resolved-secret
        tenant_id: os.environ/TENANT
        client_id: os.environ/CLIENT
        client_secret: os.environ/SECRET
        scope: custom-scope
      - environment: {}
        tenant_id: ''
        client_id: literal-client
        client_secret: ''
      - environment: {}
        tenant_id: os.environ/MISSING
        client_id: client
        client_secret: secret
        replies: []
      - environment:
          BOOL: 'true'
        tenant_id: tenant
        client_id: client
        client_secret: os.environ/BOOL
env: {}
compare: {ignore: []}
