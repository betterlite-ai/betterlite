kind: helper
name: client-secret-provider-cache
call:
  azure_client_secret:
    action: client_secret_provider_cache
    steps:
      - environment: {}
        calls:
          - {tenant_id: tenant-alpha, client_id: client-alpha, client_secret: secret-alpha}
          - {tenant_id: tenant-alpha, client_id: client-alpha, client_secret: secret-alpha}
      - environment: {}
        calls:
          - {tenant_id: tenant-beta, client_id: client-beta, client_secret: secret-beta}
      - environment: {}
        calls:
          - {tenant_id: tenant-alpha, client_id: client-alpha, client_secret: secret-alpha}
      - environment:
          SECRET: resolved-secret
        calls:
          - {tenant_id: tenant-alpha, client_id: client-alpha, client_secret: os.environ/SECRET}
          - {tenant_id: tenant-alpha, client_id: client-alpha, client_secret: resolved-secret}
      - environment:
          SECRET: rotated-secret
        calls:
          - {tenant_id: tenant-alpha, client_id: client-alpha, client_secret: os.environ/SECRET}
env: {}
compare: {ignore: []}
