        - {function: run_status, api_base: "https://base.example", api_version: "2025-05-01", thread_id: thread-1, run_id: "run/1"}
        - {function: messages, api_base: "https://base.example", api_version: "2025-05-01", thread_id: "%41", run_id: r}
        - {function: messages, api_base: "https://base.example/", api_version: "2025-05-01", thread_id: t, run_id: r}
        - {function: runs, api_base: "", api_version: "", thread_id: t, run_id: r}
  - foundry_agent_requests:
      paths:
        - {function: messages, api_base: "https://base.example", api_version: "2025-05-01", thread_id: "", run_id: r}
        - {function: runs, api_base: "https://base.example", api_version: "2025-05-01", thread_id: ".", run_id: r}
        - {function: run_status, api_base: "https://base.example", api_version: "2025-05-01", thread_id: "..", run_id: r}
        - {function: run_status, api_base: "https://base.example", api_version: "2025-05-01", thread_id: thread-1, run_id: ""}
