kind: helper
name: azure-message-attachments-invalid-attachment-drop
call:
  azure_message_attachments:
    map_create_message_params:
      - non_default: {attachments: [{file_id: file-1}, {tools: []}, {file_id: file-2}]}
        optional: {}
        drop_params: true
      - non_default: {attachments: [{file_id: file-1, tools: [{type: code_interpreter}]}]}
        optional: {file_ids: [old]}
        drop_params: true
      - non_default: {attachments: []}
        optional: {attachments: [{file_id: kept}]}
        drop_params: true
env: {}
compare: {ignore: []}
