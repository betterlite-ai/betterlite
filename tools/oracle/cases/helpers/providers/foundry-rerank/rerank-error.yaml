kind: helper
name: foundry-rerank-error
call:
  foundry_rerank:
    replies:
    - {status: 502, body: upstream unavailable}
    - {status: 400, body: ""}
    - {status: 429, body: '{"error":{"message":"rate limited"}}'}
    - {status: 200, body: '{"results":"wrong"}'}
    - {status: 200, body: '[]'}
    - {status: 500, body: '{"id":"rerank-id","results":[]}'}
    - {status: 500, body: '{"id":"rerank-id","results":[],"meta":{"api_version":{"version":"1"},"billed_units":{"search_units":1}}}'}
env: {}
compare: {ignore: []}
