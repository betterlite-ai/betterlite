kind: helper
name: bedrock-services-batch-status-handler-region-and-time
call:
  bedrock_services_batch_status:
    operation: region_and_time
    arns:
      - "arn:aws:bedrock:us-east-1:123456789012:model-invocation-job/job-abc"
      - "arn:aws:bedrock:us-east-1"
      - "arn:aws:bedrock::acct:x"
      - "arn:aws:s3:us-east-1:acct:x"
      - "arn:aws:bedrock"
      - ""
      - "garbage"
      - "arn:aws:s3-bedrock:us-east-1:acct:x"
    times:
      - integer: 5
      - float: 1.9
      - float: -1.9
      - boolean: true
      - boolean: false
      - datetime: "2024-01-15T10:30:00.5Z"
      - datetime: "1969-12-31T23:59:59.5Z"
      - text: "5"
      - "null": null
      - nonfinite: inf
      - nonfinite: -inf
      - nonfinite: nan
env:
  TZ: UTC
compare: {ignore: []}
