kind: helper
name: text-input-type-truncate
call:
  foundry_embeddings:
    flows:
      - mode: sync
        model: offer-cohere-embed-english-paygo
        input: [plain text, 'data:image/png;base64,AAAA']
        options: {input_type: search_document, truncate: END, custom: value}
        api_base: https://acct.services.ai.azure.com/v1
        api_key: case-key
        timeout: 5
        image_reply: {status: 200, headers: [], body: '{"object":"list","data":[{"object":"embedding","index":7,"embedding":[0.5]}],"model":"image-model"}'}
        text_reply: {status: 200, headers: [], body: '{"object":"list","data":[{"object":"embedding","index":3,"embedding":[0.2,0.3]}],"model":"text-model","usage":{"prompt_tokens":3,"completion_tokens":0,"total_tokens":4}}'}
        client: openai
