        input: ['plain data:image/png;base64,AAAA']
        options: {}
        api_base: https://acct.services.ai.azure.com/v1
        api_key: case-key
        timeout: 5
        image_reply: {status: 200, headers: [], body: '{"object":"list","data":[],"model":"image-model"}'}
