kind: helper
name: embedding-credentials
call:
  bedrock_embedding_io:
    function: embedding_credentials
    environment: {}
    optional_params:
      dimensions: 512
      normalize: true
    credentials:
      access_key_id: AKIDEXAMPLE
      secret_access_key: SECRETEXAMPLE
calls:
  - bedrock_embedding_io:
      function: embedding_credentials
      environment:
        AWS_REGION: ap-south-1
      optional_params:
        aws_region_name: eu-west-1
        aws_access_key_id: AKIDEXAMPLE
        aws_secret_access_key: SECRETEXAMPLE
        aws_session_token: session-token
        aws_session_name: session-name
        aws_profile_name: profile
        aws_role_name: role
        aws_web_identity_token: web-token
        aws_sts_endpoint: https://sts.example
        aws_external_id: external
        aws_session_tags:
          - Key: a
            Value: b
        extra:
          nested:
            - 1
            - 2
      credentials:
        access_key_id: AKIDEXAMPLE
        secret_access_key: SECRETEXAMPLE
  - bedrock_embedding_io:
      function: embedding_credentials
      environment:
        AWS_REGION_NAME: ap-south-1
      optional_params:
        dimensions: 256
      credentials:
        access_key_id: AKIDEXAMPLE
        secret_access_key: SECRETEXAMPLE
  - bedrock_embedding_io:
      function: embedding_credentials
      environment:
        AWS_REGION_NAME: ap-south-1
        AWS_REGION: eu-central-1
      optional_params: {}
      credentials:
        access_key_id: AKIDEXAMPLE
        secret_access_key: SECRETEXAMPLE
        session_token: session-token
  - bedrock_embedding_io:
      function: embedding_credentials
      environment:
        AWS_REGION_NAME: ''
        AWS_REGION: ''
      optional_params:
        dimensions: 512
      credentials:
        access_key_id: AKIDEXAMPLE
        secret_access_key: SECRETEXAMPLE
  - bedrock_embedding_io:
      function: embedding_credentials
      environment: {}
      optional_params:
        dimensions: 512
      bearer_token: bedrock-bearer
      credentials:
        access_key_id: AKIDEXAMPLE
        secret_access_key: SECRETEXAMPLE
  - bedrock_embedding_io:
      function: embedding_credentials
      environment: {}
      optional_params:
        dimensions: 512
      bearer_token: ''
      credentials:
        access_key_id: AKIDEXAMPLE
        secret_access_key: SECRETEXAMPLE
  - bedrock_embedding_io:
      function: embedding_credentials
      environment: {}
      optional_params:
        aws_region_name: null
      credentials:
        access_key_id: AKIDEXAMPLE
        secret_access_key: SECRETEXAMPLE
env: {}
compare:
  ignore: []
