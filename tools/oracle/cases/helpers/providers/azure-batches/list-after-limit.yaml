    - action: list
      after: batch_x
      limit: 5
      args: {api_key: ll-2, api_base: "https://fixture.test", api_version: "2024-10-21", timeout: 7.5, max_retries: 7, organization: org-x}
      reply: {status: 200, body: {object: list, data: [], has_more: false}}
    - action: list
