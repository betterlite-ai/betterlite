kind: helper
name: fireworks-catalog-metadata-exact-capability
call:
  fireworks_catalog_metadata:
    catalog:
      - {key: "raw-model", model_info: {supports_vision: true}}
      - {key: "fireworks_ai/some-model", model_info: {supports_vision: true}}
      - {key: "fireworks_ai/accounts/fireworks/models/some-model", model_info: {supports_vision: false}}
      - {key: "fireworks_ai/accounts/fireworks/models/vision-less", model_info: {}}
      - {key: "later-model", model_info: {}}
      - {key: "fireworks_ai/later-model", model_info: {supports_vision: true}}
      - {key: "fireworks_ai/accounts/fireworks/routers/firerouter", model_info: {supports_vision: true, supports_function_calling: false}}
      - {key: "fireworks_ai/accounts/fireworks/models/glm-5p2", model_info: {supports_vision: false}}
    steps:
      - {op: exact_capability, model: "raw-model", capability: supports_vision}
      - {op: exact_capability, model: "some-model", capability: supports_vision}
      - {op: exact_capability, model: "fireworks_ai/some-model", capability: supports_vision}
      - {op: exact_capability, model: "accounts/fireworks/models/some-model", capability: supports_vision}
      - {op: exact_capability, model: "later-model", capability: supports_vision}
      - {op: exact_capability, model: "vision-less", capability: supports_vision}
      - {op: exact_capability, model: "firerouter/opus", capability: supports_vision}
      - {op: exact_capability, model: "firerouter/kimi-k3/deepseek-v4", capability: supports_function_calling}
      - {op: exact_capability, model: "firerouter", capability: supports_vision}
      - {op: exact_capability, model: "kimi-k2p6-fast", capability: supports_vision}
      - {op: exact_capability, model: "custom-glm-5p2", capability: supports_vision}
      - {op: exact_capability, model: "missing-model", capability: supports_vision}
      - {op: capability, model: "custom-glm-5p2", capability: supports_vision}
env: {}
compare: {ignore: []}
