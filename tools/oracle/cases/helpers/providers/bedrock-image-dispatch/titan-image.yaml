kind: helper
name: bedrock-image-dispatch-titan-image
call:
  bedrock_image_dispatch:
    case: titan_image
    model_cost: {}
    probes:
      - model: amazon.titan-image-generator-v2:0
        prompt: a titan seed
        optional_params:
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_region_name: us-east-1
          imageGenerationConfig: {numberOfImages: 2, width: 512, height: 512}
          negativeText: a blurred seed
        extra_headers: {x-oracle-extra: titan-dropped}
        reply: {body: '{"images": ["dGl0YW4x", "dGl0YW4y"]}'}
      - model: amazon.titan-image-generator-v2:0
        prompt: a titan seed
        optional_params:
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_region_name: us-east-1
        reply:
          status: 429
          headers: {x-amzn-errortype: ThrottlingException}
          body: '{"message": "slow down"}'
      - model: amazon.titan-image-generator-v2:0
        prompt: a proxied titan seed
        optional_params:
          aws_access_key_id: AKIAIOSFODNN7EXAMPLE
          aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          aws_region_name: us-east-1
        api_base: https://bedrock-proxy.example
        api_key: titan-bearer
        reply: {body: '{"images": ["cHJveHk="]}'}
env: {}
compare: {ignore: []}
