kind: helper
name: jwt-settings-routing-override-required-issuer-and-oauth2-only
call:
  jwt_settings:
    scenarios:
      - {"settings": {"routing_overrides": [{"iss": "https://idp.example.com", "client_id": ["cli-a", "cli-b"], "scope": "", "aud": []}]}, "references": {}, "environment": {}, "issuers": []}
