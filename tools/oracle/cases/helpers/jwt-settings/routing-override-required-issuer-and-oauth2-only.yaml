      - {"settings": {"routing_overrides": [{"client_id": "cli"}]}, "references": {}, "environment": {}, "issuers": []}
      - {"settings": {"routing_overrides": [{"iss": "https://idp.example.com", "path": "api_key"}]}, "references": {}, "environment": {}, "issuers": []}
      - {"settings": {"routing_overrides": [{"iss": "https://idp.example.com", "wildcard": true}]}, "references": {}, "environment": {}, "issuers": []}
env: {}
compare: {ignore: []}
