kind: helper
name: bedrock-tool-results-result-document
call:
  bedrock_tool_results:
    function: tool_call_result
    message:
      role: tool
      tool_call_id: call_doc
      content:
        - {type: file, file: {file_data: "data:application/pdf;base64,QUJD"}}
        - {type: file, file: {file_id: "data:image/png;base64,QUJD", format: "image/png"}}
        - {type: file, file: {file_data: "data:image/png;base64,QUJD", format: "image/webp"}}
    id: unused-fixed-id
env: {}
compare:
  ignore: []
