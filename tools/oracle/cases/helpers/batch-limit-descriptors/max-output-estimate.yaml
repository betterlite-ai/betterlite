      - function: estimate_output_tokens
        entry:
          body:
            max_tokens: " 12 "
        min_configured_otpm_limit: null
      - function: estimate_output_tokens
        entry:
          body:
            max_tokens: "abc"
        min_configured_otpm_limit: null
      - function: estimate_output_tokens
        entry:
          body:
            max_tokens: 10
            n: 3
        min_configured_otpm_limit: null
      - function: estimate_output_tokens
        entry:
          body:
            n: 3
        min_configured_otpm_limit: null
      - function: estimate_output_tokens
        entry:
          body: {}
        min_configured_otpm_limit: 100
