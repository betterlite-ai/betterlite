kind: helper
name: refresh-write-fails
call:
  b4664:
    function: refresh
    user_id: user-1
    assertion:
      claims: {iss: https://idp.example, sub: user-1, exp: 2000000000}
      refresh_token: carried-token
    vars:
      GENERIC_TOKEN_ENDPOINT: https://idp.example/token
      GENERIC_CLIENT_ID: client-id
      GENERIC_CLIENT_SECRET: client-secret
    outcome:
      kind: ok
      body:
        claims: {iss: https://idp.example, sub: user-1, exp: 2000003600}
        refresh_token: rotated-token
    failure: write
calls:
  - b4664:
      function: refresh
      user_id: user-1
      assertion:
        claims: {iss: https://idp.example, sub: user-1, exp: 2000000000}
        refresh_token: carried-token
      vars:
        GENERIC_TOKEN_ENDPOINT: https://idp.example/token
        GENERIC_CLIENT_ID: client-id
        GENERIC_CLIENT_SECRET: client-secret
      outcome:
        kind: ok
        body:
          claims: {iss: https://idp.example, sub: user-1, exp: 2000003600}
          refresh_token: rotated-token
      failure: read
env: {}
compare: {ignore: []}
