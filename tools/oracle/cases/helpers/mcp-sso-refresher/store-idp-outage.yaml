kind: helper
name: store-idp-outage
call:
  b4664:
    function: store
    user_id: user-1
    now_ms: 2000000000000
    rows:
      user-1:
        claims: {iss: https://idp.example, sub: user-1, exp: 1999999990}
        refresh_token: carried-token
    vars:
      GENERIC_TOKEN_ENDPOINT: https://idp.example/token
      GENERIC_CLIENT_ID: client-id
      GENERIC_CLIENT_SECRET: client-secret
    outcome:
      kind: unavailable
      detail: the IdP token endpoint is unreachable
env: {}
compare: {ignore: []}
