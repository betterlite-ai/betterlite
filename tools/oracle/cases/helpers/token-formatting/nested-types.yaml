kind: helper
name: token-formatting-nested-types
call:
  token_formatting:
    function: format_tools
    tools:
      - type: function
        function:
          name: nested
          parameters:
            type: object
            properties:
              filter:
                type: object
                description: Nested filter
                properties:
                  active:
                    type: boolean
                  deleted_at:
                    type: "null"
                  tags:
                    type: array
                    items:
                      type: string
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                required: [active]
              anything:
                type: opaquetype
              untyped: {}
env: {}
compare: {ignore: []}
