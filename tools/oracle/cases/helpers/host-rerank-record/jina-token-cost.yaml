kind: helper
name: host-rerank-record-jina-token-cost
call:
  host_rerank_record:
    provider: jina
    model: jina-reranker-v2
    api_key: jk
    input_cost_per_token: 0.25
    options: {query: q, documents: [a]}
    reply:
      status: 200
      body: '{"usage":{"total_tokens":8,"input_tokens":8},"results":[{"index":0,"relevance_score":0.5,"document":"a"}]}'
env: {}
compare: {ignore: []}
