          litellm_metadata: null
        router: missing
      - messages:
          - role: assistant
            content: [compaction]
        kwargs:
          litellm_metadata: text
        router: missing
      - messages:
          - role: assistant
            content: [compaction]
        kwargs:
          litellm_metadata: [1, 2]
        router: missing
      - messages:
          - role: assistant
            content: [compaction]
        kwargs:
          litellm_metadata:
            user_api_key_auth: null
        router: missing
