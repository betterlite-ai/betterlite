        router: missing
      - messages:
          - role: assistant
            content:
              - {type: 7, content: S}
        kwargs: {}
        router: missing
      - messages:
          - role: assistant
            content: [compaction]
        kwargs: {}
        router: missing
      - messages:
          - role: assistant
        kwargs: {}
        router: missing
      - messages: []
        kwargs: {}
        router: missing
      - messages:
          - role: assistant
            content: [compaction]
