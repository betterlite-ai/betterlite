kind: helper
name: sso-claims-nested-extra-fields
call:
  sso_claims:
    attributes:
      GENERIC_USER_ID_ATTRIBUTE: uid
      GENERIC_USER_DISPLAY_NAME_ATTRIBUTE: profile.name
      GENERIC_USER_EMAIL_ATTRIBUTE: contact.mail
      GENERIC_USER_FIRST_NAME_ATTRIBUTE: given_name
      GENERIC_USER_LAST_NAME_ATTRIBUTE: family_name
      GENERIC_USER_PROVIDER_ATTRIBUTE: idp
      GENERIC_USER_ROLE_ATTRIBUTE: custom_roles
      GENERIC_USER_EXTRA_ATTRIBUTES: tenant.id, metadata.tier ,kubernetes\.io.namespace,absent,
    emails: []
    groups: []
    role_mappings: null
    merge: []
    decode_tokens: []
    process: []
    convert:
      response:
        uid: user-2
        profile:
          name: Profile Name
        contact:
          mail: Nested@Example.com
        given_name: Given
        family_name: Family
        idp: okta
        custom_roles:
        - internal_user
        - proxy_admin
        tenant:
          id: t-1
        tier: gold
        kubernetes.io:
          namespace: ns
        absent: null
      jwt_settings: {}
      sso_settings: null
      role_mappings:
        provider: OKTA
        group_claim: groups
        default_role: null
        roles: {}
      team_mappings: null
env: {}
compare:
  ignore: []
