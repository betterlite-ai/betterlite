kind: helper
name: mcp-admin-credential-view-secrets-dropped-admin-config-kept
call:
  b10134:
    server:
      server_id: test-srv-1
      transport: http
      credentials:
        auth_value: test-secret
        client_id: test-client
        client_secret: test-client-secret
        scopes: [read, write]
        aws_access_key_id: test-aws-key
        aws_secret_access_key: test-aws-secret
        aws_session_token: test-aws-session
        upstream_resource: https://mcp.example.test/resource
        upstream_token_header: X-Upstream-Token
        client_private_key: test-private-key
      mcp_info:
        protocol_version: "2025-06-18"
        owner: platform
    config_servers:
      - {server_id: test-srv-1, name: Test Server, transport: http}
    db_servers: []
    public_mcp_servers: [test-srv-1]
    public_hub_strict: true
env: {}
compare: {ignore: []}
