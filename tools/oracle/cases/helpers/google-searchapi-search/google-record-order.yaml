kind: helper
name: google-record-order
call:
  b8024:
    provider: google_pse
    query: "rust search"
    optional_params:
      max_results: 15
      search_domain_filter: ["first.example", "second.example"]
      country: "us"
      start: 3
    api_key: "caller-key"
    api_base: null
    search_engine_id: "engine-id"
    environment: {}
    headers: {}
env: {}
compare: {ignore: []}
