kind: helper
name: proxy-span-tagging
call:
  datadog_tags:
    function: tags
    env:
      DD_SOURCE: custom-source
      DD_SERVICE: custom-service
      DD_ENV: production
      DD_VERSION: v1
      DD_BASE_URL: https://dd.example
    request_tags: [" Foo.Bar ", "A__B / C"]
    metadata:
      team_alias: platform
env: {}
compare: {ignore: []}
