kind: helper
name: fireworks-ai-chat-params-response-format-with-tools
call:
  b6071:
    catalog:
      - {key: "fireworks_ai/accounts/fireworks/models/schema-model", model_info: {litellm_provider: fireworks_ai, supports_function_calling: true}}
    steps:
      - op: map_params
        model: "schema-model"
        non_default_params:
          tools: [{type: "function", function: {name: "get_weather", parameters: {type: "object"}}}]
          response_format: {type: "json_schema", json_schema: {name: "answer", schema: {type: "object", properties: {answer: {type: "string"}}}}}
      - op: map_params
        model: "schema-model"
        optional_params: {tools: [{type: "function", function: {name: "kept"}}]}
        non_default_params:
          response_format: {response_schema: {type: "string"}}
          tools: [{type: "function", function: {name: "given"}}]
      - op: map_params
        model: "schema-model"
        non_default_params: {tools: [{type: "function", function: {name: "only"}}], response_format: {}}
      - op: map_params
        model: "schema-model"
        non_default_params: {response_format: {type: "text"}, temperature: 0.3}
      - op: map_params
        model: "schema-model"
        non_default_params: {tools: null, response_format: {type: "text"}}
      - op: map_params
        model: "schema-model"
        non_default_params: {tools: [{type: "function", function: {name: "raw"}}], response_format: {json_schema: {schema: null}}}
env: {}
compare: {ignore: []}
