kind: helper
name: tools-verdict-true-unknown
call:
  b5831:
    model_cost:
      together_ai/together-b5831-tools-true: {litellm_provider: together_ai, mode: chat, supports_function_calling: true}
      together_ai/together-b5831-tools-unknown: {litellm_provider: together_ai, mode: chat}
    chat_map:
      - model: together-b5831-tools-true
        params: {tools: [{type: function, function: {name: lookup}}], tool_choice: auto, function_call: {name: lookup}}
      - model: together-b5831-tools-unknown
        params: {tools: [{type: function, function: {name: lookup}}], tool_choice: auto}
      - model: together-b5831-no-entry
        params: {tools: [{type: function, function: {name: lookup}}]}

env: {}
compare: {ignore: []}
