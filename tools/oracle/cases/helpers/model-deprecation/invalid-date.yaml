kind: helper
name: model-deprecation-invalid-date
call:
  model_deprecation:
    now: "2026-05-01T12:00:00Z"
    model_cost:
      openai/raw: {deprecation_date: "2026-04-01", litellm_provider: openai}
    deployments:
      - model_name: text-invalid
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: "date when the model becomes deprecated"}
      - model_name: impossible
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: "2026-02-30"}
      - model_name: datetime-text
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: "2026-04-01T00:00:00Z"}
      - model_name: number-date
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: 20260401}
      - model_name: list-date
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: [2026, 4, 1]}
env: {}
compare: {ignore: []}
