kind: helper
name: model-deprecation-date-input-kinds
call:
  model_deprecation:
    now: "2026-05-01T12:00:00Z"
    model_cost:
      marked/model: {deprecation_date: {kind: date, value: "2026-05-13"}, litellm_provider: marked}
    deployments:
      - model_name: from-date
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: {kind: date, value: "2026-05-10"}}
      - model_name: from-datetime
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: {kind: datetime, value: "2026-05-11T18:00:00+02:00"}}
      - model_name: from-text
        litellm_params: {model: openai/raw}
        model_info: {deprecation_date: "20260512"}
      - model_name: from-catalog
        litellm_params: {model: marked/model}
env: {}
compare: {ignore: []}
