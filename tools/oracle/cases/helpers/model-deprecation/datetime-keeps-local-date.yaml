kind: helper
name: model-deprecation-datetime-keeps-local-date
call:
  model_deprecation:
    now: "2026-05-01T12:00:00Z"
    model_cost: {}
    deployments:
      - model_name: late-evening
        model_info: {deprecation_date: {kind: datetime, value: "2026-05-01T23:30:00-05:00"}}
      - model_name: early-morning
        model_info: {deprecation_date: {kind: datetime, value: "2026-05-02T01:30:00+09:00"}}
      - model_name: naive
        model_info: {deprecation_date: {kind: datetime, value: "2026-05-03T10:00:00"}}
env: {}
compare: {ignore: []}
