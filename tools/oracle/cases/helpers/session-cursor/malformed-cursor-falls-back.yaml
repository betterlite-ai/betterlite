kind: helper
name: session-cursor-malformed-cursor-falls-back
call:
  session_cursor:
    cursor: null
calls:
  - session_cursor:
      cursor: "2026-01-01 00:00:00|only-one-separator"
  - session_cursor:
      cursor: "|hashed-key|session-1"
  - session_cursor:
      cursor: ""
  - session_cursor:
      cursor: "2026-01-01 00:00:00|hashed-key|session-1|"
env: {}
compare: {ignore: []}
