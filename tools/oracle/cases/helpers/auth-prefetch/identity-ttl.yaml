kind: helper
name: auth-prefetch-identity-ttl
call:
  auth_prefetch:
    op: identity_ttl
    ttls:
      - value: "[]"
        management_ttl: 60.0
      - value: "[]"
        management_ttl: 12.0
      - value: "[]"
        management_ttl: 3600.0
      - value: []
        management_ttl: 60.0
      - value: null
        management_ttl: 60.0
      - value: true
        management_ttl: 60.0
      - value: 7
        management_ttl: 60.0
      - value: {registry: overflow}
        management_ttl: 45.0
env: {}
compare: {ignore: []}
