kind: helper
name: explicit_colon_credentials
call:
  dataforseo_search:
    calls:
      - {kind: validate_environment, api_key: "login:password"}
      - {kind: validate_environment, api_key: "login:pass:word", headers: {X-Extra: kept}}
      - {kind: validate_environment, api_key: "login:password", api_base: "https://evil.test"}
      - {kind: validate_environment, api_key: ":"}
      - {kind: validate_environment, api_key: "user:"}
env: {}
compare: {ignore: []}
