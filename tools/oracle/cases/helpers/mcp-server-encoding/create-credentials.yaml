kind: helper
name: mcp-server-encoding-create-credentials
call:
  b4710:
    function: prepare_create
    salt_key: encoding-salt
    request:
      server_id: s1
      server_name: srv
      credentials:
        auth_value: auth-value
        client_id: client-id
        client_secret: client-secret
        client_private_key: private-key
        aws_access_key_id: access-key
        aws_secret_access_key: aws-secret
        aws_session_token: session-token
        aws_region_name: us-east-1
        aws_service_name: bedrock-agentcore
        scopes: [read, write]
env:
  LITELLM_SALT_KEY: encoding-salt
compare: {ignore: []}
