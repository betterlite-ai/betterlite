kind: helper
name: tavily-country-lowercase
call:
  b8021:
    provider: tavily
    calls:
      - operation: transform_search_request
        query: rust
        optional_params:
          country: US
          max_results: 3
      - operation: transform_search_request
        query: rust
        optional_params:
          country: De
      - operation: transform_search_request
        query: rust
        optional_params:
          max_results: 0
      - operation: transform_search_request
        query: rust
        optional_params:
          max_tokens_per_page: 512
          topic: news
env: {}
compare:
  ignore: []
