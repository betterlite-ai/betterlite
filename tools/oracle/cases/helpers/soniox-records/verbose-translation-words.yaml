kind: helper
name: soniox-records-verbose-translation-words
call:
  soniox_records:
    calls:
    - function: response
      payload:
        tokens:
        - {text: Hello, start_ms: 0, end_ms: 500}
        - {text: Hola, start_ms: null, end_ms: null, translation_status: translation}
        - {text: world, start_ms: 500, end_ms: 1000}
      response_format: verbose_json
    - function: response
      payload:
        tokens:
        - {start_ms: 0}
        - {start_ms: 1, end_ms: 2}
      response_format: verbose_json
    - function: response
      payload:
        tokens:
        - {text: a, start_ms: true, end_ms: false}
        - {text: b, start_ms: 1, end_ms: 0}
      response_format: verbose_json
    - function: response
      payload:
        transcript: {tokens: [], text: t}
      response_format: verbose_json
    - function: response
      payload:
        tokens:
        - {text: a, speaker: 1, language: es}
        - {text: b, speaker: 1, language: es, translation_status: translation}
      response_format: verbose_json
    - function: response
      payload:
        tokens:
        - {text: a, start_ms: 5}
      response_format: verbose_json
    - function: response
      payload:
        text: chosen
        tokens:
        - {text: a, start_ms: 0}
      response_format: verbose_json
compare: {ignore: []}
env: {}
