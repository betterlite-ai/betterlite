kind: helper
name: gated-and-credentialed-exporters
call:
  b8910:
    function: is_gated
    config:
      exporters:
        - {}
        - requires_headers: true
        - requires_headers: true
          headers: ""
        - requires_headers: true
          headers: api-key=abc
        - kind: otlp_http
          endpoint: https://collector.example/v1/traces
          requires_headers: true
        - headers: authorization=Bearer operator
      mapper_names: [genai]
      capture_message_content: no_content
calls:
  - b8910:
      function: is_credential_gated
      config:
        exporters:
          - requires_headers: true
          - {}
        mapper_names: [genai]
        capture_message_content: no_content
  - b8910:
      function: is_credential_gated
      config:
        exporters:
          - {}
        mapper_names: [genai]
        capture_message_content: no_content
  - b8910:
      function: is_credential_gated
      config:
        exporters: []
        mapper_names: [genai]
        capture_message_content: no_content
env: {}
compare:
  ignore: []
