kind: helper
name: key-event-sinks-delete-secret-batch
call:
  key_event_sinks:
    settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: "litellm/", description: null, tags: null}
    client: true
    runtime: ready
    teams:
      team-eu: {secret_manager_settings: {region: eu-west-1}}
      team-us: {secret_manager_settings: {region: us-east-1}}
      team-empty: {secret_manager_settings: {}}
      team-text: {secret_manager_settings: not-a-mapping}
    secrets: {}
    failing: []
    alerting: []
    steps:
      - action: delete
        keys:
          - {token: hashed-1, key_alias: alias-eu-1, team_id: team-eu}
          - {token: hashed-2, key_alias: null, team_id: team-eu}
          - {token: hashed-3, key_alias: alias-eu-2, team_id: team-eu}
          - {token: hashed-4, key_alias: alias-us, team_id: team-us}
          - {token: hashed-5, key_alias: "", team_id: null}
          - {token: hashed-6, key_alias: alias-none, team_id: null}
          - {token: hashed-7, key_alias: alias-empty, team_id: team-empty}
          - {token: hashed-8, key_alias: alias-text, team_id: team-text}
          - {token: hashed-9, key_alias: alias-unknown, team_id: team-unknown}
          - {token: hashed-10, key_alias: alias-unknown-2, team_id: team-unknown}
      - action: delete
        keys:
          - {token: null, key_alias: null, team_id: null}
          - {token: hashed-11, key_alias: alias-eu-3, team_id: team-eu}
      - {action: delete, keys: []}
calls:
  - key_event_sinks:
      settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: litellm, description: null, tags: null}
      client: true
      runtime: ready
      teams:
        team-eu: {secret_manager_settings: {region: eu-west-1}}
      secrets: {}
      failing: [litellm/alias-broken]
      alerting: []
      steps:
        - action: delete
          keys:
            - {token: hashed-1, key_alias: alias-first, team_id: team-eu}
            - {token: hashed-2, key_alias: alias-broken, team_id: team-eu}
            - {token: hashed-3, key_alias: alias-after, team_id: team-eu}
            - {token: hashed-4, key_alias: null, team_id: null}
  - key_event_sinks:
      settings: {store_virtual_keys: false, prefix_for_stored_virtual_keys: litellm, description: null, tags: null}
      client: true
      runtime: ready
      teams:
        team-eu: {secret_manager_settings: {region: eu-west-1}}
      secrets: {}
      failing: []
      alerting: []
      steps:
        - action: delete
          keys:
            - {token: hashed-1, key_alias: alias-first, team_id: team-eu}
            - {token: hashed-2, key_alias: null, team_id: null}
  - key_event_sinks:
      settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: litellm, description: null, tags: null}
      client: false
      runtime: ready
      teams: {}
      secrets: {}
      failing: []
      alerting: []
      steps:
        - action: delete
          keys:
            - {token: hashed-1, key_alias: alias-first, team_id: null}
            - {token: hashed-2, key_alias: null, team_id: null}
env: {}
compare: {ignore: []}
