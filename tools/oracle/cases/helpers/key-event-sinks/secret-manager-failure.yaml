kind: helper
name: key-event-sinks-secret-manager-failure
call:
  key_event_sinks:
    settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: litellm, description: stored by betterlite, tags: {env: prod}}
    client: true
    runtime: ready
    teams:
      team-eu: {secret_manager_settings: {region: eu-west-1}}
    secrets: {litellm/broken-alias: sk-broken-value, litellm/readable-alias: sk-readable-value}
    failing: [litellm/broken-alias, litellm/refused-write]
    alerting: []
    steps:
      - {action: store, secret_name: refused-write, secret_token: sk-created, team_id: team-eu}
      - {action: rotate, current_secret_name: broken-alias, new_secret_name: next-alias, new_secret_value: sk-next, team_id: team-eu}
      - {action: rename, current_secret_name: broken-alias, new_secret_name: renamed-alias, team_id: null}
      - {action: store, secret_name: missing-team, secret_token: sk-created, team_id: team-unknown}
      - {action: rename, current_secret_name: readable-alias, new_secret_name: renamed-alias, team_id: team-unknown}
calls:
  - key_event_sinks:
      settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: litellm, description: null, tags: null}
      client: true
      runtime: ready
      teams:
        team-null: {secret_manager_settings: null}
        team-list: {secret_manager_settings: [region]}
      secrets: {}
      failing: []
      alerting: []
      steps:
        - {action: store, secret_name: null-settings, secret_token: sk-created, team_id: team-null}
        - {action: store, secret_name: list-settings, secret_token: sk-created, team_id: team-list}
env: {}
compare: {ignore: []}
