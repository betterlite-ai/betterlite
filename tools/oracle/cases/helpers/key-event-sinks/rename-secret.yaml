kind: helper
name: key-event-sinks-rename-secret
call:
  key_event_sinks:
    settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: litellm, description: stored by betterlite, tags: {env: prod, owner: platform}}
    client: true
    runtime: ready
    teams:
      team-eu: {secret_manager_settings: {region: eu-west-1, kms_key_id: key-eu}}
      team-plain: {owner: ops}
    secrets: {litellm/old-alias: sk-old-value, litellm/plain-alias: sk-plain-value}
    failing: []
    alerting: []
    steps:
      - {action: store, secret_name: new-alias, secret_token: sk-created, team_id: team-eu}
      - {action: store, secret_name: no-team, secret_token: sk-no-team, team_id: null}
      - {action: rotate, current_secret_name: old-alias, new_secret_name: rotated-alias, new_secret_value: sk-rotated, team_id: team-eu}
      - {action: rename, current_secret_name: old-alias, new_secret_name: renamed-alias, team_id: team-eu}
      - {action: rename, current_secret_name: plain-alias, new_secret_name: plain-renamed, team_id: team-plain}
      - {action: rename, current_secret_name: absent-alias, new_secret_name: never-written, team_id: null}
calls:
  - key_event_sinks:
      settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: "vault/", description: null, tags: null}
      client: true
      runtime: no_database
      teams:
        team-eu: {secret_manager_settings: {region: eu-west-1}}
      secrets: {vault/old-alias: sk-old-value}
      failing: []
      alerting: []
      steps:
        - {action: store, secret_name: new-alias, secret_token: sk-created, team_id: team-eu}
        - {action: rename, current_secret_name: old-alias, new_secret_name: renamed-alias, team_id: team-eu}
  - key_event_sinks:
      settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: "", description: "", tags: {}}
      client: true
      runtime: absent
      teams: {}
      secrets: {/old-alias: sk-old-value}
      failing: []
      alerting: []
      steps:
        - {action: store, secret_name: new-alias, secret_token: sk-created, team_id: team-eu}
        - {action: rotate, current_secret_name: old-alias, new_secret_name: next-alias, new_secret_value: sk-next, team_id: null}
        - {action: rename, current_secret_name: old-alias, new_secret_name: renamed-alias, team_id: null}
  - key_event_sinks:
      settings: {store_virtual_keys: false, prefix_for_stored_virtual_keys: litellm, description: null, tags: null}
      client: true
      runtime: ready
      teams:
        team-eu: {secret_manager_settings: {region: eu-west-1}}
      secrets: {litellm/old-alias: sk-old-value}
      failing: []
      alerting: []
      steps:
        - {action: store, secret_name: new-alias, secret_token: sk-created, team_id: team-eu}
        - {action: rotate, current_secret_name: old-alias, new_secret_name: next-alias, new_secret_value: sk-next, team_id: team-eu}
        - {action: rename, current_secret_name: old-alias, new_secret_name: renamed-alias, team_id: team-eu}
  - key_event_sinks:
      settings: {store_virtual_keys: null, prefix_for_stored_virtual_keys: litellm, description: null, tags: null}
      client: true
      runtime: ready
      teams: {}
      secrets: {litellm/old-alias: sk-old-value}
      failing: []
      alerting: []
      steps:
        - {action: store, secret_name: new-alias, secret_token: sk-created, team_id: null}
        - {action: rename, current_secret_name: old-alias, new_secret_name: renamed-alias, team_id: null}
  - key_event_sinks:
      settings: {store_virtual_keys: true, prefix_for_stored_virtual_keys: litellm, description: null, tags: null}
      client: false
      runtime: ready
      teams:
        team-eu: {secret_manager_settings: {region: eu-west-1}}
      secrets: {litellm/old-alias: sk-old-value}
      failing: []
      alerting: []
      steps:
        - {action: store, secret_name: new-alias, secret_token: sk-created, team_id: team-eu}
        - {action: rotate, current_secret_name: old-alias, new_secret_name: next-alias, new_secret_value: sk-next, team_id: team-eu}
        - {action: rename, current_secret_name: old-alias, new_secret_name: renamed-alias, team_id: team-eu}
env: {}
compare: {ignore: []}
