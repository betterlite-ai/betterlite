kind: helper
name: resource-repository-config-json-invalid
call:
  resource_repository:
    raw: 'abc'
calls:
  - resource_repository:
      raw: ''
  - resource_repository:
      raw: '{'
  - resource_repository:
      raw: '{} {}'
  - resource_repository:
      raw: '{"a":}'
  - resource_repository:
      raw: '{"a":1} trailing'
env: {}
compare: {ignore: []}
