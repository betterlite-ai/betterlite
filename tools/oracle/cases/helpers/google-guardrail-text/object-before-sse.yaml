kind: helper
name: google-guardrail-text-object-before-sse
call:
  google_guardrail_text:
    calls:
      - function: stream
        frames:
          - {candidates: [{content: {parts: [{text: obj1}]}}]}
          - "data: {\"candidates\":[{\"content\":{\"parts\":[{\"text\":\"sse1\"}]}}]}\n\n"
          - {candidates: [{content: {parts: [{text: obj2}]}}]}
          - "data: {\"candidates\":[{\"content\":{\"parts\":[{\"text\":\"sse2\"}]}}]}\n\n"
        replacement: [changed]
        request_data: {model: gemini-2.5-flash}
env: {}
compare: {ignore: []}
