kind: helper
name: retry-exhaustion
call:
  catalog_fetch_policy:
    operation: fetch_with_retry
    url: https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json
    timeout: 5
    max_attempts: 3
    jitter: ["0.25", "0.5"]
    replies:
      - status: 503
        body: '{}'
      - status: 502
        body: '{}'
      - status: 504
        body: '{}'
      - status: 200
        body: '{}'
compare: {ignore: []}
env: {}
