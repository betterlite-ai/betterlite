kind: helper
name: json-chat-policy-publicai-content-collapse
call:
  json_chat_policy:
    calls:
      - kind: messages
        model: publicai/swiss-ai/apertus-8b-instruct
        environment: {}
        messages:
          - role: user
            content:
              - {type: text, text: hello}
              - {type: text, text: " world"}
          - role: assistant
            content: plain
          - role: user
            content: []
env: {}
compare: {ignore: []}
