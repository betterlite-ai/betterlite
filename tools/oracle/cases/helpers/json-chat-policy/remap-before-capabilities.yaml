      - kind: params
        model: sail/openai/gpt-oss-120b
        environment: {}
        supports_function_calling: true
        supports_reasoning: true
        non_default:
          max_completion_tokens: 16
          temperature: 2
          reasoning_effort: high
          tools: [{type: function}]
        optional: {temperature: 1}
      - kind: params
        model: scx-ai/some-model
        environment: {}
        supports_function_calling: false
        supports_reasoning: false
        non_default:
          max_completion_tokens: 16
          temperature: 5
          n: 2
        optional: {}
env: {}
compare: {ignore: []}
