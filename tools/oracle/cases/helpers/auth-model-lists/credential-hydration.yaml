kind: helper
name: auth-model-lists-credential-hydration
call:
  auth_model_lists:
    function: complete_model_list
    key_models: []
    team_models: []
    proxy_model_list: [openai/*]
    user_model: null
    infer_model_from_keys: false
    return_wildcard_routes: false
    model_access_groups: {}
    include_model_access_groups: false
    only_model_access_groups: false
    team_id: null
    deployments:
      - model_name: openai/*
        litellm_params:
          model: openai/gpt-4o
          litellm_credential_name: creds-first
          api_key: null
          api_base: ""
        team_id: null
        team_public_model_name: null
    catalog:
      "openai|first-key||None": [openai/from-first-key]
      "openai|second-key||None": [openai/from-second-key]
    credentials:
      - credential_name: creds-first
        credential_values:
          api_key: first-key
          api_base: https://hydrated.test
      - credential_name: creds-first
        credential_values:
          api_key: second-key
calls:
  - auth_model_lists:
      function: complete_model_list
      key_models: []
      team_models: []
      proxy_model_list: [openai/*]
      user_model: null
      infer_model_from_keys: false
      return_wildcard_routes: false
      model_access_groups: {}
      include_model_access_groups: false
      only_model_access_groups: false
      team_id: null
      deployments:
        - model_name: openai/*
          litellm_params:
            model: openai/gpt-4o
            litellm_credential_name: missing
            api_key: null
          team_id: null
          team_public_model_name: null
      catalog:
        "openai|None|None|missing": [openai/from-missing]
      credentials: []
  - auth_model_lists:
      function: complete_model_list
      key_models: []
      team_models: []
      proxy_model_list: [openai/*]
      user_model: null
      infer_model_from_keys: false
      return_wildcard_routes: false
      model_access_groups: {}
      include_model_access_groups: false
      only_model_access_groups: false
      team_id: null
      deployments:
        - model_name: openai/*
          litellm_params:
            model: openai/gpt-4o
            litellm_credential_name: empty
            api_key: null
          team_id: null
          team_public_model_name: null
      catalog:
        "openai|None|None|empty": [openai/from-empty]
      credentials:
        - credential_name: empty
          credential_values: {}
  - auth_model_lists:
      function: complete_model_list
      key_models: []
      team_models: []
      proxy_model_list: [openai/*]
      user_model: null
      infer_model_from_keys: false
      return_wildcard_routes: false
      model_access_groups: {}
      include_model_access_groups: false
      only_model_access_groups: false
      team_id: null
      deployments:
        - model_name: openai/*
          litellm_params:
            model: openai/gpt-4o
            litellm_credential_name: unfillable
            api_key: null
          team_id: null
          team_public_model_name: null
      catalog:
        "openai|None|None|None": [openai/from-cleared]
      credentials:
        - credential_name: unfillable
          credential_values:
            model: openai/other
  - auth_model_lists:
      function: complete_model_list
      key_models: []
      team_models: []
      proxy_model_list: [openai/*]
      user_model: null
      infer_model_from_keys: false
      return_wildcard_routes: false
      model_access_groups: {}
      include_model_access_groups: false
      only_model_access_groups: false
      team_id: null
      deployments:
        - model_name: openai/*
          litellm_params:
            model: openai/gpt-4o
            litellm_credential_name: creds-first
            api_key: explicit-key
          team_id: null
          team_public_model_name: null
      catalog:
        "openai|explicit-key|None|None": [openai/from-explicit]
      credentials:
        - credential_name: creds-first
          credential_values:
            api_key: first-key
env: {}
compare: {ignore: []}
