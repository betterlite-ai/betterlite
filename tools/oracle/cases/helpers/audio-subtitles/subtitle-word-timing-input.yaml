kind: helper
name: audio-subtitles-subtitle-word-timing-input
call:
  audio_subtitles:
    calls:
      - {function: synthesize, response_format: "srt", words: [{"word": "Hello", "start": 0, "end": 1, "extra": {"ignored": true}}]}
      - {function: synthesize, response_format: "vtt", words: [{"word": "Hello", "start": 0, "end": 1}]}
      - {function: synthesize, response_format: "json", words: [{"word": "Hello", "start": 0, "end": 1}]}
      - {function: synthesize, response_format: "SRT", words: [{"word": "Hello", "start": 0, "end": 1}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "Hi", "start": "0.5", "end": "1.25"}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "Hi", "start": "bad", "end": 1}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "Hi", "start": 0, "speaker": 7}]}
      - {function: synthesize, response_format: "srt", words: [{"start": 0, "end": 1}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "A", "start": 0.0005, "end": 0.0015}]}
      - {function: synthesize, response_format: "vtt", words: [{"word": "A", "start": 0.0025, "end": 0.0035}]}
      - {function: synthesize, response_format: "srt", words: {"word": "A", "start": 0}}
      - {function: synthesize, response_format: "srt", words: null}
      - {function: synthesize, response_format: "srt", words: [{"word": "Hi", "start": true, "end": false}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "Hi", "start": null, "end": 1}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "Hello", "start": 0, "end": 0.5}, {"word": "world", "start": 0.6, "end": 1}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "A", "start": "nan", "end": 1}]}
      - {function: synthesize, response_format: "vtt", words: [{"word": "A", "start": "inf", "end": 1}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "A", "start": "-Infinity", "end": 1}]}
      - {function: synthesize, response_format: "srt", words: [{"word": "A", "start": "nan"}, {"word": "B", "start": 0}]}
env: {}
compare: {ignore: []}
