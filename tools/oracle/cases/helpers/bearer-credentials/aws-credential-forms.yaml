kind: helper
name: bearer-credentials-aws-credential-forms
call:
  b10086:
    operation: bearer
    value: "AWS4-HMAC-SHA256 Credential=Bearer sk-12345/20250101/us-east-1/bedrock/aws4_request, SignedHeaders=host, Signature=abc"
calls:
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256Credential=k/x"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=Bearer/x"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=AKIDEXAMPLE/20250101/us-east-1/service/aws4_request"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=plain, Credential=Bearer sk-9/x"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=one, Credential=two"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=Bearer  sk-8/x"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=Bearer\u001csk-7/20250101"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=sk-7\u001erest"}
  - b10086: {operation: bearer, value: "AWS4-HMAC-SHA256 Credential=sk-7 rest"}
env: {}
compare:
  ignore: []
