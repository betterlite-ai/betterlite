kind: helper
name: vertex-rag-store-poll-operation-error
call:
  b3455:
    options:
      vector_store:
        vertex_project: proj
    responses:
      - status: 200
        body: '{"done":false,"name":"operations/1"}'
      - status: 200
        body: '{"done":true,"error":{"code":5,"message":"boom"}}'
env: {}
compare:
  ignore:
    - pointer: /value/failure
      why: LiteLLM writes the operation with Python dict repr and betterlite writes compact JSON, the deviation in docs/deviations/B3455.yaml
