          status: 200
          body: '{"contexts":{"contexts":[{"text":"a","sourceUri":"gs://b/a.pdf","sourceDisplayName":"a.pdf"},{"text":"b","sourceDisplayName":"b.pdf"},{"text":"c"}]}}'
env: {}
compare: {ignore: []}
