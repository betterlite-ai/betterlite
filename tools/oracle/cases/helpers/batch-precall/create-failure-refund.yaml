kind: helper
name: batch-precall-create-failure-refund
call:
  batch_precall:
    call:
      op: create_failure
    stages:
      skip: false
      usage:
        total_tokens: 25
        request_count: 2
        output_tokens: 0
        per_model_usage: {}
      reject: false
      rejection: ""
      backend: memory
      owner: worker-a
    stash:
      reservation:
        tokens: 25
        scopes:
          - key: api_key
            value: caller-key
            limit: 1000
        backend: memory
        owner: worker-a
      operations: []
      refund_failure: null
    memory:
      entries: {}
      faults: []
    remote:
      scan_keys: []
      batch_entries: {}
      get_value: null
      faults: []
    verbose_stdout: false
env: {}
compare: {ignore: []}
