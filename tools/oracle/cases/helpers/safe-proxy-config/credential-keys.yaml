kind: helper
name: safe-proxy-config-credential-keys
call:
  b10058:
    config:
      guardrails:
        - litellm_params:
            "api_base": openai
            "api_key": openai
            "mode": pre_call
      litellm_settings:
        "api_base": openai
        "cache_params":
          "host": openai
          "type": redis
        "callbacks": [openai]
        "failure_callback": [smtp_email]
        "success_callback": [openai]
      model_list:
        - litellm_params:
            "model": openai/gpt-4
      router_settings:
        "redis_host": openai
        "redis_password": openai
        "set_verbose": true
    general_settings:
      "alerting_threshold": openai
      "database_url": openai
      "key_management_system": local
      "master_key": true
      "store_model_in_db": false
calls:
  - b10058:
      config:
        guardrails:
          - litellm_params:
              "api_key": [openai, true]
        litellm_settings:
          "api_base": [openai]
          "callbacks": [openai]
        router_settings:
          "redis_url": openai
      general_settings:
        "database_url": openai
        "store_model_in_db": true
env: {}
compare: {ignore: []}
