kind: helper
name: metadata-filter-constraints
call:
  lens_state:
    decode_settings:
      json:
        name: Support replies
        model: gpt-4o-mini
        context: Replies cite the help center.
        filters:
          - {key: env, value: prod}
          - {key: region, value: eu}
          - {key: tier, value: gold}
          - {key: app, value: web}
          - {key: team, value: support}
          - {key: lang, value: en}
          - {key: channel, value: chat}
          - {key: version, value: "2"}
          - {key: shard, value: "7"}
env: {}
compare:
  ignore:
    - pointer: /error/message
      why: betterlite writes its own error message
