            groundingChunkIndices: [1]
          - segment: {startIndex: 5, endIndex: 6}
            groundingChunkIndices: [2]
          - segment: {startIndex: 7, endIndex: 8}
            groundingChunkIndices: [3]
env: {}
compare: {ignore: []}
