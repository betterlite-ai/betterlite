kind: helper
name: gemini-history-assistant-images
call:
  gemini_history:
    cases:
      - model: "gemini-3-pro-preview"
        messages:
          - {role: user, content: "q"}
          - role: assistant
            content: "a"
            images:
              - type: image_url
                index: 0
                image_url: {url: "data:image/png;base64,YWJj", detail: "high", format: "image/gif", mime_type: "image/webp"}
      - model: "gemini-3-pro-preview"
        messages:
          - {role: user, content: "q"}
          - role: assistant
            content: "a"
            images:
              - type: image_url
                index: 0
                image_url: {url: "data:image/png;base64,YWJj", detail: "high", mime_type: "image/webp", content_type: "image/bmp"}
      - model: "gemini-2.5-flash"
        messages:
          - {role: user, content: "q"}
          - role: assistant
            content: "a"
            images:
              - type: image_url
                index: 0
                image_url: {url: "data:image/png;base64,YWJj", detail: "high", content_type: "image/bmp"}
env: {}
compare:
  ignore: []
