kind: helper
name: documentation-entry
call:
  model_fields:
    source: >-
      {"code_interpreter_cost_per_session":0.0,"deprecation_date":"date when the model becomes deprecated in the format YYYY-MM-DD","litellm_provider":"one of https://docs.litellm.ai/docs/providers","max_input_tokens":"max input tokens, if the provider specifies it. if not default to max_tokens","mode":"one of: chat, embedding, completion, image_generation, audio_transcription, audio_speech, image_generation, moderation, rerank, search","supported_regions":["global","us-west-2","eu-west-1","ap-southeast-1","ap-northeast-1"],"supports_audio_input":true,"supports_vision":true}
compare:
  ignore:
    - pointer: /error/message
      why: betterlite and the Python mirror word the rejected field's message differently

env: {}
