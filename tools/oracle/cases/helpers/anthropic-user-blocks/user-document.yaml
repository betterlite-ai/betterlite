kind: helper
name: anthropic-user-blocks-user-document
call:
  anthropic_user_blocks:
    function: user_blocks
    model: claude-sonnet-4-5
    llm_provider: anthropic
    modify_params: false
    messages:
      - role: user
        content:
          - type: document
            source: {type: text, media_type: text/plain, data: aGk=}
            title: notes
            cache_control: {type: ephemeral}
          - type: file
            file:
              file_data: "data:application/pdf;base64,QUJD"
              format: application/pdf
            cache_control: {type: ephemeral}
env: {}
compare:
  ignore: []
