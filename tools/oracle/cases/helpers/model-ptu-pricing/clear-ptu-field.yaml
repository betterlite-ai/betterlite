kind: helper
name: model-ptu-pricing-clear-ptu-field
call:
  model_ptu_pricing:
    salt_key: b833-salt
    ptu_enabled: true
    calls:
      - function: delta
        stored_model_info: {id: m1, team_id: t1, ptu_count: 2, cost_per_ptu_per_hour: 1.5, ptu_effective_from: "2026-01-01T00:00:00Z"}
        model_info: {id: m1, team_id: t1, ptu_effective_from: "2026-01-01T00:00:00Z", input_cost_per_token: 0.0, output_cost_per_token: 0.00001, tiered_pricing: [], search_context_cost_per_query: {search_context_size_low: 0.0, search_context_size_high: 0.0}}
        litellm_params: {model: azure/gpt-4o, cache_read_input_token_cost: 0.0, input_cost_per_second: 0, output_cost_per_token: 0.00001, input_cost_per_character: {}, rpm: 0}
        patch:
          model_info: {ptu_count: null, cost_per_ptu_per_hour: null}
      - function: delta
        stored_model_info: {id: m1, team_id: t1, ptu_count: 2, cost_per_ptu_per_hour: 1.5}
        model_info: {id: m1, team_id: t1, input_cost_per_token: 0.0}
        litellm_params: {model: azure/gpt-4o, input_cost_per_token: 0.0}
        patch:
          litellm_params: {input_cost_per_token: 0.0}
          model_info: {cost_per_ptu_per_hour: null}
      - function: delta
        stored_model_info: {id: m1, cost_per_ptu_per_hour: 1.5}
        model_info: {id: m1, input_cost_per_token: 0.0}
        litellm_params: {model: azure/gpt-4o}
        patch:
          model_info: {cost_per_ptu_per_hour: null}
      - function: delta
        stored_model_info: {id: m1, team_id: t1, ptu_count: 2, cost_per_ptu_per_hour: 1.5, ptu_effective_to: "2027-01-01T00:00:00Z"}
        model_info: {id: m1, team_id: t1, input_cost_per_token: 0.0}
        litellm_params: {model: azure/gpt-4o, input_cost_per_token: 0.0}
        patch:
          model_info: {ptu_effective_to: null}
      - function: delta
        stored_model_info: {id: m1, team_id: t1}
        model_info: {id: m1, team_id: t1, input_cost_per_token: 0.0}
        litellm_params: {model: azure/gpt-4o, input_cost_per_token: 0.0}
        patch:
          model_info: {ptu_count: null}
      - function: delta
        stored_model_info: {id: m1, team_id: t1, ptu_count: 2, cost_per_ptu_per_hour: 1.5}
        model_info: {id: m1, team_id: t1, input_cost_per_token: 0.0}
        litellm_params: {model: azure/gpt-4o, input_cost_per_token: 0.0}
        patch:
          litellm_params: {rpm: 5}
env:
  LITELLM_SALT_KEY: b833-salt
  LITELLM_ENABLE_PTU_COST_ATTRIBUTION: "true"
compare: {ignore: []}
