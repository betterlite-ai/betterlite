kind: helper
name: model-ptu-pricing-catalog-price
call:
  model_ptu_pricing:
    salt_key: b833-salt
    ptu_enabled: true
    calls:
      - function: catalog
        cost_map:
          azure/b833-catalog-base: {litellm_provider: azure, mode: chat, key: azure/b833-catalog-base, input_cost_per_token: 0.0000025, output_cost_per_token: 0.00001}
          azure/b833-catalog-deployment: {litellm_provider: azure, mode: chat, input_cost_per_token: 0.000001, output_cost_per_token: 0.000002}
        catalog:
          azure/b833-catalog-base: {litellm_provider: azure, input_cost_per_token: 0.000003, output_cost_per_token: 0.00001}
        model: azure/b833-catalog-deployment
        incoming: {key: azure/b833-catalog-base, base_model: azure/b833-catalog-base, input_cost_per_token: 0.0000025, output_cost_per_token: 0.00001, mode: chat}
      - function: catalog
        cost_map:
          azure/b833-catalog-base: {litellm_provider: azure, mode: chat, key: azure/b833-catalog-base, input_cost_per_token: 0.0000025, output_cost_per_token: 0.00001}
          azure/b833-catalog-deployment: {litellm_provider: azure, mode: chat, input_cost_per_token: 0.000001, output_cost_per_token: 0.000002}
        catalog:
          azure/b833-catalog-base: {litellm_provider: azure, input_cost_per_token: 0.000003, output_cost_per_token: 0.00001}
        model: azure/b833-catalog-deployment
        incoming: {key: azure/b833-catalog-base, input_cost_per_token: 0.000001, output_cost_per_token: 0.00001}
      - function: catalog
        cost_map:
          azure/b833-catalog-base: {litellm_provider: azure, mode: chat, key: azure/b833-catalog-base, input_cost_per_token: 0.0000025, output_cost_per_token: 0.00001}
        catalog:
          azure/b833-catalog-base: {litellm_provider: azure, input_cost_per_token: 0.000003, output_cost_per_token: 0.00001}
        model: azure/b833-catalog-deployment
        incoming: {key: azure/b833-catalog-other, base_model: azure/b833-catalog-unmapped, input_cost_per_token: 0.000003, output_cost_per_token: 0.00001}
      - function: catalog
        cost_map:
          azure/b833-catalog-deployment: {litellm_provider: azure, mode: chat, input_cost_per_token: 0.000001, output_cost_per_token: 0.000002}
        catalog:
          azure/b833-catalog-base: {litellm_provider: azure, input_cost_per_token: 0.000003}
        model: azure/b833-catalog-deployment
        incoming: {input_cost_per_token: 0.000001}
env:
  LITELLM_SALT_KEY: b833-salt
  LITELLM_ENABLE_PTU_COST_ATTRIBUTION: "true"
compare: {ignore: []}
