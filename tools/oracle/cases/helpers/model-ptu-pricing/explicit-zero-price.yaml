kind: helper
name: model-ptu-pricing-explicit-zero-price
call:
  model_ptu_pricing:
    salt_key: b833-salt
    ptu_enabled: true
    calls:
      - function: prices
        values:
          - 0
          - 0.0
          - -0.0
          - 0.000002
          - -1
          - true
          - false
          - "0.5"
          - null
          - {}
          - {search_context_size_low: 0, search_context_size_high: 0.0}
          - {search_context_size_low: 0, search_context_size_high: 0.01}
          - {tier: {rate: 1}}
          - []
          - [{range: [0, 1000]}]
      - function: priced
        model_info: {id: m1, team_id: t1, ptu_count: 2, cost_per_ptu_per_hour: 1.5}
        supplied: {input_cost_per_token: 0, output_cost_per_token: 0.0, search_context_cost_per_query: {search_context_size_low: 0}, tiered_pricing: []}
      - function: zeroed
        model_info: {id: m1, team_id: t1, ptu_count: 2, cost_per_ptu_per_hour: 1.5, ocr_cost_per_page: 0.01}
        litellm_params: {model: azure/gpt-4o, input_cost_per_token: 0, input_cost_per_pixel: 0, output_cost_per_second: 0.5}
        supplied: {input_cost_per_token: 0}
      - function: priced_deployment
        litellm_params: {model: azure/gpt-4o, input_cost_per_token: 0.0, allow_client_keepalive_override: false, use_in_pass_through: false, use_litellm_proxy: false, use_xai_oauth: false, merge_reasoning_content_in_choices: false}
        model_info: {id: m1, db_model: false, member_auto_router: false, team_id: t1, ptu_count: 2, cost_per_ptu_per_hour: 1.5, input_cost_per_token: 0.0}
env:
  LITELLM_SALT_KEY: b833-salt
  LITELLM_ENABLE_PTU_COST_ATTRIBUTION: "true"
compare: {ignore: []}
