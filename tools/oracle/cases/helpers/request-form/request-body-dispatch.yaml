kind: helper
name: request-body-dispatch
call:
  request_form:
    operation: request_body_dispatch
    method: POST
    content_type: application/json
    body: '{"x":1}'
calls:
  - request_form:
      operation: request_body_dispatch
      method: POST
      content_type: application/x-www-form-urlencoded
      body: x=1
  - request_form:
      operation: request_body_dispatch
      method: POST
      content_type: multipart/form-data; boundary=test
      body: "--test\r\nContent-Disposition: form-data; name=\"x\"\r\n\r\n1\r\n--test--\r\n"
  - request_form:
      operation: request_body_dispatch
      method: POST
      content_type: text/plain
      body: hi
  - request_form:
      operation: request_body_dispatch
      method: POST
      content_type: ""
      body: "{}"
  - request_form:
      operation: request_body_dispatch
      method: GET
      content_type: application/json
      body: '{"x":1}'
  - request_form:
      operation: request_body_dispatch
      method: DELETE
      content_type: application/json
      body: '{"x":1}'
  - request_form:
      operation: request_body_dispatch
      method: PUT
      content_type: application/json
      body: '{"x":1}'
env: {}
compare:
  ignore: []
