kind: helper
name: gemini-request-internal-extra-body-keys
call:
  gemini_request:
    model: gemini-2.5-pro
    provider: vertex_ai
    supports: {system_message: true, response_schema: true}
    modify_params: false
    messages:
      - {role: user, content: hi}
    optional_params:
      temperature: 0.5
      extra_body:
        cache: {type: ephemeral}
        tags: [internal]
        generationConfig: {seed: 7}
        safetySettings:
          - {category: HARM_CATEGORY_HATE_SPEECH, threshold: BLOCK_NONE}
    litellm_params: {}
env: {}
compare: {ignore: []}
