kind: helper
name: key-limit-policy-scalar-ordering
call:
  key_limit_policy:
    check: team
    request: {kind: generate, body: {rpm_limit_type: guaranteed_throughput, rpm_limit: 6}}
    team: {team_id: team-1, rpm_limit: 10}
    keys:
      - {token: k1, team_id: team-1, rpm_limit: 5}
calls:
  - key_limit_policy:
      check: team
      request: {kind: generate, body: {rpm_limit_type: guaranteed_throughput, rpm_limit: 5}}
      team: {team_id: team-1, rpm_limit: 10}
      keys:
        - {token: k1, team_id: team-1, rpm_limit: 5}
  - key_limit_policy:
      check: team
      request:
        kind: generate
        body: {rpm_limit_type: guaranteed_throughput, tpm_limit: 11, rpm_limit: 11}
      team: {team_id: team-1, tpm_limit: 10, rpm_limit: 10}
      keys: []
  - key_limit_policy:
      check: team
      request: {kind: generate, body: {rpm_limit_type: guaranteed_throughput, rpm_limit: 0}}
      team: {team_id: team-1, rpm_limit: 5}
      keys:
        - {token: k1, team_id: team-1, rpm_limit: 2}
        - {token: k2, team_id: team-1, rpm_limit: null}
        - {token: k3, team_id: team-1, rpm_limit: -1}
  - key_limit_policy:
      check: team
      request: {kind: generate, body: {rpm_limit_type: guaranteed_throughput, rpm_limit: 1}}
      team: {team_id: team-1, rpm_limit: 0}
      keys: []
  - key_limit_policy:
      check: team
      request: {kind: generate, body: {rpm_limit_type: guaranteed_throughput, rpm_limit: 0}}
      team: {team_id: team-1, rpm_limit: 0}
      keys: []
  - key_limit_policy:
      check: team
      request: {kind: generate, body: {rpm_limit_type: guaranteed_throughput, rpm_limit: 100}}
      team: {team_id: team-1}
      keys:
        - {token: k1, team_id: team-1, rpm_limit: 10}
  - key_limit_policy:
      check: team
      request: {kind: generate, body: {rpm_limit_type: guaranteed_throughput, rpm_limit: -1}}
      team: {team_id: team-1, rpm_limit: 5}
      keys:
        - {token: k1, team_id: team-1, rpm_limit: 10}
env: {}
compare: {ignore: []}
