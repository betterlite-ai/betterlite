kind: helper
name: model-visibility-invalid-pattern-propagates
call:
  model_visibility:
    function: undiscoverable_model_names
    model_list:
      - model_name: broken-*
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: b1
          discoverable: false
      - model_name: visible
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: v1
    model_group_alias: {}
    arguments:
      model_names: [broken-x, visible]
      user_role: internal_user
      broken_pattern: true
env: {}
compare: {ignore: []}
