kind: helper
name: model-visibility-no-router
call:
  model_visibility:
    function: undiscoverable_model_names
    model_list:
      - model_name: hidden
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: a
          discoverable: false
    model_group_alias: {}
    arguments:
      model_names: [hidden]
      user_role: internal_user
      with_router: false
env: {}
compare: {ignore: []}
