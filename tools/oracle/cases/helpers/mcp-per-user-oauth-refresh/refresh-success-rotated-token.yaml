kind: helper
name: refresh-success-rotated-token
call:
  b4660:
    function: refresh
    server_id: srv
    user_id: user
    server:
      server_id: srv
      name: Server
      transport: http
      auth_type: oauth2
      client_id: client
      client_secret: secret
      token_url: https://idp.test/token
