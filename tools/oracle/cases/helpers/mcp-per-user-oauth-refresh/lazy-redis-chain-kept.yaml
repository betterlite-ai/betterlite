kind: helper
name: lazy-redis-chain-kept
call:
  b4660:
    function: lazy_fetch
    token:
      access_token: fresh
      refresh_token: stored-refresh
      scopes: [read]
      identity_binding_proof: user-proof
    builds: [true]
    steps:
      - {op: fetch, user_id: user, server_id: srv}
      - {op: fetch, user_id: user, server_id: srv}
      - {op: set_redis_available, available: true}
      - {op: fetch, user_id: user, server_id: srv}
env: {}
compare:
  ignore: []
