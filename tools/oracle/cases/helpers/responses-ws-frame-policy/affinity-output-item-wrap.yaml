      event: {type: response.output_item.added, item: {encrypted_content: cipher}}
    - kind: wrap
      litellm_metadata: {encrypted_content_affinity_enabled: true, model_info: {id: 7}}
      event: {type: response.output_item.added, item: {encrypted_content: cipher}}
    - kind: wrap
      litellm_metadata: {encrypted_content_affinity_enabled: true, model_info: {id: m}}
      event: {type: response.output_item.added}
    - kind: wrap
      litellm_metadata: {encrypted_content_affinity_enabled: true, model_info: {id: m}}
      event: {type: response.output_item.added, item: cipher}
    - kind: wrap
