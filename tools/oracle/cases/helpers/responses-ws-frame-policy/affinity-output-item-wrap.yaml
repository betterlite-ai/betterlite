      event: {type: response.output_item.added, item: {id: rs_1}}
    - kind: wrap
      litellm_metadata: {encrypted_content_affinity_enabled: true, model_info: {id: m}}
      event: {type: response.output_item.added, item: {encrypted_content: ''}}
