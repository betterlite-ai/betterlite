kind: helper
name: coordination-settings-repeated-credential-literal-scrubbing
call:
  coordination_settings:
    function: scrub
    settings:
      password: hunter2
      url: "redis://:hunter2@cache.internal:6379/0"
      username: hunter2
    message: "auth failed for hunter2 at redis://:hunter2@cache.internal:6379/0, then hunter2 again"
calls:
  - coordination_settings:
      function: scrub
      settings:
        password: 123456
      message: "wrong password 123456 for 1234567"
  - coordination_settings:
      function: scrub
      settings:
        password: ""
        sentinel_password: null
      message: "nothing to scrub here"
env: {}
compare: {ignore: []}
