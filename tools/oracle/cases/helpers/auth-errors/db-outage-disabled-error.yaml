kind: helper
name: auth-errors-db-outage-disabled-error
call:
  auth_errors:
    rows:
      # with the bypass off the outage is logged at error level and raised as the 503
      - step: handle
        failure: {kind: connect, message: connection refused, type: "", param: null, status_code: 0, marked: false, internal_message: ""}
        reply: original
        replacement: null
        switches: []
        identity: {user_id: known-user}
        request_data: {model: gpt-4o}
        route: /v1/responses/resp_123
        user_agent: curl/8.5
        client_host: 203.0.113.7
      # a raising failure hook escapes the handler after the error line was written
      - step: handle
        failure: {kind: connect, message: connection refused, type: "", param: null, status_code: 0, marked: false, internal_message: ""}
        reply: raise
        replacement: null
        switches: []
        identity: null
        request_data: {model: gpt-4o}
        route: /v1/chat/completions
        user_agent: curl/8.5
        client_host: 203.0.113.7
env: {}
compare:
  ignore: []
