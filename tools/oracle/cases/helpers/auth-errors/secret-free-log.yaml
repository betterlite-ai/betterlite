kind: helper
name: auth-errors-secret-free-log
call:
  auth_errors:
    rows:
      # a key echoed in the rejection is redacted before the line is written
      - step: handle
        failure: {kind: http, message: "Authentication Error, invalid key sk-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", type: auth_error, param: null, status_code: 401, marked: false, internal_message: ""}
        reply: original
        replacement: null
        switches: [log_auth_failure_key_identity]
        identity: {user_id: known-user, team_id: team-1, team_alias: platform}
        request_data: {model: gpt-4o, api_key: sk-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}
        route: /v1/chat/completions
        user_agent: curl/8.5
        client_host: 203.0.113.7
      # an unexpected exception keeps its traceback and still carries no secret
      - step: handle
        failure: {kind: proxy, message: "upstream rejected Bearer sk-cccccccccccccccccccccccccccccc", type: internal_server_error, param: null, status_code: 500, marked: false, internal_message: ""}
        reply: original
        replacement: null
        switches: []
        identity: null
        request_data: {}
        route: /v1/responses/resp_123
        user_agent: null
        client_host: 203.0.113.7
env: {}
compare:
  ignore: []
