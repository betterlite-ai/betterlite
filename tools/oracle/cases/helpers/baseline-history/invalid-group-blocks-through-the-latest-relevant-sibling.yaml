kind: helper
name: invalid_group_blocks_through_the_latest_relevant_sibling
call:
  baseline_history:
    history:
      first_at: 0.0
      last_at: 0.0
      equivalent: true
      uncertain_before: 0.0
      entries: []
      blocked_until: 0.0
    groups:
    - - request_id: valid
        started_at: 10.0
        available_at: 30.0
        outcome: complete
        baseline_equivalent: false
        usage:
          prompt_tokens: 100
          completion_tokens: 5
          total_tokens: 105
          prompt_tokens_details:
            text_tokens: 100
            cached_tokens: 0
            cache_creation_tokens: 0
            cache_creation_token_details:
              ephemeral_5m_input_tokens: 0
              ephemeral_1h_input_tokens: 0
        plan:
          total_tokens: 100
          breakpoints:
          - fingerprint: a
            ttl_seconds: 3600
            prefix_tokens: 80
            lookback_fingerprints:
            - a
            content_fingerprint: c
            lookback_content_fingerprints:
            - c
      - request_id: invalid
        started_at: 10.0
        available_at: 20.0
        outcome: uncertain
        baseline_equivalent: false
      - request_id: cached
        started_at: 10.0
        available_at: 40.0
        outcome: response_cache
        baseline_equivalent: false
compare:
  ignore: []
env: {}
