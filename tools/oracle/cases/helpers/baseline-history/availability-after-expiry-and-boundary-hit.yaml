kind: helper
name: availability_after_expiry_and_boundary_hit
call:
  baseline_history:
    groups:
      - - request_id: "write"
          started_at: 0.0
          available_at: 50.0
          outcome: complete
          baseline_equivalent: false
          usage:
            prompt_tokens: 100
            completion_tokens: 5
            total_tokens: 105
            prompt_tokens_details:
              text_tokens: 100
              cached_tokens: 0
              cache_creation_tokens: 0
              cache_creation_token_details: {ephemeral_5m_input_tokens: 0, ephemeral_1h_input_tokens: 0}
          plan:
            total_tokens: 100
            breakpoints:
              - fingerprint: "fp1"
                ttl_seconds: 300
                prefix_tokens: 100
                lookback_fingerprints: ["fp1"]
                content_fingerprint: "cfp1"
                lookback_content_fingerprints: ["cfp1"]
      - - request_id: "boundary-hit"
          started_at: 50.0
          available_at: 50.0
          outcome: complete
          baseline_equivalent: false
          usage:
            prompt_tokens: 100
            completion_tokens: 5
            total_tokens: 105
            prompt_tokens_details:
              text_tokens: 100
              cached_tokens: 0
              cache_creation_tokens: 0
              cache_creation_token_details: {ephemeral_5m_input_tokens: 0, ephemeral_1h_input_tokens: 0}
          plan:
            total_tokens: 100
            breakpoints:
              - fingerprint: "fp1"
                ttl_seconds: 300
                prefix_tokens: 100
                lookback_fingerprints: ["fp1"]
                content_fingerprint: "cfp1"
                lookback_content_fingerprints: ["cfp1"]
      - - request_id: "boundary-miss-at-expiry"
          started_at: 300.0
          available_at: 300.0
          outcome: complete
          baseline_equivalent: false
          usage:
            prompt_tokens: 100
            completion_tokens: 5
            total_tokens: 105
            prompt_tokens_details:
              text_tokens: 100
              cached_tokens: 0
              cache_creation_tokens: 0
              cache_creation_token_details: {ephemeral_5m_input_tokens: 0, ephemeral_1h_input_tokens: 0}
          plan:
            total_tokens: 100
            breakpoints:
              - fingerprint: "fp1"
                ttl_seconds: 300
                prefix_tokens: 100
                lookback_fingerprints: ["fp1"]
                content_fingerprint: "cfp1"
                lookback_content_fingerprints: ["cfp1"]
compare: {ignore: []}
env: {}
