kind: helper
name: rerank-option-projection
call:
  rerank_contracts:
    operation: option_projection
    params:
      calls:
        - model: rerank-model
          drop_params: false
          query: q
          documents: [a, {body: b}]
          top_n: 0
          rank_fields: [body]
          max_chunks_per_doc: 0
          max_tokens_per_doc: 3
          instruction: ""
          nondefault: {query: old, top_n: 9, extension: "yes"}
        - model: rerank-model
          drop_params: true
          query: q
          documents: []
          return_documents: null
          nondefault: {}
        - model: rerank-model
          drop_params: false
          query: q
          documents: []
        - model: rerank-model
          drop_params: false
          query: q
          documents: [a]
          return_documents: false
          custom_llm_provider: cohere
        - model: rerank-model
          drop_params: false
          query: q
          documents: [a]
          rank_fields: [body]
          nondefault: {rank_fields: [old], return_documents: true}
env: {}
compare: {ignore: []}
