kind: helper
name: secret-codec-legacy-and-aes-vectors
call:
  secret_codec:
    salt_key: salt-one
    master_key: other-master
    general_settings: {}
    nonce_hex: "000102030405060708090a0b0c0d0e0f1011121314151617"
    steps:
      - {op: encrypt_value, value: hello, new_key: null}
      - {op: encrypt_value, value: "héllo wörld, a longer secret value!", new_key: null}
      - {op: encrypt_value, value: "", new_key: null}
      - {op: decrypt_value, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXcAj", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXEHhsXXGE41XMBOZQ9MNoYCQDmMAgx/StIWW/bAyTWAHjflBfc16NcjLyZVRCThkL9tn/hno=", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAEC*AwQFBgc\nICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXcAj", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXcAj-", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXcAj=x=", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXc==Aj", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXcAjé", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXEHhsXXGE41XMBOZQ9MNoYCQDmMAgx/StIWW/bAyTWAHjflBfc16NcjLyZVRCThkL9tn/hnp=", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "*", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "AAECAwQF", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "v2:gcm:AAECAwQFBgcICQoLu13Sfnjzb3vLfCPO7ClYdksHnW1L", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "v2:gcm:AAECAwQFBgcICQoLu13Sfnjzb3vLfCPO7ClYdksHnW1", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "v2:gcm:AAECAwQFBgcICQoLu13Sfnjzb3vLfCPO7ClYdksHnW1M", field: api_key, report: error, keep_original: false}
      - {op: decrypt_value, value: "v2:gcm:", field: api_key, report: error, keep_original: false}
      - {op: decrypt_with, value: "", signing_key: salt-one}
      - {op: decrypt_with, value: "*", signing_key: salt-one}
      - {op: decrypt_with, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXcAj", signing_key: salt-one}
      - {op: decrypt_with, value: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXccVZjgu1TZy2W9RyeYfnLiSlXcAj", signing_key: other-master}
      - {op: decrypt_with, value: "v2:gcm:AAECAwQFBgcICQoLu13Sfnjzb3vLfCPO7ClYdksHnW1L", signing_key: salt-one}
      - {op: decrypt_with, value: "AAAA-", signing_key: salt-one}
env: {}
compare:
  ignore: []
