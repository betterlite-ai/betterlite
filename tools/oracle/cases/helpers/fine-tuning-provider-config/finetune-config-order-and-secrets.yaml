kind: helper
name: fine-tuning-provider-config-order-and-secrets
call:
  fine_tuning_provider_config:
    env: {AZURE_TEST: first}
    steps:
      - action: set
        config:
          - custom_llm_provider: azure
            api_key: os.environ/AZURE_TEST
            note: plain-value
            metadata: {token: os.environ/AZURE_TEST}
          - custom_llm_provider: azure
            api_key: second
      - action: get
        provider: azure
      - action: get
        provider: openai
      - action: set
        config: null
      - action: get
        provider: azure
      - action: set
        config: []
      - action: get
        provider: azure
calls:
  - fine_tuning_provider_config:
      env: {}
      steps:
        - action: set
          config: azure
  - fine_tuning_provider_config:
      env: {}
      steps:
        - action: get
          provider: azure
  - fine_tuning_provider_config:
      env: {}
      steps:
        - action: set
          config:
            - not-a-provider-map
            - custom_llm_provider: azure
        - action: get
          provider: azure
env: {}
compare:
  ignore: []
