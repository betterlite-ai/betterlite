kind: helper
name: runway-tasks-throttled-then-success
call:
  runway_tasks:
    operation: poll
    params:
      kind: image
      task_id: task-1
      api_base: 'https://runway.test/'
      timeout_seconds: 600
      step_millis: 0
      replies:
        - {status: 200, body: '{"status": "throttled"}'}
        - {status: 200, body: '{"status": "Pending"}'}
        - {status: 200, body: '{"id": "task-1", "status": "SUCCEEDED", "output": ["https://o.test/a.png"]}'}
env: {}
compare: {ignore: []}
