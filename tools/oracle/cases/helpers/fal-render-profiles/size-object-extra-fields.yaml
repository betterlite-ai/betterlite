kind: helper
name: fal-render-profiles-size-object-extra-fields
call:
  fal_render_profiles:
    operation: size_object_extra_fields
    sizes:
      - {width: 10, height: 20, preset: square}
      - {height: 20, width: 10, extra: [1, 2]}
      - {width: true, height: false, preset: square}
      - {width: 9223372036854775808, height: 2, preset: square}
      - {width: 10, height: 20.5}
      - {width: 10, height: "20"}
      - {width: 10}
      - {}
env: {}
compare:
  ignore: []
