kind: helper
name: fal-render-profiles-custom-diffusion-path
call:
  fal_render_profiles:
    operation: custom_diffusion_path
    environment: {FAL_AI_API_BASE: "https://environment.test/fal/"}
    api_bases: [null, "", "https://proxy.test/fal///"]
    models: ["stable-diffusion-v35-medium", "fal-ai/stable-diffusion-v35-medium", "custom/sd", ""]
    model: "fal-ai/ideogram/v3"
    prompt: "a prompt"
    cases:
      - non_default: {n: 2, size: "1024x768", response_format: "url"}
        optional: {}
        drop_params: false
      - non_default: {n: 2}
        optional: {num_images: 3}
        drop_params: false
      - non_default: {n: 2}
        optional: {n: 4}
        drop_params: false
      - non_default: {size: " 1024x768"}
        optional: {image_size: "square"}
        drop_params: false
      - non_default: {response_format: "b64_json"}
        optional: {output_format: "png"}
        drop_params: false
      - non_default: {response_format: "png"}
        optional: {}
        drop_params: false
      - non_default: {size: {width: 10, height: 20}}
        optional: {}
        drop_params: false
      - non_default: {seed: 1}
        optional: {}
        drop_params: false
      - non_default: {seed: 1}
        optional: {}
        drop_params: true
      - non_default: {quality: 90}
        optional: {guidance_scale: 4.5}
        drop_params: false
env: {}
compare:
  ignore: []
