kind: helper
name: microsoft-sso-client-custom-endpoints
call:
  b10148:
    client_id: microsoft-client-id
    redirect_url: https://proxy.example.test/sso/callback
    environment:
      MICROSOFT_CLIENT_SECRET: microsoft-secret
      MICROSOFT_TENANT: contoso.example.test
      MICROSOFT_AUTHORIZATION_ENDPOINT: https://login.example.test/authorize
      MICROSOFT_TOKEN_ENDPOINT: https://login.example.test/token
      MICROSOFT_USERINFO_ENDPOINT: https://graph.example.test/me
env: {}
compare: {ignore: []}
