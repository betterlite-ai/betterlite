kind: helper
name: riva-call-final-only-chunks
call:
  riva_call:
    calls:
      - model: nvidia-riva/parakeet
        audio_name: clip.wav
        file_hex: "0000"
        samples: 8000
        optional_params:
          enable_word_time_offsets: true
          timestamp_granularities:
            - word
          response_format: verbose_json
        api_base: localhost:50051
        api_key: riva-secret
        timeout_seconds: 30.0
        service: timeout
        legacy_auth: false
        endpointing: ok
        stream:
          - results:
              - is_final: false
                alternatives:
                  - transcript: "partial"
                    words: []
          - results: []
          - results:
              - is_final: true
                alternatives: []
          - results:
              - is_final: true
                alternatives:
                  - transcript: ""
                    words: []
          - results:
              - is_final: true
                alternatives:
                  - transcript: "hello "
                    words:
                      - word: "hello"
                        start_time: 0
                        end_time: 250
          - results:
              - is_final: true
                alternatives:
                  - transcript: "world"
                    words:
                      - word: "world"
                        start_time: 250
                        end_time: 500
compare: {ignore: []}
env: {}
