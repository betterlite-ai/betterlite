kind: helper
name: riva-call-missing-endpoint
call:
  riva_call:
    calls:
      - model: nvidia-riva/parakeet
        audio_name: clip.wav
        file_hex: "0000"
        samples: 1600
        optional_params: {}
        api_base: null
        api_key: null
        timeout_seconds: 30.0
        service: timeout
        legacy_auth: false
        endpointing: ok
        stream: []
compare: {ignore: []}
env: {}
