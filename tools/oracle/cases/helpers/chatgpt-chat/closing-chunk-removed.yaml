kind: helper
name: closing_chunk_removed
call:
  chatgpt_chat:
    environment: {}
    platform: {system: "Linux", release: "6.1.0-oracle", machine: "x86_64"}
    record: null
    now: 1000
    step:
      normalize:
        chunks:
          - {id: "chatcmpl-2", object: "chat.completion.chunk", created: 2, model: "gpt-5", choices: [{index: 0, delta: {tool_calls: [{index: 0, id: "alpha", type: "function", function: {name: "lookup", arguments: ""}}]}}]}
          - {id: "chatcmpl-2", object: "chat.completion.chunk", created: 2, model: "gpt-5", choices: [{index: 0, finish_reason: "stop", delta: {content: "closing", tool_calls: [{index: 0, id: "alpha", type: "function", function: {name: "lookup", arguments: ""}}]}}]}
          - {id: "chatcmpl-2", object: "chat.completion.chunk", created: 2, model: "gpt-5", choices: [{index: 0, delta: {content: "next"}}]}
env: {}
compare: {ignore: []}
