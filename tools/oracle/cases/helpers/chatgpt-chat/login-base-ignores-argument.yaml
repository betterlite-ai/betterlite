kind: helper
name: login_base_ignores_argument
call:
  chatgpt_chat:
    environment:
      CHATGPT_API_BASE: "https://chatgpt.example/backend"
    platform: {system: "Linux", release: "6.1.0-oracle", machine: "x86_64"}
    record: '{"access_token": "stored-token", "expires_at": 4000000000}'
    now: 1000
    step:
      provider_info:
        model: "gpt-5"
        provider: "chatgpt"
        api_base: "https://ignored.example/v1"
        api_key: "sk-ignored"
env:
  CHATGPT_API_BASE: "https://chatgpt.example/backend"
compare: {ignore: []}
