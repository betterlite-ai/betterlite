            api_key: sk-explicit
      - environment: {AIMLAPI_KEY: sk-image-only}
        calls:
          - op: info
            host: aiml
      - environment: {OPENAI_LIKE_API_BASE: "https://like.example/v1", OPENAI_LIKE_API_KEY: sk-like}
        calls:
          - op: info
            host: empower
          - op: info
            host: friendliai
          - op: info
            host: galadriel
          - op: info
            host: github
      - calls:
          - op: info
            host: empower
          - op: info
            host: github
            api_base: https://github.explicit/v1
            api_key: sk-gh
env: {}
compare: {ignore: []}
