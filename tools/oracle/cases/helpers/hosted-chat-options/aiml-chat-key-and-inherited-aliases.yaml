kind: helper
name: aiml-chat-key-and-inherited-aliases
call:
  hosted_chat_options:
    scenarios:
      - environment: {AIML_API_BASE: "https://aiml.env/v1", AIML_API_KEY: sk-aiml, AIMLAPI_KEY: sk-image-only}
        calls:
          - op: info
            host: aiml
          - op: info
            host: aiml
