kind: helper
name: identity-store-team-member-role-defaults
call:
  identity_store:
    aspect: principal
    key:
      token: t-team-admin
      key_name: k-team-admin
      team_id: t1
      team_alias: team-one
      team_member: {user_id: u1, role: admin}
    auth_method: api_key
calls:
  # an absent member is a plain member, and a missing alias stays null
  - identity_store:
      aspect: principal
      key: {token: t-team-absent, key_name: k-team-absent, team_id: t2}
      auth_method: api_key
  # the role string "user" is a member too
  - identity_store:
      aspect: principal
      key:
        token: t-team-user
        key_name: k-team-user
        team_id: t3
        team_member: {user_id: u2, role: user}
      auth_method: api_key
  # the empty team id is nonnull, so it creates the team
  - identity_store:
      aspect: principal
      key: {token: t-team-empty, key_name: k-team-empty, team_id: ""}
      auth_method: api_key
env: {}
compare: {ignore: []}
