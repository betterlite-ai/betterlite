kind: helper
name: watsonx-text-template-order-and-gpt-oss
env: {}
compare: {ignore: []}
call:
  b5972:
    op: prompts
    cases:
      - {model: watsonx/granite-chat-13b}
      - {model: watsonx/ibm-mistral-8x7b}
      - {model: watsonx/ibm-mistralai/mixtral}
      - {model: watsonx/granite-chat-openai/gpt-oss-120b}
      - {model: watsonx/meta-llama/llama-3-instruct-8b}
      - {model: watsonx/openai/gpt-oss-120b}
      - {model: watsonx_text/openai/gpt-oss-120b}
      - {model: openai/gpt-oss-120b}
      - {model: watsonx/openai/gpt-oss-broken}
      - {model: watsonx/openai/gpt-oss-missing}
      - {model: unknown-model}
      - {model: ""}
    messages:
      - {role: user, content: hi}
    templates:
      openai/gpt-oss-120b: "{% for message in messages %}<{{ message['role'] }}>{{ message['content'] }}</{{ message['role'] }}>{% endfor %}"
      openai/gpt-oss-broken: "{% if %}"
