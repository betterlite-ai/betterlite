kind: helper
name: media-relay-logging-deepgram-fixed-margin
call:
  media_relay_logging:
    deepgram_routes: []
    fal_routes: []
    deepgram_listens:
      - upstream_url: "https://api.deepgram.com/v1/listen?model=nova-3&diarize=true"
        messages:
          - {type: Metadata, duration: 2, channels: 1}
          - {type: Results, is_final: true, channel: {alternatives: [{transcript: fixed}]}}
        kwargs: {}
        catalog:
          deepgram/streaming/nova-3: {litellm_provider: deepgram, input_cost_per_second: 0.00008}
          deepgram/streaming/diarize: {litellm_provider: deepgram, input_cost_per_second: 0.00001}
        cost_discount_config: {}
        cost_margin_config: {deepgram: {fixed_amount: 0.001}}
    fal_passthroughs: []
env: {}
compare: {ignore: []}
