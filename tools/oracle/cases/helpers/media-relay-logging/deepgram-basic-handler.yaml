kind: helper
name: media-relay-logging-deepgram-basic-handler
call:
  media_relay_logging:
    deepgram_routes: []
    fal_routes: []
    deepgram_listens:
      - upstream_url: "https://api.deepgram.com/v1/listen?model=nova-3&redact=pci&diarize=true"
        messages:
          - {type: Metadata, duration: 2, channels: 2}
          - {type: Results, is_final: true, channel: {alternatives: [{transcript: hello}]}}
          - {type: Results, is_final: true, channel: {alternatives: [{transcript: world}]}}
        kwargs: {custom: "1"}
        catalog:
          deepgram/streaming/nova-3: {litellm_provider: deepgram, input_cost_per_second: 0.00008}
          deepgram/streaming/redact: {litellm_provider: deepgram, input_cost_per_second: 0.00003333}
          deepgram/streaming/diarize: {litellm_provider: deepgram, input_cost_per_second: 0.00001}
    fal_passthroughs: []
env: {}
compare: {ignore: []}
