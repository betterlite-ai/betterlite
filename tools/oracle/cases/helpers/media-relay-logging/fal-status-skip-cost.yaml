kind: helper
name: media-relay-logging-fal-status-skip-cost
call:
  media_relay_logging:
    deepgram_routes: []
    fal_routes: []
    deepgram_listens: []
    fal_passthroughs:
      - url_route: "https://queue.example/api/fal-ai/flux/dev/requests/r-1/status"
        response_body:
          status: COMPLETED
          request_id: r-1
        request_body: {num_images: 2}
        kwargs: {}
        catalog:
          fal_ai/fal-ai/flux/dev: {litellm_provider: fal_ai, output_cost_per_image: 0.025}
        queue_base: "https://queue.example/api"
env: {FAL_AI_QUEUE_API_BASE: "https://queue.example/api"}
compare: {ignore: []}
