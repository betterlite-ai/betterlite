kind: helper
name: media-relay-logging-fal-url-extraction
call:
  media_relay_logging:
    deepgram_routes: []
    fal_routes: []
    deepgram_listens: []
    fal_passthroughs:
      - url_route: "https://queue.fal.run/fal-ai/flux/dev"
        response_body:
          image: {url: "https://fal.example/a.png"}
          images:
            - {url: "https://fal.example/b.png"}
            - {url: 5}
            - not an object
          nested: {inner: {url: "https://fal.example/deep.png"}}
          nested_list: [[{url: "https://fal.example/deeper.png"}]]
          text: "https://fal.example/not-a-field.png"
          request_id: r-1
        request_body: {}
        kwargs: {}
        catalog:
          fal_ai/fal-ai/flux/dev: {litellm_provider: fal_ai, output_cost_per_image: 0.025}
        queue_base: null
env: {}
compare: {ignore: []}
