kind: helper
name: native-errors-raw-provider-status
call:
  native_error:
    kind: raw
    model: command-r
    custom_llm_provider: cohere
    error_str: "unrecognized failure"
    status_code: 498
calls:
  - native_error:
      kind: raw
      model: command-r
      custom_llm_provider: cohere
      error_str: "invalid api token"
      status_code: 400
  - native_error:
      kind: raw
      model: command-r
      custom_llm_provider: cohere
      error_str: "invalid api token"
      status_code: 500
      status_code_is_synthesized: true
  # BaseLLMException's subclasses keep the constructor, so a named exception reaches the branch
  # that reads type(original_exception).__name__ before any status_code branch
  - native_error:
      kind: raw
      model: replicate/some-model
      custom_llm_provider: replicate
      error_str: "generic failure"
      status_code: 422
      exception_type: ModelError
env: {}
compare: {ignore: []}
