kind: helper
name: sso-gate-needs-ready-provider
call:
  b10067:
    calls:
      - general_settings: {disable_password_login_when_sso_enabled: true}
        sso_provider_ready: false
      - general_settings: {disable_password_login_when_sso_enabled: true}
        sso_provider_ready: true
      - general_settings: {disable_password_login_when_sso_enabled: false}
        sso_provider_ready: true
      - general_settings: {disable_password_login_when_sso_enabled: null}
        sso_provider_ready: true
      - general_settings: {disable_env_credential_login: false, disable_password_login_when_sso_enabled: true}
        sso_provider_ready: false
env: {}
compare: {ignore: []}
