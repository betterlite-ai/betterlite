kind: helper
name: auth-route-patterns-scope-and-template
env: {}
compare: {ignore: []}
call:
  auth_route_patterns:
    function: scope
    requests:
      - {"name": "scope_path_beats_host_url", "url_path": "/url", "path": "/v1/models"}
      - {"name": "missing_scope_path_fallback", "url_path": "/url"}
      - {"name": "app_root_wins", "url_path": "/url", "path": "/proxy/v1/models", "root_path": "/wrong", "app_root_path": "/proxy"}
      - {"name": "root_trailing_slashes", "url_path": "/url", "path": "/proxy/v1/models", "root_path": "/proxy///"}
      - {"name": "root_exact_becomes_slash", "url_path": "/url", "path": "/proxy", "root_path": "/proxy"}
      - {"name": "root_slash_kept", "url_path": "/url", "path": "/v1/models", "root_path": "/"}
      - {"name": "malformed_scope_fallback", "url_path": "/url", "scope": "malformed"}
      - {"name": "path_exception_debug_fallback", "url_path": "/url", "scope": "error"}
      - {"name": "nonempty_route_template", "url_path": "/url", "template": "/v1/models/{model}"}
      - {"name": "absent_template", "url_path": "/url"}
      - {"name": "empty_template", "url_path": "/url", "template": ""}
      - {"name": "absent_empty_nonstring_template", "url_path": "/url", "template_access": "malformed"}
      - {"name": "template_exception_debug_none", "url_path": "/url", "template_access": "error"}
      - {"name": "empty_app_root_wins", "url_path": "/url", "path": "/proxy/v1/models", "app_root_path": "", "root_path": "/proxy"}
      - {"name": "explicit_empty_scope_path", "path": "", "url_path": "/fallback"}
      - {"name": "fallback_path_root_removed", "url_path": "/api/chat", "root_path": "/api"}
      - {"name": "whitespace_template", "url_path": "/url", "template": " "}
