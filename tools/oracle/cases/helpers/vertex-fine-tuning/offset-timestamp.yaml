kind: helper
name: vertex-fine-tuning-offset-timestamp
call:
  vertex_fine_tuning:
    operation: response
    calls:
      - zone: UTC
        response: {state: JOB_STATE_SUCCEEDED, createTime: "2024-01-01T00:00:00Z"}
      - zone: UTC
        response: {state: JOB_STATE_SUCCEEDED, createTime: "2024-01-01T00:00:00.123456Z"}
      - zone: UTC
        response: {state: JOB_STATE_SUCCEEDED, createTime: "2024-01-01T00:00:00+02:00"}
      - zone: UTC
        response: {state: JOB_STATE_SUCCEEDED, createTime: "2024-01-01T00:00:00-05:30"}
      - zone: Europe/Berlin
        response: {state: JOB_STATE_SUCCEEDED, createTime: "2024-01-01T00:00:00"}
env: {TZ: Europe/Berlin}
compare: {ignore: []}
