kind: helper
name: vertex-fine-tuning-bad-time
call:
  vertex_fine_tuning:
    operation: response
    calls:
      - zone: UTC
        response: {state: JOB_STATE_RUNNING, createTime: ""}
      - zone: UTC
        response: {state: JOB_STATE_RUNNING, createTime: not-a-time}
      - zone: UTC
        response: {state: JOB_STATE_RUNNING, createTime: "2024-13-01T00:00:00Z"}
      - zone: UTC
        response: {state: JOB_STATE_RUNNING, createTime: "2024-01-01T25:00:00Z"}
      - zone: UTC
        response: {state: JOB_STATE_RUNNING, createTime: "2024-01-01T00:00:00ZZ"}
      - zone: UTC
        response: {state: JOB_STATE_RUNNING, createTime: null}
env: {}
compare: {ignore: []}
