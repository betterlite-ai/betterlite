kind: helper
name: native-tool-order
call:
  gemini_tools:
    calls:
      - tools:
          - computerUse: {}
          - googleMaps:
              languageCode: en
          - urlContext: {}
          - code_execution:
              code: cfg
          - enterpriseWebSearch: {}
          - google_search_retrieval:
              dynamicRetrievalConfig:
                mode: MODE_DYNAMIC
