kind: helper
name: maps-coordinates
call:
  gemini_tools:
    calls:
      - tools:
          - googleMaps:
              enableWidget: true
              latitude: 12.5
              longitude: -7.25
              languageCode: en-GB
        functions: []
        web_search_options: null
        tool_choice: null
        service_tier: null
        server_side_invocations: false
        tool_config:
          functionCallingConfig:
            mode: ANY
      - tools:
          - googleMaps:
              languageCode: fr
              enableWidget: false
        functions: []
        web_search_options: null
        tool_choice: auto
        service_tier: null
        server_side_invocations: false
        tool_config: null
      - tools:
          - googleMaps:
              latitude: 0
              longitude: 0
        functions: []
        web_search_options: null
        tool_choice: null
        service_tier: null
        server_side_invocations: false
        tool_config: null
      - tools:
          - googleMaps:
              enableWidget: true
              retrievalConfig:
                latLng:
                  latitude: 1
                  longitude: 2
        functions: []
        web_search_options: null
        tool_choice: null
        service_tier: null
        server_side_invocations: false
        tool_config: null
    settings: {}
env: {}
compare: {ignore: []}
