      budgets:
        minimal: 128
        minimal_flash: 1
        minimal_pro: 128
        minimal_flash_lite: 512
        low: 1024
        medium: 2048
        high: 4096
        disable: 0
      default_thinking_level_low: false
      max_recurse_depth: 100
    catalog: {}
    steps:
      - {op: audio, audio: {format: pcm16, voice: alloy, language_code: en-US}}
