kind: helper
name: gemini-thinking-pcm16-voice
call:
  gemini_thinking:
    settings:
      budgets:
        minimal: 128
        minimal_flash: 1
        minimal_pro: 128
        minimal_flash_lite: 512
        low: 1024
        medium: 2048
        high: 4096
        disable: 0
      default_thinking_level_low: false
    catalog: {}
    steps:
      - {op: audio, audio: {format: pcm16, voice: alloy, language_code: en-US}}
      - {op: audio, audio: {voice: alloy}}
      - {op: audio, audio: {format: pcm16, language_code: en-GB}}
      - {op: audio, audio: {}}
      - {op: audio, audio: {format: mp3, voice: alloy, language_code: en-US}}
      - {op: audio, audio: {format: wav}}
      - {op: audio, audio: {format: "", voice: alloy}}
      - {op: modalities, modalities: [text, image, audio, video]}
      - {op: modalities, modalities: [text, embedding, TEXT]}
      - {op: modalities, modalities: []}
env:
  DEFAULT_REASONING_EFFORT_MINIMAL_THINKING_BUDGET: "128"
  DEFAULT_REASONING_EFFORT_MINIMAL_THINKING_BUDGET_GEMINI_2_5_FLASH: "1"
  DEFAULT_REASONING_EFFORT_MINIMAL_THINKING_BUDGET_GEMINI_2_5_PRO: "128"
  DEFAULT_REASONING_EFFORT_MINIMAL_THINKING_BUDGET_GEMINI_2_5_FLASH_LITE: "512"
  DEFAULT_REASONING_EFFORT_LOW_THINKING_BUDGET: "1024"
  DEFAULT_REASONING_EFFORT_MEDIUM_THINKING_BUDGET: "2048"
  DEFAULT_REASONING_EFFORT_HIGH_THINKING_BUDGET: "4096"
  DEFAULT_REASONING_EFFORT_DISABLE_THINKING_BUDGET: "0"
compare:
  ignore: []
