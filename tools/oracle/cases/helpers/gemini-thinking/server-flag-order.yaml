kind: helper
name: gemini-thinking-server-flag-order
call:
  gemini_thinking:
    settings:
      budgets:
        minimal: 128
        minimal_flash: 1
        minimal_pro: 128
        minimal_flash_lite: 512
        low: 1024
        medium: 2048
        high: 4096
        disable: 0
      default_thinking_level_low: false
      max_recurse_depth: 100
    catalog: {}
    steps:
      - {op: server_flags, non_default_params: {include_server_side_tool_invocations: true}, optional_params: {temperature: 1}}
      - {op: server_flags, non_default_params: {includeServerSideToolInvocations: true}, optional_params: {}}
      - {op: server_flags, non_default_params: {}, optional_params: {includeServerSideToolInvocations: true}}
      - {op: server_flags, non_default_params: {}, optional_params: {include_server_side_tool_invocations: true}}
      - {op: server_flags, non_default_params: {include_server_side_tool_invocations: false}, optional_params: {}}
      - {op: server_flags, non_default_params: {}, optional_params: {includeServerSideToolInvocations: false}}
      - op: server_flags
        non_default_params: {includeServerSideToolInvocations: true}
        optional_params:
          tools:
            - functionDeclarations: []
env: {}
compare:
  ignore: []
