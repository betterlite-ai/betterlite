kind: helper
name: gemini-thinking-flash-minimal-opt-out
call:
  gemini_thinking:
    settings:
      budgets:
        minimal: 128
        minimal_flash: 1
        minimal_pro: 128
        minimal_flash_lite: 512
        low: 1024
        medium: 2048
        high: 4096
        disable: 0
      default_thinking_level_low: true
      max_recurse_depth: 100
    catalog:
      gemini-3-flash-preview: false
      gemini-3-flash: true
    steps:
      - {op: reasoning_effort, effort: minimal, model: "gemini-3-flash-preview", optional_params: {}}
      - {op: reasoning_effort, effort: minimal, model: "gemini-3-flash", optional_params: {}}
      - {op: reasoning_effort, effort: minimal, model: "gemini-3-flash-lite", optional_params: {}}
      - {op: reasoning_effort, effort: minimal, model: "gemini-3-pro-preview", optional_params: {}}
      - {op: thinking, thinking: {type: enabled, budget_tokens: 2000}, model: "gemini-3-flash-preview", optional_params: {}}
      - {op: thinking, thinking: {type: enabled, budget_tokens: 2000}, model: "gemini-3-flash", optional_params: {}}
      - {op: thinking, thinking: {type: enabled, budget_tokens: 0}, model: "gemini-3-flash", optional_params: {}}
      - {op: thinking, thinking: {type: enabled, budget_tokens: null}, model: "gemini-3-pro-preview", optional_params: {}}
env: {}
compare:
  ignore: []
