kind: helper
name: message-fields-tool-media-hoist
call:
  message_fields:
    operation: hoist_images_from_tool_messages
    messages:
      - role: user
        content: Take a screenshot of the dashboard.
      - role: tool
        tool_call_id: call_1
        content:
          - type: text
            text: Here is the screenshot.
          - type: image_url
            image_url:
              url: data:image/png;base64,iVBORw0KGgo=
      - role: tool
        tool_call_id: call_2
        content:
          - type: image_url
            image_url: https://example.com/plain.png
env: {}
compare:
  ignore: []
