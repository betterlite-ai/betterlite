kind: helper
name: database-refresh-loop-missing-empty-malformed-password
call:
  database_refresh_loop:
    function: batch
    calls:
      - function: extract_password
        url: null
      - function: extract_password
        url: ""
      - function: extract_password
        url: "postgresql://user@host/db"
      - function: extract_password
        url: "postgresql://user:@host/db"
      - function: extract_password
        url: "postgresql://host:5432/db"
      - function: extract_password
        url: "postgresql://user:secret@"
      - function: extract_password
        url: "postgresql://user:secret@[::1:5432/db"
      - function: extract_password
        url: "postgresql://user:p%C3%A4ss@host/db"
      - function: extract_password
        url: "postgresql://user:a%zzb@host/db"
      - function: extract_password
        url: "postgresql://user:pa?ss@host/db"
env: {}
compare: {ignore: []}
