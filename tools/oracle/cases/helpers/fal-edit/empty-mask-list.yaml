kind: helper
name: fal-edit-empty-mask-list
call:
  fal_edit:
    operation: prepare
    model: openai/gpt-image-2/edit
    prompt: empty mask list
    image:
      kind: bytes
      content: [137, 80, 78, 71, 13, 10, 26, 10]
    params:
      mask: []
calls:
  - fal_edit:
      operation: prepare
      model: openai/gpt-image-2/edit
      prompt: null mask
      image:
        kind: bytes
        content: [137, 80, 78, 71, 13, 10, 26, 10]
      params:
        mask: null
  - fal_edit:
      operation: prepare
      model: openai/gpt-image-2/edit
      prompt: null first entry
      image:
        kind: bytes
        content: [137, 80, 78, 71, 13, 10, 26, 10]
      params:
        mask: [null, "https://mask.test/second.png"]
  - fal_edit:
      operation: prepare
      model: openai/gpt-image-2/edit
      prompt: first entry
      image:
        kind: bytes
        content: [137, 80, 78, 71, 13, 10, 26, 10]
      params:
        mask: ["https://mask.test/first.png", "https://mask.test/second.png"]
  - fal_edit:
      operation: prepare
      model: openai/gpt-image-2/edit
      prompt: nested list
      image:
        kind: bytes
        content: [137, 80, 78, 71, 13, 10, 26, 10]
      params:
        mask: [["https://mask.test/nested.png"]]
env: {}
compare:
  ignore: []
