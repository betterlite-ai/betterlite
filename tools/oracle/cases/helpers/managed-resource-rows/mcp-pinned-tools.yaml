        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","pinned_tools":{"t":{"description":"d"}}}}'
      - name: pinned_tools_json_text
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","pinned_tools":"{ \"t\": { \"description\": \"d\", \"input_schema\": {\"type\": \"object\"} } }"}}'
      - name: pinned_tools_unknown_field
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","pinned_tools":{"t":{"extra":1}}}}'
      - name: pinned_tools_array
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","pinned_tools":["tool"]}}'
