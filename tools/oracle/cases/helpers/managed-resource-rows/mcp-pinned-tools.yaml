  managed_resource_rows:
    rows:
      - name: pinned_tools_absent
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse"}}'
      - name: pinned_tools_null
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","pinned_tools":null}}'
