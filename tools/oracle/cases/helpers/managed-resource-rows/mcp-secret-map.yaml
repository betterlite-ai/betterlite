kind: helper
name: mcp_secret_map
call:
  managed_resource_rows:
    salt_key: managed-row-key
    rows:
      - name: secret_map_plaintext_object
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","static_headers":{"Authorization":"Bearer row-secret"}}}'
      - name: secret_map_json_text
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","static_headers":"{\"Authorization\": \"Bearer row-secret\"}"}}'
      - name: secret_map_encrypted_raw
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","static_headers":"YRxZqp_n51DmLFJrE5ewMwpkUQt7RBVfz86OO7dO1hEoqpx1r1L8ZbJr__NBLz_I7IRDN-1hlIRQTi6LoL0y3bLHgP8qyPKS35jUEso="}}'
      - name: secret_map_encrypted_quoted
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","static_headers":"\"YRxZqp_n51DmLFJrE5ewMwpkUQt7RBVfz86OO7dO1hEoqpx1r1L8ZbJr__NBLz_I7IRDN-1hlIRQTi6LoL0y3bLHgP8qyPKS35jUEso=\""}}'
      - name: env_plaintext_object
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","env":{"A":"B"}}}'
      - name: env_null
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","env":null}}'
      - name: static_headers_null
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","static_headers":null}}'
      - name: secret_map_malformed_value
        stored: '{"kind":"mcp_server","row":{"server_id":"s","transport":"sse","static_headers":{"A":1}}}'
env:
  LITELLM_SALT_KEY: managed-row-key
compare: {ignore: []}
