      - kind: post
        url: "https://agent365.example/agents/tool-evaluation/evaluate"
        headers:
          authorization: "Bearer assertion"
          content-type: application/x-www-form-urlencoded
        data:
          verdict: Allow
env: {}
compare: {ignore: []}
