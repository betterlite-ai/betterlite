kind: helper
name: obo-cache-sha256-hashing
call:
  b3741:
    function: agent_365_token_exchange
    replies:
      - {status: 200, body: {access_token: token-1}, raw: null}
    repeat_last_reply: false
    steps:
      - {kind: token, assertion: header.payload.signature}
      - {kind: token, assertion: header.payload.signature}
env: {}
compare: {ignore: []}
