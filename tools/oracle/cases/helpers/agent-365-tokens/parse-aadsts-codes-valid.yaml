kind: helper
name: parse-aadsts-codes-valid
call:
  b3741:
    function: agent_365_token_exchange
    replies:
      - {status: 400, body: {error: invalid_grant, error_description: "AADSTS70000: authorization failed", error_codes: [70000, 70001]}, raw: null}
    repeat_last_reply: false
    steps:
      - {kind: token, assertion: header.payload.signature}
env: {}
compare: {ignore: []}
