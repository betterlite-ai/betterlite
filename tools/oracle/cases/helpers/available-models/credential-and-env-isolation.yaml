kind: helper
name: credential-and-env-isolation
call:
  available_models:
    cache:
      steps:
        - {op: config}
        - {op: set, provider: openai, models: [stale], now: 0.0}
        - {op: get, provider: openai, environment: {OPENAI_API_KEY: one}}
        - {op: get, provider: openai, environment: {OPENAI_API_KEY: one}}
        - {op: set, provider: openai, models: [one], now: 0.0}
        - {op: get, provider: openai, environment: {OPENAI_API_KEY: one}}
        - {op: get, provider: openai, environment: {OPENAI_API_KEY: two}}
        - {op: set, provider: openai, models: [two], now: 0.0}
        - {op: get, provider: openai, environment: {ANTHROPIC_API_KEY: three}}
        - {op: set, provider: openai, models: [three], now: 0.0}
        - {op: get, provider: openai, environment: {OPENAI_API_KEY: one}}
        - {op: get, provider: openai, environment: {OPENAI_API_KEY: one, PATH: /bin}}
        - {op: get, provider: openai, environment: {openai_api_key: one}}
        - {op: get, provider: openai, parameters: {model: m, api_key: key-one}, environment: {OPENAI_API_KEY: changed}}
        - {op: set, provider: openai, parameters: {model: m, api_key: key-one}, models: [p1], now: 0.0}
        - {op: get, provider: openai, parameters: {model: m, api_key: key-one}, environment: {OPENAI_API_KEY: changed-again}}
        - {op: get, provider: openai, parameters: {model: other, api_key: key-one}, environment: {}}
        - {op: get, provider: anthropic, parameters: {model: m, api_key: key-one}, environment: {}}
        - {op: set, provider: openai, parameters: {model: m, api_key: key-one}, models: [], now: 0.0}
        - {op: get, provider: openai, parameters: {model: m, api_key: key-one}, environment: {}}
        - {op: get, provider: openai, parameters: {model: m, api_key: key-one}, clock_fails: true, environment: {}}
        - {op: set, provider: openai, parameters: {model: copy}, models: [a, b], now: 0.0}
        - {op: get_mutate, provider: openai, parameters: {model: copy}, environment: {}}
        - {op: get, provider: openai, parameters: {model: copy}, environment: {}}
        - {op: set_mutate, provider: openai, parameters: {model: write}, models: [w], now: 0.0}
        - {op: get, provider: openai, parameters: {model: write}, environment: {}}
env: {}
compare: {ignore: []}
