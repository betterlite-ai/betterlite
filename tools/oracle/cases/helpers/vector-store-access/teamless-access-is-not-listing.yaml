kind: helper
name: vector-store-access-teamless-access-is-not-listing
call:
  vector_store_access:
    function: filter_listable_vector_stores
    vector_stores:
      - {vector_store_id: vs_c, team_id: team_c}
      - {vector_store_id: vs_teamless}
      - {vector_store_id: vs_a, team_id: team_a}
    auth:
      team_id: team_a
      object_permission: {object_permission_id: p_key, vector_stores: [vs_c, vs_teamless]}
    database: true
    object_permissions:
      p_key: {object_permission_id: p_key, vector_stores: [vs_c, vs_teamless]}
    teams: {}
    user_teams: []
