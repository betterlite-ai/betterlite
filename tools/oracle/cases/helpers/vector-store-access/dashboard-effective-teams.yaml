kind: helper
name: vector-store-access-dashboard-effective-teams
call:
  vector_store_access:
    function: can_user_access_vector_store
    vector_store: {vector_store_id: vs_from_key, team_id: team_x}
    auth:
      user_id: u_session
      team_id: litellm-dashboard
      object_permission: {object_permission_id: p_session_key, vector_stores: [vs_from_key]}
      team_object_permission: {object_permission_id: p_synthetic_team, vector_stores: [vs_from_synthetic]}
      team_object_permission_id: p_synthetic_team
    database: true
    object_permissions:
      p_session_key: {object_permission_id: p_session_key, vector_stores: [vs_from_key]}
      p_team_b: {object_permission_id: p_team_b, vector_stores: [vs_from_team_b]}
    teams:
      team_a:
        team_id: team_a
        object_permission: {object_permission_id: p_team_a, vector_stores: [vs_from_team_a]}
      team_b:
        team_id: team_b
        object_permission_id: p_team_b
      team_c:
        team_id: team_c
        object_permission: {object_permission_id: p_team_c, vector_stores: [vs_from_team_c]}
    user_teams: [team_a, team_b]
calls:
  - vector_store_access:
      function: can_user_access_vector_store
      vector_store: {vector_store_id: vs_from_synthetic, team_id: team_x}
