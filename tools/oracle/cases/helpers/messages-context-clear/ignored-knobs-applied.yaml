kind: helper
name: messages-context-clear-ignored-knobs-applied
call:
  messages_context_clear:
    action: editor
    model: gpt-4o-mini
    messages:
      - role: assistant
        content:
          - {type: tool_use, id: a, name: lookup, input: {query: one}}
          - {type: tool_use, id: b}
          - {type: tool_use, id: c}
          - {type: tool_use, id: d}
      - role: user
        content:
          - {type: tool_result, tool_use_id: a, content: result a}
          - {type: tool_result, tool_use_id: b, content: result b}
          - {type: tool_result, tool_use_id: c, content: result c}
          - {type: tool_result, tool_use_id: d, content: result d}
    tools: null
    system: null
    edit_spec:
      clear_at_least: 5
      exclude_tools: [lookup]
      clear_tool_inputs: true
      trigger: {type: tool_uses, value: 0}
    counter: {mode: scripted, values: [10, 4]}
env: {}
compare: {ignore: []}
