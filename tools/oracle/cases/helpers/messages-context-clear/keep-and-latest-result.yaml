kind: helper
name: messages-context-clear-keep-and-latest-result
call:
  messages_context_clear:
    action: editor
    model: gpt-4o-mini
    messages:
      - role: assistant
        content:
          - {type: tool_use, id: a}
          - {type: tool_use, id: b}
          - {type: tool_use, id: c}
          - {type: tool_use, id: d}
          - {type: tool_use, id: e}
      - role: user
        content:
          - {type: tool_result, tool_use_id: a, content: result a}
          - {type: tool_result, tool_use_id: b, content: result b}
          - {type: tool_result, tool_use_id: c, content: result c}
          - {type: tool_result, tool_use_id: e, content: result e}
          - {type: tool_result, tool_use_id: d, content: result d}
    tools:
      - name: lookup
        description: Look up a record
        input_schema:
          type: object
          properties:
            query: {type: string}
    system: null
    edit_spec:
      trigger: {type: tool_uses, value: 0}
      keep: {value: 0}
    counter: {mode: scripted, values: [10, 4]}
env: {}
compare: {ignore: []}
