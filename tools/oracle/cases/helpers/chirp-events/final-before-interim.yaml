kind: helper
name: chirp-events-final-before-interim
call:
  chirp_events:
    function: trace
    session_id: sess_interim
    session:
      model: chirp_2
      language: null
      sample_rate: 16000
      server_vad: true
    frames:
      - kind: response
        speech_event: begin
        results:
          - transcript: hello
            is_final: false
        billed_seconds: 0.5
      - kind: response
        speech_event: none
        results:
          - transcript: hello world
            is_final: true
        billed_seconds: 1.0
      - kind: response
        speech_event: end
        results:
          - transcript: again
            is_final: false
        billed_seconds: 1.5
      - kind: turn_finished
env: {}
compare:
  ignore:
    - pointer: /value/events/0/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/1/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/2/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/3/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/4/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/5/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/6/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/7/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/8/event_id
      why: both sides generate their own event ids
