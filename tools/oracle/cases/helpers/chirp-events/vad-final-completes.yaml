kind: helper
name: chirp-events-vad-final-completes
call:
  chirp_events:
    function: trace
    session_id: sess_vad
    session:
      model: chirp_2
      language: en-US
      sample_rate: 16000
      server_vad: true
    frames:
      - kind: configured
      - kind: response
        speech_event: begin
        results:
          - transcript: one
            is_final: true
          - transcript: two
            is_final: true
        billed_seconds: 0.75
      - kind: response
        speech_event: none
        results: []
        billed_seconds: 0.75
      - kind: turn_finished
env: {}
compare:
  ignore:
    - pointer: /value/events/0/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/1/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/2/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/3/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/4/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/5/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/6/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/7/event_id
      why: both sides generate their own event ids
    - pointer: /value/events/8/event_id
      why: both sides generate their own event ids
