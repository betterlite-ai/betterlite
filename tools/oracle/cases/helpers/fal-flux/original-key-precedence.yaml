kind: helper
name: fal-flux-original-key-precedence
call:
  fal_flux:
    operation: original_key_precedence
    prompt: "a cat"
    profiles: [ultra, pro_v11, schnell, dev]
    cases:
      - non_default: {n: 2}
        optional: {}
        drop_params: false
      - non_default: {n: 2}
        optional: {num_images: 1}
        drop_params: false
      - non_default: {n: 2}
        optional: {n: 5}
        drop_params: false
      - non_default: {response_format: "url"}
        optional: {}
        drop_params: false
      - non_default: {response_format: "b64_json"}
        optional: {}
        drop_params: false
      - non_default: {response_format: "png"}
        optional: {}
        drop_params: false
      - non_default: {response_format: "url"}
        optional: {output_format: "png"}
        drop_params: false
      - non_default: {response_format: "url"}
        optional: {response_format: "png"}
        drop_params: false
      - non_default: {size: "1024x768"}
        optional: {}
        drop_params: false
      - non_default: {seed: 1}
        optional: {}
        drop_params: false
      - non_default: {seed: 1}
        optional: {}
        drop_params: true
      - non_default: {seed: 1}
        optional: {seed: 7}
        drop_params: false
      - non_default: {}
        optional: {prompt: "a dog"}
        drop_params: false
env: {}
compare:
  ignore: []
