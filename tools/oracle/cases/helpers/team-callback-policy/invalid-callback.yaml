      - {"function": "validate", "callback_name": "arize", "callback_vars": {"arize_success_sampling_rate": "0.25", "arize_error_sampling_rate": "1"}}
      - {"function": "validate", "callback_name": "langfuse_otel", "callback_vars": {"langfuse_span_scope": "llm_only"}}
      - {"function": "validate", "callback_name": "langfuse", "callback_vars": {"langfuse_environment": "prod-eu", "langfuse_host": "https://lf.example"}}
env: {}
compare: {ignore: []}
