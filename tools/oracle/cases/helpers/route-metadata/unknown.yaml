kind: helper
name: route-metadata-unknown
call:
  route_metadata:
    {
      "function": "get_call_types",
      "route": "/no-such-route"
    }
env: {}
compare:
  ignore:
    - pointer: /value
      why: a null lookup round-trips through JSON on the Python side, so serde collapses it to a missing value; the native side keeps it as an explicit null
