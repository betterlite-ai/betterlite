kind: helper
name: team-patch-window-reset-json
call:
  team_patch:
    calls:
      - {request: {team_id: t, budget_limits: null}, now: "2026-05-01T10:00:00.123456+00:00"}
      - {request: {team_id: t, budget_limits: []}, now: "2026-05-01T10:00:00.123456+00:00"}
      - {request: {team_id: t, budget_limits: [{budget_duration: 1d, max_budget: 10.0}]}, now: "2026-05-01T10:00:00.123456+00:00"}
      - {request: {team_id: t, budget_limits: [{budget_duration: 1h, max_budget: 2.5}, {budget_duration: 30m, max_budget: 4.0}]}, now: "2026-05-01T10:00:00.123456+00:00"}
      - {request: {team_id: t, budget_limits: [{budget_duration: 7d, max_budget: 100.0}]}, now: "2026-12-31T23:59:59.999999+00:00"}
      - {request: {team_id: t, budget_duration: 1d, budget_limits: [{budget_duration: 30d, max_budget: 50.0}]}, now: "2026-05-01T10:00:00+00:00"}
env: {}
compare: {ignore: []}
