kind: helper
name: messages-example
call:
  openapi_schema_transforms:
    function: add_request_body_to_paths
    openapi:
      components: {schemas: {Request: {type: object, properties: {messages: {type: array}}}}}
      paths: {/chat: {post: {parameters: [{in: query, name: q}, {in: path, name: model}]}}}
    paths: [/chat]
    schema_ref: '#/components/schemas/Request'
    field_name: messages
env: {}
compare:
  ignore: []
