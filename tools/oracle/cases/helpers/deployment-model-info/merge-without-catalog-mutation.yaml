kind: helper
name: deployment-model-info-merge-without-catalog-mutation
call:
  deployment_model_info:
    function: router_info
    model_list:
      - model_name: merge
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: merge
          base_model: openai/base-gpt
          max_input_tokens: 0
          max_output_tokens: 77
          input_cost_per_token: 0.25
          display_name: ""
    model_cost:
      openai/gpt-4o:
        max_tokens: 500
        max_input_tokens: 400
        max_output_tokens: 300
        input_cost_per_token: 0.1
        output_cost_per_token: 0.2
        litellm_provider: openai
      openai/base-gpt:
        max_tokens: 999
        input_cost_per_token: 0.9
        output_cost_per_token: 0.9
        litellm_provider: openai
    arguments:
      received_model_name: merge
      id: merge
env: {}
compare: {ignore: []}
