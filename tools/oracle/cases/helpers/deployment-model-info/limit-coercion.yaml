kind: helper
name: deployment-model-info-limit-coercion
call:
  deployment_model_info:
    function: listing
    model_list:
      - model_name: coerced
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: a
          max_input_tokens: true
          max_output_tokens: "2048"
      - model_name: coerced
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: b
          max_input_tokens: 0
          max_output_tokens: -3
      - model_name: coerced
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: c
          max_input_tokens: 1.5
          max_output_tokens: 4096.0
      - model_name: coerced
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: d
          max_input_tokens: "not-a-number"
          max_output_tokens: "1e3"
          input_cost_per_token: 0
    model_cost:
      openai/gpt-4o:
        max_tokens: 1000
        litellm_provider: openai
    arguments:
      model_name: coerced
calls:
  - deployment_model_info:
      function: configured
      model_list:
        - model_name: coerced
          litellm_params:
            model: openai/gpt-4o
          model_info:
            id: a
            max_input_tokens: true
            max_output_tokens: "2048"
      model_cost:
        openai/gpt-4o:
          max_tokens: 1000
          litellm_provider: openai
      arguments:
        model_name: coerced
env: {}
compare: {ignore: []}
