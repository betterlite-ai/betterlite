kind: helper
name: header-override
call:
  vertex_endpoint:
    header_override:
      headers:
        - {auth: null, extras: {}}
        - {auth: tok, extras: {}}
        - {auth: "", extras: {}}
        - {auth: null, extras: {Content-Type: text/plain}}
        - {auth: tok, extras: {Authorization: "Custom x"}}
