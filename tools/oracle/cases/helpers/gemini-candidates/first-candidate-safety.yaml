kind: helper
name: gemini-candidates-first-candidate-safety
call:
  gemini_candidates:
    streaming: false
    legacy_function: false
    cumulative_tool_call_idx: 0
    now: 1700000000
    generated_id: 0123456789abcdef0123456789abcdef
    body:
      candidates:
        - content:
            parts:
              - text: withheld
          finishReason: SAFETY
        - content:
            parts:
              - text: never shown
          finishReason: STOP
      usageMetadata:
        promptTokenCount: 5
        candidatesTokenCount: 2
        totalTokenCount: 9
        toolUsePromptTokenCount: 4
        thoughtsTokenCount: 3
env: {}
compare: {ignore: []}
