kind: helper
name: gemini-candidates-audio-plus-text
call:
  gemini_candidates:
    streaming: false
    legacy_function: false
    cumulative_tool_call_idx: 0
    now: 1700000000
    generated_id: 0123456789abcdef0123456789abcdef
    body:
      candidates:
        - content:
            parts:
              - inlineData:
                  mimeType: audio/wav
                  data: QUJD
          finishReason: STOP
        - content:
            parts:
              - inlineData:
                  mimeType: audio/wav
                  data: QUJD
              - text: spoken words
          finishReason: STOP
      usageMetadata:
        promptTokenCount: 2
        candidatesTokenCount: 4
        totalTokenCount: 6
env: {}
compare: {ignore: []}
