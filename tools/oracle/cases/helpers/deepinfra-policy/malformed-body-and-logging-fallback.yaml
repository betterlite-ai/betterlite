kind: helper
name: deepinfra-malformed-body-and-logging-fallback
call:
  deepinfra_policy:
    operation: rerank_response
    params:
      - {model: BAAI/bge-reranker-v2-m3, body: not json, fail_logging: false}
      - {model: BAAI/bge-reranker-v2-m3, body: "[]", fail_logging: false}
      - {model: BAAI/bge-reranker-v2-m3, body: '{"scores": [0.5], "request_id": "req-1"}', fail_logging: true}
      - {model: BAAI/bge-reranker-v2-m3, body: '{"scores": "abc", "request_id": "req-2"}', fail_logging: false}
env: {}
compare: {ignore: []}
