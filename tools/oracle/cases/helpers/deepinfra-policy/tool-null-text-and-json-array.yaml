kind: helper
name: deepinfra-tool-null-text-and-json-array
call:
  deepinfra_policy:
    operation: tool_content
    params:
      - model: deepinfra-model
        messages: [{role: tool, content: [{type: text, text: "20"}], tool_call_id: c1}]
        optional_params: {}
      - model: deepinfra-model
        messages: [{role: tool, content: [{type: text, text: null}], tool_call_id: c2}]
        optional_params: {}
      # parts here carry one key each, since the oracle's serde_json::Value input sorts a part's keys
      - model: deepinfra-model
        messages: [{role: tool, content: [{type: text}, {type: text}]}]
        optional_params: {}
      - model: deepinfra-model
        messages: [{role: tool, content: [{type: audio}]}]
        optional_params: {}
      - model: deepinfra-model
        messages:
          - {role: user, content: [{type: text, text: hi}]}
          - {role: tool, content: plain}
        optional_params: {}
env: {}
compare: {ignore: []}
