kind: helper
name: star-and-empty-become-empty
call:
  b10074:
    salt_key: salt-one
    master_key: null
    general_settings:
      encryption_algorithm: AES-256-GCM
    calls:
      - operation: encrypt_env
        values:
          star: "*"
          empty: ""
        new_key: null
      - operation: encrypt_env_for_db
        values:
          star: "*"
          empty: ""
        new_key: null
      - operation: decrypt_env
        values:
          star: "*"
          empty: ""
        new_key: null
env: {}
compare:
  ignore: []
