kind: helper
name: otlp-response-encoding-protobuf-with-error
call:
  otlp_normalization:
    response_encoding: {content_type: "application/x-protobuf", error: "OTLP body exceeds 16777216 bytes; the collector should batch spans into smaller export requests before sending them to this proxy endpoint"}
env: {}
compare:
  ignore: []
