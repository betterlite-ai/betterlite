kind: helper
name: vertex-messages-per-turn-output
call:
  vertex_messages:
    access_token: fixed-token
    credential_project: credential-project
    model: claude-sonnet-4-6
    messages:
      - role: user
        content: hi
        output_config:
          effort: high
    optional_params:
      max_tokens: 16
    headers: {}
    vertex_project: deployment-project
    vertex_location: null
    api_base: null
env: {}
compare: {ignore: []}
