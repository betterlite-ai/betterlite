kind: helper
name: malformed-arguments
call:
  response_tool_calls:
    function: get_tool_calls
    response:
      choices:
        - message:
            tool_calls:
              - id: call_truncated
                function:
                  name: read_file
                  arguments: '{"path":"/tmp","flags":["a","b'
              - id: call_concat
                function:
                  name: run
                  arguments: '{"cmd":["a"]}{"cmd":["b"]}'
              - id: call_broken
                function:
                  name: run
                  arguments: '{not json'
              - id: call_redacted
                function:
                  name: run
                  arguments: redacted-by-litellm
env: {}
compare:
  ignore: []
