kind: helper
name: watsonx-auth-authorization-order
env: {}
compare: {ignore: []}
call:
  b5970:
    env: {WX_API_KEY: key-1}
    routes:
      - route: POST https://iam.cloud.ibm.com/identity/token
        replies:
          - {status: 200, body: '{"access_token":"iam-1","expires_in":20}'}
          - {status: 200, body: '{"access_token":"iam-2","expires_in":20}'}
          - {status: 200, body: '{"access_token":"iam-3","expires_in":20}'}
          - {status: 200, body: '{"access_token":"iam-4","expires_in":20}'}
          - {status: 200, body: '{"access_token":"iam-5","expires_in":20}'}
    steps:
      - {op: authorization, headers: {Authorization: "Bearer caller"}, params: {zen_api_key: zen-param}}
      - {op: authorization, headers: {}, params: {token: param-token, zen_api_key: zen-param}}
      - {op: authorization, headers: {X-Custom: custom, Content-Type: text/plain}, params: {token: param-token}}
      - {op: authorization, headers: {}, params: {zen_api_key: zen-param}}
      - {op: authorization, headers: {}, params: {}, api_key: key-1}
      - {op: generate, api_key: key-1}
      - {op: advance, seconds: 10}
      - {op: generate, api_key: key-1}
      - {op: advance, seconds: 1}
      - {op: generate, api_key: key-1}
      - {op: generate}
      - {op: generate}
      - {op: generate, token: given-token}
      - {op: generate, token: ""}
      - {op: generate, api_key: ""}
      - {op: iam_url}
