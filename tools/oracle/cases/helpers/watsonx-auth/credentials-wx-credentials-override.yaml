kind: helper
name: watsonx-auth-credentials-wx-credentials-override
env: {}
compare: {ignore: []}
call:
  b5970:
    env: {}
    routes: []
    steps:
      - op: credentials
        api_key: argument-key
        api_base: https://argument-base
        params:
          apikey: param-key
          url: https://param-url
          wx_credentials:
            url: https://wx-url
            apikey: wx-key
            token: wx-token
      - op: credentials
        api_key: null
        api_base: null
        params: {apikey: param-key, url: https://param-url}
      - op: credentials
        api_key: null
        api_base: https://argument-base
        params:
          watsonx_credentials: {api_key: alternate-key, watsonx_token: alternate-token}
      - op: credentials
        api_key: null
        api_base: https://argument-base
        params:
          apikey: key
          wx_credentials: null
          watsonx_credentials: {apikey: alternate-key}
      - op: credentials
        api_key: null
        api_base: null
        params: {apikey: key, base_url: https://base-url}
      - {op: credentials, params: {}, api_key: null, api_base: https://argument-base}
      - {op: credentials, params: {apikey: key}, api_key: null, api_base: null}
