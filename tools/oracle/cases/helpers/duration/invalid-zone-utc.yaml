kind: helper
name: invalid_zone_utc
call:
  duration:
    calls:
      - {function: reset, duration: "1d", now: "2024-01-01T10:00:00Z", timezone: "Not/AZone"}
      - {function: reset, duration: "1d", now: "2024-01-01T10:00:00Z", timezone: null}
      - {function: reset, duration: "1d", now: "2024-01-01T10:00:00Z", timezone: ""}
      - {function: reset, duration: "1mo", now: "2024-01-31T00:00:00Z", timezone: "Not/AZone", reset_time_of_day: "06:00:00"}
      - {function: duration_in_seconds, duration: "1mo", now: "2024-01-31T00:00:00Z", timezone: "Not/AZone"}
      - {function: reset, duration: "1d", now: "2024-01-01T10:00:00Z", timezone: "US/Eastern"}
env: {}
compare: {ignore: []}
