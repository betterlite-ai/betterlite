        function: {name: empty_parameters, parameters: {}}
      - {type: function}
      - {type: mcp, server_label: docs, server_url: "https://docs.example/mcp"}
      - {type: web_search_preview}
      - {type: custom, name: patch}
env: {}
compare:
  ignore: []
