      - type: function
        function:
          name: full
          description: Everything set
          parameters: {properties: {a: {type: string}}}
          strict: true
        cache_control: {type: ephemeral}
        defer_loading: false
        allowed_callers: [direct]
        input_examples: []
        eager_input_streaming: true
      - type: function
        function: {name: minimal}
      - type: function
        function: {name: typed, parameters: {type: string}, strict: false}
