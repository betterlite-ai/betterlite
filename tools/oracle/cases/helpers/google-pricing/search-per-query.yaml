kind: helper
name: google-pricing-search-per-query
call:
  google_pricing:
    operation: web_search_cost
    record:
      search_context_cost_per_query:
        search_context_size_medium: 0.001
      web_search_billing_unit: per_query
    usage:
      prompt_tokens: 3
      completion_tokens: 0
      prompt_tokens_details:
        web_search_requests: 3
env: {}
compare: {ignore: []}
