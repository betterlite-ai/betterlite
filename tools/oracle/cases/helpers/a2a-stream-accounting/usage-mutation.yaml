kind: helper
name: a2a-stream-accounting-usage-mutation
call:
  b4810:
    function: set_usage
    instances:
      - prompt_tokens: 3
        completion_tokens: 4
        details:
          litellm_params: {cost_per_query: 0.5}
          metadata: {user_api_key: hash-1}
      - prompt_tokens: 2
        completion_tokens: 0
        details:
          usage: {prompt_tokens: 9, completion_tokens: 9, total_tokens: 18}
          model: a2a_agent/agent
      - prompt_tokens: 1
        completion_tokens: 1
        logging: false
        details: {metadata: {user_id: u-1}}
env: {}
compare: {ignore: []}
