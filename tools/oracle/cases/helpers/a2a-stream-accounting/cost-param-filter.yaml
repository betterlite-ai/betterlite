kind: helper
name: a2a-stream-accounting-cost-param-filter
call:
  b4810:
    function: cost_params
    instances:
      - litellm_params:
          cost_per_query: 0.25
          input_cost_per_token: 0.01
          output_cost_per_token: 0.02
          api_key: sk-secret
          metadata: {user_api_key: hash-1}
          is_public: true
      - litellm_params:
          cost_per_query: null
          input_cost_per_token: 0.01
          output_cost_per_token: null
      - litellm_params: null
      - litellm_params: {}
env: {}
compare: {ignore: []}
