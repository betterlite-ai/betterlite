kind: helper
name: a2a-stream-accounting-model-info-extraction
call:
  b4810:
    function: model_info
    instances:
      - card: {name: card-agent}
        details: {}
      - card: null
        details: {model: old-model, custom_llm_provider: old-provider}
      - card: {description: a card without a name}
        details: {litellm_params: {cost_per_query: 0.5}}
      - card: {name: card-agent}
        logging: false
        details: {}
env: {}
compare: {ignore: []}
