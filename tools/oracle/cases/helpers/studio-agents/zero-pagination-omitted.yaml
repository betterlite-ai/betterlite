kind: helper
name: studio-agents-zero-pagination-omitted
call:
  studio_agents:
    calls:
      - function: list_request
        name: unused
        environment: {GEMINI_API_BASE: "https://studio.example/"}
        page_size: 0
        page_token: ""
      - function: versions_request
        name: my-agent
        page_size: 0
        page_token: ""
      - function: list_request
        name: unused
        page_size: 7
        page_token: "next token"
env: {}
compare: {ignore: []}
