kind: helper
name: studio-agents-custom-base-requires-explicit-key
call:
  studio_agents:
    calls:
      - function: validate
        headers: {X-Caller: kept}
        api_base: https://custom.example
        environment: {GOOGLE_API_KEY: env-google, GEMINI_API_KEY: env-gemini}
env: {}
compare: {ignore: []}
