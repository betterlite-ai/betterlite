          - {metric: last_seen, sample: last_seen, labels: {}, help: Last seen, value: 3.0, timestamp: 7.0}
      - name: gauge_mostrecent_1004.db
        entries:
          - {metric: last_seen, sample: last_seen, labels: {}, help: Last seen, value: 4.0, timestamp: 6.0}
      - name: gauge_mostrecent_1005.db
