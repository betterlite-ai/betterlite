kind: helper
name: mcp-user-credentials-store-oauth-credential-with-refresh
call:
  b4713:
    function: store_oauth_credential
    salt_key: b4713-salt
    user_id: u1
    server_id: s1
    access_token: tok-refresh
    refresh_token: ref-basic
    expires_in: null
    scopes: null
    skip_byok_guard: false
    identity_binding_proof: null
    rows: []
env:
  LITELLM_SALT_KEY: b4713-salt
compare: {ignore: []}
