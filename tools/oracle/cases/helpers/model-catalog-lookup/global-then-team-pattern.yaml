kind: helper
name: model-catalog-lookup-global-then-team-pattern
call:
  model_catalog_lookup:
    function: get_model_list
    model_list:
      - model_name: openai/*
        litellm_params:
          model: openai/*
        model_info:
          id: w
      - model_name: internal/*
        litellm_params:
          model: openai/team-*
        model_info:
          id: tp
          team_id: t1
          team_public_model_name: openai/*
    model_group_alias: {}
    routing_groups: []
    inferred_provider: openai
    stale_index: false
    arguments:
      model_name: openai/gpt-4o
      team_id: t1
env: {}
compare: {ignore: []}
