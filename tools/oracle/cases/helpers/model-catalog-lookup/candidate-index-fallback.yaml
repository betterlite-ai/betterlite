kind: helper
name: model-catalog-lookup-candidate-index-fallback
call:
  model_catalog_lookup:
    function: get_candidate_model_ids_for_route
    model_list:
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: a
      - model_name: gpt-4o
        litellm_params:
          model: azure/gpt-4o
        model_info:
          id: b
    model_group_alias: {}
    routing_groups: []
    inferred_provider: null
    stale_index: false
    arguments:
      model_name: gpt-4o
      team_id: null
env: {}
compare: {ignore: []}
