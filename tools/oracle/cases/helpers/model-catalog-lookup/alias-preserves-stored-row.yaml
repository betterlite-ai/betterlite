kind: helper
name: model-catalog-lookup-alias-preserves-stored-row
call:
  model_catalog_lookup:
    function: get_model_list
    model_list:
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: a
    model_group_alias:
      sonnet: gpt-4o
    routing_groups: []
    inferred_provider: null
    stale_index: false
    arguments:
      model_name: sonnet
env: {}
compare: {ignore: []}
