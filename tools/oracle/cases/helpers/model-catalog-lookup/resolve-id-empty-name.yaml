kind: helper
name: model-catalog-lookup-resolve-id-empty-name
call:
  model_catalog_lookup:
    function: resolve_model_name_from_model_id
    model_list:
      - model_name: ""
        litellm_params:
          model: openai/e
        model_info:
          id: e1
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: a
    model_group_alias: {}
    routing_groups: []
    inferred_provider: null
    stale_index: false
    arguments:
      model_id: e1
env: {}
compare: {ignore: []}
