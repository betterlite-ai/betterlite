kind: helper
name: model-catalog-lookup-resolve-first-match
call:
  model_catalog_lookup:
    function: resolve_model_name_from_model_id
    model_list:
      - model_name: first
        litellm_params:
          model: openai/v2
        model_info:
          id: f1
      - model_name: second
        litellm_params:
          model: azure/v2
        model_info:
          id: s2
    model_group_alias: {}
    routing_groups: []
    inferred_provider: null
    stale_index: false
    arguments:
      model_id: v2
env: {}
compare: {ignore: []}
