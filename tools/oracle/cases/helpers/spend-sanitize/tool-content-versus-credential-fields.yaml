kind: helper
name: tool-content-versus-credential-fields
call:
  spend_sanitize:
    operation: sanitize_request_body
    bodies:
      - body:
          $py: mapping
          id: 1
          entries:
            api_key: sk-live-abcdefgh
            apikey: sk-apikey-123456
            secret_fields: {authorization: "Bearer abc"}
            messages:
              - {$py: mapping, id: 2, entries: {role: user, content: hello}}
              - $py: mapping
                id: 3
                entries:
                  type: tool_use
                  input:
                    $py: mapping
                    id: 4
                    entries:
                      api_key: sk-tool-input
                      secret_fields: {x: y}
                      nested: {password: hunter2}
              - $py: mapping
                id: 5
                entries:
                  type: tool_result
                  role: tool
                  content: [{$py: mapping, id: 6, entries: {api_key: sk-tool-content}}]
                  output: {token: sk-output}
              - {type: text, content: {"api_key": sk-plain-content}}
            input_cost_per_token: 3
            tools:
              - {function: {name: lookup, parameters: {api_key: sk-in-tools}}}
        max_string_length: 2048
env: {}
compare: {ignore: []}
