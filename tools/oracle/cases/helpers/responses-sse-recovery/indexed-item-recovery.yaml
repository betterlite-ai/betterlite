kind: helper
name: responses-sse-recovery-indexed-item-recovery
call:
  responses_sse_recovery:
    action: recover_recorded_output
    recordings:
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":2,"item":{"id":"two"}}
        data: {"type":"response.output_item.done","item":{"id":"fallback"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":" +3 ","item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":"1_000","item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":true,"item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":2.9,"item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":-1,"item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":false,"item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":"abc","item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":"2.9","item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":{"id":"zero"}}
        data: {"type":"response.output_item.done","output_index":null,"item":{"id":"tested"}}
      - |-
        data: {"type":"response.output_item.done","output_index":0,"item":5}
        data: {"type":"response.output_item.done","output_index":1,"item":{"id":"kept"}}
      - |-
        data: {"type":"response.output_item.done","output_index":1,"item":{"id":"first"}}
        data: {"type":"response.output_item.done","output_index":1,"item":{"id":"second"}}
      - |-
        data: {"type":"response.output_item.done","output_index": " +3 ","item":{"id":"tested"}}
        data: {"type":"response.output_item.done","output_index":3,"item":{"id":"target"}}
      - |-
        data: {"type":"response.output_item.done","output_index": "1_000","item":{"id":"tested"}}
        data: {"type":"response.output_item.done","output_index":1000,"item":{"id":"target"}}
      - |-
        data: {"type":"response.output_item.done","output_index":true,"item":{"id":"tested"}}
        data: {"type":"response.output_item.done","output_index":1,"item":{"id":"target"}}
      - |-
        data: {"type":"response.output_item.done","output_index":2.9,"item":{"id":"tested"}}
        data: {"type":"response.output_item.done","output_index":2,"item":{"id":"target"}}
      - |-
        data: {"type":"response.output_item.done","output_index": "1_","item":{"id":"tested"}}
        data: {"type":"response.output_item.done","output_index":1,"item":{"id":"target"}}
      - |-
        data: {"type":"response.output_item.done","output_index":[],"item":{"id":"tested"}}
        data: {"type":"response.output_item.done","output_index":1,"item":{"id":"target"}}
      - |-
        data: {"type":"response.output_item.done","output_index":{},"item":{"id":"tested"}}
        data: {"type":"response.output_item.done","output_index":1,"item":{"id":"target"}}
env: {}
compare:
  ignore: []
