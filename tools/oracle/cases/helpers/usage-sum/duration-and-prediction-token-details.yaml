kind: helper
name: duration-and-prediction-token-details
call:
  usage_sum:
    usages:
      - numeric_extras: {duration: 0.25}
        completion_tokens_details: {accepted_prediction_tokens: 2, rejected_prediction_tokens: 1}
      - numeric_extras: {duration: 0.75}
        completion_tokens_details: {accepted_prediction_tokens: 3, rejected_prediction_tokens: 4}
compare: {ignore: []}
env: {}
