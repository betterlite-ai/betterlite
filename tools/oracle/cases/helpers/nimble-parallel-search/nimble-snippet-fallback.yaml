              url: https://five.test
              content: dated
              additional_data:
                publish_date: "2024-03-04"
                publish_date_raw: 1 day ago
            - title: Numeric publish date
              url: https://six.test
              additional_data:
                publish_date: 20240304
            - title: Text additional data
              url: https://seven.test
              additional_data: free form
            - title: Null additional data
              url: https://eight.test
              additional_data: null
      - operation: reply
        status: 201
        body:
          results: []
env: {}
compare: {ignore: []}
