kind: helper
name: model-info-search-public-name-sort
call:
  model_info_search:
    function: sort
    sort_by: model_name
    sort_order: asc
    models:
      - model_name: model_name_team_a_uuid
        model_info:
          team_public_model_name: zeta
      - model_name: model_name_team_b_uuid
        model_info:
          team_public_model_name: Alpha
      - model_name: Beta
        model_info: {}
      - model_name: gamma
        model_info:
          team_public_model_name: ""
calls:
  - model_info_search:
      function: sort
      sort_by: model_name
      sort_order: desc
      models:
        - model_name: model_name_team_a_uuid
          model_info:
            team_public_model_name: zeta
        - model_name: model_name_team_b_uuid
          model_info:
            team_public_model_name: Alpha
        - model_name: Beta
          model_info: {}
        - model_name: gamma
          model_info:
            team_public_model_name: ""
env: {}
compare: {ignore: []}
