kind: helper
name: model-info-search-invalid-date-fallback
call:
  model_info_search:
    function: sort
    sort_by: created_at
    sort_order: asc
    models:
      - model_name: valid
        model_info:
          created_at: "2026-01-01T00:00:00Z"
      - model_name: bad
        model_info:
          created_at: not-a-date
      - model_name: null-date
        model_info:
          created_at: null
      - model_name: missing-date
        model_info: {}
      - model_name: bad-month
        model_info:
          created_at: "2026-13-01T00:00:00"
calls:
  - model_info_search:
      function: sort
      sort_by: created_at
      sort_order: desc
      models:
        - model_name: valid
          model_info:
            created_at: "2026-01-01T00:00:00Z"
        - model_name: bad
          model_info:
            created_at: not-a-date
        - model_name: null-date
          model_info:
            created_at: null
        - model_name: missing-date
          model_info: {}
        - model_name: bad-month
          model_info:
            created_at: "2026-13-01T00:00:00"
env: {}
compare: {ignore: []}
