kind: helper
name: model-info-search-empty-access-group-malformed-metadata
call:
  model_info_search:
    function: model_in_access_group
    access_group: ""
    models:
      - model_name: empty-member
        model_info:
          access_groups: [""]
      - model_name: named-member
        model_info:
          access_groups: [g]
      - model_name: text-groups
        model_info:
          access_groups: g
      - model_name: list-info
        model_info: []
      - model_name: no-info
calls:
  - model_info_search:
      function: matches_filters
      access_group: ""
      exclude_auto_routers: null
      wildcard_only: null
      models:
        - model_name: empty-member
          model_info:
            access_groups: [""]
        - model_name: named-member
          model_info:
            access_groups: [g]
        - model_name: text-groups
          model_info:
            access_groups: g
        - model_name: list-info
          model_info: []
        - model_name: no-info
env: {}
compare: {ignore: []}
