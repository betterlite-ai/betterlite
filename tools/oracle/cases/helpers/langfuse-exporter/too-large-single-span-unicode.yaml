    public_key: pk-lf-b3902
    secret_key: sk-lf-b3902
    base_url: https://cloud.langfuse.com
    spans:
      - name: generation
        attributes:
          - [langfuse.observation.input, "привет мир"]
          - [langfuse.observation.output, "abcdefghijkl"]
          - [langfuse.observation.metadata.model, "gpt"]
