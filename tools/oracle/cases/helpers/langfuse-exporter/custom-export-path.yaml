kind: helper
name: langfuse-exporter-custom-export-path
call:
  b3902:
    public_key: pk-lf-b3902
    secret_key: sk-lf-b3902
    base_url: https://langfuse.example.com/
    environment:
      LANGFUSE_OTEL_TRACES_EXPORT_PATH: /custom/otel/traces
    spans:
      - name: generation
        attributes:
          - [langfuse.observation.input, "hello"]
    replies:
      - status: 200
env: {}
compare: {ignore: []}
