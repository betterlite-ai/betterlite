kind: helper
name: datadog-llm-privacy-guardrail-redaction-audit-preserved
call:
  b3936:
    function: guardrail_redaction
    guardrail_information:
      - guardrail_name: "pii-guard"
        guardrail_provider: "presidio"
        guardrail_mode: {default: "pre_call"}
        guardrail_status: "guardrail_flagged"
        duration: 0.25
        masked_entity_count: {EMAIL: 2}
