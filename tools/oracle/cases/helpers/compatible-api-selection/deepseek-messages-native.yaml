kind: helper
name: deepseek-messages-native
call:
  compatible_api_selection:
    calls:
      - family: messages
        provider: deepseek
        model: deepseek-chat
        providers:
          - provider: deepseek
            supported_endpoints: ["/v1/messages"]
      - family: messages
        provider: groq
        model: groq-llama
        providers:
          - provider: groq
            supported_endpoints: ["/v1/chat/completions"]
env: {}
compare: {ignore: []}
