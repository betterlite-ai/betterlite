kind: helper
name: deepseek-messages-native
call:
  compatible_api_selection:
    - family: messages
      provider: deepseek
      model: deepseek-chat
      identity: name
      native: null
      providers:
        - provider: deepseek
          supported_endpoints: ["/v1/messages"]
    - family: messages
      provider: groq
      model: groq-llama
      identity: name
      native: null
      providers:
        - provider: groq
          supported_endpoints: ["/v1/chat/completions"]
env: {}
compare: {ignore: []}
