kind: helper
name: cli-login-pages-hostile-label-and-origin
call:
  cli_login_page:
    environment:
      CLI_JWT_EXPIRATION_HOURS: "12"
    renders:
      - page: consent
        client_origin: "http://127.0.0.1/\"q\"&<>'"
        user_id: "u\"'&<>"
        teams:
          - id: "t\"&<>'"
            label: "L\"'&<>"
        flow_handle: "f\"'&<>"
        complete_url: "https://proxy.example.com/complete?a=\"b\"&c=<d>'e"
      - page: consent
        client_origin: "https://localhost:1/&amp;\"x\""
        user_id: "a&b\"c'"
        teams:
          - id: "t1"
            label: "One & \"Two\""
          - id: "t2'"
            label: "Three <Four> 'five'"
        flow_handle: "handle'q"
        complete_url: "https://proxy.example.com/authorize/complete?x=1&y=2&z=\"3\""
env: {}
compare: {ignore: []}
