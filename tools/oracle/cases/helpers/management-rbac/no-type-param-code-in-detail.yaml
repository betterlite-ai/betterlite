kind: helper
name: no-type-param-code-in-detail
call:
  management_rbac:
    calls:
      # the detail object carries only error, with no type, param or code beside it
      - role: internal_user_viewer
        feature: agents
        general_settings: {disable_agents_for_internal_users: true}
      - role: org_admin
        feature: vector_stores
        general_settings: {disable_vector_stores_for_internal_users: true, allow_vector_stores_for_team_admins: true}
env: {}
compare: {ignore: []}
