kind: helper
name: internal-feature-disabled
call:
  management_rbac:
    calls:
      - role: internal_user
        feature: agents
        general_settings: {disable_agents_for_internal_users: true}
      - role: internal_user
        feature: vector_stores
        general_settings: {disable_vector_stores_for_internal_users: true, allow_vector_stores_for_team_admins: false}
      # with no database the team admin lookup answers False, so the exemption still denies
      - role: internal_user
        feature: agents
        general_settings: {disable_agents_for_internal_users: true, allow_agents_for_team_admins: true}
      - role: internal_user
        feature: vector_stores
        general_settings: {disable_vector_stores_for_internal_users: false}
env: {}
compare: {ignore: []}
