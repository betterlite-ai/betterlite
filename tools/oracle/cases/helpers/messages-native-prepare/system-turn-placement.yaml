kind: helper
name: messages-native-prepare-system-turn-placement
call:
  messages_native_prepare:
    function: transform
    calls:
      - request:
          model: claude-sonnet-4-5
          max_tokens: 16
          system: base
          messages:
            - role: system
              content: initial
            - role: user
              content: question
            - role: assistant
              content:
                - type: tool_use
                  id: t
                  name: lookup
                  input: {}
            - role: system
              content: reminder
            - role: user
              content:
                - type: tool_result
                  tool_use_id: t
                  content: found
            - role: user
              content: next
        supports_mid_system: false
      - request:
          model: claude-opus-5
          max_tokens: 16
          system: base
          messages:
            - role: system
              content: initial
            - role: user
              content: question
            - role: assistant
              content:
                - type: tool_use
                  id: t
                  name: lookup
                  input: {}
            - role: system
              content: reminder
            - role: user
              content:
                - type: tool_result
                  tool_use_id: t
                  content: found
            - role: user
              content: next
        supports_mid_system: true
      - request:
          model: claude-sonnet-4-5
          max_tokens: 16
          messages:
            - role: system
              content: a
            - role: system
              content:
                - type: text
                  text: b
        supports_mid_system: false
      - request:
          model: claude-sonnet-4-5
          max_tokens: 16
          messages:
            - role: user
              content: q
            - role: system
              content: first
            - role: user
              content: u1
            - role: system
              content: second
            - role: user
              content: u2
        supports_mid_system: false
      - request:
          model: claude-sonnet-4-5
          max_tokens: 16
          messages:
            - role: user
              content: q
            - role: assistant
              content: a
            - role: system
              content: r
            - role: user
              content:
                - type: text
                  text: look
                - type: tool_result
                  tool_use_id: t
        supports_mid_system: false
env: {}
compare:
  ignore: []
