kind: helper
name: native-tools-and-container
call:
  xai_responses:
    env: {}
    xai_key: null
    generic_key: null
    steps:
      - step: tools
        params:
          tools:
            - {type: code_interpreter, container: {type: auto}, extra: 1}
            - type: x_search
              allowed_x_handles: [handle]
              excluded_x_handles: null
              from_date: "2026-01-01"
              to_date: "2026-02-01"
              enable_image_understanding: false
              enable_video_understanding: null
              extra: dropped
            - {type: function, name: f, parameters: {type: object}}
            - plain-string
            - 7
env: {}
compare: {ignore: []}
