kind: helper
name: unwritable_access_file
call:
  copilot_device:
    access_token_file: null
    device_replies:
      - status: 200
        body: {"device_code": "dev-1", "user_code": "ABCD-1234", "verification_uri": "https://github.com/login/device"}
    access_replies:
      - status: 200
        body: {"access_token": "unsaved-token"}
    fail_write: true
env: {}
compare:
  ignore: []
