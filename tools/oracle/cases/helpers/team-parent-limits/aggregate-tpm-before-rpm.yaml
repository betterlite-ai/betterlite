kind: helper
name: aggregate-tpm-before-rpm
call:
  team_parent_limits:
    calls:
      - check: rpm_tpm
        teams: &siblings
          - {team_id: team-a, tpm_limit: 40, rpm_limit: 4}
          - {team_id: team-b, tpm_limit: null, rpm_limit: 1}
          - {team_id: team-c}
        organization: &budgeted
          {organization_id: org-1, budget_id: budget-1, created_by: admin, updated_by: admin, litellm_budget_table: {rpm_limit: 5, tpm_limit: 50}}
        request: {kind: new, body: {tpm_limit: 11, rpm_limit: 1}}
      - check: rpm_tpm
        teams: *siblings
        organization: *budgeted
        request: {kind: new, body: {tpm_limit: 10, rpm_limit: 1}}
      - check: rpm_tpm
        teams: *siblings
        organization: *budgeted
        request: {kind: new, body: {tpm_limit: 10, rpm_limit: 0}}
      - check: rpm_tpm
        teams: *siblings
        organization: *budgeted
        request: {kind: new, body: {}}
      - check: rpm_tpm
        teams: *siblings
        organization: *budgeted
        request: {kind: update, body: {team_id: team-a, tpm_limit: 11, rpm_limit: 1}}
      - check: rpm_tpm
        teams: []
        organization: &zero
          {organization_id: org-1, budget_id: budget-1, created_by: admin, updated_by: admin, litellm_budget_table: {rpm_limit: 0, tpm_limit: 0}}
        request: {kind: new, body: {tpm_limit: 1}}
      - check: rpm_tpm
        teams: []
        organization: *zero
        request: {kind: new, body: {rpm_limit: 1}}
      - check: rpm_tpm
        teams: []
        organization: *zero
        request: {kind: new, body: {tpm_limit: 0, rpm_limit: 0}}
env: {}
compare: {ignore: []}
