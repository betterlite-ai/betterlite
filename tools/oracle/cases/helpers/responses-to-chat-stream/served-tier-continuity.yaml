kind: helper
name: served-tier-continuity
call:
  responses_to_chat_stream:
    mode: event
    events:
      - {"type": "response.created", "response": {"id": "resp_a", "service_tier": "scale"}}
      - {"type": "response.output_text.delta", "delta": "b"}
      - {"type": "response.created", "response": {"id": "resp_a", "service_tier": ""}}
      - {"type": "response.output_text.delta", "delta": "c"}
      - {"type": "response.completed", "response": {"id": "resp_a", "service_tier": ""}}
env: {}
compare:
  ignore:
    - pointer: /value/steps/0/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/1/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/2/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/3/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/4/created
      why: the chunk's created timestamp is the wall clock
