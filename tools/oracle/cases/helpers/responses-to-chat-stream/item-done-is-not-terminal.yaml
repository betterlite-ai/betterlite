kind: helper
name: item-done-is-not-terminal
call:
  responses_to_chat_stream:
    mode: event
    events:
      - {"type": "response.created", "response": {"id": "resp_a"}}
      - {"type": "response.output_item.added", "output_index": 2, "item": {"type": "function_call", "id": "fc_a", "call_id": "call_a", "name": "f", "arguments": "{\"q\": 1}"}}
      - {"type": "response.output_item.done", "output_index": 2, "item": {"type": "function_call", "id": "fc_a", "call_id": "call_a", "name": "f", "arguments": "{\"q\": 1}"}}
      - {"type": "response.output_item.done", "output_index": 3, "item": {"type": "message"}}
      - {"type": "response.output_text.delta", "delta": "done"}
      - {"type": "response.output_item.done", "output_index": 4, "item": {"type": "reasoning"}}
env: {}
compare:
  ignore:
    - pointer: /value/steps/0/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/1/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/2/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/3/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/4/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/5/created
      why: the chunk's created timestamp is the wall clock
