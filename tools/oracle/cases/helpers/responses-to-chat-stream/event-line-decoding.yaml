kind: helper
name: event-line-decoding
call:
  responses_to_chat_stream:
    mode: line
    lines:
      - "prefix data:{\"type\":\"unknown\"}"
      - "data: {\"type\": \"response.output_text.delta\", \"delta\": \"hi\"}"
      - "{\"type\": \"response.failed\"}"
env: {}
compare:
  ignore:
    - pointer: /value/steps/0/id
      why: LiteLLM mints a random chatcmpl id for a data line that names no response
    - pointer: /value/steps/0/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/1/id
      why: LiteLLM mints a random chatcmpl id for a data line that names no response
    - pointer: /value/steps/1/created
      why: the chunk's created timestamp is the wall clock
    - pointer: /value/steps/2/id
      why: LiteLLM mints a random chatcmpl id for a data line that names no response
    - pointer: /value/steps/2/created
      why: the chunk's created timestamp is the wall clock
