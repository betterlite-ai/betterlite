kind: helper
name: model-credentials-credential-merge-and-snapshot
call:
  b10060:
    calls:
      - function: merge
        data: {api_key: caller, x: 1, custom_llm_provider: azure}
        credentials:
          api_key: server
          model: resolved
          custom_llm_provider: openai
          region: us-east-1
          vertex_credentials: {project_id: p}
          aws_session_tags: [{k: v}]
          bedrock_tags: []
        file_id: new
        include_internal_credentials: true
      - function: merge
        data:
          _litellm_internal_model_credentials: {api_key: caller}
          api_key: caller
        credentials: {api_key: server}
        include_internal_credentials: true
      - function: merge
        data:
          _litellm_internal_model_credentials: {api_key: caller}
          api_key: caller
        credentials: {api_key: server}
        include_internal_credentials: false
      - function: merge
        data: {api_key: caller}
        credentials: {api_key: server, custom_llm_provider: openai}
        include_internal_credentials: false
      - function: merge
        data: {}
        credentials: {api_key: server, custom_llm_provider: openai}
        file_id: ""
        include_internal_credentials: true
      - function: merge
        data: {file_id: old}
        credentials: {api_key: server}
        file_id: null
        include_internal_credentials: false
env: {}
compare: {ignore: []}
