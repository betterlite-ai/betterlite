kind: helper
name: vertex-batch-records-empty-page
call:
  vertex_batch_records:
    operation: list
    zone: UTC
    calls:
      - page: {batchPredictionJobs: []}
      - page: {batchPredictionJobs: null}
      - page: {}
      - page: {nextPageToken: ""}
      - page:
          batchPredictionJobs:
            - {name: "projects/p/locations/l/batchPredictionJobs/1", createTime: "2024-01-01T00:00:00.000000Z", state: JOB_STATE_SUCCEEDED}
            - {name: "projects/p/locations/l/batchPredictionJobs/2", createTime: "2024-01-01T00:00:00.000000Z", state: JOB_STATE_RUNNING}
          nextPageToken: cursor
      - page:
          batchPredictionJobs:
            - {name: "projects/p/locations/l/batchPredictionJobs/3", state: JOB_STATE_SUCCEEDED}
env: {TZ: UTC}
compare: {ignore: []}
