kind: helper
name: vector-file-resolution-provider-and-index-permissions
call:
  vector_file_resolution:
    calls:
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_allowed
        caller:
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_allowed, index_permissions: [read]}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_denied
        caller:
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_denied, index_permissions: [write]}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_allowed
        caller:
          team_metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_allowed, index_permissions: [read]}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_other
        caller:
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_allowed, index_permissions: [read]}
      - function: provider_and_index_permissions
        data: {}
        request: {headers: [[custom-llm-provider, azure]]}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {}
        request: {query: "custom_llm_provider=mistral"}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: anthropic}
        request: {headers: [[custom-llm-provider, azure]]}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: not-a-provider}
        request: {headers: [[custom-llm-provider, azure]]}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: ""}
        request: {headers: [[custom-llm-provider, azure]]}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {}
        request: {method: POST, body: {custom_llm_provider: azure}}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {}
        request: {method: GET, body: {custom_llm_provider: azure}}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {}
        request: {query: "custom_llm_provider="}
        vector_store_id: vs_1
        caller: {}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: not-a-provider}
        vector_store_id: vs_denied
        caller:
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_denied, index_permissions: []}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_denied
        caller:
          metadata: {allowed_vector_store_indexes: []}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_denied
        caller:
          metadata: {allowed_vector_store_indexes: null}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_denied
        caller:
          user_role: proxy_admin
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_denied, index_permissions: [write]}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_denied
        request: {path: /v1/elsewhere}
        caller:
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_denied, index_permissions: []}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai, vector_store_id: vs_other}
        vector_store_id: vs_allowed
        caller:
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_allowed, index_permissions: [read]}
      - function: provider_and_index_permissions
        data: {custom_llm_provider: openai}
        vector_store_id: vs_allowed
        request: {method: POST}
        caller:
          metadata:
            allowed_vector_store_indexes:
              - {index_name: vs_allowed, index_permissions: [read]}
env: {}
compare: {ignore: []}
