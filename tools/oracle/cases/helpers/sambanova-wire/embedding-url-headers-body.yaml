kind: helper
name: sambanova-embedding-url-headers-body
call:
  b6413:
    chat_supported: []
    chat_params: []
    embedding_urls:
      - {api_base: "https://api.sambanova.ai/v1"}
      - {api_base: "https://api.sambanova.ai/v1///"}
      - {api_base: "https://api.sambanova.ai/v1/embeddings"}
      - {api_base: "https://api.sambanova.ai/v1/embeddings/"}
      - {api_base: ""}
      - {api_base: null}
    embedding_headers:
      - {api_key: "sk-explicit", env_api_key: null, headers: {}}
      - {api_key: null, env_api_key: null, headers: {}}
      - {api_key: "sk-explicit", env_api_key: null, headers: {Authorization: "Basic abc", x-trace: "1"}}
      - {api_key: null, env_api_key: null, headers: {authorization: "Basic abc", accept: "text/plain"}}
      - {api_key: "", env_api_key: null, headers: {}}
      - {api_key: "sk-explicit", env_api_key: "sk-env", headers: {}}
      - {api_key: null, env_api_key: "sk-env", headers: {}}
      - {api_key: "", env_api_key: "sk-env", headers: {}}
    embedding_requests:
      - model: sambanova/embed
        input: ["hello", "world"]
        optional: {}
      - model: sambanova/embed
        input: "hello"
        optional: {dimensions: 3}
      - model: sambanova/embed
        input: ["hello"]
        optional: {model: other, input: text}
    embedding_replies:
      - status: 200
        headers: {}
        body: >-
          {"model": "embed-model", "object": "list", "data": [{"object": "embedding", "index": 0, "embedding": [0.25, -1.5]}], "usage": {"prompt_tokens": 3, "total_tokens": 3}}
      - status: 200
        headers: {}
        body: "{}"
      - status: 200
        headers: {}
        body: '{"model": null, "object": null, "data": null, "usage": {}}'
      - status: 200
        headers: {}
        body: '{"usage": {"prompt_tokens": 4}}'
      - status: 200
        headers: {}
        body: '{"usage": {"total_tokens": 9}}'
    embedding_errors:
      - {message: busy, status: 429, headers: {retry-after: "3"}}
      - {message: bad request, status: 400, headers: {}}
env: {}
compare: {ignore: []}
