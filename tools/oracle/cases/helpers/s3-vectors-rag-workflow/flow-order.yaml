        embeddings: [[0.5, 0.25]]
        filename: notes.txt
      - vector: {vector_bucket_name: flow-bucket, index_name: flow-index, distance_metric: euclidean, non_filterable_metadata_keys: [source_text, page]}
        environment: {S3_VECTORS_DEFAULT_DISTANCE_METRIC: cosine}
        chunks: [first]
        embeddings: [[0.5]]
env: {S3_VECTORS_DEFAULT_DISTANCE_METRIC: cosine}
