    params: {gcs_bucket_name: explicit-bucket, vertex_credentials: ""}
    argument: /secrets/argument-sa.json
    environment: {GCS_PATH_SERVICE_ACCOUNT: /secrets/env-sa.json}
calls:
  - vertex_file_read_settings:
      params: {gcs_bucket_name: explicit-bucket}
      argument: {client_email: argument@example.iam.gserviceaccount.com}
      environment: {}
  - vertex_file_read_settings:
      params: {gcs_bucket_name: explicit-bucket}
      argument: {}
      environment: {GCS_PATH_SERVICE_ACCOUNT: /secrets/env-sa.json}
  - vertex_file_read_settings:
      params: {gcs_bucket_name: explicit-bucket}
      argument: ""
      environment: {GCS_PATH_SERVICE_ACCOUNT: /secrets/env-sa.json}
env: {}
compare: {ignore: []}
