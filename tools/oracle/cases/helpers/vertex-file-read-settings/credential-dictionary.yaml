kind: helper
name: credential-dictionary
call:
  vertex_file_read_settings:
    params:
      gcs_bucket_name: dictionary-bucket
      vertex_credentials:
        client_email: sa@example.iam.gserviceaccount.com
        private_key: "line one\nline two"
        token_uri: https://oauth2.example/token
    argument: /secrets/argument-sa.json
    environment: {GCS_PATH_SERVICE_ACCOUNT: /secrets/env-sa.json}
calls:
  - vertex_file_read_settings:
      params:
        gcs_bucket_name: dictionary-bucket
        vertex_credentials: {project_id: my-project, type: service_account}
      argument: null
      environment: {}
env: {}
compare: {ignore: []}
