kind: helper
name: partial-reserve-rollback
call:
  batch_enqueued_reserve:
    tokens: 500
    principal:
      api_key: sk-oracle-key
      team_id: team-oracle
      metadata:
        batch_enqueued_token_limit: 1000
      team_metadata:
        batch_enqueued_token_limit: 2000
    redis:
      reserve:
        - [1, 100]
        - [0, 1900]
      refund:
        - 1
    memory: {seed: {}, read: []}
env: {}
compare: {ignore: []}
