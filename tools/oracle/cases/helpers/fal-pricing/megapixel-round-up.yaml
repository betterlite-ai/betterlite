kind: helper
name: fal-pricing-megapixel-round-up
call:
  fal_pricing:
    operation: megapixel_round_up
    model: fal_ai/fal-ai/pixel
    catalog:
      fal_ai/fal-ai/pixel:
        litellm_provider: fal_ai
        output_cost_per_image: 0.75
        output_cost_per_pixel: 0.000002
    cases:
      - images: [{width: 1024, height: 1024}]
        optional_params: {}
        model_info: null
      - images: [{width: 1024, height: 1025}]
        optional_params: {}
        model_info: null
      - images: [{width: 512, height: 512}]
        optional_params: {}
        model_info: null
      - images: [{width: true, height: 1024}]
        optional_params: {}
        model_info: null
      - images: [{width: 1024}]
        optional_params: {}
        model_info: null
    passthrough_cases: []
env: {}
compare:
  ignore: []
