kind: helper
name: fal-pricing-resolution-case-sensitive
call:
  fal_pricing:
    operation: resolution_case_sensitive
    model: fal_ai/fal-ai/flux/dev
    catalog:
      fal_ai/fal-ai/flux/dev:
        litellm_provider: fal_ai
        output_cost_per_image: 0.5
        output_cost_per_image_1K: 0.125
        output_cost_per_image_1024: 0.25
    cases:
      - images: [{width: 1024, height: 768}, {width: 1024, height: 768}]
        optional_params: {resolution: "1K"}
        model_info: null
      - images: [{width: 1024, height: 768}, {width: 1024, height: 768}]
        optional_params: {resolution: "1k"}
        model_info: null
      - images: [{width: 1024, height: 768}, {width: 1024, height: 768}]
        optional_params: {resolution: 1024}
        model_info: null
      - images: [{width: 1024, height: 768}, {width: 1024, height: 768}]
        optional_params: {resolution: "1024"}
        model_info: null
      - images: [{width: 1024, height: 768}, {width: 1024, height: 768}]
        optional_params: {resolution: "1024p"}
        model_info: null
      - images: [{width: 1024, height: 768}, {width: 1024, height: 768}]
        optional_params: {resolution: true}
        model_info: null
      - images: [{width: 1024, height: 768}, {width: 1024, height: 768}]
        optional_params: {resolution: 1024.0}
        model_info: null
    passthrough_cases: []
env: {}
compare:
  ignore: []
