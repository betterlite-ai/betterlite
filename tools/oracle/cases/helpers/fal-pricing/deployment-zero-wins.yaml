kind: helper
name: fal-pricing-deployment-zero-wins
call:
  fal_pricing:
    operation: deployment_zero_wins
    model: fal_ai/fal-ai/flux/schnell
    catalog:
      fal_ai/fal-ai/flux/schnell: {litellm_provider: fal_ai, output_cost_per_image: 0.5, output_cost_per_image_1024: 0.125}
      fal_ai/high/1024-x-768/fal-ai/flux/schnell: {litellm_provider: fal_ai, output_cost_per_image: 0.25}
      fal_ai/high/512-x-512/fal-ai/flux/schnell: {litellm_provider: fal_ai, output_cost_per_image: 0.125}
    cases:
      - images: [{width: 1024, height: 768}, {width: 512, height: 512}]
        optional_params: {}
        model_info: {output_cost_per_image: 0}
      - images: [{width: 1024, height: 768}, {width: 512, height: 512}]
        optional_params: {}
        model_info: {output_cost_per_image: 0.25}
      - images: [{width: 1024, height: 768}, {width: 512, height: 512}]
        optional_params: {}
        model_info: null
      - images: [{width: 1024, height: 768}, {width: 512, height: 512}]
        optional_params: {resolution: 1024}
        model_info: {output_cost_per_image: 0}
      - images: [{width: 1024, height: 768}, {width: 512, height: 512}]
        optional_params: {resolution: 1024}
        model_info: null
      - images: []
        optional_params: {}
        model_info: null
    passthrough_cases: []
env: {}
compare:
  ignore: []
