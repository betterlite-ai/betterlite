kind: helper
name: responses-file-search-multiple-vector-stores
call:
  responses_file_search_loop:
    input: question
    model: gpt-test
    tools:
      - {type: file_search, vector_store_ids: ["vs_1", "vs_2"]}
      - {type: file_search, vector_store_ids: ["vs_2", "vs_3"]}
    kwargs: {}
    provider:
      - id: resp_first
        created_at: 1700000000
        model: gpt-test
        status: completed
        output:
          - {type: function_call, name: litellm_file_search, arguments: '{"queries": ["q"]}', call_id: call_1, id: fc_1}
      - id: resp_final
        created_at: 1700000001
        model: gpt-test
        status: completed
        output:
          - type: message
            id: msg_2
            status: completed
            role: assistant
            content:
              - {type: output_text, text: done, annotations: []}
    searches:
      - kind: result
        vector_store_id: vs_1
        query: q
        response:
          object: vector_store.search_results.page
          search_query: q
          data:
            - {file_id: f1, filename: a.txt, content: [{type: text, text: one}]}
      - kind: result
        vector_store_id: vs_2
        query: q
        response:
          object: vector_store.search_results.page
          search_query: q
          data:
            - {file_id: f2, filename: b.txt, content: [{type: text, text: two}]}
      - kind: result
        vector_store_id: vs_3
        query: q
        response:
          object: vector_store.search_results.page
          search_query: q
          data: []
env: {}
compare:
  ignore:
    - pointer: /value/response/output/0/id
      why: LiteLLM mints the file_search_call id from uuid.uuid4, so only the fields around it are comparable
