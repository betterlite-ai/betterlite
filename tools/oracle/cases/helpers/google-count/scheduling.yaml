kind: helper
name: google-count-scheduling
call:
  google_count:
    calls:
      - model: gemini-2.0-flash
        contents:
          - role: user
            parts:
              - functionResponse:
                  willContinue: true
                  scheduling: when_idle
                  name: read_many_files
                  response:
                    output: ok
          - role: user
            parts:
              - functionResponse:
                  scheduling: custom
                  name: write_file
                  response:
                    output: ok
env: {}
compare: {ignore: []}
