        id: chunk
        created: 9
        object: chat.completion.chunk
        choices:
          - index: 0
            delta: {content: a, provider_specific_fields: {keep: x}}
  - vector_stores:
      operation: streaming
      request_data: {}
      response:
        id: chunk
        created: 9
        object: chat.completion.chunk
        choices:
          - index: 0
            delta: {content: a, provider_specific_fields: {keep: x}}
env: {}
compare: {ignore: []}
