kind: helper
name: streaming-retrieval-fields
call:
  vector_stores:
    operation: streaming
    request_data:
      search_results: [{object: vector_store.search_results.page, search_query: q, data: []}]
      vector_store_search_failures: [{vector_store_id: vs_a, custom_llm_provider: openai, error: failed}]
    response:
      id: chunk
      created: 9
      object: chat.completion.chunk
      choices:
        - index: 0
          delta: {content: a, provider_specific_fields: {keep: x}}
        - index: 1
          delta: {content: b}
