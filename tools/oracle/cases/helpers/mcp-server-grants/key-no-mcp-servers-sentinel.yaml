# A key that lists no-mcp-servers reaches no server, even next to a named server, a group, a tool grant,
# a toolset and a unified access group; the same key without the literal reaches all of them.
kind: helper
name: mcp-server-grants-key-no-mcp-servers-sentinel
call:
  b4669:
    function: key
    servers:
      - {server_id: srv-gh, name: github, alias: gh, server_name: null, transport: http, access_groups: [grp-1]}
      - {server_id: srv-extra, name: extra, alias: null, server_name: null, transport: http, access_groups: null}
    access_groups:
      - {access_group_id: ag-1, access_mcp_server_ids: [srv-extra]}
    toolset_grants: {srv-toolset: [list]}
    permission:
      object_permission_id: op-case
      mcp_servers: [gh, no-mcp-servers]
      mcp_access_groups: [grp-1]
      mcp_tool_permissions: {gh: [read]}
      mcp_toolsets: [ts-1]
    access_group_ids: [ag-1]
calls:
  - b4669:
      function: key
      servers:
        - {server_id: srv-gh, name: github, alias: gh, server_name: null, transport: http, access_groups: [grp-1]}
      access_groups: []
      toolset_grants: {}
      permission: {object_permission_id: op-case, mcp_servers: [no-mcp-servers], mcp_access_groups: null, mcp_tool_permissions: null, mcp_toolsets: null}
      access_group_ids: []
  - b4669:
      function: key
      servers:
        - {server_id: srv-gh, name: github, alias: gh, server_name: null, transport: http, access_groups: [grp-1]}
        - {server_id: srv-extra, name: extra, alias: null, server_name: null, transport: http, access_groups: null}
      access_groups:
        - {access_group_id: ag-1, access_mcp_server_ids: [srv-extra]}
      toolset_grants: {srv-toolset: [list]}
      permission:
        object_permission_id: op-case
        mcp_servers: [gh]
        mcp_access_groups: [grp-1]
        mcp_tool_permissions: {gh: [read]}
        mcp_toolsets: [ts-1]
      access_group_ids: [ag-1]
env: {}
compare: {ignore: []}
