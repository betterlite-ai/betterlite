kind: helper
name: a2a-chat-request-stream
call:
  b8100:
    op: request
    cases:
      - model: my-agent
        api_base: http://a2a.test/
        api_key: null
        headers: {}
        non_default_params: {stream: true}
        optional_params: {}
      - model: my-agent
        api_base: http://a2a.test
        api_key: sk-2
        headers: {X-Extra: kept}
        non_default_params: {stream: true}
        optional_params: {temperature: 0.3}
env: {}
compare:
  ignore:
    - {pointer: /value/cases/0/body/id, why: transform_request draws a fresh uuid4}
    - {pointer: /value/cases/0/body/params/message/messageId, why: transform_request draws a fresh uuid4}
    - {pointer: /value/cases/1/body/id, why: transform_request draws a fresh uuid4}
    - {pointer: /value/cases/1/body/params/message/messageId, why: transform_request draws a fresh uuid4}
