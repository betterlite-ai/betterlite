kind: helper
name: bulk_add_selection_and_results
call:
  team_request_contracts:
    operation: bulk_add
    document: {"team_id": "t"}
calls:
  - team_request_contracts: {operation: bulk_add, document: {"team_id": "t", "members": [{"user_id": "a", "role": "admin"}], "all_users": false}}
  - team_request_contracts: {operation: bulk_add, document: {"team_id": "t", "members": [{"user_id": "a", "user_email": "e@x", "role": "user"}], "all_users": null, "max_budget_in_team": 2.5}}
  - team_request_contracts: {operation: bulk_add, document: {"team_id": "t", "all_users": true, "members": null}}
  - team_request_contracts: {operation: bulk_add, document: {"team_id": "t", "members": [{"role": "user"}]}}
  - team_request_contracts: {operation: bulk_add, document: {}}
  - team_request_contracts: {operation: bulk_add_response, document: {"team_id": "t", "results": [{"success": true}, {"user_id": "u", "success": false, "error": "boom"}], "total_requested": 2, "successful_additions": 1, "failed_additions": 1}}
  - team_request_contracts: {operation: bulk_add_response, document: {"team_id": "t", "results": [{"user_id": "u", "success": true, "updated_user": {"k": 1}, "updated_team_membership": {"m": 2}}], "total_requested": 1, "successful_additions": 1, "failed_additions": 0, "updated_team": {"team_alias": "x"}}}
env: {}
compare: {ignore: []}
