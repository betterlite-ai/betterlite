kind: helper
name: permission_selection_and_defaults
call:
  team_request_contracts:
    operation: bulk_permissions
    document: {"permissions": ["/key/generate"]}
calls:
  - team_request_contracts: {operation: bulk_permissions, document: {"permissions": [], "team_ids": ["t1"], "apply_to_all_teams": true}}
  - team_request_contracts: {operation: bulk_permissions, document: {"permissions": ["/key/generate"], "team_ids": ["t1"], "apply_to_all_teams": true}}
  - team_request_contracts: {operation: bulk_permissions, document: {"permissions": ["key/generate"]}}
  - team_request_contracts: {operation: bulk_permissions, document: {"permissions": "/key/generate"}}
  - team_request_contracts: {operation: bulk_permissions, document: {}}
  - team_request_contracts: {operation: bulk_permissions, document: {"permissions": ["/key/generate"], "apply_to_all_teams": null}}
  - team_request_contracts: {operation: permission_get, document: {"team_id": "t"}}
env: {}
compare: {ignore: []}
