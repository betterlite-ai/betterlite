kind: helper
name: logging-success-preserves-exception-marker
call:
  b3722:
    bedrock_decisions:
      log_success:
        response:
          Output:
            __type: ValidationException
          outputs:
            - text: masked
          usage:
            topicPolicyUnits: 1
        request_data:
          model: gpt-4o
        guardrail:
          name: gr-name
          identifier: null
          version: null
          disable_exception_on_block: false
env: {}
compare:
  ignore:
    - pointer: /value/metadata/standard_logging_guardrail_information/0/end_time
      why: the log records the wall clock when it runs, which no two runs share
    - pointer: /value/metadata/standard_logging_guardrail_information/0/duration
      why: the duration is measured from the same wall clock
