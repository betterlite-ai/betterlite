kind: helper
name: logging-attempt-sums-chunk-usage
call:
  b3722:
    bedrock_decisions:
      log_attempt:
        response:
          action: GUARDRAIL_INTERVENED
          usage:
            topicPolicyUnits: 2
          assessments:
            - topicPolicy:
                topics:
                  - name: finance
                    action: BLOCKED
        status_code: 200
        body: '{"action": "GUARDRAIL_INTERVENED", "usage": {"topicPolicyUnits": 2}, "assessments": [{"topicPolicy": {"topics": [{"name": "finance", "action": "BLOCKED"}]}}]}'
        completed_chunk_usages:
          - topicPolicyUnits: 1
        request_data:
          model: gpt-4o
        guardrail:
          name: gr-name
          identifier: gr-1
          version: "3"
          disable_exception_on_block: false
env: {}
compare:
  ignore:
    - pointer: /value/metadata/standard_logging_guardrail_information/0/end_time
      why: the log records the wall clock when it runs, which no two runs share
    - pointer: /value/metadata/standard_logging_guardrail_information/0/duration
      why: the duration is measured from the same wall clock
