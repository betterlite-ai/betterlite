kind: helper
name: deepseek-request-policy-mixed-tools-and-dangling-choice
call:
  deepseek_request_policy:
    op: request
    cases:
      - model: deepseek-reasoner
        supports_vision: false
        supports_reasoning: true
        messages: []
        optional_params:
          thinking: {type: enabled}
          tools:
            - {type: function, function: {name: lookup}}
            - {type: namespace, name: ns}
          tool_choice: {type: function, function: {name: lookup}}
          parallel_tool_calls: true
          temperature: 0.2
      - model: deepseek-reasoner
        supports_vision: false
        supports_reasoning: true
        messages: []
        optional_params:
          thinking: {type: enabled}
          tools:
            - {type: function, function: {name: lookup}}
            - {type: namespace}
          tool_choice: {type: function, function: {name: dropped}}
      - model: deepseek-reasoner
        supports_vision: false
        supports_reasoning: true
        messages: []
        optional_params:
          thinking: {type: enabled}
          tools:
            - {type: namespace}
            - {type: web_search, name: search}
          tool_choice: auto
          parallel_tool_calls: true
          temperature: 0.2
      - model: deepseek-reasoner
        supports_vision: false
        supports_reasoning: true
        messages: []
        optional_params:
          thinking: {type: enabled}
          tools:
            - {type: function, function: {name: lookup}}
            - {type: namespace}
          tool_choice: auto
env: {}
compare:
  ignore: []
