kind: helper
name: petals-reply
call:
  b8153:
    op: petals_reply
    replies:
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "hello"}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "hello"}', status: 201, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "café ☕"}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "hello", "other": 1}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": ""}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": null}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": 5}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: "not json", status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: "[1, 2]", status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"error": "bad request"}', status: 400, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: "not found body", status: 404, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: "boom", status: 500, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "hello"}', status: 302, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: "", status: 204, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "tiiuae/falcon-7b", body: '{"outputs": "hello"}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
env: {HF_HUB_OFFLINE: "1"}
compare:
  ignore:
    - pointer: /value/replies/0/created
      why: LiteLLM stamps int(time.time()), betterlite takes the caller's clock
    - pointer: /value/replies/1/created
      why: LiteLLM stamps int(time.time()), betterlite takes the caller's clock
    - pointer: /value/replies/2/created
      why: LiteLLM stamps int(time.time()), betterlite takes the caller's clock
    - pointer: /value/replies/3/created
      why: LiteLLM stamps int(time.time()), betterlite takes the caller's clock
