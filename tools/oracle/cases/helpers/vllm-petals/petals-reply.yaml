kind: helper
name: petals-reply
call:
  b8153:
    op: petals_reply
    replies:
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "hello"}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "hello"}', status: 201, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "café ☕"}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": "hello", "other": 1}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": ""}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": null}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
      - {model: "meta-llama/llama-2-7b-chat", body: '{"outputs": 5}', status: 200, headers: {}, messages: [{role: "user", content: "hi"}]}
