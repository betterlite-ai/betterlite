kind: helper
name: model-grant-intersection-lookup-and-stamp-errors
call:
  # a missing team row is the HTTP 404 the auth path already raises
  model_grant_intersection:
    function: enforced
    database: true
    token: {models: [gpt-4o], team_id: t9, user_id: u1}
    team: {team_id: t1, models: [tier-a]}
calls:
  # an unreadable team table carries the same 404
  - model_grant_intersection:
      function: enforced
      database: true
      token: {models: [gpt-4o], team_id: t1, user_id: u1}
      outages: [team]
  # an unreadable user table escapes instead, since only UserNotFound is suppressed
  - model_grant_intersection:
      function: enforced
      database: true
      token: {models: [gpt-4o], user_id: u1}
      outages: [user]
  # an unreadable project table escapes after the user row answered
  - model_grant_intersection:
      function: enforced
      database: true
      token: {models: [gpt-4o], user_id: u1, project_id: p1}
      user: {user_id: u1, models: [user-model]}
      outages: [project]
  # an unreadable membership table escapes after the team answered
  - model_grant_intersection:
      function: enforced
      database: true
      token: {models: [gpt-4o], team_id: t1, user_id: u1}
      team: {team_id: t1, models: [tier-a]}
      outages: [membership]
  # a project row the request does not name yields an empty list, not a failure
  - model_grant_intersection:
      function: enforced
      database: true
      token: {models: [gpt-4o], team_id: t1, project_id: p2}
      team: {team_id: t1, models: [tier-a]}
      project: {project_id: p1, models: [proj-model]}
  # an unreadable router escapes the collection
  - model_grant_intersection:
      function: collected
      database: true
      token: {models: [gpt-4o], team_id: t1}
      models: [gpt-4o]
      team: {team_id: t1, models: [tier-a]}
      registry: [tier-a]
      outages: [serving]
  # an unreadable organization is swallowed and attributes nothing
  - model_grant_intersection:
      function: collected
      database: true
      token: {models: [gpt-4o], team_id: t1}
      models: [gpt-4o]
      team: {team_id: t1, models: [tier-a], organization_id: o1}
      org: {organization_id: o1, models: [tier-b]}
      registry: [tier-a]
      serving: {gpt-4o: [tier-a]}
      outages: [org]
  # an unreadable registry is also swallowed, leaving every covering group budgeted
  - model_grant_intersection:
      function: collected
      database: true
      token: {models: [gpt-4o], team_id: t1}
      models: [gpt-4o]
      team: {team_id: t1, models: [tier-a, tier-b]}
      serving: {gpt-4o: [tier-a, tier-b]}
  # the stamp swallows the same router failure and leaves the earlier stamp alone
  - model_grant_intersection:
      function: stamped
      database: true
      token: {models: [gpt-4o], team_id: t1}
      models: [gpt-4o]
      stamp_before: [old]
      team: {team_id: t1, models: [tier-a]}
      registry: [tier-a]
      outages: [serving]
env: {}
compare: {ignore: []}
