kind: helper
name: free-seconds-and-images-suppress-token-cost
call:
  modality_cost:
    operation: prompt
    prompt_tokens: 100
    text_tokens: 20
    audio_tokens: 10
    image_tokens: 5
    audio_length_seconds: "2.5"
    image_count: 3
    model_info:
      input_cost_per_audio_per_second: "0"
      input_cost_per_image: "0"
      input_cost_per_audio_token: "0.01"
      input_cost_per_image_token: "0.02"
    prompt_base_cost: "0.00001"
    cache_read_cost: "0"
    cache_creation_cost: "0"
    cache_creation_cost_above_1hr: "0"
compare: {ignore: []}
env: {}
