kind: helper
name: login-throttle-ttl-precedence-and-rounding
call:
  login_throttle:
    config:
      general_settings:
        max_failed_login_attempts_per_source: 4
    phases:
      - request: {peer: "10.1.1.1"}
        now: 1000.5
        steps:
          - {kind: attempt, username: bob}
          - {kind: failed}
          - {kind: attempt, username: bob}
          - {kind: failed}
          - {kind: attempt, username: bob}
          - {kind: failed}
      - request: {peer: "10.1.1.1"}
        now: 1300.4
        steps:
          - {kind: attempt, username: bob}
      - request: {peer: "10.1.1.1"}
        now: 1300.5
        steps:
          - {kind: attempt, username: bob}
env: {}
compare: {ignore: []}
