kind: helper
name: login-throttle-key-literals-and-unicode
call:
  login_throttle:
    config:
      general_settings:
        max_failed_login_attempts_per_source: 4
    phases:
      - request: {peer: "10.1.1.1"}
        now: 1000.0
        steps:
          - {kind: attempt, username: "Straße"}
          - {kind: failed}
          - {kind: attempt, username: "Straße"}
          - {kind: failed}
          - {kind: attempt, username: "Straße"}
          - {kind: failed}
      - request: {peer: "10.1.1.1"}
        now: 1010.0
        steps:
          - {kind: attempt, username: "STRASSE"}
      - request: {peer: "10.1.1.1"}
        now: 1010.0
        steps:
          - {kind: attempt, username: "Straße "}
env: {}
compare: {ignore: []}
