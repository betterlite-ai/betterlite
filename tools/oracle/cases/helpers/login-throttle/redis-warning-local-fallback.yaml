kind: helper
name: login-throttle-redis-warning-local-fallback
call:
  login_throttle:
    config:
      general_settings: {}
    redis:
      faults:
        record_failure: unavailable
    phases:
      - request: {peer: "10.1.1.1"}
        now: 1000.0
        steps:
          - {kind: attempt, username: bob}
          - {kind: failed}
          - {kind: attempt, username: bob}
env: {}
compare: {ignore: []}
