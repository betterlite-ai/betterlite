kind: helper
name: login-throttle-redis-and-local-window-difference
call:
  login_throttle:
    config:
      general_settings:
        max_failed_login_attempts_per_source: 4
    redis: {}
    phases:
      - request: {peer: "10.1.1.1"}
        now: 1000.0
        steps:
          - {kind: attempt, username: bob}
          - {kind: failed}
          - {kind: attempt, username: bob}
          - {kind: failed}
          - {kind: attempt, username: bob}
          - {kind: failed}
      - request: {peer: "10.1.1.1"}
        now: 1061.0
        steps:
          - {kind: attempt, username: bob}
      - request: {peer: "10.1.1.1"}
        now: 1301.0
        steps:
          - {kind: attempt, username: bob}
          - {kind: failed}
env: {}
compare: {ignore: []}
