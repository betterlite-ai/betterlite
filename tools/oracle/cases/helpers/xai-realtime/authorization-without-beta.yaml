kind: helper
name: xai-realtime-authorization-without-beta
call:
  xai_realtime:
    kind: connection
    events: []
    sessions: []
    model: grok-4-1-fast-non-reasoning
    api_key: sk-xai-realtime-1234567890
    scope_headers: [["OpenAI-Beta", "realtime=v1"], ["x-extra", "1"]]
    max_message_size_bytes: 1048576
env:
  REALTIME_WEBSOCKET_MAX_MESSAGE_SIZE_BYTES: "1048576"
compare: {ignore: []}
