kind: helper
name: cost-recording-tiered-only-entry-diagnostic
call:
  cost_recording:
    function: record
    model_cost:
      dashscope/qwen-flash:
        litellm_provider: dashscope
        mode: chat
        tiered_pricing:
          - input_cost_per_token: 0.0000001
            output_cost_per_token: 0.0000004
            range: [0, 1000000]
          - input_cost_per_token: 0.0000002
            output_cost_per_token: 0.0000008
            range: [1000000, 2000000]
    vertex_location: null
    ptu_cost_attribution: false
    logs:
      - log:
          model: dashscope/qwen-flash
          call_type: completion
          litellm_params: {metadata: null, litellm_metadata: null}
          optional_params: {}
          details: {custom_llm_provider: dashscope}
        calls:
          - response:
              kind: typed
              model: dashscope/qwen-flash
              usage: {prompt_tokens: 10, completion_tokens: 5, total_tokens: 15}
              hidden_params: {additional_headers: {}}
              background: false
            calculator: {cost: null, error: null}
            litellm_model_name: null
            router_model_id: null
          - response:
              kind: typed
              model: dashscope/qwen-flash
              usage: {prompt_tokens: 10, completion_tokens: 5, total_tokens: 15}
              hidden_params: {additional_headers: {}}
              background: false
            calculator: {cost: null, error: boom}
            litellm_model_name: null
            router_model_id: null
    hidden_params: null
    cost: null
env: {}
compare:
  ignore:
    - pointer: /value/logs/0/calls/1/failure/error_str
      why: betterlite reports the calculator error it was given
    - pointer: /value/logs/0/calls/1/failure/traceback_str
      why: a Python traceback has no Rust equivalent
