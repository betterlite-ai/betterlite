kind: helper
name: vertex-gemini-images-flat-over-nested
call:
  vertex_gemini_images:
    model: gemini-2.5-flash-image
    mappings:
      - prompt: a red fox
        non_default_params:
          imageConfig: {aspectRatio: "9:16", imageSize: 2K}
          aspectRatio: "16:9"
          n: 2
        optional_params: {}
    target: null
    response: null
env: {}
compare: {ignore: []}
