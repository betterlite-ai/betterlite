kind: helper
name: vertex-gemini-images-search-without-usage
call:
  vertex_gemini_images:
    model: gemini-2.5-flash-image
    mappings: []
    target: null
    response:
      candidates:
        - groundingMetadata: {webSearchQueries: [a, b]}
        - groundingMetadata:
            - webSearchQueries: [b]
        - content:
            parts:
              - inlineData: {data: AAA}
env: {}
compare: {ignore: []}
