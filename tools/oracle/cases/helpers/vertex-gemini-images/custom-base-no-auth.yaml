kind: helper
name: vertex-gemini-images-custom-base-no-auth
call:
  vertex_gemini_images:
    model: gemini-2.5-flash-image
    mappings:
      - prompt: a red fox
        non_default_params: {size: 1792x1024}
        optional_params: {}
    target:
      api_base: https://proxy.example/v1beta///
      params_api_base: null
      project: proj
      location: us-central1
      headers: {x-goog-user-project: billing}
    response: null
env: {}
compare: {ignore: []}
