      - {model: langgraph/agent, status: 200, body: '{"messages": [{"type": "ai", "content": "top"}], "values": {"messages": [{"type": "ai", "content": "inner"}]}}'}
      - {model: langgraph/agent, status: 200, body: '{"messages": [{"type": "ai", "content": "older"}, {"type": "ai"}]}'}
      - {model: langgraph/agent, status: 200, body: '{"messages": [{"type": "ai", "content": "older"}, {"type": "ai", "content": ""}]}'}
