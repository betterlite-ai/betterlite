kind: helper
name: jwt-keys-http-error-no-transport-retry
call:
  jwt_keys:
    scenarios:
      # a non-200 answer is one request and a bare 401, never a retry or the 503
      - settings: {public_key_url: "https://idp.example.com/jwks", public_key_ttl: 600.0, public_key_stale_ttl: 3600.0}
        steps:
          - now: 1000.0
            kid: a
            http:
              - {kind: answer, status: 503, body: busy}
      # the discovery document gets the same status handling
      - settings: {public_key_url: "https://idp.example.com/.well-known/openid-configuration", public_key_ttl: 600.0, public_key_stale_ttl: 3600.0}
        steps:
          - now: 1000.0
            kid: a
            http:
              - {kind: answer, status: 404, body: not-found}
env: {}
compare: {ignore: []}
