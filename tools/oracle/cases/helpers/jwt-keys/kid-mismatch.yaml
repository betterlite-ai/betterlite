kind: helper
name: jwt-keys-kid-mismatch
call:
  jwt_keys:
    scenarios:
      - settings: {public_key_url: "https://idp.example.com/jwks", public_key_ttl: 600.0, public_key_stale_ttl: 3600.0}
        steps:
          # a 200 with no matching kid is a key failure, and the fetched document was still cached
          - now: 1000.0
            kid: missing
            http:
              - {kind: answer, status: 200, body: '{"keys":[{"kid":"a","kty":"RSA","n":"one"}]}'}
          # a miss never refreshes the fresh cache: another kid is served without a request
          - now: 1000.0
            kid: a
          - now: 1000.0
            kid: missing
env: {}
compare: {ignore: []}
