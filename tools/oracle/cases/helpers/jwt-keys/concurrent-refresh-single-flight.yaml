kind: helper
name: jwt-keys-concurrent-refresh-single-flight
call:
  jwt_keys:
    scenarios:
      - settings: {public_key_url: "https://idp.example.com/jwks", public_key_ttl: 600.0, public_key_stale_ttl: 3600.0}
        steps:
          # two lookups enter the miss together, so the per-key lock's recheck keeps it to one fetch
          - now: 1000.0
            kid: a
            concurrent: true
            http:
              - {kind: answer, status: 200, body: '{"keys":[{"kid":"a","kty":"RSA","n":"one"}]}'}
env: {}
compare: {ignore: []}
