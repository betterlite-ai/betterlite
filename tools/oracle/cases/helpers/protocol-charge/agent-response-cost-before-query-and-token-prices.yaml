kind: helper
name: agent-response-cost-before-query-and-token-prices
call:
  protocol_charge:
    function: a2a
    a2a:
      response_cost: 0.25
      cost_per_query: 0.5
      input_cost_per_token: 0.001
      output_cost_per_token: 0.002
      usage: tokens
      prompt_tokens: 100
      completion_tokens: 50
env: {}
compare: {ignore: []}
