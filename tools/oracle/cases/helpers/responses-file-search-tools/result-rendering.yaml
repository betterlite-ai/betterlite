kind: helper
name: responses-file-search-result-rendering
call:
  responses_file_search_tools:
    function: result_rendering
    results:
      - file_id: file_1
        filename: report.txt
        score: 0.87654
        content:
          - {type: text, text: hello}
          - {text: world}
      - file_id: file_2
        filename: ""
        score: 0
        content:
          - {text: ""}
          - {text: kept}
          - {}
