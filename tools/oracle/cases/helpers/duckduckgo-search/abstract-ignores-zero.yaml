kind: helper
name: duckduckgo-search-abstract-ignores-zero
call:
  duckduckgo_search:
    environment: {}
    calls:
      - kind: reply
        query: zero
        optional_params: {max_results: 0}
        body: '{"AbstractURL":"https://abstract.test","AbstractText":"An instant answer.","Heading":"Instant Answer","RelatedTopics":[{"Text":"first - one","FirstURL":"https://one.test"}]}'
      - kind: reply
        query: negative
        optional_params: {max_results: -3}
        body: '{"AbstractText":"Only the text.","AbstractURL":"https://abstract.test","RelatedTopics":[{"Text":"never - none","FirstURL":"https://none.test"}]}'
env: {}
compare: {ignore: []}
