  duckduckgo_search:
    environment: {}
    calls:
      - kind: reply
        query: nested
        optional_params: {max_results: 2}
        body: '{"RelatedTopics":[{"Name":"Group","Topics":[{"Text":"alpha - first","FirstURL":"https://alpha.test"},{"Text":"beta - second","FirstURL":"https://beta.test"}]},{"Text":"gamma - third","FirstURL":"https://gamma.test"}]}'
      - kind: reply
        query: nested
        optional_params: {max_results: 3}
        body: '{"RelatedTopics":[{"Name":"Group","Topics":[{"Text":"alpha - first","FirstURL":"https://alpha.test"},{"Text":"beta - second","FirstURL":"https://beta.test"}]},{"Text":"gamma - third","FirstURL":"https://gamma.test"}]}'
      - kind: reply
        query: nested
        optional_params: {}
        body: '{"RelatedTopics":[{"Name":"Group","Topics":[{"Text":"alpha - first","FirstURL":"https://alpha.test"},{"Text":"beta - second","FirstURL":"https://beta.test"}]},{"Text":"gamma - third","FirstURL":"https://gamma.test"}]}'
env: {}
compare: {ignore: []}
