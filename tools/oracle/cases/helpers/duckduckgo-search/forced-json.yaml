kind: helper
name: duckduckgo-search-forced-json
call:
  duckduckgo_search:
    environment: {}
    calls:
      - kind: headers
        headers: {Content-Type: text/plain, X-Trace: "7"}
      - kind: request
        query: [red panda, habitat]
        optional_params:
          format: xml
          max_results: 2
          pretty: 1
          country: us
          search_domain_filter: [example.com]
          max_tokens_per_page: 50
          unrelated: ignored
      - kind: url
        api_base: null
        query: red panda
        optional_params: {format: xml}
env: {}
compare: {ignore: []}
