kind: helper
name: vault-auth-login-body-malformed
env: {}
compare: {ignore: []}
call:
  b4416:
    env:
      HCP_VAULT_APPROLE_ROLE_ID: role-id
      HCP_VAULT_APPROLE_SECRET_ID: secret-id
    routes:
      - route: "POST http://127.0.0.1:8200/v1/auth/approle/login"
        replies:
          - {status: 200, body: '{"auth":{}}'}
          - {status: 200, body: "not a login response"}
    steps:
      - {op: token}
      - {op: token}
