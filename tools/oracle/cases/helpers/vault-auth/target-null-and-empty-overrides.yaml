        name: DB_PASSWORD
        params: {namespace: "", mount: "", path_prefix: "", data: ""}
      - op: target
        name: DB_PASSWORD
        params: {namespace: " / ", mount: " // ", path_prefix: " / "}
      - {op: target, name: DB_PASSWORD}
      - op: target
        name: DB_PASSWORD
        params: null
