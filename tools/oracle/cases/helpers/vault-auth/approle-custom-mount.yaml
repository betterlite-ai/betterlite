kind: helper
name: vault-auth-approle-custom-mount
env: {}
compare: {ignore: []}
call:
  b4416:
    env:
      HCP_VAULT_APPROLE_ROLE_ID: role-id
      HCP_VAULT_APPROLE_SECRET_ID: secret-id
      HCP_VAULT_APPROLE_MOUNT_PATH: custom-approle
      HCP_VAULT_NAMESPACE: admin
    routes:
      - route: "POST http://127.0.0.1:8200/v1/auth/custom-approle/login"
        replies:
          - {status: 200, body: '{"auth":{"client_token":"hvs.approle","lease_duration":3600}}'}
    steps:
      - {op: namespaces}
      - {op: token}
      - {op: token}
      - {op: target, name: OPENAI_API_KEY}
