kind: helper
name: vault-auth-tls-null-role
env: {}
compare: {ignore: []}
call:
  b4416:
    env:
      HCP_VAULT_CLIENT_CERT: /certs/client.crt
      HCP_VAULT_CLIENT_KEY: /certs/client.key
    routes:
      - route: "POST http://127.0.0.1:8200/v1/auth/cert/login"
        replies:
          - {status: 200, body: '{"auth":{"client_token":"hvs.tls-null-role","lease_duration":60}}'}
    steps:
      - {op: token}
