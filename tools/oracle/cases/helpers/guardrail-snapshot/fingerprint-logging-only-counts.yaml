kind: helper
name: guardrail-snapshot-fingerprint-logging-only-counts
call:
  b9999:
    function: fingerprints_match
    first:
      standard_logging_guardrail_information:
        - guardrail_mode: pre_call
          guardrail_name: pii
    second:
      standard_logging_guardrail_information:
        - guardrail_mode: pre_call
          guardrail_name: pii
        - guardrail_mode: logging_only
          guardrail_name: audit
env: {}
compare: {ignore: []}
