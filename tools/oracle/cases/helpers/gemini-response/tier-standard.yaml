kind: helper
name: gemini-response-tier-standard
call:
  gemini_response:
    model: gemini-2.5-flash
    legacy_function: false
    now: 1700000000
    generated_id: 0123456789abcdef0123456789abcdef
    headers:
      X-Gemini-Service-Tier: STANDARD
    body:
      candidates:
        - content:
            parts:
              - text: tiered answer
          finishReason: STOP
      usageMetadata:
        promptTokenCount: 2
        candidatesTokenCount: 1
        totalTokenCount: 3
env: {}
compare: {ignore: []}
