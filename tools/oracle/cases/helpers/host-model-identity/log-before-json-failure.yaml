kind: helper
name: log-before-json-failure
call:
  host_model_identity:
    steps:
      - kind: reply
        host: clarifai
        status: 400
        body: not json at all
        headers: {x-request-id: req-1, x-trace: trace-1}
        model: user.app.model
        messages: [{role: user, content: hello}]
        api_key: request-key
        request_data: {model: user.app.model, messages: []}
      - kind: reply
        host: compactifai
        status: 502
        body: '{"choices": [}'
        model: user.app.model
        messages: [{role: user, content: hello}]
        request_data: {model: user.app.model}
      - kind: error_class
        host: clarifai
        status: 429
        message: rate limited
        headers: {x-request-id: req-2}
      - kind: error_class
        host: compactifai
        status: 422
        message: invalid params
        headers: {x-trace: trace-2}
compare: {ignore: []}
env: {}
