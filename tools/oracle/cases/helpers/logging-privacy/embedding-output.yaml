kind: helper
name: logging-privacy-embedding-output
call:
  logging_privacy:
    global: true
    dynamic: null
    headers: {}
    payload:
      messages:
        - role: user
          content: hidden
      prompt: hidden
      response:
        choices:
          - message:
              content: hidden
    key_info:
      user_api_key_hash: hidden
      team: team-a
    redact_key_info: true
env: {}
compare: {ignore: []}
