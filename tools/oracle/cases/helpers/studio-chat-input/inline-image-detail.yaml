kind: helper
name: studio-chat-input-inline-image-detail
call:
  studio_chat_input:
    steps:
      - op: messages
        model: gemini-3-pro-preview
        messages:
          - role: user
            content:
              - {type: text, text: what is this}
              - type: image_url
                image_url: {url: "data:image/png;base64,YWJj", detail: high}
env: {}
compare: {ignore: []}
