kind: helper
name: json-native-api-policy-messages-auth-casing-and-beta
call:
  json_native_api_policy:
    calls:
      - kind: generic_messages_headers
        model: anthropic/probe-model
        environment: {}
        api_key: sk-generic
        headers: {x-custom: "1", Anthropic-Version: "2024-01-01"}
        optional_params: {speed: fast}
        messages: []
      - kind: generic_messages_headers
        model: anthropic/probe-model
        environment: {}
        api_key: sk-generic
        headers: {Authorization: "Bearer caller"}
        optional_params: {}
        messages: []
      - kind: generic_messages_headers
        model: anthropic/probe-model
        environment: {}
        headers: {anthropic-beta: prompt-caching-2024-07-31}
        optional_params: {speed: fast}
        messages: []
      - kind: json_messages_headers
        model: empiriolabs/probe-model
        environment: {PROBE_KEY: sk-env}
        descriptor:
          base_url: "https://descriptor.invalid/v1"
          api_key_env: PROBE_KEY
        headers: {}
        optional_params: {}
        messages: []
      - kind: json_messages_headers
        model: aihubmix/probe-model
        environment: {}
        descriptor:
          base_url: "https://descriptor.invalid/v1"
          api_key_env: PROBE_KEY
        headers: {x-api-key: caller}
        global_api_key: sk-global
        optional_params: {}
        messages: []
      - kind: json_messages_headers
        model: gmi/probe-model
        environment: {}
        descriptor:
          base_url: "https://descriptor.invalid/v1"
          api_key_env: PROBE_KEY
        headers: {}
        global_api_key: sk-global
        optional_params: {}
        messages: []
      - kind: responses_headers
        model: veniceai/any
        environment: {}
        descriptor:
          base_url: "https://responses.invalid/v1"
          api_key_env: PROBE_KEY
        api_key: sk-resp
        headers: {X-Custom: "1"}
      - kind: responses_headers
        model: xiaomi_mimo/any
        environment: {PROBE_KEY: sk-env}
        descriptor:
          base_url: "https://envkey.invalid/v1"
          api_key_env: PROBE_KEY
        headers: {}
      - kind: generic_responses_headers
        model: openai_like/any
        environment: {OPENAI_LIKE_API_KEY: sk-env}
        api_key: sk-openai-like
        headers: {X-Custom: "1"}
env: {}
compare: {ignore: []}
