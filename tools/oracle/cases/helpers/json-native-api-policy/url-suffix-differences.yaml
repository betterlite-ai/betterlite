kind: helper
name: json-native-api-policy-url-suffixes
call:
  json_native_api_policy:
    calls:
      - kind: generic_messages_url
        model: anthropic/probe-model
        environment: {}
        api_base: "https://generic.invalid/v1/"
      - kind: generic_messages_url
        model: anthropic/probe-model
        environment: {}
        api_base: "https://complete.invalid/v1/messages"
      - kind: generic_messages_url
        model: anthropic/probe-model
        environment: {}
        api_base: "https://plain.invalid/v1///"
      - kind: json_messages_url
        model: crusoe/probe-model
        environment: {PROBE_BASE: "https://env.invalid/v1"}
        descriptor:
          base_url: "https://descriptor.invalid/v1/"
          api_key_env: PROBE_KEY
          api_base_env: PROBE_BASE
      - kind: json_messages_url
        model: sail/any
        environment: {}
      - kind: responses_url
        model: llamagate/any
        environment: {}
        descriptor:
          base_url: "https://slashes.invalid/v1///"
          api_key_env: PROBE_KEY
      - kind: generic_responses_url
        model: openai_like/any
        environment: {OPENAI_LIKE_API_BASE: "https://generic-resp.invalid/v1/"}
        api_base: null
      - kind: generic_responses_url
        model: openai_like/any
        environment: {}
        api_base: "https://explicit-resp.invalid/"
env: {}
compare: {ignore: []}
