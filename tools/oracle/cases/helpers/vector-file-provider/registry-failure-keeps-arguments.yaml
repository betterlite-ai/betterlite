      vector_store_id: vs_a
      custom_llm_provider: openai
      kwargs: {api_key: caller, timeout: 7}
      registry:
        result: null
        error: {class_name: ValueError, message: store missing}
  - vector_file_provider:
      vector_store_id: vs_a
      custom_llm_provider: openai
      kwargs: {api_key: caller, timeout: 7}
      registry:
        result: null
        error: {class_name: RuntimeError, message: unavailable}
env: {}
compare: {ignore: []}
