    vector_store_id: vs_a
    custom_llm_provider: openai
    kwargs: {api_key: caller, timeout: 7}
    registry: null
calls:
  - vector_file_provider:
      vector_store_id: vs_a
      custom_llm_provider: openai
      kwargs: {api_key: caller, timeout: 7}
