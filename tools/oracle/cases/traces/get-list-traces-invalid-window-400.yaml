kind: helper
name: get-list-traces-invalid-window-400
call:
  b3867:
    request:
      method: GET
      path: /v1/traces
      query:
        start_ms: "100"
        end_ms: "200"
    auth: {user_role: proxy_admin, team_id: team-1, token: hash-1, org_id: org-1}
    tracing: true
    master_key: "sk-master"
    script:
      list_traces:
        error:
          kind: invalid_cursor
          message: "Invalid trace cursor"
env: {}
compare: {ignore: []}
