kind: helper
name: itpm_reserved
# a pretokenized embedding reserves its token count in the ITPM bucket and stores the response
call:
  b3043:
    requested_model: "text-embedding-3-small"
    call_type: "aembedding"
    tpm_reservation_scopes: []
    tpm_reservation_amount: 0
    window_size: 60
    now: 1700000000
    cache: {"{model_per_project_itpm:p1:text-embedding-3-small}:window": "1699999970", "{model_per_project_itpm:p1:text-embedding-3-small}:tokens": 100}
    parallel_slot: null
    rate_limit_response: null
    descriptors: [{"key": "model_per_project_itpm", "value": "p1:text-embedding-3-small", "rate_limit": {"requests_per_unit": null, "tokens_per_unit": 1000, "window_size": 60}}]
    data: {"model": "text-embedding-3-small", "input": [[1, 2, 3, 4, 5]], "litellm_call_id": "call-1"}
env:
  LITELLM_RATE_LIMIT_WINDOW_SIZE: "60"
compare:
  ignore: []
