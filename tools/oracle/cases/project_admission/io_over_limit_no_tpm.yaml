    descriptors: [{"key": "model_per_key", "value": "key1:text-embedding-3-small", "rate_limit": {"requests_per_unit": null, "tokens_per_unit": 10000, "window_size": 60}}, {"key": "model_per_project_itpm", "value": "p1:text-embedding-3-small", "rate_limit": {"requests_per_unit": null, "tokens_per_unit": 100, "window_size": 60}}]
    data: {"model": "text-embedding-3-small", "input": [[1, 2, 3, 4, 5]], "litellm_call_id": "call-1"}
