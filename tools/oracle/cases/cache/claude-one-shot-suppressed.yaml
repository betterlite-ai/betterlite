        params: {proxy_server_request: {headers: {User-Agent: claude-cli/2.0.1}}}
        global_enable: true
        model_cost:
          anthropic/claude-sonnet-4-5: {litellm_provider: anthropic, supports_prompt_caching: true}
          claude-sonnet-4-5: {litellm_provider: anthropic, supports_prompt_caching: true}
      - model: anthropic/claude-sonnet-4-5
        messages: [{role: user, content: hello}]
        system: "x-anthropic-billing-header: cc_is_subagent=true"
        params: {}
        global_enable: true
        model_cost:
          anthropic/claude-sonnet-4-5: {litellm_provider: anthropic, supports_prompt_caching: true}
          claude-sonnet-4-5: {litellm_provider: anthropic, supports_prompt_caching: true}
env: {}
compare: {ignore: []}
