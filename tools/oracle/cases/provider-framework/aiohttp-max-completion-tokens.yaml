name: provider-framework-aiohttp-max-completion-tokens
config: |
  model_list:
    - model_name: limited-model
      litellm_params:
        model: aiohttp_openai/gpt-upstream
        api_base: "{{upstream}}"
        api_key: configured-key
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers: {content-type: application/json, authorization: Bearer oracle-master, x-litellm-call-id: oracle-aiohttp-limit}
  body:
    model: limited-model
    messages: [{role: user, content: Say hello.}]
    max_completion_tokens: 20
upstream:
  - status: 200
    headers: {content-type: application/json}
    body:
      id: chatcmpl-aiohttp-limit
      object: chat.completion
      created: 1700000014
      model: gpt-upstream
      choices:
        - index: 0
          message: {role: assistant, content: Hello!}
          finish_reason: stop
compare:
  headers: [content-type, x-litellm-call-id, x-litellm-model-group]
  headers_present: []
  upstream_headers: [authorization, content-type]
  ignore: []
