name: cache-activity-missing-end-date
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: GET
  path: /global/activity/cache_hits?start_date=2024-01-01
  headers:
    Authorization: Bearer oracle-master
  body: null
upstream: []
database:
  seed:
    users: [{user_id: alice}]
    keys: [{token: sk-alice-token, user_id: alice}]
    teams: [{team_id: team-red}]
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore:
    - pointer: /detail/0/input
      why: betterlite's 422 envelope carries type, loc and msg like B003's other query validation answers
