name: cache-activity-no-credentials
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: GET
  path: /global/activity/cache_hits?start_date=2024-01-01&end_date=2024-01-31
  headers: {}
  body: null
upstream: []
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore:
    - pointer: /error/message
      why: betterlite writes its own message
