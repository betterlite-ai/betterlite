name: compliance-default-pre-call-success
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: POST
  path: /compliance/eu-ai-act
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body:
    request_id: req-1
    user_id: user-1
    model: gpt-4o
    timestamp: "2026-01-02T03:04:05Z"
