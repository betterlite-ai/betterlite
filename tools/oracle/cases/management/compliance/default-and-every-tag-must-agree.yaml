name: compliance-default-and-every-tag-must-agree
config: |
  general_settings:
    master_key: oracle-master
env: {}
upstream: []
steps:
  - request:
      method: POST
      path: /compliance/eu-ai-act
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        request_id: req-1
        user_id: user-1
        model: gpt-4o
        timestamp: "2026-01-02T03:04:05Z"
        guardrail_information:
          - guardrail_status: success
            guardrail_mode:
              default: pre_call
              tags: {team-a: post_call}
    compare:
      headers: [content-type]
      headers_present: []
      upstream_headers: []
      ignore: []
  - request:
      method: POST
      path: /compliance/eu-ai-act
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        request_id: req-1
        user_id: user-1
        model: gpt-4o
        timestamp: arbitrary text is still an audit value
        guardrail_information:
          - guardrail_status: success
            guardrail_mode:
              default: pre_call
              tags: {team-a: pre_call, team-b: [pre_call]}
    compare:
      headers: [content-type]
      headers_present: []
      upstream_headers: []
      ignore: []
