name: compliance-failed-pre-call-status-counts-as-intervention
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: POST
  path: /compliance/gdpr
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body:
    request_id: req-1
    user_id: user-1
    model: gpt-4o
    timestamp: "2026-01-02T03:04:05Z"
    guardrail_information:
      - guardrail_status: failed
        guardrail_mode: pre_call
      - guardrail_status: success
        guardrail_mode: pre_call
upstream: []
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: []
  ignore: []
