name: compliance-unknown-status-applied-but-not-protective
config: |
  general_settings:
    master_key: oracle-master
env: {}
request:
  method: POST
  path: /compliance/gdpr
  headers: {content-type: application/json, authorization: Bearer oracle-master}
  body:
    request_id: req-1
    user_id: user-1
    model: gpt-4o
    timestamp: "2026-01-02T03:04:05Z"
    guardrail_information:
      - guardrail_status: weird
        guardrail_mode: pre_call
      - guardrail_status: suppressed
        guardrail_mode: post_call
upstream: []
compare:
  headers: [content-type]
  headers_present: []
  upstream_headers: []
  ignore: []
