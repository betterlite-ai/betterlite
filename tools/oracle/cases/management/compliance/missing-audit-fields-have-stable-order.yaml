      method: POST
      path: /compliance/eu-ai-act
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        request_id: req-1
        user_id: user-1
        model: gpt-4o
        timestamp: "2026-01-02T03:04:05Z"
    compare:
      headers: [content-type]
      headers_present: []
      upstream_headers: []
      ignore: []
  - request:
      method: POST
      path: /compliance/eu-ai-act
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        request_id: req-1
        user_id: ""
        model: ""
        timestamp: ""
        guardrail_information:
          - guardrail_status: success
