name: unified-lifecycle-chat-pre-call-mask
config: |
  model_list:
    - model_name: guarded-model
      litellm_params:
        model: openai/guarded-upstream
        api_base: "{{upstream}}"
        api_key: oracle-key
  guardrails:
    - guardrail_name: word-filter
      litellm_params:
        guardrail: litellm_content_filter
        mode: pre_call
        default_on: true
        blocked_words:
          - keyword: forbidden
            action: MASK
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
    x-litellm-call-id: oracle-call-unified-chat-pre-mask
  body:
    model: guarded-model
    messages:
      - {role: user, content: Tell me the forbidden word.}
    stream: false
upstream:
  - status: 200
    headers: {content-type: application/json, x-request-id: upstream-request-unified-mask}
    body:
      id: chatcmpl-unified-mask
      object: chat.completion
      created: 1700000000
      model: guarded-upstream-2024
      system_fingerprint: fp_oracle
      choices:
        - index: 0
          message: {role: assistant, content: I cannot see the word., refusal: null, annotations: []}
          logprobs: null
          finish_reason: stop
      usage: {prompt_tokens: 7, completion_tokens: 6, total_tokens: 13}
compare: {headers: [content-type], headers_present: [], upstream_headers: [authorization, content-type], ignore: []}
