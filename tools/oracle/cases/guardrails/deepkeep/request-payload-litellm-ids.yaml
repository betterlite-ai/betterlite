kind: helper
name: request-payload-litellm-ids
call:
  b3767:
    apply:
      settings: {api_key: key, api_base: "https://deepkeep.test", deepkeep_firewall_id: fixed}
      inputs: {texts: [hello]}
      input_type: request
      litellm_call_id: call-1
      litellm_trace_id: trace-1
      dynamic_params: {extra_body: {region: eu}}
      answer: {status: 200, headers: {}, body: {}}
env: {}
compare:
  ignore:
    - pointer: /value/result/model
      why: "LiteLLM's _build_return_inputs never echoes model back; betterlite's Inputs carries it through for internal callers"
    - pointer: /value/request/litellm_version
      why: "LiteLLM always sends its own installed package version; betterlite forwards whatever the lifecycle hook supplies"
