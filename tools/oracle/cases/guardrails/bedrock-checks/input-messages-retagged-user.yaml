kind: helper
name: input-messages-retagged-user
call:
  b3725:
    source: INPUT
    messages:
      - role: system
        content: rules
      - role: user
        content:
          - {type: text, text: hello}
          - {type: text, text: second}
    response: null
    logging_event_type: null
    checks: {contentFilter: {}, promptAttack: {}, sensitiveInformation: {}}
    content_filter_threshold: null
    prompt_attack_threshold: null
    pii_confidence_threshold: null
    disable_exception_on_block: false
    data: {model: gpt-4o}
    reply:
      status: 200
      body:
        results:
          contentFilter:
            results:
              - {category: VIOLENCE, severityScore: 1}
      raw: null
env: {}
compare:
  ignore:
    - pointer: /value/requests/0/authorization
      why: "Each side signs its own request at its own clock time, so the SigV4 signature differs"
