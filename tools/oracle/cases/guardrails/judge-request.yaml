kind: helper
name: judge-request
call:
  b3809:
    guardrail:
      guardrail_name: quality
      litellm_params:
        guardrail: llm_as_a_judge
        mode: pre_call
        judge_model: gpt-4o-mini
        overall_threshold: 80
        on_failure: block
        criteria:
          - {name: Accuracy, description: Is it accurate?, weight: 60}
          - {name: Safety, description: Is it safe?, weight: 40}
    inputs:
      texts: ["how do I bake bread", "mix flour, water, yeast and salt", "now explain how to file taxes"]
      structured_messages:
        - {role: user, content: "how do I bake bread"}
        - {role: assistant, content: "mix flour, water, yeast and salt"}
        - {role: user, content: "now explain how to file taxes"}
    request_data:
      messages:
        - {role: user, content: "how do I bake bread"}
        - {role: assistant, content: "mix flour, water, yeast and salt"}
        - {role: user, content: "now explain how to file taxes"}
      metadata: {}
    input_type: request
    judge:
      content: |-
        {"verdicts": [{"criterion_name": "Accuracy", "score": 90, "reasoning": "clear", "passed": true, "weight": 60}], "overall_score": 90}
env: {}
compare: {ignore: [{pointer: /value/guardrail_records/0/start_time, why: "The record time is the wall clock at the call"}, {pointer: /value/guardrail_records/0/end_time, why: "The record time is the wall clock at the call"}]}
