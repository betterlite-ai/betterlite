# generic_guardrail_api gets this hook with buffer_until_moderated_default false, so nothing is buffered here: the finish chunk and the chunks after it are held as pending and released only after the final scan passes.
name: unified-stream-hook-end-of-stream-pending-release
config: |
  model_list:
    - model_name: oracle-model
      litellm_params:
        model: openai/oracle-model
        api_base: "{{upstream}}"
        api_key: oracle-key
  guardrails:
    - guardrail_name: stream-check
      litellm_params:
        guardrail: generic_guardrail_api
        mode: post_call
        default_on: true
        api_base: "{{upstream}}"
        api_key: guard-key
        streaming_end_of_stream_only: true
env: {}
request:
  method: POST
  path: /v1/chat/completions
  headers:
    content-type: application/json
    authorization: Bearer oracle-master
  body:
    model: oracle-model
    messages:
      - role: user
        content: Say hello.
    stream: true
upstream:
  - status: 200
    headers:
      content-type: text/event-stream
    events:
      - '{"id":"chatcmpl-oracle-stream","object":"chat.completion.chunk","created":1700000000,"model":"oracle-model","choices":[{"index":0,"delta":{"role":"assistant"},"finish_reason":null}]}'
      - '{"id":"chatcmpl-oracle-stream","object":"chat.completion.chunk","created":1700000000,"model":"oracle-model","choices":[{"index":0,"delta":{"content":"Hello!"},"finish_reason":null}]}'
      - '{"id":"chatcmpl-oracle-stream","object":"chat.completion.chunk","created":1700000000,"model":"oracle-model","choices":[{"index":0,"delta":{},"finish_reason":"stop"}]}'
      - '{"id":"chatcmpl-oracle-stream","object":"chat.completion.chunk","created":1700000000,"model":"oracle-model","choices":[],"usage":{"prompt_tokens":3,"completion_tokens":2,"total_tokens":5}}'
      - '[DONE]'
  - status: 200
    headers:
      content-type: application/json
    body: {action: NONE}
compare:
  headers:
    - content-type
  headers_present:
    - x-litellm-call-id
  upstream_headers:
    - content-type
  ignore:
    - {pointer: /0/id, why: LiteLLM generates a stream id for each gateway process.}
    - {pointer: /0/created, why: LiteLLM timestamps stream chunks.}
    - {pointer: /1/id, why: LiteLLM repeats its generated stream id.}
    - {pointer: /1/created, why: LiteLLM timestamps stream chunks.}
    - {pointer: /2/id, why: LiteLLM repeats its generated stream id.}
    - {pointer: /2/created, why: LiteLLM timestamps stream chunks.}
    - {pointer: /3/id, why: LiteLLM repeats its generated stream id.}
    - {pointer: /3/created, why: LiteLLM timestamps stream chunks.}
