kind: helper
name: aim-output-streaming-verified-chunks
call:
  b3750:
    function: stream
    settings: {api_key: aim-oracle-key, api_base: "http://aim.test", litellm_version: "1.105.1"}
    request_data: {messages: [{role: user, content: "hello"}]}
    key_alias: alias-1
    chunks: [{choices: [{index: 0, delta: {role: assistant}}]}, {choices: [{index: 0, delta: {content: "he"}}]}, {choices: [{index: 0, delta: {content: "llo"}}]}]
    frames: [{verified_chunk: {id: "chatcmpl-1", object: "chat.completion.chunk", choices: [{index: 0, delta: {content: "he"}}]}}, {verified_chunk: {id: "chatcmpl-1", object: "chat.completion.chunk", choices: [{index: 0, delta: {content: "llo"}}]}}, {done: true}]
env: {}
compare: {ignore: []}
