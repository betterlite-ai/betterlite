kind: helper
name: lakera-enabled-roles
call:
  b9451:
    vendor: lakera
    hook: pre_call
    gate: true
    api_key: lakera-key
    moderation_check: pre_call
    enabled_roles: [system, user]
    add_function_to_prompt: true
    data:
      messages:
        - {role: system, content: be brief}
        - {role: user, content: hello}
        - {role: assistant, content: hi there}
    answers:
      - status: 200
        headers: {}
        body: {results: [{flagged: false}]}
env: {}
compare: {ignore: []}
