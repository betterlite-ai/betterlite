kind: helper
name: qohash-extra-headers
call:
  b8212:
    settings:
      guardrail_name: qostodian_nexus
      extra_headers:
        - x-oracle-extra
        - x-qostodian-nexus-identifiers-trace
        - x-oracle-extra
    inputs: {texts: ["hello"]}
    request_data:
      headers:
        x-oracle-extra: forwarded
        x-qostodian-nexus-identifiers-trace: trace-1
        x-unlisted-header: hidden
    input_type: request
    answer: {status: 200, headers: {}, body: {action: NONE}}
env: {}
compare: {ignore: []}
