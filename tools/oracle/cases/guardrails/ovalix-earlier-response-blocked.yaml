kind: helper
name: ovalix-earlier-response-blocked
call:
  b3784:
    ovalix_call:
      env:
        OVALIX_TRACKER_API_BASE: https://tracker.example
        OVALIX_TRACKER_API_KEY: oracle-tracker-key
        OVALIX_APPLICATION_ID: app-123
        OVALIX_PRE_CHECKPOINT_ID: pre-1
        OVALIX_POST_CHECKPOINT_ID: post-1
      mode: post_call
      input_type: response
      request_data:
        litellm_metadata:
          user_api_key_user_id: user-123
      texts: ["oldest", "older", "middle", "current"]
      today: "2026-03-04"
      timeout_ms: 500
      answers:
        - {status: 200, headers: {}, body: {action_type: "none"}}
        - {status: 200, headers: {}, body: {action_type: "block", modified_data: "not a dict"}}
        - {status: 200, headers: {}, body: {action_type: "block", modified_data: ["injected"]}}
        - {status: 200, headers: {}, body: {action_type: "block", modified_data: {content: "blocked oldest"}}}
env: {}
compare: {ignore: []}
