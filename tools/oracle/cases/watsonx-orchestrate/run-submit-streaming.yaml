kind: helper
name: watsonx-run-submit-streaming
call:
  b4808:
    mode: streaming
    request_id: req-5
    params:
      message:
        parts:
          - {kind: text, text: hello}
    kwargs:
      litellm_params:
        cp4d_host: "https://cp4d.example.com"
        instance_id: inst-1
        wxo_agent_id: agent-1
        api_key: key-1
        username: bob
        auth_mode: cp4d
        thread_id: thread-1
    steps:
      - {body: {token: tok-1, expiration: 1700001000}}
      - content_type: "text/event-stream; charset=utf-8"
        lines:
          - 'data: {"last_message": {"content": [{"text": "Hi "}]}}'
          - 'data: {"last_message": {"content": [{"text": "there"}]}}'
          - "data: [DONE]"
env: {}
compare: {ignore: []}
