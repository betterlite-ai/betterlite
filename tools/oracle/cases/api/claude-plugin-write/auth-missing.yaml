name: claude-plugin-write-auth-missing
config: |
  general_settings:
    master_key: oracle-master-auth
env: {}
upstream: []
request:
  method: POST
  path: /claude-code/plugins
  headers: {content-type: application/json}
  body:
    name: auth-plugin
    source: {source: github, repo: org/auth-plugin}
compare:
  headers: []
  headers_present: []
  upstream_headers: []
  ignore:
    - {pointer: /error/message, why: betterlite's shared auth stage words the missing-key message differently}
