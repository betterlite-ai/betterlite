name: claude-plugin-write-disable-enable
config: |
  general_settings:
    master_key: oracle-master
env: {}
upstream: []
database:
  seed:
    dashboard: {logs: []}
    users: [{user_id: alice}]
    keys: [{token: sk-alice-token, user_id: alice}]
    teams: [{team_id: team-red}]
steps:
  - request:
      method: POST
      path: /claude-code/plugins
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        name: toggle-plugin
        source: {source: github, repo: org/toggle-plugin}
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugin/id, why: each peer generates its own plugin id}
  - request:
      method: POST
      path: /claude-code/plugins/toggle-plugin/disable
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
  - request:
      method: POST
      path: /claude-code/plugins/toggle-plugin/enable
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
  - request:
      method: POST
      path: /claude-code/plugins/absent-plugin/disable
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
  - request:
      method: POST
      path: /claude-code/plugins/absent-plugin/enable
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
