name: claude-plugin-write-update-source
config: |
  general_settings:
    master_key: oracle-master
env: {}
upstream: []
database:
  seed:
    dashboard: {logs: []}
    users: [{user_id: alice}]
    keys: [{token: sk-alice-token, user_id: alice}]
    teams: [{team_id: team-red}]
steps:
  - request:
      method: POST
      path: /claude-code/plugins
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        name: update-plugin
        source: {source: github, repo: org/update-plugin}
        version: "1.0.0"
        description: the first source
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugin/id, why: each peer generates its own plugin id}
  - request:
      method: PUT
      path: /claude-code/plugins/update-plugin
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        source: {source: archive, url: "https://bucket.example.com/plugin.zip", sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}
        version: "2.0.0"
        description: the replaced source
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugin/id, why: each peer generates its own plugin id}
  - request:
      method: PUT
      path: /claude-code/plugins/absent-plugin
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        source: {source: url, url: "https://github.com/org/absent-plugin.git"}
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
  - request:
      method: PUT
      path: /claude-code/plugins/update-plugin
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        source: {source: github}
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
