name: claude-plugin-read-disabled-visibility
config: |
  general_settings:
    master_key: oracle-master
env: {}
upstream: []
database:
  seed:
    dashboard: {logs: []}
steps:
  - request:
      method: POST
      path: /claude-code/plugins
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        name: read-public
        source: {source: github, repo: org/read-public}
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugin/id, why: each peer generates its own plugin id}
  - request:
      method: POST
      path: /claude-code/plugins
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        name: read-private
        source: {source: github, repo: org/read-private}
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugin/id, why: each peer generates its own plugin id}
  - request:
      method: POST
      path: /claude-code/plugins/read-private/disable
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
  - request:
      method: GET
      path: /claude-code/plugins
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugins/0/id, why: each peer generates its own plugin id}
        - {pointer: /plugins/0/created_at, why: each peer stamps the row with its own clock}
        - {pointer: /plugins/0/updated_at, why: each peer stamps the row with its own clock}
        - {pointer: /plugins/1/id, why: each peer generates its own plugin id}
        - {pointer: /plugins/1/created_at, why: each peer stamps the row with its own clock}
        - {pointer: /plugins/1/updated_at, why: each peer stamps the row with its own clock}
  - request:
      method: GET
      path: /claude-code/plugins/read-private
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /id, why: each peer generates its own plugin id}
        - {pointer: /created_at, why: each peer stamps the row with its own clock}
        - {pointer: /updated_at, why: each peer stamps the row with its own clock}
  - request:
      method: GET
      path: /claude-code/plugins?enabled_only=true
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugins/0/id, why: each peer generates its own plugin id}
        - {pointer: /plugins/0/created_at, why: each peer stamps the row with its own clock}
        - {pointer: /plugins/0/updated_at, why: each peer stamps the row with its own clock}
