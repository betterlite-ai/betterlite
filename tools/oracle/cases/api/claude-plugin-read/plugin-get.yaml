name: claude-plugin-read-get
config: |
  general_settings:
    master_key: oracle-master
env: {}
upstream: []
database:
  seed:
    dashboard: {logs: []}
steps:
  - request:
      method: POST
      path: /claude-code/plugins
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        name: read-detail
        source: {source: github, repo: org/read-detail}
        version: "2.1.0"
        description: A detailed plugin
        author: {name: Ada, email: ada@example.com}
        homepage: https://example.com/detail
        keywords: [one, two]
        category: dev
        domain: Productivity
        namespace: workflows
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugin/id, why: each peer generates its own plugin id}
  - request:
      method: POST
      path: /claude-code/plugins
      headers: {content-type: application/json, authorization: Bearer oracle-master}
      body:
        name: read-minimal
        source: {source: git-subdir, url: "https://github.com/org/repo.git", path: plugins/minimal}
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /plugin/id, why: each peer generates its own plugin id}
  - request:
      method: GET
      path: /claude-code/plugins/read-detail
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /id, why: each peer generates its own plugin id}
        - {pointer: /created_at, why: each peer stamps the row with its own clock}
        - {pointer: /updated_at, why: each peer stamps the row with its own clock}
  - request:
      method: GET
      path: /claude-code/plugins/read-minimal
      headers: {authorization: Bearer oracle-master}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore:
        - {pointer: /id, why: each peer generates its own plugin id}
        - {pointer: /created_at, why: each peer stamps the row with its own clock}
        - {pointer: /updated_at, why: each peer stamps the row with its own clock}
