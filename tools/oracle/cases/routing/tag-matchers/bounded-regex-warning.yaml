kind: probe
name: bounded-regex-warning
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - id: large
            tag_regex: [""]
          - id: steps
            tag_regex: ["(?i)(a|b|ab)*(?>c)"]
        tags: []
        header_strings: ["abababababababababababab"]
        match_any: true
compare:
  ignore: []
  expected_difference:
    - pointer: /output/tag_matchers/warnings
      reference: []
      rust: [{"kind": "pattern_too_large", "pattern": ""}, {"kind": "match_limit_exceeded", "pattern": "(?i)(a|b|ab)*(?>c)"}]
      why: betterlite bounds a configured tag pattern to 2048 bytes and a search to 100000 backtracking steps and warns once for each, while Python's re runs both without a bound
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/tag_based_routing.py#L100-L105
