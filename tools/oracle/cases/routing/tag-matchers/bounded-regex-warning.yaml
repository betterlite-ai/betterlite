kind: probe
name: bounded-regex-warning
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - id: large
            tag_regex: [""]
        tags: []
        header_strings: ["zzz"]
        match_any: true
compare:
  ignore: []
  expected_difference:
    - pointer: /output/tag_matchers/warnings
      reference: []
      rust:
        - kind: pattern_too_large
          pattern: ""
      why: betterlite bounds a configured tag pattern to 2048 bytes and warns once instead of compiling it, while Python's re has no such bound
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/tag_based_routing.py#L87-L107
