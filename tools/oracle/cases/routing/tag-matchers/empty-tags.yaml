kind: probe
name: empty-tags
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - {id: e1, tags: []}
          - {id: e2}
          - {id: e3, tags: [x]}
        tags: []
        match_any: true
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - {id: header-only, tag_regex: ["^User-Agent: claude-code/"]}
        tags: []
        header_strings: []
        match_any: false
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - {id: e1, tags: []}
          - {id: e2}
        tags: []
        match_any: false
compare: {ignore: []}
