kind: probe
name: any-versus-all
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - {id: d1, tags: [alpha, beta]}
          - {id: d2, tags: [beta, gamma]}
        tags: [beta]
        match_any: true
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - {id: d1, tags: [alpha, beta]}
          - {id: d2, tags: [beta, gamma]}
        tags: [alpha, beta]
        match_any: false
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - {id: d1, tags: [alpha, beta]}
          - {id: d2, tags: [beta, gamma]}
        tags: [alpha, gamma]
        match_any: false
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      tag_matchers:
        deployments:
          - {id: d1, tags: [alpha, beta]}
        tags: []
        match_any: true
compare: {ignore: []}
