kind: probe
name: fallback-error-details-redacted
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_observations:
        details:
          - {family: rate_limit, message: rate limited, body_param: model}
          - {family: rate_limit, message: rate limited, body_param: null}
          - {family: bad_request, message: bad input}
          - {family: bad_request, message: bad input, body_type: invalid_request_error, body_param: messages}
          - {family: budget, message: null, current_cost: "1.5", max_budget: "2.25"}
          - {family: budget, message: "", current_cost: "1.5", max_budget: "2.25"}
          - {family: budget, message: spent too much, current_cost: "12.75", max_budget: "10"}
          - {family: guardrail, message: blocked, guardrail_name: pii}
          - {family: guardrail, message: blocked, guardrail_name: null}
          - {family: json_schema, raw_response: '{"id": "x"}', json_schema: '{"type": "object"}'}
          - {family: plain, message: call failed with key sk-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
          - {family: plain, message: plain failure}
          - {family: plain, message: value failure, exception_class: value_error}
          - family: plain
            message: |-
              the fallback failed and this detail keeps growing because every level records the failure below it
