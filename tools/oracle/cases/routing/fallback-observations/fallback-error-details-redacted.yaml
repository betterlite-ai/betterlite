        no_fallback:
          - lookup_groups: [gpt-4, claude-3]
            fallbacks:
              - {gpt-4: [claude-3]}
              - {claude-3: [gpt-3.5-turbo]}
          - {lookup_groups: [gpt-4], fallbacks: []}
        outcomes:
          - {model_group: gpt-4, fallback_model_group: null, fallback_failure_detail: boom}
          - {model_group: gpt-4, fallback_model_group: [], fallback_failure_detail: boom}
          - {model_group: gpt-4, fallback_model_group: [claude-3], fallback_failure_detail: ""}
          - {model_group: gpt-4, fallback_model_group: [claude-3, 5], fallback_failure_detail: "litellm.RateLimitError: slow down"}
          - {model_group: null, fallback_model_group: null, fallback_failure_detail: ""}
compare:
  expected_difference:
    - pointer: /output/fallback_observations/details/12/info/type
      reference: ValueError
      rust: Exception
      why: betterlite keeps one family for an exception outside every known class, so it reports that family's class name where LiteLLM reports the raised class
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/add_retry_fallback_headers.py#L230
  ignore: []
