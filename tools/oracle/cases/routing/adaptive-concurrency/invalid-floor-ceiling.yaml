kind: probe
name: invalid-floor-ceiling
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      adaptive_concurrency:
        initial: 1
        floor: 0
        ceiling: 2
        steps:
          - {action: snapshot}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      adaptive_concurrency:
        initial: 1
        floor: 4
        ceiling: 3
        steps:
          - {action: snapshot}
