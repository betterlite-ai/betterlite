kind: probe
name: throttle-halves-to-floor
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      adaptive_concurrency:
        initial: 8
        floor: 2
        ceiling: 8
        steps:
          - {action: record, throttled: true}
          - {action: record, throttled: true}
          - {action: record, throttled: true}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      adaptive_concurrency:
        initial: 4
        floor: 1
        ceiling: 4
        steps:
          - {action: acquire, deadline_millis: 60000}
          - {action: acquire, deadline_millis: 60000}
          - {action: acquire, deadline_millis: 60000}
          - {action: acquire, deadline_millis: 60000}
          - {action: acquire, deadline_millis: 60000}
          - {action: record, throttled: true}
          - {action: release, id: 0}
          - {action: release, id: 1}
          - {action: release, id: 2}
          - {action: poll, id: 4}
          - {action: release, id: 3}
          - {action: release, id: 4}
