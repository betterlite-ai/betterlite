kind: probe
name: routing-state-counter-queue-full
probes:
  - clock: {unix_millis: 0, monotonic_millis: 0}
    samples: []
    operation:
      routing_state:
        env: {}
        steps:
          - {kind: pre_call, now_millis: 0, deployment_id: dep-a, model: gpt-4o, repeat: 1025}
          - {kind: tracked, now_millis: 0}
          - {kind: sync, now_millis: 0}
          - {kind: redis, now_millis: 0, key: dep-a:gpt-4o:rpm:00-00}
          - {kind: pre_call, now_millis: 60000, deployment_id: dep-a, model: gpt-4o}
          - {kind: sync, now_millis: 60000}
          - {kind: redis, now_millis: 60000, key: dep-a:gpt-4o:rpm:00-01}
          - {kind: redis, now_millis: 60000, key: dep-a:gpt-4o:rpm:00-00}
compare: {ignore: []}
