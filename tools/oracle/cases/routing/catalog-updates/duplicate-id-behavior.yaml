kind: probe
name: duplicate-id-behavior
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      catalog_updates:
        ignore_invalid_deployments: false
        steps:
          - action: set
            models:
              - {model_name: g, model: "openai/m1", id: a}
              - {model_name: h, model: "openai/m2", id: a}
              - {model_name: g, model: "openai/m3", id: b}
          - action: delete
            id: a
          - action: add
            model: {model_name: k, model: "openai/m4", id: b}
          - action: upsert
            model: {model_name: g, model: "openai/m5", id: b}
          - action: delete
            id: b
compare:
  ignore: []
