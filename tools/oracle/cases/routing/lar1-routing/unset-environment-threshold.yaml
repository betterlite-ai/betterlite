kind: probe
name: lar1-unset-environment-threshold
probes:
  - clock: {unix_millis: 1700000000125, monotonic_millis: 42002}
    samples: []
    operation:
      lar1_routing:
        model: probe-group
        deployments:
          - id: cloud-smart-1
            model: openai/cloud-smart-1
            kind: cloud-smart
          - id: local-1
            model: openai/local-1
            kind: local
          - id: deep-1
            model: openai/deep-1
            kind: deep
        routing_strategy_args: '{"confidence_threshold_low": "os.environ/LAR1_MISSING"}'
compare:
  ignore: []
  expected_difference:
    - pointer: /output/lar1_routing/selected
      reference: local-1
      rust: null
      why: LiteLLM's _coerce_threshold sees a string and keeps the declared 0.3 default, so the router
        starts and routes the default 0.5 confidence to the local tier; betterlite resolves the
        os.environ reference at load and refuses the unset variable.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5782-L5787
    - pointer: /output/lar1_routing/error
      reference: null
      rust: environment variable LAR1_MISSING for router_settings.routing_strategy_args.confidence_threshold_low is not set
      why: betterlite names the unset variable and its path in the load error; LiteLLM passes the string
        straight to the router and answers without an error.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5782-L5787
