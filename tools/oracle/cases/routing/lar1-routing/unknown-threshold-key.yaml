kind: probe
name: lar1-unknown-threshold-key
probes:
  - clock: {unix_millis: 1700000000124, monotonic_millis: 42001}
    samples: []
    operation:
      lar1_routing:
        model: probe-group
        deployments:
          - id: cloud-smart-1
            model: openai/cloud-smart-1
            kind: cloud-smart
          - id: local-1
            model: openai/local-1
            kind: local
          - id: deep-1
            model: openai/deep-1
            kind: deep
        routing_strategy_args: '{"confidence_threshold_low": 0.35, "confidence_threshold_ultra": 0.9}'
compare:
  ignore: []
  expected_difference:
    - pointer: /output/lar1_routing/selected
      reference: local-1
      rust: null
      why: LiteLLM's lar1_thresholds_from_args reads only the three keys it knows and ignores
        confidence_threshold_ultra, so the router starts with low=0.35 and routes the default 0.5
        confidence to the local tier; betterlite refuses the unknown key at config load, so no deployment
        is selected.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L33-L41
    - pointer: /output/lar1_routing/error
      reference: null
      rust: 'unsupported config keys: ["router_settings.routing_strategy_args.confidence_threshold_ultra"]'
      why: betterlite reports the refused key as a load error naming its path; the accepted LiteLLM router
        answers without an error.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L33-L41
