kind: probe
name: lar1-threshold-decimal-scale
probes:
  - clock: {unix_millis: 1700000000123, monotonic_millis: 42000}
    samples: []
    operation:
      lar1_routing:
        model: probe-group
        deployments:
          - id: cloud-smart-1
            model: openai/cloud-smart-1
            kind: cloud-smart
          - id: local-1
            model: openai/local-1
            kind: local
          - id: deep-1
            model: openai/deep-1
            kind: deep
        routing_strategy_args: '{"confidence_threshold_low": 1e-30}'
compare:
  ignore: []
  expected_difference:
    - pointer: /output/lar1_routing/selected
      reference: local-1
      rust: null
      why: LiteLLM keeps the finite 1e-30 threshold, accepts 0 < 1e-30 < 0.5 < 0.7 < 1 at startup, and
        routes the default 0.5 confidence to the local tier; betterlite parses thresholds as Decimal,
        which cannot hold 1e-30, so the config load fails and no deployment is selected.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L27-L30
    - pointer: /output/lar1_routing/error
      reference: null
      rust: invalid scalar at router_settings.routing_strategy_args.confidence_threshold_low
      why: betterlite reports the refused threshold as a load error that names its field, where the
        accepted LiteLLM router starts and answers without an error.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L27-L30
