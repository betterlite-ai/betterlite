kind: probe
name: lar1-boolean-threshold-default
probes:
  - clock: {unix_millis: 1700000000123, monotonic_millis: 42000}
    samples: []
    operation:
      lar1_routing:
        model: probe-group
        deployments:
          - id: cloud-smart-1
            model: openai/cloud-smart-1
            kind: cloud-smart
          - id: local-1
            model: openai/local-1
            kind: local
          - id: deep-1
            model: openai/deep-1
            kind: deep
        routing_strategy_args: '{"confidence_threshold_high": true}'
compare:
  ignore: []
  expected_difference:
    - pointer: /output/lar1_routing/selected
      reference: null
      rust: local-1
      why: LiteLLM's isinstance(True, int) reads the boolean as 1.0, and _normalize_thresholds refuses
        high=1.0 at startup, so no deployment is selected; betterlite keeps the declared 0.7 default,
        starts, and routes the default 0.5 confidence to the local tier.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L27-L30
    - pointer: /output/lar1_routing/error
      reference: "LAR-1 thresholds must satisfy 0 < low < medium < high < 1, got low=0.3, medium=0.5, high=1.0"
      rust: null
      why: betterlite accepts the boolean as a non-numeric argument that keeps the default and starts
        without an error, where the LiteLLM router construction fails with the normalization message.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lar1_routing.py#L56-L65
