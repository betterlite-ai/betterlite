kind: probe
name: duplicate-name-parent-last-wins
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      model_generalizations:
        rules:
          - name: base
            pattern: "^first-"
            model_info: {mode: chat}
          - name: base
            pattern: "^second-"
            model_info: {mode: embedding}
          - name: child
            pattern: "^child-"
            extends: base
            model_info: {x: 1}
        queries:
          - {query: capabilities, model: child-x}
          - {query: capabilities, model: first-x}
          - {query: capabilities, model: second-x}
compare:
  ignore: []
  expected_difference: []
