kind: probe
name: provider-first-match
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      model_generalizations:
        rules:
          - pattern: "^acme-"
            model_info: {litellm_provider: acme}
          - pattern: "acme-fast"
            model_info: {litellm_provider: later}
        queries:
          - {query: routing, model: acme-fast}
          - {query: routing, model: acme-slow}
          - {query: routing, model: other}
compare:
  ignore: []
  expected_difference: []
