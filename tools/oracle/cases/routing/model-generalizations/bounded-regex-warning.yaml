kind: probe
name: bounded-regex-warning
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      model_generalizations:
        rules:
          - pattern: ''
            model_info: {litellm_provider: big}
          - pattern: '(?i)(a|b|ab)*(?>c)'
            model_info: {litellm_provider: steps}
        queries:
          - {query: routing, model: abababababababababababab}
compare:
  ignore: []
  expected_difference:
    - pointer: /output/model_generalizations/warnings
      reference: []
      rust: [{"kind": "pattern_too_large", "pattern": ""}]
      why: betterlite skips a generalization pattern over 2048 bytes and warns, while the pinned LiteLLM compiler installs and searches it without a byte bound
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L130-L181
    - pointer: /output/model_generalizations/results/0/warnings
      reference: []
      rust: [{"kind": "match_limit_exceeded", "pattern": "(?i)(a|b|ab)*(?>c)"}]
      why: betterlite stops a generalization search after 100000 backtracking steps and warns, while Python's re has no step bound
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L130-L181
