kind: probe
name: request-scheduler-prioritization-header
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      request_scheduler:
        timeout: "1.0"
        steps:
          - {op: schedule, priority: 7, request_id: scheduled, healthy: 0}
          - {op: queue}
compare:
  ignore: []
