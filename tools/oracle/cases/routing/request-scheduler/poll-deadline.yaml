kind: probe
name: request-scheduler-poll-deadline
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      request_scheduler:
        timeout: "0.2"
        steps:
          - {op: add, priority: 0, request_id: head}
          - {op: schedule, priority: 255, request_id: waiting, healthy: 0}
          - {op: queue}
compare:
  ignore: []
