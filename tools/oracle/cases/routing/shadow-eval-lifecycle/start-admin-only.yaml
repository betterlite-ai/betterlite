kind: probe
name: shadow-eval-lifecycle-start-admin-only
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      shadow_eval_lifecycle:
        router:
          - model_name: judge-model
            litellm_params: {model: openai/gpt-4o-mini}
          - model_name: tier-model
            litellm_params: {model: anthropic/claude-sonnet-5}
          - model_name: baseline-model
            litellm_params: {model: openai/gpt-4o}
          - model_name: shadow-router
            litellm_params:
              model: auto_router/complexity_router
              complexity_router_default_model: tier-model
        rows:
          keys:
            - {token: key-1, key_alias: prod-key, key_name: sk-...abcd, team_id: team-1}
          teams:
            - {team_id: team-1, team_alias: Team One}
          users:
            - {user_id: user-1, user_email: user@example.com}
        now_millis: 1700000000000
        minted: [11111111-1111-1111-1111-111111111111, 22222222-2222-2222-2222-222222222222]
        steps:
          - start:
              role: absent
              store: true
              user_id: admin-user
              body: {text: '{"router_names": ["shadow-router"], "api_key_ids": ["key-1"], "judge_model": "judge-model", "shadow_percentage": 10, "max_budget": 10}'}
          - start:
              role: proxy_admin_viewer
              store: true
              user_id: admin-user
              body: {text: '{"router_names": ["shadow-router"], "api_key_ids": ["key-1"], "judge_model": "judge-model", "shadow_percentage": 10, "max_budget": 10}'}
          - start:
              role: internal_user
              store: true
              user_id: admin-user
              body: {text: '{"router_names": ["shadow-router"], "api_key_ids": ["key-1"], "judge_model": "judge-model", "shadow_percentage": 10, "max_budget": 10}'}
          - start:
              role: customer
              store: true
              user_id: admin-user
              body: {text: '{"router_names": ["shadow-router"], "api_key_ids": ["key-1"], "judge_model": "judge-model", "shadow_percentage": 10, "max_budget": 10}'}
          - start:
              role: proxy_admin
              store: true
              user_id: admin-user
              body: {text: '{"router_names": ["shadow-router"], "api_key_ids": ["key-1"], "judge_model": "judge-model", "shadow_percentage": 10, "max_budget": 10}'}
compare:
  ignore:
    - pointer: /output/shadow_eval_lifecycle/steps/0/detail
      why: the probe reports LiteLLM's HTTP status in detail, while betterlite reports its own error text
    - pointer: /output/shadow_eval_lifecycle/steps/1/detail
      why: the probe reports LiteLLM's HTTP status in detail, while betterlite reports its own error text
    - pointer: /output/shadow_eval_lifecycle/steps/2/detail
      why: the probe reports LiteLLM's HTTP status in detail, while betterlite reports its own error text
    - pointer: /output/shadow_eval_lifecycle/steps/3/detail
      why: the probe reports LiteLLM's HTTP status in detail, while betterlite reports its own error text
