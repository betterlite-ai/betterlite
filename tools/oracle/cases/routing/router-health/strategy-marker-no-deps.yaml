kind: probe
name: strategy-marker-no-deps
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      strategy_router_health:
        models:
          - model_name: outer
            litellm_params:
              model: auto_router/complexity_router
              complexity_router_config:
                tiers: {SIMPLE: missing-model}
            model_info: {id: outer-id}
        model_id: outer-id
compare:
  ignore: []
