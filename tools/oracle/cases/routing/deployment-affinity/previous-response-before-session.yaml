kind: probe
name: previous-response-before-session
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      deployment_affinity:
        model: gpt-4o
        ttl_seconds: 3600
        defaults: [responses, session]
        deployments:
          - {id: dep-a, model: openai/gpt-4o}
          - {id: dep-b, model: openai/gpt-4o}
        steps:
          - kind: hook
            now_millis: 0
            metadata: {deployment_model_name: gpt-4o, session_id: s1}
            model_info: {id: dep-a}
          - kind: filter
            now_millis: 0
            metadata: {session_id: s1}
            previous_response_id: "resp_bGl0ZWxsbTpjdXN0b21fbGxtX3Byb3ZpZGVyOm9wZW5haTttb2RlbF9pZDpkZXAtYjtyZXNwb25zZV9pZDpyZXNwXzE="
compare: {ignore: []}
