kind: probe
name: session-before-key
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      deployment_affinity:
        model: gpt-4o
        ttl_seconds: 3600
        user_key: true
        session: true
        deployments:
          - {id: dep-a, model: openai/gpt-4o}
          - {id: dep-b, model: openai/gpt-4o}
        steps:
          - kind: hook
            now_millis: 0
            metadata: {deployment_model_name: gpt-4o, user_api_key_hash: caller-key, session_id: s1}
            model_info: {id: dep-a}
          - kind: hook
            now_millis: 0
            metadata: {deployment_model_name: gpt-4o, user_api_key_hash: caller-key, session_id: s2}
            model_info: {id: dep-b}
          - kind: filter
            now_millis: 0
            metadata: {user_api_key_hash: caller-key, session_id: s2}
compare: {ignore: []}
