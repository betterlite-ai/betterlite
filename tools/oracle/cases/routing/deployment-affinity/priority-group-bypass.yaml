kind: probe
name: priority-group-bypass
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      deployment_affinity:
        model: gpt-4o
        ttl_seconds: 3600
        defaults: [user_key]
        priority_groups: [gpt-4o]
        deployments:
          - {id: dep-a, model: openai/gpt-4o}
          - {id: dep-b, model: openai/gpt-4o}
        steps:
          - kind: hook
            now_millis: 0
            metadata: {deployment_model_name: gpt-4o, user_api_key_hash: caller-key}
            model_info: {id: dep-a}
          - kind: filter
            now_millis: 0
            metadata: {user_api_key_hash: caller-key}
          - kind: filter
            now_millis: 0
            model: other-group
            metadata: {user_api_key_hash: caller-key}
compare: {ignore: []}
