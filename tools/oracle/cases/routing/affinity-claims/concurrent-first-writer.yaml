kind: probe
name: affinity-claims-concurrent-first-writer
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      affinity_claims:
        shared: true
        steps:
          - kind: claim
            key: shared-key-a
            pin: [{name: model_id, value: dep-a}]
            ttl_seconds: 30
          - kind: claim
            key: shared-key-a
            pin: [{name: model_id, value: dep-b}]
            ttl_seconds: 60
          - kind: claim
            key: shared-key-a
            pin: [{name: model_id, value: dep-b}]
            ttl_seconds: 45
            eligible: [[{name: model_id, value: dep-a}], [{name: model_id, value: dep-b}]]
          - kind: claim
            key: shared-key-a
            pin: [{name: model_id, value: dep-c}]
            ttl_seconds: 60
            eligible: [[{name: model_id, value: dep-c}]]
