kind: probe
name: affinity-claims-redis-outage-local-pin
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      affinity_claims:
        shared: true
        steps:
          - kind: claim
            key: outage-key
            pin: [{name: model_id, value: dep-a}]
            ttl_seconds: 60
          - kind: claim
            key: outage-key
            pin: [{name: model_id, value: dep-b}]
            ttl_seconds: 60
            down: true
          - kind: claim
            key: outage-key
            pin: [{name: model_id, value: dep-c}]
            ttl_seconds: 60
