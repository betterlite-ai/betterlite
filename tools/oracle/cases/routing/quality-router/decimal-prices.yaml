kind: probe
name: quality-router-decimal-prices
compare:
  numeric:
    - pointer: /output/quality_router/decision/score
      absolute_tolerance: 0.000001
      why: the score is the classifier's float sum, and its last bits may differ between the two runtimes
  expected_difference:
    - pointer: /output/quality_router/model
      reference: aaa
      rust: zzz
      why: LiteLLM reads both prices as the same Python float, so its name tiebreak picks aaa; betterlite keeps the written decimals and picks the cheaper zzz
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/quality_router/quality_router.py#L217
    - pointer: /output/quality_router/decision/routed_model
      reference: aaa
      rust: zzz
      why: the same selection reaches the routing decision record
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/quality_router/quality_router.py#L217
    - pointer: /output/quality_router/metadata/quality_router_decision/routed_model
      reference: aaa
      rust: zzz
      why: the same selection reaches the stashed decision metadata
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/quality_router/quality_router.py#L217
    - pointer: /output/quality_router/headers/x-litellm-quality-router-model
      reference: aaa
      rust: zzz
      why: the same selection reaches the response header
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/add_retry_fallback_headers.py#L147-L164
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      quality_router:
        config_text: |
          {"model_list": [
            {"model_name": "qr",
             "litellm_params": {"model": "auto_router/quality_router",
                                "quality_router_config": {"available_models": ["aaa", "zzz"],
                                                          "complexity_to_quality": {"SIMPLE": 2}}}},
            {"model_name": "aaa",
             "litellm_params": {"model": "openai/aaa"},
             "model_info": {"litellm_routing_preferences": {"quality_tier": 2},
                            "input_cost_per_token": "0.1000000000000000001"}},
            {"model_name": "zzz",
             "litellm_params": {"model": "openai/zzz"},
             "model_info": {"litellm_routing_preferences": {"quality_tier": 2},
                            "input_cost_per_token": "0.1"}}
          ]}
        messages:
          - role: user
            content: hello there
