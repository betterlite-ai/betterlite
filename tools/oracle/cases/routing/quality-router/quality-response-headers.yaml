kind: probe
name: quality-router-quality-response-headers
compare:
  numeric:
    - pointer: /output/quality_router/decision/score
      absolute_tolerance: 0.000001
      why: the score is the classifier's float sum, and its last bits may differ between the two runtimes
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      quality_router:
        config:
          model_list:
            - model_name: qr
              litellm_params:
                model: auto_router/quality_router
                quality_router_config:
                  available_models: [one, two]
                  complexity_to_quality: {SIMPLE: 1}
            - model_name: one
              litellm_params: {model: openai/one}
              model_info:
                litellm_routing_preferences: {quality_tier: 1}
                input_cost_per_token: 0.000001
            - model_name: two
              litellm_params: {model: openai/two}
              model_info:
                litellm_routing_preferences: {quality_tier: 2}
        messages:
          - role: user
            content: hello there
