kind: probe
name: admission-disabled
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      admission_control:
        settings: {}
        root_path: ""
        requests:
          - {id: 0, path: /a, behavior: hold}
          - {id: 1, path: /b, behavior: hold}
        steps:
          - {kind: start, request: 0}
          - {kind: await_started, request: 0}
          - {kind: start, request: 1}
          - {kind: await_started, request: 1}
          - {kind: stats}
          - {kind: release, request: 0}
          - {kind: release, request: 1}
          - {kind: complete, request: 0}
          - {kind: complete, request: 1}
          - {kind: stats}
