kind: probe
name: admission-health-and-metrics-exempt
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      admission_control:
        settings:
          max_in_flight_requests_per_worker: 1
          max_queued_requests_per_worker: 0
        root_path: ""
        requests:
          - {id: 0, path: /a, behavior: hold}
          - {id: 1, path: /health/liveliness, behavior: immediate}
          - {id: 2, path: /health/liveness, behavior: immediate}
          - {id: 3, path: /health/readiness, behavior: immediate}
          - {id: 4, path: /health/readiness/details, behavior: immediate}
          - {id: 5, path: /health/backlog, behavior: immediate}
          - {id: 6, path: /health/drain, behavior: immediate}
          - {id: 7, path: /metrics, behavior: immediate}
          - {id: 8, path: /metrics/, behavior: immediate}
          - {id: 9, path: /health/liveliness/, behavior: immediate}
          - {id: 10, path: /Metrics, behavior: immediate}
        steps:
          - {kind: start, request: 0}
          - {kind: await_started, request: 0}
          - {kind: start, request: 1}
          - {kind: await_started, request: 1}
          - {kind: complete, request: 1}
          - {kind: start, request: 2}
          - {kind: await_started, request: 2}
          - {kind: complete, request: 2}
          - {kind: start, request: 3}
          - {kind: await_started, request: 3}
          - {kind: complete, request: 3}
          - {kind: start, request: 4}
          - {kind: await_started, request: 4}
          - {kind: complete, request: 4}
          - {kind: start, request: 5}
          - {kind: await_started, request: 5}
          - {kind: complete, request: 5}
          - {kind: start, request: 6}
          - {kind: await_started, request: 6}
          - {kind: complete, request: 6}
          - {kind: start, request: 7}
          - {kind: await_started, request: 7}
          - {kind: complete, request: 7}
          - {kind: start, request: 8}
          - {kind: await_started, request: 8}
          - {kind: complete, request: 8}
          - {kind: start, request: 9}
          - {kind: complete, request: 9}
          - {kind: start, request: 10}
          - {kind: complete, request: 10}
          - {kind: stats}
          - {kind: release, request: 0}
          - {kind: complete, request: 0}
          - {kind: stats}
