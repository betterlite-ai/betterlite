kind: probe
name: admission-immediate
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      admission_control:
        settings:
          max_in_flight_requests_per_worker: 1
          max_queued_requests_per_worker: 0
        root_path: ""
        requests:
          - {id: 0, path: /only, behavior: immediate}
        steps:
          - {kind: start, request: 0}
          - {kind: await_started, request: 0}
          - {kind: complete, request: 0}
          - {kind: stats}
