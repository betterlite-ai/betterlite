kind: probe
name: admission-omitted-queue-equals-inflight
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      admission_control:
        settings:
          max_in_flight_requests_per_worker: 2
        root_path: ""
        requests:
          - {id: 0, path: /a, behavior: hold}
          - {id: 1, path: /b, behavior: hold}
          - {id: 2, path: /c, behavior: immediate}
        steps:
          - {kind: start, request: 0}
          - {kind: await_started, request: 0}
          - {kind: start, request: 1}
          - {kind: await_started, request: 1}
          - {kind: start, request: 2}
          - {kind: await_queued, queued: 1}
          - {kind: stats}
          - {kind: release, request: 0}
          - {kind: await_started, request: 2}
          - {kind: complete, request: 0}
          - {kind: complete, request: 2}
          - {kind: release, request: 1}
          - {kind: complete, request: 1}
          - {kind: stats}
