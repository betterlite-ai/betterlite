kind: probe
name: deployment-clients-same-credentials-reuse
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: [0, 0, 0, 0, 0]
    operation:
      deployment_clients:
        calculate:
          - {max_parallel_requests: 3, rpm: 5, tpm: 6000, default_max_parallel_requests: 9}
          - {max_parallel_requests: null, rpm: 2, tpm: 6000, default_max_parallel_requests: null}
          - {max_parallel_requests: null, rpm: null, tpm: 6000, default_max_parallel_requests: null}
          - {max_parallel_requests: null, rpm: null, tpm: 166, default_max_parallel_requests: null}
          - {max_parallel_requests: null, rpm: null, tpm: 167, default_max_parallel_requests: null}
          - {max_parallel_requests: null, rpm: null, tpm: null, default_max_parallel_requests: 9}
          - {max_parallel_requests: null, rpm: null, tpm: null, default_max_parallel_requests: null}
          - {max_parallel_requests: 0, rpm: null, tpm: null, default_max_parallel_requests: 9}
        limits: []
        cached:
          - {model_id: d1, model_group: gpt, max_parallel_requests: 2, rpm: null, tpm: null, default_max_parallel_requests: null, lookups: 2}
          - {model_id: d2, model_group: gpt, max_parallel_requests: null, rpm: 4, tpm: null, default_max_parallel_requests: null, lookups: 2}
          - {model_id: d3, model_group: gpt, max_parallel_requests: null, rpm: null, tpm: null, default_max_parallel_requests: null, lookups: 1}
        credentials:
          - model_group: gpt
            config: {model: openai/gpt-4o, api_key: sk-config, api_base: "https://configured.example/v1"}
            request: {api_key: sk-caller}
          - model_group: gpt
            config: {model: openai/gpt-4o, api_key: sk-config, api_base: "https://configured.example/v1"}
            request: {api_key: sk-caller}
compare:
  ignore: []
