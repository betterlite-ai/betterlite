kind: probe
name: typed-store-expiry
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      routing_value_store:
        settings:
          max_size_in_memory: null
          default_ttl_millis: null
          max_size_per_item: null
        steps:
          - {kind: set, now_millis: 0, key: "global_router:dep-a:model-x:tpm:00-00", value: {counter: 0}, ttl_millis: 10000}
          - {kind: get, now_millis: 0, key: "global_router:dep-a:model-x:tpm:00-00"}
          - {kind: get, now_millis: 10000, key: "global_router:dep-a:model-x:tpm:00-00"}
          - {kind: get, now_millis: 10500, key: "global_router:dep-a:model-x:tpm:00-00"}
          - {kind: set, now_millis: 20000, key: "spend:team-a", value: {spend: "0.25"}, ttl_millis: 30000}
          - {kind: get, now_millis: 20000, key: "spend:team-a"}
          - {kind: increment, now_millis: 20000, key: "spend:team-a", by: {spend: "0.5"}, ttl_millis: 30000}
          - {kind: get, now_millis: 20000, key: "spend:team-a"}
          - {kind: set, now_millis: 20000, key: "affinity:user-a", value: {pin: {model_id: "deployment-1"}}, ttl_millis: 30000}
          - {kind: set, now_millis: 20000, key: "scheduler:queue:model-x", value: {scheduler_tuple: {priority: 3, request_id: "req-1"}}, ttl_millis: 30000}
          - {kind: get, now_millis: 20000, key: "affinity:user-a"}
          - {kind: get, now_millis: 20000, key: "scheduler:queue:model-x"}
          - {kind: set_add, now_millis: 20000, key: "dynamic_rate:00-00:model-x", values: ["team-a", "team-b"], ttl_millis: 30000}
          - {kind: set_add, now_millis: 20000, key: "dynamic_rate:00-00:model-x", values: ["team-b", "team-c"], ttl_millis: 30000}
          - {kind: get, now_millis: 20000, key: "dynamic_rate:00-00:model-x"}
          - kind: set_pipeline
            now_millis: 20000
            ttl_millis: 30000
            entries:
              - {key: "pipeline:one", value: {counter: 1}}
              - {key: "pipeline:two", value: {counter: 2}}
          - {kind: batch_get, now_millis: 20000, keys: ["pipeline:one", "pipeline:two", "pipeline:absent"]}
          - {kind: compare_and_set, now_millis: 20000, key: "pin-claim:model-x", value: {pin: {model_id: "first"}}, ttl_millis: 30000}
          - {kind: compare_and_set, now_millis: 20000, key: "pin-claim:model-x", expected: {pin: {model_id: "other"}}, value: {pin: {model_id: "second"}}, ttl_millis: 30000}
          - {kind: compare_and_set, now_millis: 20000, key: "pin-claim:model-x", expected: {pin: {model_id: "first"}}, value: {pin: {model_id: "third"}}, ttl_millis: 30000}
          - {kind: set, now_millis: 30000, key: "kept", value: {counter: 1}, ttl_millis: 10000}
          - {kind: set, now_millis: 35000, key: "kept", value: {counter: 2}, ttl_millis: 100000}
          - {kind: get, now_millis: 40000, key: "kept"}
          - {kind: get, now_millis: 40500, key: "kept"}
          - {kind: set, now_millis: 41000, key: "defaulted", value: {counter: 5}}
          - {kind: get, now_millis: 641000, key: "defaulted"}
          - {kind: get, now_millis: 641500, key: "defaulted"}
          - {kind: set, now_millis: 642000, key: "zero-ttl", value: {counter: 7}, ttl_millis: 0}
          - {kind: get, now_millis: 642000, key: "zero-ttl"}
          - {kind: get, now_millis: 642500, key: "zero-ttl"}
          - {kind: set, now_millis: 643000, key: "", value: {counter: 11}, ttl_millis: 30000}
          - {kind: get, now_millis: 643000, key: ""}
          - kind: set_pipeline
            now_millis: 650000
            ttl_millis: 10000
            entries:
              - {key: "pipeline-exp-one", value: {counter: 1}}
              - {key: "pipeline-exp-two", value: {counter: 2}}
          - {kind: get, now_millis: 660000, key: "pipeline-exp-one"}
          - {kind: get, now_millis: 660500, key: "pipeline-exp-one"}
          - {kind: get, now_millis: 660500, key: "pipeline-exp-two"}
          - {kind: set_add, now_millis: 650000, key: "teams-exp", values: ["team-x"], ttl_millis: 10000}
          - {kind: get, now_millis: 660000, key: "teams-exp"}
          - {kind: get, now_millis: 660500, key: "teams-exp"}
          - {kind: increment, now_millis: 650000, key: "increment-exp", by: {counter: 4}, ttl_millis: 10000}
          - {kind: get, now_millis: 660000, key: "increment-exp"}
          - {kind: get, now_millis: 660500, key: "increment-exp"}
          - {kind: set, now_millis: 650000, key: "mixed-counter", value: {counter: 2}}
          - {kind: increment, now_millis: 650000, key: "mixed-counter", by: {spend: "0.5"}}
          - {kind: set, now_millis: 650000, key: "mixed-spend", value: {spend: "0.25"}}
          - {kind: increment, now_millis: 650000, key: "mixed-spend", by: {counter: 2}}
compare:
  ignore: []
  expected_difference:
    - pointer: /output/routing_value_store/steps/31/value
      reference: {counter: 11}
      rust: null
      why: the 1024-byte route key cap refuses a key Python accepts, so the value never lands in betterlite's store
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/in_memory_cache.py#L158-L177
