compare:
  ignore: []
  expected_difference:
    - pointer: /output/static_eligibility/lookups/0/selected
      reference: ["wide"]
      rust: ["wide", "windowless"]
      why: Router init registers each deployment's model_info under the shared backend model key, and get_router_model_info reads it back through the lru-cached get_model_info, so a deployment with no window inherits whichever sibling registered last. That value depends on model_list and cache order, not on the deployment's config, so no working setup can rely on it; betterlite resolves each deployment's window from its own model info.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L10115-L10125
