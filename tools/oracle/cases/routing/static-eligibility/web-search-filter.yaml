kind: probe
name: web-search-filter
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      static_eligibility:
        environment: production
        enable_pre_call_checks: false
        models:
          - {model_name: search, model: "openai/gpt-4o", id: yes, supports_web_search: true}
          - {model_name: search, model: "openai/gpt-4o", id: no, supports_web_search: false}
          - {model_name: search, model: "openai/gpt-4o", id: default}
        lookups:
          - {model: search, tools: [{type: web_search}]}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      static_eligibility:
        environment: production
        enable_pre_call_checks: false
        models:
          - {model_name: search, model: "openai/gpt-4o", id: yes, supports_web_search: true}
          - {model_name: search, model: "openai/gpt-4o", id: no, supports_web_search: false}
        lookups:
          - {model: search, tools: [{type: web_search_preview}]}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      static_eligibility:
        environment: production
        enable_pre_call_checks: false
        models:
          - {model_name: search, model: "openai/gpt-4o", id: yes, supports_web_search: true}
          - {model_name: search, model: "openai/gpt-4o", id: no, supports_web_search: false}
        lookups:
          - {model: search, tools: [{type: function}]}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      static_eligibility:
        environment: production
        enable_pre_call_checks: false
        models:
          - {model_name: search, model: "openai/gpt-4o", id: no, supports_web_search: false}
        lookups:
          - {model: search, tools: [{type: web_search}]}
compare: {ignore: []}
