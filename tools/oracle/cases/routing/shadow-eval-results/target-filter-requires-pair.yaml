kind: probe
name: shadow-eval-results-target-filter-requires-pair
probes:
- clock:
    unix_millis: 1700000000000
    monotonic_millis: 0
  samples: []
  operation:
    shadow_eval_results:
      now_millis: 1700000000000
      jobs:
      - id: one-key
        group_id: one
        target_type: key
        target_id: k-one
        router_name: router-a
        router_names:
        - router-a
        direction: forward
        judge_model: judge-model
        shadow_percentage: 10.0
        max_turns: 5
        created_at: '2023-11-14T22:11:40Z'
        ends_at: '2023-11-15T22:13:20Z'
      - id: one-team
        group_id: one
        target_type: team
        target_id: t-one
        router_name: router-a
        router_names:
        - router-a
        direction: forward
        judge_model: judge-model
        shadow_percentage: 10.0
        max_turns: 5
        created_at: '2023-11-14T22:12:30Z'
        ends_at: '2023-11-15T22:13:20Z'
      - id: two-key
        group_id: two
        target_type: key
        target_id: k-two
        router_name: router-a
        router_names:
        - router-a
        direction: forward
        judge_model: judge-model
        shadow_percentage: 10.0
        max_turns: 5
        created_at: '2023-11-14T21:56:40Z'
        ends_at: '2023-11-15T22:13:20Z'
      steps:
      # An empty target_id is used as given (docs/compatibility.md), while LiteLLM's truthiness
      # reads it as absent and lists every group, so no probe compares that pair.
      - list:
          role: proxy_admin
          store: true
          query: target_type=key
      - list:
          role: proxy_admin
          store: true
          query: target_id=k-one
      - list:
          role: proxy_admin
          store: true
          query: target_type=key&target_id=k-one&limit=5
      - list:
          role: proxy_admin
          store: true
          query: target_type=team&target_id=t-absent
      - list:
          role: proxy_admin
          store: true
          query: target_type=&target_id=k-one
      - list:
          role: proxy_admin
          store: true
          query: ''
      errors: []
      by_tier: []
      by_model: []
      by_leg: []
      by_router: []
      rows:
        keys: []
        teams: []
        users: []
compare:
  ignore: []
