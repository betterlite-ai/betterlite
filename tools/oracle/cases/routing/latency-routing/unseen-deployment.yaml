kind: probe
name: latency-routing-unseen-deployment
probes:
  # a deployment the map has no callback for enters it with one zero latency sample and no counters
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: [0]
    operation:
      latency_routing:
        model_group: gpt-4o
        settings: {lowest_latency_buffer: 0.0, ttft_percentile: null}
        now_millis: 1700000000000
        stream: false
        input_tokens: 0
        deployments: [{id: dep-seen}, {id: dep-fresh}]
        stored:
          - id: dep-seen
            latency: [4.0]
  # the same unseen deployment under a streaming request keeps the zero latency window, since it has no first-token sample
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: [0]
    operation:
      latency_routing:
        model_group: gpt-4o
        settings: {lowest_latency_buffer: 0.0, ttft_percentile: 0.5}
        now_millis: 1700000000000
        stream: true
        input_tokens: 0
        deployments: [{id: dep-seen}, {id: dep-fresh}]
        stored:
          - id: dep-seen
            latency: [4.0]
            time_to_first_token_seconds: [2.0]
compare: {ignore: []}
