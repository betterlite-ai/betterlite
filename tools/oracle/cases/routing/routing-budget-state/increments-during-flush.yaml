kind: probe
name: increments-during-flush
probes:
  - clock: {unix_millis: 0, monotonic_millis: 0}
    samples: []
    operation:
      routing_budget_state:
        provider_budget_config:
          openai: {budget_limit: "10", time_period: 1d}
        steps:
          - {kind: success, provider: openai, cost: "0.5"}
          - {kind: success, provider: openai, cost: "0.25"}
          - {kind: hold_writes}
          - {kind: begin_sync}
          - {kind: success, provider: openai, cost: "0.125"}
          - {kind: memory, key: "provider_spend:openai:1d"}
          - {kind: release_writes}
          - {kind: end_sync}
          - {kind: redis, key: "provider_spend:openai:1d"}
          - {kind: memory, key: "provider_spend:openai:1d"}
compare: {ignore: []}
