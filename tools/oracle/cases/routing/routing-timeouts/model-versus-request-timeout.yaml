kind: probe
name: model-versus-request-timeout
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      routing_timeouts:
        completion:
          model_timeout: {kind: seconds, seconds: "11"}
          timeout: "22"
          request_timeout: "33"
          provider: openai
          global_timeout: {seconds: "6000", explicitly_set: true}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      routing_timeouts:
        completion:
          timeout: "22"
          request_timeout: "33"
          provider: openai
          global_timeout: {seconds: "6000", explicitly_set: true}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      routing_timeouts:
        completion:
          request_timeout: "33"
          provider: openai
          global_timeout: {seconds: "6000", explicitly_set: true}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      routing_timeouts:
        completion:
          provider: openai
          global_timeout: {seconds: "6000", explicitly_set: false}
