kind: probe
name: missing-versus-unhealthy
probes:
  - clock: {unix_millis: 0, monotonic_millis: 0}
    samples: []
    operation:
      cooldown_state:
        settings: {default_cooldown_time: 5.0, redis_read_interval_seconds: 1.0, staleness_threshold: 50.0}
        shared_health:
          a: {is_healthy: false, timestamp: 100.0, reason: probe failure}
          b: {is_healthy: true, timestamp: 100.0}
          c: {is_healthy: false, timestamp: 0.0, reason: probe failure}
        deployments:
          - {model_name: gpt, id: a}
          - {model_name: gpt, id: b}
          - {model_name: gpt, id: c}
        health: {enabled: true, has_allowed_fails_policy: false}
        steps:
          - {kind: health, now_millis: 120000}
          - {kind: filter, now_millis: 120000}
          - {kind: filter, now_millis: 120000, health_check_probe: true}
  - clock: {unix_millis: 0, monotonic_millis: 0}
    samples: []
    operation:
      cooldown_state:
        settings: {default_cooldown_time: 5.0, redis_read_interval_seconds: 1.0, staleness_threshold: 50.0}
        deployments:
          - {model_name: gpt, id: a}
          - {model_name: gpt, id: b}
        health: {enabled: true, has_allowed_fails_policy: false}
        steps:
          - {kind: health, now_millis: 0}
          - {kind: filter, now_millis: 0}
          - {kind: filter, now_millis: 0, health_check_probe: true}
  - clock: {unix_millis: 0, monotonic_millis: 0}
    samples: []
    operation:
      cooldown_state:
        settings: {default_cooldown_time: 5.0, redis_read_interval_seconds: 1.0, staleness_threshold: 50.0}
        shared_health:
          a: {is_healthy: false, timestamp: 0.0, reason: probe failure}
        deployments:
          - {model_name: gpt, id: a}
          - {model_name: gpt, id: b}
        health: {enabled: true, has_allowed_fails_policy: false}
        steps:
          - {kind: health, now_millis: 49999}
          - {kind: health, now_millis: 50000}
compare: {ignore: []}
