kind: probe
name: route-threshold
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      semantic_router:
        config: '{"routes": [{"name": "code", "utterances": ["write a function", "debug my test"], "score_threshold": 0.5}, {"name": "chat", "utterances": ["say hello"], "score_threshold": 0.5}]}'
        default_model: fallback-model
        embedding_model: openai/text-embedding-3-small
        messages:
          - {role: user, content: write a function}
        vectors:
          test: [1, 0]
          write a function: [1, 0]
          debug my test: [0.6, 0.8]
          say hello: [0, 1]
compare: {ignore: []}
