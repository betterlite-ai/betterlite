kind: probe
name: parser-byte-bound
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      semantic_router:
        config: '{"routes":[]}'
        default_model: fallback-model
        embedding_model: openai/text-embedding-3-small
        messages:
          - {role: user, content: ask}
        vectors:
          test: [1, 0]
          ask: [1, 0]
        rounds: 0
        pad_bytes: 1048564
compare:
  ignore: []
  expected_difference:
    - pointer: /output/semantic_router/accepted
      reference: true
      rust: false
      why: betterlite rejects an auto-router config past 1 MiB before decoding, while the LiteLLM reference reads it
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/auto_router/auto_router.py#L46-L255
    - pointer: /output/semantic_router/code
      reference: null
      rust: too_large
      why: the bounded parser reports its typed invalid-input outcome for the oversized config
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/auto_router/auto_router.py#L46-L255
