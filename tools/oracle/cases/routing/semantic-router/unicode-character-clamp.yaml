kind: probe
name: unicode-character-clamp
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      semantic_router:
        config: '{"routes": [{"name": "accent", "utterances": ["aéxyz"], "score_threshold": 0.5}]}'
        default_model: fallback-model
        embedding_model: openai/text-embedding-3-small
        max_input_chars: 2
        messages:
          - {role: user, content: "aé中🙂"}
        vectors:
          te: [1, 0]
          aé: [1, 0]
compare: {ignore: []}
