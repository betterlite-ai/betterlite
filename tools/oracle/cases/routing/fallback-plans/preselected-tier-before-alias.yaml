kind: probe
name: fallback-preselected-tier-before-alias
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: requested
          lookup_model_group: requested
          metadata:
            present: true
            pre_routing_selected_model: tier-a
            model_group: routed-group
            original_model_group: requested-original
        config:
          fallbacks:
            - {tier-a: [from-tier]}
            - {routed-group: [from-routed]}
            - {requested: [from-requested]}
            - {requested-original: [from-original]}
          max_fallbacks: 5
        request: {}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: requested
          lookup_model_group: requested
          metadata:
            present: true
            pre_routing_selected_model: tier-a
            model_group: requested
            original_model_group: requested-original
        config:
          fallbacks:
            - {tier-a: [from-tier]}
            - {requested-original: [from-original]}
          max_fallbacks: 5
        request: {}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: original
          lookup_model_group: alias
          metadata:
            present: true
            model_group: alias-target
            original_model_group: original
        config:
          fallbacks:
            - {alias-target: [from-alias]}
            - {alias: [from-lookup]}
            - {original: [from-original]}
          max_fallbacks: 5
        request: {}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: original
          lookup_model_group: alias
          litellm_metadata:
            present: true
            pre_routing_selected_model: tier-b
            model_group: alias-target
        config:
          fallbacks:
            - {tier-b: [from-tier]}
          max_fallbacks: 5
        request: {}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: requested
          lookup_model_group: requested
          metadata:
            present: true
            model_group: requested
        snapshot:
          metadata:
            present: true
            pre_routing_selected_model: stale-selection
        config:
          fallbacks:
            - {recorded-tier: [from-record]}
            - {requested: [from-requested]}
          max_fallbacks: 5
        request: {}
        record_selection: recorded-tier
