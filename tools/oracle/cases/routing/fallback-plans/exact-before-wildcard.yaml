kind: probe
name: fallback-exact-before-wildcard
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: gpt-4
          lookup_model_group: gpt-4
        config:
          fallbacks:
            - {"*": [backup]}
            - {gpt-4: [claude]}
          max_fallbacks: 5
        request: {}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: gpt-4
          lookup_model_group: gpt-4
        config:
          fallbacks:
            - {gpt-4: [claude]}
            - {"*": [backup]}
          max_fallbacks: 5
        request: {}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: other
          lookup_model_group: other
        config:
          fallbacks:
            - {"*": [backup]}
            - {gpt-4: [claude]}
          max_fallbacks: 5
        request: {}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      fallback_plans:
        state:
          model: later
          lookup_model_group: later
        config:
          fallbacks:
            - {"*": [backup]}
            - {later: [specific]}
          max_fallbacks: 5
        request: {}
