kind: probe
name: shadow-eval-validation-unknown-key-team-user
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      shadow_eval_validation:
        router:
          - model_name: judge-model
            litellm_params: {model: openai/gpt-4o-mini, api_key: sk-test}
          - model_name: tier-model
            litellm_params: {model: anthropic/claude-sonnet-5, api_key: sk-test}
          - model_name: shadow-router
            litellm_params:
              model: auto_router/complexity_router
              complexity_router_default_model: tier-model
        rows:
          keys:
            - {token: key-1, team_id: team-1}
          teams:
            - {team_id: team-1}
          users:
            - {user_id: user-1}
        steps:
          - validate_start:
              text: '{"api_key_ids":["key-1","key-unknown"],"team_ids":["team-unknown"],"user_ids":["user-unknown"],"router_names":["shadow-router"],"judge_model":"judge-model","shadow_percentage":50}'
          - validate_start:
              text: '{"api_key_ids":["key-unknown"],"router_names":["shadow-router"],"judge_model":"judge-model","shadow_percentage":50}'
          - validate_start:
              text: '{"api_key_ids":["key-1"],"team_ids":["team-1"],"user_ids":["user-1"],"router_names":["shadow-router"],"judge_model":"judge-model","shadow_percentage":50}'
          - validate_start:
              text: '{"user_ids":["user-1"],"router_names":["shadow-router"],"judge_model":"anthropic/claude-sonnet-5","shadow_percentage":50}'
compare:
  ignore: []
