kind: probe
name: custom-dimensions-binary-and-count
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      custom_dimensions:
        function: classify
        config:
          classifier_type: heuristic
          custom_dimensions:
            - name: domain
              weight: 0.8
              keywords: [alpha, beta]
              patterns: ['gamma', '[0-9]{2}']
