kind: probe
name: custom-dimensions-dollar-continuation
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      custom_dimensions:
        function: classify
        config:
          classifier_type: heuristic
          custom_dimensions:
            - name: domain
              weight: 0.8
              patterns: ['a$\n']
              scoring_mode: binary
        prompt: "a\n"
compare:
  expected_difference:
    - pointer: /output/custom_dimensions/tier
      reference: REASONING
      rust: SIMPLE
      why: The consuming dollar normalization loses the custom match before a final newline.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L800
    - pointer: /output/custom_dimensions/score
      reference: '0.700000'
      rust: '-0.100000'
      why: The domain dimension contributes 0.8 only to the reference score.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L800
    - pointer: /output/custom_dimensions/signals
      reference: ['short (0 tokens)', 'custom (domain)']
      rust: ['short (0 tokens)']
      why: The reference reports the domain match, whereas betterlite loses it.
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/config.py#L800
  ignore: []
