kind: probe
name: unsupported-shape-no-adjustment
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      cache_cost_routing:
        cache_aware_routing: true
        cache_aware_routing_output_tokens: 1024
        cache_aware_routing_timeout_ms: 2000
        tier_labels: {}
        tiers: {SIMPLE: small}
        params: []
        response:
          model: small
          routing_decision:
            router_model_name: probe
            router_type: complexity
            routed_model: small
            cause: heuristic_scorer
            tier: SIMPLE
            conversation_continuing: true
            signals: ["short (2 tokens)"]
          session_affinity_ttl_seconds: 3600
          litellm_params: {max_tokens: 512}
        messages: [{role: user, content: hello}]
        # a non-Anthropic deployment carries no prompt-cache routing, so the prediction declines
        request_kwargs: {custom_llm_provider: openai, model: openai/gpt-4o}
        context_fit:
          facts: {small: {window: 200000}}
          needed: 100
          buffer: "0.8"
        choice: null
        chooser_delay_ms: 0
compare:
  ignore: []
