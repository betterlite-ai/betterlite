kind: probe
name: disabled-no-prediction
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      cache_cost_routing:
        cache_aware_routing: false
        cache_aware_routing_output_tokens: 1024
        cache_aware_routing_timeout_ms: 2000
        tier_labels: {}
        tiers: {SIMPLE: small}
        params: []
        response:
          model: small
          routing_decision:
            router_model_name: probe
            router_type: complexity
            routed_model: small
            cause: heuristic_scorer
            tier: SIMPLE
            conversation_continuing: true
            signals: ["short (2 tokens)"]
          session_affinity_ttl_seconds: 3600
          litellm_params: {max_tokens: 512}
        messages: [{role: user, content: hello}]
        request_kwargs: {temperature: 0.2}
        context_fit:
          facts: {small: {window: 200000}}
          needed: 100
          buffer: "0.8"
        # a prediction is available, but the off switch means it is never asked for
        choice:
          model: medium
          tier: MEDIUM
          deployment_id: dep-medium
          original_cost: "0.004"
          estimated_cost: "0.001"
        chooser_delay_ms: 0
compare:
  ignore: []
