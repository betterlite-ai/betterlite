kind: probe
name: latency-observations-stream-ttft-mean
probes:
  - clock: {unix_millis: 0, monotonic_millis: 0}
    samples: [0, 0]
    operation:
      latency_observations:
        settings: {ttl: 3600.0, lowest_latency_buffer: 0.0, max_latency_list_size: 10, ttft_percentile: null}
        steps:
          - {kind: success, now_millis: 0, model_group: gpt, deployment_id: dep-a, stream: true, elapsed_millis: 2000, first_token_millis: 500, usage: {completion_tokens: 4, total_tokens: 10}}
          - {kind: success, now_millis: 0, model_group: gpt, deployment_id: dep-a, stream: true, sync: true, elapsed_millis: 4000, first_token_millis: 1000, usage: {completion_tokens: 2, total_tokens: 6}}
          - {kind: success, now_millis: 0, model_group: gpt, deployment_id: dep-a, stream: true, elapsed_millis: 3000, first_token_millis: 1500, usage: {completion_tokens: 0, total_tokens: 5}}
          - {kind: success, now_millis: 0, model_group: gpt, deployment_id: dep-a, elapsed_millis: 1000, usage: {completion_tokens: 4, total_tokens: 8}}
          - {kind: success, now_millis: 0, channels: litellm_metadata, model_group: claude, metadata_group: gpt, deployment_id: dep-a, elapsed_millis: 2000}
          - {kind: success, now_millis: 0, channels: litellm_metadata, metadata_group: gpt, deployment_id: dep-a, elapsed_millis: 2000}
          - {kind: success, now_millis: 0, channels: none, model_group: gpt, deployment_id: dep-a, elapsed_millis: 2000}
          - {kind: success, now_millis: 0, model_group: gpt, elapsed_millis: 2000}
          - {kind: view, now_millis: 0, model_group: gpt}
          - {kind: view, now_millis: 0, model_group: claude}
          - {kind: score, now_millis: 0, model_group: gpt, deployment_id: dep-a, sample: ttft, statistic: mean}
          - {kind: score, now_millis: 0, model_group: gpt, deployment_id: dep-a, sample: latency, statistic: mean}
compare: {ignore: []}
