kind: probe
name: latency-observations-ttft-percentile-boundary
probes:
  - clock: {unix_millis: 0, monotonic_millis: 0}
    samples: [0]
    operation:
      latency_observations:
        settings: {ttl: 3600.0, lowest_latency_buffer: 0.0, max_latency_list_size: 10, ttft_percentile: 0.5}
