kind: probe
name: classifier-verdict-custom-tier-label
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: custom_prompt
        window: 0
        definitions:
          - {name: quick, description: short factual replies}
          - {name: reasoning}
        examples: "a one-line greeting -> quick"
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: custom_prompt
        window: 1
        prompt: "Grade the request against the two tiers below."
        definitions:
          - {name: SIMPLE}
          - {name: COMPLEX, description: multi-step work}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: built_in_prompt
        window: 0
        rubric: business
        labeled_tiers:
          - {tier: SIMPLE, label: Cheap}
          - {tier: MEDIUM, label: Balanced}
          - {tier: COMPLEX, label: Deep}
          - {tier: REASONING, label: Max}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: QUICK
        tier_config:
          tier_definitions:
            - {name: quick, description: short factual replies}
            - {name: reasoning}
          tier_models: {quick: cheap-model, reasoning: deep-model}
          classifier_type: llm
          fallback_tier: quick
          classifier_llm_config: {model: judge}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: reasoning
        tier_config:
          tier_definitions:
            - {name: quick, description: short factual replies}
            - {name: reasoning}
          tier_models: {quick: cheap-model, reasoning: deep-model}
          classifier_type: llm
          fallback_tier: quick
          classifier_llm_config: {model: judge}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: SIMPLE
        tier_config:
          tier_definitions:
            - {name: quick, description: short factual replies}
            - {name: reasoning}
          tier_models: {quick: cheap-model, reasoning: deep-model}
          classifier_type: llm
          fallback_tier: quick
          classifier_llm_config: {model: judge}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: Balanced
        tier_config:
          tier_labels: {SIMPLE: Cheap, MEDIUM: Balanced, COMPLEX: Deep, REASONING: Max}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: "  max  "
        tier_config:
          tier_labels: {SIMPLE: Cheap, MEDIUM: Balanced, COMPLEX: Deep, REASONING: Max}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: MEDIUM
        tier_config:
          tier_labels: {SIMPLE: Cheap, MEDIUM: Balanced, COMPLEX: Deep, REASONING: Max}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: nope
        tier_config:
          tier_labels: {SIMPLE: Cheap, MEDIUM: Balanced, COMPLEX: Deep, REASONING: Max}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: resolve_label
        label: NON_REASONING
        tier_config:
          non_reasoning_tier: true
          classifier_type: llm
          classifier_llm_config: {model: judge}
          tier_models: {NON_REASONING: tiny-model}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: resolve_label, label: NON_REASONING}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply: {kind: text, content: '{"tier": "Cheap"}'}
        tier_config:
          tier_labels: {SIMPLE: Cheap, MEDIUM: Balanced, COMPLEX: Deep, REASONING: Max}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply: {kind: text, content: '{"tier": "Quick"}'}
        tier_config:
          tier_definitions:
            - {name: quick, description: short factual replies}
            - {name: reasoning}
          tier_models: {quick: cheap-model, reasoning: deep-model}
          classifier_type: llm
          fallback_tier: quick
          classifier_llm_config: {model: judge}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply: {kind: text, content: '{"tier": "NON_REASONING"}'}
        tier_config:
          non_reasoning_tier: true
          classifier_type: llm
          classifier_llm_config: {model: judge}
          tier_models: {NON_REASONING: tiny-model}
compare: {ignore: []}
