kind: probe
name: classifier-verdict-malformed-tier-fallback
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: '{"confidence": 0.9}'}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: '{"tier": 7}'}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: '{"tier": null}'}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: "the classifier did not answer with a tier"}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: '{"tier": "SIMPLE"'}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: '{"tier": 7}'}, request_kwargs: {turn_off_message_logging: true}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply: {kind: text, content: '{"tier": 7}'}
        request_kwargs: {metadata: {turn_off_message_logging: true}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply: {kind: text, content: '{"tier": 7}'}
        request_kwargs: {turn_off_message_logging: true, metadata: {headers: {litellm-disable-message-redaction: true}}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply: {kind: text, content: '{"tier": 7}'}
        request_kwargs: {metadata: {headers: {litellm-enable-message-redaction: true}}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: 'not json {"broken": } {"tier": "SIMPLE"}'}}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict: {function: parse_reply, reply: {kind: text, content: '{"tier": "SIMPLE", "note": NaN}'}}
compare: {ignore: []}
