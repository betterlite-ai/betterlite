kind: probe
name: classifier-verdict-parser-byte-bound
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply:
          kind: padded
          content: '{"tier": "MEDIUM"}'
          pad: " "
          pad_len: 1048558
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      classifier_verdict:
        function: parse_reply
        reply:
          kind: padded
          content: '{"tier": "MEDIUM"}'
          pad: " "
          pad_len: 1048559
compare:
  ignore: []
  expected_difference:
    - pointer: /output/classifier_verdict/parse
      reference: {kind: selected, label: MEDIUM, tier: MEDIUM}
      rust: {kind: rejected, reason: too_large, withheld: false}
      why: betterlite refuses a reply past 1048576 bytes before decoding it, a bound LiteLLM's str parser has no equivalent for
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/complexity_router.py#L218-L464
