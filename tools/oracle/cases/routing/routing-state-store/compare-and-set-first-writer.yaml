kind: probe
name: compare-and-set-first-writer
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      routing_state_store:
        settings:
          namespace: null
          password: null
          failure_threshold: 5
          recovery_timeout_millis: 30000
        steps:
          - {kind: claim, now_millis: 0, worker: 0, key: affinity, value: {pin: {model_id: first}}, ttl_seconds: 120}
          - {kind: claim, now_millis: 0, worker: 1, key: affinity, value: {pin: {model_id: second}}, ttl_seconds: 120}
          - {kind: claim, now_millis: 0, worker: 0, key: affinity, value: {pin: {model_id: third}}}
