kind: probe
name: redis-credential-redaction
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      routing_state_store:
        settings:
          url: redis://:super-secret-redis-password@127.0.0.1:1
          namespace: router
          password: super-secret-redis-password
          failure_threshold: 5
          recovery_timeout_millis: 30000
        steps:
          - {kind: fail, now_millis: 0}
          - {kind: leak, now_millis: 0, worker: 0, key: counter}
