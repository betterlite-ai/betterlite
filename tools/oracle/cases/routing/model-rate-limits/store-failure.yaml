kind: probe
name: model-rate-limits-store-failure
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      model_rate_limits:
        now_millis: 1700000000000
        deployment: {id: dep-a, model: openai/gpt-4o, model_name: gpt-4o, tpm: 5, rpm: 1}
        redis: down
        local: {tpm: 0, rpm: 0}
        steps:
          - {kind: check}
          - {kind: redis, redis: up}
          - {kind: check}
compare: {ignore: []}
