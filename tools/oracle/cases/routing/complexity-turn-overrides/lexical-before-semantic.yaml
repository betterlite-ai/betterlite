kind: probe
name: complexity-turn-overrides-lexical-before-semantic
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_turn_overrides:
        tiers: {SIMPLE: [s], MEDIUM: [m], COMPLEX: [c], REASONING: [r]}
        keyword_tier_rules:
          - {keywords: [invoice], tier: COMPLEX}
          - {keywords: [refund], tier: SIMPLE}
        semantic_keyword_matching: true
        embedding_model: probe-embed
        match_threshold: 0.5
        user_message: invoice and refund
        embeddings:
          test: [1.0, 0.0]
          invoice: [0.0, 1.0]
          refund: [1.0, 0.0]
          invoice and refund: [1.0, 0.0]
compare: {ignore: []}
