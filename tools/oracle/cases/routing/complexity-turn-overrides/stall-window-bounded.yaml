kind: probe
name: complexity-turn-overrides-stall-window-bounded
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_turn_overrides:
        tiers: {SIMPLE: [s], MEDIUM: [m], COMPLEX: [c], REASONING: [r]}
        stall_escalation_enabled: true
        stall_escalation_window: 2
        stall_escalation_repeat_threshold: 2
        messages:
          - {role: assistant, content: [{type: tool_use, id: a, name: search, input: {q: 1}}]}
          - {role: assistant, content: [{type: tool_use, id: b, name: other, input: {q: 2}}]}
          - {role: assistant, content: [{type: tool_use, id: c, name: search, input: {q: 1}}]}
          - role: user
            content:
              - {type: tool_result, tool_use_id: a, is_error: false}
              - {type: tool_result, tool_use_id: b, is_error: false}
              - {type: tool_result, tool_use_id: c, is_error: false}
compare: {ignore: []}
