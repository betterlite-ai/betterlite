kind: probe
name: complexity-turn-overrides-repeated-failed-tool-escalates
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_turn_overrides:
        tiers: {SIMPLE: [s], MEDIUM: [m], COMPLEX: [c], REASONING: [r]}
        user_message: run the search again
        newest_ask: this is stuck, LITELLM ESCALATE
        stall_escalation_enabled: true
        stall_escalation_window: 6
        stall_escalation_repeat_threshold: 3
        messages:
          - {role: assistant, content: [{type: tool_use, id: a, name: search, input: {q: 1}}]}
          - {role: user, content: [{type: tool_result, tool_use_id: a, is_error: true}]}
          - {role: assistant, content: [{type: tool_use, id: b, name: search, input: {q: 1}}]}
          - {role: user, content: [{type: tool_result, tool_use_id: b, is_error: true}]}
          - {role: assistant, content: [{type: tool_use, id: c, name: search, input: {q: 1}}]}
          - {role: user, content: [{type: tool_result, tool_use_id: c, is_error: true}]}
compare: {ignore: []}
