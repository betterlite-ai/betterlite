kind: probe
name: complexity-turn-overrides-semantic-index-single-init
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_turn_overrides:
        tiers: {SIMPLE: [s], MEDIUM: [m], COMPLEX: [c], REASONING: [r]}
        keyword_tier_rules:
          - {keywords: [invoice, receipt], tier: COMPLEX}
        semantic_keyword_matching: true
        embedding_model: probe-embed
        match_threshold: 0.9
        user_message: exact
        turns: 3
        embeddings:
          test: [1.0, 0.0]
          invoice: [1.0, 0.0]
          receipt: [0.0, 1.0]
          exact: [1.0, 0.0]
compare: {ignore: []}
