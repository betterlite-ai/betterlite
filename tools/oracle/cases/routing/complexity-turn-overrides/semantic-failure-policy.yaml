kind: probe
name: complexity-turn-overrides-semantic-failure-policy
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_turn_overrides:
        tiers: {SIMPLE: [s], MEDIUM: [m], COMPLEX: [c], REASONING: [r]}
        keyword_tier_rules:
          - {keywords: [invoice], tier: COMPLEX}
        semantic_keyword_matching: true
        embedding_model: probe-embed
        match_threshold: 0.5
        user_message: invoice
        turns: 3
        embeddings:
          test: [1.0, 0.0]
          invoice: [1.0, 0.0]
        document_failures: 1
        query_failures: 1
compare: {ignore: []}
