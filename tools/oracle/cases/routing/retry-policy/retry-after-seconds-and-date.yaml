kind: probe
name: retry-policy-retry-after-seconds-and-date
probes:
  # now_unix_millis matches the probe clock, which is the time the reference reads
  - clock: {unix_millis: 1445412420000, monotonic_millis: 0}
    samples: [0, 0, 0, 0, 0, 0]
    operation:
      retry_policy:
        function: sleep
        sleep:
          now_unix_millis: 1445412420000
          steps:
            - healthy_deployments: 0
              all_deployments: 2
              retry_after_header: "5"
              remaining_retries: 2
              max_retries: 2
              min_timeout: 0
            - healthy_deployments: 0
              all_deployments: 2
              retry_after_header: "Wed, 21 Oct 2015 07:28:00 GMT"
              remaining_retries: 2
              max_retries: 2
              min_timeout: 0
            - healthy_deployments: 0
              all_deployments: 2
              retry_after_header: "Wed, 21 Oct 2015 07:27:00 GMT"
              remaining_retries: 2
              max_retries: 2
              min_timeout: 0
            - healthy_deployments: 0
              all_deployments: 2
              retry_after_header: "soon"
              remaining_retries: 2
              max_retries: 2
              min_timeout: 0
            - healthy_deployments: 0
              all_deployments: 2
              retry_after_header: null
              remaining_retries: 2
              max_retries: 2
              min_timeout: 0
            - healthy_deployments: 0
              all_deployments: 2
              retry_after_header: "0"
              remaining_retries: 2
              max_retries: 2
              min_timeout: 0
