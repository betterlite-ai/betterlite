                                                                                                                                                                                                                                    "
              remaining_retries: 2
              max_retries: 2
              min_timeout: 0
compare:
  expected_difference:
    - pointer: /output/retry_policy/retry_afters/1
      reference: "seconds:5"
      rust: "invalid"
      why: betterlite rejects a retry-after value over 8192 bytes before decoding, while LiteLLM reads the digits the padded value contains
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L7197-L7228
    - pointer: /output/retry_policy/delays/1
      reference: "5.000000"
      rust: "0.500000"
      why: the rejected header falls back to exponential backoff instead of obeying the five seconds LiteLLM reads
      link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L7231-L7254
