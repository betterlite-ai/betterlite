kind: probe
name: router-settings-current-values
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      router_settings:
        endpoint: settings
        router_settings:
          routing_strategy: least-busy
          num_retries: 4
          timeout: 30.5
          stream_timeout: 7.5
          fallbacks: [{gpt-4: [gpt-3.5-turbo]}]
          context_window_fallbacks: [{claude-3-opus: [gpt-4]}]
          content_policy_fallbacks: [{gpt-4: [gpt-3.5-turbo]}]
          allowed_fails: 1
          cooldown_time: 2.5
          retry_policy: {BadRequestErrorRetries: 2}
          model_group_alias: {gpt-4: gpt-3.5-turbo}
          enable_pre_call_checks: true
          default_litellm_params: {stream_timeout: 1.5}
          default_max_parallel_requests: 8
compare: {ignore: []}
