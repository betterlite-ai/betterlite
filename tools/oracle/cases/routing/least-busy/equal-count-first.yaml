kind: probe
name: equal-count-first
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      least_busy:
        model_group: gpt
        shared: true
        deployments:
          - {id: a}
          - {id: b}
          - {id: c}
        steps:
          - {kind: pre_call, call_id: 1, deployment: a}
          - {kind: pre_call, call_id: 2, deployment: b}
          - {kind: pre_call, call_id: 3, deployment: c}
          - {kind: pre_call, call_id: 4, deployment: a, call_type: retrieve_batch}
          - {kind: select_sync}
          - {kind: shared}
compare:
  ignore: []
