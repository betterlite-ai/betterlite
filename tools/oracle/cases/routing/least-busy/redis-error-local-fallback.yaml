kind: probe
name: redis-error-local-fallback
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      least_busy:
        model_group: gpt
        shared: true
        deployments:
          - {id: a}
          - {id: b}
        steps:
          - {kind: pre_call, call_id: 1, deployment: b}
          - {kind: down}
          - {kind: pre_call, call_id: 2, deployment: a}
          - {kind: pre_call, call_id: 3, deployment: a}
          - {kind: select}
          - {kind: shared}
          - {kind: up}
          - {kind: shared}
compare:
  ignore: []
