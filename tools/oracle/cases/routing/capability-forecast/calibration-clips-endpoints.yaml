kind: probe
name: calibration-clips-endpoints
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      capability_forecast:
        function: calibrate
        calibration: {version: v1, slope: "1.0", intercept: "0.0"}
        probabilities: ["0", "0.4", "0.5", "1"]
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      capability_forecast:
        function: calibrate
        calibration: {version: v1, slope: "0.0", intercept: "0.0"}
        probabilities: ["0", "0.5", "1"]
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      capability_forecast:
        function: calibrate
        calibration: {version: v1, slope: "20.0", intercept: "-20.0"}
        probabilities: ["0", "0.5", "1"]
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      capability_forecast:
        function: evaluate
        config:
          efficient_tier: SIMPLE
          capable_tier: REASONING
          base_threshold: "0.5"
          calibration: {version: held-out-v1, slope: "1.0", intercept: "0.0"}
        reply: {kind: text, content: '{"crux":"calibrated forecast","primary_rule":"SUP-1","capability_boundary":"supported","p_solve":0.4}'}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      capability_forecast:
        function: evaluate
        config:
          efficient_tier: SIMPLE
          capable_tier: REASONING
          base_threshold: "0.5"
          calibration: {version: broken, slope: "-1.0", intercept: "0.0"}
        reply: {kind: text, content: '{"crux":"calibrated forecast","primary_rule":"SUP-1","capability_boundary":"supported","p_solve":0.4}'}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      capability_forecast:
        function: calibrate
        calibration: {version: broken, slope: "21.0", intercept: "0.0"}
        probabilities: ["0.5"]
compare: {ignore: []}
