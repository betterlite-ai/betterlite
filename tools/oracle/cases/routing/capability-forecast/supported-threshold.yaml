  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      capability_forecast:
        function: evaluate
        config: {efficient_tier: SIMPLE, capable_tier: REASONING, base_threshold: "0.5", threshold_step: "0.0"}
        reply:
          kind: padded
          content: '{"crux":"x","primary_rule":"SUP-1","capability_boundary":"supported","p_solve":0.5}'
          pad: " "
          pad_len: 1048493
compare: {ignore: []}
