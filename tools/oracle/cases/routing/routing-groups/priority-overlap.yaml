kind: probe
name: priority-overlap
probes:
  - clock: {unix_millis: 1700000001400, monotonic_millis: 0}
    samples: []
    operation:
      routing_groups:
        groups:
          - group_name: fast
            models: [probe-shared, probe-premium]
            routing_strategy: priority
            model_priorities: {probe-shared: 1, probe-premium: 2}
          - group_name: slow
            models: [probe-shared]
            routing_strategy: priority
            model_priorities: {probe-shared: 5}
        deployments:
          - {model_name: probe-shared, identifier: shared-1, model: "openai/probe-shared"}
          - {model_name: probe-premium, identifier: premium-1, model: "openai/probe-premium"}
          - {model_name: probe-premium, identifier: premium-2, model: "openai/probe-premium"}
        names: [fast, slow, probe-shared]
compare: {ignore: []}
