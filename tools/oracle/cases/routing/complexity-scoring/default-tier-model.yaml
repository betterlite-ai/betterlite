kind: probe
name: complexity-scoring-default-tier-model
probes:
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring: {function: tier_model, tier: SIMPLE}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring: {function: tier_model, tier: MEDIUM}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring: {function: tier_model, tier: COMPLEX}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring: {function: tier_model, tier: REASONING}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring: {function: tier_model, tier: NON_REASONING}
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring:
        function: tier_model
        config:
          tier_models: {SIMPLE: small-model}
        tier: SIMPLE
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring:
        function: tier_model
        config:
          tier_models: {SIMPLE: small-model}
          default_model: fallback-model
        tier: COMPLEX
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring:
        function: tier_model
        config:
          tier_models: {SIMPLE: small-model, COMPLEX: big-model}
          default_model: fallback-model
        tier: COMPLEX
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring:
        function: tier_model
        config:
          tier_models: {SIMPLE: [only-model]}
        tier: SIMPLE
  - clock: {unix_millis: 1700000000000, monotonic_millis: 0}
    samples: []
    operation:
      complexity_scoring:
        function: tier_model
        config:
          tier_models: {MEDIUM: mid-model}
        tier: COMPLEX
