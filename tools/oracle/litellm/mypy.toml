[tool.mypy]
# Kept apart from pyproject.toml, a key of the oracle answer cache, so a mypy change keeps the cached LiteLLM answers
python_version = "3.11"
# probes has no __init__.py, since pyright reads one as a package and rejects every absolute import inside it
mypy_path = "tools/oracle/litellm:tools/oracle/helpers:tools/oracle/fixtures:tools/oracle/sdk_http:crates/betterlite-python/python:crates/betterlite-python/tests"
explicit_package_bases = true
strict = true
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true
local_partial_types = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "narrowed-type-not-subtype",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
follow_imports = "silent"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
