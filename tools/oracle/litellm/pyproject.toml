[project]
name = "betterlite-oracle-litellm"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "litellm[proxy]==1.105.1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "ruff>=0.13.0",
]

[tool.uv]
override-dependencies = ["litellm-enterprise; sys_platform == 'never'"]
