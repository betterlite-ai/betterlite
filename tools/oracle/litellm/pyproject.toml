[project]
name = "betterlite-oracle-litellm"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "litellm[proxy]==1.105.1",
]

[dependency-groups]
dev = [
  "basedpyright==1.40.2",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[tool.uv]
override-dependencies = ["litellm-enterprise; sys_platform == 'never'"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with the ruff formatter
  "D", # the repository keeps no docstrings
]

[tool.ruff.lint.per-file-ignores]
"probes/tests/*" = ["S101"] # pytest checks with assert

[tool.basedpyright]
include = ["probes"]
typeCheckingMode = "all"
