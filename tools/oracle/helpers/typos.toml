[files]
extend-exclude = ["**/fixtures/**", "**/snapshots/**", "**/fuzz/corpus/**", "**/fuzz/artifacts/**", "tools/oracle/cases/**", ".development/**"]

[default.extend-words]
# LiteLLM spells its own file client_initalization_utils.py this way, and the backlog quotes it
initalization = "initalization"
asend = "asend"
# AI21 on Bedrock takes frequencePenalty, and LiteLLM sends it under that name (amazon_ai21_transformation.py)
frequence = "frequence"
# LiteLLM's UnparseableRecord keeps this spelling
Unparseable = "Unparseable"
unparseable = "unparseable"
# prometheus_client 0.20 spells its mmap writer MmapedDict, and helpers import the class by that name
Mmaped = "Mmaped"
