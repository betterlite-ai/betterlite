[package]
name = "betterlite-oracle-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-shear]
ignored = ["betterlite-logging", "chrono", "quick-xml", "serde", "thiserror", "tl"]

[dependencies]
betterlite-logging = { path = "../../../crates/betterlite-logging" }
betterlite-oracle = { path = ".." }
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde"] }
libfuzzer-sys = "0.4.9"
quick-xml = "0.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.0.0"
thiserror = "2.0.17"
tl = "0.7.8"

[[bin]]
name = "datadog_logs"
path = "fuzz_targets/datadog_logs.rs"
test = false
doc = false
bench = false

