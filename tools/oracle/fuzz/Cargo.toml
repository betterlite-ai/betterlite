[package]
name = "betterlite-oracle-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license.workspace = true

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-shear]
ignored = ["chrono", "quick-xml", "serde", "thiserror", "tl"]

[dependencies]
betterlite-oracle = { path = ".." }
chrono = { version = "0.4.45", default-features = false, features = ["now", "serde"] }
libfuzzer-sys = "0.4.9"
quick-xml = "0.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.0.0"
thiserror = "2.0.17"
tl = "0.7.8"

[[bin]]
name = "helper_case"
path = "fuzz_targets/helper_case.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blog_feed_xml"
path = "fuzz_targets/blog_feed_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe_ipc"
path = "fuzz_targets/probe_ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mock_script"
path = "fuzz_targets/mock_script.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_case"
path = "fuzz_targets/http_case.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart_oracle"
path = "fuzz_targets/multipart_oracle.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart_capture"
path = "fuzz_targets/multipart_capture.rs"
test = false
doc = false
bench = false

[[bin]]
name = "browser_form"
path = "fuzz_targets/browser_form.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scenario"
path = "fuzz_targets/scenario.rs"
test = false
doc = false
bench = false
