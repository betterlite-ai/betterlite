kind: http_scenario
name: corpus-secret-header
config: |-
  model_list: []
env: {}
steps:
  - name: capture
    request: {method: GET, path: /first}
    capture:
      - name: status
        pointer: /status
        secret: true
  - name: header
    request:
      method: GET
      path: /second
      headers:
        x-scenario-status: ${capture.status}
