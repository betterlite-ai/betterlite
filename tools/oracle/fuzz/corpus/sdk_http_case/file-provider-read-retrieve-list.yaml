kind: sdk_http
name: file-provider-read-retrieve-list-seed
env: {OPENAI_API_KEY: sk-env, ANTHROPIC_API_KEY: sk-ant-env}
call:
  file_provider_read:
    steps:
      - function: file_retrieve
        file_id: file-a
        timeout: "2.5"
      - function: afile_list
        custom_llm_provider: anthropic
        purpose: batch
        client: http_handler
      - function: file_list
        custom_llm_provider: cohere
upstream:
  - status: 200
    headers: {content-type: application/json}
    body: {id: file-a, object: file, bytes: 1, created_at: 1700000001, filename: a.jsonl, purpose: batch, status: processed}
  - status: 200
    headers: {content-type: application/json}
    body:
      data:
        - {id: file_a, type: file, filename: a.pdf, size_bytes: 1, created_at: "2025-04-01T00:00:00Z"}
      has_more: false
compare:
  headers: []
  headers_present: []
  upstream_headers: [authorization, x-api-key, x-supplied-client]
  ignore: []
