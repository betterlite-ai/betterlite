name: saml-assertion-with-body
config: |
  general_settings:
    master_key: oracle-master
env: {}
upstream: []
steps:
  - request:
      method: GET
      path: "/sso/key/generate"
      headers: {}
      body: null
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
    captures:
      - name: authn_request
        source:
          location_query:
            name: SAMLRequest
    form: false
  - request:
      method: POST
      path: "/sso/key/generate"
      headers: {}
      body:
        probe: true
    compare:
      headers: []
      headers_present: []
      upstream_headers: []
      ignore: []
    captures: []
    form: false
    saml_assertion:
      subject: alice@example.com
      attributes: {}
      audience: urn:betterlite:sp
      destination: http://127.0.0.1:4000/sso/key/generate
      request_id_capture: authn_request
      assertion_id: _assertion_with_body
      not_before_offset_seconds: -60
      not_on_or_after_offset_seconds: 300
