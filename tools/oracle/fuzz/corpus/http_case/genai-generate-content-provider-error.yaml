name: genai-generate-content-provider-error
config: 'general_settings: {}'
env: {}
request:
  method: POST
  path: /v1beta/models/gemini-2.0-flash:generateContent
  headers: {content-type: application/json, authorization: 'Bearer oracle-key'}
  body:
    contents:
      - role: user
        parts:
          - text: Hello
upstream:
  - status: 429
    headers: {x-litellm-call-id: call-9}
    body: {message: the provider refused, type: rate_limit_error, param: model}
    events: null
compare: {headers: [], headers_present: [], upstream_headers: [], ignore: []}
