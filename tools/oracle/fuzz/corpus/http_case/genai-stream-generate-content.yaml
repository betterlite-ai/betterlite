name: genai-stream-generate-content
config: 'general_settings: {}'
env: {}
request:
  method: POST
  path: /models/gemini-2.0-flash:streamGenerateContent
  headers: {content-type: application/json}
  body:
    contents:
      - role: user
        parts:
          - text: Hello
upstream:
  - status: 200
    headers: {content-type: text/event-stream}
    body: null
    events:
      - "data: {\"candidates\": [{\"content\": {\"role\": \"model\", \"parts\": [{\"text\": \"Hi\"}]}}]}\n\n"
      - "data: {\"candidates\": [{\"content\": {\"role\": \"model\", \"parts\": [{\"text\": \" there\"}]}, \"finishReason\": \"STOP\"}]}\n\n"
compare: {headers: [], headers_present: [], upstream_headers: [], ignore: []}
