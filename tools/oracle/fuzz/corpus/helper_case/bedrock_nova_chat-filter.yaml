kind: helper
name: bedrock_nova_chat-filter
call:
  bedrock_nova_chat:
    function: filter_allowed_fields
    model: amazon.nova-pro-v1:0
    messages:
      - {role: system, content: be brief}
      - {role: user, content: hi}
    model_cost:
      amazon.nova-pro-v1:0: {litellm_provider: bedrock, supports_prompt_caching: true, supports_reasoning: false, supports_function_calling: true, supports_tool_choice: true, supports_sampling_params: true}
    optional_params:
      maxTokens: 64
      cache_control_injection_points:
        - {location: system}
    litellm_params: {}
env: {}
compare: {ignore: []}
