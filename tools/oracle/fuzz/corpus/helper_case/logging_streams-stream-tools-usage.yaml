kind: helper
name: logging-streams-stream-tools-usage
call:
  logging_streams:
    probes:
      - operation: stream
        chunk_lists:
          - [{choices: [{index: 0, delta: {content: "Hel"}}]}, {choices: [{index: 0, delta: {content: "lo"}}]}, {choices: [{index: 0, delta: {tool_calls: [{index: 0, id: call-1, type: function, function: {name: lookup, arguments: "{}"}}]}}]}, {choices: [{index: 0, delta: {}, finish_reason: tool_calls}]}, {choices: [], usage: {prompt_tokens: 4, completion_tokens: 3, total_tokens: 7}}]
          - [{choices: [{index: 0, delta: {content: "a"}}]}, {choices: [{index: 1, delta: {content: "b"}}]}, {choices: [{index: 0, delta: {content: "c"}, finish_reason: stop}]}]
      - operation: chat
        responses:
          - {choices: [{message: {role: assistant, content: "hi", tool_calls: []}, finish_reason: stop}]}
env: {}
compare: {ignore: []}
