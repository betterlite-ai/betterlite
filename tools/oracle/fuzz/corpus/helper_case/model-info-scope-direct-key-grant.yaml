kind: helper
name: model-info-scope-corpus-seed
call:
  model_info_scope:
    function: grant_resolution
    model_list:
      - model_name: gpt-4o
        litellm_params: {model: openai/gpt-4o}
        model_info: {id: dep-1}
      - model_name: gpt-4o-mini
        litellm_params: {model: openai/gpt-4o-mini}
        model_info: {id: dep-2}
    model_group_alias: {}
    grant: [gpt-4o]
env: {}
compare: {ignore: []}
