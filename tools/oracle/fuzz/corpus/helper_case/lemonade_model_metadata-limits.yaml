kind: helper
name: lemonade-model-metadata-seed-limits
call:
  lemonade_model_metadata:
    operation: positive_int
    values: [7, 0, -1, 3.0, true, "42", "  +8  ", "bad"]
    model_infos:
      - {recipe_options: {ctx_size: 10}, max_input_tokens: 20, context_window: 30}
      - {max_input_tokens: 20, max_context_window: 40}
env: {}
compare: {ignore: []}
