kind: helper
name: foundry-chat-message-seed
call:
  foundry_chat:
    requests:
      - model: mistral-large
        messages:
          - role: assistant
            content:
              - {type: thinking, thinking: seed}
              - {type: text, text: answer}
            reasoning_content: seed-reasoning
            nested: {cache_control: {type: ephemeral}}
        optional: {extra_body: {top_p: 0.9}, max_retries: 2}
env: {}
compare: {ignore: []}
