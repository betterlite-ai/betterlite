kind: helper
name: batch-delivery-cancellation-remainder
call:
  batch_delivery:
    send:
      events: [e0, e1, e2, e3]
      success_status_codes: [200]
      policy: undelivered
      script:
        - {outcome: response, status: 413}
        - {outcome: response, status: 413}
        - {outcome: response, status: 200}
        - {outcome: cancel}
env: {}
compare:
  ignore: []
