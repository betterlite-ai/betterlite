kind: helper
name: studio-images-round-trip
call:
  studio_images:
    factories: [gemini-2.5-flash-image]
    requests:
      - model: gemini-2.5-flash-image
        prompt: a red fox
        params: {}
        env: {GEMINI_API_KEY: seed-key}
        headers: {x-custom: kept}
        api_key: null
        api_base: null
    responses:
      - model: gemini-2.5-flash-image
        body:
          candidates:
            - content:
                parts:
                  - inlineData: {data: AAA}
          usageMetadata:
            promptTokenCount: 4
            promptTokensDetails:
              - {modality: TEXT, tokenCount: 1}
            candidatesTokenCount: 6
            totalTokenCount: 10
    costs:
      - model: oracle-studio-image
        catalog: {output_cost_per_image: 0.04, input_cost_per_token: 0, output_cost_per_token: 0}
        images: 1
        usage: {input_tokens: 4, output_tokens: 6, total_tokens: 10, text_tokens: 4, image_tokens: 0}
env: {}
compare: {ignore: []}
