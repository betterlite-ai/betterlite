kind: helper
name: bedrock-messages-transform-seed
call:
  bedrock_messages:
    function: transform
    model_cost:
      bedrock/fixture-plain: {litellm_provider: bedrock, mode: chat}
    drop_params: true
    calls:
      - model: fixture-plain
        messages: [{role: user, content: hi}]
        optional_params: {max_tokens: 256}
env: {LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: 'True'}
compare: {ignore: []}
