kind: helper
name: mistral-chat-media-bypasses-name-cleanup
call:
  mistral_chat:
    steps:
      - kind: request
        model: mistral-small-latest
        messages:
          - role: user
            name: ada
            content:
              - type: text
                text: look
              - type: image_url
                image_url: https://example.test/a.png
              - type: file
                file:
                  file_id: file-1
          - role: assistant
            content: ""
          - role: assistant
            content: hi
            reasoning_content: why
            thinking_blocks:
              - type: thinking
                thinking: kept-out
env: {}
compare: {ignore: []}
