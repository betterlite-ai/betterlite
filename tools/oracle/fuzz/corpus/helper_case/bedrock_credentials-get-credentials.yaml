kind: helper
name: bedrock-credentials-get-credentials-seed
call:
  bedrock_credentials:
    get_credentials:
      environment: {AWS_ACCESS_KEY_ID: ambient, AWS_SECRET_ACCESS_KEY: ambient-secret}
      steps:
        - params: {aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole', aws_session_name: bedrock}
          ssl_verify: true
      answers:
        get_caller_identity:
          - error: {status: 403, code: AccessDenied, message: denied}
        assume_role:
          - credentials: {access_key_id: ASIAFIXTURE, secret_access_key: fixture-secret, session_token: fixture-session, expiration: '2026-01-01T01:00:00Z'}
env: {}
compare: {ignore: []}
