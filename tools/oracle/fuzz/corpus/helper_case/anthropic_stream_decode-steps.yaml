kind: helper
name: anthropic-stream-decode-steps
call:
  anthropic_stream_decode:
    ids: ["01234567-89ab-4def-8123-456789abcdef"]
    steps:
      - function: text
        value: 'data:{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"a"}}'
      - function: bytes
        value: [120, 121, 122, 100, 97, 116, 97, 58, 123, 34, 116, 121, 112, 101, 34, 58, 34, 112, 105, 110, 103, 34, 125]
      - function: text
        value: not a data line
    passthrough:
      - function: text
        value: 'data: {"type":"ping"}'
      - function: bytes
        value: [104, 101, 108, 108, 111]
env: {}
compare: {ignore: []}
