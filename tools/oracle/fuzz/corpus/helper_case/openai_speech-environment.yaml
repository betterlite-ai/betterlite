kind: helper
name: openai-speech-seed-environment
call:
  openai_speech:
    client: {api_key: sk-seed, api_base: 'https://speech.test/v1', timeout: 30, max_retries: 2, environment_organization: org-env, environment_project: proj-env}
    request: {model: tts-1, input: seed, voice: alloy}
    reply: {status: 200, headers: [[content-type, audio/mpeg]], chunks: [[6]]}
env: {}
compare: {ignore: []}
