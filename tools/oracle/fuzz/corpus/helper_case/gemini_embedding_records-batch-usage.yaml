kind: helper
name: gemini-embedding-records-batch-usage-seed
call:
  gemini_embedding_records:
    batch_requests: []
    embed_content_requests: []
    batch_replies:
      - model: gemini-embedding-001
        input: ["alpha", "data:image/png;base64,AAAA"]
        response: {embeddings: [{values: [0.1]}]}
    embed_content_replies: []
compare: {ignore: []}
env: {}
