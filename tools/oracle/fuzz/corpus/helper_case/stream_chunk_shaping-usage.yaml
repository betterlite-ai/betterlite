kind: helper
name: stream-chunk-shaping-usage-seed
call:
  b5652:
    state:
      model: gpt-4
      provider: openrouter
      chunks:
        - {id: c, created: 1, usage: {prompt_tokens: 10, completion_tokens: 2, prompt_tokens_details: {cached_tokens: 3}}}
    repeated_chunk_limit: 100
    usage_cost_providers: [openrouter]
    steps:
      - {op: total_usage}
env: {}
compare: {ignore: []}
