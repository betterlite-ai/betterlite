kind: helper
name: management-rbac-access-switches-seed
call:
  management_rbac:
    calls:
      - role: internal_user
        feature: vector_stores
        general_settings: {disable_vector_stores_for_internal_users: true, allow_vector_stores_for_team_admins: true}
      - role: proxy_admin
        feature: agents
        general_settings: {disable_agents_for_internal_users: "false"}
env: {}
compare: {ignore: []}
