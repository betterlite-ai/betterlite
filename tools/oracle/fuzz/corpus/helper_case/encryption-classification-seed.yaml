kind: helper
name: encryption-classification-seed
call:
  encryption_classification:
    salt_key: scan-key
    values:
      - "v2:gcm:seed"
      - "plain"
    maps: [{}, "v2:gcm:invalid", {key: plain}]
    callbacks: ["litellm_enc::v2:gcm:seed"]
env: {LITELLM_SALT_KEY: scan-key}
compare:
  ignore: []
