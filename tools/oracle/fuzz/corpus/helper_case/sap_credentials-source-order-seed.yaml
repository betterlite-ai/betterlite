kind: helper
name: sap-credentials-source-order-seed
call:
  b5950:
    function: credentials
    environment:
      vars:
        AICORE_CLIENT_ID: env-client
      files:
        /home/sap/.aicore/config.json: '{"client_secret": "config-secret"}'
      home: /home/sap
    service_key:
      credentials:
        clientid: key-client
      resource_group: key-rg
env: {}
compare: {ignore: []}
