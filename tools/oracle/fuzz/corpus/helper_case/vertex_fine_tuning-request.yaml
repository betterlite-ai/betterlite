kind: helper
name: vertex-fine-tuning-request-seed
call:
  vertex_fine_tuning:
    operation: request
    calls:
      - data:
          model: gemini-1.5-flash-002
          training_file: gs://bucket/train.jsonl
          suffix: seed
          hyperparameters: {n_epochs: 2, learning_rate_multiplier: 0.25}
        original_hyperparameters: {adapter_size: ADAPTER_SIZE_ONE}
env: {}
compare: {ignore: []}
