kind: helper
name: auth-tenant-budgets-seed
call:
  auth_tenant_budgets:
    calls:
      - function: project_hard
        database: true
        project:
          project_id: proj-seed
          spend: 6.0
          litellm_budget_table: {max_budget: 10.0, soft_budget: 5.0}
        token: {token: sk-seed, user_id: user-seed, team_id: team-seed, org_id: org-seed}
        spends: [10.0]
      - function: project_soft
        database: true
        project:
          project_id: proj-seed
          spend: 6.0
          litellm_budget_table: {max_budget: 10.0, soft_budget: 5.0}
        token: {token: sk-seed, user_id: user-seed, team_id: team-seed, org_id: org-seed}
        spends: []
      - function: organization
        database: true
        token: {token: sk-seed, user_id: user-seed, org_id: org-seed}
        organization:
          organization_id: org-seed
          organization_alias: Seed Org
          budget_id: budget-seed
          spend: 3.0
          created_by: seed
          updated_by: seed
          litellm_budget_table: {max_budget: 10.0}
        spends: [11.0]
      - function: tags
        database: true
        request_body:
          metadata: {tags: ["tag-seed"]}
        tag_rows:
          - {tag_name: tag-seed, models: [], spend: 1.0, litellm_budget_table: {max_budget: 2.0}}
        spends: [2.0]
      - function: groups
        database: true
        matched_model_access_groups: ["group-seed"]
        group_rows:
          - {access_group_name: group-seed, spend: 2.0, max_budget: 2.0}
        spends: [2.0]
env: {}
compare:
  ignore: []
