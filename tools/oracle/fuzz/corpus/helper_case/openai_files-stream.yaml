kind: helper
name: openai-files-stream-content-cancel
call:
  openai_files:
    action: file_content_streaming
    client: {api_key: sk-files, api_base: 'https://files.test/v1', supplied: null, is_async: true}
    request:
      file_id: file-stream
      chunk_size: 2
      read: 1
    reply:
      status: 200
      headers: [[content-type, application/octet-stream], [x-request-id, req-2]]
      chunks: [[1, 2, 3, 4, 5, 6]]
env: {}
compare: {ignore: []}
