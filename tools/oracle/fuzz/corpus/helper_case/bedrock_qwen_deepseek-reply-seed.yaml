kind: helper
name: bedrock-qwen-deepseek-reply-seed
call:
  bedrock_qwen_deepseek:
    qwen_reply:
    - projection: qwen2
      model: qwen.qwen2-72b-instruct
      messages:
      - role: user
        content: seed
      body: '{"generation": "seed answer", "usage": {"prompt_tokens": 1, "completion_tokens": 2, "total_tokens": 3}}'
      response:
        id: chatcmpl-seed
        choices:
        - index: 0
          finish_reason: null
          message:
            role: assistant
            content: null
            provider_specific_fields: null
        created: 0
        model: ''
        usage:
          prompt_tokens: 0
          completion_tokens: 0
          total_tokens: 0
    - projection: qwen3
      model: qwen.qwen3-32b-v1:0
      messages: []
      body: '{"text": "seed fallback"}'
      response:
        id: chatcmpl-seed
        choices:
        - index: 0
          finish_reason: null
          message:
            role: assistant
            content: null
            provider_specific_fields: null
        created: 0
        model: ''
        usage:
          prompt_tokens: 0
          completion_tokens: 0
          total_tokens: 0
    qwen_request: []
    deepseek_reply: []
env: {}
compare:
  ignore: []
