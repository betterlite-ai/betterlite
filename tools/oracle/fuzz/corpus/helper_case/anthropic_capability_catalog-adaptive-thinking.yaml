kind: helper
name: anthropic-capability-catalog-adaptive-thinking
call:
  anthropic_capability_catalog:
    fixture:
      model_cost:
        anthropic/claude-opus-4-7: {litellm_provider: anthropic, supports_adaptive_thinking: true}
      packaged: {}
      thresholds: {medium: 2048, high: 4096, xhigh: 8192}
    steps:
      - function: adaptive_thinking
        model: claude-opus-4-7
        custom_llm_provider: anthropic
        params: {thinking: {type: enabled, budget_tokens: 5000}}
env: {}
compare: {ignore: []}
