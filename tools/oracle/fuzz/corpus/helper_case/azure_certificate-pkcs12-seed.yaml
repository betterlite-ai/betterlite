kind: helper
name: azure-certificate-pkcs12-seed
call:
  azure_certificate:
    steps:
    - certificate_base64: 
      password: fixture-password
      send_certificate_chain: true
      replies:
      - status: 200
        body: '{"authorization_endpoint":"https://login.microsoftonline.com/tenant/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/tenant/oauth2/v2.0/token"}'
      - status: 200
        body: '{"access_token":"tok-value","expires_in":3600}'
env: {}
compare:
  ignore: []
