kind: helper
name: bedrock-other-canvas-edits-request
call:
  bedrock_other_canvas_edits:
    model_cost: {canvas-fixture-plain: {supports_nova_canvas_image_edit: true}}
    calls:
      - function: transform
        prompt: cat
        image: {kind: bytes, data: img}
        mask: {kind: text, text: m}
        options: {taskType: INPAINTING, maskPrompt: mp}
        drop_params: false
      - function: map
        options: {size: 10x20, n: 2}
        drop_params: false
      - function: eligibility
        models: [canvas-fixture-plain, canvas-fixture-absent]
      - function: selection
        models: [canvas-fixture-plain, amazon.nova-canvas-v1:0]
env: {}
compare: {ignore: []}
