kind: helper
name: azure-username-password-token-seed
call:
  azure_username_password:
    action: token_response
    steps:
      - observe: lazy
        replies: []
      - observe: info
        environment: {}
        client_id: client
        username: user@example.com
        password: password
        replies:
          - url_contains: well-known
            status: 200
            body: '{"authorization_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize","token_endpoint":"https://login.microsoftonline.com/organizations/oauth2/v2.0/token"}'
          - url_contains: /oauth2/v2.0/token
            status: 200
            body: '{"access_token":"tok","expires_in":3600,"refresh_in":120,"id_token_claims":{"aud":"client","iss":"https://login.microsoftonline.com/tenant/v2.0","sub":"subject","tid":"tenant","preferred_username":"user@example.com"},"client_info":"eyJ1aWQiOiJ1aWQiLCJ1dGlkIjoidXRpZCJ9"}'
env: {}
compare: {ignore: []}
