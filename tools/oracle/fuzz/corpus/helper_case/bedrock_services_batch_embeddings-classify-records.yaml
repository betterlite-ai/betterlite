kind: helper
name: bedrock-services-batch-embeddings-classify-records
call:
  bedrock_services_batch_embeddings:
    function: classify_records
    records:
      - {url: /v1/embeddings, body: {input: x}}
      - {url: /v1/completions, body: {prompt: p}}
      - {url: /v1/responses, body: {messages: []}}
      - {body: {messages: []}}
      - {body: {prompt: p}}
      - {body: {input: x}}
      - {url: /other, body: {input: x}}
      - {url: null, body: x}
env: {}
compare: {ignore: []}
