kind: helper
name: chirp-stream-records-config
call:
  chirp_stream_records:
    configure:
      model: chirp_2
      language_codes: [de-DE]
      sample_rate_hertz: 8000
    recognizer: projects/project/locations/europe-west4/recognizers/_
    billed_before: 1.5
    responses:
      - speech_event_type: SPEECH_ACTIVITY_BEGIN
        results:
          - alternatives: [{transcript: guten tag}, {transcript: guten tak}]
            is_final: true
        total_billed_duration: {seconds: 2, nanos: 750000000}
env: {}
compare: {ignore: []}
