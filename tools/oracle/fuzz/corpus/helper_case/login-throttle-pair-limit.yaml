kind: helper
name: login-throttle-seed
call:
  login_throttle:
    config:
      general_settings:
        max_failed_login_attempts_per_source: 4
    phases:
      - request: {peer: "10.1.1.1"}
        now: 1000.0
        steps:
          - {kind: attempt, username: bob}
env: {}
compare: {ignore: []}
