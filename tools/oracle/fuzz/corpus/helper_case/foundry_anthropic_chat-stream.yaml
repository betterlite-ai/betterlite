kind: helper
name: foundry-anthropic-chat-stream-seed
call:
  foundry_anthropic:
    api_base: https://resource.services.ai.azure.com/anthropic/v1/messages
    model: claude-sonnet-4-5
    messages:
      - role: user
        content: hi
    optional_params:
      max_tokens: 16
      stream: true
    litellm_params: {}
    caller_headers: {}
    api_key: sk-azure-key-fixture
    azure_ad_token: null
    upstream_status: 200
    upstream_headers: {}
    upstream_body: null
    upstream_lines:
      - 'event: message_start'
      - 'data: {"type":"message_start","message":{"id":"msg_1","type":"message","role":"assistant","model":"claude-sonnet-4-5","content":[],"stop_reason":null,"usage":{"input_tokens":5,"output_tokens":1}}}'
      - 'event: message_stop'
      - 'data: {"type":"message_stop"}'
env:
  LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS: "true"
compare: {ignore: []}
