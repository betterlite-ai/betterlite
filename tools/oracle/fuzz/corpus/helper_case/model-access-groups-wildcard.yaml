kind: helper
name: model-access-groups-wildcard
call:
  b10047:
    model_list:
      - model_name: anthropic/*
        litellm_params:
          model: anthropic/claude-*
        model_info:
          id: x
          access_groups: [beta]
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
        model_info:
          id: a
    model_group_alias: {}
    arguments:
      model_name: anthropic/claude-3
      team_id: team-1
env: {}
compare: {ignore: []}
