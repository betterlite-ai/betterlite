kind: helper
name: azure-chat-params-transform-seed
call:
  azure_chat_params:
    function: request_transform
    install:
      model_cost:
        azure/gpt-5.1:
          supports_tool_choice: true
          supports_reasoning: true
          supports_none_reasoning_effort: true
          default_reasoning_effort: none
      chat_models: [azure/gpt-5.1]
      text_models: []
      drop_params: false
      openai_system_messages_first: true
    steps:
      - model: gpt5_series/gpt-5.1
        messages:
          - {role: user, content: hi}
          - {role: system, content: be brief}
        tools:
          - type: function
            function:
              name: f
              parameters:
                type: object
                properties:
                  a: {type: string, pattern: '\p{L}'}
        tool_choice: auto
        reasoning_effort: high
env: {}
compare: {ignore: []}
