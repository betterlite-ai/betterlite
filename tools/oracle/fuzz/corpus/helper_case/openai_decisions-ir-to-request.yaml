kind: helper
name: openai-decisions-ir-to-request
call:
  openai_decisions:
    ir_to_request:
      - model: gpt-4o
        request:
          input: {state: "the input"}
          questions:
            - predicate: {name: truth, instructions: "is it true?"}
            - choice:
                name: pick
                instructions: pick
                choices:
                  - {value: a}
                  - {value: b}
env: {}
compare: {ignore: []}
