kind: helper
name: soniox-remote-seed
call:
  soniox_remote:
    calls:
    - function: upload
      auth_headers: {Authorization: "Bearer sk-local", x-client: suite}
      api_base: "https://api.soniox.test"
      filename: audio.mp3
      content: "RIFF-data"
      content_type: audio/mpeg
      filename_override: null
      timeout_ms: 2500
      answers:
      - {status: 200, headers: {}, body: '{"id": "file-123"}'}
    - function: poll
      auth_headers: {Authorization: "Bearer sk-local"}
      api_base: "https://api.soniox.test"
      transcription_id: job-7
      poll_interval: 0.5
      max_attempts: 2
      timeout_ms: 2500
      answers:
      - {status: 200, headers: {}, body: '{"status": "processing"}'}
      - {status: 200, headers: {}, body: '{"status": "completed", "text": "hi"}'}
    - function: cleanup
      auth_headers: {Authorization: "Bearer sk-local"}
      api_base: "https://api.soniox.test"
      cleanup: [transcription, file]
      transcription_id: job-7
      file_id: file-123
      timeout_ms: 2500
      answers:
      - {status: 204, headers: {}, body: '', fail: true}
      - {status: 204, headers: {}, body: ''}
compare: {ignore: []}
env: {}
