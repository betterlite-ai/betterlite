kind: helper
name: json-chat-policy-identity-seed
call:
  json_chat_policy:
    calls:
      - kind: identity
        model: publicai/swiss-ai/apertus-8b-instruct
        environment: {PUBLICAI_API_KEY: sk-env}
      - kind: identity
        model: publicai/swiss-ai/apertus-8b-instruct
        environment: {PUBLICAI_API_BASE: "https://env.invalid/v1"}
        api_key: sk-explicit
        api_base: "https://explicit.invalid/v1"
env: {}
compare: {ignore: []}
