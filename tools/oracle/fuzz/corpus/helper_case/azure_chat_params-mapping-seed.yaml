kind: helper
name: azure-chat-params-mapping-seed
call:
  azure_chat_params:
    function: parameter_mapping
    install:
      model_cost:
        azure/gpt-5.1:
          supports_tool_choice: true
          supports_reasoning: true
          supports_none_reasoning_effort: true
          default_reasoning_effort: none
      chat_models: [azure/gpt-5.1]
      text_models: []
      drop_params: false
      openai_system_messages_first: false
    steps:
      - model: gpt5_series/gpt-5.1
        non_default: {reasoning_effort: none}
        optional: {}
        drop_params: false
        global_drop_params: false
      - model: gpt5_series/gpt-5.3
        non_default: {reasoning_effort: none}
        optional: {}
        drop_params: true
        global_drop_params: false
env: {}
compare: {ignore: []}
