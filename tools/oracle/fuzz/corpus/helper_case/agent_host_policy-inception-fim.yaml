kind: helper
name: inception-fim-suffix-and-limit-order
call:
  agent_host_policy:
    scenarios:
      - environment: {}
        calls:
          - {op: fim_supported}
          - {op: fim_params, params: {suffix: null, max_tokens: 7, top_p: 0, stop: [a], stream: true}}
          - {op: fim_params, params: {max_completion_tokens: 5}}
          - {op: fim_params, params: {max_tokens: 7, max_completion_tokens: 5}}
          - {op: fim_params, params: {max_completion_tokens: 5, max_tokens: 7}}
          - {op: fim_params, params: {unsupported: 1, frequency_penalty: 0.5}}
env: {}
compare: {ignore: []}
