kind: helper
name: mcp-connector-import-stdio
call:
  b4716:
    function: convert_connectors
    connectors:
      mcpServers:
        test-tools:
          command: npx
          args: [-y, pkg]
          env:
            TOKEN: test-token
    stdio:
      enabled: true
      allowed_commands: [deno, docker, node, npx, python, python3, uvx]
calls:
  - b4716:
      function: convert_connectors
      connectors:
        mcpServers:
          test-bad:
            command: npx
            args: []
      stdio:
        enabled: true
        allowed_commands: [deno, docker, node, npx, python, python3, uvx]
env:
  LITELLM_ENABLE_MCP_STDIO: "true"
compare: {ignore: []}
