kind: helper
name: sap-credentials-token-seed
call:
  b5950:
    function: token
    credentials:
      client_id: c
      client_secret: s
      auth_url: https://auth.example.com/oauth/token
      base_url: https://api.example.com/v2
      resource_group: default
    responses:
      - '{"access_token": "one"}'
      - '{"access_token": "two"}'
    times:
      - 1700000000
      - 1700000001
env: {}
compare: {ignore: []}
