kind: helper
name: cleanup-bounds-corpus-seed
call:
  cleanup_bounds:
    general_settings:
      maximum_spend_logs_cleanup_batch_size: "250"
      maximum_spend_logs_cleanup_run_budget: 10m
      maximum_spend_logs_retention_period: 30d
    retention:
      - maximum_spend_logs_retention_period
    now_ms: 1000
    deadlines_ms: [2500]
    groups:
      - {overall_ms: 9000, groups: 2}
    timestamps:
      - "2026-01-02T00:00:00Z"
    days:
      - "2026-01-01"
calls:
  - cleanup_bounds:
      general_settings:
        maximum_spend_logs_cleanup_max_batches: [1]
        maximum_spend_logs_cleanup_batch_timeout: 30
        maximum_health_check_retention_period: forever
      retention:
        - maximum_health_check_retention_period
      now_ms: 0
      deadlines_ms: [0]
      groups: []
      timestamps: []
      days: []
env: {}
compare: {ignore: []}
