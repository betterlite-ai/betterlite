kind: helper
name: auth-pricing-seed
call:
  auth_pricing:
    calls:
      - function: zero_cost
        router:
          groups:
            free: {input: 0.0, output: 0.0}
          deployments:
            free:
              - model_info: {id: dep-free}
          costs:
            dep-free: {input_cost_per_token: 0.0, output_cost_per_token: 0.0}
          cache: {}
        model: free
      - function: request_checks
        router:
          cache: {}
        route: /chat/completions
        method: POST
        body: {}
        enforce: true
      - function: project
        router:
          cache: {}
        route: /chat/completions
        project:
          project_id: proj-seed
          spend: 6.0
          litellm_budget_table: {max_budget: 10.0, soft_budget: 5.0}
        token: {token: sk-seed, user_id: user-seed, team_id: team-seed}
        spends: [10.0]
env: {}
compare:
  ignore: []
