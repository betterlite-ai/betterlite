kind: helper
name: empty-key-and-header-override
call:
  codestral_plan:
    calls:
      - mode: sync
        api_key: null
        model: codestral-latest
        messages: [{role: user, content: write}]
        timeout: 12.5
      - mode: sync
        api_key: sk-codestral
        model: codestral-latest
        messages: [{role: user, content: write}]
        headers: {Authorization: "Bearer caller", X-Trace: abc}
        timeout: 12.5
env: {}
compare: {ignore: []}
