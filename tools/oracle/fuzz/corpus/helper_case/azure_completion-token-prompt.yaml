kind: helper
name: azure_completion-token-prompt-seed
call:
  azure_completion:
    function: completion
    cases:
      - model: gpt-35-turbo-instruct
        messages: [{role: user, content: Hello}]
        api_key: sk-unit
        api_base: https://unit.test
        api_version: "2024-02-01"
        optional_params: {temperature: 0, max_tokens: 1}
env: {}
compare: {ignore: []}
