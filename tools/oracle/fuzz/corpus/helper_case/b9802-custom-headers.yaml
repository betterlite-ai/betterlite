kind: helper
name: b9802-custom-headers-corpus-seed
call:
  b9802:
    key:
      tpm_limit: 20
      rpm_limit: 2
      max_budget: 5.0
      spend: 0.5
      allowed_model_region: eu
    call_id: call-seed
    model_id: model-seed
    cache_key: cache-seed
    api_base: "https://api.example/v1?key=seed"
    version: "0.1.0"
    model_region: eu
    response_cost: 0.002
    hidden_params:
      litellm_call_id: hidden-seed
      callback_duration_ms: 3.5
      _response_ms: 40.0
      litellm_overhead_time_ms: 2.0
    fastest_response_batch_completion: false
    request_data:
      metadata:
        model_group: "seed/group:one"
        "litellm-key-remaining-requests-seed/group:one": 3
        applied_guardrails: ["seed-guardrail"]
    timeout: 15.0
    logging:
      cost_breakdown:
        input_cost: 0.001
        output_cost: 0.001
      call_type: completion
      litellm_params:
        litellm_metadata:
          deployment: seed/deployment
      response_timing_metrics:
        _response_ms: 41.0
    read_timing_from_logging: true
    extra:
      - ["x-seed", "1"]
env: {}
compare: {ignore: []}
