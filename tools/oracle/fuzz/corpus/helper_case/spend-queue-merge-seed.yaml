kind: helper
name: spend-queue-merge-seed
call:
  spend_queue_merge:
    steps:
      entities:
        kind: entity_transactions
        updates:
          - {entity_type: user, entity_id: user-1, response_cost: 1.5}
          - {entity_type: user, entity_id: user-1, response_cost: 2.5}
          - {entity_id: orphan, response_cost: 1}
      daily:
        kind: daily
        updates:
          - row:
              spend: 1.0
              prompt_tokens: 1
              completion_tokens: 1
              api_requests: 1
              successful_requests: 1
              failed_requests: 0
              timed_requests: null
env: {}
compare: {ignore: []}
