kind: helper
name: deepgram-transcription-seed
call:
  deepgram_transcription:
    env: {DEEPGRAM_API_KEY: seed-key}
    steps:
    - {step: request, audio: tuple, filename: clip.wav, content: seed audio}
    - step: url
      model: nova-3
      api_base: null
      options: {diarize: true, punctuate: false}
    - {step: auth, api_key: null}
    - step: reply
      body: '{"metadata": {"duration": 2}, "results": {"channels": [{"alternatives": [{"transcript": "flat", "words": [{"word": "hi", "start": 0, "end": 1, "speaker": 0}]}]}]}}'
    - step: error_class
      message: invalid audio
      status_code: 401
      headers: {x-request-id: req-1}
compare: {ignore: []}
env: {}
