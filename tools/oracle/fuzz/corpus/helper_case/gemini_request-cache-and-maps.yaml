kind: helper
name: gemini-request-cache-and-maps
call:
  gemini_request:
    cases:
      - model: gemini-2.5-pro
        provider: vertex_ai
        supports: {system_message: true, response_schema: true}
        modify_params: false
        messages:
          - {role: system, content: rules}
          - {role: user, content: hi}
        optional_params:
          cached_content: cached-1
          tools: [{googleSearch: {}}]
        litellm_params: {}
      - model: gemini-2.5-pro
        provider: gemini
        supports: {system_message: true, response_schema: true}
        modify_params: true
        messages:
          - {role: user, content: "weather in Paris?"}
        optional_params:
          response_mime_type: application/json
          response_schema: {type: object}
          extra_body:
            tools: [{googleMaps: {}}]
        litellm_params: {litellm_param_vertex_project: demo}
env: {}
compare: {ignore: []}
