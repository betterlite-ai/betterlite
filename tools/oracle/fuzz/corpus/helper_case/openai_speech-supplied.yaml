kind: helper
name: openai-speech-seed-supplied
call:
  openai_speech:
    client: {api_key: sk-seed, timeout: 30, max_retries: 5, organization: org-seed, supplied: sync}
    request: {model: tts-1, input: seed, voice: echo, instructions: quiet}
    reply: {status: 200, headers: [[content-type, audio/mpeg]], chunks: [[4, 5]]}
env: {}
compare: {ignore: []}
