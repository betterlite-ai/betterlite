kind: helper
name: token_count-custom-seed
call:
  token_count:
    function: token_counter
    model: gpt-4o
    text: hello world hello
    chunk_size_chars: 1
    custom_tokenizer:
      type: huggingface_tokenizer
      tokenizer_json: |-
        {"version":"1.0","truncation":null,"padding":null,"added_tokens":[],"normalizer":null,"pre_tokenizer":{"type":"Whitespace"},"post_processor":null,"decoder":null,"model":{"type":"WordLevel","vocab":{"[UNK]":0,"hello":1,"world":2},"unk_token":"[UNK]"}}
env:
  TIKTOKEN_ENCODE_CHUNK_SIZE_CHARS: "1"
compare: {ignore: []}
