kind: helper
name: openai-decisions-ir-to-response
call:
  openai_decisions:
    ir_to_response:
      - requested_model: requested-model
        request:
          input: {state: "the input"}
          questions:
            - predicate: {name: truth, instructions: "is it true?"}
        response:
          model: null
          answers:
            - predicate: {probability: 0.5}
          usage: {input_tokens: 1, output_tokens: 2}
env: {}
compare: {ignore: []}
