kind: helper
name: aws-secrets-seed
env: {}
compare: {ignore: []}
call:
  b4415:
    env:
      AWS_ACCESS_KEY_ID: AKIAORACLEEXAMPLE
      AWS_SECRET_ACCESS_KEY: oracle-secret-key
      AWS_REGION_NAME: us-east-1
    manager: {replica_regions: [us-west-2], kms_key_id: alias/gateway}
    routes:
      - route: "POST https://secretsmanager.us-east-1.amazonaws.com"
        replies:
          - {status: 200, body: '{"ARN":"arn:seeded"}'}
          - {status: 200, body: '{"ARN":"arn:seeded","ReplicationStatus":[]}'}
          - {status: 200, body: '{"ARN":"arn:deleted","DeletionDate":1}'}
    steps:
      - {op: async_write_secret, name: prod/db, value: s3cr3t, description: seeded, tags: {Environment: Prod}}
      - {op: async_delete_secret, name: prod/db}
      - {op: async_replicate_secret, name: prod/db, regions: [us-west-2]}
