kind: helper
name: foundry-credentials-settings-seed
call:
  foundry_credentials:
    settings:
      - api_base: https://seed.example
        api_key: seed-key
        environment: {AZURE_AI_API_BASE: https://seed-env.example, AZURE_AI_API_KEY: seed-env-key}
      - params: {azure_ad_token: seed-token}
env: {}
compare: {ignore: []}
