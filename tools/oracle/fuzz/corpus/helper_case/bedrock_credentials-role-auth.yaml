kind: helper
name: bedrock-credentials-role-auth-seed
call:
  bedrock_credentials:
    auth_with_aws_role:
      environment: {AWS_ACCESS_KEY_ID: ambient, AWS_SECRET_ACCESS_KEY: ambient-secret}
      files: {/var/run/secrets/token: "irsa-token\n"}
      steps:
        - params:
            aws_role_name: 'arn:aws:iam::123456789012:role/TargetRole'
            aws_session_name: bedrock
            aws_session_tags: [{Key: team, Value: genai}]
      answers:
        assume_role:
          - credentials: {access_key_id: ASIAFIXTURE, secret_access_key: fixture-secret, session_token: fixture-session, expiration: '2026-01-01T01:00:00Z'}
env: {}
compare: {ignore: []}
