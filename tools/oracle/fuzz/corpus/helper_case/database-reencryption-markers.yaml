kind: helper
name: database-reencryption-markers
call:
  database_reencryption:
    op: replace
    value:
      secret: litellm_enc::litellm_enc::inner
      keep: plain
    replacements:
      inner: outer
      litellm_enc::inner: doubled
    depth: 0
    max_depth: 100
env: {}
compare:
  ignore: []
