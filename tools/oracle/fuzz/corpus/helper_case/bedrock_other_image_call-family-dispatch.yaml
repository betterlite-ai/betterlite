kind: helper
name: bedrock-other-image-call-family-dispatch
call:
  bedrock_other_image_call:
    function: image_family_dispatch
    probes:
      - model: amazon.titan-image-generator-v2:0
        prompt: a cat
        credentials: {access_key_id: AKIDEXAMPLE, secret_access_key: secret}
        optional_params: {aws_region_name: us-east-1}
        reply: {body: '{"images": ["aGk="]}'}
env: {}
compare: {ignore: []}
