kind: helper
name: gemini-response-blocked-bypass
call:
  gemini_response:
    model: gemini-2.5-flash
    legacy_function: false
    now: 1700000000
    generated_id: 0123456789abcdef0123456789abcdef
    headers:
      x-gemini-service-tier: priority
    body:
      responseId: ignored
      promptFeedback:
        blockReason: SAFETY
      candidates:
        - content:
            parts:
              - text: filtered answer
          finishReason: STOP
      usageMetadata:
        promptTokenCount: 7
        totalTokenCount: 7
        trafficType: ON_DEMAND
env: {}
compare: {ignore: []}
