        model: sail/any
        environment: {}
      - kind: json_messages_url
        model: poe/probe-model
        environment: {}
        api_base: "https://explicit.invalid/v1/messages"
        descriptor:
          base_url: "https://descriptor.invalid/v1"
          api_key_env: PROBE_KEY
env: {}
compare: {ignore: []}
