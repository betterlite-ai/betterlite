kind: helper
name: bedrock-other-image-edits-error
call:
  bedrock_other_image_edits:
    function: error
    model_cost:
      stability.stable-image-inpaint-v1:0: {output_cost_per_image: 0.07}
    probes:
      - model: stability.stable-image-inpaint-v1:0
        prompt: edit it
        images: [aW1n]
        supplied: sync
        credentials: {access_key_id: AKIDEXAMPLE, secret_access_key: secret}
        optional_params: {aws_access_key_id: AKIDEXAMPLE, aws_secret_access_key: secret, aws_region_name: us-east-1}
        reply: {failure: timeout}
      - model: stability.stable-image-inpaint-v1:0
        images: [aW1n]
        supplied: async
        aimage_edit: true
        credentials: {access_key_id: AKIDEXAMPLE, secret_access_key: secret}
        optional_params: {aws_access_key_id: AKIDEXAMPLE, aws_secret_access_key: secret, aws_region_name: us-east-1}
        reply: {status: 403, body: '{"message": "denied"}'}
env: {}
compare: {ignore: []}
