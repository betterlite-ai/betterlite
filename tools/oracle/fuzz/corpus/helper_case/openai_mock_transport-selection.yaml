kind: helper
name: openai-mock-transport-seed-selection
call:
  openai_mock_transport:
    case: mock_selection
    scenarios:
      - kind: async
        network_mock: false
        client_session_supplied: false
        shared_session_supplied: false
      - kind: async
        network_mock: true
        client_session_supplied: false
        shared_session_supplied: true
      - kind: sync
        network_mock: true
        client_session_supplied: true
        shared_session_supplied: false
env: {}
compare:
  ignore: []
