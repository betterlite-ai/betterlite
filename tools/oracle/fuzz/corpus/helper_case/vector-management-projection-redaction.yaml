kind: helper
name: vector-management-projection-redaction-seed
call:
  vector_management_projection:
    op: redact_vector_credentials
    litellm_params:
      api_key: sk-seed-value
      connection_string: postgres://user:pass@example.test/db
      vertex_credentials: {}
      litellm_embedding_config:
        api_key: sk-embedding
      api_base: https://example.test/v1
      max_tokens: 256
      input_cost_per_token: 0.0001
    depth: 0
calls:
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params:
        a:
          b: plain
      depth: 9
  - vector_management_projection:
      op: redact_vector_credentials
      litellm_params:
        - us-east-1
        - 3
      depth: 0
env: {}
compare: {ignore: []}
