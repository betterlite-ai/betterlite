kind: helper
name: audio-subtitles-seed-rendering
call:
  audio_subtitles:
    calls:
      - {function: group, tokens: [{text: "Hel", start_ms: 0}, {text: "lo", end_ms: 1000}]}
      - {function: srt, tokens: [{text: "Hel", start_ms: 0}, {text: "lo", end_ms: 1000}]}
      - {function: vtt, tokens: [{text: "X", start_ms: -1, end_ms: -2}]}
      - {function: srt, tokens: [{text: "A. ", start_ms: 0, end_ms: 100}, {text: " B", start_ms: 200, end_ms: 300}]}
      - {function: group, tokens: [{text: "a ", start_ms: 0, end_ms: 1000}, {text: "b", start_ms: 1700, end_ms: 2000}]}
      - {function: group, tokens: [{text: "你", start_ms: 0, end_ms: 100}, {text: "好", start_ms: 100, end_ms: 200}]}
env: {}
compare: {ignore: []}
