kind: helper
name: key-attribution-cli-and-digest
call:
  key_attribution:
    digest_values: ['0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef', 'short']
    cli_keys: [cli-session-u1, cli-session-missing]
    double_hashed_keys: ['1111111111111111111111111111111111111111111111111111111111111111']
    daily_keys: [agree]
    users:
      - {user_id: u1, user_email: u1@example.com, teams: [team-a]}
    active_token_rows:
      - {digest: '1111111111111111111111111111111111111111111111111111111111111111', key_alias: active-alias, team_id: null, user_id: u1}
    deleted_token_rows: []
    daily_owner_rows:
      - {api_key: agree, first_owner: u1, last_owner: u1}
    attach_metadata:
      cli-session-u1: {user_id: u1}
    export_rows:
      - {api_key: cli-session-u1, api_key_alias: '', team_id: null, user_email: ''}
    export_fields: {api_key: api_key, alias: api_key_alias, team_id: team_id, user_email: user_email}
env: {}
compare: {ignore: []}
