kind: helper
name: openai-speech-seed-chunks
call:
  openai_speech:
    client: {api_key: sk-seed, api_base: 'https://speech.test/v1', timeout: 30, max_retries: 2}
    request: {model: tts-1, input: seed, voice: alloy, extra_headers: {x-seed: 'yes'}}
    reply: {status: 200, headers: [[content-type, audio/wav]], chunks: [[0], [255, 1], [2]]}
env: {}
compare: {ignore: []}
