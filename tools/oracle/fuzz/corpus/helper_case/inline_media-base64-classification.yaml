kind: helper
name: inline-media-base64-classification
call:
  inline_media:
    call: is_base64_encoded
    values:
      - "data:image/png;base64,YWJj"
      - "data:image/png;base64,"
      - "YWJj"
      - "data:image/png;base64,!!!bad"
      - "data:image/png;base64,YR=="
      - "data:text/plain;base64,YQ=="
      - "data:text/plain;base64,YWJj,ignored"
      - "data:text/plain,YQ=="
      - "data:image/png;base64"
      - "DATA:image/png;base64,YWJj"
env: {}
compare:
  ignore: []
