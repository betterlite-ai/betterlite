kind: helper
name: voxtral-speech-audio-data-and-header-rebuild
call:
  voxtral_speech:
    probes:
      - {voice: alloy, optional_params: {response_format: wav}}
      - {voice: unknown-Voice, optional_params: {response_format: mp3}}
      - {voice: {voice_id: "", name: FLAC}, optional_params: {response_format: flac}}
      - {voice: {voice_id: null, id: "  "}}
env: {}
compare: {ignore: []}
