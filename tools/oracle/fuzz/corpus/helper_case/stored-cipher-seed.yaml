kind: helper
name: fuzz-seed
call:
  stored_cipher:
    op: codec
    salt_key: salt-one
    master_key: null
    general_settings: {encryption_algorithm: AES-256-GCM}
    nonce_hex: "000102030405060708090a0b0c0d0e0f1011121314151617"
    steps:
      - {kind: encrypt_value, value: hello, new_key: null}
