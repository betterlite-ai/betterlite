      - {kind: decrypt_with, value: "*", signing_key: salt-one}
      - {kind: decrypt_bearer, value: "litellm_login_AAECAwQFBgcICQoLo1nHfnhTvgR3dDrQSldam-gVqoGVzw8", prefix: litellm_login_}
      - {kind: decode_map, value: " {\"a\":\"1\"}", field: headers}
env: {}
compare:
  ignore: []
