kind: helper
name: history-attribution-cache-key-and-projection
call:
  history_attribution:
    keys:
      - '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      - 'hashed-jwt-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      - 'hashed-jwt-hashed-jwt-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      - 'short'
    windows:
      - {digest: 'hashed-jwt-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef', start: '2026-03-04T05:06:07.000008', end: '2026-03-05T00:00:00'}
    rows:
      - {digest: mixed, first_alias: old, last_alias: new, first_team: team, last_team: team, first_owner: null, last_owner: owner}
env: {}
compare: {ignore: []}
