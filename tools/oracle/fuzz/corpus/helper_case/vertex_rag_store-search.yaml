kind: helper
name: vertex-rag-store-search-seed
call:
  vertex_rag_store:
    calls:
      - function: search
        vector_store_id: corpus
        query: [seed, query]
        api_base: https://us-central1-aiplatform.googleapis.com/v1/projects/p/locations/us-central1
        litellm_params: {vertex_project: p, vertex_location: us-central1}
        optional_params: {max_num_results: 2, ranking_options: {rank: high}}
        response:
          status: 200
          body: '{"contexts":{"contexts":[{"text":"chunk","sourceDisplayName":"doc"}]}}'
env: {}
compare: {ignore: []}
