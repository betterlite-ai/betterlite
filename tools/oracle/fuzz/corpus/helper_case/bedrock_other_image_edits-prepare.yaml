kind: helper
name: bedrock-other-image-edits-prepare
call:
  bedrock_other_image_edits:
    function: prepare
    model_cost:
      stability.stable-image-inpaint-v1:0: {litellm_provider: bedrock, output_cost_per_image: 0.07}
    probes:
      - model: stability.stable-image-inpaint-v1:0
        prompt: edit it
        images: [aW1n]
        supplied: sync
        credentials: {access_key_id: AKIDEXAMPLE, secret_access_key: secret}
        optional_params: {aws_access_key_id: AKIDEXAMPLE, aws_secret_access_key: secret, aws_region_name: us-east-1, seed: 3}
        reply: {body: '{"images": ["eA=="]}'}
env: {}
compare: {ignore: []}
