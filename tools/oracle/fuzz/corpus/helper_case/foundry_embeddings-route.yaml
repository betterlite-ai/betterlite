kind: helper
name: foundry-embeddings-route-seed
call:
  foundry_embeddings:
    flows:
      - mode: sync
        model: offer-cohere-embed-english-paygo
        input: ['data:image/png;base64,AAAA']
        options: {}
        api_base: https://acct.services.ai.azure.com/v1
        api_key: seed-key
        timeout: 5
        image_reply: {status: 200, headers: [], body: '{"object":"list","data":[{"object":"embedding","index":0,"embedding":[0.1]}],"model":"image-model"}'}
        text_reply: {status: 200, headers: [], body: '{"object":"list","data":[],"model":"text-model","usage":{"prompt_tokens":0,"completion_tokens":0,"total_tokens":0}}'}
        client: none
env: {}
compare: {ignore: []}
