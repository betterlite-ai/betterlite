kind: helper
name: openai-files-upload-purpose
call:
  openai_files:
    action: create_file
    client: {api_key: sk-files, api_base: 'https://files.test/v1', organization: org-1, timeout: 45, max_retries: 3, supplied: null, is_async: true}
    request:
      purpose: fine-tune
      filename: train.jsonl
      content_type: application/jsonl
      data: "{\"a\":1}\n"
      expires_after: 3600
      extra_headers: {x-trace: abc}
      extra_body: {note: hello}
      timeout: 30
    reply:
      status: 200
      headers: [[content-type, application/json]]
      json: {id: file-abc, object: file, bytes: 8, created_at: 1700000000, filename: train.jsonl, purpose: fine-tune, status: processed}
env: {}
compare: {ignore: []}
