kind: helper
name: auth-org-lookup-fuzz-alias-and-project
call:
  auth_org_lookup:
    function: org_alias
    database: true
    target: acme
    in_memory_ttl: 5.0
    alias_rows:
      - {organization_id: o1, organization_alias: acme, budget_id: b1, created_by: ops, updated_by: ops}
    steps:
      - {now: 100.0, fail: []}
      - {now: 101.0, fail: []}
calls:
  - auth_org_lookup:
      function: org_alias
      database: true
      target: acme
      in_memory_ttl: 5.0
      steps:
        - {now: 100.0, fail: []}
  - auth_org_lookup:
      function: org_alias
      database: true
      target: acme
      in_memory_ttl: 5.0
      alias_rows:
        - {organization_id: o1, organization_alias: acme, budget_id: b1}
        - {organization_id: o2, organization_alias: acme, budget_id: b2}
      steps:
        - {now: 100.0, fail: []}
  - auth_org_lookup:
      function: project_object
      database: true
      target: p1
      in_memory_ttl: 5.0
      project_row:
        project_id: p1
        project_alias: research
        budget_id: b2
        litellm_budget_table: {budget_id: b2, max_budget: 25.0}
      steps:
        - {now: 1234.5, fail: []}
        - {now: 9999.0, fail: []}
  - auth_org_lookup:
      function: project_object
      database: false
      target: p1
      in_memory_ttl: 5.0
      project_row: {project_id: p1, project_alias: research, budget_id: b2}
      steps:
        - {now: 1234.5, fail: []}
env:
  DEFAULT_IN_MEMORY_TTL: "5"
compare: {ignore: []}
