kind: helper
name: openai-output-limits-azure-status
call:
  openai_output_limits:
    azure:
      asynchronous: false
      data: {"model": "gpt-3.5-turbo", "messages": [{"role": "user", "content": "hello world"}]}
      timeout: 2.5
      outcome:
        kind: status
        status: 429
        headers: {"x-ms-request-id": "m2"}
        body:
          error:
            message: "Rate limit reached for requests"
            type: rate_limit_error
            param: null
            code: rate_limit_exceeded
env: {}
compare: {ignore: []}
