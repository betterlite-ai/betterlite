kind: helper
name: resource_delegation_extractors_seed
call:
  resource_delegation:
    function: extract_mcp_servers
    permission: {mcp_servers: ["srv-a", "no-mcp-servers"], mcp_tool_permissions: {"srv-b": []}}
calls:
  - resource_delegation:
      function: extract_search_tools
      permission: {search_tools: ["tool-b", "", "tool-a"]}
  - resource_delegation:
      function: validate_toolsets
      permission: {mcp_toolsets: ["t-a"]}
      team: {team_id: team-1, mcp_toolsets: ["t-a"]}
env: {}
compare: {ignore: []}
