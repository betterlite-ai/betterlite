kind: helper
name: duration_fixed_and_calendar
call:
  duration:
    calls:
      - {function: duration_in_seconds, duration: "30s", now: "2024-01-31T00:00:00Z"}
      - {function: duration_in_seconds, duration: "1mo", now: "2024-01-31T00:00:00Z", timezone: "America/New_York"}
      - {function: duration_in_seconds, duration: "monthly", now: "2024-01-31T00:00:00Z"}
env: {}
compare: {ignore: []}
