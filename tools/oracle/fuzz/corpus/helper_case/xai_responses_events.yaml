kind: helper
name: xai-responses-events-seed
call:
  xai_responses:
    env: {}
    xai_key: seed-key
    generic_key: null
    steps:
      - {step: auth, api_key: null, use_xai_oauth: false, headers: {}, oauth: null}
      - step: event
        event:
          type: response.completed
          response: {id: seed, created_at: 1, output: [], usage: {input_tokens: 1, output_tokens: 1, total_tokens: 2, cost_in_usd_ticks: 1}}
      - {step: capability}
env: {}
compare: {ignore: []}
