kind: helper
name: ollama-model-metadata-seed-origin-auth
call:
  ollama_model_metadata:
    configured_origin_auth:
      model: "ollama/llama3"
      groups:
        - fixture:
            env: {OLLAMA_API_KEY: env-key}
            globals: {api_key: global-key}
            secret_manager_api_key: manager-key
            catalog: []
          queries:
            - {}
            - {api_base: "http://explicit:11434"}
            - {api_base: "http://host:3/api/generate", api_key: explicit-key}
env: {}
compare: {ignore: []}
