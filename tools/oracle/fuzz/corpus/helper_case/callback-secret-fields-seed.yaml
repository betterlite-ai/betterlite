kind: helper
name: fuzz-seed
call:
  callback_secret_fields:
    salt_key: salt-one
    master_key: null
    general_settings: {}
    nonce_hex: "000102030405060708090a0b0c0d0e0f1011121314151617"
    extra: [custom_secret]
    steps:
      - kind: strip
        metadata:
          logging: []
          callback_settings: {callback_vars: {api_key: sk-secret}}
          other: untouched
      - kind: encrypt
        metadata:
          callback_settings: {callback_vars: {api_key: sk-secret}}
      - kind: decrypt
        metadata:
          callback_settings: {callback_vars: {api_key: "litellm_enc::corrupt"}}
      - kind: sensitive
        key: custom_secret
env: {}
compare:
  ignore: []
