kind: helper
name: voxtral-transcription-diarize-and-hidden-segments
call:
  voxtral_transcription:
    probes:
      - model: voxtral-small-latest
        filename: clip.mp3
        content: abc
        optional_params: {diarize: true, language: es}
        non_default_params: {timestamp_granularities: [word]}
        environment_api_key: environment-key
        reply:
          status: 200
          headers: {content-type: application/json}
          body: '{"text":"hola","segments":[{"id":1,"speaker":"A","text":"hola"}],"language":"es"}'
      - model: voxtral-small-latest
        filename: clip.wav
        content: abc
        optional_params: {diarize: false, count: 3}
        environment_api_key: environment-key
        reply:
          status: 200
          headers: {content-type: application/json}
          body: '{"text":null,"extra":5}'
      - model: voxtral-small-latest
        filename: clip.wav
        content: abc
        environment_api_key: environment-key
        reply:
          status: 200
          headers: {content-type: application/json}
          body: '{"text":"hola","segments":null,"language":null}'
      - model: voxtral-small-latest
        filename: clip.wav
        content: abc
        optional_params: {temperature: 0.5}
        non_default_params: {model: other, language: fr, response_format: json}
        environment_api_key: environment-key
        reply:
          status: 429
          headers: {content-type: application/json}
          body: '{"text":"slow"}'
env: {}
compare: {ignore: []}
