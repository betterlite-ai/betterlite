kind: helper
name: full-model-metadata-invalidation-generation
call:
  full_model_metadata:
    fixture:
      model_cost:
        fixture/model: {litellm_provider: openai, mode: chat}
      cache_maxsize: 4
    steps:
      - {op: call, model: fixture/model, custom_llm_provider: openai, parameters: {kind: absent}}
      - {op: replace, key: fixture/model, entry: {litellm_provider: openai, mode: chat}}
      - {op: invalidate}
env: {}
compare: {ignore: []}
