kind: helper
name: vertex-interactions-auth-seed
call:
  vertex_interactions:
    mint: {token: minted-token, project: callback-project}
    calls:
      - {function: headers, litellm_params: {vertex_project: project-1}}
      - {function: headers, headers: {Authorization: "Bearer caller", Content-Type: text/plain, X-Extra: "1"}}
      - {function: identity}
      - {function: url}
env: {}
compare: {ignore: []}
