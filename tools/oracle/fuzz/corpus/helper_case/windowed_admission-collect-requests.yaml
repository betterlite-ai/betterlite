kind: helper
name: windowed-admission-collect-requests-seed
call:
  b3036:
    function: collect
    descriptors:
      - key: api-key
        value: seeded
        rate_limit:
          requests_per_unit: 4
          tokens_per_unit: null
          max_parallel_requests: null
          window_size: null
    skip_tpm_check: false
    window_size: 60
env: {}
compare: {ignore: []}
