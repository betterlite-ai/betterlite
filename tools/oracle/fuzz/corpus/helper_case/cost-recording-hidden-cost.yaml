kind: helper
name: cost-recording-hidden-cost-seed
call:
  cost_recording:
    function: record
    model_cost:
      gpt-4o:
        input_cost_per_token: 0.0000025
        output_cost_per_token: 0.00001
    vertex_location: null
    ptu_cost_attribution: false
    logs:
      - log:
          model: gpt-4o
          call_type: completion
          litellm_params: {}
          optional_params: {}
          details: {custom_llm_provider: openai}
        calls:
          - response:
              kind: typed
              model: gpt-4o
              usage: {prompt_tokens: 10, completion_tokens: 5, total_tokens: 15}
              hidden_params: {response_cost: 0.5}
            calculator: {cost: 0.25}
    hidden_params: null
    cost: null
env: {}
compare: {ignore: []}
