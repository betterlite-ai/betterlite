kind: helper
name: windowed-admission-over-limit-read-only-seed
call:
  b3036:
    function: check_over_limit
    keys_to_fetch:
      - "{api-key:seeded}:window"
      - "{api-key:seeded}:tokens"
    cache_values: [1700000000, 4]
    key_metadata:
      "{api-key:seeded}:window":
        requests_limit: null
        tokens_limit: 4
        window_size: 60
        descriptor_key: api-key
        descriptor_value: seeded
    read_only: true
env: {}
compare: {ignore: []}
