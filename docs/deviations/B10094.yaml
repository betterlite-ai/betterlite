  - what: Both variables are read when the config loads, and the wiring builds its lists once at startup, so a value that arrives later through environment_variables stored in the database applies after a restart. LiteLLM reads them on every redirect check, so the same change applies at once there.
    why: rules.yaml keeps environment reads in betterlite-config and forbids reading the environment per request; the allowlists are deployment settings that change with a rollout.
