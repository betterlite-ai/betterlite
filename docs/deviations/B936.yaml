task: B936
deviations:
  - what: A failed background worker stores a bounded, redacted message in error.message while keeping status=failed, type=internal_error and code=background_streaming_error; LiteLLM stores str(e) unchanged.
    why: B184/B187 keep exception dumps, provider bodies and header values out of cached public responses, and the task states this deviation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/background_streaming.py#L414-L427
  - what: A body-iterator chunk larger than B1087's per-event byte bound fails the polling record with the failed status and code; LiteLLM decodes and parses a chunk of any size.
    why: B1087 bounds the bytes every decoder reads, so the frame decoder refuses an oversized chunk instead of letting one provider event grow the cache record without limit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/background_streaming.py#L226-L229
  - what: A terminal event whose response.status is not a string fails the polling record as an invalid event shape; LiteLLM stores the raw JSON value as the status and later reads echo a number or object where ResponsesAPIStatus declares a string.
    why: docs/compatibility.md reads a value of the wrong type as an error that names the field, and status has a declared string type.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/background_streaming.py#L331-L335
  - what: Every record the worker writes, including the failure record's bounded error message, is measured the way the store will re-encode it, meaning the owner/response envelope, every queued field, the patched values and the accumulated text, by bytes and by every member and element, and the text counts even when it sits at a content index with no part; a record past a bound is not written, so the last decodable record stays, the flush or final write fails the record with status=failed, and a failure write that does not fit propagates its error. LiteLLM appends them to the cached record without a bound.
    why: B1087 bounds every record the polling store reads by its whole encoded bytes and by every member and element, so a record accepted on its values alone would fail every later polling GET; the worker measures the record the store will actually persist.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/background_streaming.py#L245-L274
kept_bugs:
  - what: A response.output_text.delta with a negative content_index updates its text into an existing part from the end of the list, so index -1 writes the last part even though the event type declares a nonnegative index; an index below the list start fails the record and a positive index past the end only marks the state dirty.
    why: The task requires this indexing behavior, and a provider or proxy that sends -1 already relies on the cached text landing in its last part.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/response_polling/background_streaming.py#L276-L284
