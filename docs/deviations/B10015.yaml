task: B10015
deviations: []
kept_bugs:
  - what: A literal nonempty string such as "false" in general_settings.disable_key_generate_for_org_admin disables key generation for org admins, because LiteLLM tests the raw value's truthiness instead of reading a boolean. A value written as an os.environ/ reference follows docs/compatibility.md instead, where its resolved text goes through the shared env parser.
    why: The setting reaches the guard as whatever the runtime settings map holds, and a config that quoted the value keeps refusing org admins the way a working LiteLLM proxy does; betterlite reads the same Python truthiness through its config section, while an env reference is a bool field like any other.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/rbac_utils.py#L90-L95
