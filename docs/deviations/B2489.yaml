task: B2489
deviations:
  - what: >-
      A nonempty assistant_settings mapping without litellm_params fails the config load with a
      missing-field error naming litellm_params, and a litellm_params key whose value is null is
      reported the same way.
    why: >-
      LiteLLM's proxy startup reads assistant_settings["litellm_params"] and crashes with a
      KeyError, or with an AttributeError when the key is null, before any router exists. A
      configuration that can start in LiteLLM always carries the key, so betterlite reports the
      same broken mapping as a typed config error instead of reproducing the crash.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6932-L6941
  - what: >-
      A "client" key inside the assistant body's JSON is not forwarded to the installed wrapper;
      the supplied client comes only from the typed AssistantRequest.client field.
    why: >-
      The JSON body's declared fields are the route's documented parameters, and client is not one
      of them. LiteLLM passes **data through, so a body client key would bind the wrapper's client
      argument; betterlite keeps the client argument out of the body's type domain, as
      docs/compatibility.md allows for values outside the declared type.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L7175-L7191
  - what: >-
      A supplied client reaches create_assistant, list_assistants, delete_assistant,
      create_thread, get_thread and run_thread, but not create_message or list_messages: the
      message owner takes no supplied client, so those calls use the request's own api_base,
      api_key and api_version.
    why: >-
      LiteLLM hands the client argument to a_add_message and aget_messages, and both forward it to
      the openai or azure assistants API, where the client's own endpoint and key win. betterlite's
      message owner (B1057) has no supplied-client input and this task's scope does not reach it; a
      test pins the current behavior so the deviation is revisited when B1057 takes the client.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L848
  - what: >-
      A delete call without the assistant_id raises the interpreter's TypeError with the sync
      delete_assistant() wording. LiteLLM's adelete_assistant catches that same TypeError inside
      its executor and re-raises it through exception_type as an APIConnectionError.
    why: >-
      The HTTP route always passes the path id, so no proxy request reaches this input and no
      working setup can rely on the wrapped error. betterlite keeps the interpreter's own error
      for a typed call whose request omits an id the route's type makes required, instead of
      emulating the async wrapper's exception mapping.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L374-L407
