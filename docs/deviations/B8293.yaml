task: B8293
deviations:
  - what: A bad prompt entry stops startup with a typed error that names the entry index. LiteLLM lets the pydantic ValidationError escape from the config load.
    why: Same outcome, the proxy does not start, and the error names the entry without quoting its value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/init_prompts.py#L10-L28
  - what: config_file_path is passed on to initialize_prompt and not read here.
    why: LiteLLM's initialize_prompt does not read it either at the pin.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_registry.py#L185-L215
  - what: A prompts value that is not a list, or an entry that is not a mapping, is a config error naming the key. LiteLLM fails later with a TypeError or a validation error.
    why: A 4xx-style startup refusal that names the key replaces an unhandled exception.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7027-L7034
  - what: The os.environ walk over prompt entries stops at a fixed 100 levels, ignores DEFAULT_MAX_RECURSE_DEPTH and logs no warning when it stops.
    why: B3662's guardrail walk fixed the same cap without a warning, and no working prompt config nests anywhere near it; the cap only guards against a runaway config.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L85
