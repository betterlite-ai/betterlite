task: B3194
deviations:
  - what: >-
      The three public hubs read their inputs from ResourceHubsState, injected when the app builds the routes, instead of
      from LiteLLM's module globals: global_agent_registry, litellm.public_agent_groups, global_mcp_server_manager,
      litellm.public_mcp_servers, litellm.public_mcp_hub_strict_whitelist, the per-request prisma client and its plugin
      table.
    why: >-
      betterlite keeps no module-level state; the group store, the MCP registry and its public list come from the config
      sections B9997 and B4721 own, and the plugin table is a port over the same LiteLLM_ClaudeCodePluginTable rows, so
      the request answers the same JSON.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_endpoints.py#L273-L295
  - what: >-
      The plugin table is read through a typed port with the same WHERE clause (enabled = TRUE) and row decode, not
      through ClaudeCodePluginRepository(prisma_client).table built per request.
    why: >-
      The port is what the write routes of B1140 already use for this table, and it keeps the hub's database access one
      seam the tests can replace; the SQL and the selected columns are copied from LiteLLM's list of enabled plugins.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_endpoints.py#L322-L361
  - what: >-
      A failing hub answers 500 with betterlite's own text in the body: the skill hub's manifest and table failures use
      {"detail": "<text>"} with the Message of betterlite's typed error, where LiteLLM puts str(JSONDecodeError) or the
      prisma exception text in the same field.
    why: >-
      The status, the body shape and the null type/param/code fields match; the exception text is a detail of Python's
      json and prisma decoders that no Rust decoder reproduces, and no caller can branch on it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/public_endpoints/public_endpoints.py#L359-L361
  - what: >-
      An agent card whose declared-required key is present but null is emitted without that key, while LiteLLM's pydantic
      response_model refuses the null and answers 500.
    why: >-
      betterlite's AgentCard parses the nine required keys as nullable with unwrap_or_skip, so a null reads as absent;
      a working agent card never sends one, and the missing-key case (a total=False TypedDict for LiteLLM) already
      matches by omitting the key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L143-L180
