task: B3652
deviations:
  - what: An uploaded short-audio file is measured only when it is a WAV container inside the decoder's bounds; a FLAC, OGG or MP3 upload, or one past 64 MiB, 33,177,600,000 frames or 384 kHz, adds no uploaded seconds, where LiteLLM reports its duration through soundfile.
    why: The handler measures the upload with betterlite's bounded native decoder (B1001), which reads the WAV container only and refuses an input past those limits, so outside them the recognized ticks alone decide the billed duration.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/audio_utils/utils.py#L323-L327
  - what: An Offset, Duration or durationMilliseconds value beyond 79228162514264337593543950335, or a tick total beyond it, logs an error and returns the uncosted fallback payload, where LiteLLM adds its arbitrary-precision integers and bills the result.
    why: Billed durations and money are rust_decimal values whose mantissa stops at 96 bits, so a tick count no decimal can hold has no response cost to log.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/azure_speech_passthrough_logging_handler.py#L50-L57
  - what: Billed durations and response costs are exact decimal values, where LiteLLM divides its tick counts into a binary float and multiplies the price in floats.
    why: Durations and money are rust_decimal values in betterlite, so a duration of 1234567 ticks is 0.1234567 exactly and a cost carries the rate's own digits instead of the float that 0.0000001 * duration rounds to.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/azure_speech_passthrough_logging_handler.py#L50-L57
