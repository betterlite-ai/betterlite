task: B4320
deviations:
  - what: Azure credentials are represented as a refresh-aware credential selection in betterlite-config; token acquisition remains with the Azure SDK integration layer.
    why: The config crate cannot depend on the Python azure-identity SDK, while preserving the selected Default, Managed Identity, or Client Secret mode for runtime consumers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis_credential_provider.py#L203-L229
  - what: GCP IAM tokens are represented by a typed 3300-second cache contract rather than generated in the config crate.
    why: Network token generation belongs to the Redis runtime integration; config resolution remains deterministic and secret-safe.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis_credential_provider.py#L41-L102
  - what: ElastiCacheIamProvider signs the connect URL with aws-sigv4 inside betterlite-config, the same way LiteLLM's ElastiCacheIAMCredentialProvider signs it with botocore's SigV4QueryAuth, but takes the AWS credentials and the timestamp as explicit arguments instead of resolving a live botocore credential chain or the wall clock internally. The AwsCredentialsResolver trait has no implementation that calls AWS; whichever Redis runtime integration opens the connection must supply one.
    why: A credentials_resolver and a clock passed in as arguments keep the signing math itself deterministic and testable without a mock AWS endpoint or real credentials, matching the credentials_resolver constructor argument LiteLLM's own provider already accepts.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis_credential_provider.py#L146-L194
  - what: redis-py's create_gcp_iam_redis_connect_func and create_azure_ad_redis_connect_func send AUTH by hand and catch AuthenticationWrongNumberOfArgsError to fall back to password auth, because redis-py's connection object has no single place for a credential provider on every code path. redis-rs's CredentialProvider trait supplies AUTH the same way for every connection kind, so betterlite has no callback to write and no exception-driven fallback to copy; the GCP password fallback on IAM failure becomes a plain credential choice at config-resolution time instead of a runtime catch.
    why: betterlite picks the credential path once, when provider precedence resolves, instead of attempting IAM and catching a wrong-arity AUTH response on every connection.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L319-L361
  - what: _credential_provider_from_connect_func reads a _gcp_service_account or _azure_credential attribute off a connect-func closure to recover a credential provider for async and cluster connections, because redis-py's sync AUTH callback and its async/cluster credential_provider keyword are two different attachment points. betterlite-config resolves a single Provider value that every connection path reads directly, so there is no callback to translate.
    why: redis-rs takes one CredentialProvider value regardless of connection kind, so the closure-attribute round trip that redis-py needs has no betterlite equivalent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis.py#L775-L791
  - what: LiteLLM raises a pip-install-hinting ImportError when botocore, azure-identity, or google-cloud-iam are missing at call time, since those SDKs are optional runtime dependencies resolved lazily inside the credential functions. betterlite-config depends only on secrecy and url; the calls that would need botocore, azure-identity, or google-cloud-iam belong to the Redis runtime integration that actually opens connections, which is out of this task's scope.
    why: Cargo resolves betterlite's dependencies at build time, so config resolution has no optional-SDK-missing branch to hit; the equivalent message belongs wherever the runtime integration calls those SDKs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_redis_credential_provider.py#L52-L56
