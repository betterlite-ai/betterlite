task: B4839
deviations:
  - what: persist_dir logs a debug message and continues when the linking script exits nonzero.
    why: Retained from the task's declared deviations; this matches LiteLLM's non-fatal handling because cache persistence is optional.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/cli_handler.py#L74-L81
  - what: stop() is a no-op; turn() owns the process and calls kill() on stdin, stream-read, or wait errors, while dropped-stream cleanup belongs to the sandbox.
    why: The turn stream borrows the handler mutably and owns the sandbox-specific process. LocalSandbox (B4832) owns process-group cleanup; the handler does not store a process for stop() to kill.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/cli_handler.py#L152-L155
