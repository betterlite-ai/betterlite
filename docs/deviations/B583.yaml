task: B583
deviations:
  - what: An accumulated JSON value stops with DecodeError::TooLarge once the bytes the iterator has appended since it last produced a value plus the new fragment exceed max_event_bytes, where LiteLLM keeps appending for the rest of the stream. A produced value releases the count, so a buffer holding a produced value's tail can grow by another max_event_bytes before the next stop; the one-payload decode_anthropic_event entry bounds each payload it is handed.
    why: LiteLLM buffers an unterminated value with no limit, so a response that never closes the value grows the process memory until the stream ends; betterlite bounds the buffer with the shared ApiLimits max_event_bytes (1 MiB by default) and reports the overflow as a decode error instead. The iterator keeps a running byte count rather than materializing the buffer, so a fragment the accumulator defers costs its append, as LiteLLM's own append does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L1166-L1174
  - what: 'A buffered value that the accumulated parser can never read, such as a corrupted fragment or data: [DONE], stays at the front of the buffer in LiteLLM, so every later event is dropped and the stream ends without an error; betterlite drops that value with a warning that gives its byte count, then goes on parsing the values behind it.'
    why: 'Keeping the value loses every later event, text and usage included, while dropping it loses only the one value that never parsed. A value that is merely unfinished still accumulates, so a valid event split across transport chunks is unchanged.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L1171-L1174
