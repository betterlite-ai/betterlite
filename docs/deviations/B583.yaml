task: B583
deviations:
  - what: An accumulated JSON value stops with DecodeError::TooLarge once the buffered text plus the new fragment exceeds max_event_bytes, where LiteLLM keeps appending for the rest of the stream.
    why: LiteLLM buffers an unterminated value with no limit, so a response that never closes the value grows the process memory until the stream ends; betterlite bounds the buffer with the shared ApiLimits max_event_bytes (1 MiB by default) and reports the overflow as a decode error instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L1166-L1174
