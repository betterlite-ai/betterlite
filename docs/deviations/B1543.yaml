task: B1543
deviations:
  - what: A Deepgram reply body larger than 16 MiB is refused before it is parsed, and the failure is a transform error.
    why: LiteLLM parses any body the upstream sends, and an unbounded reply lets one upstream response use unlimited memory in the gateway.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepgram/audio_transcription/transformation.py#L79
  - what: A reply body that is not UTF-8 is reported as a byte count, where LiteLLM shows the text decoded with replacement characters.
    why: Clippy bans from_utf8_lossy, and betterlite refuses to mangle bytes that are not UTF-8.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepgram/audio_transcription/transformation.py#L126
  - what: The provider options reach the /listen query in the order the Object of B1122's transcription contract keeps them, which is sorted by name, where LiteLLM keeps the caller's dict order.
    why: The contract hands the adapter an Object rather than the caller's dict, and HTTP gives query parameter order no meaning.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepgram/audio_transcription/transformation.py#L207-L226
