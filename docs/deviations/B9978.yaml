task: B9978
deviations:
  - what: >-
      A malformed response_format (not an object, no type, a json_schema that is not an object or has
      no schema, or a json_schema name or description that is not a string) answers 400, where
      LiteLLM raises KeyError or TypeError, or passes the value on until the Bedrock SDK rejects it,
      and answers 500.
    why: >-
      No working setup relies on a 500 for input the provider path cannot read, and a 400 tells the
      caller the request is at fault.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/converse_transformation.py#L1215-L1226
  - what: >-
      A malformed tool (not an object, a function that is not an object, parameters not an object or
      without a type, a type that is not a string) or tool_choice (a function that is not an object,
      a name that is not a string) answers 400, where LiteLLM raises KeyError, TypeError or
      AttributeError and answers 500.
    why: >-
      The same reason: the request is at fault, and no setup relies on the 500.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/bedrock.py#L296-L322
  - what: >-
      A request whose existing tools value is not a list answers 400, where LiteLLM unpacks that
      value's keys into the tools list and the Bedrock SDK rejects the result later, so the call
      answers 500.
    why: >-
      The same reason: betterlite names the malformed field instead of sending a mangled request.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/chat/transformation.py#L140-L146
