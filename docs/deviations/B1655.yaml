task: B1655
deviations:
  - what: The release feed and its links come from https://api.github.com/repos/betterlite-ai/betterlite/releases/latest instead of https://api.github.com/repos/BerriAI/litellm/releases/latest.
    why: The retained dashboard is rebranded for betterlite, so its upgrade notice has to describe the installed product.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/ui_crud_endpoints/latest_release_endpoints.py#L19
  - what: A release payload that repeats a JSON key is unavailable, while pydantic keeps the last value for that key.
    why: The record is decoded by a derived serde structure, which refuses a duplicate field instead of silently picking one value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/ui_crud_endpoints/latest_release_endpoints.py#L93
  - what: A debug build reads the release source from the config environment variable BETTERLITE_LATEST_RELEASE_URL, and a release build ignores that variable.
    why: The oracle points this fixed remote URL at its mock server; the same configuration in a release build keeps the real endpoint, so no deployment can redirect it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/ui_crud_endpoints/latest_release_endpoints.py#L19
