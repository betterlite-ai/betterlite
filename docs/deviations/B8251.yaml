task: B8251
deviations:
  - what: Each handler uses its own typed cache instead of LiteLLM's one cache keyed by service name.
    why: A typed cache needs no enum of logger kinds and each logger type keeps its own stop effect.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/specialty_caches/dynamic_logging_cache.py#L52-L75
  - what: >-
      A team-scoped Datadog logger is built with the default datadog_params and use_v1 false. LiteLLM's
      DataDogLogger reads the process globals litellm.datadog_params and litellm.datadog_use_v1 in its
      constructor and its sync logging path, so a team logger built there inherits turn_off_message_logging
      and the v1 payload switch.
    why: >-
      betterlite keeps no process globals: B3933's constructor receives these settings as inputs, and this
      handler's inputs are the request's dynamic parameters, the cache, the environment lookup and the
      logger dependencies. The proxy-global Datadog logger is built separately by B8655, which owns those
      settings.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/datadog/datadog.py#L157-L158
