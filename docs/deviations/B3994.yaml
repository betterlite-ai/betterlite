task: B3994
deviations:
  - what: The S3 v2 parameter bag is read from callback_settings.s3_v2; litellm_settings.s3_callback_params loading stays with B002.
    why: The config loader has no litellm_settings.s3_callback_params section, and callback_settings is the project's per-callback parameter surface (B3995 reads aws_sqs the same way). The keys keep LiteLLM's s3_ names; a non-empty s3_config fails the build because the signed transport does not apply a boto client config.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L256-L391
  - what: Only configured s3_aws_access_key_id/s3_aws_secret_access_key/s3_aws_session_token or the AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN variables sign uploads; s3_aws_profile_name, s3_aws_role_name, s3_aws_web_identity_token and s3_aws_sts_endpoint fail the logger build.
    why: Those flows need the boto profile, AssumeRole and web-identity chain, which no logging task implements. Refusing at startup tells the operator instead of signing with the wrong identity or failing every upload.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L346
  - what: The per-flush in-call retry counter and its warning line are not built.
    why: The retries and their logging live inside B3993's transport, which reports only the final delivered, retry or dropped outcome and no attempt count. The failure count S3BatchUploadError reports is unaffected.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L626-L651
  - what: The adaptive concurrency limiter is a local additive-increase gate with B347's transitions and waiter cap instead of B347's AdaptiveConcurrencyLimiter type.
    why: betterlite-router already depends on betterlite-logging through betterlite-tokenizer and betterlite-prompts, so betterlite-logging cannot depend on betterlite-router; the gate keeps the floor, ceiling, clean-streak growth, throttled halving, 1,024-waiter cap and deadline, and the upload path reports every throttled sample through its record.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/adaptive_concurrency.py#L18-L78
  - what: The `_in_flush` context variable is an in-flight flush upload counter on the logger, not a task-local.
    why: tokio's task_local expands to a RefCell, which the repository denies. Every betterlite S3 upload runs through the bounded flush path, so the counter answers the same "is this upload inside a flush" question.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L715-L721
  - what: DEFAULT_S3_BATCH_SIZE and DEFAULT_S3_FLUSH_INTERVAL_SECONDS fall back to 512 and 10 with a warning when they are zero, negative or not an integer.
    why: LiteLLM reads them with a bare int() at import, so text crashes the process and zero or a negative interval makes the periodic flush loop spin without sleeping. The fallback matches how the S3 parameters already read DEFAULT_S3_MAX_CONCURRENT_UPLOADS.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L61-L62
  - what: Each upload waits at most 600 seconds for its concurrency permit, with the fixed semaphore as well as the adaptive limiter, and a flush starts at most the window plus 1,024 uploads at a time. An upload that misses the deadline counts as a retry and stays queued.
    why: The task carries B347's waiter cap and deadline into the flush. Starting uploads in chunks keeps a large flush under the waiter cap, so no upload is refused as overloaded, and the delivered, retry and dropped results are the same as LiteLLM's single gather.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/s3_v2.py#L646-L648
