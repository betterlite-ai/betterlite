task: B2200
deviations:
  - what: >-
      An api_base that is not an absolute URL fails when the route has to be appended, because the
      append runs B668's overlapping_api_base_path port, which parses with the url crate. httpx
      accepts a relative reference there and composes a relative request target.
    why: >-
      A provider endpoint from configuration is an absolute URL, so no working Azure setup sends a
      relative one; the parse of api_base itself already keeps relative references the way httpx does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L10208-L10232
  - what: >-
      A backslash in an api_base path is a segment separator when the route is appended, because
      B668's port uses the url crate there; httpx keeps it as a path character.
    why: >-
      The url crate follows the URL standard for special schemes, where a backslash separates path
      segments. No Azure endpoint contains one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L10210
