task: B521
deviations:
  - what: The OpenAI SDK's implicit retries of 408, 409, 429 and 5xx replies are not repeated. A failed create or poll returns the first status error.
    why: Retry and backoff policy belongs to the shared transport task B173, so this module sends each request once and max_retries is carried on the client but not acted on here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L3119-L3207
