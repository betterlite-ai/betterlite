task: B521
deviations:
  - what: The OpenAI SDK's implicit retries of 408, 409, 429 and 5xx replies are not repeated. A failed create or poll returns the first status error.
    why: Retry and backoff policy belongs to the shared transport task B173, so this module sends each request once and max_retries is carried on the client but not acted on here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L3119-L3207
  - what: A run stream request carries the shared transport's 100-minute ceiling as its total deadline, while the SDK applies the caller's timeout to each read and has no whole-stream deadline.
    why: The outbound deadline is a total request timeout owned by betterlite-http and B173, so this module keeps the caller's timeout off the stream's total deadline and applies it to each chunk read instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L3037-L3069
