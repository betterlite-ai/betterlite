task: B6164
deviations:
  - what: A sampling_rate of 0 never runs a sampled round; only the final round runs. LiteLLM takes the counter modulo the rate, so a rate of 0 raises ZeroDivisionError out of the stream.
    why: A zero rate is a misconfiguration that fails every streamed request in LiteLLM, so no working setup can rely on it. The loop keeps the final-round flush instead of failing the stream.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/unified_guardrail/unified_guardrail.py#L761-L767
