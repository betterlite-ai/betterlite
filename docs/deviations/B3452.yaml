deviations:
  - what: >-
      Byte classification is pure Rust matching the pinned Python byte inspection
      without a live antivirus engine. The EICAR test signature verification is
      compiled into the default scanner, and custom MalwareScanner implementations
      are injected at call sites, never loaded from config or environment.
    why: >-
      This task builds byte inspection and scanner injection, not antivirus
      integration. Production deployment pairs this with a real scanning service
      provided at initialization time.
