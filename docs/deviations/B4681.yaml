task: B4681
deviations:
  - what: The tools column is stored as JSON text and read back as a typed list of MCPToolsetTool; the row type carries the tools as Option<String>.
    why: Rust has no dynamic row value, so the database layer serializes the tools array to JSON when storing and parses it back when retrieving. LiteLLM stores the same json.dumps text in the column and decodes it in _toolset_from_row; the SQL read uses #>> '{}' so a column holding the encoded string and one holding a bare JSON array both decode to the same list.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L73-L80
  - what: An update sends only the fields the caller set, never toolset_id, and a null toolset_name or tools is a no-op while an explicit null description clears it.
    why: The typed UpdateMCPToolsetRequest records absent, null and set for each optional field, which is what model_dump(exclude_unset=True) plus LiteLLM's own filtering expresses; a required name and tool list cannot be cleared, and description stays nullable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L143-L150
  - what: A tools column holding the empty JSON string reads as no tools under LiteLLM and is a typed storage error in betterlite.
    why: LiteLLM's data.get("tools") or [] treats an empty string as absent through Python truthiness, which docs/compatibility.md does not port; a working setup writes json.dumps output, so the empty string only appears in a hand-edited row, and betterlite names the corrupt column instead of silently dropping the tools.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L73-L80
  - what: Listing with use_writer=false answers an empty list after a warning on any storage error, while use_writer=true returns the error.
    why: This copies LiteLLM's graceful degradation for a read replica that is unreachable; the writer path stays fatal so a failed primary read is never mistaken for an empty table.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L113-L121
kept_bugs:
  - what: The reader path of list_mcp_toolsets swallows every exception, not just an unavailable replica, so a broken read answers with an empty toolset list on a proxy that is otherwise up.
    why: A working setup relies on an empty answer rather than a failed request when the replica is unreachable, and narrowing the catch would change what that setup sees on a real read error; the typed filter rules out a malformed query, and the writer path still returns the error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/toolset_db.py#L117-L121
