deviations:
  - what: _failover_excluded_ids keeps each string id once in first-seen order, and a value that is not a list of strings counts as no earlier exclusions.
    why: LiteLLM builds the list from a Python set, so its order changes between runs, and set(value or []) also walks a bare string character by character; a stable list keeps the metadata a spend log records reproducible.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L7220-L7245
