deviations:
  - what: A functionCall part without args projects arguments "{}"; LiteLLM raises KeyError and answers 500, and an explicit null projects "null" there.
    why: args is an optional key of LiteLLM's own HttpxFunctionCall type, so its default is an empty object, and a crash on it is a bug no working setup relies on.
