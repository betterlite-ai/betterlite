task: B358
deviations:
  - what: The tier_data parser refuses artifact bytes over 1048576 before decoding them, where LiteLLM reads and parses an artifact file of any size.
    why: The source has no byte bound at this parser boundary, and bounded-inputs requires a finite limit before allocation; it covers the packaged artifact (99418 bytes), an inline artifact serialized by the oracle and every parser caller, and structural field limits stay unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/tier_predictor.py#L82-L89
  - what: An `os.environ/` reference in a numeric field of an inline `heuristic_v2_artifact` fails the config load, where the proxy resolves the reference to text and pydantic parses that text as a number.
    why: The proxy replaces every `os.environ/` string in the config before model validation, so a numeric statistic can come from the environment today; betterlite reads the inline artifact through its typed wire format, where a text-or-number union on every numeric field would lose that typing, and the artifact's text fields (success_definition, split_method, dataset name, url, license and success_definition, domain request_type, cohort) do resolve.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5748-L5786
  - what: A statistic, prior mass or threshold that is not finite is refused with an error naming the field, where LiteLLM's pydantic constraints accept positive infinity whenever the value stays within its bounds.
    why: The task requires rejecting non-finite input, and a positive-infinity prior mass makes every posterior mean and forecast probability NaN, which JSON cannot carry, so such a setup could only produce unreadable records; YAML can spell `.inf`, so the check guards the config and the parsed bytes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/tier_predictor.py#L14-L18
  - what: The built-in `ultrafeedback` artifact is compiled into the binary, so editing the installed package's artifacts/ultrafeedback_tiers.json changes nothing, where LiteLLM re-reads that file for every router it builds.
    why: The task pins the packaged artifact and forbids a changing download from replacing it; the compiled bytes are the pinned file, and a setup needing different statistics passes them inline through `heuristic_v2_artifact`, which both implementations read.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/tier_predictor.py#L82-L89
  - what: A dataset `rows` value above u32::MAX is refused when the artifact is parsed, where LiteLLM declares an unbounded int.
    why: betterlite keeps the attribution counts in u32, which the packaged artifact and every dataset it describes fit; rows only feeds attribution and never routing, so a value past four billion loses nothing a request can observe.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/complexity_router/tier_predictor.py#L35-L41
