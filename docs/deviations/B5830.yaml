task: B5830
deviations:
  - what: When a reply has a bad shape (for example choices is not a list), the 500 message is the text "Error transforming OpenRouter image generation response" (or "image edit response") plus a colon and betterlite's own description of the field that failed.
    why: LiteLLM appends the text of whatever Python exception happened (an AttributeError or TypeError message), which depends on the interpreter. The status 500 and the empty headers are the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/transformation.py#L396-L401
  - what: In the edit config, a bad usage field (for example a non-numeric prompt_tokens) also gives OpenRouterError 500, not an unwrapped Python error.
    why: LiteLLM runs the edit usage step outside its try block, so the raw TypeError reaches the proxy as a generic 500. A typed OpenRouterError with status 500 is the same code and a clearer message.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_edit/transformation.py#L255
  - what: The edit reply's created value is the one the caller passes to the transform, not the wall clock.
    why: LiteLLM builds a fresh ImageResponse, whose constructor replaces a missing created with int(time.time()), so its value is not reproducible and can differ between two runs of the same reply. betterlite keeps created an input of the transform.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_edit/transformation.py#L212
  - what: A reply body that is not standard JSON, including NaN, Infinity or an exponent that overflows a double, is a parse error in betterlite; Python's json.loads reads NaN and Infinity and returns inf for an overflowing exponent.
    why: docs/compatibility.md makes output standard JSON, which has no NaN or Infinity. A body carrying them cannot come from a provider that emits JSON, and a cost of inf has no usable value.
    link: ""
  - what: A generation non_default_params entry that names a non-object image_config together with a size or a mapped quality is a typed error naming image_config; LiteLLM's chained item assignment raises a Python TypeError.
    why: docs/compatibility.md makes a value of the wrong type an error that names the field. The status is absent in both, and the error class is not part of the compared result.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/transformation.py#L102-L111
kept_bugs:
  - what: Generation sends "Authorization: Bearer None" and never fails when api_key, litellm.api_key and OPENROUTER_API_KEY are all empty.
    why: A working setup can rely on the generation request still being built and sent with the header LiteLLM writes, and on the provider, not the transform, deciding what an unusable key means.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/transformation.py#L271-L277
  - what: Edit usage text_tokens is prompt_tokens minus prompt_tokens_details.image_tokens with no floor, so it goes negative when the reply reports more image tokens than input tokens.
    why: A setup that reads the split sees the same numbers LiteLLM reports, and clamping would invent a value the reply did not contain.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_edit/transformation.py#L320-L329
  - what: A data URL with no comma appends an image object whose b64_json and url are both null; the object is not skipped.
    why: The image count is what LiteLLM reports for that reply, and a setup that indexes data by position would see the same shape.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/transformation.py#L369-L381
  - what: A reply with an explicit "model": null sets hidden model to null instead of falling back to the requested model.
    why: LiteLLM's response_json.get("model", model) only falls back when the key is absent, and a setup reading the hidden model sees what the reply said.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openrouter/image_generation/transformation.py#L236
