task: B7873
deviations:
- what: "`client` and `shared_session` are refused with `UnsupportedCallArgument` in list_batches, alist_batches, cancel_batch and acancel_batch; `logger_fn` is dropped. LiteLLM takes all three through `**kwargs` into `GenericLiteLLMParams` and never uses them."
  why: "A Python HTTP client cannot drive the Rust client (B158), so the facade raises instead of silently ignoring the argument, the same policy B7872's create and retrieve use."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L743"
- what: "Only the openai-compatible providers (openai, hosted_vllm, litellm_proxy) and xai execute a list here; azure and vertex_ai answer 400 with a BadRequestError naming the provider, through the core list branch and the transport that has no executor for it."
  why: "This build has no azure or vertex batch list executor; the provider tasks that add one remove its branch from this list. LiteLLM lists batches through both providers' handlers."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L821"
- what: "Only the openai-compatible providers and xai execute a cancel here; azure, vertex_ai and bedrock answer 400 with a BadRequestError naming the provider and the model the caller passed (null when absent), where LiteLLM's own unsupported branch sets model \"n/a\". Those three are providers LiteLLM cancels through."
  why: "This build has no azure, vertex or bedrock batch cancel executor; the provider tasks that add one remove its branch from this list."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L1018"
- what: "A cancelled batch carries `_hidden_params` with `llm_provider`, `model_id`, `litellm_model_name` and `api_base`. LiteLLM's cancel returns the provider body through `LiteLLMBatch.model_validate`, so its `_hidden_params` stays empty. betterlite reports the provider the call dispatched to, the model the payload named, `model_id` from `model_info.id` (written by the facade), and the caller's `api_base`, else `https://api.openai.com` when an openai call names a model, else `https://api.x.ai/v1` for xai, else null."
  why: "The same policy B7872 uses for create and retrieve: the Rust answer hangs the four keys on the result, and the Python facade fills `model_id` from its own `model_info` kwarg."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L2202"
- what: "An `httpx.Timeout` passed as `timeout` is collapsed to its largest phase by the facade before the payload is written, so one deadline reaches every provider. LiteLLM keeps the object for the openai SDK, which applies each phase, and reads its read phase (or 600) for the providers that do not take one. The native openai executor also refuses a payload that names phases, and the xai executor reads the read phase or 600 from one, so a payload built by hand with phases answers an error or a single deadline where LiteLLM would use the phases."
  why: "The shared payload helper stores a timeout as a number of seconds, which is the shape the Rust core resolves; the phase object is read only for a payload that reaches the core directly."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L964"
- what: "`list_batches` and `alist_batches` return a `BatchListPage` with `data: list[LiteLLMBatch]` and `has_more`, plus any page key the provider sent (`object`, `first_id`, `last_id`, `next_page_token`). LiteLLM returns the openai SDK's `SyncCursorPage[Batch]` for openai-compatible providers and the xai handler's own answer for xai."
  why: "betterlite has no openai-python client; the page fields and values match the SDK's dump field for field, and the page keeps the extra keys the provider sent."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L811"
- what: "A list for a provider outside the six supported names answers B1129's text \"batch listing does not support the provider X; supported providers are azure, hosted_vllm, litellm_proxy, openai, vertex_ai and xai\". LiteLLM's text is \"LiteLLM doesn't support X for 'list_batch'. Supported providers: ...\". The class, status 400, llm_provider and model \"n/a\" are LiteLLM's."
  why: "The text belongs to the core list error (B1129); the facade writes only the fields LiteLLM's exception is built from."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L871"
- what: "A cancel for a provider outside the core's supported names answers the core cancel error's text \"LiteLLM doesn't support X for 'cancel_batch'\". LiteLLM's text adds \"Only 'openai', 'azure', 'vertex_ai', and 'bedrock' are supported.\" The class, status 400, llm_provider and model \"n/a\" are LiteLLM's."
  why: "The text belongs to B1038's cancel error; the facade writes only the fields LiteLLM's exception is built from, and names the provider the request asked for."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L1073"
- what: "A provider failure answers betterlite.exceptions' class for the response status (AuthenticationError, NotFoundError, BadRequestError, UnprocessableEntityError, RateLimitError, InternalServerError, APIError and the rest) with the native error as its __cause__, llm_provider set to the provider the call dispatched to and model set to the caller's model or null. LiteLLM's sync list_batches and cancel_batch let the provider handler's exception through unchanged, which on the openai-compatible branch is the openai SDK's class of the same name, carrying no llm_provider, model or cause. A 409 answers APIError, where that SDK class is ConflictError. A 400 or 409 whose error object names type, param or code hands them to BadRequestError or APIError, but the envelope's body holds only those three keys, not the provider message or other keys, so .body differs from the SDK's. A 422 answer reads no body, so UnprocessableEntityError carries type, param and code None where the SDK reads them from the provider body. AuthenticationError, NotFoundError and PermissionDeniedError carry the three fields None too, RateLimitError carries type \"throttling_error\" and code \"429\", and InternalServerError carries type \"internal_server_error\", where the SDK class reads those from the provider body."
  why: "The request runs in Rust, so every failure comes back as an error envelope that raise_native_error maps to betterlite's class of the same name. betterlite.exceptions' UnprocessableEntityError constructor takes no body and the package exports no ConflictError, whose class _completion/errors.py would also have to list, so those two classes need modules outside this task's paths; betterlite's RateLimitError and InternalServerError post-init overwrite the fields the SDK reads."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L1083"
- what: "A list or cancel whose request never reaches the provider, a timeout included, answers APIConnectionError with the transport's text, where the openai SDK raises APITimeoutError for a timeout and APIConnectionError for a refused or failed connection."
  why: "The Rust executors report one kind for every transport failure that carries no HTTP status, so the facade cannot tell a timeout from a connection failure."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L811"
kept_bugs:
- what: "`alist_batches` declares `metadata` and never sends it."
  why: "LiteLLM's signature carries `metadata` and its body passes only after, limit, the provider, extra_headers and extra_body on to list_batches, so a caller's metadata is silently dropped in both."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L700"
- what: "`list_batches` and `alist_batches` accept `extra_headers` and `extra_body` and never send them."
  why: "LiteLLM's list entries accept both and neither the openai nor the xai list call passes them to its handler, so a caller's headers and body are silently dropped in both."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L2214"
- what: "`cancel_batch` and `acancel_batch` accept `metadata` and never send it."
  why: "LiteLLM's CancelBatchRequest has no metadata key, so the argument the signature declares reaches no provider call in either."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L934"
