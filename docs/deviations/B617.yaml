task: B617
deviations:
  - what: 'A Pegasus reply body that is not valid UTF-8 fails with "Error parsing response: the body is not UTF-8" instead of repeating the body text.'
    why: 'A Rust byte slice cannot be printed as text without inventing replacement characters, and the status and headers on the BedrockError stay the same.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L209-L214
  - what: 'A prompt and completion token count whose sum does not fit a signed 64-bit integer is an error, where Python integers grow without bound.'
    why: 'Token counts are i64 throughout betterlite, so the total is checked rather than wrapped.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L251-L266
  - what: 'A reply body whose top-level JSON value is not an object fails with "the response body is not a JSON object", where LiteLLM raises AttributeError from calling get on a list.'
    why: 'LiteLLM lets that AttributeError leave transform_response as an unhandled failure, so the request ends in a 500-class error; the typed error rejects the same malformed reply without the crash.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L223
  - what: 'A finishReason that is a JSON object or array fails with "the response finishReason field cannot be mapped", where LiteLLM raises TypeError from the dict lookup inside map_finish_reason.'
    why: 'The TypeError leaves transform_response unhandled in LiteLLM, so the request ends in a 500-class error; the typed error reports the malformed provider reply instead.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L227
  - what: 'A reply message that is truthy but not a string fails with "the response message field is not a string", where LiteLLM assigns the value to message.content as it is.'
    why: 'The reply message content is a string in betterlite, and a non-string value on a field the provider documents as text is a malformed reply rather than content to pass through.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L236
  - what: 'A response creation time outside the signed 64-bit integer range is an error, where Python integers grow without bound.'
    why: 'The created timestamp is an i64 throughout betterlite, so the conversion is checked rather than wrapped.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L261
