task: B617
deviations:
  - what: 'A Pegasus reply body that is not valid UTF-8 fails with "Error parsing response: the body is not UTF-8" instead of repeating the body text.'
    why: 'A Rust byte slice cannot be printed as text without inventing replacement characters, and the status and headers on the BedrockError stay the same.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L209-L214
  - what: 'A prompt and completion token count whose sum does not fit a signed 64-bit integer is an error, where Python integers grow without bound.'
    why: 'Token counts are i64 throughout betterlite, so the total is checked rather than wrapped.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L251-L266
  - what: 'A reply body whose top-level JSON value is not an object fails with "the response body is not a JSON object", where LiteLLM raises AttributeError from calling get on a list.'
    why: 'LiteLLM lets that AttributeError leave transform_response as an unhandled failure, so the request ends in a 500-class error; the typed error rejects the same malformed reply without the crash.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L223
  - what: 'A finishReason that is a JSON object or array, or a number other than one that serde_json reads as a 64-bit integer (a fraction, an exponent, negative zero or an out-of-range integer), fails with "the response finishReason field cannot be mapped", where LiteLLM raises TypeError for an object or array and maps every number to stop.'
    why: 'The Bedrock field model carries those numbers as a mapping, the same shape an object has, so the reply cannot tell them apart; LiteLLM either crashes with TypeError or silently reports stop, and the typed error names the finishReason field in both malformed cases.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L227
  - what: 'A reply message that is truthy but not a string fails with "the response message field is not a string", where LiteLLM assigns the value to message.content as it is.'
    why: 'The reply message content is a string in betterlite, and a non-string value on a field the provider documents as text is a malformed reply rather than content to pass through.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L236
  - what: 'A response creation time outside the signed 64-bit integer range is an error, where Python integers grow without bound.'
    why: 'The created timestamp is an i64 throughout betterlite, so the conversion is checked rather than wrapped.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L261
  - what: 'A video_base64 or base64_string value that is truthy but not a string fails with "the <field> field must be a string", where LiteLLM passes the value to get_base64_str and raises AttributeError.'
    why: 'The base64 source is a string field in betterlite, so a non-string value is a malformed request rather than a clip to forward; the typed error replaces the AttributeError that leaves transform_request unhandled.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L137-L139
  - what: 'A token count header whose value is a truthy non-integer string fails with "the response token count header <name> is not an integer", where LiteLLM lets int() raise ValueError out of transform_response.'
    why: 'The header is read with the same Python integer grammar, and a malformed count is reported as a typed error instead of an unhandled exception.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L248-L259
  - what: 'A response_format that is neither a JSON object nor null fails with "response_format must be a JSON object or null", where LiteLLM raises TypeError from type_to_response_format_param.'
    why: 'LiteLLM never returns a value for those inputs, so the request fails either way; the field error names the parameter instead of the TypeError that leaves map_openai_params unhandled.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L101
  - what: 'A list content block whose type is text and whose text is null contributes an empty fragment, where LiteLLM appends None and the space join then raises TypeError.'
    why: 'LiteLLM builds no prompt at all for that message, so nothing relies on the crash; a null text reads as a fragment with no text, the value its absent text key already gives.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L168-L169
  - what: 'A list content block whose type is text and whose text is a non-string value, 5 for example, fails with "the text field must be a string", where LiteLLM appends the value and the space join then raises TypeError.'
    why: 'A fragment text is a string in betterlite, so a number or a list on that field is a malformed message; LiteLLM builds no prompt for it either, and the typed error names the field instead of leaving the join TypeError unhandled.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L168-L169
  - what: 'A message whose role or content is a non-string, non-list value fails with "the <field> field must be a string", where LiteLLM renders the value with str() into the prompt line.'
    why: 'Role and content are strings in betterlite, with content also taking a list of fragments, so a number or object on either field is a malformed message; the error names the field instead of carrying Python repr text into the prompt.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_twelvelabs_pegasus_transformation.py#L161-L162
