task: B9947
deviations:
  - what: The model name inside the not-found message is redacted before it reaches the client, so a model that looks like a key answers with the redacted text in both error.message and error.provider_specific_fields.error.
    why: LiteLLM echoes the model text exactly as the caller sent it, which puts a key pasted into the model field into the response body and the logs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L158
