task: B1541
deviations:
  - what: A transcription reply larger than 16777216 bytes fails the call with a decode error before it is parsed, where LiteLLM calls raw_response.json() on whatever body arrives.
    why: The bounded-inputs rule requires finite memory for provider bytes, and the pooled client caps a buffered reply at the same size, so the decoder states the limit itself and the fuzz target reaches it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/elevenlabs/audio_transcription/transformation.py#L117
