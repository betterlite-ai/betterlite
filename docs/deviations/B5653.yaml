task: B5653
deviations:
  - what: A custom provider's stream reaches the decoder as a ProviderChunk value, so branches that test isinstance on Python SDK classes have no Rust form.
    why: The provider crates hand over decoded lines, and each class in those branches has a matching JSON shape that takes the same path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/streaming_handler.py#L1103-L1135
  - what: The vertex ai blocked-stream error message is "The response was blocked by VertexAI." without the proto object's repr that LiteLLM appends.
    why: The suffix is Python's repr of a protobuf message, which docs/compatibility.md excludes from parity; the prefix is the part a caller can act on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/streaming_handler.py#L1258-L1263
  - what: A tool call whose type is null is emitted with type "function". LiteLLM normalizes the type on a dumped copy of the delta, and return_processed_chunk_logic then replaces the delta with the original chunk's choices, so its callers see the null type.
    why: The chunk a caller receives is the one place the type matters, and a null type is what an OpenAI-shaped client rejects; the branch doing the work exists only for this normalization.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/streaming_handler.py#L1471-L1481
