task: B1315
deviations:
  - what: The accumulated fragment buffer is capped at 16 MiB of retained bytes and a fragment past the cap answers the stream's TooLarge error, where LiteLLM appends to the buffer without a limit.
    why: Rule bounded-inputs gives every read from a provider a cap; the ceiling is the pooled transport's reply cap, and a Gemini chunk that never closes is malformed input rather than something a working setup relies on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/json_fragment_accumulator.py#L31-L35
  - what: A fragment holding bytes that are not UTF-8, or a stream that ends inside a multi-byte sequence, answers the stream's Utf8 or IncompleteUtf8 error, where httpx's line iterator hands LiteLLM replacement characters.
    why: A provider that sends broken UTF-8 is a real failure, and a replacement character would silently corrupt the model's text; the split sequence itself is buffered and decoded, so only genuinely invalid bytes fail.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py#L3355-L3372
  - what: A fragment that is a complete JSON value but not an object (a list, a number or a string) answers the stream's NotAnObject error, where LiteLLM splats the value into its response type and an uncaught TypeError escapes as HTTP 500.
    why: Rules owned-behavior-is-built and typed-wire make a wrong-typed value an error that names what was expected, not a crash; a working Gemini setup sends objects.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py#L3245
  - what: An embedded error code that is a float, or an integer outside an HTTP status range, becomes 500, where LiteLLM truncates a float with int() and keeps any integer as status_code.
    why: betterlite's VertexAiError carries a u16 status, so a value it cannot represent falls back to 500 as a non-coercible code does; a float or out-of-range status is nothing a working setup sends.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py#L3116-L3122
