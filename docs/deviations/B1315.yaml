task: B1315
deviations:
  - what: The accumulated fragment buffer is capped at 16 MiB of retained bytes, where LiteLLM appends without a limit.
    why: Rule bounded-inputs caps every read from a provider; the ceiling is the pooled transport's reply cap, and a Gemini chunk that never closes is malformed input a working setup does not send.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/json_fragment_accumulator.py#L31-L35
  - what: A fragment with bytes that are not UTF-8, or a stream ending inside a multi-byte sequence, answers Utf8 or IncompleteUtf8, where httpx hands LiteLLM replacement characters.
    why: A replacement character would silently corrupt the model's text; a split sequence itself is buffered and decoded, so only genuinely invalid bytes fail.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py#L3355-L3372
  - what: A fragment that is a complete JSON value but not an object answers NotAnObject, where LiteLLM splats it into its response type and an uncaught TypeError escapes as HTTP 500.
    why: Rules owned-behavior-is-built and typed-wire make a wrong-typed value an error that names what was expected; a working Gemini setup sends objects.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py#L3245
  - what: An embedded error code that is a float, or an integer outside an HTTP status range, becomes 500, where LiteLLM truncates a float with int() and keeps any integer.
    why: betterlite's VertexAiError carries a u16 status, so a value it cannot represent falls back to 500 like a non-coercible code; nothing a working setup sends.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py#L3116-L3122
