    why: No code outside the config crate reads the process environment (rule inject-dependencies); secret-manager lookups for these names stay with B8500.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/watsonx/common_utils.py#L29-L31
