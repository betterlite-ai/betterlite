task: B250
deviations:
  - what: An excluded standard logging payload field that the typed payload requires, such as model, is kept in the payload the logger receives, and a warning names it; LiteLLM removes every excluded key.
    why: LoggerEvent carries a typed StandardLoggingPayload (B8740) whose required fields cannot be absent, so only optional fields such as messages, response and error_str can be removed. The optional fields are the ones that carry message content.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_logger.py#L910-L921
  - what: A streamed chunk with no standard logging object stored for the request gets a payload built by the injected builder before its logger event; LiteLLM's log_stream_event receives model_call_details without a fresh standard_logging_object.
    why: LoggerEvent requires a payload (B8740), and B190's builder handles a chunk response, so the event carries the payload the logger needs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L3503-L3511
  - what: Sync success callbacks for async calls run inline through success_handler instead of being submitted to a thread pool.
    why: betterlite has no detached executor; the registry holds only CallbackLogger objects, which LiteLLM's filter removes before that path, so the call only matters for legacy callables and runs no logger.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L3983-L4004
  - what: Request-level message redaction rewrites only the stored standard logging object; model_call_details messages, prompt and input, the served output texts and the redacted result LiteLLM returns are not rewritten, and the streaming response entries are not redacted in place.
    why: Loggers receive a LoggerEvent that carries the typed payload alone (B8740), so nothing in betterlite reads those other entries after the success handler.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/redact_messages.py#L255-L325
  - what: A redaction flag that B188 cannot read (a callback metadata value of the wrong type) leaves the decision to the global turn_off_message_logging setting and logs a warning; LiteLLM never rejects it.
    why: B188 PrivacyRequest::decide returns an error for unreadable flags, and a success callback must not fail the request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/redact_messages.py#L328-L377
