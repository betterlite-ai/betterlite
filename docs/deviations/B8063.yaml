task: B8063
deviations:
  - what: >-
      `cost_per_token`, `completion_cost` and `response_cost_calculator` return a Python float made
      from Rust's exact Decimal result, so a last-digit difference from LiteLLM's float arithmetic
      is possible; the tests allow a relative difference of 1e-12 and the cached, cache-creation,
      tiered and per-second cases are the ones where LiteLLM's own sums carry a rounding tail.
    why: B068 computes with exact money types, so the value crosses into Python once, as a float.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L1291
  - what: >-
      When a response carries no usage and no custom token counts, LiteLLM tokenizes the prompt,
      messages and completion to price the call. betterlite's Python cost helpers have no
      tokenizer, so that call raises betterlite's NativeError Exception explaining that the
      response needs usage or explicit token counts, instead of counting.
    why: Token counting belongs to the completion family, and this package's cost path prices a
      response's usage only.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/cost_calculator.py#L1557-L1560
  - what: >-
      `completion_cost` passes the `total_time` argument through and does not read
      `completion_response._response_ms` or `litellm_logging_obj.get_response_ms()`, so a
      per-second model whose response time arrives only through those two is priced from
      `total_time` (0.0 by default).
    why: LiteLLM's `_response_time_ms_for_cost` sits in L1059-L1331, which the task marks private
      to the Rust calculator, and the native request carries no field for it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/cost_calculator.py#L1317-L1329
  - what: >-
      `get_replicate_completion_pricing` reads `created` and `ended` from the response's dumped
      mapping. An `ended` attribute that the response class keeps out of `model_dump()` is not
      read, where LiteLLM's `getattr(completion_response, "ended", ...)` would see it.
    why: Every betterlite response carries `ended` in its dump, and reading it there keeps the
      helper typed as a mapping.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/cost_calculator.py#L759
  - what: >-
      `get_replicate_completion_pricing` prices a GPU-second at a fixed 0.001400 and does not read
      `DEFAULT_REPLICATE_GPU_PRICE_PER_SECOND` from the environment, so an operator who overrides
      that variable is still priced at LiteLLM's default rate.
    why: The Python cost package reads no environment; every setting betterlite honors arrives
      through Rust's settings, and no task owns this constant there.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L602
  - what: >-
      `litellm_logging_obj` is read through a runtime Protocol that declares only `model` and
      `set_cost_breakdown`; any other logging-object member LiteLLM's cost body would touch is not
      read, and the object itself never crosses into the JSON.
    why: The price rules are Rust, and the two members are the ones completion_cost's public
      behavior reads.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/cost_calculator.py#L1221
  - what: >-
      The native cost engine checks every `model_cost` entry while it is built and refuses one
      that is not a price object, naming the entry in the ValueError that constructing the engine
      raises. LiteLLM keeps the map as assigned and fails only when that model's info is read,
      where the scalar has no `.get`.
    why: The map's shape is checked once at startup, so a malformed entry fails there instead of
      on the first request that reads it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L6111
