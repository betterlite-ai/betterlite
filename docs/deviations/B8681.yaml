task: B8681
deviations:
  - what: The OpenAPI document lists only the eleven LLM API POST routes and the realtime and Responses WebSocket routes, without request body schemas.
    why: axum has no route introspection and no pydantic models, so the full route list comes from B124's RouteCatalog and the request schemas have no owner yet. LiteLLM documents every registered route.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1806-L1821
  - what: info.version in the document is the betterlite version.
    why: LiteLLM writes its own package version there.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1737
  - what: DOCS_TITLE from the environment (public_discovery.docs_title) sets the Swagger and ReDoc page titles and info.title in the document, with no license.
    why: LiteLLM reads DOCS_TITLE only when premium_user is true, which needs an enterprise license, and betterlite's public_discovery section reads it in the open-source build; this task passes that title to the pages and the document as its text requires, which supersedes B123's note that the override is not built.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1044
  - what: An unauthenticated request to a path that no route serves, such as GET /docs/oauth2-redirect when NO_DOCS is set, gets the authentication stage's missing-key reply (500 Internal Server Error) rather than LiteLLM's 404, and only a request carrying a key reaches the router's 404 fallback.
    why: betterlite authenticates in a stage around the whole application, so every path outside the public route list passes through it before the router finds no match, while LiteLLM attaches user_api_key_auth per route and FastAPI answers an unmatched path 404 without running a dependency; this is the shared stage failure B348 records for its own routes, and the docs-no-docs-flag oracle case sends the master key so both sides compare the 404 the removed OAuth2 redirect page leaves behind. The case does not use GET /, because with the docs page off LiteLLM answers that path with its home route.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/user_api_key_auth.py#L1884
  - what: "With NO_DOCS set, GET / answers the home route's 200 application/json \"LiteLLM: RUNNING\" in LiteLLM, while betterlite answers the app's 404 on this branch."
    why: B8597 builds root_routes (GET / and /adaptive_router/state) and B8676 mounts it; this task does not, and registering / here would collide with the docs page mount_public registers at / whenever the docs are on, since axum panics when two merged routers register the same path and method. LiteLLM can hold both because FastAPI adds the docs route while the app is built and include_router(router) adds home after it, so the docs page wins at / until NO_DOCS removes it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L19860-L19862
