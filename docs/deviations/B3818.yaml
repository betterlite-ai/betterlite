task: B3818
deviations:
  - what: Object keys in MCP arguments, schemas and structuredContent are walked and written back in sorted order, so the guardrail gets the texts in key order and masked payloads come back with sorted keys.
    why: The MCP value type stores objects in a BTreeMap; LiteLLM walks dicts in insertion order. The positional write-back stays consistent because scan and write-back use the same order.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/utils.py#L801-L819
  - what: Numeric structuredContent labels use serde_json's standard numeric rendering rather than Python's str(float) rendering for every value.
    why: Numeric labels use serde_json::Number display formatting, which depends on the active numeric features and does not always preserve the input spelling or match Python float formatting. A client-sent single-key private-number-shaped object with a non-numeric string remains an object, with its key as a label and its string as a scanned leaf.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/utils.py#L837-L863
  - what: A tool result that carries both structuredContent and structured_content fails to parse instead of LiteLLM preferring structuredContent.
    why: Both keys name the same field; keeping one and dropping the other silently would break rule no-silent-drops.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/utils.py#L866-L871
