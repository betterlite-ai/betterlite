task: B313
deviations:
  - what: >-
      A generalization rule whose regex exceeds 2048 pattern bytes or whose search exceeds 100000 backtracking
      steps is warned about and skipped, where LiteLLM compiles and runs both without a bound.
    why: >-
      The pinned rule compiler has no execution bound; bounded-inputs requires one. Supported Python syntax and
      first-match semantics stay the same inside the bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L130-L181
  - what: >-
      The model_rules byte parser rejects a rule document over 1048576 bytes before decoding it, with
      ModelsError::RulesTooLarge, where LiteLLM's json.loads reads any length.
    why: >-
      The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite limit.
      Existing structural field limits remain unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L74-L277
  - what: >-
      The proxy config accepts a top-level fallback_generalizations block with a rules list and reads it as the
      rule document, where LiteLLM reads that block only from the model cost map.
    why: >-
      betterlite's router loads its catalog rules from config.yaml rather than a remote cost map, so the same
      rule document needs a configured home; a config without the block keeps the cost map's own rules.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L537-L544
  - what: >-
      At route selection the router fills each candidate deployment's model_info from the capability rules
      when the deployment declares no provider and from the fill rules for the provider it declares, the
      deployment's own keys and explicit nulls winning, and writes a missing litellm_provider from the first
      matching routing rule, where LiteLLM instead resolves a request's model through get_llm_provider and
      get_model_info before a call. The stage runs whenever the router's RouteServices carries installed
      rules; the server startup that builds that service from the loaded config, and its reload on a config
      change, belong to B304's routing_state.rs and B016's router_core.rs, the route entry that calls
      pipeline::route.
    why: >-
      betterlite selects among configured deployments, so the rule document reaches a deployment's entry at
      selection: a deployment without a provider or capability metadata gets it there, and both the filters and
      the chosen deployment see what a LiteLLM call would have resolved. A router without rules leaves every
      deployment unchanged; a deployment whose model prefix names its provider is not re-inferred at selection,
      so a routing rule may supply a provider its records leave out. Until B304 and B016 install and call this
      service from the server, no proxy process runs the stage.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L5742-L5778
