task: B313
deviations:
  - what: >-
      A generalization rule whose regex exceeds 2048 pattern bytes or whose search exceeds 100000 backtracking
      steps is warned about and skipped, where LiteLLM compiles and runs both without a bound.
    why: >-
      The pinned rule compiler has no execution bound; bounded-inputs requires one. Supported Python syntax and
      first-match semantics stay the same inside the bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L130-L181
  - what: >-
      The model_rules byte parser rejects a rule document over 1048576 bytes before decoding it, with
      ModelsError::RulesTooLarge, where LiteLLM's json.loads reads any length.
    why: >-
      The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite limit.
      Existing structural field limits remain unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/fallback_generalizations.py#L74-L277
  - what: >-
      The proxy config accepts a top-level fallback_generalizations block with a rules list and installs it into
      the router, where LiteLLM reads that block only from the model cost map.
    why: >-
      betterlite's router loads its catalog rules from config.yaml rather than a remote cost map, so the same
      rule document needs a configured home; a config without the block keeps the cost map's own rules.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L537-L544
