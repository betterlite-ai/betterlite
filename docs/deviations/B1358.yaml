task: B1358
deviations:
  - what: Billed durations keep the exact protobuf seconds and nanos. LiteLLM converts the protobuf Duration to a Python timedelta through proto-plus, which truncates nanos to whole microseconds before total_seconds().
    why: The task requires the stream's maximum billed duration in exact seconds and nanos. The truncation is a proto-plus conversion artifact, not billing behavior a working setup relies on, so betterlite keeps the value Google sent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/audio_transcription/realtime_backend.py#L152-L157
  - what: Once a stream's relay exits, send_audio returns the queue-closed error. LiteLLM keeps the 64-item queue on the stream after the drain task ends.
    why: In LiteLLM a send_audio after the turn's relay stopped blocks forever once the queue fills, because nothing consumes it. betterlite drops the queue with the relay, so the caller gets a typed error instead of a hang.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/audio_transcription/realtime_backend.py#L207-L215
