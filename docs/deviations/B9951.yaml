task: B9951
deviations:
  - what: "json() returns the model_dump dict on every response object, where LiteLLM's Delta, Choices, StreamingChoices, Usage, TextChoices, ChatCompletionMessageToolCall and the other classes that do not define json() inherit pydantic's deprecated json(), which returns a JSON string."
    why: "The task asks for the json() LiteLLM's classes define, and the classes that define it return the dump; a base method cannot switch on the class, and a caller of Message, ModelResponse or EmbeddingResponse that indexes response.json() has to keep working. A caller that read one of the other classes' json() as text now gets a dict."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1507
  - what: "A pydantic model inside provider_specific_fields is dumped with exclude_unset=True when the object is built, where LiteLLM stores the model in its dict[str, Any] field and serializes it with the options of the model_dump() call on the parent."
    why: "The declared field type is dict[str, JsonValue], and pydantic rejects a model during validation; dumping at construction reproduces LiteLLM's exclude_unset=True output, and a parent dump without exclude_unset then carries fewer None keys than LiteLLM's."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1644
  - what: "A constructor accepts a model object through the structural Dumpable protocol, which checks for a usable model_dump, where LiteLLM's isinstance(value, BaseModel) checks exclude an object that has model_dump without deriving from pydantic.BaseModel."
    why: "Python duck typing is outside the compatibility policy; a value of the declared type, pydantic's BaseModel included, behaves the same, and the wire output is the model's model_dump."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1679-L1683
