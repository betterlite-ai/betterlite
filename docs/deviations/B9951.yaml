task: B9951
deviations:
  - what: "json() on a response object returns standard JSON text from model_dump_json, where LiteLLM's Message, Delta, Choices, Usage, StreamingChoices, ModelResponse, ModelResponseStream, Embedding, EmbeddingResponse, Logprobs, TextChoices, TextCompletionResponse, HiddenParams, ImageObject, ImageResponse and TranscriptionResponse define json() to return the model_dump dict."
    why: "The classes are pydantic models now, so pydantic's json() is the base method and a dict-returning override would not type against it; betterlite's compatibility policy says output is standard JSON, and the dict is model_dump()'s."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1499-L1504
  - what: "A constructor accepts a model object through the structural Dumpable protocol, which checks for a usable model_dump, where LiteLLM's isinstance(value, BaseModel) checks exclude an object that has model_dump without deriving from pydantic.BaseModel."
    why: "Python duck typing is outside the compatibility policy; a value of the declared type, pydantic's BaseModel included, behaves the same, and the wire output is the model's model_dump."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1690-L1693
  - what: "json() ignores encoder and models_as_dict when they are absent and raises TypeError when dumps_kwargs are given, where pydantic's deprecated json() raises TypeError for any of the three, encoder=None included."
    why: "The unsupported options cannot be typed against pydantic's Any-typed sentinels without the wheel's no-Any rule; the include, exclude, by_alias, exclude_unset, exclude_defaults and exclude_none options behave as in pydantic."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1499-L1504
