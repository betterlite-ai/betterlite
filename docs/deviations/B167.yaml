task: B167
deviations:
  - what: >-
      Names LiteLLM's types modules import from the openai, httpx or pydantic packages are not exported from the
      matching betterlite package, so a caller that imports, say, Assistant from litellm.types.llms.openai finds
      no such name in betterlite.types.llms.openai.
    why: >-
      The task's out_of_scope keeps names LiteLLM imports from the openai, httpx or pydantic packages out of the
      port: betterlite.types carries LiteLLM's own types, and the openai and httpx packages are not betterlite
      dependencies.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L17-L19
  - what: >-
      betterlite.types.llms.openai does not export HttpxBinaryResponseContent, the one public name LiteLLM
      defines in its openai types module that betterlite has no local equivalent for.
    why: >-
      LiteLLM's class subclasses the openai package's _HttpxBinaryResponseContent and wraps an httpx.Response;
      neither package is a betterlite dependency, so there is nothing local to export and nothing to subclass.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L121-L146
  - what: >-
      typing's TYPE_CHECKING, which litellm.types.llms.bedrock and litellm.types.mcp import at module level and
      so expose as a public attribute, is not an attribute of betterlite.types.llms.bedrock or
      betterlite.types.mcp.
    why: >-
      It is an import-time switch that types the modules in both codebases, not a type any caller imports from a
      types module; every name either module defines is exported.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/bedrock.py#L4
  - what: >-
      betterlite.types.llms.openai does not re-export 33 module-level aliases and constants that
      litellm.types.llms.openai defines (for example AllMessageValues, OpenAIMessageContent, ResponsesTerminalEvent,
      PART_UNION_TYPES and REASONING_EFFORT), so from betterlite.types.llms.openai import AllMessageValues fails
      where the same import from LiteLLM works.
    why: >-
      Each of the 33 has a local definition in a betterlite.types.llms.openai submodule, but this package's
      __init__.py spends 294 of the 300 lines the repository's Python file limit allows on the other 209 names,
      and re-exporting the 33 renders 338 lines; they stay importable from their defining submodules.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L998
