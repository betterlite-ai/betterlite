task: B826
deviations:
  - what: >-
      An authenticated caller reaches the organization creation handler without a license. LiteLLM's
      router dependency rejects every organization call with 403 detail.error beginning "Organizations
      are only available for LiteLLM Enterprise users." before the handler runs; betterlite omits that
      guard and keeps the admin, database, budget and model checks behind it.
    why: >-
      README Decisions removes the paid tier: there is no license state to consult, so every deployment
      is entitled. The MIT equality corpus can therefore only carry an authentication failure that runs
      before the guard.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L96-L111
  - what: >-
      POST /organization/new answers 404 on the production router: betterlite's route admission does
      not list the path, so the route-match gate refuses it before authentication. The handler itself is
      mounted and is reached through the router's direct mount, which is how the native tests call it.
    why: >-
      route_match.rs and management_routes.rs are outside this task's scope; they belong to the tasks
      that own route admission. Organization creation cannot be listed there from here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L360-L365
  - what: >-
      A body carrying the JSON literals NaN, Infinity or -Infinity is refused with a 422 body instead of
      reaching the max_budget and soft_budget range checks. Python's json.loads accepts those literals and
      the handler then answers 400 "must be a non-negative finite number. Received: nan".
    why: >-
      betterlite reads request bodies with serde_json, which accepts no non-finite number literals, so
      the value never becomes a request field. In-range finite numbers and the 1e400 spellings that
      overflow to infinity still reach the same 400 check.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L458-L468
  - what: >-
      A max_budget, soft_budget or temp_budget_increase beyond Decimal's range (about 7.9e28) is
      refused with 400 detail.error "<field> must be a number the budget table can store. Received:
      <value>". LiteLLM's float accepts any finite value, stores it in the DOUBLE PRECISION column and
      echoes it back, and temp_budget_increase is not range-checked at all.
    why: >-
      betterlite's LiteLLM_BudgetTable decodes its money columns into Decimal, so a value Decimal
      cannot hold would be written and would then fail every later read of that row; a 4xx at creation
      beats a 500 on a later list. The 1e400 spellings stay on LiteLLM's path: they overflow to an
      infinity and get the non-finite answer instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L458-L468
  - what: >-
      The created organization response carries litellm_budget_table and metadata as the objects
      NewOrganizationResponse declares, projected from the request; a creation that sends no metadata
      answers the empty object its column default holds. LiteLLM serializes the created budget row and
      the organization row through jsonify_object, so those mapping columns are stored, and read back
      by the include, as JSON text; its response model declares dict for both, so a creation that
      sends model_max_budget or metadata cannot satisfy the type it returns.
    why: >-
      docs/compatibility.md ends parity at the declared types: every LiteLLM_BudgetTable mapping field
      and metadata is an object on the wire. No working setup can rely on a response that contradicts
      the model it is validated against, and the equality corpus cannot reach creation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/organization_endpoints.py#L546-L557
