task: B357
deviations:
  - what: The shadow_q query parser refuses a query past 1048576 bytes before decoding it and reports the byte count and limit, while LiteLLM hands the query string straight to FastAPI's parameter binder.
    why: The source has no equivalent byte bound at this parser boundary, and bounded-inputs requires a finite limit. The declared query types and their 1..200 limit still apply unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L1802-L1895
  - what: An invalid query reports one detail entry, the first parameter FastAPI validates (target_type before limit), where LiteLLM's RequestValidationError carries one entry per rejected parameter.
    why: The typed query decoder stops at the first rejected parameter, so a request with both an invalid target_type and an invalid limit answers a single pydantic issue.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2034-L2047
  - what: Start validation reads the configured deployments through the typed Config, which keeps only model_name, the fixed litellm_params fields and model_info.id, so a strategy router's tier and default arms are not enumerated and a judge that is one of those arms is not rejected as LiteLLM rejects it.
    why: complexity_router_config and the other strategy-router keys live in the raw YAML that the section views claim, not in LiteLlmParams, so the router view B357 installs cannot see them; carrying them needs a config change outside this task's scope.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L1078-L1103
  - what: A model_list deployment whose litellm_params sets complexity_router_default_model loads in LiteLLM, where the field is a declared deployment parameter (litellm/types/litellm_params.py L167) that the complexity router reads as its default model (litellm/router.py L9194), but betterlite fails the config load with ConfigError::Unsupported (crates/betterlite-config/src/loader.rs L126) and the proxy exits, because no config view claims model_list.N.litellm_params.complexity_router_default_model. B357's text names the key in the ui-router deployment of tools/oracle/cases/ui/cost/shadow-form-lifecycle.yaml, and the case leaves it out for now.
    why: The deployment litellm_params view belongs to B002. crates/betterlite-config/src/raw.rs RawParams declares the fixed key set, and loader.rs turns every key no view claims into ConfigError::Unsupported. B2228 registers complexity_router_default_model among the litellm_params parameter names but classifies only, without config support. B357's scope carries no source file in that config crate, so claiming the key belongs to the view's owner, and the case restores complexity_router_default_model ui-model once the view claims it. The case's assertions do not depend on the key, since LiteLLM derives the same ui-model default from the MEDIUM tier without it (litellm/router.py L9199-L9210).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L9194
  - what: A start authenticated with a seeded virtual key is not compared through the booted proxy. betterlite installs the master-key stage first (crates/betterlite-server/src/auth/auth_identity.rs L34-L35, master_key_stage L175-L216) and answers every other non-empty key 400 with type no_db_connection and code 400 (crates/betterlite-server/src/error_body.rs L28-L40), where LiteLLM resolves the presented key against its database (litellm/proxy/auth/user_api_key_auth.py L2118-L2135) and _require_admin_writer answers 403 with the detail Only a proxy admin can start a shadow eval (auto_router_endpoints.py L978-L980). The case leaves the view-only start step out of tools/oracle/cases/ui/cost/shadow-form-lifecycle.yaml and restores it once virtual key authentication lands.
    why: Virtual key authentication is B052's work, whose scope owns crates/betterlite-server/src/auth/** and state/virtual_key_auth.rs, and crates/betterlite-server/src/state/virtual_key_auth.rs is still a stub slot, so B357 has nowhere in scope to authenticate a seeded key. betterlite's own writer check answers 403 with LiteLLM's message for a proxy_admin_viewer principal and is proven by the shadow-eval-lifecycle-start-admin-only probe (tools/oracle/cases/routing/shadow-eval-lifecycle/start-admin-only.yaml), which runs five roles, and for the reads by shadow-eval-results-admin-viewer-only.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L978-L980
