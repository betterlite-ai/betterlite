task: B1014
deviations:
  - what: >-
      Dropping the future of an in-flight arerank call cancels the provider
      request. LiteLLM runs the sync rerank in the loop's default executor, so
      cancelling the awaiting task leaves that thread and its HTTP request
      running to completion.
    why: >-
      betterlite's dispatcher is a future the facade awaits on the caller's
      task, and spawning a detached task to keep the call alive is banned in
      this workspace; the provider sees a cancelled request instead of a
      completed one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rerank_api/main.py#L75-L77
kept_bugs: []
