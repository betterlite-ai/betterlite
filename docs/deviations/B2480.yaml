task: B2480
deviations:
  - {what: "An async create with no timeout runs under the pooled client's read timeout (100 minutes by default), where LiteLLM's async post hands timeout=None to httpx and disables every deadline.", why: "A B173 pooled client keeps one deadline for each request so a stuck upstream cannot pin a slot forever; the sync create without a timeout matches LiteLLM's client default, and only the async path had no bound at all.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L813-L828"}
  - {what: "A malformed reply fails with the decoder's message \"vector store reply is not valid JSON\" at the reply's status, where LiteLLM passes the JSONDecodeError's own text to get_error_class.", why: "B1071's decoder replaces serde_json's position text with one sentence both handlers can rely on; the status, the headers and the fact that this error skips _handle_error are unchanged.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L117-L127"}
  - {what: "A reply body over the decoder's byte limit fails with \"vector store reply exceeds the byte limit\" before parsing, where LiteLLM hands any size to response.json().", why: "The same bound is what B1071's decoder applies to every vector store file reply; it keeps one oversized answer from filling the proxy's memory, and no working setup sends one.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L117-L127"}
  - {what: "A complete base URL that does not parse as a URL fails with the typed RequestUrl error before the pre-call runs, where LiteLLM builds the URL string, logs the pre-call, and only the send raises httpx's InvalidURL or UnsupportedProtocol for the handler's catch to turn into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10785-L10792"}
  - {what: "An extra header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose encoding raises inside the handler's try and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10815-L10815"}
  - {what: "A query value that is a JSON object or a list of lists fails with the typed QueryValue error naming the key, where httpx renders it with Python's repr and sends it as one encoded pair.", why: "Both file list surfaces declare text, number or boolean values; a typed error says which key cannot ride a query string instead of sending a string nothing can read back.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L131-L139"}
  - {what: "The sync timeout message renders whole seconds without a fraction (after 7 seconds, after None seconds) and the async elapsed time as seconds plus zero-padded milliseconds (time taken=0.100), where LiteLLM interpolates Python floats (7.0, None, 0.1).", why: "The message still reports the timeout the caller passed and the time the failed request took, the same numbers LiteLLM shows; only the float rendering differs, since betterlite keeps durations typed.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1513-L1520"}
  - {what: "The pre-call record carries input, the additional args and no api_key, where LiteLLM's pre_call also receives api_key=\"\" and puts it into the kwargs its callbacks see.", why: "B249's PreCall models input, model and additional_args only, so adding an empty key here would change that shared type instead; B249 owns the pre-call surface.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10804-L10814"}
kept_bugs:
  - what: Caller extra_headers cannot override Authorization or Content-Type. validate_environment mutates the caller's map in place (provider Bearer key, application/json), and the handler's later headers.update re-applies that same map, so the caller's values are gone.
    why: A setup passing its own Authorization gets the provider key on the wire, and code depending on that would send the wrong credential if the caller's header won.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L63-L79
  - what: The list handlers accept a timeout and never pass it to the GET in either mode, so a list runs on the selected client's own timeout whatever the caller asked for.
    why: A deployment setting a short per-call timeout relies on the list ignoring it and on the client default applying; honoring it would time out lists LiteLLM lets run.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10956-L10956
  - what: The list GET never raises for a 4xx or 5xx status, so a JSON error body comes back as a successful list result and _handle_error never sees a list status error. A non-JSON error body becomes get_error_class's error at that status instead.
    why: A setup that reads an error body out of a list call depends on getting it back rather than on an exception; raising would change what those callers receive.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10956-L10960
