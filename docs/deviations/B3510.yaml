task: B3510
deviations:
  - what: Decision numeric fields preserve arbitrary JSON number representations.
    why: serde_json arbitrary_precision requires serde_json::Number for reliable parsing and round-tripping.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/decisions.py#L102-L137
  - what: OpenAI decision answer name may be omitted and becomes null.
    why: The Rust record uses an optional field and constructs answers internally.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/decisions.py#L285-L333
  - what: decisions_text preserves incoming JSON number spelling.
    why: serde_json retains number text under arbitrary_precision.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/decisions/transformation.py#L59-L60
  - what: Token counts, probabilities, scores and score indexes are any JSON number and keep the digits they arrived with, so 1.5 tokens is accepted, "5" as a string is refused, and a probability sent as 1 comes back as 1 where Pydantic writes 1.0.
    why: The workspace turns on serde_json's arbitrary_precision, and under it u64 and f64 fields inside flattened or tagged records fail to parse, so the records hold serde_json::Number.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/decisions.py#L102-L137
  - what: The name key of an OpenAI decision answer may be left out and reads as null, where LiteLLM requires the key and only allows its value to be null.
    why: serde fills a missing Option field with None, and betterlite builds these answers itself rather than reading them from a client.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/decisions.py#L285-L333
  - what: decisions_text writes each number with the digits it arrived with, so 1.50 and 1e16 stay as sent where json.dumps writes 1.5 and 1e+16.
    why: serde_json keeps the number text under arbitrary_precision; the separators and ASCII escaping do match json.dumps.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/decisions/transformation.py#L59-L60
