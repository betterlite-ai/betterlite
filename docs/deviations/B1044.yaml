  - what: An output cap outside i64, or a cap times the candidate count above i64::MAX, gives the no-cap floor estimate or a saturated i64::MAX token count, where LiteLLM's Python int keeps the exact value.
    why: betterlite counts tokens and limits in i64, so a value beyond it has no exact representation and the estimate stays bounded.
