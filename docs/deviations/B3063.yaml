task: B3063
deviations:
  - what: The destination takes no prefix argument.
    why: LiteLLM stores prefix on the instance and never reads it, so no upload path or request depends on it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/destinations/mavvrik_destination.py#L118
  - what: An error body that is not valid UTF-8 is cut where the valid text ends, and the 200 and 400 limits count bytes.
    why: The rules refuse lossy decoding of bytes, and the task sets the limits in bytes. LiteLLM slices decoded text by characters and replaces bad bytes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/destinations/mavvrik_destination.py#L159
  - what: A Mavvrik or GCS response body over 1 MiB is a transport error.
    why: LiteLLM's httpx client reads a body of any size. Every answer here is a small JSON object or an error page cut at 200 or 400 bytes, so a larger body is a broken endpoint and the read is bounded.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/destinations/mavvrik_destination.py#L159
