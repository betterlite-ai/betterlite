task: B3755
deviations:
  - {what: "Cato and Lakera guardrails are initialized and invoked through the betterlite-guardrails module, not loaded as Python callbacks.", why: "betterlite is Rust; guardrail dispatch is built into the proxy request handling, not registered as callbacks.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/__init__.py#L11-L29"}
  - {what: "Enabled roles for Lakera are loaded at proxy startup from the guardrail config, not dynamically from litellm.guardrail_name_config_map at request time.", why: "betterlite loads all configuration before startup and does not mutate it per request.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lakera_ai.py#L144-L152"}
  - {what: "The Cato output websocket must deliver each message within the guardrail's timeout, where LiteLLM's websockets client waits on recv indefinitely.", why: "An unbounded wait is the hang rule owned-behavior-is-built fixes; a working Cato answers within the same timeout its HTTP analyze calls use.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L653-L666"}
  - {what: "Each frame the Cato output websocket sends must be accepted within the guardrail's timeout, where LiteLLM's websockets client waits on send indefinitely.", why: "An endpoint that keeps its socket open but stops reading would hold the forwarding task and its buffered model chunks forever, the hang rule owned-behavior-is-built fixes.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L653-L666"}
  - {what: "A chat choice whose content is not a string is not inspected, where LiteLLM passes any non-null content value to Cato and writes the redaction back into that field.", why: "betterlite keeps the typed JSON shape of the response: only text content and non-empty tool-call argument strings are fragments, so a list content is never replaced by a string.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L514-L529"}
  - {what: "A Cato output redaction that is not a string fails with a 502 before anything is written, where LiteLLM assigns the value it read to message.content or the output item's field.", why: "A non-string redaction cannot replace a typed text fragment, and refusing it keeps the caller's response from being rewritten with data the fragment did not hold.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L532-L539"}
  - {what: "A Cato output block_action without a detection message carries betterlite's own wording in the 400 it raises, where LiteLLM raises HTTPException(400, detail=None).", why: "Error messages are betterlite's own per rule errors-match-litellm, which keeps the 400 status unchanged.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L467-L480"}
kept_bugs:
  - {what: "With category_thresholds configured, a response carrying flagged=true but no category_scores passes, because LiteLLM only compares configured thresholds and never falls back to the flagged flag.", why: "A working LiteLLM setup with thresholds relies on the thresholds deciding the block, and the oracle confirms the same answer.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lakera_ai.py#L74-L113"}
  - {what: "A stream message that carries no verified_chunk, no done and no blocking_message is logged and ends the model stream instead of failing it, as LiteLLM's streaming hook returns after its error log.", why: "A working Cato sends only the three known shapes, so copying the end-of-stream keeps the same observable behavior for it.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L637-L651"}
