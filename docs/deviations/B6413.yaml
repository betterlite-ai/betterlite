task: B6413
deviations:
  - what: A missing api_base in the embedding URL is a typed SambaNovaEmbeddingError with LiteLLM's message, not a Python ValueError.
    why: Rust has no ValueError; the message stays "api_base is required for SambaNova embeddings" and B184 decides how the proxy reports it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sambanova/embedding/transformation.py#L33-L34
  - what: An embedding reply that parses as JSON but is not an object, or whose usage or data has the wrong shape, is a typed SambaNovaEmbeddingError::Shape. A usage counter outside 0 through 4294967295 is refused the same way, and a data record keeps only object, embedding and index. LiteLLM raises AttributeError or pydantic ValidationError for the malformed values, keeps the unbounded counters, and copies each record as sent.
    why: betterlite decodes the body at the boundary into SambaNovaEmbeddingResponse and the shared B006 EmbeddingRecord instead of leaving data and usage untyped, so a malformed upstream body fails with a typed error rather than later at an attribute access.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sambanova/embedding/transformation.py#L114-L130
  - what: A reply body that is not valid UTF-8 is a typed SambaNovaError whose message is the serde_json error, where LiteLLM puts httpx's lossy-decoded text in the message. The status and headers are the same.
    why: betterlite refuses bytes it cannot read instead of replacing them with U+FFFD, and the lint table denies String::from_utf8_lossy.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sambanova/embedding/transformation.py#L114-L121
