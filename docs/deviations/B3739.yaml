task: B3739
deviations:
  - what: "HTTP error handling distinguishes caller-fixable upstream errors (e.g., 429 rate limit) from proxy-side credential problems (401/403). 401/403 map to 502 Bad Gateway; others preserve upstream status. Retry-After header is forwarded when present."
    why: "Transparent error propagation allows callers to implement retry-after logic for transient errors while treating credential/consent issues as permanent proxy failures. Matches LiteLLM's status-code preservation logic."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L141-L165"
  - what: "_assemble_responses_api_from_chunks accepts the latest event carrying a ResponsesAPIResponse body, not only terminal events. Fallback order is response.completed, then response.failed, then response.incomplete."
    why: "LiteLLM's behavior: the function preserves non-terminal responses to allow response content scans on partial data. The docstring describes terminal events but the code path includes non-terminal events."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L270-L290"
  - what: "_resolve_user_id_for_blocking uses _resolve_trusted_user_id only (key/JWT-bound identity), not caller-supplied hints. Raises HTTPException 400 with different messages for untrusted-identity-available vs no-identity cases to guide caller remediation."
    why: "Identity spoofing risk: caller-supplied metadata (user, end_user_id, safety_identifier) can impersonate Entra users. Blocking DLP must fail closed with guidance on the specific remediation needed (bind user_id to key or provide bound identity)."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L340-L380"
  - what: "The Responses API input conversion takes the tool-call cache as a parameter the caller supplies instead of reading LiteLLM's process-global TOOL_CALLS_CACHE. An empty cache means a function_call_output item is scanned without the cached assistant tool-call reconstruction."
    why: "betterlite injects its dependencies (rule inject-dependencies); there is no process-global cache. The tool output's own content is still scanned; only the reconstructed prior tool call from a cached definition is absent."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/responses/litellm_completion_transformation/transformation.py#L1637-L1645"
  - what: "A non-2xx answer from the Entra token endpoint keeps LiteLLM's status mapping (401 and 403 become 502, others such as 429 and 503 pass through) but the client's error carries no Retry-After header, even when the token endpoint sent one."
    why: "B3738's PurviewGraphError::TokenStatus in purview_graph_client/token_cache.rs keeps only the status, and that file is outside this task's scope. Graph API failures still forward Retry-After. Test a_token_endpoint_status_maps_like_graph_without_retry_after pins the current behavior."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L141-L165"
  - what: "The guardrail record's guardrail_response holds the processContent fields betterlite parses (policyActions with @odata.type, action and restrictionAction, and protectionScopeState when it is modified or notModified), not the raw Graph body. A policy action field Graph left out is recorded as an empty string, and other top-level keys of the answer are not recorded."
    why: "B3738's ProcessContentResponse in purview_graph_client/wire.rs is a typed, deserialize-only record and process_content returns no raw body; both are outside this task's scope. Status, provider and timings match LiteLLM. Test content_check_records_the_process_content_answer pins the recorded shape."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/microsoft_purview/purview_dlp.py#L186-L196"
