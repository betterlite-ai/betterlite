task: B134
deviations:
  - what: "The litellm-proxy console-script alias and its deprecation banner are not ported; lite is the only binary this crate builds."
    why: "litellm-proxy carries the LiteLLM name, which rules.yaml's litellm-boundaries rule forbids for any crate or binary, and LiteLLM itself marks the alias deprecated."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/main.py#L186-L190"
  - what: "The version command and --version/-v read the server version through the shared client every other command uses, not through a HealthManagementClient port."
    why: "HealthManagementClient lives outside litellm/proxy/client/cli and is not part of this family; the shared client already sends every other request in this crate."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/main.py#L40-L53"
  - what: "Help text, the version output and the shell banner say betterlite or the proxy, not LiteLLM."
    why: "rules.yaml's litellm-boundaries rule keeps the LiteLLM name off everything but wire-level identifiers; CLI text is not one."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/main.py#L93-L94"
  - what: "login, the agent commands and up print the SSO URL but never launch a system browser."
    why: "The crate has no browser launcher port, and this wiring task adds no process-spawning dependency; the URL is printed so the operator can open it."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/auth.py#L917"
  - what: "Ctrl-C during the interactive shell ends the process with the default SIGINT disposition instead of printing a blank line and Goodbye first."
    why: "The REPL installs no signal handler, so a signal-safe read loop the crate does not have would be needed to match Python's KeyboardInterrupt handling; Ctrl-C still ends the shell."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/interface.py#L207-L208"
  - what: "The shell prompt box, its borders, the prompt marker and the connection line carry no ANSI colour or bold styling."
    why: "The shell writes into injected streams that do not report terminal capability, and Click itself drops styling when stdout is not a terminal, so only an interactive terminal displays the difference."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/interface.py#L38-L46"
  - what: "login's SSO polling, key probes and model listings use the shared client's fixed 30-second request timeout instead of the per-call 10-second request timeout LiteLLM passes."
    why: "The shared client exposes one send path with one timeout, and its module is owned outside this task; the request still fails rather than hanging forever."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/auth.py#L513-L525"
kept_bugs: []
