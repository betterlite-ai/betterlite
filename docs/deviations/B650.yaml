task: B650
deviations:
  - what: The non-extended spellings that Python's datetime.fromisoformat accepts parse as None; these are a date or time without separators (20240115, 20240115T103000), ISO week dates, ordinal dates, a date-time separator other than T or a space, Unicode decimal digits, an offset that carries seconds, and an offset whose minute field is 60 or more (Python normalizes the total). The extended form is enforced instead, so a second of 60, a lowercase z suffix and whitespace past the separator are rejected the way fromisoformat rejects them.
    why: Bedrock emits the extended RFC 3339 form with a T separator, a Z suffix and no offset seconds, so a working retrieval never sends the rejected spellings; betterlite validates the fromisoformat grammar it accepts before handing the value to chrono instead of porting CPython's whole parser.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/batches/transformation.py#L460-L467
  - what: A record count or epoch value outside the 64-bit integer range is a typed error naming the field instead of Python's arbitrary-precision int.
    why: the count and epoch records are i64 typed, so a value larger than that cannot be carried; no working setup reports record counts or timestamps in that range.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/batches/handler.py#L82-L102
