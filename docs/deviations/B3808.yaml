task: B3808
deviations:
  - what: An unknown key in a route definition, in a custom routes file or inline, is rejected with an error that names the key, and the route index for an inline route, where LiteLLM reads the keys it knows and drops every other one.
    why: A dropped key changes which prompts match a route without a word, and a misspelled utterances key would leave the route with no utterances at all; the parse error names the field when the config is read.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L78-L114
  - what: An utterance that is not a string is rejected when the route is loaded, where LiteLLM passes the list to semantic_router's Route and the non-string value fails later inside the encoder.
    why: Betterlite keeps a route's utterances as strings, and the route loader is the place that knows the field is a list of texts; the load error names the route index and the field instead of an embedding failure at the first request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L93-L114
  - what: A plain scalar that PyYAML resolves to a date or a number while betterlite's YAML reader keeps its text, such as 2020-01-01, 1:30, 1:30.5, 0_1 or 1_, is read as its text in a route name, description or utterance, where PyYAML hands LiteLLM a date or a number, so Route rejects it as a name or a description and carries the non-string utterance into the encoder.
    why: The pass that restores PyYAML's scalar reading only covers a scalar the reader turned into a number or a boolean; these stay text because the reader cannot parse them, and turning them into PyYAML's dates and numbers would mean reimplementing its constructors for every spelling.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L58
  - what: A similarity_threshold takes betterlite's YAML reader inference rather than PyYAML's reading, with 0127 read as 127.0 where PyYAML reads 87, 0o10 and 0X1f read as 8.0 and 31.0 where PyYAML reads strings that Route rejects, and 0_1 or 1_ refused as not a number where PyYAML reads 1.
    why: The threshold is a number field, so it takes the reader's inference, which also reads 1e3, 1.5e3 and 1e-3 as the numbers pydantic coerces them to; matching every PyYAML integer and float spelling would mean reimplementing its constructors.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L94
  - what: A similarity_threshold that is NaN or infinite is rejected, by route name when the route is built and by the YAML reader for the .nan and .inf spellings in a route file, where LiteLLM accepts it as Route.score_threshold and compares every utterance similarity against it.
    why: A non-finite threshold makes the comparison meaningless, and a config that carries one is malformed; the error names the route instead of silently matching everything or nothing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L94-L99
  - what: A custom routes file larger than 1 MiB is refused before it is parsed, where LiteLLM reads a file of any size.
    why: Rule bounded-inputs requires a finite limit on every read of an untrusted file; the limit is over the whole document, and a route file that large cannot be a real guardrail config.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L53-L63
  - what: A custom routes file that repeats a key inside one route mapping is refused, where PyYAML's safe_load keeps the last value of the duplicated key.
    why: A repeated key is a config the author cannot have meant, and betterlite's YAML reader refuses it for every config file rather than keep whichever value came last.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L58
  - what: The built-in templates are the two YAML documents embedded in the binary, so a third .yaml file a user drops into LiteLLM's route_templates directory is listed by list_builtin_templates and loadable by name there, while betterlite reports it as an unknown template.
    why: The task requires the built-in templates as static data so the binary needs no package directory of its own; a template a setup adds to the installed package is not shipped with betterlite.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/semantic_guard/route_loader.py#L43-L51
  - what: A DEFAULT_SEMANTIC_GUARD_SIMILARITY_THRESHOLD that is not a decimal number, such as nan or inf, is refused when the variable is read, where Python's float() accepts it and every route inherits a non-finite threshold.
    why: A non-finite threshold makes every similarity comparison meaningless, and betterlite's environment number parser takes only digits, a sign, a decimal point and an exponent; the error names the variable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L174
