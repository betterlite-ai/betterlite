task: B316
deviations:
  - what: The strategy arm prices a deployment from the model_info its registration carries, not from the router's model cost map. DeploymentCosts picks, per model name, the deployment that mirrored the fewest litellm_params prices over its model_info, and a field that deployment set itself reads as absent because Deployment.__init__ copied the override there. The pinned selector reads litellm.model_cost for every field litellm_params does not supply, whatever the sibling deployments set.
    why: StrategyContext carries no model cost registry, and adding one means a new field on StrategyContext or context.rs, which this task does not own. model_info holds the model cost map's prices whenever the deployment was registered from the map, which is what the pinned get_model_info copies, so the stand-in matches as soon as one deployment of the model prices from the catalog and never lets one deployment's override decide another deployment's price.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L242-L259
  - what: A price key that is set but falsey, or a model whose every deployment sets its own prices, ranks at the pinned 5.0 per-token default for that field instead of at the model cost map's price. The pinned selector treats a falsey override as absent and reads litellm.model_cost, so a zero override does not make a deployment free there.
    why: model_info holds the override's mirrored value for that field, not the catalog's, and reading it would make a deployment with a zero price outrank every sibling. The 5.0 value is the pinned default for a model absent from the cost map and the only catalog stand-in the arm has.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L246-L259
  - what: Prices, limits and window counts are Decimal arithmetic, with window counts widened from i64 and sums saturating at Decimal's bounds. The pinned selector adds Python floats and ints, so a pair of prices whose float sums tie or round apart can order differently, and a sum beyond Decimal's range saturates instead of reaching infinity.
    why: The task requires exact decimal price arithmetic end to end, and the same Decimal parser already reads every other price in betterlite. Exact sums also remove the float ties the pinned stable sort resolves by map order.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L262
  - what: A price or limit of the declared number type that Decimal cannot hold, such as a 30-digit integer or input_cost_per_token 1e30, fails the selection with CostRoutingError::NonNumeric naming the deployment and field. The pinned selector sums the Python float, which holds that value, and ranks the deployment by it.
    why: The task requires exact decimal price arithmetic, and the shared Decimal parser rejects a lexeme that would overflow its 96-bit mantissa. A price that large is outside every cost map LiteLLM publishes; betterlite refuses it with the field named instead of silently ranking it at a rounded value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L248-L262
  - what: A minute label is the UTC wall clock, formatted as %Y-%m-%d-%H-%M. The pinned selector calls datetime.now() three times, so its label follows the host's local time zone, and a request that crosses a minute boundary between the three calls can mix two minutes' parts.
    why: betterlite's clocks are UTC everywhere else and the router carries no local time zone setting. The oracle probe patches the clock with a UTC datetime on both sides, so the two agree there; a host outside UTC buckets its windows differently from LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L52-L54
  - what: A deployment's window is two B304 counter keys, cost_map:{model_group}:{id}:{minute}:tpm and :rpm, each written with a 60 second TTL. The order index is capped at 1024 groups and 1024 deployment ids per group, and a key over the value store's length limit or evicted from it reads as zero usage. The pinned handler writes one cost_map:{model_group} nested dict to the router cache, whose in-memory default is 200 keys with a 600 second TTL (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/in_memory_cache.py#L41-L46) and whose Redis copy has no TTL.
    why: B304's counters are the router's only shared value store, and they increment and expire single keys rather than rewriting a nested document. A minute older than the current one is never read by either side, so the TTL changes memory use only; the caps appear past a thousand groups, deployments or keys, where they drop tracking or usage with a warning instead of growing without bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L69-L87
  - what: The first-observation order of a group's deployment ids lives in process memory. The pinned map is written through the router cache, so with Redis every instance shares one order, while betterlite prefers each process's own insertion order and a restart starts the order over.
    why: B304's store holds counters and spend values, not ordered sets, and this task owns no store write path. The order only breaks ties between equal costs; the window counts that decide capacity are still shared.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L69-L78
  - what: At route time the strategy arm builds its CostRouter inside the selection and screens capacity over a cold minute, so every deployment reads zero usage and the order index is empty on every route. A deployment over its tpm or rpm in the current minute is still selectable, and a tie between equal-cost deployments follows the model list order, where the pinned handler resolves it by first-observed success. CostRouter's windows argument carries no store there; only a caller that has the value store, as the oracle probe does, reads the counters and keeps one router across selections.
    why: StrategyContext carries no value-store handle and no place to keep a router between requests, and wiring either in means a new field on StrategyContext or context.rs, which this task does not own. The service takes its windows as a parameter, so the integration is a constructor call away once the route holds the store.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L281-L289
  - what: The arm takes the request's input-token estimate from the route's B365 request facts and counts zero when the request has no estimate. The pinned selector runs token_counter(messages=messages, text=input) itself and counts zero when that raises.
    why: B365 owns request token counting in betterlite, and a second counter inside the selector would use a different tokenizer configuration from the one that admitted the request and count the same text twice. The probe counts the step's text with the same cl100k path token_counter takes for a text-only call, so the oracle compares the two selectors on one estimate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L208-L211
  - what: When no deployment passes the screen, the arm answers with an index past the pool and the pipeline's existing no-deployment routing error reports it. The pinned selector returns None and the router raises its own no-deployments-for-model exception.
    why: The no-deployment error belongs to the routing pipeline (B016, B301), which already maps an index past the pool to it; building a second error type inside the selector would report the same condition two ways.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L294-L295
  - what: The pinned selector fills _cost_per_deployment with api_base to cost entries for Langfuse and Slack debug logs. Betterlite emits nothing for it and logs through tracing instead; the map does not affect the selection.
    why: The router has no Langfuse or Slack debug hook to hand the map to, and the values it holds are already visible in the selector's own tracing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L275-L282
  - what: The service takes a success as SuccessEvent, whose total_tokens is a number, and the callback that builds the event owns reading it from a ModelResponse's litellm.Usage. The pinned handler performs that check itself.
    why: betterlite's router holds typed events rather than provider response objects, and the callback (B304) already inspects the response. The oracle probe builds the event from a ModelResponse and a Usage with the same isinstance checks, so the extraction stays observable there.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L58-L63
kept_bugs:
  - what: A price override of 0 is ignored and the model cost map's price applies. Betterlite copies the falsey test on the override and falls back the same way wherever it has the cost map, so a zero override never means free tokens.
    why: A working setup can rely on a zero or null price meaning "unset" rather than free; changing it would silently reprice deployments that have run against LiteLLM. The zero-price-truthiness case pins the fallback on both sides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L246-L259
  - what: A tpm or rpm of 0 in any of the top level, litellm_params or model_info is skipped by the `or` chain, so it means "read the next source" and, when no source has a truthy value, "no limit". It never means "no capacity".
    why: A model_list entry with tpm 0 runs unlimited against LiteLLM, and a betterlite that read it as a hard zero would refuse every request to that deployment. The boundaries tests pin both sides of each source.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L229-L241
  - what: A selection adds every healthy deployment id the map has not seen, at this minute's zero usage, and the ids are never removed. A deployment that leaves the healthy pool keeps its entry and is skipped while missing, and a group with no stored map gets a throwaway dict that keeps nothing.
    why: The pinned handler mutates the dict it fetched, and its `or {}` leaves a missing group untracked; both are what a running LiteLLM does, and the stored-order tests pin both sides of the missing group case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L200-L205
  - what: When two healthy deployments carry the same model_info id, the scan keeps the last one in pool order, not the first.
    why: The pinned loop assigns _deployment on every match and never breaks. Duplicate ids are a broken configuration, but a betterlite that kept the first would route to a different deployment than LiteLLM for the same model_list.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L221-L227
  - what: A failed window write is swallowed and the deployment keeps its place in the map with the usage it already had. The pinned callback catches and logs every exception of the update, so a store failure never fails the request.
    why: The success callback runs after the response is delivered, and turning a cache write failure into a request error would break calls that LiteLLM serves. Betterlite warns on the failed increment instead of logging an exception.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_cost.py#L92-L95
