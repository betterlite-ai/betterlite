task: B735
deviations:
  - what: >-
      Prefetch validation warnings name the row kind and model without printing rejected values.
    why: >-
      Source Pydantic errors can carry credentials or stored private data, so native diagnostics redact values.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_object_prefetch.py#L245-L258
  - what: >-
      A failed object permission cache read fails get_object_permission.
    why: >-
      LiteLLM's DualCache.async_get_cache logs the exception and returns None, so a broken cache would turn every call into an uncached database read; the fault surfaces instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/dual_cache.py#L294-L297
  - what: >-
      On the normal route a failed cache write after a successful row read returns no permission.
    why: >-
      LiteLLM's DualCache.async_set_cache swallows the write failure and still returns the validated permission; betterlite's cache reports it, and get_object_permission keeps LiteLLM's code shape where the write sits inside the swallowing try.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_checks.py#L4023-L4034
  - what: >-
      The organization entries' TTL comes from the startup-loaded DEFAULT_IN_MEMORY_TTL key, a trimmed integer defaulting to 5.
    why: >-
      LiteLLM parses int(os.getenv("DEFAULT_IN_MEMORY_TTL", 5)) into a module constant at import; betterlite keeps startup configuration in one section and a bad value fails startup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L498
