task: B1745
deviations:
  - what: When a table's sixty second deadline fires after its COMMIT was sent, the failure is ambiguous, so the caller drops that table's increments instead of sending them again; a deadline that fires before the commit stays requeue-safe. LiteLLM's interactive transaction timeout is a non-connection error with no SQLSTATE, so it is always requeued.
    why: betterlite's deadline runs on the client, and a commit that was already on the wire may have applied, so replaying it could count the same spend twice. Prisma's query engine rolls the transaction back on its side, which is why the source can treat every timeout as unapplied.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_spend_update_writer.py#L275-L277
  - what: The user_api_key_cache entries a committed team membership or project table leaves stale are evicted in one delete call per table, in sorted id order; LiteLLM awaits one async_delete_cache per key in the order the increments arrived and stops at the first failure.
    why: The cache port betterlite already has (ResetCache::delete_user_api_keys) takes a batch, and either way a failure surfaces after the committed mark with the table kept out of the replay.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_spend_update_writer.py#L2170-L2178
kept_bugs:
  - what: A team membership key with fewer than four `::` components fails the whole entity commit before the membership transaction opens, without a failure report, and the requeue-safe classification keeps the table for the next flush.
    why: The source splits the keys for its invalidation list outside the retry loop, so the IndexError escapes unreported; the enqueue side always writes four components, so no working setup produces such a key, and betterlite keeps the same failure shape.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_spend_update_writer.py#L2144-L2148
  - what: An organization membership key that does not split into exactly four `::` components is reported once as an ordinary non-retryable failure and stays requeue-safe, so the same batch is sent again on the next flush.
    why: The source's tuple unpacking raises ValueError inside the transaction, which its failure handler reports and its requeue rule keeps; betterlite copies that path because the task asks for the ordinary failure path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_spend_update_writer.py#L2216-L2222
  - what: An organization membership whose nullable spend is NULL stays NULL after an increment, because the update adds to the column in SQL.
    why: Prisma's increment compiles to the same column arithmetic, so a membership created without spend never starts counting in LiteLLM either; betterlite keeps the column semantics rather than coalescing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/db_spend_update_writer.py#L2218-L2221
