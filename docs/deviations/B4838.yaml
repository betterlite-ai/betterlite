task: B4838
deviations:
  - what: "grep that finds nothing returns an empty match list; LiteLLM returns the error \"Path '/': grep failed\"."
    why: "xargs exits 123 when its grep batch found nothing, and LiteLLM only accepts 0 and 1, so every empty search is reported as a failure. betterlite treats 123 with empty stdout and stderr as no matches; a real grep or find error still carries its stderr."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L354-L355"
  - what: "edit refuses a file that is not valid UTF-8 with \"Error editing file '<path>': the file is not UTF-8 text\"; LiteLLM decodes it with replacement characters and writes the mangled bytes back."
    why: "The repository bans lossy UTF-8 decoding, and writing replacement characters back corrupts a binary file the agent only meant to patch."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L97-L98"
  - what: "The sync methods refuse every thread that is inside a tokio runtime, not only the backend's own event loop thread."
    why: "tokio's Handle::block_on panics on any runtime thread, and a blocking-pool thread can't be told apart from a worker thread through a public API. Callers on runtime threads use the async methods."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L173-L182"
  - what: "Reads pass a 50 MiB cap and command runs a 16 MiB output cap to the Sandbox; LiteLLM reads and runs without a cap. A read over the cap reports the file as not found, and an execute over it returns exit code 124."
    why: "The Rust Sandbox trait from B4830 requires byte caps on read and run under the bounded-inputs rule. 50 MiB is LiteLLM's snapshot file limit, and 16 MiB sits far above the 100,000 bytes execute keeps."
    link: "https://github.com/BerriAI/litellm/blob/d665fdc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L205-L207"
  - what: "The include glob is the glob crate plus comma brace expansion, not wcmatch: numeric ranges such as {1..3} stay literal, ** that is not a whole segment and an unclosed [ raise InvalidGlobPattern instead of matching nothing, and backslash escapes reach the matcher as plain characters."
    why: "No Rust crate has wcmatch's dialect. The glob crate keeps its hidden-file rules (no match on a leading dot, ** never enters a dot directory), and the hand-written expansion keeps wcmatch's 1,000-expansion limit."
    link: "https://github.com/BerriAI/litellm/blob/d6655847fcad6cc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L308-L313"
  - what: "read takes offset and limit as unsigned numbers, so the clamping of a negative offset or limit to zero happens where the tool arguments are parsed."
    why: "A negative line number has no meaning past that boundary, so the type rules it out."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L209-L221"
  - what: "ls, glob and grep split command output on newlines only; Python's splitlines also splits on \\r, \\x0b, \\x0c, \\x1c to \\x1e, \\x85, \\u2028 and \\u2029, so a file name holding one of those is broken into bogus entries there and kept whole here."
    why: "find, grep and the ls script end each record with a newline, so the other separators can only come from inside a name."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L101-L106"
