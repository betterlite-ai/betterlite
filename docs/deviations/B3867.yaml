task: B3867
deviations:
  - what: betterlite returns its own error messages (not copied from LiteLLM) for HTTPException details such as "Not allowed to ingest agent traces".
    why: Error messages are treated the same as in B003 and the other management routes; HTTP oracle cases compare status and error codes, not wording.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/tracing_endpoints.py#L45-L74
  - what: OTLP_MAX_CONCURRENT_INGESTS, OTLP_RETRY_AFTER_SECONDS and the 30 second body read timeout are fixed at LiteLLM's defaults; betterlite does not read their environment overrides.
    why: Repository rules restrict environment access to the config crate, and B8911's agent_tracing section resolves only the CLICKHOUSE_* variables. A deployment that overrides these variables keeps the defaults until the config section carries them.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L55-L58
  - what: An invalid query parameter (a non-integer start_ms or end_ms) answers 400 with a plain detail, where LiteLLM's FastAPI validation answers 422 with a list of issues.
    why: The route parses its query with the shared axum extractor, whose rejection is a fixed 400; the 422 issue list belongs to the framework's validation envelope rather than this route's behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/tracing_endpoints.py#L113-L116
  - what: A client that disconnects during POST /v1/traces cancels the in-flight ingest instead of letting it finish in a shielded task.
    why: LiteLLM spawns the ingest in a task and shields it from request cancellation; betterlite's async rules forbid detached tasks, and the receiver lifecycle has no server-owned task set to drain, so the parse and insert run on the request future.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/tracing/receiver.py#L126-L139
