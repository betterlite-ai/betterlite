task: B1384
deviations:
  - {what: "The tuning POST carries one 600-second deadline (OutboundRequest.deadline) instead of httpx's separate total and connect timeouts.", why: "B173's transport contract carries one deadline per request, so a budget per phase is not representable at the call site.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/fine_tuning/handler.py#L249"}
  - {what: "A connection is abandoned after B173's 10-second connect timeout, where LiteLLM's sync handler allows 5 seconds to connect.", why: "B173 owns the transport limits every provider shares; a per-provider connect timeout would need a pool-level change outside this task.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/fine_tuning/handler.py#L249"}
  - {what: "A hyperparameter key the response declares outside epoch_count, learning_rate_multiplier and adapter_size is dropped, where LiteLLM spreads every leftover key into the OpenAI job record.", why: "docs/compatibility.md stops parity at the types LiteLLM declares, and FineTuneHyperparameters names exactly those three keys.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/vertex_ai.py#L478-L492"}
  - {what: "A createTime whose instant jiff cannot hold, such as a year-9999 timestamp with an offset, reads 0, where LiteLLM's fromisoformat computes a value or raises into its own 0.", why: "The shared vertex decoder ranges the same way CPython's mktime does, and the upstream source also answers 0 for a value it cannot convert.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/fine_tuning/handler.py#L40-L50"}
