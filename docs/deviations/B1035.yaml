task: B1035
deviations:
  - what: Batch files are read as bytes or a path under the resolved API limits (size, line and row bounds), and a file over a bound fails the read.
    why: LiteLLM reads any size into memory, which lets one upload exhaust the gateway.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/batch_utils.py#L18-L73
  - what: Streams, tuples and str sources of a file are reduced to bytes or a path, and the file handle seek that LiteLLM does after a read is dropped.
    why: A Rust caller hands over the bytes it already holds, so there is no handle to rewind.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/batch_utils.py#L76-L150
  - what: A rewritten file is standard JSON, rows keep no key order, and the NaN and Infinity literals Python accepts are rejected.
    why: serde_json writes and reads standard JSON, and docs/compatibility.md leaves json.dumps formatting to the runtime.
    link: ""
