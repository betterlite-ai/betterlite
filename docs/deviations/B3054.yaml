task: B3054
deviations:
  - what: A LITELLM_MAX_ITERATIONS_TTL value that is not a whole number of seconds, including a negative one, is a load error that names the variable.
    why: LiteLLM's int() turns a negative value into a negative lifetime, which the Lua script's EXPIRE and the local cache treat as an already-expired counter, so the session's count never accumulates; non-integer text crashes hook construction at startup with a bare ValueError. A lifetime below zero has no meaning for a session counter, and docs/compatibility.md sends every environment number through one parser that refuses text the field cannot hold. An empty value counts as unset there, so it keeps the 3600-second default instead of stopping the load.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/max_iterations_limiter.py#L71-L73
  - what: A session_id or max_iterations that arrives as a JSON value other than text, a number, a boolean or integer text, or a number outside the 64-bit range, is treated as absent (session_id) or refused with a typed error that names the field (max_iterations), and a metadata bucket that is not a JSON object reads as absent; LiteLLM calls str() on the session id, int() on the limit, and .get() on whatever the bucket holds.
    why: the ids and the limit arrive from request metadata and agent configuration as text and numbers, and a non-text session id names a session no caller sent, while a list or object limit reaches int() as an unhandled TypeError or ValueError and becomes a 500 on a request the proxy itself misconfigured. An object-only read of a bucket also turns a stray string into an AttributeError, another 500, and betterlite's counter is an i64, so a limit past that range cannot be counted against. A typed error names the field instead, as docs/compatibility.md says for a value the declared type cannot hold.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/max_iterations_limiter.py#L136-L172
kept_bugs:
  - what: A Redis failure during the increment falls back to the in-process counter, so while Redis is unhealthy a session's counts land only in memory, and once Redis answers again its older count is the one that decides, which lets a session exceed its limit by the calls made during the outage.
    why: the fallback is what keeps agentic loops running through a Redis outage, and a working setup that pairs betterlite with LiteLLM instances on the same Redis relies on both sides counting the same way.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/max_iterations_limiter.py#L183-L204
