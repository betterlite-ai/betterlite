task: B10106
deviations:
  - what: "A2AClient.send_message_streaming wraps the inner asend_message_streaming in contextlib.aclosing, so closing the outer stream after a chunk awaits the inner stream's close before aclose returns, and an error that close raises reaches the caller. LiteLLM yields the inner generator's chunks from a bare async for, so closing the outer stream leaves the inner one to asyncio's async generator finalizer, which closes it in a task on a later loop turn; the inner stream's close, and any error it raises, then runs outside the caller's context and the error goes to the loop's exception handler."
    why: "The late close is a leak the caller can neither observe nor wait for, and a cleanup failure is lost instead of surfacing. No working setup relies on that timing: a caller that closes early got a stream whose agent connection was still open, and a caller that reads to the end gets the same chunks either way."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/client.py#L98-L106
  - what: "asend_message_streaming in betterlite.a2a_protocol.main is annotated AsyncGenerator[SendStreamingMessageResponse, None], where LiteLLM declares AsyncIterator[Any]."
    why: "The function is an async generator, and the AsyncGenerator annotation is what lets A2AClient.send_message_streaming give it to contextlib.aclosing and close it deterministically without a type suppression, which the zero-expect budget forbids; an AsyncGenerator is an AsyncIterator, and LiteLLM's Any cannot be copied because the wheel's types carry no Any."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/a2a_protocol/main.py#L637
