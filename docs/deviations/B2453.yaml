task: B2453
deviations:
  - {what: "A provider config whose request transform returns a plain dict is rejected by LiteLLM with ValueError \"Provider <class> must return AudioTranscriptionRequestData\". betterlite's transform_audio_request returns AudioTranscriptionRequestData by its signature, so a plain dict cannot be returned, and a config that leaves the default transform raises B1122's MissingRequestTransform instead.", why: "The typed contract makes the misuse impossible to express, so there is no value to check at runtime; the error still stops the call before anything is sent.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1588-L1592"}
  - {what: "Raw byte data combined with a non-empty files map fails with the typed BytesWithFiles error before anything is sent, where LiteLLM hands both to httpx and its encoding raises inside the post's try, which becomes a synthesized 500 BaseLLMException.", why: "httpx cannot send both on either side; betterlite names the contradiction instead of reporting a made-up provider status.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1704-L1717"}
  - {what: "A complete URL that is not a URL, and a header name or value HTTP cannot carry, fail with the typed Url, HeaderName or HeaderValue error after the pre-call and before the send, where LiteLLM lets the post raise and reports a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable URL or header instead of claiming the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1710-L1717"}
  - {what: "A provider error body that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\" in the provider error's message, where LiteLLM reads it through the httpx response's text.", why: "betterlite records the body as JSON text; replacement characters would hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
  - {what: "A timeout on the async path renders both durations from Duration values, whole seconds without a fraction and the elapsed time as seconds plus zero-padded milliseconds, where LiteLLM interpolates Python floats and prints 7.0 or 0.1.", why: "The message still reports the timeout the caller passed and the time the failed request took; only the rendering differs, since betterlite keeps durations typed.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866"}
  - {what: "Raw byte data that is not UTF-8 logs no complete_input_dict, where LiteLLM's \"data or {}\" logs the bytes object itself in the pre-call.", why: "betterlite's pre-call record holds JSON text only; an unreadable byte body is left out rather than replaced with text that was never sent.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1602-L1608"}
kept_bugs:
  - what: Both transcription handlers take max_retries and never use it, so a 429 is sent once whatever the caller asked for.
    why: A deployment relying on the handler's single attempt keeps its request count and its provider quota behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1704-L1717
  - what: The async selection is an identity test, so only a boolean true takes the async path and an integer 1 stays on the sync path.
    why: Callers forwarding an untyped value rely on that distinction, and switching it would move integer-1 calls onto the async client.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1664-L1680
  - what: The pre-call logs "data or {}", so an empty dict or empty bytes logs an empty object rather than the value the caller passed.
    why: The logging record is what callbacks and cost tracking read, and a setup matching on an empty complete input depends on the empty object.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1602-L1608
