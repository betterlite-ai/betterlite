task: B4586
deviations:
  - {what: "The status line is the `statusline` subcommand of betterlite-cli instead of a standalone Python script, and tools/management-cli is deleted.", why: "betterlite ships one Rust binary, and the script was only run as a file by Claude Code and Codex hooks.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/statusline_script.py#L1-L21"}
  - {what: "A redirect answer (3xx) from the gateway is not followed and counts as a lookup that is not final.", why: "betterlite's shared outbound client never follows redirects, so a Bearer key is never sent to a host the user did not configure. urllib follows them.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/statusline_script.py#L199-L204"}
  - {what: "A gateway answer larger than 1 MiB is not a session and is not final.", why: "A session answer is a few hundred bytes, and the cap keeps a hostile gateway from filling memory. The script reads the whole body.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/statusline_script.py#L200"}
  - {what: "Money is held as decimals, so a value outside Decimal's range is not a session, arithmetic that would overflow it shows savings unavailable, and a percentage, bar fill or dollar figure on an exact half rounds to even.", why: "A float can sit just either side of a half (1.005 is below it), so Python's round and format can disagree with the exact value. The task rules keep money out of floats.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/statusline_script.py#L323-L381"}
  - {what: "Column widths come from the unicode-width crate (wide and fullwidth characters take two cells, Mn and Me take none) instead of unicodedata.east_asian_width.", why: "The crate is the maintained Rust source of the same East Asian Width table, and the Unicode version it follows can differ from the one inside CPython.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/statusline_script.py#L330-L335"}
  - {what: "A transcript line whose isSidechain is not a boolean, or whose agentId is not a string, is skipped as unreadable instead of being tested the way Python tests it (is True, truthiness).", why: "docs/compatibility.md says a value of the wrong type is an error, and a line that cannot be read as a message is skipped.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/statusline_script.py#L141"}
