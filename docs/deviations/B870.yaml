task: B870
deviations:
  - what: A cached key object that fails to decode fails the request with a 401 auth_error carrying the decode failure; LiteLLM logs the deserialization failure and treats the entry as a cache miss, refetching the key from the database.
    why: The task requires cache read errors to propagate, and B733 surfaces the typed decode error, so a corrupt entry is reported instead of being masked by a database read.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/user_api_key_cache.py#L198-L206
  - what: A store composed without its cache, permission loader or cache writer fails startup with "the identity store is missing required ports: ..."; LiteLLM takes those collaborators as required constructor arguments whose absence surfaces later as an AttributeError on the first request.
    why: The task requires an absent required implementation to be a named startup error while a configured absence of the database stays the runtime NoDatabaseConnectionError.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/resolvers/store.py#L59-L72
kept_bugs:
  - what: An empty-string user_id produces a service_account Principal that still carries a UserIdentity with the empty id, because the principal type test is truthy while the record test is nonnull.
    why: LiteLLM projects the type with "PrincipalType.HUMAN if key.user_id else ..." but the record with "if key.user_id is not None", a working setup can rely on an empty user id never conferring the human type, and the task names this asymmetry as the behavior to keep.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/resolvers/store.py#L169-L177
