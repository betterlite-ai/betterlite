task: B745
deviations:
  - what: An entry of a metadata model-limit, MCP-limit or tag-limit map, or a model_max_budget rpm_limit or tpm_limit, that is not an i64 is skipped and the entries that remain are returned; a value that is not a map at all is read as absent. LiteLLM returns the stored value unchecked inside the map it returns.
    why: LiteLLM hands a string, list or float to the limiter, which reads only the requested model's, server's or tag's entry, so a valid entry next to a malformed one keeps enforcing there. betterlite drops only the malformed entry so the valid ones stay enforced, and treats a non-map value as unset. No working setup stores a value the declared dict[str, int] cannot hold, and returning one would make the limiter compare an i64 limit with text.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L986-L1003
  - what: An output-token estimate or a limit value above i64::MAX (including a float that truncates above it) is treated as malformed or overflowing instead of being kept as an arbitrary-precision Python integer; in a limit map that entry is skipped.
    why: betterlite's limits and estimates are i64 throughout, so a value outside that range cannot be enforced or reserved; LiteLLM keeps it as a Python int. Only absurd operator input reaches this, and the alternative is a silent truncation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L1080-L1107
