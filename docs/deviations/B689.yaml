task: B689
deviations:
  - what: An async open records original_response as the text "lines", where LiteLLM hands the callback the live ModelResponseIterator object.
    why: the port has no Python object to pass and the iterator's lines are the form a JSON record can carry.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L125
  - what: A status error's message is text, so a body that is not UTF-8 reads "<n> bytes that are not text" and the sync non-200 guard joins the response lines with "\n" where LiteLLM reads the raw response bytes.
    why: the transport exposes framed lines and betterlite's error carries the body as String, where LiteLLM keeps bytes in AnthropicError.message.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L173-L179
  - what: A malformed api_base fails as the typed Endpoint error, where LiteLLM's httpx exception reaches the generic handler and becomes AnthropicError(500, str(exception)).
    why: the URL is parsed before the request is built, and a typed error names the bad field instead of a 500.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L107-L111
kept_bugs:
  - what: An async client that returns a non-200 response without raising opens a stream; only the sync helper checks the status and raises AnthropicError.
    why: make_call has no status check, and the shipped HTTP handler raises for non-2xx itself, so a working setup never sees the difference.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/handler.py#L113-L129
