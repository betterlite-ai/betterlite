task: B591
deviations:
  - what: An aws_sts_endpoint that url::Url::parse rejects is an endpoint URL error in betterlite, where LiteLLM's urllib.parse accepts the string and falls back to the environment or the configured region. "https://exa mple.com" is rejected for the space in the host, while urllib.parse yields the host "exa mple.com" and finds no region in it; "http://" is rejected for the empty host, where urllib.parse yields no hostname.
    why: urlsplit never validates a URL string, while url::Url::parse enforces RFC 3986; a hostless or malformed STS endpoint cannot reach boto3 either way, so no working setup relies on the fallback.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L807-L815
  - what: A $ reference in AWS_CONFIG_FILE or AWS_SHARED_CREDENTIALS_FILE that uses shell default syntax (${NAME:-value}) expands to the default, where os.path.expandvars leaves the whole reference literal because it reads the name as NAME:-value.
    why: The file path expands with shellexpand, which implements POSIX parameter expansion; a hand-written expandvars clone was rejected as more code for a difference no working setup meets.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L774-L790
  - what: Tilde expansion in those file paths differs from os.path.expanduser for a tilde that arrives from an expanded variable (left alone) and a ~user prefix (left literal), where botocore expands both.
    why: shellexpand expands only a literal leading ~ with the injected home directory and consults no password database, which a working AWS setup does not need.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L774-L790
  - what: A [profile ...] section name is split with the Rust shlex crate, which differs from the Python shlex.split that botocore's _parse_section uses, because # starting a word begins a comment, so [profile prod #x] names profile prod where botocore sees three tokens and no profile, and [profile #prod] names no profile where botocore names #prod; inside double quotes a backslash before $ is removed, where Python keeps it.
    why: These differences only show up in section headers no working AWS setup writes, and the crate split keeps profile-name parsing to a few lines.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/base_aws_llm.py#L779-L789
