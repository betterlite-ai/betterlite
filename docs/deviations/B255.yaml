task: B255
deviations:
  - {what: "A mock_response object with stream=true answers 400 naming the misuse instead of LiteLLM's 500 attribute error.", why: "LiteLLM returns a ModelResponse where the stream path expects an async iterator, so no working setup can rely on that failure, and a 4xx names the unsupported combination.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L964-L965"}
  - {what: "A mock_response object without usage answers with a zeroed usage block, where LiteLLM omits usage.", why: "betterlite's ChatResponse always carries usage, and changing that shared record is outside this task.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L964-L965"}
  - {what: "A mock_response object only accepts the completion fields betterlite models, and any other key is an error naming it.", why: "betterlite carries wire values through typed records, so an unmodelled key cannot pass through unchanged.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L964-L965"}
  - {what: "A mock call whose n is above 128 answers 400 naming the limit, where LiteLLM builds one choice per n at any size.", why: "The mock builds every choice and stream frame in memory, so an unbounded n turns one small body into gigabytes; 128 is the OpenAI chat limit.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L1003-L1012"}
  - {what: "A mock stream with stream_options.include_usage reports the mock token defaults (10 prompt, 20 completion) in its usage chunk, where LiteLLM counts the request messages and the mock content with its tokenizer.", why: "betterlite has no tokenizer in this task and the mock's own usage defaults are constant, so the chunk is present with the mock counts and the difference is listed here.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L7403-L7412"}
  - {what: "A mock_tool_calls entry without function.name is an error naming the field, where LiteLLM accepts it and answers name null.", why: "The shared ToolCall record types function.name as a required string for provider responses, and widening it would change every chat response record.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1180-L1202"}
  - {what: "A config.yaml mock_response object whose tool call arguments are a YAML mapping is rejected, where LiteLLM encodes the mapping to JSON text; a client request's object arguments are encoded at the request boundary.", why: "The config crate cannot name serde_json::Value inside this task's zero-expect budget, so only the text form is loaded from YAML.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1187-L1202"}
  - {what: "A client-supplied mock_timeout or mock_delay is rejected as an unsupported request parameter even when general_settings dangerously_allow_mock_testing_request_params is true.", why: "That general setting and its gate are outside this task, and betterlite never forwards a request field it does not act on.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/route_llm_request.py#L19-L26"}
  - {what: "An operator litellm_params.mock_timeout or mock_delay is not loaded, so a config that sets one fails on the unknown key, where LiteLLM's router merges litellm_params into the call and honors it.", why: "The task loads only litellm_params.mock_response for the operator and no request path here acts on the other two, so they stay out of the section; the helper validates their values so the oracle still compares that part with LiteLLM, which only sleeps.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L3750-L3756"}
