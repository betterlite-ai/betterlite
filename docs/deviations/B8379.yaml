task: B8379
deviations:
  - what: apply_general_settings_row scrubs the stored general_settings row with scrub_remote_modules before it reaches the store and the side effects, so a custom_* module, litellm_jwtauth.custom_validate or pass_through_endpoints[].target that points at s3:// or gcs:// is refused there too.
    why: LiteLLM scrubs the rows get_config overlays but hands the general_settings row to _update_general_settings unscrubbed, so a value written to the database can still load a remote module through the periodic sync; that is the code-loading hole the scrub exists to close.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L8166-L8174
  - what: The os.environ/ resolution stops past a depth of 100 always; the DEFAULT_MAX_RECURSE_DEPTH environment variable is not read.
    why: The limit only guards against runaway nesting, and no real config nests a hundred mappings deep, so a setting for it changes nothing a working setup relies on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L85
  - what: An os.environ/ reference that resolves to nothing becomes null without the "is absent from the configured secret manager" warning.
    why: betterlite has no port of secret_manager_would_be_consulted yet, so the reload can't tell whether the manager was asked; the resolved value is the same null.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5782-L5786
  - what: A config file whose YAML document is a list, text, a number or a boolean fails the reload with OverlayError::ConfigNotMapping, which names the file.
    why: LiteLLM keeps whatever yaml.safe_load returns and fails later with an AttributeError when it calls .get on it; the typed error says what is wrong with the file instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5490-L5506
