task: B8252
deviations:
  - {what: "An event without a standard_logging_object queues JSON null in LiteLLM; betterlite always has a payload, so no null entry can occur.", why: "LoggerEvent.payload is a non-optional Arc<StandardLoggingPayload> (B250 and B251), so the None branch is unreachable here; dropping it removes dead code rather than porting a state the event type cannot carry.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/generic_api/generic_api_callback.py#L292-L307"}
  - {what: "A connection failure inside the post is not repeated once on a fresh client before the retry budget, so at max_retries 0 betterlite makes one attempt where LiteLLM makes two.", why: "B173's ProxiedClient owns connection setup and its retry policy; the logger treats a connect error as retryable on the next attempt and leaves fresh-connection recovery to the transport.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L836-L840"}
  - {what: "The v1 metadata and modelParameters are projected from the standard payload's typed metadata and model parameters, not from the raw litellm_params.metadata and optional_params.", why: "The logger receives a LoggerEvent whose payload is the standard logging object, and LoggerEvent is B250/B251's type outside this task's scope; carrying the raw kwargs would need fields those tasks own.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/generic_api/generic_api_callback.py#L418-L422"}
