task: B395
deviations:
  - what: >-
      An args update registers the rebuilt selector before retiring the previous one, so it stays subscribed;
      LiteLLM's class-keyed callback dedup skips it while the old one is listed, then removes the old one.
    why: >-
      A runtime routing_strategy_args update relies on its selector keeping counters current; under LiteLLM
      the rebuilt selector receives no events. Betterlite keys selectors by identity, so a rebuilt selector
      and a same-class group selector both stay subscribed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L1429-L1443
  - what: >-
      A failed re-initialization keeps the previous default and override selectors; LiteLLM unregisters them
      and clears the attributes first, so its failed rebuild leaves no selector.
    why: >-
      An update can carry an invalid value such as ttft_percentile outside (0, 1]; keeping the last working
      selector lets the router serve with its previous strategy instead of dropping every route.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L1451-L1464
