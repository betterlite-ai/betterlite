task: B10047
deviations:
  - {what: "A read that began before a clear returns its own answer but does not store it, so the lru keeps no entry for it; functools.lru_cache stores whatever an in-flight call computes, even when a cache_clear() landed while it ran.", why: "A clear exists to stop serving info a price or model edit replaced; storing the pre-clear answer would bring back exactly the stale info the clear removed, and no working setup can rely on that race.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11319-L11326"}
  - {what: "Each GroupInfoCache keeps its own lru, while Python's @lru_cache on the method is one cache on the class keyed by (self, model_group), so every Router instance shares one capacity and every entry keeps its router alive after it is dropped.", why: "Both layouts answer the same values, and a per-instance cache stops a dropped router's entries from being retained and keeps one router's clear away from another's entries; copying the shared cache would leak every router a model group was read for.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11319-L11326"}
