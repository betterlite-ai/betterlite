task: B3722
deviations:
  - what: The response-body decoder inside the exception check is Rust's serde_json parser with a 128-level nesting limit; LiteLLM decodes the same text with Python's json module, which accepts deeper nesting and rejects invalid UTF-8 at the decode step.
    why: Both sides return false on any decode error, so the only difference is which malformed bodies count as decodable; a body past serde_json's limit is treated as having no exception marker, the same safe answer LiteLLM gives for a body its parser rejects.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2100-L2118
  - what: A response whose Output field is null or a string has no exception marker; LiteLLM calls .get on that value and raises AttributeError from _check_bedrock_response_for_exception.
    why: A guardrail hook that crashes on a response AWS can legally send turns into a 500 for a request that should pass, and the exception check answers a yes-or-no question where an unreadable Output means no.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2123
  - what: A merged response whose Output field is a non-empty string has no exception marker; LiteLLM calls .get on that string in _log_apply_guardrail_success and raises AttributeError instead of logging the record.
    why: The status decision is derived from the typed response record, so a shape the record cannot hold is a response without a marker rather than a lost telemetry record.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L1345
  - what: The status probe decodes the body into the typed response record; a body whose modeled fields carry the wrong JSON type counts as undecodable and yields success, where LiteLLM's untyped walk can still see a BLOCKED action in it.
    why: The same typed record drives every other decision, so one decoder keeps them consistent; a body that does not match the declared AWS shape is not trustworthy evidence of a block.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2135-L2143
  - what: A summed usage counter past i64::MAX is a UsageOverflow error naming the counter; LiteLLM sums Python ints without a bound.
    why: AWS reports units per call, so a total past 9.2e18 cannot come from a real response, and refusing it beats recording a wrong cost; the same choice B3720 made for chunk counters.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L1649-L1657
  - what: The logging helpers write the telemetry record into an empty request dict; LiteLLM replaces an empty dict with a fresh one through `request_data or {}`, so its record is dropped.
    why: A record that is thrown away is lost telemetry, and the proxy request body that reaches these helpers is never empty in practice, so the only payload affected is one that could not carry the record in LiteLLM either.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L1304-L1312
  - what: A response whose Output.__type is a list or an object has no exception marker; LiteLLM tests membership with `in`, so a list such as ["Exception"] counts as a marker and a number there raises TypeError out of the status probe.
    why: AWS declares __type as a string, so a container or a number there is not a shape a working setup sends; the typed check keeps the status on the declared string instead of failing a request over it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L2123
  - what: A merged response whose Output.__type is not a string has no exception marker; LiteLLM stringifies the value in _log_apply_guardrail_success, so ["Exception"] counts as a marker.
    why: The success log reads the same declared string as the body probe, so both status decisions agree on the same response shape.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L1345
  - what: The invocation record's GuardrailValue copy is built by bedrock_decisions/value.rs's json_to_value instead of calling model_armor/request_files/metadata_value.rs's json_to_guardrail_value, which does the same conversion.
    why: metadata_value.rs belongs to the Model Armor file scan and is outside this task's scope.paths, so this task cannot widen that helper's visibility or move it to a shared module; a task that owns both files can merge them without changing behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/bedrock_guardrails.py#L1309-L1318
