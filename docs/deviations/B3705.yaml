task: B3705
deviations:
  - what: "LiteLLM raises and re-raises FastAPI HTTPException, while betterlite returns CacheControlPermissionsError with an explicit 403 status code. Rust's typed principal accessor and JSON map iteration have no fallible operation to route through LiteLLM's catch-all exception handler."
    why: "The Rust hook represents the permission failure as a typed result and does not serialize the principal, so opaque tracing spans and malformed unrelated auth extras cannot cause a read failure that would skip authorization."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/cache_control_check.py#L53-L59"
