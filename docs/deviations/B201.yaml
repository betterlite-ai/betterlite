task: B201
deviations:
  - what: Duplicate model and deployment entries remain distinct and return position diagnostics.
    why: Keyed futures overwrite duplicate entries and lose results; preserving each call prevents data loss.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L150-L172
  - what: Deployment races cancel and join remaining calls before returning the first non-error result.
    why: LiteLLM waits for every losing call on executor exit. The bounded Rust race stops unneeded work, including when the caller drops its result receiver, with the supervisor retained in the caller's task set.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L165-L185
  - what: Each deployment merges immutable request parameters independently, with nested request parameters taking precedence.
    why: Rebinding kwargs in the pinned loop leaks previous deployment credentials and destinations into later deployments.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L165-L172
  - what: Empty model and deployment batches return no selection.
    why: Creating a zero-worker executor raises an unhandled exception; an empty batch has no work to execute.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L151-L165
  - what: Batches require item, serialized-byte, concurrency and total-deadline limits.
    why: The task requires bounded in-process fan-out; LiteLLM queues all items and has no total batch deadline.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batch_completion/main.py#L102-L113
