task: B3602
deviations:
  - what: A credential object never equals a string containing its serialized JSON.
    why: Structural equality preserves the task's string/object distinction and avoids treating different credential sources as unanimous.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_endpoint_router.py#L31-L37
  - what: An unknown key in default_vertex_config is a config error that names the key; LiteLLM's pydantic VertexPassThroughCredentials model ignores extra keys.
    why: Rule no-silent-drops requires unsupported configuration keys to be reported instead of silently ignored.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_endpoint_router.py#L228-L249
kept_bugs:
  - what: The first deployment with a key that matches provider and region answers, even if later deployments also match.
    why: Configurations with overlapping deployments rely on their order to pick a key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_endpoint_router.py#L72-L95
  - what: An unmatched model name receives the unanimous Vertex identity when all eligible deployments agree.
    why: The pinned implementation falls back after an unsuccessful named lookup, so configurations relying on this fallback keep working.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/passthrough_endpoint_router.py#L153-L179
