task: B8332
deviations:
  - what: The Hugging Face embedding arm fetches the model's pipeline tag once, while LiteLLM's handler can GET the model info twice for one call.
    why: LiteLLM builds the router URL from a second pipeline-tag lookup after the task lookup, so an input_type-less call performs two GETs. One prefetched tag gives the same task and URL, and the emitted body carries no second request a caller can observe.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/huggingface/embedding/handler.py#L161-L168
  - what: The Hugging Face rerank base never takes litellm.api_base, although the rerank config's get_api_credentials includes it.
    why: The rerank HTTP handler passes the caller's api_base to get_complete_url, and that function reads api_base, HF_API_BASE and HUGGINGFACE_API_BASE only. The litellm.api_base value never reaches the request, so the module resolves the effective chain.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L1314-L1318
  - what: The Replicate base is resolved but not used to build the create URL.
    why: LiteLLM resolves api_base through litellm.api_base, REPLICATE_API_BASE and its default and then calls get_complete_url, which replaces it with https://api.replicate.com/v1/models/{model}/predictions. The module keeps the resolved value for parity but sends the same fixed URL.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/replicate/chat/transformation.py#L146-L155
  - what: The Replicate stream arm logs a post_call with a null original_response.
    why: LiteLLM's stream path returns an iterator over a prediction stream and has no response object at that point. A null keeps the hook firing, which is what a logging callback observes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/replicate/chat/handler.py#L197-L207
  - what: The nine model-hub cases are helper cases, so they call the dispatch module directly.
    why: No proxy route reaches the model-hub dispatch yet, so an HTTP case has no betterlite entry point. The helper answers hold the wire requests and errors, and every case is compared with the same LiteLLM call run through the oracle.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L3197-L3203
