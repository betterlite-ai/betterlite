task: B575
deviations:
  - what: A tool whose required field is absent or null, or whose field cannot hold the declared type, returns a typed error naming the field instead of LiteLLM's uncaught KeyError or AttributeError.
    why: LiteLLM indexes the tool dict directly, so these inputs raise inside the transformation and surface as a 500; betterlite rejects a malformed tool with a named error at the boundary.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/chat/transformation.py#L763-L789
