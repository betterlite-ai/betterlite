task: B5834
deviations:
  - what: A Perplexity embedding string that is not valid base64 fails the call with a named decode error and status 500.
    why: LiteLLM lets binascii.Error escape from the reply transform and the proxy reports it as an internal error; betterlite returns the same status with a message that names the bad embedding.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/embedding/transformation.py#L130-L131
  - what: A Perplexity Responses reply with status failed and an error that is null or not an object raises "Unknown Perplexity error" with the HTTP status of the reply.
    why: LiteLLM calls .get on the error value and raises AttributeError, a 500 with no provider status. That is Python runtime behaviour (docs/compatibility.md), so betterlite reports the failure the way it reports a failed reply without an error key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/responses/transformation.py#L110-L116
  - what: Embedding values are f64 values computed as the signed byte divided by 127.0 and written by the repository's JSON number writer.
    why: Python's repr of the same double can print differently; the oracle cases compare numbers, not their text.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/embedding/transformation.py#L134
  - what: A preset/ Responses request runs its input through the shared Responses input validation, so Anthropic-only cache_control markers on input content are removed as they are for every other Perplexity Responses model.
    why: LiteLLM's preset branch calls only _validate_input_param and sends cache_control markers on; Perplexity's API takes OpenAI-shaped input, and the shared transform B506 owns is the only public seam that validates the input, so it is reused instead of copying a second validator.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/responses/transformation.py#L82-L90
  - what: A Perplexity search reply whose results value is null gives an empty result list, and a result whose title, url or snippet is null gives an empty string for that field.
    why: LiteLLM iterates over None and raises TypeError, or builds a SearchResult with title None and fails pydantic validation, so the proxy answers 500 for a reply it could read. betterlite treats null the way it treats a missing key, as docs/compatibility.md says.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/search/transformation.py#L153-L160
kept_bugs:
  - what: A Perplexity embedding or Responses base that already ends in /v1 gets a second /v1, so https://host/v1 becomes https://host/v1/v1/embeddings and https://host/v1/v1/responses.
    why: LiteLLM appends the full /v1 suffix without trimming, and deployments that set the bare host (the documented form) depend on the suffix being added.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/embedding/transformation.py#L63-L67
  - what: A Perplexity embedding call with no key anywhere sends "Authorization Bearer None", and an explicit empty key sends "Bearer ".
    why: LiteLLM formats whatever key it resolved into the header and lets Perplexity answer 401. A setup that relies on the upstream rejection, rather than a local error, keeps working.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/embedding/transformation.py#L99-L103
  - what: The Perplexity embedding error reports POST https://docs.litellm.ai/docs as its request, not the Perplexity endpoint.
    why: PerplexityEmbeddingError sets its own request and then BaseLLMException.__init__ replaces it with the docs URL; clients that log the error request see that URL today.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/perplexity/embedding/transformation.py#L36-L43
