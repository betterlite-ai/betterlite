task: B2452
deviations:
  - {what: "A raw SSML body goes out with Content-Type text/plain; charset=utf-8, where httpx sends a str body with no Content-Type header at all.", why: "betterlite's typed request body always names its media type; the bytes, the method, the URL and every other header stay identical, and a provider that reads the SSML body by content type is better served than by none.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11918-L11924"}
  - {what: "The response transform cannot fail: the typed speech config returns a binary response record, so LiteLLM's case where transform_text_to_speech_response raises and the exception escapes _handle_error cannot arise.", why: "The config interface is B1135's; a transform that cannot fail cannot be wrapped by the send's error conversion either, and no working setup depends on a failure it cannot trigger.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11936-L11942"}
  - {what: "A complete base URL that does not parse as a URL fails with the typed RequestUrl error before the pre-call runs, where LiteLLM builds the URL string, logs the pre-call, and only the send raises httpx's InvalidURL or UnsupportedProtocol for the handler's catch to turn into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11909-L11934"}
  - {what: "A header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose own encoding raises inside the send and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11876-L11934"}
  - {what: "The async timeout message renders the applied timeout and the elapsed time from Duration values, so a whole number prints as 60.0 and a hundred milliseconds prints as 0.100, where LiteLLM interpolates Python floats (0.1).", why: "The message reports the timeout the call ran under and the time it took, the same numbers LiteLLM shows; only the float rendering differs, since betterlite keeps durations typed.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866"}
  - {what: "The pre-call logs no api_key at all, where LiteLLM passes api_key=\"\" to every speech pre-call.", why: "The typed logging seam has no api_key field, so no caller key can reach a log record; an empty string adds nothing the record needs.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11899-L11907"}
  - {what: "An error body or a header value that is not UTF-8 becomes \"N bytes that are not UTF-8\", where LiteLLM reads the body through response.text and the header values as httpx strings.", why: "betterlite records both as JSON text; replacement characters hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6077-L6090"}
kept_bugs:
  - what: The transformed request headers override the caller's extra_headers for every name, Authorization and Content-Type included, because the provider map is merged after the caller map.
    why: A provider that answers with its own auth or content headers relies on winning, and the task text requires the provider value on the wire.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11894-L11896
  - what: A missing body is reported as a synthesized 500 provider error whose message names text_body and binary_body although neither is a send branch.
    why: A working setup matches that exact message, and LiteLLM advertises two branches its own handler never reads.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11925-L11928
