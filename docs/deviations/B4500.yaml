task: B4500
deviations:
  - what: Records reject unknown fields through serde deny_unknown_fields instead of Pydantic extra="forbid"; unknown-field rejection is equivalent.
    why: Pydantic is Python-only; Rust's serde provides the same strict validation across both server and worker.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/models.py#L7-L8
  - what: monthly_budget, spent, cost and sample_percent use rust_decimal Decimal instead of Python float. They decode from JSON numbers or numeric strings and encode as JSON numbers.
    why: Budgets and spend are financial values that must round-trip and sum correctly; floats introduce precision errors that accumulate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/models.py#L45
  - what: Integer and boolean fields accept only JSON integers and booleans, with integers limited to 64 bits. Pydantic lax mode also accepts coercions such as "24", 24.0 and "true".
    why: Typed wire formats refuse coerced values instead of guessing what the sender meant.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/models.py#L28-L45
  - what: A JSON object that repeats a key is refused. Pydantic keeps the last value.
    why: Nothing overwrites an earlier value without saying so.
    link: ""
  - what: Datetimes must be RFC 3339 strings with an offset and are held in UTC. Pydantic also accepts naive datetimes and Unix timestamps and preserves non-UTC offsets.
    why: LiteLLM itself only builds these records from datetime.now(timezone.utc), so UTC is the only time the records carry.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/lens/endpoints.py#L160
