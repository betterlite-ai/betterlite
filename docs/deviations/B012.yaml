task: B012
deviations:
  - what: >-
      Gateway stderr keeps B003's JSON format and level whatever JSON_LOGS and LITELLM_LOG say; both
      settings are parsed and carried on the logging wiring for compatible service and callback
      formatting, but they do not switch B003's stderr format or raise its level.
    why: >-
      B003 makes machine-readable stderr the gateway format, and a proxy that changes its log format
      based on an environment flag loses the record shape the rest of the pipeline parses.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_logging.py#L632-L655
  - what: >-
      Every request to a chat or embeddings path records one terminal service event, including a
      request the gateway itself rejects (an unknown model, a body the request limits refuse), and
      the event's error text comes from the response status as "the upstream call failed with HTTP
      {status}".
    why: >-
      The service event track wraps the HTTP request, so the response status is the only failure
      signal it has; LiteLLM's failure hook runs only where the completion call raised and carries
      str(exception).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_service_logger.py#L312-L425
  - what: >-
      A client that cancels a streamed response records a terminal service event with
      is_error true and error "the request was cancelled".
    why: >-
      A dropped response body is a cancelled service call in betterlite's worker, while LiteLLM's
      CancelledError unwinds the request without calling the service failure hook.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_service_logger.py#L312-L425
  - what: >-
      The proxy_pre_call service event is recorded for every chat and embeddings request with
      duration 0, while LiteLLM emits PROXY_PRE_CALL around guardrail pre-call callbacks.
    why: >-
      B012 owns the request lifecycle events; the guardrail callback timing arrives with the
      guardrail lifecycle tasks.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/services.py#L25
kept_bugs:
  - what: >-
      Correlation ids lose every non-printable character, so two caller ids that differ only in
      control characters become the same logged id.
    why: >-
      The sanitized id is what LiteLLM stamps into log lines, and its whole point is to keep a
      caller from forging log records through that field.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/_logging.py#L41-L63
