task: B8722
deviations:
  - what: A tools/call whose Mcp-Param-* header disagrees with the call arguments is dispatched instead of refused, where the SDK first reads the tool's inputSchema and answers the caller's HEADER_MISMATCH rejection.
    why: The check needs the caller's own tools/list listing and a JSON Schema walk of the x-mcp-header annotations before dispatch. This task ports the single exchange transport, and that schema reader is a separate feature no betterlite task builds yet.
    link: ""
  - what: A request body larger than 4 MiB is refused with 413 before it is decoded, where the modern entry reads the body without a limit.
    why: Rule bounded-inputs forbids an unbounded read of an inbound body; the cap is the one the SDK's body middleware applies to the other transports.
    link: ""
  - what: A _meta whose client-capabilities value is present but does not decode into rmcp's typed client capabilities, a null included, is refused by rmcp's inline lifecycle check with -32602 naming the key, where the SDK's classifier only requires the key to be present and would dispatch the request.
    why: The request decodes into rmcp's typed model before dispatch, and betterlite treats a value of the wrong type as an error that names the field; the status is 400 and the code -32602 on both sides.
    link: ""
