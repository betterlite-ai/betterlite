task: B8104
deviations:
  - what: The generated unknown- id suffix is random in both implementations, so a reply with no id is compared with that id field ignored.
    why: A uuid4 cannot be compared across two processes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L213-L217
  - what: The lax-validation debug line names the validation error and omits the response body, where LiteLLM logs the whole raw_response_json.
    why: A provider response can carry credentials, and betterlite never writes a response body into a log line.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L219-L225
  - what: A reply that fails record validation is returned as a record built from the fields betterlite can type plus its unknown vendor fields, and the raw fields stay on the reply value; LiteLLM's model_construct keeps every mistyped field on the object.
    why: A Rust record has typed fields, so a mistyped id or output cannot be carried as-is; dropping the whole reply would lose a response LiteLLM returns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L219-L225
  - what: A JSON body that is not an object raises the upstream-status OpenAI error, where LiteLLM raises an unhandled AttributeError outside its try block and returns a 500.
    why: A working Manus setup sends a response object; a 500 for a body LiteLLM already fails is a bug no setup relies on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L192-L217
  - what: The processed and raw response headers travel in the logging details under headers and additional_headers, where LiteLLM stores them on the response's private _hidden_params.
    why: The B1114 contract returns only the typed reply record, so the provider config has no field for hidden params.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/manus/responses/transformation.py#L227-L230
