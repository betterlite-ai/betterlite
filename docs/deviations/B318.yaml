task: B318
deviations:
  - what: The counter dicts are keyed by the deployment's full model_info.id. The pinned selector keys them by key.split(":")[0], then fills every healthy deployment id that is missing at zero usage, so a deployment id containing a colon loses its counter and ranks at zero. Betterlite's usage_counter_keys and Selection both carry the full id.
    why: An id containing a colon is a valid deployment id, and after this fix its counter still decides the ranking. The pinned fill would otherwise add a second entry for the same deployment and hide the counter the batch read returned. The colon-id selection behavior test pins the betterlite side.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L411-L417
  - what: The sync facade reads the tpm keys and then the rpm keys from the process's local read tier, two batch_get calls, and sees no counters when the caller holds no tier. The pinned get_available_deployments calls self.router_cache.batch_get_cache twice, which reads the in-memory tier and then Redis.
    why: A sync caller cannot await the batch store the async facade reads, and B382's local tier is the only cache a sync caller can reach; the shared Redis read needs the async store trait. The two-read shape is kept so the facade reuses the same primitive instead of a separate port.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L609-L614
  - what: When no deployment passes the screen, the sync facade returns the same NoDeploymentAvailable error the async facade raises, with its 429 status, code, type and retry-after. The pinned get_available_deployments raises a plain ValueError carrying the same message text.
    why: The task requires the synchronous facade to reuse the selection primitive, and one error type for the condition keeps the wire mapping in one place; a caller of the sync facade gets the same rate-limit report as the async one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L670-L672
  - what: A batch read that reports itself unavailable answers the values the local tier already holds plus a ReadWarning, and the selection continues with them. The pinned async facade turns a None batch answer into a RateLimitError before any deployment is considered.
    why: The task's pitfalls require an unavailable optional observation not to become a hard request error, and B382's store contract reports the failure as a warning next to the local values instead of a None result. The read-failure behavior test pins the continuing selection.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L499-L504
  - what: At route time the B016 arm builds its Selection without counters, so every deployment ranks as unused and only the limits screen the pool. The pinned selector reads the pool's tpm and rpm keys and ranks by them.
    why: StrategyContext carries no value-store handle and no place to keep counters between requests, and wiring one in means a new field on StrategyContext or context.rs, which this task does not own. The service takes the store, tiers and request reads as parameters, so the integration is a call away once the route holds them.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L488-L497
  - what: The arm takes the request's input-token estimate from the route's request facts and counts zero when the request has none. The pinned selector runs token_counter(messages=messages, text=input) itself and counts zero when that raises.
    why: The route's request facts already carry the token count that admitted the request, and a second counter inside the selector would count the same text again with a different tokenizer configuration. The oracle patches token_counter on both sides, so the comparison runs on one estimate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L419-L422
  - what: When no deployment passes the arm's screen, the arm answers with an index past the pool and the pipeline's existing no-deployment routing error reports it. The pinned selector returns None and the router raises its own no-deployments-for-model exception.
    why: The no-deployment error belongs to the routing pipeline (B016, B301), which already maps an index past the pool to it; a second error type inside the selector would report the same condition two ways.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L449-L452
  - what: A window key past the value store's key length limit fails the selection with KeyError::TooLong naming the deployment. The pinned selector builds the key string whatever its length and hands it to the cache.
    why: Betterlite's store rejects a key past its bound instead of growing without limit, and the caller is told which deployment could not be tracked rather than the read silently missing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L454-L465
  - what: The no-deployment message is the text LiteLLM passes to its exception. The pinned RateLimitError prepends "litellm.RateLimitError: " to that text, so the raised error's message and str carry the Python class name in front of it.
    why: Betterlite's typed error names its own category, status, code and type, and its Display carries the message the selector passed rather than the Python class prefix; the exact-message behavior test pins the betterlite text.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L470-L471
kept_bugs:
  - what: A deployment is screened out when its rpm plus this request reaches the rpm limit, so a limit of 10 admits 9 requests and the tenth is refused. The increment happens after selection, so the refusal keeps the stored count at 9 rather than 10.
    why: A working setup sizes rpm limits against LiteLLM's own count of admitted requests; a betterlite that admitted the request reaching the limit would allow one more per window than LiteLLM and can trip the upstream provider's limit. The rpm boundary behavior test pins both sides of the comparison.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L380-L385
  - what: A counter the cache returns as None ranks its deployment at zero usage instead of excluding it, and the same None value prints as None in the no-deployment error while a deployment with no limit prints inf.
    why: LiteLLM fills every missing or None counter with zero before ranking, so a redis miss and a fresh deployment are indistinguishable there; a betterlite that excluded them would route away from deployments LiteLLM picks. The missing-counter and error-shape tests pin both outputs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_tpm_rpm_v2.py#L433-L438
