task: B615
deviations:
  - {what: "AmazonQwen3Config's five constructor fields are read from an amazon_qwen3 block under each deployment's litellm_params and under litellm_settings, with the deployment value winning.", why: "LiteLLM's loader has no amazon_qwen3 config block; this is the betterlite config surface, and the merge keeps both scopes observable.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen3_transformation.py#L38-L50"}
  - {what: "The constructor's five values stay with the deployment section that supplied them, where Python writes non-None values onto the class so one instance changes later instances' defaults.", why: "betterlite keeps no shared mutable class state; a deployment carries its own options.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen3_transformation.py#L38-L50"}
  - {what: "Usage counts are i64 and must be JSON integers: numeric strings, booleans and integral floats that pydantic coerces are rejected, and an out-of-range count is a usage error.", why: "Python coerces through pydantic; betterlite types the wire and reports a conversion error instead of coercing.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen3_transformation.py#L197-L207"}
  - {what: "The Qwen failure callback receives the raw body text as original_response and no api_key, and additional_args.error holds betterlite's error text.", why: "post_call takes our typed arguments; the body text and the raised error are the stable parts of the hook.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen3_transformation.py#L211-L219"}
  - {what: "A DeepSeek reply with no choices and a trigger prompt leaves the reply unchanged, where LiteLLM reads choices[0] before the trigger check and raises IndexError.", why: "A reply without a choice cannot come from a working setup; betterlite keeps the empty list instead of crashing.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_deepseek_transformation.py#L62-L64"}
kept_bugs:
  - {what: "Qwen3 tool-call names and arguments are interpolated into the prompt with no JSON escaping or parsing.", why: "The source template does the same, and a working Qwen3 setup depends on that exact prompt text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen3_transformation.py#L144-L151"}
  - {what: "A supplied usage object replaces the reply usage as given, and total_tokens is never recomputed from the two parts.", why: "The source trusts the provider's totals, and a working reply reports them unchanged.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_qwen3_transformation.py#L197-L207"}
  - {what: "Only the first DeepSeek choice receives the reasoning split; later choices keep their content and gain no reasoning field.", why: "The source rebuilds choices[0] alone, and a working single-choice reply relies on that.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_deepseek_transformation.py#L62-L78"}
  - {what: "A truthy non-string request prompt reaches .strip() and raises AttributeError, which the transform does not catch.", why: "Copied so an invalid prompt fails the way the source fails; the buffered-reply cases exercise it.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_transformations/amazon_deepseek_transformation.py#L62-L64"}
