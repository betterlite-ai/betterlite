task: B3854
deviations:
  - {what: "The emit-once record is a typed EmittedSpans value owned by the request context, not a hidden _otel_internal.spans_logged dict inside litellm_params.metadata.", why: "The dict travels with the request metadata, so other callbacks and the spend log can see it; a typed field keeps the dedupe state private.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L1248-L1307"}
  - {what: "OpenTelemetryConfig.attributes is kept as the raw input value and not parsed by this task.", why: "B3857 owns the metric attribute filter and depends on this task, so this task cannot name its type.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L320-L339"}
  - {what: "Environment values come from a snapshot map the caller passes in, not from the process environment.", why: "The logging crate reads no process state, and the one place that snapshots the environment stays outside it.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L325-L352"}
  - {what: "A datetime in SpanTime is a UTC instant, and a time outside the i64 nanosecond range saturates at i64::MIN or i64::MAX.", why: "LiteLLM's naive datetimes use the host timezone and its int(x * 1e9) is a Python integer of any size; typed timestamps in betterlite are instants and OTel start_time and end_time are i64 nanoseconds.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L2946-L2952"}
  - {what: "An explicitly false ignore_context_propagation still reads OTEL_IGNORE_CONTEXT_PROPAGATION, where LiteLLM keeps the explicit False.", why: "The settings record carries a plain bool, so an unset flag and an explicit false are the same value; a true flag always wins.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L331-L332"}
