task: B4562
deviations:
  - what: install_statusline_script builds the command line for the CLI binary's own `statusline` subcommand instead of installing a copy of a versioned status-line script file.
    why: In Rust the status line is a subcommand of the one betterlite binary (B4586), not a separate file LiteLLM ships and versions; there is nothing left to copy, lock or version-compare.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L307-L363
  - what: claude_settings_path expands only a leading `~` or `~/` in CLAUDE_CONFIG_DIR and leaves a `~user` prefix as it is, where LiteLLM's Path.expanduser resolves another user's home directory.
    why: betterlite reads the environment through the config crate's injected lookup, which carries only the current user's home, and a passwd lookup is not a dependency of the CLI.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L106-L111
  - what: A status-line path that is not valid UTF-8 is refused with ClaudeSettingsError::NonUtf8Path instead of being quoted into the command line.
    why: Rust paths may hold bytes that are not UTF-8, and quoting a mangled path would hand Claude Code a command that cannot run; Python reaches this path only with surrogate escapes that fail at process spawn.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L307-L310
  - what: configure_state_path hashes the resolved settings path's operating-system bytes for the receipt file name, where LiteLLM hashes the UTF-8 of Python's str path.
    why: The two encodings agree for every path that is valid UTF-8; hashing the OS bytes keeps a settings path that is not valid UTF-8 working instead of failing mid-configure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L123-L130
  - what: with_status_line treats an existing statusLine entry as betterlite's own only when its command splits into exactly two words, the second the statusline subcommand and the first a binary with the same file name as betterlite's, where LiteLLM treats any command containing the last word of its command as its own.
    why: betterlite's command is identified by the statusline subcommand name, which a user's own status line such as `bun x ccusage statusline` also ends with; the two-word, same-binary test leaves such an entry alone while a betterlite install under another directory is still recognised.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/client/cli/commands/claude_settings.py#L366-L374
