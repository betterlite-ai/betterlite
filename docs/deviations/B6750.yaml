task: B6750
deviations:
  - what: The stack text in the error string is the error's cause chain, one cause per line, where LiteLLM appends traceback.format_exc().
    why: Rust has no Python traceback. The redaction, the 1000 character cut and the text before the stack marker are the same, so a client that reads the message keeps the same prefix.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8812-L8815
  - what: The failure carries a typed HealthEntryError, where LiteLLM returns the caught Python exception object.
    why: B4443 reads only the error text and its variant, and Rust has no Python exception object to return; the error texts match LiteLLM exactly.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8817-L8830
  - what: check_health takes the mode as an Option with no default, where LiteLLM's ahealth_check defaults the argument to "chat".
    why: The only caller, B4443, always passes the mode it resolved, and None has to stay distinguishable so that the missing-mode failure text is produced only when no mode was known.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8725-L8729
kept_bugs:
  - what: A resolved model containing "*" takes the wildcard branch before the mode is looked up, so a wildcard health check with an unsupported mode still succeeds.
    why: LiteLLM returns the wildcard result before it checks the mode against its handlers, and a proxy config can rely on a wildcard deployment passing its health check whatever mode the deployment names, so the order is copied.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8789-L8795
  - what: An empty mode string becomes "chat" through `mode = mode or "chat"`, the same truthiness LiteLLM applies to a mode of "" or 0.
    why: The proxy can pass an empty mode for a deployment, and LiteLLM quietly treats it as chat, so the same empty-string case is handled the same way.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8788
  - what: The missing-mode error text keeps LiteLLM's two spaces before the newline and its one-word "stacktrace:" marker.
    why: A client or a test that matches on the missing-mode error text sees LiteLLM's exact characters, so the typo is copied rather than corrected.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L8819
