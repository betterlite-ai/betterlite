task: B3787
deviations:
  - what: Masking refuses a replacement once the text parts it would actually rewrite, across a message's content, a response's choices, and its tool/function call arguments, would together copy more than 1 MiB of masked text, returning a ReplacementTooLarge error instead of allocating. Preserved non-text parts (images, documents) are not counted.
    why: Rule bounded-inputs requires a cap on every allocation sized by untrusted input; LiteLLM's _mask_content_list and _apply_masking_to_response build these replacement lists with no such cap.
    link: ""
  - what: mask_messages now rewrites the same message extract_text_from_messages scanned (the last message with role user or developer and non-empty content), through one shared selection rule, instead of only ever rewriting the last message with role user. When no message matches, it returns a NoMaskableMessage error instead of Ok(false).
    why: Upstream, the scan that decides whether a message holds a credential and the rewrite that masks it use different role filters, so a credential found in a developer-role message is flagged but never masked and still reaches the model unmasked. An oracle case that sends a developer message after a user message will now diverge from LiteLLM's output; that divergence is this fix.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/panw_prisma_airs/panw_prisma_airs.py#L678
