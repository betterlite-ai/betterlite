task: B3776
deviations:
  - what: The requester id, project id and roundtrip id are matched under any header name case, where LiteLLM looks the v1 requester and project ids and the v2 roundtrip id up with the exact keys its header dict holds.
    why: Header names are case-insensitive per RFC 7230 and a proxy forwards the casing its client sent, so betterlite lowercases the keys once before reading them; a differently cased hl-roundtrip-id is then kept and sent on, where LiteLLM injects a second, lowercase one beside it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L493-L498
  - what: Every detection call carries a timeout, 30 seconds unless litellm_params.timeout sets one, and each attempt is sent once.
    why: Rule bounded-inputs requires every outbound call to carry a timeout. LiteLLM hands its timeout, or the shared handler's 600 second total and 5 second connect default, to AsyncHTTPHandler, which retries once on a connection error; betterlite reports the failure instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L385-L411
  - what: A v2 request evaluation replaces structured_messages with the messages array of the endpoint's body, where LiteLLM assigns the whole body dict.
    why: The field is declared as a sequence of messages, and the body dict would put the endpoint's top-level keys there. No working setup can rely on that value, so betterlite keeps the declared type.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L545-L548
  - what: V1 scans a structured message whose content is a list of parts as the text parts' texts joined by two newlines, where LiteLLM sends str() of the list of non-image parts, the Python repr of those mappings.
    why: The repr is a Python runtime detail no working setup can rely on and carries no text the scanner reads; docs/compatibility.md stops parity at the declared types, so betterlite sends the type's text instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L176-L181
  - what: A content part that names type text without a string text is skipped in both redaction paths, where LiteLLM's item["text"] raises KeyError and fails the request.
    why: docs/compatibility.md reads an absent field as unset, and the part carries no text to redact or write back; the other parts are still read instead of failing the whole call.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L337-L342
  - what: A modified_data side that carries no messages list fails the response decode, where LiteLLM skips an empty side and raises KeyError on a non-empty one without messages.
    why: LiteLLM declares the side as a TypedDict with a required messages list, and docs/compatibility.md reads a value outside the declared type as an error that names the field; an empty side is such a value, so betterlite refuses the answer instead of treating it as no redaction.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/hiddenlayer/hiddenlayer.py#L335-L345
