task: B339
deviations:
  - what: A non-finite alpha, beta, delta, scripted sample, quality sample or score weight is refused with an error that names the field, where LiteLLM's float arithmetic would carry NaN or infinity into the Beta draw and the score comparison.
    why: The task requires rejecting nonfinite statistical input. A NaN score loses every comparison in pick_best, so the first model stays selected for every draw and the poisoned posterior never recovers; betterlite fails at the boundary instead of silently routing on it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/bandit.py#L112-L137
  - what: normalized_cost does its cost arithmetic in Decimal and returns an error when the spread overflows Decimal or the dimensionless score does not convert to a finite f64, where LiteLLM's float version never fails.
    why: Money stays rust_decimal::Decimal up to the checked conversion of the dimensionless score, so an overflowing spread is refused rather than turned into a NaN or infinity that would then decide a selection.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/bandit.py#L84-L94
  - what: A cost score is computed exactly in Decimal and converted to f64 once, so a price without an exact binary representation can land one ulp away from LiteLLM's float arithmetic.
    why: The task keeps prices in Decimal and lets only the dimensionless score enter the statistical module. The difference is confined to the diagnostic score and can only reorder two models whose float scores are within one ulp; selection, tie order and every money value stay exact.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/bandit.py#L84-L94
