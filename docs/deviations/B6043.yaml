task: B6043
deviations:
- {what: "Image bytes cross the native boundary as blobs, not base64 inside the JSON text.", why: "Large files would be copied twice, once to encode and once to decode.", link: ""}
- {what: "A file's content type comes from its name's extension, with application/octet-stream as the default.", why: "The task fixes the rule; LiteLLM sniffs the first 100 bytes and defaults to image/png.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/utils.py#L84-L147"}
- {what: "Only the openai provider is served for image_generation, image_variation and image_edit; any other provider fails with a local error.", why: "The per-provider image request code belongs to the provider tasks and the SDK image entries.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L374-L422"}
- {what: "The image edit response does not carry the provider's response headers in _hidden_params.", why: "The native call has no Python Logging object to record them on.", link: ""}
- {what: "An image edit mask file is uploaded; LiteLLM's openai edit path never passes mask to its handler, which drops it silently.", why: "A caller that passes a mask expects it to reach the provider.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L711-L731"}
- {what: "betterlite._images.main.__getattr__ raises AttributeError for ImageEditRequestUtils; LiteLLM lazily imports that helper class there.", why: "The edit parameter rules run in Rust, so no Python copy of the class exists.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L1046-L1056"}
- {what: "image_edit sends only the declared edit parameters; extra_body and unknown kwargs are not flattened into the multipart form.", why: "The task scopes the edit form to ImageEditRequestUtils' rules and the budget has no room for a second form-field path.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L849-L867"}
- {what: "image_generation ignores mock_response and sends the provider request; LiteLLM answers from the mock text without a call.", why: "The task text does not list the test hook, and the diff budget has no room for the reply it builds.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L295-L296"}
