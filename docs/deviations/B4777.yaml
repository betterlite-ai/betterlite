task: B4777
deviations:
  - what: >-
      The JSON columns (litellm_params, agent_card_params, static_headers and kill_switch) are written
      as parsed jsonb values, not as JSON text.
    why: >-
      One write path for the typed record; B10012's row codec reads the parsed value and a JSON string of
      it alike, so the response JSON is the same either way.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/agent_registry.py#L581-L665
  - what: delete_agent_from_db returns nothing.
    why: >-
      LiteLLM returns the deleted row's dump, and no caller at the pin reads it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/agent_registry.py#L668-L694
  - what: >-
      The depth cap of the stored JSON text comes from the AgentStore constructor, not from a
      DEFAULT_MAX_RECURSE_DEPTH environment variable read here.
    why: >-
      Dependencies come in through constructors, and the server passes LiteLLM's default of 100.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/safe_json_dumps.py#L12-L93
kept_bugs: []
