task: B10113
deviations:
  - what: >-
      create_eval and list_evals answer a BadRequestError (400) with model "" and the provider set when the
      provider name is unknown or names a provider without an evals API config. LiteLLM raises its ValueError at
      lines 163 and 348 of litellm/evals/main.py
      (https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L348),
      and exception_type turns each into an APIConnectionError (500).
    why: >-
      The provider name is the caller's input and the call can never succeed, so a 500 tells the client the server
      broke when its own request was wrong.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L160-L163
