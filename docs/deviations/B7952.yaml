task: B7952
deviations:
  - what: "Fields LiteLLM types as a bare dict, list or object, or as Any or Mapping[str, object] (the file upload payloads, rerank documents and meta, the embedding logging object, the container request params, the google request kwargs, the image edit options and the realtime session values), are typed with dict[str, JsonValue], list[JsonValue], JsonValue or Mapping[str, JsonValue]."
    why: "The repo bans Any and unparameterized containers in annotations, and these fields carry JSON payloads whose shape LiteLLM leaves open."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/rerank.py#L13-L28"
  - what: "The google_genai aliases and dict classes are built from JsonValue and dict[str, JsonValue] where LiteLLM aliases them to google.genai types under TYPE_CHECKING and to Any or a bare dict at runtime."
    why: "The wheel has no google-genai dependency, and Any and bare dicts are banned in annotations; the alias names, the dict subclasses and their keyword-only constructors stay the same."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/google_genai/main.py#L7-L32"
  - what: "The ported models extend the wheel's ResponseObject, DictJsonObject or BaseLiteLLMOpenAIResponseObject instead of pydantic.BaseModel, so dict-style item access, get and contains come with the base; an unknown key on RerankResponse raises AttributeError here where LiteLLM's __dict__ lookup raises KeyError. A container's json() forwards the model_dump options to model_dump and returns the dict, and raises TypeError for encoder, models_as_dict or any other keyword model_dump rejects, where LiteLLM catches every exception and falls back to the full dict()."
    why: "Every ported model under betterlite.types shares one of those bases; the declared fields, required keys, defaults, extra-key handling, frozen config, model_dump and the container models' getattr-based item access, get, contains and dict-returning json() match LiteLLM, and only the catch-all fallback around a keyword model_dump rejects is not copied."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/rerank.py#L80-L95"
  - what: "GenerateContentResponse keeps a _hidden_params argument as private metadata and never writes it out again, where LiteLLM's fallback class passes the key to pydantic as an allowed extra and model_dump serializes it."
    why: "LiteLLM declares _hidden_params as internal response metadata in its typed branch; the serialized extra is an accident of the runtime fallback class that no working setup relies on."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/google_genai/main.py#L52-L55"
  - what: "OpenAIFineTuningHyperparameters extends the wheel's Hyperparameters from B7921, whose batch_size, learning_rate_multiplier and n_epochs are str | int or str | float, where the openai Hyperparameters class LiteLLM inherits types them Literal[\"auto\"] | int | None or Literal[\"auto\"] | float | None."
    why: "The wheel does not depend on openai, and B7921 owns that base class; the inherited field names, required keys and defaults match."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/fine_tuning.py#L1-L5"
  - what: "FileTypes, which LiteLLM imports from the openai package for the image edit request params, is the wheel's FileContent union (IO[bytes], bytes, PathLike[str] or PathLike[bytes], alone or in a tuple with an optional filename and content type), where openai types the path as a bare PathLike."
    why: "The wheel does not depend on openai, and a bare generic container is banned in annotations; the accepted values stay the same."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/images/main.py#L5"
