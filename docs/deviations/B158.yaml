task: B158
deviations:
  - what: Passing `client` or `shared_session` raises `UnsupportedCallArgument`.
    why: A Python HTTP client cannot drive the Rust call, and ignoring it could send a request past a caller's proxy or custom TLS.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5145-L5205
  - what: "`logger_fn` is accepted and never called, and a warning is logged once per call."
    why: The call runs in Rust and has no point to call back into Python at each step.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5350-L5360
  - what: "`LiteLLM.params` does not hold `self`, where LiteLLM's `locals()` does."
    why: The key is an accident of `locals()`, and it would pass the client into `create` as an argument.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L363-L375
  - what: "`betterlite.main.encoding` raises AttributeError, where LiteLLM's `__getattr__` gives a tiktoken encoding."
    why: Token counting is Rust and no tiktoken object exists in the wheel.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L9400-L9411
  - what: The retry functions run without tenacity, so the "tenacity import failed" path never appears.
    why: A plain loop needs no optional package.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L6087-L6136
  - what: A synchronous mock ignores `mock_delay`; only the awaitable call waits, in the Rust async target.
    why: The Rust mock target that builds the answer is shared by both paths, and only its async half sleeps the delay.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L953-L961
  - what: A call triggered only by `mock_timeout=True` with no `timeout` and no `mock_response` raises betterlite's "the mock call carries no mock response" instead of answering the default mock completion.
    why: The Rust mock plan needs a response or tool calls before it can answer, while LiteLLM substitutes "This is a mock request" for an absent mock_response.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L930-L940
  - what: A `mock_response` sentinel that asks for a mid-stream failure raises at the call for sync and streaming calls, where LiteLLM raises it once a stream has started.
    why: The stream is built from payloads Rust buffers before the Python wrapper exists, so there is no mid-stream point in Python.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L979-L1057
  - what: A `ModelResponse` mock with `stream=True` raises "a mock response object cannot be streamed", where LiteLLM converts the response object into streaming chunks.
    why: The Rust mock answer type decides between text and object answers before the stream is built.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L942-L951
  - what: Stream chunks are the provider's payloads, so `created` stays the provider's timestamp and no final finish chunk is synthesized when a provider ends a stream without one.
    why: The native stream hands out the SSE payloads the SDK parsed, and LiteLLM's wrapper rewrites them while holding a live iterator.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/streaming_handler.py#L855-L880
  - what: A timeout given as a connect/read/write/pool mapping reaches Rust as that mapping, and the shared transport sums the four phases into one deadline.
    why: The Rust transport enforces one deadline per call, as recorded in B5659's deviations; Python forwards the mapping unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5145-L5160
  - what: The probes `check_valid_key`, `valid_model` and `acount_tokens` send their own native call without the proxy auth headers a completion call adds.
    why: The proxy auth provider is a Python object that only the completion path reads; the probes call a separate native method.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L7156-L7171
  - what: `LiteLLM(default_headers=...)` is passed into the call but reaches no request, because the Rust request builder reads `headers` and `extra_headers` only.
    why: default_headers is a client default LiteLLM applies in its provider client; the Rust call has no client default slot for it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L363-L375
  - what: "`betterlite.proxy_auth` and `betterlite.config_path` are typed None in the wheel's globals, so this module reads its own typed `proxy_auth` and `config_path` seams when the globals are unset."
    why: The globals module is outside this task's scope and its inferred None type rejects a real provider or path; the seams are the hand-off the bridge and the tests use until those globals are typed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L1232-L1233
