task: B6562
deviations:
  - what: Provider settings are written as data tables and no longer read off the classes.
    why: Rust has no annotation reflection. Each table is checked against LiteLLM's real class by an oracle case, so a drift shows up as a failing case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_endpoints.py#L1976-L2003
kept_bugs:
  - what: custom_code's table reports ui_friendly_name as null instead of a display name.
    why: CustomCodeGuardrailConfigModel never overrides the abstract ui_friendly_name(), whose body returns None, and the endpoint writes that value into every table. The oracle case compares the whole map, so betterlite keeps the null.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/base.py#L17-L20
