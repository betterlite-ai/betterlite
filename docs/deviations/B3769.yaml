task: B3769
deviations:
  - what: EnkryptAI detection errors use betterlite's own wording when attacks are found, not LiteLLM's ValueError text.
    why: Error messages are betterlite's own per rule errors-match-litellm; the detected attacks and their details are still reported, and the failure maps to a 400 guardrail intervention like LiteLLM's ValueError.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L232-L268
  - what: The standard logging record's error entry on an HTTP failure carries betterlite's error text instead of httpx's exception text.
    why: The record keeps LiteLLM's per-call error entry and guardrail_failed_to_respond status, but its text names betterlite's typed failure rather than an httpx exception message.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L147-L173
  - what: Detection response bodies larger than 1 MiB are rejected as guardrail_failed_to_respond.
    why: Bound memory use for untrusted upstream responses; LiteLLM buffers an unbounded response. No working setup depends on a response that large.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L129
  - what: A response that is not a JSON object, or whose summary or details have the wrong type, is a typed guardrail failure recorded as guardrail_failed_to_respond; LiteLLM records the same status and then raises an unhandled AttributeError from _process_enkryptai_guardrails_response.
    why: LiteLLM's unhandled AttributeError turns a provider failure into a server error with no usable cause; a typed failure keeps the failure category and the record without crashing the request task.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L175-L204
  - what: A summary value counts as detected only when it is the number 1 or 1.0; a JSON boolean true does not count, while Python's bool-equals-int makes LiteLLM treat it as detected.
    why: Betterlite does not port Python's bool-as-int accident; true is not the integer 1.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L191-L202
  - what: A detected attack whose details entry is null is reported with default fields (N/A, {}, false, empty list) instead of LiteLLM's unhandled AttributeError.
    why: LiteLLM stores the null detail at https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L198-L202 and then crashes while formatting it at https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L249-L265; a null detail takes the same defaults as an absent one, so the detected attack stays a 400 guardrail intervention.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/enkryptai/enkryptai.py#L249-L265
