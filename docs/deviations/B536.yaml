task: B536
deviations:
  - {what: "A generation request whose model is absent or null is sent as DALL-E 2 instead of failing with a 500.", why: "LiteLLM selects the provider config with get_azure_image_generation_config(None) and then calls None.lower(), so the AttributeError reaches the caller as a 500; betterlite reads the same config an empty model selects.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/image_generation/__init__.py#L20-L34"}
  - {what: "A failed async generation logs the prompt and the error text, and an error reply that still parses gets an extra post_call for its body, where LiteLLM's async leg logs one line with the input() builtin and str(e) of the exception it re-raises.", why: "LiteLLM's async leg passes the builtin it received as input and logs str(e) of the exception it is about to re-raise, so its log names no request; betterlite logs what the request carried and the body its transport returned.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/azure.py#L1217-L1225"}
  - {what: "A generation whose response body carries an error keeps the body's message in the error it surfaces, where LiteLLM surfaces an empty message on both legs.", why: "LiteLLM raises a bare Exception with status_code and message attributes and the wrapper stringifies it, which loses the message; betterlite carries the message through.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/convert_dict_to_response.py#L603-L617"}
  - {what: "An MAI image generation reply is not transformed; betterlite fails the call with a 500 naming B554 instead of applying the Foundry MAI reply transform.", why: "The MAI reply transform is B554's, and betterlite-azure is a provider leaf that cannot depend on betterlite-foundry, so this slice returns a classified error the B554 owner replaces.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure_ai/image_generation/mai_transformation.py#L240"}
kept_bugs:
  - {what: "A boolean max_retries is accepted as an integer and never sent, because bool is an int in Python.", why: "A setup that passes true there relies on the acceptance, and the value never reaches the request body.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/azure.py#L1265-L1267"}
  - {what: "An endpoint that already holds a query string gets a second question mark and a literal ?api-version= appended to it.", why: "The deployment URL is built by string concatenation, and changing the join would move the URL of every gateway endpoint that carries a query.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/azure.py#L1137-L1138"}
