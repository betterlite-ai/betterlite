task: B326
deviations:
  - what: Spend is kept as an exact decimal in the memory cache and in every sum this task takes, so three 0.1 costs read 0.3, and the copy of the shared spend into memory adds decimals. LiteLLM adds the costs as floats in the memory cache and in the copy that merges the shared spend with the queued increments, so the same three costs read 0.30000000000000004. The float appears on the Redis INCRBYFLOAT wire, where a real shared store holds a float either way.
    why: Money is a rust_decimal::Decimal everywhere in betterlite. The oracle's fake store keeps the decimal on the Rust side, so decimal-small-increments pins the memory sum, the copied memory value and the store value as 0.3 against LiteLLM's 0.30000000000000004.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L392-L412
  - what: A sync without a configured store flushes the queue, which detaches the batch and clears it because there is no store to write. LiteLLM's _sync_in_memory_spend_with_redis returns before flushing when dual_cache.redis_cache is None, so its redis_increment_operation_queue grows with every completed request until the process restarts.
    why: The queue feeds only the store write, so without a store it is an unbounded leak. The spend itself already lives in the memory cache and no stored value changes, so nothing a working setup can observe is lost.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L650-L651
  - what: A cancelled sync does not wait for the store write it started. LiteLLM's _await_flush_task shields the flush task and, once cancelled, keeps awaiting it until it finishes before it re-raises, so its caller returns only after the write ended. Betterlite's flush runs on the server's TaskTracker, so a cancelled sync returns at once and the write finishes there; shutdown awaits the tracker before it returns.
    why: Rust has no way for an await to keep running after its task is cancelled, so the work has to live on an owner that outlives the cancelled sync. The write is not lost, and the next flush waits behind it for the same store lock, which the behaviour test cancelled_sync_still_writes_the_flush pins.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L459-L469
  - what: The state has a shutdown the limiter does not have. It stops the periodic sync, joins it, flushes what the queue still holds and waits for the in-flight store writes. A batch the store keeps rejecting is retried three times, and then shutdown returns an error naming the increments still queued instead of dropping them. LiteLLM starts periodic_sync_in_memory_spend_with_redis with asyncio.create_task in __init__ and never stops or awaits it, so the last queue contents are lost when its event loop closes.
    why: A router shutting down would otherwise drop the increments logged since the last tick, which is exactly the spend this task has to keep. The flush writes the same batch a tick would have written, so the stored spend after a successful shutdown is the spend LiteLLM's store would have reached had its loop run one more interval. The retry covers a store blip, and the error keeps the queue for the next shutdown, since a lost increment is the one failure a working setup cannot recover from.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L597-L613
  - what: start() without a running runtime logs a warning and starts no periodic sync. LiteLLM calls asyncio.create_task in __init__, which raises RuntimeError when no loop runs.
    why: The state is assembled by the server (B020), which may build it before its runtime exists and start it inside one; refusing to build the state there would block the assembly. No request path differs once a runtime is running.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L118
kept_bugs:
  - what: A tag named twice in one request is charged twice, once per entry of the request's tag list. Betterlite loops over the entries the same way instead of deduplicating them.
    why: LiteLLM's request_tags is a list and the loop spends once per entry, so a request that repeats a tag has always paid twice in the store. Deduplicating would make the stored spend lower than LiteLLM's for the same traffic, and the oracle case tag-cost-once-per-tag-entry pins the charge on both sides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L535-L546
  - what: A provider budget without a duration is read back under provider_spend:{provider}:None, a key no increment ever writes, because the None duration early-returns before the spend. Betterlite builds the same key instead of skipping the provider in the sync's read list.
    why: The read list is what LiteLLM assembles, and the extra key is a batch read of a missing value that changes no spend. Skipping it would be an invented difference in the store traffic, and the boundary test spend_keys_cover_every_tier_and_the_sync_reads_them keeps the list identical.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/budget_limiter.py#L664-L680
