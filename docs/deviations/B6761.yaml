task: B6761
deviations:
  - what: Network access is a MetadataFetcher trait and the outcomes are typed values (DiscoveryStatus, DiscoveryOutcome, DiscoveryReport), not exceptions and httpx responses. Every fetch receives the metadata timeout as an argument, where LiteLLM builds an httpx client with a timeout parameter and reads StatusCodeError and json exceptions.
    why: betterlite-mcp stays free of an HTTP client dependency and its tests run offline against a fake fetcher; B8614 wires the betterlite-http implementation. The observable results (which candidates are tried, which document fields are used, which failures are final) are unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L4916-L4927
  - what: Every metadata url, including a well-known candidate built from the server url, goes to the MetadataFetcher with no same-authority marker. LiteLLM fetches a url on the server's own scheme, host and port directly, skipping user URL validation and redirect following, so an administrator's internal MCP server keeps working even when its address is private.
    why: The port in this task takes only the url and headers, so the decision belongs to the B8614 implementation that wires betterlite-http. If that implementation applies async_safe_get to every url, discovery against an MCP server on a private address is blocked where LiteLLM allowed it; the port or the implementation needs a same-authority policy to keep that setup working.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L4916-L4927
  - what: A resource_metadata url advertised in a 401 WWW-Authenticate challenge is followed only when it has the server url's scheme, host and port. A hint on another authority is not fetched at all and logs one warning with both redacted origins.
    why: The hint is written by the upstream server, so a cross-origin value is an SSRF vector. LiteLLM still fetches it, through async_safe_get and its DNS/IP guard; betterlite refuses it in the discovery layer and falls back to the well-known lookup and the origin fallback, so the fetcher never sees the attacker's URL. This makes the task's DoD hold even when the wired fetcher has no SSRF guard of its own.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L4889-L4927
  - what: parse_www_authenticate reads parameters only from Bearer challenges, wherever they appear in the comma-separated challenge list and in any of the repeated WWW-Authenticate header fields. A header with no Bearer challenge yields None for the resource_metadata url and the scopes, where LiteLLM scans the text after the first space of the joined header regardless of the scheme.
    why: RFC 9728 section 5.1 puts resource_metadata in a Bearer challenge sent with the 401, and reading an OAuth hint out of another scheme's parameters is reading a field the other scheme never defined.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L5091-L5108
  - what: The same-authority check returns false for a url it cannot parse and for an out-of-range port, so the hint is not followed. LiteLLM's urlparse raises ValueError for an unmatched bracket and the port property raises for an out-of-range port, and that exception escapes _is_same_authority_metadata_url, _fetch_oauth_discovery_url and the 401 handler.
    why: A malformed hint belongs to the upstream and must not crash the discovery call; returning false keeps the rule fail-closed and lands on the same origin fallback a missing hint takes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L4889-L4914
  - what: An invalid or non-positive LITELLM_MCP_METADATA_TIMEOUT falls back to 10.0 seconds and logs a warning. LiteLLM parses the variable with float(os.getenv(...)) at import, so a non-numeric value raises ValueError while the module loads, and a negative or zero timeout is rejected by httpx when a request runs.
    why: A misconfigured timeout should degrade to the documented default and say so, not stop the gateway from importing or fail every discovery fetch later.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L203
  - what: An authorization server document field that is present but empty or whitespace-only counts as absent (authorization_endpoint, token_endpoint, registration_endpoint, issuer, scopes_supported entries), and a document whose only values are blank is not returned as metadata. LiteLLM's truthiness checks treat a whitespace-only string as a usable value and keep it in MCPOAuthMetadata.
    why: A blank endpoint is not a usable endpoint, and betterlite's endpoint rules (B6760) already treat blank as absent, so discovery should not hand them a value those rules immediately drop.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/mcp_server_manager.py#L5279-L5299
