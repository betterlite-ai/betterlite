task: B1333
deviations:
  - what: The response_format fallback to claude-3-sonnet-20240229 is chosen by the shared three-step capability lookup rather than by the provider-resolved lookup alone. When the resolved catalog has no supports_native_structured_output entry for the model but the runtime map, the packaged map or a provider capability says true, betterlite keeps the caller's model and native output_format while LiteLLM's override sees None, not True, and maps the request through the fallback model with tool-based structured output.
    why: The resolved-only lookup is private to betterlite-anthropic and out of this task's scope; the exported helper is the only public entry, and it answers true in exactly the cases where the other sources fill a gap the resolved catalog leaves.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_partner_models/anthropic/transformation.py#L167-L171
  - what: The anthropic beta set is written sorted into both the anthropic_beta body list and the anthropic-beta header. LiteLLM writes it in Python set iteration order, which differs between its own runs because str hashing is randomized, so the membership matches and only the order of the list and the comma-joined header can differ.
    why: No setup can depend on an order Python itself does not repeat, and a sorted list makes the body and the header byte-stable run to run.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_partner_models/anthropic/transformation.py#L146-L148
  - what: A malformed context_management on the Vertex beta scan is either ignored or answered 400. A value that is not an object answers 400 "context_management must be an object"; edits that is not a list answers 400 "context_management.edits must be a list"; an edit that is not an object answers 400 "context_management edit N is not an object". LiteLLM's _add_context_management_beta_headers calls .get on the value and on every edit, so a truthy malformed value raises AttributeError or TypeError, which surfaces as a 500.
    why: The request field is the caller's, so a malformed value belongs in a 400 that names it rather than a crash, and no working setup sends a malformed edit list.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_partner_models/anthropic/transformation.py#L61-L91
  - what: A malformed extra_headers on the Vertex beta scan is answered 400. A value that is not an object answers 400 "extra_headers must be an object", and an anthropic-beta list entry that is not a string answers 400 "extra_headers.anthropic-beta entries must be strings". LiteLLM ignores a falsy extra_headers, calls .get on a truthy one, and later ",".join on a set holding a non-string entry, raising AttributeError or TypeError, which surfaces as a 500; an anthropic-beta value that is neither a string nor a list is ignored by both.
    why: The request field is the caller's, so a malformed value belongs in a 400 that names it rather than a crash, and no working setup sends a beta header value it cannot express as text.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_partner_models/anthropic/transformation.py#L134-L142
