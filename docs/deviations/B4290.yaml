task: B4290
deviations:
  - what: Rust trait methods use Result for fallible operations, and the async adapters propagate an error instead of LiteLLM's NotImplementedError.
    why: Rust does not permit a missing return value as a silent success, and a typed Unsupported error names the operation a backend has not built.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/base_cache.py#L35-L39
  - what: Cache type records reject unknown JSON keys, while LiteLLM's pydantic models ignore extra fields and its TypedDicts are plain dicts.
    why: An unmodelled key becomes an error that names it instead of being dropped before a caller learns it was ignored.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/caching.py#L117-L125
