task: B4308
deviations:
  - what: "The text after \"Cache connection test failed: \" and in the error member is betterlite's own error text, not the Python exception text."
    why: "Python exception strings (a redis-py connection error, a TypeError from a bad keyword) have no Rust equivalent; the status, the message prefix and the null or non-null error member match LiteLLM."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/cache_settings_endpoints.py#L557-L566
  - what: "A settings map with redis_startup_nodes (cluster mode) answers status \"failed\" with the B4299 cluster error, while LiteLLM builds a RedisClusterCache and tests it."
    why: "No task wires B4299's Cache to the cluster constructor yet, so Cache::open returns its unsupported-type error; the route reports it in the failed answer. B4323, B4325, B4326, B5220 and B5640 own the cluster cache and B4299 must call it before this goes away."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L188-L218
  - what: "A valid non-admin key answers 403 with a {\"detail\": \"...\"} body, while LiteLLM's admin-only route check raises a plain Exception that auth_exception_handler turns into a 401 auth_error envelope."
    why: "betterlite's management routes carry the admin-only check in the route (as guardrails/custom_code_test does), so a forbidden caller gets the route's own 403 and detail body instead of an authentication failure."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/route_checks.py#L249-L257
  - what: "An explicit socket_timeout null cannot disable the 5.0 second default, because the bridge drops null keyword arguments and B4299 then applies RedisCache.__init__'s default."
    why: "redis-py treats a null kwarg as unset too, so a null socket_timeout in LiteLLM also ends at the 5.0 default; no behavior differs, but the mechanism does."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/redis_cache.py#L604-L650
  - what: "An absent or null host and url with no REDIS_ environment fallback answers B4321's missing-target failure where LiteLLM's redis-py falls back to localhost, and a null value for a name no redis client knows is dropped so the test runs where LiteLLM's redis-py raise fails it."
    why: "B4321 rejects a settings map with no host or url and its typed option map has no null member, so the bridge drops nulls instead of forwarding them; the route must not pick or default connection fields itself."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/redis_cache.py#L622-L646
  - what: "The named Cache options that only shape caching (mode, namespace, ttl, redis_flush_size, disk_cache_dir, supported_call_types, semantic cache settings and the s3/azure/qdrant credentials) are accepted and ignored instead of being bound into the temporary cache."
    why: "The route only builds the cache to call test_connection, which pings Redis; none of those options reach the connection or the answer, and the temporary cache is dropped before returning."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L80-L218
  - what: "_backend is accepted and ignored; LiteLLM would use it as the cache object under test."
    why: "A cache backend is an in-process object. It cannot arrive over HTTP, and constructing one from a JSON member would let the caller choose the answer without touching Redis."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching.py#L187-L188
