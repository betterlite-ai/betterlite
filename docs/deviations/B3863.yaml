task: B3863
deviations:
  - what: AgentOps silently skips the JWT token fetch on failure instead of halting initialization. The callback continues with no Authorization header and no project id.
    why: LiteLLM keeps the callback alive after the except block, allowing the service to start with degraded telemetry. The fallback paths are covered by agentops_callback_falls_back_silently_when_the_token_endpoint_refuses, agentops_callback_falls_back_silently_on_a_malformed_token_response, agentops_callback_falls_back_silently_when_the_endpoint_is_unreachable and agentops_callback_falls_back_silently_when_the_endpoint_is_not_a_url.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/agentops/agentops.py#L59-L65
  - what: Levo uses LEVOAI_COLLECTOR_URL exactly as provided, with no endpoint normalization or defaulting.
    why: LiteLLM assigns the environment value to the endpoint unchanged; a trailing path or slash stays in the exporter endpoint. Covered by levo_collector_url_is_used_verbatim.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/levo/levo.py#L70-L72
  - what: Traceloop's SDK settings are carried as a TraceloopConfig value with app_name "Litellm-Server" and disable_batch true, instead of calling traceloop.sdk.Traceloop.init, because the traceloop SDK is external to betterlite. The callback itself takes an injected SDK tracer.
    why: LiteLLM initializes the external traceloop SDK with exactly these two settings; betterlite records the same settings and leaves SDK construction to the caller. Covered by traceloop_defaults_the_sdk_configuration_and_callback_name.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/traceloop.py#L25-L29
  - what: Traceloop stops writing attributes when messages or choices are missing and never ends the span itself, but the opentelemetry-rust SDK ends and exports a span when its handle drops, so the partially attributed span still reaches the exporter with Status Unset.
    why: LiteLLM's unended span never reaches its exporter. Suppressing the export in Rust would need a leaked span handle or a sampler, so the early return is kept and the export is accepted. Covered by traceloop_stops_before_the_completions_when_choices_are_missing, traceloop_stops_before_the_completions_when_choices_are_null, traceloop_stops_before_the_prompts_when_messages_are_missing and traceloop_stops_before_the_response_when_the_response_is_missing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/traceloop.py#L118-L139
  - what: AgentOps does not close the pooled HTTP client after the token POST. The client stays usable for other outbound requests.
    why: LiteLLM closes the shared, cached client from _get_httpx_client in a finally block, which breaks every later caller of that cache entry. betterlite's B173 client is shared with all other outbound requests, so closing it would break them. Covered by agentops_callback_leaves_the_pooled_client_usable_after_the_token_request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/agentops/agentops.py#L102-L116
  - what: On the Weave success path betterlite closes the LiteLLM-created proxy request span. LiteLLM's WeaveOtelLogger._handle_success never does, so that span stays open and never exports.
    why: The Weave override reimplements the success tail without the base proxy span handling; a never-ended proxy span loses the trace root. The shared lifecycle closes only a span named "Received Proxy Server Request", the span betterlite itself created. Covered by weave_handle_success_closes_the_proxy_request_span_litellm_leaks.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/weave/weave_otel.py#L267-L304
  - what: On the Weave success path the guardrail span is parented to the litellm_request span betterlite just created. LiteLLM's Weave override parents it to the request's parent context, or to a root context when there is no parent.
    why: The shared lifecycle resolves the guardrail context from the primary span first, and the Weave override bypasses that resolution by passing ctx directly. Keeping the child parented to the primary keeps guardrails inside the call's trace subtree. Covered by weave_parents_the_guardrail_span_to_the_litellm_request_span.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/weave/weave_otel.py#L291-L292
  - what: The Weave success path keeps the base lifecycle's duplicate success suppression. LiteLLM's Weave override has no _emit_once call, so a sync and an async success for one request would emit two spans there.
    why: The Weave callback reuses the shared legacy lifecycle, whose dedupe is part of the base success flow; removing it for this callback would need a lifecycle override that does not exist in betterlite. Covered by weave_suppresses_a_duplicate_success_for_one_request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/weave/weave_otel.py#L280-L290
  - what: The Weave success path honors OpenTelemetryConfig.ignore_context_propagation. LiteLLM's Weave override reads the parent with _get_span_context and never checks that flag, so with it set LiteLLM still parents the new span while betterlite starts a root span.
    why: The shared legacy lifecycle applies the flag before choosing a parent context; the Weave override bypasses that check. Covered by weave_honors_ignore_context_propagation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/weave/weave_otel.py#L280-L286
  - what: The Weave lifecycle forces an EVENT_ONLY capture policy so the shared base success flow skips the raw_gen_ai_request span. LiteLLM's Weave callback skips that span with a no-op method override and leaves the capture mode untouched.
    why: The legacy lifecycle only skips the raw span when the capture mode does not record it; the callback cannot replace the overridden method from its own module. With events enabled and an explicitly configured mode that does not record events (SPAN_ONLY, or NO_CONTENT from message_logging off), LiteLLM's Weave emits the semantic events with their content stripped, while betterlite emits them with content.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/weave/weave_otel.py#L229-L236
  - what: Logfire events go to an injected LogfireSink carrying the span config, instead of being written through the external logfire SDK with logfire.info or logfire.error.
    why: The logfire module and its configuration are external to betterlite. The sink receives the same message_template and request_data, and a failure is reported at error level with exc_info true. Covered by logfire_logs_a_success_at_info, logfire_logs_a_failure_at_error_with_exc_info, logfire_async_logs_a_success_at_info and logfire_async_logs_a_failure_at_error_with_exc_info.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/logfire_logger.py#L145-L157
kept_bugs:
  - what: Traceloop converts the call's start and end times to whole epoch seconds and passes them to start_span and end, whose arguments the OpenTelemetry SDK reads as nanoseconds, so every traceloop span is dated within the first seconds of 1970.
    why: An existing LiteLLM traceloop setup already produces these span timestamps, so betterlite copies them rather than changing what the backend sees. Covered by traceloop_emits_one_client_span_named_litellm_completion.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/traceloop.py#L51-L53
  - what: Traceloop swallows the TypeError raised when messages or response choices are missing, so the failure is silent and no failure signal reaches the caller.
    why: An existing setup can send payloads whose streaming aggregation has no choices and depends on the callback never raising; betterlite keeps the silent early return. Covered by traceloop_stops_before_the_prompts_when_messages_are_missing and traceloop_stops_before_the_completions_when_choices_are_missing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/traceloop.py#L118-L139
