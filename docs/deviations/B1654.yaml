task: B1654
deviations:
  - what: >-
      POST /compliance/eu-ai-act and POST /compliance/gdpr answer the declared 422 validation envelope when the JSON
      body is null, a list or another non-object. LiteLLM reads request_data.get("model") inside its auth middleware
      before FastAPI validates the body, so those requests raise there and the proxy's generic handler answers 500
      with an internal_server_error JSON body.
    why: >-
      A 500 where a 4xx belongs: the request never reaches authentication or the compliance code, and the declared
      request model rejects the shape. No working setup can rely on the crash, and docs/compatibility.md keeps the
      declared types as the contract.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/auth_utils.py#L589
  - what: >-
      A body that is not valid JSON gets a 422 whose loc is only ["body"], while LiteLLM reports the decoder offset
      in the loc as ["body", <column>] and keeps the message JSON decode error. The column comes from CPython's json
      decoder and has no serde_json equivalent, and a YAML HTTP case cannot send a malformed body for the oracle to
      compare.
    why: >-
      The status, type, message and body-level loc match; only the column inside loc differs, and neither proxy reaches
      authentication or compliance evaluation for such a body.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L2034-L2046
