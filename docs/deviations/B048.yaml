task: B048
deviations:
  - {what: "The registry covers 18 of LiteLLM's 20 search providers: agentcore and bing_grounding return None.", why: "B659, B2212 and B546 build no B3270 search config, only typed request and reply functions in leaf crates that cannot be imported by betterlite-core. A later task that adds such a config adds the name.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9891-L9916"}
  - {what: "A 2xx TinyFish reply larger than 16 MiB fails with \"the TinyFish search reply is larger than 16777216 bytes\" before it is parsed or defaulted.", why: "LiteLLM reads the whole body with no bound, so a hostile or broken upstream can exhaust the proxy's memory on one search. A working setup never sends a 16 MiB search reply, so the fix breaks no one.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/tinyfish/search/transformation.py#L221"}
  - {what: "A TinyFish reply that fails the SearchResponse schema reports betterlite's serde decoder message instead of pydantic's validation text.", why: "betterlite reads the reply with serde, whose message names the JSON path and the expected type rather than pydantic's field error list, the same difference the other search providers list.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/tinyfish/search/transformation.py#L232-L238"}
  - {what: "A TinyFish request with no key fails in sign_request, not validate_environment: the B3270 hook cannot fail, so it returns the incoming headers untouched and the missing-key error is raised before any request leaves.", why: "The search provider trait's validate_environment returns headers, not a result, so the failure moves to the first hook on the same path that can return one. The message and the point in the request pipeline where the call stops are unchanged.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/tinyfish/search/transformation.py#L60-L69"}
kept_bugs:
  - {what: "A max_results of true is read as the integer 1, and false as 0 then clamped up to 1, because Python treats bool as an int.", why: "LiteLLM's isinstance(raw_max, (int, float, str)) accepts a bool and int() turns it into 0 or 1, so a setup that sends a bool relies on that clamping rather than an error. betterlite copies it and both a unit test and an oracle call cover it.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/tinyfish/search/transformation.py#L132-L138"}
