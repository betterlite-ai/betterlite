task: B2451
deviations:
  - {what: "The pre-call records no api_key in model_call_details, where LiteLLM's Logging._pre_call stores the empty string the image edit handler passes.", why: "The handler passes an empty key on purpose, so the recorded value carries nothing a callback can use; betterlite's shared pre_call writes no api_key entry at all, and adding an empty one would claim a credential that was never read.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/litellm_logging.py#L1333"}
  - {what: "The sync pre-call logs complete_input_dict as an object mapping each file field to its filename, content and content type, where LiteLLM logs the raw list of (field, (filename, bytes, content type)) tuples.", why: "The logged value is the same information for the same fields; betterlite's log records hold JSON, so the tuple list becomes a named object and the field names stay searchable in callback output.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6775-L6783"}
  - {what: "A logged image whose content is not UTF-8 records content as null, where LiteLLM logs the bytes object as the transform produced it.", why: "betterlite's log records are JSON and cannot carry bytes; null says the content was there and not text, instead of inventing a replacement-character string.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6779-L6779"}
  - {what: "A timeout message renders the caller's timeout from a Duration, so whole seconds print as 5.0 where Python prints the int 5 the caller passed, and the async time taken prints up to six trimmed decimal places where LiteLLM rounds it to three.", why: "The message still reports the same timeout and the same measured time, and betterlite keeps durations typed; only the number rendering differs, and no caller parses a timeout message for its digits.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866"}
  - {what: "An error body or header value that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\", where LiteLLM reads the body through response.text and the header values as httpx strings.", why: "betterlite records both as JSON text; replacement characters would hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
  - {what: "litellm_params.ssl_verify accepts only a boolean; a string such as a CA bundle path fails with the typed litellm_params.ssl_verify error before a client is selected, where LiteLLM hands the value to the httpx client factory, which takes a boolean or a path.", why: "The handler's declared parameter is a typed flag in betterlite; a path needs the proxy's trust configuration rather than a per-call string, and naming the field beats a client that fails later with a lower-level error.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6742-L6745"}
  - {what: "A complete URL or a header that HTTP cannot carry fails with the typed RequestUrl, HeaderName or HeaderValue error after the pre-call and before the send, where LiteLLM logs the pre-call, hands the strings to httpx, and the exception becomes a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable URL or header instead of reporting a 500 as if the provider had answered, and no working setup has an api_base or header the HTTP layer rejects.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6785-L6809"}
  - {what: "The async client is created per call from the client pool and the request's ssl_verify, where LiteLLM asks get_async_httpx_client for a client keyed by the custom provider and its ssl_verify parameter.", why: "betterlite's transport shares one pool per source and the provider argument only chooses an httpx class in LiteLLM; the request bytes, headers and timeouts are the same and no caller observes which client class issued them.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6840-L6846"}
kept_bugs:
  - what: The pre-call logs the uploaded image content in clear, so a UTF-8 image body reaches every logging callback through complete_input_dict.
    why: A deployment's callbacks and redaction settings see the same pre-call payload LiteLLM hands them; dropping the content would change what those callbacks receive, and the task copies the logged file mapping on purpose.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6775-L6783
  - what: The sync and async handlers accept extra_body, fake_stream and litellm_metadata and never use any of them.
    why: A caller passing those arguments gets the same request as one who omits them; honoring fake_stream or merging extra_body would change the bytes on the wire from what a working setup sends.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6711-L6716
