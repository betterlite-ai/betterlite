task: B4447
deviations:
  - what: The 400 message lists betterlite's 22 accepted names, not the Python typing repr of the Literal union.
    why: The repr text of a typing union is a Python runtime detail. The status, type, param and code match.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L292-L319
  - what: get_callback_identifier has no attribute and class-registry steps; a registered callback returns the name B4448's registry records for it.
    why: B189's registry holds a closed set with one registered name per callback, and there are no Python objects to inspect.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L192-L202
  - what: Vendor checks that LiteLLM runs by constructing a fresh logger (DataDogLogger(), DatadogMetricsLogger(), ArizeLogger(), GalileoObserve(), SQSLogger(), NewRelicLogger()) run through injected probes over the integration the proxy already configured.
    why: Construction reads the same env vars the integration resolved at startup, and the repository rule keeps environment reads in the config crate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L350-L394
  - what: TEST_EMAIL_ADDRESS is read once when the config loads, not on every call.
    why: The repository rule keeps environment reads inside the config crate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L581
  - what: The two spend reports start through sync trait methods on the injected AlertActions, so the production implementation schedules them itself; LiteLLM calls asyncio.create_task here.
    why: The workspace clippy configuration bans tokio::spawn, so the background scheduling belongs to the implementation B8540 builds, not to this module.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L523-L525
  - what: MockRequests::send_mock_request takes the request it sends, where the task sketch had a no-argument method.
    why: The exact model, messages, user and mock_response are this endpoint's behavior, so passing the value lets a fake assert them here instead of leaving the literal to B8540.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L340-L349
kept_bugs:
  - what: The webhook service answers HTTP 200 with a JSON null body, because the webhook branch is an if that falls through the slack, ms_teams and email checks and the handler ends without a return.
    why: The branch is reachable and a client that calls service=webhook can rely on the null answer.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L453-L471
  - what: Only seven alert types have their own Slack test message; every other type, spend_reports included, sends "Budget Alert test alert", and the initial "default test message" is never sent.
    why: The message map is what a working Slack setup receives for those types today.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L495-L511
  - what: The handler logs "Exception occured", misspelled.
    why: Log matchers and dashboards built against LiteLLM key on that line.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/health_endpoints/_health_endpoints.py#L595-L597
