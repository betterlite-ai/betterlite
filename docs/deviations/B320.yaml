task: B320
deviations:
  - what: A configured tag pattern longer than 2048 bytes, or a match that passes 100000 backtracking steps, is skipped with a named warning instead of being run.
    why: The pinned code compiles and searches any pattern with no execution bound, and bounded-inputs requires a finite one. Supported Python syntax and first-match semantics stay inside that bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/tag_based_routing.py#L87-L107
  - what: A tag match document over 1048576 bytes is rejected with TagMatcherError::TooLarge before it is decoded.
    why: The pinned code has no byte bound at this parser boundary, and bounded-inputs requires a finite limit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/tag_based_routing.py#L87-L277
  - what: >-
      Tag patterns run on fancy-regex with seek disabled instead of Python's re. Python's \N{...} named
      escapes and any construct fancy-regex's compiler refuses are warned about as unsupported_pattern and
      skipped; other patterns its parser rejects, such as the lone a{ that Python 3.13 reads as a literal,
      are warned about as invalid_pattern and skipped. The engine also accepts constructs Python 3.13
      rejects, such as \G and stacked repeats, and without MULTILINE $ matches only at the very end rather
      than before one trailing newline. Invalid or oversized patterns are warned once when the matcher is
      built instead of once per matching request.
    why: Python's re is not available in Rust; fancy-regex is the maintained engine already in the lock that runs lookahead, backreferences and named groups with an explicit backtrack limit. A pattern the engine cannot run is skipped with a named warning rather than reinterpreted.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/tag_based_routing.py#L87-L107
