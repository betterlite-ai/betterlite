task: B259
deviations:
  - what: Tool definitions over 16 MiB or 1024 entries are rejected with a typed error before formatting, where LiteLLM formats an array of any size.
    why: The parser reads an inbound tool list, so it needs a bound; 1024 tools is eight times what OpenAI accepts and 16 MiB is above any request body a gateway forwards.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L954-L967
  - what: An enum value that is an object or an array is rejected with a typed shape error naming the enum field, where LiteLLM interpolates Python's str() of the value into the quoted alternative.
    why: Python's dict and list text is not JSON and has no faithful rendering in the typed formatter; scalar enum values (strings, numbers, booleans and nulls) still render as quoted alternatives.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/token_counter.py#L1030-L1046
