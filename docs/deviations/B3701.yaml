task: B3701
deviations:
  - what: "Block detection uses character indices for start/end positions instead of byte offsets. LiteLLM's regex.finditer returns byte positions; Rust reassembly uses character counts to preserve UTF-8 safety."
    why: "Rust strings are UTF-8 and indexing requires character boundaries; character positions avoid invalid slicing."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/block_code_execution/block_code_execution.py#L387-L402"
  - what: "The Rust implementation exposes typed text-list scanning rather than LiteLLM's dictionary-based generic input and framework exception/logging hooks."
    why: "The generic dispatcher and logging/exception contracts are owned by other tasks and are not present in this crate's current API."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/block_code_execution/block_code_execution.py#L517-L588"
