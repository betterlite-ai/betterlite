task: B1735
deviations:
  - what: >-
      Window seed arithmetic and the upserted spend and increment are exact Decimals. LiteLLM
      sums and subtracts floats, so a value outside the decimal range fails here with
      WindowSpendError::Overflow instead of becoming an infinity, and a seed base is the decimal
      value of the sums rather than the nearest double of a float subtraction.
    why: >-
      The workspace requires checked Decimal money and the spend column is read back as an exact
      numeric; the oracle cases pin the seed base and the upsert parameters on amounts both
      arithmetics agree on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/budget_window_spend_writer.py#L221-L230
  - what: >-
      An offset-aware window_start or started_at stamp is converted to UTC before it reaches the
      seed query, the upsert or the exclusion cutoff. LiteLLM keeps the wall-clock digits of such
      a stamp and labels them UTC (replace(tzinfo=timezone.utc)) for window_start and started_at,
      while its upsert binds window_start as a timestamptz and converts it, so its seed query and
      the row it writes can sit an offset apart.
    why: >-
      The window queue normalizes every stamp to naive UTC when it builds the transaction, so no
      working setup reaches an offset-aware window_start or started_at; betterlite gives every
      query the same instant when one does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/budget_window_spend_writer.py#L213-L237
kept_bugs:
  - what: >-
      A failed primary or end-user spend read returns None instead of raising, so the caller
      falls back to a caller-supplied spend: an outage, a deadline or a query bug all read as
      unknown spend.
    why: >-
      LiteLLM catches every counter lookup failure so the auth path keeps serving through
      database trouble; betterlite keeps that degrade-to-None and logs the failure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/spend_counter_reseed.py#L136-L142
