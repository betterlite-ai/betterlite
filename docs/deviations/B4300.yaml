task: B4300
deviations:
  - what: A per-input embedding cache key is derived from a private copy of the key request carrying that input, with litellm_params.preset_cache_key cleared, so a preset key never stands in for the per-input key on the read side.
    why: LiteLLM's get_cache_key stores the first computed key as preset_cache_key and returns it for every later input of the same aembedding batch, so each read after the first returns the first input's entry. No working setup can rely on that.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L757-L832
  - what: Each per-input embedding read sends only the per-input cache_key and the dynamic cache object; the request's cache dict controls (use-cache, s-maxage and s-max-age) are not applied to embedding reads.
    why: LiteLLM's embedding read passes only cache_key and dynamic_cache_object to Cache.async_get_cache, so should_use_cache and the max-age check never see the request's cache dict. Honoring those controls for embeddings would differ from LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L800-L805
  - what: A flat integer array input like [1, 2, 3] is treated as one token input with one cache key instead of being rejected.
    why: LiteLLM accepts any list input and runs one cache lookup per element, but its per-token keying sends the leftover tokens to the provider and merges a wrong embedding. Keeping the whole token array as one input preserves the request without copying that bug.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/caching_handler.py#L793-L796
