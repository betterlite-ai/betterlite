task: B4840
deviations:
  - what: The agent graph is reached through the `AgentRuntime` and `Graph` traits, not through the Python deepagents, langgraph and langchain-litellm imports that `load_deps` performs.
    why: There is no Python in the gateway. `MissingRuntime` gives the same install failure when no runtime is wired in.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L71-L91
  - what: The in-memory checkpointer is owned by the runtime value, not by a module-level singleton.
    why: The rules forbid module-level state. One runtime shared by sessions gives the same cross-session resume that `shared_checkpointer` gives.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L94-L103
  - what: A call on a session that was never started fails with `HarnessError::SessionClosed`, not with the `HarnessError("Deep Agents session is not started")` text.
    why: SessionClosed is the existing error for this case and the CLI handler uses it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L224-L227
  - what: The structured-output tool that update events skip is named by the output schema's `title`, not by the Python class `__name__`.
    why: SessionSettings holds a JSON schema, not a class. A pydantic model's schema title is its class name.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L142
  - what: AgentRuntime has a `load_deps` method that `start` calls right after `validate_environment`, and MissingRuntime fails it with InstallFailed.
    why: LiteLLM calls `load_deps()` before building the agent, so a session without the runtime fails with HarnessInstallFailed before any model, skill or subagent work; the task text names only build_agent for the install failure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L119-L121
  - what: AgentRuntime has another method, `usage_callback(cost_model) -> Option<UsageCallback>`, which the task text does not list.
    why: LiteLLM builds `deps.backend.UsageCallback(ctx, ctx.model)` inside `turn`; the Rust UsageCallback needs a TokenPricer, and only the runtime, which owns the model calls, can supply one. None means the runtime has no pricer and the turn counts no usage.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L168
  - what: The handler copies the callback's ledger totals into the turn outcome when the turn finishes, so a turn that errors keeps no partial usage; LiteLLM's callback adds each model call's tokens and cost to the session counters as the call ends.
    why: B4837's UsageCallback keeps a per-callback ledger instead of writing to the session context, so the handler is the only place that can move the totals into the outcome. Waiting for the end of the turn keeps the add order deterministic and never fails a turn.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepagents/harness/sandbox_backend.py#L521-L547
  - what: The general-purpose subagent's tool filter crosses the trait as a JSON entry under its `middleware` key, named `LiteLLMHarnessToolFilter` with a `blocked` list, instead of a `ToolFilterMiddleware` instance.
    why: Subagents cross the trait as `JsonObject` and Rust cannot put a middleware struct in one. The runtime turns the entry back into a `ToolFilterMiddleware` for deepagents, the same filter the top-level middleware holds.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L238-L254
  - what: A runtime whose general subagent JSON has no `name` matches no user subagent, so the default one is still added; LiteLLM indexes `deps.subagent_defaults["name"]` and would raise.
    why: A missing key is a runtime defect, and raising a Python KeyError equivalent would fail a session over data the caller cannot see. deepagents' own default always carries a name, so a working setup never reaches the difference.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/handlers/deepagents_handler.py#L249-L251
