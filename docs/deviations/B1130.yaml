task: B1130
deviations:
  - what: >-
      An async entry that the caller gave a synchronous client runs that client's request and answers
      the page or deleted object, where LiteLLM awaits the value a sync client returned and raises
      TypeError.
    why: >-
      Awaiting a value a synchronous client returned is a crash, not a response any working setup can
      rely on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/assistants/main.py#L374-L412
kept_bugs:
  - what: >-
      An azure_ad_token read from extra_body, or from AZURE_AD_TOKEN when extra_body is null, is
      resolved and then dropped: unless the token arrives as the top-level azure_ad_token kwarg the
      Azure request carries api-key and no bearer token.
    why: >-
      LiteLLM's Azure assistants client takes azure_ad_token but initialize_azure_sdk_client builds
      the client from litellm_params alone, and betterlite's B686 keeps that behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/assistants.py#L40-L60
