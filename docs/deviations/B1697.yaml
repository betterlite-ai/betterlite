task: B1697
deviations:
  - what: Unrepresentable daily counters and nonfinite numeric amounts fail at typed input or checked aggregation boundaries.
    why: Spend must remain finite and counters must not overflow their checked integer representation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/daily_spend_bulk_upsert.py#L115-L145
  - what: Serialized daily tag lists larger than one MiB are rejected.
    why: Bound allocation at the byte decoder for untrusted serialized tags.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/daily_spend_bulk_upsert.py#L63-L72
  - what: Daily money aggregation uses exact Decimal arithmetic instead of binary float summation.
    why: The money-is-decimal rule prevents roundoff accumulation; for example, 0.1 plus 0.2 binds as 0.3.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/daily_spend_bulk_upsert.py#L137-L145
