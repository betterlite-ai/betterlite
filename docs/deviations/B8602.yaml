task: B8602
deviations:
  - what: Chunks are JSON maps tagged with a ChunkKind instead of pydantic objects, so the restamp cannot fail to set a model and LiteLLM's "failed to override chunk.model" error log has no counterpart.
    why: The objects that reach the generator either have a model field or accept extra fields, so the visible output is the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L9461-L9471
  - what: A ModelStream chunk keeps delta.reasoning_items when its delta is otherwise simple; LiteLLM's fast serializer copies only role and content, so those reasoning items never reach the client.
    why: Dropping provider reasoning items loses data the model returned, and the canonical model_dump_json path keeps the same field, so betterlite keeps it on every stream chunk.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L9503-L9523
  - what: An output item in a Responses event keeps its own null fields even where LiteLLM's union validates it into an output item model and drops them, and a tools entry whose declared type carries a value pydantic rejects is still serialized by that model's shape while LiteLLM falls back to its dictionary member and keeps every null.
    why: The serializer sees JSON without pydantic's union, so it treats output items as dictionaries and picks a tools entry's model shape by its type tag alone; reproducing the union's validation-failure fallback would need every tool and output item schema.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/llms/openai.py#L1397-L1412
