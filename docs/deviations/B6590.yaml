task: B6590
deviations:
  - {what: "protocol_version is Option on input and always Some after checked(), where LiteLLM types it as a non-optional field and tracks whether the caller set it with model_fields_set.", why: "Rust has no set-field tracking, and the only reader of the difference is the validator itself.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp_server/mcp_server_manager.py#L277-L283"}
  - {what: "An explicit null protocol_version is treated as absent and resolved from mcp_info, where LiteLLM's non-optional field rejects the null before the model validator runs.", why: "serde reads a null into the Option's None, and docs/compatibility.md says an absent or null key takes the field's default.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp_server/mcp_server_manager.py#L95"}
  - {what: "Deserialize itself runs the model validators, where Pydantic runs them in the constructor and in model_validate.", why: "A record built from JSON must never exist unvalidated; the observable results are the same because every path that builds a record from JSON is validated in both.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/mcp_server/mcp_server_manager.py#L277-L291"}
