task: B4830
deviations:
  - what: "State::loads strictly requires an integer version and string-or-null optional fields."
    why: "The Rust state wire record is typed, while LiteLLM accepts broader values."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/types.py#L198-L214"
  - what: "Approval callers set the shared SetOnce decision directly instead of using LiteLLM's allow, deny, wait and answered helpers."
    why: "The repository's no-one-line-functions rule forbids a single-statement resolve wrapper; SetOnce itself preserves first-answer-wins behavior."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/types.py#L95-L130"
  - what: "Sandbox::run requires a timeout and byte output cap, and Sandbox::read requires a byte cap; LiteLLM accepts None and has unbounded content reads."
    why: "Every wait and untrusted content allocation has a required bound under betterlite's bounded-inputs rule."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/sandbox/base.py#L41-L48"
  - what: "SessionContext has no tools field; LiteLLM accepts custom Python callables."
    why: "The Rust contract has no in-process tool-function representation yet."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/context.py#L45"
  - what: "Structured output uses a JSON schema and JSON object rather than a pydantic model class and instance."
    why: "Rust represents structured output as schema data and validated JSON."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/context.py#L50"
  - what: "State JSON is compact because serde_json::to_writer omits spaces."
    why: "Field order and load behavior stay compatible, but the formatting differs from json.dumps."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/types.py#L187-L196"
  - what: "Missing workdir returns StateIncompatible instead of LiteLLM's bare KeyError."
    why: "The task requires missing required state fields to use the typed StateIncompatible error."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/types.py#L198-L214"
  - what: "Usage::total_tokens returns TokenOverflow past u64::MAX."
    why: "Rust avoids unchecked arithmetic; Python integers do not overflow."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/harness/types.py#L47-L55"
  - what: "Session setup, turn request and sandbox command environment values use SecretString."
    why: "Per-session endpoint tokens must stay secret in memory and in Debug output."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/harness/transformation.py#L43-L70"
