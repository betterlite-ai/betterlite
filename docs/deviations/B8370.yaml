task: B8370
deviations:
  - what: >-
      Crontab parse errors other than the five-field count carry croner's message,
      not APScheduler's ValueError text, and croner's dialect is the one that parses:
      day_of_week terms APScheduler rejects, such as L, #, ? or a weekday name with a
      step, are accepted, while APScheduler's "last", "1st mon" and name ranges with
      steps are not.
    why: >-
      The task sends the crontab through the croner crate for field parsing and
      next-occurrence search. The caller of CronTrigger::from_crontab logs its own
      fixed "Invalid maximum_spend_logs_cleanup_cron value" line for any parse error,
      so no user-facing text depends on the inner wording.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L7806-L7812
  - what: >-
      A day_of_week number above 6 is rejected with betterlite's own message instead of
      APScheduler's "Error validating expression" text. Numbers 0-6 are translated to
      weekday names before croner sees them.
    why: >-
      croner reads 0 as Sunday and also accepts 7 as Sunday, while LiteLLM's APScheduler
      reads 0 as Monday and rejects 7; without the translation "0 3 * * 0" would fire on
      the wrong day. This is the 0=Monday rule the task's pitfall calls out.
    link: https://apscheduler.readthedocs.io/en/3.x/modules/triggers/cron.html
  - what: >-
      Job runs are tokio tasks tracked in a JoinSet, not asyncio tasks on an executor,
      and job stores other than memory do not exist.
    why: >-
      LiteLLM only ever uses MemoryJobStore and its AwaitableAsyncIOExecutor; the
      observable rules (grace, coalesce, instances, ids) are kept.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L10584-L10601
  - what: >-
      A stagger offset wrapped around an interval trigger leaves that job's schedule
      unshifted, while the same wrapper shifts a cron job's next fire.
    why: >-
      APScheduler shifts an interval job through the start_date its IntervalTrigger fixed
      when it was built. betterlite's IntervalTrigger holds only the period, so rolling
      now back before asking it cancels the offset exactly; interval jobs therefore keep
      their unshifted phase after apply_scheduled_job_stagger.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/scheduled_job_stagger.py#L124-L143
  - what: >-
      An interval job with no explicit next run time has its first fire computed when it
      is added; APScheduler computes it when a stopped scheduler starts, from the
      trigger's construction-time start_date.
    why: >-
      The two agree when startup is shorter than the interval, which is the normal case.
      A startup longer than the interval makes betterlite run once late inside the
      misfire grace instead of snapping forward to the next grid point.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L10562-L10601
