task: B2485
deviations:
  - {what: "A complete base URL that does not parse as a URL fails with the typed RequestUrl error before the pre-call runs, where LiteLLM builds the URL string, logs the pre-call, and only the send raises httpx's InvalidURL or UnsupportedProtocol for the handler's catch to turn into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10153-L10157"}
  - {what: "An extra header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose own encoding raises inside the handler's try and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10153-L10157"}
  - {what: "An error body or a header value that is not UTF-8 becomes a count of bytes, where LiteLLM reads the body through response.text and the header values as httpx strings.", why: "betterlite records both as JSON text; replacement characters hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
  - {what: "The async timeout message renders both durations from Duration values, so a timeout without a fraction prints as whole seconds and the elapsed time as seconds plus zero-padded milliseconds (time taken=0.100). LiteLLM interpolates Python floats, so a float 7.0 prints 7.0 and a hundred milliseconds prints 0.1.", why: "The message still reports the timeout the caller passed and the time the failed request took, the same numbers LiteLLM shows; only the float rendering differs, since betterlite keeps durations typed.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866"}
kept_bugs:
  - what: Caller extra_headers cannot override Authorization or Content-Type. Validation rewrites those two keys in the map it is handed, and the handler's later headers.update re-applies that same map, so the caller's values are gone.
    why: A setup passing its own Authorization gets the provider key on the wire, and code depending on that would send the wrong credential if the caller's header won.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_stores/transformation.py#L50-L66
  - what: The retrieve URL is the complete base with a literal slash and one encoded id appended after it, so a base carrying a query string gets the id after the query.
    why: The task text requires the literal append, and moving the id before the query would change the URL a working setup has always sent for such a base.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10267-L10268
  - what: Only the async create handler passes the caller's timeout to its send; the sync create and both read handlers take a timeout argument and never pass it, so they run on the selected client's own timeout whatever the caller asked for.
    why: A deployment setting a short per-call timeout relies on the read handlers ignoring it and on the client default applying; honoring it would time out calls LiteLLM lets run.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10227-L10227
  - what: The read handlers never check the response status, because the wrapped httpx get does not raise for it. A 429 reaches the create-response converter on retrieve and response.json() on list, so a read reports the body's decode failure at that status instead of the status itself.
    why: A setup reading a vector store depends on the converter's error and on list returning whatever JSON the server sent; adding a status check would replace both with a different error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10280-L10284
