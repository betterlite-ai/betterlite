task: B3642
deviations:
  - what: The constructor takes an Arc of B3640's PassthroughCompletionCost rather than B3638's CompletionCost trait, because the video and search branches price with call_type "create_video" and "vector_store_search" and hand the cost service the video object and the search response, which B3638's trait cannot carry.
    why: B3638's CompletionCost request takes only a completion-shaped response, a model, a provider and a location. The two call types and the two response objects exist only on the passthrough cost seam, and B8931 binds that seam where it builds the handler.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_passthrough_logging_handler.py#L166-L172
  - what: A decode, transform or logging failure comes back as Err from this module's own error enum, where LiteLLM lets the Python exception rise; the video, search, embed and predict cost failures do the same.
    why: Rust has no exceptions. The error climbs to the caller, which logs it and drops the dispatch, so no partial result is returned. The generateContent and rawPredict branches price through B3638's shared payload factory, whose documented zero-cost-on-failure rule B3638 owns, so those two record zero instead of returning Err.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_passthrough_logging_handler.py#L149-L187
  - what: The video branch's video object carries no _hidden_params["response_cost"], because betterlite's VideoObject declares only LiteLLM's pydantic fields and no private hidden-params map.
    why: LiteLLM stores the cost there to stop a later recalculation; model_dump excludes it, so no logged field changes. The cost is written to kwargs and model_call_details, and nothing in this path reads it back.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_passthrough_logging_handler.py#L174-L182
  - what: The search branch prices through the same completion-shaped cost seam, passing the serialized VectorStoreSearchResponse with call_type "vector_store_search", where LiteLLM passes the pydantic search object to completion_cost.
    why: The passthrough cost seam carries a JSON response; the serialized record is the same data the search object dumps, and the call type selects the vector store search price table.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_passthrough_logging_handler.py#L293-L299
  - what: The rawPredict partner reply is logged without the partner transform's _hidden_params object, where LiteLLM logs the ModelResponse object itself and model_dump() drops it.
    why: The logged reply must be the dump a callback sees, and betterlite's result is already a JSON value rather than a model that can hide a private map.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L2075-L2100
  - what: A model_call_details["litellm_params"] that is absent or null is created as an empty object in the search branch, and a non-object value there or a non-object metadata in the batch branch is an error naming the field, where Python would raise a TypeError from subscripting.
    why: docs/compatibility.md makes an absent or null config value take its default and a wrong-typed one an error that names it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_passthrough_logging_handler.py#L307-L309
  - what: The oracle helper cases cover the branch order only; the adapter patches the leaf each branch reaches and reports which one was hit.
    why: A helper adapter cannot build the logging object and proxy state that the full Python handler reads, and the branch bodies are pinned by native tests against the leaf tasks' own oracle cases.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/vertex_passthrough_logging_handler.py#L123-L133
