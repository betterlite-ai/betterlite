task: B4059
deviations:
  - what: InMemoryPromptRegistry only stores and selects prompt specs; initialize_prompt, reload_prompt, sync_prompt_from_db, remove_prompt, delete_prompts_by_base_id and every callback registration are absent.
    why: Those behaviors belong to B4060, which owns registry mutation and the logging callback manager; this task builds the selection and row-conversion layer only.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_registry.py#L185-L265
  - what: The Prisma-backed _prompt_table helper is a PromptTableActions trait whose find_many, create, update and delete_many take typed PromptRowQuery, PromptRowData, PromptRowFilter and PromptRowUpdate values instead of untyped where, order, take and distinct mappings.
    why: betterlite-prompts has no database client, and workspace rules forbid untyped query maps; the table over shared.db arrives with the routes that call it (B4061 and B4062), and the trait keeps the protocol's four operations and their argument meanings.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L90-L108
  - what: _PromptRow.model_dump and _PromptRowData.model_validate are typed records instead, where PromptRow serializes its fields and PromptRowData deserializes them, with version defaulting to 1 and environment to "development"; stored litellm_params or prompt_info text that is not valid prompt JSON surfaces as PromptRowConversionError::InvalidStoredJson instead of a JSONDecodeError or pydantic ValidationError.
    why: The pydantic round trip exists to turn an untyped row mapping into checked fields and apply defaults; typed Rust records carry the same fields and defaults without an Any-shaped intermediate, and the code that converts a row can match the failure instead of catching a bare exception.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L56-L87
  - what: get_next_version_for_prompt returns PromptVersionError::VersionOverflow instead of max_version + 1 when the increment would pass i64::MAX; LiteLLM's Python int returns the larger number.
    why: A prompt version is read from a database integer column, so no working setup holds a version at i64::MAX; betterlite refuses to wrap a value the row could not store, and every other version gets the same max + 1 as LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L141-L145
  - what: Version parsing reads ASCII decimal integers that fit in i64, so get_version_number returns 1 for a suffix such as " 2", "2_0" or another script's digits that Python's int() would read, and parse_prompt_version returns None for a JSON integer beyond i64 that Python's unbounded int would keep; a digit string in another script is also None where Python's isdigit() and int() read a number, and a superscript digit such as a squared sign makes isdigit() pass while int() raises ValueError, which escapes as an unhandled 500.
    why: A prompt version is written by the code itself as a plain ASCII decimal from a database Int, so every working setup reads the same number; betterlite does not port int()'s whitespace, underscore and Unicode-digit tolerance or its unbounded range, and it does not reproduce the 500 a superscript causes.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_registry.py#L40-L84
kept_bugs:
  - what: get_next_version_for_prompt reads the existing versions and returns max + 1 without a transaction or lock, so two concurrent calls can allocate the same version.
    why: The task preserves LiteLLM's allocation so version numbers and the unique (prompt_id, version, environment) outcome match what a working setup writes today.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L123-L145
  - what: get_latest_prompt_versions orders prompts by the version suffix in the prompt id rather than by the version field, so a spec whose id suffix disagrees with its version is grouped by the suffix.
    why: Rows converted by create_versioned_prompt_spec always carry "{base_id}.v{version}", so a working setup cannot see the difference; betterlite keeps LiteLLM's suffix ordering and its per-(base id, environment) last-wins result.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/prompts/prompt_endpoints.py#L111-L120
