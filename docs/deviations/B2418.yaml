task: B2418
deviations:
  - {what: "The outbound compact body is serialized with its keys sorted, because normalization types the request map as a BTreeMap. LiteLLM keeps the insertion order of the dict the transform builds.", why: "JSON object order carries no meaning and the oracle compares parsed bodies, so the same fields reach the provider; only a byte-for-byte comparison of the request body against LiteLLM's would differ.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L947-L949"}
  - {what: "A complete base URL that does not parse as a URL fails with the typed RequestUrl error before the pre-call runs, where LiteLLM builds the URL string, logs the pre-call, and only the send raises httpx's InvalidURL or UnsupportedProtocol for the handler's catch to turn into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L4445-L4452"}
  - {what: "An extra header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose own encoding raises inside the handler's try and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L4445-L4452"}
  - {what: "When a signer returns signed bytes and its headers carry no Content-Type, betterlite labels the body application/octet-stream. LiteLLM passes the bytes as data=, and httpx sends them with no Content-Type at all.", why: "The bytes on the wire are the same and stay opaque; betterlite's transport labels every byte body it sends rather than leaving the media type absent.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L4446-L4446"}
  - {what: "The async send runs once and reports a connection failure, where LiteLLM's AsyncHTTPHandler catches RemoteProtocolError or ConnectError, opens a new client and resends the same request once.", why: "A single send keeps the compact POST non-duplicable; a caller that wants a retry supplies its own client with one, and both sides report the failure when the resend fails too.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L836-L851"}
  - {what: "A reply body that is not UTF-8 fails with the typed response-transform error that names the decode failure, where LiteLLM reads raw_response.text with httpx's replacement decoding, so the following JSON parse raises and the handler reports OpenAIError with the replacement text and the 200 status.", why: "JSON is UTF-8 on both sides, so neither side accepts the body; naming the decode failure keeps the record truthful instead of showing replacement characters in an error message.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L961-L969"}
  - {what: "An error body or a header value that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\" on the provider-error path too, where LiteLLM reads the body through response.text and the header values as httpx strings.", why: "betterlite records both as JSON text; replacement characters hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
  - {what: "An integer status outside 0..=65535 counts as no status, so the error becomes a synthesized 500. LiteLLM keeps whatever integer the exception carries.", why: "betterlite's status is a u16 on every provider error record and no HTTP response can produce an out-of-range status; the synthesized 500 says it was not a real one.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6077-L6080"}
kept_bugs:
  - what: The compact URL is built by appending /responses to the whole base string, query included, and then swapping the parsed path for path.rstrip("/") plus /compact. A base carrying api-version=v1 therefore sends /v1/compact?api-version=v1/responses, with the suffix inside the query value.
    why: The query must survive the compact rewrite, and a setup whose base carries a query has always sent it this way; moving the suffix before the query would change the URL those setups send.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L934-L937
  - what: Caller extra_headers cannot override Authorization. Validation receives the caller's map in place, sets Content-Type by setdefault and overwrites Authorization with the provider Bearer key, and the handler's later headers.update re-applies that same map, so the caller's Authorization is gone while a caller's Content-Type survives.
    why: A setup passing its own Authorization gets the provider key on the wire, and code depending on that would send the wrong credential if the caller's header won.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L589-L601
