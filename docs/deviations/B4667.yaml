task: B4667
deviations:
  - what: "betterlite's adapter is pure v2: it maps the stored server record onto ServerSpec without importing any v1 proxy type, where LiteLLM's adapter imports v1's MCPClient helpers, UserAPIKeyAuth, MCPServer and oauth_utils. The mapping (server.url or server.server_id for the resource, the upstream_token_header default, strip_auth_scheme/to_basic_credentials, the RFC 8707 resource resolution) and the deferral-to-v1 semantics are the same."
    why: "The crate this lives in cannot depend on the v1 server crates, so the bridge takes the persisted server record and returns a typed spec; every behavior the adapter decides is still decided in the same place."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/adapter.py#L19-L48
  - what: "betterlite's UpstreamCredentialProvider is a Rust struct that takes a Collaborators bundle by value and holds each seam as an Arc<dyn Trait>; LiteLLM's provider takes six optional constructor arguments and falls back to module-level defaults. Dispatch, arm behavior, the Result-in/Result-out contract and the AuthResolution tagging are identical."
    why: "Rust has no ambient defaults here: every collaborator (token store, exchanger, token endpoint, exchanged-token cache, client-credentials source, assertion store) is wired explicitly, which keeps the resolver testable and keeps a database or HTTP handle out of the crate that owns only the decision logic."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/resolver.py#L114-L137
  - what: "The id_jag cache slot is addressed by a hash of the principal plus the caller's inbound token, and the entry beside it carries a fingerprint of every exchange input; LiteLLM builds the same slot key and the same fingerprint. Both keep invalidation computable while the assertion store is down and re-mint on any config change."
    why: "This is the task's required shape: a deterministic slot key derived from the subject, never from the credential material, with the fingerprint guarding reuse."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/resolver.py#L402-L440
  - what: "An unauthorized CredError becomes a 401 whose detail is the error's summary ('unauthorized: <detail>'); LiteLLM sends the challenge body when the error carries one and the summary otherwise. betterlite keeps the body field on Unauthorized, but no resolver arm in either codebase sets it, so the two agree for every error the resolver produces."
    why: "The body field exists for the arms other tasks add; until one fills it there is nothing to prefer over the summary, and the summary is what every current caller sees."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/adapter.py#L276-L299
  - what: "oauth_protected_resource_path takes the scalar SERVER_ROOT_PATH value as a parameter (and the challenges pass it through); LiteLLM reads os.getenv('SERVER_ROOT_PATH') inside the function. The path it builds for a scalar prefix and for a per-request prefix is identical."
    why: "betterlite reads its environment at one edge (the server config layer) and passes values down, so no routing helper depends on process-global state and every caller can be given the deployed prefix explicitly."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/adapter.py#L301-L327
  - what: "The collaborator defaults fail in a different way when nothing is wired: a missing token endpoint returns misconfigured 'token endpoint collaborator not wired' where LiteLLM constructs a live TokenEndpointClient that would POST to the endpoint; a missing client-credentials source returns misconfigured 'client_credentials collaborator not wired' where LiteLLM constructs a live ClientCredentialsTokenSource that would attempt the grant; a missing assertion store reads as no stored assertion (the 412) where LiteLLM falls back to the database-backed store. Every production caller wires the real collaborator, so only a harness that forgets one sees the difference."
    why: "The concrete collaborators own HTTP clients and database handles that this crate must not create behind a caller's back; the fail-closed null implementations make a missing wiring explicit instead of silently performing network or database I/O."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/resolver.py#L134-L137
  - what: "The assertion-store seam holds an object-safe AssertionStore trait whose blanket impl forwards to B10064's RPITIT SsoAssertionStore; LiteLLM injects the SSOAssertionStore protocol directly."
    why: "Rust cannot hold an RPITIT trait as a trait object, so the resolver's injected collaborator is the boxed-forwarding trait; the errors it yields are B10064's AssertionStoreUnavailable, so the arm's 412/503 behavior is unchanged."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/outbound_credentials/sso_assertion_store.py#L282-L290
  - what: "The id_jag exchanged-token cache's TTL, expiry buffer, TTL floor and capacity are compile-time constants carrying LiteLLM's default values (3600s, 60s, 10s, 500 entries, earliest-expiry eviction); LiteLLM reads MCP_OAUTH2_TOKEN_CACHE_DEFAULT_TTL, MCP_OAUTH2_TOKEN_EXPIRY_BUFFER_SECONDS, MCP_OAUTH2_TOKEN_CACHE_MIN_TTL and MCP_TOKEN_EXCHANGE_CACHE_MAX_SIZE from the environment at import time."
    why: "No config section owns these tuning knobs yet, and the defaults are the behavior the pinned code documents; an operator-set override changes only how often a bearer is re-minted, never what is minted."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L179-L221
