task: B1728
deviations:
  - what: Nonfinite min_spend/max_spend query values fail with HTTP 422 validation errors before SQL execution.
    why: Monetary filters use the repository's finite Decimal boundary instead of Python float NaN/infinity.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_management_endpoints.py#L2499-L2506
  - what: A finite min_spend/max_spend outside rust_decimal's range (for example 1e29 or 1e-29) fails with 422 decimal_parsing instead of reaching the spend comparison.
    why: The comparison takes an exact decimal, and a scale above 28 has no Decimal representation to bind; Python float keeps a rounded value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_management_endpoints.py#L2497-L2504
  - what: A page value above the signed 64-bit range fails with 422 int_parsing instead of being accepted as a Python arbitrary-precision int.
    why: The page is stored as an i64; LiteLLM only fails later when the offset reaches the database.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_management_endpoints.py#L2513
