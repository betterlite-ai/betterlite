    why: CostUsage counters are i64 throughout betterlite; Python's unbounded int cannot enter any billing product here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/anthropic/cost_calculation.py#L77-L99
