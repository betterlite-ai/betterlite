task: B2484
deviations:
  - {what: "A caller timeout answers with the handler's own error: status 408, message \"Vector store search exceeded the caller timeout.\", empty headers and no chained cause. LiteLLM's HTTPHandler converts the timeout into litellm.Timeout before the handler sees it, so its except httpx.TimeoutException never runs and the search goes through _handle_error, which keeps litellm.Timeout's 408 but writes its message \"litellm.Timeout: Connection timed out. Timeout passed=..., time taken=... seconds\".", why: "The task requires the handler's own 408 branch; the status and the synthesized flag match what LiteLLM answers, and the fixed message names what timed out instead of a duration that changes every run.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10087-L10091"}
  - {what: "A send failure without an HTTP status becomes a synthesized 500, with status_code_is_synthesized true. LiteLLM sets the flag on whatever get_error_class returns, but BaseVectorStoreConfig.get_error_class raises, so that line never runs and an OpenAI setup always observes false.", why: "The flag is the only signal that the 500 was made up; false would claim the provider answered 500, and no working setup can rely on LiteLLM's unreachable true.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6104-L6111"}
  - {what: "A search reply is read by betterlite's shared vector store reply decoder, so a body it cannot decode, or one over its reply byte, depth or item limits, fails as the provider's exception with the reply's own status, the reply's headers and the decoder's message \"vector store reply is not a valid record\", where LiteLLM reads the body with VectorStoreSearchResponse(**response_json) and raises Python's exception text, with no size limit. Both stay outside the send's catch.", why: "The decoder is the one already used for the store create reply, so the search cannot accept a reply the rest of the vector store path refuses; neither message is something a working setup can depend on, and the status, the headers and the fact that it is not a send failure are what callers branch on.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_stores/transformation.py#L117-L128"}
  - {what: "A complete base URL that is not a URL fails with the typed RequestUrl error after the pre-call, where LiteLLM logs the pre-call and only the send raises httpx's InvalidURL or UnsupportedProtocol for the handler's catch to turn into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10084-L10091"}
  - {what: "An extra header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose encoding raises inside the send's try and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10084-L10091"}
  - {what: "An error body or a header value that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\", where LiteLLM reads the body through response.text and the header values as httpx strings.", why: "betterlite records both as JSON text; replacement characters hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
  - {what: "The search POST always carries Content-Type application/json when the provider's validate_environment set none, where LiteLLM passes json.dumps(request_body) as httpx's data= and sends the headers validation produced. A provider such as Milvus, whose validation sets only Authorization, therefore sends a header LiteLLM never sends.", why: "betterlite's outbound client tags every JSON body, and the search body is JSON either way; a provider that reads the body as JSON accepts either, and B3960, B1425 and B1428 record the same difference for their own requests.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10078-L10086"}
kept_bugs:
  - what: Caller extra_headers cannot override Authorization or Content-Type. Validation mutates the caller's map in place (provider Bearer key, application/json), and the handler's later headers.update re-applies that same map, so the caller's values are gone.
    why: A setup passing its own Authorization gets the provider key on the wire, and code depending on that would send the wrong credential if the caller's header won.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L10018-L10023
  - what: The OpenAI search transform accepts extra_body and never merges it, so extra_body.query does not replace the caller's query and no other extra_body key reaches the request body.
    why: A caller forwarding extra_body to a search gets the declared query and optional params only; honoring it would send a body LiteLLM never sent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_stores/transformation.py#L101-L112
