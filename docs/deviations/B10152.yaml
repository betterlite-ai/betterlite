task: B10152
deviations:
  - what: >-
      A stored team row that betterlite's LiteLLMTeamTable refuses, for example a members_with_roles
      entry whose role is neither admin nor user, fails the whole call, and the call logs and returns
      (empty, 0). LiteLLM returns the raw Prisma rows here and would pass that row on.
    why: >-
      betterlite has no untyped team row, so every row goes through B724's shared decode_team_record,
      and such a row only comes from a direct database edit, since LiteLLM's own write routes store
      only admin and user roles.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/repositories/team_repository.py#L95-L102
