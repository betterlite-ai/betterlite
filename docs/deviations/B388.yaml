task: B388
deviations:
  - what: A minimum quality tier outside the i64 range saturates at i64::MAX or i64::MIN instead of keeping its arbitrary precision.
    why: betterlite returns the declared int as i64, and every eligibility comparison against the declared 1..=3 tiers keeps its result under saturation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L281-L309
  - what: A header or metadata tier is read only from JSON numbers and ASCII digit strings with an optional sign and surrounding Unicode whitespace; Python's int() also coerces booleans and accepts Unicode digits, digit separators and the C0 information separators as whitespace.
    why: docs/compatibility.md stops parity at the declared types, so a boolean or an exotic digit string counts as Python duck typing rather than a supported tier value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L296-L307
  - what: An unknown key under adaptive_router_config or model_info.adaptive_router_preferences fails the config load instead of being ignored.
    why: Rule no-silent-drops requires an error that names the key; pydantic's BaseModel ignores extras, so a misspelled weight or strength would otherwise leave the adaptive router misconfigured without a message.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L1221-L1245
  - what: model_info.adaptive_router_preferences is validated on every deployment at config load, while LiteLLM validates it only for the models an adaptive router lists in available_models.
    why: The config loader types the whole model_list in one pass, so a stale preferences block on a model no router uses fails the load instead of staying dormant until a router references it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L9412-L9425
  - what: The rules match under Rust regex's Unicode definitions, so a few characters Python's re treats differently do not match the same rule; U+0130 İ folds to i under Python's IGNORECASE, a combining mark is not a word character for Python's \b, and U+001C-U+001F count as whitespace for Python's \s.
    why: The pinned rules run on the regex crate, whose simple case folding and Unicode classes differ from Python's re at those characters; hand-porting Python's fold and class tables would replace the engine every other betterlite pattern uses.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/classifier.py#L16-L120
