task: B388
deviations:
  - what: A minimum quality tier outside the i64 range saturates at i64::MAX or i64::MIN instead of keeping its arbitrary precision.
    why: betterlite returns the declared int as i64, and every eligibility comparison against the declared 1..=3 tiers keeps its result under saturation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L281-L309
  - what: A header or metadata tier is read only from JSON numbers and ASCII digit strings with an optional sign; Python's int() also coerces booleans and accepts Unicode digits and digit separators.
    why: docs/compatibility.md stops parity at the declared types, so a boolean or an exotic digit string counts as Python duck typing rather than a supported tier value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/adaptive_router/adaptive_router.py#L296-L307
