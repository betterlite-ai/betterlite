task: B016
deviations:
  - what: The healthy-deployments view returns a catalog resolution failure to its caller.
    why: LiteLLM's legacy _async_get_healthy_deployments swallows that failure and answers an empty list; the typed service keeps the error, and no selection path reads that list.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L8611-L8618
  - what: A weight, rpm or tpm that is negative or above u32::MAX is rejected as RoutingError::Metric naming the field.
    why: LiteLLM's _metric_weight reads any Python int as a float and routes with it, while betterlite's Candidate weights are u32; no working setup relies on a negative or oversized weight.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/simple_shuffle.py#L17-L24
