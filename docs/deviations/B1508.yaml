task: B1508
deviations:
  - what: Auth files above 1 MiB warn and behave as unreadable; JWT hints above 16 KiB yield no claims.
    why: Local credentials are outside bytes and decoding must have finite allocation limits.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/chatgpt/authenticator.py#L96-L140
  - what: Invalid-record and write-failure logs omit exception text.
    why: Parser exception text can include credential material; fixed messages preserve diagnostics without exposing secrets.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/chatgpt/authenticator.py#L103-L112
  - what: Nonfinite cooldown markers and timestamps outside the checked decimal clock range yield zero remaining cooldown.
    why: These cannot represent a real wall-clock device-code request and can otherwise cause an unrepresentable or infinite wait.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/chatgpt/authenticator.py#L356-L369
  - what: Expiry values outside both Decimal and finite f64 ranges are treated as expired.
    why: An uncomparable timestamp cannot safely establish that a cached credential is still valid.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/chatgpt/authenticator.py#L113-L116
