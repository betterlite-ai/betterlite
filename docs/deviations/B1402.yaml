task: B1402
deviations:
  - {what: "Reported cost ticks are divided by 10,000,000,000 in exact decimal, not in binary floating point, so a tick count beyond 17 digits keeps every digit.", why: "Money is never a float in betterlite, and the exact quotient is the amount xAI reported.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/common_utils.py#L14-L20"}
  - {what: "A tick count above the decimal range gives no reported cost, where LiteLLM returns a very large float.", why: "The amount cannot be held as a decimal, so it is treated as not reported and the token price applies.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/common_utils.py#L14-L20"}
  - {what: "A reported usage.cost is read as a decimal from its JSON lexeme, not as a float, so 0.1 stays exactly 0.1.", why: "The same rule as for ticks, and the decimal parser is the single one in betterlite_models.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/cost_calculator.py#L41-L49"}
  - {what: "Model discovery reads at most 4 MiB of the response and checks the status before it parses JSON.", why: "An xAI endpoint or a proxy in front of it must not make the gateway buffer an unbounded body.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/common_utils.py#L88-L100"}
  - {what: "A model list whose data is an empty object or an empty string is a decode error, where Python iterates it as empty and returns no models.", why: "The response type is a list of objects with an id, and a value of another type is an error that names the field.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/common_utils.py#L100-L106"}
  - {what: "A web_search_calls count above the i64 range, or numeric text with underscores or non-ASCII digits, is treated as not convertible, so no request count is set.", why: "Counts are i64 throughout betterlite, and the text form follows the plain integer grammar.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/cost_calculator.py#L30-L37"}
  - {what: "A model-list error body that is not valid UTF-8 is reported as a byte count, where LiteLLM shows the text decoded with replacement characters.", why: "betterlite refuses to mangle bytes that are not UTF-8, and the status code in the message is the same.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/common_utils.py#L93-L98"}
  - {what: "A token-count addition that overflows i64 is an error, where Python integers grow without bound.", why: "Token counts are i64 throughout betterlite, so the sum is checked rather than wrapped.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/chat/transformation.py#L357-L368"}
