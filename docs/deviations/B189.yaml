task: B189
deviations:
  - what: A configured callback name that no compiled adapter serves fails startup, while LiteLLM accepts the names it knows and silently ignores the rest.
    why: Betterlite has no exporter compiled in until M5, so the installed set is empty and every configured name is unavailable. Rule no-silent-drops forbids attaching a name that would never run, so the config loader names the key instead of dropping the entry the way LiteLLM drops an unknown name.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/callback_utils.py#L177-L181
  - what: A callback_settings value that is an object or a list is skipped by the callback settings section unless another section owns it, as otel_settings owns callback_settings.otel.
    why: Betterlite types a callback entry by its scalar integration variables, which the B246 validators consume; the nested per-adapter shapes belong to the adapter that reads them, and none is compiled in yet.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L6283-L6285
