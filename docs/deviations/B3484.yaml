task: B3484
deviations:
  - what: A content whose role is neither user nor model is silently dropped, producing no message and no log line.
    why: LiteLLM's role loop only transforms the user and model roles and has no branch that reports another role, so a working setup never sees it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/transformation.py#L485-L584
  - what: An invalid JSON schema in the response format (not an object, a type other than object, or a schema past betterlite's limits) drops response_format with no log line.
    why: LiteLLM's _validated returns None on a validation error and _translate_response_format returns None without logging; betterlite also reports a schema past SchemaLimits as GenAiInputError::Schema instead of forwarding it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/transformation.py#L118-L136
  - what: topK in generationConfig is read and never forwarded to the completion request.
    why: OpenAI chat completions has no topK parameter, and LiteLLM's config mapping has an empty branch for it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/transformation.py#L360-L362
  - what: An unknown functionCallingConfig mode maps to the auto tool choice instead of failing.
    why: LiteLLM looks the mode up in a three-entry map and falls back to auto for a mode it does not know.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/transformation.py#L458-L469
  - what: The adapter is a free function, translate_generate_content, rather than a GoogleGenAIAdapter instance with a translate_generate_content_to_completion method.
    why: LiteLLM's class holds no state and its constructor is empty, so the Rust module passes every input explicitly instead of porting an object that only names functions.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/transformation.py#L290-L305
  - what: litellm_params are returned typed beside the ChatRequest in the translation result instead of being merged into the completion request dict.
    why: A JSON dict would carry api_key as a plain string, so betterlite keeps it a SecretString and lets the caller hand the typed params to the completion pipeline.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/adapters/transformation.py#L399-L419
  - what: Only api_base, api_key, api_version, custom_llm_provider and max_retries of GenericLiteLLMParams are modeled and forwarded.
    why: The generic params record over a hundred fields; the credential and retry fields are the ones a completion call needs, and the rest are router or logging state betterlite keeps outside the request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router.py#L381-L426
  - what: The response_format support check asks B175's supported_parameters with the OpenAI list and does not resolve the model through get_llm_provider or the model family; o-series models without response schema support (o3-deep-research, o4-mini-deep-research) keep response_format.
    why: The 300 line source limit for this task leaves no room for the resolver context and the catalog capability lookup; every non-OpenAI provider keeps the field, which matches the providers whose lists include response_format.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_supported_openai_params.py#L120-L129
