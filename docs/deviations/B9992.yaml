task: B9992
deviations:
  - what: >-
      An additional_drop_params entry that names a nested path (a dot or a bracket, like metadata.trace_id) answers
      OperationError::Parameters with ParameterError::NestedDropPath and drops nothing. The chat route maps only
      ParameterError::Unsupported and ParameterError::Encode to a 400, so this refusal reaches the client as HTTP 500
      internal_server_error with type internal_server_error and param null. LiteLLM maps the parameters and then
      deletes each dotted path from the mapped parameters with delete_nested_value, answering 200.
    why: >-
      The shared parameter mapping (map_listed_parameters, B9989) refuses a nested drop path until the path engine
      lands in B213, and the config loader already refuses a model_list entry's dotted path the same way. Answering an
      error is better than sending a value the caller asked to drop. Routing the refusal to a 400 needs the
      Parameters arm in crates/betterlite-server/src/server/chat_setup/provider_call.rs, which is outside this task's
      scope.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L5037-L5042
