task: B9992
deviations:
  - what: >-
      An additional_drop_params entry that names a nested path (a dot or a bracket, like metadata.trace_id) answers
      OperationError::Parameters with ParameterError::NestedDropPath, a 400, and drops nothing. LiteLLM keeps the
      entry out of the check and deletes the nested key from optional_params after mapping, then sends the call.
    why: >-
      The shared parameter mapping (map_listed_parameters, B9989) refuses a nested drop path until the path engine
      lands in B213, and the config loader already refuses a model_list entry's dotted path the same way. Answering an
      error is better than sending a value the caller asked to drop.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L5037-L5042
kept_bugs: []
