task: B3333
deviations:
  - what: 'The generation and content handlers take a core-local VideoHttpConfig trait instead of LiteLLM''s BaseVideoConfig.'
    why: 'betterlite-provider depends on betterlite-core, so core cannot name the provider trait without a dependency cycle. The mirror carries the members both handlers call with the same signatures; a provider adapter implements it over BaseVideoConfig. The vector store write transport uses the same seam.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/videos/transformation.py#L55-L174'
  - what: 'An exception raised by the content response transform is turned into a provider error through error_facts and get_error_class, and the base error_facts reads the message from Display with no status and no headers.'
    why: 'Rust cannot read the ad-hoc attributes Python reads off an exception (status_code, text, headers, response). A provider adapter overrides error_facts to return the facts its own exception carries; without an override the error reads as a plain exception, which is what _handle_error synthesizes a 500 for. LiteLLM''s str(e) text is not ported, as docs/compatibility.md says.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6052-L6111'
  - what: 'Error text for a failure the transport raises itself (an unparsable URL, a header name or value the wire refuses, a body that is not UTF-8, a form value httpx would reject, a plain transport error) is betterlite''s own wording instead of the httpx exception text.'
    why: 'The httpx exception types and their messages do not exist in betterlite. The status, the synthesized flag and the headers a caller branches on are unchanged; only the message text differs.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6074-L6082'
  - what: 'The sync timeout message renders a whole-second call timeout as "600" where Python f-strings the float and writes "600.0"; a fractional one reads the same ("1.5").'
    why: 'The call hands the transport a Duration, and the message names its seconds. A provider sees the same 408 and the same sentence apart from the trailing .0.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1516-L1520'
  - what: 'An async content POST has no per-send timeout, so its timeout message reads "Timeout passed=None"; LiteLLM''s async post first replaces a none timeout with the client''s Timeout object and prints that object''s repr.'
    why: 'content never passes a timeout, and betterlite has no httpx.Timeout object to print. Porting the repr would mean inventing Python formatting for a value the call does not set.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866'
  - what: 'A content GET sends the URL the transform returned once; LiteLLM''s HTTPHandler.get parses the URL''s own query string and merges it back into the params it sends, so a URL with a query carries every query parameter twice.'
    why: 'Duplicating query parameters breaks a signed URL, since the signature covers one copy of each parameter. The GET''s other behavior (no status check, no timeout translation) is kept and listed under kept_bugs.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1435-L1452'
  - what: 'The multipart boundary is a SHA-256 of the parts; httpx draws a random uuid4 hex.'
    why: 'Both are 64 hex characters and neither appears in the parts. A content-derived boundary cannot occur inside the body, while a random one can only be checked by rescanning.'
    link: ''
  - what: 'The form-field nesting cap is fixed at 100. LiteLLM reads DEFAULT_MAX_RECURSE_DEPTH from the environment.'
    why: 'Environment-driven limits are settings in betterlite, and this cap belongs to the multipart encoder rather than the video transport. The default value and the exact error message match.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_request_utils.py#L16-L39'
  - what: 'A failing POST status reaches get_error_class with the raw response text; LiteLLM first runs the text and the URL through mask_sensitive_info when it raises MaskedHTTPStatusError.'
    why: 'Masking is owned by the error mapping and redaction layers (B2402 for provider HTTP errors, B249 to B252 for logged data), not by the transport. Header filtering matches LiteLLM: content-encoding and content-length are dropped because the body is already decoded.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L553-L600'
kept_bugs:
  - what: 'A content GET that answers 404 or 500 raises nothing: the response goes to the content transform, which the base class returns unchanged, so the error body comes back as the video bytes.'
    why: 'The content reference owns the GET branch and the response transform inside the same try, and a working LiteLLM setup relies on the transform seeing every response rather than on httpx raising.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L7444-L7469'
  - what: 'A content call accepts a timeout and never passes it to the POST or the GET, so the send runs on the client''s own timeout.'
    why: 'The content handler and the call layer both carry the argument and neither transport call uses it. A working setup relies on the long client default for a download that can take minutes.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L7445-L7458'
  - what: 'A sync content POST timeout message says "Connection timed out after None seconds." because the post''s timeout argument is none and the f-string prints it.'
    why: 'The content transport never passes a timeout, so the sync post names the missing one. A caller only matches on 408, but the text is copied so both proxies read alike.'
    link: 'https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1516-L1520'
