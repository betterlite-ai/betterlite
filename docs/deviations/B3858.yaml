task: B3858
deviations:
  - {what: "A guardrail span whose parent arrives only as a traceparent header is emitted as a root span; LiteLLM re-parents it under the remote span context the header names.", why: "Only a span this process owns and still holds can parent a child here, and a header carries no local span.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L3006-L3009"}
  - {what: "The guardrail dedupe marker is keyed by the request id (litellm_call_id, litellm_trace_id, or the spend log ids); LiteLLM keys it on the identity of the metadata dict and the handler instance.", why: "The marker travels as a typed request-scoped record instead of a hidden _otel_internal dict inside litellm_params.metadata.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L1267-L1307"}
  - {what: "A datetime string in litellm_received_at is read as UTC; LiteLLM's datetime.strptime builds a naive datetime that .timestamp() reads in the host's timezone.", why: "betterlite timestamps are instants and the process reads no host timezone.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L1712-L1729"}
  - {what: "The datetime format accepts any number of fractional digits; Python's %f accepts one to six, so seven or more digits parse here and leave the attribute unset in LiteLLM.", why: "chrono's %.f is the closest single format to Python's two, and a fractional part is not a declared field of the request metadata.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L1724-L1727"}
  - {what: "exception.type and the exception.stacktrace fallback carry the bare class name; the OTel SDK that LiteLLM calls prefixes a class defined outside builtins with its module.", why: "ExceptionFacts carries the class name LiteLLM's get_error_information reads, not the Python module path; B3854 owns _record_exception_on_span.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/opentelemetry.py#L2227-L2228"}
