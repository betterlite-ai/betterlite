task: B5961
deviations:
  - what: >-
      The stream-shape loader, its cached warning and the 500 "SageMaker event-stream shape could not be loaded from botocore" error are not built. The decoder always reads the frame payload itself, because the loaded shape never carries a chunk key.
    why: >-
      The shape cannot change the text the decoder reads, and betterlite needs no botocore data file, so the 500 can never occur.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sagemaker/common_utils.py#L15-L40
  - what: >-
      A Hugging Face request whose inputs hold token ids, such as [1, 2] or [[1, 2]], counts no tokens for those entries, while LiteLLM raises AttributeError from its usage loop and answers a 500.
    why: >-
      AllEmbeddingInputValues declares token arrays, and a working embeddings call with one would fail instead of reporting usage, so betterlite counts the string entries and leaves token entries at zero.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sagemaker/embedding/transformation.py#L132-L142
  - what: >-
      A messages-API stream chunk that carries a field betterlite's shared Chunk type does not declare fails with a JSON error, while LiteLLM builds its chunk from the raw event and keeps the undeclared field.
    why: >-
      betterlite's Chunk derives deny_unknown_fields for every provider projection. It lives in betterlite-openai, outside this task, so the SageMaker projection cannot widen it. A chunk of the declared shape projects unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sagemaker/common_utils.py#L62-L65
kept_bugs:
  - what: >-
      Both SageMaker embedding configs answer validate_environment with only Content-Type: application/json, dropping every caller header.
    why: >-
      LiteLLM returns a fresh dict instead of merging the caller's headers. A working setup can rely on caller headers never reaching the SageMaker endpoint, so betterlite keeps the quirk. The Cohere method does the same at https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sagemaker/embedding/cohere_transformation.py#L122-L135.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sagemaker/embedding/transformation.py#L146-L159
  - what: >-
      Every blank line in an event payload is removed before the JSON buffer sees it, including a blank line inside a string value.
    why: >-
      LiteLLM strips line framing with a global replace. A client reading the same response stream sees the same text, so changing the rule would alter streamed content.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sagemaker/common_utils.py#L103-L106
  - what: >-
      A Hugging Face request that sends inputs as a bare string reports its non-space character count as usage, not its word count.
    why: >-
      LiteLLM iterates the string itself in its word-count loop. A caller that sends a bare string would see a different usage number if betterlite counted words, so the quirk is kept.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/sagemaker/embedding/transformation.py#L132-L142
