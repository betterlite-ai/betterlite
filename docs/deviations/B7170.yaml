task: B7170
deviations:
  - what: "The ports call the native operations and the shared HTTP clients directly, not the Python SDK functions with their decorator, logging and retry wrappers."
    why: "Those wrappers belong to the route layer (B012, B3465). A port forwards only the fields the ingest pipeline owns, and every error text stays the native operation's Display."
    link: ""
  - what: "The OpenAI store port sends the request's api_key and api_base as given; it does not fall back to litellm.api_key, litellm.openai_key, OPENAI_API_KEY, litellm.api_base, OPENAI_BASE_URL or OPENAI_API_BASE."
    why: "B3460 resolves the credentials from the ingest options and the model config, so a fallback in the port would send a key or a base URL the caller did not choose. The task states the rule."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_stores/transformation.py#L50-L89"
  - what: "The OpenAI vector-file port likewise sends the request's api_key and api_base as given, with no environment fallback."
    why: "Same as the store port: the caller owns the credentials, and the native vector-file config is built with no environment key and no litellm api_base."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L63-L93"
  - what: "The OpenAI file upload sends the request's api_key and api_base as given; it does not fall back to litellm.api_key, litellm.openai_key, OPENAI_API_KEY, litellm.api_base, OPENAI_BASE_URL or OPENAI_API_BASE."
    why: "The SDK client is built from the request's two fields only, so the client-not-initialized error names the missing key instead of a key from the server's environment."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/common_utils.py#L358-L377"
  - what: "The Gemini upload finalize request carries Content-Type: application/octet-stream; LiteLLM's httpx call sends no Content-Type on that PUT."
    why: "The shared request builder always carries a type for a raw byte body, and the port must send through it. application/octet-stream is the type LiteLLM itself gives the same bytes at upload initiation."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/rag/ingestion/gemini_ingestion.py#L299-L315"
  - what: "A Gemini or Vertex reply body over the shared client's 16 MiB cap is a transport error; httpx buffers the whole body."
    why: "The RAG ports send through the shared ProxiedClient the task requires, and its buffered read is bounded so one oversized answer cannot exhaust memory."
    link: ""
kept_bugs:
  - what: "An OpenAI store or vector-file request with no api_key sends Authorization: Bearer None, and the API's 401 is the answer."
    why: "LiteLLM formats whatever key resolved, so a setup with no key sends the same header and fails at the same place; rewriting it would hide which credential is missing."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_stores/transformation.py#L50-L61"
