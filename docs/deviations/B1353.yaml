task: B1353
deviations:
  - what: A Lyria response larger than 16777216 bytes fails the call with a decode error before it is parsed, where LiteLLM calls response.json() on whatever body arrives.
    why: The bounded-inputs rule requires finite memory for provider bytes, and the pooled client already caps a buffered reply at the same size, so the decoder states the limit itself and the fuzz target reaches it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/text_to_speech/transformation.py#L641-L676
  - what: A Lyria call mints its access token and project once and reuses them for the URL and the request headers, where LiteLLM mints inside get_complete_url when no project is configured and mints again inside transform_text_to_speech_request.
    why: The second lookup would return the same cached token and project, so one mint removes a duplicate credential-cache round trip without changing the request; a test pins that the minted token and project reach both the URL and the headers.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/text_to_speech/transformation.py#L547-L620
  - what: A Lyria decode of a model the catalog does not declare reports the unknown model before the body is parsed, where LiteLLM parses the response with response.json() first and so reports the parse error for a body that is not JSON.
    why: The typed deserializer needs the model's catalog entry to know which dialect owns the envelope before it can read it, and the two errors differ only for an unknown model paired with a broken body, which no working setup sends.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/text_to_speech/transformation.py#L641-L676
