task: B304
deviations:
  - what: One pending delta queue holds at most twice MAX_PENDING_DELTAS (2048 operations). An observation that finds at least 1024 queued operations requests a flush after staging the callback; one atomic scheduled flag admits at most one waiting flush task. That task acquires the gate within a one second deadline and clears the flag before taking its snapshot, so a later saturated callback schedules a successor even while the gate remains held. Flushes push batches until fewer than 1024 operations remain. A full queue drops the new store observation with a warning; a gate timeout drops pending operations, and a failed or expired push discards its detached batch without replay. Local callback results remain available. Without a running runtime the bounded queue waits for the next owner sync. LiteLLM uses an unbounded list.
    why: An unbounded queue in a long-running proxy grows without bound while the store is unreachable, and the deadline keeps one caller from waiting on the store indefinitely. The callback is a synchronous trait method, so the flush it starts must be a task the caller never waits on, leaving the caller's own deadline untouched while shutdown can await the task and cancelling it cancels the flush. The bound adds no retry of its own; a batch the store fails is discarded exactly as LiteLLM discards it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L78-L119
  - what: The sync merge applies the store's post-push growth to the in-memory value in one atomic increment. LiteLLM re-reads the in-memory value, computes redis plus the difference from the pre-push value, and writes that total back, so an increment that lands between the read and the write is overwritten.
    why: The local counter store is shared with the synchronous failure callback, which can run on another thread while a sync reconciles. The atomic update applies to the value at write time and keeps that increment, while the arithmetic matches LiteLLM's whenever nothing interleaves.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L226-L242
  - what: The set of keys a sync reads back from the store is capped at 1024. Once it is full, a new key is not tracked and its in-memory value is not refreshed from the store. LiteLLM's in_memory_keys_to_update has no cap in the code; its comment says 1000 and every window key is added.
    why: A window key is unique per minute, so the set grows for the life of the process. A key that misses the set keeps working through the local value and the batched delta; only the read-back merge skips it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L168-L169
  - what: "retire() is async: it stops the periodic task, waits at most one second for an in-flight flush, then awaits the push of the queued deltas before it returns. LiteLLM's retire() cancels the task, schedules the push with loop.create_task and returns at once, so the push runs later on the event loop."
    why: Rust has no task that outlives the runtime that owns it, so a fire-and-forget push could be dropped when the router shuts down. The pushed values are the same; only the moment the caller sees retire return differs, and the oracle case's await of a loop turn sees the value on both sides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L47-L55
  - what: A DEFAULT_REDIS_SYNC_INTERVAL below zero is a config load error that names the variable. LiteLLM reads the value with int() and accepts a negative number, and asyncio.sleep with a negative delay returns at once, so its sync runs back to back.
    why: The interval is a Duration in betterlite, which cannot be negative. The shared env parser rejects a value the field's type cannot hold and names the variable, so a typo like -1 stops the load instead of turning the timer into a spin.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L92
  - what: A counted-token value outside the signed 64-bit range is read as absent by get_counted_usage_tokens. Python's int is unbounded and returns it.
    why: The value is a token count that betterlite carries as i64 everywhere else; supporting arbitrary-precision integers would add a bignum dependency for a number far beyond any request's token count.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/router_callbacks/track_deployment_metrics.py#L32-L42
  - what: A pipeline of usage counter increments, the token counters the success callback writes, updates memory at once and reaches the store on the owner's next sync, or on the flush a full queue schedules; the sync then merges the store's total for those keys back into memory, as it does for window keys. LiteLLM's cache.async_increment_cache_pipeline writes both caches immediately and then copies each store reply back into memory at once.
    why: The sink B397 calls is synchronous and cannot await the store, so the increment rides the owner's own queue rather than opening a second write path; that keeps it inside the same batch, bound and merge. Tracking the usage keys is what lets the read-back merge pick up another instance's total, so the memory value still converges on the store value; only the moment it does differs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L8194-L8200
  - what: Without a redis store an increment queues no delta; LiteLLM appends every increment to redis_increment_operation_queue even when dual_cache.redis_cache is None, and nothing drains that list in that state.
    why: The queue only feeds the store push, so with no store it is an unbounded leak. Betterlite still tracks the key, which is what the local-only path reads, and leaves the queue empty.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L92-L99
  - what: A Spend value with a fractional part under a deployment outcome key is read as absent, so the successes and failures getters return 0. LiteLLM's getters return whatever the local cache holds for that key, including a float, though both are declared to return int.
    why: The getters return an i64 in betterlite, and a fractional spend has no whole count to return. LiteLLM's own increments write 1, so no setup that uses the getters relies on a fractional value; reading it as absent matches the getter's declared type instead of inventing a truncated count.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/router_callbacks/track_deployment_metrics.py#L78-L94
kept_bugs:
  - what: A flush whose pipeline raises discards the whole queued batch, so those increments never reach the store. Betterlite logs a warning and discards the batch the same way instead of replaying it.
    why: Replaying after a partial pipeline failure can double-count an increment, and LiteLLM's discard is what a working multi-instance setup has always had; the oracle case failed-flush-warns-and-discards pins it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L164-L166
  - what: A sync with an empty queue returns before it reads store values back into memory, so the read-back merge only runs on a tick that pushed at least one delta. Betterlite's sync returns false there as well.
    why: The early return sits in the function LiteLLM runs every interval and this task could not show a setup that depends on it either way, so it is copied with the oracle case failed-flush-warns-and-discards covering the empty-queue tick.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/base_routing_strategy.py#L221-L223
