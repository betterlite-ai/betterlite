task: B2482
deviations:
  - {what: "A transport failure becomes a synthesized 500 whose message is betterlite's transport error text. LiteLLM quotes str(httpx exception) for the same failure.", why: "Both report a made-up 500 with no provider status; betterlite has no httpx exception to quote, and its transport error names the failure it saw. No setup can depend on the wording of a connection failure.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6077-L6085"}
  - {what: "A failure with no integer status marks status_code_is_synthesized true on the provider path too. LiteLLM sets the flag on whatever get_error_class returns, but the file config's get_error_class raises, so an OpenAI setup always observes false.", why: "The flag is the only signal that the 500 was made up; false would claim the provider answered 500, and no working setup can rely on LiteLLM's unreachable true.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6099-L6106"}
  - {what: "An error body or a header value that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\", where LiteLLM reads the body through response.text and the header values as httpx strings.", why: "betterlite records both as JSON text; replacement characters hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6077-L6085"}
  - {what: "A reply the response transform cannot parse raises the transform's error class with the JSON parser's own text, so the message is serde_json's wording where LiteLLM carries json.JSONDecodeError's.", why: "The status and the reply's headers are the same on both sides, and the parser's sentence is the cause itself; rephrasing it would lose what went wrong.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L222-L233"}
  - {what: "Timeout messages render the timeout and the elapsed time from Duration values: a timeout with no fraction prints as whole seconds, an absent one prints None, and the async time taken prints seconds plus zero-padded milliseconds. LiteLLM interpolates Python floats, so 7.0 prints 7.0 and a hundred milliseconds prints 0.1.", why: "The message still reports the timeout the caller passed and the time the failed request took, the same numbers LiteLLM shows; only the float rendering differs, since betterlite keeps durations typed.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866"}
  - {what: "A timeout during the async delete becomes a synthesized 500 whose message is betterlite's transport text. LiteLLM's async delete has no TimeoutException branch, so the raw httpx timeout reaches _handle_error with no status and becomes a synthesized 500 quoting the exception.", why: "Both answer a made-up 500 rather than the 408 the other three handlers produce, which is the observable difference from their catches; the message names the read timeout betterlite hit.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1044-L1062"}
  - {what: "A complete base URL that does not parse as a URL fails with the typed RequestUrl error after the pre-call and before any request, where LiteLLM logs the pre-call and the send turns httpx's InvalidURL into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11348-L11361"}
  - {what: "An extra header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose own encoding raises inside the handler's try and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L11348-L11361"}
kept_bugs:
  - what: Caller extra_headers cannot override Authorization or Content-Type. Validation mutates the caller's map in place (provider Bearer key, application/json), and the handler's later headers.update re-applies that same map, so the caller's values are gone.
    why: A setup passing its own Authorization gets the provider key on the wire, and code depending on that would send the wrong credential if the caller's header won.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L69-L79
  - what: The vector store id and the file id are appended as literal slashes plus one encoded segment after the whole base URL string, so a base carrying a query string gets the collection path and the file id after the query.
    why: A setup whose base carries a query string has always sent those requests with this URL shape, and moving the segments before the query would change the request it relies on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/vector_store_files/transformation.py#L81-L100
