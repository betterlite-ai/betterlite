task: B1672
deviations:
  - what: Generic billing reports exact Decimal totals and a typed failure for nonfinite rates or arithmetic overflow.
    why: Float approximation cannot be the stored source of spend, while ordinary malformed uplift values still warn and use one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L1480-L1492
  - what: A resolved model info whose tiered_pricing or off_peak_pricing key is present but was not also supplied as a decoded tier table or off-peak block is a typed failure, instead of silently billing the plain rate.
    why: Python threads one model_info dict through generic_cost_per_token and reads both keys from it directly; the ported ModelInfo map stores each field as a Scalar, whose Array and Object variants discard their nested content on arrival (crates/betterlite-models/src/tiered_pricing.rs), so there is no way left to recover a tier table or off-peak block from the map once it has been resolved from either a supplied record or the catalog. Dropping the data and billing the plain rate would be a silent, wrong total; both PriceLookup (B1678) and Scalar (B1666) are outside this task's scope.paths, so this task cannot thread the decoded value through from either source and instead refuses to guess.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_cost_calc/utils.py#L99-L102
