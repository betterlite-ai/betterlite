task: B1080
deviations:
  - what: The failure callbacks receive an empty traceback string in FailureCall.traceback.
    why: A Rust error carries no Python traceback, and the callback receives the error class itself, so callers that log the exception still see it; the formatted stack text that LiteLLM passes has no Rust counterpart.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/files/streaming.py#L215-L231
  - what: A routed request whose credentials lack a text custom_llm_provider, or whose payload lacks a text file_id, gets a typed StreamingParamsError that names the field.
    why: LiteLLM subscripts both keys and only casts their values, so a malformed request raises KeyError or carries a non-string value onward and surfaces as a 500; betterlite reports the bad field instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/openai_files_endpoints/file_content_streaming_handler.py#L49-L51
