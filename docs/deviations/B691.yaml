task: B691
deviations:
  - what: A default Invoke client is never constructed here, so ssl_verify copied from logging_obj.litellm_params cannot affect TLS; the call runs on the supplied handler or on the pooled transport, whose configuration owns verification.
    why: B173 owns connection setup and certificate policy for every provider call, and a supplied handler bypasses that policy exactly where a supplied client bypasses LiteLLM's constructor.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_handler.py#L185-L207
  - what: stream_chunk_size is not threaded into the decode; betterlite decodes whatever read boundaries the transport delivers.
    why: The chunk size only groups transport reads, and a decoded Bedrock event stream does not depend on where those reads split it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/converse_handler.py#L26-L85
  - what: A buffered (fake-stream) reply larger than the transport's body limit fails instead of being read whole, as Invoke's catch-all 500 or as the read error the Converse sync call passes through.
    why: B173 bounds every buffered body, and a provider reply that large is outside anything a working setup returns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_handler.py#L226-L243
  - what: A framed status failure whose response was never read carries the reason phrase and no body text, where LiteLLM's error_response_text returns the body text for a supplied client that had already read the response.
    why: Neither the pooled transport nor the oracle's fixture handler reads a streamed response before the status branch, which is the state every shipped httpx streaming client is in; B682 records the unread body by its reason phrase for exactly that case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/common_utils.py#L59-L63
  - what: A buffered reply body that is not UTF-8 is named by its byte count in the status message, where LiteLLM's response.text decodes it with replacement characters.
    why: The byte count names the actual fault without inventing text the provider did not send, the same choice B607 records for the buffered converter.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/common_utils.py#L59-L63
  - what: The Invoke catch-all 500 message is betterlite's own wording for the failed operation, where LiteLLM carries str(exception) of the Python KeyError or TypeError the converter raised.
    why: Python's exception text does not exist outside Python; the status and the fact that the conversion failed are the comparable facts, and docs/compatibility.md makes a value of the wrong type an error naming the field.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_handler.py#L252-L271
  - what: The post-call record carries no api_key, where LiteLLM passes api_key="" (and the buffered converter passes its own api_key argument) to logging_obj.post_call.
    why: B249's shared PostCall record has no api_key field, the same omission B607 records for the buffered converter, and nothing that reads the record consumes the key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/converse_transformation.py#L2541-L2548
  - what: A Converse transport failure surfaces as the native transport error type, where LiteLLM lets the raw httpx exception escape the handler.
    why: The sync Converse call has no catch, so the failure crosses the same boundary; betterlite names it with its own error type instead of an httpx exception class.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/converse_handler.py#L26-L85
kept_bugs:
  - what: An unknown fake-stream finish reason maps to "stop" instead of failing or staying empty.
    why: The fake path shares the provider decoder's mapping, and a working setup relies on the mapped reason rather than on the warning.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/core_helpers.py#L253-L258
  - what: Every opening, conversion or logging failure in the two Invoke helpers becomes a 500 BedrockError carrying the exception text, erasing the original exception type.
    why: Callers of a working LiteLLM setup handle that BedrockError and match on its status; surfacing the original exception instead would change what they see.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/chat/invoke_handler.py#L252-L271
