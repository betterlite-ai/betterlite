task: B6414
deviations:
  - what: A transcript with no turn id in PUSH_TO_TALK mode gets an item_<32 hex> turn id from the platform random source, and nothing pins the value.
    why: LiteLLM builds the id from uuid4, which no test can fix; the Rust test checks the item_ prefix and the 32 lowercase hex characters, and the oracle folds event and item ids before comparing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/meta/realtime/transformation.py#L426-L435
  - what: An api_base that spells out the default port of its scheme loses the port, so wss://example.com:443/x becomes wss://example.com/v1/asr/realtime here and wss://example.com:443/v1/asr/realtime in LiteLLM.
    why: betterlite parses the base with the url crate, which validates it and writes it back with the default port removed, while LiteLLM copies urllib.parse's netloc into the rebuilt URL and keeps the port text; both name the same endpoint.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/meta/realtime/transformation.py#L198-L208
  - what: An IPv6 api_base keeps its brackets, so wss://[::1]:9443/x becomes wss://[::1]:9443/v1/asr/realtime here and the unusable wss://::1:9443/v1/asr/realtime in LiteLLM.
    why: urllib.parse reports the IPv6 hostname without brackets, so LiteLLM's host:port join drops them and the rebuilt URL no longer parses, while the url crate hands back the bracketed host and the endpoint stays valid; no working setup can depend on the broken form.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/meta/realtime/transformation.py#L198-L208
  - what: A non-ASCII api_base host is punycoded, so wss://bücher.example/x becomes wss://xn--bcher-kva.example/v1/asr/realtime here and wss://bücher.example/v1/asr/realtime in LiteLLM.
    why: the url crate applies IDNA to the host while urllib.parse hands back the host text unchanged; both spellings name the same host and connect the same way, so the difference is only in how the endpoint reads.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/meta/realtime/transformation.py#L198-L208
