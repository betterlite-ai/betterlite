task: B4330
deviations:
  - {what: "A pipelined increment with an explicit TTL always pipelines EXPIRE and refreshes the key's TTL, while the standalone fallback used for Cluster caches and NOSCRIPT retries goes through B360's async_increment with refresh_ttl=false, which only gives a TTL to a key that has none. The two paths of one batch therefore differ in TTL behavior.", why: "The batch engine reuses the existing standalone increment contract instead of reimplementing it; the difference is preserved until a unified TTL contract exists across the routing and general-cache surfaces.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/redis_batch.py#L176-L184"}
  - {what: "The service success and failure events a pipeline flush emits carry the batch name as call_type, such as `redis_batch`, where LiteLLM reports `redis_batch[<operation count>]`.", why: "betterlite's ServiceEvent.call_type is `&'static str` and crates/betterlite-redis/src/redis_client_reuse/service_event.rs is outside this task's scope, so the operation count cannot be appended; it appears in the warning line instead.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/redis_batch.py#L370-L404"}
