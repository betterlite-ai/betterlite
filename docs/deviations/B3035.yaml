task: B3035
deviations:
  - what: In-flight slot count is stored as an integer in the local cache when Redis is authoritative (integer mirror), not as a full dict of slot id to timestamp.
    why: During Redis recovery, the integer mirror carries forward the count of in-flight requests on the Redis side, preventing double-admission. A fresh dict would briefly double the admitted concurrency.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1854-L1859
  - what: Slot release is deferred to the active post-call Redis batch only in logging callbacks (in_logging_callback=True); pre-response releases go to Redis immediately.
    why: Deferred release avoids stalling the callback while still freeing local capacity immediately. The batch settles after the response leaves; a newer acquire on this worker refreshes the gauge.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1954-L1962
  - what: The integer mirror count is max(0, int(...)), never negative even when Redis returns a count lower than expected.
    why: LiteLLM protects against negative in-flight reporting that could allow unbounded admission.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1992
  - what: An acquire reply too short to carry every gauge count is GaugeError::ShortAcquireReply naming the needed and returned lengths, and an empty reply is GaugeError::MissingAcquireReply; a reply that is not an array is GaugeError::Reply.
    why: LiteLLM lets a short reply truncate its zip silently (statuses and mirror writes for the missing gauges never happen) and lets an empty reply raise IndexError from raw[0]. The PARALLEL_ACQUIRE_SCRIPT always returns entry plus one count per key, so a mismatched reply means the script or the key list is wrong, and the failure is named instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1810-L1826
  - what: An over-limit acquire reply naming a gauge index below 1 or past the request's gauges is GaugeError::GaugeIndex instead of Python's IndexError.
    why: LiteLLM indexes gauges[int(raw[1]) - 1], so a zero names gauges[-1] (the last gauge) and an overrun raises IndexError; the Lua script returns a 1-based index of the key it rejected, and a value outside that range is a broken reply rather than a gauge.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1810-L1815
  - what: A release reply count that is not a whole number is skipped and the slot stays released in memory only; LiteLLM's int(remaining) raises inside the mirror step, which its caller catches and answers with a second, in-memory release.
    why: The release already succeeded in Redis, so a count that cannot be read back is a mirror refresh that did not happen, not a reason to decrement a cached count a second time. The warn line names the script failure as LiteLLM's does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1984-L1996
  - what: An acquire success reply whose count is not a whole number is GaugeError::NotWholeNumber rather than a ValueError raised out of should_rate_limit.
    why: LiteLLM's int(in_flight) runs outside the try that guards the script call, so the error escapes the rate limiter and becomes a 500; the reply is malformed data and is reported as a named gauge error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1817-L1826
  - what: Whole-number text counts accept surrounding whitespace but not Python's underscore digit separators ("1_000").
    why: The counts come from ZCARD through the Redis protocol, which never writes underscores; the trim is kept because int() strips whitespace and a proxied value may carry it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1766
  - what: The deferred release registers with a ReleaseBatch seam (ReleaseBatchSource, ReleaseBatch, ReleaseSettledHook) rather than the concrete active_post_call_redis_batch pipeline object.
    why: The batch lifecycle belongs to B4331 and is not reachable from this crate; the seam carries the script, keys, per-key slot ids and the settled callback, so a failed pipeline logs LiteLLM's message and the local release keeps the slot usable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1966-L1982
  - what: A gauge status carries descriptor_value as null and a gauge-only response carries reservation_windows as null, where LiteLLM's status dict has no descriptor_value key and its gauge response has no reservation_windows key.
    why: RateLimitStatus and RateLimitResponse are shared with the windowed paths, where descriptor_value and reservation_windows are set; the gauge path leaves them unset, and a JSON client reading the fields gets null instead of a missing key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/hooks/parallel_request_limiter_v3.py#L1716-L1723
