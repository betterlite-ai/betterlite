task: B1440
deviations:
  - what: >-
      Selection answers a closed policy identity (native, a registry descriptor's
      provider, or one of the four extracted config tags) instead of constructing the
      LiteLLM config class. The callers that mount the routes build the config from
      that identity.
    why: >-
      Rule closed-sets-are-enums keeps the choice typed and comparable; the config
      classes belong to the provider crates, which betterlite-models must not import.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9113-L9148
  - what: >-
      litellm.api_base, litellm.api_key, litellm.openai_like_key and litellm.cometapi_key
      are values in an injected Globals record rather than process-wide module
      attributes read by the resolver.
    why: >-
      Rule inject-dependencies forbids global state; the config crate loads the
      env-backed aliases and the dispatch supplies the process-wide values.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L6613-L6644
  - what: >-
      A CometAPI embedding reply is decoded into the typed EmbeddingResponse through
      B010's prepared-embedding execution, so the reply carries the caller's model.
      LiteLLM's CometAPI transform copies the model field of the reply, which may be
      absent.
    why: >-
      The typed EmbeddingResponse has a non-optional model and B010's embedding decode
      already gives the caller's model precedence; an absent reply model then still
      answers instead of failing the whole call.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/cometapi/embed/transformation.py#L111-L130
