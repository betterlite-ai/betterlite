task: B3695
deviations:
  - what: Conditional category matches with the MASK action log a warning and leave the text unchanged; no redaction tag is applied.
    why: Conditional matches pair an identifier word with a block word found in the same sentence, so there is no single span to mask; the source handles conditional MASK separately from the other MASK actions.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1242-L1247
  - what: Blocked words loaded from a blocked_words_file are evaluated in sorted keyword order instead of the order the file lists them, so when two blocked words match the same text a different word can be reported or blocked first. Inline blocked_words keep their configured order.
    why: B3693's blocked-word file loader returns the words sorted by lowercased keyword, and filter_single_text iterates the list it is given.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1421-L1428
  - what: Log lines are tracing events whose wording and field names differ from LiteLLM's verbose_proxy_logger format strings, though each event fires at the same point with the same level.
    why: betterlite logs structured tracing fields; parity stops at LiteLLM's declared types and does not port its str formatting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1242-L1247
