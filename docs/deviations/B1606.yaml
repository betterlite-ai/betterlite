task: B1606
deviations:
  - what: There is no process-wide ToolPolicyRegistry singleton and no get_tool_policy_registry accessor. The server owns one registry behind a mutex and passes it, with the database pool, in a ToolPolicyStore to the refresh and to the lookups.
    why: Rule inject-dependencies forbids module-level state, and the server has to reach the same registry from the discovery drain, the policy routes and the guardrail; the registry handle comes from the caller and tests build their own.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/tool_registry_writer.py#L452-L460
  - what: The refresh decodes each stored tool row into the typed ToolInputPolicy and ToolOutputPolicy values instead of holding the raw column text; a row whose policy is outside the declared literals fails the refresh with the typed decode error, where LiteLLM keeps the raw string in the map and answers request lookups with it.
    why: Rule typed-wire; the declared types are the literals LiteLLM defines, and a value outside them is a corrupt row that no request-side comparison can act on, so the failure surfaces instead of hiding in the registry.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/tool_registry_writer.py#L390-L395
kept_bugs:
  - what: A refresh publishes the new tool maps before it reads the permissions, so a failed permission read leaves the registry with the new tool policies, the previous blocked_tools map and initialized unchanged; a fresh registry stays uninitialized.
    why: The task pins this partial-refresh state; a working setup only ever observes a refresh that raised, so nothing relies on the refresh being atomic.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/db/tool_registry_writer.py#L385-L407
