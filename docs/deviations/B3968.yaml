task: B3968
deviations:
  - what: >-
      Cached prompts are keyed by the Humanloop prompt ID alone and compiled in place, so every caller
      that shares a prompt manager sees the first compilation of a cached template.
    why: >-
      The pinned source keys DualCache by prompt ID only and rewrites template["content"] on the cached
      dict; a credential-scoped key or a copy per compile would change behavior beyond the pin.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/humanloop.py#L35-L110
  - what: >-
      The prompt ID is percent-encoded as a single path segment in the /v5/prompts/{id} URL.
    why: >-
      LiteLLM interpolates the raw ID, so a slash, a query marker or .. in a request-supplied ID moves
      the request off the configured endpoint; encoding keeps it on that endpoint.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/humanloop.py#L66-L74
  - what: >-
      A template placeholder with a conversion (!r), a format spec (:...), attribute access or index
      access is rejected with an error that names the field.
    why: >-
      Python's str.format mini-language is runtime text handling that docs/compatibility.md excludes;
      betterlite builds the {{variable}} substitution the integration is for and refuses the rest
      instead of porting str.format.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/humanloop.py#L56-L57
  - what: >-
      A prompt variable whose value is a JSON array or object is rejected with an error that names it
      instead of being rendered with Python's str() text.
    why: >-
      Rendering those needs Python repr text that docs/compatibility.md excludes; strings, numbers,
      booleans and null are rendered as JSON text.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/humanloop.py#L57
  - what: >-
      A response without a template or model field, or with a non-string model, is a typed error that
      names the field instead of an unhandled KeyError.
    why: >-
      A KeyError surfaces as a 500 on a response the integration cannot use; the typed error keeps the
      failure a client can act on and changes nothing for a well-formed response.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/humanloop.py#L81-L89
  - what: >-
      A negative HUMANLOOP_PROMPT_CACHE_TTL_SECONDS is a settings error instead of a cache entry that
      expires immediately.
    why: >-
      The variable is parsed as an unsigned number; a negative TTL turns caching off in LiteLLM and no
      working setup relies on it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L1540
  - what: >-
      On a cache miss the expired entries and the over-capacity eviction are applied before the
      upstream fetch, so a fetch that fails while the cache is full can drop one cached prompt early.
    why: >-
      The cache keeps a single mutable borrow of its map so the insert can return the stored prompt;
      the dropped prompt is fetched again on its next use, and a successful fetch inserts exactly as
      LiteLLM's set_cache does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/humanloop.py#L101-L110
