task: B3853
deviations:
  - what: "The module-level emit_guardrail_span has no exception to swallow: the Rust emitter returns no error and baggage promotion, guardrail construction and span emission cannot raise, so the best-effort contract holds while nothing is caught."
    why: "LiteLLM wraps the emission in try/except because a Python guardrail record can raise anything; Rust's signature carries the same guarantee, since every failure is already absorbed by the emitter's Option."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L954-L961
  - what: "phase_span returns None when no logger is registered, as LiteLLM's generator yields None; the same entry point with a logger returns Some(PhaseSpan) and callers check the Option."
    why: "This is the documented contract: phase spans are optional instrumentation, and the Python context manager yields None on the no-logger path instead of raising."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L993-L1000
  - what: "Request identity seeding has no exception to swallow either: promotion reads only typed metadata, baggage attachment builds a Context, and a malformed requester value promotes nothing without aborting the seed."
    why: "LiteLLM's try/except guards a best-effort labeling side effect; in Rust the same inputs either produce a string or are skipped by the typed conversion, so no failure path exists to suppress."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L704-L734
  - what: "seed_request_identity returns the Baggage Context for the auth-boundary caller to attach and hold for the request (B8910's auth phase hook), where LiteLLM calls attach(set_request_baggage(bag, get_current())) inside seed_request_identity and lets the request task's contextvar carry the Baggage."
    why: "Context::attach returns a guard that detaches on drop, so the attach has to live in the caller that outlives the seeding call; the returned Context carries the same Baggage, and request_identity::the_attached_guard_carries_identity_into_a_later_span proves a span started under the held guard inherits it."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L704-L734
  - what: "PhaseSpan::record_error stamps attributes, the exception event and ERROR status in one ErrorStamp::FULL call, where LiteLLM stamps attributes only and leaves the event and status to use_span's exception handling on the way out; the event's type and message come from the constructed SpanError rather than a Python exception object."
    why: "Rust has no context-manager exception hook, so the caller records the error explicitly; the node that runs the auth phase holds PhaseSpan::attach's guard while the body runs, as use_span does and B8910's phase hook will, because the guard cannot cross an await inside a hook. Folding use_span's record_exception and set_status_on_exception into the stamp keeps the exported span carrying the same attributes, one exception event and an ERROR status."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L736-L745
  - what: "The emitter's mapper chain arrives in CallbackParts already built as MapperKind values, and construction validates config.mapper_names through resolve_mappers without using its result."
    why: "SpanEmitter holds only GenAI and Legacy mapper kinds while resolve_mappers returns the six span-message vocabularies; the chain is injected by the factory that owns the vocabulary selection (B8910) and every configured name is still rejected once at construction."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L201-L206
  - what: "mark_request_root_span takes the live span and an optional http.route explicitly and records a handle in the callback's RootSpans; the identity and failure hooks resolve the anchored SpanId back to that handle, where LiteLLM reads the ambient span from get_current_span and keeps the Span object in a contextvar."
    why: "Rust has no contextvars and B3847 owns the request trace anchor, so anchoring goes through RequestTraceContext::anchor_request_root for parenting while the handle map answers the stamping hooks that need the live Span; span contexts stay valid after end, matching is_recordable_span."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L836-L843
  - what: "The module-level entries take the V2Registry explicitly instead of importing the proxy module and reading proxy_server.open_telemetry_logger, and the registration target is that registry's first slot rather than the proxy module's global attribute."
    why: "betterlite keeps no module globals; the registry is injected at construction and holds the same single-slot semantics, so one recorded guardrail entry still yields exactly one span whichever number of callbacks registered."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L935-L967
  - what: "V2Registry carries the four callback lists and the live-callback slot itself rather than wrapping ProxyRegistry, whose slot holds OtelRegistration { callback_name } instead of the Arc<V2Callback> the module entries must emit through and whose service_callbacks is the legacy single list; registry::phases::CallbackList is reused for the four names."
    why: "The module entries need the registered callback's emitter and error configuration, which a name-only registration cannot supply; the production selection path is B8910's injected runtime, which picks among registered V2 callbacks by construction order, so this registry keeps that same single-slot rule without process globals."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L145-L270
  - what: "The anchored root handle answers only while its span still records, so a failure hook that runs after the server span ended falls through to the threaded parent span, where LiteLLM returns the ended span because its context is still valid and stamps it into a silent no-op."
    why: "A stamp on an ended span is lost data; falling through keeps the error on a live span when the proxy threads one, and pruning on registration keeps the handle map flat for a long-running proxy."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/plumbing/context.py#L62-L73
  - what: "A repeated attribute key reads back its last value: LiteLLM's span keeps attributes in a dict, so a second stamp of error.code overwrites the first, while this SDK's set_attribute appends both and the tests read the last match."
    why: "The second stamp exists to pin error.code to the real response status, so reading the last value keeps that pin observable; the exported attribute list itself stays exactly as the SDK writes it."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/logger.py#L780-L787
  - what: "A service span that resolves a link starts from a detached context that keeps the Baggage and drops the parent span, where LiteLLM passes set_span_in_context(INVALID_SPAN, ctx) to the tracer."
    why: "This SDK's ParentBased sampler treats an active span with an invalid SpanContext as an unsampled parent and drops the span, so the link case would emit nothing; detaching produces the same root trace, the same link and the same Baggage as the Python sampler's root fallback."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/otel/plumbing/context.py#L242-L246
