task: B3093
deviations:
  - what: The LiteLLM functions `_aggregate_grouping_sets_records_sync` (37 characters) and `_aggregate_grouping_sets_records` (32 characters) are renamed to `aggregate_grouping_rows_sync` (26 characters) and `aggregate_grouping_rows` (23 characters) respectively.
    why: Rust identifier names must not exceed 30 characters per linter rules. The shortened names preserve the semantic meaning (aggregate grouping rows, not grouping sets which is SQL terminology) while fitting the constraint. Since these are internal Rust functions, not wire format types, a serde rename is not applicable.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L739-L865
  - what: A rollup row that carries `ptu_flat_cost` reports that cost as flat_cost even when PTU cost attribution is turned off, where LiteLLM's `_reported_flat_cost` returns 0 unless `is_ptu_cost_attribution_enabled()` is true.
    why: The PTU feature flag belongs to B1664, which does not exist yet, so the gate has nothing to read on this branch. The row is still reported with its stored cost and every provider bucket zeroes flat_cost as LiteLLM does; once B1664 lands, `record_to_spend_metrics` and the paginated path both need to consult it. The value only appears when the operator opted into PTU cost attribution before it was turned off.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L188-L207
  - what: A rollup row whose date is not exactly four digits, a dash, two digits, a dash and two digits is an error naming the value, where LiteLLM's `datetime.strptime(date_str, "%Y-%m-%d")` also parses unpadded months and days such as `2024-3-5`.
    why: The aggregate path parses dates with the shared canonical parser, which every other daily activity read uses, instead of a second lenient format. The spend writer stores dates as ISO 8601 through `date.isoformat()`, so a working setup only ever produces the padded form; an unpadded value comes from a hand-edited row and fails the read with a 500 that names it, the same status LiteLLM returns for a date it cannot parse.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L852-L860
  - what: LiteLLM's `_fold_entity_rollups_sync` is named `fold_entity_rollups_sync` here, without the leading underscore.
    why: Rust spells an internal function without a Python privacy prefix, and the fold keeps the same signature and the same loop. The name fits the length rule, so only the prefix differs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L973-L1004
  - what: 'A date-level rollup row with a null date fails the read with a 500 whose detail is "Failed to fetch analytics: rollup row has no date". LiteLLM stores the row under a None date, raises TypeError while it parses the dates, and answers that exception with a 500 whose detail carries the Python error text.'
    why: The row type carries an optional date only because the grand-total row leaves it null, and every other grouping set has date in its key, so no query writes a date-level row without one. Naming the row is clearer than a Python type error, and both paths answer 500.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L791-L795
  - what: The entity fold runs inline on the async task after the metadata read, where LiteLLM hands `_fold_entity_rollups_sync` to `asyncio.to_thread`.
    why: The fold mutates the response's date buckets in place, and a Tokio blocking job needs owned data, so matching the hop would move the results into the job and clone the caller's entity metadata map on every request. The fold makes one pass over the entity rows and does no I/O.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L1045-L1051
kept_bugs:
  - what: A PTU sentinel row that carries an MCP tool name or an endpoint creates a key breakdown entry named `__ptu_flat_cost__` in that bucket. LiteLLM checks the sentinel in the api_key, model, model_group and provider key branches and leaves the mcp and endpoint key branches unchecked.
    why: The per-row path keeps sentinel rows out of the provider breakdown only, so the silence in these two branches may be deliberate. A setup that reads those breakdowns sees the sentinel key today, so the aggregated path keeps it too, and the ptu_sentinel tests pin both cases.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L837-L850
