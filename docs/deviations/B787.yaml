task: B787
deviations:
  - what: general_settings, including the overrides shape check, and LITELLM_DISABLE_LOGIN_RATE_LIMIT are read once when the config section loads, not on every request.
    why: betterlite converts a config section once at load and reads the typed Settings per request, while LiteLLM re-reads the mapping and the environment on each from_request call, so a mid-process change takes effect immediately there and the invalid-overrides warning fires at load here; trigger, message meaning and fallback limit match.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_throttle.py#L286-L310
  - what: Integer settings must fit an i64 and accept only ASCII digits (with underscore groups and one sign), like int() does for the values LiteLLM documents; a larger or non-ASCII-digit value falls back to the default with the invalid-value warning.
    why: The typed Settings fields are i64, and docs/compatibility.md stops parity at the declared type; Python's int() would accept arbitrarily large integers and non-ASCII digits.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_throttle.py#L161-L172
  - what: Warning text is betterlite's own wording. The trigger points, warning count per event and the classification tokens (refused, blocked, redis_fallback, invalid_source_limit, invalid_window, invalid_block, invalid_overrides_mapping, invalid_override_value, invalid_topology_shape, invalid_network, source_limit_off, counters_per_worker) match LiteLLM.
    why: The oracle compares classified warning meanings rather than LiteLLM's exact log strings, so wording can read naturally in betterlite's own log output.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/login_throttle.py#L405-L410
