task: B1107
deviations:
  - what: >-
      A failed enforced-params check answers 400 invalid_request_error with the missing param named, and a non-premium
      user with enforced params answers 403 permission_error. LiteLLM raises a bare ValueError for both, which the
      proxy turns into a 500.
    why: >-
      A required param the client left out is a client error, and a 500 hides which param was missing. The status,
      type, param and code follow betterlite's error contract; the message stays betterlite's own.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L2957-L2976
  - what: >-
      A two-segment enforced param whose parent is present but is not a JSON object answers 400 with the parent named
      in param. LiteLLM indexes the parent value, raises TypeError, and the proxy answers 500.
    why: >-
      The parent being a scalar is a malformed request, not a server fault, so betterlite reports the same
      invalid_request_error as a missing nested param.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L2974
  - what: >-
      A team model alias is only checked for a deleted or sibling-scoped target when the principal has a team_id.
      With team_id absent, LiteLLM builds the prefix model_name_None_ and can warn about, bypass or rewrite such an
      alias.
    why: >-
      team_id is declared Optional[str]; an alias no team owns is applied as written instead of being matched against
      a literal None team name.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L2637
kept_bugs:
  - what: >-
      An enforced param with three or more dot-separated segments is never checked: metadata.user.email passes even
      when metadata.user carries no email. Betterlite copies LiteLLM's one-segment and two-segment checks only.
    why: >-
      A working setup can rely on such a param being ignored, and changing it would reject requests that route today.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L2963-L2976
