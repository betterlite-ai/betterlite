task: B7950
deviations:
  - what: "Names imported from openai, httpx, aiohttp or other LiteLLM modules that betterlite does not port (Logging, CompactionState, AttemptedFallbackTargets, SecretFields, RetryPolicy, DeploymentTypedDict, the chat message TypedDicts) become pydantic JsonValue shapes, or the empty protocol ForeignObject for a live client or logger object."
    why: "The wheel does not depend on those packages, and the repo bans object and Any in annotations."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/litellm_params.py#L13-L41"
  - what: "Fields typed object or Any in LiteLLM (metadata mappings, router settings values, Redis pipeline values, cache health parameters, tag budget maps, tool assignments) are typed with JsonValue."
    why: "The repo bans object and Any in annotations, and these values are JSON."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/litellm_params.py#L194-L195"
  - what: "The wire helper of litellm_params is not ported. Each field that has a wire name passes metadata=WireMetadata(wire_name=name) to dataclasses.field, a TypedDict that dataclasses stores as the same read-only mapping."
    why: "The repo bans a function whose body is one line, and the helper only wrapped that dictionary."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/litellm_params.py#L61-L62"
  - what: "owned_wire_names no longer raises TypeError for a root field that is not a dataclass. It reads the leaf classes from the root annotations."
    why: "The roots are fixed at import time and typed as dataclasses, so the check can never fire, and the repo bans isinstance-style checks."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/litellm_params.py#L379-L386"
  - what: "LiteLLM_ToolTableRow is an alias of the class ToolTableRow."
    why: "Ruff N801 rejects a class name with underscores, and the alias keeps the LiteLLM name importable."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/tool_management.py#L22"
  - what: "ServiceLoggerPayload.to_json calls model_dump only and drops the pydantic v1 fallback to dict."
    why: "The wheel pins pydantic 2, so the fallback can never run."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/services.py#L106-L111"
  - what: "validate_router_weights is bound directly to the validate_python method of its type adapter, so the keyword name of its argument is not value."
    why: "The repo bans a function whose body is one line, and callers pass the value positionally."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/router_weights.py#L23-L24"
  - what: "The str-mixin enums (ServiceTypes, LAR1 enums, cache enums) subclass enum.StrEnum instead of (str, Enum)."
    why: "Ruff UP042 rejects the (str, Enum) form, and the members and values stay the same. str() of a member returns its value, where (str, Enum) returns the class and member name."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/services.py#L14"
  - what: "CallState, AgenticLoopState, RouterState, ProxyRequestState, EntrypointState, InternalState and their helper types are defined in litellm_params_state.py, and litellm_params binds the same classes under their LiteLLM names."
    why: "The repo caps a Python file at 300 lines, and litellm_params with these classes is longer."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/litellm_params.py"
