task: B2462
deviations:
  - {what: "A response body or a header value that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\", where LiteLLM reads the body through httpx's response.text and the headers as httpx strings.", why: "betterlite records both as JSON text; replacement characters hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
  - {what: "A base URL that does not parse fails with the typed RequestUrl error after the pre-call and before anything is sent, where LiteLLM builds the URL string, logs the pre-call, and the send raises httpx's InvalidURL or UnsupportedProtocol for the handler's catch to turn into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L4610-L4613"}
  - {what: "A caller header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose own encoding raises inside the handler's try and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L4610-L4613"}
  - {what: "A provider reply that is not the JSON the files contract declares becomes a synthesized 500 BaseLLMException, where LiteLLM lets pydantic's ValidationError or httpx's JSONDecodeError escape the handler uncaught after the send.", why: "A body no working provider sends is a failure a setup cannot rely on; betterlite reports it as the provider error its callers already handle instead of leaking a Python exception across the SDK boundary.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/files/transformation.py#L175-L181"}
  - {what: "File objects serialize with their null optional fields omitted (expires_at, status_details and the rest of the shared record), where LiteLLM's OpenAIFileObject carries them as None and model_dump emits them as null unless the caller excludes None.", why: "The shared SDK record in betterlite-openai skips None fields, and the compatibility contract treats an absent field and a null one alike, so a reader of either JSON sees the same file.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/files/transformation.py#L71-L82"}
kept_bugs:
  - {what: "The caller's per-call timeout is accepted and ignored by retrieve_file in both modes and by the sync delete_file; only async delete_file and both listing sends hand it to the client, so those calls run on the selected client's own timeout instead.", why: "A setup that passes a short timeout to a sync retrieve or delete relies on the handler ignoring it; honoring it would time out calls LiteLLM lets run to completion.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L4609-L4613"}
  - {what: "The xAI list request drops the caller's purpose and the continuation carries only the pagination token, so the purpose never reaches the provider's query string.", why: "Any working xAI setup lists every file regardless of purpose; adding a parameter the provider ignores or rejects would change the request such a setup sends.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/files/transformation.py#L200-L217"}
  - {what: "xAI stops paginating when a page's data is empty even when its pagination_token is not, and an empty-string token counts as no token.", why: "A provider that keeps returning empty pages with a token would let a listing loop forever; a setup relies on the empty page ending it, and the empty token is what the provider sends for the last page.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/files/transformation.py#L208-L217"}
  - {what: "A file replied without created_at gets the wall clock at transform time, so the same provider reply yields different created_at values on different calls.", why: "xAI omits the field; a solution must produce some integer, and a setup comparing or deduplicating files by created_at relies on LiteLLM's fallback.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/xai/files/transformation.py#L71-L82"}
  - {what: "A page bigger than the room left under the 10000-file ceiling is truncated to that room, but the whole page's length still advances the count, so the rest of the truncated page is dropped and pagination stops without asking for it.", why: "The ceiling is OpenAI's documented list limit and LiteLLM enforces it exactly this way; asking for the dropped tail would return files a working setup never sees.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L4939-L4944"}
