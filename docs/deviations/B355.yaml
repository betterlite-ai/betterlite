task: B355
deviations:
  - what: The member 403 for the benchmarks read answers the detail "only proxy admin roles can view auto-router benchmarks across the deployment", where LiteLLM's _require_admin_viewer writes "Only proxy admin roles can {action}".
    why: The role gate is B345's shared _require_admin_viewer port (crates/betterlite-server/src/shadow_eval_validation/error.rs AccessError::ViewerForbidden), whose own routes and tests already answer with that wording. B355 reuses that helper instead of writing a second copy for a capital letter.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L970-L975
  - what: A benchmarks query string past 1048576 bytes is refused with 422 and a TooLarge reason before the parameters are decoded, where LiteLLM hands the raw query string to FastAPI's parameter binder with no byte bound.
    why: The source has no equivalent limit at the query-parsing boundary, and bounded-inputs requires a finite limit; the min_length=1 bound on user_id and the parameter types still apply unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L846-L856
  - what: The benchmarks and session reads answer a proxy without a database 500 with betterlite's shared detail "DB not connected. This endpoint needs a database; set DATABASE_URL to a PostgreSQL connection string (postgresql://...) to enable it. See https://docs.litellm.ai/docs/proxy/virtual_keys", where LiteLLM raises HTTPException(500, detail=CommonProxyErrors.db_not_connected_error.value), which reads "No DB Connected. See - https://docs.litellm.ai/docs/proxy/virtual_keys".
    why: crates/betterlite-server/src/shadow_eval_lifecycle/error.rs holds the one database-unavailable detail the other management reads answer with, and B355 reuses it instead of adding a second constant for the wording. The status is 500 on both sides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L932-L933
  - what: A session read authenticated with a seeded virtual key is not compared through the booted proxy. betterlite's master-key stage answers every other non-empty key 400 with type no_db_connection and code 400 (crates/betterlite-server/src/error_body.rs L33-L38), where LiteLLM resolves the presented key against its database (litellm/proxy/auth/user_api_key_auth.py L2118-L2135) and looks the session up under that key's hash. tools/oracle/cases/ui/cost/benchmarks-window-query.yaml sends its session read with the master key only.
    why: Virtual key authentication is B052's work, whose scope owns crates/betterlite-server/src/auth/** and state/virtual_key_auth.rs, still a stub slot, so B355 has nowhere in scope to authenticate a seeded key. The per-key partition is proven instead by the auto-router-read-api-session-key-isolation and auto-router-read-api-bounded-session-lookup probes, which run the production session_for with a caller key, and by the canonical-key route tests.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/auto_router_endpoints.py#L934-L936
