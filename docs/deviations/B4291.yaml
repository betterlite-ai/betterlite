task: B4291
deviations:
  - what: >-
      DiskCache persists typed cache values as JSON rows in a SQLite database inside the cache directory, while LiteLLM hands
      Python objects to diskcache, which pickles small values and writes larger ones to separate files.
    why: >-
      betterlite's cache value is a typed JSON value and there is no pickle; the parity that matters is each operation's
      result, not the bytes on disk. A directory written by one implementation is not read by the other.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/disk_cache.py#L14-L26
  - what: >-
      LiteLLM runs json.loads on a truthy stored value, so a stored string that parses as JSON reads back decoded: a stored
      "0" reads back as 0 and a stored "[1]" as a list. betterlite reads every stored value back as the typed value it stored,
      so a text payload reads back as that text.
    why: >-
      betterlite's cache value is typed and is written as JSON exactly once, so there is no second decode to apply. Callers
      that used to store an encoded payload as a string store the typed value instead, and the response-cache tasks do that.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/disk_cache.py#L31-L38
  - what: >-
      DiskCache.set_cache returns an error for a CacheValue::Bytes or CacheValue::Credential value, while LiteLLM stores any
      picklable Python object, bytes included.
    why: >-
      Those two cache value variants are not JSON values and the store writes JSON text; an error that names the key is
      better than a stored value that reads back as something else.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/disk_cache.py#L28-L32
  - what: >-
      EventDrivenCacheCoordinator takes a wait timeout and returns WaitTimeout when the load signal does not arrive, while
      LiteLLM's waiters block on asyncio.Event.wait() for as long as the loader runs.
    why: >-
      Every wait in betterlite has a bound, and a hung load function would otherwise leave every caller waiting. The timeout
      is injected at construction, so a caller keeps LiteLLM's unbounded wait by passing a long one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/cache_coordinator.py#L163-L196
  - what: >-
      betterlite's disk store has no size limit and no least-recently-used eviction, so the cache directory keeps every entry
      until it is overwritten, deleted or flushed, while diskcache defaults to a 1 GiB size limit and culls entries past it.
    why: >-
      The size limit is a policy of the storage library LiteLLM delegates to, not of the DiskCache wrapper this task ports,
      and no cache key betterlite writes is unbounded in size.
    link: https://grantjenks.com/docs/diskcache/api.html#diskcache.Cache
  - what: >-
      increment_cache fails with IncrementOutOfRange and leaves the stored counter unchanged when the sum leaves the i64
      range, while LiteLLM's Python integers grow without bound.
    why: >-
      A counter past i64 cannot be stored in the typed cache value, and no working counter reaches it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/disk_cache.py#L46-L53
