task: B8411
deviations:
  - what: A failing record returns a typed ContractError whose message is the validator's ValueError text; the pydantic error list (loc, input, ctx, url) is not rebuilt.
    why: The routes that turn it into a 422 own the error body; the status and the message a user reads stay LiteLLM's.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L1516-L1521
  - what: A value pydantic itself rejects, such as a user_role outside the four literals or a negative count, reports betterlite's own sentence rather than pydantic's "Input should be ..."/"Field required" text; the rejection and the 422 stay.
    why: The message is assembled by ContractError, and reproducing pydantic's generated English would mean rebuilding its error templates.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L1943-L1951
  - what: reset_to, max_budget, soft_budget, spend and the cost estimate amounts are held as Decimal and written back as JSON numbers, where LiteLLM declares them float; a decimal that needs more precision than an f64 keeps its exact digits until it is serialized.
    why: Money is the repository's Decimal Amount type everywhere, so these records never add or compare floats.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2098-L2107
  - what: Token counts, request counts, the four budget limits and the Redis port are i64, so a JSON integer past i64::MAX is rejected where Python's unbounded int would take it.
    why: Rust integers have a fixed width, and i64 covers every count these records carry.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L5752-L5764
  - what: CoordinationRedisParams hides password and sentinel_password from its Debug output, where LiteLLM's model prints both in repr.
    why: The task text asks for it, and a config record's Debug output can reach logs; docs/compatibility.md leaves repr text out of parity.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L2641
  - what: Datetime fields on the user info response record render an exact millisecond value with three fractional digits, where pydantic's JSON dump always writes six for a nonzero microsecond.
    why: The shared database Timestamp type serializes through chrono's AutoSi format, which trims exact milliseconds to three digits; whole-second and microsecond-precision values render the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L3590
