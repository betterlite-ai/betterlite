task: B880
deviations:
  - what: A failed write of the end_user_validation entry surfaces from the resolver as a 500 internal_server_error with param null and code 500, where LiteLLM's DualCache.async_set_cache logs the backend error and continues without the entry.
    why: B880 requires cache read and write errors to propagate, and betterlite's pre-call write reports its failures as AuthCacheError, so the resolver forwards them instead of trusting a verdict it could not record. LiteLLM raises the same failures only on its pipelined pre-call path, which sits outside the catch; a plain dual-cache write is logged and swallowed. A read failure stays a cache miss on both sides, because the auth cache answers a failed read with None.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/dual_cache.py#L504-L518
