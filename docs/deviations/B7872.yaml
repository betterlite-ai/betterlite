task: B7872
deviations:
- what: "`client` and `shared_session` are refused with `UnsupportedCallArgument` in all four functions."
  why: "A Python HTTP client cannot drive the Rust client (B158), so the facade raises instead of silently ignoring the argument."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L267"
- what: "Only the openai-compatible providers (openai, hosted_vllm, litellm_proxy) and xai execute a create or retrieve here; azure, vertex_ai, anthropic, bedrock, mistral and the provider-config path answer 400 with a BadRequestError naming the provider."
  why: "This build has no azure, vertex, anthropic, bedrock or mistral batch executor; the provider tasks that add one remove its branch from this list."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L313"
- what: "`_hidden_params` carries `llm_provider`, `model_id`, `litellm_model_name` and `api_base` only."
  why: "The timing and logging keys LiteLLM adds to every response (`_response_ms`, `litellm_overhead_time_ms`, `litellm_call_id`, `response_cost`, `additional_headers`, `callback_duration_ms`) come from its callback machinery, which the Rust call has no part in. `model_id` (from `model_info.id`) and `litellm_model_name` match LiteLLM's keys and values. `api_base` follows `get_api_base` over the caller's own kwargs: the caller's `api_base`, else the provider's built-in default (`https://api.openai.com` for openai, `https://api.x.ai/v1` for xai), else null. Three fallbacks `get_api_base` also reads are not resolved here: the `base_url` kwarg alias, the `XAI_API_BASE` environment default, and the model alias map (`litellm.model_alias_map`). `llm_provider`, which the task asks for, is an extra key, since a batch result from LiteLLM sets no provider in `_hidden_params` (only `custom_llm_provider` on chat responses)."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/response_metadata.py#L124"
- what: "A create whose request never reaches the provider, such as a refused connection or a DNS failure, answers an `InternalServerError` with status 500; LiteLLM lets the OpenAI SDK's `APIConnectionError` out of `create_batch` for the same call."
  why: "B1036's create error carries only a status, so the Python facade cannot tell a transport failure from a provider 500; the retrieve path keeps the failure kind and answers `APIConnectionError` for the same failure."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L304-L312"
- what: "An unsupported `custom_llm_provider` on create answers with B1036's message \"custom_llm_provider=... is not supported for create_batch\", not LiteLLM's \"LiteLLM doesn't support custom_llm_provider=... for 'create_batch'\"."
  why: "The text belongs to the core create error (B1036); the class, status and llm_provider are LiteLLM's."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L363"
- what: "`_hidden_params[\"litellm_model_name\"]` is the `model` keyword; LiteLLM reads the first positional argument instead, so a caller that passes `completion_window` positionally records \"24h\" there."
  why: "The first positional argument of `create_batch` is the completion window, not a model, so LiteLLM's value is wrong whenever the window is passed positionally."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L1993"
- what: "A text `timeout` reaches create_batch unchanged; B1036 accepts a number or an object of phases, so `timeout=\"10\"` answers a bad-payload error instead of being floated."
  why: "The task fixes Python's job as collecting arguments; B1037's read path does accept the text form."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L103"
- what: "`LiteLLMBatch` is defined in `python/betterlite/batches/_create_retrieve.py`; B7873 imports it from there."
  why: "No task puts the class in `python/betterlite/types/utils/small_types.py`, where LiteLLM keeps it, and that file is outside this task's scope."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L4320"
- what: "Every `LiteLLMBatch` field except the seven the provider always sends has a None default, and `errors`, `request_counts` and `metadata` are plain dicts."
  why: "LiteLLM's openai Batch model requires every key; the Rust answer always writes all 22, so a lenient model only changes what a hand-built value accepts, and an unknown key from a provider survives the round trip."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L4320"
- what: "A `completion_window` other than \"24h\" or an `endpoint` outside the eleven paths answers a `ValueError` from the native payload parse; LiteLLM passes the value to the provider, whose 400 becomes a `BadRequestError`."
  why: "B1036's request types declare both literals as Rust enums, so the typed wire parse refuses another value before a provider call exists; Python adds no runtime check of its own."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L240"
- what: "A `custom_llm_provider` outside create_batch's eight answers a `ValueError` from the native payload parse; LiteLLM reaches its unsupported-provider branch and raises a `BadRequestError`."
  why: "B1036's `BatchProvider` enum names only the providers it can dispatch, so the typed parse refuses a string it does not know, while retrieve keeps unknown providers in `BatchReadProvider::Other` and answers the 400."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L362"
kept_bugs:
- what: "`retrieve_batch` and `aretrieve_batch` accept a `metadata` argument and never send it."
  why: "LiteLLM's signature carries it and its RetrieveBatchRequest has no metadata key, so a caller's metadata is silently dropped in both."
  link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/main.py#L607"
