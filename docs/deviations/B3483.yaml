task: B3483
deviations:
  - what: A provider that only a slug names, such as a custom provider or an unknown custom_llm_provider string, reaches the chat adapter, where LiteLLM raises ValueError while building LlmProviders(custom_llm_provider).
    why: Provider resolution belongs to B174, and a provider betterlite knows by slug is a real provider, so the adapter handles the call instead of the setup failing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/main.py#L144-L148
  - what: kwargs fields that GenericLiteLLMParams declares but this setup does not model, such as timeout, tpm, rpm or drop_params, stay in the carried extra object unvalidated instead of being coerced to their declared types.
    why: The setup record keeps every kwarg the caller sent, but only the fields the setup acts on are read, so a wrong type reaches the handlers as written instead of failing at setup.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/google_genai/main.py#L117
