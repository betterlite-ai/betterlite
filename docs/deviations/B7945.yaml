task: B7945
deviations:
  - what: >-
      CacheSettingsField.field_value and field_default, RouterSettingsField.field_value and
      field_default, and CoordinationRedisSettingsField.field_value and field_default are typed
      as pydantic's JsonValue, where LiteLLM declares Any on the first two models and
      object | None on the third.
    why: >-
      The wheel's rules forbid Any and object in annotations, and every value these fields hold
      in the three field lists, and every value the settings endpoints hand back for them, is a
      JSON value, so JsonValue describes what the models actually accept and return.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/cache_settings_endpoints.py#L13-L15
  - what: >-
      The class docstrings and the Field(description=...) texts of the six router fallback and
      field models and of CacheSettingsField, CoordinationRedisSettingsField and
      RouterSettingsField are not ported, so __doc__, model_fields[name].description and the
      model_json_schema() descriptions are absent.
    why: >-
      The repository keeps no docstrings, and the task's definition of done fixes parity at the
      names, keys, required keys, Literal values and defaults, none of which the descriptions
      touch; the settings UI reads field_description from the data lists, which is ported.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/management_endpoints/router_settings_endpoints.py#L15-L23
