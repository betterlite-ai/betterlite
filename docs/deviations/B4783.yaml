task: B4783
deviations:
  - what: "The agent card is already a typed AgentCard (B4770), so LiteLLM's fallback to an empty searchable card when agent_card_params fails validation has no input in betterlite. A card that does not parse is rejected when the agent is stored or read."
    why: "The typed boundary; the fallback only hid a malformed dict."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/agent_search.py#L63-L67"
  - what: "Concurrent searches take turns on one mutex around the index, so two requests do not embed at the same time. Results are the same."
    why: "SemanticTextIndex::scores takes &mut self, and LiteLLM's single-threaded event loop has no such lock."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/agent_search.py#L116-L135"
  - what: "search_score is a Decimal built from the f64's shortest round-trip text. A score under 1e-4 in magnitude prints as plain digits here, where Python prints an exponent (1e-05). The JSON numbers are equal."
    why: "B4770 stores search_score as Decimal; the clients parse both forms to the same number."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L275-L308"
  - what: "The health check error text for a transport failure is betterlite's own message, not httpx's str(exc)."
    why: "The text is only used to mark the agent unhealthy and is never returned to a client."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L254-L272"
  - what: "A non-finite embedding score becomes an explicit 500 error; LiteLLM's response serializer raises on the NaN and Starlette also answers 500, with no body a client can parse."
    why: "Standard JSON cannot carry NaN, so the failed response names the cause instead of failing inside serialization."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L275-L308"
  - what: "The health probe applies the configured timeout as one whole-request deadline, where httpx's AsyncHTTPHandler(timeout=5.0) gives 5 seconds each to connect, read and write. An agent that spends 3 seconds connecting and 3 more answering is healthy in LiteLLM and unhealthy here."
    why: "The task specifies the timeout as the whole-request deadline, and betterlite's pooled client takes one deadline per request."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L254-L272"
  - what: "The health probe reads no response body, where httpx's client.get reads it to completion. A 200 whose body stalls past the read timeout is unhealthy in LiteLLM and healthy here."
    why: "The task says the probe reads no body, and the route only uses the status, so an unread body avoids an unbounded read on a health probe."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/endpoints.py#L254-L272"
