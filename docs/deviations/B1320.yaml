task: B1320
deviations:
  - what: A `safety_settings` value that is not a list of mappings answers 400 with an error naming the field, where LiteLLM raises a plain ValueError that its outer handler turns into APIConnectionError with status 500. A mapping whose keys the protobuf rejects is accepted and has no effect, because betterlite validates the shape and drops the list without building protobuf objects.
    why: compatibility.md makes a value outside the declared type an error that names the field, and LiteLLM checks only the first item before its protobuf constructor fails on the rest. The list never reaches a request in LiteLLM either, so a working setup sends valid settings and sees no difference.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_non_gemini.py#L162-L168
  - what: An empty chat, text, custom, private or code prediction answer returns a null message content and zero completion tokens, where LiteLLM leaves the response content at None for an empty answer and its synchronous usage block raises on that None in the tokenizer, so its APIConnectionError handler answers 500.
    why: A working Vertex setup can return an empty candidate; null content and zero completion tokens are what the response contract already allows, and rule errors-match-litellm fixes a 500 no caller can act on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_non_gemini.py#L407
kept_bugs:
  - what: A synchronous custom or private request with stream=true sends the instance with the "stream" field set to true in its parameters, because the source copies optional_params into instances before it pops stream.
    why: LiteLLM copies the options into the instance at L208 and pops stream at L254, so the body a working setup sends today carries the flag; betterlite copies the same options at the same point and sends the same body.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_non_gemini.py#L208
