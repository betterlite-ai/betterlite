task: B2212
deviations:
  - what: >-
      A reply body is decoded as UTF-8, one leading UTF-8 byte-order mark is removed before the plain-JSON parse, and
      the body and each result text block are parsed as standard JSON. LiteLLM instead lets httpx decode the bytes
      with the response charset (UTF-8 when none is declared) and hands the text to json.loads. A UTF-16 or UTF-32
      body, a body whose declared charset decodes its bytes differently, non-standard JSON (the NaN and Infinity
      constants, a lone UTF-16 surrogate escape), and JSON nested beyond betterlite's parser recursion limit fail
      with a parse error here.
    why: >-
      The reply arrives as bytes and betterlite's JSON is standard JSON (docs/compatibility.md). A gateway that sends
      a non-UTF-8 or non-standard body breaks its own JSON contract, and no working setup depends on parsing JSON
      nested past the recursion limit; LiteLLM honors the byte-order mark, the charset and those constants because
      httpx and json.loads do, not because the gateway contract promises them.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/bedrock/search/transformation.py#L428-L430
