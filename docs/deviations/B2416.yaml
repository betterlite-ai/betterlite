task: B2416
deviations:
  - {what: "A missing or non-integer source status marks status_code_is_synthesized true on every provider failure, including the status errors these handlers raise. LiteLLM sets the flag on whatever get_error_class returns, but the responses get_error_class raises the exception itself, so its synthesized assignment never runs and an OpenAI setup always observes false.", why: "The flag is the only signal that the 500 was made up; false would claim the provider answered 500, and no working setup can rely on LiteLLM's unreachable true.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/responses/transformation.py#L246-L253"}
  - {what: "An error body or a header value that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\", where LiteLLM reads the body through response.text and the header values as httpx strings.", why: "betterlite records both as JSON text; replacement characters hide that the bytes were binary, and the byte count keeps the record truthful without inventing text.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
  - {what: "A complete base URL that does not parse as a URL fails with the typed RequestUrl error after the pre-call runs, where LiteLLM logs the same pre-call and only the send raises httpx's InvalidURL or UnsupportedProtocol for the handler's catch to turn into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; betterlite names the unusable base instead of reporting a 500 as if the provider had answered, and no working setup has an api_base that is not a URL.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L3152-L3160"}
  - {what: "An extra header whose name or value HTTP cannot carry fails with the typed HeaderName or HeaderValue error after the pre-call and before anything is sent, where LiteLLM hands the strings to httpx, whose own encoding raises inside the handler's try and becomes a synthesized 500 BaseLLMException.", why: "HTTP cannot carry those bytes on either side, so both send nothing; betterlite names the header and skips a made-up 500 that would claim the provider answered.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L3152-L3160"}
  - {what: "The async retrieve debug line renders the converted provider error's message, where LiteLLM interpolates the raw caught exception, so httpx's status error text (error type, URL, documentation link) differs from the provider message betterlite logs.", why: "Both lines name the failure the catch saw; betterlite logs the error it raises, and its message is the one the caller can match against the exception.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L3229-L3233"}
kept_bugs:
  - what: Caller extra_headers cannot override Authorization. Validation mutates the caller's map in place (provider Bearer key), and the handler's later headers.update re-applies that same map, so the caller's value is gone.
    why: A setup passing its own Authorization gets the provider key on the wire, and code depending on that would send the wrong credential if the caller's header won.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L589-L602
  - what: All four handlers accept a timeout and never pass it to the GET, so a call runs on the selected client's own timeout whatever the caller asked for.
    why: A deployment setting a short per-call timeout relies on the handler ignoring it and on the client default applying; honoring it would time out calls LiteLLM lets run.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L3153-L3154
  - what: The retrieve handlers accept extra_body and never use it, so a caller's extra body keys never reach the response GET.
    why: A working setup may pass extra_body to the retrieve wrapper and still get a plain GET; sending those keys as a body or query would change the request LiteLLM sends.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L3141-L3160
  - what: The response id is appended as a literal slash plus one encoded segment after the whole base URL, so a base carrying a query string gets the id after the query.
    why: The task text requires the literal append, and moving the id before the query would change the URL a working setup has always sent for such a base.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/responses/transformation.py#L796-L812
