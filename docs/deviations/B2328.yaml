deviations:
  - what: A custom provider naming one of the eight JSON-registry-only slugs (gmi, crusoe, veniceai, aihubmix, sarvam, llamagate, empiriolabs, abliteration) takes the static catalog path and returns no warning, where LiteLLM's LlmProviders conversion raises and warns before returning an empty list.
