task: B202
deviations:
  - what: A request-level api_base or api_key is read as a control and never reaches the provider; LiteLLM forwards both to the SDK constructor.
    why: Outbound URLs and credentials come only from the deployment config, so a request body cannot redirect a call or supply a credential.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7480-L7482
  - what: Client mock controls (mock_response, mock_tool_calls, mock_timeout, mock_delay) are dropped instead of answering with a mock completion.
    why: betterlite's mock framework is configured per deployment; a client-supplied mock response is not part of the completion route yet, matching the embeddings route's refusal to honor one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L656
  - what: A completion parameter outside the text config's allowlist answers 400 invalid_request_error naming the parameter; LiteLLM raises UnsupportedParamsError, which the proxy answers with 500.
    why: betterlite names the field and its own message, and docs/compatibility makes a value of the wrong type a named client error; the status differs only for a request that fails on both sides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4509-L4540
  - what: A request body carrying top_logprobs reaches the provider; LiteLLM lists the parameter as supported but its SDK call rejects it, so every such request answers 500 before any provider call.
    why: A working LiteLLM setup cannot rely on a parameter that always fails, and the text config names top_logprobs as supported; betterlite forwards it and the provider decides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/completion/transformation.py#L121-L144
kept_bugs:
  - what: A string-first prompt list holding a later non-string element answers 500 with a null type, because main.py wraps every element as a message and the file-id pass then raises TypeError.
    why: The task follows main.py's prompt dispatch and the probes pin this shape; a working setup sends well-formed prompts.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7626-L7629
  - what: A token prompt or nested token prompt with a non-integer element answers 500 internal_server_error, because the transform falls back to convert_content_list_to_str and raises AttributeError.
    why: The oracle case invalid-mixed-prompt pins that shape and a working setup sends token ids.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/completion/utils.py#L28-L45
