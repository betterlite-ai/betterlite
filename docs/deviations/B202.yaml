task: B202
deviations:
  - {what: "An empty prompt list answers 400 invalid_request_error naming the prompt; LiteLLM's dispatch raises its own Unmapped prompt format Exception, which the proxy answers with 500 and a null type.", why: "An empty prompt names no prompt to send, so betterlite answers the client mistake instead of the unhandled Exception, the line docs/deviations/B225.yaml draws for LiteLLM's AttributeError and TypeError 500s.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7646-L7649"}
  - what: A body's api_base, api_key, api_version, engine, litellm_params, metadata, num_retries and mock controls (mock_response, mock_tool_calls, mock_timeout, mock_delay) are read as controls and never reach the provider; LiteLLM forwards api_base and api_key to the SDK constructor and answers a mock control with a client mock.
    why: Outbound URLs and credentials come only from the deployment config, so a request body cannot redirect a call or supply a credential; betterlite's mock framework is configured per deployment, and none of the other controls changes the OpenAI text provider request.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7460-L7487
  - what: A completion parameter outside the text config's allowlist answers 400 invalid_request_error naming the parameter; LiteLLM raises UnsupportedParamsError, which the proxy answers with 500. The same refusal names the fallbacks, model_list, custom_llm_provider and deployment_id controls, which LiteLLM acts on.
    why: betterlite names the field and its own message, and docs/compatibility makes a value of the wrong type a named client error; the status differs only for a request that fails on both sides. A per-request fallback list, deployment list, provider or deployment id is not built, so refusing the control by name beats ignoring it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4509-L4540
  - what: A request body carrying top_logprobs, functions, function_call, tools, tool_choice or response_format reaches the provider; LiteLLM's text config lists them as supported but its completions.create(**data) call rejects them, so every such request answers 500 before any provider call.
    why: A working LiteLLM setup cannot rely on a parameter that always fails, and the text config names all six as supported; betterlite forwards them and the provider decides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/completion/handler.py#L140
  - what: The /engines/{model}/completions and /openai/deployments/{model}/completions aliases take a model name without a slash, so a slash-containing model answers 404 instead of routing; LiteLLM declares both with {model:path}, which spans slashes.
    why: axum's matchit 0.8 refuses a catch-all that has a literal suffix after it, so /engines/{*model}/completions cannot be registered; /v1/completions and /completions take the model from the body and serve the same requests.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L12107-L12116
  - what: A later content-block list in a string-first prompt, such as ["a",[{"type":"text","text":"x"}]], answers 500 internal_server_error; LiteLLM concatenates each block's text and forwards the prompt as two strings.
    why: The completion prompt declares a later element as a string or a token list, and the text transform reads each element as a string; a block list is a message-content shape the OpenAI completion API does not declare.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/common_utils.py#L172-L179
kept_bugs:
  - what: A string-first prompt list holding a later number or bool answers 500 with a null type, because the file-id pass iterates the content; a later list of token ids answers 500 internal_server_error, because convert_content_list_to_str calls .get on each string or int. A later empty array becomes the empty string and is forwarded.
    why: main.py wraps every element as a message and the text transform cannot read the declared list element; the probes pin these shapes and a working setup sends strings.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7626-L7629
  - what: A token prompt or nested token prompt with a non-integer element answers 500 internal_server_error, because the transform falls back to convert_content_list_to_str and raises AttributeError.
    why: The oracle case invalid-mixed-prompt pins that shape and a working setup sends token ids.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/completion/utils.py#L28-L45
