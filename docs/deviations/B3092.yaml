task: B3092
deviations:
  - what: A date whose Z sits where the date and time separator belongs, such as 2026-01-05Z10:30:00, parses with Python's fromisoformat and contributes to the window, while betterlite drops it as unparsable.
    why: spend_logs_window reuses the shared savings-evidence parser, which mirrors a caller's fromisoformat(value.replace("Z", "+00:00")); that replacement turns the separator into an invalid offset. A second fromisoformat port only to accept the separator is a duplicate of a parser betterlite already keeps, and no date field writes Z as a separator.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L460-L466
  - what: A date set that mixes naive and offset-bearing values yields a window over the UTC instants, where LiteLLM sorts the parsed datetimes directly and raises TypeError for that mix.
    why: Sorting a naive datetime against an aware one is a 500 on input a caller can send. Converting each parsed date to UTC compares the same instants and cannot fail, and no working setup relies on the exception.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L453-L457
  - what: A date at the edge of Python's calendar, such as 0001-01-01 or 9999-12-31, yields a window that reaches past the edge (0000-12-31 or 10000-01-02) in betterlite, where LiteLLM's timedelta arithmetic raises OverflowError.
    why: chrono's calendar is wider than Python's, so the one-day subtraction and two-day addition cannot fail and the spend-log step runs over the wider window. A 500 for a date string the parser accepted is not something a working setup relies on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L453-L457
  - what: spend_logs_window takes a set of date strings; a null date from a record is dropped by the caller before the call. LiteLLM's signature accepts AbstractSet[str | None] and _parse_spend_date ignores a non-string entry.
    why: A Rust set of strings cannot hold a null, and the dates betterlite collects come from non-null date fields, so the null case carries no value to keep. The oracle helper filters nulls the same way.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L453-L454
  - what: A recovery step whose database row does not decode into its typed record is skipped with a warning and contributes no evidence, where LiteLLM reads the same row and uses the fields it finds.
    why: betterlite decodes every row into a typed record and treats a row that fails to decode like a failed lookup, so one malformed user or token row cannot fail a daily activity read. No working setup relies on partially decoded attribution.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/key_metadata_recovery.py#L313-L327
  - what: daily_activity_scope takes the six daily activity tables as a typed enum, so a table name outside them fails when the request decodes; LiteLLM raises ValueError from DailyActivityTable(table) inside the builder.
    why: betterlite's request models are typed end to end and the enum keeps the six table names in one place. The builder still checks the entity field against the table and returns LiteLLM's message for a mismatch.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L556-L568
  - what: daily_activity_repository takes the daily activity database adapter and the Postgres store as two arguments, where LiteLLM takes one Prisma client.
    why: betterlite-db keeps typed daily activity reads and the recovery probes that use the generic store apart, and the factory is where the two meet. A caller that holds one Prisma client has the store on hand already.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/common_daily_activity.py#L552-L553
  - what: daily_activity_repository takes the spend-log metadata cache and query lock as an Arc<SpendLogHistory> argument, where LiteLLM keeps them as module-level state.
    why: betterlite passes shared state through constructors, so the server state owns one SpendLogHistory and hands each read an Arc clone. Every read in the process then shares one cache and one query lock, as LiteLLM's module-level pair does; a repository can't hold them itself since it borrows a per-request client.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/key_metadata_recovery.py#L463-L480
