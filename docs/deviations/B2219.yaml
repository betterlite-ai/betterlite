task: B2219
deviations:
  - what: A Hugging Face config.json response body over the 16 MiB buffered-body limit of betterlite's shared HTTP client is treated as a failed fetch, so max_tokens stays None.
    why: LiteLLM reads whatever size the shared client returns and only fails on a transport error or a JSON parse error. The cap comes from B173's bounded body read, and no working setup resolves metadata from a config.json that large. Proven by model_metadata_resolution::hf_config::tests::fetch_follows_litellm, whose fixture transport answers with a body one byte over HF_CONFIG_BODY_LIMIT and expects None; no oracle case covers it because the pinned LiteLLM would read the whole body instead of failing.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L5847-L5867
  - what: HF_CONFIG_TIMEOUT_SECONDS is enforced as one 10 second deadline around the whole config.json request, while LiteLLM hands timeout=10.0 to httpx, which applies it separately to connect, read, write and pool waits.
    why: A response that trickles in under the per-read deadline but takes longer than 10 seconds in total fails here and succeeds in LiteLLM. A config.json that slow is not something a working setup relies on, and one total deadline is what bounded-inputs asks of every wait. Proven by model_metadata_resolution::hf_config::tests::fetch_follows_litellm, whose timeout scenario advances past the pinned deadline against a transport that sleeps for 30 seconds.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L1713-L1810
  - what: A max_position_embeddings value that is not a JSON integer (a string, float, boolean or list) maps to None, where LiteLLM returns the value unchanged despite the declared int | None type.
    why: The project policy in docs/compatibility.md reads a value of the wrong type as an error that names the field, and the task makes the config helper answer None for a wrong-shaped max_position_embeddings. The field is declared int | None, so an oracle case cannot send a wrong-typed value and stay inside the declared type; a Rust test proves the mapping instead (model_metadata_resolution::tests::decode_rejects_wrong_shaped_configs).
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L5847-L5867
