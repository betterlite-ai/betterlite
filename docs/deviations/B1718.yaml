task: B1718
deviations:
  - what: >-
      The active spend batch lives in an explicit request-owned SpendBatchContext that the caller
      enters and exits, not in a Python ContextVar.
    why: >-
      betterlite passes request state through constructors, and the context restores the previous
      batch when its guard drops, including when the task is cancelled.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_counter_batch.py#L138-L172
  - what: >-
      Concurrent readers coalesce on a fetch generation: one reader claims the fetch under the
      lock, releases it before the Redis call, and publishes to waiters when it returns, so no
      mutex is held across I/O.
    why: >-
      A std mutex held across an await blocks the runtime worker, and the guard republishes on drop
      so a cancelled fetcher still releases its waiters.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_counter_batch.py#L95-L106
  - what: >-
      A counter decodes to a Decimal, not a float, so every digit the Redis value carries survives
      the snapshot.
    why: >-
      betterlite keeps money as a Decimal; a float round trip would drop cents from a long counter
      before a read-then-write compares it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_counter_batch.py#L21-L22
  - what: >-
      A counter whose text or JSON shape names no finite Decimal (NaN, an infinity, a value past
      Decimal's range, an object or array) makes the whole fetched map fall back to a per-key read,
      where pydantic's float adapter would keep nan or inf for that key.
    why: >-
      Decimal has no NaN or infinity to hand a caller, and a snapshot mixing a placeholder amount
      with real ones would turn a malformed value into authoritative spend.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/spend_tracking/spend_counter_batch.py#L117-L126
