kept_bugs:
  - what: The team-callback audit row takes a non-empty litellm-changed-by header as changed_by without the allow_litellm_changed_by_header opt-in that B065's other audit rows require, so a caller who may change a team's callbacks can name anyone as the author of that change.
    why: The task text and LiteLLM agree on this order, and a UI or script that sends the header today expects its value in the audit row; gating it would silently change who the row names.
