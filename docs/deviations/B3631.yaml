task: B3631
deviations:
  - what: A data: payload, content_block or delta that parses as JSON but is not an object (a list, string, number or null) makes the collapse pass answer None so the bytes go through the legacy reconstruction and that frame is skipped there, where LiteLLM calls .get on the value and raises AttributeError out of the logging handler.
    why: A non-object value is outside the Anthropic event types docs/compatibility.md covers, so betterlite keeps the rest of the stream instead of losing the whole reconstruction to a Python duck-typing accident.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/anthropic_passthrough_logging_handler.py#L648-L661
  - what: The usage-only scan skips a data: payload, message or usage value that is not a JSON object, where LiteLLM reads .get on the value, raises AttributeError, and loses every usage event in the stream because its wrapper turns the exception into no answer.
    why: The usage-only fallback must never raise on a frame it cannot read, and the declared-type rule in docs/compatibility.md keeps the readable usage events instead of discarding them all.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/anthropic_passthrough_logging_handler.py#L804-L809
  - what: A token count, cache count, server-tool count or message.model value whose JSON type is not the one Anthropic declares is read as absent, so the previous count and the request model stay. LiteLLM copies the raw value into the usage object, where pydantic coerces a numeric string to the declared count and raises where it cannot coerce the value at all, which loses the cost result.
    why: docs/compatibility.md refuses a value outside the declared type instead of reproducing Python's coercion, so the scan leaves the field at its default rather than passing the raw value on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/anthropic_passthrough_logging_handler.py#L804-L842
  - what: An event whose data: line is framed with a bare carriage return is not read: betterlite splits lines on \n and strips a trailing \r (str::lines), while LiteLLM uses Python's splitlines, which also breaks on a bare \r and other Unicode line boundaries.
    why: SSE framing from Anthropic and from the relayed providers uses \n or \r\n, so the extra separators add code and tests for frames no working setup sends; the rest of the byte handling stays strict UTF-8.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/anthropic_passthrough_logging_handler.py#L762-L774
  - what: A content_block_delta whose delta text is not a string contributes an empty string, and a block index that is not an integer is read as absent, so the merged event carries index 0. LiteLLM passes both raw values through instead, which raises TypeError in "".join for a non-string text and in the block-index set for an unhashable index, and collapses a string index into a merged event that keeps it verbatim.
    why: Anthropic declares delta.text as a string and index as an integer, so a wrong-typed value sits outside the types docs/compatibility.md covers; betterlite reads it as absent rather than reproducing a Python type error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/anthropic_passthrough_logging_handler.py#L659-L683
