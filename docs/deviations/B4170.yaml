task: B4170
deviations:
  - what: Provider names are a static allowlist copied from the pinned LlmProviders enum.
    why: betterlite has no provider dispatch registry yet, so the report crate remains decoupled while preserving the known-provider filter.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L4013-L4179
  - what: Stack frames come from Rust backtrace text and are filtered to betterlite paths, rather than Python traceback objects.
    why: Rust has no Python interpreter traceback at runtime; callers can provide richer frame records when integrating this crate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/bug_report.py#L52-L71
  - what: Python version detection reports unknown.
    why: Rust cannot query an embedded CPython interpreter directly; an integration layer can supply the discovered version later.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/bug_report.py#L77-L91
