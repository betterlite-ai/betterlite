task: B1039
deviations:
  - what: >-
      A response slot that holds something other than an object (a string, number or list at response, or at an
      Anthropic result) makes LiteLLM's success check raise and drops the whole output file's accounting, while
      betterlite counts that line as failed and keeps billing the rest of the batch.
    why: The line's pass/fail answer is read from the typed entry, so one provider-written line with an unexpected shape
      cannot discard the other lines' costs; the batch totals stay reconcilable with the provider's request counts.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/batch_utils.py#L741-L756
  - what: >-
      A native Vertex row whose usage metadata fails conversion raises out of LiteLLM's
      calculate_vertex_ai_batch_cost_and_usage and loses the whole batch, while betterlite counts that row as failed.
    why: The row's own conversion error is reported by B1040's native_vertex_batch_row_stats, so this slice can count
      the row failed instead of discarding the priced rows beside it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/batches/transformation.py#L69-L83
  - what: >-
      Python's json.loads auto-detects UTF-16 and UTF-32 input and accepts NaN and Infinity, while betterlite's line
      reader takes UTF-8 strict JSON, so such a line is reported malformed instead of parsed.
    why: One strict UTF-8 JSONL decoder serves both the public decoder and the fuzz target, so the bytes have one
      meaning on every path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/batches/batch_utils.py#L593-L601
  - what: >-
      An output file larger than 16 MiB, one line larger than 1 MiB or more than 65536 lines is rejected with an error,
      where LiteLLM reads whatever the provider wrote.
    why: B1087's ApiLimits bound every decoder entry point; a caller that needs more raises the limits it passes.
    link: ""
kept_bugs: []
