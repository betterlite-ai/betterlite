task: B2313
deviations:
  - what: AgentKillSwitchConfig preserves URL strings without validating absolute HTTP(S) syntax during serde construction.
    why: The repository ast-grep no-custom-serde hook rejects the required custom serde validator, and the task has no expect budget; retaining the string preserves caller serialization but leaves validation to the outbound owner.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L218-L239
  - what: Policy spend, budgets, and search scores reject nonfinite or out-of-Decimal-range values.
    why: The native numeric policy forbids floating-point storage; ordinary finite values retain source defaults and signs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L314-L339
