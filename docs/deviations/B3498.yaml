task: B3498
deviations:
  - what: The handler reaches the Responses operation through the injected ResponsesOperation and AsyncResponsesOperation traits, where LiteLLM looks the function up in its own module and calls litellm.responses(**responses_request) or awaits litellm.aresponses(**responses_request).
    why: betterlite's Responses entry points (B932's aresponses and B1078's create) take AsyncCreateDeps, a SyncHandoff, a model resolver and a LogContext that an Interactions request does not carry, so the handler takes the operation and the caller's per-call context through the port and the route that owns those dependencies (B3507) supplies the implementation. The request in and the response-or-stream answer out keep LiteLLM's shapes, and the streaming check is the answer's variant.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/handler.py#L81-L97
  - what: The single interactions_api_handler with its _is_async flag is split into a sync interactions_api_handler and an awaited async_interactions_api_handler, and the async one takes the Responses request the caller already built.
    why: One Rust signature cannot return either a value or a future, and the flag would make every caller unwrap an enum of a response and a boxed future. The sync entry point builds the request and dispatches in LiteLLM's order, and the async one receives the same built request that the Python handler forwards across the _is_async branch.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/handler.py#L69-L77
  - what: When a chunk carries no id the iterator's fallback is interaction_<32 hex digits>, drawn once in the constructor from an injected IdSource (a v4 UUID in production); LiteLLM uses interaction_{id(self)}, the object's memory address.
    why: A memory address changes between runs, is reused after the iterator is freed and cannot be asserted in a test, while an id drawn once per iterator keeps every event of one stream correlated exactly as the address did.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/streaming_iterator.py#L144
  - what: An iterator step returns Option<Result<InteractionsStreamChunk, InteractionsStreamError<Error>>>, with None for StopIteration, None for StopAsyncIteration, Err(Upstream) for an upstream failure and Err(State) for a chunk whose text or completion event reached a boundary; the Python __next__ and __anext__ raise instead.
    why: A Rust iterator says exhaustion with None and failure with Err, so no panic or exception type crosses the layer. Both iterators drain the same pending queue before pulling, flush the terminal pair once, and stop pulling after the flush or after response.completed, as the Python methods do.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/streaming_iterator.py#L218-L265
  - what: The transform's extra kwargs always carry stream (null when the caller passed none) and carry custom_llm_provider only when the caller set one; LiteLLM writes both keys on every call, custom_llm_provider as None when it is unset.
    why: An absent key and a null value take the same default in the Responses call, and ResponsesRequest, which B3497 owns, models only the keys LiteLLM reads, so a set provider travels in its passthrough map instead.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/transformation.py#L81-L87
  - what: The iterator records litellm_metadata as a typed Params map the caller passes next to its extra kwargs; LiteLLM reads kwargs.get("litellm_metadata", {}) out of the kwargs dict it also spreads into the Responses request.
    why: betterlite injects typed values instead of one untyped kwargs dict, and the caller passes the same map in both places, so the iterator records what LiteLLM's kwargs.get returns.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/handler.py#L90-L96
  - what: The complete Responses response is transformed with a TimeZone the caller passes in; LiteLLM's datetime.fromtimestamp uses the process's local zone.
    why: Rule inject-dependencies keeps the clock out of the handler, and B3497's to_interactions_response already takes the zone for the created and updated fields.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/handler.py#L103-L106
  - what: The handlers return Result<InteractionsAnswer, InteractionsHandlerError<Error>>, with Transform for a request or response that cannot be transformed and Call for a failed Responses call; LiteLLM lets the transform's exceptions and the responses call's exception propagate unchanged.
    why: Rust reports failure through a typed error, so the route reading the handler can tell a bad request or response shape from an upstream failure, and the operation's own error type stays intact in the Call variant.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/handler.py#L57-L106
  - what: The iterator bounds what it keeps from a provider stream that never ends, checking the collected text against max_json_bytes after each text delta and the encoded interaction.completed event against max_event_bytes of ApiLimits, and a delta that crosses either limit ends the step with Err(State); LiteLLM appends every delta to collected_text and copies it into the completion event with no bound.
    why: Rule bounded-inputs keeps an untrusted stream from growing the gateway's memory without a cap, and the Responses poll accumulator bounds the same accumulation through ApiLimits. The limits arrive with the IteratorSetup the caller builds, a stream under them behaves exactly as LiteLLM's, and past them betterlite reports the boundary error instead of growing without bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/streaming_iterator.py#L143
kept_bugs:
  - what: A response.failed or response.incomplete chunk produces no event, and the end of the stream then reports interaction.completed with whatever text arrived, so a failed Responses stream reaches the Interactions caller as a successful interaction.
    why: The new Interactions schema has no error event, and the handler's only terminal event is interaction.completed, so a client that waits for that event would hang if betterlite suppressed it; copying LiteLLM keeps a working setup's event sequence unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/interactions/litellm_responses_transformation/streaming_iterator.py#L126-L209
