task: B3693
deviations:
  - what: Pattern text, custom regex sources, blocked-word files, and generated masking output are bounded to one MiB.
    why: Prevent unbounded allocations and pathological file reads; matching also retains the regex engine's backtracking limit.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L819
  - what: Duplicate blocked-word keys emit a warning while retaining the last entry.
    why: Preserve the resulting lookup without silently replacing configuration.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L810
