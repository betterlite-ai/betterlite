task: B3873
deviations:
  - what: >-
      Custom metadata labels and custom tags arrive through the resolved settings
      (B3872) and are passed at metric time, not read from the module-level
      litellm.custom_prometheus_metadata_labels and litellm.custom_prometheus_tags.
    why: >-
      Betterlite has no module-level mutable state; the projection functions take the
      configured keys as arguments so they stay pure and testable. The labels produced
      are the same ones LiteLLM derives from its globals.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4690-L4715
  - what: >-
      PrometheusLabelFactoryContext is built once per request and reused for every
      metric label set, and prometheus_label_factory fills a metric from it.
    why: >-
      LiteLLM rebuilds the model dump, the tag labels and the end-user label on every
      metric. Precomputing them once in the context removes that repeated work and
      changes no label.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4626-L4683
  - what: >-
      The end_user label is resolved through the existing cost-tracking policy, so it
      is only resolved when that policy opts Prometheus in.
    why: >-
      LiteLLM calls get_end_user_id_for_cost_tracking, which applies its own settings;
      betterlite delegates to the same policy (B1716) instead of re-deriving the
      opt-in rule here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4658-L4663
  - what: >-
      prometheus_label_factory takes a LabelSource (a stored context or the raw values
      with settings) instead of an optional label_context plus an unused tag parameter.
    why: >-
      LiteLLM's tag parameter is never read and no caller passes it, and the settings
      the raw path needs come from module state that Rust has to pass in. The source
      enum keeps each path from receiving arguments it never reads.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus.py#L4626-L4655
  - what: >-
      The lazy imports in the helper module are not ported: get_end_user_id_for_cost_tracking
      and get_custom_labels_from_tags are called directly, and no function object is
      cached.
    why: >-
      LiteLLM imports these names on first use to avoid loading litellm.utils at import
      time and to break the prometheus module cycle. Rust resolves both calls at compile
      time, so there is no import cost and no cycle to break, and the resolved and cached
      answers are unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/prometheus_helpers/__init__.py#L17-L31
  - what: >-
      Tag wildcard patterns are compiled in tag_wildcard_matching.rs with regex::escape,
      a star-to-(.*) replacement and a start anchor, instead of calling matcher_source
      in crates/betterlite-router/src/wildcard_catalog.rs, where B367 ported the same
      PatternMatchRouter._pattern_to_regex transform.
    why: >-
      B367 owns wildcard pattern compilation in this task's out_of_scope, but
      betterlite-router depends on betterlite-logging, so logging cannot call it without
      closing a crate cycle, and matcher_source is private to that crate. The local
      compile keeps the same escaping, star replacement and start anchor until
      matcher_source moves to a crate both depend on, such as betterlite-models; until
      then the two copies must change together.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pattern_match_deployments.py#L89-L111
