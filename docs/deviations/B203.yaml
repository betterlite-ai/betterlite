task: B203
deviations:
  - what: A streamed usage chunk carries the provider's token counters and no cost field; betterlite does not price a call.
    why: betterlite has no pricing table, so a completion it streams cannot report what the call would cost.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L4242-L4272
  - what: A streamed completion answer carries x-litellm-model-api-base, which LiteLLM's streamed answers leave out.
    why: the stream renderer reuses the success headers that also serve non-stream answers, and those name the deployment's api base.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L1782
  - what: A token-id prompt reaching a chat-catalog deployment from the text route answers 400 invalid_request_error instead of being sent as message content.
    why: the prompt-to-message rebuild refuses a prompt it cannot write as typed chat content, and a 400 names the caller's mistake where LiteLLM's provider error would not.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7644-L7645
  - what: The 500 for an unmapped prompt names the format without LiteLLM's embedded prompt text and issue link.
    why: betterlite builds message text from typed fields rather than from Python's repr of the caller's value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7647-L7648
  - what: A provider failure before a completion stream starts answers an internal_server_error envelope whose message is betterlite's own.
    why: the provider's exception text is Python-specific and carries the SDK's call detail, so betterlite writes the failure itself.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5881-L5888
kept_bugs:
  - what: The fine-tuned completion models on the chat route answer the raw text_completion body, model renamed to the caller's, instead of a chat completion.
    why: LiteLLM's completion() sends these two models to the text endpoint without converting the answer back, and a setup that calls them through the chat route relies on reading that text body.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5881-L5888
