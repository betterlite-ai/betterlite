task: B203
deviations:
  - what: A streamed usage chunk carries the provider's token counters and no cost field; betterlite does not price a call.
    why: betterlite has no pricing table, so a completion it streams cannot report what the call would cost.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L4242-L4272
  - what: A streamed completion answer carries x-litellm-model-api-base, which LiteLLM's streamed answers leave out.
    why: the stream renderer reuses the success headers that also serve non-stream answers, and those name the deployment's api base.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L1782
  - what: A token-id prompt reaching a chat-catalog deployment from the text route answers 400 invalid_request_error instead of being sent as message content.
    why: the prompt-to-message rebuild refuses a prompt it cannot write as typed chat content, and a 400 names the caller's mistake where LiteLLM's provider error would not.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7644-L7645
  - what: The 500 for an unmapped prompt names the format without LiteLLM's embedded prompt text and issue link.
    why: betterlite builds message text from typed fields rather than from Python's repr of the caller's value.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7647-L7648
  - what: A provider failure before a completion stream starts answers the provider error object's type and param like LiteLLM, and its message is betterlite's own SDK error text rather than the Python exception's text.
    why: the status, type and param come from dispatching the error object exception_type receives, while the message is the SDK error's Display and cannot be Python's exception string.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7448-L7455
  - what: A text request's extra_headers does not become request headers on the chat provider call; betterlite's chat call sends only authorization, accept and organization.
    why: the chat call builds its own header set in the chat executor, which this bridge cannot reach, so the headers are dropped rather than applied.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/openai.py#L673-L696
  - what: The 400 for a parameter the text config does not support writes betterlite's own message, and it ignores litellm_settings.drop_params, where LiteLLM names its exception class, quotes drop_params advice, and drops the parameter when drop_params is set.
    why: betterlite builds message text from typed fields and this bridge sees no drop_params setting.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4527-L4538
  - what: A chat request to a text-completion-codestral or text-completion-inception deployment is checked against the OpenAI text config's parameter list and mapped the OpenAI way, so codestral's suffix, min_tokens and random_seed are refused where the provider accepts them, a max_completion_tokens is refused where both providers accept it, and a codestral seed reaches the provider as seed rather than random_seed.
    why: one request builder serves all three text endpoints, and the provider-specific text configs are not ported into the bridge.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/codestral/completion/transformation.py#L40-L50
  - what: A streamed text request whose caller set stream_options.include_usage to false reaches the provider with that false, where LiteLLM's proxy replaces the option with include_usage true and strips the usage chunk itself before the client sees it.
    why: the bridge keeps a caller's stream_options, the same way betterlite's chat path does, and hides the usage chunk in its own stream rendering.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_request_processing.py#L520-L529
kept_bugs:
  - what: The fine-tuned completion models on the chat route answer the raw text_completion body, model renamed to the caller's, instead of a chat completion.
    why: LiteLLM's completion() sends these two models to the text endpoint without converting the answer back, and a setup that calls them through the chat route relies on reading that text body.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L5881-L5888
