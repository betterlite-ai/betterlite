task: B4712
deviations:
  - what: A written row's JSON columns (credentials, env_vars, mcp_info, tool_name_to_display_name, tool_name_to_description) are parsed from their stored text before the row is decoded, where LiteLLM hands the stored value straight to LiteLLM_MCPServerTable.model_validate, which rejects a JSON string.
    why: betterlite writes those columns the way LiteLLM does, through safe_dumps, so its own read returns JSON text from the JSONB column; a row written by a working Prisma client carries the parsed value, and decoding both shapes to the same server keeps a text row readable instead of failing the write that just succeeded.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L388-L415
  - what: delete_mcp_server returns a typed DeletedServer holding server_id and server_name; LiteLLM returns the raw prisma row.
    why: Rust has no untyped row handle at that seam, and those two fields are what a caller reads from the deleted record and what the cleanup log names.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L886-L952
  - what: Per-user token-cache invalidation is passed in as a TokenCacheInvalidation handle by both delete_mcp_server and the draft prune (create_draft_mcp_server), where LiteLLM imports global_mcp_server_manager inside delete_mcp_server when no callable was given.
    why: betterlite has no module-level proxy state; the caller supplies the manager's invalidation, the (user_id, server_id) cache keys dropped are the same ones, and an invalidation failure is logged and never turns a completed delete into an error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L940-L951
  - what: The identifier-free write seam is betterlite-db's write_if_identifier_free rather than an inline Prisma transaction; this task hands it the candidate server_name/alias, the excluded server_id and the insert or update closure, and the alias-clear case re-locks the stored server_name before writing.
    why: The advisory-lock transaction, its keys and the conflict query live in the shared MCP table access from B4711, so a server write and a server read answer one implementation of the same rules instead of two that can drift.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_experimental/mcp_server/db.py#L583-L623
