task: B5972
deviations:
  - what: A created_at without a UTC offset is read as UTC.
    why: Python's datetime.fromisoformat gives a naive value and timestamp() then uses the server's local time zone, which a Rust service cannot copy without reading the machine zone. watsonx.ai sends a Z suffix, so real replies are unaffected.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/watsonx/completion/transformation.py#L307-L313
  - what: A gpt-oss model name that also matches one of the generic prompt families (for example one containing tiiuae/falcon) gets no prompt instead of the fetched Hugging Face template, and a chat_template.jinja render that is byte-equal to the joined message texts counts as a failed fetch.
    why: The Hugging Face fetch and selection live in PromptFactory::hf_chat_template, which factory.rs keeps private; the branch reaches B215's fetch through the public generic prompt_factory, whose family branches answer without storing a tokenizer config for the model, so a model with no stored config counts as an unresolved fetch, and whose error path answers default_pt, so the separate template file is told apart by that text.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/watsonx/chat/transformation.py#L118-L128
  - what: prompt_factory's watsonx branch answers an unsupported error instead of applying apply_prompt_template.
    why: That branch lives in crates/betterlite-prompts/src/factory.rs and its test in crates/betterlite-prompts/src/factory/tests.rs, outside this task's scope; the message-to-prompt function applies the same lowercased template call the branch would make, so the conversion result matches.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L5320-L5324
