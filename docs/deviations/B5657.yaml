task: B5657
deviations:
  - what: "Every response object answers the in operator with its stored field names, where LiteLLM's Message has no __contains__ and Python falls back to iterating its pydantic field values."
    why: "The task asks the base for __contains__, and field membership is what the callers of the classes that do define it, Choices, Delta, Usage and ModelResponse, already get."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L1487-L1497
  - what: "The TypedDicts in betterlite.types.completion report their Required keys in __required_keys__, where LiteLLM's module uses from __future__ import annotations and every key lands in __optional_keys__."
    why: "The keys and their required or optional status are the same; only the runtime metadata differs, and the postponed annotations that cause LiteLLM's view are banned by the Python rules."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/completion.py#L1
  - what: "StreamingChatCompletionChunk stores moderation as the value the caller passed and dumps it unchanged, where LiteLLM hands it to OpenAI's Moderation model, which fills that model's defaults."
    why: "The chunk class lives on OpenAI's SDK model in LiteLLM, and betterlite's wheel has no openai dependency; every other chunk field and the converted choices match."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L2057-L2065
  - what: "ModelResponse keeps the hidden_params and _response_headers it is built with, where LiteLLM assigns them before pydantic's __init__ resets the private attributes, so it ends with {} and None."
    why: "Losing both values is lost data no working setup can rely on; the attributes the task asks the base to carry stay readable and out of model_dump."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/utils.py#L2237-L2245
