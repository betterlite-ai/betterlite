task: B4028
deviations:
  - {what: "The report's Time and Next Run values come from one read of an injected clock; LiteLLM reads the wall clock twice, once at the Time field and once when it appends Next Run, so the two values differ by the microseconds between the calls.", why: "The task asks for an injected clock instead of get_utc_datetime and time.time(). Reading it once keeps Time and Next Run consistent and lets a test pin both.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L422-L469"}
  - {what: "A poll that fails (the alert sender errors, a deployment's api base cannot be resolved, or the clock cannot be stamped) is logged and the loop sleeps and polls again; LiteLLM lets the exception escape the while True loop, which ends the asyncio task and stops every later report until the process restarts.", why: "A dead scheduler loses all future daily reports. Logging the error and keeping the loop alive keeps the feature running, and the error still reaches the log through tracing::error.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1817-L1823"}
  - {what: "The poll loop returns when the injected sleeper reports that its sleep was cancelled; LiteLLM's loop runs until its asyncio task is cancelled from outside.", why: "A Rust task ends through the sleeper port the server owns rather than through task cancellation, and the loop stops at the same point, before the next poll.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1819-L1823"}
  - {what: "A report-window stamp the cache returns as a JSON integer is read as a send time; LiteLLM only accepts a Python float (isinstance(report_sent, float)), so an integer stamp never spaces a report.", why: "docs/compatibility.md: a JSON number is a number whatever its spelling, and the cache stores the stamp it was given. Accepting an integer stamp keeps the interval check working across cache implementations instead of silently never reporting.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1775"}
  - {what: "A cached boolean counts as no metric; Python's isinstance(value, (int, float)) accepts True as the number 1, so a cache holding true contributes a failed request.", why: "docs/compatibility.md: a value of the wrong type is not coerced into the declared type, and a metric is a number.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L379-L381"}
kept_bugs:
  - {what: "A top-five failed-request id whose deployment the router does not know aborts the whole send: no alert is sent and no metric is reset, so every count stays in the cache until a later report succeeds.", why: "LiteLLM returns False from send_daily_reports at that point, before the reset and the alert. The task's pitfall asks for exactly this split between the two sections, and a working setup only sees the effect of a malformed router entry.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L429-L433"}
  - {what: "A top-five slowest id whose deployment the router does not know still produces a row, with an empty deployment name and a base looked up for an empty model, and its metric is reset with the rest.", why: "LiteLLM degrades the missing deployment to an empty name and continues the loop instead of aborting, so the two sections disagree on the same input. Copied as the source behaves.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L451-L455"}
  - {what: "A deployment whose api base cannot be found renders an empty base in the failed-request section and the text None in the slowest section.", why: "LiteLLM converts the missing base to an empty string only in the failed loop; the slowest loop interpolates the None straight into the message. Copied as the source behaves, since a Slack reader only sees the difference when a deployment has no base.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L456-L461"}
  - {what: "The report window is stamped even when send_daily_reports reported that it sent nothing, which happens with no metrics, a failed batch read or an aborted report; the interval restarts and the next attempt waits a full frequency.", why: "LiteLLM ignores the boolean send_daily_reports returns and stamps the window after the call. Copied as the source behaves.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L1791-L1797"}
  - {what: "The cache reset runs before the alert is sent, so a failed Slack send loses the day's counts: they are already zero when the helper returns the error without stamping the window.", why: "LiteLLM resets the metrics at the pipeline call and only then calls send_alert. Copied in that order as the source behaves.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/SlackAlerting/slack_alerting.py#L463-L477"}
