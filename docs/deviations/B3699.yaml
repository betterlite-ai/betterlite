task: B3699
deviations:
  - what: Tool call arguments that Python's json.loads accepts but serde_json does not, such as NaN or Infinity, a lone surrogate escape, an integer past u64/i64, or a document nested past serde_json's 127-container limit (one container is the parse wrapper) while DEFAULT_MAX_RECURSE_DEPTH is at or above that depth, go through the whole-string text filter, where LiteLLM parses the tree and filters each value; past CPython's json recursion limit (about a thousand levels) LiteLLM's json.loads raises an uncaught RecursionError and the request fails with a 500, while betterlite returns the depth 400 when DEFAULT_MAX_RECURSE_DEPTH is below the nesting and the whole-string text filter when it is at or above; malformed JSON nested past that parse limit is reported as the depth error, and that depth error is decided from the raw nesting before any value is filtered, where LiteLLM reports a block from an earlier value first.
    why: serde_json rejects the non-standard constants and unpaired surrogates, its parser stops at 127 levels of nesting, and GuardrailValue cannot carry an integer wider than u64; text filtering still applies every masking and blocking rule to the whole string, and the depth 400 replaces a 500 that no working setup can rely on.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1853
  - what: 'A tool call argument number that overflows f64, such as 1e999 in {"n": 1e999, "s": "secret"}, becomes an infinite Decimal in betterlite, and once another value in the document is rewritten the whole arguments string goes through the text filter, so the provider receives {"n": 1e999, "s": "[SECRET_REDACTED]"} where LiteLLM keeps the number as inf through its number branch and json.dumps writes {"n": Infinity, "s": "[SECRET_REDACTED]"}; with no other value rewritten both return the original string.'
    why: 'GuardrailValue carries the number as an f64, and serde_json writes a non-finite float as null where Python''s json.dumps writes Infinity, so serializing the rewritten tree would drop the number; text filtering keeps the original literal and still applies every masking and blocking rule to the whole string. The oracle cannot carry an infinity through its JSON channel, so the behavior test is the proof.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1859
  - what: An image description response with no choices fails with a reported completion error, where LiteLLM reads choices[0] and raises IndexError.
    why: The empty list is an upstream response the guardrail cannot describe, and naming it beats an unhandled index error in the request path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1518
  - what: A failing image description call is reported only after every concurrent call has finished, and the error is the first failure in image order; LiteLLM's asyncio.gather raises the first failure to complete and leaves the other calls running.
    why: join_all drives every description to completion in one future, so no call is left detached and the reported error is deterministic.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/content_filter.py#L1487
