task: B5990
deviations:
  - what: The provider mapping cache is held by a ProviderMappingCache value passed in by the caller, not by a function-level lru_cache.
    why: The code rules forbid module state; the size (128) and the failures-not-cached rule stay the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/huggingface/common_utils.py#L60-L102
  - what: transform_request strips cache_control from the messages it sends to the Hugging Face router.
    why: The task reuses B503's shared OpenAI message transform, which removes cache_control for every provider that is not OpenAI; LiteLLM's HuggingFaceChatConfig.transform_request only calls _transform_messages, so the field reaches the router there. A working Hugging Face setup cannot rely on an Anthropic-only cache field surviving the router, and copying the media and file transform a second time would duplicate it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/huggingface/chat/transformation.py#L123-L156
