task: B7885
deviations:
- what: "Request types are dicts, as in LiteLLM."
  why: They are TypedDicts there too, so a caller sees the same shape.
  link: ""
- what: This task has no helper oracle cases.
  why: The functions call a native session, so pytest compares both packages against one local server in crates/betterlite-python/tests/test_evals_calls.py.
  link: ""
- what: "`client` or `shared_session` in kwargs raise `UnsupportedCallArgument` naming the argument, where LiteLLM passes both to its HTTP handler."
  why: They are live Python HTTP clients; betterlite makes its own request through its Rust transport, so accepting one would silently ignore the client the caller gave.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L216-L217
- what: "A `litellm_logging_obj` in kwargs is dropped, so the caller's logging object, its `update_from_kwargs` call and its success and failure handlers never see an eval call; the native session logs the call with its own logging state and a silent sink."
  why: The object is Python state a Rust call cannot reach, and keeping it would promise records that never arrive; every eval function builds the logging state the core service asks for instead.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L152-L153
- what: "`delete_eval` and `cancel_eval` with a provider that has no evals API config answer a `BadRequestError` (400), where LiteLLM's `ValueError` goes through `exception_type` and comes out as an `APIConnectionError` (500)."
  why: "The provider name is the caller's input and the call can never succeed; B3423 made that call for the native lifecycle service, and these functions surface the class it chose."
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L879-L884
- what: "The async twins set the async keyword, call their sync twin and await the coroutine it answers, instead of running the sync function through functools.partial, contextvars.copy_context and loop.run_in_executor."
  why: The native operation is async end to end, so there is no blocking body to hand to an executor; the event loop stays free and both names return the same result or the same mapped error.
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L44-L110
- what: "A value outside its declared type (a non-string header value, or metadata, extra_query and extra_body values that are not JSON) raises a 400 that names the field, where LiteLLM's dict updates pass the object on and httpx or the provider fails later."
  why: "docs/compatibility.md reads a value outside the declared type as an error naming the field; the typed request model cannot carry the wrong shape."
  link: ""
kept_bugs:
- what: "create_eval accepts `metadata` and never puts it on the request; only extra_body can add a metadata body field."
  why: "LiteLLM builds create_request from data_source_config, testing_criteria, name and extra_body only, so a working setup that passes metadata today sees it ignored; changing that would change the wire body against LiteLLM."
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L166-L175
- what: "create_eval, get_eval, update_eval, delete_eval and cancel_eval accept `extra_query` and never put it on the request; only list_evals reads it."
  why: "LiteLLM declares the parameter on all six and reads it only in list_evals, so a working caller that sets it on the other five relies on it being ignored."
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/evals/main.py#L113-L221
- what: "list_evals sends limit, after, before, order and order_by only when they are truthy, so an explicit limit of 0 or an empty cursor string is dropped, where docs/compatibility.md would use an explicit 0 or \"\" as given."
  why: "LiteLLM's list transform skips every falsy value, and a setup switching from LiteLLM keeps the query it sent before; sending limit=0 would change the request that setup relies on."
  link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/evals/transformation.py#L120-L131
