task: B224
deviations:
  - what: >-
      Tool-history repair skips only source result rows that it has reinserted, preserving intervening messages.
      LiteLLM advances by the number of matching results from the assistant row, which can skip an intervening user
      message and then process an already-reinserted result a second time.
    why: >-
      The skip count is not tied to source indices; on malformed history with an intervening message it loses user
      content. Index-based consumption preserves source messages and avoids duplicate tool results.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L2278-L2283
  - what: >-
      The pure Rust transforms do not emit LiteLLM's debug messages for text normalization, missing results and
      orphan results, or the warning for duplicate results.
    why: >-
      Logging is a side effect and conflicts with the task's requirement that these transforms remain pure; the
      repaired values and dropped rows are covered by behavior tests.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/prompt_templates/factory.py#L2011-L2320
  - what: >-
      sanitize_messages rejects input with more than 1024 messages, or an assistant row with more than 1024
      tool_calls, with a typed HistoryError. LiteLLM's sanitize_messages_for_tool_calling has no such limit.
    why: >-
      declared_tool_call_ids and the tool-row scans it feeds are linear in the size of a single message or turn;
      without a cap, a sub-1MB request with tens of thousands of tool_calls or tool rows costs the worker
      quadratic time. The cap mirrors the MAX_COMPLETION_MESSAGES bound sibling messages.rs already applies to
      completion history.
    link: ""
