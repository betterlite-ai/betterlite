deviations:
  - {what: AgentResponse spend and search_score use Decimal instead of LiteLLM float fields., why: Exact decimal arithmetic is required for money and budget decisions., link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L290-L323}
  - {what: Unknown fields are rejected on all modeled records., why: Strict boundaries catch schema mismatches instead of silently dropping data., link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L140-L175}
  - {what: Webhook credentials are omitted from serialization., why: SecretString keeps credentials out of Debug output and serialized responses., link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L187-L213}
  - {what: Rust records permit field changes through explicitly mutable ownership., why: Rust bindings provide default immutability rather than Pydantic runtime freezing; callers must keep validated records immutable., link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/agent_identity.py#L10-L96}
