task: B8312
deviations:
  - {what: "The ten cases drive the regional_host_dispatch arms through the b8312 helper operation instead of POSTing to the booted proxy.", why: "No route reaches these providers yet: provider.rs answers UnavailableAdapter for every slug outside its fixed set, so a proxy request never reaches regional_host_dispatch, and the helper is the only seam that runs the real dispatch functions next to LiteLLM's public entry points. The route wiring belongs to B2230 and B5360.", link: ""}
  - {what: "The cases compare the resolved request (URL, the authorization and content-type headers, and the body for the embedding arms) or the failure, not the reply body; the speech case compares the voice and the params the handler receives; the GigaChat cases compare the credential the arm resolves rather than its wire request.", why: "The request transforms and the replies belong to the provider configs of B8170 to B8179 and to the shared HTTP handlers, and the arms only resolve the values they hand them. The MiniMax speech mapping is the arm's own step before the handler runs, so the helper calls MinimaxTextToSpeechConfig.map_openai_params, the public class method litellm.speech itself calls, rather than the untyped speech() entry. The GigaChat OAuth exchange belongs to B9230, B043 and B9232, so the resolved credential is the arm's observable.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7313-L7334"}
  - {what: "A missing embedding key fails with a typed error that carries no HTTP status, where LiteLLM wraps the arm's ValueError into APIConnectionError with status 500, and the helper turns LiteLLM's APIError into a status-less failure so the missing-key cases compare that both sides fail.", why: "That 500 comes from LiteLLM's exception mapper, not from a provider reply, and betterlite's dispatch error has no HTTP response to carry. The cases still prove that no request is sent and that both sides fail.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L7358-L7371"}
  - {what: "The MiniMax chat success record writes a null original_response, where LiteLLM passes post_call the ModelResponse the handler built.", why: "At this seam the handler returns a reply without a JSON form, so a null keeps the hook firing without inventing a body, as B8157's hosted_vllm arm records it.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L2541"}
  - {what: "The NLP Cloud stream and async records write a null original_response, where LiteLLM passes the opened stream wrapper or the response.", why: "The stream wrapper has no JSON form in Rust either; the record still fires only when the call streams or is async, as LiteLLM's condition does.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L2984-L2989"}
  - {what: "A MiniMax speech reply that cannot be decoded comes back as the raw upstream reply, where LiteLLM raises MinimaxException with status 500.", why: "betterlite's TextToSpeechConfig::speech_response has no error channel, so the config cannot raise; the raw reply keeps the upstream status and body, and the speech_response test pins the pass-through.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/minimax/text_to_speech/transformation.py#L379-L392"}
kept_bugs:
  - {what: "The NLP Cloud URL is the base, then the model, then \"/generation\", with no separator, so a base that does not end in \"/\" gives a wrong URL.", why: "Working deployments pass the GPU base ending in \"/\" or rely on the default that does, and betterlite copies LiteLLM's concatenation as the task asks.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/nlp_cloud/chat/handler.py#L51-L55"}
