task: B897
deviations:
  - what: >-
      A page size of zero or less, or a page and size whose skip offset overflows, is a typed
      Pagination error before any query runs.
    why: >-
      LiteLLM divides by size for total_pages, which raises ZeroDivisionError for zero, and
      Python's unbounded integers accept any offset; Rust would panic on the division and the
      checked multiply would wrap. B782 validates size ge=1 and bounds the page, so no working
      setup reaches either input, and a typed error keeps the failure in the caller's error path.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L7199-L7203
kept_bugs:
  - what: >-
      The PRISMA contains operator reaches SQL as an unescaped ILIKE pattern, so a percent or
      underscore in a key alias or search filter acts as a wildcard and a backslash acts as
      LIKE's escape character.
    why: >-
      LiteLLM builds {"contains": value, "mode": "insensitive"} and Prisma wraps it in percent
      signs without escaping, so a search for "100%" matches every alias starting with 100 and
      one for "a_b" matches any single character between a and b. A proxy that has always been
      searched this way can rely on those matches, so betterlite reproduces the pattern and the
      Postgres test pins percent, underscore and backslash behavior.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/key_management_endpoints.py#L6893-L6900
