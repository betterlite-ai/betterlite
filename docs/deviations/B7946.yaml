deviations:
  - what: "Fields whose LiteLLM type comes from a module with no Python mirror owner keep the declared field name and default but carry a raw JSON shape where the inner type is large: CustomerResponse.litellm_budget_table and object_permission, BlockUsersResponse.blocked_users, UserListResponse.users, BulkUpdateUserRequest.users and user_updates, BulkUpdateKeyRequestItem.object_permission, KeyUpdateFields.budget_limits, model_max_budget, model_rpm_limit, model_tpm_limit and metadata, CustomKeyPolicyRequest.existing_key, effective_key and request, and ModelGroupInfoProxy.configurable_clientside_auth_params are dict[str, JsonValue], list[dict[str, JsonValue]] or the fields of LiteLLM's base model."
    why: "litellm.proxy._types, litellm.models.*, litellm.models.verification_token and litellm.types.router have no betterlite Python module to import. Small shapes are modeled with private classes that keep their required keys and Literal values (BulkNewUserItem.teams, budget_limits and object_permission); the fields listed above keep the raw JSON shape instead of duplicating classes other tasks will own."
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_types.py#L1289-L1327
