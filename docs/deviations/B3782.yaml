task: B3782
deviations:
  - what: 'A whitespace-only api_key or application_id counts as unset, so the environment variable fills it in. LiteLLM keeps the whitespace: an api_key of "   " is sent as "Bearer    " and an application_id of "   " resolves to None at call time without ever consulting the environment variable.'
    why: 'Betterlite trims every configured string once at startup, which is what the task''s validation rule asks for (whitespace-only strings are treated as None), and it keeps the environment fallback working when a config file holds a blank value.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma_v2.py#L70-L84
  - what: 'NOMA_MONITOR_MODE and NOMA_BLOCK_FAILURES are read with betterlite''s boolean environment parser, so "1", "yes" and "on" also turn them on and "0", "no" and "off" turn them off. LiteLLM only compares the lowercased text with "true", so any other text counts as false.'
    why: 'betterlite reads every environment value into its field''s type with one parser (docs/compatibility.md), and the two spellings LiteLLM documents, "true" and "false", behave the same in both.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma_v2.py#L76-L84
  - what: 'A GUARDRAIL_INTERVENED response whose texts or images list holds an element that is not a string, or whose tools list holds an entry that is not a tool definition with a string type, fails the scan as a guardrail_failed_to_respond error. LiteLLM copies such lists into the typed inputs as they are.'
    why: 'GenericGuardrailAPIInputs declares texts and images as lists of strings and tools as a list of tool definitions, so a response outside those types is refused instead of being handed to the next guardrail, and block_failures decides whether the request then fails.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma_v2.py#L257-L274
  - what: 'A litellm_metadata or metadata value that is not an object is skipped when the application_id falls back to user_api_key_alias. LiteLLM calls .get on it and raises AttributeError before the scan and before any record is written.'
    why: 'A non-object metadata is outside the shape the request data declares, and skipping it keeps a malformed metadata from turning a request into a 500 with no observability record.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma_v2.py#L298-L303
  - what: 'A Noma v2 response body larger than 1 MiB fails the scan as a guardrail_failed_to_respond error instead of being read whole. LiteLLM reads whatever size the Noma endpoint sends.'
    why: 'Betterlite reads every guardrail response through its shared capped-body helper, so an endpoint that answers with an unbounded body cannot exhaust memory; block_failures decides whether the request then fails.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/noma/noma_v2.py#L216-L223
  - what: 'A Noma v2 scan writes its standard_logging_guardrail_information record but emits no OTEL guardrail span from here.'
    why: 'The shared record writer takes the span sink from its caller, and the sink belongs to the hook dispatcher that runs the guardrail, so the scan writes its record with a no-op sink until that caller passes one.'
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/custom_guardrail.py#L1296-L1308
