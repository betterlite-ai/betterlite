task: B1385
deviations:
  - what: >-
      vertex_project and vertex_location fall back through the shared Vertex settings section, so
      litellm_settings.vertex_project, litellm_settings.vertex_location and the legacy VERTEX_LOCATION also
      fill them. LiteLLM's ingestion constructor reads only VERTEXAI_PROJECT and VERTEXAI_LOCATION.
    why: >-
      The section already resolves those settings for every other Vertex call, and one Vertex identity per
      deployment is what a config author expects. The vector_store record still wins over all of them.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/rag_engine/ingestion.py#L82-L88
  - what: >-
      A negative import_timeout becomes a zero-length deadline, so an import that is not ready on the
      first poll fails with a timeout error. LiteLLM hands the negative integer to
      vertexai.rag.import_files as its timeout.
    why: >-
      A declared integer under 0 can only mean "no time left"; Duration has no negative value, and failing
      fast here beats an SDK call that cannot succeed.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/rag_engine/ingestion.py#L177-L182
  - what: >-
      A chunking_strategy key other than chunk_size, chunk_overlap, separators, type, static and
      white_space_config is refused with a load error that names the field. LiteLLM's
      transform_chunking_strategy_to_vertex_format reads the declared keys and ignores every other one.
    why: >-
      A misspelled key silently losing its value is the failure the load errors exist to catch, and
      docs/compatibility.md rejects values the declared type cannot hold.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/rag_engine/transformation.py#L88-L89
  - what: >-
      A chunk_size or chunk_overlap outside the signed 32-bit range is refused with an error that
      names the field before any request leaves the process. LiteLLM passes the integer to the SDK,
      which rejects it while encoding the protobuf request.
    why: >-
      The Vertex field is int32, so the value cannot be used; naming the field at the boundary turns an
      opaque transport error into a load-time answer.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/rag_engine/transformation.py#L97-L102
  - what: >-
      import_timeout bounds only the wait for the import operation after it is submitted, and the
      submission itself is capped at 60 seconds. LiteLLM hands import_timeout to
      vertexai.rag.import_files, which sends the submission RPC under the SDK's own request timeout
      and applies import_timeout to Operation.result alone.
    why: >-
      A submission that takes longer than import_timeout but returns a finished operation succeeds in
      LiteLLM, so keeping the deadline on the wait alone preserves that outcome. The 60 second
      submission cap matches the SDK's default request timeout and bounds the RPC betterlite sends.
    link: >-
      https://github.com/googleapis/python-aiplatform/blob/v1.133.0/vertexai/rag/rag_data.py#L616-L626
  - what: >-
      A store request whose content is over 512 MiB, whose filename is over 1024 bytes or whose
      content type is over 255 bytes is refused with an error that names the field, before the bytes
      are copied into an upload. LiteLLM passes content, filename and MIME type to acreate_file
      without any size check.
    why: >-
      The upload copies the request, so an unbounded input allocates without limit before the provider
      can refuse it. The file cap is betterlite's shared MAX_UPLOAD_SIZE_BYTES, and the filename bound
      is the size of a GCS object name.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/rag_engine/ingestion.py#L131-L139
kept_bugs:
  - what: >-
      wait_for_import false calls the SDK's async import without awaiting it, so no import request leaves
      the process while the store reports the upload as a success and the log says Import started
      asynchronously. betterlite keeps that upload-only success and the log line.
    why: >-
      A working setup at the pin relies on the store returning after the upload with the corpus id and the
      GCS URI; sending a real background import would change the corpus contents behind its back.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/rag_engine/ingestion.py#L184-L191
