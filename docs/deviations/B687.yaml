task: B687
deviations:
  - what: >-
      A litellm_params.timeout that is negative, NaN or infinite is refused with a Timeout error before any
      thread request, where LiteLLM forwards it into the Azure SDK client constructor, which accepts the value
      and sends it as the request timeout.
    why: >-
      betterlite carries the request deadline as a std::time::Duration, which cannot represent a negative or
      non-finite duration; a timeout that can never be a deadline is refused instead of handed to the HTTP client.
      The thread facades build their client through the same B686 preparation that refuses it.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/assistants.py#L497-L553
  - what: >-
      The OpenAI SDK's implicit retries of 408, 409, 429 and 5xx replies are not repeated for threads: a failed
      create or retrieve returns the first status error, and max_retries is carried on the client's inputs but
      not acted on here.
    why: >-
      Retry and backoff policy belongs to the shared transport task B173, so this module sends each thread
      request once and leaves retry planning to that layer.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/assistants.py#L425-L457
  - what: >-
      The SDK constructor's OPENAI_ORG_ID, OPENAI_PROJECT_ID and OPENAI_CUSTOM_HEADERS fallbacks are not read for
      thread clients: betterlite sends no OpenAI-Organization or OpenAI-Project header, and no header parsed from
      OPENAI_CUSTOM_HEADERS, while LiteLLM's AzureOpenAI inherits all three from the SDK constructor.
    why: >-
      The environment is resolved by betterlite-config and a provider leaf may not read it, so the thread client
      takes only what its caller passes.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/assistants.py#L534-L543
kept_bugs:
  - what: >-
      Only the literal True acreate_thread/aget_thread flag selects the async SDK client: any other truthy facade
      value, such as 1 or "yes", keeps the sync client for threads exactly as it does for the assistant facades.
    why: >-
      A caller that passes a truthy flag other than True gets the sync client from LiteLLM today, so its thread
      call runs on the sync client here too; widening the check would silently move those calls to the async client.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/assistants.py#L521-L523
