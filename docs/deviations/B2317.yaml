task: B2317
deviations:
  - what: >-
      is_persistable_budget_duration and budget_duration_error propagate a malformed reset setting as a typed
      settings error, while LiteLLM builds BudgetResetSettings inside the predicate's try block and catches the
      resulting pydantic ValidationError or clock ValueError as "not persistable".
    why: >-
      The task asks the predicate to catch exactly the source's ValueError and OverflowError duration categories and
      to let unrelated failures propagate. betterlite validates litellm_settings.timezone and budget_reset_time in
      the config loader before any consumer sees them, so a working setup never reaches this path; hand-set module
      settings are the only way to observe the difference.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/common_utils/timezone_utils.py#L83-L93
