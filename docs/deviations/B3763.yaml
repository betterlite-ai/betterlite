task: B3763
deviations:
  - what: An api_base whose host the URL parser reads as a blocked cloud-metadata IPv4 address in a form Python's int(host, 0) rejects, such as dotted octal or hex parts (0251.0376.0251.0376, 0xa9.0xfe.0xa9.0xfe), is refused. LiteLLM accepts it.
    why: The WHATWG host parser that reqwest uses connects to 169.254.169.254 for those spellings, so accepting them would let the blocked address through the very check that is meant to stop it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L109-L124
  - what: A Compresr response body over 1 MiB is treated as unreadable and goes through the fail_open or fail_closed policy. LiteLLM reads the whole body.
    why: An api_base the operator points at a hostile server could otherwise make the gateway buffer an unbounded body in memory.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L770-L783
  - what: api_base is validated on the WHATWG URL parse that reqwest connects with. A URL Python's urlparse sees no host in (http:api.compresr.ai, http:///api.compresr.ai) is accepted and checked against the host the request will use, and a URL Python accepts but the WHATWG parser refuses (a port above 65535, non-digit port text) is refused.
    why: The checked host must be the host the client connects to, and that is the WHATWG parse; urlparse and the HTTP client can read one URL differently. Neither direction lets through a URL whose WHATWG host is a blocked cloud-metadata address.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L125-L144
  - what: A token stat beyond an i64 reads differently than Python's int. A JSON integer between i64::MAX and u64::MAX becomes i64::MAX, an integer past u64::MAX or a number too large for the decimal parser (1e300) becomes 0, and text Python's int() accepts but Rust's integer parser does not (1_000, non-ASCII digits) becomes 0. LiteLLM keeps the exact integer.
    why: The token stats are kept as i64, which bounds the totals betterlite reports; these values are far outside a real token count, and reading them still never raises, so the fail policy and every real response are unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L223-L234
  - what: A token stat that is a number past f64's range (1e400 and larger, which the JSON parser reads as infinity) is 0. LiteLLM reads it as infinity too, and int(inf) in _safe_int raises OverflowError, which it does not catch, so the same response ends as an uncaught 500 even under fail_open.
    why: A malformed-but-200 response must not raise past the fail policy. The stat is not a real token count, and reading it defensively keeps the compressed content usable instead of failing the client over a number no real response carries.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L223-L234
  - what: A 200 response body whose data object has "$serde_json::private::Number" as its only key is read as that number, and when the value under the key is not a numeric string the body is an unexpected shape. Either way the response goes through the fail policy, where LiteLLM returns the object as the single result.
    why: serde_json's arbitrary_precision writes every non-integer number as exactly that one-key map and the parse cannot tell the map from a real object using the key, so reading it as a number keeps real float token stats working. B6031 records the same shared GuardrailValue behavior for guardrail payloads.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L796-L818
  - what: An api_key the header builder refuses (a control character such as a newline in the value) goes through the fail_open or fail_closed policy with the request-failed message. LiteLLM builds the header inside its httpx call, where the local protocol error is not one of the exceptions _call_compress catches, so the same config ends as an uncaught 500 even under fail_open.
    why: An api_key that cannot be an HTTP header value is operator config, and the request cannot be sent; a compression failure must stay inside the fail policy instead of failing past it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/compresr/compresr.py#L755-L761
