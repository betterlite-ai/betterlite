task: B3754
deviations:
  - {what: "A Cato anonymize answer with an empty redacted_chat object is read as an empty redaction list, so a string batch input is rejected with a 400 where LiteLLM returns the request unchanged.", why: "The typed answer model takes an empty redacted_chat object and one whose all_redacted_messages is absent as the same shape, and rejecting a batch Cato returned no redactions for is the safe reading of both.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L341-L346"}
  - {what: "A Cato block_action carries Cato's detection message when the answer has one, and betterlite's own wording when it does not, where LiteLLM forwards the missing message as null.", why: "Error messages are betterlite's own per rule errors-match-litellm, which keeps the 400 status and the invalid_request_error type unchanged.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L327-L338"}
  - {what: "An ssl_verify CA path or SSL_CERT_FILE that does not exist is a load error in betterlite, where LiteLLM silently falls back to the certifi bundle.", why: "betterlite reads a value of the declared type as given and reports the bad path instead of sending traffic with roots the operator did not configure.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L402-L433"}
  - {what: "Schema strings are inspected in betterlite's sorted key order, not the JSON object's insertion order, so the synthetic schema_strings messages can be ordered differently than LiteLLM's for a schema whose keys are not alphabetical.", why: "betterlite parses request bodies into BTreeMap and JSON object key order is not part of the compatibility contract; inspection and writeback share the order, so each redaction lands on the string it came from.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L234-L272"}
  - {what: "A string input whose anonymize redaction carries no content field is left unchanged in betterlite, where LiteLLM joins zero text parts and replaces the input with an empty string.", why: "Emptying the caller's prompt is lost data no working setup can rely on; the original input stays, since Cato named no replacement.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/_content_utils.py#L258-L265"}
  - {what: "A Cato analyze answer larger than 1 MiB is refused with a 502 before it is parsed, where LiteLLM reads and parses whatever size the provider sends.", why: "Rule bounded-inputs caps every outbound reply read, and a real analyze answer stays far below 1 MiB, so the cap bounds memory for a hostile or broken Cato without refusing a working one.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L302-L309"}
