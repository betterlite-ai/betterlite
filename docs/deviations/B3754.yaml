task: B3754
deviations:
  - {what: "A Cato block_action carries Cato's detection message when the answer has one, and betterlite's own wording when it does not, where LiteLLM forwards the missing message as null.", why: "Error messages are betterlite's own per rule errors-match-litellm, which keeps the 400 status and the invalid_request_error type unchanged.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L327-L338"}
  - {what: "An ssl_verify CA path or SSL_CERT_FILE that does not exist is a load error in betterlite, where LiteLLM silently falls back to the certifi bundle.", why: "betterlite reads a value of the declared type as given and reports the bad path instead of sending traffic with roots the operator did not configure.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L402-L433"}
  - {what: "Schema strings are inspected in betterlite's sorted key order, not the JSON object's insertion order, so the synthetic schema_strings messages can be ordered differently than LiteLLM's for a schema whose keys are not alphabetical.", why: "betterlite parses request bodies into BTreeMap and JSON object key order is not part of the compatibility contract; inspection and writeback share the order, so each redaction lands on the string it came from.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/cato_networks/cato_networks.py#L234-L272"}
