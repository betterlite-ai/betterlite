task: B8061
deviations:
- {what: "get_model_cost_map and refetch_model_cost_map refuse a non-default client, sleep or rng", why: "A Python object cannot drive the Rust fetch, and ignoring it would send a request past a caller's own client or proxy", link: ""}
- {what: "get_model_info.cache_info() counts native lookups instead of an lru_cache", why: "Rust caches nothing the way functools does, and the counter only keeps the attribute present", link: ""}
- {what: "This task ships no helper oracle cases", why: "The pytest file compares both packages side by side, and the lookup cases belong to B205 and B193", link: ""}
- {what: "get_max_tokens raises ModelNotMappedError with LiteLLM's exact text where LiteLLM raises a bare Exception", why: "betterlite maps the model-not-mapped family to one exception type while keeping the message byte for byte", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L5493-L5498"}
- {what: "get_model_info returns a null supported_openai_params for every non-OpenAI provider", why: "Provider-specific parameter lists are B5361 and B175; this task carries the OpenAI list from the catalog", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L6408-L6503"}
- {what: "adopt_model_cost_map skips add_known_models and reapply_runtime_model_cost_registrations", why: "Both belong to register_model in B5365; until it lands the adopted map is the whole native catalog", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L556-L567"}
- {what: "get_model_cost_map makes one attempt and falls back, with no background retry thread after a 429", why: "The retry service and its thread are B194 and B257; refetch_model_cost_map owns the retrying path here", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L643-L670"}
- {what: "get_model_cost_map does not force the local map for a lite or litellm-proxy CLI process", why: "CLI process detection is part of B194's loader, and mark_litellm_import_complete is B157", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_model_cost_map.py#L46-L56"}
- {what: "A synced model_cost entry with litellm_provider openai gets the OpenAI parameter list even when a plain assignment left the model out of LiteLLM's import-time provider sets", why: "betterlite syncs plain model_cost assignments and register_model through one path, so it reads the provider from the entry; LiteLLM's get_supported_openai_params infers the provider from get_llm_provider, whose sets register_model updates but a plain dict assignment does not, and returns None for that id", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_supported_openai_params.py#L36-L40"}
