task: B315
deviations:
  - what: At route time the strategy arm ranks over an empty sample map, so every deployment enters the selection unseen with one zero latency sample and no current-minute counters, and the buffer then keeps every deployment whose score is at most the lowest. The pinned handler reads the stored "{model_group}_map" from its DualCache and ranks over what the callbacks recorded.
    why: StrategyContext and RouteServices carry no latency-observation handle, and wiring one in means a new field on StrategyContext or context.rs, which this task does not own. LatencyRouting takes its samples as a parameter, so the integration is a constructor argument away once the route holds B389's observations. The arm still applies the configured tpm/rpm limits through the same service; latency_routing_arm_picks_from_the_pool and latency_routing_arm_skips_a_rate_limited_deployment pin the answer.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L500-L523
  - what: The arm takes the request's input-token estimate from the route's B365 request facts and counts zero when the request has no estimate. The pinned selector runs token_counter(messages=messages, text=input) itself and counts zero when that raises.
    why: B365 owns request token counting in betterlite, and a second counter inside the selector would use a different tokenizer configuration from the one that admitted the request and count the same text twice. The probe passes the count the case declares, so the oracle compares the two selectors on one estimate.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L406-L409
  - what: A buffer that leaves no score at or below lowest + lowest * buffer, which takes a negative or NaN lowest_latency_buffer, answers no deployment, and the pipeline's no-deployment error reports it. The pinned selector calls random.choice on the empty list and lets IndexError escape _get_available_deployments.
    why: An IndexError is a crash in the routing path, not a routing answer, and docs/compatibility.md keeps the pinned config types without Python truthiness, so a buffer the case declares is used as given. The valid set is what the selection reads either way; betterlite reports the empty set through the pipeline's own no-deployment error instead of raising. latency_routing_boundaries pins the negative buffer through negative_buffer_keeps_nothing and latency_routing_rank_math_boundaries.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L490-L493
  - what: The ranked order is the healthy pool's own order, so deployments with equal scores keep their pool positions. The pinned selector first permutes the whole stored map with random.sample and then keeps that permuted order for equal scores.
    why: The pick is uniform over the same buffered set on both sides, so the choice distribution is unchanged; only which buffered deployment a given injected draw lands on differs, and the draw itself is the injected input the task compares by set rather than by sequence. The oracle cases compare the eligible set and exact scores.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L411-L415
  - what: The arm answers the selection index only, so it does not copy the per-deployment score map into the request metadata. The pinned handler writes _latency_per_deployment into the request's metadata field after a successful pick.
    why: StrategyContext and RouteServices carry no request metadata store and context.rs is not in this task's scope, so the arm has nowhere to write it. The scores are exact and exposed on Ranking, which the probe reports and the behavior table asserts case by case.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L495-L497
  - what: The current-minute bucket is one UTC wall-clock read formatted as %Y-%m-%d-%H-%M. The pinned selector calls datetime.now() three times, so its label follows the host's local time zone, and a selection that crosses a minute boundary between the calls can mix two minutes' parts.
    why: betterlite's clocks are UTC everywhere else and the router carries no local time zone setting. The oracle probe patches the module's datetime with the case's instant on both sides, so the two agree there; a host outside UTC buckets its minute counters differently from LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_strategy/lowest_latency.py#L388-L390
