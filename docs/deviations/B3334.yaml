task: B3334
deviations:
  - {what: "The sync list handler called from inside a running async runtime returns the typed RunningRuntime error with status 500 and message \"video list sync handler cannot run inside a running runtime\"; LiteLLM's asyncio.run raises a plain RuntimeError from its event-loop check, which nothing converts.", why: "Rust has no equivalent exception, and blocking the caller's runtime on the same thread would deadlock; a typed error names the condition and gives the failure a status.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L8429-L8442"}
  - {what: "A supplied client is chosen by its Rust type: the sync handlers use a VideoClient::Sync and the async handlers a VideoClient::Asynchronous, and a client of the other kind counts as not supplied. LiteLLM tests isinstance against HTTPHandler and AsyncHTTPHandler.", why: "Rust clients are typed, so the type match is the same check with the same outcome.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L7590-L7593"}
  - {what: "A list GET answered with status 400 or more becomes the provider's error class with that status, the response headers and the body text. LiteLLM's HTTPHandler.get never calls raise_for_status, so the same answer reaches transform_video_list_response, which for OpenAI returns the error JSON as the page.", why: "LiteLLM would return a provider error page to the caller as a 200 video list, which no working setup can rely on; the task's contract turns any send failure into the provider's error class.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L713-L746"}
  - {what: "A failure inside transform_video_remix_response or transform_video_list_response becomes the provider's error class with the answered response's status, headers and body text. LiteLLM catches the same exception in the handler, and _handle_error gives it a synthesized 500, because a decode or validation error carries no status, headers or response.", why: "The failing answer is what the caller needs to see: its status, headers and body travel into the error instead of a synthesized 500 whose text is only the local parse failure.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L7647-L7651"}
  - {what: "The async timeout message renders the timeout and the elapsed time from Duration values, so a whole-second timeout prints as an integer and the elapsed time as seconds plus zero-padded milliseconds (time taken=0.100). LiteLLM interpolates Python floats, so 2.0 prints as 2.0 and a hundred milliseconds as 0.1.", why: "The message still reports the timeout the caller passed and the time the failed request took; only the float rendering differs, since betterlite keeps durations typed.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866"}
kept_bugs:
  - what: The sync list handler drops the api_key argument before running the async handler, so validate_environment never sees it and the provider config falls back to its own env lookup.
    why: A caller passing an api_key to the sync list call gets the provider's environment key instead; the list call site at the pin never passes one, and honoring it would change the credential a working setup sends.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L8429-L8443
  - what: The sync list handler forwards the supplied client, but the async handler ignores one of the other mode, so a sync client is never used by the list handler.
    why: A caller handing a sync client to the list call gets the pooled async client; depending on the supplied sync client working would break if the handler chose it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L8445-L8470
  - what: The list handlers accept a timeout and never put it on the GET, so the request runs on the selected client's own timeout whatever the caller asked for.
    why: The only list call site passes a default timeout on every call; honoring it would time out list calls LiteLLM lets run.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L8508-L8515
