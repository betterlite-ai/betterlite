task: B1106
deviations:
  - what: An os.environ/ reference at the top of a default_team_settings entry that names no set variable stays as written in the team's callback variables; LiteLLM's _get_team_config turns it into None, and add_team_based_callbacks_from_config then sends the text "None" to the callback as the credential.
    why: No working setup relies on a callback credential that reads "None", and keeping the reference matches what the callback_vars path already does for the same unset variable. betterlite also looks a value up once, where LiteLLM looks the resolved value up a second time as a secret name.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L5840-L5842
  - what: A metadata slot that is missing or not an object when the principal facts or the key-level controls are written becomes an object; LiteLLM raises KeyError or TypeError there and the request fails with a 500.
    why: A 500 from an unhandled exception is never something a setup relies on, and the request path always fills the slot first anyway.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L1664
  - what: A user_api_key_auth_metadata entry that is present but not an object is replaced by the admin metadata; LiteLLM calls update on it and fails with AttributeError.
    why: Same 500 as above, and the request path always writes an object there before this step.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L1729-L1731
  - what: The stripped principal that MCP access checks read comes back to the caller as a typed value; LiteLLM stores the UserAPIKeyAuth object itself under metadata.user_api_key_auth in the request body.
    why: The request metadata is JSON and the principal is a typed record; the four metadata maps are stripped of callback credentials exactly as LiteLLM's model_copy strips them.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L1695-L1702
kept_bugs:
  - what: Every team callback variable value is looked up as a secret name, so a value that happens to equal a set environment variable's name is replaced by that variable's value, not only os.environ/ references.
    why: It isn't clear whether setups write bare variable names here and rely on get_secret resolving them, so the lookup is kept.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/litellm_pre_call_utils.py#L1820-L1825
