deviations:
  - what: StreamingScanKey.stream_ended and tool_calls_in_flight fields do not participate in equality comparison, only in observation logic.
    why: These flags indicate protocol state (whether the stream ended, whether tool calls are in flight) rather than scannable content; they are used by the caller but do not affect whether a scan would be redundant.
