task: B1328
deviations:
  - what: An empty private-endpoint instances list returns the "Instances are required for private endpoint" error, where LiteLLM indexes instances[0] and raises an IndexError.
    why: LiteLLM's own guard checks only for None, so the empty list crashes with a message that names nothing; betterlite reports the missing input with the error the source meant for it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_non_gemini.py#L654-L658
  - what: An empty predictions list returns the missing-prediction error in a completion and in a streaming call, where LiteLLM indexes predictions[0] and raises an IndexError that its wrapper turns into a 500 with the message "list index out of range".
    why: The empty list names no input to fix; betterlite reports the prediction the source meant to read, and keeps the 500 status a completion always has.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vertex_ai/vertex_ai_non_gemini.py#L508-L509
  - what: The prediction decoder is bounded and strict, so a body or a streamed object over four MiB, a body whose first non-whitespace byte is not "{", a stream whose first byte is not "[", and bytes after the closing "]" other than whitespace all fail with a 500 error; LiteLLM hands the same bytes to the Google SDK and parses whatever it returns.
    why: The task requires a bounded decoder so a broken or hostile response cannot make the proxy buffer without limit. A working Vertex setup sends a compact array well under the cap, so the limit only turns a hang or a memory spike into an error.
    link: ""
  - what: A streaming Vertex failure whose response body names a status keeps it, where LiteLLM answers 500. betterlite passes the whole body to LiteLLM's Vertex phrase table, so a standard permission-denied body carrying "code":403 matches the "403" phrase and answers 403; LiteLLM passes only the google exception's .message, which holds no status text, and the exception has no status_code attribute, so the status fallback never runs and APIConnectionError reports 500.
    why: A permission failure reported as a connection error hides the cause and invites retries that cannot succeed, and the rule fixes a 500 where a 4xx belongs without asking. A streaming failure that matches no phrase still becomes Vertex's 500.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/exception_mapping_utils.py#L1279-L1363
