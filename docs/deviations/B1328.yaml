deviations:
  - what: An empty private-endpoint instances list returns the "Instances are required for private endpoint" error, where LiteLLM indexes instances[0] and raises an IndexError.
    why: LiteLLM's own guard checks only for None, so the empty list crashes with a message that names nothing; betterlite reports the missing input with the error the source meant for it.
