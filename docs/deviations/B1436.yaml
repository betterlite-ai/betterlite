task: B1436
deviations:
  - what: >-
      A tool message whose content list carries a cache_control key inside a part is JSON-dumped for DeepInfra
      after betterlite's parent transform already stripped that key, while LiteLLM dumps the part as sent and then
      strips only the message-level cache_control entry.
    why: >-
      betterlite runs the shared parent request transform (B503) in one call and applies DeepInfra's tool content
      cleanup to the resulting body, so the strip happens before the dump.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepinfra/chat/transformation.py#L147-L160
  - what: >-
      A rerank score that parses as a Python float but cannot be represented exactly as a decimal (for example
      1e100) makes the whole projection fall back to the supplied response instead of returning a rounded float.
    why: >-
      The rerank records keep scores as exact decimals (B1013), so the conversion refuses the value; LiteLLM's
      float field accepts it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepinfra/rerank/transformation.py#L196-L211
  - what: >-
      When the nested error body carries a non-string detail.error value, betterlite keeps the original error
      message instead of storing the non-string value in the exception's message field.
    why: >-
      LiteLLM's BaseLLMException.message is declared str; betterlite's typed exception cannot hold a number,
      object or null, so the selection is treated as a swallowed failure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepinfra/rerank/transformation.py#L253-L270
