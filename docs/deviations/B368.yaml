task: B368
deviations:
  - what: >-
      A raise-mode upsert_deployment that fails while adding the new deployment puts the previous deployment
      back where it was in the catalog and the indexes, and the failure is returned to the caller.
    why: >-
      LiteLLM deletes the old deployment before it builds the new one and its restore step re-adds the old
      deployment at the end of the model list, so a failed update reorders the list that a working setup
      reads by position. The catalog is published as one snapshot, so a failed update leaves the earlier
      snapshot untouched.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L9995-L10021
  - what: >-
      A set_model_list that fails on one entry publishes nothing: the earlier catalog stays as it was.
    why: >-
      LiteLLM clears the model list, the indexes and the pattern routers first and then adds the entries one
      by one, so an invalid entry leaves a half-built router that serves a partial model list. Building the
      new catalog aside and publishing it on success gives every reader either the old or the new list.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L9519-L9609
  - what: >-
      When restoring the previous deployment after a failed upsert itself fails, the original catalog is kept
      and the original error is returned.
    why: >-
      LiteLLM lets the restore error replace the upsert error and leaves the deployment missing from the
      list. Keeping the earlier snapshot loses nothing and reports the error that started the failure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L9995-L10021
