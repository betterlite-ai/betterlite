task: B5362
deviations:
  - what: Provider mapping goes through the `OptionalParamsMapper` trait where LiteLLM calls a config object.
    why: Provider crates depend on betterlite-context, so this crate can't name their types.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L3573-L3590
  - what: The ollama function-calling fallback returns `add_function_to_prompt` to the caller instead of setting `litellm.add_function_to_prompt`.
    why: LiteLLM writes a process-wide flag from inside a request, so one request changes the behavior of every later one.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L4411-L4431
  - what: The merged `extra_body` is rejected above 1 MiB or 100 levels deep, and the error is a 400.
    why: LiteLLM's `_ensure_extra_body_is_safe` has no size or depth limit, so a request can make the gateway copy an unbounded structure.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_request_utils.py#L109
  - what: When several params are unsupported, the error names the first one in key order, which is sorted, where LiteLLM names the first one in the order the caller passed them.
    why: Params are a sorted map, so the caller's insertion order is not kept. The status is the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L3550-L3560
