task: B758
deviations:
  - what: "The refusal names betterlite, calls an unknown config path \"your config file\", and tells the user to start betterlite again; LiteLLM says \"LiteLLM proxy\", \"your config\" and \"Start the proxy again\". The raised error reads \"betterlite refused to start: <headline>\", where LiteLLM raises an UnsafeMasterKeyError pointing at the printed fix. The guarded verdicts, refusal categories, source reporting, step order, announcement and refusal outcome are identical."
    why: The task keeps LiteLLM's refusal behavior but gives betterlite its own wording, so a user reading the fix sees the product they run.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/master_key_boot_check.py#L146-L153
  - what: A failed announcement is returned as BootError::Announce with the write error as its source, while LiteLLM registers the stderr write as an atexit handler, so the write happens after enforcement and nothing reports its failure to the caller.
    why: betterlite's enforcement returns a typed result, so a fix that could not be printed is reported instead of being lost.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/auth/master_key_boot_check.py#L136-L143
