task: B3653
deviations:
  - what: >-
      Costs stay exact decimals, so a billed duration times a rate keeps its decimal digits even where the same
      float product needs more: three billed seconds at 0.00008 a second cost 0.00024 here, and LiteLLM's float
      arithmetic reports 0.00024000000000000003.
    why: the project's money rule keeps prices in Decimal from ingestion to logging. Oracle cases use rates and
      durations whose float product is exact, so both sides agree there.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/cost_calculation.py#L64-L89
  - what: >-
      A billed duration or a cost sum outside Decimal's range is a typed error or no cost: a Deepgram listen whose
      audio seconds times channels overflow fails with an overflow error, and a cost whose sum overflows leaves the
      spend row without a cost, while LiteLLM's floats turn both into infinity.
    why: betterlite cannot represent a magnitude outside Decimal's range, and an infinite cost in the spend row
      would be a value no money column can hold.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/deepgram_listen_passthrough_logging_handler.py#L69-L73
  - what: >-
      A Fal cost beyond Decimal's range is a typed pricing error, where LiteLLM multiplies Python floats and
      returns an infinite cost for the same catalog entry and image count.
    why: the image price and the requested count are exact here, so their product either fits Decimal or fails as
      a named pricing error.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/fal_ai/cost_calculator.py#L166-L173
  - what: >-
      The pass-through response is carried as JSON that includes _hidden_params with the billed duration and the
      cost, where LiteLLM keeps a TranscriptionResponse or ImageResponse whose _hidden_params is a private
      attribute that a model dump leaves out.
    why: the logging pipeline here carries responses as JSON, and both the cost calculator and the spend logger
      read those two fields, exactly as the source reads its hidden params. A log row that dumps the result shows
      the hidden params.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/deepgram_listen_passthrough_logging_handler.py#L70-L73
  - what: >-
      A per-second rate stored as a string is read as its number here, and a string that is not a number prices at
      zero, where LiteLLM multiplies the string by the duration, raises a TypeError and treats the entry as
      unpriced.
    why: the catalog reader coerces a scalar it cannot read as a number to zero, and reads a numeric string as its
      value, the same rules the token cost leaves follow, so a stringly typed rate still prices.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/cost_calculation.py#L78-L87
  - what: >-
      A registry entry that cannot be priced makes completion_cost return a typed error, which the handler logs at
      debug and turns into no cost, where LiteLLM's completion_cost raises and the handler catches the exception and
      logs it at debug. Either way the spend row keeps its model and provider with a null cost.
    why: completion_cost here returns Result instead of raising, so the handler matches the error and keeps the
      spend row the way the source's except clause does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/llm_provider_handlers/deepgram_listen_passthrough_logging_handler.py#L25-L35
  - what: >-
      An upstream listen URL that does not parse is a typed target error here, where LiteLLM reads every query
      parameter out of any string and logs the session under the default model with a null cost.
    why: the listen metadata helpers here need a parsed target before they can name the requested model or the
      declared channels, so the handler reports the target it cannot read instead of guessing a model; the proxy
      only hands the handler a URL it routed.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/deepgram/common_utils.py#L64-L66
