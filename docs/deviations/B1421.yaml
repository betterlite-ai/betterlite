task: B1421
deviations:
  - what: >-
      A Voyage rerank reply that is not a JSON object, whose data is missing, null or
      not a list, whose data entry is not an object, lacks an index or relevance_score,
      or carries an index, relevance_score or usage.total_tokens that pydantic rejects,
      or whose usage is not an object, or whose id is not a string, fails with a typed
      bad-gateway error instead of LiteLLM's uncaught AttributeError, ValueError,
      KeyError, TypeError or pydantic ValidationError, which the proxy answers as a 500.
      A wrong-typed value pydantic would coerce instead, such as the string index "0",
      the score "0.5" or the token count "7", is rejected too, per docs/compatibility.md.
    why: >-
      A malformed provider reply is not the caller's input, so a 502 names the gateway
      side; no working LiteLLM setup depends on a 500 from its own KeyError or on pydantic
      coercing a text field its provider should not have sent.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/voyage/rerank/transformation.py#L112-L125
  - what: >-
      A multimodal content value that is truthy but not a list, or a content item that
      is not an object, fails with a request error that names the content field instead
      of LiteLLM's uncaught TypeError or AttributeError, which the proxy answers as a 500.
    why: >-
      The declared content type is a list of objects, so a differently shaped value is a
      caller error and gets a 4xx that names the field.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/voyage/embedding/transformation_multimodal.py#L101-L127
  - what: >-
      A rerank document comes back exactly as the provider sent it: an object keeps every
      key, and a value that is neither a string nor an object (null, a number, a list) is
      passed through. LiteLLM assigns the value to RerankResponse, whose pydantic model
      keeps only the declared text key and raises a ValidationError for a non-object or
      for an object without a string text value, which the proxy answers as a 500.
    why: >-
      The caller supplied those fields in the request documents, so dropping them would
      lose data, and a non-object document is not a shape a working setup relies on a 500
      for.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/voyage/rerank/transformation.py#L116-L133
