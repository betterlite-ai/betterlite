task: B8311
deviations:
  - what: The openrouter and vercel_ai_gateway cases drive the arms through the b8311 helper operation instead of POSTing to the booted proxy.
    why: No route reaches these arms yet. The dispatch table is B2230's chat selection and B5360's media and resource selection, and the provider adapter maps a fixed provider set before a request gets this far; a proxy request for one of these models never reaches gateway_provider_dispatch. The helper runs the real dispatch functions on one side and litellm.completion or litellm.embedding against a mock upstream on the other, which is the only seam available until the route wiring lands.
    link: ""
  - what: After a successful openrouter or vercel_ai_gateway call the post_call record holds a null original_response and no api key.
    why: LiteLLM passes the response object and openai.api_key, the OpenAI SDK's module global; betterlite's post_call record has no response field at this seam and no module-level key to read, and the task's own deviations list the missing key for the same reason. The call still logs openrouter and vercel_ai_gateway post_call only after a successful call, as LiteLLM does.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/main.py#L3516
  - what: The class config's extra_body key is exercised by Rust unit tests only, not by an oracle case.
    why: OpenAIGPTConfig declares eleven constructor parameters and no extra_body, and BaseConfig.get_config returns class attributes, so the only way to plant an extra_body class config in LiteLLM is an untyped assignment on the class. The extra-body-merge case instead proves the request-side extra_body flattening and that declared config keys never overwrite a request value; the config-side merge, which lets the config win on a key collision, is proven by the_class_config_updates_an_existing_extra_body_key_by_key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/openai/chat/gpt_transformation.py#L118-L137
  - what: The cases compare the resolved URL, the authorization and referer headers and the request body fields other than model and messages; they do not compare reply bodies or failures, and the embedding cases compare only the resolved URL and headers.
    why: The body transform, the reply transforms and the HTTP client belong to B5830, B5835, B6080, B6100 and the shared handlers; the arms only resolve the values they hand those handlers. Reply ids are random and token usage comes from each side's tokenizer. The helper's params view also applies the handler's own steps to the recorded params (flattening extra_body, adding OpenRouter's usage include and the stream flag) so that the same body fields are compared on both sides.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L637-L686
kept_bugs:
  - what: VERCEL_AI_GATEWAY_API_BASE and the public default fill the base before the arm runs, so litellm.api_base never selects the Vercel base for a public chat or embedding call, and the arm's own litellm.api_base branch cannot be reached.
    why: get_llm_provider resolves the Vercel base through VercelAIGatewayConfig._get_openai_compatible_provider_info and always returns a non-empty base, which main.py then hands to the arm. Deployments that set VERCEL_AI_GATEWAY_API_BASE or rely on the public default depend on it winning over the global.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/get_llm_provider_logic.py#L882-L886
  - what: VERCEL_AI_GATEWAY_API_KEY and VERCEL_OIDC_TOKEN beat litellm.api_key for Vercel calls, and VERCEL_OIDC_TOKEN also authenticates chat even though the chat arm's own key chain stops at VERCEL_AI_GATEWAY_API_KEY.
    why: get_llm_provider resolves the Vercel key from the environment, VERCEL_OIDC_TOKEN included, and main.py assigns it to api_key before the arm runs. Deployments on Vercel rely on the OIDC token being picked up for every operation.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/vercel_ai_gateway/chat/transformation.py#L33-L38
