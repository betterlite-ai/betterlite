task: B123
deviations:
  - what: The document is built from typed route entries (`RouteDoc`) rather than from route handlers, so request and response schemas of ordinary routes appear only when the route entry carries them.
    why: axum has no route introspection and there are no pydantic models to derive schemas from. FastAPI's output for every management route cannot be reproduced mechanically; B8681 supplies the entries.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1815-L1821
  - what: Operations list only the 200 response, plus the ErrorResponse statuses when the route asks for them. FastAPI also adds a 422 Validation Error response and an HTTPValidationError component for routes with parameters or a body.
    why: betterlite has no pydantic request validation, so a 422 generated by the framework has no counterpart in the served document.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1815-L1821
  - what: The `openapi` field is "3.1.0" and the document has no lazy-feature stub paths, no `/lazy/warm` tag stubs and no `lazy` snapshot fragments.
    why: LiteLLM registers some routers on first use and shows placeholders until then. betterlite registers every route at startup, so `/openapi.json` always lists the real routes; the committed `_lazy_openapi_snapshot.json` and its generator have no purpose here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1835-L1838
  - what: Operation ids of multi-method routes are built from an explicit single method per `RouteDoc`, so they never depend on set iteration order.
    why: LiteLLM needs `_stabilize_multi_method_route_ids` and `_normalize_operation_ids` because FastAPI derives the id suffix from a Python set; betterlite has no set to order.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1648-L1653
  - what: The enterprise-only `DOCS_FILTERED` branch (`custom_openapi`) and the `DOCS_TITLE` and `DOCS_DESCRIPTION` overrides are not built.
    why: They run only when `premium_user` is true, an enterprise license check betterlite does not have; the open-source path is `get_openapi_schema`.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/proxy_server.py#L1849-L1860
  - what: The served `/openapi.json` is the built document in insertion order as compact JSON; only the committed snapshot file is key-sorted and indented.
    why: LiteLLM's route answer is FastAPI's JSONResponse and its snapshot file is a different artifact with a different format; each keeps its own.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/_lazy_openapi_snapshot.py#L168
