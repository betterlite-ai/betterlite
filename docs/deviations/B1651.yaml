task: B1651
deviations:
  - what: >-
      Quote amounts and rates are Decimal-backed JSON numbers, so binary-float rounding tails can
      differ from LiteLLM's estimates.
    why: >-
      Estimates must report the same exact-money result as betterlite's actual billing service.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/cost_tracking_settings.py#L163-L173
  - what: >-
      A config model_list entry cannot declare the deployment fields the quote resolves from a
      router row: per-token prices (litellm_params.input_cost_per_token, output_cost_per_token,
      cache_read_input_token_cost, cache_creation_input_token_cost) and base models
      (model_info.base_model, litellm_params.base_model) all count as unsupported config keys, so
      such a config does not start. LiteLLM loads it, and its quote prices and resolves the
      deployment with those values.
    why: >-
      The config crate's model_list parameter and model_info views are owned by the deployment-config
      tasks and are not in this task's scope. The endpoint itself reads every one of these fields
      whenever the router rows carry them, and the helper oracle cases prove input, output,
      cache-read and cache-write collection, deployment precedence over model_info, the backend and
      input-rate fallbacks, and base-model precedence over the deployment's model.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/management_endpoints/cost_tracking_settings.py#L59-L140
  - what: >-
      A request body that is not UTF-8 or not JSON answers a json_invalid issue whose loc is
      ["body"]; FastAPI appends the byte offset where decoding stopped, so its loc has two elements.
    why: >-
      serde_json reports no byte position in its syntax error, and the location list keeps the same
      type and message. Error messages are betterlite's own per docs/compatibility.md.
    link: ""
kept_bugs: []
