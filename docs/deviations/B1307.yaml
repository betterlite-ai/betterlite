task: B1307
deviations:
  - what: >-
      A DEFAULT_MAX_RECURSE_DEPTH above 500 is clamped to 500 by the vertex_schema_shaping
      section, where LiteLLM keeps any integer it is given.
    why: >-
      betterlite runs every schema pass as native recursion on the worker thread's stack, so an
      arbitrary configured limit would let one deeply nested schema grow past that stack and abort
      the process; 500 levels stay inside it. LiteLLM's interpreter raises RecursionError near a
      thousand frames on the same input, so no working setup uses a limit above that ceiling.
    link: >-
      https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L85
