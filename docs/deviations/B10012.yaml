task: B10012
deviations:
  - what: >-
      get_all_agents_from_db returns typed AgentResponse values instead of the dicts LiteLLM's
      Prisma find_many produces, and the nested object permission is the typed
      AgentObjectPermission with its six fields, so the permission's other columns
      (vector_stores, blocked_tools, agent_access_groups, search_tools, mcp_tool_search_enabled,
      skills) do not reach the response JSON.
    why: >-
      LiteLLM's dicts are read only by the registry reload, which validates them into AgentResponse;
      typed values replace that round trip. B4770's AgentObjectPermission fixes the six fields, and
      AgentResponse.object_permission is that type.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/agent_registry.py#L893-L918
  - what: >-
      The codec accepts a JSON string stored in a jsonb column (litellm_params, agent_card_params,
      static_headers, kill_switch, mcp_tool_permissions) as well as an object.
    why: >-
      B4777 writes parsed jsonb values, and older rows can hold the string form; B4775's parsers
      already accept both and the response JSON is the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/agent_registry.py#L893-L918
  - what: >-
      A row that does not decode fails the whole listing with
      "Error getting agents from DB: <RowDecodeError>", where LiteLLM's listing returns the raw
      dicts and a malformed row fails later, when the registry validates the batch into
      AgentResponse. The per-column error text names the column kind, never the column value.
    why: >-
      Typed rows replace the dicts, so the failure surfaces at the read; the task requires every
      listing failure, database or decode, to carry the same prefix.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/agent_endpoints/agent_registry.py#L906-L915
  - what: >-
      A NULL required_roles or required_scopes array on an identity row decodes as an empty list.
    why: >-
      LiteLLM's AgentIdentityBinding declares both as tuples with defaults, so a row holding SQL
      NULL fails model_validate and _init_agents_in_db drops every DB agent after the exception.
      The empty list keeps the agent loadable and is the only value the stored column can mean.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/agent_identity.py#L33-L46
  - what: >-
      agent_card_params decodes into the typed AgentCard and the permission's mcp_tool_permissions
      into a map of server id to tool names, so a stored JSON value that does not fit those
      records fails the whole listing.
    why: >-
      LiteLLM's AgentResponse types agent_card_params as dict[str, Any] and object_permission as
      dict[str, object], so its registry load accepts any dict and a bad value fails only when a
      later reader uses it; betterlite's typed records cannot hold arbitrary JSON.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L314-L339
  - what: >-
      tenant_id, client_id and service_principal_id on the identity row decode as UUIDs, so a
      stored value that is not a UUID fails the listing.
    why: >-
      LiteLLM's AgentIdentityBinding declares all three as plain str and lists any value;
      betterlite's AgentIdentityBinding holds Uuid values.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/agent_identity.py#L33-L46
  - what: >-
      A spend of NaN or infinity fails the listing as an unreadable spend column.
    why: >-
      rust_decimal has no such values and JSON cannot carry them, so a LiteLLM proxy holding one
      fails when it serializes the agent; betterlite rejects the row at the read, and the test
      rejects_a_non_finite_spend proves it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/agents.py#L325
