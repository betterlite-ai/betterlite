task: B163
deviations:
  - what: >-
      The exception classes do not inherit from `openai.*` and their response and request objects are not
      `httpx.Response` and `httpx.Request`. The bases are copies in `betterlite.exceptions._openai_base` and the HTTP
      objects come from `betterlite.exceptions._http`.
    why: >-
      The wheel depends only on python-dotenv. `except openai.RateLimitError` does not catch betterlite's error, and
      `isinstance(e.response, httpx.Response)` is False. `BadRequestError` therefore accepts only betterlite's
      `Response`, not an httpx one. `_http.Request` percent-encodes spaces the way httpx's URL text does, so the vertex
      URLs read the same as LiteLLM's.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L132-L156
  - what: >-
      Six constructors take keyword arguments through a TypedDict: `BadRequestError`, `ImageFetchError`,
      `UnsupportedParamsError`, `Timeout`, `MidStreamFallbackError` and `GuardrailRaisedException`. They accept the same
      argument names, requiredness and defaults as LiteLLM, but a positional call fails and `inspect.signature` shows
      `**options`.
    why: >-
      These constructors take six to eleven arguments, past ruff's five-argument limit on hand-written signatures,
      and the generated dataclass form cannot carry per-argument defaults that differ from the base class. The
      TypedDict keeps every name and default visible, and the exports test checks its required and optional keys
      against LiteLLM's own signatures.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L219-L251
  - what: >-
      The private openai base copy annotates `request` and `response` as optional, where openai-python declares them
      non-optional. The values every constructor stores still follow LiteLLM.
    why: >-
      LiteLLM's signatures default `request` and `response` to None, and the dataclass constructors that carry those
      parameters need a field type that matches the base class for static checking. Only `__annotations__` differs.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L132-L156
  - what: >-
      Most exception constructors below the six above are generated by dataclasses from field declarations whose
      order and defaults match LiteLLM's parameter lists. `dataclasses.is_dataclass()` is True on those instances
      where LiteLLM's classes are not dataclasses.
    why: >-
      The generated constructor keeps the parameter names, order and defaults that a hand-written one cannot keep
      under ruff's five-argument limit. `eq=False` and `repr=False` keep identity equality and LiteLLM's text.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L455-L469
  - what: >-
      `MidStreamFallbackError` copies `status_code` only from the exception types betterlite ships: its own classes,
      the openai base copy, `BudgetExceededError`, `GuardrailRaisedException` and `BlockedPiiEntityError`. Any other
      exception falls back to 503.
    why: >-
      LiteLLM reads `getattr(original_exception, "status_code", None)` from any exception. A typed match names every
      class instead of duck-typing an arbitrary attribute, so a third-party exception that happens to carry a
      status_code keeps 503 here.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/exceptions.py#L1138-L1139
  - what: This task has no helper oracle cases.
    why: >-
      The pytest files import both packages and compare instances directly, and a helper adapter cannot construct
      Python exceptions.
    link: ""
