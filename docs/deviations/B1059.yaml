task: B1059
deviations:
  - what: >-
      An embeddings answer whose data record the typed EmbeddingRecord refuses is a ValidationError
      outside the "Failed to generate embedding for query: " wrap, for every refused shape. A numeric
      string vector such as ["0.5","1"] and a record without object or index therefore fail, where
      LiteLLM returns their vector.
    why: >-
      LiteLLM keeps response.data untyped and validates only data[0]["embedding"] after the try block.
      betterlite decodes the body into the typed EmbeddingResponse inside the B1058 executor, and
      EmbeddingRecord requires object, embedding and index and takes only a text or a list of numbers.
      Both live in betterlite-openai, outside this task, so embed_query can classify the refusal
      (a body-shape failure is not an execution failure) but cannot read the record the body held.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/vector_store/transformation.py#L343
  - what: >-
      An embeddings answer that lacks a top-level field the typed EmbeddingResponse requires (object,
      model or usage), or whose usage is null or lacks prompt_tokens or total_tokens, is a
      ValidationError and no vector comes back. LiteLLM returns the first vector for these bodies,
      since it reads only response.data[0]["embedding"].
    why: >-
      The typed decode inside the B1058 executor requires those fields and the body is dropped when it
      fails, so embed_query has no record to read. The decode lives in betterlite-openai, outside this
      task.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/vector_store/transformation.py#L343
  - what: >-
      A 200 answer whose body carries a meaningful error such as {"error":{"message":"x","type":"y"}}
      is handled in one of two ways. A body that also lacks a required field of the typed
      EmbeddingResponse is a ValidationError without the "Failed to generate embedding for query: "
      prefix. A body that has every required field plus the error returns its first vector. LiteLLM
      raises for both, so its caller gets a plain Exception with that prefix.
    why: >-
      The typed decode inside the B1058 executor has no error field and ignores unknown fields, so it
      drops the error value. A complete body decodes and its vector comes back as a success. When a
      required field is missing the decode fails, and the failure carries no body, so embed_query
      cannot tell an error body from the other refused shapes above. The decode lives in
      betterlite-openai, outside this task.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/vector_store/transformation.py#L342
  - what: >-
      The error-object check of the embeddings response conversion never runs in betterlite, so a
      provider error inside a 200 body does not raise.
    why: >-
      LiteLLM raises at that check inside executor.embed when the error has meaningful data. The typed
      decode in betterlite-openai, outside this task, keeps no error value to check.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/litellm_core_utils/llm_response_utils/convert_dict_to_response.py#L587
