task: B2456
deviations:
  - {what: "An SDP offer larger than the API JSON body cap is refused with a typed Sdp error before the pre-call, where LiteLLM hands the whole bytes object to decode and to the multipart body.", why: "Rule bounded-inputs caps every body from outside; LiteLLM never parses the offer, so the cap is the only limit betterlite adds, and no working realtime client sends an offer that large.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6481-L6485"}
  - {what: "A base URL or extra header that HTTP cannot carry fails with the typed RequestUrl, HeaderName or HeaderValue error before the pre-call and the send, where LiteLLM logs the pre-call and lets httpx raise inside the send, which a provider config turns into a synthesized 500 BaseLLMException.", why: "Nothing reaches the network on either side; naming the unusable base or header beats a made-up 500 that claims the provider answered. B2402 records the same departure for the shared send machinery.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6416-L6425"}
  - {what: "A reply body over the outbound transport's body limit fails with the transport's body-limit error, where LiteLLM returns whatever bytes the provider sends with no cap.", why: "ProxiedClient::send_following followed by buffered enforces TransportLimits::body_bytes on every outbound body; B1364 records the same cap for the shared transport.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6498-L6503"}
  - {what: "The litellm.Timeout message renders both durations from typed Duration values, so a whole-second timeout prints as an integer and the elapsed time as seconds plus zero-padded milliseconds, where LiteLLM interpolates Python floats.", why: "The same numbers, differing only in float rendering, since betterlite keeps durations typed; B2402 records the same departure for the async handler's timeout.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/http_handler.py#L852-L866"}
  - {what: "A response body that is not UTF-8 becomes \"{bytes} bytes that are not UTF-8\", where LiteLLM reads the body through response.text and gets replacement characters.", why: "betterlite records text as JSON and does not invent characters the provider never sent; B2402 records the same departure for the shared error conversion.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6082-L6085"}
kept_bugs:
  - {what: "The no-config fallback URLs append /v1 to the base as given (f\"{api_base.rstrip('/')}/v1/realtime/{endpoint}\" for the sessions and the same shape for calls), so a base that already ends in /v1 gets a second one and the POST targets /v1/v1/realtime/..., where the provider config's own URL methods strip the suffix.", why: "A working legacy setup passes a bare base and relies on the /v1 the handler appends; the oracle case pins the literal concatenation, and stripping the suffix would change the URL every such caller sends.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6397-L6397"}
