task: B372
deviations:
  - what: The affinity byte parser rejects inputs over 1048576 bytes before allocation.
    why: The source has no equivalent byte bound at this parser boundary; bounded-inputs requires a finite limit. Existing structural field limits remain unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/deployment_affinity_check.py#L93-L346
  - what: A 64-character caller key is kept as a hash only when every character is ASCII hex; Python's int(value, 16) also accepts a 0x prefix, a sign and underscores, so those keys are hashed here and kept as sent there.
    why: The cache key must be a stable SHA-256 hex digest; accepting a lookalike that merely parses as an integer would put the caller's raw text into a Redis key.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/deployment_affinity_check.py#L115-L122
  - what: An affinity cache key longer than 1024 bytes is refused with the route key's too-long error instead of being written to the store.
    why: betterlite stores the pin under B360's route key, whose limit is 1024 bytes, so a longer key has nowhere to go.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pre_call_checks/deployment_affinity_check.py#L233-L235
  - what: A shared pin is stored as B390's typed route value holding the pin JSON text, where LiteLLM stores the bare pin JSON, so a betterlite worker and a LiteLLM worker cannot read each other's pins from one Redis.
    why: The task builds the claim on B360's typed atomic operations, and a mixed fleet was never a supported deployment.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/affinity_cache.py#L17-L47
  - what: A shared claim that loses the compare-and-set race eight times falls back to the pod-local claim, where the Lua script is atomic and cannot lose.
    why: The typed store writes with WATCH, MULTI and EXEC instead of Lua, so a lost race needs a bound; the fallback keeps same-pod affinity instead of spinning.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/caching/affinity_cache.py#L88-L125
