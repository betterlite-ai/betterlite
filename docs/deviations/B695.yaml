task: B695
deviations:
  - {what: "An Azure image generation or edit call without a timeout uses betterlite_azure's 5-second connect phase and 600-second read, write and pool phases, where LiteLLM gives every phase its 600-second generation default or 6000-second request default.", why: "betterlite_azure's TimeoutPhases owns that mapping for both arms, and an explicit timeout maps to the same phases httpx gets.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/images/main.py#L948"}
  - {what: "An Azure image edit always sends multipart/form-data with the boundary it generated and encoded the form with, replacing any Content-Type the caller set in extra_headers. LiteLLM passes the caller's Content-Type to httpx unchanged and encodes the form with the boundary parsed from it, so a caller-pinned boundary reaches Azure on LiteLLM only.", why: "B536 builds the edit's multipart form and the dispatcher encodes it with its own boundary, so the content type it sends always matches the bytes; keeping a caller header would need httpx's boundary parser and a re-encode with the caller's value.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/custom_httpx/llm_http_handler.py#L6793"}
