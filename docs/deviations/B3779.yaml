task: B3779
deviations:
  - what: Lasso inspection primitives expose JSON values rather than LiteLLM model classes.
    why: betterlite's guardrail wire layer is serde-based and preserves the original OpenAI shape while masking.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L477-L563
  - what: Lakera detector spans are interpreted as Unicode character offsets and converted to Rust byte offsets.
    why: LiteLLM slices Python strings by characters; converting offsets preserves non-ASCII masking while keeping Rust strings valid UTF-8.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lakera_ai_v2.py#L435-L492
