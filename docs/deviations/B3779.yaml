task: B3779
deviations:
  - what: Lasso inspection primitives expose JSON values rather than LiteLLM model classes.
    why: betterlite's guardrail wire layer is serde-based and preserves the original OpenAI shape while masking.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L477-L563
  - what: Lakera detector spans are interpreted as Unicode character offsets and converted to Rust byte offsets.
    why: LiteLLM slices Python strings by characters; converting offsets preserves non-ASCII masking while keeping Rust strings valid UTF-8.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lakera_ai_v2.py#L435-L492
  - what: expand_for_classification turns tool_use and tool_result blocks into synthetic Lasso-format messages, dropping the original tool_calls array and tool_call_id; map_masked_messages_back and update_tool_calls_from_masked restore those fields from the original request rather than from Lasso's inspection copy.
    why: Lasso's API expects a flattened message list for inspection; the OpenAI structure downstream providers need is not meaningful for PII or safety analysis.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L642-L721
  - what: map_masked_messages_back disables positional text rewrite for the whole message list when the original and masked text-message counts differ, returning the original text untouched instead of guessing at an alignment.
    why: A count mismatch means Lasso dropped or synthesized messages; writing masked content at the wrong position would corrupt the request, so no rewrite is the safer fallback.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lasso/lasso.py#L477-L563
  - what: is_only_pii_violation reports true whenever every detected Lakera violation is a pii/* detector, so a caller can mask and allow the request through regardless of its on_flagged block or advisory policy.
    why: exposing raw PII to honor an advisory note or block message is strictly less safe than masking it first.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/lakera_ai_v2.py#L821-L842
