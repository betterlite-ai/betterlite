task: B3741
deviations:
  - what: The MCP session and the per-call id reach conversation-id resolution as the request data's own mcp_tool_call_metadata and litellm_call_id keys, and the lookup also accepts that metadata nested under the request metadata; betterlite's request data carries no litellm_logging_obj, and LiteLLM reads both ids from that object and only looks for headers under the metadata.
    why: The guardrail sees the metadata the logging layer already attached to the request data, and a caller that attaches it under metadata keeps its conversation grouping instead of falling back to a per-call id.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L410-L430
  - what: The token and evaluation response bodies are read with a 1 MiB bound, and a bigger body fails as a poster error; LiteLLM reads whatever length the endpoint sends.
    why: An unbounded read grows the process memory on a shared proxy, and both endpoints answer with small JSON documents.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L493-L509
  - what: A request_timeout that is negative, NaN or infinite is refused when the guardrail is constructed, where LiteLLM stores the float and fails only when httpx builds a request.
    why: The typed settings validate the value where it enters, so a bad Agent 365 config fails at startup instead of on the first tool call.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L157-L172
  - what: error and error_description are read as the string LiteLLM's type declares, and error_codes as i64 items; a non-string value falls back to its default where LiteLLM applies str(), and a code list holding a numeric string, an integral float or an item outside i64's range is empty where pydantic's int adapter coerces or accepts it.
    why: A value of the wrong type is not coerced, and the gateway-owned verdict only differs for documents no Entra deployment sends; an i64-sized integer list, the shape the endpoint sends, is unchanged.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L472-L478
  - what: An expires_in of a JSON boolean, a negative number, a numeric string Python's float() reads beyond Rust's syntax (such as an underscore separator), or a string that reads as NaN or infinity takes the 3599-second default, where LiteLLM's isinstance check reads a bool as an int and stores that numeric value or a negative or non-finite float as the lifetime; a body whose expires_in is the bare NaN or Infinity token is not JSON and fails as a malformed response, where Python's parser accepts it.
    why: The cache holds a typed Duration and a SystemTime, and no Entra deployment sends such a lifetime; every ordinary number and numeric string parses the same.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L69-L75
  - what: An expires_in past Duration's range takes the 3599-second default, and one that fits a Duration but not the system clock, such as 1e19 seconds, fails the exchange with a token-expiry error and caches nothing; LiteLLM adds the float to time.time() and caches and returns the token in both cases.
    why: The cache stores a SystemTime, which cannot hold that instant, and no Entra deployment issues a lifetime of billions of years.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L485-L491
  - what: The Agent 365 config model rejects an unknown key, where LiteLLM's pydantic model ignores extra keys.
    why: A misspelled credential key is an error that names it instead of a gateway that silently runs without its tenant, client or secret.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/proxy/guardrails/guardrail_hooks/agent_365.py#L12-L49
kept_bugs:
  - what: A 4xx token response whose body is not a JSON object is reported as a malformed response instead of a token exchange error, because LiteLLM parses the body before it inspects the status.
    why: A working setup branches on the malformed-response class for such bodies, and the classification is observable through the error the exchange raises.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/guardrails/guardrail_hooks/agent_365/agent_365.py#L465-L478
