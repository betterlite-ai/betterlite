deviations:
  - {what: "A present extra_body that is not an object is a 400 that names the field, where LiteLLM hands it to dict.update and the proxy answers 500 when that raises TypeError or ValueError.", why: "An unhandled exception is the wrong answer for input the caller can fix.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/cometapi/chat/transformation.py#L81-L84"}
  - {what: "A stream chunk or embedding reply whose declared fields hold the wrong type fails with a typed error naming the field, where LiteLLM raises a raw AttributeError, TypeError or pydantic ValidationError; an error.code outside u16, and an embedding reply over 16 MiB or with counters outside i64, are refused the same way, where LiteLLM copies any value and reads any size.", why: "betterlite decodes both replies into typed records, so a shape LiteLLM only fails on at attribute access, and a body with no bound, are refused where they are read.", link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/cometapi/embed/transformation.py#L112-L145"}
