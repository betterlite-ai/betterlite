task: B1016
deviations:
  - what: decode_managed_resource_ids rejects input over the 16 MiB JSON limit and bytes that are not UTF-8.
    why: LiteLLM reads an id that is already a Python str inside a parsed request, so it has no size cap or byte decoding step. The Rust boundary receives raw bytes and shares the B1087 limits.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/base_llm/managed_resources/utils.py#L330-L395
