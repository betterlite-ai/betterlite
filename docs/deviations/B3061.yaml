task: B3061
deviations:
  - what: "Empty-frame FOCUS export has 37 base columns while nonempty export has 44 columns including seven computed fields."
    why: "This preserves LiteLLM's early empty-frame return and nonempty projection behavior."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/transformer.py#L48-L128"
  - what: "Tags is a JSON string with null metadata omitted and {} when no metadata is available."
    why: "This preserves LiteLLM's downstream Vantage token-allocation format."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/transformer.py#L36-L38"
  - what: "CSV serialization converts Decimal columns to floating-point output."
    why: "This matches LiteLLM CSV compatibility behavior while Parquet keeps Decimal values."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/serializers/csv.py#L20-L25"
  - what: "A spend or api_requests value of 1e12 or more fails the transform with an error. Polars 1.44.2 only rejects values of 1e18 or more, so LiteLLM stores larger numbers in a Decimal(18, 6) column than the column can declare."
    why: "Decimal(18, 6) holds twelve digits before the point, and writing a value past that gives Parquet readers a decimal outside its own precision."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/transformer.py#L75-L84"
  - what: "Spend is rounded to six places from the float's shortest decimal form, half to even. Polars multiplies the float by 1e6 first, so a value sitting within one float step of a half can end on the other neighbor in the sixth place."
    why: "The workspace denies float arithmetic, so rust_decimal converts the float. Both ways give the same result on the half cases tested, such as 0.0000375 and 0.0000125."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/transformer.py#L75-L84"
  - what: "The Parquet file has the same columns, types, nulls, values and Snappy compression, but it writes no column statistics and no ARROW:schema metadata, puts every row in one row group and says created_by betterlite."
    why: "parquet2 writes plain Parquet without the Arrow layer, since the polars and arrow-rs writers pull in crates that cargo-deny rejects."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/integrations/focus/serializers/parquet.py#L13-L23"
