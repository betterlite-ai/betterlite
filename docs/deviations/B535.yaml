task: B535
deviations:
  - what: A negative AZURE_OPERATION_POLLING_TIMEOUT becomes zero seconds; LiteLLM keeps the negative integer and every pending poll times out on its first check.
    why: betterlite reads the environment string into a Duration, which cannot hold a negative value, and a negative polling timeout is outside the range a working Azure image setup configures.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/constants.py#L505
  - what: Each pause between operation polls is capped at the time left before the polling deadline, and the poll ends with the same 408 timeout once that time is spent. LiteLLM sleeps for the full retry-after and checks AZURE_OPERATION_POLLING_TIMEOUT only after the sleep.
    why: One retry-after of 86400 from Azure holds the request for a day in LiteLLM, far past the configured timeout, and no working setup relies on waiting that long. A retry-after that fits in the time left is slept in full, as in LiteLLM.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/azure/azure.py#L935
