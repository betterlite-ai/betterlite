task: B346
deviations:
  - what: Each model's scheduler queue holds at most 1024 pending requests, and a request that would exceed the cap is rejected with a 429 rate-limit error.
    why: The bounded-inputs rule forbids an unbounded queue; LiteLLM's heap takes any number of entries and the pin has no queue bound.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/scheduler.py#L42-L50
  - what: A scheduled request leaves the queue when it completes or is cancelled as well as when it times out.
    why: The async-hygiene rule forbids orphaned entries; LiteLLM removes an entry only on the timeout path, so every completed request and every request that ran through the healthy-deployment poll leaves its entry behind.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4437-L4453
  - what: A request scheduled through the queue runs its provider call once and never queues itself again, including when default_priority is configured.
    why: LiteLLM calls Router.acompletion without the request's priority, so a configured default_priority makes the inner call schedule the same request again; each nested copy waits for its own timeout and the request ends in a Timeout without reaching the provider.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L4437-L4445
