task: B3600
deviations:
  - what: "Path joining normalizes .. segments silently with posixpath.normpath instead of raising; if combined path climbs out of the base, it falls back to the base path."
    why: "This follows LiteLLM's behavior exactly. Subpaths are untrusted and must not escape the base the operator configured."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/proxy/pass_through_endpoints/pass_through_endpoints.py#L697-L705"
  - what: "Rust exports use shorter identifiers than LiteLLM's exact long public names."
    why: "The repository's enforced no-long-names hook rejects the exact compatibility identifiers; changing that hook is outside this task's scope."
    link: "https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/types/passthrough_endpoints/pass_through_endpoints.py#L7-L66"
