task: B1394
deviations:
  - what: A stored setup whose fields carry the wrong JSON type falls back to the empty setup, so the turn lowers the default audio modality and adds no limits, where LiteLLM raises an uncaught TypeError or AttributeError as an HTTP 500 for responseModalities null or a string generationConfig, and turns a responseModalities string into one modality per letter.
    why: The setup is decoded through B1378's typed model, so every decode failure takes the branch's own fallback, and docs/compatibility.md makes a wrong-typed value an error rather than a Python duck-typing accident; a setup that the session accepted decodes cleanly, so no working setup sees the difference.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/llms/gemini/realtime/transformation.py#L1374-L1387
