task: B844
deviations:
  - what: >-
      A listing, a candidate-id lookup or either get_model_ids that meets a name, team or id index
      entry pointing past the end of the model list skips that entry. LiteLLM indexes model_list at
      the stored index and raises IndexError from the same places.
    why: >-
      An index that points at no row is a damaged index, and no working setup can rely on a 500 from it.
      The single-row lookups keep the failure: get_deployment and get_deployment_by_model_group_name
      raise the typed InvalidRow with the index, which the invalid-row case compares against LiteLLM's
      error envelope, and stale_map_precondition proves the same entries fail there.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11670-L11671
  - what: >-
      The unfiltered get_model_ids lists the id map's keys in the id map's own order, and betterlite's
      id index is a sorted map, so ids inserted out of lexicographic order list sorted instead. LiteLLM
      walks model_id_to_deployment_index_map, a dict, in insertion order.
    why: >-
      The two orders differ only for ids whose insertion order is not already sorted; the
      id-order-and-team-exclusion case inserts them sorted so the oracle compares equal. The id index is
      B368's DeploymentCatalog, outside this task; giving that field an insertion-ordered map restores
      LiteLLM's order for every caller.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11468-L11474
  - what: >-
      A wildcard result takes its row from the pattern that matched, by the candidate's id and its
      position among the rows that scope registered under that id. When two different wildcard patterns
      in one router hold rows that share an id, LiteLLM's deep copy returns the row of the pattern that
      matched, and betterlite can return the other row's model_info. A unique id, or duplicate ids under
      one pattern or in different scopes, resolves to the same row LiteLLM returns.
    why: >-
      The pattern catalog keeps a candidate's model id and provider model only (B367's Candidate), so the
      row identity is gone before this module sees it, and resolving through the id map alone returned
      whichever row that map last indexed, a team row leaking into a global wildcard result. Recovering
      the identity exactly needs Candidate to carry the deployment's row index, a change in B367's
      wildcard_catalog, which is outside this task. duplicate_wildcard_id pins a global wildcard row
      against a later team row that shares its id, duplicate_pattern_row pins two rows of one pattern
      that share an id, and pattern_row_by_id pins that a candidate reads the row with its own id.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router_utils/pattern_match_deployments.py#L113-L123
  - what: >-
      The early-resolve step of get_candidate_model_ids_for_route models only a deployment sequence.
      The mapping form, the default_deployment singleton, is not built.
    why: >-
      default_deployment is None for the whole life of a router at the pin: its assignment in __init__
      is None and the only other one, in _add_deployment, is commented out, so no configured setup
      reaches the mapping arm. B302's CatalogResolver answers candidate ids over a CandidateView and keeps
      its wildcard_pool and early_resolve private, so this module resolves patterns itself; reusing that
      resolver needs B302 to expose a read-only entry that keeps the deployment row, an owner change outside
      this task. B302 owns _try_early_resolve_deployments_for_model_not_in_names and would add the mapping
      form if the field ever gains a writer.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L12681-L12686
  - what: >-
      _deployment_ids collects text, number and bool ids as Python str() spells them, so 42 becomes
      "42" and true becomes "True", and drops an id that is a list or an object. LiteLLM includes the
      str() of those too, which is a Python repr such as "['x']".
    why: >-
      docs/compatibility.md keeps output standard JSON and leaves Python repr text out. An id of either
      shape cannot pass LiteLLM's ModelInfo validation, so only a model_info mutated after construction
      reaches the difference.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11506-L11513
  - what: >-
      A wildcard candidate whose model id no row in the model list carries fails with the typed
      UnindexedCandidate. LiteLLM's pattern map holds deep copies of the registered deployments, so its
      lookup cannot reach a missing row and has no answer to compare.
    why: >-
      betterlite keeps the candidate's id in B367's pattern catalog and resolves it back to the row, so a
      row whose id was removed after registration leaves a candidate with no row. The typed error refuses
      to return some other deployment, and unindexed_candidate proves the error.
    link: ""
kept_bugs:
  - what: >-
      _build_model_id_to_deployment_index_map empties model_list and both caches but leaves the name and
      id indices as they were, so a rebuild whose caller did not clear them first keeps stale entries.
      betterlite keeps that precondition: rebuild_ids clears the row list and the caches only.
    why: >-
      The task text orders preserving the precondition and the partial rebuild on failure. A stale entry
      that survives then fails in get_deployment with the typed InvalidRow, the failure the invalid-row
      case compares, and stale_map_precondition pins it.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11424-L11426
  - what: >-
      get_model_list_from_model_alias reads a mapping alias item's hidden before its model, so an item
      missing both fails on hidden and an item whose model is not text is skipped when hidden is true
      before model is read. betterlite copies the order and names the missing field in its own error.
    why: >-
      RouterModelGroupAliasItem declares hidden and model as required keys, so a config-built alias
      always carries hidden, and a hand-built mapping fails in the same place LiteLLM fails. The
      malformed-alias-error case compares the failure and hidden-alias-direct covers the skip.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/router.py#L11870-L11874
