task: B3361
deviations:
  - what: >-
      get_provider_container_config names the provider (ContainerProviderConfig::OpenAi or
      ContainerProviderConfig::Azure) instead of returning an OpenAIContainerConfig or
      AzureContainerConfig instance, and get_optional_params_container_create reads the supported
      parameter list and the OpenAI identity mapping from that name.
    why: >-
      The concrete config objects carry credentials, the logging globals and a container cost source
      that this core layer doesn't hold; the caller that has them builds the config from the name,
      as B522's OpenAI config and B547's Azure config do.
    link: https://github.com/BerriAI/litellm/blob/d665dc1a6315847fcad6cc2c1264ceb47c06abce/litellm/utils.py#L9727-L9743
